content_shape_note: >-
  Recorded for the downstream reader, not as an extraction conclusion. The full treatment of
  random encounters: why they exist, how often to check by danger level, three tables for
  starting distance, current activity and attitude, and a note on treasure. This is the page
  the Game Master chapter pointed forward to for the Reaction Check.

expected_extraction_hazard: >-
  Flagged at claim for the extracting Analyst. The restatement hazard is the highest of any
  packet so far, because this page gathers cadence rules whose per-context rows are already
  canonical from four other pages. rule_crawling_round FEEDS_INTO rule_encounter on check
  cadence exists from printed page 84, rule_danger_level FEEDS_INTO rule_encounter on check
  cadence from 86, and rule_overland_travel FEEDS_INTO rule_encounter on overland cadence from
  90. Re-asserting any of them would collide exactly. rule_encounter already carries six rows
  from pages 82, 83, 84, 86 and 90 and none of them cites this page.
  The page does carry an explicit pointer to printed page 90, which is a CROSS_REFERENCES
  candidate rather than a reason to restate the cadence.
  This page supplies the Reaction Check that PKT-SD-101-109 recorded as an unassertable
  forward reference, so a new identity is expected here.
  No monster, creature, treasure or noise identity exists, and several statements depend on
  one. Every interval, die face, percentage and table threshold is a magnitude no field may
  store.

