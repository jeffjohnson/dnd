  Present and large, and entirely out of scope. The AST resolves it to printed pages 44 through 53 and 82 through 86, none of which is inside this packet's declared span. It reproduces the casting rules, the mishap tables, spell attributes, both spell lists, and gameplay material. Those pages define the very attributes each spell entry here carries, tier, duration and range, which makes them tempting to read as evidence. They are orientation only; printed pages 43 to 50 are claimed by PKT-SD-043-050 and the spell lists by PKT-SD-051-053.

