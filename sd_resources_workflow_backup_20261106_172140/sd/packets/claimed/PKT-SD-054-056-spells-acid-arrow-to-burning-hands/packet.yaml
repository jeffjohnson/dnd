  Recorded for the downstream reader, not as an extraction conclusion. Ten complete spell entries in alphabetical order. Each carries four attributes, a tier, a class or classes, a duration and a range, followed by prose describing the effect. Each entry is its own defining locus under SOURCE_MARKDOWN Source Identity Authority.

