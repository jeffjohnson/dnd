content_shape_note: >-
  Recorded for the downstream reader, not as an extraction conclusion. The experience economy
  in one page: what earns XP, four treasure quality tiers with values, five listed sources, a
  gold guideline scaled by party level, and a closing table. This is the treasure page that
  three earlier packets pointed forward to.

expected_extraction_hazard: >-
  Flagged at claim for the extracting Analyst. This page is the defining locus for treasure,
  which PKT-SD-101-109 and PKT-SD-091-093 both pointed at and could not assert, so a treasure
  identity is expected here.
  The XP reset sentence restates exp_level MODIFIES exp_xp on total reset, already canonical
  from printed page 39, and would collide.
  The four quality categories are bolded and named but each carries only an experience value,
  which is the danger-levels shape declined in PKT-SD-090-090; the spell tiers are not a
  counter-precedent, since those were Decision-authorised and each carries classification
  relations.
  Of the five SOURCES OF XP bullets only two have existing identities. One row per bullet is
  the default, not a requirement to invent an endpoint.
  Each PC gaining the full value of each treasure is an unhedged and consequential rule with
  no representable source or target.
  Almost every other statement on the page is a number.

