content_shape_note: >-
  Recorded for the downstream reader, not as an extraction conclusion. This is the largest and most
  load-bearing packet claimed so far. It is the defining locus for armor class, for gear slots and
  carrying capacity, for the individual items of adventuring gear, for the five armors, and for the
  fifteen weapons and their five named properties. Four already-published GURs deferred weapon and
  armor identities to exactly these pages: the priest, thief and wizard class entries each name
  permitted weapons, and all four class entries state permitted armor. Those deferrals are recorded
  in each of those GURs and are expected to be paid back from here.

