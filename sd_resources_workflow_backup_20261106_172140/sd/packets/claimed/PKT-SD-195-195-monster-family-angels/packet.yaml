content_shape_note: >-
  Recorded for the downstream reader, not as an extraction conclusion. Measured from the AST: 5
  headings, 16 paragraphs, no table, all on one printed page. This is the first family-grouped
  packet: a shared introduction precedes four separate stat blocks rather than one heading per
