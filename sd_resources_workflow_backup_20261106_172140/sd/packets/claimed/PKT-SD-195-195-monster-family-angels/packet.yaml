  stat-block values.

expected_extraction_hazard: >-
  Flagged at claim for the extracting Analyst. The governing test is the one settled at
  PKT-SD-194-194: a stat-block description is excluded by constitution 2.5 regardless of what it
  references, unless it is stated once in a shared locus about a whole class of creatures. Apply
  it to six named abilities across four creatures, not once to the page as a whole.
  The family introduction names a rank hierarchy, seraphim below domini below principi below
  archangels. This is the same shape as the combat-role taxonomy at printed page 192 and should
  receive the same disposition unless the source states a mechanical consequence of rank rather
  than only naming it.
  One ability explicitly targets an existing canonical identity: a seraph's Bless gives a luck
  token, and rule_luck_token is canonical with encounter-table precedent for exactly this
  direction. Test it against the locus rule rather than against whether the target identity
  exists; the tomb and desert packets' award rows came from a shared table available to any
  roll, not from one specific creature's limited-use ability.
  Two abilities share a structural shape without sharing a name: a hostility-deterring spell
  defence appears on both the archangel and the principi, under different titles, Crown of Fire
  and Moonlight Aura. Recurrence of shape across different creatures in the same packet is not
  the same thing as one shared mechanic stated once at a shared locus; do not merge them.
  Every quantity on the page is a magnitude and no field may store one.

