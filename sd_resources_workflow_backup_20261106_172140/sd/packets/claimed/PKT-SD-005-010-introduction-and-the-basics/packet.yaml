content_shape_note: >-
  Recorded for the downstream reader, not as an extraction conclusion. Pages 5 and 6 are an
  in-fiction narrative. Page 7 is a prose description of what the game is and what characterises it.
  Pages 8 and 9 are THE BASICS, a deliberately compressed summary of core play: the player and GM
  roles, turns and actions, movement, rounds, the dice and advantage, the six stats and the modifier,
  the check procedure against a difficulty class, and hit points, damage and death. The section
  closes by stating that the following chapters expand upon it, so most identities it names have
  their defining locus in a later packet. Whether and how those relationships are extractable is an
  extraction question this claim does not answer, and no GUR has been published for this packet_id.

expected_extraction_hazard: >-
  Flagged at claim for the extracting Analyst, as a caution rather than a conclusion. Because THE
  BASICS is a summary whose own text says later chapters expand upon it, nearly every mechanic it
  names is defined more fully on a later printed page: the dice and advantage at Rolling the Dice,
  checks at Making Checks, turns at Turn Order, stats at Stats, hit points and death in Combat and
  Resting. Under SOURCE_MARKDOWN Source Identity Authority this packet may support the relationships
  its own pages state, but it does not name a concept whose defining mechanics belong to another
  page. Identities proposed from here should be treated as provisional and recorded as such, and the
  packet that later claims each defining locus takes precedence over a stem proposed here.

