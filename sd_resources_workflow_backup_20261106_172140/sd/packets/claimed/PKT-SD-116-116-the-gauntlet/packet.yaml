content_shape_note: >-
  Recorded for the downstream reader, not as an extraction conclusion. An optional
  campaign-opening process: players make several 0-level characters each, run them through a
  deliberately lethal dungeon where zero hit points means instant death, and the survivor
  graduates to 1st level. Four subsections, mostly short.

expected_extraction_hazard: >-
  Flagged at claim for the extracting Analyst. Every row from this page should carry status
  optional, because the page opens by saying a GM can use the process. That matters most for
  the instant-death rule: it is true inside The Gauntlet and nowhere else, and a core row
  would assert that 0-level characters never get a death timer, which contradicts the ordinary
  dying rules on printed page 89 and the character-death advice on 108.
  The instant-death rule is an OVERRIDES of rule_dying and needs a section 7 basis. Canonical
  already holds one optional override of the same target, rule_fatality_mode from printed page
  111, so the key must be checked rather than assumed distinct.
  The graduation sentence states three consequences, but gaining a class already follows from
  the canonical exp_level_one GATES sys_class row on printed page 14, so asserting it here
  would create a second path to one consequence.
  The pointer to the random generation process on printed page 40 has no single identity to
  target: that process is many rows across nine tables.
  Most of the rest of the page is counts, which are magnitudes no field may store.

