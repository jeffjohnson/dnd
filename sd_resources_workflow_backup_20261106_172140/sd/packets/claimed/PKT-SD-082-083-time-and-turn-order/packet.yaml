content_shape_note: >-
  Recorded for the downstream reader, not as an extraction conclusion. Page 82 ties game time to real time, restates turns and rounds, and defines what happens when time is fast-forwarded. Page 83 defines initiative, the ordered steps of a player turn and a GM turn, and what an encounter is.

expected_extraction_hazard: >-
  Flagged at claim for the extracting Analyst. This is the defining locus for initiative, which the thief talents table already modifies, and for the encounter. It also restates the turn and round relationship and the per-turn action and movement allowances, all three already asserted from printed page 8, so collisions must be checked.

