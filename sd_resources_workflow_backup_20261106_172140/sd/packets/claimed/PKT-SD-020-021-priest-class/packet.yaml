  SOURCE_MARKDOWN Attribution Rules requires for such content; the unattributed text was extracted
  from the parser and checked rather than assumed, and contains no rulebook prose, heading or marker.

supporting_source_context: >-
  Present, unusually large, and entirely out of scope. The trailing section states that the passages
  are repeated context and links their primary packets. The AST resolves them to printed pages 15,
  44, 45, 46, 47, 48, 49, 50 and 86, none of which is inside this packet's declared span of 20 to 21.
  They reproduce the stats material, the casting-spells and critical-success material, the wizard
  mishaps tables, scrolls and wands, spell attributes, and resting.
  This is flagged prominently because the reproduced pages include the spellcasting rules that this
  class entry points at, which makes them tempting to read as evidence. They are orientation only.
  Any assertion about casting procedure, spell tiers, critical results or mishaps belongs to the
  packet that claims those printed pages from their own defining loci, not to this packet.

scope_boundary: >-
  The bounded scope is the Primary Source Material section, printed pages 20 and 21 as resolved by
  the Pandoc AST. Nine further pages appear in the file only as Supporting Source Context and are
  claimed by other packets, so the zero-overlap rule across the intake holds.

content_shape_note: >-
  Recorded for the downstream reader, not as an extraction conclusion. Page 20 is a complete class
  entry: permitted weapons and armor, a hit point die per level, four separately named class benefits
  covering languages, a granted spell, a deity choice tied to alignment, and spellcasting, plus a
  rollable talents table with five outcome rows. Page 21 is a second table giving spells known by
  character level and spell tier. This is the defining locus for the priest class identity under
  SOURCE_MARKDOWN Source Identity Authority.

