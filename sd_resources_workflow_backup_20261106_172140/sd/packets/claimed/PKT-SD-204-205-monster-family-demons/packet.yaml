  save-against-STR-or-damage shape Crab, Giant carried two packets ago, distinct from the
  Bears' extra-die shape; confirm which shape before writing a note, not merely that the name
  recurs. Screech recurs on Vrock in close paraphrase of Cloaker's ability from two packets ago,
  same effect and a different DC, which is a new middle case between verbatim repetition and a
  bare name collision.
  Marilith's Parry states a direct consequence against melee attacks; test it on locus as with
  every other real-identity-referencing ability rather than on its apparent novelty.
  Every quantity on the page is a magnitude and no field may store one.

