expected_extraction_hazard: >-
  Flagged at claim for the extracting Analyst. Darkmantle's Darkness ability states that it
  extinguishes all light sources in near, which directly names rule_light_source's own concept
  in its plural form; a naive stem match can miss the plural, so read the cell rather than trust
  the scan alone. The shape is the same as the tomb and ruins encounter tables' light-source
  extinguishing rows, and the same locus test applies: one creature's own ability, not a shared
  locus, excluded regardless of the real target.
  Deep One's Sunblind is the inverse of Dark-Adapted, a vulnerability to bright light rather than
  an immunity to darkness; there is no bright-light or blinded condition identity to attach it to
  even before the locus question is reached.
  Every quantity on the page is a magnitude and no field may store one.

