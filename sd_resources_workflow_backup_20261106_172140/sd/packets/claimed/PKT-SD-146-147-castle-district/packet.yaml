missing_input_impact: >-
  Material. The canonical graph holds 404 registry rows, 779 edges and 367 nodes,
  read at claim rather than recalled. The whole registry must be read rather than
  keyword-searched, which is the omission that cost a required row at PKT-SD-101-109.

classified_as_gate_note: >-
  No CLASSIFIED_AS row is expected. The page defines no spell and no item; the objects named in
  its cells are encounter scenery.

heading_level_anomaly: >-
  Recorded because it is the only one in the chapter. The area heading on printed page 146 is a
  level-three heading, CASTLE DISTRICT, where every other packet of these twenty-two uses level two. All
  twenty-two were checked to establish that, rather than assuming this one is the odd case. The
  level has no effect on page attribution: SOURCE_MARKDOWN placement rule 1 applies a marker to
  its whole heading whatever the heading's level, so p146 resolves exactly as it would have at
  level two. It does mean the area heading and the table heading sit at the same level here, so
  a parser that identifies the table section by heading level alone would find two candidates;
  the section is identified by its title instead.
