marker_note: >-
  The page break falls inside the table, as it did for PKT-SD-142-143 and PKT-SD-118-119. The
  p146 marker sits on the CASTLE DISTRICT heading under placement rule 1. The p147 marker sits in the
  last cell of the row keyed 46-47, and SOURCE_MARKDOWN acceptance test 3 applies a
  table-row marker to the whole row, so that row is page 147 and the persistence rule carries
  147 to every row after it. Rows before it are page 146.

packet_wrapper_note: >-
  The supplied file opens with an intake wrapper naming the packet and a shadowdark.md line
  range ahead of the Primary Source Material heading. The unattributed text contains no
  rulebook prose, heading or marker.

supporting_source_context: >-
  Present and out of scope. Two passages are appended, the random encounter procedure from
  printed pages 112 and 113 and the monster attributes page from 189. Both have their own
  primary packets, the first integrated and the second unclaimed. Neither is an extraction
  surface here and no row may cite either.

scope_boundary: >-
  The bounded scope is the Primary Source Material section as resolved by the Pandoc AST, so
  the zero-overlap rule across the intake holds. The appended encounter procedure is the very
  rule the in-scope table resolves, so extracting from it would be easy and wrong.

content_shape_note: >-
  Recorded for the downstream reader, not as an extraction conclusion. One named table of
  50 rows keyed to a hundred-sided roll, and no prose at all. The chapter disposition was
  settled at PKT-SD-142-143 and is applied here rather than re-argued.

expected_extraction_hazard: >-
  Flagged at claim for the extracting Analyst. The page states no procedure of its own; the
  table's own title names encounters and rule_encounter is canonical, so this table is a
  further resolver of that rule rather than evidence of a new procedure.
  Most cells name creatures, named characters or scenes, and the monster chapter is
  unextracted, so most of the table is unextractable for that reason alone.
  A naive search of the cells against the registry returns matches that are ordinary English
  rather than references. Count them and discard them explicitly rather than filtering by eye;
  the measured ratio at PKT-SD-142-143 was ten spurious to three real.
  Every quantity in the table is a magnitude and no field may store one.

