leading_content_note: >-
  No leading-content question arises. The Primary Source Material opens with the CASTLE DISTRICT heading
  and that heading carries the p146 marker itself.

page_classes: {}
page_class_note: >-
  This packet declares no page class. The Pandoc AST contains no class-bearing page block
