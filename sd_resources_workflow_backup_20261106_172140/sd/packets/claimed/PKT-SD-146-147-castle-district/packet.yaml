packet_id_derivation: >-
  Derived from conforming packet metadata. SD is the citation_code registered for book sd in
  rulesets/shadowdark/registries/books.yaml. The page range is the Primary Source Material span
  the Pandoc AST resolves. The slug follows the packet own top-level source heading, CASTLE DISTRICT,
