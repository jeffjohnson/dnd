leading_content_page_resolution: >-
  Read this before citing Octopus, Giant, Ogre, or Oni. The Primary Source Material opens with the
  OCTOPUS, GIANT heading, which carries no marker; the first marker in the section is p240 on the
  ORC heading. SOURCE_MARKDOWN Attribution Rules state that content before the first applicable
  marker has no resolved page unless packet metadata supplies an independent authoritative page
  locator. This manifest supplies one, structural rather than estimated.
  A page's first heading carries that page's marker; a heading with no marker continues the
  preceding page under the persistence rule. OCTOPUS, GIANT, OGRE, and ONI carry no marker, so they
  continue the page before p240. That page's identity is fixed independently by the p239 marker inside
  PKT-SD-232-239-monsters-merfolk-to-ochre-jelly, whose claimed manifest records page_end 239 and
  whose final entry, Ochre Jelly, immediately precedes Octopus, Giant in the source's
  alphabetical monster sequence. Octopus, Giant, Ogre, and Oni are therefore printed page 239. No page
  length was estimated and no line number was used to derive this.

shared_page_note: >-
  Flagged for the Reviewer. Printed page 239 is covered by two packets:
  PKT-SD-232-239-monsters-merfolk-to-ochre-jelly holds Ochre Jelly and this packet holds Octopus, Giant,
  Ogre, and Oni. The split falls inside a printed page rather than on its boundary. This does not breach
  the zero-overlap rule, which bars claiming the same source content, not citing the same printed page.
  No heading or sentence is claimed twice.

marker_note: >-
