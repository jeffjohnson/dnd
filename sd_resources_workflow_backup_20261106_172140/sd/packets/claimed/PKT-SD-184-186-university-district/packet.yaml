page_class_note: >-
  First classified page in this chapter, so the handling is stated rather than assumed. The
  Pandoc AST carries exactly one class-bearing block in the whole file, an empty fenced Div with
  identifier p186 and the single class full-page-artwork, which is a member of the closed
  SOURCE_MARKDOWN 1.8 vocabulary. The attribute list was read from the AST rather than matched
  in raw text, since a bare paragraph form would be invalid and a valid attributed marker must
  not be rejected by text matching.
  The class is steward-authored, page-local intake metadata. It is not a graph node, an edge, a
  domain, a citation or evidence of mechanics, and it does not carry to any later page. Printed
  page 186 stays inside the declared span and inside completeness accounting; it is not
  renumbered or dropped, and it is not an uncovered-page obligation for the Analyst.

marker_note: >-
