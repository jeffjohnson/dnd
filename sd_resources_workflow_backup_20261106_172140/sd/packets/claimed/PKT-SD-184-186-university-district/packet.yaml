  chapter. The p184 marker sits on the UNIVERSITY DISTRICT heading under placement rule 1. The
  p185 marker sits in the last cell of the row keyed 46-47, asserted to be the final cell rather
  than assumed, and SOURCE_MARKDOWN acceptance test 3 applies a table-row marker to the whole
  row, so that row is page 185 and the persistence rule carries 185 to every row after it.
  Measured split: 23 rows on page 184 and 27 on 185. The p186 marker is the classified Div and
