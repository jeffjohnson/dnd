content_shape_note: >-
  Recorded for the downstream reader, not as an extraction conclusion. One named table of
  50 rows keyed to a hundred-sided roll, no prose at all, and one classified page carrying no
  content. This is the last packet of the encounters chapter; operator sequence 80 begins the
  monster chapter. The chapter disposition was settled at PKT-SD-142-143 and is applied here
  rather than re-argued.

expected_extraction_hazard: >-
  Flagged at claim for the extracting Analyst. The page states no procedure of its own; the
  table's own title names encounters and rule_encounter is canonical, so this table is a
  further resolver of that rule rather than evidence of a new procedure. The district is not
  the table's parent, settled at PKT-SD-178-179 and applied again at PKT-SD-180-181.
  One cell italicises a named spell and states that a caster targets a PC with it. If that
  reading holds it is only the second TRIGGERS row into a spell in the graph, so both limbs of
  the occurrence-versus-reference split settled across printed pages 158 and 174 must be
  checked explicitly rather than assumed from the italics alone.
  One cell describes a deliberately placed rune that operates on a character who steps on it,
  which is the closest this chapter has come to satisfying all three elements of the trap test;
  test it element by element rather than by resemblance.
  The hundredth cell names the canonical treasure category and a verb of active bestowal.
  One cell names rule_wizards_and_thieves, a canonical rule identity, in what may be only a
  title. The source must state the mechanism, not merely use the registry noun.
  Most other cells name creatures, named characters or scenes, and the monster chapter is
  unextracted, so much of the table is unextractable for that reason alone.
  Run three scans and read every cell regardless. Three distinct scan blind spots have now been
  recorded in three consecutive packets: a partial multi-word name, an over-stemmed short
  label, and an abbreviation that shares no token with its label. Assert which targeted
  identities no scan reached.
  Every quantity in the table is a magnitude and no field may store one.

