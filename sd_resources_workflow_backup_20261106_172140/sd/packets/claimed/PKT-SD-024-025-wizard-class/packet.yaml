  the Pandoc AST. Nine further pages appear only as Supporting Source Context and are claimed by
  other packets, so the zero-overlap rule across the intake holds.

content_shape_note: >-
  Recorded for the downstream reader, not as an extraction conclusion. Page 24 is a class entry:
  permitted weapons, an armor line reading None, a hit point die per level, and three separately
  named benefits covering languages, learning spells from scrolls, and spellcasting. Page 25 carries
  two tables, spells known by level and tier, and a rollable talents table with five outcome rows.
  This is the defining locus for the wizard class identity and completes the four-class set.

