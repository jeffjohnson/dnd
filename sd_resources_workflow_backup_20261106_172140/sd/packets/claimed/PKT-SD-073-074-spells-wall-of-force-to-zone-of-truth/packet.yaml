expected_extraction_hazard: >-
  Flagged at claim for the extracting Analyst. No row may cite page 74. WISH repeats the
  critical-failure and mishap-with-disadvantage construction already extracted for POWER WORD
  KILL in PKT-SD-065-067, so the rows should match that shape and must be checked against it
  for an assertion-key collision, though the differing source should keep them distinct. WRATH
  repeats the weapon-empowerment construction already extracted for HOLY WEAPON in
  PKT-SD-061-062, which used separate attack and damage rows.
  WALL OF FORCE repeats the impassable-barrier construction of RESILIENT SPHERE. ZONE OF TRUTH
  compels truthful speech, for which no canonical identity exists. Every bonus, die expression
  and duration is a magnitude no field may store.

