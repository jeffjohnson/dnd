page_class_content_discrepancy: >-
  Recorded, not resolved, and flagged for the source steward. The empty Div declares page 1
  full-page-artwork, which SOURCE_MARKDOWN 1.8 defines as a page containing full-page artwork and no
  graph-constitutable content. The very next blocks are the SHADOWDARK title heading and the credit
  and legal text, and the Pandoc AST attributes all of them to page 1 as well, because the heading
  carries its own {#p1} marker and no later marker intervenes before {#p2}.
  These two statements about page 1 can both be literally true only if the printed cover art and the
  credits share one printed page. The likelier reading is that the cover is page 1 and the title and
  credits sit on an unnumbered or separately numbered leaf that the intake folded into page 1. The
  Analyst cannot settle that from the supplied file and does not guess.
  It is recorded rather than repaired for three reasons. Only the source steward declares or amends a
  page class, and a pipeline role must not invent or remove a classification. The discrepancy changes
  no extraction outcome, because credits, art attributions and a legal notice are not
  graph-constitutable content under constitution section 1 whatever page they sit on, so no citation
  in any downstream artifact depends on resolving it. And SOURCE_MARKDOWN directs that a conflict be
  recorded rather than silently overwritten. If the steward intends the title and credits to carry
  their own printed page, a corrected incoming packet should supply that marker; this claimed copy is
  immutable and would be superseded by an ordinary later packet rather than edited.

page_class_non_inheritance_check: >-
  Verified against the Pandoc AST rather than positionally, because SOURCE_MARKDOWN 1.8 states that
  each class applies only to its identified page and never to later pages. The AST reports exactly
  two class-bearing page blocks, the empty Divs for p1 and p4, each carrying only full-page-artwork
  and no unknown class. The page blocks for 2 and 3 carry no class: page 2 is a heading marker and
  page 3 is a table-row marker. No later page inherits either classification, and the resolved page
  set is 1, 2, 3 and 4 with no gap.

marker_note: >-
  Four page assignments resolve through the Pandoc AST. Pages 1 and 4 are empty fenced Divs carrying
  the artwork class, the form SOURCE_MARKDOWN 1.8 requires for a classified page with no source
  heading. Page 1 is additionally marked at the end of the SHADOWDARK heading and page 2 at the end
  of the CONTENTS heading, which placement rule 1 applies to the whole heading. Page 3 is marked in
  the last cell of the Modes of Play table row, which placement rule 2 applies to the entire row
  including the cells before the marker; the parser confirms page 3 begins at that row and the
  persistence rule carries page 3 through the remaining contents rows. No malformed marker token is
  present anywhere in the file.

packet_wrapper_note: >-
  The supplied file opens with an intake wrapper: a level-one heading naming the packet, a Source
  line giving a shadowdark.md line range, a note that original wording and page markers are
  preserved, and the section heading Primary Source Material. The parser reports four blocks
  preceding the first resolved page. This manifest is the independent page locator that
  SOURCE_MARKDOWN Attribution Rules requires for such content. The unattributed text was extracted
  from the parser and checked rather than assumed: it consists solely of the wrapper sentences listed
  above and contains no rulebook prose, no heading belonging to the source, and no marker. No source
  content is stranded, so the wrapper is intake metadata rather than an unresolved source defect, and
  the condition is identical in kind to the packets already claimed from this intake.

