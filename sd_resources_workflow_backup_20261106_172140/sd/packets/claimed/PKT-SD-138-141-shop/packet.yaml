content_shape_note: >-
  Recorded for the downstream reader, not as an extraction conclusion. The page carries five
  named tables and, unlike every other generator page in this chapter, not one sentence of
  prose. The heading is followed immediately by a table.

expected_extraction_hazard: >-
  Flagged at claim for the extracting Analyst. This packet turns on a question the intake has
  not had to answer in this form. Every other generator in this chapter was anchored by prose
  that named the thing being generated, and this one has none, so whether a shop procedure
  identity exists at all must be argued rather than assumed. The contrasting precedent is
  printed page 124, a tables-only NPC page where no procedure identity was minted and four of
  six tables were registered with no edge; read that packet before deciding.
  Two facts bear on it and must be weighed rather than recited. The three tier tables are
  mutually exclusive resolvers of one thing, which is in-scope structural evidence. And printed
  page 134, now canonical, directs the reader to roll shops on this page, which is corroboration
  from outside the range and cannot be cited in a row.
  Whatever is decided here will govern the twenty-two tables-only encounter packets that follow,
  so the reasoning matters more than the outcome.
  One result on the interesting customer table names rule_rival_crawlers, which is canonical
  from printed pages 126 and 127. The name-collision reasoning that declined wizards and
  thieves in NPC backstories on printed page 125 must be checked against it rather than applied
  by reflex.
  Shop type results, customer descriptions, prices and die sizes carry no mechanics.

