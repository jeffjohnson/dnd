content_shape_note: >-
  Recorded for the downstream reader, not as an extraction conclusion. Eight generation tables
  for a rival adventuring party, preceded by a short paragraph that defines the party and states
  that all its members share one alignment. Unlike the adjacent NPC page this one has prose, so
  the tables have something to attach to.

expected_extraction_hazard: >-
  Flagged at claim for the extracting Analyst. Contrast this page with printed page 124
  deliberately. That page was tables only and left four of six registered tables carrying no
  edge; this one opens with a paragraph naming the thing the tables generate, so a parent
  identity exists and every table can be RESOLVED_BY it.
  Three of the eight tables resolve to canonical axes, ancestry, class and alignment, so each
  also earns an axis row in the shape settled on printed page 124. Do not assert one row per
  result: thirteen results are canonical identities by name, but per-result rows restate
  membership and still lose the tables weighting.
  The signature tactics table is indexed BY alignment rather than resolving to it, so its
  alignment relation is FEEDS_INTO and not RESOLVED_BY. Both rows will sit on sys_alignment and
  could look contradictory; the direction is what distinguishes them.
  The member count and the starting level instruction are die expressions and yield nothing.
  Status should follow the core disposition settled as IDQ-01 of PKT-SD-124-125.

