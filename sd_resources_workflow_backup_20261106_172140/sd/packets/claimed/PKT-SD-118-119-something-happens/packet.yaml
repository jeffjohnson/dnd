marker_placement_note: >-
  Read this before citing anything in this packet. It contains the intake first table-row
  marker. p118 ends the SOMETHING HAPPENS! heading and behaves normally under placement rule 1.
  p119 does not sit on a heading or a paragraph: it is at the end of the last cell of a single
  table row, the one reading that a pair of yellow eyes watches from the darkness.
  SOURCE_MARKDOWN Attribution Rules state that a table-row marker applies to the row as a unit
  even when the cited evidence sits in a cell before the marker, and acceptance test 3 requires
  a parser to assign a last-column table marker to the whole row. That entire row is therefore
  printed page 119 and the persistence rule carries 119 to every row below it.
  The practical hazard is that the marker is buried mid-table; reading only headings would miss
  the page boundary entirely.

