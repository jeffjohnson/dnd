content_shape_note: >-
  Recorded for the downstream reader, not as an extraction conclusion. The companion page to
  traps: an opening statement, four bolded paragraphs naming three kinds of hazard plus a note
  on combining them, and a d12 table with one column per kind. It defines hazards partly by
  explicit contrast with traps.

expected_extraction_hazard: >-
  Flagged at claim for the extracting Analyst. Expect a lower yield than the traps page
  despite the close parallel, and do not treat that as a failure to read. The traps prose
  states how a check interacts at three moments; this prose states what hazards do, and one of
  its three kinds, Weakening, has no canonical target.
  Every mechanical sentence here is hedged with some, certain or can, so the hedging test
  should produce CONSTRAINS rather than EXCLUDES even where the word prevent appears.
  Two contrast claims cannot be carried: that hazards usually cannot be disabled, and that
  most are obvious unlike traps. Both assert an absence, and the vocabulary has no way to say
  that something does not connect.
  The table holds thirty-six flavour entries. One, Caltrops, collides exactly with the
  canonical item_caltrops, and several others resemble spells. Neither is a reason to assert:
  the source must state a relationship, not merely mention two things that have identities.

