content_shape_note: >-
  Recorded for the downstream reader, not as an extraction conclusion. Nine pages opening the
  Game Master half of the book: what a GM is for, the pact with players, how to read player
  motivation, nine stated core principles, advice on balance and unpredictability, how
  adventures and campaigns are structured, how to set difficulties, why the GM is not the
  players' enemy, and how to establish a setting. It is advice and philosophy with mechanics
  quoted in passing.

expected_extraction_hazard: >-
  Flagged at claim for the extracting Analyst. A very low yield is expected and the hazard is
  over-extraction, because this chapter quotes a great many real mechanics while defining
  almost none of them.
  Specifically, the four standard DCs restated under SETTING DCS on printed page 107 have
  their defining locus on printed page 79, inside the already-integrated PKT-SD-078-081, where
  the section THE FOUR STANDARD DCS names and values all four. The one-action-per-turn
  statement, the distance bands, the death timer, gear slots and the light timers are likewise
  all defined elsewhere and mostly already canonical.
  Several sections point forward to unextracted chapters by page number, including a Reaction
  Check on printed page 113, Adventures on 122, NPCs on 124, Rival Crawlers on 126, treasure
  on 117 and monsters on 192. None of those targets is canonical and none can be asserted
  without pre-empting another packet's defining locus.
  Apply the incidental-locus test recorded as OBS-04 of PKT-SD-096-100 before rejecting
  anything: where this chapter states a relationship between two identities that are both
  already canonical, the row may be assertable even though this is not either identity's
  defining locus.

