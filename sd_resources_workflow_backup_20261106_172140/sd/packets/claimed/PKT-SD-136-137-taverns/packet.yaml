content_shape_note: >-
  Recorded for the downstream reader, not as an extraction conclusion. Unlike the three
  generator packets before it, this one is not only structural. The drinks table states real
  mechanics in its result cells: a stat check with a consequence, six temporary stat changes in
  both directions, hit point recovery and an experience award.

expected_extraction_hazard: >-
  Flagged at claim for the extracting Analyst. The grain question must be settled before any row
  is written. The drinks are named, priced and mechanically distinct, which is the shape that
  suggests item_ identities, but the existing item_ population is gear the rules reference and
  these are table results. Two canonical tables already carry their results' mechanics at the
  table level rather than per result, tbl_light_mishaps on printed page 110 and
  tbl_carousing_outcome on 93, and both should be read before deciding.
  Every stat change on the drinks table is temporary and no field stores a duration, so rows
  written at table level will read as permanent. That is a loss worth recording rather than
  hiding.
  Two drink entries relate to other drinks rather than to game concepts, one ending a bad effect
  and one doubling the next. Neither is expressible without per-result identities.
  The page is reached from printed page 134, which directs the reader here, but that direction
  is outside this packet's range and belongs to the successor PKT-SD-134-135 already owes.
  Prices, die sizes, durations and the counts in the three quality bullets are all magnitudes.

