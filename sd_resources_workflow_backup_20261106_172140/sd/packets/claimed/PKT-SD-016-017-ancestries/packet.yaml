analyst_status: >-
  Claimed and read in full, but blocked before extraction. No GUR is published for this packet_id.
  Shadowdark Constitution 1.0 section 2 provides no prefix under which an individual ancestry
  identity can be formed, and every assertion on these two pages takes an ancestry as its source
  node, so no candidate edge can be written without first minting an identity the constitution does
  not authorise. The Analyst is prohibited from minting a prefix. The question is escalated to the
  Architect; see the escalation recorded in rulesets/shadowdark/escalations/pending/. This packet
  remains active Analyst work and the GUR follows the Decision.

