content_shape_note: >-
  Recorded for the downstream reader, not as an extraction conclusion. Two downtime activities
  and two tables. Carousing spends coin to gain experience and incidental consequences, and is
  resolved by an event table selected by cost and an outcome table rolled against it. Learning
  acquires an auxiliary skill on a hard check, with a stated retry rule that eases the
  difficulty. The carousing overview appears twice, briefly on printed page 91 and in full on
  printed page 92.

expected_extraction_hazard: >-
  Flagged at claim for the extracting Analyst. Carousing is described on two pages of this same
  packet, briefly on 91 and fully on 92, so the same fact can be extracted twice under two page
  citations. It is one rule and should carry one identity, with each row cited to the page that
  states it.
  The page makes two forward references outside this packet: to the Wizards and Thieves game on
  printed page 94, whose defining locus is the next packet and which has no canonical identity
  yet, and to a treasure table whose chapter is unextracted. Neither target can be asserted
  without pre-empting another packet's defining locus.
  The outcome table is dense with percentages, coin values, XP awards and die results, all of
  which are magnitudes no field may store. The two tables sit on different pages, 92 and 93,
  and must be cited separately.
  The registry must be read in full rather than keyword-searched.

