content_shape_note: >-
  Recorded for the downstream reader, not as an extraction conclusion. Four prose paragraphs
  stating how a trap is avoided, found and disabled, followed by a d12 table of twelve traps
  with a trigger and a damage or effect for each. The prose is rules rather than advice,
  unlike most of the Game Master chapter so far.

expected_extraction_hazard: >-
  Flagged at claim for the extracting Analyst. The sharp hazard is the table effect column.
  It names sleep, paralyze, blind, confuse, unconscious and petrify, and three of those have
  same-named canonical identities, spell_sleep, spell_blind_deafen and spell_confusion, which
  are spells and not conditions. Pointing a trap at one would assert the trap casts that
  spell. No condition identity exists anywhere in the graph and none may be minted here.
  The prose states three different things about checks and traps, one bound on avoidance, one
  automatic discovery that excludes a check entirely, and one conditional bound on disabling.
  They are three statements and should not be collapsed.
  Two statements are hedged with typically and might, and one is absolute; the hedging test
  decides CONSTRAINS against EXCLUDED_FROM and must be applied per sentence rather than per
  page. Every damage expression is a magnitude no field may store.

