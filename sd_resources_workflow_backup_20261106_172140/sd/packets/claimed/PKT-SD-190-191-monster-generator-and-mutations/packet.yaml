content_shape_note: >-
  Recorded for the downstream reader, not as an extraction conclusion. Measured from the AST:
  4 headings, 6 prose paragraphs, 2 named tables and 1 epigraph. The generator table has 20 rows
  across five columns, being the die column, Combat, Quality, Strength and Weakness; the
  mutations table has 12 rows across four columns. 123 scannable units in total.

expected_extraction_hazard: >-
  Flagged at claim for the extracting Analyst. This page is a procedure rather than a stat
  block, so the DEC-2026-0105 boundary does not silence it; the prose states several genuine
  dependencies between shared mechanics and they should be extracted.
  The hardest question is PL. The source defines it as the average character level of the party
  and then computes the monster's AC from it. PL is a party statistic, not a creature statistic,
  so mstat_ does not cover it under constitution 2.5 and minting a party-level identity would be
  the broader use that section reserves to an Architect Decision. Check whether the relationship
  can be stated between existing identities before concluding that a new one is needed; the
  source defines PL in terms of character level in the same sentence.
  The two tables' cells are the generated monster's own qualities, strengths and weaknesses.
  Those are individual values and abilities of a creature that does not exist yet, which is the
  clearest possible case of what constitution 2.5 excludes. Expect the cells to yield nothing
  and enumerate them anyway.
  Several cells name a canonical identity in an unmarked, ordinary-English way: a light
  weakness, a draconic quality, a stealthy strength, a reptilian quality, speaking Common,
  teleporting. None is a marked reference under the limb settled across printed pages 158, 174
  and 181.
  Every quantity in both tables and in the prose is a magnitude and no field may store one.

