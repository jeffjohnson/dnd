content_shape_note: >-
  Recorded for the downstream reader, not as an extraction conclusion. These pages are an optional
  generator: nine rollable tables that select an ancestry, class, starting priest or wizard spells, a
  deity, a rare and a common language, an alignment, and starting gear, plus two sentences fixing
  what a random 1st-level and 0-level character carries. The opening sentences direct the reader to
  roll stats, background and class talents by the ordinary rules and to choose where no table is
  given, so this packet adds a selection procedure over identities defined elsewhere rather than
  defining any mechanic itself.

expected_extraction_hazard: >-
  Flagged at claim for the extracting Analyst. Every table here enumerates identities whose defining
  loci are other packets, several of which are now canonical: the six ancestries, the four classes,
  the three alignments, the seven deities and the fourteen languages. The hazard is the reverse of
  the usual one. Nothing needs minting, so the question is not whether an identity may be proposed
  but whether a random-selection table creates a mechanical dependency at all, and whether these
  tables are the same mechanic as the choices they substitute for. Status on every row also needs
  care: the section is explicitly an option.

