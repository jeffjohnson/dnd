marker_note: >-
  Five markers resolve through the Pandoc AST, one per printed page: page 1 on an empty fenced Div
  carrying the full-page-artwork class, and pages 2 through 5 as plain markers at the end of
  headings, which SOURCE_MARKDOWN placement rule 1 applies to the whole heading. The persistence
  rule carries each assignment forward until the next marker.

source_repair_at_intake: >-
  The supplied file carried the page-1 marker as a single line reading ':::' then the attribute then
  '/ :::'. Pandoc does not treat a one-line fenced Div as a Div, so the attribute was not preserved,
  page 1 did not resolve, and the linter reported a malformed marker. The Analyst applied the same
  mechanical two-line Div repair the steward authorized for the sixteen equivalent markers in the
  shadowdark intake, splitting the opener and closer onto separate lines. Exactly one line was split
  into two; the file's line count rose by one and no other byte changed. The repair was applied to
  the incoming file before claiming, so this immutable claimed copy records the corrected bytes and
  the checksum above is of the corrected file. No rulebook prose, marker page number or class was
  altered.

frontmatter_note: >-
  The supplied file opens with a steward YAML metadata block declaring source, series, product_line
  and pages. Pandoc consumes it as document metadata, so it never reaches the block stream and
  cannot disturb marker resolution. Under SOURCE_MARKDOWN 1.7 and basicdnd Constitution 1.0 section
  10 it is informational intake metadata and this manifest is authoritative where the two differ.
  Its declared range of pages 1 to 5 agrees with the markers resolved from the source.

