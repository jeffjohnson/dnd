marker_note: >-
  Seven markers resolve through the Pandoc AST, one per printed page, and the packet lints clean with
  no malformed token and no unattributed leading content. Markers appear in three of the placements
  SOURCE_MARKDOWN defines: at the end of headings, mid-paragraph where the page turns inside running
  prose, and at the end of a running line. Under the persistence rule each assignment carries forward
  until the next marker, so a table that begins under one marker stays on that page unless a later
  marker intervenes. No page class appears in this packet.

frontmatter_note: >-
  The supplied file opens with a steward YAML metadata block declaring source, series, product_line,
  chapter, chapter_title and pages. Pandoc consumes it as document metadata, so it never reaches the
  block stream. Under SOURCE_MARKDOWN 1.7 and basicdnd Constitution 1.0 section 10 it is
  informational intake metadata and this manifest is authoritative where the two differ. Its declared
  range of pages 6 to 12 agrees with the markers resolved from the source, and its chapter_title
  agrees with the chapter heading.

known_hazards_observed: >-
  The rc extraction profile names tables_split_across_pages and class_race_axis_collapse. Both are
  present here and are recorded now so extraction does not rediscover them. Several tables sit close
  to a page turn and their page must be taken from the governing marker rather than from proximity.
  The chapter presents dwarf, elf and halfling as character classes in the Character Classes and
  Ability Requirements table; basicdnd Constitution 1.0 section 3.1 already settles that these are
  class_ identities and not race_ identities, and that the race_ prefix stays reserved.

