scope_boundary: Covers Chapter 3 Spells and Spellcasting introductory rules, memorization procedures, rest requirements, spell slot capacity, casting procedures, spell disruption from damage, damage caps, saving throw reduction, reversible spells, and spell list structures.
source_summary: Extraction of general spellcasting mechanics. Establishes spell memorization and rest prerequisites, casting disruption from damage, twenty-die spell damage cap, damage reduction on saving throws, reversible spell rules and alignment tendencies, and integration of clerical, druidic, and magical spell lists into casting.
