scope_boundary: Covers sixth and seventh level magical spells, establishing arcane
  spell access, reversible spells (remove geas, flesh to stone, magic lock, appear),
  saving throws, damage, movement, and transmutations.
source_summary: Extraction of 26 sixth and seventh level magical spells and 4 reversed
  forms. Establishes spell node identities, access from magic-user spell list and
  reversible spell mechanics, and individual mechanical relationships to damage, attack
  rolls, armor class, initiative, saving throws, movement, and spellcasting rules.
