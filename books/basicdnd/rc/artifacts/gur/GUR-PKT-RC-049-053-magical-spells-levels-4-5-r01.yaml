scope_boundary: Covers fourth and fifth level magical spells, establishing arcane
  spell access, reversible spells (shrink plants, curse, harden, free monster), saving
  throws, damage, movement, and transmutations.
source_summary: Extraction of 26 fourth and fifth level magical spells and 4 reversed
  forms. Establishes spell node identities, access from magic-user spell list and
  reversible spell mechanics, and individual mechanical relationships to damage, attack
  rolls, saving throws, movement, detection, doors, hit points, intelligence, reactions,
  and equipment.
