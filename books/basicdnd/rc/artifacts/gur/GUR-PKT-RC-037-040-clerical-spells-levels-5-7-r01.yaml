scope_boundary: Covers clerical spells of 5th, 6th, and 7th levels, establishing spell
  access, saving throws, damage modifications, healing, and resurrection.
source_summary: Extraction of 24 base clerical spells and 7 reversed spell forms across
  levels 5 through 7. Establishes spell node identities, access from clerical spell
  list and reversible spell mechanics, and individual mechanical relationships to
  hit points, damage, armor class, attack rolls, saving throws, languages, and undead.
