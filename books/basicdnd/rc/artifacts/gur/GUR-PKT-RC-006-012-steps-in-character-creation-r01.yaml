scope_boundary: Covers Chapter 1, Steps in Character Creation, including abilities, classes, hit dice, money, equipment restrictions, AC, attack rolls, THAC0 presentation, saving throws, ability adjustments, alignment, alignment languages, and experience mechanics.
source_summary: Extraction of core character creation mechanics. Per DEC-2026-0080 and Constitution 1.0, dwarf, elf, and halfling are character classes rather than races; ability adjustments directly modify their target mechanics; attack tables and THAC0 represent the single cbt_attack_roll mechanic; prime requisites gate classes and modify experience awards.
