      proposed_label: Cavaliers Table I
      kind: tbl
      why_needed: 'The table is consulted as a unit for three separate things: experience threshold, hit
        dice, and level title. 3.2 says a rule and its separately addressable table are two nodes joined
        by DERIVED_FROM when referenced apart, which is the case here. The registry already holds tbl_rangers_i
        on the same pattern. Canonical cites the section name on seven rows but has no node for the table.'
