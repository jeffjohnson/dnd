    - proposed_id: weapon_lance
      proposed_label: Lance
      kind: weapon
      why_needed: 'The packet gives the lance five distinct rules across two pages: required proficiency
        at first level, a mounted damage bonus scaling with level, a fixed dismounted damage bonus, two
        different dismounted weapon equivalences, and the pennon flown from it at 4th level. Canonical
        already records four of those, but with no node for the weapon: the lance is carried in the labels
        of rule_mount, cbt_damage, wpn_length and rule_polearm. That is exactly the label-doing-identity-work
        pattern 3.2 calls drift. Constitution 1.8 adds `weapon_` for precisely this, and gives weapon_lance
        as its worked example.'
      edges_depending_on_it:
        - M072
        - M073
