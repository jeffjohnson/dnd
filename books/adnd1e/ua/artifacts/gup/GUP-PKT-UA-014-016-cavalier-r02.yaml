      proposed_label: Armorial Bearing
      kind: rule
      why_needed: The device worn on the shield to identify the cavalier in battle and tournament, and
        the reason it may be covered or must be revealed. Kept distinct from the existing rule_battleflag,
        which the page introduces separately as the lance pennon and its duplicate held by retainers;
        canonical attaches territory and dishonor to the flag, neither of which the shield device carries.
