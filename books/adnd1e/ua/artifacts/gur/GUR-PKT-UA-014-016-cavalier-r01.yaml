additional_loci:
- ref: M005
  primary: UA 14 THE CAVALIER
  also_stated_at: UA 15 CAVALIERS TABLE I, the table footnote
  basis: '5: if the same assertion is stated at several loci, keep one edge and preserve the additional
    assertions here. Page 14 is primary because it states the rule in full.'
canonical_duplicates_not_for_emission:
- finding: Canonical holds 32 rows cited to UA 14, 15 and 16. The fresh reading confirms all 27 that fall
    inside this packet's scope, and none is re-emitted. The remaining five are the WEAPON SPECIALIZATION
    rows discussed in page_attribution_findings.
  confirmed_at_ua_14:
  - class_cavalier EXCLUDED_FROM sys_experience | 'no prime requisite so no bonus'
  - abil_strength GATES class_cavalier | 'high minimum score'
  - abil_dexterity GATES class_cavalier | 'high minimum score'
  - abil_constitution GATES class_cavalier | 'high minimum score'
  - class_cavalier DERIVED_FROM cbt_attack_matrix | 'attacks as a fighter'
  - class_cavalier EXCLUDED_FROM prof_specialization | 'cavaliers and paladins are barred'
  - rule_service GATES class_cavalier | 'must serve some higher cause'
  - campaign_social_class GATES class_cavalier | 'immediate entry requires noble birth'
  - rule_sponsorship GATES class_cavalier | 'a higher authority must vouch for low-born entrants'
  - campaign_social_class TRIGGERS exp_level | 'must progress through Horseman and Lancer'
  - class_paladin EXCLUDED_FROM prof_specialization | 'barred as a cavalier subclass'
  confirmed_at_ua_15:
  - class_cavalier CONSTRAINS prof_weapon | 'lance proficiency required at first level'
  - class_cavalier MODIFIES cbt_parry | 'all to-hit bonuses apply to the parry'
  - exp_level MODIFIES sys_experience | 'begins at a negative total'
  - exp_level MODIFIES rule_hit_points | 'different dice if entering via the ranks'
  - exp_level MODIFIES cbt_damage | 'damage bonus equals level while mounted'
  - rule_mount MODIFIES cbt_damage | 'dismounted lance loses the level bonus'
  - rule_mount DERIVED_FROM wpn_stats | 'treated as another weapon type'
  confirmed_at_ua_16:
  - class_cavalier MODIFIES save_matrix | 'bonuses against certain attack forms'
  - class_cavalier MODIFIES save_spell | 'bonus against all illusions'
  - sys_alignment OVERRIDES rule_hit_points | 'may function below zero'
  - rule_hit_points CONSTRAINS sys_alignment | 'how far below zero the cavalier may function'
  - sys_alignment MODIFIES rule_hp_recovery | 'extra points per week of rest'
  - campaign_social_class GATES rule_hospitality | 'cavaliers may expect full hospitality'
  - campaign_social_class FEEDS_INTO cbt_encounter_reactions | 'bearing must be revealed to those who
    understand it'
  - rule_battleflag GATES campaign_territory | 'pennon marks the cavalier's holding'
  - rule_battleflag TRIGGERS rule_dishonor | 'must be regained'
  caught_only_by_pulling_the_whole_page:
  - The first pass filtered canonical on rows naming class_cavalier and found twenty. Pulling every row
    cited to UA 14, 15 and 16 instead found 32, and the twelve extra included rule_hospitality, rule_battleflag,
    rule_dishonor and cbt_encounter_reactions, four nodes this packet would otherwise have duplicated.
    Three proposed edges were withdrawn as paraphrases as a result, and one proposed node, rule_hospitality,
    turned out to exist already.
  also_stated_here_but_canonically_cited_to_ua_12:
  - sys_alignment GATES class_cavalier | 'non-evil at start' — page 14 states the good-alignment entry
    requirement, canonical cites it to the CHARACTER CLASSES overview on page 12. One assertion, two loci;
    not re-emitted.
  - race_any CONSTRAINS class_cavalier and race_subrace GATES class_cavalier — page 14 restates the racial
    access rule in more detail than page 12. Not re-emitted.
  basis: 5.1 for the exact and paraphrase cases, and 5 for the multiple-loci case. Each assertion was
    read from the page first and matched to canonical afterwards.
