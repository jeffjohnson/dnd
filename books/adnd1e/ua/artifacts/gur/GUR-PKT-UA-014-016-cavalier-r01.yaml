domains_touched_note: Three. Class progression on 14 and 15, combat in the weapons-of-choice, parry and
  mounted attack material, and campaign in the social class, heraldry, hospitality and code material on
  16. A full class entry crosses domains by nature.
candidate_domains:
- name: mounted combat
  observed_here: Lance damage while mounted, the dismounted lance, mounted attack level, saddle security,
    urged speed and four steed types form a cluster with its own vocabulary.
  promotion_status: Not adopted. 15 requires recurrence across several packets and this is the first UA
    packet in the repository.
- name: chivalry and station
  observed_here: Social class entry, sponsorship, the code, heraldry, hospitality and battlefield compulsion.
    Distinct from combat and from class progression, and largely absent from the core books.
  promotion_status: Not adopted. Likely to recur in the UA class entries, so worth watching.
