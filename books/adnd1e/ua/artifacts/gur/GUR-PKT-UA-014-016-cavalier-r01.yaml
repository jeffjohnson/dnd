replaces_packet:
  packet_id: PKT-UA-015-015-cavaliers
  its_gur: GUR-PKT-UA-015-015-cavaliers-r01
  reason: The earlier packet was a page-15 extract whose page attribution could not be trusted past its
    second heading, and half of it was deferred under BLK-01. The steward replaced it with the complete
    class across printed pages 14 to 16, with the running headers that caused the ambiguity removed and
    three markers supplied. All fourteen edges of the earlier GUR are re-derived here from the replacement
    packet; none is carried across.
  disposition_of_the_earlier_gur: Withdrawn by GUR-PKT-UA-015-015-cavaliers-r02, which supersedes r01
    with an empty candidate set and a handoff that produces no Builder job. Both revisions remain at their
    stable paths.
source_summary: The complete cavalier class from Unearthed Arcana, spanning printed pages 14 to 16. Page
  14 covers entry requirements, service and social class, the zero-level Horseman and Lancer grades, racial
  access, preferred weapons and the weapons-of-choice bonus progression. Page 15 carries CAVALIERS TABLE
  I and its footnote, the lance, parry, armor preference, mounted attacks, horsemanship by level, steed
  selection, ability-score training, advancement training, and fear and mind-effect immunity. Page 16
  covers functioning at negative hit points, healing, armorial bearing, hospitality, the code of chivalry
  and its enforcement, battlefield behaviour, and what changes for neutral and evil cavaliers.
node_id_resolution_method: Two passes. Every endpoint was looked up in nodes.csv, then every canonical
  row cited to UA 14, 15 and 16 and every canonical row touching class_cavalier on any page, twenty in
  all, was pulled and compared assertion by assertion before anything was emitted. Where canonical already
  names a concept, that identity is reused, including str_exceptional over abil_strength_exceptional on
  dominance grounds. Ten concepts had no identity anywhere and are proposed below.
page_attribution_method: 'Parsed with pandoc 3.10 to JSON AST. Three markers. {#p14} and {#p15} sit at
  the end of headings and take their whole heading under SOURCE_MARKDOWN 1.3 rule 1. The third is inline,
  mid-paragraph, and splits under rule 3: the text through ''This 90% immunity is in addition to any''
  remains on page 15, and ''saving throw for the cavalier, if applicable'' onward begins page 16, with
  every following block on 16. That split is load-bearing, because the saving-throw and illusion assertions
  fall on the page-16 side of it while the fear and mind-effect immunity that introduces them falls on
  15.'
grain_decisions:
- 'The whole of CAVALIERS TABLE I is magnitudes: experience thresholds, dice expressions and flat gains.
  Each column is recorded as a lookup relationship to the table, never a value.'
- The weapons-of-choice bonus list gives a level and a plus for each of seven entries. The relationship
  recorded is that level improves the weapon-of-choice bonus; the levels and the pluses are dropped.
- The armor preference list and the eight-item battlefield charge priority are orderings, not values.
  Neither is representable as an aspect, and neither is forced into one; the constraint each expresses
  is recorded instead.
- '''as if the character were 5 levels higher'', the 85% saddle chances, the 1% per level increment, the
  2d10 percentile roll, the 18/00 ceiling and the +2 hit points per hit die are all magnitudes.'
- The negative-hit-point range and the healing bonus are magnitudes; M059 and M060 record only that a
  good-aligned cavalier functions below zero and heals faster.
candidate_nodes:
- proposed_id: tbl_cavaliers_i
  proposed_label: Cavaliers Table I
  kind: tbl
  why_needed: 'The table is consulted as a unit for three separate things: experience threshold, hit dice,
    and level title. 3.2 says a rule and its separately addressable table are two nodes joined by DERIVED_FROM
    when referenced apart, which is the case here. The registry already holds tbl_rangers_i on the same
    pattern. Canonical cites the section name on seven rows but has no node for the table.'
  edges_depending_on_it:
  - M016
  - M017
  - M018
- proposed_id: rule_level_title
  proposed_label: Level Title
  kind: rule
  why_needed: The table's fourth column, plus the line setting the title for every level above the table's
    last row. Nothing in the registry represents level titles, though every class table in the corpus
    has the column.
  edges_depending_on_it:
  - M018
  - M019
- proposed_id: rule_zero_level_progression
  proposed_label: Zero Level Progression
  kind: rule
  why_needed: 'The two grades below first level, described in full on page 14 and restated in the page
    15 footnote. This is the node the canonical UA 15 hit-point row needs and does not have: that row
    is sourced from exp_level while carrying source_label ''Zero Level Progression'', so the label does
    identity work the ID cannot support. The stem matches the label already in canonical rather than inventing
    a name. See the pair 2 finding.'
  edges_depending_on_it:
  - M004
  - M005
  - M006
- proposed_id: rule_chivalric_code
  proposed_label: Code of Chivalry
  kind: rule
  why_needed: Named on page 14 as 'a code of chivalry (described below)' and set out in full on page 16,
    where it constrains conduct, weapons, battlefield behaviour and experience awards, and where failing
    it costs knighthood. Referenced from three separate pages of this packet, so it is a node rather than
    a property of the class.
  edges_depending_on_it:
  - M003
  - M009
  - M065
  - M066
  - M067
  - M068
- proposed_id: rule_weapon_of_choice
  proposed_label: Weapon of Choice
  kind: rule
  why_needed: 'The page names the mechanic in quotation marks, ''weapons of choice'', and returns to it
    for the attack-rate rule and the constraint that the same weapon must be kept at higher levels. Distinct
    from prof_weapon, which is ordinary proficiency: a cavalier is proficient in many weapons and has
    exactly three weapons of choice.'
  edges_depending_on_it:
  - M010
  - M011
  - M012
  - M013
  - M014
  - M015
- proposed_id: rule_armorial_bearing
  proposed_label: Armorial Bearing
  kind: rule
  why_needed: The device worn on the shield to identify the cavalier in battle and tournament, and the
    reason it may be covered or must be revealed. Kept distinct from the existing rule_battleflag, which
    the page introduces separately as the lance pennon and its duplicate held by retainers; canonical
    attaches territory and dishonor to the flag, neither of which the shield device carries. If the Reviewer
    judges them one concept, rule_battleflag is the survivor and M061 should re-point to it.
  edges_depending_on_it:
  - M061
- proposed_id: monster_pegasus
  proposed_label: Pegasus
  kind: monster
  why_needed: One of the three steeds unlocked by level. No node exists.
  edges_depending_on_it:
  - M035
- proposed_id: monster_hippogriff
  proposed_label: Hippogriff
  kind: monster
  why_needed: One of the three steeds unlocked by level. No node exists.
  edges_depending_on_it:
  - M036
- proposed_id: monster_griffon
  proposed_label: Griffon
  kind: monster
  why_needed: One of the three steeds unlocked by level, and the page extends it to 'a similar creature
    (DM's judgment)'. No node exists. The registry already holds monster_horse and monster_unicorn for
    the other two mounts on this page, so these three complete a family the graph has half of.
  edges_depending_on_it:
  - M037
