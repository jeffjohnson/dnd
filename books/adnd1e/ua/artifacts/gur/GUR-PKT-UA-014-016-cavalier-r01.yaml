completeness_statement: 'Every block of the claimed packet was read, parsed with pandoc 3.10 to JSON AST
  rather than by line splitting, as SOURCE_MARKDOWN 1.3 requires; both headings, the two Pandoc tables,
  all three list blocks and the line-block code of conduct were inspected. All three page markers were
  resolved under 1.3, including the inline rule 3 split inside the saving-throw paragraph, and every edge
  cites one page accordingly: 15 on page 14, 42 on page 15, 10 on page 16. Every candidate was checked
  against all 32 canonical rows cited to these three pages before emission. Material deliberately not
  emitted: the 27 assertions canonical already holds, recorded above as confirmations; the cavalier''s
  flat hit-point gain, which XGC-01 shows cannot be expressed without colliding with the PHB 22 row; the
  preferred-weapon list and the lance weapon-type rules, which have no node to attach to; the comeliness
  bound and the two mind-affecting powers with no node; and the eight-item charge priority and the armor
  preference ranking, which are orderings rather than assertions. All 67 edges carry status optional per
  constitution 8. The DEC-2026-0029 pair 2 comparison is answered in full above and is now supported by
  the page 14 statement of the rule rather than the page 15 footnote alone.'
