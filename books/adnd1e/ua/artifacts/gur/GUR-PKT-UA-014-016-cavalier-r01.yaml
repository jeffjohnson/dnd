page_attribution_findings:
  subject: the earlier packet's page-boundary problem, now resolved
  finding: The replacement packet's inline {#p16} marker falls inside the saving-throw paragraph. The
    two canonical rows cited to UA 16, class_cavalier MODIFIES save_matrix and class_cavalier MODIFIES
    save_spell, describe exactly the text on the page-16 side of that marker. Those citations are correct.
  correction_to_the_earlier_analysis: The GUR for the withdrawn PKT-UA-015-015-cavaliers reasoned from
    the CHARACTER CLASSES (CAVALIER) running head that the boundary fell there, roughly half way up the
    file. It does not; it falls much later, inside the saving-throw paragraph. The inference that the
    packet's single page-15 marker could not be right was correct, and the inference about where the true
    boundary lay was wrong. Both are recorded because the second is the reason SOURCE_MARKDOWN 1.3 forbids
    guessing a boundary rather than returning the packet.
  open_question_not_resolved_by_this_packet: Canonical cites five WEAPON SPECIALIZATION rows to UA 15.
    This packet is scoped to the cavalier class rather than to whole printed pages, so its silence on
    weapon specialization is not evidence either way about where that section sits. The question stays
    open until the UA book is packetized in full.
dec_2026_0029_pair_2_finding:
  status: Re-derived from the replacement packet. The conclusion is unchanged from the withdrawn GUR,
    and is now supported by the fuller page 14 statement of the rule rather than by the page 15 footnote
    alone.
  question_from_decision: Do the UA 15 and PHB 34 exp_level MODIFIES rule_hit_points rows assert the same
    affected facet under the same condition, or separate facets?
  ua_reading: 'Page 14: a low-born entrant ''begins first as a 0-level Horseman, then a 0-level Lancer,
    and finally becomes a 1st-level Armiger'', accumulating d4 rolls at each step, ''In contrast, a character
    whose social standing qualifies him or her for immediate entrance begins as a 1st-level Armiger with
    1d10 + 3 hit points.'' The page 15 footnote restates it. The rule branches at a single level on the
    route the character took to reach it.'
  phb_34_reading: 'Read from the claimed packet PKT-PHB-033-035-alignment-hp-languages. CHARACTER HIT
    POINTS states the general progression: ''At 1st level a character has but one hit die (exception:
    rangers and monks begin with two dice each). At each successive level another hit die is gained.'''
  determination: Separate facets. Two assertions, not one.
  reasoning: One die per level and which die at one level are different claims. The PHB rule is about
    how hit dice accumulate across a career; the UA rule says nothing about accumulation and instead makes
    a single level's dice depend on entry path. Neither is a paraphrase of the other under 5.1.
  recommended_outcome: Retain both as assertions, but revise the UA row's source endpoint. The Decision's
    second permitted outcome.
  defect_the_reading_proves: The canonical UA row is sourced from exp_level. Neither page says experience
    level varies the dice; both say the entry path does. The row carries source_label 'Zero Level Progression',
    which names the thing that actually varies them, but GRAPH_INVARIANTS 4 holds that labels do not determine
    identity. As stored the row asserts something the source does not support. This is the one place in
    either pair where the reading proves an action is required.
  proposed_correction: 'M005 states the assertion against the correct source: rule_zero_level_progression
    MODIFIES rule_hit_points, aspect ''entry path dice'', cited to UA 14 where the rule is stated in full.
    If approved, the canonical row exp_level MODIFIES rule_hit_points | ''different dice if entering via
    the ranks'' | UA 15 becomes an unsupported duplicate and should be retired through the ordinary lifecycle,
    the Decision''s fourth permitted outcome. Recommended, not performed: only the Integrator edits canonical,
    and the retirement should follow the node''s approval rather than accompany it.'
  aspect_conformance: The UA row's aspect runs six words. Its production lineage traces to migrations/adnd1e/legacy-import/original/edges_master.csv,
    where it appears with the same aspect, book, page and section but with target hit_points rather than
    rule_hit_points; the target was renamed corpus-wide during migration and no hit_points endpoint survives.
    Matching the row to its antecedent therefore requires reading through that rename, which is a lineage
    fact rather than the text-similarity inference the Decision prohibits. The row is exception-eligible.
    Recorded explicitly because the eligibility test is provenance-based and this row cannot be matched
    on endpoints alone.
  evidence_basis: Read from this claimed packet and from the claimed PHB packet only. No archive extraction
    batch, canonical row, or endpoint name was used as source evidence. The legacy import file was consulted
    solely to establish production lineage for the exception test.
cross_packet_grain_conflict:
  id: XGC-01
  subject: a third UA hit-point assertion that cannot be expressed
  locus: 'UA 15: ''Cavaliers gain 3 h.p. per level after the 10th.'''
  statement: A genuine exp_level MODIFIES rule_hit_points assertion, not in canonical. Canonical already
    holds exp_level MODIFIES rule_hit_points | 'flat gain past name level' | condition 'beyond 9th level'
    | PHB 22 FIGHTERS TABLE I. The two rules differ only in the threshold and the amount, both magnitudes
    barred from aspect and condition by constitution 5 and GRAPH_INVARIANTS 11.
  consequence: Any conforming aspect for the cavalier rule is a paraphrase of 'flat gain past name level',
    and its condition cannot carry the distinguishing threshold. Under the 5.1 assertion key the UA rule
    is therefore either an illegal duplicate of the PHB row or unrepresentable. No edge is emitted for
    it.
  why_it_matters: The grain rule is working as designed for values, but here it collapses two rules that
    genuinely differ. The graph cannot record that the cavalier's flat gain starts at a different level
    and is a different size from the fighter's. Filtering status core would not separate them either,
    since status is not part of the assertion key.
  analyst_position: 'Escalated rather than solved. Three routes exist and choosing among them is an Architect
    decision: allow the class to appear in the condition, which is qualitative and not a magnitude; treat
    book and status as identity-bearing for this case; or accept that per-class variants of a general
    rule are out of scope. Recorded because DEC-2026-0029 named two candidate pairs and this is a third
    collision found on a page it sent me to read.'
  owner: architect
source_identity_conflicts:
  checked: Every source name explicitly present in this packet, per SOURCE_MARKDOWN 1.3.
  found: 'One, the subject of the pair 2 finding: the canonical UA 15 hit-point row carries source_label
    ''Zero Level Progression'' on node exp_level. This packet names the zero-level grades directly and
    at length on page 14, so it supports the label as a concept and does not support it as a property
    of experience level.'
  disposition: Handled as an identity correction proposal, M005, rather than as a label dispute. SOURCE_MARKDOWN
    1.3 makes the current packet canonical for directly stated source identity, and the packet states
    this one directly.
unresolved_identity_questions:
- id: IDQ-01
  subject: prefix for the zero-level grades
  question: rule_ was chosen for rule_zero_level_progression. exp_ was the alternative, since the registry's
    exp_ family holds exp_level and exp_level_loss.
  analyst_position: rule_, because the thing named is a qualification procedure rather than a measure
    of experience, and because putting it under exp_ risks the exact confusion the pair 2 finding is correcting,
    where a route to a level was recorded as a property of level.
  affects:
  - M004
  - M005
  - M006
- id: IDQ-02
  subject: duplicate ability-adjustment identities and the naming convention
  question: 'nodes.csv holds three pairs of duplicate identities carrying identical labels: dex_reaction_adj
    against abil_dexterity_reaction_attacking_adjustment, dex_defensive_adj against abil_dexterity_defensive_adjustment,
    and str_exceptional against abil_strength_exceptional. Canonical usage is 6 to 1, 16 to 1 and 7 to
    2.'
  steward_stated_preference: 'The repository owner has stated a target convention of abil_<three-letter
    ability abbreviation>_<snake_case rule name>, giving abil_dex_reaction_adjustment, abil_dex_defensive_adjustment
    and abil_str_exceptional, and has asked that new work follow it. Recorded here as input to the migration
    decision, not applied: renaming canonical node IDs is an Architect Decision plus an Integrator transaction,
    and it would also touch constitution 3.1, whose prefix table gives abil_ with examples in the unabbreviated
    form abil_constitution.'
  analyst_position: This GUR proposes none of the three and uses the dominant existing form, str_exceptional,
    at M048, so nothing here depends on the outcome. No new node proposed in this packet takes an abil_
    stem, so the convention has nothing to bind to yet; it will apply to the first new ability node proposed
    after the Decision.
  affects:
  - M048
- id: IDQ-03
  subject: no node exists for any mundane weapon
  question: 'Page 14 names eleven preferred weapons and page 15 gives the lance three separate rules,
    including that a heavy lance used on foot is treated as an awl pike and a lighter one as a spear.
    The registry has no node for any of them and no prefix for a mundane weapon: item_ holds magic items,
    wpn_ holds statistics, sword_ holds intelligent-sword mechanics.'
  analyst_position: Nothing was minted; the Analyst may not mint a prefix. The weapons-of-choice mechanic
    is captured as rule_weapon_of_choice, which is the mechanic rather than the weapons, so M010 to M015
    survive the gap. What does not survive is which weapons any of it concerns, and the preferred-weapon
    list on page 14. Raised as ESC-CAND-02.
  affects:
  - M008
  - M010
  - M011
  - M012
  - M013
  - M014
  - M015
architectural_escalations:
- id: ESC-CAND-01
  subject: source_id for steward-extracted, non-legacy packets
  statement: This packet is recorded under ua-legacy-unspecified because that is the only source_id registered
    for UA and an Analyst may not add a registry entry. Its registered provenance is 'legacy graph dump',
    which is false for this packet.
  why_it_matters: DEC-2026-0029 forbids legacy canonical data and archive extraction batches as source-read
    evidence, and this packet exists to supply evidence that is not legacy. A reader taking source_id
    at face value would conclude the opposite of what is true, on the one reading where that distinction
    decides admissibility. Raised identically in the DMG 64 GUR; one registry change resolves both.
  analyst_position: Register a source_id whose provenance names steward intake, and record which packets
    were extracted under it.
  owner: architect
- id: ESC-CAND-02
  subject: the graph has no way to name a mundane weapon
  statement: 'Constitution 3.1 offers item_ for magic items and item classes, wpn_ for weapon properties
    and statistics, and sword_ for intelligent-sword mechanics. None names an ordinary weapon. The registry
    confirms the gap: all 162 item_ nodes are magic items and all seven wpn_ nodes are statistics.'
  why_it_matters: Weapon-specific rules are common across all four books, and this class alone carries
    a preferred-weapon list of eleven and four separate lance rules. Without a stem they are dropped,
    as here, or quietly attached to whichever node is nearest, which is how drift starts.
  analyst_position: A new prefix is needed and only the Architect may add one.
  owner: architect
- id: ESC-CAND-03
  subject: see cross_packet_grain_conflict XGC-01
  statement: The cavalier's flat hit-point gain past a threshold cannot be distinguished from the fighter's
    under the 5.1 assertion key, because the only difference is magnitudes.
  why_it_matters: A real rule on a page this Decision sent me to read cannot be entered into the graph.
    Full statement and the three candidate routes are in XGC-01.
  owner: architect
non_edge_observations:
- id: OBS-01
  topic: this packet replaces one claimed earlier in the same session
  finding: PKT-UA-015-015-cavaliers was claimed from a page-15 extract whose attribution could not be
    trusted past its second heading. The steward replaced it with the complete class across pages 14 to
    16, with transcribed running headers removed and three markers supplied.
  why_it_matters: Both claimed packets remain on disk and immutable. The earlier GUR is withdrawn by its
    own r02 so the Builder sees one job, not two overlapping ones. Nothing from the earlier GUR is carried
    across unread; all fourteen of its edges were re-derived here.
- id: OBS-02
  topic: the legacy page citations for this class are accurate
  finding: All twenty canonical class_cavalier rows that fall inside pages 14 to 16 sit on the page the
    markers give, including the two page-16 rows whose placement prompted the earlier packet's blocking
    note.
  why_it_matters: The working hypothesis going into this packet was that legacy UA page numbers were unreliable.
    For this class they are not. Recorded so the UA book sweep does not start from an assumption this
    packet contradicts.
- id: OBS-03
  topic: the class is optional in its entirety
  finding: All 67 edges carry status optional. Constitution 8 states that Unearthed Arcana is optional
    in its entirety, so no per-assertion judgement was made.
  why_it_matters: Worth stating because several of these rules modify core mechanics directly, including
    the racial ability maximums at M046 and the sex-based limits at M047. Filtering status core must drop
    them, and 8 warns that excluding optional material changes which version of a rule is active.
- id: OBS-04
  topic: high comeliness bounds the mind-effect resistance and is not recorded
  finding: The 90% resistance covers a named list of mind-affecting powers 'but not the effects of high
    comeliness'.
  why_it_matters: Neither EXCLUDES nor EXCLUDED_FROM reads correctly here. The page is not saying the
    cavalier prevents comeliness, nor that the cavalier is not an input to it; it is bounding a resistance
    that is itself not a node. Recorded rather than forced into an edge type that would misstate it. It
    bounds M054 to M058.
- id: OBS-05
  topic: two named mind-affecting powers have no node
  finding: The resistance list names beguiling, charm, domination, hold, hypnosis, magic jar, possession,
    sleep, suggestion and the psionic mind blast. Domination and possession have no node in the registry;
    the rest are covered by M054 to M058, with the existing family node spell_beguiling_charm_hypnosis_suggestion_spells
    matching four of the names exactly.
  why_it_matters: Two of ten named powers are absent from the resistance in the graph. Not minted, because
    both are concepts from elsewhere in the corpus and this packet is not their defining locus.
- id: OBS-06
  topic: the paladin is now a cavalier subclass
  finding: Page 14 says 'members of the paladin sub-class (see hereafter)'. Canonical already records
    class_paladin DERIVED_FROM class_cavalier, cited to UA 12.
  why_it_matters: Confirmed, not re-emitted. Flagged because it is a structural change UA makes to a core
    class, and anything reasoning about paladins across the two books needs to know the parent changed.
- id: OBS-07
  topic: a code violation can cost the class itself
  finding: '''the cavalier becomes a mere fighter, though weapon specialization is not gained and the
    privilege of weapons of choice is retained.'' M068 records the gate; the residue the ex-cavalier keeps
    and loses is not recorded.'
  why_it_matters: The residue is a state of the character after the class is lost, not a relationship
    between two mechanics, and there is no node for a former cavalier. Recorded in case the Reviewer reads
    M068 as the whole of the rule.
