withdrawal:
  reason: The source steward replaced this packet's page-15 extract with the complete cavalier class across
    printed pages 14 to 16, in PKT-UA-014-016-cavalier. The replacement supplies the {#p16} marker whose
    absence caused BLK-01 here, and removes the transcribed running header that made the boundary ambiguous.
    Everything r01 covered is inside the replacement packet.
  replaced_by: GUR-PKT-UA-014-016-cavalier-r01
  edges_withdrawn: 14
  disposition_of_those_edges: All 14 were re-derived from the replacement packet rather than carried across,
    and every one was re-checked against the full canonical neighborhood for pages 14 to 16, which is
    32 rows rather than the twelve visible from page 15 alone.
  why_not_a_further_revision_of_this_packet: A GUR revision is bound to its packet_id, and the replacement
    is a different packet with a different checksum and a different page span. The correct lineage is
    a new GUR against the new packet, and a withdrawal here so the Builder sees one job rather than two
    overlapping ones.
  what_was_wrong_in_r01: 'Nothing in r01''s fourteen edges was found to be a misreading. Its defect was
    scope: it deferred roughly half the file under BLK-01, and its analysis of where the page boundary
    fell was wrong. r01 reasoned from the CHARACTER CLASSES (CAVALIER) running head that the break was
    there; the replacement''s markers show it falls much later, inside the saving-throw paragraph. The
    inference that the single page-15 marker could not be right was correct; the inference about where
    the true boundary lay was not.'
  immutability: Both revisions remain at their stable paths and the claimed packet PKT-UA-015-015-cavaliers
    is untouched, per ARTIFACT_LIFECYCLE.
