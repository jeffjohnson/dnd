- proposed_id: tbl_cavaliers_i
  proposed_label: Cavaliers Table I
  kind: tbl
  why_needed: 'The table is consulted as a unit for three separate things: experience threshold, hit dice,
    and level title. 3.2 says a rule and its separately addressable table are two nodes joined by DERIVED_FROM
    when they are referenced apart, which is the case here. The registry already holds tbl_rangers_i and
    tbl_followers_ranger on the same pattern. Canonical cites the section name CAVALIERS TABLE I on seven
    rows but has no node for the table itself.'
  edges_depending_on_it:
  - M001
  - M002
  - M003
- proposed_id: rule_level_title
  proposed_label: Level Title
  kind: rule
  why_needed: The table's fourth column, plus the line setting the title for every level above the table's
    last row. Nothing in the registry represents level titles, though every class table in the corpus
    has the column.
  edges_depending_on_it:
  - M003
  - M004
- proposed_id: rule_zero_level_progression
  proposed_label: Zero Level Progression
  kind: rule
  why_needed: 'The table''s two grades below first level, and the footnote that makes first-level hit
    dice depend on whether the character passed through them. This is the node the canonical UA 15 hit-point
    row needs and does not have: that row is sourced from exp_level while carrying the source_label ''Zero
    Level Progression'', so the label is doing identity work the ID cannot support. The stem matches the
    label already in canonical rather than inventing a new name. See the pair 2 finding and IDQ-01.'
  edges_depending_on_it:
  - M006
  - M007
