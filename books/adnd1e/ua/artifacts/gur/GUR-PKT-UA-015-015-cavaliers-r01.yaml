dec_2026_0029_pair_2_finding:
  question_from_decision: Do the UA 15 and PHB 34 exp_level MODIFIES rule_hit_points rows assert the same
    affected facet under the same condition, or separate facets?
  ua_15_reading: 'CAVALIERS TABLE I lists two grades below first level, Horseman and Lancer, each with
    its own hit dice, and carries the footnote: ''If qualification for 1st level required progression
    through the two 0-level grades, then hit dice for 1st level are 3d4 + 1, but in all other cases 1d10
    + 3 applies.'' The rule branches at a single level on the route the character took to reach it.'
  phb_34_reading: 'Read from the claimed packet PKT-PHB-033-035-alignment-hp-languages. CHARACTER HIT
    POINTS states the general progression: ''At 1st level a character has but one hit die (exception:
    rangers and monks begin with two dice each). At each successive level another hit die is gained.''
    The rule is about gaining a die per level.'
  determination: Separate facets. Two assertions, not one.
  reasoning: One die per level and which die at one level are different claims. The PHB rule says how
    hit dice accumulate across a career; the UA footnote says nothing about accumulation and instead makes
    a single level's dice depend on entry path. Neither is a paraphrase of the other under 5.1.
  recommended_outcome: Retain both as assertions, but revise the UA row's source endpoint. This is the
    Decision's second permitted outcome, 'revise one or both assertions to conforming source-backed facets'.
  defect_the_reading_proves: The UA row is sourced from exp_level. The page does not say experience level
    varies the dice; it says the entry path does. The row carries source_label 'Zero Level Progression',
    which names the thing that actually varies them, but GRAPH_INVARIANTS 4 holds that labels do not determine
    identity, so as stored the row asserts something the page does not support. This is the one place
    in either pair where the source reading proves an action is required.
  proposed_correction: 'M007 of this GUR states the assertion against the correct source: rule_zero_level_progression
    MODIFIES rule_hit_points, aspect ''entry path dice''. If it is approved, the canonical row exp_level
    MODIFIES rule_hit_points | ''different dice if entering via the ranks'' | UA 15 becomes an unsupported
    duplicate of it and should be retired through the ordinary lifecycle, which is the Decision''s fourth
    permitted outcome. That retirement is recommended, not performed: only the Integrator edits canonical,
    and it should follow rather than accompany the node''s approval.'
  aspect_conformance: The UA row's aspect runs six words. Its production lineage traces to migrations/adnd1e/legacy-import/original/edges_master.csv,
    where it appears with the same aspect, book, page and section but with target hit_points rather than
    rule_hit_points; the target was renamed corpus-wide during migration and no hit_points endpoint survives
    in canonical. Matching the row to its antecedent therefore requires reading through that rename. That
    is a lineage fact rather than the text-similarity inference the Decision prohibits, so the row is
    exception-eligible. It is recorded explicitly because the Decision's eligibility test is provenance-based
    and this row cannot be matched to root_provenance_path on endpoints alone.
  evidence_basis: Read from this claimed packet and from the claimed PHB packet only. No archive extraction
    batch, canonical row, or endpoint name was used as source evidence. The legacy import file was consulted
    solely to establish production lineage for the exception test.
cross_packet_grain_conflict:
  id: XGC-01
  subject: a third UA 15 hit-point assertion that cannot be expressed
  locus: '''Cavaliers gain 3 h.p. per level after the 10th.'''
  statement: This is a genuine exp_level MODIFIES rule_hit_points assertion, and it is not in canonical.
    Canonical already holds exp_level MODIFIES rule_hit_points | 'flat gain past name level' | condition
    'beyond 9th level' | PHB 22 FIGHTERS TABLE I. The two rules differ only in the threshold and the amount,
    both of which are magnitudes barred from aspect and condition by constitution 5 and GRAPH_INVARIANTS
    11.
  consequence: Any conforming aspect for the cavalier rule is a paraphrase of 'flat gain past name level',
    and its condition cannot carry the distinguishing threshold. Under the 5.1 assertion key the UA rule
    is therefore either an illegal duplicate of the PHB row or unrepresentable. No edge is emitted for
    it.
  why_it_matters: The grain rule is working as designed for values, but here it collapses two rules that
    genuinely differ. The graph cannot currently record that the cavalier's flat gain starts at a different
    level and is a different size from the fighter's. Filtering status core would also not separate them,
    since the PHB row is core and the UA row would be optional, and status is not part of the assertion
    key.
  analyst_position: 'Escalated rather than solved. Three routes exist and choosing among them is an Architect
    decision: allow the class to appear in the condition, which is qualitative and not a magnitude; treat
    book and status as identity-bearing for this case; or accept that per-class variants of a general
    rule are out of scope for the graph. Recorded here because DEC-2026-0029 named two candidate pairs
    and this is a third collision found on one of the pages it sent me to read.'
  owner: architect
source_identity_conflicts:
  checked: Every source name explicitly present in this packet, per SOURCE_MARKDOWN 1.3.
  found: 'One, and it is the subject of the pair 2 finding: the canonical UA 15 hit-point row carries
    source_label ''Zero Level Progression'' on node exp_level. The packet names the zero-level grades
    directly, in the table''s two sub-first-level rows and in the footnote, so the packet supports the
    label as a concept and does not support it as a property of experience level.'
  disposition: Handled as an identity correction proposal, M007, rather than as a label dispute. SOURCE_MARKDOWN
    1.3 makes the current packet canonical for directly stated source identity, and the packet states
    this one directly.
unresolved_identity_questions:
- id: IDQ-01
  subject: prefix for the zero-level grades
  question: rule_ was chosen for rule_zero_level_progression. exp_ was the alternative, since the registry's
    exp_ family holds exp_level and exp_level_loss and the concept is part of the experience track.
  analyst_position: rule_, because the thing being named is a qualification procedure rather than a measure
    of experience, and because putting it under exp_ risks the exact confusion the pair 2 finding is correcting,
    where a route to a level was recorded as a property of level. Cheap to rename before integration;
    nothing else depends on it.
  affects:
  - M006
  - M007
- id: IDQ-02
  subject: no node exists for any mundane weapon
  question: 'The lance is central to this page: proficiency with it is required at entry, it carries a
    damage bonus that scales with level while mounted, and a heavy lance used on foot is treated as an
    awl pike while a lighter one is treated as a spear. The registry has no node for a lance, an awl pike
    or a spear, and no prefix for a mundane weapon at all. item_ holds magic items, wpn_ holds weapon
    statistics such as wpn_speed_factor and wpn_range, and sword_ holds intelligent-sword mechanics.'
  analyst_position: Nothing was minted. The Analyst may not mint a prefix, and forcing a lance into item_
    or wpn_ would misuse a stem whose meaning 3.1 states explicitly. The assertions that survive without
    the node are recorded, and the one that does not, the dismounted lance being treated as a different
    weapon type, is already carried in canonical as rule_mount DERIVED_FROM wpn_stats. The cost is that
    the graph cannot answer which weapon any of this concerns. Raised as ESC-CAND-02.
  affects: []
architectural_escalations:
- id: ESC-CAND-01
  subject: source_id for steward-extracted, non-legacy packets
  statement: 'This packet is recorded under ua-legacy-unspecified because that is the only source_id registered
    for UA and an Analyst may not add a registry entry. Its registered provenance is ''legacy graph dump'',
    which is false for this packet: the text was supplied fresh by the repository source steward under
    DEC-2026-0029.'
  why_it_matters: DEC-2026-0029 forbids legacy canonical data and archive extraction batches as source-read
    evidence, and this packet exists specifically to supply evidence that is not legacy. A reader who
    takes source_id at face value would conclude the opposite of what is true, on the one reading where
    that distinction decides whether the work is admissible. Raised identically in the DMG 64 GUR; one
    registry change resolves both.
  analyst_position: Register a source_id whose provenance names steward intake, and record which packets
    were extracted under it.
  owner: architect
- id: ESC-CAND-02
  subject: the graph has no way to name a mundane weapon
  statement: 'Constitution 3.1 offers item_ for magic items and item classes, wpn_ for weapon properties
    and statistics, and sword_ for intelligent-sword mechanics. None names an ordinary weapon. The registry
    confirms the gap: all 162 item_ nodes are magic items, and all seven wpn_ nodes are statistics.'
  why_it_matters: Weapon-specific rules are common across all four books, and this page alone carries
    four of them about the lance. Without a stem they are either dropped, as here, or quietly attached
    to whichever existing node is nearest, which is how drift starts.
  analyst_position: A new prefix is needed and only the Architect may add one. Recorded rather than worked
    around.
  owner: architect
- id: ESC-CAND-03
  subject: see cross_packet_grain_conflict XGC-01
  statement: The cavalier's flat hit-point gain past a threshold cannot be distinguished from the fighter's
    under the 5.1 assertion key, because the only difference between them is magnitudes.
  why_it_matters: A real rule on a page this Decision sent me to read cannot be entered into the graph.
    Full statement and the three candidate routes are in XGC-01.
  owner: architect
non_edge_observations:
- id: OBS-01
  topic: this is the repository's first UA packet
  finding: books/adnd1e/ua held no claimed packet and no GUR before this one, though canonical carries
    a large body of UA edges from the legacy import, including twelve on this page and twenty touching
    class_cavalier.
  why_it_matters: Every UA row now in canonical predates packet-backed extraction and Reviewer verification.
    This is the first UA locus read under the current contracts.
- id: OBS-02
  topic: the page marker was missing on first delivery
  finding: The incoming file arrived with no {#pN} marker and could not be claimed. The steward supplied
    {#p15} on the opening heading and the packet was claimed from the corrected file.
  why_it_matters: 'Recorded so the claim history is legible: the immutable claimed copy matches the corrected
    incoming file, not the first delivery.'
- id: OBS-03
  topic: canonical cites WEAPON SPECIALIZATION to UA 15 but the packet has no such section
  finding: Five canonical rows are cited to UA 15 under section WEAPON SPECIALIZATION. The claimed packet
    contains no weapon specialization material at all; it runs from CAVALIERS TABLE I into the cavalier
    prose.
  why_it_matters: 'Either those five rows are miscited, or the packet does not cover the whole of printed
    page 15. The two possibilities have opposite remedies and this packet cannot distinguish them, because
    a packet can only show what it contains. Raised alongside BLK-01, which points the same way: the packet''s
    boundaries and the printed page''s boundaries may not coincide.'
- id: OBS-04
  topic: the file ends mid-sentence
  finding: The last line is cut at 'This 90% immunity is in addition to any'. The remainder is on a later
    printed page.
  why_it_matters: That material is inside the deferred region anyway, so it changes nothing about this
    GUR. Recorded for whoever extracts the rest.
blocking_notes:
- id: BLK-01
  subject: the packet asserts page 15 for material canonical cites to page 16
  statement: The packet carries exactly one marker, {#p15}, on the opening heading. Under SOURCE_MARKDOWN
    1.3 that assignment persists to the end of the file, so the packet asserts that every line is printed
    page 15. A second heading, CHARACTER CLASSES (CAVALIER), appears part way down with no marker on it.
  evidence_against_taking_that_at_face_value:
  - 'Canonical holds two rows whose section is exactly CHARACTER CLASSES (CAVALIER) and whose page is
    16: class_cavalier MODIFIES save_matrix and class_cavalier MODIFIES save_spell. The material those
    rows describe is in this file, after that heading.'
