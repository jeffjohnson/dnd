source_summary: The claimed packet opens with CAVALIERS TABLE I, the cavalier's experience, hit dice and
  level title progression with its zero-level grades and its footnote on first-level hit dice, followed
  by prose on the lance, parry, armor preference and mounted attacks. A second heading, CHARACTER CLASSES
  (CAVALIER), then introduces horsemanship, steed selection, ability-score training, advancement training
  and fear immunity, and the file is cut mid-sentence. Extraction is confined to the material before that
  second heading; see BLK-01.
node_id_resolution_method: Two passes. Every endpoint was looked up in nodes.csv, then every canonical
  row cited to UA 15 and every canonical row touching class_cavalier on any page was pulled and compared
  assertion by assertion before anything was emitted. That comparison is what kept seven assertions out
  of this GUR and what located the page-boundary problem in BLK-01. Three concepts had no identity anywhere
  and are proposed below.
grain_decisions:
- 'The whole of CAVALIERS TABLE I is magnitudes: experience thresholds, dice expressions, and the flat
  gains. Each column is recorded as a lookup relationship to the table, never as a value.'
- The footnote's two dice expressions reduce to the facet 'entry path dice'. Which dice, and how many,
  are magnitudes.
- '''300,000 experience points per level for each level beyond the 12th'' reduces to ''flat cost beyond
  table''. Both the amount and the threshold are dropped.'
- The shield parry's reduction and its per-plus increment are magnitudes; M008 records only that a shield
  extends the parry to a second opponent.
- The armor preference list is an ordering, not a set of values. M010 records that the class constrains
  which armor types are worn; the ranking itself is not representable as an aspect and is not forced into
  one.
