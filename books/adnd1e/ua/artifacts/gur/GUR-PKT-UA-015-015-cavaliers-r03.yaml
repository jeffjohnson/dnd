withdrawal:
  reason: The source steward replaced this packet's page-15 extract with the complete cavalier class across
    printed pages 14 to 16, in PKT-UA-014-016-cavalier. The replacement supplies the {#p16} marker whose
    absence caused BLK-01 in r01, and removes the transcribed running header that made the boundary ambiguous.
    Everything r01 covered lies inside the replacement packet.
  replaced_by_packet: PKT-UA-014-016-cavalier
  replaced_by_gur: GUR-PKT-UA-014-016-cavalier-r01
  scope_replacement: This packet's source scope, printed page 15 of the cavalier class, is wholly contained
    in the replacement packet's pages 14 to 16. All 14 edges of r01 were re-derived from the replacement
    packet rather than carried across, and each was re-checked against the full canonical neighborhood
    for those three pages, 32 rows, rather than the twelve visible from page 15 alone. Nothing this lineage
    asserted is lost by withdrawing it.
  supersedes_withdrawal_record_in: GUR-PKT-UA-015-015-cavaliers-r02
  why_this_revision_exists: r02 already recorded the withdrawal correctly in substance. It expressed terminality
    with handoff.next_role null and handoff.readiness 'withdrawn', and neither value is in the artifact-envelope
    enum, so r02 fails common schema validation and the queue scanner cannot route it. DEC-2026-0039 retains
    the existing handoff vocabulary, defines terminality as next_role none with readiness terminal, and
    assigns the repair to Analyst by successor revision. This revision changes nothing but that handoff
    and the authority list.
  defect_owner: Analyst. r02 invented a readiness value rather than reading the envelope enum, which is
    what made seven Decision Implementation lineages unable to obtain passing common-suite validation
    evidence.
  immutability: r01 and r02 remain at their stable paths and are not edited, moved or deleted. The claimed
    packet PKT-UA-015-015-cavaliers is untouched and retains its own checksum and source. Per ARTIFACT_LIFECYCLE
    1.9 this successor is the only permitted repair.
  constitution_version_note: 'Declared 1.8, the release in force at authoring, where r02 declared 1.7.
    The bump records when this artifact was written and implies no re-reading of source: this revision
    proposes no node, edge, domain or general rule, so no graph semantics depend on the version.'
