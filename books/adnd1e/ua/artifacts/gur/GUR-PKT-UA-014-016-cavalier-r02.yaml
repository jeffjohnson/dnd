    additive plus provenance.'
  what_changed:
  - source_id ua-legacy-unspecified to ua-steward-intake, per DEC-2026-0034, which names this exact successor.
    The legacy ID falsely described steward-supplied text as a legacy graph dump; that was ESC-CAND-01
    in r01 and is now decided.
  - constitution_version 1.7 to 1.8, and the authority list refreshed to the contract revisions in force.
