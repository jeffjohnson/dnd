cross_packet_grain_conflict:
  id: XGC-01
  subject: a third UA hit-point assertion that cannot be expressed
  locus: 'UA 15: ''Cavaliers gain 3 h.p. per level after the 10th.'''
  statement: A genuine exp_level MODIFIES rule_hit_points assertion, not in canonical. Canonical already
    holds exp_level MODIFIES rule_hit_points | 'flat gain past name level' | condition 'beyond 9th level'
    | PHB 22 FIGHTERS TABLE I. The two rules differ only in the threshold and the amount, both magnitudes
    barred from aspect and condition by constitution 5 and GRAPH_INVARIANTS 11.
  consequence: Any conforming aspect for the cavalier rule is a paraphrase of 'flat gain past name level',
    and its condition cannot carry the distinguishing threshold. Under the 5.1 assertion key the UA rule
    is therefore either an illegal duplicate of the PHB row or unrepresentable. No edge is emitted for
    it.
  why_it_matters: The grain rule is working as designed for values, but here it collapses two rules that
    genuinely differ. The graph cannot record that the cavalier's flat gain starts at a different level
    and is a different size from the fighter's. Filtering status core would not separate them either,
    since status is not part of the assertion key.
  analyst_position: 'Escalated rather than solved. Three routes exist and choosing among them is an Architect
    decision: allow the class to appear in the condition, which is qualitative and not a magnitude; treat
    book and status as identity-bearing for this case; or accept that per-class variants of a general
    rule are out of scope. Recorded because DEC-2026-0029 named two candidate pairs and this is a third
    collision found on a page it sent me to read.'
  owner: architect
  status: resolved
  resolution: 'DEC-2026-0033, retained unchanged by DEC-2026-0042, took the first of the three routes
    this conflict offered: a qualitative class identity in the condition is not a magnitude. Emitted as
    M074. Recorded here rather than deleted, because the reasoning that found the collision is what the
    Decision ruled on.'
dec_2026_0029_pair_2_finding:
  status: Re-derived from the replacement packet. The conclusion is unchanged from the withdrawn GUR,
    and is now supported by the fuller page 14 statement of the rule rather than by the page 15 footnote
    alone.
  question_from_decision: Do the UA 15 and PHB 34 exp_level MODIFIES rule_hit_points rows assert the same
    affected facet under the same condition, or separate facets?
  ua_reading: 'Page 14: a low-born entrant ''begins first as a 0-level Horseman, then a 0-level Lancer,
    and finally becomes a 1st-level Armiger'', accumulating d4 rolls at each step, ''In contrast, a character
    whose social standing qualifies him or her for immediate entrance begins as a 1st-level Armiger with
    1d10 + 3 hit points.'' The page 15 footnote restates it. The rule branches at a single level on the
    route the character took to reach it.'
  phb_34_reading: 'Read from the claimed packet PKT-PHB-033-035-alignment-hp-languages. CHARACTER HIT
    POINTS states the general progression: ''At 1st level a character has but one hit die (exception:
    rangers and monks begin with two dice each). At each successive level another hit die is gained.'''
  determination: Separate facets. Two assertions, not one.
  reasoning: One die per level and which die at one level are different claims. The PHB rule is about
    how hit dice accumulate across a career; the UA rule says nothing about accumulation and instead makes
    a single level's dice depend on entry path. Neither is a paraphrase of the other under 5.1.
  recommended_outcome: Retain both as assertions, but revise the UA row's source endpoint. The Decision's
    second permitted outcome.
  defect_the_reading_proves: The canonical UA row is sourced from exp_level. Neither page says experience
    level varies the dice; both say the entry path does. The row carries source_label 'Zero Level Progression',
    which names the thing that actually varies them, but GRAPH_INVARIANTS 4 holds that labels do not determine
    identity. As stored the row asserts something the source does not support. This is the one place in
    either pair where the reading proves an action is required.
  proposed_correction: 'M005 states the assertion against the correct source: rule_zero_level_progression
    MODIFIES rule_hit_points, aspect ''entry path dice'', cited to UA 14 where the rule is stated in full.
    If approved, the canonical row exp_level MODIFIES rule_hit_points | ''different dice if entering via
    the ranks'' | UA 15 becomes an unsupported duplicate and should be retired through the ordinary lifecycle,
    the Decision''s fourth permitted outcome. Recommended, not performed: only the Integrator edits canonical,
    and the retirement should follow the node''s approval rather than accompany it.'
  aspect_conformance: The UA row's aspect runs six words. Its production lineage traces to migrations/adnd1e/legacy-import/original/edges_master.csv,
    where it appears with the same aspect, book, page and section but with target hit_points rather than
    rule_hit_points; the target was renamed corpus-wide during migration and no hit_points endpoint survives.
    Matching the row to its antecedent therefore requires reading through that rename, which is a lineage
    fact rather than the text-similarity inference the Decision prohibits. The row is exception-eligible.
    Recorded explicitly because the eligibility test is provenance-based and this row cannot be matched
    on endpoints alone.
  evidence_basis: Read from this claimed packet and from the claimed PHB packet only. No archive extraction
    batch, canonical row, or endpoint name was used as source evidence. The legacy import file was consulted
    solely to establish production lineage for the exception test.
