edge_decisions:
- ref: M067
  disposition: rejected
  source_locus: 'UA p16, knighthood paragraph: a cavalier may be sworn in a ceremony ranging from simple dubbing to a full ritual.'
  rationale: The submitted source node rule_ceremony is canonically labelled Druidic Ceremony. The Cavalier packet contains no Druidic ceremony and does not define a separately addressable generic ceremony rule; reusing that identity is unsupported. Remove this row rather than minting an incidental ritual identity.
- ref: M068
  disposition: approved_with_revision
  source_locus: 'UA p16, knighthood paragraph: failure to sustain the oath is insufficient unless the order or liege lord specifically demands revocation; only then does the cavalier become a fighter.'
  exact_corrections:
    condition: order or liege lord demands revocation
  rationale: The submitted blank condition overgeneralizes class loss. The required qualitative trigger belongs in condition; the code-to-class gate and other fields remain source-supported.
