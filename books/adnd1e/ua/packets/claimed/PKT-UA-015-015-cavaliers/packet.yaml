missing_input_impact: >-
  Substantial, and the DMG 64 packet claimed in the same session shows what it costs when the
  neighborhood is not read first. Here the twelve canonical UA 15 rows and the twenty
  class_cavalier rows were pulled before any edge was written, which kept seven confirmed
  assertions out of the GUR and is what located the page-boundary problem in BLK-01. The registry
  probe also established that no mundane weapon node or prefix exists anywhere in the graph, which
  is why four lance assertions on this page are unrepresentable; see ESC-CAND-02.
