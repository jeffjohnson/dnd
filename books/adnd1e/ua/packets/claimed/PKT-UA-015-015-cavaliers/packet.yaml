intake_note: >-
  Supplied by the repository source steward under DEC-2026-0029 follow-up. The first delivery
  carried no page marker and could not be claimed; the steward added the marker and the packet was
  claimed from the corrected file. No pipeline role authored any part of this source text.

page_composition:
  p15: the whole file, as the packet's single marker asserts

marker_note: >-
  One marker, {#p15}, at the end of the opening level-three heading. Under SOURCE_MARKDOWN 1.3
  rule 1 it takes the whole heading, and the assignment persists to the end of the file because no
  later marker changes it. The packet therefore asserts that every line is printed page 15.
marker_placement_resolution: >-
  Parsed with pandoc 3.10 to JSON AST rather than by line splitting. Pandoc represents the marker
  as the heading identifier p15, which SOURCE_MARKDOWN 1.3 states has the same page-marker meaning
  as literal marker text. The file's only other heading, CHARACTER CLASSES (CAVALIER), carries an
  ordinary slug identifier and is not a marker.

boundary_note: >-
  The packet's page assignment is complete and well formed, but there is evidence it is not
  correct for the whole file. Canonical holds two rows whose section is exactly CHARACTER CLASSES
  (CAVALIER) and whose page is 16, describing material that sits in this file after that heading;
  the prose either side of the heading is continuous on one topic, which is what a captured
  running head at a page break looks like. Separately, canonical cites five WEAPON SPECIALIZATION
  rows to UA 15 and this packet contains no such section, so the packet may also not cover the
  whole of printed page 15. Extraction was confined to the region before the second heading, whose
  page 15 attribution is not in doubt under any reading. See BLK-01 and OBS-03 of the GUR.

prior_extraction_note: >-
  Canonical holds twelve rows cited to UA 15, seven under CAVALIERS TABLE I and five under WEAPON
  SPECIALIZATION, plus twenty rows touching class_cavalier across pages 12, 14, 15, 16, 42 and 75.
  All seven CAVALIERS TABLE I rows were confirmed by the fresh reading and none is re-emitted. One
  of them, exp_level MODIFIES rule_hit_points with aspect "different dice if entering via the
  ranks", is a named subject of DEC-2026-0029 pair 2; the GUR's finding concludes its source
  endpoint is unsupported by the page and proposes a corrected assertion rather than editing it.

status_note: >-
  Every edge in this packet's GUR carries status optional. Constitution 8 states that Unearthed
  Arcana is optional in its entirety, so no per-assertion judgement was needed.

source_id_note: >-
  ua-legacy-unspecified is the only source_id registered for this book in
  rulesets/adnd1e/registries/sources.yaml, and the Analyst may not mint a registry entry. Its
  recorded provenance is "legacy graph dump", which is not true of this packet: this is freshly
  supplied steward text. The discrepancy is recorded rather than resolved because it matters here.
  DEC-2026-0029 forbids legacy canonical data and archive extraction batches as source-read
  evidence, and this packet's whole purpose is to supply non-legacy evidence. A reader must not
  infer from the source_id that this reading is legacy-derived. Raised for Architect attention as
  ESC-CAND-01 in the GUR, identically to the DMG 64 packet; one registry change resolves both.

