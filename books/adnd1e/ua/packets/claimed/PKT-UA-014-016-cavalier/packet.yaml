intake_note: >-
  Supplied by the repository source steward as a replacement for the earlier page-15 extract,
  which could not be attributed reliably past its second heading. The steward states this file is
  the complete cavalier class, accurate to the source text, with transcribed running headers
  removed. Taken as canon under SOURCE_MARKDOWN 1.3 Incoming Packet Authority. No pipeline role
  authored any part of this source text.

replaces_packet: PKT-UA-015-015-cavaliers
replacement_note: >-
  The earlier packet remains claimed and immutable at its own path, and its GUR remains at r01.
  Its coverage is entirely contained in this packet, so its GUR was withdrawn by
  GUR-PKT-UA-015-015-cavaliers-r02 to keep the Builder from compiling two overlapping jobs. All
  fourteen of its edges were re-derived from this packet rather than carried across.

page_composition:
  p14: >-
    THE CAVALIER heading through the weapons-of-choice attack-rate paragraph: entry requirements,
    service and social class, the zero-level Horseman and Lancer grades, racial access, preferred
    weapons, and the weapons-of-choice bonus progression.
  p15: >-
    CAVALIERS TABLE I and its footnote through the mind-effect resistance sentence, ending at
    "This 90% immunity is in addition to any": the lance, parry, armor preference, mounted
    attacks, horsemanship by level, steed selection, ability-score training, advancement
    training, and fear immunity.
  p16: >-
    From "saving throw for the cavalier, if applicable" to the end: the illusion save bonus,
    functioning at negative hit points, healing, armorial bearing, hospitality, the code of
    chivalry and its enforcement, battlefield behaviour, and neutral and evil cavaliers.

marker_note: >-
  Three markers. {#p14} and {#p15} are end-of-line on headings and take their whole heading under
  SOURCE_MARKDOWN 1.3 rule 1. {#p16} is inline within a paragraph and splits it under rule 3.
marker_placement_resolution: >-
  Parsed with pandoc 3.10 to JSON AST rather than by line splitting. The rule 3 marker is the one
  that matters and it is load-bearing. It falls inside the saving-throw paragraph, so the fear
  immunity and the 90% mind-effect resistance are on page 15, while "saving throw for the
  cavalier, if applicable" and the +2 versus illusions are on page 16, along with every block that
  follows. Attributing that paragraph as a unit to either page would misplace real assertions in
  both directions.

boundary_verification: >-
  The marker split was checked against canonical rather than assumed. The two rows canonical cites
  to UA 16, class_cavalier MODIFIES save_matrix and class_cavalier MODIFIES save_spell, describe
  exactly the text on the page-16 side of the inline marker, and all 32 canonical rows cited to
  pages 14 to 16 sit on the page the markers give. The working hypothesis that legacy UA page
  numbers were unreliable does not hold for this class. See OBS-02 of the GUR.

prior_extraction_note: >-
  Canonical holds 32 rows cited to UA 14, 15 and 16. Twenty-seven fall inside this packet's scope
  and all twenty-seven were confirmed by the fresh reading; none is re-emitted. The remaining five
  are WEAPON SPECIALIZATION rows cited to UA 15, a section this packet does not contain because
  the packet is scoped to the cavalier class rather than to whole printed pages. Its silence is
  therefore not evidence about where that section sits, and the question stays open until the UA
  book is packetized in full. One confirmed row, exp_level MODIFIES rule_hit_points with aspect
  "different dice if entering via the ranks", is a named subject of DEC-2026-0029 pair 2; the
  GUR's finding concludes its source endpoint is unsupported and proposes a corrected assertion.

status_note: >-
  Every edge in this packet's GUR carries status optional. Constitution 8 states that Unearthed
  Arcana is optional in its entirety, so no per-assertion judgement was needed. Several of these
  rules modify core mechanics directly, including the racial ability maximums and the sex-based
  limits, so a core-only filter drops them; see OBS-03 of the GUR.

source_id_note: >-
  ua-legacy-unspecified is the only source_id registered for this book in
  rulesets/adnd1e/registries/sources.yaml, and the Analyst may not mint a registry entry. Its
  recorded provenance is "legacy graph dump", which is not true of this packet: this is freshly
  supplied steward text. The discrepancy is recorded rather than resolved because it matters here.
  DEC-2026-0029 forbids legacy canonical data and archive extraction batches as source-read
  evidence, and this packet's whole purpose is to supply non-legacy evidence. A reader must not
  infer from the source_id that this reading is legacy-derived. Raised for Architect attention as
  ESC-CAND-01 in the GUR, identically to the DMG 64 packet; one registry change resolves both.

packet_metadata_origin: analyst_derived_at_claim
missing_supplied_inputs:
  - node_registry_slice.csv
  - local_neighborhood.json
  - general_rule_slice.json
missing_input_impact: >-
  Substantial, and it cost two rounds of correction. Filtering canonical on rows naming
  class_cavalier found twenty; pulling every row cited to pages 14 to 16 instead found 32. The
  twelve extra rows included rule_hospitality, rule_battleflag, rule_dishonor and
  cbt_encounter_reactions, four nodes this packet would otherwise have duplicated. Three proposed
  edges were withdrawn as paraphrases and one proposed node turned out to already exist. A
  supplied neighborhood keyed to the packet's pages rather than to a name filter would have caught
  all of it. The registry probe also established that no mundane weapon node or prefix exists
  anywhere in the graph, which is why the eleven preferred weapons and the lance weapon-type rules
  on these pages are unrepresentable; see ESC-CAND-02.
