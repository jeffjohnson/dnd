marker_note: >-
  This packet was delivered with all sixteen page markers already in place, p64 through p79,
  one per printed page and in ascending order with no gaps. No marker is malformed and none
  occurs in a table cell. Unlike PKT-PHB-040-042-spells-intro, no operator-supplied markers
  were needed and no page attribution rests on the printed table of contents, which OBS-19
  established carries at least one error.
marker_placement_resolution: >-
  Seven markers are end-of-line markers under SOURCE_MARKDOWN 1.3 rule 1 and start their
  whole containing block. Four of those sit on an Area of Effect or Explanation/Description
  line inside a spell entry, so the containing block, meaning the hard-break stat block or
  the description paragraph, begins on the new page while the spell's own heading remains on
  the preceding page. The remaining nine markers are inline under rule 3 and split their
  paragraph at the marker; for those spells the description begins on the earlier page and
  continues on the later one, and each citation was assigned by checking which side of the
  marker carries the cited evidence.
