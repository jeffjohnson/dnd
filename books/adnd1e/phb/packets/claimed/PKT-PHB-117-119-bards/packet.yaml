marker_note: >-
  Three markers, 117, 118 and 119. Two are end-of-line and take their whole containing block under
  SOURCE_MARKDOWN 1.3 rule 1; one is inline and splits its paragraph under rule 3.
marker_placement_resolution: >-
  The rule 3 marker is the one that matters. It falls inside the sentence about baneful magical
  writings, so the first half of that paragraph, covering which magic items a bard may use, is on
  118, and everything from the baneful-writing clause onward is on 119. The two rule 1 markers sit
  on the appendix heading and on the Notes Regarding Bards Table I heading, so TABLE I is entirely
  on 117 and everything from its notes to the magic-item paragraph is on 118.

prior_extraction_note: >-
  Canonical holds fifteen bard edges, all cited to PHB 117, covering the DM option, the six ability
  minimums, race, and the fighter-thief-druid progression. It holds nothing cited to PHB 118 or 119.
  This is the third appendix in a row with that shape; see OBS-01 of the GUR and the matching note
  in PKT-PHB-110-117-psionics.

status_note: >-
  Every edge in this packet's GUR carries status optional. Constitution 8 names the bard explicitly
  in its list of optional material, and the appendix opens by saying the class is offered as
  supplemental and that the DM is the final arbiter. Canonical already records that as
  rule_dm_discretion GATES class_bard at PHB 117, so the flag is not restated as an edge.

