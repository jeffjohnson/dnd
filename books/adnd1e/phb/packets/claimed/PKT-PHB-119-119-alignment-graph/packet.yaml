missing_input_impact: >-
  Decisive for this packet. The whole extraction turns on what the alignment subsystem already
  contains, and the answer was only obtainable by reading all 4,118 canonical edges: sys_alignment
  sits at degree 108, none of the nine alignment values exists as a node, and align_change and
  rule_alignment_change are a duplicate identity pair. A supplied local_neighborhood.json would
  have delivered all three facts. See BLK-02, OBS-04 and OBS-05 of the GUR.
