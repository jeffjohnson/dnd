marker_note: >-
  One marker, {#p119}, at the end of the appendix heading. Under SOURCE_MARKDOWN 1.3 rule 1 it
  places the whole heading on 119, and under the persistence rule that assignment remains in force
  for the rest of the packet since no later marker changes it. The bounds agree with the
  neighbouring packets: Appendix II ends on 119 and Appendix IV opens on 120. Every edge in the
  GUR cites 119.

extraction_shape_note: >-
  The smallest packet claimed so far at 903 bytes. In the printed book this appendix is a diagram
  rather than prose; the packet renders it as one descriptive paragraph plus two tables. The
  paragraph states the structure the diagram shows and is treated as source text under Incoming
  Packet Authority, but the distinction is recorded here and in OBS-01 of the GUR because it
  affects how much weight the Reviewer should place on its exact wording.

prior_extraction_note: >-
  rule_alignment_graph already exists at canonical with five edges, minted from PHB 33, PHB 34 and
  DMG 23-24. This appendix is therefore not a first encounter with the concept; it is the printed
  definition of a node the graph already uses. Candidates were checked against those five edges
  before emission.

