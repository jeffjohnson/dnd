# --- Extraction is blocked ---------------------------------------------------
extraction_status: blocked_on_identity
blocking_escalation: ESC-2026-07-30T15.16.18.973Z
blocking_summary: >-
  Of the 76 cleric spells, 29 match an existing canonical spell_ node by name and 47 do not.
  The 47 are ordinary node additions and are Builder and Reviewer work under DEC-2026-0003,
  so they are not escalated and do not block. The 29 matches are the block: 27 of the 183
  canonical spell_ nodes carry a label contradicting their own ID, and several are
  aggregates wearing a specific spell's ID, for example spell_cure_light_wounds labelled
  "Curative Spells" and spell_fireball labelled "Fire Spells". Constitution 3.1 says IDs
  determine identity, but the incident edges on those nodes were presumably written against
  the labels. Publishing roughly 130 edges on 29 unverified matches would inject the same
  class of defect ESC-2026-0001 already reports.
what_unblocks_it: >-
  A ruling on whether ID or label governs for the 27 divergent spell_ nodes. The parse is
  complete and preserved, so extraction resumes immediately once that is answered.

