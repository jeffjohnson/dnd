marker_note: >-
  One marker, {#p120}, at the end of the appendix heading. Under SOURCE_MARKDOWN 1.3 rule 1 it
  places the whole heading on 120, and the persistence rule carries that assignment through the
  rest of the packet since no later marker changes it. The printed contents places Appendix IV at
  120 and Appendix V at 122, so this packet occupies 120 and does not reach 122. Every edge in the
  GUR cites 120.

content_shape_note: >-
  Two thirds of the packet by item count is a numbered list of twenty-five planes, most of which
  carry a name and an alignment and no mechanic. The extractable material is concentrated in the
  four short prose sections on ethereal travel, astral travel and combat on either plane. Nineteen
  named planes were deliberately not minted as nodes; see OBS-02 of the GUR.

