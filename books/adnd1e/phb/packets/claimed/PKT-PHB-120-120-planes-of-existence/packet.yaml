missing_input_impact: >-
  Material. Six planar identities already existed in the registry, including rule_planar_travel,
  rule_ether_cyclone and rule_psychic_wind, and none of them would have been found without probing
  the registry by pattern for plane, astral, ethereal, cord, cyclone and psychic terms. A supplied
  node_registry_slice.csv is the intended way to surface them. See BLK-02 and IDQ-01.
