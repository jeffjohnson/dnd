missing_input_impact: >-
  Largest of any packet so far, and it changed the shape of the work rather than merely costing
  time. Establishing that PHB 111 to 116 was unextracted required reading every canonical edge and
  bucketing it by page; establishing that eleven psi_ nodes already existed, and which of them this
  appendix defines, required reading the whole registry. Resolving the q.v. targets required loading
  the candidate nodes of every published GUR in this book, because nine of them are spells this
  book's own earlier packets proposed and that are not yet canonical. A supplied
  node_registry_slice.csv and local_neighborhood.json would have delivered all three. See BLK-02.
