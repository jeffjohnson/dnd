marker_note: >-
  Eight markers, 110 through 117, one per printed page and no gaps. Under SOURCE_MARKDOWN 1.3 three
  are end-of-line and take their whole containing block under rule 1, and five are inline and split
  their paragraph under rule 3. No marker falls inside a table cell, so rule 2 is not exercised.
marker_placement_resolution: >-
  The three rule 1 markers matter because each lands on a block whose heading sits on the previous
  page. {#p113} ends the Area of Effect line of Hypnosis, so the Hypnosis heading is on 112 while its
  mechanics are on 113. {#p116} ends the Probability Travel description, so that heading is on 115
  while its mechanics are on 116. {#p112} is inline inside the Cell Adjustment description, so the
  heading and the opening clause are on 111 and the healing and disease costs are on 112. Every edge
  is cited to the page carrying the statement it rests on, not to the page carrying the heading.

extraction_shape_note: >-
  The largest packet in the book at 61,987 bytes, and the only one that is a subsystem rather than a
  chapter. It has three distinct shapes in sequence: framing prose with two mode tables, a random
  acquisition table, and then forty entries in spell-entry form, each with Range, Duration, Area of
  Effect, Strength Point Cost and Saving Throw followed by a description. The extraction pass is
  therefore spell-scan over the forty entries and page-sweep over the framing sections.

prior_extraction_note: >-
  Canonical already holds ten edges cited to PHB 110 and twenty-six cited to PHB 117, covering the
  psionic ability roll, the discipline framing, psionic combat, multiple operations, use of powers
  and recovery. It holds nothing at all cited to PHB 111 through 116. A prior pass captured the two
  ends of this appendix and none of its body: no attack mode other than Psionic Blast, no defense
  mode, and not one of the twenty-two minor devotions or eighteen major sciences exists as a node.
  See OBS-01 of the GUR.

status_note: >-
  Every edge in this packet's GUR carries status optional. Constitution 8 names psionics explicitly
  in its list of optional material, and the appendix opens by conditioning the whole subsystem on
  whether the DM opts to include it. Canonical already records that as
  rule_dm_discretion GATES sys_psionics at PHB 110, so the flag is not restated as an edge.

