marker_note: >-
  One marker, {#p122}, at the end of the appendix heading. Under SOURCE_MARKDOWN 1.3 rule 1 it
  places the whole heading on 122, and under the persistence rule that assignment remains in force
  for the rest of the packet since no later marker changes it. The printed contents places Appendix
  V at 122 and lists nothing after it, so there is no following section to bound the assignment and
  no inference was required. Every edge in the GUR cites 122.

status_note: >-
  Every edge in this packet's GUR carries status optional. The appendix is titled SUGGESTED
  AGREEMENTS and closes by stating that variations are of course possible and that a system should
  be agreed before play begins, which is the DM-option case constitution 8 describes. This is the
  first packet in the repository to use the optional flag, so the reasoning is recorded here as
  well as in the GUR's grain decisions; if the Reviewer reads a player agreement as core
  rules-as-written, every row flips together.

