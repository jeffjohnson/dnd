missing_input_impact: >-
  Most severe of any packet so far. This chapter names the graph's most heavily connected
  subsystems — encumbrance, movement, surprise, initiative, armour class, saving throws, morale,
  experience — so almost every endpoint already exists and correct reuse is the whole task. A
  supplied local_neighborhood.json would have made the duplicate check cheap; instead it was run
  against the whole of edges_master.csv, and sixteen of eighty-nine candidates turned out to
  restate existing assertions. See BLK-02.
