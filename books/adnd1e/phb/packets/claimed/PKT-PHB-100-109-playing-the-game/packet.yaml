marker_note: >-
  Nine markers: 100, 101, 102, 103, 104, 105, 106, 107 and 109. There is no {#p108}, and that is
  correct rather than a defect. The repository source steward confirmed on 2026-08-11 that printed
  page 108 is a full-page illustration carrying no rules text. SOURCE_MARKDOWN 1.3 requires a
  marker gap to be returned as ambiguous attribution rather than guessed, so the confirmation is
  recorded here on the steward's authority and no later worker should re-raise it. Content between
  the {#p107} and {#p109} markers is cited to 107 before the marker and 109 after it. Nothing in
  this packet is attributed to page 108.
marker_placement_resolution: >-
  Two markers are end-of-line and start their whole containing block under rule 1, one occurs in
  the last cell of a table row under rule 2, and six are inline and split their paragraph under
  rule 3. The table-row marker sits in the encumbrance table's third row, so that row and the rows
  after it are on 102 while the table's header and first rows are on 101.

extraction_shape_note: >-
  Unlike every packet claimed before it, this chapter has no repeating entry structure. It is
  continuous prose in twenty-two sections with six tables, so the extraction pass is page-sweep
  rather than spell-scan, and roughly a third of the text is player advice that yields no edges.

