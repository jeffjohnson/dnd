    question: Should 'rule_dual_class' be added to the canonical node registry? Builder may not mint node
      identity.
    edges_depending_on_it: *id001
    why_needed: 'The registry holds rule_multiclass at degree 14 but nothing for the human dual-class
      rule, which this packet gives a section of its own and which works differently: the character stops
      advancing in the original class rather than dividing experience between classes. Collapsing the
      two would make the graph unable to distinguish "what breaks if multi-classing changes" from "what
      breaks if dual-classing changes".'
