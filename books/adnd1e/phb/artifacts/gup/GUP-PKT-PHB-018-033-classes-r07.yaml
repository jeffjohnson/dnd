    - proposed_id: rule_dual_class
      proposed_label: The Character with Two Classes
      kind: rule
      why_needed: 'The registry holds rule_multiclass at degree 14 but nothing for the human dual-class
        rule, which this packet gives a section of its own and which works differently: the character
        stops advancing in the original class rather than dividing experience between classes. Collapsing
        the two would make the graph unable to distinguish "what breaks if multi-classing changes" from
        "what breaks if dual-classing changes".'
      edges_depending_on_it:
        - G3
