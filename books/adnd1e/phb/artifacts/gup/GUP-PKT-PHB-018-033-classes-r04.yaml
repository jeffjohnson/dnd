      routing_basis: returned to normal workflow by DEC-2026-0003
    - proposed_id: rule_quivering_palm
      proposed_label: Quivering Palm
      kind: rule
      why_needed: Added in r02 from the per-ability analysis in OBS-26. The monk's highest attack form,
        touching a victim to set up fatal vibrations under stated limits on frequency, target type and
        hit dice. No canonical node covers it and it is not a spell.
      edges_depending_on_it: []
      prefix_approved: true
      id_format_valid: true
      already_canonical: false
      label_collides_with: []
      disposition: reviewer_may_approve
      architect_required: false
      routing_basis: 'DEC-2026-0003: approved prefix and kind, valid ID, no duplicate'
    - proposed_id: rule_dual_class
      proposed_label: The Character with Two Classes
      kind: rule
      why_needed: 'The registry holds rule_multiclass at degree 14 but nothing for the human dual-class
        rule, which this packet gives a section of its own and which works differently: the character
        stops advancing in the original class rather than dividing experience between classes. Collapsing
        the two would make the graph unable to distinguish "what breaks if multi-classing changes" from
        "what breaks if dual-classing changes".'
      edges_depending_on_it:
        - G3
        - G4
        - G5
        - G6
      prefix_approved: true
      id_format_valid: true
      already_canonical: false
      label_collides_with: []
      disposition: reviewer_may_approve
      architect_required: false
      routing_basis: 'DEC-2026-0003: approved prefix and kind, valid ID, no duplicate'
      returned_to_workflow_by: DEC-2026-0003
    - proposed_id: rule_tracking
      proposed_label: Tracking
      kind: rule
      why_needed: Ranger tracking is a distinct procedure with its own underground and outdoor resolution,
        and no canonical node covers it. The registry's nearest matches, item_boots_varied_tracks and
        monster_slithering_tracker, are unrelated.
      edges_depending_on_it:
        - F19
