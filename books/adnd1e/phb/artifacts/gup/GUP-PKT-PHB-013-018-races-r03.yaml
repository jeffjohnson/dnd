      kind: rule
      why_needed: 'Dwarves, gnomes and halflings each have a table of underground detection abilities:
        slope, new construction, shifting walls, stonework traps, unsafe surfaces, depth and direction.
        No canonical node covers them. The nearest candidates in the registry, campaign_construction and
        rule_depth, mean unrelated things, the latter being water depth.'
