escalations:
  - kind: node_registration
    proposed_id: rule_racial_detection
    proposed_label: Racial Underground Detection
    question: Should 'rule_racial_detection' be added to the canonical node registry? Builder may not
      mint node identity.
    edges_depending_on_it: *id001
    why_needed: 'Dwarves, gnomes and halflings each have a table of underground detection abilities: slope,
      new construction, shifting walls, stonework traps, unsafe surfaces, depth and direction. No canonical
      node covers them. The nearest candidates in the registry, campaign_construction and rule_depth,
      mean unrelated things, the latter being water depth.'
  - kind: carried_from_gur
    id: ESC-2026-0003
    status: decided
    decision_id: DEC-2026-0001
    decision_summary: Approved. race_human is added under the existing race_ prefix. race_any remains
      the generic race concept and must not be used as the human identity. No constitution change. Migration
      of legacy race_any rows is scoped to Reviewer and Integrator, not to this GUR.
    filed_at: rulesets/adnd1e/escalations/pending/ESC-2026-0003.yaml
    filed_in_revision: 2
    filing_note: 'Raised in r01 inside this GUR and filed in r02 as a standalone artifact at operator
      instruction, so the Architect sees it without having to read a book packet''s GUR. The filed package
      is fuller than this summary: it adds the race_any audit question, per-option arguments, and the
      migration consequence of each ruling. It remains incomplete in one respect, the local graph neighborhood,
      which was not supplied.'
    trigger: ESCALATION_CONTRACT — "no existing node ID represents the concept and a new kind or prefix
      may be needed"
    originating: PKT-PHB-013-018-races / GUR-PKT-PHB-013-018-races-r01
    question: Should race_human exist? More broadly, should the graph carry nodes for the default case,
      or model defaults as the absence of edges?
    affected_canonical_ids:
      - race_any
      - race_dwarf
      - race_elf
      - race_gnome
      - race_half_elf
      - race_half_orc
      - race_halfling
    source_excerpt: Humans, PHB p17. "Human characters are neither given penalties nor bonuses, as they
      are established as the norm upon which these subtractions or additions for racial stock are based.
      Human characters are not limited as to what class of character they can become, nor do they have
      any maximum limit — other than that intrinsic to the class — of level they can attain within a class."
    local_neighborhood: not available; no slice supplied
    options_considered:
      - add race_human, so the seventh playable stock can carry its two stated rules
      - treat humans as race_any, which currently carries degree 49 and appears to serve as the generic
        race
      - model the human case as the absence of restriction edges and record nothing
    recommended_resolution: Add race_human. The book states two positive rules about humans and both are
      unattachable without it, and the absence of a node for the most-played race is likely to be felt
      again in packet 05. The Analyst notes but does not resolve the risk that race_any is already doing
      this job under a confusing name.
    expected_migration_impact: None to existing edges if added. If instead race_any is ruled to mean human,
      some of its 49 edges may be mis-scoped and would need review.
    would_change: registry
    blocking: no; one edge depends on it and it is declared as a candidate
