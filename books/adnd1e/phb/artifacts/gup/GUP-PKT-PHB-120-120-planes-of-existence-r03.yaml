node_changes:
  additions_proposed:
    - proposed_id: rule_ethereal_plane
      proposed_label: Ethereal Plane
      kind: rule
      why_needed: 'The appendix gives it a numbered entry, its own travel section and its own combat rules,
        and makes it mechanically distinct from the Astral: it permeates all the Inner Planes, spells
        cast from it reach the Prime Material, and damage taken on it is real. rule_planar_travel exists
        but is the activity, not the place; see IDQ-01.'
      edges_depending_on_it:
        - M002
        - M017
        - M020
      prefix_approved: true
      id_format_valid: true
      already_canonical: false
      label_collides_with:
        - rule_planar_travel
      disposition: reviewer_may_approve
      architect_required: false
      routing_basis: 'DEC-2026-0003: approved prefix and kind, valid ID, no duplicate'
    - proposed_id: rule_astral_plane
      proposed_label: Astral Plane
      kind: rule
      why_needed: 'Numbered entry with its own travel and combat sections, and defined against the Ethereal
        at every point: it touches only the Prime Material and the first layers of the Outer Planes, spells
        cast from it do not reach the Prime Material, and its damage destroys the astral body rather than
        the traveller.'
      edges_depending_on_it:
        - M004
        - M005
        - M006
        - M009
        - M014
        - M018
        - M021
      prefix_approved: true
      id_format_valid: true
      already_canonical: false
      label_collides_with: []
      disposition: reviewer_may_approve
      architect_required: false
      routing_basis: 'DEC-2026-0003: approved prefix and kind, valid ID, no duplicate'
    - proposed_id: rule_inner_planes
      proposed_label: The Inner Planes
      kind: rule
      why_needed: 'The appendix''s own first division, entries 1 to 8. Load-bearing because the Astral
        Plane''s defining limitation is stated against it: the Astral does not touch any Inner Plane other
        than the Prime Material.'
      edges_depending_on_it:
        - M005
      prefix_approved: true
      id_format_valid: true
      already_canonical: false
      label_collides_with: []
      disposition: reviewer_may_approve
      architect_required: false
      routing_basis: 'DEC-2026-0003: approved prefix and kind, valid ID, no duplicate'
    - proposed_id: rule_outer_planes
      proposed_label: The Outer Planes
      kind: rule
      why_needed: The appendix's second division, entries 9 to 25, and named as the source of alignment
        and the home of the deities. It is the endpoint the alignment system is sourced to.
      edges_depending_on_it:
        - M003
        - M006
      prefix_approved: true
      id_format_valid: true
      already_canonical: false
      label_collides_with: []
      disposition: reviewer_may_approve
      architect_required: false
      routing_basis: 'DEC-2026-0003: approved prefix and kind, valid ID, no duplicate'
    - proposed_id: rule_negative_material_plane
      proposed_label: Negative Material Plane
      kind: rule
      why_needed: Named as the source of power for undead, which is a mechanical dependency rather than
        cosmology. spell_negative_plane_protection already exists in the registry and implies the plane
        it protects against.
      edges_depending_on_it:
        - M001
      prefix_approved: true
      id_format_valid: true
      already_canonical: false
      label_collides_with: []
      disposition: reviewer_may_approve
      architect_required: false
      routing_basis: 'DEC-2026-0003: approved prefix and kind, valid ID, no duplicate'
    - proposed_id: rule_prime_material_plane
      proposed_label: Prime Material Plane
      kind: rule
      why_needed: The only Inner Plane the Astral touches, and the plane spells may or may not be cast
        into depending on which of the two transitive planes the caster occupies. Both asymmetries need
        it as an endpoint.
      edges_depending_on_it:
        - M022
      prefix_approved: true
      id_format_valid: true
      already_canonical: false
      label_collides_with: []
      disposition: reviewer_may_approve
      architect_required: false
      routing_basis: 'DEC-2026-0003: approved prefix and kind, valid ID, no duplicate'
    - proposed_id: rule_silver_cord
      proposed_label: Silver Cord
      kind: rule
      why_needed: The mechanism that ties an astral traveller to the material body. Snapping it kills
        irrevocably, and the appendix names both what can snap it and what merely destroys the astral
        body.
      edges_depending_on_it:
