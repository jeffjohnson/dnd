node_changes:
  additions_proposed:
    - proposed_id: rule_alignment_ethical_axis
      proposed_label: Ethical Axis
      kind: rule
      why_needed: 'One of the two coordinates the appendix says the graph plots alignments on, running
        from lawful through neutral to chaotic. It is load-bearing rather than descriptive: align_change
        CONSTRAINS sys_alignment is conditioned ''along like axis only'' (PHB 34) and spell_detect_balance
        FEEDS_INTO sys_alignment ''detects the neutral axis specifically'' (UA 42). Both assertions presuppose
        an axis that nothing in the graph currently names. Stem follows the existing rule_alignment_*
        family; see IDQ-01.'
      edges_depending_on_it:
        - M001
        - M003
      prefix_approved: true
      id_format_valid: true
      already_canonical: false
      label_collides_with: []
      disposition: reviewer_may_approve
      architect_required: false
      routing_basis: 'DEC-2026-0003: approved prefix and kind, valid ID, no duplicate'
    - proposed_id: rule_alignment_moral_axis
      proposed_label: Moral Axis
      kind: rule
      why_needed: The appendix's second coordinate, running from good through neutral to evil. Minted
        with the ethical axis because the two are stated together and because an alignment is only determined
        once both are read. item_crown_might GATES sys_alignment is keyed to 'an ethical alignment' (DMG
        157), which is a distinction that only means something if the moral axis is separately identified.
      edges_depending_on_it:
        - M002
        - M004
      prefix_approved: true
      id_format_valid: true
