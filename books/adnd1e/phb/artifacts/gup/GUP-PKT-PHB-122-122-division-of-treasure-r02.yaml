  additions_proposed:
    - proposed_id: rule_treasure_division
      proposed_label: Division of Treasure
      kind: rule
      why_needed: The whole subject of this appendix. It is the procedure that converts a party's recovered
        treasure into an individual character's share, and it is therefore what actually feeds xp_treasure.
        Three named systems, three modifiers and three magic-item schemes all attach to it. Nothing in
        the registry represents it; rule_treasure_placement is the DMG's rule for where treasure sits,
        not how it is split.
      edges_depending_on_it:
