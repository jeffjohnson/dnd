      proposed_label: Beguiling, Charm, Hypnosis, and Suggestion Spells
      kind: spell
      why_needed: 'REV-GUP-PKT-PHB-018-033-classes-r05-r01 repointed M5 here: Ability G explicitly enumerates
        four spell categories. The specific Charm Person ID cannot represent that family under DEC-2026-0015.'
      edges_depending_on_it:
