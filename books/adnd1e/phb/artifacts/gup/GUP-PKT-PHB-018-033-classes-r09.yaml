      architect_required: false
      routing_basis: 'DEC-2026-0003: approved prefix and kind, valid ID, no duplicate'
      returned_to_workflow_by: DEC-2026-0003
      reviewer_disposition: approved
      reviewer_basis: Source-supported procedure distinct from multiclassing; approved rule_ prefix and
        kind; valid ID; no canonical duplicate; DEC-2026-0003.
    - proposed_id: rule_tracking
      proposed_label: Tracking
      kind: rule
      why_needed: Ranger tracking is a distinct procedure with its own underground and outdoor resolution,
        and no canonical node covers it. The registry's nearest matches, item_boots_varied_tracks and
        monster_slithering_tracker, are unrelated.
      edges_depending_on_it:
        - F19
      prefix_approved: true
      id_format_valid: true
