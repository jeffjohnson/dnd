escalations:
  - kind: carried_from_gur
    id: ESC-2026-07-30T01.21.13.768Z
    trigger: ESCALATION_CONTRACT — "two canonical nodes appear ontologically equivalent and merging them
      could affect existing edges"
    originating: PKT-PHB-009-013-ability-scores / GUR-PKT-PHB-009-013-ability-scores-r01
    question: Two pairs of canonical nodes carry the same label and appear to denote the same mechanic.
      Should they be merged, and if so which ID survives?
    affected_canonical_ids:
      - pair: Loyalty Base
        ids:
          - abil_cha_loyalty_base
          - hench_loyalty
        degrees:
          - 1
          - 42
      - pair: Maximum Henchmen
        ids:
          - abil_cha_max_henchmen
          - hench_max_number
        degrees:
          - 3
          - 1
    source_excerpt: CHARISMA TABLE, PHB p13, columns "Maximum No. of Henchmen" and "Loyalty Base", with
      the notes stating that the former is the number of non-player characters who serve as permanent
      retainers and the latter is the adjustment to henchmen's loyalty scores.
    local_neighborhood: Not available. No local_neighborhood.json was supplied with the packet, so the
      Analyst can report degrees from the registry but cannot show the incident edges. This escalation
      is therefore incomplete against the ESCALATION_CONTRACT package requirements and should be completed
      by whoever holds the graph.
    options_considered:
      - merge into the hench_ node in both cases, on the grounds that the mechanic belongs to the henchman
        subsystem and charisma is merely its input
      - merge into the abil_cha_ node in both cases, on the grounds that these are columns of the Charisma
