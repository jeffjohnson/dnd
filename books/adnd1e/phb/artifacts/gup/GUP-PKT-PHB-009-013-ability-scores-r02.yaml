node_changes:
  additions_proposed:
    - proposed_id: rule_prime_requisite
      proposed_label: Prime Requisite Experience Bonus
      kind: rule
      why_needed: The packet states four times, once each for Strength, Intelligence, Wisdom and Dexterity,
        that a character whose prime requisite is high gains a bonus to earned experience. The registry
        has no node for this mechanic. rule_xp_division exists but concerns dividing awards among a party,
        which is a different thing. Forcing these four edges onto exp_level or onto the xp_ award-source
        nodes would misstate what the rule does.
      edges_depending_on_it:
        - S14
        - I11
        - W8
        - D19
      prefix_approved: true
      id_format_valid: true
      already_canonical: false
      label_collides_with: []
      disposition: reviewer_may_approve
      architect_required: false
      routing_basis: 'DEC-2026-0003: approved prefix and kind, valid ID, no duplicate'
      returned_to_workflow_by: DEC-2026-0003
    - proposed_id: rule_revivification_limit
      proposed_label: Lifetime Revivification Limit
      kind: rule
      why_needed: The Constitution section describes two distinct mechanics that a single node would conflate.
        rule_resurrection_survival, which exists, is the percentage roll made on each attempt. The packet
        separately establishes that a character's initial constitution score is a hard lifetime cap on
        how many times revivification may be attempted at all, that each success permanently reduces the
        score, and that later magical restoration of the score does not restore the cap. That is a resource
        ceiling, not a survival roll.
      edges_depending_on_it:
        - C5
      prefix_approved: true
      id_format_valid: true
      already_canonical: false
      label_collides_with: []
      disposition: reviewer_may_approve
      architect_required: false
      routing_basis: 'DEC-2026-0003: approved prefix and kind, valid ID, no duplicate'
      returned_to_workflow_by: DEC-2026-0003
