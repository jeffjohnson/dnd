  - M011
- proposed_id: rule_death
  proposed_label: Death
  kind: rule
  why_needed: Also proposed by GUR-PKT-PHB-100-109-playing-the-game-r01. The second modifier here turns
    on incapacity or death bounding which treasure a character may share in.
  edges_depending_on_it:
  - M007
