source_summary: 'PHB 122, Appendix V. One printed page in three parts: three named agreements for splitting
  treasure, three modifiers that adjust a character''s eligibility, and three schemes for parcelling magic
  items followed by a dicing procedure for choosing among the parcels.'
node_id_resolution_method: No registry slice was supplied. Every named mechanic was searched by ID and
  by label in the registry and canonical nodes_master. Three endpoints had no identity and are proposed.
grain_decisions:
- decision: Every edge in this GUR carries status optional.
  basis: Constitution 8, which flags as optional anything the text marks a DM option, and whose stated
    purpose is that filtering on core yields a rules-as-written game.
  how_applied: The appendix is titled SUGGESTED AGREEMENTS and closes by saying variations are of course
    possible and that a system should be agreed before play. Nothing here binds a table that chooses a
    different split. This is the first packet in the repository to use the optional flag, so it is called
    out rather than applied silently; if the Reviewer reads a player agreement as core rules-as-written,
    every row flips together.
- decision: The three agreements and three magic-item schemes are not separate nodes.
  basis: Constitution 2 and 3. They are alternative arithmetic for one procedure, and the difference between
    them is entirely in the numbers.
  how_applied: One node, rule_treasure_division, carries the procedure. Which agreement is in force appears
    as an edge condition where it changes the dependency, as on the shares-by-level edge.
- decision: No magnitude appears in any aspect or condition.
  basis: Constitution 2 and GRAPH_INVARIANTS 11.
  how_applied: The halves, quarters and multiples that fill this appendix are all removed; the aspects
    name which facet is touched, such as counted as a part character.
candidate_nodes:
- proposed_id: rule_treasure_division
  proposed_label: Division of Treasure
  kind: rule
  why_needed: The whole subject of this appendix. It is the procedure that converts a party's recovered
    treasure into an individual character's share, and it is therefore what actually feeds xp_treasure.
    Three named systems, three modifiers and three magic-item schemes all attach to it. Nothing in the
    registry represents it; rule_treasure_placement is the DMG's rule for where treasure sits, not how
    it is split.
  edges_depending_on_it:
  - M001
  - M002
  - M003
  - M004
  - M005
  - M006
  - M007
  - M008
  - M009
