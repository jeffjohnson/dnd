non_edge_observations:
- id: OBS-01
  topic: this appendix is the missing link between treasure and experience
  finding: The EXPERIENCE section on page 106 awards experience points for treasure gained by a character.
    This appendix is the only place in the book that says how a party's recovered treasure becomes an
    individual character's holding.
  why_it_matters: xp_treasure FEEDS_INTO exp_level already exists in canonical from the DMG. The edge
    proposed here sits upstream of it and is the reason a character's share, rather than the party's haul,
    is what converts. It is the only inferred_rule edge in the GUR and the one most worth the Reviewer's
    attention.
- id: OBS-02
  topic: the forfeiture modifier has no endpoint
  finding: A character who obstructs the party, attacks its members, or causes a member's death forfeits
    part or all of a share.
  why_it_matters: No edge is proposed. The trigger is a judgment about player conduct rather than a mechanic,
    and there is no node for it; sys_alignment is the nearest existing endpoint and would be wrong, since
    the rule turns on behaviour toward the party and not on alignment. Recorded so the omission is visible
    rather than silent.
- id: OBS-03
  topic: the packet is one printed page and carries one marker
  finding: A single {#p122} marker on the appendix heading, which under SOURCE_MARKDOWN 1.3 rule 1 places
    the whole heading and, by the persistence rule, everything after it on page 122.
  why_it_matters: The printed contents places Appendix V at 122 and lists nothing after it, so there is
    no following marker to bound the assignment. Every edge in this GUR cites 122 and no inference was
    needed.
- id: OBS-04
  topic: a mint was avoided by probing the registry before proposing
  finding: rule_two_class was drafted as a candidate node from the appendix's phrasing and withdrawn when
    rule_dual_class was found already registered at degree 25.
  why_it_matters: Constitution 3.2 names singular and plural variants and same-concept-different-prefix
    pairs as the commonest source of drift, and this packet was supplied without the registry slice that
    would normally prevent it. Recorded as evidence that the missing input in BLK-02 has real consequences,
    not just procedural ones.
- id: OBS-ASPECT-02
  topic: revision 2 exists only to bring aspects within constitution 5
  finding: The Builder graded aspect_word_count as an error under DEC-2026-0029 and returned this packet.
    10 of this GUR's aspects ran to five words or more.
  why_it_matters: Each replacement names the facet the cited section touches, re-derived from that section
    in the claimed source rather than produced by shortening the previous string, as DEC-2026-0029 requires.
    This packet was not returned; the rows were graded warning before the Decision and would fail on the
    next compile, so they are corrected now rather than left to bounce. No edge was added, dropped or
    re-pointed; the set was re-checked against canonical and against itself with no collision.
  owner: analyst
- id: OBS-REV-R03
  topic: two modifier-semantic corrections and the inference premise
  finding: REV P122-R03-B1 and B2. Multi-class levels and the henchman fraction both change the number
    the division produces, so FEEDS_INTO and CONSTRAINS understated them; both are now MODIFIES with authored
    neutral polarity read from the text, which sets no direction of benefit. M001 now carries its inference
    premise explicitly.
  why_it_matters: M001 is the only inferred_rule row in this GUR. The appendix never mentions experience;
    the link exists because EXPERIENCE on page 106 awards points for treasure gained by a character rather
    than by the party. That premise is now on the row as inference_locus rather than only in prose, so
    a later reader can check the inference against both loci without re-reading the GUR narrative.
  owner: analyst
blocking_notes:
- id: BLK-02
  note: No node_registry_slice.csv, local_neighborhood.json or general_rule_slice.json accompanied this
    packet.
  impact: Does not block this GUR.
completeness_statement: All three sections, all nine numbered items and the closing dicing procedure were
  read and considered. Every candidate edge cites PHB 122 and a section. No aspect or condition contains
  a magnitude. Authored polarity appears only on MODIFIES and CONSTRAINS, always with basis read. Every
  edge carries status optional for the reason given in the first grain decision. One edge is classified
  inferred_rule and is called out in OBS-01. One modifier is deliberately not represented; see OBS-02.
