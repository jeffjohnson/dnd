completeness_statement: 'All 78 spell entries and the preamble were read. The packet proposes 63 edges:
  six from the mistletoe preamble and 57 caster-level scaling edges under DEC-2026-0017. A further 4 scaling
  edges were withdrawn as exact canonical duplicates, because the druid and cleric lists share those spells
  and packet 10 already contributed them. It proposes 61 nodes: three rules and 58 spells; 20 spell names
  resolve to existing IDs and are reused. Three bulk patterns were considered and not emitted, each recorded
  with its reason: a class GATES spell edge per spell, a material-component edge per spell, and a cross-reference
  edge per cross-referenced entry. No candidate collides with canonical under the five-field assertion
  key governed by DEC-2026-0020, and no within-packet identity repeats.'
