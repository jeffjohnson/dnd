source_summary: PHB 54 to 64, the druid spell chapter. A short preamble on mistletoe as the druidic material
  component, then 78 spell entries across seven levels, twelve at each of the first four levels and ten
  at each of the last three. Every entry carries all seven stat fields and an Explanation/Description.
node_id_resolution_method: Each spell name was cleaned of its school parenthetical and the word Reversible,
  then slugged and looked up in the registry by ID, and separately by label. 20 resolve to existing spell_
  nodes and 58 do not.
candidate_nodes:
- proposed_id: rule_mistletoe
  proposed_label: Mistletoe
  kind: rule
  why_needed: 'The packet''s preamble makes mistletoe a graded mechanic rather than flavour: four named
    grades, each reducing spell range, duration and area by a stated amount or granting the target a saving-throw
    bonus instead. Nothing in the registry carries it. Canonical row 2648 mentions mistletoe inside an
    aspect string on rule_holy_symbol but does not give it identity.'
  edges_depending_on_it:
