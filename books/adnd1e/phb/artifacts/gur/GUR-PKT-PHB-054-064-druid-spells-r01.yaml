near_matches_vs_canonical:
  note: Same source, type and target as an existing canonical row but a different facet. DEC-2026-0020
    makes these near matches rather than duplicates, and the Reviewer decides whether each facet is independently
    supported. Listed so that decision does not depend on the Builder rediscovering them.
