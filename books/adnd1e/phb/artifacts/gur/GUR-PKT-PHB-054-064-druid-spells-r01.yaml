decisions_applied:
  DEC-2026-0017:
    ruling_applied: One exp_level MODIFIES spell_<id> per spell whose own entry explicitly scales an effect
      with caster experience level, with no magnitude in aspect or condition.
    spells_that_scale: 61
    spells_in_packet: 78
    scaling_edges_emitted: 57
    scaling_edges_withdrawn_as_canonical_duplicates: 4
    spells_that_do_not_scale: 17
    rejections_recorded: 0
    why_no_rejection_here: Packet 10 recorded one rejection because Command names the target's level rather
      than the caster's. Every level phrase in this packet is the druid's own level. The 17 spells that
      do not scale simply say nothing about level.
    polarity_note: 'All 61 are authored improves with basis read. Transport Via Plants is the one that
      needed care: higher level reduces the chance of being delivered to the wrong plant, so the number
      named in the source goes down as level goes up. Its aspect is written as delivery accuracy rather
      than misdelivery chance so that the edge reads true as source polarity target.'
  DEC-2026-0020:
    ruling_applied: Identity is the normalized five-field assertion key. Every candidate was checked against
      canonical under that key using the Builder's own assertion_key function; none collides.
non_edge_observations:
- id: OBS-57
  topic: the level sweep undercounted again, and the shape of the miss was new
  locus: the whole packet
  finding: 'The first sweep used the phrase list that packet 10 ended up with: per level, each level,
    every level, level of experience, experience level. It found 39 of 78. The true figure is 61. The
    23 it missed state the dependency only in the stat block, in the shorthand form Duration: 1 turn/level
    or Range: 4 inches/level, which contains no word the pattern looks for.'
  why_it_matters: 'IDQ-14 in packet 10 undercounted by the same kind of error and the Architect ruled
    on the wrong number. That miss was corrected by adding phrasings. This one would not have been caught
    by adding more phrasings, because the shorthand is punctuation rather than words. The lesson from
    OBS-48 is what caught it: the sweep''s output was checked against the spells it excluded rather than
    only against the ones it found.'
  what_was_done: Both classes are now swept, and every one of the 23 shorthand-only matches was printed
    with the field it came from and read individually. All 23 are genuine caster-level scaling.
  owner: analyst
- id: OBS-58
  topic: eighteen entries say a spell is the same as a cleric or magic-user spell, and that is not an
    edge
  locus: throughout
  finding: 'Eighteen entries consist mostly of a cross-reference: cure light wounds is the same as the
    cleric spell, dispel magic is the same as the cleric spell, and so on. The obvious move is a CROSS_REFERENCES
    edge from the druid spell to the cleric spell.'
  why_it_was_not_done: Those are not two nodes. A spell node is identified by the spell, not by the class
    that casts it, so the druid's cure light wounds and the cleric's cure light wounds resolve to the
    same spell_cure_light_wounds. The edge would be a self-edge, which Builder instruction 11 permits
    only with explicit justification and which would assert nothing. What the cross-reference actually
    establishes is that the druid spell list overlaps the cleric list, which canonical already carries
    as class_druid DERIVED_FROM class_cleric at row 170.
  what_would_change_this: 'If the ruleset ever needs per-class spell variants as distinct nodes, these
    eighteen are where the need shows up first, because several of them state a real difference: the druid
    version requires mistletoe, and control weather changes the weather by two places rather than one.
    Recorded so that decision has evidence when it arrives.'
  owner: reviewer
- id: OBS-59
  topic: no per-spell material-component edges, for the same reason as packet 10
  locus: throughout
  finding: Most entries name a material component and the preamble says all druid spells with a material
    component assume mistletoe. That is one rule, not 78 edges.
  why_it_matters: 'Canonical row 446 already carries rule_druid_spells CONSUMES spell_component_material
    from PHB 40 with the aspect ''all druid spells require''. M2 adds what this packet contributes and
    canonical does not have: that the component in question is specifically mistletoe.'
  owner: reviewer
- id: OBS-60
  topic: two spell IDs this packet reuses are mislabelled in the registry, and both are already decided
  locus: Cure Light Wounds at PHB 56 and Confusion at PHB 63
  finding: 'Of the 20 spells resolving to existing IDs, two carry a registry label that contradicts the
    name: spell_cure_light_wounds is labelled Curative Spells and spell_confusion is labelled Confused.
    That is the defect class that blocked packet 10.'
  why_it_does_not_block_here: DEC-2026-0015 already decided both. spell_cure_light_wounds is retained
    and relabelled Cure Light Wounds with the category split to spell_curative_spells, and spell_confusion
    is retained and relabelled Confusion with the condition split to rule_confused_condition. After that
    migration both IDs mean exactly what this packet needs, so the correct action is to reuse them and
    wait, not to escalate a settled question.
  the_dependency_worth_stating: That migration is blocked. DEC-2026-0021 holds the DEC-2026-0015 identity
    migration in full until sixteen DMG and UA polarity readings are integrated, and those need DMG and
    UA packets that do not exist. So this packet reuses two IDs whose labels will stay wrong for as long
    as that holds. Nothing here needs to change when it lifts.
  owner: reviewer
