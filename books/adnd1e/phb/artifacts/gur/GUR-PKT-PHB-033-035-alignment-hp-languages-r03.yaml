completeness_statement: >-
  The whole packet was read before extraction, and its page markers, headings and tables
  were checked mechanically for sequence, duplication and column consistency before
  reading. Every proposed edge carries a book, page and section citation and an evidence
  class. No magnitude reached any aspect or condition field. Authored polarity appears on
  the three permitted edge types only. The generated edge set was checked for duplicate
  source, type and target triples before assembly and contains none. Every overlap with an
  earlier packet was checked against the specific edge reference rather than assumed, and
  the overlaps found are recorded rather than silently dropped. Deduplication against the
  canonical graph remains outstanding and could not be performed at extraction time.

# =============================================================================
# DOWNSTREAM NOTES  (added 2026-07-30, after the GUR body was written)
# =============================================================================
downstream_notes:
  purpose: >-
    Builder and Reviewer startup does not read books/<book>/reports/, so a finding recorded
    only there would never reach them. This block is a pointer, not a verdict.
  dedupe_report:
    path: books/adnd1e/phb/reports/DEDUPE-PHB-20260729.md
    what_it_is: >-
      Every edge proposed across all PHB GURs, compared against the 3,809-edge canonical
      graph on three tests: exact duplicate triple, type conflict on the same ordered pair,
      and direction conflict on the reversed pair. Across all PHB GURs, 115 of 389 proposed
      edges duplicate a canonical triple exactly, 35 are type conflicts and 20 are direction
      conflicts.
    why_it_exists: >-
      No packet was ever supplied with a local_neighborhood.json, so no Analyst could run
      this check at extraction time. It is BLK-02, run once after the fact.
    what_builder_should_do: >-
      Consult it before normalising this GUR. Exact duplicates should generally be dropped
      from the GUP; where the canonical row cites a different book, prefer adding this
      packet's citation to the existing row over discarding a second independent witness.
    what_reviewer_should_do: >-
      The direction conflicts are classified in the report into four classes with a
      disposition for each. Class B is not a conflict at all and both sides should be kept.
      Class D is a flat PHB-versus-DMG contradiction on two rows.
  no_verdicts_embedded: >-
    This GUR has not been edited to mark individual edges as duplicates. Whether an
    assertion is already held by the graph is a normalisation determination owned by
    Builder and Reviewer; recording it in an interpretive artifact would put the decision
    in the wrong role.

# =============================================================================
# POST-DECISION SCOPE CORRECTION  (added r02)
# =============================================================================
edges_in_scope_of_DEC_2026_0011:
  decision: rulesets/adnd1e/escalations/decisions/DEC-2026-0011.yaml
  why_these_were_missed: >-
    DEC-2026-0011's scope was the fifteen direction cases listed in
    books/adnd1e/phb/reports/DEDUPE-PHB-20260729.md. That report classifies a proposed edge
    only by comparison against the canonical graph, so an edge expressing the same shape but
    having no canonical counterpart produced no finding and entered no list. Two such edges
    are in this GUR. The gap is in the report's method, not in the decision.
  applied_in_r03: >-
      Both refs below were normalised in r03 rather than left for Builder, at operator
      authorisation. A3 became MODIFIES as the ruling indicates; A6 became GATES, not
      MODIFIES, because canonical and the source both support a gate. The entries below are
      retained as the record of why each was in scope.
  refs:
    - ref: A3
      proposed: rule_hit_points DERIVED_FROM exp_level
      under_the_ruling: >-
        exp_level is an input that changes a mechanic through a table, one hit die per
        level, so the ruling indicates exp_level MODIFIES rule_hit_points.
      analyst_note: >-
        Not flipped here. Builder owns normalisation under the decision, and unlike the
        eight direct cases this triple has no canonical counterpart, so the outcome is a
        re-typed edge rather than a deduplication. Builder should confirm which.
    - ref: A6
      proposed: rule_alignment_languages DERIVED_FROM sys_alignment
      under_the_ruling: >-
        Alignment selects which dialect is spoken, which is a direct lookup from an input,
        so the ruling indicates sys_alignment MODIFIES rule_alignment_languages.
      interaction_with_A7: >-
        A7 already asserts sys_alignment CONSTRAINS rule_alignment_languages, that only one
        dialect may be spoken. If A6 is re-typed to MODIFIES the two share an ordered pair
        with different types, which invariant 12 permits since it forbids only a repeated
        source, type and target triple. They remain two distinct assertions, which dialect
        and how many, and IDQ-10 of r01 already flagged that a Reviewer may reasonably fold
        them. That question is unaffected by DEC-2026-0011 and is still open.
  recommendation_to_reviewer: >-
    The report's classifier should be extended to flag DERIVED_FROM edges against the ruling
    directly, not only where canonical disagrees. Otherwise the next packet reproduces this
    gap. Two edges here; the spell packets will produce many more, since spell level, casting
    time and saving throw are all table lookups from a spell.
