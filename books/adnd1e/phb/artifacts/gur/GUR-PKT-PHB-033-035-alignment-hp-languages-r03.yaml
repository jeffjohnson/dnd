revision_reason: >-
  Operator authorised the Analyst to normalise GURs the Builder has not yet picked up. r02
  identified A3 and A6 as falling under DEC-2026-0011 but left them for Builder. r03 applies
  the ruling. Checking each against canonical first changed one of the two answers: A6 is not
  a MODIFIES case at all. Canonical already holds sys_alignment GATES rule_alignment_languages
  at DMG p24, and a binary determination of which tongue is known is a gate, not a
  modification. DEC-2026-0011 rules out DERIVED_FROM for input-to-mechanic; it does not make
  every such edge MODIFIES. A6 is retyped to GATES to match the canonical reading rather than
  to a type no evidence supports.
revision_reason: >-
  DEC-2026-0011 ratifies input MODIFIES mechanic for table-driven dependencies and reserves
  DERIVED_FROM for lookup lineage between separately represented concepts. That decision
  returned fifteen direction cases to Builder, drawn from the dedupe report. A3 and A6 of
  this GUR fall under the same rule but were in neither set, because the dedupe pass
  classifies by comparison against canonical and these two have no canonical counterpart to
  disagree with. They were therefore invisible to both the report and the decision. r02
  records them so Builder normalises them under the same rule rather than missing them. No
  edge is flipped by the Analyst; DEC-2026-0011 assigns that to Builder.
