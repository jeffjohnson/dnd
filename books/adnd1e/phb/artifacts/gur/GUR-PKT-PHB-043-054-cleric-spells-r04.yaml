- id: BLK-02
  severity: severe and now cumulative
  issue: no node_registry_slice.csv and no local_neighborhood.json supplied, for the sixth packet running.
  consequence: For this packet the missing slice did real damage rather than creating rework, and it is
    worth being precise about how. A supplied slice of the 183 spell_ nodes would have shown the label
    divergence before extraction rather than after, which is what produced the escalation that was returned
    as incomplete. It would also have shown the nine existing PHB 43 to 54 rows, which the Analyst found
    only by looking.
  owner: packet_creator
completeness_statement: 'All 76 spell entries were parsed from the Pandoc AST and every one of the seven
  header fields was captured: Level 76, Range 76, Duration 76, Area of Effect 75, Components 76, Casting
  Time 76, Saving Throw 76. The single missing Area of Effect is Astral Spell, which has no such line
  in the source; no proposed edge depends on that field. The preamble was read in full and yields three
  of the seventeen edges.

  Twenty candidate edges are proposed and forty-nine candidate nodes, of which forty-eight are spells
  and one is Magic Resistance. Four assertions the packet genuinely witnesses are held back because canonical
  already carries them, each with the row it duplicates. Four candidate groups are recorded as rejected
  with reasons, one of them a deferral recorded as OBS-43 rather than a refusal.

  r01 held two spells of 76 pending ESC-2026-07-31T04.35.02.574Z; r02 releases them under DEC-2026-0015
  and all 76 are now extracted. That escalation supersedes the returned ESC-2026-07-30T15.16.18.973Z,
  which had claimed the whole packet was blocked. It was not. Of the 28 spells matching an existing node,
  26 match a node whose label agrees with its ID and only Cure Light Wounds and Hold Person do not.

  Every proposed edge was checked against the 3,809-row canonical graph for an existing identity triple
  and none collides. No duplicate identity triple exists within the proposal. No aspect or condition contains
  a numeral.

  r03 adds no edges and changes no page. It records the operator ruling that the claimed packet is authoritative
  for page attribution, closes OBS-44 with that answer, and adds OBS-46 for the repository-wide check
  the ruling made worth running.

  r04 fixes the four defects the Builder''s validation surfaced. No edge is added or removed and no page
  changes. D3 gains its required supersession_basis, five aspects are shortened to within the 1-4 word
  limit with the original wording retained on each edge as aspect_was, D4 is repointed from a proposed
  node to the existing magic_resistance, and the node count falls from 49 to 48.'
downstream_notes:
  purpose: Builder and Reviewer startup does not read books/<book>/reports/, so this block points at what
    they would otherwise miss.
  what_builder_should_do: Emit the 17 candidate edges and register the 49 candidate nodes. Do not emit
    the four entries in canonical_duplicates_not_for_emission; three of them carry a recommendation to
    add this packet's citation to the existing row instead. Do not emit H1 or H2.
  what_reviewer_should_do: OBS-44 is closed and no longer needs a decision. This GUR's pages are authoritative
    under the operator ruling and will disagree with seven neighbouring canonical rows about the same
    spells until ESC-2026-07-31T17.05.43.998Z is applied. That is expected and is not a defect in this
    artifact.
  dedupe_report:
    path: books/adnd1e/phb/reports/DEDUPE-PHB-20260729.md
    note: Predates this packet and does not cover it. The equivalent check was run inline here against
      all 3,809 canonical rows.
revision_reason: 'GUP-PKT-PHB-043-054-cleric-spells-r01 was blocked on D3 with supersession_basis_required,
  invariant 20. That is an Analyst defect: every OVERRIDES edge needs a supersession_basis and D3 carried
  an empty one. r04 supplies it. The same validation run surfaced three further defects that are the Analyst''s
  to fix and not the Builder''s to guess at, so they are fixed here rather than left to resurface: five
  aspects exceeded the 1-4 word limit in constitution section 5, D4 proposed a new node for a concept
  that already has a 97-degree canonical node, and the declared constitution version was 1.5 against a
  compiler now on 1.6.'
