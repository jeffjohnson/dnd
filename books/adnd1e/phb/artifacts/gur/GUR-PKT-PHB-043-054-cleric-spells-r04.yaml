    effect_on_this_packet: Both held identities are ratified as the specific spells. spell_cure_light_wounds
      means Cure Light Wounds, with the category assertion moving to the newly authorised spell_curative_spells.
      spell_hold_person means Hold Person, with the two condition assertions moving to rule_immobile.
    what_this_gur_must_not_do: The migration itself is Builder work under a single reviewed package, per
      the decision coordination constraints, and the Integrator alone touches nodes.csv and the canonical
      files. None of the seven newly authorised nodes is re-proposed here; they are the decision's, not
      this packet's.
    constitution_1_5: spell_ now explicitly covers source-named spell families using a plural or category-specific
      stem. No node proposed by this packet is a family, so nothing here changes shape.
