source_summary: 'PHB 119, Appendix III. The smallest packet in the book at 903 bytes: one descriptive
  paragraph and two tables. The paragraph states that the graph plots the nine alignments on two axes,
  ethical running lawful to chaotic and moral running good to evil, with absolute neutrality at the centre.
  The first table is the three-by-three grid of alignments; the second gives the extreme descriptor at
  each of the four corners.'
node_id_resolution_method: No registry slice was supplied. Every node in canonical and in the registry
  was matched against the alignment vocabulary of this packet, and all 4,118 canonical edges touching
  sys_alignment were read. Two facts governed the extraction. First, rule_alignment_graph already exists
  with five edges, so this appendix defines a node the graph is already using rather than introducing
  one. Second, no node exists for either axis or for any of the nine alignment values; alignment values
  are carried as condition text on sys_alignment edges throughout. The two axes are therefore proposed
  and the nine values are not; see OBS-05.
grain_decisions:
- decision: The nine alignments do not become nodes.
  basis: 'Constitution 3.2 reuse-over-mint and the established shape of the graph. sys_alignment carries
    108 edges and expresses every alignment value as condition text: ''lawful good only'', ''evil only'',
    ''must remain neutral'', ''non-lawful'', ''non-good at start''. Not one of the nine exists as a node.'
  how_applied: The appendix supplies no mechanic that attaches to an individual alignment. It supplies
    the structure the values sit in, which is what was extracted. Minting nine value nodes would change
    how those 108 edges are expressed, which is an ontology change and not the Analyst's to make; the
    question is recorded in OBS-05 with a position rather than improvised here.
- decision: The four corner descriptors do not become nodes.
  basis: The core test. Saintly, Beatific, Diabolic and Demoniac name the extremity of a corner and nothing
    reads them. No node in canonical or the registry matches any of the four.
  how_applied: Declined and recorded in OBS-02. What the corners do carry mechanically, that the graph
    is a space in which alignments are more or less distant, is recorded in OBS-03.
- decision: Status is core.
  basis: Constitution 8, which flags what the text marks a DM option. Nothing in this appendix is optional;
    every character has an alignment and the axes are how it is stated.
  how_applied: All four edges carry status core.
- decision: No magnitude appears in any aspect or condition.
  basis: Constitution 2 and GRAPH_INVARIANTS 11.
  how_applied: The counts in the source, nine alignments, two axes, four corners, appear only in the source
    summary and the observations. No aspect names a number, a position or a coordinate value.
candidate_nodes:
- proposed_id: rule_alignment_ethical_axis
  proposed_label: Ethical Axis
  kind: rule
  why_needed: 'One of the two coordinates the appendix says the graph plots alignments on, running from
    lawful through neutral to chaotic. It is load-bearing rather than descriptive: align_change CONSTRAINS
    sys_alignment is conditioned ''along like axis only'' (PHB 34) and spell_detect_balance FEEDS_INTO
    sys_alignment ''detects the neutral axis specifically'' (UA 42). Both assertions presuppose an axis
    that nothing in the graph currently names. Stem follows the existing rule_alignment_* family; see
    IDQ-01.'
  edges_depending_on_it:
  - M001
  - M003
- proposed_id: rule_alignment_moral_axis
  proposed_label: Moral Axis
  kind: rule
  why_needed: The appendix's second coordinate, running from good through neutral to evil. Minted with
    the ethical axis because the two are stated together and because an alignment is only determined once
    both are read. item_crown_might GATES sys_alignment is keyed to 'an ethical alignment' (DMG 157),
    which is a distinction that only means something if the moral axis is separately identified.
  edges_depending_on_it:
  - M002
  - M004
