canonical_duplicates_not_for_emission:
- assertion: rule_alignment_graph -[FEEDS_INTO]-> sys_alignment
  canonical_row: 1643
  canonical_aspect: graph defines the oppositions
  canonical_locus: 'DMG p23, Major Divisions:'
  packet_aspect: the nine alignments are its cells
  packet_locus: 'PHB p119, APPENDIX III: CHARACTER ALIGNMENT GRAPH'
  why_not_emitted: Withheld by hand rather than by key. The appendix's sentence that the graph plots the
    nine alignments is the same assertion the canonical DMG 23 row already makes as 'graph defines the
    oppositions'. The two wordings would not collide on the constitution 5.1 key, so an automatic check
    would have passed them both; emitting it would have restated one fact twice. If the Reviewer wants
    the PHB locus recorded for an assertion currently sourced only to the DMG, the right instrument is
    a citation correction on the existing row, not a second edge.
