unresolved_identity_questions:
- id: IDQ-01
  subject: 'prefix for the two axis nodes: align_ or rule_alignment_'
  question: The alignment subsystem is split across two prefixes. rule_ holds rule_alignment_graph, rule_alignment_change
    and rule_alignment_languages. align_ holds exactly one node, align_change, which is itself a duplicate
    of rule_alignment_change (OBS-04). Both were available for the axes.
  analyst_position: Minted as rule_alignment_ethical_axis and rule_alignment_moral_axis. The rule_alignment_*
    stem is the established family, matches the node these axes attach to, and does not grow a one-member
    prefix whose only occupant may be withdrawn when the duplicate is resolved. If the Architect instead
    rules that align_ is the correct home for the subsystem, these two are cheap to rename before integration,
    since nothing else depends on them yet.
  affects:
  - M001
  - M002
  - M003
  - M004
architectural_escalations: []
non_edge_observations:
- id: OBS-01
  topic: the appendix is a diagram and the packet renders it as prose
  finding: In the printed book Appendix III is a graph. The packet supplies a descriptive paragraph stating
    what the graph plots, followed by the grid and the corner list as markdown tables.
  why_it_matters: The four edges are read from the paragraph, and the paragraph describes a picture rather
    than reproducing printed sentences. The relationships it states are exactly what the two tables show
    independently, so the extraction does not rest on the paragraph alone. Recorded so the Reviewer does
    not weigh the paragraph's precise wording as printed rules language. Treated as source under SOURCE_MARKDOWN
    1.3 Incoming Packet Authority; not re-authored.
- id: OBS-02
  topic: the four corner descriptors yield nothing
  finding: Saintly, Beatific, Diabolic and Demoniac are given for Lawful Good, Chaotic Good, Lawful Evil
    and Chaotic Evil. No node in canonical or the registry matches any of the four and no rule reads them.
  why_it_matters: Declined under the core test. Listed so a later extractor can see the second table was
    read and considered rather than skipped.
- id: OBS-03
  topic: this appendix is the geometry two DMG assertions already depend on
  finding: 'Naming the corners as extremes makes the graph a space with distance in it. Two canonical
    edges already measure that distance: sys_alignment MODIFIES hench_loyalty, ''penalty grows with places
    removed'' (DMG 37), and sys_alignment TRIGGERS cbt_damage, ''touching the talisman injures by alignment
    distance'' (DMG 155).'
  why_it_matters: 'Both assertions are unsupported by anything in the graph today: nothing says what a
    place is or what distance is measured along. The two axes proposed here are the first structure capable
    of carrying that, but this packet does not itself state a distance rule, so no edge is drawn to either.
    Whoever claims the DMG alignment chapter should start from here.'
- id: OBS-04
  topic: align_change and rule_alignment_change are a duplicate identity at canonical
  finding: 'Both exist, both are labelled ''Changing Alignment'', and both carry a CONSTRAINS edge to
    sys_alignment about voluntary change being limited by axis, cited to PHB 34, differing only in wording:
    ''voluntary change limited / along like axis only'' against ''voluntary change / outside limited axes''.
    align_change holds 11 edges, mostly DMG; rule_alignment_change holds 7, mostly PHB.'
  why_it_matters: Constitution 3.2 calls drift the single most common defect in this graph, and this is
    a clean instance of the same concept under two prefixes. It predates this packet and no migration
    is proposed here, which is the Architect's call. It is reported because it was found while resolving
    prefixes for this packet's own nodes and it decided IDQ-01.
- id: OBS-05
  topic: the nine alignment values are not nodes, and this is where that would be challenged
  finding: Alignment values appear throughout the graph only as condition text on sys_alignment edges.
    This appendix is the one place in the PHB that enumerates all nine as a closed set, so it is the natural
    occasion to ask whether they should be nodes.
  why_it_matters: The answer taken here is no, on two grounds. The packet attaches no mechanic to any
    individual alignment, so each of the nine fails the core test on this evidence alone; and minting
    them would change how 108 existing edges express their conditions, which is an ontology change reserved
    to the Architect.
  why_no_escalation_was_opened: 'The question does not block this GUR: the four edges stand whichever
    way it is ruled, because they describe the axes rather than the values. OBS-56 of GUR-PKT-PHB-033-035-alignment-hp-languages-r04
    records that an architectural_escalations entry written before its ID was allocated blocked two GUPs,
    and that a non-blocking question belongs outside that section. It is recorded here instead, with a
    position, for whoever claims the DMG alignment chapter.'
- id: OBS-06
  topic: neutral is a value on both axes and that ambiguity is already load-bearing
  finding: 'The paragraph places absolute neutrality at the centre, which is the cell where both axes
    read neutral. Neutral therefore names three different things: a point on the ethical axis, a point
    on the moral axis, and the alignment at their intersection.'
  why_it_matters: Two canonical edges turn on the distinction. spell_detect_balance FEEDS_INTO sys_alignment
    'detects the neutral axis specifically' (UA 42) is only meaningful because there is more than one
    neutral, and sys_alignment GATES class_bard 'must remain neutral' (PHB 117) does not on its face say
    which. No edge is drawn, because the ambiguity is a property of the vocabulary rather than a relationship,
    but it is the strongest argument available for the OBS-05 question and the Reviewer should see the
    two together.
- id: OBS-ASPECT-02
  topic: revision 2 exists only to bring aspects within constitution 5
  finding: The Builder graded aspect_word_count as an error under DEC-2026-0029 and returned this packet.
    2 of this GUR's aspects ran to five words or more.
  why_it_matters: Each replacement names the facet the cited section touches, re-derived from that section
    in the claimed source rather than produced by shortening the previous string, as DEC-2026-0029 requires.
    This packet was not returned; the rows were graded warning before the Decision and would fail on the
    next compile, so they are corrected now rather than left to bounce. No edge was added, dropped or
    re-pointed; the set was re-checked against canonical and against itself with no collision.
  owner: analyst
blocking_notes:
- id: BLK-02
  note: No node_registry_slice.csv, local_neighborhood.json or general_rule_slice.json accompanied this
    packet. The whole of nodes_master.csv, registries/nodes.csv and edges_master.csv were read directly
    to establish what the alignment subsystem already contains.
  impact: Does not block this GUR.
completeness_statement: The paragraph and both tables were read and considered in full. Every candidate
  edge cites PHB 119 and the appendix heading. No aspect or condition contains a magnitude. No authored
  polarity appears, because all four edges are FEEDS_INTO or DERIVED_FROM, whose polarity is deterministic
  and is the Builder's to set. Candidates were checked against canonical on the constitution 5.1 assertion
  key and on the source-type-target triple, and one further candidate was withheld by hand where the key
  check would not have caught the restatement; see canonical_duplicates_not_for_emission. The nine alignments
  and the four corner descriptors were deliberately not minted; see OBS-05 and OBS-02.
