# -----------------------------------------------------------------------------
# Blocking notes for work that follows this packet
# -----------------------------------------------------------------------------
# Not escalations. Per ESCALATION_CONTRACT these are precondition and
# re-packetization matters, recorded so they are not rediscovered.
# -----------------------------------------------------------------------------
blocking_notes:
  - id: BLK-01
    severity: blocks_packets_02_to_05
    issue: >-
      rulesets/adnd1e/registries/domain_registry.yaml is empty. It carries
      status bootstrap, domains is an empty map, and its own comment reads
      "Populate from the existing project domain list before packet work."
    consequence: >-
      The Analyst is required to mark domains touched and to record candidate domains
      without promoting them. With an empty registry every domain named on a mechanical
      packet would have to be recorded as a candidate, which pushes a large promotion
      decision onto the Architect all at once. This packet touches no domain, so the gap
      is not blocking here.
    owner: architect

  - id: BLK-02
    severity: degrades_extraction_quality
    issue: >-
      Packets were supplied as bare markdown files without node_registry_slice.csv or
      local_neighborhood.json.
    consequence: >-
      Analyst responsibilities include matching each concept against the supplied
      registry slice and comparing candidates against the local neighborhood for
      redundancy or contradiction. Neither is possible without those inputs. For this
      packet the omission is harmless because there are no candidates. For packets
      02-05, which cover abilities, races and classes against an existing 1,094-node
      registry, extraction without a slice risks minting candidate nodes that duplicate
      canonical ones.
    owner: packet_creator

  - id: BLK-03
    severity: documentation
    issue: >-
      contracts/FILE_NAMING.md places Analyst output at work/gur, while
      REPOSITORY_STRUCTURE.md and agents/analyst/INSTRUCTIONS.md both place it at
      books/<ruleset-id>/<book-id>/artifacts/gur/. Only the latter directory exists.
    consequence: >-
      This GUR was written to artifacts/gur/ on the two-to-one agreement and the
      on-disk layout. The same conflict affects the gup, reviews and escalations paths
      listed in FILE_NAMING.
    owner: architect

# -----------------------------------------------------------------------------
completeness_statement: >-
  Every section of the packet was read in full before extraction: the title and
  copyright page, the foreword, the complete table of contents including the
  appendices listing, the full tables and charts index across both of its column
  blocks, and the preface through its acknowledgements. Pages 1 through 6 are
  accounted for, matching the {#p1} through {#p6} anchors in the source file, with no
  gap in the anchor sequence.

  The packet yields no candidate edges and no candidate nodes. This is a property of
  the material, not an incomplete pass: front matter asserts no dependency between
  mechanics. Five candidates were considered and rejected against the core test, and
  each is recorded above with its reason so the null result can be audited rather than
  assumed. No magnitude, die expression, or rule prose has been carried into any field.
  No polarity was authored, since authored polarity applies only to MODIFIES, TRIGGERS
  and CONSTRAINS and no edge of any type is proposed.

  Four observations are preserved for the Reviewer that do not belong in the graph but
  would be costly to rediscover, the most consequential being that the title page
  determines the printing basis for every page citation this book will produce.

  This GUR is complete enough for the Builder to process without rereading the source:
  the correct action on it is to compile an empty patch.
