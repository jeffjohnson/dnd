non_edge_observations:
  - id: OBS-33
    topic: charisma bounds henchmen but explicitly does not bound hirelings
    locus: HIRELINGS, p39
    finding: >-
      The text states that the number of hirelings is in no way limited by charisma, while
      also stating that hiring success depends to some extent on charisma. Both are
      recorded, as C1 and C2, and they do not conflict: one concerns how many may be
      retained, the other whether a given attempt succeeds.
    why_it_matters: >-
      A textbook EXCLUDED_FROM under constitution 4.1. The assumption being denied is not
      hypothetical: the Charisma Table in packet 03 gives a Maximum Number of Henchmen
      column, and a reader carrying that forward would naturally apply it to hirelings.
      Losing this edge would leave the graph unable to answer why a charisma change does
      not move hireling counts.

  - id: OBS-34
    topic: this packet is the proper home of the mechanics in ESC-2026-07-30T01.21.13.768Z
    finding: >-
      ESC-2026-07-30T01.21.13.768Z reports two duplicate-identity pairs, hench_loyalty against
      abil_cha_loyalty_base, and abil_cha_max_henchmen against hench_max_number. Those
      mechanics were extracted in packet 03 from the Charisma Table, where their numbers
      live. Their rules live here, in HENCHMEN.
    why_it_matters: >-
      It sharpens the escalation. The duplication is not arbitrary: the graph has one node
      per pair from the ability side and one from the henchman side, because the book
      itself states each mechanic twice, once as a Charisma Table column and once as a
      henchman rule. Whichever ID survives a merge will need to carry citations from both
      pages.
    analyst_action_taken: >-
      Used hench_henchmen and hench_loyalty here, consistent with the choice declared in
      packet 03's IDQ-05, and recorded this as evidence for the open escalation rather
      than raising a new one.

  - id: OBS-35
    topic: a prohibition that cannot currently be recorded
    locus: DISTANCE, p39
    finding: >-
      The text states in capitals that outdoor scale must be used for range only and never
      for spell area of effect. That is an emphatic, explicit denial of a dependency a
      reader would certainly otherwise assume, since the same paragraph triples range
      outdoors.
    why_it_matters: >-
      It cannot be recorded. No canonical node represents spell area of effect. C13 and C14
      record the range half of the rule, so the graph asserts the part that expands scope
      and silently omits the part that bounds it. That is the least comfortable omission in
      this batch.
    recommendation: >-
      A node for spell area of effect would let the prohibition be recorded as
      EXCLUDED_FROM. The Analyst does not propose one, because area of effect is a spell
      mechanic and the spell packets are next; fixing its identity from a distance-scale
      paragraph would set it from the wrong locus. Revisit when packet 09 is extracted.

