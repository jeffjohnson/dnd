  HENCHMEN, covering attraction, alignment compatibility, wages and treasure share,
  experience awards and loyalty; TIME, defining turn, round and segment; DISTANCE, giving
  the indoor and outdoor scale for range and the prohibition on applying outdoor scale to
  area of effect; and MONSTER, THE TERM.

