    the four entries in canonical_duplicates_not_for_emission; three of them carry a recommendation to
    add this packet's citation to the existing row instead. Do not emit H1 or H2.
  what_reviewer_should_do: OBS-44 is the one that needs a decision from someone. This GUR's pages are
    marker-derived and will disagree with seven neighbouring canonical rows about the same spells.
