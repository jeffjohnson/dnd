  severity: unchanged
  issue: domain_registry.yaml remains an empty map at status bootstrap.
  owner: architect
- id: BLK-02
  severity: severe and now cumulative
  issue: no node_registry_slice.csv and no local_neighborhood.json supplied, for the sixth packet running.
  consequence: For this packet the missing slice did real damage rather than creating rework, and it is
    worth being precise about how. A supplied slice of the 183 spell_ nodes would have shown the label
    divergence before extraction rather than after, which is what produced the escalation that was returned
