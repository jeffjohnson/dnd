source_summary: Pages 43 to 54, CLERIC SPELLS in full. A short Notes Regarding Cleric Spells preamble,
  then 76 spell entries across seven levels, each with Level, Range, Duration, Area of Effect, Components,
  Casting Time and Saving Throw followed by an Explanation/Description. Thirty-one entries are reversible.
parse_method: 'Pandoc 3.10 JSON AST, per contracts/SOURCE_MARKDOWN.md, which makes a CommonMark-only or
  GFM-only parser nonconforming. Page markers were resolved from the AST: a heading whose Pandoc Attr
  identifier is pN is an end-of-heading marker under placement rule 1, so that heading and what follows
  begin on page N. Parse artifacts are preserved at books/adnd1e/phb/work/analyst/p10/.'
node_id_resolution_method: No slice supplied, for the sixth packet running. Resolved by registry lookup
  on the cleaned spell name, first against spell_ labels and then against a slugified ID. 28 of 76 resolve
  onto an existing node and 48 do not. An earlier draft of this matcher reported 29 because a fallback
  stripped text after a comma and merged Protection from Evil with Protection from Evil, 10' Radius, which
  are different spells at different levels. The fallback is removed and the two are now separate, one
  matched and one proposed.
grain_decisions:
- decision: No class-to-individual-spell availability edge is proposed for any of the 76 spells.
  reasoning: The obvious reading of a cleric spell list is that the cleric class grants each spell, which
    would yield 76 edges. Canonical does not model spells that way. It carries seven class-to-spell edges
    in 3,809 rows, all of them special cases, and represents clerical access through the rule_cleric_spells
    aggregate, which already holds 25 edges including rule_deity GATES rule_cleric_spells and exp_level
    GATES rule_cleric_spells. Emitting 76 near-identical GATES rows would invent a pattern the graph does
    not use and would bury the aggregate that does the work.
- decision: No per-spell material-component edge is proposed, although 42 of 76 list an M component.
  reasoning: Canonical row 445 already asserts rule_cleric_spells CONSUMES spell_component_material, cited
    to PHB 40, the packet immediately before this one. Forty-two per-spell repetitions would restate one
    general rule at a worse grain. The preamble's genuine addition is the exception, that religious items
    are not consumed, recorded as X1.
- decision: Level, Range, Duration, Area of Effect and Casting Time yield no edges.
  reasoning: Magnitudes throughout. Spell level survives only where the source makes it load-bearing on
    something else, which happens once, at P3.
- decision: Saving Throw yields an edge only where the field is not None.
  reasoning: Sixty-six of 76 entries read None. The ten that do not are a real dependency on save_spell
    and match the canonical spell-to-save pattern, which exists 27 times. The values Special, Neg. and
    one-half describe the outcome and are magnitudes or procedure; only Command and Flame Strike carry
    a qualitative condition worth keeping.
