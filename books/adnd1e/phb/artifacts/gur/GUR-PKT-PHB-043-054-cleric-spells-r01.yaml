completeness_statement: 'All 76 spell entries were parsed from the Pandoc AST and every one of the seven
  header fields was captured: Level 76, Range 76, Duration 76, Area of Effect 75, Components 76, Casting
  Time 76, Saving Throw 76. The single missing Area of Effect is Astral Spell, which has no such line
  in the source; no proposed edge depends on that field. The preamble was read in full and yields three
  of the seventeen edges.

  Seventeen candidate edges are proposed and forty-nine candidate nodes, of which forty-eight are spells
  and one is Magic Resistance. Four assertions the packet genuinely witnesses are held back because canonical
  already carries them, each with the row it duplicates. Four candidate groups are recorded as rejected
  with reasons, one of them a deferral recorded as OBS-43 rather than a refusal.

  Two spells of 76 are held pending ESC-2026-07-31T04.35.02.574Z. That escalation supersedes the returned
  ESC-2026-07-30T15.16.18.973Z, which had claimed the whole packet was blocked. It was not. Of the 28
  spells matching an existing node, 26 match a node whose label agrees with its ID and only Cure Light
  Wounds and Hold Person do not.

  Every proposed edge was checked against the 3,809-row canonical graph for an existing identity triple
  and none collides. No duplicate identity triple exists within the proposal. No aspect or condition contains
  a numeral.'
