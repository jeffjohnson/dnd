rejected_candidates:
- text_locus: every spell entry, pages 43 to 54
  quoted_gist: Level, Range, Duration, Area of Effect and Casting Time
  rejection_reason: Magnitudes. See grain_decisions.
- text_locus: Notes Regarding Cleric Spells, p43
  quoted_gist: Your Dungeon Master might alter the material components of spells, require only religious
    adjuncts as material, or just do away with them.
  why_considered: it names material components, which are mechanical
  rejection_reason: An instruction to consult the referee, not a rule. It states that the preceding rule
    is optional, which the graph has no way to assert and which would weaken the rule if it did.
- text_locus: 42 spell entries listing an M component
  quoted_gist: specific material components, holy water, sulphur, a silver mirror and so on
  why_considered: each is a real consumed resource
  rejection_reason: The individual substances are not canonical nodes and minting 40 of them from a spell
    list would flood the registry with single-use identities. The relationship that clerical spells consume
    material components is already canonical at row 445.
- text_locus: 31 reversible spell entries
  quoted_gist: the reverse of this spell is X
  why_considered: canonical carries spell_bless ALTERNATIVE_TO spell_curse at DMG 70, so the pattern exists
  rejection_reason: Deferred rather than rejected outright. Emitting 31 ALTERNATIVE_TO edges would require
    minting a node for each reversed form, roughly 31 more nodes, and most reversed forms are named only
    in passing. The one canonical instance was minted from the DMG, where the reversed spell has its own
    treatment. Recorded as OBS-43 with a recommendation rather than guessed at here.
non_edge_observations:
- id: OBS-43
  topic: the 31 reversible spells and whether each reverse needs a node
  locus: throughout, and the preamble at p43
  finding: 'Thirty-one of 76 entries are marked Reversible and most name the reverse in the description:
    curse, destroy water, cause disease, harm, slay living, energy drain and so on. Canonical carries
    exactly one such pair, spell_bless ALTERNATIVE_TO spell_curse at DMG 70.'
  why_it_matters: The reversed forms are where the alignment risk in P1 actually bites, so they are not
    decorative. But minting 31 nodes from names that appear only inside another spell's description would
    fix a lot of identity from a weak locus, which is the mistake IDQ-13 and the spell-identity escalation
    are both about.
  recommendation: Decide the policy once rather than per packet. The magic-user spell packets will present
    the same question at greater volume. The Analyst's preference is to mint a reversed-form node only
    where the source gives it its own entry or its own mechanics, which for this packet would be a handful
    rather than 31.
  owner: architect
- id: OBS-44
  topic: legacy page attribution for this range disagrees with the source markers
  locus: canonical rows 520, 521, 524, 525, 531, 532, 535
  finding: Nine canonical edges are cited to PHB 43 to 54. Marker-derived paging from the operator's source
    agrees with two of them and disagrees with seven. Bless is cited to 44 and the markers put it on 43.
    Know Alignment is cited to 47 and the markers put it on 45. Cure Disease and Glyph of Warding are
    cited to 49 and the markers put both on 47. Neutralize Poison is cited to 50 against 48, and Atonement
    to 51 against 49.
  detail:
  - node: spell_bless
    canonical_row: 531
    canonical_page: 44
    marker_derived_page: 43
  - node: spell_bless
    canonical_row: 532
    canonical_page: 44
    marker_derived_page: 43
  - node: spell_know_alignment
    canonical_row: 525
    canonical_page: 47
    marker_derived_page: 45
  - node: spell_cure_disease
    canonical_row: 520
    canonical_page: 49
    marker_derived_page: 47
  - node: spell_glyph_of_warding
    canonical_row: 535
    canonical_page: 49
    marker_derived_page: 47
  - node: spell_neutralize_poison
    canonical_row: 521
    canonical_page: 50
    marker_derived_page: 48
  - node: spell_atonement
    canonical_row: 524
    canonical_page: 51
    marker_derived_page: 49
  why_it_matters: The offsets are not constant, so this is not one systematic shift that could be corrected
    mechanically. It means legacy page citations in this range cannot be trusted, and this GUR's pages
    will disagree with neighbouring canonical rows about the same spells. The identities and the assertions
    are unaffected; only the citations differ.
  recommendation: Prefer the marker-derived page for anything this packet cites, because the markers are
    in the operator's own source and the legacy figures have no recoverable basis. Whether the seven canonical
    rows should be corrected is an Integrator question, not one this GUR can settle.
  owner: integrator, with the architect if a correction pass is wanted
- id: OBS-45
  topic: the packet is almost entirely unextracted
  locus: pages 43 to 54
  finding: Nine canonical edges cover this twelve-page range, against 76 spell entries. Twenty-eight of
    the 76 spells have a node; 48 do not.
  why_it_matters: 'This is the first packet where the dominant output is identity rather than relationships.
    Forty-eight of the 49 proposed nodes are spells that the graph simply does not know about, and 17
    edges is a small return for twelve pages. That is the correct outcome and not a shortfall: a spell
    list is mostly a list, its mechanical content is magnitudes, and the relationships worth having are
    the handful where a spell reaches outside itself.'
  owner: none, recorded for context
unresolved_identity_questions:
- id: IDQ-14
  question: Fourteen spell descriptions make the effect scale with the caster's experience level. Should
    that be one edge per spell against exp_level, or is it the general property of spellcasting that the
    graph already carries?
  bearing: no edge proposed
  analyst_handling: Not proposed. Canonical already holds exp_level edges against the spell aggregates,
    and 14 per-spell repetitions would restate them. Flagged because the magic-user packets will have
    far more than 14 and the answer should be the same in both.
