  tables were checked mechanically for sequence, duplication and column consistency before reading. Every
  proposed edge carries a book, page and section citation and an evidence class. No magnitude reached
  any aspect or condition field. Authored polarity appears on the three permitted edge types only. The
  generated edge set was checked for duplicate source, type and target triples before assembly and contains
  none. Every overlap with an earlier packet was checked against the specific edge reference rather than
  assumed, and the overlaps found are recorded rather than silently dropped. Deduplication against the
  canonical graph remains outstanding and could not be performed at extraction time.

  r06 answers REV-GUP-PKT-PHB-035-038-money-equipment-r04-r01. The page 38 sentence is now four edges
  rather than one: the rear-attack bonus for an opponent''s back or similarly unseen position, and one
  edge each for the stunned, prone and motionless states. The page 37 footnotes are now two edges rather
  than a condition on the opponent-size row: a set weapon receiving a charge, and a weapon used from a
  charging mount. B17 and B19 carry the exact assertions the Reviewer approved and B15 is restored to
  neutral with basis read. The packet proposes twenty-two edges and no nodes; all five new sources resolve
  to registry nodes that already exist. Two of the new edges share an identity with an existing canonical
  row that carries an unrelated facet, which is raised as IDQ-15 rather than resolved by omission.'
downstream_notes:
  purpose: Builder and Reviewer startup does not read books/<book>/reports/, so a finding recorded only
    there would never reach them. This block is a pointer, not a verdict.
  dedupe_report:
    path: books/adnd1e/phb/reports/DEDUPE-PHB-20260729.md
    what_it_is: 'Every edge proposed across all PHB GURs, compared against the 3,809-edge canonical graph
      on three tests: exact duplicate triple, type conflict on the same ordered pair, and direction conflict
      on the reversed pair. Across all PHB GURs, 115 of 389 proposed edges duplicate a canonical triple
      exactly, 35 are type conflicts and 20 are direction conflicts.'
    why_it_exists: No packet was ever supplied with a local_neighborhood.json, so no Analyst could run
      this check at extraction time. It is BLK-02, run once after the fact.
    what_builder_should_do: Consult it before normalising this GUR. Exact duplicates should generally
      be dropped from the GUP; where the canonical row cites a different book, prefer adding this packet's
      citation to the existing row over discarding a second independent witness.
    what_reviewer_should_do: The direction conflicts are classified in the report into four classes with
      a disposition for each. Class B is not a conflict at all and both sides should be kept. Class D
      is a flat PHB-versus-DMG contradiction on two rows.
  no_verdicts_embedded: This GUR has not been edited to mark individual edges as duplicates. Whether an
    assertion is already held by the graph is a normalisation determination owned by Builder and Reviewer;
    recording it in an interpretive artifact would put the decision in the wrong role.
  edges_pending_ESC_20260730_010115:
    escalation: rulesets/adnd1e/escalations/decided/ESC-2026-07-30T05.01.15.336Z.yaml
    refs:
    - B1
    - B10
    issue: These edges use DERIVED_FROM where the canonical graph holds the reverse relationship with
      MODIFIES or FEEDS_INTO. Both types are licensed by constitution section 4 and section 4.2 does not
      disambiguate this pair, so the choice is a global convention question rather than a per-edge error.
    analyst_position: The Analyst recommends yielding to the canonical convention, and has deliberately
      NOT flipped these edges while the escalation is open. Pre-empting a convention question the Analyst
      itself raised would defeat the point of raising it.
    builder_action: Hold these refs pending DEC on ESC-2026-07-30T05.01.15.336Z. If the canonical convention
      is ratified they are duplicates and should be dropped, not re-typed and re-proposed.
