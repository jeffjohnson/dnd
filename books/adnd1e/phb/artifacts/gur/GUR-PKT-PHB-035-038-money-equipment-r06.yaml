  findings and one carried polarity instruction. r05 combined five distinct source dependencies into two
  conditions: the page 38 sentence''s stunned, prone and motionless clauses rode inside B17''s condition,
  and the page 37 set-against-charge and charging-mount footnotes rode inside B19''s. r06 gives each of
  the five its own edge, corrects B17 to the rear-attack source and B19 to the opponent-size facet the
  Reviewer approved, and restores B15 to the neutral read the Reviewer approved. Seventeen edges become
  twenty-two.'
r02_revision_reason: 'The operator gave direction on the cross-book conflict reported as OBS-30 and will
  carry it to the Architect. Two facts change the disposition of that observation: the DMG is to be re-analysed
  in full, so the conflicting side will be re-derived rather than left as legacy; and the operator''s
  stated preference, pending Architect ratification, is to favour the PHB where PHB and DMG conflict in
  escalations of this kind. OBS-30 is amended to record the direction and the consequence the Analyst
  believes follows from it. No edge is added, removed, retyped or recited; B17 is unchanged in every field.'
