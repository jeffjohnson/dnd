non_edge_observations:
- id: OBS-30
  topic: a possible conflict with a registered general rule
  locus: WEAPON TYPES GENERAL DATA AND TO HIT ADJUSTMENTS, p38
  finding: This page states that any weapon strikes at a bonus against an opponent's back or an otherwise
    unseen opponent, and at a larger bonus against stunned, prone and motionless opponents. That is edge
    B17. The general rule register holds GR_HELPLESS_TARGET_AUTOHIT, established at DMG p70, under which
    paralyzed, held, sleeping or wholly immobile targets are struck automatically, take maximum damage,
    and gain no Dexterity benefit.
  the_tension: Struck automatically and struck at a bonus are different mechanics. Either the PHB bonus
    is superseded by the DMG rule for the subset of opponents that count as wholly immobile, or the two
    describe different states, with the PHB covering merely prone or stunned and the DMG covering magical
    immobilisation. The second reading is more likely and is supported by the register's own counter-example,
    which distinguishes naturally sleeping targets. The Analyst cannot settle it from this packet.
  why_it_matters: B17 is proposed as a plain MODIFIES edge with no supersession basis, because the Analyst
    has no authority to assert that a DMG rule overrides a PHB one, and OVERRIDES requires a supersession_basis
    this packet cannot support. If the two do collide, B17 needs retyping or the general rule needs its
    boundary restated.
  recommendation_at_r01: Architect or Reviewer to compare B17 against GR_HELPLESS_TARGET_AUTOHIT with
    the DMG text in hand. This is a cross-book question and belongs under rulesets/adnd1e/cross-book,
    which the Analyst may not open on suspicion.
  operator_direction_r02:
    status: operator direction, pending Architect ratification; not a decision
    recorded_on: '2026-07-29'
    content: The DMG will be re-analysed in its entirety, so PHB and DMG conflicts of this kind are expected
      to resolve as the DMG side is re-derived from source rather than inherited from the legacy import.
      The operator will escalate to the Architect with the direction to favour the PHB for these specific
      conflicts.
    effect_on_this_gur: B17 stands as proposed, unchanged. It is no longer waiting on a comparison the
      Analyst could not make; it is waiting on a DMG re-analysis that will supply the other side of the
      comparison.
  consequence_the_analyst_believes_follows: 'Favouring the PHB is not a no-op here, and this is the part
    worth the Architect''s attention. GR_HELPLESS_TARGET_AUTOHIT is not an ordinary DMG edge. It is a
    registered general rule in registries/general_rules.json whose established_by is "DMG p.70 Special
    Types Of Attacks", and constitution 7.1 makes the establishing citation load-bearing: it is the evidence
    the rule generalises from. Its applies_to list names spell_hold_person, item_wand for paralyzation,
    and rule_immobile, and every edge derived under it carries its general_rule_id.

    So if the PHB is favoured and B17''s bonus displaces or bounds the automatic-hit rule, the effect
    does not stop at one row. Either the general rule''s boundary must be restated so that it covers only
    the magically immobilised subset, which is the Analyst''s reading and would leave both statements
    true, or the rule''s establishing citation moves and its inherited edges need re-derivation. The first
    is cheap and the second is not.'
  analyst_recommendation_r02: 'When the Architect ratifies the direction, scope it explicitly: state whether
    favouring the PHB means the general rule is bounded or the general rule is superseded. Those are different
    instructions to the DMG analyst and to the Builder, and the difference is invisible until integration
    if it is not settled first.'
- id: OBS-31
  revision_status: resolved_in_r03_by_constitution_v1_3
  topic: the wpn_ prefix is now approved
  finding_at_r01: This packet needs wpn_weight, wpn_range, wpn_space_required, wpn_stats and wpn_type_vs_ac.
    Under constitution v1.2 the wpn_ prefix was not in the section 3.1 table, and it was the largest of
    the twelve unapproved prefixes reported in ESC-2026-0002 at seven nodes.
  resolution: Constitution v1.3 adds wpn_ to section 3.1 as "weapon property or weapon statistic", with
    wpn_speed_factor as the worked example. All five nodes this packet uses are therefore now under an
    approved prefix and no longer contribute to ESC-2026-0002. No edge changes; the IDs were always valid
    registry IDs and only their governance status moved.
  correction_to_r01: r01 listed prof_weapon and prof_nonproficiency_penalty alongside the wpn_ nodes in
    a way that reads as though prof_ were also unapproved. It was not. prof_ has been in the section 3.1
    table since v1.2, and the Analyst's own prefix census never counted it among the twelve. The sentence
    was loose; the census was right.
  what_remains: ESC-2026-0002 is not closed by this. Eleven prefixes remain outside section 3.1, including
    align_ and time_, which the three other unbuilt PHB GURs still depend on. See OBS-40.
- id: OBS-40
  revision_status: new_in_r03
  topic: v1.3 fixed the constitution's self-contradiction by changing its examples, and the new examples
    cite nodes that do not exist
  finding: 'ESC-2026-0002 reported that the constitution used unapproved prefixes in its own worked examples:
    turn_undead five times, including the section 6.2 example, and str_bend_bars once in the section 4.1
    example. v1.3 resolves this not by approving those prefixes but by rewriting the examples to rule_turn_undead
    and abil_strength_bend_bars. Neither ID exists in rulesets/adnd1e/registries/nodes.csv. The registry
    still holds turn_undead and str_bend_bars.'
  why_it_matters: 'The self-contradiction is gone and a clear migration direction is now signalled: turn_
    becomes rule_, and str_ sub-mechanics become abil_strength_ compounds. That is useful and the Analyst
    reads it as intent. But until the migration runs, the constitution''s worked examples point at identities
    the graph does not contain, which is a different defect of the same family rather than a clean resolution.
    A worker following section 6.2 literally would mint rule_turn_undead as a duplicate of turn_undead,
    which is exactly the drift section 3.2 names as the most common defect.'
  bearing_on_this_packet: none; no edge here uses turn_ or str_
  bearing_elsewhere: turn_undead is used by GUR-PKT-PHB-018-033-classes-r02 at F1 and F14, and the three
    str_ nodes by GUR-PKT-PHB-009-013-ability-scores-r01. Both have already been through Builder, so this
    is a migration question for Integrator rather than a GUR correction.
  recommendation: Architect to confirm whether v1.3's examples are a migration instruction. If they are,
    the registry rename should be scheduled before another packet references either ID. If they are not,
    the examples should cite IDs that exist.
- id: OBS-32
  topic: an explicit denial that is easy to lose
  locus: ARMOR, p36
  finding: Magic armour negates weight, so movement does not consider any encumbrance from it. That is
    B9.
  why_it_matters: A reader would certainly assume armour has weight, since the equipment tables give a
    weight for every mundane armour type. This is what constitution 4.1 exists for, and it is easy to
    lose because it sits in a one-line note rather than in a table.
- id: OBS-47
  topic: B19 stays, and why it is not the same mistake as B18
  locus: WEIGHT AND DAMAGE BY WEAPON TYPE, PHB 37
  finding: 'B19, wpn_stats MODIFIES cbt_damage with aspect ''damage against larger opponents'', shares
    an ordered pair with the withdrawn B18 but is a different assertion: a different facet, a real condition,
    and an authored polarity. Invariant 12 keys on source, type and target, so the pair is permitted once
    B18 is gone.'
  the_open_question: 'The validation report also flags B19 as opposed in direction to canonical row 2984,
    cbt_damage OVERRIDES wpn_stats at UA 78. The report says DEC-2026-0011 does not settle this shape
    mechanically and the Reviewer decides with both sources in hand. That is still true and B19 is carried
    unchanged for that decision. The Analyst''s reading is that they are not opposed at all: row 2984
    is about hacking through a weapon''s shaft, which is a specific UA combat case, while B19 is the weapon
    table''s damage-by-size column.'
  owner: reviewer
- id: OBS-50
  topic: the PHB 38 bonus and the DMG 70 treatment of the same three states are not the same rule
  locus: WEAPON TYPES, GENERAL DATA, AND "TO HIT" ADJUSTMENTS, PHB 38
  finding: Canonical already holds a DMG 70 treatment of this passage's subject matter, and it is not
    what the PHB says. Row 1814 carries the rear-attack bonus. Row 1815 carries rule_stun DERIVED_FROM
    cbt_rear_attack, that is, a stunned opponent is treated as a rear attack. Row 2258 carries rule_immobile
    OVERRIDES cbt_tohit, struck automatically. Prone has no row at all. The PHB gives all three states
    one flat bonus instead.
  why_it_matters: 'The two books state the rule differently, and the difference is mechanical rather than
    editorial: an automatic hit is not a bonus, and a bonus equal to the rear-attack bonus is not the
    same as being treated as a rear attack. The Analyst has authored what the PHB says because the PHB
    is this packet''s source. Whether the DMG rows are superseded by, refined by, or simply parallel to
    the PHB rows is a graph question the Analyst cannot settle from one book.'
  not_claimed: No OVERRIDES is proposed in either direction and no supersession is asserted. Doing so
    would require reading DMG 70, which is not in this packet.
  owner: reviewer, escalating to architect if the two treatments must be reconciled
- id: OBS-51
  topic: why the three charge footnotes become two edges rather than three
  locus: WEIGHT AND DAMAGE BY WEAPON TYPE, PHB 37, footnotes
  finding: 'The dagger footnote and the double-asterisk footnote both say the weapon does doubled damage
    when it is set to receive a charge. They differ only in scope: the first applies against larger-than-man-sized
    creatures, the second against any opponent. Which weapons carry which marker is a per-row datum of
    the weapon table. The single-asterisk footnote is a different mechanic entirely, doubling damage for
    a weapon used from a charging mount.'
  why_it_matters: Splitting the first two would put two edges with the same source, type and target into
    one packet, which invariant 12 forbids, and the only thing distinguishing them would be the target
    size scope. Merging all three would repeat the very conflation the Reviewer returned the packet for.
    Two edges is the shape that follows from the mechanics rather than from the typography.
  what_is_not_carried: The size scope of the dagger footnote is not carried in either edge's condition,
    because it varies by weapon row and the graph does not carry per-row weapon data. If the Reviewer
    wants it, the place for it is B23's condition and it can be added without changing the edge's identity.
  owner: reviewer
- id: OBS-52
  topic: OBS-48's proposed node check earned its keep on the first packet after it was written
  locus: B22, the motionless clause
  finding: 'The obvious move for the motionless clause was to mint a node, since nothing is called motionless
    in the registry. A label and concept search instead of an ID search found rule_immobile, labelled
    Total Immobility, at degree 14, whose canonical rows include one reading ''the victim is held motionless''.
    A second near miss was rule_prone, labelled Prone or Helpless Opponent, which is tempting for motionless
    and would have been wrong: the source names prone and motionless as different states in the same list,
    so folding them would have asserted an identity the source denies.'
  why_it_matters: OBS-48 recommended searching canonical labels for every proposed node after r03 proposed
    a duplicate of a 97-degree node. This is the first packet revised since, and the check caught a duplicate
    of a 14-degree node and an over-merge in the same clause. Zero nodes are proposed by this packet as
    a result.
  owner: analyst
- id: OBS-53
  topic: B14 was an Analyst targeting error, not a duplicate, and is worth separating from the other four
    rejections
  locus: B14, PHB 37
  finding: 'Four of the five rejected refs were restatements of canonical rows from the same pages. B14
    was not: it targeted cbt_missile when the source is about room to wield a hand-held weapon, and canonical
    row 431 carries the correctly targeted wpn_space_required CONSTRAINS cbt_melee. The Analyst pointed
    a real dependency at the wrong target.'
  why_it_matters: A duplicate costs the Reviewer a lookup. A wrong target would have put a false assertion
    into the graph if canonical had not already held the right one. The two failures deserve different
    weight in any later count of what this packet got wrong.
  owner: analyst
unresolved_identity_questions:
- id: IDQ-11
  question: B5 asserts sys_equipment MODIFIES cbt_armor_class for worn armour. sys_equipment is an aggregate
    covering all equipment. Should armour have its own node?
  bearing: B5
  analyst_handling: Used sys_equipment because no armour node exists; item_magic_armor covers only the
    magical case and rule_shield only shields. Flagged rather than minting rule_armor, because the registry
    may intend sys_equipment to carry this and a duplicate would be worse than a coarse edge.
- id: IDQ-12
  question: Packet 03 routed dexterity's defensive effect through dex_defensive_adj. This page names dexterity
    directly as a principal modifier of armour class. Should a second edge be proposed from abil_dexterity?
  bearing: none; no edge proposed
  analyst_handling: No edge proposed, because packet 03's D5 already carries the relationship through
    the intermediate node the graph appears to prefer. Recorded so the omission is visible and can be
    reversed if IDQ-04 is resolved the other way.
- id: IDQ-15
  question: When a packet supports a genuinely new facet of a dependency whose source, type and target
    already exist in canonical, invariant 12 leaves no way to record it. Should the Reviewer widen the
    existing row's aspect, should the facet go unrecorded, or does the constitution need a rule?
  raised_by: B20 and B24, which are the two instances in this packet
  instances:
  - ref: B20
    identity: rule_stun MODIFIES cbt_tohit
    canonical_row: *id001
    existing_aspect: target stunned for rounds
    existing_citation: PHB 30, THE MONK
    new_facet: the flat bonus to strike a stunned opponent, PHB 38
    why_it_is_a_real_conflict: The existing row is about how long the stun lasts. The new facet is about
      how much easier the stunned target is to hit. Neither contains the other, they come from different
      pages, and one of them is the monk's stunning blow while the other is a general combat rule.
  - ref: B24
    identity: rule_mount MODIFIES cbt_damage
    canonical_row: *id002
    existing_aspect: dismounted lance loses the level bonus
    existing_citation: UA 15, CAVALIERS TABLE I
    new_facet: doubled weapon damage from a charging mount, PHB 37
    why_it_is_a_real_conflict: The existing row is a cavalier-specific penalty for being dismounted. The
      new facet is a general bonus for attacking from a charging mount. They are close to opposites.
  options:
  - option: Reviewer updates the existing row, widening its aspect to cover both facets
    assessment: Lossy in both instances here. Row 374's stun duration and row 2798's cavalier penalty
      would each have to be generalised into something that no longer says what either source says.
  - option: Reviewer omits the new facet and records the canonical row as already covering the identity
    assessment: Silently drops a stated rule. It is what invariant 12 forces today and it is why this
      question is being raised rather than answered.
  - option: Architect rules on whether invariant 12 keys on identity or on the five-field assertion key
    assessment: Recommended. The Builder already keys duplicate_assertion on the five-field key of source,
      type, target, aspect and condition. If the graph invariant used the same key, both instances resolve
      cleanly and nothing is lost. That is a constitution change and not the Analyst's to make.
  analyst_position: Both candidates are emitted so the question is visible with evidence attached rather
    than resolved by omission. If the Architect declines to change invariant 12, the Reviewer should reject
    B20 and B24 as blocked by the invariant and say so, which at least leaves a record that the PHB states
    these rules.
  blocks: nothing; the other twenty edges are unaffected
  owner: architect
