source_summary: PHB 100 to 109, the chapter that explains how the game is actually played. Twenty-two
  sections running from SPELL CASTING through SUCCESSFUL ADVENTURES, covering encumbrance, movement scale,
  light and the three vision modes, silent and invisible movement, surprise, traps and encounters, initiative,
  the seven forms of combat, combat procedures, damage, falling, healing, obedience, morale, mapping,
  organization, experience and poison. Unlike the spell chapters this is continuous prose with six tables
  and no repeating entry structure, so extraction was a page sweep rather than a spell scan.
node_id_resolution_method: No registry slice was supplied. Every named mechanic was searched by ID and
  by label in the registry and canonical nodes_master. This chapter names the graph's most heavily connected
  subsystems, so the great majority of endpoints already existed; fifteen did not and are proposed.
grain_decisions:
- decision: The player-advice sections yield no edges.
  basis: Constitution 1 and the core test. THE ADVENTURE, MAPPING, ORGANIZATION and SUCCESSFUL ADVENTURES
    are guidance on how to play well, not statements that one mechanic depends on another.
  how_applied: 'Roughly a third of the packet by length produced nothing. MAPPING is the exception: it
    yields edges because other sections make it mechanically load-bearing, slowing movement and requiring
    light.'
- decision: This chapter restates rules stated elsewhere in the book, and restatements are not new assertions.
  basis: Constitution 5 and 5.1.
  how_applied: Sixteen candidates matched an existing canonical assertion once paraphrase was allowed
    for; they are recorded as additional loci rather than emitted. This is by far the highest duplicate
    rate of any packet so far, which is what a summary chapter should produce.
- decision: No magnitude, die expression, percentage or threshold appears in any aspect or condition.
  basis: Constitution 2 and GRAPH_INVARIANTS 11.
  how_applied: Verified programmatically before publication.
candidate_nodes:
- proposed_id: rule_scroll_spells
  proposed_label: Scroll Spells
  kind: rule
  why_needed: 'The SPELL CASTING section gives scroll spells their own rules: no somatic or material component,
    a fixed effective caster level, and consumption on reading.'
  edges_depending_on_it:
  - M006
  - M007
  - M008
- proposed_id: rule_wandering_monsters
  proposed_label: Wandering Monsters
  kind: rule
  why_needed: 'TRAPS, TRICKS, AND ENCOUNTERS makes the distinction from set encounters mechanical: wandering
    encounters are time-driven, noise-attracted, and seldom carry treasure.'
  edges_depending_on_it:
  - M023
  - M024
  - M025
- proposed_id: rule_parry
  proposed_label: Parrying
  kind: rule
  why_needed: 'One of four named melee options with its own mechanical effect: no return attack, and the
    strength bonus is subtracted from the opponent''s roll.'
  edges_depending_on_it:
  - M042
  - M043
- proposed_id: rule_poisoned_weapon
  proposed_label: Poisoned Weapon
  kind: rule
  why_needed: The POISON section is entirely about whether a weapon may be envenomed, and attaches both
    a saving throw and social sanction to it.
  edges_depending_on_it:
  - M069
  - M070
  - M071
  - M072
- proposed_id: cbt_breath_weapon
  proposed_label: Breath Weapon
  kind: cbt
  why_needed: 'Named as one of the seven forms of combat, with its own resolution: no attack roll, area
    effect, saving throw.'
  edges_depending_on_it:
  - M037
- proposed_id: cbt_gaze_attack
  proposed_label: Gaze Attack
  kind: cbt
  why_needed: Named alongside breath weapons as an attack form resolved by saving throw. Also proposed
    by GUR-PKT-PHB-094-100-illusionist-spells-r01 for the gaze reflection spell.
  edges_depending_on_it:
  - M038
- proposed_id: rule_magical_control
  proposed_label: Magical Control
  kind: rule
  why_needed: 'Named as one of the seven forms of combat: control of a creature conferred by potion, scroll
    or ring, and subject to the opportunity to use the item.'
  edges_depending_on_it:
  - M033
  - M034
- proposed_id: rule_death
  proposed_label: Death
  kind: rule
  why_needed: DAMAGE makes reaching zero or fewer hit points the trigger, and names the magic that prevents
    it. No registry node represents the state.
  edges_depending_on_it:
  - M054
  - M055
- proposed_id: rule_obedience
  proposed_label: Obedience
  kind: rule
  why_needed: Its own section, resolved by loyalty and morale for creatures and refused outright by argumentative
    magic swords.
  edges_depending_on_it:
  - M059
  - M060
  - M061
- proposed_id: rule_mapping
  proposed_label: Mapping
  kind: rule
  why_needed: 'Its own section, and mechanically load-bearing elsewhere in the packet: it slows movement
    tenfold and requires a light source.'
  edges_depending_on_it:
  - M010
  - M011
  - M012
- proposed_id: rule_size
  proposed_label: Size Differential
  kind: rule
  why_needed: 'The ARMOR CLASS worked example turns on it: a dwarf adds factors to armour class against
    a giant. No registry node carries the comparison.'
  edges_depending_on_it:
  - M050
- proposed_id: item_ring_regeneration
  proposed_label: Ring of Regeneration
  kind: item
  why_needed: Named in DAMAGE as the magic that prevents actual death at zero hit points.
  edges_depending_on_it:
  - M055
- proposed_id: rule_hit_dice
  proposed_label: Hit Dice
  kind: rule
  why_needed: Also proposed by the three spell-chapter GURs. EXPERIENCE keys the monster award to hit
    dice.
  edges_depending_on_it:
  - M065
- proposed_id: rule_grappling
  proposed_label: Grappling
  kind: rule
  why_needed: Named in SPELL CASTING as a form of physical restraint that prevents somatic completion,
    and in Melee Combat as an attack option.
  edges_depending_on_it:
  - M005
- proposed_id: rule_spell_range
  proposed_label: Spell Range
  kind: rule
  why_needed: Also proposed by GUR-PKT-PHB-054-064-druid-spells-r01. Scroll spells fix it at a set effective
    caster level.
  edges_depending_on_it:
  - M008
