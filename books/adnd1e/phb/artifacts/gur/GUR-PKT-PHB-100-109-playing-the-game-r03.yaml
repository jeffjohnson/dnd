non_edge_observations:
- id: OBS-01
  topic: page 108 is a full-page illustration
  finding: The packet's markers run 100 to 109 with no {#p108}. The repository source steward confirmed
    that printed page 108 is a full-page illustration carrying no rules text, so the gap is correct and
    the packet needs no correction.
  why_it_matters: SOURCE_MARKDOWN 1.3 requires a marker gap to be returned as ambiguous attribution rather
    than guessed. Recording the steward's confirmation here and in the packet manifest means no later
    worker re-raises it. The SUCCESSFUL ADVENTURES run between the {#p107} and {#p109} markers is cited
    to 107 before the marker and 109 after it; nothing is cited to 108.
- id: OBS-02
  topic: this chapter is a summary, and the duplicate rate shows it
  finding: Sixteen of 89 candidates matched an existing canonical assertion. Several match rows already
    cited to these very pages, meaning a legacy pass extracted from this chapter before it was packetized.
  why_it_matters: Useful signal for whoever reviews coverage. It also means this packet's main value is
    not new edges but confirmed loci and the fifteen new nodes for mechanics the book names here for the
    first time.
- id: OBS-03
  topic: the seven forms of combat are enumerated here and nowhere else so far
  finding: COMBAT names turning undead, magical control, spell attacks, breath and gaze weapon attacks,
    magical device attacks, missile discharge, and melee as the exhaustive list.
  why_it_matters: This is the closest the PHB comes to a taxonomy of attack forms, and three of the seven
    had no node before this packet. If the Architect ever wants a combat-form domain or a Tier 3 role,
    this is the enumerating locus.
- id: OBS-04
  topic: a general rule about interruption is stated once and assumed everywhere
  finding: SPELL CASTING states that being struck, silenced, immobilized or restrained spoils a spell
    in progress. Individual spell entries throughout the book rely on this without restating it.
  why_it_matters: A candidate for the general-rule register under constitution 7.1, with this section
    as the establishing locus. Not proposed here because the counter-example test has not been run against
    the spell chapters, which 7.1 requires before a rule is registered.
- id: OBS-05
  topic: the healing cap is a magnitude, so it yields no edge
  finding: HEALING states that hit points can never exceed the total rolled for the character plus bonuses.
  why_it_matters: 'Recorded here because it looks like a constraint worth an edge and is not: the only
    endpoints are rule_hit_points on both sides, which would be a self loop, and the content of the rule
    is a ceiling value that constitution 2 removes. Noted so a later worker does not add it.'
- id: OBS-ASPECT-02
  topic: revision 2 exists only to bring aspects within constitution 5
  finding: The Builder graded aspect_word_count as an error under DEC-2026-0029 and returned this packet.
    60 of this GUR's aspects ran to five words or more.
  why_it_matters: Each replacement names the facet the cited rule touches, re-derived from the packet
    section named in the row rather than produced by shortening the previous string. DEC-2026-0029 prohibits
    mechanical truncation because aspect is part of the 5.1 assertion key; no edge was added, dropped
    or re-pointed, and the whole set was re-checked against canonical and against itself afterwards with
    no collision.
  owner: analyst
- id: OBS-REV-R03
  topic: the death threshold is a magnitude
  finding: PLAY-R04-B1. The aspect 'reaching zero or below' encoded a numeric threshold.
  why_it_matters: Re-derived from DAMAGE on page 105 as 'hit points exhausted', which names the facet
    without the number. Where the threshold sits is a magnitude and belongs in the rulebook.
  owner: analyst
