      line: 27
      heading: 'Changing Alignment:'
      page_derived_from_packet_markers: 34
      page_recorded_on_the_edge: '33'
      why_they_differ: 'DEC-2026-0016 authorises the page correction for this row and it is not yet integrated.
        This GUR changes no page: the Decision forbids combining the polarity cleanup with DEC-2026-0016''s
        page-only scope, so the edge keeps the page canonical carries today and the correction stays where
        it belongs.'
    quote: While involuntary change of alignment is quite possible, it is very difficult for a character
      to voluntarily switch from one to another, except within limited areas. Evil alignment can be varied
      along the like axis. The neutral character can opt for some more specific alignment.
    reading: 'Read as source polarity target: Changing Alignment worsens Alignment. The rule does not
      describe a procedure for changing alignment; it describes how narrow the option is. Voluntary movement
      is confined to the like axis and everything else requires stringent sacrifice or a quest. The bearer''s
      freedom to hold a chosen alignment is reduced, which is what worsens means in the constitution''s
      table.'
    why_not_governs: 'governs was the alternative and is rejected. The twenty-eight CONSTRAINS rows carrying
      governs with basis read are resolution machinery, almost all of them the monster ''struck only by
      enchanted arms'' shape, where the constraint names how a contest is settled. This row names a limit
      on an option space, which is the shape of the sixty CONSTRAINS rows carrying worsens with basis
      read: class eligibility at the lowest scores, maximum level attainable, maximum score, constitution
      bonus cap.'
    why_not_neutral: neutral is the value the row carries now, paired with basis unset, which the constitution
      defines as authored type not yet determined. It is the absence of a reading rather than a reading
      of no direction.
