non_edge_observations:
- id: OBS-56
  topic: an escalation stub without an ID stops the pipeline, and the ordering that caused it
  locus: GUR-PKT-PHB-033-035-alignment-hp-languages-r04 architectural_escalations
  finding: The GURs were written first and the escalation was allocated afterwards, in that order, so
    the entry that pointed at the escalation was authored when there was nothing to point at. It named
    a topic and a question and no ID. Both compiled GUPs came back blocked.
  why_it_matters: The cost was two blocked GUPs and two GUR revisions for work that was already correct.
    Nothing about the four readings was wrong. The Builder's warning named the defect and the fix in one
    line, which is the only reason this took one pass rather than several.
  what_to_do_differently: Allocate the escalation ID before writing any artifact that refers to the escalation.
    The allocator creates the file by exclusive creation and the package can be written into it later,
    so there is no reason to defer allocation. Where an artifact must be published before the ID exists,
    the entry belongs in blocking_notes rather than architectural_escalations, because that section is
    what the build reads for blockers.
