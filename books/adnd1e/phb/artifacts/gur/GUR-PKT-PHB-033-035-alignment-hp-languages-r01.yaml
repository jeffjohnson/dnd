non_edge_observations:
  - id: OBS-28
    topic: most of this packet is a restatement, and that is the result
    finding: >-
      Five relationships stated here are already carried from a better locus. Class
      predetermining alignment is packet 05's C-series, cited to each class's own section.
      Class determining hit die type is packet 02's E4. Intelligence determining how many
      languages a character may learn is packet 03's I1, and this page explicitly refers
      the reader back to CHARACTER ABILITIES for it. Druidic and thieves' cant are packet
      05's F-series. Racial tongues are packet 02's E1.
    why_it_matters: >-
      Re-asserting them would have produced five duplicate identity triples, which
      invariant 12 forbids, and would have attached weaker citations to relationships that
      already have strong ones. The eight edges proposed are the residue genuinely new
      here, and four of the eight concern alignment languages, the one mechanic this
      section owns outright.
    method: >-
      Each was checked against the specific edge reference in the earlier GUR. The
      intelligence-to-languages case is the clearest: this page carries a different
      aspect, learning time rather than count, but the same source, type and target, so it
      cannot be a second edge.

  - id: OBS-29
    topic: alignment change is accumulating edges across widely separated packets
    finding: >-
      align_change, at canonical degree eleven, now gains edges from two packets: paladin
      and monk class loss from packet 05, and here the loss of the former alignment
      tongue, the recorded drift on the alignment graph, and the difficulty of voluntary
      change.
    why_it_matters: >-
      This is the first node in the PHB work whose incident edges are being assembled from
      widely separated packets. It is a concrete argument for the neighborhood slice
      requested in BLK-02: without one the Analyst cannot see that a node is accumulating,
      and cannot check the accumulated set for coherence.

unresolved_identity_questions:
  - id: IDQ-10
    question: >-
      A6 and A7 both relate sys_alignment and rule_alignment_languages, as DERIVED_FROM
      and CONSTRAINS respectively. Two assertions or one?
    bearing: A6, A7
    analyst_handling: >-
      Proposed as two, because the text makes two claims: alignment determines which
      dialect is spoken, and a character may speak only one. Different edge types, so no
      duplicate identity. Flagged because a Reviewer may reasonably fold them.

