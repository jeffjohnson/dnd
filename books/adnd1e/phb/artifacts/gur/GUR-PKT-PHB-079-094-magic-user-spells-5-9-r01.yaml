source_summary: 'PHB 79 to 94, the fifth through ninth levels of the magic-user spell chapter and the
  conclusion of that chapter. 92 spell entries: twenty-four at fifth level, twenty-four at sixth, sixteen
  at seventh, sixteen at eighth and twelve at ninth. There is no preamble; the packet opens directly on
  the Fifth Level Spells heading and continues from PKT-PHB-064-079-magic-user-spells-1-4, which ends
  on the same printed page 79. Every entry carries all seven stat fields and an Explanation/Description.'
node_id_resolution_method: No node_registry_slice.csv was supplied. Each spell heading was stripped of
  its school parenthetical and a trailing Reversible, slugged, and looked up by ID and by label in both
  the registry and canonical nodes_master. Six headings place the school before the word Reversible and
  required a wider cleaner than the one used for the preceding packet; see OBS-02. Non-spell endpoints
  were resolved by direct search of the same two files.
grain_decisions:
- decision: Level scaling is one exp_level MODIFIES edge per spell that states it, never an aggregate.
  basis: Constitution 2.1; consistent with GUR-PKT-PHB-054-064-druid-spells-r01 and GUR-PKT-PHB-064-079-magic-user-spells-1-4-r01.
  how_applied: '68 of the 92 entries qualify. The 24 that do not are spells whose duration, range and
    area are all fixed or wholly special, which at these levels is common: wish, limited wish, geas, mind
    blank, permanency, symbol and the monster summoning entries among them.'
- decision: No magnitude, die expression, percentage or threshold appears in any aspect or condition.
  basis: Constitution 2 and GRAPH_INVARIANTS 11.
  how_applied: Checked programmatically against a digit and die-expression filter before publication.
    Entries whose whole mechanic is a table of numbers, such as the teleport error table and the magic
    jar die adjustments, contribute a relationship naming the input, not the table values.
- decision: Where an entry says it is the same as a cleric or druid spell of the same name, no cross-spell
    edge is recorded, because they are one node.
  basis: Constitution 3 and GRAPH_INVARIANTS 4.
  how_applied: Applied to animal growth, animate dead, control weather, lower water, part water, transmute
    rock to mud, feeblemind, astral spell and gate. Where the reference is to a differently named spell,
    a CROSS_REFERENCES edge is recorded instead.
