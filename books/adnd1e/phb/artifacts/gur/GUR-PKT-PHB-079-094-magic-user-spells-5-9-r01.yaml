- proposed_id: rule_concentration
  proposed_label: Concentration
  kind: rule
  why_needed: The conjure elemental entry makes unbroken concentration the condition on which control
    of a conjured elemental depends, and names wounding and grappling as what breaks it. Telekinesis and
    project image turn on it as well. Nothing in the registry represents it.
  edges_depending_on_it:
  - M004
  - M005
- proposed_id: rule_insanity
  proposed_label: Insanity
  kind: rule
  why_needed: 'Three entries inflict it as a distinct persistent state with named cures: contact other
    plane, clone, and the insanity application of symbol. The symbol entry names heal, restoration and
    wish as the removals, which makes it a mechanic rather than a description.'
  edges_depending_on_it:
  - M008
  - M089
  - M115
- proposed_id: rule_stunned
  proposed_label: Stunned
  kind: rule
  why_needed: Power word stun, bigby's clenched fist and the stunning application of symbol all inflict
    it, and the clenched fist entry gives a stunned opponent a mechanical consequence, a bonus to the
    attacker's roll.
  edges_depending_on_it:
