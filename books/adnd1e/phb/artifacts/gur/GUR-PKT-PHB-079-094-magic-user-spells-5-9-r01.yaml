unresolved_identity_questions:
- id: IDQ-01
  subject: spell_permanency is both a spell in this packet and a precondition named by another
  question: The enchant an item entry on page 84 states that no placed magic is permanent unless a permanency
    spell is used, and permanency is itself an eighth level entry on page 91 in this same packet. Both
    loci are in scope here.
  analyst_position: One node, cited to the entry that states each assertion. The GATES edge to item_magic_item
    is cited to page 84 where the requirement is stated, not to page 91.
  affects:
  - M040
  - M107
  - M108
  - M109
- id: IDQ-02
  subject: rule_psionic_use as the endpoint for psionic immunity
  question: Mind blank and prismatic sphere both exclude psionic detection and influence. rule_psionic_use
    exists in canonical and is used by a DMG-sourced edge from spell_esp.
  analyst_position: Reused rather than minting a psi_ node, because the packet speaks of psionic detection
    generally and not of a specific attack or defence mode. Flagged because psionics is optional material
    under constitution 8 while these two spells are core, so the edge crosses that boundary.
  affects:
  - M104
  - M140
architectural_escalations: []
non_edge_observations:
- id: OBS-01
  topic: the packet is complete against the book's own spell index
  finding: The magic-user columns of the spell tables in PKT-PHB-040-042-spells-intro list 24, 24, 16,
    16 and 12 spells for levels five through nine. This packet contains exactly those 92 names. The only
    textual difference is the sixth level entry the index renders as 'Guards & Wards' and this packet
    renders as 'Guards and Wards'.
  why_it_matters: Completes the OBS-37 cross-check across all nine magic-user spell levels; taken with
    the preceding packet the whole magic-user chapter matches its index exactly. On the one difference,
    SOURCE_MARKDOWN 1.3 makes the current packet canonical for the name, so 'Guards and Wards' governs
    and the index rendering is the drift.
- id: OBS-02
  topic: six headings place the school before the word Reversible
  finding: Animal Growth, Transmute Rock To Mud, Lower Water, Stone to Flesh, Imprisonment and Temporal
    Stasis are written as 'Name (School) Reversible'. Magic Jar additionally uses the school 'Possession',
    which is not one of the eight standard schools.
  why_it_matters: A name cleaner that only strips a trailing parenthetical, or that matches a fixed list
    of schools, silently mangles or drops these entries. Both faults were caught by the index cross-check
    rather than by inspection. Recorded so Builder and Reviewer do not re-introduce them, and so the preceding
    packet's method is not copied without widening.
- id: OBS-03
  topic: this packet supplies the second establishing text for a registered general rule
  finding: Shape change states that no system shock is incurred, and reincarnation states that neither
    a system shock nor a resurrection survival check is required. Constitution 7.1 lists shape change
    as one of the two texts establishing GR_SELF_FORM_CHANGE_NO_SHOCK.
  why_it_matters: Under 7.1 an establishing edge carries no general_rule_id, and both are recorded that
    way. Reincarnation is not currently listed in the register's established_by, and its denial covers
    resurrection survival as well, which is a wider claim than the registered rule makes. That is an Architect
    question, not acted on here.
- id: OBS-04
  topic: the prismatic sphere entry is a dense block of spell-versus-spell negations
  finding: Seven named spells each destroy one specific globe, and the entry fixes the order in which
    they must be destroyed.
  why_it_matters: Seven EXCLUDES edges share a source pattern and differ only in which globe they remove.
    The ordering constraint is real mechanics but is a sequence rather than a pairwise relationship, so
    it is carried in the shared condition rather than as its own edge. Reviewer should confirm that reading.
- id: OBS-05
  topic: system shock is invoked by three more spells in this packet
  finding: Stone to flesh and statue both require the check; polymorph any object requires it for living
    creatures.
  why_it_matters: All three sit on the imposed-change side of the boundary constitution 7.1 draws, and
    none restates the rule, so each could arguably be an inherited edge carrying GR_IMPOSED_FORM_CHANGE_SYSTEM_SHOCK.
    They are recorded as explicit_rule without a general_rule_id because each entry states the requirement
    in its own text, which 7.1 makes an establishing rather than an inheriting case.
blocking_notes:
- id: BLK-02
  note: No node_registry_slice.csv, local_neighborhood.json or general_rule_slice.json accompanied this
    packet. Resolution and duplicate checking were run against the full registry and edges_master.csv.
  impact: Does not block this GUR.
completeness_statement: All 92 spell entries were read and considered. Coverage was verified against the
  book's own spell index and matches exactly at all five levels. Every candidate edge carries a book,
  a packet-marker-derived printed page, and a section. No aspect or condition contains a magnitude. Authored
  polarity appears only on MODIFIES, TRIGGERS and CONSTRAINS, always with basis read. Candidates were
  checked against canonical on the constitution 5.1 assertion key and on the source-type-target triple;
  the results are recorded below. Seven endpoints are candidates minted by the preceding half of this
  chapter and are named as cross-packet targets rather than minted again.
