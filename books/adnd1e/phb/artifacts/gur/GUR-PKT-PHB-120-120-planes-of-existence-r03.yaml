source_summary: 'PHB 120, Appendix IV. A numbered list of twenty-five planes in two divisions, the Inner
  Planes 1 to 8 and the Outer Planes 9 to 25, followed by four short sections: ethereal travel, astral
  travel, and combat on either plane. The list is largely cosmology; the four sections are mechanics.'
node_id_resolution_method: No registry slice was supplied. The registry was probed for every plane, travel
  and hazard term in the packet. rule_ether_cyclone, rule_psychic_wind, rule_planar_travel, spell_astral_spell,
  spell_plane_shift and spell_negative_plane_protection already exist and are reused; seven endpoints
  had no identity and are proposed.
grain_decisions:
- decision: The twenty-five named planes do not each become a node.
  basis: Constitution 1 and the core test. Twenty-one of them are named and given an alignment and nothing
    else; changing or removing one would not require review of any other mechanic.
  how_applied: 'Four planes are minted because mechanics attach to them: the Negative Material as the
    power source for undead, the Prime Material and the Ethereal and Astral as the endpoints of the travel
    and spell-casting asymmetries. The two divisions are minted because the Astral''s defining limitation
    is stated against the Inner Planes and the alignment claim against the Outer. The remaining nineteen
    are recorded in OBS-02 rather than minted.'
- decision: Status is core, not optional.
  basis: Constitution 8, which flags what the text marks a DM option. The appendix's remark that how real
    each plane is depends on the referee's development is about campaign construction, not about whether
    the travel and combat rules apply.
  how_applied: Ethereal and astral travel are reached by core spells and items, so their mechanics are
    not separable from the core game.
- decision: No magnitude appears in any aspect or condition.
  basis: Constitution 2 and GRAPH_INVARIANTS 11.
  how_applied: The layer counts, the 666 layers of the Abyss and the sixteen first levels, are all removed.
candidate_nodes:
- proposed_id: rule_ethereal_plane
  proposed_label: Ethereal Plane
  kind: rule
  why_needed: 'The appendix gives it a numbered entry, its own travel section and its own combat rules,
    and makes it mechanically distinct from the Astral: it permeates all the Inner Planes, spells cast
    from it reach the Prime Material, and damage taken on it is real. rule_planar_travel exists but is
    the activity, not the place; see IDQ-01.'
  edges_depending_on_it:
  - M002
  - M016
  - M017
  - M019
  - M020
- proposed_id: rule_astral_plane
  proposed_label: Astral Plane
  kind: rule
  why_needed: 'Numbered entry with its own travel and combat sections, and defined against the Ethereal
    at every point: it touches only the Prime Material and the first layers of the Outer Planes, spells
    cast from it do not reach the Prime Material, and its damage destroys the astral body rather than
    the traveller.'
  edges_depending_on_it:
  - M004
  - M005
  - M006
  - M009
  - M014
  - M018
  - M021
- proposed_id: rule_inner_planes
  proposed_label: The Inner Planes
  kind: rule
  why_needed: 'The appendix''s own first division, entries 1 to 8. Load-bearing because the Astral Plane''s
    defining limitation is stated against it: the Astral does not touch any Inner Plane other than the
    Prime Material.'
  edges_depending_on_it:
  - M005
- proposed_id: rule_outer_planes
  proposed_label: The Outer Planes
  kind: rule
  why_needed: The appendix's second division, entries 9 to 25, and named as the source of alignment and
    the home of the deities. It is the endpoint the alignment system is sourced to.
  edges_depending_on_it:
  - M003
  - M006
- proposed_id: rule_negative_material_plane
  proposed_label: Negative Material Plane
  kind: rule
  why_needed: Named as the source of power for undead, which is a mechanical dependency rather than cosmology.
    spell_negative_plane_protection already exists in the registry and implies the plane it protects against.
  edges_depending_on_it:
  - M001
- proposed_id: rule_prime_material_plane
  proposed_label: Prime Material Plane
  kind: rule
  why_needed: The only Inner Plane the Astral touches, and the plane spells may or may not be cast into
    depending on which of the two transitive planes the caster occupies. Both asymmetries need it as an
    endpoint.
  edges_depending_on_it:
  - M022
- proposed_id: rule_silver_cord
  proposed_label: Silver Cord
  kind: rule
  why_needed: The mechanism that ties an astral traveller to the material body. Snapping it kills irrevocably,
    and the appendix names both what can snap it and what merely destroys the astral body.
  edges_depending_on_it:
  - M013
  - M014
  - M015
