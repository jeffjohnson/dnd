source_identity_conflicts:
  rule: contracts/SOURCE_MARKDOWN.md 1.3, Source Identity Authority.
  conflicts:
  - canonical_id: rule_planar_travel
    canonical_label: Ethereal Plane
    packet_usage: The packet names 'the Ethereal Plane' as a place and 'ethereal travel' as an activity,
      and treats them as different things across two sections.
    packet_locus: PHB p120, ETHEREAL TRAVEL
  analyst_view: rule_planar_travel carries the label 'Ethereal Plane' while its ID names the activity.
    The ID is the identity under GRAPH_INVARIANTS 4, so it is reused unchanged for the activity, and rule_ethereal_plane
    is minted for the place. The stored label is drift and will collide conceptually with the new node;
    Builder and Reviewer should surface it. No migration is proposed here.
unresolved_identity_questions:
- id: IDQ-01
  subject: rule_planar_travel is the activity; rule_ethereal_plane is the place
  question: rule_planar_travel exists at canonical and is labelled 'Ethereal Plane'. This packet needs
    both a node for the act of travelling and nodes for the two transitive planes, because the mechanics
    differ by which plane you are on, not by the act of travelling.
  analyst_position: Reuse rule_planar_travel for the activity and mint rule_ethereal_plane and rule_astral_plane
    for the places. The alternative, folding the Astral into rule_planar_travel, would make the two spell-casting
    edges contradict each other, since one plane permits casting into the Prime Material and the other
    forbids it.
  affects:
  - M002
  - M004
  - M005
  - M006
  - M007
  - M008
  - M009
  - M010
  - M012
  - M014
  - M016
  - M017
  - M018
  - M019
  - M020
  - M021
architectural_escalations: []
non_edge_observations:
- id: OBS-01
  topic: the two transitive planes are defined entirely by contrast
  finding: 'Every mechanical statement about the Astral is paired with the opposite statement about the
    Ethereal: what each touches, whether spells reach the Prime Material from it, and whether damage taken
    is real or falls on a projected body.'
  why_it_matters: 'Three edge pairs in this GUR are only meaningful together. If a Reviewer rejects one
    side of a pair the other becomes misleading rather than merely incomplete, so they should be dispositioned
    as pairs: the GATES and EXCLUDES on rule_spell_casting, and the MODIFIES and CONSTRAINS on damage.'
- id: OBS-02
  topic: nineteen named planes yield nothing and are not minted
  finding: The Seven Heavens, Twin Paradises, Elysium, the Happy Hunting Grounds, Olympus, Gladsheim,
    Limbo, Pandemonium, the Abyss, Tarterus, Hades, Gehenna, the Nine Hells, Acheron, Nirvana and Arcadia
    are each given a name and an alignment and nothing further. The four Elemental Planes and the Positive
    Material are named with a sentence of description and no mechanic.
  why_it_matters: They fail the core test in this packet. Several will earn nodes from the DMG or Monster
    Manual, where demons, devils and elementals are given planar origins that do carry mechanics. Listed
    here so a later extractor can see they were considered and why they were declined, rather than assuming
    the appendix was skimmed.
- id: OBS-03
  topic: the alignment claim is the appendix's one link to a core subsystem
  finding: The Outer Planes are named as the source of alignment, described as religious, philosophical
    and ethical ideals, and as the homes of the deities.
  why_it_matters: sys_alignment is one of the graph's most connected nodes and its inbound edges are almost
    all about how alignment constrains a character. This is the only edge so far that says where alignment
    comes from, which makes it structurally unusual and worth the Reviewer's check.
- id: OBS-ASPECT-02
  topic: revision 2 exists only to bring aspects within constitution 5
  finding: The Builder graded aspect_word_count as an error under DEC-2026-0029 and returned this packet.
    18 of this GUR's aspects ran to five words or more.
  why_it_matters: Each replacement names the facet the cited section touches, re-derived from that section
    in the claimed source rather than produced by shortening the previous string, as DEC-2026-0029 requires.
    This packet was not returned; the rows were graded warning before the Decision and would fail on the
    next compile, so they are corrected now rather than left to bounce. No edge was added, dropped or
    re-pointed; the set was re-checked against canonical and against itself with no collision.
  owner: analyst
- id: OBS-REV-R03
  topic: the magic-weapon rule covers both transitive planes, not only the Ethereal
  finding: 'REV P120-R03-B1 directs M016 and M019 to source rule_ethereal_plane instead of rule_planar_travel.
    For M016 that matches the source exactly: ETHEREAL TRAVEL says ''Creatures in ethereal state need
    neither food, drink, rest, or sleep.'' For M019 the sentence in ETHEREAL AND ASTRAL COMBAT reads ''Certain
    magic weapons will remain magical in either of these planes, but some will not.'''
  why_it_matters: The correction is applied as directed and M019 is now correct about the Ethereal. It
    is also silent about the Astral, where the same sentence applies. The Reviewer should decide whether
    a parallel rule_astral_plane MODIFIES item_magic_item row is wanted; it would join the three contrast
    pairs OBS-01 already asks to be dispositioned together. No row was added here, because adding an edge
    is not within a correction directed at an existing one.
  owner: analyst
blocking_notes:
- id: BLK-02
  note: No node_registry_slice.csv, local_neighborhood.json or general_rule_slice.json accompanied this
    packet. The registry was probed directly by pattern for plane, astral, ethereal, cord, cyclone and
    psychic terms.
  impact: Does not block this GUR.
completeness_statement: All twenty-five numbered entries and all four prose sections were read and considered.
  Every candidate edge cites PHB 120 and a section. No aspect or condition contains a magnitude. Authored
  polarity appears only on MODIFIES, TRIGGERS and CONSTRAINS, always with basis read. Candidates were
  checked against canonical on the constitution 5.1 assertion key and on the source-type-target triple.
  Nineteen named planes were deliberately not minted; see OBS-02.
