      is not an input to ability determination, not that sex actively prevents anything.
      The hedge "in all but a few cases" is real and unresolved: the packet names no
      exception. Reviewer should not treat the condition as decorative. See also
      IDQ-03 on the cross-book risk.

candidate_general_rules:
  - proposed_id: GR_DM_DISCRETION_FINAL
    statement: >-
      Where the rules and the Dungeon Master's ruling conflict within a campaign, the
      Dungeon Master's ruling governs.
    established_by: "PHB p.8 THE GAME"
    quoted_basis: >-
      The text states in capitals that the referee is the final arbiter of all affairs
      of his or her campaign, and adds that participants have no recourse to the
      publisher.
    why_proposed: >-
      The canonical node rule_dm_discretion already exists with degree 58 and carries the
      role override_source, so the graph is already treating DM discretion as something
      that overrides other mechanics. This passage is the general statement those
      specific edges are instances of, which is the exact shape of an inherited general
      rule under constitution section 7.1.
    not_promoted: true
    analyst_position: >-
      Proposed, not applied. Promoting this would authorise inherited edges from
      rule_dm_discretion to a very large share of the graph, which is an Architect
      decision and a costly one to reverse. There is also a real argument against
      promotion: a rule that overrides everything partitions nothing and may be better
      left as the existing specific edges. Analyst has created no edge from it and
      recommends the Architect weigh whether the general rule earns its keep.

