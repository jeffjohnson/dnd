# 7 candidate edges. 0 candidate nodes. 1 candidate general rule.
#
# The INTRODUCTION and THE GAME sections are framing prose and yield nothing.
# All seven edges come from two passages: the character-creation summary on p8,
# which states outright what determines languages and hit points, and the
# level-terminology explanation on p8. One negative dependency comes from p7.
