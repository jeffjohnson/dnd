domain_boundary_questions:
  - id: DBQ-01
    question: >-
      Does character_creation belong as a domain in its own right, or is it a procedural
      sequence that touches other domains without being one? Every edge in this packet
      except E6 and E7 arises from a single character-creation paragraph, yet each
      concerns a different subject area.
    why_it_matters: >-
      If character_creation is a domain, a large fraction of early PHB edges land in it
      and it becomes a hub. If it is not, those edges distribute across languages,
      equipment, and hit points instead. The choice shapes the domain graph before any
      domain exists.
    analyst_position: no recommendation; insufficient corpus seen to judge

# -----------------------------------------------------------------------------
# Candidates considered and rejected
# -----------------------------------------------------------------------------
rejected_candidates:
  - text_locus: "THE GAME, p8"
    quoted_gist: characters gain experience and move upward in power by meeting challenges
    why_considered: >-
      states the experience-to-advancement dependency, which is unquestionably
      load-bearing
    rejection_reason: >-
      Rejected here on grounds of grain and citation quality, not truth. The statement is
      framing prose with no procedure attached; the experience tables that carry the
      relationship appear in the class packets, where the edge can be cited precisely.
      Asserting it from this page would create an edge whose citation points at prose
      that names no table. exp_level already carries degree 162, so the relationship is
      certainly represented.

  - text_locus: "CREATING THE PLAYER CHARACTER, p8"
    quoted_gist: all characters begin at 1st level
    why_considered: canonical node rule_starting_level exists with degree 3
    rejection_reason: >-
      A constant, not a relationship. The mechanical content is the value 1, which the
      grain rule forbids storing. The node exists to hold this fact; no edge is implied
      by the sentence.

  - text_locus: "CREATING THE PLAYER CHARACTER, p8"
    quoted_gist: >-
      the creation sequence runs abilities, then race, class, alignment, name,
      languages, money, equipment, hit points
    why_considered: >-
      an ordering this explicit often encodes real dependencies, since race gates class
      and class gates hit dice
    rejection_reason: >-
      The passage states the order of steps but does not assert that any step depends on
      the one before it. The genuine dependencies inside the sequence are extracted
      individually as E1 through E5. Reading further dependency into the ordering would
      be inference dressed as explicit rule. Where the book does assert such gating, in
      the race and class tables, later packets can cite it directly.

  - text_locus: "CREATING THE PLAYER CHARACTER, p8"
    quoted_gist: level has four distinct meanings — character, dungeon, spell, monster
    why_considered: >-
      the four meanings map onto four separate canonical nodes and the distinction is
      the subject of a named extraction hazard
    rejection_reason: >-
      Denies that four concepts are the same concept. That is an identity claim, not a
      dependency claim, and EXCLUDED_FROM asserts that one thing is not an input to
      another, which is a different assertion. No edge type expresses "these are not the
      same node". Recorded as OBS-05, where it is more useful.

  - text_locus: "INTRODUCTION, p7"
    quoted_gist: clerics and fighters strengthened relative to magic-users; sub-classes included
    why_considered: names classes and relative power
    rejection_reason: >-
      Edition-comparison commentary addressed to readers of earlier D&D. It describes
      changes between rulesets, not a relationship inside this one.

  - text_locus: "INTRODUCTION, p7"
    quoted_gist: players are urged not to read the Dungeon Masters Guide
    why_considered: relates two books in the ruleset
    rejection_reason: >-
      Advice about reading habits. No mechanic on either side.

# -----------------------------------------------------------------------------
non_edge_observations:
  - id: OBS-05
    topic: the book's own definition of the four meanings of "level"
    locus: "CREATING THE PLAYER CHARACTER, p8"
    finding: >-
      The text enumerates four distinct uses of the word level and states they are
      different things sharing a name: level as character power, level as depth of a
      dungeon, level as spell difficulty, and level as a monster's threat grade. It
      further records that the author considered using rank, power, and order to
      separate them and kept level only because existing usage had entrenched it.
    why_it_matters: >-
      This is the highest-value item in the packet, and it is not an edge. The PHB
      extraction profile declares class_level_conflation as a known hazard, and the
      constitution's review_flag vocabulary includes it. This passage is the book's own
      statement of the distinction the hazard is about, which means the ruleset does not
      need an invented convention to separate these identities. The registry already
      reflects the split: exp_level, gen_dungeon_level, rule_spell_level, and
      gen_monster_level_matrix are four separate nodes. That the author himself
      considered four different words is strong evidence the split is faithful to the
      source rather than imposed on it.
    recommendation: >-
      Architect may wish to cite this passage in whatever guidance governs the
      class_level_conflation flag, so the distinction rests on the book rather than on
      analyst convention. Every later packet that says "level" without qualification
      should be resolved against these four before an edge is drawn.
    analyst_action_taken: >-
      Used it. E6 carries review_flag class_level_conflation precisely because it links
      a character-power level to a spell-difficulty level, which is the boundary this
      passage draws.

  - id: OBS-06
    topic: aggregate node naming is inconsistent across kinds
    locus: registry observation arising from E1 through E4
    finding: >-
      The aggregate concept "race" is canonically race_any under the race_ prefix, while
      the aggregate concept "class" is canonically sys_classes under the sys_ prefix.
      The aggregate for abilities is sys_ability_scores. There is no class_any and no
      race equivalent under sys_.
    why_it_matters: >-
      E1 and E2 are the same assertion about two parallel concepts, yet they resolve onto
      nodes under different prefixes. An analyst working from a slice rather than the
      full registry could easily miss sys_classes, fail to find class_any, and mint a
      duplicate. Constitution section 3.2 names exactly this drift as the most common
      defect in the graph.
    recommendation: >-
      Architect decision on whether aggregates belong under their kind prefix or under
      sys_. No migration is proposed here; the point is that the inconsistency is a
      standing duplication trap for every future packet.
    analyst_action_taken: >-
      Used the existing IDs as found. No node was minted.

unresolved_identity_questions:
  - id: IDQ-01
    question: >-
      Is the correct source for E6 exp_level, or does caster level need an identity
      distinct from character experience level?
    bearing: E6
    analyst_handling: >-
      Used exp_level and set review_flag class_level_conflation rather than choose
      silently.

  - id: IDQ-02
    question: >-
      Does E3 duplicate an assertion already carried by rule_alignment_languages, and if
      so should E3 be rejected or should the two nodes be related by DERIVED_FROM?
    bearing: E3
    analyst_handling: Proposed with the duplication called out; deliberately not resolved.

  - id: IDQ-03
    question: >-
      E7 asserts that sex is not an input to ability scores, hedged as true in all but a
      few cases. Unearthed Arcana, a book inside this same ruleset, is widely understood
      to introduce sex-linked ability treatment. If a UA packet later asserts the
      contrary, is that an OVERRIDES with supersession_basis later_publication, or does
      it reveal that E7's hedge was pointing at exactly those cases?
    bearing: E7
    analyst_handling: >-
      Recorded now, while the PHB claim is fresh, so the UA analyst is not left to
      rediscover the conflict. No cross-book artifact is created; per
      REPOSITORY_STRUCTURE cross-book work belongs under rulesets/adnd1e/cross-book/ and
      is not the Analyst's to open on suspicion.

