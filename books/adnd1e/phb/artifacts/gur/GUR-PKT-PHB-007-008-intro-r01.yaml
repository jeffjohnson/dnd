source_summary: >-
  Pages 7-8. An introduction describing the game's scope and its relation to the
  Monster Manual and Dungeon Masters Guide; THE GAME, which explains role playing,
  the Dungeon Master's function, and expectations of player conduct; and CREATING
  THE PLAYER CHARACTER, which summarises the character-creation sequence and then
  disambiguates the four distinct meanings the word "level" carries in the system.
  The first two sections are almost entirely non-mechanical. The third is the first
  load-bearing text in the book.

node_id_resolution_method: >-
  No node_registry_slice.csv was supplied with the packet. Rather than mint candidate
  nodes that would duplicate canonical ones, the Analyst performed targeted lookups
  against rulesets/adnd1e/registries/nodes.csv for each concept named in the packet.
  All seven edges resolved onto existing canonical IDs; no new node was needed. This is
  narrower than loading the graph, which the role instructions forbid, but it is not
  the supplied slice the process expects. See BLK-02.

