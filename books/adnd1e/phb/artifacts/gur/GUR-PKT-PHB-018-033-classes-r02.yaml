revision: 2
supersedes: GUR-PKT-PHB-018-033-classes-r01
revision_reason: >-
  DEC-2026-0003 returned REVIEW-ESC-CLASS-SPECIAL-ABILITIES to Analyst and Builder with
  the instruction to apply the constitution's grain and impact tests ability by ability
  and to escalate only a concrete ontology conflict. r01's OBS-26 asked a blanket
  question, which was the right thing to flag and the wrong way to flag it. r02 does the
  work: each of the eleven monk special abilities is tested individually against the
  registry and the core test. Seven new edges result, one existing edge is corrected, four
  are deferred to the spell packets with reasons, and one candidate node is proposed. No
  escalation is raised, because none of the eleven turns out to be an ontology conflict.
  The same revision also corrects r01's framing of candidate nodes, which described them
  as awaiting an Architect ruling; under DEC-2026-0003 an unambiguous node addition under
  an approved prefix is ordinary Builder and Reviewer work.
analyst_pass: page-sweep
citation_code: PHB
page_start: 18
page_end: 33

# =============================================================================
# HEADLINE RESULT
# =============================================================================
# 108 candidate edges. 2 candidate nodes. 0 architectural escalations.
#
#  1. The packet 04 deferral is discharged and was CORRECT. Nine of the ten
#     classes restate their own alignment restriction in their own section,
#     with a better citation than the race-table legend the deferral came from.
#     The tenth, the illusionist, does not. See OBS-22.
#
#  2. The packet 03 ability-minimum edges are confirmed complete. Every class
#     minimum stated in this packet is already carried by packet 03's GATES
#     edges. Nothing new; nothing missing. Verified class by class. See OBS-23.
#
#  3. race_human and race_demihuman, both approved since packet 04, are used
#     here for the multi-class and dual-class rules. DEC-2026-0002's rule that
#     group membership generates no edges is respected: G1 is an explicit
#     source-supported edge, not an inheritance. See OBS-24.
#
#  4. Two duplicate identity triples arose during generation and were resolved
#     before assembly rather than emitted. See grain_decisions.
# =============================================================================

source_summary: >-
  Pages 18 through 33, the CHARACTER CLASSES section in full. An opening survey of the
  ten classes; CHARACTER CLASSES TABLE I giving hit die type, maximum hit dice, spell
  ability and class level limit; TABLE II giving armour, shield, weapons, oil and poison
  permitted. Then a section for each of the ten classes carrying its ability minimums,
  alignment restriction, experience table, spell progression table where applicable, and
  its distinctive powers and strictures. Finally the multi-classed character and the
  character with two classes. Twenty-three tables in all, twelve of them experience or
  spell progressions.

node_id_resolution_method: >-
  No slice supplied; resolved by targeted registry lookup as in packets 02 to 04. 106 of
  108 edges resolved onto existing canonical IDs. Two concepts had no node. A third
  candidate, rule_prime_requisite, is carried forward unchanged from packet 03 and is not
  re-proposed here; it is still pending an Architect ruling.

grain_decisions:
  - decision: >-
      The twelve experience and spell progression tables yield no edges of their own.
    reasoning: >-
      Their content is entirely magnitudes: experience thresholds, hit dice counts and
      spell counts per level. What survives the grain rule is that class level determines
      spell availability, which is already asserted by A1 to A6 as the class gating spell
      use, and by packet 02's E6 and packet 03's I2 and W11 for the level and ability
      gates on spell level access. Restating it per class per spell level would be twelve
      near-identical edges carrying no new relationship.
  - decision: >-
      Per-class ability minimums are not re-extracted here.
    reasoning: >-
      Verified redundant against packet 03 rather than assumed redundant. See OBS-23.
  - decision: >-
      Two duplicate identity triples were resolved before assembly, not emitted.
    reasoning: >-
      class_druid CONSTRAINS exp_level and class_monk CONSTRAINS exp_level each arose
      twice: once from the Table I class level limit, and once from the rule that the
      highest ranks are contested and numerically limited. Invariant 12 forbids duplicate
      edge identity and the constitution defines no distinct assertion key that would
      permit the pair, so each was folded into a single edge whose condition records both
      the hard ceiling and the contest. The alternative, inventing a second target node to
      carry the contest, would have manufactured identity to dodge an invariant.

candidate_nodes:
  - proposed_id: rule_quivering_palm
    proposed_label: Quivering Palm
    prefix: rule_
    prefix_is_approved: true
    why_needed: >-
      Added in r02 from the per-ability analysis in OBS-26. The monk's highest attack form,
      touching a victim to set up fatal vibrations under stated limits on frequency, target
      type and hit dice. No canonical node covers it and it is not a spell.
    edges_depending_on_it: []
    note: >-
      Proposed with no edge attached, because the mechanic's targets are the victim's death
      and the monk's own level, neither of which this packet states as a relationship the
      core test admits. It is proposed so the identity exists when the DMG combat material
      references it.

  - proposed_id: rule_dual_class
    proposed_label: The Character with Two Classes
    prefix: rule_
    prefix_is_approved: true
    why_needed: >-
      The registry holds rule_multiclass at degree 14 but nothing for the human
      dual-class rule, which this packet gives a section of its own and which works
      differently: the character stops advancing in the original class rather than
      dividing experience between classes. Collapsing the two would make the graph unable
      to distinguish "what breaks if multi-classing changes" from "what breaks if
      dual-classing changes".
    edges_depending_on_it: [G3, G4, G5, G6]

  - proposed_id: rule_tracking
    proposed_label: Tracking
    prefix: rule_
    prefix_is_approved: true
    why_needed: >-
      Ranger tracking is a distinct procedure with its own underground and outdoor
      resolution, and no canonical node covers it. The registry's nearest matches,
      item_boots_varied_tracks and monster_slithering_tracker, are unrelated.
    edges_depending_on_it: [F19]

carried_forward_candidates:
  - id: rule_prime_requisite
    first_proposed_in: GUR-PKT-PHB-009-013-ability-scores-r01
    status: >-
      Routed to Builder and Reviewer by DEC-2026-0003, not awaiting an Architect ruling.
      That decision holds that absence from the registry is not by itself architectural and
      that an unambiguous addition under an approved prefix and kind may be approved through
      the normal GUP and Review path. The disposition recorded there is
      return_to_builder_and_reviewer, which is a routing instruction and not a rejection.
    edges_here: [D1]
    note: >-
      This packet strengthens the case for it. Packet 03 saw the bonus from the ability
      side, four times. This packet gives the class side for all ten classes, including
      three explicit denials, which is what D2 to D4 record.

