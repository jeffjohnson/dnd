candidate_general_rules: []
candidate_general_rules_note: >-
  None proposed. The pattern that a sub-class inherits its parent's mechanics unless the
  text says otherwise, druid from cleric and paladin and ranger from fighter, has the
  shape of a general rule. It is not proposed, because every inheritance this packet
  relies on is stated outright in the sub-class section, so nothing would be inherited
  silently and no edge here would carry a general_rule_id. Recorded as OBS-25 for the
  Architect, since it may earn promotion once the spell packets are read.

domains_touched: []
domains_touched_note: BLK-01 unchanged; the domain registry is still an empty map.

candidate_domains:
  - name: character_classes
    basis: the whole packet
  - name: class_eligibility
    basis: the alignment gates C1 to C7, joining the ability and race gates of packets 03 and 04
  - name: level_advancement
    basis: A11 to A13, G5, and the exp_level edges through section F
  - name: followers_and_loyalty
    basis: the follower, henchman and hireling edges across five classes
  - name: thief_function
    basis: the thief, assassin and monk skill edges
  - name: equipment_restriction
    basis: B1 to B8

domain_boundary_questions:
  - id: DBQ-04
    question: >-
      class_eligibility now draws from three packets and three unrelated table families:
      ability minimums in packet 03, racial class limitations in packet 04, and alignment
      restrictions here. Sixty-seven edges across the three. Is that one domain?
    analyst_position: no recommendation; the same question as DBQ-02 and DBQ-03, now larger

rejected_candidates:
  - text_locus: "the twelve experience and spell progression tables, pages 20 to 32"
    quoted_gist: experience thresholds, hit dice and spells usable per class per level
    rejection_reason: >-
      Entirely magnitudes. See grain_decisions. The relationships they encode are already
      carried by the class-gates-spell-use edges here and the level and ability gates on
      spell level access from packets 02 and 03.

  - text_locus: "every class section, pages 20 to 31"
    quoted_gist: the ability score minimums required to enter each class
    rejection_reason: >-
      Verified redundant against packet 03's eighteen GATES edges rather than assumed. See
      OBS-23 for the class-by-class check.

  - text_locus: "The Cleric, p20"
    quoted_gist: the undead are ghasts, ghosts, ghouls, liches, mummies and so on
    why_considered: monster_undead exists canonically at degree 28
    rejection_reason: >-
      A definition by enumeration, not a relationship. The load-bearing claim, that
      clerics turn undead, is F1. Which creatures count as undead is a Monster Manual
      matter and the text says so.

  - text_locus: "The Cleric, p20; The Fighter, p22; The Magic-User, p25"
    quoted_gist: revenue of nine, seven or five silver pieces per inhabitant per month
    rejection_reason: >-
      Magnitudes attached to a stronghold. The relationship that high level gates
      stronghold construction is F3 and F26.

  - text_locus: "The Paladin, p22, benefit 8"
    quoted_gist: the paladin may call for an intelligent warhorse with stated statistics
    why_considered: a real granted resource
    rejection_reason: >-
      No canonical node represents the paladin's warhorse, and the passage is largely
      statistics, which are magnitudes. A candidate node was considered and not proposed:
      the packet gives it two sentences and the Analyst would be minting identity for a
      mechanic the book barely elaborates. Flagged here so the omission is deliberate and
      visible rather than silent.

  - text_locus: "The Assassin, p29"
    quoted_gist: the assassination table gives roughly a fifty percent chance of killing
    rejection_reason: >-
      The relationship, that assassins gain an assassination attack on surprise, is F39.
      The probability is a magnitude.

  - text_locus: "The Monk, p31, special abilities A through K"
    quoted_gist: eleven lettered special abilities gained at rising levels
    why_considered: >-
      several are genuinely mechanical, including immunity to poison, resistance to
      beguiling and charm, and the quivering palm
    rejection_reason: >-
      Partially extracted, not wholly rejected. Those with an existing canonical target
      are recorded, notably disease immunity as F57. The remainder, including quivering
      palm, speak with plants, feign death and mind masking, have no canonical node, and
      proposing eleven candidate nodes from one table would flood the registry with
      monk-only identities. Recorded as OBS-26 with a recommendation.

non_edge_observations:
  - id: OBS-22
    topic: the packet 04 alignment deferral was correct, with one exception
    locus: all ten class sections, pages 20 to 31
    finding: >-
      OBS-15 of GUR-PKT-PHB-013-018-races-r03 deferred the class alignment restrictions
      out of the Table I legend on p13 and recorded the deferral as a test: if the class
      sections did not restate them, the deferral was wrong. They do. Cleric states any
      alignment save true neutral; druid states the only absolute neutrals; fighter states
      any alignment; paladin states lawful good and must remain so; ranger states good;
      magic-user states any alignment; thief states neutral or evil, rarely neutral good;
      assassin states evil; monk states lawful. That is nine of ten classes stating their
      own restriction in their own section.
    the_exception: >-
      The illusionist section states no alignment restriction at all. The p13 legend gives
      illusionist as (A), any. So for the illusionist the race-table legend is the only
      statement in either packet, and no C-series edge is proposed for it.
    consequence: >-
      The deferral is discharged for nine classes with better citations than the legend
      would have given. For the illusionist the Reviewer has a choice: accept that "any
      alignment" is the absence of a restriction and therefore not an edge, which is the
      Analyst's reading and why nothing is proposed, or cite it back to the p13 legend in
      packet 04. The Analyst recommends the former, consistent with rejecting the "yes"
      cells of the race table in packet 04.
    why_recorded: >-
      A deferral is only sound if someone checks it. This one was checked class by class.

  - id: OBS-23
    topic: packet 03's ability minimums are complete for all ten classes
    locus: all ten class sections
    finding: >-
      Every ability minimum stated in this packet was checked against the eighteen
      ability-gates-class edges of GUR-PKT-PHB-009-013-ability-scores-r01. Cleric wisdom;
      druid wisdom and charisma; fighter strength and constitution; paladin strength,
      intelligence, wisdom, constitution and charisma; ranger strength, intelligence,
      wisdom and constitution; magic-user intelligence and dexterity; illusionist
      intelligence and dexterity; thief dexterity; assassin strength, intelligence and
      dexterity; monk strength, wisdom, dexterity and constitution. All are already
      carried. None is missing, and this packet adds none.
    why_it_matters: >-
      Packet 03 extracted these from the ability tables, which list class minimums in a
      General Information column. It was not obvious that a column of scattered notes
      would prove complete against ten dedicated class sections. It did. That is evidence
      the ability tables are the authoritative locus, which supports having extracted them
      there rather than here.
    consequence: no edges; the potential twenty-eight duplicates are not proposed

  - id: OBS-24
    topic: the new race nodes are used, and the taxonomy rule is respected
    locus: "The Multi-Classed Character and The Character with Two Classes, p33"
    finding: >-
      The packet states that only non- or semi-human characters can be multi-classed, and
      that the character with two classes must be human. Both are group-grain statements
      about exactly the categories DEC-2026-0002 established.
    how_it_was_handled: >-
      G1 asserts race_demihuman GATES rule_multiclass and G2 asserts race_human
      EXCLUDED_FROM rule_multiclass, both as explicit source-supported edges citing this
      page. Neither is an inheritance from taxonomy membership, which DEC-2026-0002
      forbids. G3 uses race_human for the dual-class rule, which is the second edge that
      node has earned since it was approved.
    redundancy_note: >-
      G1 overlaps the six per-race GATES edges G1 to G6 of packet 04, which assert the
      same eligibility per race from the race sections. Whether the group edge should
      replace them, coexist with them, or be rejected in their favour is a Reviewer
      question and exactly the grain choice DEC-2026-0002 anticipated. The Analyst
      proposes both and flags the overlap rather than silently choosing.

  - id: OBS-25
    topic: sub-class inheritance is stated, not assumed
    locus: The Druid, The Paladin, The Ranger, The Illusionist, The Assassin
    finding: >-
      Five classes are sub-classes of another, and each states its inherited behaviour
      explicitly: druids fight and save as clerics, monks attack on the cleric table and
      save on the thief table, assassins attack on thief tables and have all thief
      functions, illusionists conform to magic-users in most respects.
    why_it_matters: >-
      This is the clearest general-rule candidate seen so far, but promoting it now would
      buy nothing, because every instance is stated outright and would carry an empty
      general_rule_id under constitution 7.1 regardless. It becomes worth promoting only
      if a later packet relies on the inheritance without restating it, which the spell
      chapters may.
    recommendation: Architect may wish to note it now and decide after the spell packets.

  - id: OBS-26
    revision_status: rewritten_in_r02_at_architect_direction
    topic: the eleven monk special abilities, tested one by one
    locus: "Notes Regarding Special Abilities, pages 31 to 32"
    r01_error: >-
      r01 asserted that only disease immunity had a canonical target node and asked a
      blanket question about whether class-specific abilities warrant nodes at all.
      DEC-2026-0003 returned that as not decidable architecture. It was also wrong on the
      facts: re-checking the registry ability by ability found targets for seven of the
      eleven. r01 under-checked and then escalated the gap instead of closing it.
    method_in_r02: >-
      Each lettered ability was tested against the core test and then against the registry
      for an existing target. Extract where a canonical target exists; defer where the
      target is a spell that the spell packets will establish; propose a node only where
      the mechanic exists nowhere else.
    disposition:
      - ability: "A, speak with animals at third level"
        outcome: deferred
        reason: >-
          The target is the Speak with Animals spell, which appears in the cleric and
          druid tables of packet 09 and will be established with its own description.
          Minting it from a monk table would fix a spell's identity from the wrong locus.
      - ability: "B, mind masking against ESP at fourth level"
        outcome: extracted as M1
        target: spell_esp
      - ability: "C, immunity to disease, haste and slow at fifth level"
        outcome: extracted as F57 corrected, plus M2 and M3
        target: rule_disease, spell_haste, spell_slow
        note: >-
          F57 was typed EXCLUDED_FROM in r01 and is corrected to EXCLUDES in r02.
          Constitution 4.1 distinguishes them: EXCLUDED_FROM says X is not an input to Y,
          EXCLUDES says X actively prevents Y. An immunity is the second. The same
          correction is applied by using EXCLUDES for M2, M3 and M8.
      - ability: "D, self-induced catalepsy at sixth level"
        outcome: deferred
        reason: >-
          spell_feign_death exists but denotes the spell. The monk ability is
          self-induced and physiological, so pointing at the spell would assert a
          relationship the text does not make. No node represents the ability.
      - ability: "E, self-healing at seventh level"
        outcome: extracted as M4
        target: rule_hp_recovery
      - ability: "F, speak with plants at eighth level"
        outcome: deferred
        reason: same as A; the target is a spell the spell packets will establish
      - ability: "G, resistance to beguiling, charm, hypnosis and suggestion at ninth level"
        outcome: extracted as M5 and M6
        target: spell_charm_person, spell_suggestion
        note: >-
          Beguiling and hypnosis have no canonical spell node and are not extracted. The
          two that exist carry the relationship; the omission is partial coverage of one
          sentence rather than a missing mechanic.
      - ability: "H, telepathic and mind blast defence at tenth level"
        outcome: extracted as M7
        target: psi_attack_modes
      - ability: "I, poison immunity at eleventh level"
        outcome: extracted as M8
        target: save_poison
      - ability: "J, geas and quest immunity at twelfth level"
        outcome: deferred
        reason: no canonical node for either spell; both are magic-user spells the spell packets will establish
      - ability: "K, quivering palm"
        outcome: candidate node proposed
        reason: >-
          The only one of the eleven that exists nowhere else in the graph and is not a
          spell. It is a distinct attack form with its own preconditions and limits.
    is_this_an_ontology_conflict: >-
      No. That is the finding. Seven abilities resolved onto existing canonical nodes, four
      are deferred to a packet that will establish their targets properly, and one needs an
      ordinary node under an approved prefix. Under DEC-2026-0003 that last case is Builder
      and Reviewer work, not an escalation. r01 escalated because it had not done the
      per-ability work; having done it, there is nothing architectural here.
    recommendation: >-
      The same method should be applied to the paladin benefits and ranger abilities that
      r01 also only partly represented, rather than asking about them as a class.

unresolved_identity_questions:
  - id: IDQ-08
    question: >-
      B10 asserts sys_alignment GATES rule_poison_ingested, from the Table II footnote
      that the poison prohibition binds only clerics who are not of evil alignment. Should
      the source be sys_alignment, or class_cleric qualified by alignment?
    bearing: B10
    analyst_handling: >-
      Used sys_alignment because alignment is what varies in the sentence; the class is
      fixed. Flagged because the reverse reading is defensible.

  - id: IDQ-09
    question: >-
      F35 asserts exp_level CONSTRAINS thief_pick_pockets, for the rule that a victim's
      level reduces the thief's chance. The exp_level node here denotes the victim's
      level, not the thief's, while F30, F32 and F33 use the same node for the thief's
      own level, in the same class section and on the same page.
    bearing: F35
    analyst_handling: >-
      Proposed as written and flagged rather than resolved. The graph has one node for
      experience level and this rule needs it to mean two different characters at once.
      This is a genuine expressiveness limit, not a naming slip, and it is adjacent to the
      class_level_conflation hazard already flagged on packet 02's E6.

architectural_escalations: []
architectural_escalations_note: >-
  None raised. OBS-26 is the nearest, and it is deliberately recorded as an observation
  seeking guidance rather than as an escalation, because no edge in this packet depends on
  the answer and the question is better decided across several packets than from this one.

blocking_notes:
  - id: BLK-01
    severity: unchanged
    issue: domain_registry.yaml remains an empty map at status bootstrap.
    owner: architect
  - id: BLK-02
    severity: severe and now cumulative
    issue: no node_registry_slice.csv and no local_neighborhood.json supplied, for the fifth packet running.
    consequence: >-
      335 edges have now been proposed across five packets with no deduplication against
      the 3,809-edge canonical graph. This packet is the worst exposure yet: it touches
      exp_level at degree 162, sys_alignment at 102, thief_skills, turn_undead at 29 and
      every class node. OBS-24 records one overlap the Analyst could find without a slice;
      there are certainly others that cannot be found without one.
    owner: packet_creator

completeness_statement: >-
  All 1,160 lines were read before extraction. Every one of the twenty-three tables was
  examined and every class section was read in full, including the notes beneath each
  table and the lettered special-ability list for monks. Page markers were checked for
  sequence and uniqueness before reading; the single gap at page 23 is explained in
  OBS-27 and is not a defect.

  108 candidate edges are proposed. Seven candidate groups are recorded as rejected with
  reasons, two of which are substantive rather than mechanical: the twelve progression
  tables, rejected on grain, and the per-class ability minimums, rejected on a verified
  redundancy against packet 03 rather than an assumed one.

  Two candidate nodes are proposed and a third is carried forward from packet 03 unchanged
  rather than re-proposed. Two duplicate identity triples were caught by a mechanical check
  during generation and resolved before assembly, not emitted and left for a Reviewer.

  Two prior deferrals are discharged in this packet and both were correct. The alignment
  restrictions deferred from packet 04 are restated by nine of ten classes, and the
  ability minimums extracted in packet 03 prove complete against all ten class sections.
  Recording deferrals as tests rather than as intentions is what made both checkable.

  The two nodes approved since packet 04, race_human and race_demihuman, are both used
  here on explicit source statements rather than on taxonomy inheritance, which
  DEC-2026-0002 forbids.

  This GUR is complete enough for the Builder to normalize without rereading the source.
  The standing qualification is now cumulative and is the most important thing in this
  artifact: five packets have proposed 335 edges against a graph none of them could see.

# =============================================================================
# DOWNSTREAM NOTES  (added 2026-07-30, after the GUR body was written)
# =============================================================================
downstream_notes:
  purpose: >-
    Builder and Reviewer startup does not read books/<book>/reports/, so a finding recorded
    only there would never reach them. This block is a pointer, not a verdict.
  dedupe_report:
    path: books/adnd1e/phb/reports/DEDUPE-PHB-20260729.md
    what_it_is: >-
      Every edge proposed across all PHB GURs, compared against the 3,809-edge canonical
      graph on three tests: exact duplicate triple, type conflict on the same ordered pair,
      and direction conflict on the reversed pair. Across all PHB GURs, 115 of 389 proposed
      edges duplicate a canonical triple exactly, 35 are type conflicts and 20 are direction
      conflicts.
    why_it_exists: >-
      No packet was ever supplied with a local_neighborhood.json, so no Analyst could run
      this check at extraction time. It is BLK-02, run once after the fact.
    what_builder_should_do: >-
      Consult it before normalising this GUR. Exact duplicates should generally be dropped
      from the GUP; where the canonical row cites a different book, prefer adding this
      packet's citation to the existing row over discarding a second independent witness.
    what_reviewer_should_do: >-
      The direction conflicts are classified in the report into four classes with a
      disposition for each. Class B is not a conflict at all and both sides should be kept.
      Class D is a flat PHB-versus-DMG contradiction on two rows.
  no_verdicts_embedded: >-
    This GUR has not been edited to mark individual edges as duplicates. Whether an
    assertion is already held by the graph is a normalisation determination owned by
    Builder and Reviewer; recording it in an interpretive artifact would put the decision
    in the wrong role.
