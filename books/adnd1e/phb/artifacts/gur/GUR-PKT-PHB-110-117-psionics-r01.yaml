candidate_domains:
- proposed: psionic
  why: 'The psi_ prefix already exists with eleven canonical nodes and this packet proposes fifty-one
    more, which would make it the fourth largest prefix in the graph. The cluster is self-contained and
    no existing label covers it. Recorded, not promoted: constitution 15 reserves adoption to the Architect.'
- proposed: planar
  why: Second packet to propose it, after GUR-PKT-PHB-120-120-planes-of-existence-r01. Astral Projection,
    Etherealness and Probability Travel are planar powers, and this packet reuses that GUR's candidate
    plane nodes directly. Constitution 15 asks for recurrence across packets before adoption, and this
    is the recurrence.
