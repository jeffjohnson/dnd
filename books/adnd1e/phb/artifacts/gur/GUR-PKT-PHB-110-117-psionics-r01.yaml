  their descriptions, the discipline acquisition table, all twenty-two minor devotion entries, all eighteen
  major science entries, and the four closing sections. The forty entries were cross-checked against the
  TABLE OF PSIONIC DISCIPLINES as a completeness list; the two lists agree at every position except minor
  twenty, which is IDQ-01. Every candidate edge cites PHB and a page inside 110 to 117 and a section naming
  its entry. No aspect or condition contains a magnitude. Authored polarity appears only on MODIFIES,
  TRIGGERS and CONSTRAINS, always with basis read. Candidates were checked against canonical on the constitution
  5.1 assertion key and on the source-type-target triple, and seven further assertions the packet restates
  were withheld by hand because canonical already holds them from the DMG or from the prior PHB 117 pass;
  see canonical_duplicates_not_for_emission.'
