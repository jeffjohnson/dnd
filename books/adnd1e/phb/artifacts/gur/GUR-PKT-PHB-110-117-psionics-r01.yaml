- id: IDQ-03
  subject: psi_mind_bar against the existing item_mind_bar
  question: item_mind_bar exists at canonical with the label 'Mind Bar'. This packet's Mind Bar is a major
    science the psionic constructs, with a chance of success by level of mastery.
  analyst_position: 'Mint psi_mind_bar and leave item_mind_bar alone. The two are related in the fiction
    and unrelated in the mechanics: one is a possessed item, the other a power with an upkeep in strength
    points. Whether the item grants the science is not stated in this packet and is not inferred here.'
