source_identity_conflicts:
  rule: contracts/SOURCE_MARKDOWN.md 1.3, Source Identity Authority.
  conflicts:
  - canonical_id: spell_esp
    canonical_label: Psionic-Related Spells
    packet_usage: The packet names ESP as a minor devotion with its own cost and range, and separately
      points at the magic-user spell ESP as the thing it resembles.
    packet_locus: 'PHB p112, MINOR DEVOTIONS: ESP'
  - canonical_id: spell_levitate
    canonical_label: Levitation
    packet_usage: The packet names Levitation as a minor devotion. The canonical spell node already carries
      the label 'Levitation' while its ID names the spell levitate.
    packet_locus: 'PHB p113, MINOR DEVOTIONS: Levitation'
  - canonical_id: item_mind_bar
    canonical_label: Mind Bar
    packet_usage: The packet names Mind Bar as a major science built by the psionic. The canonical node
      of that label is a magic item.
    packet_locus: 'PHB p115, MAJOR SCIENCES: Mind Bar'
  - canonical_id: spell_charm_person
    canonical_label: Charm
    packet_usage: The packet names charm person and charm monster separately in the Hypnosis entry and
      names charm again in the Mind Bar list. The canonical node is labelled simply 'Charm'.
    packet_locus: 'PHB p113, MINOR DEVOTIONS: Hypnosis'
  - canonical_id: spell_confusion
    canonical_label: Confused
    packet_usage: Named in the Mind Bar list as the spell confusion. The canonical node is labelled 'Confused',
      which names the condition rather than the spell.
    packet_locus: 'PHB p115, MAJOR SCIENCES: Mind Bar'
  analyst_view: Every ID above is reused unchanged under GRAPH_INVARIANTS 4, and in no case is the psionic
    power folded into the spell or item that shares its name. A psionic devotion and a magic-user spell
    of the same name have different costs, different ranges, and in the case of Invisibility explicitly
    different interactions with magical detection, so they are different mechanics. The stored labels
    on spell_esp, spell_levitate, spell_charm_person and spell_confusion are drift and will read as collisions
    against the new psi_ nodes; Builder and Reviewer should surface them. No migration is proposed here.
unresolved_identity_questions:
- id: IDQ-01
  subject: minor devotion twenty is called Seduction in the table and Reduction in its entry
  question: TABLE OF PSIONIC DISCIPLINES gives minor entry 20 as 'Seduction (excludes clerics)'. The MINOR
    DEVOTIONS section has no Seduction; at that position it has Reduction, which is the counterpart to
    Expansion at entry 12 and carries a full stat block. The packet contradicts itself.
  analyst_position: 'The node is minted as psi_reduction from the entry that carries the mechanics, because
    an ID stem must match the text a Builder can check it against. The class exclusion attached to the
    table cell is deliberately NOT emitted: the only text carrying it is the cell whose name is in dispute,
    and propagating a rule across a name mismatch would hide the mismatch. If the source steward confirms
    the table cell is a transcription error, the clerics exclusion should be added in a later revision.'
  affects:
  - M051
  - M137
  referred_to: repository source steward, under SOURCE_MARKDOWN 1.3 External Source Intake. The Analyst
    does not author source text and has not altered either spelling.
- id: IDQ-02
  subject: twelve psionic powers share a name with a spell
  question: Clairaudience, Clairvoyance, Detection of Magic, Domination, ESP, Invisibility, Levitation,
    Telekinesis, Dimension Door, Teleportation, Astral Projection and Shape Alteration all name something
    that also exists as a spell, and the packet points at the spell in each case.
  analyst_position: 'Two identities in every case, joined by CROSS_REFERENCES rather than merged. The
    packet itself treats them as different: it says ''the same as the magic-user spell, clairaudience,
    except that unknown areas can be scanned'', and psionic Invisibility cannot be detected by magic while
    the spell can. Merging them would make those exception clauses unrepresentable.'
  affects:
  - M082
  - M093
  - M094
  - M099
  - M105
  - M112
