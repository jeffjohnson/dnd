architectural_escalations: []
non_edge_observations:
- id: OBS-01
  topic: the prior pass extracted the two ends of this appendix and none of its body
  finding: Canonical holds ten edges cited to PHB 110 and twenty-six cited to PHB 117, and zero cited
    to PHB 111, 112, 113, 114, 115 or 116. Every framing rule was captured. Not one attack mode other
    than Psionic Blast, not one defense mode, and not one of the forty disciplines exists.
  why_it_matters: 'This is the same shape as the page-attribution defect found in the magic-user spell
    chapters, but larger and of a different kind: not a mis-citation but a clean omission of six consecutive
    pages. It is why this GUR is the second largest in the book despite covering optional material. Worth
    a check of whether other appendices were sampled the same way.'
- id: OBS-02
  topic: the defense mode acquisition table has two ranges giving the same result
  finding: Under Defense Modes the roll table reads 01-25 two defense modes, 26-75 two defense modes,
    76-90 four, 91-00 five. Two adjacent ranges give the same count and no roll yields one or three, while
    the attack mode table above it runs cleanly from one to five.
  why_it_matters: No edge depends on it, because counts are magnitudes and are dropped. Reported because
    it is a defect in the packet rather than in the extraction, and because the same table in the printed
    book is the thing a Reviewer would check the packet against. Referred to the source steward; not corrected
    here.
- id: OBS-03
  topic: the Body Weaponry footnotes are transcribed twice
  finding: The two footnotes marking the thief and cleric weapon ceilings appear once in italic form and
    again immediately below in plain form, four lines for two footnotes.
  why_it_matters: Harmless to extraction and no edge rests on it, but it is a transcription artifact in
    an immutable claimed source and should be recorded before anyone treats the duplication as meaningful.
- id: OBS-04
  topic: aura alteration prices itself in movements across the alignment graph
  finding: The cost to disguise an alignment is charged per factor changed, and the packet enumerates
    the factors as good/evil, neutral/evil, lawful/chaotic and so on. A neutral character showing neutral
    evil pays one unit; showing chaotic evil pays two.
  why_it_matters: GUR-PKT-PHB-119-119-alignment-graph-r01 OBS-03 records that two DMG assertions measure
    alignment distance and that nothing in the graph defines what is being measured. This is a third such
    assertion and the first inside the PHB, and it counts distance along exactly the two axes that GUR
    proposes. The edge here is drawn to rule_alignment_graph because that node is canonical; if the axis
    nodes are accepted, this is the assertion that most wants re-pointing at them.
- id: OBS-05
  topic: shape alteration derives under an existing general rule and no edge was drawn
  finding: GR_SELF_FORM_CHANGE_NO_SHOCK is registered in general_rules.json for self-initiated form change,
    with applies_to listing polymorph self, shape change, lycanthropy and druidic shapechange. Shape Alteration
    is a self-initiated form change and the packet says outright that it closely resembles polymorph self.
  why_it_matters: Under constitution 7.1 this is the 'derived under' case and would be recorded as psi_shape_alteration
    EXCLUDES rule_system_shock with pass general-rule and the rule ID. No such edge is emitted here for
    two reasons. The rule requires the edge to be cited where the general rule appears rather than where
    the entry relies on it, and the canonical establishing row spell_polymorph_self EXCLUDES rule_system_shock
    has an empty page field, so there is no locus to cite without inventing one. Extending applies_to
    is also a register change and not the Analyst's. Recorded so the Builder can make the call with the
    reasoning in front of them.
- id: OBS-06
  topic: brain injury destroys psionic ability and has no identity to hang it on
  finding: PHB 110 states that psionic ability can never change except through brain injury, which destroys
    it, or magical devices, which alter it. The magical device half is emitted as item_magic_item MODIFIES
    psi_ability. The brain injury half has no endpoint.
  why_it_matters: rule_body_part_loss exists and is the nearest thing, but it is a DMG concept about limbs
    and function and selecting it would be a guess dressed as a reuse. Constitution prohibits hiding ambiguity
    by picking a plausible ID, so nothing was picked. The DMG psionics chapter is the natural place to
    resolve it.
- id: OBS-07
  topic: Thought Shield's continuous availability is not recorded
  finding: Of the five defense modes, only Thought Shield can be kept up at all times. It is also the
    only defense available to a psionic who has used Psychic Crush.
  why_it_matters: The Psychic Crush restriction is emitted. The continuous-maintenance property is not,
    because it is a property of the mode rather than a relationship to another mechanic, and the nearest
    target, psi_combat, would make the edge say something the text does not. Recorded because the two
    facts together are why Thought Shield is worth a node.
- id: OBS-08
  topic: psionic invisibility is the packet's strongest negative dependency
  finding: It cannot be detected by any form of magic, because it works on minds rather than on light.
    Only a mind bar defeats it.
  why_it_matters: rule_detection_invisibility carries six edges and every one of them assumes magical
    detection works. This is the first assertion in the graph that denies the whole apparatus for a specific
    source of invisibility, so the Reviewer should confirm the direction reads as intended before it is
    integrated.
