source_summary: 'PHB 110 to 117, Appendix I. The psionics subsystem in three parts: framing rules for
  who has psionic ability and how strength points work, five attack modes and five defense modes with
  costs and ranges, and forty discipline entries in spell-entry form, twenty-two minor devotions and eighteen
  major sciences. The appendix closes with psionic combat, multiple operations, use of powers and recovery,
  which a prior pass already extracted.'
node_id_resolution_method: No registry slice was supplied. Three separate resolutions were needed. Eleven
  psi_ nodes already exist and all are reused unchanged. Nothing in the registry matches any individual
  attack mode except Psionic Blast, any defense mode, or any of the forty disciplines, so fifty-one identities
  are proposed. Nine cross-reference targets are spells this book's own earlier packets proposed and that
  are not yet canonical; they are declared in cross_packet_candidate_targets rather than minted again.
grain_decisions:
- decision: Each attack mode, defense mode and discipline becomes a node.
  basis: Constitution 3.1 on family versus specific. psi_attack_modes, psi_defense_modes and psi_disciplines
    already exist as families, and canonical already carries psi_attack_blast as a specific node, which
    settles that the modes are referenced individually.
  how_applied: Each of the forty disciplines has its own range, duration, area of effect, strength point
    cost and saving throw entry, in exactly the shape the book uses for a spell. The graph holds 216 spell
    nodes on that basis. Nothing distinguishes these entries in kind.
- decision: Each power's own cost line is recorded as a CONSUMES edge, and the amounts are dropped.
  basis: Constitution 2 and 2.1. Every entry states its own cost, so these are per-entry assertions rather
    than one aggregate; 2.1 forbids replacing a stated per-entry dependency with a single edge.
  how_applied: Forty-nine CONSUMES edges to psi_strength_points, all with the amount removed. The family
    statement at PHB 111, that employment of any discipline costs points, is recorded separately as psi_disciplines
    CONSUMES psi_strength_points.
- decision: Level of mastery is recorded as a dependency on exp_level, per entry.
  basis: Constitution 2.1. PHB 111 states once that level of mastery equals experience level, which is
    recorded as psi_disciplines DERIVED_FROM exp_level.
  how_applied: Beyond that single derivation, exp_level MODIFIES psi_<x> is emitted only for the entries
    that state their own scaling, and the scaling table itself is dropped. Entries whose effect does not
    change with mastery get no such edge.
- decision: Class restrictions are recorded as EXCLUDED_FROM with the class as source.
  basis: Constitution 4.1, which keeps EXCLUDES and EXCLUDED_FROM distinct and warns they are not inverses.
    A class does not act to prevent a discipline; it simply falls outside the eligible set, which is the
    'X is not an input to Y' reading.
  how_applied: Seven edges from the parenthetical exclusions in the discipline table. The eighth, at minor
    entry twenty, is deliberately not emitted; see IDQ-01.
- decision: Status is optional on every edge.
  basis: Constitution 8 names psionics in its list of optional material, and the appendix opens by conditioning
    the subsystem on the DM's choice.
  how_applied: All rows carry status optional. rule_dm_discretion GATES sys_psionics is already canonical
    at PHB 110 and is not restated.
- decision: No magnitude appears in any aspect or condition.
  basis: Constitution 2 and GRAPH_INVARIANTS 11.
  how_applied: Point costs, ranges in inches, percentage chances, hit dice withstood, gold piece weights,
    the fourteen-row mastery tables and the seven-league dimension walk are all dropped. Where an amount
    was the only content of a statement, no edge was drawn.
