page_end: 6

# =============================================================================
# HEADLINE RESULT  (unchanged from r01)
# =============================================================================
# Zero candidate edges. Zero candidate nodes.
#
# Front matter asserts no dependency between mechanics. Five candidates were
# considered and rejected against the core test; all are retained below so the
# null result stays auditable.
