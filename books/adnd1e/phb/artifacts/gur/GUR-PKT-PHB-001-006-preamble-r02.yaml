revision_reason: >-
  Operator supplied two corrections after r01 was written. First, this source is a
  deliberately modified custom printing in which the combat tables have been
  re-included at the end of the book; r01's OBS-02 was built on the foreword's claim
  that those tables were withheld, which is not true of this artifact. Second, the
  operator documented the semantics of the {#pN} page markers, which were previously
  being read by inference. Neither correction invalidated a page citation in r01, but
  both change what the packet tells a downstream reader.
analyst_pass: page-sweep
citation_code: PHB
