completeness_statement: >-
  The whole packet was read before extraction, and its page markers, headings and tables
  were checked mechanically for sequence, duplication and column consistency before
  reading. Every proposed edge carries a book, page and section citation and an evidence
  class. No magnitude reached any aspect or condition field. Authored polarity appears on
  the three permitted edge types only. The generated edge set was checked for duplicate
  source, type and target triples before assembly and contains none. Every overlap with an
  earlier packet was checked against the specific edge reference rather than assumed, and
  the overlaps found are recorded rather than silently dropped. Deduplication against the
  canonical graph remains outstanding and could not be performed at extraction time.
