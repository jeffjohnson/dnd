non_edge_observations:
- id: OBS-54
  topic: what a confirmation is worth when the value being confirmed was already there
  locus: baseline rows 535, and by extension 1984 and 2273
  finding: Three of the twenty rows carry basis heuristic rather than unset, meaning a migration pattern-matched
    a value into them. Row 535 is the only one of the three this Analyst can reach, and reading the source
    produced the same value the heuristic had guessed.
  why_it_matters: A confirmation is the weakest possible output of this exercise, because nothing in the
    artifact distinguishes an Analyst who read the spell from an Analyst who copied the existing value
    and relabelled the basis. The only defence is to quote the sentence and let the Reviewer check it,
    which is why the quote is on the edge rather than a summary of it. The Decision already anticipated
    this by requiring the Reviewer to resolve these three independently rather than accept the Analyst's
    reading.
  owner: reviewer
