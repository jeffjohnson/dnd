- id: ESC-2026-08-03T22.35.13.308Z
  status: decided
  decided_by: DEC-2026-0021
  decision_path: rulesets/adnd1e/escalations/decisions/DEC-2026-0021.yaml
  escalation_path: rulesets/adnd1e/escalations/decided/ESC-2026-08-03T22.35.13.308Z.yaml
  question: Should the DEC-2026-0015/0016 migration wait until DMG and UA are packetized, or should the
    polarity cleanup be re-scoped to the assertions whose source this repository holds?
  ruling_summary: No exception to GRAPH_INVARIANTS 15 and 16, and no unread polarity may be described
    as read. The four completed PHB assertions proceed now through ordinary packet-update GUP, Review
    and Integration. DEC-2026-0016's nine page-only corrections follow in a new independent lineage after
    those four integrate. The atomic DEC-2026-0015 identity migration stays blocked in full until claimed
    DMG and UA packets support all sixteen outstanding readings.
  what_it_means_for_this_packet: This GUR is unblocked and its corrections proceed. The Architect ruled
    directly that the two completed PHB cleanup GURs are to be compiled now.
  the_analyst_recommendation_was_not_adopted: 'The escalation recommended re-scoping the prerequisite
    and recording the sixteen as a standing debt. It also flagged the reason not to: DEC-2026-0019 had
    already refused a migration exception on invariants 15 and 16, and the absence of source does not
    weaken that argument. The Architect took the conservative branch. Recorded because a GUR that cites
    a Decision should show where the Decision went against the artifact that asked for it.'
  remaining_scope_not_carried_here: The sixteen DMG and UA readings remain outstanding and are Analyst
    work only when claimed packets for those books exist. They are not a blocker on this packet and are
    not restated as one.
blocking_notes:
- id: BLK-DEC-0019-NO-DMG-UA-SOURCE
  severity: resolved_for_this_packet_open_for_the_migration
  topic: sixteen of the twenty assertions have no source to read
  finding: 'DEC-2026-0019 requires the polarity to be read from bounded claimed Markdown packets and forbids
    inferring it from canonical values or edge names. Four of the twenty assertions are PHB and are completed
    here and in the companion GUR. The other sixteen are DMG and UA. This repository holds no packet and
    no Markdown source for either book: books/adnd1e/dmg/packets/{incoming,claimed,completed} and the
    matching UA directories are all empty, books/adnd1e/dmg/source and books/adnd1e/ua/source are empty,
    and a search for Markdown under either book returns nothing.'
  consequence: 'Two of the Decision''s acceptance tests cannot be satisfied as written: the cleanup cannot
    account for all twenty assertions, and retained_unset_count cannot reach zero. Steps 2 through 7,
    which sequence Builder, Reviewer, Integrator and Builder again, are all downstream of a step 1 that
    cannot be completed for sixteen rows.'
  what_the_analyst_will_not_do: 'The sixteen are not guessed. Fourteen currently read neutral with basis
    unset, one reads inflicts and one reads worsens, both with basis heuristic. In several cases a plausible
    value is obvious from the node names alone: spell_taunt MODIFIES cbt_armor_class almost certainly
    worsens. That is exactly the inference the Decision prohibits, and the prohibition is right, because
    the same guess is what produced the heuristic values this cleanup exists to remove.'
