# =============================================================================
# HEADLINE RESULT: 18 candidate edges. 0 candidate nodes. 0 escalations.
#
#  1. This packet is almost entirely price lists, weights and damage dice, and
#     the grain rule removes nearly all of it. Twelve cost tables and two large
#     weapon tables yield relationships, never values.
#
#  2. It needs five wpn_ nodes and both prof_ nodes, under prefixes the
#     constitution does not approve. That is ESC-2026-0002, already open. No
#     new escalation; the volume of work resting on it simply grows. OBS-31.
#
#  3. One tension with a registered general rule is flagged. OBS-30 is the most
#     important item in this GUR.
# =============================================================================

source_summary: >-
  Pages 35 to 38. MONEY, covering starting funds by class, coinage, and money changing,
  banking and loans; EQUIPPING THE CHARACTER with twelve cost tables; ARMOR with the
  armour class table; and WEAPONS, covering proficiency, weight and damage by weapon type,
  and the general weapon data table with its to-hit adjustments by armour class and range.

