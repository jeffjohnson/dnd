non_edge_observations:
  - id: OBS-30
    topic: a possible conflict with a registered general rule
    locus: WEAPON TYPES GENERAL DATA AND TO HIT ADJUSTMENTS, p38
    finding: >-
      This page states that any weapon strikes at a bonus against an opponent's back or an
      otherwise unseen opponent, and at a larger bonus against stunned, prone and
      motionless opponents. That is edge B17. The general rule register holds
      GR_HELPLESS_TARGET_AUTOHIT, established at DMG p70, under which paralyzed, held,
      sleeping or wholly immobile targets are struck automatically, take maximum damage,
      and gain no Dexterity benefit.
    the_tension: >-
      Struck automatically and struck at a bonus are different mechanics. Either the PHB
      bonus is superseded by the DMG rule for the subset of opponents that count as wholly
      immobile, or the two describe different states, with the PHB covering merely prone
      or stunned and the DMG covering magical immobilisation. The second reading is more
      likely and is supported by the register's own counter-example, which distinguishes
      naturally sleeping targets. The Analyst cannot settle it from this packet.
    why_it_matters: >-
      B17 is proposed as a plain MODIFIES edge with no supersession basis, because the
      Analyst has no authority to assert that a DMG rule overrides a PHB one, and OVERRIDES
      requires a supersession_basis this packet cannot support. If the two do collide, B17
      needs retyping or the general rule needs its boundary restated.
    recommendation_at_r01: >-
      Architect or Reviewer to compare B17 against GR_HELPLESS_TARGET_AUTOHIT with the DMG
      text in hand. This is a cross-book question and belongs under
      rulesets/adnd1e/cross-book, which the Analyst may not open on suspicion.
    operator_direction_r02:
      status: operator direction, pending Architect ratification; not a decision
      recorded_on: "2026-07-29"
      content: >-
        The DMG will be re-analysed in its entirety, so PHB and DMG conflicts of this kind
        are expected to resolve as the DMG side is re-derived from source rather than
        inherited from the legacy import. The operator will escalate to the Architect with
        the direction to favour the PHB for these specific conflicts.
      effect_on_this_gur: >-
        B17 stands as proposed, unchanged. It is no longer waiting on a comparison the
        Analyst could not make; it is waiting on a DMG re-analysis that will supply the
        other side of the comparison.
    consequence_the_analyst_believes_follows: >-
      Favouring the PHB is not a no-op here, and this is the part worth the Architect's
      attention. GR_HELPLESS_TARGET_AUTOHIT is not an ordinary DMG edge. It is a
      registered general rule in registries/general_rules.json whose established_by is
      "DMG p.70 Special Types Of Attacks", and constitution 7.1 makes the establishing
      citation load-bearing: it is the evidence the rule generalises from. Its applies_to
      list names spell_hold_person, item_wand for paralyzation, and rule_immobile, and
      every edge derived under it carries its general_rule_id.

      So if the PHB is favoured and B17's bonus displaces or bounds the automatic-hit
      rule, the effect does not stop at one row. Either the general rule's boundary must
      be restated so that it covers only the magically immobilised subset, which is the
      Analyst's reading and would leave both statements true, or the rule's establishing
      citation moves and its inherited edges need re-derivation. The first is cheap and the
      second is not.
    analyst_recommendation_r02: >-
      When the Architect ratifies the direction, scope it explicitly: state whether
      favouring the PHB means the general rule is bounded or the general rule is
      superseded. Those are different instructions to the DMG analyst and to the Builder,
      and the difference is invisible until integration if it is not settled first.

  - id: OBS-31
    revision_status: resolved_in_r03_by_constitution_v1_3
    topic: the wpn_ prefix is now approved
    finding_at_r01: >-
      This packet needs wpn_weight, wpn_range, wpn_space_required, wpn_stats and
      wpn_type_vs_ac. Under constitution v1.2 the wpn_ prefix was not in the section 3.1
      table, and it was the largest of the twelve unapproved prefixes reported in
      ESC-2026-0002 at seven nodes.
    resolution: >-
      Constitution v1.3 adds wpn_ to section 3.1 as "weapon property or weapon statistic",
      with wpn_speed_factor as the worked example. All five nodes this packet uses are
      therefore now under an approved prefix and no longer contribute to ESC-2026-0002.
      No edge changes; the IDs were always valid registry IDs and only their governance
      status moved.
    correction_to_r01: >-
      r01 listed prof_weapon and prof_nonproficiency_penalty alongside the wpn_ nodes in a
      way that reads as though prof_ were also unapproved. It was not. prof_ has been in
      the section 3.1 table since v1.2, and the Analyst's own prefix census never counted
      it among the twelve. The sentence was loose; the census was right.
    what_remains: >-
      ESC-2026-0002 is not closed by this. Eleven prefixes remain outside section 3.1,
      including align_ and time_, which the three other unbuilt PHB GURs still depend on.
      See OBS-40.

  - id: OBS-40
    revision_status: new_in_r03
    topic: v1.3 fixed the constitution's self-contradiction by changing its examples, and the new examples cite nodes that do not exist
    finding: >-
      ESC-2026-0002 reported that the constitution used unapproved prefixes in its own
      worked examples: turn_undead five times, including the section 6.2 example, and
      str_bend_bars once in the section 4.1 example. v1.3 resolves this not by approving
      those prefixes but by rewriting the examples to rule_turn_undead and
      abil_strength_bend_bars. Neither ID exists in rulesets/adnd1e/registries/nodes.csv.
      The registry still holds turn_undead and str_bend_bars.
    why_it_matters: >-
      The self-contradiction is gone and a clear migration direction is now signalled:
      turn_ becomes rule_, and str_ sub-mechanics become abil_strength_ compounds. That is
      useful and the Analyst reads it as intent. But until the migration runs, the
      constitution's worked examples point at identities the graph does not contain, which
      is a different defect of the same family rather than a clean resolution. A worker
      following section 6.2 literally would mint rule_turn_undead as a duplicate of
      turn_undead, which is exactly the drift section 3.2 names as the most common defect.
    bearing_on_this_packet: none; no edge here uses turn_ or str_
    bearing_elsewhere: >-
      turn_undead is used by GUR-PKT-PHB-018-033-classes-r02 at F1 and F14, and the three
      str_ nodes by GUR-PKT-PHB-009-013-ability-scores-r01. Both have already been through
      Builder, so this is a migration question for Integrator rather than a GUR correction.
    recommendation: >-
      Architect to confirm whether v1.3's examples are a migration instruction. If they
      are, the registry rename should be scheduled before another packet references either
      ID. If they are not, the examples should cite IDs that exist.

  - id: OBS-32
    topic: an explicit denial that is easy to lose
    locus: ARMOR, p36
    finding: >-
      Magic armour negates weight, so movement does not consider any encumbrance from it.
      That is B9.
    why_it_matters: >-
      A reader would certainly assume armour has weight, since the equipment tables give a
      weight for every mundane armour type. This is what constitution 4.1 exists for, and
      it is easy to lose because it sits in a one-line note rather than in a table.

unresolved_identity_questions:
  - id: IDQ-11
    question: >-
      B5 asserts sys_equipment MODIFIES cbt_armor_class for worn armour. sys_equipment is
      an aggregate covering all equipment. Should armour have its own node?
    bearing: B5
    analyst_handling: >-
      Used sys_equipment because no armour node exists; item_magic_armor covers only the
      magical case and rule_shield only shields. Flagged rather than minting rule_armor,
      because the registry may intend sys_equipment to carry this and a duplicate would be
      worse than a coarse edge.

  - id: IDQ-12
    question: >-
      Packet 03 routed dexterity's defensive effect through dex_defensive_adj. This page
      names dexterity directly as a principal modifier of armour class. Should a second
      edge be proposed from abil_dexterity?
    bearing: none; no edge proposed
    analyst_handling: >-
      No edge proposed, because packet 03's D5 already carries the relationship through the
      intermediate node the graph appears to prefer. Recorded so the omission is visible
      and can be reversed if IDQ-04 is resolved the other way.

