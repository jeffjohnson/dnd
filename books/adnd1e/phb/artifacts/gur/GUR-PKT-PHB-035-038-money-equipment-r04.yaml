revision_reason: >-
  Operator authorised the Analyst to normalise GURs the Builder has not yet picked up. B1 and
  B10 were held under DEC-2026-0011 and are now flipped to the ratified direction. Both become
  exact duplicates of existing canonical rows, which is the outcome the decision anticipated:
  it returned the eight direct cases for "normalization and canonical deduplication", and
  deduplication is what these two need. They are corrected rather than deleted so the GUR
  still records that this packet witnesses the assertion.
revision_reason: >-
  Constitution v1.3 approves the wpn_ prefix in section 3.1. OBS-31 of r01 and r02 reported
  five wpn_ nodes used by this packet as sitting under an unapproved prefix; that is no
  longer true and the observation is corrected rather than left to mislead a Builder who
  has not yet processed this GUR. No edge changes: every node ID in this packet was and
  remains a valid registry ID, and the approval changes the governance status of those IDs,
  not the IDs themselves. Also corrects a loose sentence in OBS-31 that implied the prof_
  prefix was unapproved; prof_ has been approved since v1.2.
r02_revision_reason: >-
  The operator gave direction on the cross-book conflict reported as OBS-30 and will
  carry it to the Architect. Two facts change the disposition of that observation: the
  DMG is to be re-analysed in full, so the conflicting side will be re-derived rather than
  left as legacy; and the operator's stated preference, pending Architect ratification, is
  to favour the PHB where PHB and DMG conflict in escalations of this kind. OBS-30 is
  amended to record the direction and the consequence the Analyst believes follows from
  it. No edge is added, removed, retyped or recited; B17 is unchanged in every field.
