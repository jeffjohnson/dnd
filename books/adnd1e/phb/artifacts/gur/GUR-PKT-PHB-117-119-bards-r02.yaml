- proposed_id: rule_bard_charm
  proposed_label: Bardic Charming
  kind: rule
  why_needed: A percentage on Table II with its own range, saving throw, once-a-day limit and negation
    conditions. item_bard_instrument MODIFIES class_bard at DMG 148 says each instrument raises the bard's
    charming ability, which is this and not spell_charm_person.
  edges_depending_on_it:
  - M014
  - M015
  - M016
  - M035
  - M036
  - M037
  - M038
  - M039
  - M040
  - M041
