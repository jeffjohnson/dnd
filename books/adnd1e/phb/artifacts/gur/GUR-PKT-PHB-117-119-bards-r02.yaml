  - M018
  - M019
  - M020
  - M021
  - M022
- proposed_id: rule_bard_poetics
  proposed_label: Bardic Poetics
  kind: rule
  why_needed: 'A timed activity with two effects, a warm-up, a duration, and an explicit list of what
    it forbids while running. Referenced apart from singing: the bard may not sing while performing it.'
  edges_depending_on_it:
  - M029
  - M030
  - M031
  - M032
- proposed_id: rule_bard_song
  proposed_label: Bardic Song and Playing
  kind: rule
  why_needed: The vehicle for charming and, separately, the thing that negates harpy song and stills shriekers.
    Those two effects are stated in different paragraphs and neither runs through the other.
  edges_depending_on_it:
  - M031
  - M033
  - M034
  - M035
- proposed_id: item_drums_panic
  proposed_label: Drums of Panic
  kind: item
  why_needed: One of four musical items the appendix says perform better for a bard. Each carries a different
    improvement, so the four cannot share one node.
  edges_depending_on_it:
  - M045
