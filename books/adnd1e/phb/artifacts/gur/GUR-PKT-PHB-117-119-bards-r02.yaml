  proposed_label: Harpy
  kind: monster
  why_needed: Named as the creature whose song effects bardic music negates. The negation is a mechanic
    and needs the creature as an endpoint.
  edges_depending_on_it:
  - M033
- proposed_id: monster_shrieker
  proposed_label: Shrieker
  kind: monster
  why_needed: Named as the creature whose noise bardic music stills.
  edges_depending_on_it:
