source_summary: 'PHB 117 to 119, Appendix II. The bard: ability minimums, race, and a three-stage progression
  through fighter and thief into druidic tutelage, then three tables giving advancement with druid spells,
  college and two percentage abilities, and permitted armour and weapons. It closes with a narrative section
  on poetics, song, charming, legend lore, magic items, henchmen and strongholds.'
node_id_resolution_method: No registry slice was supplied. class_bard exists with twenty edges, fifteen
  from the prior PHB 117 pass and five from the DMG. Two of the DMG edges, on item_bard_instrument, already
  depend on a bardic college concept the graph has no node for, which settled that rule_bard_college should
  be minted. item_pipes_sewers already exists under a spelling the packet does not use and is reused;
  see IDQ-01. Ten identities are proposed, five of them bardic abilities Table II already treats as separate
  columns.
grain_decisions:
- decision: Five bardic abilities become nodes rather than facets of class_bard.
  basis: Constitution 3.1. Table II gives college, charming and legend lore their own columns, and the
    narrative gives poetics and song their own paragraphs with their own timings and exclusions.
  how_applied: 'rule_bard_college, rule_bard_charm, rule_bard_legend_lore, rule_bard_poetics and rule_bard_song.
    The strongest evidence is external: two canonical DMG edges on item_bard_instrument already talk about
    college level and charming ability, so the graph was already referencing these apart from the class.'
- decision: The three advancement tables yield dependencies, not values.
  basis: Constitution 2 and 2.1.
  how_applied: Experience point thresholds, hit dice, the twenty-three level titles, spell counts by level,
    charm and legend lore percentages and henchman counts are all dropped. What is kept is that each of
    those facets moves with exp_level.
- decision: The nine college names are not minted.
  basis: The core test. Fochlucan through Magna Alumnae are names attached to level bands; no mechanic
    reads any of them individually except the highest, whose exception is carried as a condition.
  how_applied: One node, rule_bard_college, with the association rule and its exception on a single edge.
    See OBS-06.
- decision: The permitted weapons list yields no edge.
  basis: The core test and constitution 3.2. Table III names nine weapon types; the graph has no weapons-permitted
    concept and minting nine weapon identities from a permission list would propose ontology this packet
    does not support.
  how_applied: Armour, shield, oil and poison are recorded because each has an existing endpoint. The
    weapon column is recorded in OBS-05 instead.
- decision: Status is optional on every edge.
  basis: Constitution 8 names the bard explicitly, and the appendix calls the class supplemental with
    the DM as final arbiter.
  how_applied: All rows carry status optional. rule_dm_discretion GATES class_bard is already canonical
    at PHB 117 and is not restated.
