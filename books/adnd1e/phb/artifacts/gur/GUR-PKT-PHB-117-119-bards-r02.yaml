  proposed_label: Bardic College
  kind: rule
  why_needed: 'Table II''s own first column and the distinction the appendix calls the important one to
    a bard. Already load-bearing without a node: item_bard_instrument GATES class_bard at DMG 148 is keyed
    to college level, so a canonical edge already depends on a concept the graph cannot name.'
  edges_depending_on_it:
