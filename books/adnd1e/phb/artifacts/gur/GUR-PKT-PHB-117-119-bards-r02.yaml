architectural_escalations: []
non_edge_observations:
- id: OBS-01
  topic: the third appendix running whose body was never extracted
  finding: Canonical holds fifteen bard edges, every one cited to PHB 117, and nothing cited to 118 or
    119. The same shape appears in Appendix I, where ten edges sit at 110 and twenty-six at 117 with nothing
    between, and Appendices III, IV and V had no edges at all before this session.
  why_it_matters: 'Three appendices in a row were extracted at their opening page and abandoned. Together
    with GUR-PKT-PHB-110-117-psionics-r01 OBS-01 this is now a pattern rather than an incident, and it
    is worth asking whether the prior pass stopped at a page budget. The material lost here is the whole
    of what a bard actually does: charming, legend lore, poetics, song, and every limit on henchmen and
    strongholds.'
- id: OBS-02
  topic: race_any GATES class_bard understates the racial restriction
  finding: The canonical row cited to this packet's own BARD RACE section reads race_any GATES class_bard
    with aspect 'eligibility'. The section says a bard must be human or half-elven.
  why_it_matters: race_any reads as an absence of racial restriction where the text sets one of the narrowest
    in the book. Two refinement edges are emitted from race_human and race_half_elf rather than a correction
    to the existing row, because an Analyst proposes and does not edit canonical. If the Reviewer accepts
    them the race_any row should be withdrawn in the same batch, or the graph will hold both readings
    at once.
- id: OBS-03
  topic: race_human's stored label is its own ID
  finding: 'nodes_master.csv gives race_human the label ''race_human''. Every other race node carries
    a readable label: race_half_elf is ''Half-Elf'', race_elf is ''Elf''.'
  why_it_matters: Found while resolving this packet's race requirement, not sought. It is a display defect
    in one of the graph's most referenced nodes and it predates this packet. Reported rather than fixed;
    canonical is the Integrator's.
- id: OBS-04
  topic: the DMG already depends on a bardic college with no node
  finding: item_bard_instrument GATES class_bard at DMG 148 is described as 'each instrument keyed to
    a college level', and item_bard_instrument MODIFIES class_bard as 'each raises the bard's charming
    ability'.
  why_it_matters: Both aspects name concepts the graph could not point at. This packet is where they are
    printed, and rule_bard_college and rule_bard_charm give them endpoints. When the DMG treasure chapter
    is packetized those two rows are the natural place to re-point.
- id: OBS-05
  topic: Table III's weapon column yields nothing
  finding: Nine weapon types are permitted, with footnotes admitting magical versions and naming four
    sword types. No weapons-permitted concept exists in the graph and no wpn_ node matches any of the
    nine as a permission.
  why_it_matters: Declined rather than skipped. Armour, shield, oil and poison from the same table are
    recorded because each has an existing endpoint. If class weapon restrictions are modelled later, this
    table is one of the places that will need revisiting.
- id: OBS-06
  topic: the nine colleges are levels, not mechanics
  finding: Fochlucan, Mac-Fuirmidh, Doss, Canaith, Cli, Anstruth, Ollamh and Magna Alumnae, plus Probationer
    at first level, are names attached to bands of experience level.
  why_it_matters: 'Only two facts read them: a bard will not associate with a lesser college, and the
    highest college aids any bard. Both are carried on one edge, the second as its condition. The names
    themselves fail the core test, in the same way the nineteen planes of GUR-PKT-PHB-120-120-planes-of-existence-r01
    OBS-02 did.'
- id: OBS-07
  topic: a mundane instrument requirement reuses a magic-item identity
  finding: The packet requires a bard to always carry a stringed instrument. The only matching identity
    is item_bard_instrument, which the DMG minted for the magical bardic instruments keyed to college.
  why_it_matters: The edge is emitted against that identity because inventing a second node for an ordinary
    lute would be worse drift, but the reuse is imprecise and is flagged rather than hidden. A Reviewer
    may prefer the requirement be dropped until an ordinary equipment identity exists.
- id: OBS-08
  topic: the bard is the only class whose class change costs nothing
  finding: The notes to Table I state that all previously earned hit dice are additions and none are lost
    for becoming a bard, which is the opposite of rule_dual_class CONSTRAINS rule_hit_points at PHB 33.
  why_it_matters: Recorded as rule_dual_class EXCLUDED_FROM class_bard. It is the packet's clearest negative
    dependency and the one most likely to be missed, because a reader meeting a class that changes class
    twice will reach for the dual-class rule first.
- id: OBS-09
  topic: r02 exists because every aspect in r01 was too long
  finding: GUP-PKT-PHB-117-119-bards-r02 returned this GUR blocked with 45 aspect_word_count errors. Constitution
    5 specifies aspect as 1 to 4 words naming the facet touched; r01 wrote 5 to 11 word phrases throughout.
    The Builder was correct and refused to rewrite them silently, which is the right call because aspect
    is part of the 5.1 assertion key.
  why_it_matters: All 45 are rewritten as named facets in r02 and no edge was added, dropped or re-pointed;
    only the aspect strings changed. Because the change alters the assertion key, the whole set was re-checked
    against canonical afterwards and no new collision appeared. The defect was mine and it is not confined
    to this packet; see OBS-10.
  owner: analyst
- id: OBS-10
  topic: the same rule is graded error here and warning in eight other packets
  finding: 'aspect_word_count appears in the Builder''s validation reports for nine packets from this
    session: bards 45 as error, and psionics 140, magic-user 5-9 94, magic-user 1-4 82, illusionist 60,
    playing-the-game 60, planes 18, division-of-treasure 10 and alignment-graph 2, all as warning. The
    eight warning-graded packets compiled to status proposed and are now with the Reviewer.'
  why_it_matters: 466 rows carrying the same defect are downstream of Build and one packet is blocked
    for it. Either the grading is inconsistent or the threshold is being applied differently by revision,
    and either way the graph is about to take on a large set of prose aspects that constitution 5 forbids
    and that 5.1 makes part of edge identity. Fixing them later is more expensive than fixing them now,
    because once integrated an aspect change is an identity change rather than an edit. Recorded here
    rather than escalated because it does not block this GUR and the remedy is a Builder or Architect
    call, not an Analyst one.
  owner: analyst
blocking_notes:
- id: BLK-02
  note: No node_registry_slice.csv, local_neighborhood.json or general_rule_slice.json accompanied this
    packet. nodes_master.csv, registries/nodes.csv and edges_master.csv were read directly, and canonical
    edges were bucketed by page to establish what the prior pass had already taken.
  impact: Does not block this GUR. It is how OBS-01, OBS-02, OBS-03 and OBS-04 were found.
completeness_statement: 'All three pages were read in full: the four prose sections, all three tables
  and both sets of table notes, and the closing BARDS section. Every candidate edge cites PHB and a page
  inside 117 to 119 and a named section. No aspect or condition contains a magnitude; the experience thresholds,
  hit dice, level titles, spell counts, percentages and henchman counts are all dropped. Authored polarity
  appears only on MODIFIES, TRIGGERS and CONSTRAINS, always with basis read. Candidates were checked against
  canonical on the constitution 5.1 assertion key and on the source-type-target triple, and three further
  assertions the packet restates were withheld by hand because canonical already holds them from the DMG
  or from the prior PHB 117 pass. The nine college names and the nine permitted weapon types were deliberately
  not minted; see OBS-06 and OBS-05. Revision 2 rewrites every aspect to the 1-4 word form constitution
  5 requires; see OBS-09.'
handoff:
  next_role: builder
  readiness: ready
  reason: analyst extraction complete
  blocking_ids: []
