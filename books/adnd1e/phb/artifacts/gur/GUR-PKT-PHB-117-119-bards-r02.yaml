source_identity_conflicts:
  rule: contracts/SOURCE_MARKDOWN.md 1.3, Source Identity Authority.
  conflicts:
  - canonical_id: item_pipes_sewers
    canonical_label: Pipes of the Sewers
    packet_usage: The packet names the item 'Pipes of the Sewer', singular.
    packet_locus: PHB p119, BARDS
  - canonical_id: spell_legend_lore
    canonical_label: Informational Spells
    packet_usage: The packet names the magic-user spell legend lore as the thing the bard's ability resembles.
      The canonical node carries a family label instead of the spell's name.
    packet_locus: PHB p118, BARDS
  - canonical_id: spell_charm_person
    canonical_label: Charm
    packet_usage: The packet names charm person and charm monster as two spells. The canonical node for
      the first is labelled simply 'Charm'.
    packet_locus: PHB p118, Notes Regarding Bards Table II
  - canonical_id: race_human
    canonical_label: race_human
    packet_usage: The packet requires a bard to be human or half-elven. The canonical node's stored label
      is the string 'race_human', which is its own ID rather than a label.
    packet_locus: PHB p117, BARD RACE
  analyst_view: 'Every ID is reused unchanged under GRAPH_INVARIANTS 4. Three of the four conflicts are
    stored-label defects rather than genuine identity questions and are surfaced for Builder and Reviewer
    without a migration proposal. The race_human label is the most serious of them: a node whose label
    is its own ID will render as ''race_human'' anywhere the graph is displayed, and it is one of the
    eleven race identities. See OBS-03.'
unresolved_identity_questions:
- id: IDQ-01
  subject: Pipes of the Sewer against the existing item_pipes_sewers
  question: SOURCE_MARKDOWN 1.3 Incoming Packet Authority makes the packet canonical for spelling and
    grammatical number of a mechanic it names. The packet writes 'Pipes of the Sewer'; the registry holds
    item_pipes_sewers labelled 'Pipes of the Sewers'.
  analyst_position: Reuse item_pipes_sewers unchanged. Incoming Packet Authority governs the candidate
    ID stem for a new identity, and this identity is not new; GRAPH_INVARIANTS 4 governs an existing one.
    The two spellings name the same item beyond doubt, so minting a second node would be exactly the drift
    constitution 3.2 calls the most common defect here. Whether the stored label should follow the DMG
    or this packet is the Architect's.
  affects:
  - M048
- id: IDQ-02
  subject: prefix for the five bardic abilities
  question: College, charming, legend lore, poetics and song are abilities of one class. class_ is reserved
    for character classes and holds seventeen nodes, all of them classes. rule_ is the general prefix
    for a named rule or procedure.
  analyst_position: Minted under rule_ with a bard_ stem, giving rule_bard_college and its four siblings.
    They are procedures with their own timings and saving throws rather than classes, and the graph already
    carries class-specific procedures under rule_, such as rule_cleric_spells and rule_druid_spells. Nothing
    else depends on the choice, so a rename before integration is cheap if the Architect prefers otherwise.
  affects:
  - M011
  - M012
  - M014
  - M015
  - M016
  - M017
  - M018
  - M019
  - M020
  - M021
