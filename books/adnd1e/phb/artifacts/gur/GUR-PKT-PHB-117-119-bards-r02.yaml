canonical_duplicates_not_for_emission:
- assertion: class_bard -[OVERRIDES]-> save_matrix
  canonical_row: 1948
  canonical_aspect: checks each class possessed
  canonical_locus: DMG p79, I. SAVING THROW MATRIX FOR CHARACTERS
  packet_aspect: restated by this packet
  packet_locus: PHB p118, BARDS
  why_not_emitted: The packet says all saving throws use the most favourable table with the bard level
    counted as a druid. Canonical already holds this from DMG 79 as 'checks each class possessed'. Emitting
    it again would restate one rule under two citations, and OVERRIDES additionally requires a supersession_basis
    that the PHB sentence does not supply.
- assertion: class_bard -[DERIVED_FROM]-> cbt_attack_matrix
  canonical_row: 1884
  canonical_aspect: fights at highest fighter level attained
  canonical_locus: DMG p74, I.B. ATTACK MATRIX FOR FIGHTERS
  packet_aspect: restated by this packet
  packet_locus: PHB p118, BARDS
  why_not_emitted: '''A bard always engages in combat at the level he or she attained as a fighter'' is
    already canonical from DMG 74. What this packet adds is the direction from the fighter class, emitted
    as class_fighter FEEDS_INTO class_bard, so the attack-matrix row is left alone.'
- assertion: rule_dm_discretion -[GATES]-> class_bard
  canonical_row: 383
  canonical_aspect: inclusion in campaign
  canonical_locus: PHB p117, APPENDIX II BARDS
  packet_aspect: restated by this packet
  packet_locus: 'PHB p117, APPENDIX II: BARDS'
  why_not_emitted: Already canonical and already cited to PHB 117 by the prior pass. It is the status
    flag for this whole packet and is recorded in packet.yaml rather than emitted twice.
