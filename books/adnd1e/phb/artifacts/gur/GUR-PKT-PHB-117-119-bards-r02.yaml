  proposed_label: Bardic Legend Lore
  kind: rule
  why_needed: The second percentage column on Table II, covering both legendary knowledge and item identification.
    Distinct from spell_legend_lore, which the packet names as the thing it resembles.
  edges_depending_on_it:
