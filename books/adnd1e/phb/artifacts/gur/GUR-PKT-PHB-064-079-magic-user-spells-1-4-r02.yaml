source_identity_conflicts:
  rule: contracts/SOURCE_MARKDOWN.md 1.3, Source Identity Authority and Conflicts. The packet is canonical
    for the spelling and label of a mechanic it names directly. The legacy label is drift. A canonical
    label replacement proceeds only through an Architect Decision, a reviewed GUP and an Integrator transaction;
    nothing here proposes one.
  conflicts:
  - candidate_id: spell_charm_person
    packet_label: Charm Person
    canonical_label: Charm
    packet_locus: PHB p65, Charm Person
  - candidate_id: spell_friends
    packet_label: Friends
    canonical_label: Friends Spell
    packet_locus: PHB p66, Friends
  - candidate_id: spell_tensers_floating_disc
    packet_label: Tenser’s Floating Disc
    canonical_label: Tenser's Floating Disc
    packet_locus: PHB p68, Tenser’s Floating Disc
  - candidate_id: spell_esp
    packet_label: ESP
    canonical_label: Psionic-Related Spells
    packet_locus: PHB p70, ESP
  - candidate_id: spell_leomunds_trap
    packet_label: Leomund’s Trap
    canonical_label: Leomund's Trap
    packet_locus: PHB p70, Leomund’s Trap
  - candidate_id: spell_levitate
    packet_label: Levitate
    canonical_label: Levitation
    packet_locus: PHB p70, Levitate
  - candidate_id: spell_fireball
    packet_label: Fireball
    canonical_label: Fire Spells
    packet_locus: PHB p73, Fireball
  - candidate_id: spell_hold_person
    packet_label: Hold Person
    canonical_label: Held or Paralyzed
    packet_locus: PHB p74, Hold Person
  - candidate_id: spell_confusion
    packet_label: Confusion
    canonical_label: Confused
    packet_locus: PHB p76, Confusion
  - candidate_id: spell_polymorph_other
    packet_label: Polymorph Other
    canonical_label: Polymorph Others
    packet_locus: PHB p78, Polymorph Other
  analyst_view: 'Every one of these ten IDs is correct for the concept and is reused unchanged, because
    GRAPH_INVARIANTS 4 makes the ID the identity and the label merely descriptive. Six are ordinary drift:
    Charm, Friends Spell, Levitation, Polymorph Others and two straight-quote spellings of Tenser''s and
    Leomund''s where the packet uses U+2019. Four are more than spelling, because the stored label names
    a different concept from the node: spell_esp is labelled Psionic-Related Spells, spell_fireball is
    labelled Fire Spells, spell_hold_person is labelled Held or Paralyzed and spell_confusion is labelled
    Confused. Two of those are family-or-condition labels sitting on a specific spell node, which constitution
    3.1 separates explicitly. The labels in nodes_master.csv are also not stable across edges; spell_esp
    alone carries five different source_labels in canonical.'
unresolved_identity_questions:
- id: IDQ-01
  subject: spell_darkness_15_radius versus the existing spell_darkness
  question: This packet names a second level magic-user spell 'Darkness, 15′ Radius'. Canonical already
    holds spell_darkness, labelled Darkness, at degree 2. The existing spell_protection_from_evil_10_radius
    shows the radius-suffixed stem is already canonical practice, so a new ID is proposed rather than
    a reuse.
  analyst_position: Mint spell_darkness_15_radius from the packet name. Do not fold it into spell_darkness
    without an Architect ruling, because the illusionist list in PKT-PHB-040-042-spells-intro carries
    a separate first level Darkness and folding them would merge two spells.
  affects:
  - M048
  - M049
  - M050
  - M177
- id: IDQ-02
  subject: monster_extra_dimensional versus the existing monster_demon_devil
  question: The hold portal and wizard lock entries turn on 'any extra-dimensional creature (demon, devil,
    elemental, etc.)'. monster_demon_devil exists but is narrower than the packet's category.
  analyst_position: Mint the broader node from the packet's own wording. The two entries disagree about
    whether such creatures affect the spell, so the category is load-bearing and cannot be approximated
    by the narrower node.
  affects:
  - M022
  - M079
- id: IDQ-03
  subject: two cross-packet targets that are not yet canonical
  question: M-refs cite spell_charm_person_or_mammal and spell_heat_metal. Both are candidates minted
    by GUR-PKT-PHB-054-064-druid-spells-r01 and neither is in canonical or the registry yet.
  analyst_position: Recorded with the packet-derived names. Builder should hold these two edges until
    the druid packet's nodes are integrated rather than mint a second identity for either.
  affects:
  - M002
  - M137
architectural_escalations: []
non_edge_observations:
- id: OBS-01
  topic: the packet is complete against the book's own spell index
  finding: The four magic-user columns of the spell tables in PKT-PHB-040-042-spells-intro list 30, 24,
    24 and 24 spells for levels one through four. This packet contains exactly those 102 names, with no
    spell in the index missing from the packet and none in the packet absent from the index.
  why_it_matters: OBS-37 of GUR-PKT-PHB-040-042-spells-intro proposed the spell tables as an independent
    completeness check for whoever extracted the spell chapters, subject to OBS-19's caution that the
    printed apparatus is not error-free. This is the first spell chapter to run that check, and for this
    book's magic-user levels one to four the index is exact.
- id: OBS-02
  topic: seventeen entries contribute no caster-level dependency
  finding: 'Eleven state no scaling of any kind: Charm Person, Mending, Continual Light, Invisibility,
    Leomund’s Trap, Pyrotechnics, Scare, Extension I, Rary’s Mnemonic Enhancer, Confusion and Invisibility,
    10′ Radius. Three scale only through a cleric or druid entry outside this packet and are the same
    node there: Light, Detect Evil and Remove Curse. Three more do scale, but the assertion already exists
    in canonical from another locus and was withheld as a duplicate rather than re-emitted: Dispel Magic,
    Haste and Hold Person.'
  why_it_matters: Constitution 7.1 warns that inherited rules are the easiest place to over-generalise
    and asks for a counter-example before a general rule is added. The first eleven are that counter-example,
    and they are why GR_MU_SPELL_LEVEL_SCALING is recorded but not proposed. The second and third groups
    are not counter-examples and should not be read as such.
- id: OBS-03
  topic: two spells in the packet yield no assertion at all
  finding: Invisibility, 10′ Radius and Pyrotechnics are described wholly by reference to another spell
    and add no mechanical facet of their own beyond area and range magnitudes.
  why_it_matters: No node is proposed for either, because a node with no edge is degree-zero clutter.
    If a later packet gives either an independent mechanic, it should be minted then.
- id: OBS-04
  topic: the constitution's worked EXCLUDES example reads as a denial, not a prevention
  finding: Constitution 4.1 gives 'spell_knock EXCLUDES abil_strength_bend_bars, knock will not raise
    a portcullis' as its example of EXCLUDES, meaning X actively prevents Y. The packet sentence is 'It
    will not raise bars or similar impediments (such as a portcullis).' That denies that knock reaches
    barred impediments, which is the EXCLUDED_FROM sense, X is not an input to Y. Canonical row 311 already
    carries the EXCLUDES form.
  analyst_action: The edge is not re-emitted, because row 311 already holds it; the observation is recorded
    rather than acted on.
  why_it_matters: The distinction is one the constitution insists on keeping and says has zero mirrored
    pairs. If the canonical example of the type is itself on the wrong side of the distinction, later
    extractors will copy it. This is an Architect question, raised here as an observation because nothing
    in this packet turns on it.
- id: OBS-05
  topic: the packet states the helpless-target rule earlier than the book the general rule is cited to
  finding: The sleep entry says sleeping creatures can be slain automatically. The general-rule register
    in constitution 7.1 records GR_HELPLESS_TARGET_AUTOHIT cited at DMG p70, and canonical row 1764 carries
    spell_sleep OVERRIDES cbt_tohit against DMG p67.
  why_it_matters: Publication order is MM, PHB, DMG, UA. A rule the register cites to the DMG is stated
    in the PHB a year earlier. Under constitution 7.1 the establishing text carries no general_rule_id
    and is the evidence the rule generalises from, so the register's 'cited at' for this rule may belong
    to the PHB. Not acted on here; the assertion already exists and this GUR only adds the earlier locus.
- id: OBS-06
  topic: the packet corroborates two corrections proposed for PKT-PHB-040-042-spells-intro
  finding: The printed contents places SPELL EXPLANATIONS at 43 and the magic-user spell table at 41 with
    the illusionist table at 42.
  why_it_matters: The spells-intro packet's manifest recorded the page of its trailing SPELL EXPLANATIONS
    heading as unresolved and treated it as the last line of page 42. Independently of that, this packet's
    own start at 64 is what the contents predicts. Recorded as corroboration only; no artifact is changed
    by it.
- id: OBS-ASPECT-02
  topic: revision 2 exists only to bring aspects within constitution 5
  finding: The Builder graded aspect_word_count as an error under DEC-2026-0029 and returned this packet.
    82 of this GUR's aspects ran to five words or more.
  why_it_matters: Each replacement names the facet the cited spell entry touches, re-derived from that
    entry in the claimed source rather than produced by shortening the previous string, as DEC-2026-0029
    requires. No edge was added, dropped or re-pointed; the set was re-checked against canonical and against
    itself with no collision.
  owner: analyst
blocking_notes:
- id: BLK-02
  note: No node_registry_slice.csv, local_neighborhood.json or general_rule_slice.json accompanied this
    packet. The substitutions used instead are recorded in node_id_resolution_method and in the packet
    manifest's missing_input_impact. The duplicate and near-match check was run against the whole of edges_master.csv
    rather than a supplied neighbourhood, which is a wider read than the constitution's role-input table
    intends for Analyst.
  impact: Does not block this GUR.
completeness_statement: Every one of the 102 spell entries and all five preamble paragraphs were read
  and considered. Coverage was verified against the book's own spell index, which matches exactly at all
  four levels; see OBS-01. Every candidate edge carries a book, a printed page derived from a packet marker
  under SOURCE_MARKDOWN 1.3, and a section. No aspect or condition contains a magnitude, die expression
  or threshold. Authored polarity appears only on MODIFIES, TRIGGERS and CONSTRAINS, always with basis
  read, and no edge carries polarity on a deterministic type. Sixteen assertions the packet restates were
  checked against canonical and withheld rather than duplicated. Twenty-two canonical rows whose printed
  page this packet contradicts are recorded for a reviewed citation correction, and twenty rows that merely
  cite a different legitimate locus are separated from them so they are not corrected by mistake.
handoff:
  next_role: builder
  readiness: ready
  reason: analyst extraction complete
  blocking_ids: []
