candidate_general_rules:
- proposed_id: GR_MU_SPELL_LEVEL_SCALING
  statement: Recorded as a candidate only, not applied. Nearly every magic-user spell scales some facet
    with caster level.
  why_not_proposed_for_adoption: Constitution 2.1 explicitly forbids collapsing a selective set of per-spell
    dependencies into one inherited rule, and twelve entries in this packet do not scale at all. The exceptions
    are what make the rule unsafe to generalise. Recorded so a future Architect sees that the option was
    considered and declined, per constitution 7.1's caution on over-generalisation.
  counter_examples_in_this_packet:
  - Charm Person
  - Mending
  - Continual Light
  - Knock
  - Dispel Magic
  - Extension I
  - Rary’s Mnemonic Enhancer
