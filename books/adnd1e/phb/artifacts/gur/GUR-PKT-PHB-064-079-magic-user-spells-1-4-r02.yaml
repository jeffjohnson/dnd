source_summary: 'PHB 64 to 79, the first four levels of the magic-user spell chapter. A five-paragraph
  preamble, Notes Regarding Magic-User Spells, on material components, casting-time delay, substitute
  materials and reversible spells, then 102 spell entries: thirty at first level and twenty-four at each
  of the second, third and fourth. Every entry carries all seven stat fields and an Explanation/Description.
  The chapter continues beyond this packet; fifth through ninth level magic-user spells occupy roughly
  pages 80 to 93 and are not included.'
node_id_resolution_method: No node_registry_slice.csv was supplied, so each spell name was stripped of
  its school parenthetical and the word Reversible, slugged, and looked up by ID in both rulesets/adnd1e/registries/nodes.csv
  and rulesets/adnd1e/canonical/nodes_master.csv, then separately by label. 49 of 102 resolve to an existing
  spell_ ID and 53 do not. Non-spell endpoints were resolved by direct search of the same two files; eight
  had no existing identity and are proposed as candidates.
grain_decisions:
- decision: Level scaling is recorded as one exp_level MODIFIES edge per spell that states it, never as
    an aggregate.
  basis: Constitution 2.1 makes these per-spell assertions and forbids replacing a selective set with
    one aggregate edge. GUR-PKT-PHB-054-064-druid-spells-r01 set the same precedent with 57 such edges.
  how_applied: A spell contributes an edge when either its stat block or its description ties an effect
    to the caster's level. Where several facets scale, the aspect names the single most load-bearing one,
    so the assertion key stays stable. 85 of the 102 entries qualify and carry 86 such edges; spell_wizard_lock
    carries two because the entry scales its area of effect and separately lets a sufficiently higher-level
    caster open a lock set by another. The seventeen entries that contribute none are listed in OBS-02.
- decision: No magnitude, die expression, percentage, threshold or formula appears in any aspect or condition.
  basis: Constitution 2 and GRAPH_INVARIANTS 11.
  how_applied: Aspects such as 'damage by level' and 'number of missiles' name the scaled facet without
    its value. Every aspect and condition in this GUR was checked against a digit and die-expression filter
    before publication.
- decision: Where a magic-user spell entry says it is the same as a cleric or druid spell of the same
    name, no cross-spell edge is recorded.
  basis: Constitution 3, labels do not determine identity and one concept is one node. The two class versions
    are the same spell node; the stated differences are range, duration and component magnitudes, which
    the grain rule removes.
  how_applied: Applied to detect magic, light, protection from evil, detect evil, locate object, dispel
    magic, pyrotechnics, tongues, water breathing, confusion, plant growth, remove curse and wall of fire.
    Where the reference is to a differently named spell, charm person to charm person or mammal, a CROSS_REFERENCES
    edge is recorded instead. Where the entry adds a genuine mechanical difference, the magic-user continual
    light being non-reversible, that difference is recorded as its own edge.
