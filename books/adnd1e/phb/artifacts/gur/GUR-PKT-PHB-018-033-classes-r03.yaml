candidate_general_rules: []
candidate_general_rules_note: None proposed. The pattern that a sub-class inherits its parent's mechanics
  unless the text says otherwise, druid from cleric and paladin and ranger from fighter, has the shape
  of a general rule. It is not proposed, because every inheritance this packet relies on is stated outright
  in the sub-class section, so nothing would be inherited silently and no edge here would carry a general_rule_id.
  Recorded as OBS-25 for the Architect, since it may earn promotion once the spell packets are read.
