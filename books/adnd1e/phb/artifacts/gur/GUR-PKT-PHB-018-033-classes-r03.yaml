domain_boundary_questions:
- id: DBQ-04
  question: 'class_eligibility now draws from three packets and three unrelated table families: ability
    minimums in packet 03, racial class limitations in packet 04, and alignment restrictions here. Sixty-seven
    edges across the three. Is that one domain?'
  analyst_position: no recommendation; the same question as DBQ-02 and DBQ-03, now larger
rejected_candidates:
- text_locus: the twelve experience and spell progression tables, pages 20 to 32
  quoted_gist: experience thresholds, hit dice and spells usable per class per level
  rejection_reason: Entirely magnitudes. See grain_decisions. The relationships they encode are already
    carried by the class-gates-spell-use edges here and the level and ability gates on spell level access
    from packets 02 and 03.
- text_locus: every class section, pages 20 to 31
  quoted_gist: the ability score minimums required to enter each class
  rejection_reason: Verified redundant against packet 03's eighteen GATES edges rather than assumed. See
    OBS-23 for the class-by-class check.
- text_locus: The Cleric, p20
  quoted_gist: the undead are ghasts, ghosts, ghouls, liches, mummies and so on
  why_considered: monster_undead exists canonically at degree 28
  rejection_reason: A definition by enumeration, not a relationship. The load-bearing claim, that clerics
    turn undead, is F1. Which creatures count as undead is a Monster Manual matter and the text says so.
- text_locus: The Cleric, p20; The Fighter, p22; The Magic-User, p25
  quoted_gist: revenue of nine, seven or five silver pieces per inhabitant per month
  rejection_reason: Magnitudes attached to a stronghold. The relationship that high level gates stronghold
    construction is F3 and F26.
- text_locus: The Paladin, p22, benefit 8
  quoted_gist: the paladin may call for an intelligent warhorse with stated statistics
  why_considered: a real granted resource
  rejection_reason: 'No canonical node represents the paladin''s warhorse, and the passage is largely
    statistics, which are magnitudes. A candidate node was considered and not proposed: the packet gives
    it two sentences and the Analyst would be minting identity for a mechanic the book barely elaborates.
    Flagged here so the omission is deliberate and visible rather than silent.'
- text_locus: The Assassin, p29
  quoted_gist: the assassination table gives roughly a fifty percent chance of killing
  rejection_reason: The relationship, that assassins gain an assassination attack on surprise, is F39.
    The probability is a magnitude.
- text_locus: The Monk, p31, special abilities A through K
  quoted_gist: eleven lettered special abilities gained at rising levels
  why_considered: several are genuinely mechanical, including immunity to poison, resistance to beguiling
    and charm, and the quivering palm
  rejection_reason: Partially extracted, not wholly rejected. Those with an existing canonical target
    are recorded, notably disease immunity as F57. The remainder, including quivering palm, speak with
    plants, feign death and mind masking, have no canonical node, and proposing eleven candidate nodes
    from one table would flood the registry with monk-only identities. Recorded as OBS-26 with a recommendation.
- text_locus: Notes Regarding Special Abilities, ability K, p32, limit 1
  quoted_gist: attemptable once per week, and the touch must land within three melee rounds or the power
    is drained for a week
  why_considered: a real precondition on a power that now has a node
  rejection_reason: Frequency and a round count, both magnitudes. Stripping them leaves 'the power is
    limited in how often it may be used', which names no second mechanic and so has nothing to point at.
    Recorded so the omission is visible rather than silent, in the manner OBS-26 was faulted for not using.
non_edge_observations:
- id: OBS-22
  topic: the packet 04 alignment deferral was correct, with one exception
  locus: all ten class sections, pages 20 to 31
  finding: 'OBS-15 of GUR-PKT-PHB-013-018-races-r03 deferred the class alignment restrictions out of the
    Table I legend on p13 and recorded the deferral as a test: if the class sections did not restate them,
    the deferral was wrong. They do. Cleric states any alignment save true neutral; druid states the only
    absolute neutrals; fighter states any alignment; paladin states lawful good and must remain so; ranger
    states good; magic-user states any alignment; thief states neutral or evil, rarely neutral good; assassin
    states evil; monk states lawful. That is nine of ten classes stating their own restriction in their
    own section.'
  the_exception: The illusionist section states no alignment restriction at all. The p13 legend gives
    illusionist as (A), any. So for the illusionist the race-table legend is the only statement in either
    packet, and no C-series edge is proposed for it.
  consequence: 'The deferral is discharged for nine classes with better citations than the legend would
    have given. For the illusionist the Reviewer has a choice: accept that "any alignment" is the absence
    of a restriction and therefore not an edge, which is the Analyst''s reading and why nothing is proposed,
    or cite it back to the p13 legend in packet 04. The Analyst recommends the former, consistent with
    rejecting the "yes" cells of the race table in packet 04.'
  why_recorded: A deferral is only sound if someone checks it. This one was checked class by class.
- id: OBS-23
  topic: packet 03's ability minimums are complete for all ten classes
  locus: all ten class sections
  finding: Every ability minimum stated in this packet was checked against the eighteen ability-gates-class
    edges of GUR-PKT-PHB-009-013-ability-scores-r01. Cleric wisdom; druid wisdom and charisma; fighter
    strength and constitution; paladin strength, intelligence, wisdom, constitution and charisma; ranger
    strength, intelligence, wisdom and constitution; magic-user intelligence and dexterity; illusionist
    intelligence and dexterity; thief dexterity; assassin strength, intelligence and dexterity; monk strength,
    wisdom, dexterity and constitution. All are already carried. None is missing, and this packet adds
    none.
  why_it_matters: Packet 03 extracted these from the ability tables, which list class minimums in a General
    Information column. It was not obvious that a column of scattered notes would prove complete against
    ten dedicated class sections. It did. That is evidence the ability tables are the authoritative locus,
    which supports having extracted them there rather than here.
  consequence: no edges; the potential twenty-eight duplicates are not proposed
- id: OBS-24
  topic: the new race nodes are used, and the taxonomy rule is respected
  locus: The Multi-Classed Character and The Character with Two Classes, p33
  finding: The packet states that only non- or semi-human characters can be multi-classed, and that the
    character with two classes must be human. Both are group-grain statements about exactly the categories
    DEC-2026-0002 established.
  how_it_was_handled: G1 asserts race_demihuman GATES rule_multiclass and G2 asserts race_human EXCLUDED_FROM
    rule_multiclass, both as explicit source-supported edges citing this page. Neither is an inheritance
    from taxonomy membership, which DEC-2026-0002 forbids. G3 uses race_human for the dual-class rule,
    which is the second edge that node has earned since it was approved.
  redundancy_note: G1 overlaps the six per-race GATES edges G1 to G6 of packet 04, which assert the same
    eligibility per race from the race sections. Whether the group edge should replace them, coexist with
    them, or be rejected in their favour is a Reviewer question and exactly the grain choice DEC-2026-0002
    anticipated. The Analyst proposes both and flags the overlap rather than silently choosing.
- id: OBS-25
  topic: sub-class inheritance is stated, not assumed
  locus: The Druid, The Paladin, The Ranger, The Illusionist, The Assassin
  finding: 'Five classes are sub-classes of another, and each states its inherited behaviour explicitly:
    druids fight and save as clerics, monks attack on the cleric table and save on the thief table, assassins
    attack on thief tables and have all thief functions, illusionists conform to magic-users in most respects.'
  why_it_matters: This is the clearest general-rule candidate seen so far, but promoting it now would
    buy nothing, because every instance is stated outright and would carry an empty general_rule_id under
    constitution 7.1 regardless. It becomes worth promoting only if a later packet relies on the inheritance
    without restating it, which the spell chapters may.
  recommendation: Architect may wish to note it now and decide after the spell packets.
- id: OBS-26
  revision_status: rewritten_in_r02_at_architect_direction
  topic: the eleven monk special abilities, tested one by one
  locus: Notes Regarding Special Abilities, pages 31 to 32
  r01_error: 'r01 asserted that only disease immunity had a canonical target node and asked a blanket
    question about whether class-specific abilities warrant nodes at all. DEC-2026-0003 returned that
    as not decidable architecture. It was also wrong on the facts: re-checking the registry ability by
    ability found targets for seven of the eleven. r01 under-checked and then escalated the gap instead
    of closing it.'
  method_in_r02: Each lettered ability was tested against the core test and then against the registry
    for an existing target. Extract where a canonical target exists; defer where the target is a spell
    that the spell packets will establish; propose a node only where the mechanic exists nowhere else.
  disposition:
  - ability: A, speak with animals at third level
    outcome: deferred
    reason: The target is the Speak with Animals spell, which appears in the cleric and druid tables of
      packet 09 and will be established with its own description. Minting it from a monk table would fix
      a spell's identity from the wrong locus.
  - ability: B, mind masking against ESP at fourth level
    outcome: extracted as M1
    target: spell_esp
  - ability: C, immunity to disease, haste and slow at fifth level
    outcome: extracted as F57 corrected, plus M2 and M3
    target: rule_disease, spell_haste, spell_slow
    note: 'F57 was typed EXCLUDED_FROM in r01 and is corrected to EXCLUDES in r02. Constitution 4.1 distinguishes
      them: EXCLUDED_FROM says X is not an input to Y, EXCLUDES says X actively prevents Y. An immunity
      is the second. The same correction is applied by using EXCLUDES for M2, M3 and M8.'
  - ability: D, self-induced catalepsy at sixth level
    outcome: deferred
    reason: spell_feign_death exists but denotes the spell. The monk ability is self-induced and physiological,
      so pointing at the spell would assert a relationship the text does not make. No node represents
      the ability.
  - ability: E, self-healing at seventh level
    outcome: extracted as M4
    target: rule_hp_recovery
  - ability: F, speak with plants at eighth level
    outcome: deferred
    reason: same as A; the target is a spell the spell packets will establish
  - ability: G, resistance to beguiling, charm, hypnosis and suggestion at ninth level
    outcome: extracted as M5 and M6
    target: spell_charm_person, spell_suggestion
    note: Beguiling and hypnosis have no canonical spell node and are not extracted. The two that exist
      carry the relationship; the omission is partial coverage of one sentence rather than a missing mechanic.
  - ability: H, telepathic and mind blast defence at tenth level
    outcome: extracted as M7
    target: psi_attack_modes
  - ability: I, poison immunity at eleventh level
    outcome: extracted as M8
    target: save_poison
  - ability: J, geas and quest immunity at twelfth level
    outcome: deferred
    reason: no canonical node for either spell; both are magic-user spells the spell packets will establish
  - ability: K, quivering palm
    outcome: candidate node proposed
    reason: The only one of the eleven that exists nowhere else in the graph and is not a spell. It is
      a distinct attack form with its own preconditions and limits.
  is_this_an_ontology_conflict: No. That is the finding. Seven abilities resolved onto existing canonical
    nodes, four are deferred to a packet that will establish their targets properly, and one needs an
    ordinary node under an approved prefix. Under DEC-2026-0003 that last case is Builder and Reviewer
    work, not an escalation. r01 escalated because it had not done the per-ability work; having done it,
    there is nothing architectural here.
  recommendation: The same method should be applied to the paladin benefits and ranger abilities that
    r01 also only partly represented, rather than asking about them as a class.
- id: OBS-41
  topic: the p32 marker and the ability that carries it
  locus: Notes Regarding Special Abilities, ability I, p32
  finding: The review moved F58, F59 and F60 from page 31 to page 32 because they follow the p32 marker,
    and held F46, F47 and F51 at page 30 because they precede the p31 marker. Both are placement rule
    1 applied correctly. It then left M8 at page 31, and M8 is the ability I line that carries the p32
    marker at its end. Under rule 1 the line carrying the marker is the line that starts on the named
    page, so ability I, and with it J and K, are on page 32.
  what_r03_does: M8 is corrected to page 32 and the departure is recorded on the edge itself.
  why_it_matters: Not for this row alone. The p31 and p32 markers in this packet sit at the end of a list
    item rather than at the end of a paragraph, and the two were read differently within one review. Whichever
    reading is right, it should be the same one in both places. If the Reviewer's reading is the intended
    one, the p31 corrections need revisiting too, which is the larger consequence.
  owner: reviewer, or architect if the placement rule needs restating for list items
- id: OBS-42
  topic: what the ability-K omission says about the r02 method
  locus: OBS-26
  finding: 'OBS-26 tested all eleven monk abilities and got ten of them right. Ability K failed in a specific
    way: the method asked, for each ability, what canonical node the ability points at. For ten abilities
    that is the right question, because they modify or exclude something that already exists. For K the
    answer was nothing, and the method stopped there instead of asking the other question, which is what
    points at the ability.'
  why_recorded: The same trap is waiting in the paladin benefits and the ranger abilities, which OBS-26
    itself recommended running through the same method. Any mechanic that needs a new node is by definition
    one with no existing downstream target, so it is exactly the case where looking only downstream returns
    nothing and a new node ends up proposed with no edge. A candidate node with an empty edges_depending_on_it
    is the signature of this error and is worth treating as one.
  owner: analyst, applied to later packets
unresolved_identity_questions:
- id: IDQ-08
  question: B10 asserts sys_alignment GATES rule_poison_ingested, from the Table II footnote that the
    poison prohibition binds only clerics who are not of evil alignment. Should the source be sys_alignment,
    or class_cleric qualified by alignment?
  bearing: B10
  analyst_handling: Used sys_alignment because alignment is what varies in the sentence; the class is
    fixed. Flagged because the reverse reading is defensible.
- id: IDQ-09
  question: F35 asserts exp_level CONSTRAINS thief_pick_pockets, for the rule that a victim's level reduces
    the thief's chance. The exp_level node here denotes the victim's level, not the thief's, while F30,
    F32 and F33 use the same node for the thief's own level, in the same class section and on the same
    page.
  bearing: F35
  analyst_handling: Proposed as written and flagged rather than resolved. The graph has one node for experience
    level and this rule needs it to mean two different characters at once. This is a genuine expressiveness
    limit, not a naming slip, and it is adjacent to the class_level_conflation hazard already flagged
    on packet 02's E6.
- id: IDQ-13
  question: Canonical holds rule_monk_kill, labelled Killing Blow, with rows 371 to 373 citing PHB 30
    for the stunning-blow kill chance, and rows 1828 and 1830 citing DMG 71 for 'cannot be affected' against
    monster_undead and monster_special. That second pair is the same restriction the PHB states at p32
    as limit 2 of the quivering palm, which is a different power gained at a different level. Do the DMG
    71 rows belong to the killing blow, to the quivering palm, or to both?
  bearing: M10, M11
  analyst_handling: M10 and M11 are proposed against rule_quivering_palm from the PHB text, which states
    the restriction for that power in terms. They do not collide with rows 1828 and 1830 under invariant
    12, because the source node differs. The review approved rule_quivering_palm as having no canonical
    collision and that holds; this is an adjacency, not a collision.
  why_flagged: 'The Builder must not fold M10 and M11 onto rule_monk_kill on the strength of the aspect
    text matching. The two powers are plainly distinct in the PHB: the killing blow needs a stunned target
    and resolves against armour class from 8th level, the quivering palm is a touch that sets up vibrations
    and is the last ability gained. Also note the direction disagreement: canonical types this restriction
    as rule_monk_kill EXCLUDED_FROM monster_undead, and r03 types it as monster_undead EXCLUDES rule_quivering_palm
    on the constitution 4.1 reading this GUR applied to F57 and M2, M3, M8. One of the two is wrong. The
    DMG re-analysis will reach rows 1828 and 1830 and is the right place to settle it.'
architectural_escalations: []
architectural_escalations_note: None raised. OBS-26 is the nearest, and it is deliberately recorded as
  an observation seeking guidance rather than as an escalation, because no edge in this packet depends
  on the answer and the question is better decided across several packets than from this one.
