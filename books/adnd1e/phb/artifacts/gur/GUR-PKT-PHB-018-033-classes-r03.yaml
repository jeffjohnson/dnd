  how_each_disposition_was_carried:
    approved_29: 'carried unchanged, each tagged review_disposition: approved.'
    approved_with_revision_64: every exact_correction touching a field the GUR carries was applied by
      reading the review file, not by hand. Each such edge records revised_in_r03 with the old and new
      value so the change is checkable against the review without opening both files.
    rejected_23: split by kind. Twenty-one are canonical restatements where the review says in terms that
      the source assertion stands and only the insertion is rejected. Those are moved to canonical_duplicates_not_for_emission
      so the packet keeps its witness while the Builder emits nothing. Two, F43 and F56, are defects in
      the extraction itself and are withdrawn outright into withdrawn_in_r03.
    operation_changes_10: ten rows are revised from insertions to canonical_update or canonical_migration.
      The GUR has no operation field, so each carries review_operation with the operation and the canonical
      row it acts on.
  node_registry_decisions_carried:
    rule_quivering_palm: approved; now has M9 to M13 depending on it.
    rule_dual_class: approved; unchanged.
    rule_tracking: approved; unchanged.
    rule_prime_requisite: approved_with_revision. The label becomes Prime Requisite Experience Bonus and
      the node is the same one approved in REV-GUP-PKT-PHB-009-013-ability-scores-r03-r01. It stays in
      carried_forward_candidates and is not re-proposed, which is what the review's do-not-insert-twice
      instruction requires.
