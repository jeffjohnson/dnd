  - M8 page 31 to 32. See departs_from_review on that edge and OBS-41.
  - F43 and F56 are not merely held back as the other twenty-one rejections are. They are withdrawn, because
    the review's reasons for them describe extraction errors rather than duplication, and a withdrawn
    candidate should not sit in a list whose heading says the source witnesses it.
