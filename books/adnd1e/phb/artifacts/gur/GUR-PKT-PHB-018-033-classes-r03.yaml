revision_reason: 'REV-GUP-PKT-PHB-018-033-classes-r03-r01 returned the packet to the Analyst with one
  blocking finding and 64 row revisions. r03 does both things it asked for. The blocking finding, REV-COMP-CLASS-QUIVERING-PALM,
  is answered by M9: r02 proposed rule_quivering_palm with no edge attached and gave a reason that does
  not survive scrutiny. It asked what the mechanic points at and, finding only the victim''s death and
  the monk''s level, concluded there was no admissible relationship. The relationship it missed points
  the other way. The Monk class confers the power, which is the same grant this GUR already asserts for
  the cleric at F1, the fighter at F7, the magic-user at F25 and F26 and the assassin at F39. The Reviewer
  was right and the omission was a reasoning error, not a judgement call. Re-reading ability K for the
  grant surfaced four further dependencies in its four stated limits, so M10 to M13 are proposed with
  it. Every one of the review''s exact corrections is applied mechanically from the review file rather
  than transcribed. Two departures are recorded as departures rather than applied quietly, at M8 and at
  the two withdrawn rows.'
