source_summary: Pages 18 through 33, the CHARACTER CLASSES section in full. An opening survey of the ten
  classes; CHARACTER CLASSES TABLE I giving hit die type, maximum hit dice, spell ability and class level
  limit; TABLE II giving armour, shield, weapons, oil and poison permitted. Then a section for each of
  the ten classes carrying its ability minimums, alignment restriction, experience table, spell progression
  table where applicable, and its distinctive powers and strictures. Finally the multi-classed character
  and the character with two classes. Twenty-three tables in all, twelve of them experience or spell progressions.
node_id_resolution_method: No slice supplied; resolved by targeted registry lookup as in packets 02 to
  04. 106 of 108 edges resolved onto existing canonical IDs. Two concepts had no node. A third candidate,
  rule_prime_requisite, is carried forward unchanged from packet 03 and is not re-proposed here; it is
  still pending an Architect ruling.
grain_decisions:
- decision: The twelve experience and spell progression tables yield no edges of their own.
  reasoning: 'Their content is entirely magnitudes: experience thresholds, hit dice counts and spell counts
    per level. What survives the grain rule is that class level determines spell availability, which is
    already asserted by A1 to A6 as the class gating spell use, and by packet 02''s E6 and packet 03''s
    I2 and W11 for the level and ability gates on spell level access. Restating it per class per spell
    level would be twelve near-identical edges carrying no new relationship.'
- decision: Per-class ability minimums are not re-extracted here.
  reasoning: Verified redundant against packet 03 rather than assumed redundant. See OBS-23.
- decision: Two duplicate identity triples were resolved before assembly, not emitted.
  reasoning: 'class_druid CONSTRAINS exp_level and class_monk CONSTRAINS exp_level each arose twice: once
    from the Table I class level limit, and once from the rule that the highest ranks are contested and
    numerically limited. Invariant 12 forbids duplicate edge identity and the constitution defines no
    distinct assertion key that would permit the pair, so each was folded into a single edge whose condition
    records both the hard ceiling and the contest. The alternative, inventing a second target node to
    carry the contest, would have manufactured identity to dodge an invariant.'
candidate_nodes:
- proposed_id: rule_quivering_palm
  proposed_label: Quivering Palm
  prefix: rule_
  prefix_is_approved: true
  why_needed: Added in r02 from the per-ability analysis in OBS-26. The monk's highest attack form, touching
    a victim to set up fatal vibrations under stated limits on frequency, target type and hit dice. No
    canonical node covers it and it is not a spell.
  edges_depending_on_it:
  - M9
  - M10
  - M11
  - M12
  - M13
  note: r02 proposed this node with no edge and said so deliberately. That was the error REV-COMP-CLASS-QUIVERING-PALM
    caught. r03 attaches the grant edge and the three limits that survive the grain rule. Approved by
    the review as a distinct mechanic with no canonical collision; IDQ-13 records the one near neighbour
    worth knowing about.
  review_disposition: approved
- proposed_id: rule_dual_class
  proposed_label: The Character with Two Classes
  prefix: rule_
  prefix_is_approved: true
  why_needed: 'The registry holds rule_multiclass at degree 14 but nothing for the human dual-class rule,
    which this packet gives a section of its own and which works differently: the character stops advancing
    in the original class rather than dividing experience between classes. Collapsing the two would make
    the graph unable to distinguish "what breaks if multi-classing changes" from "what breaks if dual-classing
    changes".'
  edges_depending_on_it:
  - G3
  - G4
  - G5
  - G6
  review_disposition: approved
- proposed_id: rule_tracking
  proposed_label: Tracking
  prefix: rule_
  prefix_is_approved: true
  why_needed: Ranger tracking is a distinct procedure with its own underground and outdoor resolution,
    and no canonical node covers it. The registry's nearest matches, item_boots_varied_tracks and monster_slithering_tracker,
    are unrelated.
  edges_depending_on_it:
  - F19
  review_disposition: approved
carried_forward_candidates:
- id: rule_prime_requisite
  first_proposed_in: GUR-PKT-PHB-009-013-ability-scores-r01
  status: Routed to Builder and Reviewer by DEC-2026-0003, not awaiting an Architect ruling. That decision
    holds that absence from the registry is not by itself architectural and that an unambiguous addition
    under an approved prefix and kind may be approved through the normal GUP and Review path. The disposition
    recorded there is return_to_builder_and_reviewer, which is a routing instruction and not a rejection.
  edges_here:
  - D1
  note: This packet strengthens the case for it. Packet 03 saw the bonus from the ability side, four times.
    This packet gives the class side for all ten classes, including three explicit denials, which is what
    D2 to D4 record.
  review_disposition: approved_with_revision
  label_correction: Prime Requisite Experience Bonus, per the review's node_registry_decisions. The review
    also requires that this reference the identical node approved in REV-GUP-PKT-PHB-009-013-ability-scores-r03-r01
    rather than insert a second one.
