- id: BLK-01
  severity: unchanged
  issue: domain_registry.yaml remains an empty map at status bootstrap.
  owner: architect
- id: BLK-02
  severity: severe and now cumulative
  issue: no node_registry_slice.csv and no local_neighborhood.json supplied, for the fifth packet running.
  consequence: '335 edges have now been proposed across five packets with no deduplication against the
    3,809-edge canonical graph. This packet is the worst exposure yet: it touches exp_level at degree
    162, sys_alignment at 102, thief_skills, turn_undead at 29 and every class node. OBS-24 records one
