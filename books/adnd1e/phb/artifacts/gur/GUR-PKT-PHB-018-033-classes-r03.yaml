completeness_statement: 'All 1,160 lines were read before extraction. Every one of the twenty-three tables
  was examined and every class section was read in full, including the notes beneath each table and the
  lettered special-ability list for monks. Page markers were checked for sequence and uniqueness before
  reading; the single gap at page 23 is explained in OBS-27 and is not a defect.

  108 candidate edges are proposed. Seven candidate groups are recorded as rejected with reasons, two
  of which are substantive rather than mechanical: the twelve progression tables, rejected on grain, and
  the per-class ability minimums, rejected on a verified redundancy against packet 03 rather than an assumed
  one.

  Two candidate nodes are proposed and a third is carried forward from packet 03 unchanged rather than
  re-proposed. Two duplicate identity triples were caught by a mechanical check during generation and
  resolved before assembly, not emitted and left for a Reviewer.

  Two prior deferrals are discharged in this packet and both were correct. The alignment restrictions
  deferred from packet 04 are restated by nine of ten classes, and the ability minimums extracted in packet
  03 prove complete against all ten class sections. Recording deferrals as tests rather than as intentions
  is what made both checkable.

  The two nodes approved since packet 04, race_human and race_demihuman, are both used here on explicit
  source statements rather than on taxonomy inheritance, which DEC-2026-0002 forbids.

  This GUR is complete enough for the Builder to normalize without rereading the source. The standing
  qualification is now cumulative and is the most important thing in this artifact: five packets have
  proposed 335 edges against a graph none of them could see.

  r03 adds the following. Every one of the 116 rows returned by REV-GUP-PKT-PHB-018-033-classes-r03-r01
  is accounted for: 93 are carried into the emission set with the review''s corrections applied from the
  review file mechanically, 21 are held back as canonical restatements the packet still witnesses, and
  2 are withdrawn as extraction errors. Five edges are added, all from ability K on p32. M9 is the assertion
  the review required. M10 to M13 are the four limits stated in the same passage, three of which survive
  the grain rule and one of which, limit 1, does not and is recorded as rejected. The emission set is
  98 edges and carries no duplicate identity triple, checked mechanically before assembly as in r02.

  Two things in r03 are departures rather than compliance and are labelled as such: M8''s page, and the
  decision to withdraw F43 and F56 outright instead of holding them with the other rejections. Both are
  visible in review_response.departures_from_the_review.

  BLK-01 and BLK-02 are unchanged. The five new edges were checked against canonical by hand for this
  packet only, which is not a substitute for the slice BLK-02 has now asked for six packets running; it
  is what found IDQ-13.'
downstream_notes:
  purpose: Builder and Reviewer startup does not read books/<book>/reports/, so a finding recorded only
    there would never reach them. This block is a pointer, not a verdict.
  dedupe_report:
    path: books/adnd1e/phb/reports/DEDUPE-PHB-20260729.md
    what_it_is: 'Every edge proposed across all PHB GURs, compared against the 3,809-edge canonical graph
      on three tests: exact duplicate triple, type conflict on the same ordered pair, and direction conflict
      on the reversed pair. Across all PHB GURs, 115 of 389 proposed edges duplicate a canonical triple
      exactly, 35 are type conflicts and 20 are direction conflicts.'
    why_it_exists: No packet was ever supplied with a local_neighborhood.json, so no Analyst could run
      this check at extraction time. It is BLK-02, run once after the fact.
    what_builder_should_do: Consult it before normalising this GUR. Exact duplicates should generally
      be dropped from the GUP; where the canonical row cites a different book, prefer adding this packet's
      citation to the existing row over discarding a second independent witness.
    what_reviewer_should_do: The direction conflicts are classified in the report into four classes with
      a disposition for each. Class B is not a conflict at all and both sides should be kept. Class D
      is a flat PHB-versus-DMG contradiction on two rows.
  no_verdicts_embedded: This GUR has not been edited to mark individual edges as duplicates. Whether an
    assertion is already held by the graph is a normalisation determination owned by Builder and Reviewer;
    recording it in an interpretive artifact would put the decision in the wrong role.
