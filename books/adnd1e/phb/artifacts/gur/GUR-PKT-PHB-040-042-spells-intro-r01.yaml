rejected_candidates:
  - text_locus: "SPELL TABLES, pages 40 to 42"
    quoted_gist: roughly 250 spells listed by class and by spell level
    rejection_reason: >-
      See grain_decisions. Deferred to the spell description chapters, not discarded.

  - text_locus: "CHARACTER SPELLS, p40"
    quoted_gist: the number of spells usable depends upon class and level
    rejection_reason: >-
      An explicit back-reference. The text says "As previously shown in the CHARACTER
      CLASSES section", and packet 05's A1 to A6 carry the relationship from there with a
      better citation.

  - text_locus: "SPELL EXPLANATIONS, p42"
    quoted_gist: the format of a spell entry, giving range, duration, area of effect and so on
    rejection_reason: >-
      A description of how the following chapters are laid out. It defines fields rather
      than asserting relationships between mechanics. See OBS-38 for the one consequence
      worth carrying forward.

non_edge_observations:
  - id: OBS-37
    topic: the spell tables are an index, and the index is worth keeping as a checklist
    finding: >-
      Four tables list the complete spell selection for clerics, druids, magic-users and
      illusionists by spell level, roughly 250 entries in total.
    why_it_matters: >-
      Not extracted, but directly useful to whoever extracts the spell chapters. It is an
      independent completeness check of exactly the kind OBS-04 proposed for the table
      index, and a stronger one, because it enumerates every spell rather than every
      table. A spell chapter that describes a spell absent from these tables, or omits one
      present in them, is worth a second look.
    caveat: >-
      Subject to OBS-19. The printed apparatus of this book is known to contain at least
      one error, so this index is a cross-check and not an authority.

  - id: OBS-38
    topic: area of effect now has a proper locus, and OBS-35 can be answered
    finding: >-
      SPELL EXPLANATIONS establishes Area of Effect as a standard field of every spell
      entry, defined as how large an area the spell covers or how many creatures it
      affects.
    why_it_matters: >-
      OBS-35 of the hirelings packet reported that the emphatic page 39 prohibition on
      applying outdoor scale to spell area of effect could not be recorded, because no
      canonical node represents area of effect, and recommended revisiting when this
      packet was reached. This is that point. The concept is a named, formally defined
      field of every spell in the book, which is a far stronger basis for a node than a
      distance-scale paragraph would have been.
    recommendation: >-
      Architect to consider a node for spell area of effect. It would let the page 39
      prohibition be recorded as EXCLUDED_FROM, and the spell chapters will very likely
      want it regardless. The Analyst does not propose it here, because no edge in this
      packet needs it and proposing a node from a formatting section is only marginally
      better than proposing one from a distance paragraph. It should be proposed from a
      spell packet, where it does load-bearing work.

  - id: OBS-39
    topic: clerical and magical spell acquisition differ in a way the graph should keep
    finding: >-
      Clerical spells are bestowed by a deity through prayer, with the highest levels
      granted only by the deity directly and subject to judgement of the cleric's
      faithfulness. Magical spells are memorised from spell books the caster maintains.
      Material components are supplied by the caster in both cases and are never bestowed.
    why_it_matters: >-
      A3 and A5 record the two halves and are the reason this packet is not simply
      redundant with packet 05. Packet 05 established which classes may use spells; this
      page establishes that they acquire them by two different routes with two different
      failure modes, one social and one logistical. A change to spell books affects
      magic-users only; a change to alignment enforcement affects clerics only.

