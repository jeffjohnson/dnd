completeness_statement: >-
  All 125 lines were read, including all four spell tables in full. The packet was
  delivered without page markers and the Analyst declined to extract from it on that
  basis; the operator supplied markers for pages 40 to 42 and extraction proceeded against
  them. Every edge carries a book, page and section citation and an evidence class, no
  magnitude reached any aspect or condition field, and authored polarity appears once, on
  the single CONSTRAINS edge. The edge set contains no duplicate source, type and target
  triple and no self-loop.

  Six edges is a small yield from three pages, and the reason is a deliberate grain
  decision rather than a thin reading. The spell tables are an index to material described
  in full in the chapters that follow, and extracting them would mint up to 250 spell
  identities ahead of the mechanics that justify them. That decision is recorded together
  with the test that would reverse it, and the test was run against the following packet
  before the decision was taken.

