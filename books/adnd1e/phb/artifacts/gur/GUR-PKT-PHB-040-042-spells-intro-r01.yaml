# =============================================================================
# HEADLINE RESULT: 6 candidate edges. 0 candidate nodes. 0 escalations.
#
# The four spell tables, listing roughly 250 spells by class and spell level,
# are deliberately not extracted. That decision is the substance of this GUR
# and is argued in grain_decisions. All six edges come from the prose
# introduction on page 40.
# =============================================================================

source_summary: >-
  Pages 40 to 42. CHARACTER SPELLS, explaining verbal, somatic and material components,
  how clerical spells are bestowed by a deity while magical ones are memorised from spell
  books, that memorisation takes time and a rested mind, and that a cast spell is
  forgotten entirely. Then four large tables listing the spells available to clerics,
  druids, magic-users and illusionists by spell level. Finally SPELL EXPLANATIONS,
  describing the format used for every spell entry in the chapters that follow.

node_id_resolution_method: >-
  No slice supplied. All six edges resolved onto existing canonical IDs by targeted
  registry lookup. No candidate node was needed.

grain_decisions:
  - decision: >-
      The four spell tables are not extracted. No spell node is referenced and no
      spell-to-class or spell-to-level edge is proposed from them.
    reasoning: >-
      Three reasons, the third decisive. Precedent: OBS-04 of the preamble GUR rejected
      the book's own table index on the grounds that naming a table is not asserting a
      relationship, and these tables name spells the same way. Grain: what the tables add
      beyond the name is the spell's level, which is a magnitude. Locus: every spell in
      these tables is described individually in the chapters that follow, and each
      description carries its own Level line together with range, duration, area of
      effect, components, casting time and saving throw. That is where a spell's identity
      and its mechanics are both established. Extracting the index first would mint up to
      250 node identities ahead of the mechanics that justify them, against a registry
      where duplicate identity is already the subject of two open escalations.
    what_would_reverse_it: >-
      If the spell chapters did not restate a spell's level, the tables would be the
      authoritative locus and would have to be extracted. That is a test, and it has been
      run: the cleric spell packet opens with entries carrying an explicit Level line,
      confirmed by inspection before this decision was taken.

