    basis: C4, C5, C6

domain_boundary_questions:
  - id: DBQ-02
    question: >-
      Is class_eligibility a domain, or is it the shadow of a table that belongs to the
      class and race domains? Thirty of the 84 edges in this packet are ability-to-class
      eligibility assertions drawn from the General Information column of six tables.
    why_it_matters: >-
      If it is a domain it will be one of the largest in the graph and almost entirely
      sourced from two packets. If it is not, those thirty edges distribute into whatever
      domain owns character classes.
    analyst_position: no recommendation

