rejected_candidates:
  - text_locus: "CHARACTER ABILITIES, p9"
    quoted_gist: the range of these abilities is between 3 and 18
    rejection_reason: >-
      A bound expressed purely as magnitudes. The grain rule forbids storing it. See
      OBS-08, where it is recorded as a source tension rather than an edge.

  - text_locus: "CHARACTER ABILITIES, p9"
    quoted_gist: >-
      it is usually essential to survival to be exceptional in no fewer than two
      abilities
    rejection_reason: >-
      Advice about character viability, not a rule. Nothing consults it.

  - text_locus: "CHARACTER ABILITIES, p9"
    quoted_gist: the referee has several generation methods suggested in the DMG
    why_considered: >-
      canonical nodes rule_generation_method_i through v exist, so the graph already
      models the methods
    rejection_reason: >-
      The PHB points at the DMG without naming a method. A CROSS_REFERENCES edge needs a
      target node and there is no node for the DMG as a document. The dependency that
      matters, that scores come from a generation procedure, is carried by G1. Recorded
      as OBS-10 because it bears on book scope.

  - text_locus: "STRENGTH TABLE I, p9; and the other five General Information columns"
    quoted_gist: minimum and maximum ability scores for each race
    why_considered: >-
      stated plainly in this packet, six times over, and unquestionably load-bearing
    rejection_reason: >-
      Deliberately deferred, not discarded. The table of contents places CHARACTER RACE
      TABLE III: ABILITY SCORE MINIMUMS & MAXIMUMS on page 15, inside packet 04, which is
      the authoritative and complete statement of the same facts. Extracting the racial
      dimension from both packets would produce a duplicate edge set differing only in
      citation. The sex dimension is NOT deferred, because it is not obviously carried by
      Table III and because it resolves an open question from a previous packet; it is
      extracted as S15. See OBS-07.

  - text_locus: "Notes Regarding Dexterity Table II, p12"
    quoted_gist: >-
      the table adjusts five thief functions and is silent on climbing walls, hearing
      noise, back stabbing, reading languages and using scrolls
    why_considered: >-
      an EXCLUDED_FROM edge asserting dexterity is not an input to the other five skills
    rejection_reason: >-
      Constitution 4.1 is explicit that the infinite set of things a rule simply does not
      touch must not be recorded. The table's silence is not a denial. Had the text said
      dexterity does not affect climbing, that would be an edge.

  - text_locus: "Notes Regarding Constitution Table, p12"
    quoted_gist: subtraction can never reduce any hit die below one
    rejection_reason: >-
      A floor expressed as a magnitude. The relationship that constitution modifies hit
      points is C1; the floor is a value on that relationship and the grain rule excludes
      it.

  - text_locus: "Charisma, p13"
    quoted_gist: >-
      the half-orc and dwarf charisma maxima apply only with respect to other races
    why_considered: a genuine conditional racial cap
    rejection_reason: >-
      Deferred to packet 04 with the rest of the racial minimum and maximum material, for
      the same reason. The footnotes themselves point the reader at CHARACTER RACES.

# -----------------------------------------------------------------------------
non_edge_observations:
  - id: OBS-07
    topic: the packet resolves an open question from GUR-PKT-PHB-007-008-intro-r01
    locus: "STRENGTH TABLE I, p9"
    finding: >-
      Strength Table I sets maximum strength by sex as well as by race across seven rows,
      distinguishing female halfling, female gnome, female elf, female dwarf, female
      half-elf, male halfling, female human, male gnome, male elf, female half-orc, male
      half-elf, male dwarf and male half-orc.
    why_it_matters: >-
      Edge E7 of the previous GUR asserted rule_sex EXCLUDED_FROM sys_ability_scores on
      the strength of the page 7 statement that sex makes no difference to ability, and
      recorded its hedge, "in all but a few cases", as unresolved with the exceptions
      unnamed. The exceptions are named two pages later and they are precisely maximum
      strength by race. E7 and S15 are therefore both true and are not in contradiction,
      but E7's condition field is now demonstrably imprecise: it says "except in a few
      unstated cases" when the case is stated.
    consequence_for_prior_artifact: >-
      GUR-PKT-PHB-007-008-intro-r01 should be superseded by an r02 that amends E7's
      condition and cross-references S15. This GUR does not amend it; a GUR may not edit
      another packet's artifact.
    also_relevant: >-
      IDQ-03 of that GUR anticipated a conflict with Unearthed Arcana over sex-linked
      ability treatment. That question is now sharper rather than resolved: the PHB
      itself, in this printing, already carries sex-linked maxima, so a UA assertion may
      be a restatement or an extension rather than an override.

  - id: OBS-08
    topic: the stated ability range does not cover the tables
    locus: "CHARACTER ABILITIES p9, against INTELLIGENCE TABLE II p10"
    finding: >-
      The opening paragraph states the range of abilities is between 3 and 18.
      Intelligence Table II carries a row for a score of 19 or more.
    why_it_matters: >-
      Not a defect in the transcription; both statements are in the book. It means the
      declared range describes generated scores while tables anticipate scores raised
      beyond it by other means. Any future edge or validator that treats 18 as a hard
      ceiling on ability scores would be wrong.
    recommendation: >-
      Worth remembering when the race packet supplies racial maxima and when magical
      ability increases are extracted. No action now.

  - id: OBS-09
    topic: this packet establishes a general rule already in the register
    locus: "Notes Regarding Constitution Table, p12"
    finding: >-
      registries/general_rules.json records GR_IMPOSED_FORM_CHANGE_SYSTEM_SHOCK with
      established_by "PHB p.12 CONSTITUTION TABLE". That is the System Shock Survival
      note in this packet, which names aging, petrification including flesh to stone,
      polymorph any object and polymorph others as the attack forms requiring the check.
    why_it_matters: >-
      Constitution 7.1 distinguishes the edge that establishes a general rule from edges
      derived under it, and requires the establishing edge to carry an EMPTY
      general_rule_id. Edges C12 through C16 are establishing edges and carry an empty
      general_rule_id and pass=page-sweep, not pass=general-rule. A Builder that
      pattern-matches these onto the general rule and stamps the ID on them would violate
      invariant 19.
    recommendation: >-
      Reviewer should confirm C12 through C16 against the register rather than assume
      they are derived edges. The register's applies_to list also names rule_lycanthropy
      and a polymorphing wand, which this packet does not mention; those are derived
      edges belonging to other packets.

  - id: OBS-10
    topic: ability generation procedure is out of scope for this book
    locus: "CHARACTER ABILITIES, p9"
    finding: >-
      The PHB states that the referee has several methods of random generation available,
      described in the Dungeon Masters Guide, and that the DM will tell the player which
      to use.
    why_it_matters: >-
      The canonical nodes rule_generation_method_i through rule_generation_method_v exist
      and must be sourced from the DMG, not from this book. This is the second instance
      of the pattern recorded as OBS-02 in the preamble GUR: PHB silence is an editorial
      scope decision. Here the book says so outright.
    recommendation: none; recorded so a later analyst does not try to source the methods from the PHB

  - id: OBS-11
    topic: transcription defects in the source file
    locus: multiple
    finding: >-
      Three defects were found while reading, none of which changed an extraction
      outcome. Line 121-122 carries a doubled heading, "### WISDOM TABLE I" immediately
      followed by "## Wisdom Table I", at two different heading levels. Line 237 reads
      "raised from the deadwresurrected", which should almost certainly be "dead or
      resurrected" or "dead/resurrected". Line 205 of the Dexterity Table II grid spans a
      header cell across the table in a way that does not parse as a normal column.
    why_it_matters: >-
      Per ESCALATION_CONTRACT these are typos correctable without changing identity, so
      they are not escalated. They are reported because the operator is transcribing by
      hand and would want them.
    recommendation: operator correction in the source file; no artifact depends on them

  - id: OBS-12
    topic: registry data defect noticed in passing
    locus: rulesets/adnd1e/registries/nodes.csv
    finding: >-
      The node spell_petrification carries the literal string "spell_petrification" as
      its label rather than a human label such as "Petrification".
    why_it_matters: >-
      Not used by any edge in this packet. Reported because the Analyst was reading the
      registry closely and it is the kind of defect that survives indefinitely once
      nobody is looking.
    recommendation: registry hygiene, Architect or Integrator

# -----------------------------------------------------------------------------
unresolved_identity_questions:
  - id: IDQ-04
    question: >-
      Should dexterity's effects hang off the intermediate nodes dex_reaction_adj and
      dex_defensive_adj, as edges D1 through D6 assume, or directly off abil_dexterity?
    bearing: D1 through D7
    analyst_handling: >-
      Used the intermediate nodes because they exist canonically with degree 6 and 16
      respectively, which means the graph already models dexterity this way, and because
      Dexterity Table I genuinely has two separately named adjustment columns. But D7
      hangs initiative directly off abil_dexterity, because the initiative claim comes
      from the section prose rather than from a named column. That inconsistency is real
      and is flagged rather than smoothed over.

  - id: IDQ-05
    question: >-
      Charisma's table columns are modelled inconsistently with dexterity's. Dexterity's
      columns are dex_ nodes; charisma's are abil_cha_ nodes; and for two of the three
      charisma columns a second, better connected node exists elsewhere in the graph.
    bearing: H1, H2, H3
    analyst_handling: >-
      Chose the better connected node where the choice was clear, hench_loyalty at degree
      42 over abil_cha_loyalty_base at degree 1 for H2, and cbt_encounter_reactions at
      degree 45 over abil_cha_reaction_adj at degree 1 for H3. For H1 the choice was not
      clear, abil_cha_max_henchmen at degree 3 against hench_max_number at degree 1, and
      the higher was taken. All three choices are declared rather than silent. This
      question is subsumed by ESC-2026-07-30T01.21.13.768Z.

# -----------------------------------------------------------------------------
architectural_escalations:
  - id: ESC-2026-07-30T01.21.13.768Z
    trigger: >-
      ESCALATION_CONTRACT — "two canonical nodes appear ontologically equivalent and
      merging them could affect existing edges"
    originating: PKT-PHB-009-013-ability-scores / GUR-PKT-PHB-009-013-ability-scores-r01
    question: >-
      Two pairs of canonical nodes carry the same label and appear to denote the same
      mechanic. Should they be merged, and if so which ID survives?
    affected_canonical_ids:
      - pair: Loyalty Base
        ids: [abil_cha_loyalty_base, hench_loyalty]
        degrees: [1, 42]
      - pair: Maximum Henchmen
        ids: [abil_cha_max_henchmen, hench_max_number]
        degrees: [3, 1]
    source_excerpt: >-
      CHARISMA TABLE, PHB p13, columns "Maximum No. of Henchmen" and "Loyalty Base", with
      the notes stating that the former is the number of non-player characters who serve
      as permanent retainers and the latter is the adjustment to henchmen's loyalty
      scores.
    local_neighborhood: >-
      Not available. No local_neighborhood.json was supplied with the packet, so the
      Analyst can report degrees from the registry but cannot show the incident edges.
      This escalation is therefore incomplete against the ESCALATION_CONTRACT package
      requirements and should be completed by whoever holds the graph.
    options_considered:
      - merge into the hench_ node in both cases, on the grounds that the mechanic
        belongs to the henchman subsystem and charisma is merely its input
      - merge into the abil_cha_ node in both cases, on the grounds that these are
        columns of the Charisma Table
      - keep both and relate them by DERIVED_FROM, if they are genuinely at different
        grain
    recommended_resolution: >-
      Merge Loyalty Base into hench_loyalty, which carries 42 edges against 1. For
      Maximum Henchmen the Analyst does not recommend a direction; both nodes are nearly
      unused and the choice should follow whatever convention the Architect sets for the
      first pair.
    expected_migration_impact: >-
      Rewrites the endpoint on up to 43 existing edges for the first pair and 4 for the
      second. Invariant 12 forbids duplicate edge identity, so a merge may also collapse
      edges that become identical.
    would_change: registry, and the canonical graph via Integrator migration
    blocking: >-
      Not blocking for this GUR. H1 and H2 are proposed against a declared choice, and if
      the Architect rules the other way the fix is a single endpoint substitution.

  - id: ESC-2026-0002
    trigger: >-
      ESCALATION_CONTRACT — "the constitution and production data disagree in a way that
      cannot be fixed mechanically"
    originating: PKT-PHB-009-013-ability-scores / GUR-PKT-PHB-009-013-ability-scores-r01
    question: >-
      Five nodes this packet must reference use prefixes that constitution 3.1 does not
      list. Should the constitution be extended, or should the nodes be migrated to
      approved prefixes?
    affected_canonical_ids:
      - str_exceptional
      - str_open_doors
      - str_bend_bars
      - dex_reaction_adj
      - dex_defensive_adj
    wider_finding: >-
      A prefix census over the whole registry finds 23 nodes across 12 unapproved
      prefixes: wpn_ 7, str_ 3, death_ 2, dex_ 2, magic_ 2, and one each of align_,
      comeliness_, cursed_, fatigue_, time_, training_, turn_. The node "comeliness"
      additionally carries no prefix at all.
    source_excerpt: >-
      STRENGTH TABLE II: ABILITY ADJUSTMENTS, PHB p9, columns "Open Doors On A" and "Bend
      Bars/Lift Gates"; and DEXTERITY TABLE I, PHB p11, columns "Reaction/Attacking
      Adjustment" and "Defensive Adjustment".
    options_considered:
      - extend constitution 3.1 to approve the prefixes already in production use
      - migrate the 23 nodes to approved prefixes, for example str_bend_bars to
        rule_bend_bars or abil_str_bend_bars
      - approve some and migrate others
    recommended_resolution: >-
      The Analyst recommends extending the constitution rather than migrating, on one
      specific piece of evidence: the constitution's own worked examples use turn_undead
      in section 6.2 and str_bend_bars in section 4.1, both under prefixes section 3.1
      does not approve. The document contradicts itself, which suggests the prefix list
      is incomplete rather than the data being wrong. This is a recommendation only.
    expected_migration_impact: >-
      Extending the constitution has no data impact. Migrating touches 23 nodes and every
      edge incident to them, which an independent Integrator precondition audit dated
      2026-07-27 measured at 379 edge rows.
    would_change: the constitution, and on the migration option the registry and graph
    prior_art: >-
      This is not a new discovery. rulesets/adnd1e/reports/PRECONDITION-AUDIT-20260727.md,
      produced by an Integrator session, records the same 379 rows and the same
      self-contradiction. It is escalated here because this packet is the first to
      require the nodes for new work, which changes it from an audit finding into a
      blocker on extraction.
    blocking: >-
      Not blocking. The Analyst reused the existing IDs, per the instruction to reuse
      canonical IDs rather than mint variants. Minting abil_str_bend_bars alongside
      str_bend_bars would have created exactly the drift constitution 3.2 names as the
      most common defect in the graph.

