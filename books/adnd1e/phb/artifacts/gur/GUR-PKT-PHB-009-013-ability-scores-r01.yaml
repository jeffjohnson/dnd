# =============================================================================
# HEADLINE RESULT
# =============================================================================
# 84 candidate edges. 2 candidate nodes. 2 architectural escalations.
#
# Three things a reader should not miss:
#
#  1. STRENGTH TABLE I contains sex-differentiated maximum strength by race.
#     This directly bears on edge E7 of GUR-PKT-PHB-007-008-intro-r01, which
#     recorded the p7 claim that sex makes no difference to ability "in all but
#     a few cases" and flagged the exceptions as unstated. They are stated here.
#     See OBS-07. That GUR needs a revision; this one does not resolve it.
#
#  2. This packet is the establishing source for a general rule already in the
#     register. general_rules.json records GR_IMPOSED_FORM_CHANGE_SYSTEM_SHOCK
#     as established_by "PHB p.12 CONSTITUTION TABLE", which is edges C12-C16
#     below. Per constitution 7.1 an establishing edge carries an EMPTY
#     general_rule_id. They do. See OBS-09.
#
#  3. Node identity in this region of the graph is damaged. Two duplicate-identity
#     pairs and five nodes under prefixes the constitution does not approve sit
#     directly in this packet's extraction path. Both are escalated, not worked
#     around silently. See ESC-2026-07-30T01.21.13.768Z and ESC-2026-0002.
# =============================================================================

source_summary: >-
  Pages 9 through 13, the CHARACTER ABILITIES section in full. An opening paragraph
  establishing that every character has six abilities, that their range is 3 to 18, and
  that scores are produced by random generation whose methods live in the Dungeon
  Masters Guide. Then each ability in turn — Strength, Intelligence, Wisdom, Dexterity,
  Constitution, Charisma — with its explanatory prose, its tables, and notes on the
  tables. Ten tables in all. This is the densest mechanical text in the book so far and
  the first packet in which the ability scores connect outward to combat, saving throws,
  thief function, hit points, henchmen and spell acquisition.

node_id_resolution_method: >-
  No node_registry_slice.csv was supplied. The Analyst resolved every concept by
  targeted lookup against rulesets/adnd1e/registries/nodes.csv, then ran two structural
  scans over the registry: a duplicate-label scan and a prefix census against
  constitution 3.1. Both scans returned findings that bear directly on this packet and
  are escalated below. 82 of the 84 edges resolved onto existing canonical IDs. Two
  concepts had no canonical node and are proposed as candidates rather than forced onto
  an approximate existing ID.

reused_nodes_note: >-
  Every node referenced below other than the two candidates is an existing canonical ID
  taken verbatim from the registry, including its label. Labels were copied
  programmatically from nodes.csv so that no label can drift from its ID in this
  artifact.

candidate_nodes:
  - proposed_id: rule_prime_requisite
    proposed_label: Prime Requisite Experience Bonus
    prefix: rule_
    prefix_is_approved: true
    why_needed: >-
      The packet states four times, once each for Strength, Intelligence, Wisdom and
      Dexterity, that a character whose prime requisite is high gains a bonus to earned
      experience. The registry has no node for this mechanic. rule_xp_division exists but
      concerns dividing awards among a party, which is a different thing. Forcing these
      four edges onto exp_level or onto the xp_ award-source nodes would misstate what
      the rule does.
    edges_depending_on_it: [S14, I11, W8, D19]
    analyst_position: >-
      Proposed under an existing approved prefix, so no new prefix is requested. If the
      Architect rejects the node, the four edges should be rejected with it rather than
      redirected, because no existing node carries this meaning.

  - proposed_id: rule_revivification_limit
    proposed_label: Lifetime Revivification Limit
    prefix: rule_
    prefix_is_approved: true
    why_needed: >-
      The Constitution section describes two distinct mechanics that a single node would
      conflate. rule_resurrection_survival, which exists, is the percentage roll made on
      each attempt. The packet separately establishes that a character's initial
      constitution score is a hard lifetime cap on how many times revivification may be
      attempted at all, that each success permanently reduces the score, and that later
      magical restoration of the score does not restore the cap. That is a resource
      ceiling, not a survival roll.
    edges_depending_on_it: [C5]
    analyst_position: >-
      Proposed because collapsing it into rule_resurrection_survival would make the
      graph unable to answer "what breaks if resurrection survival changes" separately
      from "what breaks if the revivification cap changes". They are independently
      changeable.

