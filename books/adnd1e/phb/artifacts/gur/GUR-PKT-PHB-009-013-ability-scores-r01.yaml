blocking_notes:
  - id: BLK-01
    severity: unchanged
    issue: domain_registry.yaml remains an empty map at status bootstrap.
    consequence: >-
      Eight candidate domains recorded from this packet alone, against zero promoted
      domains. The batch the Architect will eventually face keeps growing.
    owner: architect

  - id: BLK-02
    severity: severe_here
    issue: no node_registry_slice.csv and no local_neighborhood.json supplied.
    consequence: >-
      84 edges proposed against a graph the Analyst cannot see. abil_strength carries 51
      existing edges, abil_dexterity 40, abil_intelligence 44, rule_hit_points 63,
      cbt_tohit 48. A substantial fraction of this packet is likely already in the graph.
      The Analyst can state what the page says but cannot state what is new. Both
      escalations above are also incomplete for the same reason: ESCALATION_CONTRACT
      requires a local graph neighborhood in the package and none can be supplied.
    owner: packet_creator
    recommendation: >-
      For packets 04 and 05, which cover races and classes and will touch the same
      high-degree nodes even harder, a neighborhood slice would materially raise the
      quality of the result and shrink the Reviewer's dedupe burden.

# -----------------------------------------------------------------------------
completeness_statement: >-
  All 304 lines were read before extraction. Every one of the ten tables was worked
  through row by row, and both the explanatory prose and the notes beneath each table
  were considered separately, since in several cases the notes carry relationships the
  table does not, as with the fighter-only constitution bonus and the cleric bonus spell
  availability rule. All five page markers were classified as end-of-line and the
  resulting page split was checked against the table of contents transcribed in packet
  01, which places Strength at 9, Intelligence at 10, Wisdom and Dexterity at 11,
  Constitution at 12 and Charisma at 13. Every boundary agrees.

  84 candidate edges are proposed and seven candidate groups are recorded as rejected
  with reasons, one of which, the racial ability minimums and maximums, is a deliberate
  deferral to packet 04 rather than a judgment that the material is not load-bearing.
  That deferral is the single largest discretionary decision in this GUR and is the
  first thing a Reviewer should check.

  Two candidate nodes are proposed, both under existing approved prefixes, and both with
  the edges that depend on them named so they can be rejected together if the node is
  rejected. No new prefix is requested. Every other node reference is an existing
  canonical ID with its label copied programmatically from the registry.

  Authored polarity appears on exactly the three permitted edge types and nowhere else.
  Of the 84 edges, 46 are MODIFIES, TRIGGERS or CONSTRAINS and carry polarity with
  polarity_basis "read"; the remaining 38 carry no polarity field at all and are left to
  the build. The authored values are 31 improves, 9 worsens and 6 inflicts. No magnitude, die expression, percentage or threshold appears in any aspect
  or condition, which required care in this packet: the source is almost entirely
  numbers, and the relationships had to be lifted off them.

  Two architectural escalations are raised. Neither blocks this GUR. Both are incomplete
  against the ESCALATION_CONTRACT package requirements in exactly one respect, the local
  graph neighborhood, which the Analyst was not given.

  This GUR is complete enough for the Builder to normalize without rereading the source,
  with the same qualification as the previous packet and more force behind it:
  deduplication against the canonical graph is mandatory, not optional, and the Analyst
  could not perform it.

