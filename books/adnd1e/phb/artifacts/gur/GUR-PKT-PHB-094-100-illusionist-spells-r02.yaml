source_summary: 'PHB 94 to 100, the complete illusionist spell chapter and the last spell chapter in the
  book. A two-paragraph preamble, Notes Regarding Illusionist (Magic-User) Spells, then 66 entries across
  seven levels: twelve at each of the first three, eight at each of the fourth, fifth and sixth, and six
  at seventh. The final seventh level entry, First Level Magic-User Spells, is not a spell but a granted-access
  rule; see OBS-01.'
node_id_resolution_method: No registry slice was supplied. Spell headings were cleaned of school parentheticals
  and a trailing Reversible, slugged, and looked up by ID and by label in the registry and canonical nodes_master.
  Non-spell endpoints were resolved by direct search of the same two files.
grain_decisions:
- decision: An entry that says it is the same as a magic-user or cleric spell of the same name yields
    no cross-spell edge.
  basis: Constitution 3 and GRAPH_INVARIANTS 4. One concept is one node, and the stated differences are
    range, duration and area magnitudes that the grain rule removes.
  how_applied: 'This chapter is unusually reference-heavy: 27 of the 66 entries are wholly or almost wholly
    defined by reference to another class''s spell of the same name, and contribute only a level-scaling
    edge if the entry states one. Where the reference is to a differently named spell, or the entry adds
    a mechanical difference of its own, an edge is recorded.'
- decision: exp_level GATES rather than MODIFIES on the First Level Magic-User Spells entry.
  basis: 'Constitution 6.2. The test is whether the class alone permits the thing at any level. It does
    not: the entry withholds these spells until a stated experience level, after which further levels
    add more.'
  how_applied: Both edges are recorded, a GATES for the threshold and a MODIFIES improving the number
    gained, which is the pattern 6.2 prescribes for scribing scrolls and reading languages.
- decision: No magnitude, die expression, percentage or threshold appears in any aspect or condition.
  basis: Constitution 2 and GRAPH_INVARIANTS 11.
  how_applied: Verified programmatically before publication.
