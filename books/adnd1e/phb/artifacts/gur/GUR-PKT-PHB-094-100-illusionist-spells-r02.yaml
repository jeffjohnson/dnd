unresolved_identity_questions:
- id: IDQ-01
  subject: spell_first_level_magic_user_spells is a granted-access rule, not a spell
  question: The final seventh level entry has a full stat block whose every field is an asterisk footnoted
    'as appropriate to the spell in question', and its description is a list of twenty first level magic-user
    spells the illusionist gains at and after a stated level. The spell_ prefix is proposed because the
    book prints it as a spell entry and the spell index lists it as one.
  analyst_position: Mint under spell_ with a category-specific plural stem, which constitution 3.1 allows
    for a source-named spell family. A rule_ prefix is arguably more honest about what it is. Flagged
    rather than decided because the prefix is an Architect matter.
  affects:
  - M076
  - M077
  - M078
  - M079
- id: IDQ-02
  subject: the illusionist Darkness versus the magic-user Darkness, 15 foot Radius
  question: This packet names a first level illusionist spell 'Darkness'; canonical already holds spell_darkness.
    GUR-PKT-PHB-064-079-magic-user-spells-1-4-r01 proposed spell_darkness_15_radius for the separately
    named second level magic-user spell, and this entry says it is otherwise the same as that spell.
  analyst_position: Reuse spell_darkness here and keep spell_darkness_15_radius separate, because the
    two are differently named in the source and have different areas, so folding them would merge two
    spells. The entry's own cross-reference makes the relationship close enough that an Architect should
    confirm.
  affects: []
architectural_escalations: []
non_edge_observations:
- id: OBS-01
  topic: the entry the spells-intro footnote pointed at is in this packet
  finding: 'PKT-PHB-040-042-spells-intro carries a seventh level illusionist table entry reading First
    Level Magic-User Spells and a footnote directing the reader to the description on page 100. That description
    is here: the illusionist gains four named first level magic-user spells at a stated experience level
    and one more per level after, chosen from a list of twenty.'
  why_it_matters: GUR-PKT-PHB-040-042-spells-intro-r01 extracted no edge from the spell tables, treating
    them as an index under OBS-37, and the footnote deferred the mechanic to a page outside that packet.
    This packet supplies it, so the access rule is now recorded from the locus that states it rather than
    from a cross-reference.
- id: OBS-02
  topic: the twenty named spells are recorded as a list, not as twenty edges
  finding: The entry names Affect Normal Fires, Burning Hands, Charm Person, Comprehend Languages, Enlarge,
    Erase, Feather Fall, Friends, Hold Portal, Magic Missile, Mending, Message, Nystul’s Magic Aura, Protection
    from Evil, Read Magic, Shield, Shocking Grasp, Sleep, Tenser’s Floating Disc and Unseen Servant.
  why_it_matters: Twenty membership edges would restate one list as twenty near-identical assertions.
    The list is preserved here for Builder and Reviewer instead, consistent with OBS-37's treatment of
    the spell tables as an index. If the Architect wants membership in the graph, this is the locus that
    states it.
- id: OBS-03
  topic: the chapter completes the index cross-check for every spell list in the book
  finding: The illusionist columns of the page 42 table list 12, 12, 12, 8, 8, 8 and 6 spells. This packet
    contains exactly those 66 names. The single textual difference is the fifth level entry the claimed
    index renders as 'Shadow Door Shadow' and this packet renders as 'Shadow Door'.
  why_it_matters: With the cleric, druid and both magic-user chapters, every spell list in the PHB now
    matches its index. On the one difference, SOURCE_MARKDOWN 1.3 makes the packet canonical, so 'Shadow
    Door' governs and the doubled word in the index is transcription drift.
- id: OBS-04
  topic: the preamble states a class-wide component rule that is hard to place
  finding: Illusionist spells typically need fewer material components than other classes', some have
    no verbal component, and vision is named as the exception requiring great material outlay.
  why_it_matters: Recorded as one MODIFIES edge from class_illusionist to spell_component_material. The
    no-verbal-component observation has no counterpart edge; spell_component_verbal exists, but the claim
    is about which entries omit it, which is a property of individual spells rather than a relationship
    between mechanics.
- id: OBS-ASPECT-02
  topic: revision 2 exists only to bring aspects within constitution 5
  finding: The Builder graded aspect_word_count as an error under DEC-2026-0029 and returned this packet.
    60 of this GUR's aspects ran to five words or more.
  why_it_matters: Each replacement names the facet the cited spell entry touches, re-derived from that
    entry in the claimed source rather than produced by shortening the previous string, as DEC-2026-0029
    requires. No edge was added, dropped or re-pointed; the set was re-checked against canonical and against
    itself with no collision.
  owner: analyst
blocking_notes:
- id: BLK-02
  note: No node_registry_slice.csv, local_neighborhood.json or general_rule_slice.json accompanied this
    packet.
  impact: Does not block this GUR.
completeness_statement: All 66 entries and both preamble paragraphs were read and considered. Coverage
  was verified against the book's own spell index and matches exactly at all seven levels. Every candidate
  edge carries a book, a packet-marker-derived printed page and a section. No aspect or condition contains
  a magnitude. Authored polarity appears only on MODIFIES, TRIGGERS and CONSTRAINS, always with basis
  read. Candidates were checked against canonical on the constitution 5.1 assertion key and on the source-type-target
  triple.
