revision_reason: DEC-2026-0019 directs the Analyst to read source and publish correction GURs for twenty
  canonical assertions whose authored polarity still carries basis unset or heuristic. 1 of them belong
  to this packet. The Decision permits exactly two edge fields to change, polarity and polarity_basis,
  and requires the resulting basis to be read.
what_this_revision_is_not:
  not_an_extraction_pass: No source is swept and no new relationship is proposed. Every candidate below
    reproduces a canonical row field for field and differs from it in polarity and polarity_basis only.
  candidate_edges_of_GUR-PKT-PHB-033-035-alignment-hp-languages-r03_are_not_reproposed: 'This revision
    carries none of the prior revision''s extraction candidates. That is deliberate and is not data loss:
    GUR-PKT-PHB-033-035-alignment-hp-languages-r03 remains the published extraction record for this packet
    and its candidates are already integrated or already dispositioned. Re-proposing them would make every
    one an exact assertion-key match against canonical, which the Builder raises as duplicate_assertion,
    and the resulting GUP would not be the polarity-only packet update DEC-2026-0019 step 2 asks for.'
  no_page_change: DEC-2026-0016 owns the page corrections that touch some of these rows. DEC-2026-0019
    prohibits combining the two scopes, so every page here is the value canonical carries today.
how_the_builder_should_compile_this: 'No new mechanism is needed. compiler.py already resolves an exact
  canonical match whose canonical basis is unset or heuristic against a patch row with basis read as an
  update with reason polarity_repair, changing only the build-owned fields. Every candidate here is shaped
  to hit that path exactly, which is why each reproduces its canonical row verbatim in the other sixteen
  fields: any difference would surface as differences_not_applied and muddy a cleanup that is meant to
  touch two fields.'
