  minting another ID. Edge F37 is unchanged in every field; only its target's status
  changes from proposed to canonical. Two observations are added, OBS-20 on a transient
  registry state and OBS-21 on a conflation the decision's migration scope does not cover.
  No edge is added, removed, retyped or recited.

r02_revision_reason: >-
  Both source defects reported in r01 were resolved and the escalation r01 raised has been
  filed as a standalone artifact. The operator corrected the final page marker to {#p18},
  so the six citations to page 18 now rest on a marker in the source rather than on
  Analyst inference. The operator also checked a physical copy of the book and confirms
  the printed table of contents is wrong about Half-Elves, which is on page 17 as
  marker-derived paging had it. No edge is added, removed, retyped or recited. OBS-18 is
  rewritten, OBS-19 is added on the newly known contents error, and the escalation now
  points at its filed location.
