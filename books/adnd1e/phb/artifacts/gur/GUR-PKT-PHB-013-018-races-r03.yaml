page_end: 18

# =============================================================================
# HEADLINE RESULT
# =============================================================================
# 136 candidate edges. 2 candidate nodes. 1 architectural escalation.
#
#  1. The packet 03 deferral is discharged and was correct. CHARACTER RACE
#     TABLE III is here and is the complete statement of racial ability
#     minimums and maximums. It also settles the question left open across two
#     prior GURs: sex differentiates exactly one ability, strength maximum, and
#     nothing else. See OBS-13.
#
#  2. Table III also resolves OBS-08 from packet 03. Racial maxima of 19 exist,
#     and the notes say outright that some races exceed the 18 obtainable from
#     three six-sided dice. The declared 3 to 18 range bounds generation, not
#     scores.
#
#  3. race_human is now canonical. Raised in r01, escalated as ESC-2026-0003,
#     approved by DEC-2026-0001, and present in the registry. It is a reused
#     node in this revision, not a candidate.
#
#  4. Both page-marker defects r01 reported are now fixed at source, and both
#     of r01's readings proved correct. See OBS-18. The printed table of
#     contents is now known to carry an error; see OBS-19.
#
#  5. ESC-2026-0003 is filed at
#     rulesets/adnd1e/escalations/pending/ESC-2026-0003.yaml.
# =============================================================================

source_summary: >-
  Pages 13 through 18, the CHARACTER RACES section in full. An opening paragraph fixing
  the seven playable racial stocks. Three tables: class limitations by race, class level
  limitations by race with nine ability-linked footnotes, and ability score minimums and
  maximums by race and sex. A short table of racial ability penalties and bonuses. Then
  a descriptive section for each of the seven races carrying saving-throw bonuses,
  language limits, infravision, underground detection, combat adjustments, spell
  resistances and secret-door detection. Finally the RACIAL PREFERENCES table giving
  inter-racial attitudes.

node_id_resolution_method: >-
  No slice supplied. Resolved by targeted lookup against the canonical registry, as with
  packets 02 and 03. 134 of the 136 edges resolved onto existing canonical IDs. Two
  concepts had no node and are proposed as candidates. The generated edge block was
  checked for duplicate source, type and target triples before assembly; there are none,
  which matters here because invariant 12 forbids duplicate edge identity and this packet
  proposes many edges from the same six source nodes.

grain_decisions:
  - decision: >-
      Table I is recorded as 36 EXCLUDES edges, one per "no" cell, and none of the 34
      "yes" cells is recorded.
    reasoning: >-
      The table is a permission matrix and its information content is the denials. A
      "yes" cell records the absence of a restriction, which is the default state and
      not an assertion. Constitution 4.1 permits EXCLUDES where the text denies a
      dependency a reader would otherwise assume, and an explicit "no" in a printed
      matrix is exactly that, not the untouched silence 4.1 warns against.
  - decision: >-
      Table II is recorded as one CONSTRAINS edge per race rather than one per race and
      class pair, of which there would be 22.
    reasoning: >-
      The per-class detail in Table II is entirely level numbers, which the grain rule
      excludes. What survives the grain rule is that the race caps level attainment and
      that the cap varies by class, which is one relationship per race. The nine
      footnotes carry something the table does not, that an ability score raises the cap,
      and those are recorded separately as B7 through B9.
  - decision: >-
      Table III is split into two directions rather than recorded as one relationship
      per cell.
    reasoning: >-
      A minimum and a maximum are different mechanics pointing opposite ways. A minimum
      is an eligibility precondition, so it is recorded as the ability gating the race.
      A maximum is the race bounding the ability, so it is recorded in the other
      direction as CONSTRAINS. Cells that constrain nothing are not recorded: a minimum
      of 3 is the floor of the dice range and a maximum of 18 is its ceiling, so neither
      asserts anything. That reduces 72 cells to 18 gates and 16 constraints.

# race_human was a candidate node in r01 and r02. DEC-2026-0001 approved it and the
# registry row "race_human,Human,race,0," is present, so it is canonical here.
resolved_candidate_nodes:
  - id: race_human
    label: Human
    resolved_by: DEC-2026-0001
    escalation: ESC-2026-0003
    now: canonical
    edges_using_it: [F37]
    verification: >-
      The Analyst re-ran the six acceptance tests stated in DEC-2026-0001 against the
      repository. All pass. The registry holds exactly one race_human row with label
      Human, kind race, degree zero and no authored roles; there are no duplicate IDs;
      race_any is still present as the generic Race node; and edges_master.csv still holds
      3,809 rows, so no canonical edge was changed by the decision.

candidate_nodes:
  - proposed_id: rule_racial_detection
    proposed_label: Racial Underground Detection
    prefix: rule_
    prefix_is_approved: true
    why_needed: >-
      Dwarves, gnomes and halflings each have a table of underground detection abilities:
      slope, new construction, shifting walls, stonework traps, unsafe surfaces, depth
      and direction. No canonical node covers them. The nearest candidates in the
      registry, campaign_construction and rule_depth, mean unrelated things, the latter
      being water depth.
    edges_depending_on_it: [F6, F20, F31]
    analyst_position: >-
      Proposed as one node covering the shared mechanic rather than three per-race nodes,
      because the three tables differ only in which phenomena and what percentages, and
      percentages are outside the grain. If the Architect prefers per-race identity the
      three edges split cleanly.

