candidate_general_rules: []
candidate_general_rules_note: >-
  None proposed. The constitution-scaled saving throw bonus shared by dwarves, gnomes and
  halflings looks like a general rule and may become one, but all three races state it
  outright in their own descriptions, so every edge here is an explicit rule with an
  empty general_rule_id and nothing is inherited. Flagged as OBS-16 for the Architect
  rather than proposed, because a general rule that saves three explicit statements
  earns little.

domains_touched: []
domains_touched_note: BLK-01 unchanged; the domain registry is still an empty map.

candidate_domains:
  - name: character_races
    basis: the whole packet
  - name: class_eligibility
    basis: the 36 EXCLUDES edges of section A, joining the 30 eligibility edges from packet 03
  - name: level_advancement
    basis: B1 through B10, G7
  - name: saving_throws
    basis: the racial saving throw bonuses in section F
  - name: languages
    basis: the six racial language edges in section F
  - name: exploration_senses
    basis: infravision, secret door detection and underground detection edges

domain_boundary_questions:
  - id: DBQ-03
    question: >-
      class_eligibility now draws from two packets and two unrelated table families, the
      ability tables of packet 03 and the race tables here. Is it one domain or two?
    why_it_matters: >-
      66 edges across the two packets assert who may be what. If that is a single domain
      it is already among the largest in the graph before classes have been read at all.
    analyst_position: no recommendation

rejected_candidates:
  - text_locus: "CHARACTER RACE TABLE I, p13"
    quoted_gist: the 34 cells reading "yes"
    rejection_reason: >-
      A "yes" records the absence of a restriction. Recording it would assert the default
      state, and 34 such edges would say only that nothing stands in the way. The
      denials carry the information and are recorded.

  - text_locus: "Notes Regarding Character Race Table I, p13"
    quoted_gist: >-
      the parenthetical letters after each class name give that class's permitted
      alignments
    why_considered: >-
      genuinely load-bearing, and sys_alignment exists canonically with degree 102
    rejection_reason: >-
      Deferred to packet 05, not discarded. This is a note explaining a legend on a race
      table; the alignment restrictions belong to the classes and the contents places
      ALIGNMENT on page 33 and the class sections from 18 onward. Recording them here
      would attach class-alignment edges to a citation about a race table. Recorded as
      OBS-15 so the deferral is visible and testable, exactly as the Table III deferral
      from packet 03 was.

  - text_locus: "Notes Regarding Character Race Table II, p14"
    quoted_gist: numbers in parentheses indicate the class exists only as non-player characters
    why_considered: >-
      a real restriction distinguishing player from non-player availability
    rejection_reason: >-
      A legend for reading the table rather than a relationship between mechanics. The
      restriction it describes is carried by the race-to-class edges already; what the
      parentheses add is a value judgment about who may play one, and there is no node
      for player versus non-player status. Worth revisiting if such a node appears.

  - text_locus: "CHARACTER RACE TABLE III, p15"
    quoted_gist: minimum scores of 3 and maximum scores of 18
    rejection_reason: >-
      Three is the floor of the generation range and 18 its ceiling, so neither bounds
      anything. Recording them would assert a constraint that constrains nothing. Only
      the 34 cells that actually bind are recorded.

  - text_locus: "Dwarves p15, Elves p16, Gnomes p16, Halflings p17, Half-Orcs p17"
    quoted_gist: the reader is referred to the MONSTER MANUAL for details of each race
    why_considered: >-
      an explicit cross-book pointer, and CROSS_REFERENCES is a legal edge type whose
      definition is text explicitly pointing elsewhere
    rejection_reason: >-
      There is no node for the Monster Manual as a document, and the monster_ nodes for
      these races, monster_dwarf and monster_elf, exist at degree 1 apiece and denote the
      creature entries rather than the book. Pointing a CROSS_REFERENCES edge at
      monster_dwarf would assert a mechanical relationship between the playable race and
      the bestiary entry, which is not what the sentence says. Recorded as OBS-17.

  - text_locus: "Humans, p17"
    quoted_gist: human is superior to the other races in general
    rejection_reason: >-
      Editorial comparison. The mechanical content, that humans take no adjustment and
      have no level ceiling, is recorded as F44 and as the absence of any human row in
      Table II.

non_edge_observations:
  - id: OBS-13
    topic: the packet 03 deferral is discharged, and the sex question is now closed
    locus: "CHARACTER RACE TABLE III and its notes, p15"
    finding: >-
      Table III gives minimum and maximum scores for all six abilities across the six
      non-human races, each cell in male/female form, and the notes explain the slash
      convention explicitly. Reading the maxima across all six abilities, male and female
      values are identical everywhere except strength. Strength maxima differ by sex for
      dwarven, elven, gnome, half-elven and halfling characters. Every other ability, and
      every minimum without exception, is the same for both sexes.
    why_it_matters: >-
      Three artifacts have now circled this. GUR-PKT-PHB-007-008-intro-r01 asserted from
      p7 that sex is not an input to ability scores, hedged as true "in all but a few
      cases", with the cases unnamed. r02 amended that condition after STRENGTH TABLE I
      on p9 named them. Table III now bounds the claim precisely and from the
      authoritative table: the exception is one ability, strength, and one direction,
      the maximum. E7 of that GUR is correct as amended and needs no further revision.
    consequence_for_prior_artifacts: none; r02 stands
    also: >-
      IDQ-03 of that GUR, on whether Unearthed Arcana would later conflict, is now
      well-posed rather than speculative. The PHB position is precise and narrow, so a
      UA assertion can be compared against it cell by cell.

  - id: OBS-14
    topic: OBS-08 from packet 03 is resolved by the source itself
    locus: "Notes Regarding Character Race Table III, p15"
    finding: >-
      The notes state that maximum scores include racial penalties and bonuses and that
      some races can therefore exceed the 18 total possible in the initial generation of
      abilities with three six-sided dice. Table III bears this out with dexterity 19 for
      elves and constitution 19 for dwarves, halflings and half-orcs.
    why_it_matters: >-
      Packet 03 recorded the tension between the declared 3 to 18 range on p9 and the "19
      or more" row in Intelligence Table II, and flagged that any validator treating 18
      as a hard ceiling would be wrong. The book now says so directly. The declared range
      describes what dice produce, not what a score may be.
    recommendation: >-
      If a validator is ever written for ability score bounds, this note is its citation.

  - id: OBS-15
    topic: class alignment restrictions are stated here but belong to packet 05
    locus: "Notes Regarding Character Race Table I, p13"
    finding: >-
      The legend gives each class's permitted alignments: any, neutral only, lawful good
      only, good only, any neutral to any evil, evil only, lawful only, plus the note that
      a cleric cannot be true neutral unless of the druid subclass.
    why_it_matters: >-
      This is a complete class-to-alignment restriction table hiding inside a note on a
      race table. It is load-bearing and sys_alignment carries degree 102. It is deferred
      to packet 05 on the same reasoning that deferred racial minimums from packet 03 to
      this packet, and that deferral proved correct.
    recommendation: >-
      Packet 05 should be checked for whether the class sections restate these. If they
      do not, the edges must be cited back to this note and this packet, and the deferral
      was wrong. Recording the test so it can be run.

  - id: OBS-16
    topic: a shared racial mechanic stated three times
    locus: "Dwarves p15, Gnomes p16, Halflings p17"
    finding: >-
      Dwarves, gnomes and halflings each independently state a saving throw bonus against
      wands, staves, rods and spells scaled at one point per three and a half points of
      constitution. Dwarves and halflings additionally extend the same bonus to poison
      saves; gnomes do not.
    why_it_matters: >-
      It has the shape of a general rule, but all three statements are explicit, so
      nothing would be inherited and every edge here carries an empty general_rule_id
      correctly. Recorded because the gnome exception is the interesting part: it bounds
      the rule, and constitution 7.1 requires a registered general rule to carry the
      counter-example that bounds it. If the Architect ever registers this, the gnome
      omission is that counter-example.
    recommendation: Architect may register; Analyst does not propose it.

  - id: OBS-17
    topic: repeated cross-book pointers with no target node
    locus: five race descriptions, p15 to p17
    finding: >-
      Five of the seven race descriptions refer the reader to the Monster Manual for
      details of the race.
    why_it_matters: >-
      CROSS_REFERENCES exists as an edge type for exactly this, but it needs a target
      node and none represents a book. This is the third instance of the pattern first
      recorded as OBS-02 and again as OBS-10: the PHB routinely points outside itself and
      the graph has no way to say so.
    recommendation: >-
      Architect decision on whether a book or document node kind is wanted. Until then
      these pointers are unrepresentable and are being dropped, which is a small, silent,
      repeated loss worth someone deciding about deliberately.

  - id: OBS-18
    revision_status: resolved_in_r02
    topic: source page marker defects, both corrected
    locus: lines 250 and 303
    finding_at_r01: >-
      {#p17} appeared twice and {#p18} never, so the packet had no marker for its final
      page. Separately, marker-derived paging put Half-Elves on p17 while the table of
      contents placed it on p16.
    resolution: >-
      The operator corrected the final marker to {#p18}. All six markers are now unique
      and cover p13 through p18. The operator separately checked a physical copy of the
      book and confirms the table of contents is in error, not the marker: Half-Elves is
      on page 17.
    consequence: >-
      Both of r01's readings were correct, so no citation in this GUR changes. What
      changes is their provenance. In r01 the six page 18 citations rested on the
      Analyst's inference that a duplicated {#p17} was an intended {#p18}; they now rest
      on a marker in the source. A Reviewer auditing r01 would have had to accept that
      inference, and should not have to.
    why_recorded: >-
      An artifact that silently improves its own evidence is harder to audit than one
      that says which claims were inferred and when they stopped being inferences.

  - id: OBS-19
    revision_status: new_in_r02
    topic: the printed table of contents contains at least one error
    locus: "PHB p3-p5 contents, against this packet's markers and a physical copy"
    finding: >-
      The contents places Half-Elves on page 16. The section is on page 17, confirmed by
      the source markers and independently by the operator against a physical copy of the
      book.
    why_it_matters: >-
      OBS-04 of GUR-PKT-PHB-001-006-preamble-r02 proposed the contents and the table
      index as an independent completeness check for later PHB packets, and specifically
      as a guard against the tables_split_across_pages hazard declared in the book's
      extraction profile. That recommendation still holds, because a flawed index is
      still a useful checklist. But it must be used as a cross-check and not as an
      authority. Where the contents and a page marker disagree, the marker wins, and a
      disagreement is a prompt to check rather than evidence that the packet is wrong.
    consequence_for_prior_artifacts: >-
      Packet 01's OBS-04 is qualified, not withdrawn. It already carried a caveat that
      the index describes the printing this one was based on and would not list
      re-included material; this adds that the index is not error-free even for the
      material it does list.
    recommendation: >-
      Any future use of the contents as a coverage check should treat a mismatch as a
      question, not a defect report against the packet.

post_decision_observations:
  - id: OBS-20
    topic: the registry and the canonical node list have diverged by one row
    finding: >-
      rulesets/adnd1e/registries/nodes.csv now holds 1,095 nodes and
      rulesets/adnd1e/canonical/nodes_master.csv holds 1,094. The difference is exactly
      race_human, which exists in the registry at degree zero and nowhere in the canonical
      graph.
    why_it_matters: >-
      This is correct and expected. DEC-2026-0001 changes the registry only, and degree
      zero is the stated deterministic value before any approved edge is integrated. It is
      recorded because the Integrator precondition audit of 2026-07-27 verified as a
      passing check that the two files "cover an identical node set". That check now fails,
      and will keep failing until an edge touching race_human is integrated. Anyone
      re-running that audit should read the failure as this decision, not as corruption.
    recommendation: >-
      If the check is ever automated, it should permit registry-only nodes at degree zero
      rather than requiring set equality.

  - id: OBS-21
    topic: race_any carries at least one further identity the decision does not cover
    finding: >-
      Verifying DEC-2026-0001 meant reading all 49 race_any incident edges. The decision's
      migration set, source_label in [Human, Humanity], is exactly right and matches at
      three rows. But race_any appears under thirteen distinct labels, and four of them
      denote demihumans, which is the complement of human rather than a synonym for it:
      "Demihuman Craftsmen" at DMG p30, "Demihuman Race" at DMG p74, "Small Demi-Humans"
      at UA p76 and "Demi-Humans" at UA p90. One further edge carries an empty label, and
      six more carry idiosyncratic labels such as "Race and Sex" and "Observer Race".
      Thirty-six of the 49 are plainly generic, labelled "Race".
    why_it_matters_here: >-
      One of the four bears directly on this packet. The canonical row
      race_any CONSTRAINS exp_level, labelled "Demihuman Race" and cited to DMG p74, is
      the same relationship as edges B1 through B6 of this GUR at coarser grain and from a
      different book. B1 to B6 assert that each of the six non-human races caps level
      attainment, cited to PHB Table II. Whether they are a refinement of the DMG row, a
      duplicate of it, or a conflict with it cannot be settled without the local
      neighborhood the Analyst was not given.
    why_it_matters_generally: >-
      DEC-2026-0001 rules that race_any is the generic race concept. Four rows currently
      use it to mean specifically not-human. That is a second conflation of the same kind
      the decision was raised to fix, pointing the opposite way, and it falls outside the
      migration scope the decision sets.
    escalated_as: ESC-2026-0004
    analyst_action_taken: >-
      Filed as a separate escalation rather than treated as a defect in DEC-2026-0001,
      which correctly answered the question it was asked. B1 through B6 are left as
      proposed and unchanged.

unresolved_identity_questions:
  - id: IDQ-06
    question: >-
      Two canonical nodes exist that could carry this packet's table relationships
      instead of the direct race-to-ability edges used here: tbl_race_maximums, labelled
      Racial Ability Maximums at degree 3, and rule_racial_adjustment, labelled Racial
      Ability Adjustment at degree 2. Should sections C and E route through them?
    bearing: C1 through C9, E1 through E16
    analyst_handling: >-
      Used direct race-to-ability edges, because impact analysis asks what breaks if a
      given ability changes and the direct form answers it. But constitution 3.2 says a
      rule and its table are two nodes joined by DERIVED_FROM when separately referenced,
      and both nodes exist and are separately referenced, which argues the other way. Not
      resolved silently: if the Reviewer prefers routing, the 25 edges repoint mechanically.

  - id: IDQ-07
    question: >-
      Elves and half-elves resist sleep and charm. The edges target spell_sleep and
      spell_charm_person with polarity worsens, meaning the race degrades the spell.
      Should the target instead be save_spell, since the text grants a saving throw in
      the charm case?
    bearing: F9, F10, F22, F23
    analyst_handling: >-
      Targeted the spells, because the percentage resistance operates before any saving
      throw and applies to both spells, while the saving throw is mentioned only as what
      survives the resistance check for charm. Constitution 6 warns that ambiguity comes
      from choosing the wrong target, so this is flagged rather than assumed.

architectural_escalations:
  - id: ESC-2026-0003
    status: decided
    decision_id: DEC-2026-0001
    decision_summary: >-
      Approved. race_human is added under the existing race_ prefix. race_any remains the
      generic race concept and must not be used as the human identity. No constitution
      change. Migration of legacy race_any rows is scoped to Reviewer and Integrator, not
      to this GUR.
    filed_at: rulesets/adnd1e/escalations/pending/ESC-2026-0003.yaml
    filed_in_revision: 2
    filing_note: >-
      Raised in r01 inside this GUR and filed in r02 as a standalone artifact at operator
      instruction, so the Architect sees it without having to read a book packet's GUR.
      The filed package is fuller than this summary: it adds the race_any audit question,
      per-option arguments, and the migration consequence of each ruling. It remains
      incomplete in one respect, the local graph neighborhood, which was not supplied.
    trigger: >-
      ESCALATION_CONTRACT — "no existing node ID represents the concept and a new kind or
      prefix may be needed"
    originating: PKT-PHB-013-018-races / GUR-PKT-PHB-013-018-races-r01
    question: >-
      Should race_human exist? More broadly, should the graph carry nodes for the default
      case, or model defaults as the absence of edges?
    affected_canonical_ids: [race_any, race_dwarf, race_elf, race_gnome, race_half_elf, race_half_orc, race_halfling]
    source_excerpt: >-
      Humans, PHB p17. "Human characters are neither given penalties nor bonuses, as they
      are established as the norm upon which these subtractions or additions for racial
      stock are based. Human characters are not limited as to what class of character
      they can become, nor do they have any maximum limit — other than that intrinsic to
      the class — of level they can attain within a class."
    local_neighborhood: not available; no slice supplied
    options_considered:
      - add race_human, so the seventh playable stock can carry its two stated rules
      - treat humans as race_any, which currently carries degree 49 and appears to serve
        as the generic race
      - model the human case as the absence of restriction edges and record nothing
    recommended_resolution: >-
      Add race_human. The book states two positive rules about humans and both are
      unattachable without it, and the absence of a node for the most-played race is
      likely to be felt again in packet 05. The Analyst notes but does not resolve the
      risk that race_any is already doing this job under a confusing name.
    expected_migration_impact: >-
      None to existing edges if added. If instead race_any is ruled to mean human, some
      of its 49 edges may be mis-scoped and would need review.
    would_change: registry
    blocking: no; one edge depends on it and it is declared as a candidate

blocking_notes:
  - id: BLK-01
    severity: unchanged
    issue: domain_registry.yaml remains an empty map at status bootstrap.
    owner: architect
  - id: BLK-02
    severity: severe
    issue: no node_registry_slice.csv and no local_neighborhood.json supplied.
    consequence: >-
      136 edges proposed blind against a 3,809-edge graph. Section A alone is 36 EXCLUDES
      edges asserting racial class restrictions, which is precisely the kind of content a
      legacy import would already hold. Deduplication is mandatory downstream.
    owner: packet_creator
  - id: BLK-05
    severity: new
    issue: >-
      Cross-book pointers cannot be represented, as recorded in OBS-17 and previously in
      OBS-02 and OBS-10.
    consequence: >-
      Every explicit referral from the PHB to the DMG or Monster Manual is silently
      dropped. Three packets have now hit it.
    owner: architect

completeness_statement: >-
  All 350 lines were read before extraction. All four tables were worked cell by cell:
  Table I across 70 permission cells, Table II across 70 level cells plus its nine
  ability-linked footnotes, the racial penalties and bonuses table, and Table III across
  72 minimum and maximum cells in male/female form. All seven race descriptions were read
  in full, along with the racial preferences table and its six-value legend. Pages 13
  through 18 are accounted for, subject to the two marker defects recorded as OBS-18 and
  declared in packet.yaml.

  136 candidate edges are proposed and six candidate groups are recorded as rejected with
  reasons, including one deliberate deferral of the class alignment restrictions to packet
  05. That deferral is recorded as a test in OBS-15 so it can be checked rather than
  trusted, which is how the equivalent deferral from packet 03 was handled and it proved
  correct.

  Three grain decisions shaped the count and are stated explicitly rather than left to be
  inferred: only the denials in Table I are recorded, Table II is one edge per race
  because its per-class detail is entirely magnitudes, and Table III is split into gates
  for minimums and constraints for maximums with non-binding cells dropped.

  Two candidate nodes are proposed, both under approved prefixes, both with their
  dependent edges named. One architectural escalation is raised, on whether the graph
  should carry a node for the default case. Authored polarity appears on the three
  permitted types only, and the generated edge set contains no duplicate source, type and
  target triple, which was checked mechanically because this packet proposes many edges
  from few source nodes and invariant 12 is strict.

  The single most useful result is OBS-13. A question that ran through three artifacts,
  whether character sex feeds ability scores, is now closed against the authoritative
  table: it does not, except for strength maximum, in five of the six non-human races.

  This GUR is complete enough for the Builder to normalize without rereading the source,
  with the standing qualification that deduplication against canonical is mandatory and
  could not be performed at extraction time.

# =============================================================================
# DOWNSTREAM NOTES  (added 2026-07-30, after the GUR body was written)
# =============================================================================
downstream_notes:
  purpose: >-
    Builder and Reviewer startup does not read books/<book>/reports/, so a finding recorded
    only there would never reach them. This block is a pointer, not a verdict.
  dedupe_report:
    path: books/adnd1e/phb/reports/DEDUPE-PHB-20260729.md
    what_it_is: >-
      Every edge proposed across all PHB GURs, compared against the 3,809-edge canonical
      graph on three tests: exact duplicate triple, type conflict on the same ordered pair,
      and direction conflict on the reversed pair. Across all PHB GURs, 115 of 389 proposed
      edges duplicate a canonical triple exactly, 35 are type conflicts and 20 are direction
      conflicts.
    why_it_exists: >-
      No packet was ever supplied with a local_neighborhood.json, so no Analyst could run
      this check at extraction time. It is BLK-02, run once after the fact.
    what_builder_should_do: >-
      Consult it before normalising this GUR. Exact duplicates should generally be dropped
      from the GUP; where the canonical row cites a different book, prefer adding this
      packet's citation to the existing row over discarding a second independent witness.
    what_reviewer_should_do: >-
      The direction conflicts are classified in the report into four classes with a
      disposition for each. Class B is not a conflict at all and both sides should be kept.
      Class D is a flat PHB-versus-DMG contradiction on two rows.
  no_verdicts_embedded: >-
    This GUR has not been edited to mark individual edges as duplicates. Whether an
    assertion is already held by the graph is a normalisation determination owned by
    Builder and Reviewer; recording it in an interpretive artifact would put the decision
    in the wrong role.
