row_decisions:
  - ref: M1
    disposition: rejected
    source_locus: 'PHB p54 Notes Regarding Druid (Cleric) Spells:'
    rationale: >-
      Preserved from r01-r01. DERIVED_FROM cannot express classification as a
      druid religious symbol, and DEC-2026-0024 directs its omission.
  - ref: M2
    disposition: approved_with_revision
    source_locus: 'PHB p54 Notes Regarding Druid (Cleric) Spells:'
    rationale: >-
      The packet says the druid spells assume mistletoe's use. DEC-2026-0024
      requires a FEEDS_INTO input relation rather than CONSUMES.
    exact_corrections:
      source_id: rule_mistletoe
      source_label: Mistletoe
      edge_type: FEEDS_INTO
      target_id: rule_druid_spells
      target_label: Druid Spells
      aspect: material component
      condition: spells having a material component
      polarity: neutral
      polarity_basis: derived
    correction_citations:
      - {book: PHB, page: '54', section: 'Notes Regarding Druid (Cleric) Spells:'}
  - ref: M3
    disposition: approved_with_revision
    source_locus: 'PHB p54 Notes Regarding Druid (Cleric) Spells:'
    rationale: The range reduction applies to borrowed mistletoe, holly, or oak leaves; lesser mistletoe does not reduce range.
    exact_corrections:
      condition: borrowed mistletoe, holly, or oak leaves
    correction_citations:
      - {book: PHB, page: '54', section: 'Notes Regarding Druid (Cleric) Spells:'}
  - ref: M4
    disposition: approved
    source_locus: 'PHB p54 Notes Regarding Druid (Cleric) Spells:'
    rationale: Every listed component below greater mistletoe reduces duration.
  - ref: M5
    disposition: approved_with_revision
    source_locus: 'PHB p54 Notes Regarding Druid (Cleric) Spells:'
    rationale: Only holly or oak leaves reduce area; borrowed and lesser mistletoe do not.
    exact_corrections:
      condition: holly or oak leaves
    correction_citations:
      - {book: PHB, page: '54', section: 'Notes Regarding Druid (Cleric) Spells:'}
  - ref: M6
    disposition: approved
    source_locus: 'PHB p54 Notes Regarding Druid (Cleric) Spells:'
    rationale: The source supports the target saving-throw relation when the corresponding reduction category is inapplicable.
