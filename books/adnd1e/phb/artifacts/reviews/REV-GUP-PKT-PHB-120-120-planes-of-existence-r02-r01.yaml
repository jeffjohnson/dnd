blocking_findings:
  - id: P120-R02-B1
    severity: blocking
    category: source_identity_mismatch
    refs: [M016, M019]
    finding: >-
      The packet attributes tirelessness and weapon-magic effects to the Ethereal
      Plane. The GUR correctly proposes rule_ethereal_plane for that place, but
      M016 and M019 instead emit the legacy rule_planar_travel identity. The
      packet and the GUR's IDQ-01 distinguish a plane from travelling; the
      submitted edges therefore attach these effects to the wrong identity.
    required_correction: >-
      Reissue the GUR with M016 and M019 sourced from rule_ethereal_plane. They
      must remain pending until that proposed node is approved and registered;
      do not repoint or relabel existing canonical rule_planar_travel.
  - id: P120-R02-B2
    severity: blocking
    category: invalid_edge_semantics
    refs: [M013]
    finding: >-
      EXCLUDES is reserved for an expected-but-denied dependency. The source
      says that psychic wind can snap the silver cord, which is an affirmative
      destructive event, not a denial of a dependency on the cord.
    required_correction: >-
      Re-derive M013 from the sentence in ASTRAL TRAVEL. Use an edge whose
      source, target, direction, and polarity express the wind's affirmative
      consequence; retain a Silver Cord endpoint only if that endpoint is
      mechanically supported.
  - id: P120-R02-B3
    severity: blocking
    category: unbounded_aspect_grain
    refs: [M001, M002, M003, M004, M006, M007, M008, M009, M010, M011, M012, M016, M017, M018, M019, M020, M021, M022]
    finding: >-
      Eighteen aspects are copied prose of five to nine words. Constitution
      section 5 permits a one-to-four-word affected facet, not copied outcome
      language. The Builder report flags each of these warnings; they are
      substantive grain defects rather than harmless formatting.
    required_correction: >-
      Reissue the GUR with each affected aspect reduced to a distinct
      one-to-four-word facet while preserving only source-supported mechanics.
