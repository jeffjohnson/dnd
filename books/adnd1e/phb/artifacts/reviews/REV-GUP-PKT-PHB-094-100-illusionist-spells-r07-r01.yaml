      condition: hate
  - ref: M070
    disposition: approved_with_revision
    source_locus: PHB p100 Alter Reality
    rationale: >-
      Alter Reality requires depiction through Phantasmal Force before it goes
      into action. That requirement is a gate on activation; the depiction is
      its qualitative trigger rather than an aspect.
    corrected_fields:
      aspect: activation
      condition: depicting the alteration through Phantasmal Force
