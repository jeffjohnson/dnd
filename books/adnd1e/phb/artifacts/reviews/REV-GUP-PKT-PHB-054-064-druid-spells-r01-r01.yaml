  review_notes:
    - >-
      All 78 spell headings and descriptions were independently walked through
      Pandoc's AST with printed-page attribution resolved from the claimed
      Markdown rather than inherited from the GUR.
    - >-
      The 57 emitted caster-level relationships are source-supported and all
      improve their named spell facets, but thirteen aspects omit additional
      facets that the same spell entry explicitly scales.
    - >-
      spell_call_woodland_beings duplicates the registered
      spell_call_woodland_being identity. L11 can be corrected mechanically to
      the existing ID; its range facet remains distinct from canonical row 2665.
    - >-
      The proposed rule_mistletoe identity is source-supported, but canonical
      row 1502 already serializes the label Druid Mistletoe on class_druid.
      Approving it as isolated would leave asymmetric identity drift, so the
      required canonical migration is escalated.
    - >-
      M1 misuses DERIVED_FROM for classification. M2 also misuses CONSUMES:
      PHB 54 says the component is used, while canonical row 2648 explicitly
      says mistletoe is not consumed.

