missing_input_impact: >-
  Substantial. The absent local_neighborhood.json mattered most: the first GUR revision was built
  without it and proposed ten assertions canonical already held in different words, plus three node
  identities competing with ones canonical uses on this very page. Pulling the 23 canonical DMG 64
  rows directly is what caught it, and r02 is the corrected extraction. The registry slice would
  also have surfaced the duplicate identity pairs dex_reaction_adj against
  abil_dexterity_reaction_attacking_adjustment, dex_defensive_adj against
  abil_dexterity_defensive_adjustment, and str_exceptional against abil_strength_exceptional, each
  carrying identical labels. See the GUR revision_note, IDQ-01, IDQ-02 and IDQ-03.
