intake_note: >-
  Supplied by the repository source steward under DEC-2026-0029 follow-up. The first delivery
  carried no page marker and could not be claimed; the steward added the marker and the packet was
  claimed from the corrected file. No pipeline role authored any part of this source text.

page_composition:
  p64: the whole file

marker_note: >-
  One marker, {#p64}, at the end of the opening level-two heading. Under SOURCE_MARKDOWN 1.3 rule 1
  it takes the whole heading, and the assignment persists to the end of the file because no later
  marker changes it. Page attribution for this packet is therefore total and unambiguous.
marker_placement_resolution: >-
  Parsed with pandoc 3.10 to JSON AST rather than by line splitting. Pandoc represents the marker as
  the heading identifier p64, which SOURCE_MARKDOWN 1.3 states has the same page-marker meaning as
  literal marker text. The four remaining level-two headings carry ordinary slug identifiers, not pN
  identifiers, so none of them is a marker. Every block in the file resolves to printed page 64.

boundary_note: >-
  The file ends mid-sentence inside the Lighting Oil paragraph, at "it still could land in the
  puddle of oil or oil covered". That paragraph continues onto printed page 65, which is outside
  this packet. No assertion is extracted from the truncated remainder; see OBS-03 of the GUR.

prior_extraction_note: >-
  Canonical holds 23 rows cited to DMG 64, covering strength, dexterity, the giant and machine
  note, cover and concealment, and most of the grenade-missile resolution chain. This page is well
  covered by the legacy import even though it is the first DMG page claimed as a packet. One of
  those rows, sys_equipment CONSUMES money_gp with aspect "acquisition cost at DM adjudication", is
  a named subject of DEC-2026-0029 pair 1. Its production lineage traces to
  migrations/adnd1e/legacy-import/original/edges_master.csv, so it is eligible for the legacy
  conformance exception recorded in that Decision. The GUR does not re-propose it, nor the nine
  other assertions the fresh reading found already present.

status_note: >-
  Every edge in this packet's GUR carries status core. This is core DMG combat procedure and the
  text marks none of it a DM option. The DM adjudication of special-weapon cost is an adjudication
  of price, not an optional subsystem.

source_id_note: >-
  dmg-legacy-unspecified is the only source_id registered for this book in
  rulesets/adnd1e/registries/sources.yaml, and the Analyst may not mint a registry entry. Its
  recorded provenance is "legacy graph dump", which is not true of this packet: this is freshly
  supplied steward text. The discrepancy is recorded rather than resolved because it matters here.
  DEC-2026-0029 forbids legacy canonical data and archive extraction batches as source-read
  evidence, and this packet's whole purpose is to supply non-legacy evidence. A reader must not
  infer from the source_id that this reading is legacy-derived. Raised for Architect attention as
  ESC candidate in the GUR; see OBS-01.

packet_metadata_origin: analyst_derived_at_claim
