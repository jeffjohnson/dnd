node_changes:
  additions_proposed:
    - proposed_id: rule_acid
      proposed_label: Acid
      kind: rule
      why_needed: Acid is named in the section heading and given its own row in both the Size and the
        Effect tables, alongside holy water, oil and poison. Canonical carries a DERIVED_FROM row for
        the other three and none for acid, so the graph currently records three of the four container
        contents. The registry has spell_melfs_acid_arrow and item_oil_acid_resistance but nothing for
        acid as a substance. Parallel in form to the existing rule_holy_water and rule_oil.
      edges_depending_on_it:
        - M001
        - M002
        - M003
      prefix_approved: true
      id_format_valid: true
      already_canonical: false
      label_collides_with: []
      disposition: reviewer_may_approve
      architect_required: false
      routing_basis: 'DEC-2026-0003: approved prefix and kind, valid ID, no duplicate'
      reviewer_disposition: approved
      reviewer_basis: The p64 Size and Effect tables expressly distinguish acid, and no canonical substance
        identity duplicates it.
    - proposed_id: cbt_missile_scatter
      proposed_label: Missile Scatter
      kind: cbt
      why_needed: 'The Misses paragraph is a self-contained procedure: distance off target, direction
        off target, an optional short-range die, and a re-reading of the direction table when the target
        is a wall. Nothing in canonical covers it. It is invoked from two places on this page alone, the
        missed container and the torch used to light spilled oil, so it is referenced apart from the throw
        itself and is a node rather than a property of one.'
      edges_depending_on_it:
        - M016
        - M017
        - M018
      prefix_approved: true
      id_format_valid: true
      already_canonical: false
      label_collides_with: []
      disposition: reviewer_may_approve
      architect_required: false
      routing_basis: 'DEC-2026-0003: approved prefix and kind, valid ID, no duplicate'
      reviewer_disposition: approved
      reviewer_basis: The p64 Misses procedure is a distinct reusable combat procedure with no canonical
        identity.
    - proposed_id: cbt_dropped_object
      proposed_label: Dropped Object
      kind: cbt
      why_needed: '''A dropped boulder (or any heavy weight) will do damage as follows'' states a rule
        about dropped weights in general, not about boulders. Nothing in canonical covers it. The registry''s
        nearest node is ex_falling, which is damage to a creature that falls, the opposite direction.
        Kept distinct from cbt_grenade_missile because nothing is thrown and no container breaks.'
      edges_depending_on_it:
        - M015
      prefix_approved: true
      id_format_valid: true
      already_canonical: false
      label_collides_with: []
      disposition: reviewer_may_approve
      architect_required: false
      routing_basis: 'DEC-2026-0003: approved prefix and kind, valid ID, no duplicate'
      reviewer_disposition: approved
      reviewer_basis: The p64 dropped-heavy-weight rule is distinct from a falling creature and grenade-container
        resolution.
