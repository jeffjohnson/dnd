source_summary: 'DMG 64, the missile discharge portion of the combat chapter. Four topics: how strength
  and dexterity bear on missile fire, the note that dexterity gives no armor class benefit against giant-hurled
  and machine-thrown missiles, the cover and concealment adjustment table, and the grenade-like missile
  rules covering acid, holy and unholy water, oil, poison, boulders, and where a thrown container lands
  when the attack misses. The page''s final paragraph is cut mid-sentence by the page boundary.'
node_id_resolution_method: 'Every endpoint was looked up in rulesets/adnd1e/registries/nodes.csv before
  any node was proposed. Fourteen concepts resolved to existing IDs, several of which were not obvious:
  the Dexterity Attacking Adjustment named on the page is already abil_dexterity_reaction_attacking_adjustment,
  cover and concealment already exist as rule_cover and rule_concealment, and the orifice-delivered poison
  case matches the existing rule_poison_insinuated. Four concepts had no ID and are proposed below.'
grain_decisions:
- The cover and concealment table is entirely magnitudes. The relationship recorded is that cover and
  concealment adjust the target's armor class under missile fire; the percentages and the bonus values
  stay out of aspect and condition.
- Container sizes, areas of effect, splash and direct-hit damage, burn durations, the fourteen-pound-per-point
  drop rule and the scatter dice are all magnitudes. Each is recorded as the facet touched, never the
  value.
- '''Beyond 1 foot is medium and beyond 2 feet is long'' reduces to the condition ''medium or long range''.
  The two thresholds and the two to-hit penalties are dropped.'
- The armor class example in the giant-missile note, a character at -2 dropping to 0, is an illustration
  of M006 and yields no separate assertion.
candidate_nodes:
- proposed_id: monster_giant
  proposed_label: Giants
  kind: monster
  why_needed: 'The page treats giants as a category with a shared missile profile: their thrown missiles
    have a stated size, their boulders have a stated size, and they are one of the two things that negate
    a target''s dexterity armor class bonus. The registry holds eight monster_*_giant nodes, but all of
    them are giant vermin, Ant Giant through Wasp Giant. None is the giant humanoid family this page means.
    3.1 permits a creature family node.'
  edges_depending_on_it:
  - M007
  - M027
- proposed_id: rule_acid
  proposed_label: Acid
  kind: rule
  why_needed: One of the four grenade contents with a tabled area, splash and direct-hit effect. The registry
    has spell_melfs_acid_arrow and item_oil_acid_resistance but no node for acid as a substance, which
    is what the table row is about. Parallel to the existing rule_holy_water and rule_oil.
  edges_depending_on_it:
  - M016
  - M017
- proposed_id: cbt_missile_scatter
  proposed_label: Missile Scatter
  kind: cbt
  why_needed: 'The Misses paragraph is a self-contained procedure: distance off target, direction off
    target, an optional short-range die, and a re-reading of the direction table when the target is a
    wall. It is invoked from two places on this page alone, the missed container and the torch used to
    light spilled oil, so it is referenced apart from the throw itself and is a node rather than a property
    of one.'
  edges_depending_on_it:
  - M030
  - M031
  - M032
- proposed_id: cbt_dropped_object
  proposed_label: Dropped Object
  kind: cbt
  why_needed: '''A dropped boulder (or any heavy weight) will do damage as follows'' states a rule about
    dropped weights in general, not about boulders. The registry''s nearest node is ex_falling, which
    is damage to a creature that falls, the opposite direction. Kept distinct from cbt_grenade_missile
    because nothing is thrown and no container breaks.'
  edges_depending_on_it:
  - M029
