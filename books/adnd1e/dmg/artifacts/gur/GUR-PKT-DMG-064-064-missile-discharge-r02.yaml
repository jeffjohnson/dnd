source_summary: 'DMG 64, the missile discharge portion of the combat chapter. Four topics: how strength
  and dexterity bear on missile fire, the note that dexterity gives no armor class benefit against giant-hurled
  and machine-thrown missiles, the cover and concealment adjustment table, and the grenade-like missile
  rules covering acid, holy and unholy water, oil, poison, boulders, and where a thrown container lands
  when the attack misses. The page''s final paragraph is cut mid-sentence by the page boundary.'
node_id_resolution_method: 'Two passes. First every endpoint was looked up in nodes.csv. Second, and this
  is what changed the GUR, every canonical row already cited to DMG 64 was pulled and compared assertion
  by assertion, which is what surfaced both the duplicate facets and the competing node identities. Where
  canonical already names a concept at this locus, that identity is reused even when constitution 3.1''s
  prefix table would suggest another: dex_reaction_adj and dex_defensive_adj rather than the abil_ duplicates,
  cbt_tohit rather than cbt_attack_matrix, monster_special rather than a new monster_giant, rule_oil and
  rule_poison_use rather than rule_flaming_oil and rule_poison_insinuated. The three concepts with no
  identity anywhere are proposed below.'
grain_decisions:
- The cover and concealment table is entirely magnitudes. Canonical already records the two relationships
  it supports, so this GUR adds nothing there beyond the cross-reference.
- Container sizes, areas of effect, splash and direct-hit damage, burn durations, the fourteen-pound-per-point
  drop rule and the scatter dice are all magnitudes. Each is recorded as the facet touched, never the
  value.
- '''Beyond 1 foot is medium and beyond 2 feet is long'' reduces to the condition ''medium or long range''.
  The two thresholds and the two to-hit penalties are dropped.'
- Poison gets no area or damage edge. Its Effect-table row reads 'special' in every column, so unlike
  the other three contents the table asserts no outcome for it to determine.
- The armor class example in the giant-missile note, a character at -2 dropping to 0, is an illustration
  of an existing canonical row and yields no assertion.
candidate_nodes:
- proposed_id: rule_acid
  proposed_label: Acid
  kind: rule
  why_needed: Acid is named in the section heading and given its own row in both the Size and the Effect
    tables, alongside holy water, oil and poison. Canonical carries a DERIVED_FROM row for the other three
    and none for acid, so the graph currently records three of the four container contents. The registry
    has spell_melfs_acid_arrow and item_oil_acid_resistance but nothing for acid as a substance. Parallel
    in form to the existing rule_holy_water and rule_oil.
  edges_depending_on_it:
  - M001
  - M002
  - M003
- proposed_id: cbt_missile_scatter
  proposed_label: Missile Scatter
  kind: cbt
  why_needed: 'The Misses paragraph is a self-contained procedure: distance off target, direction off
    target, an optional short-range die, and a re-reading of the direction table when the target is a
    wall. Nothing in canonical covers it. It is invoked from two places on this page alone, the missed
    container and the torch used to light spilled oil, so it is referenced apart from the throw itself
    and is a node rather than a property of one.'
  edges_depending_on_it:
  - M016
  - M017
  - M018
- proposed_id: cbt_dropped_object
  proposed_label: Dropped Object
  kind: cbt
  why_needed: '''A dropped boulder (or any heavy weight) will do damage as follows'' states a rule about
    dropped weights in general, not about boulders. Nothing in canonical covers it. The registry''s nearest
    node is ex_falling, which is damage to a creature that falls, the opposite direction. Kept distinct
    from cbt_grenade_missile because nothing is thrown and no container breaks.'
  edges_depending_on_it:
  - M015
