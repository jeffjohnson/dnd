revision_note: r01 was built before the canonical neighborhood for this page was read. Canonical holds
  23 rows cited to DMG 64, and r01 duplicated ten of them in different words, which 5.1 forbids as paraphrase.
  r01 also proposed abil_dexterity_reaction_attacking_adjustment, abil_dexterity_defensive_adjustment
  and a new monster_giant where canonical uses dex_reaction_adj, dex_defensive_adj and monster_special
  on this same page, which would have been exactly the drift 3.2 calls the most common defect in this
  graph. This revision emits only assertions the page states and canonical does not already carry, and
  reuses the identities canonical uses at this locus. No edge in r01 is carried forward unchanged without
  being re-checked against the 23 rows.
