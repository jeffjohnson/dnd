dec_2026_0029_pair_1_finding:
  question_from_decision: Do the DMG 64 and PHB 35 sys_equipment CONSUMES money_gp rows assert the same
    affected facet under the same condition, or separate facets?
  dmg_64_reading: Read from Strength Bonus Considerations. The sentence is about a weapon that is not
    on any price list. A character who wants strength bonus on missile fire must obtain a purpose-made
    heavier weapon, and the page hands where, how and at what price to the DM. Its content is the absence
    of a stated cost.
  phb_35_reading: Read from the claimed packet PKT-PHB-035-038-money-equipment. EQUIPPING THE CHARACTER
    introduces BASIC EQUIPMENT AND SUPPLIES COSTS, a price list in gold and silver pieces, and says 'Often
    there will not be sufficient funds to purchase everything desired.' Its content is that listed goods
    have a published price paid from funds.
  determination: Separate facets. Two assertions, not one.
  reasoning: The two rows are near complements. One says the price is printed, the other says there is
    no printed price and the DM sets it. Merging them would delete the only thing the DMG sentence contributes.
    Neither aspect is a paraphrase of the other under 5.1.
  recommended_outcome: Retain both, unchanged. The first of the Decision's permitted outcomes; no canonical
    edit is required and none is proposed.
  aspect_conformance: The DMG row's aspect runs five words. Its production lineage was traced to migrations/adnd1e/legacy-import/original/edges_master.csv,
    where it appears verbatim with the same endpoints, aspect, book, page and section, and it also appears
    in the derived by-book DMG file and in original/addnd_graph.json. It is therefore eligible for the
    legacy conformance exception. Because the reading proves no action is required, the row is not touched
    and no revision obligation is triggered.
  evidence_basis: Read from this claimed packet and from the claimed PHB packet only. No archive extraction
    batch, canonical row, or endpoint name was used as source evidence. The legacy import file was consulted
    solely to establish production lineage for the exception test, which is a provenance question rather
    than a reading of the rule.
source_identity_conflicts:
  checked: Every source name explicitly present in this packet, per SOURCE_MARKDOWN 1.3.
  found: One. The canonical DMG 64 row for pair 1 carries source_label 'Special Heavy Weapons' on node
    sys_equipment. The page never uses that phrase; it says 'special weapons' and describes 'a heavier
    missile or a more powerful bow and heavier arrows or larger sling missiles'. The label is a coinage.
    Separately, canonical labels monster_special 'Special Creatures' where the page says plainly 'giants'.
  disposition: Neither is a defect under GRAPH_INVARIANTS 4, which holds that labels do not determine
    identity, and neither is an identity conflict, because the packet supplies no competing ID stem. Recorded
    for the Reviewer rather than acted on. See IDQ-01.
unresolved_identity_questions:
- id: IDQ-01
  subject: the giants have no identity of their own
  question: 'The page makes three assertions about giants: their thrown missiles have a stated size, their
    boulders have a stated size, and they negate a target''s dexterity armor class bonus. Canonical attaches
    the third to monster_special, labelled ''Special Creatures''. The registry''s eight monster_*_giant
    nodes are all giant vermin, Ant Giant through Wasp Giant, not the giant humanoids this page means.'
  analyst_position: 'M014 reuses monster_special, because putting a new monster_giant next to an existing
    monster_special row about the same creatures on the same page is precisely the drift 3.2 warns against,
    and choosing between them is a migration rather than a packet decision. The cost of the reuse is real
    and is recorded here: ''Special Creatures'' is a catch-all, so the graph cannot presently answer what
    giants specifically do.'
  affects:
  - M014
- id: IDQ-02
  subject: duplicate ability-adjustment identities
  question: nodes.csv holds dex_reaction_adj and abil_dexterity_reaction_attacking_adjustment with the
    identical label 'Reaction/Attacking Adjustment', dex_defensive_adj and abil_dexterity_defensive_adjustment
    with the identical label 'Dexterity Defensive Adjustment', and str_exceptional and abil_strength_exceptional
    with the identical label 'Exceptional Strength'. Canonical usage is 6 against 1, 16 against 1 and
    7 against 2 respectively.
  analyst_position: Three duplicate node identities, not three naming preferences. This GUR uses the dominant
    form in every case, which is also the form canonical uses at this locus, and proposes nothing on any
    of them. Resolution is an Architect migration. Recorded here because this packet is the first work
    to touch the dex_ pair since the duplicates arose, and because constitution 3.1's prefix table lists
    abil_ but neither dex_ nor str_, so the corpus and the constitution disagree about which form is correct.
  affects: []
- id: IDQ-03
  subject: which poison node the grenade rules attach to
  question: The page distinguishes contact poison from poison delivered into an ingestive or respiratory
    orifice. The registry has rule_poison_ingested, rule_poison_insinuated, rule_poison_use, rule_poison_detection,
    rule_poison_study, tbl_poisons and monster_poison, but no node for contact poison.
  analyst_position: M011 uses rule_poison_use, the identity canonical already uses for thrown poison at
    this locus, rather than rule_poison_insinuated, which is a closer match for the orifice case in isolation
    but would split the page's poison assertions across two nodes. The contact-poison branch is not recorded
    as an edge at all rather than forced onto a node that does not mean it.
  affects:
  - M011
architectural_escalations:
- id: ESC-CAND-01
  subject: source_id for steward-extracted, non-legacy packets
  statement: 'This packet is recorded under dmg-legacy-unspecified because that is the only source_id
    registered for the DMG and an Analyst may not add a registry entry. Its registered provenance is ''legacy
    graph dump'', which is false for this packet: the text was supplied fresh by the repository source
    steward under DEC-2026-0029.'
  why_it_matters: DEC-2026-0029 forbids legacy canonical data and archive extraction batches as source-read
    evidence, and this packet exists specifically to supply evidence that is not legacy. A reader who
    takes source_id at face value would conclude the opposite of what is true, on the one reading where
    that distinction decides whether the work is admissible. The same mismatch already sits under every
    PHB packet, so the fix is a registry change, not a packet field.
  analyst_position: Register a source_id whose provenance names steward intake, and record which packets
    were extracted under it. Raised here rather than earlier because this is the first packet where the
    label actively contradicts the governing Decision.
  owner: architect
non_edge_observations:
- id: OBS-01
  topic: DMG 64 was already substantially extracted
  finding: Canonical holds 23 rows cited to DMG 64, covering strength, dexterity, the giant and machine
    note, cover and concealment, and most of the grenade-missile resolution chain. This is the repository's
    first claimed DMG packet, but the page is not new ground.
  why_it_matters: 'It inverts the assumption carried into this packet from the PHB appendices, where the
    recurring finding was that later pages of a section had no canonical coverage at all. It also set
    the shape of this GUR: 19 edges of genuinely new material rather than a full page sweep, with the
    overlap recorded as confirmation instead.'
- id: OBS-02
  topic: the page marker was missing on first delivery
  finding: The incoming file arrived with no {#pN} marker. Under SOURCE_MARKDOWN 1.3 that leaves every
    citation on the page unresolvable, and deriving the page from the filename is explicitly prohibited.
    The packet was not claimed until the steward supplied the marker.
  why_it_matters: 'Recorded so the claim history is legible: the immutable claimed copy is taken from
    the corrected file, and its checksum matches the corrected incoming file, not the first delivery.'
- id: OBS-03
  topic: the page ends mid-sentence
  finding: The Lighting Oil paragraph is cut at 'it still could land in the puddle of oil or oil covered'.
    The remainder is on printed page 65 and is not in this packet.
  why_it_matters: M018 is read from the clause before the cut, which is complete on its own. Nothing beyond
    the cut is used. Whatever the sentence goes on to say about oil-covered targets is unextracted and
    will need page 65.
- id: OBS-04
  topic: every splash is resolved by the poison save
  finding: '''All creatures within three feet of the impact and breaking point of the container missile
    must save versus poison or be splashed with the contents.'' The save applies whatever the container
    held, including acid, holy water and burning oil.'
  why_it_matters: M009 records this as written. It is a mechanically odd choice that a reader could easily
    mistake for an extraction error, so it is flagged rather than quietly normalized to a dexterity or
    breath-weapon save.
- id: OBS-05
  topic: a canonical row this page does not support as stated
  finding: rule_cover MODIFIES save_matrix, aspect 'cover affects saves as well', is cited to DMG 64.
    The page says only 'For the effect of cover on magic, see SPELL CASTING DURING MELEE, Effect of Cover
    on Spells and Spell-like Powers.' It defers the question rather than answering it. The row is marked
    evidence inferred_rule, not explicit_rule, so it does not misrepresent itself.
  why_it_matters: 'M019 records what the page actually does, which is cross-reference another section.
    Whether the inferred row should stand on this citation, move to the section it points at, or be retired
    is a Reviewer question. No change is proposed here: the row is outside this packet''s assertion set
    and the section it defers to is on another page.'
- id: OBS-06
  topic: two references on the page have no node to point at
  finding: '''See also GRENADE-LIKE MISSILES and Special To Hit Bonuses'' and ''(See MONSTER MANUAL for
    giants'' abilities.)''. The first half of the first reference is already canonical as cbt_grenade_missile
    DERIVED_FROM cbt_missile. Special ''To Hit'' Bonuses has no node in the registry, and the Monster
    Manual reference points out of this ruleset''s packetized material entirely.'
  why_it_matters: Both are explicit_reference material that would ordinarily become CROSS_REFERENCES edges.
    Neither is emitted, because 5 requires a citation to a real target and an Analyst must not invent
    an endpoint to carry a reference.
- id: OBS-07
  topic: registry prefix drift noticed during the node probe
  finding: nodes.csv contains prefixes absent from constitution 3.1, including bare 'comeliness', 'training',
    'magic', 'death', 'fatigue', 'cursed', 'turn' and 'align', alongside the dex_ and str_ duplicates
    in IDQ-02.
  why_it_matters: Pre-existing and out of scope for this packet. Recorded once because the probe surfaced
    it and 3.2 calls drift the most common defect in this graph.
