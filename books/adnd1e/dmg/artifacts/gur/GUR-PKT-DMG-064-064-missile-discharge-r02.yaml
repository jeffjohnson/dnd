canonical_duplicates_not_for_emission:
- finding: The page's fresh reading confirms 23 canonical rows already cited to DMG 64. Ten assertions
    this Analyst read off the page independently were found to be already present under different aspect
    wording, and are not re-emitted.
  confirmed_assertions:
  - abil_strength EXCLUDED_FROM cbt_missile | 'does not apply by default'
  - sys_equipment GATES abil_strength | 'must be specially equipped to benefit'
  - abil_strength EXCLUDED_FROM wpn_range | 'never extends range'
  - dex_reaction_adj MODIFIES cbt_initiative | 'adjusts the individual's initiative die'
  - dex_reaction_adj MODIFIES cbt_tohit | 'penalty or bonus when discharging'
  - dex_reaction_adj OVERRIDES cbt_initiative | 'individual may fire before the winning side'
  - monster_special EXCLUDES dex_defensive_adj | 'target loses the dexterity component'
  - rule_siege_engine EXCLUDES dex_defensive_adj | 'target loses the dexterity component'
  - rule_cover MODIFIES cbt_armor_class | 'large bonus scaling with coverage'
  - rule_concealment MODIFIES cbt_armor_class | 'smaller bonus scaling with screening'
  basis: '5.1: an exact assertion-key match must not become a second production edge, and a paraphrase
    of the same facet is not a distinct assertion. Each of the ten was read from the page first and matched
    to canonical afterwards, so this is a confirmation of the legacy rows against source, not a copy of
    them.'
  also_confirmed_indirectly:
  - campaign_construction FEEDS_INTO rule_cover — parapets, embrasures, merlons and arrow slits are all
    named on the page
  - rule_terrain FEEDS_INTO rule_concealment — 'figures in thick brush'
  - time_segment_round_turn FEEDS_INTO rule_cover — 'seen for only three-quarters of a round'
  - cbt_grenade_missile TRIGGERS item_saving_throw, crushing blow column
  - item_saving_throw GATES cbt_damage
  - rule_cover ALTERNATIVE_TO rule_concealment
  - rule_oil CONSUMES time_segment_round_turn
