scope_boundary: 'The bounded scope covers printed pages 31 through 38 of Cursed Scroll
  2: Red Sands, comprising The Djurum title page (pg 31), Travel in the Sands subsystem
  with temperature and wind rules and tables (pg 32), and The Djurum Hex Key adventure
  sites (pp 33-38).'
source_summary: 'Presents regional travel subsystem for The Djurum desert: daily rolls
  for temperature and wind conditions; extra ration consumption from extreme heat
  and pushed mounts; hourly heat damage in inferno; halved movement and harder navigation
  checks in driving wind; travel prohibition in sandstorms; and day vs night encounter
  intervals and visibility.'
