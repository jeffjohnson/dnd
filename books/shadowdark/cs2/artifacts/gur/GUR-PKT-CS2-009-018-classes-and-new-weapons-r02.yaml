page_attribution_basis: >-
  Ten pages resolve through the Pandoc AST. Pages 11, 13, and 18 are empty fenced
  Divs carrying .full-page-artwork under contracts/SOURCE_MARKDOWN.md 1.9 and DEC-2026-0108.
  Pages 9, 10, 12, 14, 15, 16, and 17 carry standard page markers. No malformed page
  markers exist.

page_class_treatment: >-
  Pages 11, 13, and 18 carry steward-declared .full-page-artwork classes. Under
  SOURCE_MARKDOWN 1.9, each class is page-local intake metadata and creates no graph node,
  edge, or uncovered-page obligation. All three are preserved in packet composition metadata.

scope_boundary: >-
  The bounded scope covers printed pages 9 through 18 of Cursed Scroll 2: Red Sands,
  comprising Characters introduction (pg 9), Desert Rider class and talents (pg 10-11),
  Pit Fighter class and talents (pg 12-13), Ras-Godai class, talents, and Black Lotus
  talents (pg 14-15), Class Titles tables (pg 16), New Weapons table and properties (pg 17),
  and full-page artwork (pg 18).

source_summary: >-
  Presents three character classes suited for the Red Sands desert setting: Desert Rider
  (mounted combatant), Pit Fighter (arena brawler with survival abilities), and Ras-Godai
  (sorcerous desert assassin empowered by black lotus), along with their talent tables,
  alignment titles, and a table of new weapons with specialized weapon properties.

