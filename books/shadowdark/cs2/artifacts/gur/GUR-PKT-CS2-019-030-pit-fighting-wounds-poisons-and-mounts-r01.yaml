scope_boundary: 'The bounded scope covers printed pages 19 through 30 of Cursed Scroll 2: Red Sands, comprising Gameplay introduction
  (pg 19), Pit Fighting rules, venue, stakes, and twists (pp 20-21), Pit Fighting Encounters tables (pp 22-23), Thraxis Arena
  setting and crowd table (pg 24), artwork (pg 25), Enduring Wounds subsystem and table (pg 26), Poisons subsystem and table
  (pg 27), Mounts rules, slots, travel, morale, and rations (pg 28), Mounts, personality, and gear tables (pg 29), and artwork
  (pg 30).'
source_summary: 'Presents regional gameplay subsystems and lookup tables for Cursed Scroll 2: Red Sands: downtime pit fighting
  with venue, stakes, and encounter generation; severe enduring wounds upon surviving zero HP; poison usage risks and varieties;
  and comprehensive mount mechanics covering gear capacity, overland push travel, combat morale, and mount equipment.'
