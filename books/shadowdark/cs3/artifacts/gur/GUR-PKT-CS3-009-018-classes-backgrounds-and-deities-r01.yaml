  adhering to contracts/SOURCE_MARKDOWN.md 1.9 and DEC-2026-0108. Pages 9, 10, 12,
  13, 14, 15, 16, and 17 carry standard block-level page markers.

page_class_treatment: >-
  Pages 11 and 18 carry steward-declared page classes (.full-page-artwork). Under
  SOURCE_MARKDOWN 1.9, this class is page-local intake metadata and creates no
  graph node, edge, or uncovered-page obligation. Both are preserved in packet
  composition metadata.

scope_boundary: >-
  The bounded scope covers printed pages 9 through 18 of Cursed Scroll 3: Midnight
  Sun, comprising character classes (Sea Wolf, Seer), class talent tables, spell
  progression and penance tables, alignment titles, Nord backgrounds and names,
  and the Old Gods.

source_summary: >-
  Presents character options suited for the Isles of Andrik setting: Sea Wolf (fierce
  berserker and shield maiden raiders aligning with the Old Gods) and Seer (baleful
  diviners using runes and stars to bend fate and cast seer spells), their talent
  and title tables, Seer spell progression and penance tables, Nord backgrounds
  and names, and the pantheon of the Old Gods (Odin, Freya, Loki).

