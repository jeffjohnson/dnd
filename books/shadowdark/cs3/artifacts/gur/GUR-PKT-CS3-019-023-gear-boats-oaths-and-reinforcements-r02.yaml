scope_boundary: >-
  The bounded scope covers printed pages 19 through 23 of Cursed Scroll 3: Midnight
  Sun, comprising gameplay rules, new weapons and armor, boat mechanics and boat
  statistics, sacred oaths before the Old Gods, and gauntlet 0-level character
  reinforcements.

source_summary: >-
  Presents gameplay mechanics for the Isles of Andrik setting: new weapons (handaxe,
  stave) and armor (round shield) with properties including sundering, boat travel
  rules and naval vessel statistics table, sacred oaths and consequence tables,
  and gauntlet replacement arrival table for fallen 0-level characters.

