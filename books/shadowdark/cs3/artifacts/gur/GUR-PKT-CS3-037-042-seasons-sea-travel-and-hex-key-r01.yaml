source_summary: >-
  Introduces northern regional environmental subsystems for sea travel and seasons
  in the Isles of Andrik, including daylight variations, sea travel hazard intervals,
  and wind conditions/effects on boats and navigation, followed by narrative hex key
  vignettes across the archipelago.

