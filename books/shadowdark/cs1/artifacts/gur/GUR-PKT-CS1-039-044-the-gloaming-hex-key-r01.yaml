null_extraction_declaration: >-
  This GUR proposes no candidate node, no candidate edge, no candidate general rule, and no domain.
  That is a property of the source material, which consists exclusively of narrative hex location
  descriptions (Hex 102 through Hex 1607) for The Gloaming hex crawl adventure setting. Every page
  was read in full and every element that named a game concept was considered against the core test
  and rejected for a stated reason; those rejections are enumerated in rejected_candidates.
  The handoff is the ordinary Builder handoff and the status is the ordinary proposed. The Analyst
  did not use the terminal withdrawal form, which ARTIFACT_LIFECYCLE reserves for a GUR whose source
  scope a later packet wholly supersedes; nothing supersedes this packet and it is not withdrawn.
page_attribution_basis: Six pages resolve through Pandoc AST. Pages 39, 40, 41, 42, 43, and 44 carry standard page markers. No malformed page markers exist.
page_class_treatment: All pages carry standard layout elements. No steward-declared page classes are present.
