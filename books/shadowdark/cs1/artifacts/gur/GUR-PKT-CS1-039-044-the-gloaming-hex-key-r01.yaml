rejected_candidates:
  - text_locus: 'HEX 209. TROLL CAVE, p40'
    quoted_gist: 'Rot-Ruin, +1 longsword that can rust one door-sized piece of metal into powder once a day'
    why_considered: 'Names a specific magic weapon with a mechanical bonus and once-per-day ability.'
    rejection_reason: 'Unique adventure-site treasure, not a general ruleset mechanic or reusable equipment option. The core test rejects site-specific adventure items from the general rules graph.'
  - text_locus: 'HEX 807. STONE CIRCLE, p41'
    quoted_gist: 'One minute of time that passes inside this low circle of stones is actually an hour on the outside. Kytheros grants a random patron boon to those who lay the slain six-eyed wolf inside the circle.'
    why_considered: 'Mentions time distortion and granting a random patron boon from Kytheros.'
    rejection_reason: 'Adventure-site trigger referencing tbl_kytheros_boons (which is already registered in canonical). The site-specific trigger does not alter the general rule of patron boons or the table structure.'
  - text_locus: 'HEX 1002. MUSHROOM GROVE, p42'
    quoted_gist: 'Any person who sees the entire play gains a random boon from Titania (once per person).'
    why_considered: 'Mentions granting a random patron boon from Titania.'
    rejection_reason: 'Adventure-site trigger referencing tbl_titania_boons (already registered in canonical). Site-specific narrative trigger does not alter general patron mechanics.'
  - text_locus: 'HEX 1308. MYRE CASTLE RUINS, p43'
    quoted_gist: 'Emerald Blade, +2 bastard sword that allows its wielder to speak to wild animals'
    why_considered: 'Names a unique magic weapon.'
    rejection_reason: 'Unique adventure-site treasure, not a general ruleset mechanic or equipment item.'
  - text_locus: 'HEX 1401. ANCIENT CAIRN, p43'
    quoted_gist: 'Ynnith, +1 staff of knotted oak that can summon an obedient giant owl for 5 rounds once a day'
    why_considered: 'Names a unique magic staff.'
    rejection_reason: 'Unique adventure-site treasure, not a general ruleset mechanic.'
  - text_locus: 'HEX 1403. THE MUD PIT, p43'
    quoted_gist: 'Wand of Moonbeam that any spellcaster can wield, twitches when a lycanthrope is within near distance'
    why_considered: 'Names a specific wand item.'
    rejection_reason: 'Adventure treasure item with site-specific flavor, not a general item table entry.'
  - text_locus: 'HEX 1409. WOLF CAVE, p44'
    quoted_gist: 'Anyone who leaves a worthy offering of flesh for it gains a random patron boon from Almazzat (once per person).'
    why_considered: 'Mentions granting a random patron boon from Almazzat.'
    rejection_reason: 'Adventure-site trigger referencing tbl_almazzat_boons (already registered in canonical). Site-specific narrative trigger.'
  - text_locus: 'HEX 1510. CORRUPTED HENGE, p44'
