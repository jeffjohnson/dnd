    why_considered: 'Environmental effect on spellcasting.'
    rejection_reason: 'Narrative hazard localized to a single hex adventure site, without formal DC or general mechanical formula.'
non_edge_observations:
  - id: OBS-01
    subject: packet comprises adventure sites and hex descriptions without general subsystems
    detail: >-
      Unlike CS2 where the hex section was preceded by a general desert travel subsystem (Travel in the Sands),
      CS1 pages 39-44 transition directly from witch spells to The Gloaming hex key. The regional random encounter
      and rumor tables were placed on pages 2-5 and integrated in Packet 1. Pages 39-44 consist entirely of hex site
      vignettes and lore.
