completeness_statement: >-
  All six printed pages (39-44) in the declared span were read in full. Hexes 102 through 1607 were analyzed
  against the core test. Magic items and patron boon triggers found in adventure sites were evaluated and
  properly rejected in rejected_candidates as site-specific adventure content. No general mechanics, tables,
  or classes are introduced.
