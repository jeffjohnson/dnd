  obligation. It is preserved in packet composition metadata.

scope_boundary: >-
  The bounded scope covers printed pages 9 through 20 of Cursed Scroll 1: Diablerie!,
  comprising the character classes (Knight of St. Ydris, Warlock, Witch), class talent tables,
  spellcasting progression tables, class alignment titles, patrons and patron boons tables,
  and diabolical backgrounds.

source_summary: >-
  Presents three dark fantasy character classes suited for the Gloaming forest setting:
  Knight of St. Ydris (unholy warrior using demonic possession and witch spells), Warlock
  (pact-maker gaining eldritch gifts from patrons), and Witch (hex-caster aided by a familiar),
  along with their talent tables, title progressions, patron boon options, and diabolical
  character backgrounds.

