authored_polarity_declaration: >-
  Polarity for derived types (FEEDS_INTO, GATES, RESOLVED_BY) is derived mechanically
  under Graph Invariant 14. Polarity for MODIFIES and CONSTRAINS edges is read from
  source semantics. In accordance with user instructions and CS1 metadata, all candidate
  edges declare status: optional.

rejected_candidates:
  - text_locus: Full-page artwork, p13
    quoted_gist: Full-page illustration
    rejection_reason: Non-text artwork contains no ruleset mechanics.
  - text_locus: Flavor quotes and descriptions, pp9, 14, 17, 19
    quoted_gist: Flavor quotes by The Willowman and Shune the Vile
    rejection_reason: Atmospheric flavor text contains no graph-constitutable mechanics.

non_edge_observations:
  - id: OBS-01
    subject: Patron Boon Mechanics
    detail: >-
      Warlocks gain patron boons at 1st level and may choose to roll on their patron's
      boon table instead of the standard Warlock Talents table whenever gaining a talent roll.
      Captured via RESOLVED_BY edges from abil_patron_boon to individual patron boon tables.
