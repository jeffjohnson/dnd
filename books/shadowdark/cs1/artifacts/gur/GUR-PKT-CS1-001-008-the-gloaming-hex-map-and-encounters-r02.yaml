rejected_candidates:
  - text_locus: The Gloaming hex map description and hex coordinates, p2
    quoted_gist: Scale 1 hex = 6 miles; Forest, Marsh, Path, Water hex lists
    why_considered: Overland hex scale and terrain classifications
    rejection_reason: >-
      Map scale and specific hex coordinate lists are geographical setting data and
      cartographic description, not ruleset mechanics or general rules.
  - text_locus: Encounter table creature entries, p3
    quoted_gist: Wood trolls, Centaurs, Goblins, Will-o'-wisps, etc.
    why_considered: Individual monster and NPC names in encounter table rows
    rejection_reason: >-
      A creature's defining locus is its stat block in the monsters section. Mention
      in an encounter table does not define creature identity.
  - text_locus: Credits, art, fonts, legal, contents, and introduction, pp5-7
    quoted_gist: Front matter text and table of contents
    rejection_reason: Informational front matter contains no graph-constitutable mechanics.

non_edge_observations:
  - id: OBS-01
    subject: Two-stage encounter generation
    detail: >-
      The Gloaming encounters use a two-tier rolling structure: roll d8 on ENCOUNTER ZONE TABLE
      by terrain to determine creature category (Demon, Aquatic, Animal, People), then roll
      d8 on ENCOUNTERS TABLE under that category. Captured via FEEDS_INTO edge M002.
