page_attribution_basis: Eight pages resolve through Pandoc AST. Page 1 is an empty
  fenced Div carrying .front-cover, page 4 is an empty fenced Div carrying .blank-page,
  and page 8 is an empty fenced Div carrying .full-page-artwork, all adhering to contracts/SOURCE_MARKDOWN.md
