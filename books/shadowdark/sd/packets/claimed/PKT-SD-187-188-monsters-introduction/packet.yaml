expected_extraction_hazard: >-
  Flagged at claim for the extracting Analyst. This is a chapter opening of the same kind as
  PKT-SD-075-077, and that packet is the governing precedent rather than something to re-argue.
  Two traps in particular.
  First, the narrative bolds six words, measured: beast, eye, Ten-Eyed, sword, magic and
  charged. In the rules sections bold marks a defined term. Here it is prose emphasis, which
  PKT-SD-075-077 settled explicitly for the same shape of scene. Three of the six resemble
  mechanics closely enough to invite a row and none of them is one.
  Second, this is the monster chapter's opening and the registry still holds no monster_
  identity. The temptation is to mint one for the Ten-Eyed Oracle, which is named and
  capitalised. A creature's defining locus is its stat block, and this is fiction; the
  chapter's defining pages are later packets.
  A null extraction is the expected result and is not a failure to read. If it holds, enumerate
  every block with its locus and reason so the emptiness is auditable, and use the ordinary
  proposed status and Builder handoff rather than a withdrawal, since nothing supersedes this
  packet.

