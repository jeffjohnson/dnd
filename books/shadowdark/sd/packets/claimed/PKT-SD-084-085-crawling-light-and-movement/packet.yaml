content_shape_note: >-
  Recorded for the downstream reader, not as an extraction conclusion. The exploration chapter. Page 84 defines the crawling round, states that light is needed to see, gives the light-source timer rules, and defines total darkness and its consequences. Page 85 fixes the three distance bands and gives rules for climbing, falling, moving through creatures and swimming, then defines regrouping, discusses conditions and lists example crawling actions.

expected_extraction_hazard: >-
  Flagged at claim for the extracting Analyst. This is the defining locus for light sources, which the torch and lantern gear entries deferred to, and for the distance bands that the weapons table, several spells and the movement rule all invoke. Three identities it needs, the encounter and advantage and disadvantage, are proposed by sibling GURs published hours ago and are not yet canonical, so any use of them must be re-proposed here.

