content_shape_note: >-
  Recorded for the downstream reader, not as an extraction conclusion. A hex map generator with
  the same two-tier shape as the site generator on printed pages 130 and 131: four paragraphs of
  procedure and six tables, four rolled directly and two reached through a result.

expected_extraction_hazard: >-
  Flagged at claim for the extracting Analyst. Apply the two-tier shape settled on printed pages
  130 and 131 rather than flattening: the cataclysm table is reached only when the terrain result
  calls for it, and the settlement name table is indexed by the settlement sizes the points of
  interest table produces.
  Two existing identities matter here and must be read first. rule_danger_level already has one
  resolver from printed page 130, so this page table is its second and the keys must be checked.
  rule_hex is canonical from printed page 90 and is the unit this map generates terrain for; the
  two pages are forty-two printed pages apart and neither cross-references the other, so nothing
  but the shared identity connects them.
  Note that this danger level table gives four results including Safe, where the canonical rule
  has carried three since printed page 86 and the page 130 table gives only those three. The
  values are not identities and were twice declined as such, so record the variance rather than
  proposing one.
  The circular loop rule is precise and mechanical and is arithmetic on table positions.

