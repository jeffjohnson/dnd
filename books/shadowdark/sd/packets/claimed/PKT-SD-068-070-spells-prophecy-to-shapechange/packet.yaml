content_shape_note: >-
  Recorded for the downstream reader, not as an extraction conclusion. Ten spell entries in
  alphabetical sequence, each a heading followed by a tier and class line, a duration line, a
  range line, and effect prose. The shape matches the six spell packets already extracted.

expected_extraction_hazard: >-
  Flagged at claim for the extracting Analyst. This is the densest spell packet so far in
  cross-references to non-spell machinery. PROPHECY gates its own recasting on rule_penance,
  canonical since the class chapter. PROTECTION FROM EVIL and REBUKE UNHOLY both turn on
  alignment, and all three alignment identities are canonical, so the target selection is
  assertable rather than taxonomy-only. Several entries resolve through a check made against
  the caster's spellcasting check, which the Illusion settlement in
  REV-GUP-PKT-SD-062-065-r01-r01 requires be carried as two rows, the constraint and the
  threshold, not one.
  RESTORATION acts on curses, illnesses and afflictions and RESILIENT SPHERE on physical
  passage, for which no canonical identities exist. Every level bound, dice expression, DC and
  round count is a magnitude no field may store, and a condition must not spell one out in
  words either, including number words such as zero.

