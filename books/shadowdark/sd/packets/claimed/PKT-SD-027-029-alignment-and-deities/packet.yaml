content_shape_note: >-
  Recorded for the downstream reader, not as an extraction conclusion. Page 27 defines alignment and
  gives each of the three alignments its own heading and description. Pages 28 and 29 define deities,
  state that a priest must choose one god and that a deity can revoke a priest's spellcasting,
  describe three named groupings, and give eight entries their own headings, each tagged with an
  alignment. This is the defining locus for both the alignment and the deity mechanics.

packet_metadata_origin: analyst_derived_at_claim

analyst_status: >-
  Claimed and read in full, but blocked before extraction. No GUR is published for this packet_id.
  Shadowdark Constitution 1.2 section 2 provides no prefix under which an individual alignment or an
  individual deity identity can be formed, and the mechanically load-bearing content of these pages
  is expressed in terms of those individuals: a character chooses one of three alignments, each
  named deity is tagged with one alignment, and a priest must serve a god matching their own
  alignment. The Analyst is prohibited from minting a prefix. The question is escalated to the
  Architect; the GUR follows the Decision. This packet remains active Analyst work.
  This is deliberately the same course taken for PKT-SD-016-017-ancestries, which was claimed, read
  and held pending DEC-2026-0087 rather than extracted with improvised identities.

