marker_placement_note: >-
  Read this before citing anything in this packet. Only the first marker sits on a heading.
  p96 ends the EXAMPLE OF PLAY heading and behaves normally under placement rule 1. The three
  that follow are all trailing paragraph markers inside the dialogue: p97 ends the paragraph
  "GM: You're up, Ralina.", p98 ends the paragraph closing "and roll a natural 1.", and p99
  ends the paragraph "PCs (everyone): Oh no!".
  SOURCE_MARKDOWN acceptance test 2 assigns a trailing paragraph marker to the whole
  paragraph, so in each case the entire paragraph belongs to the new page and the persistence
  rule carries that page forward until the next marker. None of the three is the inline case
  that divides a paragraph, because in each the marker sits at the paragraph's end with no
  evidence after it. This is the second packet in a row whose page boundaries rest on
  paragraph rather than heading markers, after PKT-SD-094-095.
  p100 is a class-bearing marker on an empty Div, not a content marker.

