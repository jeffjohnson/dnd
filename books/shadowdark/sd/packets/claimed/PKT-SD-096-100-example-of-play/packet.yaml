content_shape_note: >-
  Recorded for the downstream reader, not as an extraction conclusion. A transcript of an
  imagined session: four named example characters explore a tomb, kick open a door, fight a
  jelly in a pool, lose their light, and revive a downed character. It is dialogue between a
  GM and players interleaved with italic narration of dice rolls, not rules text. A
  full-page-artwork page closes it.

expected_extraction_hazard: >-
  Flagged at claim for the extracting Analyst. The expected outcome here is a null extraction,
  and the hazard is the opposite of the usual one: this packet demonstrates a great many
  canonical rules in quick succession, so nearly every paragraph resembles something already
  in the graph and invites a row that would have no defining locus behind it.
  An example of play is not a defining locus. Where it illustrates a rule, that rule already
  has its own page and its own canonical rows, and restating it here would attach a second
  citation to an existing fact. Where the GM improvises, the text is explicitly a ruling in
  the moment rather than a rule, and two such improvisations here look deceptively like
  mechanics: a damage figure for a lit torch and an extinguish roll after using one. Neither
  is stated at the torch's own locus.
  The four named example characters pair canonical ancestries with canonical classes and are
  the most tempting candidates in the packet. They are fictional people, not rules.
  Every figure in the transcript is a magnitude, and none belongs anywhere near a field.

