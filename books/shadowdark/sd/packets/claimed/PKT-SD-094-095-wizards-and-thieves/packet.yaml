marker_placement_note: >-
  Read this before citing anything in GAMEPLAY. This packet has the first non-heading marker
  in the intake so far. p94 ends the WIZARDS AND THIEVES heading and behaves normally under
  placement rule 1. p95 does not sit on a heading: it is a trailing marker at the end of the
  paragraph beginning "No wizard or thief majority".
  SOURCE_MARKDOWN acceptance test 2 assigns a trailing paragraph marker to the whole
  paragraph, so that entire paragraph is printed page 95, not merely the text after the
  marker, and the persistence rule carries 95 forward to everything that follows. The GAMEPLAY
  section is therefore split across two printed pages: its first five outcome paragraphs are
  page 94 and its last three are page 95.
  This is not the inline case that divides a paragraph, because the marker is at the end
  rather than inside the sentence flow; no evidence sits after it within the paragraph.

