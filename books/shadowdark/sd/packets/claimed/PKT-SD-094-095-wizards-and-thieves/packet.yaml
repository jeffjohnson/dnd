content_shape_note: >-
  Recorded for the downstream reader, not as an extraction conclusion. A self-contained dice
  betting minigame with its own turn structure, its own win and loss conditions, and four
  flavour tables of things that may be wagered. It is offered as a substitute for resolving a
  wager with a stat check.

expected_extraction_hazard: >-
  Flagged at claim for the extracting Analyst. The yield here will be low and that is the
  correct outcome rather than a gap. Almost all of this content is the minigame's internal
  procedure: declaring, rolling, cancelling dice, moving coins between players and the pot.
  Those relations are between parts of the minigame itself and have no canonical counterpart,
  and the amounts are all magnitudes no field may store. The genuine connections to the wider
  ruleset are few: the game consumes coin, coin bounds participation, and the game is offered
  as a substitute for a stat check.
  The four stakes tables are flavour prompts rather than mechanics; the entries name things
  with no identity, including a magic item.
  PKT-SD-091-093, already integrated, points to printed page 94 from its carousing section and
  deliberately did not assert that reference because this identity did not yet exist. The
  reference is not assertable from here either, because the sentence that makes it lies in that
  packet's bounded scope. It needs a successor there.
  Note also that the marker on page 95 is a trailing paragraph marker rather than a heading
  marker; see marker_placement_note.

