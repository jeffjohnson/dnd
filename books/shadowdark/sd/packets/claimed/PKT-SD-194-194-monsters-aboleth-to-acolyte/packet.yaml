expected_extraction_hazard: >-
  Flagged at claim for the extracting Analyst, and this is the packet the DEC-2026-0105
  escalation was raised in anticipation of.
  Constitution 2.5 states plainly that a stat-block description never creates an identity, edge,
  property store or completeness obligation, and the sentence is not limited to the eight named
  fields it lists as examples; its word is including, not limited to. Test every named ability
  against that sentence before writing anything. Curse, Enslave, Telepathic and Healing Touch
  are each printed under one creature's own block, not in the shared Monster Attributes page,
  which is the distinction that separated abil_dark_adapted from ordinary stat-block content at
  printed page 189: that ability was shared across a whole class of creatures at its own locus,
  not stated once under a single stat block.
  A creature's own identity is not the same question as its individual values. The chapter has
  consistently held that a creature's defining locus is its stat block; this page is that locus
  for two creatures. Whether to register them without any edge in this packet, and on what
  authority, needs its own stated reasoning rather than following the pattern of every prior
  tbl_/rule_ registration, which always paired with an edge in the same packet.
  Do not let the abundance of appended shared-system context produce a row that belongs to
  another packet's defining locus. The spellcasting, movement and morale rules are all already
  canonical from their own pages.

