expected_extraction_hazard: >-
  Flagged at claim for the extracting Analyst. Expect registry additions and no edges, the third
  such packet in a row, and apply the disposition settled as IDQ-01 of PKT-SD-118-119 rather than
  reopening it.
  There is a candidate parent for these tables in the book and it is already rejected: the
  ADVENTURES section on printed page 106 defines an adventure and a campaign, and PKT-SD-101-109
  rejected both because nothing in the ruleset reads whether the characters are on an adventure.
  Minting an adventure identity here would reverse that judgement from the wrong locus, since
  page 106 defines an adventure and page 122 only rolls for one.
  The cells are phrase fragments rather than sentences, so the name-collision measurement will
  return a low count; a low count is not evidence that nothing was missed, since the search is
  blind to abbreviated references.

