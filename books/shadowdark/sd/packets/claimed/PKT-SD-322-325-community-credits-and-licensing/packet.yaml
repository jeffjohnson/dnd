packet_wrapper_note: >-
  The supplied file opens with an intake wrapper: a level-one heading naming the packet, a Source
  line giving a shadowdark.md line range, a note that original wording and page markers are
  preserved, and the section heading Primary Source Material. The marker linter reports this as
  content preceding the first marker with no resolved page, and its second finding names the remedy
  the contract provides.
  This manifest is that remedy. SOURCE_MARKDOWN Attribution Rules states that content before the
  first applicable marker has no resolved page unless packet metadata supplies an independent
  authoritative page locator, and the sd extraction profile lists informational_frontmatter as a
  known hazard of this book. The unattributed text was extracted from the parser and checked rather
  than assumed: it consists solely of the wrapper sentences listed above and contains no rulebook
  prose, no heading belonging to the source, and no marker. No source content is stranded, so the
  wrapper is intake metadata rather than an unresolved source defect, and the condition is identical
  in kind to the packets already claimed from this intake.
  Under SOURCE_MARKDOWN 1.8 the page-322 classification does not waive an unrelated source defect.
  This wrapper is not being treated as waived by the classification; it is separately assessed here
  and found to be metadata rather than a defect.

