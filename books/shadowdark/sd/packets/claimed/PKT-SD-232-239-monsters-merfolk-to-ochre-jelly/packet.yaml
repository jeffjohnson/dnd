leading_content_page_resolution: >-
  Read this before citing Merfolk or Mimic. The Primary Source Material opens with the MERFOLK
  heading, which carries no marker; the first marker in the section is p233 on the MINOTAUR
  heading. SOURCE_MARKDOWN Attribution Rules state that content before the first applicable
  marker has no resolved page unless packet metadata supplies an independent authoritative page
  locator. This manifest supplies one, structural rather than estimated.
  A page's first heading carries that page's marker; a heading with no marker continues the
  preceding page under the persistence rule. MERFOLK and MIMIC carry no marker, so they continue the
  page before p233. That page's identity is fixed independently by the p232 marker inside
  PKT-SD-229-232-monsters-kraken-to-medusa, whose claimed manifest records page_end 232
  and whose final entry, Medusa, immediately precedes Merfolk in the source's
  alphabetical monster sequence. Merfolk and Mimic are therefore printed page 232. No page length was
  estimated and no line number was used to derive this.

shared_page_note: >-
  Flagged for the Reviewer. Printed page 232 is covered by two packets:
  PKT-SD-229-232-monsters-kraken-to-medusa holds the entries up to Medusa and this
  packet holds Merfolk and Mimic. The split falls inside a printed page rather than on its boundary.
  This does not breach the zero-overlap rule, which bars claiming the same source content, not
  citing the same printed page. No heading or sentence is claimed twice.

