leading_content_page_resolution: >-
  Read this before citing Cave Creeper. The Primary Source Material opens with the CAVE CREEPER
  heading, which carries no marker; the first marker in the section is p201 on the CENTAUR
  heading. SOURCE_MARKDOWN Attribution Rules state that content before the first applicable
  marker has no resolved page unless packet metadata supplies an independent authoritative page
  locator. This manifest supplies one, structural rather than estimated.
  A page's first heading carries that page's marker; a heading with no marker continues the
  preceding page under the persistence rule. CAVE CREEPER carries no marker, so it continues the
  page before p201. That page's identity is fixed independently by the p200 marker inside
  PKT-SD-198-200-monsters-bat-swarm-to-cave-brute, whose claimed manifest records page_end 200
  and whose final entry, Cave Brute, immediately precedes Cave Creeper in the source's
  alphabetical monster sequence. Cave Creeper is therefore printed page 200. No page length was
  estimated and no line number was used to derive this.

shared_page_note: >-
  Flagged for the Reviewer. Printed page 200 is covered by two packets:
  PKT-SD-198-200-monsters-bat-swarm-to-cave-brute holds the entries up to Cave Brute and this
  packet holds Cave Creeper. The split falls inside a printed page rather than on its boundary.
  This does not breach the zero-overlap rule, which bars claiming the same source content, not
  citing the same printed page. No heading or sentence is claimed twice.

