expected_extraction_hazard: >-
  Flagged at claim for the extracting Analyst. The governing test remains the one settled at
  PKT-SD-194-194 and confirmed across the three following packets. Three abilities on this page
  resemble a canonical spell closely enough to need the resemblance tested rather than assumed:
  Cloaker's Phantoms resembles Mirror Image's duplicate mechanic, Couatl's Change Shape resembles
  Shapechange, and Couatl's own Poison resembles Sleep. None is marked with this book's italic
  reference convention; apply the same test already settled for Void Step against Teleport.
  Two abilities reach an existing canonical identity by abbreviation rather than by full word,
  the same shape as ADV on Bugbear's Stealthy: Cloaker's Screech states DISADV, which no scan
  catches because the registry label is Disadvantage in full; find it by reading. Fearless and
  Toxin/Poison both reach rule_morale and no condition identity respectively, continuing the
  precedent from the two preceding packets.
  Crab, Giant's Crush shares a name with the Bears' Crush from two packets ago but states a
  wholly different effect, a save-or-damage rather than an extra-die-on-double-hit; confirm
  before assuming either reading carries over.
  Every quantity on the page is a magnitude and no field may store one.

