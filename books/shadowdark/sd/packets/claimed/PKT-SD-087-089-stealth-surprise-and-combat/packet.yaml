content_shape_note: >-
  Recorded for the downstream reader, not as an extraction conclusion. Dense procedural rules
  text rather than entry lists: three printed pages covering stealth, surprise, the combat
  round, the action menu, damage and critical hits, terrain, morale and death. This is the
  first non-spell packet in seven and the first rules-procedure packet since the resting page.

expected_extraction_hazard: >-
  Flagged at claim for the extracting Analyst, and this packet has more restatement hazard
  than any so far. Several of its rules are already canonical from their own defining loci
  elsewhere in the book, and restating them would collide or near-duplicate: COMBAT TURNS
  restates the turn, action and movement relations defined on printed page 8; COMBAT
  INITIATIVE restates the initiative relations defined on printed page 83; CAST A SPELL
  cross-references the spellcasting action cost defined on printed page 44; and DAMAGE
  restates the damage-to-hit-points relation defined on printed page 9. Every planned row must
  be checked against the canonical edge set, and a rule whose defining locus is elsewhere
  should not be re-asserted here merely because this page repeats it.
  MORALE is significant beyond this packet. It is the defining locus for enemies fleeing, which
  is the outcome two already-integrated spells, Rebuke Unholy and Turn Undead, could not carry
  for want of an identity. Proposing it here does not by itself connect those spells; that
  needs successors for their own packets.
  Every DC, die expression, hit point threshold and fraction is a magnitude no field may store,
  and a condition must not spell one out in words either.

