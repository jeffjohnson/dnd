marker_note: >-
  This is the second packet in the intake whose page break falls inside a table. The p142 marker
  sits on the ARCTIC heading under placement rule 1. The p143 marker sits in the last cell of
  the row keyed 46-47, and SOURCE_MARKDOWN acceptance test 3 applies a table-row marker to the
  whole row, so that row is page 143 and the persistence rule carries 143 to every row after
  it. Rows before it are page 142. The same form was met and resolved in PKT-SD-118-119.

packet_wrapper_note: >-
  The supplied file opens with an intake wrapper naming the packet and a shadowdark.md line
  range ahead of the Primary Source Material heading. The unattributed text contains no
  rulebook prose, heading or marker.

supporting_source_context: >-
  Present and out of scope, and larger than usual. Two passages are appended, the random
  encounter procedure from printed pages 112 and 113 and the monster attributes page from 189.
  Both have their own primary packets, the first integrated and the second unclaimed. Neither
  is an extraction surface here and no row may cite either.

scope_boundary: >-
  The bounded scope is the Primary Source Material section as resolved by the Pandoc AST, so
  the zero-overlap rule across the intake holds. This matters more than usual for this packet
  because the appended random encounter procedure is the very rule the in-scope table resolves,
  and it would be easy to extract from the context rather than from the page.

content_shape_note: >-
  Recorded for the downstream reader, not as an extraction conclusion. One named table of fifty
  rows keyed to a hundred-sided roll, and no prose at all. The first of twenty-two packets of
  this shape.

expected_extraction_hazard: >-
  Flagged at claim for the extracting Analyst, and written for the chapter rather than for this
  packet alone, because whatever is settled here will be applied twenty-one more times.
  The page states no procedure of its own. The table's own title names encounters, and
  rule_encounter is canonical from printed page 112 with two resolvers already, so the question
  is whether this table is a third resolver of that rule rather than whether a new procedure
  identity exists. This is the opposite of the situation on printed page 138.
  Most cells name creatures, and the monster chapter is unextracted, so almost the whole table
  is unextractable for that reason alone. Do not propose monster identities from an encounter
  result.
  A naive search of the cells against the registry returns many matches that are ordinary
  English rather than references, dying, falling, distance, round, giant, human, dwarf, armor.
  Count them and discard them explicitly rather than filtering by eye.
  Two cells state damage with a die and a cadence, and two concern traps, and one names the
  rival crawler generator. Those are the candidates worth testing.
  Every quantity in the table is a magnitude and no field may store one.
  The hex terrain table on printed page 132 lists terrain features that correspond to the
  terrain names of this chapter's packets. That correspondence is real and is not assertable
  from this page, which never mentions hexes, terrain selection or overland travel.

