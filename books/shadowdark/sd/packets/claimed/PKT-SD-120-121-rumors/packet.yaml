marker_placement_note: >-
  The second table-row marker in the intake and the same shape as the first. p120 ends the
  RUMORS heading and behaves normally under placement rule 1. p121 sits at the end of the last
  cell of one table row, the one about three thieves pulling off a gemstone heist. Under the
  SOURCE_MARKDOWN Attribution Rules a table-row marker applies to the row as a unit even when
  the cited evidence is in a cell before it, and acceptance test 3 requires a last-column table
  marker to be assigned to the whole row, so that entire row is printed page 121 and persistence
  carries 121 to every row below.
  The marker is buried mid-table, so reading headings alone would miss the page boundary.

