content_shape_note: >-
  Recorded for the downstream reader, not as an extraction conclusion. Structurally identical to
  PKT-SD-118-119: a heading and a d100 table of narrative prompts spanning two printed pages,
  with no prose. Each result is an adventure hook for the GM to use or discard.

expected_extraction_hazard: >-
  Flagged at claim for the extracting Analyst. Expect a registry addition and no edges. The
  question of whether to register an unattached table was settled as IDQ-01 of PKT-SD-118-119 in
  favour of registering, so apply that disposition rather than reopening it.
  There is no prose, so no rule for the table to be RESOLVED_BY, and no canonical rule names it.
  The name-collision temptation is larger here than on any previous page: many prompts mention
  things the graph holds, including deities by abbreviated name and a canonical minigame.
  Measuring the collisions programmatically is cheaper and more convincing than meeting them one
  result at a time.
  The page boundary is a table-row marker buried mid-table; see marker_placement_note.

