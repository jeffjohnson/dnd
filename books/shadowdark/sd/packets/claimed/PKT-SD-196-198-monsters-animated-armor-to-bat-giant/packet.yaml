content_shape_note: >-
  Recorded for the downstream reader, not as an extraction conclusion. Measured from the AST: 12
  creature headings, no family-level heading above them unlike the Angels packet, no table. Each
  creature carries zero to six named abilities; Archmage carries the most, six, each tagged INT
  Spell.

expected_extraction_hazard: >-
  Flagged at claim for the extracting Analyst. The governing test is the one settled at
  PKT-SD-194-194 and confirmed at PKT-SD-195-195: a stat-block description is excluded under
  constitution 2.5 regardless of what it references, because the boundary is locus, not content.
  Apply it individually to every one of the roughly sixteen named abilities across twelve
  creatures; do not let the volume produce a page-level shortcut.
  Several abilities name an existing canonical identity directly and should be checked against
  the Bless precedent rather than extracted on sight: a rage ability states immunity to morale
  checks, an execute ability triples damage against a surprised target, an ambush ability adds
  damage when undetected. Each references a real shared mechanic and each is still one
  creature's own limited ability, printed once under its own block.
  Several abilities are tagged INT Spell with their own name, DC and effect, including one
  tagged Focus and one that moves creatures a long distance. None of these names a canonical
  spell_ identity directly; test each against its own defining locus rather than its resemblance
  to Levitate, Teleport or another named spell.
  One ability's name itself resembles a canonical item, mithral armor; a name collision is not a
  reference, and the ability states no use of the item.
  Every quantity on the page is a magnitude and no field may store one.

