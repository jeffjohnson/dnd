  rulesets/shadowdark/registries/books.yaml. The page range is the Primary Source Material span
  the Pandoc AST resolves. The slug follows the packet own top-level source heading, DESERT,
  per contracts/FILE_NAMING.md; the incoming filename prefixes it with the chapter word, which
  the heading does not.

