content_shape_note: >-
  Recorded for the downstream reader, not as an extraction conclusion. Ten spell entries in
  alphabetical sequence, each a heading followed by a tier and class line, a duration line, a
  range line, and effect prose. The shape matches the seven spell packets already extracted.

expected_extraction_hazard: >-
  Flagged at claim for the extracting Analyst. TURN UNDEAD is already canonical as
  spell_turn_undead, registered from the priest class chapter on printed page 20 where it
  carries a class-access gate and a spells-known exclusion. It must be reused, not re-proposed,
  and its own mechanics are asserted here for the first time. The other nine entries are new.
  TURN UNDEAD is structurally identical to REBUKE UNHOLY in the preceding packet: a check
  against the caster's spellcasting check, destruction on a severe failure within a level
  bound, flight otherwise. The Review of that packet withheld approval because the lethal
  outcome was not carried to rule_death, so that row must be present here at extraction, and
  the flight outcome remains unrepresentable for want of an identity.
  SPEAK WITH DEAD conditions an effect on recasting within a stated span of time. A condition
  must name the circumstance and must not restate the quantity in digits or in words.
  Several entries act on things with no canonical identity: muted sound and deafness, weight,
  teleportation sigils, and a summoned creature's control state.

