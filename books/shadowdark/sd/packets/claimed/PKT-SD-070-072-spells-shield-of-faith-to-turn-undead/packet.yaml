leading_content_page_resolution: >-
  SHIELD OF FAITH opens the Primary Source Material and carries no marker; the first marker in
  the section is p71 on the SILENCE heading. SOURCE_MARKDOWN Attribution Rules give such
  content no resolved page unless packet metadata supplies an independent authoritative page
  locator, and this manifest supplies one on the same structural basis used for the two
  preceding packets and accepted in both.
  A page's first heading carries that page's marker throughout this intake, and a heading with
  no marker continues the preceding page under the persistence rule. SHIELD OF FAITH carries no
  marker, so it does not begin a page and continues the page before p71. That page's identity
  is fixed independently of this file by the p70 marker inside PKT-SD-068-070, whose claimed
  manifest records page_end 70 and whose final entry, SHAPECHANGE, immediately precedes SHIELD
  OF FAITH in the source's alphabetical spell sequence.
  No page length was estimated and no line number was used to derive this.

shared_page_note: >-
  Printed page 70 is covered by two packets: PKT-SD-068-070 holds its earlier entries and this
  packet holds SHIELD OF FAITH. This is the third mid-page split in the intake after pages 62
  and 65, so the shape is routine rather than exceptional. It does not breach the zero-overlap
  rule, which bars two packets from claiming the same source content, not from citing the same
  printed page. No line, heading or sentence is claimed twice.

