content_shape_note: >-
  Recorded for the downstream reader, not as an extraction conclusion. Six NPC generation tables
  with no prose at all. Two of them, ancestry and alignment, produce results that are already
  canonical identities; the other four produce descriptive bands or narrative phrases.

expected_extraction_hazard: >-
  Flagged at claim for the extracting Analyst. This packet should break the registry-only run of
  the last three, and the reason is a real distinction rather than a change of approach: two of
  these six tables resolve to axes the graph already holds.
  Canonical carries six RESOLVED_BY rows from a sys_ axis to a random table, all from printed
  pages 40 and 41 and all at status optional. Those must be read before extraction, because they
  fix both the shape and the status question for the ancestry and alignment tables here.
  Do not assert one row per table result. Nine of the results are canonical identities by name,
  but a row per member would embed the tables weighting, which is a magnitude, and the axis rows
  already carry the relationship; the page 40 and 41 precedent takes one row per axis.
  Age and wealth bands are named and enumerated but carry no mechanical content, which is the
  treasure-quality shape already declined on printed page 117.
  Status is genuinely open: the page states no alternative to rolling, unlike random character
  generation, so core is arguable against the optional precedent. Record the reasoning either way.

