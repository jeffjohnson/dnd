content_shape_note: >-
  Recorded for the downstream reader, not as an extraction conclusion. A settlement generator
  with the same two-tier shape as the site generator on printed pages 130 and 131 and the hex
  generator on 132 and 133: seven paragraphs of procedure and eleven tables, three rolled
  directly and eight reached through a district result.

expected_extraction_hazard: >-
  Flagged at claim for the extracting Analyst. Apply the two-tier shape rather than flattening.
  The eight district tables are reached only through a result on the settlement districts table,
  which is the same relation the map contents tables carry on printed page 131.
  Three existing identities matter here and must be read first. sys_alignment already carries
  four resolvers, so this page table is a fifth and the keys must be checked. rule_danger_level
  is the identity the chaotic-settlement direction writes into, and the value Risky is not an
  identity and was twice declined as such. rule_encounter is the consumer and is already reached
  from rule_danger_level in canonical, so a second path must not be asserted merely to restate it.
  The settlement type table supplies both the number and the size of the dice that are read
  against the districts table, so it bounds which districts a small settlement can produce; that
  is one relation, not two.
  The page directs the reader to taverns on printed page 136 and shops on printed page 138.
  Neither identity is canonical and both are the subject of unclaimed packets, so those pointers
  cannot be asserted in this revision and must be recorded as owed.
  The outline, seat-of-government and district-separation directions are arithmetic on the
  physical artefact, like the dice scattering on printed page 130 and the circular loop on 132.

