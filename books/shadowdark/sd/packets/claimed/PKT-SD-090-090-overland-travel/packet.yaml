  Recorded for the downstream reader, not as an extraction conclusion. One printed page of
  procedural rules with one small table, covering travel time and encounter cadence, light
  duration outdoors, travel rates by method, navigation, and deprivation of food and water.
  The page opens by stating that these rules add to the crawling rules rather than replacing
  them.

expected_extraction_hazard: >-
  Flagged at claim for the extracting Analyst. The restatement hazard is high and specific:
  rule_danger_level FEEDS_INTO rule_encounter with aspect check cadence is already canonical
  from printed page 86, and this page states the same relationship with different intervals.
  Re-asserting it would collide exactly. The overland cadence must be carried from the
  overland rule itself if it is carried at all.
  This page also cross-references Time Passes on printed page 82 explicitly, which is a
  CROSS_REFERENCES row rather than a reason to restate that rule. rule_terrain became
  canonical only in the immediately preceding packet and its difficult and arduous rows here
  are the table's, not a new terrain rule.
  The registry must be read in full rather than keyword-searched. Missing an existing identity
  cost a required row on the previous packet.
  Every interval, hex count, mile figure, die expression and deprivation period is a magnitude
  no field may store, and the table's halved rate must not reach a field either.

