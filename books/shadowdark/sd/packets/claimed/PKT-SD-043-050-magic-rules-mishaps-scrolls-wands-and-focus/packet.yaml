scope_boundary: >-
  The bounded scope is the Primary Source Material section, printed pages 43 through 50 as resolved
  by the Pandoc AST. Notably, these are the very pages that four earlier packets reproduced as their
  own Supporting Source Context and that this Analyst deliberately declined to read as evidence at
  the time. This packet is where they are in scope.

content_shape_note: >-
  Recorded for the downstream reader, not as an extraction conclusion. This is the magic chapter and
  it is the densest rules material in the intake after the equipment chapter: how a spell is cast and
  against what difficulty, what happens on success, failure, a critical success and a critical
  failure, the penance a priest owes and the mishap a wizard rolls, how scrolls and wands cast spells
  and how they are expended or destroyed, and the five spell attributes including focus.
  It is the defining locus for several mechanics that five earlier packets referred to without being
  able to define, notably the spellcasting check itself, the spell tier, and the focus duration.

