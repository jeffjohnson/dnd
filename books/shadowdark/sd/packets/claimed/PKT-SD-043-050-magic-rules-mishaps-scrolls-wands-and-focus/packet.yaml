missing_input_impact: >-
  Material and larger than at any earlier claim. The canonical graph now holds 142 registry rows and
  225 edges, and almost every endpoint this packet needs is already canonical, including the
  spellcasting check, both spell families, both casting stats, the difficulty class, resting, damage,
  the turn, the spell scroll, the deity and alignment axes and the talents mechanic. A registry slice
  would therefore carry substantial content and an absent local neighborhood means redundancy and
  contradiction checks must be made directly against the canonical files. The Analyst will read
  rulesets/shadowdark/registries/nodes.csv and the canonical edge set at extraction and reuse rather
  than propose. This assessment must be re-made before extraction.
