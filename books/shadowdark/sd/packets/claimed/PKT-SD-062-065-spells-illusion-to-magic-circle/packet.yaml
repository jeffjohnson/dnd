expected_extraction_hazard: >-
  Flagged at claim for the extracting Analyst. This is the first spell packet claimed since
  DEC-2026-0103 opened CLASSIFIED_AS and its implementation reached terminal Reviewer approval,
  so unlike PKT-SD-054-056 through PKT-SD-061-062 the tier and class line is extractable here and
  must not be left as an omission note. The four earlier spell packets still owe classification
  successors.
  Two further hazards. LIGHT produces illumination but is a spell, and DEC-2026-0104 authorizes
  only an item_ Light Source classification whose implementation has no independent Review yet,
  so no light-source row may be asserted for it. Several entries bound a target by level or by a
  check, and the numeric bound is a magnitude that no field may store.

