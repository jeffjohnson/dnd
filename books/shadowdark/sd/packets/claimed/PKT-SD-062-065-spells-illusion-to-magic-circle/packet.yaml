leading_content_page_resolution: >-
  Read this before citing ILLUSION. The Primary Source Material opens with the ILLUSION heading,
  which carries no marker; the first marker in the section is p63 on the INVISIBILITY heading.
  SOURCE_MARKDOWN Attribution Rules state that content before the first applicable marker has no
  resolved page unless packet metadata supplies an independent authoritative page locator. This
  manifest supplies one, and its basis is structural rather than estimated.
  Throughout this intake a page's first heading carries that page's marker; a heading with no
  marker continues the preceding page under the persistence rule. ILLUSION carries no marker, so
  it is not the first heading of a page and continues the page before p63. The identity of that
  page is fixed independently of this file by the p62 marker inside PKT-SD-061-062, whose claimed
  manifest records page_end 62 and whose final entry, HOLY WEAPON, immediately precedes ILLUSION
  in the source's alphabetical spell sequence. ILLUSION is therefore printed page 62.
  No page length was estimated and no line number was used to derive this.

shared_page_note: >-
  Flagged for the Reviewer because it is the first of its kind in this intake. Printed page 62 is
  covered by two packets: PKT-SD-061-062 holds the entries up to HOLY WEAPON and this packet holds
  ILLUSION. The operator's split falls inside a printed page rather than on its boundary.
  This does not breach the zero-overlap rule, which bars two packets from claiming the same source
  content, not from citing the same printed page. No line, heading or sentence is claimed twice.
  A page-scoped query will correctly return rows from both packets.

