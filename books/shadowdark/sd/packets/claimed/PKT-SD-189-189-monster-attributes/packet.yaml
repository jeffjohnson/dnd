expected_extraction_hazard: >-
  Flagged at claim for the extracting Analyst. This is the first page in the intake to state
  mechanics about monsters, and the identity questions are harder than the reading.
  Six of the eight subsections say only that monsters have an attribute the graph already holds:
  cbt_armor_class, rule_hit_points, cbt_attack_roll and cbt_damage_roll, ex_movement,
  abil_stat_modifier with the six abil_ stats, and sys_alignment. A statement of scope is not a
  dependency and the core test decides it; do not write a row merely because a canonical
  identity is named.
  Two statements do assert a dependency and one of them has no subject identity available.
  Monster level, printed as LV, is a stat block attribute; exp_ is reserved by constitution
  section 2 for character advancement, monster_ is for creatures, and no other approved prefix
  covers a creature statistic. Enumerate the whole registry before concluding that, and if it
  holds, this is an escalation rather than a silent aliasing onto exp_level: roughly sixty stat
  block packets follow and each states the same attribute, so whatever is chosen here becomes
  the convention for all of them.
  Two further statements restate rules whose defining locus is printed pages 44 to 46 and which
  are already canonical through rule_critical_failure. Check before asserting; a restatement is
  not a new assertion.
  The spellcasting subsection inverts a canonical relation rather than repeating it. Read it
  carefully in both directions before choosing an edge type.
  Both page pointers in the text, to printed pages 46 and 84, are explicit references under the
  PKT-SD-178-179 reading, but a pointer earns a row only when the relation it names is not
  already carried.
  Every quantity on the page is a magnitude and no field may store one.

