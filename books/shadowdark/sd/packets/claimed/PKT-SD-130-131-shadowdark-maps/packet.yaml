content_shape_note: >-
  Recorded for the downstream reader, not as an extraction conclusion. A physical dungeon
  generator: dice are scattered on paper and their positions become rooms, their values become
  room types. Five procedure paragraphs and twelve tables in two tiers, four rolled directly and
  eight reached through the room type.

expected_extraction_hazard: >-
  Flagged at claim for the extracting Analyst. This page has a real parent identity, since the
  prose states a procedure, so unlike the NPC and prompt pages its tables have something to
  attach to.
  It is also the first page where a table result selects another table. Do not flatten all twelve
  onto the parent: that would say a reader rolls the boss monster table as a step, when in fact
  only a boss room reaches it. Carry the room type as the hinge.
  The room type results include Trap, Minor hazard, Major hazard and Treasure, which name
  rule_traps, rule_hazards and rule_treasure, all canonical. The results-are-identities test from
  PKT-SD-124-125 does not obviously transfer, because those rules are not axes with members. Work
  out the direction before asserting anything, and record the reasoning either way.
  The danger level table results are the three values rule_danger_level holds, and that identity
  currently has no RESOLVED_BY row, so this page may be its first resolver.
  The physical dice procedure is precise and mechanical and has no expressible endpoints.

