content_shape_note: >-
  Recorded for the downstream reader, not as an extraction conclusion. One page in two halves
  of different character. ATTACK THE LIGHT is GM advice, five bulleted ideas for putting light
  sources at risk. The LIGHT MISHAPS TABLE is a real d6 table with stated checks, difficulties
  and a damage figure, and is the first genuinely mechanical content in the Game Master half.

expected_extraction_hazard: >-
  Flagged at claim for the extracting Analyst. The two halves need opposite treatment and the
  hazard is applying one standard to both. The bulleted ideas are advice in the same class as
  the CORE ETHOS principles rejected in PKT-SD-101-109, and one of them, opposing spellcasters
  using dispel magic against light spells, restates a rule already canonical from printed page
  59. The table is not advice and should yield rows.
  The sharper judgement is a classification question. This page treats torches and lanterns as
  light sources in a sentence about how to attack the light source, and DEC-2026-0104 is no
  longer gated, so an item to rule_light_source CLASSIFIED_AS row is now technically available.
  That Decision also states that an item's nearby mention does not establish membership and
  requires a locus that explicitly identifies the item as a light source. Whether this sentence
  clears that bar is a real question and must not be answered silently in either direction.
  Zero CLASSIFIED_AS rows currently point at rule_light_source.
  Every DC, die result, damage figure and count in the table is a magnitude no field may store.

