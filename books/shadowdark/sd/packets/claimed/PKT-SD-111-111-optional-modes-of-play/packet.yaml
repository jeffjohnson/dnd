content_shape_note: >-
  Recorded for the downstream reader, not as an extraction conclusion. Eight named optional
  modes, each a heading over one to five bulleted rule changes, introduced as rules to mix and
  match. Unlike the advice pages that precede it this is dense mechanical content, and unlike
  every packet so far it is entirely optional.

expected_extraction_hazard: >-
  Flagged at claim for the extracting Analyst. Every row from this page must carry status
  optional; the source says so in its opening line and a core row here would assert that a
  variant is the default rule. Production held 639 core and 11 optional rows at claim.
  Each mode is defined partly by a number and those are magnitudes no field may store; Blitz
  Mode content is a number and nothing else.
  Fatality Mode removes the dying state rather than adjusting it, which is an OVERRIDES with a
  section 7 basis, and the canonical precedent for an optional override is rule_stat_reroll
  over rule_stat_generation at optional_variant. Deadly Mode looks similar but only hardens the
  same machinery.
  The modes are named things under a heading, which resembles the danger levels and carousing
  outcomes both declined earlier; the distinguishing test is whether each carries mechanical
  relations or only a magnitude.

