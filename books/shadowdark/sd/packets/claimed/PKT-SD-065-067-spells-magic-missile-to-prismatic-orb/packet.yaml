content_shape_note: >-
  Recorded for the downstream reader, not as an extraction conclusion. Ten spell entries in
  alphabetical sequence, each a heading followed by a tier and class line, a duration line, a
  range line, and effect prose. The shape matches the five spell packets already extracted.

expected_extraction_hazard: >-
  Flagged at claim for the extracting Analyst. Tier and casting class are extractable and must
  be asserted for every entry, as in PKT-SD-062-065; four earlier spell packets still owe
  classification successors. This packet is the first to contain tier 4 entries, so
  rule_spell_tier_4, canonical but so far unreferenced, gets its first users.
  Several entries state effects that scale off the caster's own level or bound a target by
  level, and every such quantity is a magnitude no field may store. POWER WORD KILL reaches
  outside the spell entries by naming the critical-failure rule and the mishap roll, both of
  whose defining loci are in the already-integrated PKT-SD-043-050. PASSWALL acts on a barrier,
  for which no canonical identity exists.

