leading_content_page_resolution: >-
  Read this before citing the first four entries. The Primary Source Material opens with MAGIC
  MISSILE, MASS CURE, MIRROR IMAGE and MISTY STEP, none of which carries a marker; the first
  marker in the section is p66 on the PASSWALL heading. SOURCE_MARKDOWN Attribution Rules give
  such content no resolved page unless packet metadata supplies an independent authoritative
  page locator. This manifest supplies one, on the same structural basis recorded for the
  preceding packet.
  Throughout this intake a page's first heading carries that page's marker, and a heading with
  no marker continues the preceding page under the persistence rule. These four headings carry
  no marker, so none of them begins a page, and all four continue the page before p66. The
  identity of that page is fixed independently of this file by the p65 marker inside
  PKT-SD-062-065, whose claimed manifest records page_end 65 and whose final entry, MAGIC
  CIRCLE, immediately precedes MAGIC MISSILE in the source's alphabetical spell sequence. The
  four entries are therefore printed page 65.
  No page length was estimated and no line number was used to derive this.

shared_page_note: >-
  Printed page 65 is covered by two packets: PKT-SD-062-065 holds MAGIC CIRCLE and this packet
  holds the four entries that follow it on the same page. This is the second mid-page split in
  the intake, after the page 62 split between PKT-SD-061-062 and PKT-SD-062-065, so the pattern
  is now established rather than exceptional: the operator splits by line range and a split
  lands inside a printed page whenever the range boundary falls there.
  It does not breach the zero-overlap rule, which bars two packets from claiming the same source
  content, not from citing the same printed page. No line, heading or sentence is claimed twice.
  A page-scoped query will correctly return rows from both packets.

