expected_extraction_hazard: >-
  Flagged at claim for the extracting Analyst. This page sits between two readings that have
  already been settled and it resembles both, so the disposition needs care rather than a
  default.
  It is guidance to the GM in the manner of PKT-SD-075-077, which yielded nothing, and it is a
  construction procedure in the manner of PKT-SD-190-191, which yielded five rows. Test each
  subsection individually: a sentence of the form one thing is based on another states a
  dependency, while a sentence describing what a designer should aim for does not.
  Most of the page is bands of values keyed to monster level: damage dice, attack counts,
  treasure quality, challenge. Every one of those figures is a magnitude and none may be stored,
  but the dependency direction the bands establish may still be assertable. Do not mistake a
  table of magnitudes for the absence of a relationship, and do not smuggle the magnitudes in
  through an aspect or a condition.
  The six named combat roles are the strongest temptation to mint identities. They are a
  designer's taxonomy described only in relative terms, and constitution 2.4 keeps creature
  classification out of the graph.
  The table's own name contains a colon, which cannot appear in an identity. Record the
  transliteration chosen rather than applying one silently.
  mstat_monster_level now carries 3 canonical rows and is the hub of this page; check each
  proposed row against the existing three before writing it.

