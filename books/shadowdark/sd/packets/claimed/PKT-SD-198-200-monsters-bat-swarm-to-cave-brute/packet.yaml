content_shape_note: >-
  Recorded for the downstream reader, not as an extraction conclusion. Measured from the AST: 12
  creature headings, no table. Several named abilities recur verbatim or in close shape across
  creatures already claimed in this chapter: Rage repeats Badger's ability exactly on Berserker;
  Crush repeats itself verbatim between Bear, Brown and Bear, Polar; Thick Fur repeats Ape,
  Snow's exactly on Bear, Polar; Impervious repeats Azer's name though not its exact text on
  Black Pudding; and Gore on Boar shares Crush's shape under a different name. This is the
  densest verbatim recurrence the chapter has shown so far.

expected_extraction_hazard: >-
  Flagged at claim for the extracting Analyst. The governing test remains the one settled at
  PKT-SD-194-194 and confirmed at PKT-SD-195-195 and PKT-SD-196-198: a stat-block description is
  excluded under constitution 2.5 regardless of what it references or how many other creatures
  carry the same text, because the exclusion is about each instance's own locus. Apply it per
  instance; do not let verbatim repetition be read as a shared-locus statement, which requires
  one mechanic named once at a place the source presents as covering a class, the way
  Dark-Adapted does. Record the recurrence as a measured observation rather than a reason to
  extract.
  One ability on this page, Bugbear's Stealthy, is a label collision with an already-registered
  identity rather than with ordinary English: abil_stealthy is canonical as the Halfling
  ancestry benefit, GATES to rule_invisibility on limited-use access, and this creature's
  Stealthy states advantage on checks to sneak and hide, an unrelated mechanic. Confirm the two
  are different concepts under one label before dispositioning it, and do not let the exact
  label match pull a GATES row toward abil_stealthy.
  Impervious also recurs with inconsistent meaning: Azer is immune to fire, while Black Pudding
  is harmed only by fire, which is closer to the opposite. The shared name does not imply a
  shared mechanic even where the name is identical.
  Several abilities reach an existing canonical identity directly, the same shape as Bless,
  Rage, Execute and Ambush in the two preceding packets; test each against that precedent rather
  than fresh.
  Every quantity on the page is a magnitude and no field may store one.

