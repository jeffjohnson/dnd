leading_content_page_resolution: >-
  Read this before citing Bat, Swarm, Bear, Brown, Bear, Polar or Beastman. The Primary Source
  Material opens with the BAT, SWARM heading, which carries no marker; the first marker in the
  section is p199 on the BERSERKER heading. SOURCE_MARKDOWN Attribution Rules state that content
  before the first applicable marker has no resolved page unless packet metadata supplies an
  independent authoritative page locator. This manifest supplies one, and its basis is structural
  rather than estimated.
  Throughout this intake a page's first heading carries that page's marker; a heading with no
  marker continues the preceding page under the persistence rule. BAT, SWARM carries no marker,
  so it is not the first heading of a page and continues the page before p199. The identity of
  that page is fixed independently of this file by the p198 marker inside
  PKT-SD-196-198-monsters-animated-armor-to-bat-giant, whose claimed manifest records page_end
  198 and whose final entry, Bat, Giant, immediately precedes Bat, Swarm in the source's
  alphabetical monster sequence. Bat, Swarm, Bear, Brown, Bear, Polar and Beastman are therefore
  printed page 198. No page length was estimated and no line number was used to derive this.

shared_page_note: >-
  Flagged for the Reviewer. Printed page 198 is covered by two packets:
  PKT-SD-196-198-monsters-animated-armor-to-bat-giant holds the entries up to Bat, Giant and this
  packet holds Bat, Swarm, Bear, Brown, Bear, Polar and Beastman. The operator's split falls
  inside a printed page rather than on its boundary.
  This does not breach the zero-overlap rule, which bars two packets from claiming the same
  source content, not from citing the same printed page. No heading or sentence is claimed
  twice. A page-scoped query will correctly return rows from both packets, though neither is
  expected to carry any; see expected_extraction_hazard.

