reviewer_findings:
  - id: RF-01
    subject: magic_item_node_additions
    disposition: approved
    detail: >-
      The 12 proposed nodes (item_onyx_destrier, item_ophidian_armor, item_pearl_of_power,
      item_pipe_of_the_rolling_hills, item_pipes_of_the_sewers, item_portable_hole,
      item_potion_of_extirpation, item_potion_of_flying, item_potion_of_forgetfulness,
      item_potion_of_giant_strength, item_potion_of_healing, and item_potion_of_invisibility)
      are source-named from explicit item headings across pages 308–311. Prefix item_ and kind item
      are approved vocabulary under Constitution 1.8 section 2. Proposed IDs and labels are confirmed
      absent from the canonical node registry (768 rows). Routing bases correctly cite Constitution 1.8
      section 2. Reviewer approval granted for all 12 node registrations, including item_potion_of_forgetfulness
      which correctly yields 0 engine edges due to its purely narrative memory erasing effect.
  - id: RF-02
    subject: magic_item_edges
    disposition: approved
    refs: [M001, M002, M003, M004, M005, M006, M007, M008, M009, M010, M011, M012, M013, M014, M015, M016, M017, M018, M019, M020, M021, M022]
    detail: >-
      Edges M001–M022 assert mechanical relations for the magic items: M001 asserts item_onyx_destrier
      TRIGGERS monster_nightmare (aspect: "nightmare transformation", condition: "once per day", polarity: neutral);
      M002 asserts alignment_neutral GATES item_onyx_destrier (aspect: "rider alignment", condition: "to ride nightmare", polarity: enables);
      M003 asserts alignment_chaotic GATES item_onyx_destrier (aspect: "rider alignment", condition: "to ride nightmare", polarity: enables);
      M004 asserts item_ophidian_armor MODIFIES cbt_armor_class (aspect: "armor bonus", condition: "while wearing armor", polarity: improves);
      M005 asserts item_ophidian_armor MODIFIES rule_check (aspect: "poison check advantage", condition: "to avoid effects of poison", polarity: improves);
      M006 asserts item_pearl_of_power MODIFIES rule_spellcasting_check (aspect: "lost spell restoration", condition: "on lost spell not caused by critical failure", polarity: improves);
      M007 asserts item_pipe_of_the_rolling_hills MODIFIES rule_hit_points (aspect: "smoking recovery", condition: "when pipe is smoked", polarity: improves);
      M008 asserts item_pipes_of_the_sewers TRIGGERS monster_rat_giant (aspect: "summon giant rats", condition: "when played", polarity: neutral);
      M009 asserts item_pipes_of_the_sewers CONSTRAINS monster_rat_giant (aspect: "rat obedience", condition: "while playing pipes", polarity: governs);
      M010 asserts item_pipes_of_the_sewers TRIGGERS monster_rat_giant (aspect: "rat attack", condition: "when player stops playing pipes while rats present", polarity: neutral);
      M011 asserts item_portable_hole MODIFIES rule_gear_capacity (aspect: "storage slots", condition: "when unfolded", polarity: improves);
      M012 asserts item_portable_hole CONSTRAINS item_bag_of_holding (aspect: "dimensional destruction", condition: "when placed inside", polarity: governs);
      M013 asserts alignment_chaotic FEEDS_INTO item_potion_of_extirpation (aspect: "item alignment", condition: "", polarity: neutral);
      M014 asserts spell_wish CONSTRAINS item_potion_of_extirpation (aspect: "extirpation reversal", condition: "to return target to reality", polarity: governs);
      M015 asserts item_potion_of_flying MODIFIES ex_movement (aspect: "flight movement", condition: "when imbibed", polarity: improves);
      M016 asserts item_potion_of_giant_strength MODIFIES abil_strength (aspect: "stat replacement", condition: "while potion active", polarity: improves);
      M017 asserts item_potion_of_giant_strength MODIFIES cbt_damage_roll (aspect: "melee damage multiplier", condition: "for melee attacks while potion active", polarity: improves);
      M018 asserts item_potion_of_healing MODIFIES rule_hit_points (aspect: "healing recovery", condition: "when imbibed", polarity: improves);
      M019 asserts exp_level FEEDS_INTO item_potion_of_healing (aspect: "healing scaling", condition: "", polarity: neutral);
      M020 asserts item_potion_of_invisibility GATES rule_invisibility (aspect: "invisibility access", condition: "when imbibed", polarity: enables);
      M021 asserts cbt_attack_roll CONSTRAINS item_potion_of_invisibility (aspect: "invisibility termination", condition: "on attacking", polarity: governs);
      and M022 asserts rule_spellcasting_check CONSTRAINS item_potion_of_invisibility (aspect: "invisibility termination", condition: "on casting a spell", polarity: governs).
      All edge types, directions, conditions, and polarities strictly conform to Constitution 1.8 section 6.1 and Graph Invariant 14.
      Edges are held pending until node registrations are applied; approved for inclusion in the Approved bundle upon integration.
  - id: RF-03
    subject: near_duplicate_findings
    disposition: approved
    refs: [M008, M010]
    detail: >-
      Audited near-duplicate finding between M008 and M010 (item_pipes_of_the_sewers TRIGGERS monster_rat_giant).
      M008 models the daily summoning activation (aspect: "summon giant rats", condition: "when played") from the Benefit,
      while M010 models the rat turning and attacking curse (aspect: "rat attack", condition: "when player stops playing pipes while rats present")
      from the Curse. These are two distinct mechanical assertions. Both confirmed valid and approved.
  - id: RF-04
    subject: narrative_and_candidate_rejections
    disposition: approved_omission
    detail: >-
      Independently verified that all narrative lore, cosmetic descriptions, DC figures, numeric bonuses, dice rolls, durations,
      frequencies, gear slot capacities, and out-of-scope passages are properly excluded from edges under Graph Invariant 11 and
      Constitution 1.8 sections 2.4 and 2.5:
      Onyx Destrier 1 hour duration limit;
      Ophidian Armor +1 bonus magnitude;
      Pearl of Power once per day frequency;
      Pipe of the Rolling Hills up to three times per day frequency and 1d4 HP healing dice magnitude;
      Pipes of the Sewers once per day frequency, 2d6 rat count, and d6 rounds obedience duration;
      Portable Hole 6-foot dimensions, 20 gear slots capacity, nested Portable Hole interaction, and Ralina halfling quote;
      Potion of Extirpation close area size and personality dialogue;
      Potion of Flying near distance and 10 rounds duration;
      Potion of Forgetfulness permanent memory forgetting narrative effect;
      Potion of Giant Strength 18 (+4) stat target magnitude, x2 melee damage multiplier, and 10 rounds duration;
      Potion of Healing level tier breakdown (LV 0-3, LV 4-6, LV 7-9, LV 10+) and dice values (1d6, 2d8, 3d10, 4d12);
      Potion of Invisibility 10 rounds duration limit;
      and supporting context passages (pp. 282–283, 34–35) are out of packet scope.
      All omissions confirmed correct.
  - id: RF-05
    subject: page_attributions
    disposition: approved
    detail: >-
      Primary Source Material spans pages 308–311: ONYX DESTRIER precedes explicit marker {#p309} on page 308 (M001–M003);
      explicit marker {#p309} covers OPHIDIAN ARMOR, PEARL OF POWER, PIPE OF THE ROLLING HILLS, PIPES OF THE SEWERS, and PORTABLE HOLE (M004–M012);
      explicit marker {#p310} covers POTION OF EXTIRPATION, POTION OF FLYING, POTION OF FORGETFULNESS, POTION OF GIANT STRENGTH, and POTION OF HEALING (M013–M019);
      explicit marker {#p311} covers POTION OF INVISIBILITY (M020–M022).
      Page attributions strictly conform to placement rules.
