reviewer_findings:
  - id: RF-01
    subject: corrected_node_routing_authority
    disposition: approved
    detail: >-
      All twelve routing_basis values exactly match REV r01-r01's row-local
      Constitution 1.8 section 2 correction. I independently verified the
      exact string on each proposed node, confirmed no DEC-2026-0003 reference
      remains in the GUP, and confirmed the r02 validation report records
      reviewer_corrected_node_field for all twelve nodes. No identity, label,
      locus, edge, or extraction judgment changed from the reviewed r01.
  - id: RF-02
    subject: source_named_creature_identities
    disposition: approved
    detail: >-
      The claimed Primary Source Material contains twelve separate creature
      headings and complete stat blocks from BAT, SWARM through CAVE BRUTE.
      Labels exactly preserve source spelling and punctuation, including Bat,
      Swarm; Bear, Brown; and Bear, Polar. IDs are valid snake_case
      transliterations under the Constitution 1.8 monster_ prefix and kind.
      All twelve proposed IDs and exact labels remain absent from the current
      449-row node registry, which contains 18 monster identities.
  - id: RF-03
    subject: zero_edge_locus_boundary
    disposition: approved
    detail: >-
      Constitution 1.8 sections 2 and 2.5 distinguish creature identities from
      individual stat-block descriptions and values. All twelve creature
      identities belong at their defining stat blocks, but no shared creature
      family or reusable dependency is asserted there. The zero-edge result is
      complete, the component remains header-only, and no current canonical
      edge cites pages 198 through 200.
  - id: RF-04
    subject: named_ability_omissions
    disposition: approved
    detail: >-
      Rechecked the fifteen named abilities across the twelve blocks: Crush
      (twice), Thick Fur, Brutal, Rage, Impervious, Corrosive, Gore, Hear
      Thoughts, Latch, Mind Blast, Mind Control, Stealthy, Leap and Bewilder.
      Their individual stat-block loci remain excluded under Constitution 2.5.
      Verbatim recurrence does not make Rage, Crush or Thick Fur a shared-locus
      statement. Impervious names different effects on the Azer and Black
      Pudding. Bugbear's Stealthy shares the label of abil_stealthy but describes
      a different mechanic; the canonical Halfling benefit's GATES relationship
      to rule_invisibility does not apply to the Bugbear.
  - id: RF-05
    subject: page_attribution_and_packet_seam
    disposition: approved
    detail: >-
      Independently derived the page assignments from the source markers and
      SOURCE_MARKDOWN placement rules. Markers on BERSERKER and BUGBEAR begin
      pages 199 and 200 respectively; subsequent headings persist to the next
      marker. The leading BAT, SWARM through BEASTMAN content is assigned page
      198 by the claimed manifest's independent locator and preceding packet's
      page_end/adjacent Bat, Giant entry. The two packets cite the same printed
      page but cover disjoint source content; this is not duplicate coverage.
  - id: RF-06
    subject: residual_validator_authority_wording
    disposition: non_blocking_observation
    detail: >-
      The validation report retains twelve informational node_addition_normal_workflow
      details with stock “per DEC-2026-0003” wording, plus twelve reviewer
      correction details recording replacement of the former text. This is
      residual compiler/report prose, not a GUP routing_basis value or an
      unapplied correction. The GUP itself contains no DEC-2026-0003 reference;
      this known systemic wording issue does not block approval.
