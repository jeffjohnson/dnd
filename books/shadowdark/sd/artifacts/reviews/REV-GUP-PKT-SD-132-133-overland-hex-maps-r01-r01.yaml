reviewer_findings:
  - id: RF-01
    subject: generator_resolution_structure
    disposition: approved
    refs: [M001, M002, M003, M004, M006, M007]
    detail: >-
      Overland Hex Maps is directly resolved by its terrain, new-hex, danger,
      and points-of-interest tables. The terrain table conditionally reaches
      the cataclysm table, and the points-of-interest table reaches the
      settlement-name table. RESOLVED_BY and FEEDS_INTO preserve that two-tier
      procedure without flattening table results into unsupported identities.
  - id: RF-02
    subject: danger_level_second_resolver
    disposition: approved
    refs: [M005]
    detail: >-
      Canonical rule_danger_level has four relationships, only one of which is
      a resolver: the page-130 Map Danger Level Table. The page-132 Hex Danger
      Level Table is a distinct source-backed procedure that also determines
      the aggregate rule and is correctly its second RESOLVED_BY target.
  - id: RF-03
    subject: danger_level_source_variance
    disposition: informational_nonblocking
    detail: >-
      The Hex Danger Level Table contains Safe, Unsafe, Risky, and Deadly,
      whereas the rule's defining locus and page-130 map table contain only
      Unsafe, Risky, and Deadly. This is a genuine source variance. The values
      are not graph identities and were twice declined at their defining
      loci, so proposing Safe alone would create inconsistent grain. M005
      correctly records only that this table resolves rule_danger_level.
  - id: RF-04
    subject: cross_chapter_hex_link
    disposition: approved
    refs: [M008]
    detail: >-
      Canonical rule_hex already supplies Overland Travel's distance unit and
      gates Navigation timing on page 90. FEEDS_INTO Overland Hex Maps with
      aspect mapped unit truthfully connects the generator to the same hex
      identity without depending on an explicit page-number cross-reference.
  - id: RF-05
    subject: registry_additions
    disposition: approved
    proposed_ids:
      - rule_overland_hex_maps
      - tbl_new_hex
      - tbl_hex_danger_level
      - tbl_hex_terrain
      - tbl_hex_cataclysm_type
      - tbl_hex_points_of_interest
      - tbl_hex_settlement_name
    detail: >-
      All seven proposals are source-named identities at their defining loci,
      use approved prefixes and matching kinds, carry complete labels and
      rationales, and are absent from the current registry. Every proposal
      supports at least one approved relationship.
  - id: RF-06
    subject: unrepresented_table_arithmetic_and_results
    disposition: rejected_candidates_confirmed
    detail: >-
      Circular row stepping, die-face triggers, danger-band values, terrain
      developments, and settlement names are magnitudes or descriptive
      results rather than supported graph identities. The submitted procedure
      and table relationships retain the expressible mechanics without
      inventing row-position or value nodes.
  - id: RF-07
    subject: source_structure_count
    disposition: informational_correction
    detail: >-
      The six tables contain 46 data rows, not the 48 stated in the GUR units
      note: 4 + 4 + 7 + 8 + 15 + 8 = 46. The twenty point-of-interest
      locations and developments and the twenty-four settlement names are
      otherwise correctly counted. This prose correction changes no row,
      identity, attribution, or completeness result.
