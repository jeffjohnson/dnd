    subject: stat_block_locus_and_zero_edges
    disposition: approved
    detail: >-
      Constitution 1.8 sections 2 and 2.5 exclude individual creature stat-block
      descriptions, modifiers, and values from graph content. The three special
      ability descriptions (Pterodactyl's Grab, Triceratops's Charge,
      Velociraptor's Clever) describe creature-local combat traits and
      magnitudes (DC 15, x3 damage multiplier, +1d4 damage), not shared rules or
      conditions. All seven rejected candidates in the GUR are correctly
      excluded under the locus test. The zero-edge plan and empty edges component
      are complete.
