reviewer_findings:
  - id: RF-01
    subject: verified_node_routing_authority
    disposition: approved
    detail: >-
      All five proposed nodes in the GUP carry routing_basis: 'Constitution 1.8
      section 2: approved prefix and kind, valid ID, no duplicate'. The Builder
      authority citation fix is active and no foreign DEC-2026-0003 citation
      exists anywhere in the GUP or in its validation report.
  - id: RF-02
    subject: source_named_monster_identities
    disposition: approved
    detail: >-
      The Primary Source Material on pages 213 and 214 contains five distinct
      creature headings and complete stat blocks: DRUID, DRYAD, DUERGAR, DUNG
      BEETLE, GIANT, and EFREETI. Labels preserve exact source wording and comma
      placement; IDs use standard snake_case transliteration with approved prefix
      monster_. All five IDs and exact labels are absent from the 504-row
      canonical node registry, which currently holds 73 monster identities.
  - id: RF-03
    subject: stat_block_locus_and_zero_edges
    disposition: approved
    detail: >-
      Constitution 1.8 sections 2.4 and 2.5 exclude individual creature stat-block
      descriptions, modifiers, and values from graph content. The special ability
      descriptions (Dryad Charm/Meld; Duergar Enlarge/Invisibility/Sunblind; Dung
      Beetle Knock; Efreeti Impervious/Wall of Flame/Wish) describe creature-local
      combat traits and magnitudes, not cross-mechanic graph relationships. The
      duergar chainmail + shield notation explains inherent AC on creature locus
      without modifying armor rules. All 18 rejected candidates in the GUR are
      correctly excluded under the locus test. The zero-edge plan and empty edges
      component are complete.
  - id: RF-04
    subject: monster_stat_block_spells_and_wish_boundary
    disposition: approved
    detail: >-
      Druid carries five innate INT spells (Barkskin, Conjure Flames, Imbue, Summon
      Bear, Thunderclap) with unique creature DCs and parameters; under Constitution
      1.8 section 2.5, these operate on the creature's attack and spellcasting
      locus rather than creating cross-mechanic edges into character spell nodes.
      Similarly, Efreeti's Wish ability references the Wish spell but modifies
      invocation conditions exclusively for this creature (once per week, for a
      mortal, without a check), remaining on creature locus under Constitution 2.5,
      mirroring the approved Djinni precedent (RF-04 in REV-GUP-PKT-SD-209-209).
  - id: RF-05
    subject: page_attribution
    disposition: approved
    detail: >-
      Two explicit page markers govern this packet: {#p213} on the DRUID heading
      (persisting through DRYAD and DUERGAR) and {#p214} on the DUNG BEETLE, GIANT
      heading (persisting through EFREETI). All five defining loci and the claimed
      two-page span (213–214) agree with the source markers.
