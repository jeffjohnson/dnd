  - id: RF-02
    subject: trap_mechanism_precedent
    disposition: approved
    refs: [M002]
    detail: >-
      Rusty bear traps springing from concealment and a tripwire triggering a
      hidden falling net both state trap mechanisms. One table-level
      FEEDS_INTO Traps row is the correct grain because the two cells share the
      same assertion key. The second cell properly applies the settled rule
      that explicit operation can establish mechanical identity without the
      registry label appearing verbatim.
  - id: RF-03
    subject: rival_crawlers_result
    disposition: approved
    refs: [M003]
    detail: >-
      The result explicitly names tied-up rival crawlers. FEEDS_INTO canonical
      Rival Crawlers accurately records the table result without proposing a
      troll identity or inventing participant detail.
  - id: RF-04
    subject: mechanism_boundary_and_scan_disclosure
    disposition: informational_nonblocking
    detail: >-
      The falling tree describes an object falling toward the party, not a
      character falling, and states no check, damage or consequence. Its
      omission is therefore correct even if a fuller stemmer flags the word
      falls. The reported 16-versus-17 stem-match difference changes no row or
      identity decision.
  - id: RF-05
    subject: table_registration_and_remaining_omissions
    disposition: approved
    detail: >-
      Forest Encounters Table is source-named, fresh, correctly prefixed and
      supports all three rows. Creature identities, status effects without
      endpoints, trading or shelter scenes without stated mechanics, the
      self-referential reroll instruction and supporting context were correctly
      withheld.
  - id: RF-06
    subject: authority_metadata
    disposition: informational_nonblocking
    detail: >-
      Builder validation text still names the stale DEC-2026-0003 identifier.
      This Review applies current Shadowdark Constitution section 2 and common
      Reviewer authority directly; no submitted row depends on that citation.
