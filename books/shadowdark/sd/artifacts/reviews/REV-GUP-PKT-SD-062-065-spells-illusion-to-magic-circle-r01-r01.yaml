blocking_findings:
  - id: missing_illusion_disbelief_threshold_input
    severity: blocking
    detail: >-
      The ILLUSION entry says a creature must pass a Wisdom check against the
      caster's last spellcasting check. M002 records that a check constrains
      the spell, but none of the 39 rows records the independently load-bearing
      fact that rule_spellcasting_check supplies the disbelief threshold. A
      change to that spellcasting-check result would therefore not reach
      spell_illusion in the proposed graph. The source supports an additional
      rule_spellcasting_check FEEDS_INTO spell_illusion row with aspect
      "disbelief threshold", empty condition, page 62, section ILLUSION,
      explicit_rule evidence, and neutral derived polarity. The older
      spell_hold_monster row has the same omission; that historical omission
      does not make this packet complete.
    source_citation:
      path: books/shadowdark/sd/packets/claimed/PKT-SD-062-065-spells-illusion-to-magic-circle/source.md
      page: '62'
      section: ILLUSION
      evidence: >-
        A creature inspecting the illusion must pass a Wisdom check versus the
        caster's last spellcasting check to perceive its false nature.
