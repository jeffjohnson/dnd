reviewer_findings:
  - id: RF-01
    subject: spell_invisibility_label_collision
    disposition: nonblocking_distinct_identity
    detail: >-
      spell_invisibility is the source-named Tier 2 wizard spell in this packet.
      Canonical rule_invisibility is a rule identity reached only by the
      Halfling abil_stealthy access edge on page 17. Constitution invariant 4
      makes labels non-identifying, and the approved spell_ and rule_ prefixes
      encode different identity families. The shared label therefore does not
      justify a merge, repoint, or migration.
  - id: RF-02
    subject: judgement_dual_hit_point_rows
    disposition: nonblocking_distinct_assertions
    refs: [M011, M012]
    detail: >-
      The favorable and unfavorable divine verdicts are separate source-stated
      outcomes with different conditions and opposite read polarities. Both
      rows are required and are distinct under the assertion key.
  - id: RF-03
    subject: illusion_page_attribution
    disposition: nonblocking_verified
    detail: >-
      The current packet manifest supplies the independent authoritative page
      locator permitted by SOURCE_MARKDOWN: the sibling claimed packet carries
      the page-62 marker at HOLD MONSTER and continues through HOLY WEAPON,
      immediately before this packet's unmarked ILLUSION entry. Page 62 is
      therefore reproducible without estimating by line count.
  - id: RF-04
    subject: stale_gur_observations
    disposition: informational
    detail: >-
      OBS-08 incorrectly says no canonical invisibility identity exists;
      rule_invisibility is registered, but RF-01 resolves the actual identity
      question without changing any row. The GUR's 228-row registry snapshot
      and its statement that IMP-DEC-2026-0104 lacks Review are also stale.
      Current state has 233 registry rows before this packet and
      REV-IMP-DEC-2026-0104-r01-r01 is terminal. None changes this packet's
      submitted relationship semantics.
