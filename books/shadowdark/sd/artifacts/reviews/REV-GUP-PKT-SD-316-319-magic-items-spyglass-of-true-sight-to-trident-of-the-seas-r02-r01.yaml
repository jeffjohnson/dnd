reviewer_findings:
  - id: RF-01
    subject: magic_item_node_additions
    disposition: approved
    detail: >-
      The 12 proposed nodes (item_spyglass_of_true_sight, item_staff_of_healing, item_staff_of_ord,
      item_staff_of_the_cobra, item_sword_of_the_ancients, item_the_kytherian_mechanism,
      item_the_malediction_infernal, item_thrice_blessed_sword, item_tome_of_mordanticus,
      item_tome_of_gehemna, item_tome_of_hadebe, and item_trident_of_the_seas) are source-named
      from explicit item headings across pages 316–319. Prefix item_ and kind item are approved
      vocabulary under Constitution 1.8 section 2. Proposed IDs and labels are confirmed absent
      from the canonical node registry (798 rows). Reviewer approval granted for all 12 node registrations.
  - id: RF-02
    subject: magic_item_edges
    disposition: approved
    refs: [M001, M002, M003, M004, M005, M006, M007, M008, M009, M010, M011, M012, M013, M014, M015, M016, M017, M018, M019, M020, M021, M022, M023, M024, M025, M026, M027, M028, M029, M030, M031, M032, M033, M034, M035, M036, M037, M038, M039, M040, M041, M042, M043, M044, M045, M046, M047, M048]
    detail: >-
      Edges M001–M048 model mechanics across the 12 magic items:
      Spyglass of True Sight: M001 asserts item_spyglass_of_true_sight MODIFIES rule_invisibility (invisibility detection, when looking through spyglass, worsens);
      Staff of Healing: M002 and M003 assert weapon attack and damage bonuses; M004 asserts item_staff_of_healing MODIFIES rule_hit_points (hit point healing, on touch, improves);
      Staff of Ord: M005 gates class_wizard; M006/M007 assert weapon attack/damage bonuses; M008–M011 feed into dimension door, fireball, sending, telekinesis; M012 feeds into wand; M013 modifies rule_spellcasting_check (mishap immunity); M014 constrains rule_spellcasting_check (spellcasting difficulty DC 18 for hostile spells targeting wielder);
      Staff of the Cobra: M015/M016 assert weapon attack/damage bonuses; M017 modifies rule_reaction_check (reaction attitude friendly); M018 triggers monster_snake_giant; M019/M020 constrain attacks and hostile spellcasting targeting snakes (disadvantage);
      Sword of the Ancients: M021/M022 assert weapon attack/damage bonuses; M023 modifies rule_damage (material carving);
      The Kytherian Mechanism: M024 asserts item_kytherian_cog GATES item_the_kytherian_mechanism;
      The Malediction Infernal: M025 gates alignment_chaotic; M026 modifies exp_level (gain level); M027 feeds into lang_diabolic; M028 constrains abil_wisdom (Wisdom check DC 18); M029 modifies exp_level (lose level);
      Thrice-Blessed Sword: M030 gates class_priest; M031 gates alignment_lawful; M032 gates tbl_priest_titles; M033/M034 assert weapon attack/damage bonuses; M035 modifies cbt_damage_roll (double damage against demons devils and undead);
      Tome of Mordanticus: M036/M037 constrain attack roll and spellcasting check (advantage against beings whose true names are learned);
      Tome of Gehemna: M038/M039 feed into spell scroll and wizard class;
      Tome of Hadebe: M040 feeds into spell scroll; M041–M043 feed into burning hands, fireball, prismatic orb;
      Trident of the Seas: M044/M045 assert weapon attack/damage bonuses; M046 feeds into control weather; M047 modifies rule_spellcasting_check (+4 bonus); M048 modifies rule_swimming (underwater breathing).
  - id: RF-03
    subject: distinctness_of_near_duplicate_pairs
    disposition: approved
    refs: [M026, M029, M034, M035]
    detail: >-
      Audit of two near-duplicate findings from Builder report:
      1) M026 and M029 share endpoints (item_the_malediction_infernal MODIFIES exp_level). M026 represents gaining a level for chaotic readers; M029 represents losing a level on a failed Wisdom check for non-chaotic readers. These are opposite, distinct mechanical assertions.
      2) M034 and M035 share endpoints (item_thrice_blessed_sword MODIFIES cbt_damage_roll). M034 represents the general +3 damage bonus on attacks with the sword; M035 represents the conditional double damage multiplier against demons, devils, and undead. These are distinct assertions.
      Both pairs approved as valid distinct rules.
  - id: RF-04
    subject: excluded_content_audit
    disposition: approved
    detail: >-
      Audit of exclusions against source prose:
      Spyglass of True Sight compulsion curse;
      Sword of the Ancients planar summoning without distance limit;
      The Kytherian Mechanism narrative plot event undo;
      The Malediction Infernal tome teleportation;
      Item personality and alignment roleplay flavor on Thrice-Blessed Sword, Tome of Mordanticus, and Tome of Gehemna;
      and supporting context passages (pp. 34–37, 56, 86, 282–283) are out of packet scope.
      All omissions confirmed correct.
  - id: RF-05
    subject: page_attributions
    disposition: approved
    detail: >-
      Primary Source Material spans pages 316–319 with explicit page markers:
      SPYGLASS OF TRUE SIGHT, STAFF OF HEALING, STAFF OF ORD are on page 316 (M001–M014);
      STAFF OF THE COBRA, SWORD OF THE ANCIENTS, THE KYTHERIAN MECHANISM, THE MALEDICTION INFERNAL are on page 317 (M015–M029);
      THRICE-BLESSED SWORD, TOME OF MORDANTICUS, TOME OF GEHEMNA are on page 318 (M030–M039);
      TOME OF HADEBE, TRIDENT OF THE SEAS are on page 319 (M040–M048).
      All page attributions strictly conform to source placement.
