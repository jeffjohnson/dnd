reviewer_findings:
  - id: RF-01
    subject: corrected_node_routing_authority
    disposition: approved
    detail: >-
      All twelve routing_basis values exactly match REV r01-r01's row-local
      Constitution 1.8 section 2 correction. I verified the exact value on
      every proposed node, confirmed no DEC-2026-0003 reference remains in the
      GUP, and confirmed the r02 report records reviewer_corrected_node_field
      for all twelve. The identities, labels, source judgments, omissions, and
      zero-edge plan are unchanged from reviewed r01.
  - id: RF-02
    subject: source_named_creature_identities
    disposition: approved
    detail: >-
      All twelve proposals correspond to distinct source headings and defining
      stat blocks from Cave Creeper through Cultist. Labels preserve the exact
      source names, including Centipede, Giant; Centipede, Swarm; and Crab,
      Giant. IDs are valid snake_case transliterations under the approved
      monster_ prefix/kind. All twelve IDs and exact labels remain absent from
      the 461-row live node registry, which contains 30 monster identities.
  - id: RF-03
    subject: zero_edge_locus_boundary
    disposition: approved
    detail: >-
      Constitution 1.8 sections 2 and 2.5 distinguish creature identities from
      individual stat-block descriptions and values. The identities belong at
      their defining loci, but no shared creature family or reusable mechanic
      dependency is asserted there. The zero-edge result is complete; the
      header-only edge component contains zero rows.
  - id: RF-04
    subject: named_ability_omissions_and_references
    disposition: approved
    detail: >-
      Rechecked the fourteen named ability occurrences: Toxin; Poison on both
      centipedes; Fire Breath; Grab; Phantoms; Screech; Petrify; Change Shape;
      Couatl's Poison; Restore; Crab, Giant's Crush; Fearless; and Deathtouch.
      Each remains creature-local under Constitution 2.5. Phantoms resembles
      Mirror Image, Change Shape resembles Shapechange, and Couatl's Poison
      resembles Sleep, but none names that spell or uses the italic-reference
      convention; resemblance alone does not establish spell identity.
      Screech's DISADV abbreviation directly names rule_disadvantage, but that
      stat-block-local description creates no edge. Fearless's morale exemption
      and Restore's healing/reference language are correctly omitted. The
      paralysis recurrence does not establish a shared-locus rule. Crab,
      Giant's Crush is distinct from the Bears' differently functioning Crush.
  - id: RF-05
    subject: page_attribution_and_packet_seam
    disposition: approved
    detail: >-
      Independently derived page assignments from the source markers and
      SOURCE_MARKDOWN rules. Markers on CENTAUR, CLOAKER and CROCODILE headings
      begin pages 201, 202 and 203, with persistence through following headings.
      Cave Creeper precedes the first marker and inherits page 200 from the
      manifest's independent leading-page locator and the prior packet's
      page_end/adjacent Cave Brute entry. The packets cite the same printed page
      but claim disjoint source content; this is not duplicate coverage.
  - id: RF-06
    subject: residual_validator_authority_wording
    disposition: non_blocking_observation
    detail: >-
      The validation report retains twelve informational node_addition_normal_workflow
      details with stock “per DEC-2026-0003” wording, plus twelve correction
      details that document replacement of the prior text. This is residual
      compiler/report prose, not a GUP routing_basis value or an unapplied
      correction. The GUP itself contains no such reference; the report wording
      does not block approval.
