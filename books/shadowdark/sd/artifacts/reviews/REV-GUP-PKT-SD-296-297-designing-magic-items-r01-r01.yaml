    subject: null_extraction
    disposition: approved
    detail: >-
      The packet contains one chapter heading (DESIGNING MAGIC ITEMS) and two section headings (MAGIC ITEM QUALITIES,
      GAME-BREAKERS) across printed page 296, accompanied by 9 prose paragraphs of creative advice, design philosophy,
      and qualitative cautions for the Game Master. Printed page 297 consists entirely of full-page artwork (.full-page-artwork).
      None of these elements defines, modifies, invokes, or constrains a mechanical game rule, state transition, or entity
      dependency in the tabletop ruleset. The zero-node, zero-edge extraction is complete, fully justified under Constitution 1.8
      sections 1, 2.4, and 2.5, and represents an ordinary proposed packet update under established repository precedents
      (e.g., PKT-SD-075-077, PKT-SD-187-188, PKT-SD-267-268).
  - id: RF-02
    subject: magic_item_qualities_advice
    disposition: approved_omission
    detail: >-
      The subsections on Unique, Power Level, and Nature of Effects provide qualitative design heuristics for the GM when
      authoring custom magic items (recommending uniqueness, benchmarking power roughly to class talents, and preferring
      passive riders over complex active rolls to maintain game pacing). They define no mechanical formulas, roll lookups,
      or entity dependencies; striking them leaves all game rules unchanged. Correctly excluded from graph content under
      Constitution 1.8 section 2.4.
  - id: RF-03
    subject: game_breakers_cautionary_guidance
    disposition: approved_omission
    detail: >-
      The Game-Breakers subsection highlights core system interactions (light scarcity and gear slot management), warning
      GMs against giving out unlimited darkvision or expanding inventory capacity without care. This advisory caution
      explains the design philosophy of the system but defines no binding mechanical rules or constraints on item entities.
      All mentioned systems (item_torch, spell_light, rule_darkvision, rule_gear_capacity) remain fully defined at their
      canonical defining loci. Correctly excluded from graph content under Constitution 1.8 sections 2.4 and 2.5.
  - id: RF-04
    subject: full_page_artwork_and_page_attributions
    disposition: approved
    detail: >-
      Primary Source Material opens on page 296 with explicit marker {#p296} on DESIGNING MAGIC ITEMS, persisting through
      all prose guidance. Explicit marker {#p297} attributes the full-page artwork div to printed page 297. Page attributions
