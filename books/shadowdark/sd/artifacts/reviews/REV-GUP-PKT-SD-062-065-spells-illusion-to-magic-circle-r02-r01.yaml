    subject: m040_disbelief_threshold
    disposition: approved
    ref: M040
    detail: >-
      The page-62 ILLUSION text expressly makes the caster's last spellcasting
      check the value against which the inspecting creature's Wisdom check is
      measured. rule_spellcasting_check FEEDS_INTO spell_illusion, aspect
      disbelief threshold, is therefore source-supported, load-bearing, and
      correctly directed from input to process. Its empty condition and
      explicit_rule evidence are exact. Constitution 1.7 section 5 requires
      Builder, not Analyst, to derive FEEDS_INTO polarity; the compiled
      neutral/derived values are correct and agree with all 112 existing
      canonical FEEDS_INTO rows.
