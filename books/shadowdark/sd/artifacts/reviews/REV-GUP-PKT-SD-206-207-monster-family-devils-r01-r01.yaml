reviewer_findings:
  - id: RF-01
    subject: verified_node_routing_authority
    disposition: approved
    detail: >-
      All six proposed nodes in the GUP carry routing_basis: 'Constitution 1.8
      section 2: approved prefix and kind, valid ID, no duplicate'. I confirmed
      that the Builder authority citation fix is active and that no foreign
      DEC-2026-0003 citation exists anywhere in the GUP or in its validation
      report.
  - id: RF-02
    subject: source_named_devil_identities
    disposition: approved
    detail: >-
      The Primary Source Material contains six distinct creature headings and
      complete stat blocks: ARCHDEVIL, DEVIL, BARBED, DEVIL, CUBI, DEVIL, ERINYES,
      DEVIL, HORNED, and DEVIL, IMP. Labels preserve source commas and exact
      capitalization; IDs use standard snake_case transliteration with approved
      prefix monster_. All six IDs and exact labels are absent from the 481-row
      canonical node registry, which currently holds 50 monster identities.
  - id: RF-03
    subject: family_introduction_and_taxonomy_boundary
    disposition: approved
    detail: >-
      The DEVILS family introduction provides narrative framing describing devils
      as the vile reflection of angels and soldiers/generals/rulers in hell's
      wars, but establishes no direct mechanical rule, rollable table, or
      operative classification. Under Constitution 1.8 section 2.4, taxonomy-only
      creature-family membership remains outside the graph absent an
      evidence-bearing Architect Decision. No family-level node or membership edge
      is proposed.
  - id: RF-04
    subject: stat_block_locus_and_zero_edges
    disposition: approved
    detail: >-
      Constitution 1.8 sections 2 and 2.5 exclude individual creature stat-block
      descriptions, modifiers, and values from graph content. All fourteen
      special ability descriptions and notations (Archdevil's Impervious, Crown of
      Darkness, Soulbind; Barbed Devil's Barb; Cubi's Change Shape, Charm, Drain;
      Erinyes's Poison and +1 plate mail AC note; Horned Devil's Iron Hide; Imp's
      Impervious, Contract, Poison) are strictly local to their respective
      creature blocks. Recurring names (such as Impervious on Balor and Imp, or
      Poison on Erinyes and Imp) denote creature-specific abilities with
      divergent parameters, not shared rules or conditions. All 17 rejected
      candidates in the GUR are correctly excluded under the locus test. The
      zero-edge plan and empty edges component are complete.
  - id: RF-05
    subject: page_attribution
    disposition: approved
    detail: >-
      Explicit page marker {#p206} is anchored to ARCHDEVIL heading and applies
      to the family introduction, Archdevil, and Devil, Barbed blocks. Marker
      {#p207} is anchored to DEVIL, CUBI heading and persists through Devil,
      Erinyes, Devil, Horned, and Devil, Imp. The claimed two-page span (206-207)
      and all six defining loci agree with the explicit markers.
