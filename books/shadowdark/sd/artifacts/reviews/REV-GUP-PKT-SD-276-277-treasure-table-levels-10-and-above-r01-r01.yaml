      Proposed ID and label are confirmed absent from the canonical node registry (676 rows). Routing basis
      correctly cites Constitution 1.8 section 2. Reviewer approval granted.
  - id: RF-02
    subject: treasure_table_resolution_edge
    disposition: approved
    refs: [M001]
    detail: >-
      Edge M001 asserts rule_treasure RESOLVED_BY tbl_treasure_10_plus with aspect "treasure selection". The d100
      table determines random treasure selection for 10th-level and higher monsters and unguarded finds. RESOLVED_BY
      correctly captures the relationship between the core rule and its resolving table. Derived deterministic
      polarity "governs" conforms to Constitution 1.8 section 6.1 and Graph Invariant 14. Edge held pending until
      node registration is applied; approved for inclusion in the Approved bundle.
  - id: RF-03
    subject: table_entries_and_candidate_rejections
    disposition: approved_omission
    detail: >-
      Independently verified that all 50 table entries in the d100 table are properly excluded from individual
      edges under Graph Invariant 11 and Constitution 1.8 sections 2.4 and 2.5: monetary values (sp, gp) are
      numeric magnitudes; mundane/fine equipment items are roll outcomes whose definitions reside on pages 33–37;
      art curios (such as statuette of Gede, stained glass pane of St. Terragnis, marble throne) are decorative flavor;
      craftsmanship/ancestry mentions (dwarvish mead, elvish chainmail, lost language) are aesthetic flavor;
      legendary magic items, artifacts, and blessings (spell scrolls, Potions of Healing/Extirpation, Crystal Ball,
      Portable Hole, Demonskin/Divine Halo blessings, Brak's Cube, Flying Carpet, Obsidian Witchknife, Armor of
      Saint Terragnis, Staff of Ord) have defining loci in later magic item chapters (pp. 276+); and potion healing
      dice expressions (4d10 damage) are numeric magnitudes. All omissions confirmed correct.
  - id: RF-04
    subject: page_attributions
    disposition: approved
    detail: >-
      Primary Source Material opens on page 276 with explicit marker {#p276} on TREASURE 10+, carrying through entry
      44-45. Explicit inline marker {#p277} on entry 46-47 attributes the remainder of the table (entries 46-47 through
      00) to printed page 277. Page 276 attribution on M001 accurately reflects the table heading and locus origin.
