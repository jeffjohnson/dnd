  - id: RF-01
    subject: encounter_table_resolver
    disposition: approved
    refs: [M001]
    detail: >-
      The source-named Swamp Encounters Table is a further resolver of
      canonical Encounter on the distinct swamp-selection aspect.
  - id: RF-02
    subject: obscured_vision_constraint
    disposition: approved_precedent
    refs: [M002]
    detail: >-
      The mosquito-cloud result expressly obscures vision. CONSTRAINS is the
      correct hedged impairment rather than EXCLUDES, Vision is the stated
      mechanic, and governs/read is consistent with every canonical
      CONSTRAINS row. This is the encounter chapter's first CONSTRAINS row and
      the first table-sourced inbound relationship to Vision.
  - id: RF-03
    subject: rival_crawlers_result
    disposition: approved
    refs: [M003]
    detail: >-
      A group of rival crawlers expressly invokes the canonical Rival Crawlers
      procedure. The table-to-procedure reach is source-supported and distinct
      from existing encounter-table assertions.
  - id: RF-04
    subject: magic_item_treasure_availability
    disposition: approved
    refs: [M004]
    detail: >-
      The Swamp Shambler offers a random magic item. Magic Item already has a
      canonical route into Treasure, and an unpriced offer makes the category
      available rather than merely mentioning scenery or stock. The row meets
      the settled category-plus-availability test.
  - id: RF-05
    subject: environmental_omissions
    disposition: approved_omission
    detail: >-
      Swamp tar, bog conditions, creatures and other atmospheric results state
      properties or presence without an enacted use, trigger, check, damage or
      other supported mechanic. Withholding rows avoids inventing effects from
      descriptive content. The Analyst's discarded draft details are absent
      from the published GUR and GUP and require no remediation.
  - id: RF-06
    subject: table_registration_and_scope
    disposition: approved
    detail: >-
      Swamp Encounters Table is source-named, fresh, correctly prefixed and
      supports all four submitted rows. Magnitudes, table arithmetic, unnamed
      creatures and unsupported environmental mechanisms were correctly left
      unmodeled.
  - id: RF-07
    subject: authority_metadata
    disposition: informational_nonblocking
    detail: >-
      Builder validation text still names stale DEC-2026-0003. This Review
      applies current Shadowdark Constitution section 2 and common Reviewer
      authority directly; no submitted row depends on that citation.
