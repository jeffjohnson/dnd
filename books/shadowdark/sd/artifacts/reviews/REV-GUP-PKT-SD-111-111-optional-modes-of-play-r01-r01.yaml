reviewer_findings:
  - id: RF-01
    subject: modes_as_graph_identities
    disposition: approved
    detail: >-
      The frame and eight named modes are legitimate rule_ identities. Unlike
      danger levels or outcome labels that differ only by excluded magnitude,
      each mode participates in one or more reusable relationships, and the
      frame records their optional adoption.
  - id: RF-02
    subject: optional_status_and_compatibility
    disposition: approved
    refs: [M001, M002, M003, M004, M005, M006, M007, M008]
    detail: >-
      All eight frame-to-mode GATES rows correctly carry optional status. The
      source says to mix and match, so no ALTERNATIVE_TO relationship is owed.
  - id: RF-03
    subject: fatality_and_deadly_semantics
    disposition: approved
    refs: [M011, M012, M013]
    detail: >-
      Deadly Mode hardens but retains the dying machinery, so its timer and
      stabilization changes are MODIFIES. Fatality Mode abolishes Dying at zero
      hit points, so OVERRIDES with optional_variant is the correct distinct
      operation.
  - id: RF-04
    subject: remaining_mode_mechanics
    disposition: approved
    refs: [M009, M010, M014, M015, M016, M017, M018, M019, M020, M021, M023, M024]
    detail: >-
      Blitz, Chaos, Grinder, Hunter, Momentum, and the two new Luck Token uses
      are source-supported, correctly directed, and preserve the qualitative
      mechanic while excluding numeric magnitudes. The optional status on
      M023 and M024 limits those Luck Token inputs to variant play.
  - id: RF-05
    subject: pulp_token_grain
    disposition: approved_with_revision
    ref: M022
    detail: >-
      Correct M022's aspect from token supply to token capacity, then add a
      separate Pulp Mode MODIFIES Luck Token row with aspect starting supply.
      Both take improves/read and optional status; neither stores a number.
  - id: RF-06
    subject: unrepresented_effects
    disposition: informational_nonblocking
    detail: >-
      The forced-GM-reroll bullet lacks a GM-roll identity, and Hunter Mode's
      monster-level input lacks a monster-level identity. Those are genuine
      vocabulary/source-boundary gaps rather than missing relationships this
      packet can safely invent.
completeness_statement: >-
