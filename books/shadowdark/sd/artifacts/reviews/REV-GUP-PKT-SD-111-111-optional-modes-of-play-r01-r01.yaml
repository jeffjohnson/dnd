blocking_findings:
  - id: pulp_token_changes_conflated
    severity: blocking
    ref: M022
    detail: >-
      Pulp Mode makes two qualitatively distinct changes to Luck Tokens: it
      removes the maximum a player may hold, and it grants a starting supply
      each session. Their numeric magnitudes are excluded, but token capacity
      and starting supply remain separately queryable mechanics. M022's generic
      token-supply aspect collapses them into one assertion.
    source_citation:
      path: books/shadowdark/sd/packets/claimed/PKT-SD-111-111-optional-modes-of-play/source.md
      page: '111'
      section: PULP MODE
      evidence: >-
        The first bullet removes the maximum luck-token holding; the second
        gives players luck tokens at the start of every session.
