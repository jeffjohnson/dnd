  and the five disclosed observations were independently checked against
  Constitution 1.7, the current registry, and the canonical neighborhood. The
  identity model, optional status, mode compatibility, OVERRIDES basis, and
  twenty-three rows are correct. M022 must be narrowed to token capacity and a
  separate starting-supply row added before the packet is complete.
