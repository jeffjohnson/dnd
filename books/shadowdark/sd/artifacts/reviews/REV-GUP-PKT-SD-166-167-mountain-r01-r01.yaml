reviewer_findings:
  - id: RF-01
    subject: encounter_table_resolver
    disposition: approved
    refs: [M001]
    detail: >-
      The source-named Mountain Encounters Table is a further resolver of
      canonical Encounter on the distinct mountain-selection aspect.
  - id: RF-02
    subject: first_table_sourced_exclusion
    disposition: approved_precedent
    refs: [M002]
    detail: >-
      A blizzard or thunderstorm unhedgedly bars travel for days. EXCLUDES is
      correct because the source states prevention rather than a bound, and
      Overland Travel is the correct target because the effect uses the
      multi-day map-travel scale rather than local Movement. Negates/derived is
      mechanically correct. This first table-sourced EXCLUDES row introduces
      no exception to the existing hedged-versus-unhedged test.
  - id: RF-03
    subject: rival_crawlers_reach
    disposition: approved
    refs: [M003]
    detail: >-
      A group of rival crawlers explicitly invokes the canonical Rival
      Crawlers procedure and supports the table-to-procedure reach.
  - id: RF-04
    subject: conditional_luck_award
    disposition: approved
    refs: [M004]
    detail: >-
      The shrine expressly grants a Luck Token when an offering is made.
      FEEDS_INTO with the preserved condition records the award while correctly
      excluding its numeric magnitude. The abbreviated deity name supplies no
      separate deity relationship.
  - id: RF-05
    subject: treasure_acquisition_boundary
    disposition: approved_precedent
    refs: [M005]
    detail: >-
      A sphinx bestowing a magic item expressly states both the canonical
      category and acquisition, so the table feeds Treasure under the settled
      precedent. A dragon merely sleeping on a coin hoard states neither
      acquisition nor availability and correctly earns no row despite Coin's
      canonical path into Treasure. The paired cases confirm acquisition is a
      necessary independent element of this chapter's treasure test.
  - id: RF-06
    subject: trap_and_scan_boundaries
    disposition: approved_omissions
    detail: >-
      Creature-produced webs and a peasant pinned beneath a boulder do not
      describe placed trap mechanisms and correctly remain unlinked. Madeera's
      abbreviated mention demonstrates a real scan blind spot but does not
      justify a deity edge because a shrine is not the deity. The reported
      scan variation changes no relationship decision.
  - id: RF-07
    subject: table_registration_and_other_omissions
    disposition: approved
    detail: >-
      Mountain Encounters Table is source-named, fresh, correctly prefixed and
      supports all five rows. Creatures, named people, scenery, magnitudes,
      ordinary objects and table arithmetic were correctly withheld where no
      stated mechanic or supported endpoint exists.
  - id: RF-08
    subject: authority_metadata
    disposition: informational_nonblocking
    detail: >-
      Builder validation text still names stale DEC-2026-0003. This Review
      applies current Shadowdark Constitution section 2 and common Reviewer
      authority directly; no submitted row depends on that citation.
