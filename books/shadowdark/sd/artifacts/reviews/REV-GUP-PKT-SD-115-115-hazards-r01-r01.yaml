reviewer_findings:
  - id: RF-01
    subject: movement_restriction_hedging
    disposition: approved
    ref: M001
    detail: >-
      The source says some hazards inhibit or prevent movement and that hazards
      can fully entrap characters. Those hedges describe a governing bound on
      Movement rather than an absolute exclusion. CONSTRAINS with authored
      governs/read polarity is therefore correct, unlike the three canonical
      spell rows whose unhedged prevention supports EXCLUDES.
  - id: RF-02
    subject: damage_and_table_resolution
    disposition: approved
    refs: [M002, M003]
    detail: >-
      The source states that some hazards deal ongoing damage and supplies a
      named Hazards Table containing the selectable examples. TRIGGERS Damage
      and RESOLVED_BY the table preserve those reusable mechanics without
      encoding numeric magnitudes or treating individual prompts as rules.
  - id: RF-03
    subject: registry_additions
    disposition: approved
    proposed_ids: [rule_hazards, tbl_hazards]
    detail: >-
      Hazards is the source-named packet procedure and Hazards Table is its
      named reusable table. Both use constitution-approved prefixes and
      mechanically matching kinds, have complete labels and rationales, and
      are absent from the current registry.
  - id: RF-04
    subject: condition_and_disabling_vocabulary_gaps
    disposition: informational_nonblocking
    detail: >-
      Weakening and hampering lack a condition endpoint for the second
      consecutive packet, while the claims that hazards are generally obvious
      and not permanently disableable lack identities capable of expressing
      those contrasts. These are accumulating ontology limitations that may
      warrant future Architect attention, but no submitted row depends on
      resolving them and this packet cannot invent the missing vocabulary.
  - id: RF-05
    subject: caltrops_and_table_prompts
    disposition: rejected_candidates_confirmed
    detail: >-
      The table's Caltrops prompt does not identify the purchasable
      item_caltrops as a passive hazard mechanic. Selecting that single prompt
      because its label matches a registry identity would conflate an item
      with an environmental rule. The remaining prompts, Weakening examples,
      Combining advice, and thematic contrasts likewise lack definite
      packet-local relationships or endpoints.
  - id: RF-06
    subject: traps_neighborhood_count
    disposition: informational_nonblocking
    detail: >-
      The GUR describes the newly canonical Traps neighborhood as five rows;
      direct inspection finds six. The two rows material to its contrast are
      present exactly as claimed: Thief GATES Traps for disabling access and
      Check EXCLUDED_FROM Traps for discovery. The count error does not affect
      any proposed Hazards row or identity.
completeness_statement: >-
  Printed page 115, all three submitted rows, both node proposals, all five
  rejected-candidate groups, the hedging choice, and the current Movement and
  Traps neighborhoods were independently checked against Constitution 1.7,
  the registry, and canonical state. The rows are source-supported,
  collision-free, correctly grained, and complete for the representable
  mechanics. All three correctly await the two approved registrations.
