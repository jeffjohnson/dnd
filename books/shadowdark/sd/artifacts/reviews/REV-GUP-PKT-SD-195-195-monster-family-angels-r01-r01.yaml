blocking_findings:
  - id: nonexistent_shadowdark_decision_reference
    detail: >-
      Each proposed node's routing_basis cites DEC-2026-0003 as Shadowdark
      authority. The GUR correctly notes that this Shadowdark Decision does not
      exist; the source-backed normal-workflow authority is constitution 1.8
      section 2. Correct all four node-local routing_basis fields exactly as
      specified in their exact_corrections mappings. The identity judgments,
      labels, and zero-edge extraction remain unchanged.
    current_authority:
      path: rulesets/shadowdark/governance/constitution.md
      checksum: sha256:629e72cde3206228e1d1e569957dfff6aa275728c18ff4890c81cfcdc6e0c93d
reviewer_findings:
  - id: RF-01
    subject: node_routing_authority
    disposition: approved_with_revision
    refs: [monster_archangel, monster_angel_domini, monster_angel_principi, monster_angel_seraph]
    detail: >-
      All four identities are source-supported and collision-free, but their
      GUP routing_basis fields invoke a nonexistent Shadowdark DEC-2026-0003.
      Constitution 1.8 section 2 explicitly permits ordinary source-backed
      proposals under the approved monster_ prefix and kind. The exact row-local
      corrections replace the false authority citation without changing any
      source judgment or operation.
  - id: RF-02
    subject: source_named_creature_identities
    disposition: approved
    detail: >-
      The four separate stat-block headings name Archangel, Angel, Domini,
      Angel, Principi, and Angel, Seraph. Each has a complete defining stat
      block on printed page 195. The source labels preserve comma punctuation;
      the IDs are valid snake_case transliterations. The introductory plural
      Seraphim names the rank, not a fifth creature entry. Current registry ID
      and label checks are clear for all four.
  - id: RF-03
    subject: bless_and_luck_token
    disposition: approved_omission
    detail: >-
      Bless explicitly grants a luck token, and rule_luck_token is canonical;
      the shared target and the encounter-table FEEDS_INTO precedents were
      checked. Bless is nevertheless a limited-use trait stated only under the
      seraph's individual stat block. Constitution 2.5 says a stat-block
      description does not create an edge. Treating monster_angel_seraph as
      the source would conflate the creature identity with its separate trait,
      while proposing abil_bless would create an identity for individual
      stat-block content. No shared-locus statement generalizes Bless to angels.
      The GUR's locus-based omission is therefore correct even though its
      target is explicit.
  - id: RF-04
    subject: other_abilities_and_rank_taxonomy
    disposition: approved_omission
    detail: >-
      Command, Crown of Fire, Horn, Moonlight Aura, and Truesight are each
      stat-block-local descriptions, with no source-supported reusable ability
      identity or explicit edge that survives constitution 2.5. Crown of Fire
      and Moonlight Aura are separately named and independently stated, not one
      shared mechanic. The family introduction's relative rank hierarchy
      states no mechanical consequence and does not warrant a family or
      membership node.
  - id: RF-05
    subject: individual_values_flavour_and_scope
    disposition: approved_omission
    detail: >-
      The four flavour descriptions, individual printed stat-block values, and
      appended context from pages 189, 85, and morale are correctly excluded.
      The edge component is header-only and the zero-edge result is complete.
completeness_statement: >-
  Independently read all of printed page 195 from the claimed source, checked
  all four stat-block identities, exact labels and ID transliterations, reviewed
  the rank taxonomy and all six named abilities, and verified the local registry
  neighborhood plus rule_luck_token award edges. The proposed identities and
  zero-edge extraction are source-complete. Approval is withheld only until the
  four false routing_basis citations to a nonexistent Shadowdark Decision are
  replaced with the exact constitution-based authority specified above.
