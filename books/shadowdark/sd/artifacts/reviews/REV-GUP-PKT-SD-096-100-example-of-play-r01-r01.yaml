reviewer_findings:
  - id: RF-01
    subject: transcript_source_authority
    disposition: relationship_required
    detail: >-
      An example does not redefine identities or turn every table ruling into a
      general rule, but it remains registered Shadowdark source authority for a
      relationship it explicitly states. The GUR's blanket position that an
      example can never be a defining locus does not justify discarding the
      exact D6-Decider application.
  - id: RF-02
    subject: improvised_torch_damage
    disposition: rejected_candidate_confirmed
    detail: >-
      The GM says "I'd say" before assigning Torch damage, marking an immediate
      adjudication rather than a standing item property. The defining equipment
      locus gives Torch no damage rule, so no damage edge is warranted.
  - id: RF-03
    subject: canonical_restatements
    disposition: rejected_candidates_confirmed
    detail: >-
      Advantage cancellation, Total Darkness affecting sight tasks, resting
      after failed spellcasting, and the complete death-timer cluster are all
      already canonical from their defining rules. The transcript applies
      those relationships but adds no distinct assertion.
  - id: RF-04
    subject: fictional_characters_and_monster
    disposition: rejected_candidates_confirmed
    detail: >-
      The example cast demonstrates possible ancestry/class combinations but
      does not establish restrictions. The scum jelly belongs to its eventual
      creature entry, and the transcript's tentative resistance guess cannot
      establish a monster mechanic.
  - id: RF-05
    subject: random_encounter_noise
    disposition: informational_unrepresentable_here
    detail: >-
      The transcript causally attributes a random encounter check to noise, but
      no canonical noise or loud-disturbance identity exists. The GUR's count of
      five encounter edges is stale because the page-90 overland cadence is a
      sixth; none of the six supplies the missing endpoint or changes this
      packet's required Torch relationship.
  - id: RF-06
    subject: classified_as_gate_note
    disposition: informational_correction
    detail: >-
      The GUR's statement that IMP-DEC-2026-0104-r01 lacks an independent Review
      is stale; REV-IMP-DEC-2026-0104-r01-r01 is approved and terminal. No
      CLASSIFIED_AS row is nevertheless warranted here because the packet does
      not state an item-to-light-source classification.
  - id: RF-07
    subject: artwork_page
    disposition: approved_exclusion
    detail: >-
      Page 100 is steward-declared full-page artwork and correctly contributes
      no candidate or citation.
  - id: RF-08
    subject: gur_registry_snapshot
    disposition: informational
    detail: >-
      The GUR says 280 registry rows; the independently measured current
      registry contains 304. Both required endpoints are present with exact
      labels, so the stale count changes no operation.
completeness_statement: >-
  All pages 96 through 100 and all eight rejected candidates were independently
  checked against Constitution 1.7, the relevant defining sources, the current
  registry, and the canonical neighborhood. Seven candidate rejections are
  sound as restatement, improvisation, fiction, deferred identity, or currently
  unrepresentable material. The Torch-extinguish procedure is different: the
  transcript explicitly applies the canonical D6 Decider to a canonical Torch.
  The zero-edge GUP is therefore incomplete. A successor adding that single
  relationship, with no node registrations, will be complete.
