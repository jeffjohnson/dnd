blocking_findings:
  - id: missing_torch_extinguish_resolution
    severity: blocking
    detail: >-
      The page-98 transcript explicitly directs a d6 roll to determine whether
      the Torch extinguishes and specifies that 1-3 is the bad outcome. This
      exactly applies the canonical The D6 Decider procedure to canonical
      item_torch. The player's statement that they forgot about the roll further
      distinguishes it from the immediately preceding improvised damage ruling.
      SOURCE_MARKDOWN permits an incidental locus to support the relationship
      stated there even when it cannot redefine either identity.
    source_citation:
      path: books/shadowdark/sd/packets/claimed/PKT-SD-096-100-example-of-play/source.md
      page: '98'
      section: EXAMPLE OF PLAY
      evidence: >-
        The GM requires a d6 roll to see whether the torch extinguishes and
        states that 1-3 is bad; the player says they forgot about that rule.
