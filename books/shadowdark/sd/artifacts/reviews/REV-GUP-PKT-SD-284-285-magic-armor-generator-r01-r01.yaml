reviewer_findings:
  - id: RF-01
    subject: magic_armor_generator_tables_node_additions
    disposition: approved
    detail: >-
      The five proposed nodes tbl_armor_type (Armor Type Table, p. 284), tbl_armor_bonus (Armor Bonus Table, p. 284),
      tbl_armor_feature (Armor Feature Table, p. 284), tbl_armor_benefit (Armor Benefit Table, p. 285), and
      tbl_armor_curse (Armor Curse Table, p. 285) are source-named from explicit headings in the Primary Source Material.
      Prefix tbl_ and kind tbl are approved vocabulary under Constitution 1.8 section 2. Proposed IDs and labels are
      confirmed absent from the canonical node registry (690 rows). Routing bases correctly cite Constitution 1.8
      section 2. Reviewer approval granted for all five node registrations.
  - id: RF-02
    subject: magic_armor_generator_resolution_edges
    disposition: approved
    refs: [M001, M002, M003, M004, M005]
    detail: >-
      Edges M001–M005 assert item_magic_item RESOLVED_BY each corresponding magic armor generation table (tbl_armor_type
      with aspect "armor type selection", tbl_armor_bonus with aspect "armor bonus selection", tbl_armor_feature with
      aspect "armor feature selection", tbl_armor_benefit with aspect "armor benefit selection", and tbl_armor_curse with
      aspect "armor curse selection"), each scoped with condition "for magic armor". Derived deterministic polarity
      "governs" conforms to Constitution 1.8 section 6.1 and Graph Invariant 14. All five edges are held pending until
      node registrations are applied; approved for inclusion in the Approved bundle.
  - id: RF-03
    subject: table_entries_and_candidate_rejections
    disposition: approved_omission
    detail: >-
      Independently verified that all individual table rows, roll outcomes, and numeric magnitudes are properly
      excluded from edges under Graph Invariant 11 and Constitution 1.8 sections 2.4 and 2.5: Armor Bonus Table values
      (+0 to +3) are numeric magnitudes strictly excluded from edge aspects and conditions; Armor Feature Table entries
      (demonic horned face, shark teeth, arcane runes, cat eye, etc.) are aesthetic motifs and roll outcomes; Armor Benefit
      Table entries (deflect ranged attack, DC 9 stabilize, immune to fire/lava/magma, +4 bonus to death timers, fly 3 rounds,
      ignore damage 3 or below) and Armor Curse Table entries (take 2d10 damage, DC 15 WIS, double damage from blunt, 5 gear
      slots, DC 15 to cast, 1-in-6 chance betrayal, double damage from silvered) contain numeric magnitudes (damage dice,
      DCs, rounds, slot counts) and specific roll benefits/curses excluded from edge aspects and conditions under Graph
      Invariant 11 and Constitution 1.8 §§2.4/2.5; Armor Type Table items reference baseline armor items on pp. 34–37;
      and supporting context passages are out of packet scope. All omissions confirmed correct.
  - id: RF-04
    subject: page_attributions
    disposition: approved
    detail: >-
      Primary Source Material opens on page 284 with explicit marker {#p284} on ARMOR, carrying through ARMOR TYPE TABLE,
      ARMOR BONUS TABLE, and ARMOR FEATURE TABLE. Explicit marker {#p285} on ARMOR BENEFIT TABLE attributes that table
      and ARMOR CURSE TABLE to printed page 285. Page attributions on M001–M003 (p. 284) and M004–M005 (p. 285)
      strictly conform to placement rules.
