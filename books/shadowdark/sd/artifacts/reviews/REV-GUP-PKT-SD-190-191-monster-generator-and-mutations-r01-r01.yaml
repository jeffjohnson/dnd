reviewer_findings:
  - id: RF-01
    subject: generator_resolution
    disposition: approved
    refs: [M001]
    detail: >-
      The source-named Monster Generator procedure is resolved by its named
      table. The aspect monster identity follows the existing Shop Generator
      and Tavern Generator pattern and covers the table's generated result.
  - id: RF-02
    subject: party_level_identity
    disposition: approved
    refs: [M002]
    detail: >-
      PL is explicitly defined as the adventuring party's average character
      level. Reusing canonical exp_level preserves its character-side meaning;
      DERIVED_FROM correctly runs generated Armor Class to that input, while
      the condition limits the assertion and the numeric offset is omitted.
  - id: RF-03
    subject: combat_result_outputs
    disposition: approved
    refs: [M003, M004]
    detail: >-
      The source says the table's Combat result supplies both attack bonus and
      monster LV. FEEDS_INTO correctly records those two shared-mechanic outputs
      without storing any rolled or numeric creature value.
  - id: RF-04
    subject: mutation_treasure_level
    disposition: approved
    refs: [M005]
    detail: >-
      The mutations procedure explicitly raises the monster level used for
      treasure. MODIFIES with aspect treasure level and condition for rolling
      treasure is correctly bounded; the authored improves/read polarity is
      supported and the numeric increase is excluded.
  - id: RF-05
    subject: mstat_target_position
    disposition: approved
    refs: [M004, M005]
    detail: >-
      Both rows validate with mstat_monster_level in target position under the
      DEC-2026-0106 production schema. The identity is canonical with label
      Monster Level and is not conflated with character exp_level.
  - id: RF-06
    subject: excluded_generated_values
    disposition: approved_omission
    detail: >-
      The 96 Quality, Strength, Weakness, and Mutation cells describe one
      generated creature's values or abilities and remain outside graph content
      under Constitution 2.5. Damage, attack counts, offsets, mutation counts,
      and distances are magnitudes; examples and the epigraph add no assertion.
