      Potion of Legendary Deeds cosmetic angelic chord flavor and one level / zero XP numeric tokens;
      Potion of Polymorph pickled newt cosmetic flavor and 1 hour / 10 rounds duration figures;
      Potion of Vitality heartbeat cosmetic flavor, class HP die rolling specification, and DC 18 check threshold figure;
      Ring of Feather Falling owl feather cosmetic description, once per day frequency limit, and owl hooting personality lore;
      Ring of Fireballs bronze loop / red marble cosmetic description, far distance throwing range, and single-marble count;
      and supporting context passages (pp. 34–37, 60, 67, 86, 282–283) are out of packet scope.
      All omissions confirmed correct.
