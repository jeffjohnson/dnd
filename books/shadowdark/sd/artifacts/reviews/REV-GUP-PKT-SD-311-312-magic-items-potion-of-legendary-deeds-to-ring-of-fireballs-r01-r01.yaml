  - id: RF-02
    subject: magic_item_edges
    disposition: approved
    refs: [M001, M002, M003, M004, M005, M006, M007, M008, M009, M010]
    detail: >-
      Edges M001–M010 assert mechanical relations for the magic items:
      M001 asserts item_potion_of_legendary_deeds MODIFIES exp_level (aspect: "level advancement", condition: "when imbibed", polarity: improves);
      M002 asserts item_potion_of_legendary_deeds MODIFIES exp_xp (aspect: "total reset", condition: "when imbibed", polarity: neutral);
      M003 asserts item_potion_of_polymorph TRIGGERS spell_polymorph (aspect: "polymorph spell casting", condition: "when imbibed", polarity: neutral);
      M004 asserts item_potion_of_vitality MODIFIES rule_hit_points (aspect: "permanent hit points increase", condition: "when imbibed", polarity: improves);
      M005 asserts item_potion_of_vitality TRIGGERS abil_constitution (aspect: "lethal toxicity check", condition: "on drinking more than once in a lifetime", polarity: neutral);
      M006 asserts item_potion_of_vitality TRIGGERS rule_death (aspect: "instant death", condition: "on failed toxicity check", polarity: inflicts);
      M007 asserts item_ring_of_feather_falling TRIGGERS spell_feather_fall (aspect: "feather fall spell casting", condition: "when falling", polarity: neutral);
      M008 asserts alignment_neutral FEEDS_INTO item_ring_of_feather_falling (aspect: "item alignment", condition: "", polarity: neutral);
      M009 asserts item_ring_of_fireballs TRIGGERS spell_fireball (aspect: "fireball spell casting", condition: "when marble is thrown", polarity: neutral);
      and M010 asserts rule_resting CONSTRAINS item_ring_of_fireballs (aspect: "marble replenishment", condition: "on completing a rest", polarity: governs).
      All edge types, directions, conditions, and polarities strictly conform to Constitution 1.8 section 6.1 and Graph Invariant 14.
      Edges are held pending until node registrations are applied; approved for inclusion in the Approved bundle upon integration.
