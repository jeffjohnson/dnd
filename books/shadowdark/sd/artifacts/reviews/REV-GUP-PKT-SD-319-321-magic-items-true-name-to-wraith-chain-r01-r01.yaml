  - id: RF-02
    subject: magic_item_edges
    disposition: approved
    refs: [M001, M002, M003, M004, M005, M006, M007, M008, M009, M010, M011, M012, M013, M014, M015, M016, M017, M018, M019, M020, M021, M022, M023]
    detail: >-
      Edges M001–M023 model mechanics across the 7 magic items:
      True Name: M001/M002 assert attack roll and spellcasting check advantage;
      Wand of Unlife: M003/M004 feed into animate dead and create undead; M005 modifies abil_constitution; M006 triggers rule_death; M007 triggers monster_zombie;
      Wand of Warding: M008/M009 feed into dispel magic and protection from energy; M010 constrains rule_spellcasting_check;
      War Horn of the Angels: M011 gates alignment_lawful; M012 feeds into rebuke unholy; M013 modifies rule_spellcasting_check; M014 constrains abil_charisma;
      Warhammer of the Dwarf Lords: M015/M016 assert weapon attack/damage bonuses; M017/M018 assert dwarven attack/damage bonuses; M019 feeds into rule_thrown; M020 modifies cbt_damage_roll (double damage against giants);
      Well of Many Worlds: M021 feeds into spell_teleport;
      Wraith Chain: M022 modifies cbt_armor_class; M023 modifies cbt_attack_roll.
  - id: RF-03
    subject: distinctness_of_near_duplicate_pair
    disposition: approved
    refs: [M016, M020]
    detail: >-
      Audit of near-duplicate finding:
      M016 and M020 share endpoints (item_warhammer_of_the_dwarf_lords MODIFIES cbt_damage_roll).
      M016 represents the baseline weapon damage bonus; M020 represents the double damage multiplier against giants.
      Approved as distinct assertions.
  - id: RF-04
    subject: evaluation_of_grain_warning
    disposition: approved
    refs: [M006]
    detail: >-
      Condition 'on reaching zero constitution' on M006 identifies the mechanical condition state of complete constitution loss
      triggering death, exactly mirroring established rulings for zero hit points. Evaluated and approved.
  - id: RF-05
    subject: excluded_content_audit
    disposition: approved
    detail: >-
      Audit of exclusions against source prose:
      True Name Covenant worldbuilding lore;
      Wand of Unlife 1d4 Constitution loss figure;
      Wand of Warding random spell selection;
      War Horn of the Angels +4 bonus magnitude;
      Warhammer of the Dwarf Lords +1/+2 numeric bonuses and near distance figure;
      Well of Many Worlds 6-foot dimension and random plane determination;
      Wraith Chain +1 bonus magnitude;
      and supporting context passages (pp. 34–37, 58, 69, 86, 282–283) are out of packet scope.
      All omissions confirmed correct.
  - id: RF-06
    subject: page_attributions
    disposition: approved
    detail: >-
      Primary Source Material spans pages 319–321 with explicit page markers:
      TRUE NAME and WAND OF UNLIFE are on page 319 (M001–M007);
