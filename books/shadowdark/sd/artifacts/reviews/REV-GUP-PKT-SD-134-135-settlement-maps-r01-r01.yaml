      - tbl_settlement_market
      - tbl_settlement_high_district
      - tbl_settlement_temple_district
      - tbl_settlement_university_district
      - tbl_settlement_castle_district
    detail: >-
      All twelve proposals are source-named identities at their defining loci,
      use approved prefixes and matching kinds, carry complete labels and
      rationales, and are absent from the current registry. Every proposal
      supports at least one approved relationship.
  - id: RF-05
    subject: tavern_and_shop_forward_references
    disposition: deferred_nonblocking
    detail: >-
      The page explicitly points to taverns on page 136 and shops on page 138,
      but neither endpoint exists in the current registry. This packet cannot
      mint identities from those later defining loci. Once those packets are
      integrated, a bounded successor may add the source-backed reaches; their
      current absence does not make any submitted row false.
  - id: RF-06
    subject: physical_map_method_and_descriptive_results
    disposition: rejected_candidates_confirmed
    detail: >-
      Dice positions, drawn outlines, street lines, highest-roll placement,
      point-of-interest quantities, and individual district results are
      magnitudes, physical-artifact operations, or descriptive locations.
      They lack supported endpoints and correctly remain outside the graph.
  - id: RF-07
    subject: source_structure_and_status
    disposition: verified_core
    detail: >-
      Direct inspection confirms seven procedure paragraphs, eleven named
      tables, and 51 data rows, including 36 rows across the eight district
      tables. Both page markers are on headings. The roll-or-choose language
      selects a settlement type rather than making the procedure optional, so
      all fourteen submitted rows are correctly core.
