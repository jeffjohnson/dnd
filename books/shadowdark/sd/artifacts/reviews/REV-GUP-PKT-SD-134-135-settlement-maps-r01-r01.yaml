reviewer_findings:
  - id: RF-01
    subject: settlement_generator_structure
    disposition: approved
    refs: [M001, M002, M003, M004, M005]
    detail: >-
      Settlement Maps is directly resolved by its type, districts, and
      alignment tables. Alignment is independently resolved by the alignment
      table, and the type table supplies the district dice that feed the
      districts table. These directions preserve the source's two-tier
      procedure and match the settled generator pattern.
  - id: RF-02
    subject: district_table_fan_out
    disposition: approved
    refs: [M007, M008, M009, M010, M011, M012, M013, M014]
    detail: >-
      The eight Settlement Districts results exactly match the eight named
      point-of-interest table headings on page 135. Eight FEEDS_INTO rows with
      the shared aspect point of interest table accurately carry that explicit
      result-to-table selection without inventing identities for individual
      locations.
  - id: RF-03
    subject: chaotic_settlement_danger
    disposition: approved
    refs: [M006]
    detail: >-
      The source explicitly says to treat chaotic settlements and districts
      as Risky for random-encounter checks. alignment_chaotic FEEDS_INTO
      rule_danger_level with aspect settlement danger records the value-setting
      input at the correct aggregate identity. The canonical Danger Level →
      Encounter cadence row already carries the downstream consequence, so no
      second direct Encounter row is needed.
  - id: RF-04
    subject: registry_additions
    disposition: approved
    proposed_ids:
