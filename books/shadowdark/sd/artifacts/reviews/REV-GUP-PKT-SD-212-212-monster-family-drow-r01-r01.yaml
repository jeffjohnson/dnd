  - id: RF-03
    subject: stat_block_locus_and_zero_edges
    disposition: approved
    detail: >-
      Constitution 1.8 sections 2.4 and 2.5 exclude individual creature stat-block
      descriptions, modifiers, and values from graph content. The special ability
      descriptions (Poison sleep, Poison paralysis, and Sunblind) describe
      creature-local combat traits and magnitudes (DC 15 CON, 1d4 rounds duration),
      not cross-mechanic graph relationships. The mithral chainmail notation
      explains inherent AC on creature locus without modifying armor rules. All
      eleven rejected candidates in the GUR are correctly excluded under the locus
      test. The zero-edge plan and empty edges component are complete.
  - id: RF-04
    subject: monster_stat_block_spellcasting_locus
    disposition: approved
    detail: >-
      Drow, Priestess carries Snuff, Summon Spiders, and Web as innate WIS spells
      with unique DCs (12, 14, 13) and creature-specific parameters (extinguish light
      within near, summon 2d4 giant spiders for 5 rounds, near cube web immobilizing
      for 5 rounds). Under Constitution 1.8 section 2.5, monster stat-block spells
      operate on the creature's own attack and spellcasting locus rather than creating
      cross-mechanic edges into character spell nodes or general hazard rules.
  - id: RF-05
    subject: page_attribution
    disposition: approved
    detail: >-
