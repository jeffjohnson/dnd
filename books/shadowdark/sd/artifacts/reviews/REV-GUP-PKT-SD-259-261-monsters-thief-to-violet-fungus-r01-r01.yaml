reviewer_findings:
  - id: RF-01
    subject: verified_node_routing_authority
    disposition: approved
    detail: >-
      All nine proposed nodes in the GUP carry routing_basis: 'Constitution 1.8 section 2: approved prefix and kind, valid ID, no duplicate'. Prefix monster_ and kind monster are approved vocabulary under Constitution 1.8 section 2.
  - id: RF-02
    subject: source_named_monster_identities
    disposition: approved
    detail: >-
      The Primary Source Material on pages 259–261 contains nine distinct creature headings and complete stat blocks: THIEF, THUG, TREANT, and TROLL on page 259; TROLL, FROST, UNICORN, and VAMPIRE on page 260; and VAMPIRE SPAWN and VIOLET FUNGUS on page 261. Labels preserve exact source wording and punctuation; IDs drop commas where present and use standard snake_case transliteration with approved prefix monster_. All nine IDs are absent from the 649-row canonical node registry, which currently holds 218 monster identities.
  - id: RF-03
    subject: stat_block_locus_and_zero_edges
    disposition: approved
    detail: >-
      Constitution 1.8 sections 2.4 and 2.5 exclude individual creature stat-block descriptions, modifiers, and combat traits from graph content. Thief Stealthy (ADV on DEX sneak/hide), Backstab (x2 damage against surprised), and gear; Thug weapon/armor annotations; Treant Animate Tree (2/day awake treant ally); Troll Regenerate (regains 2d6 HP unless fire/acid); Troll, Frost Impervious (cold/fire immune) and Regenerate (regains 2d6 HP unless acid); Unicorn Healing Horn (heals 2d6 HP or ends curse/disease); Vampire Supreme Undead (morale immune, magic damage only), Blood Drain (heals 2d6, target loses 1d4 CON, 0 CON rises as vampire/spawn), Charm (DC 15 CHA control 1d4 days), Shapechange, and coffin/sunlight/wooden stake rules; Vampire Spawn Greater Undead (silver/magic only), Blood Drain, and coffin/sunlight/stake rules; and Violet Fungus tendril attack and flesh-decomposing descriptions all operate strictly on creature combat/action loci rather than ruleset-wide mechanics or global systems. All candidate rejections in the GUR are verified correct under Constitution 2.4/2.5. The zero-edge plan and empty edges component are complete.
  - id: RF-04
    subject: graph_invariant_4_creature_ancestry_language_and_class_distinction
    disposition: approved
    detail: >-
      Graph Invariant 4 requires strict differentiation between creature identity nodes and any corresponding ancestry, class, or language nodes. Evaluated proposed node monster_thief against canonical class_thief. Labels do not determine identity; the distinct kind (monster vs class) and approved prefix (monster_ vs class_) preserve ontological integrity between the Chapter 11 monster encounter stat block and the Chapter 2 playable character class. None of the other proposed creature identities conflate with any playable ancestry, class, or language.
  - id: RF-05
    subject: page_attributions
    disposition: approved
    detail: >-
      Primary Source Material opens directly on page 259 with explicit marker {#p259} on Thief (persisting through Thug, Treant, and Troll). Two explicit page markers follow: {#p260} on Troll, Frost (persisting through Unicorn and Vampire); and {#p261} on Vampire Spawn (persisting through Violet Fungus). The claimed three-page span (259–261) and all nine defining loci agree with the markers and structural placement rules.
completeness_statement: >-
  Independently read the complete claimed Primary Source Material on pages 259–261 at its pinned checksum, verified all nine creature identities against their defining stat blocks, derived page attributions directly from explicit markers {#p259}, {#p260}, and {#p261}, evaluated Graph Invariant 4 for monster_thief against class_thief and confirmed identity separation, confirmed the exclusion of all stat-block combat traits, regeneration, healing horns, vampire traits and spawn generation, immunities, equipment annotations, and attributes under Constitution 2.4 and 2.5, and verified that Builder authority citations strictly cite Constitution 1.8 section 2. The packet yields 9 new node registrations and 0 edge insertions, with 0 errors and 1 expected label warning. Mechanically complete and approved for integration.
