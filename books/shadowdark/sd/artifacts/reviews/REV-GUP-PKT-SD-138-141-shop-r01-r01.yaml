reviewer_findings:
  - id: RF-01
    subject: shop_procedure_identity
    disposition: approved
    refs: [M001, M002, M003, M004, M005]
    detail: >-
      The source establishes one operative Shop procedure through structure:
      three mutually exclusive tier tables resolve the shop type, the Shop
      Generator Table resolves its identity, and the Shop Interesting Customer
      Table resolves its customer. A defining prose sentence is not required
      where the heading and coordinated tables directly establish the same
      bounded procedure.
  - id: RF-02
    subject: npc_precedent_distinguished
    disposition: approved
    detail: >-
      The page-124 NPC tables do not control this identity question. They are
      independent attribute tables, four of which have no graph endpoint, while
      these five tables are jointly organized around one named Shop procedure.
      The distinction is functional structure, not the presence or absence of
      prose.
  - id: RF-03
    subject: shop_tier_exclusivity
    disposition: approved
    refs: [M006, M007, M008]
    detail: >-
      Poor, Standard, and Wealthy are mutually exclusive shop tiers. The three
      pairwise ALTERNATIVE_TO rows preserve that selection constraint, which
      RESOLVED_BY alone cannot express, and match the established symmetric
      three-member representation.
  - id: RF-04
    subject: rival_crawlers_result
    disposition: approved
    refs: [M009]
    detail: >-
      Rival crawlers is a result in the customer table and names the exact
      canonical Rival Crawlers generator. FEEDS_INTO correctly connects that
      selected result to the procedure; the other customer descriptions name
      people or categories and correctly yield no graph rows.
  - id: RF-05
    subject: registry_additions
    disposition: approved
    detail: >-
      All six proposed identities are source-named at their defining loci, use
      approved prefixes and matching kinds, carry complete labels and reasons,
      are absent from the live registry, and support approved relationships.
  - id: RF-06
    subject: traceability_and_measurement_notes
    disposition: informational_nonblocking
    detail: >-
      The GUR authority list names a nonexistent Shadowdark path for
      DEC-2026-0003; the actual Decision is AD&D-scoped. This Review does not
      rely on that citation: current common Reviewer instructions independently
      authorize unambiguous additions under approved prefixes and kinds. The
      GUR's customer-label example also misidentifies one plural match, but its
      material conclusion remains correct: Rival Crawlers is the sole result
      that invokes a canonical procedure.
