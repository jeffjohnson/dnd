blocking_findings:
  - id: m028_numeric_threshold_in_condition
    severity: blocking
    detail: >-
      M028's submitted condition, "when the target drops to zero", stores the
      numeric hit-point threshold zero. Constitution 1.7 section 4 requires a
      condition to express applicability without encoding numeric rule data.
      The row remains source-supported after the exact qualitative correction
      "when the target's hit points are depleted".
