reviewer_findings:
  - id: RF-01
    subject: prismatic_orb_anathema_damage
    disposition: approved
    ref: M037
    detail: >-
      The magnitude is excluded, but the source separately states the
      mechanically consequential conditional relationship: an anathema energy
      choice changes the spell's damage. M037 preserves that relationship and
      its applicability without storing the multiplier, so it is not an empty
      magnitude-only assertion.
  - id: RF-02
    subject: power_word_kill_mishap_table
    disposition: nonblocking_complete_as_submitted
    detail: >-
      The entry explicitly triggers critical failure and disadvantage on its
      mishap roll, which M032 and M033 record. It does not name the tier-5 table.
      That table is reached through the spell's Tier 5 classification and the
      already-canonical tier-selection rule; adding a direct table row here
      would duplicate a derived conclusion rather than extract source text.
  - id: RF-03
    subject: magic_missile_advantage_pair
    disposition: approved
    refs: [M001, M002]
    detail: >-
      M001 records the spell's improvement to its casting check. M002 records
      the named Advantage rule as the supplying input to the spell. Both are
      independently load-bearing and follow the same impact-analysis pattern
      used for Illusion's resisting check and supplied threshold; neither is a
      duplicate under the assertion key.
  - id: RF-04
    subject: page_65_leading_content
    disposition: nonblocking_verified
    detail: >-
      The claimed packet manifest supplies the independent locator permitted by
      SOURCE_MARKDOWN. The preceding packet's page-65 MAGIC CIRCLE entry
      immediately precedes the four unmarked entries here, and PASSWALL begins
      page 66. Pages 65 through 67 are reproducible without line-count
      estimation.
