  - id: RF-02
    subject: source_named_giant_identities
    disposition: approved
    detail: >-
      The Primary Source Material on pages 218 and 219 contains seven distinct
      creature headings and complete stat blocks: GIANT, CLOUD; GIANT, FIRE;
      GIANT, FROST; GIANT, GOAT; GIANT, HILL; GIANT, STONE; and GIANT, STORM.
      Labels preserve exact source wording and comma placement; IDs drop commas
      and use standard snake_case transliteration with approved prefix monster_.
      All seven IDs and exact labels are absent from the 527-row canonical node
      registry, which currently holds 96 monster identities.
  - id: RF-03
    subject: stat_block_locus_and_zero_edges
    disposition: approved
    detail: >-
      Constitution 1.8 sections 2.4 and 2.5 exclude individual creature stat-block
      descriptions, modifiers, and values from graph content. The special ability
      descriptions (Alert, Fireblood, Frostblood, Stone Hide, Stormblood,
      Lightning Bolt, and boulder throw attacks) describe creature-local combat
      traits and magnitudes, not cross-mechanic graph relationships. The armor
      notations (leather, plate mail, chainmail, mithral chainmail) explain
      inherent AC on creature locus without modifying equipment rules. All 12
      rejected candidates in the GUR are correctly excluded under the locus test.
      The zero-edge plan and empty edges component are complete.
  - id: RF-04
    subject: family_taxonomy_and_historical_lore_excluded
    disposition: approved
    detail: >-
      The two-paragraph family introduction on page 218 describes the ancient rule
      of giants, wars with dragons, and habitat lore. Under Constitution 1.8
      section 2.4, narrative framing, historical lore, and family taxonomy are
      excluded absent an explicit Decision.
  - id: RF-05
    subject: page_attribution
    disposition: approved
    detail: >-
      Two explicit page markers govern this packet: {#p218} on the GIANTS heading
      (persisting through GIANT, CLOUD and GIANT, FIRE) and {#p219} on the GIANT,
      FROST heading (persisting through GIANT, GOAT, GIANT, HILL, GIANT, STONE, and
      GIANT, STORM). All seven defining loci and the claimed two-page span
      (218–219) agree with the source markers.
