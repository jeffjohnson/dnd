      Bracers of Defense +1 AC bonus magnitude (prohibited under Invariant 11);
      Brak's Book of Misspells cosmetic ratskin/rune description;
      Brak's Cube of Perfection 18 (+4) stat target magnitude, d6 roll bands (1-6), and multiverse teleportation lore;
      Circlet of Wisdom 18 (+4) stat target magnitude and silver/pearl description;
      Cloak of Elvenkind DC 9 check difficulty, once per day frequency, and 5 rounds duration;
      Cloak of the Bat d20 roll outcome 1 mishap chance, 3 rounds duration, and bat transformation roll outcome;
      Crystal Ball 1 day recharge duration;
      Dagger of the Goblin Hero +1 bonus magnitude and friendly attitude roleplay guidance;
      Egg of the Cockatrice once per week frequency, 5 rounds duration, and 1 week repair duration;
      Flying Carpet two riders capacity, double near speed magnitude, and Neutral/Playful personality lore;
      and supporting context passages (pp. 282–283, 34–35, 70) are out of packet scope.
      All omissions confirmed correct.
