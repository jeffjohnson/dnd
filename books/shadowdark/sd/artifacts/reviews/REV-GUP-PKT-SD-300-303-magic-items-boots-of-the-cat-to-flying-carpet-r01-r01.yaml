      Edges M001–M023 assert mechanical relations for the 12 magic items: M001 asserts item_boots_of_the_cat
      MODIFIES ex_movement (aspect: "jump movement", condition: "from a standstill", polarity: improves);
      M002 asserts item_boots_of_the_cat MODIFIES abil_dexterity (aspect: "stealth check ease", condition: "to move silently", polarity: improves);
      M003 asserts item_bracers_of_archery MODIFIES cbt_damage_roll (aspect: "ranged damage bonus", condition: "with ranged weapons", polarity: improves);
      M004 asserts item_bracers_of_defense MODIFIES cbt_armor_class (aspect: "armor bonus", condition: "while wearing bracers", polarity: improves);
      M005 asserts item_braks_book_of_misspells TRIGGERS spell_acid_arrow (aspect: "contained spell targeting", condition: "on successful cast", polarity: neutral);
      M006 asserts item_braks_book_of_misspells TRIGGERS spell_fireball (aspect: "contained spell targeting", condition: "on successful cast", polarity: neutral);
      M007 asserts item_braks_book_of_misspells TRIGGERS spell_sleep (aspect: "contained spell targeting", condition: "on successful cast", polarity: neutral);
      M008 asserts class_wizard GATES item_braks_book_of_misspells (aspect: "spellbook usability", condition: "to cast or learn spells", polarity: enables);
      M009 asserts item_braks_cube_of_perfection MODIFIES abil_strength (aspect: "stat increase", condition: "when rolled", polarity: improves);
      M010 asserts item_braks_cube_of_perfection MODIFIES abil_dexterity (aspect: "stat increase", condition: "when rolled", polarity: improves);
      M011 asserts item_braks_cube_of_perfection MODIFIES abil_constitution (aspect: "stat increase", condition: "when rolled", polarity: improves);
      M012 asserts item_braks_cube_of_perfection MODIFIES abil_intelligence (aspect: "stat increase", condition: "when rolled", polarity: improves);
      M013 asserts item_braks_cube_of_perfection MODIFIES abil_wisdom (aspect: "stat increase", condition: "when rolled", polarity: improves);
      M014 asserts item_braks_cube_of_perfection MODIFIES abil_charisma (aspect: "stat increase", condition: "when rolled", polarity: improves);
      M015 asserts item_circlet_of_wisdom MODIFIES abil_wisdom (aspect: "stat replacement", condition: "while wearing circlet", polarity: improves);
      M016 asserts item_cloak_of_elvenkind MODIFIES abil_dexterity (aspect: "hiding ease", condition: "to hide", polarity: improves);
      M017 asserts item_cloak_of_the_bat MODIFIES ex_movement (aspect: "flight movement", condition: "in shadowy area", polarity: improves);
      M018 asserts class_wizard GATES item_crystal_ball (aspect: "item usability", condition: "to use item", polarity: enables);
      M019 asserts rule_spellcasting_check CONSTRAINS item_crystal_ball (aspect: "failure consequence", condition: "on failed check", polarity: governs);
      M020 asserts item_dagger_of_the_goblin_hero MODIFIES cbt_attack_roll (aspect: "attack bonus", condition: "when attacking with this weapon", polarity: improves);
      M021 asserts item_dagger_of_the_goblin_hero GATES lang_goblin (aspect: "language comprehension", condition: "while attuned or held", polarity: enables);
      M022 asserts item_egg_of_the_cockatrice TRIGGERS monster_cockatrice (aspect: "cockatrice summoning", condition: "when command word spoken", polarity: neutral);
      and M023 asserts item_flying_carpet MODIFIES ex_movement (aspect: "flight movement", condition: "on driver turn", polarity: improves).
      All edge types, directions, conditions, and polarities strictly conform to Constitution 1.8 section 6.1 and Graph Invariant 14.
      Edges are held pending until node registrations are applied; approved for inclusion in the Approved bundle upon integration.
