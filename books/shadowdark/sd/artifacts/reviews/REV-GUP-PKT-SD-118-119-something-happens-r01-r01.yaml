reviewer_findings:
  - id: RF-01
    subject: unattached_table_identity
    disposition: approved_registry_addition_only
    proposed_id: tbl_something_happens
    detail: >-
      Something Happens Table is a source-named table at its defining locus,
      uses the approved tbl_ prefix and matching kind, and is absent from the
      registry. DEC-2026-0003 separates node approval from edge insertion, so
      lack of a current relationship does not erase a valid identity. Making
      recognition depend on a pre-existing edge would be circular. The first
      degree-zero tbl_ entry is unusual but constitutionally valid and remains
      available if a later source explicitly names the table.
  - id: RF-02
    subject: no_parent_or_trigger_relationship
    disposition: no_edge_approved
    detail: >-
      The two pages contain only the named table and its narrative results.
      They state no trigger, roll instruction, parent rule, or mechanical
      consequence, and no canonical rule names this table. A RESOLVED_BY or
      TRIGGERS row would therefore invent a relationship absent from the
      source. Zero edge decisions are complete rather than incomplete.
  - id: RF-03
    subject: narrative_results
    disposition: rejected_candidates_confirmed
    detail: >-
      The extinguished-light result and other prompts that resemble canonical
      concepts are single fictional possibilities among fifty results. They
      do not assert reusable mechanics, and same-name reuse would conflate
      situations, spells, ancestries, or items with the prompt text. No result
      supports an edge under the closed vocabulary.
  - id: RF-04
    subject: table_row_page_marker
    disposition: verified
    detail: >-
      The p119 marker appears in the final cell of the yellow-eyes row and
      applies to that entire row. Direct counting confirms 50 result rows: 23
      on printed page 118 and 27 on page 119. The mid-table marker is handled
      consistently with SOURCE_MARKDOWN's table-row attribution rule.
  - id: RF-05
    subject: registry_precedent
    disposition: informational_nonblocking
    detail: >-
      All 44 existing tbl_ identities currently have positive degree, while
      the 23 degree-zero identities are lang_ or spell_ entries. That history
      shows this table is the first of its precise shape, not that the shape is
      prohibited. Registry-only language additions and the formerly isolated
      D6 Decider confirm that identity registration may precede a relationship.
completeness_statement: >-
  Printed pages 118 and 119, all fifty narrative results, the table-row page
  marker, the sole node proposal, all three rejected-candidate groups, and
  IDQ-01 were independently checked against Constitution 1.7, DEC-2026-0003,
  the registry, and canonical state. The named table is a valid registry-only
  identity. The packet correctly contains no edges because the source states
  no legal relationship to or from the table.
