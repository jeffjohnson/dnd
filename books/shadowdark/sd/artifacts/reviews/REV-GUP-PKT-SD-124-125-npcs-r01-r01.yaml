reviewer_findings:
  - id: RF-01
    subject: npc_axis_row_status
    disposition: approved_core
    refs: [M001, M002]
    detail: >-
      Pages 124–125 present the NPC ancestry and alignment tables directly and
      state no alternative or variant status. Their RESOLVED_BY rows are core.
      The six structurally similar page-40/41 rows are optional because their
      character-generation context expressly permits choosing instead of
      rolling. Structural similarity determines type and aspect, but it does
      not transfer source-specific optionality.
  - id: RF-02
    subject: axis_level_resolution
    disposition: approved
    refs: [M001, M002]
    detail: >-
      NPC Ancestry selects from the six canonical Ancestry members and NPC
      Alignment selects from the three canonical Alignment members. One
      RESOLVED_BY row per axis matches the established graph grain. Nine
      result-level rows would redundantly encode membership and still could
      not preserve the tables' numeric weighting.
  - id: RF-03
    subject: registry_additions
    disposition: approved
    proposed_ids:
      - tbl_npc_ancestry
      - tbl_npc_alignment
      - tbl_npc_age
      - tbl_npc_wealth
      - tbl_npc_qualities
      - tbl_npc_occupation
    detail: >-
      All six proposals are source-named tables at their defining loci, use
      the approved tbl_ prefix and matching kind, have complete labels and
      rationales, and are absent from the registry. Ancestry and Alignment
      carry approved edges; Age, Wealth, Qualities, and Occupation correctly
      use the settled registry-only mechanism because their outputs have no
      graph identities.
  - id: RF-04
    subject: descriptive_table_results
    disposition: rejected_candidates_confirmed
    detail: >-
      Age and Wealth bands contain no mechanics or values the graph can store;
      Qualities are narrative; and Occupation is a two-dice layout selecting
      trades without mechanical identities. Same-name mentions such as a
      wizard's apprentice, werewolf, basilisk, or Thieves' Guild are fictional
      descriptions, not relationships to canonical nodes.
  - id: RF-05
    subject: generator_edge_test
    disposition: verified
    detail: >-
      The correct distinction is whether a table selects from an existing
      graph axis, not whether its page contains prose. That test supports the
      two axis rows and explains why the other four tables remain registry-only
      without changing the settled treatment of prior narrative generators.
  - id: RF-06
    subject: source_structure_and_page_attribution
    disposition: verified
    detail: >-
      The source contains six named tables, 43 data rows, and 95 text cells
      excluding die-index cells. The p124 and p125 markers are on headings;
      Ancestry, Alignment, Age, and Wealth are page 124, while Qualities and
      Occupation are page 125.
completeness_statement: >-
  Printed pages 124 and 125, all six tables, 43 data rows, 95 text cells, both
  submitted relationships, all six node proposals, all four rejected-candidate
  groups, IDQ-01, and the six page-40/41 precedent rows were independently
  checked against Constitution 1.7, DEC-2026-0003, the registry, and canonical
  state. M001 and M002 are correctly core. Both are source-supported and
  collision-free; the four remaining named tables are complete registry-only
  additions.
