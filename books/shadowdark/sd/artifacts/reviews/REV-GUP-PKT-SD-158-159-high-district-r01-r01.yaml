reviewer_findings:
  - id: RF-01
    subject: encounter_table_resolver
    disposition: approved
    refs: [M001]
    detail: >-
      The source-named High District Encounters Table is a further resolver of
      canonical Encounter on the distinct high-selection aspect.
  - id: RF-02
    subject: first_causal_table_to_spell_edge
    disposition: approved_precedent
    refs: [M002]
    detail: >-
      The malfunctioning ward explicitly casts Web on the party. TRIGGERS is
      correct because the encounter causes the cast; FEEDS_INTO would imply an
      input and MODIFIES would imply changed spell behavior. Neutral/read is
      also correct: this row states occurrence, while Web's restraining and
      movement-negating consequences remain on its page-73 canonical rows.
      Future table or creature spell-casting rows should preserve this split
      unless their own source text independently states a directed effect.
  - id: RF-03
    subject: crawler_wording_pair
    disposition: approved_distinction
    refs: [M003]
    detail: >-
      Rival crawlers with sheriff pins explicitly identify the canonical Rival
      Crawlers procedure and support M003. Crawlers with the Mercenaries Guild
      lack the qualifying rival concept and correctly remain unlinked. Their
      actual separation is thirty-one table rows, not twelve, but distance does
      not affect the semantic distinction.
  - id: RF-04
    subject: scan_measurement_disclosures
    disposition: informational_nonblocking
    detail: >-
      A fuller stemmer also finds Loading through loaded and Heal through
      healing. Neither supplies a missing relationship: loaded dice are an
      object description, while offered healing names no accepted or resolved
      effect. The scan differences change no submitted or rejected decision.
  - id: RF-05
    subject: table_registration_and_omissions
    disposition: approved
    detail: >-
      High District Encounters Table is source-named, fresh, correctly
      prefixed and supports all three rows. Named people, creature identities,
      offered healing, denomination-and-probability transformations,
      hazardous scenes without stated mechanics, the reroll instruction and
      supporting context were correctly withheld.
  - id: RF-06
    subject: authority_metadata
    disposition: informational_nonblocking
    detail: >-
      Builder validation text still names stale DEC-2026-0003. This Review
      applies current Shadowdark Constitution section 2 and common Reviewer
      authority directly; no submitted row depends on that citation.
