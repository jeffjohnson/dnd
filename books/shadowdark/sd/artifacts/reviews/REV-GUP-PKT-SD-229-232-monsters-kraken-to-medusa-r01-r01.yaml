reviewer_findings:
  - id: RF-01
    subject: verified_node_routing_authority
    disposition: approved
    detail: >-
      All twelve proposed nodes in the GUP carry routing_basis: 'Constitution 1.8 section 2: approved prefix and kind, valid ID, no duplicate'. Prefix monster_ and kind monster are approved vocabulary under Constitution 1.8 section 2.
  - id: RF-02
    subject: source_named_monster_identities
    disposition: approved
    detail: >-
      The Primary Source Material on pages 229–232 contains twelve distinct creature headings and complete stat blocks: KRAKEN and LEECH, GIANT on page 229; LEPRECHAUN and LICH on page 230; LION, LIZARDFOLK, MAGE, and MAMMOTH on page 231; MANTA RAY, GIANT, MANTICORE, MASTIFF, and MEDUSA on page 232. Labels preserve exact source wording and punctuation; IDs drop commas where present and use standard snake_case transliteration with approved prefix monster_. All twelve IDs and labels are absent from the 567-row canonical node registry, which currently holds 136 monster identities.
  - id: RF-03
    subject: stat_block_locus_and_zero_edges
    disposition: approved
    detail: >-
      Constitution 1.8 sections 2.4 and 2.5 exclude individual creature stat-block descriptions, modifiers, and combat traits from graph content. Kraken Impervious (electricity immunity), Crush (double damage vs objects), Lightning Bolt (DC 15 DEX or 6d6 dmg line), and Storm (turbulent sea, capsizing); Leech, Giant Attach (bite auto-hits next round, DC 12 STR to tear off); Leprechaun Alert (cannot be surprised), Slippery (hostile spells DC 15 to cast), and innate spells (Fool's Gold, Illusion, Invisibility); Lich Supreme Undead (morale immune, magical damage only), Phylactery (spirit vessel object), Paralysis (DC 15 CON or paralyzed 1d4 rounds), and spells (Flight, Null, Shadow Leap, Sigil of Doom, Wither); Lion rend attack; Lizardfolk equipment annotations (leather + shield) and spear; Mage spells (Arcane Armor, Blast, Cancel, Levitate, Snare); Mammoth Thick Fur (cold immunity) and Charge (x3 damage on hit); Manta Ray, Giant Poison (DC 15 CON or 0 HP in 1d4 rounds); Manticore Spikes (4d6 tail spikes, daily regrowth); Mastiff bite attack; and Medusa Godborn (hostile spells DC 15 to cast), Petrify (DC 15 CON or petrified), and Poison (DC 15 CON or 0 HP) all operate on creature combat and action loci rather than global rulesets or general spell systems. Equipment parentheticals and standard stat fields (AC, HP, ATK, MV, S-D, LV) are similarly excluded under 2.4 and 2.5. All candidate rejections in the GUR are verified correct under Constitution 2.4/2.5. The zero-edge plan and empty edges component are complete.
  - id: RF-04
    subject: graph_invariant_4_ancestry_language_class_distinction
    disposition: approved
    detail: >-
      Graph Invariant 4 requires strict differentiation between creature identity nodes and any corresponding ancestry, class, or language nodes. Verified that none of the proposed creature identities (including Leprechaun, Lizardfolk, Mage, or Medusa) conflate with any playable ancestry (Dwarf, Elf, Goblin, Halfling, Half-Orc, Human), character class (Fighter, Priest, Thief, Wizard), or language in canonical Shadowdark registries. The proposed nodes monster_lizardfolk, monster_mage, monster_medusa, and others are purely creature identities defined under Chapter 11 monster listings.
  - id: RF-05
    subject: page_attributions
    disposition: approved
    detail: >-
      Explicit page markers {#p229}, {#p230}, {#p231}, and {#p232} are anchored directly to their respective headings across the packet. Kraken is anchored at {#p229} and carries across Leech, Giant; Leprechaun is anchored at {#p230} and carries across Lich; Lion is anchored at {#p231} and carries across Lizardfolk, Mage, and Mammoth; Manta Ray, Giant is anchored at {#p232} and carries across Manticore, Mastiff, and Medusa. The claimed four-page span (229–232) and all twelve defining loci agree with the markers.
completeness_statement: >-
  Independently read the complete claimed Primary Source Material on pages 229–232 at its pinned checksum, verified all twelve creature identities against their defining stat blocks, derived page attributions directly from explicit markers {#p229}, {#p230}, {#p231}, and {#p232}, evaluated Graph Invariant 4 against canonical registries, confirmed the exclusion of all stat-block combat traits, creature-specific spell actions, innate immunities, equipment parentheticals, and attributes under Constitution 2.4 and 2.5, and verified that Builder authority citations strictly cite Constitution 1.8 section 2. The packet yields 12 new node registrations and 0 edge insertions, with 0 errors and 0 warnings. Mechanically complete and approved for integration.
