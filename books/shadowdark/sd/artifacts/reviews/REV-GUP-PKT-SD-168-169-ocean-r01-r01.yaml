reviewer_findings:
  - id: RF-01
    subject: encounter_table_resolver
    disposition: approved
    refs: [M001]
    detail: >-
      The source-named Ocean Encounters Table is a further resolver of
      canonical Encounter on the distinct ocean-selection aspect.
  - id: RF-02
    subject: rival_crawlers_reach
    disposition: approved
    refs: [M002]
    detail: >-
      A group of rival crawlers inspecting a map explicitly invokes the
      canonical Rival Crawlers procedure and supports the table-to-procedure
      reach.
  - id: RF-03
    subject: treasure_acquisition_boundary
    disposition: approved_precedent
    refs: [M003]
    detail: >-
      A seagull dropping a random magic item expressly states both the
      canonical Magic Item category and acquisition by the encounter. The
      table therefore feeds Treasure under the settled category-plus-
      acquisition test. No direct table-to-item row is warranted because
      canonical Magic Item already feeds Treasure.
  - id: RF-04
    subject: sea_travel_target_gap
    disposition: approved_omission
    detail: >-
      Coral reefs hindering ships would semantically constrain sea travel, but
      the graph has no ship or sea-travel identity. Overland Travel is bounded
      to the page-90 land procedure and local Movement is also the wrong target.
      Withholding the row preserves identity scope rather than weakening the
      Mountain weather precedent.
  - id: RF-05
    subject: curse_status_gap
    disposition: approved_omission
    detail: >-
      Scintillating algae ending a curse states a real removal effect, but no
      curse or status identity exists and none may be minted from an encounter
      cell. The omission correctly records a vocabulary gap rather than
      repointing the effect to an unrelated endpoint.
  - id: RF-06
    subject: chapter_survey_and_scan_disclosures
    disposition: informational_nonblocking
    detail: >-
      The fourteen-packet final-cell survey is substantively correct: every 00
      result is beneficial and four expressly name a magic item. Its prose list
      compresses two distinct invitation results into one entry. Separately,
      item_magic_item is a real source mention routed through Treasure, not an
      ordinary-English collision as one measurement paragraph labels it.
      Neither categorization slip changes a submitted or rejected relationship.
  - id: RF-07
    subject: table_registration_and_other_omissions
    disposition: approved
    detail: >-
      Ocean Encounters Table is source-named, fresh, correctly prefixed and
      supports all three rows. Creatures, named people, maritime hazards,
      durations, magnitudes and table arithmetic were correctly withheld where
      no stated mechanic or supported endpoint exists.
  - id: RF-08
    subject: authority_metadata
    disposition: informational_nonblocking
    detail: >-
      Builder validation text still names stale DEC-2026-0003. This Review
      applies current Shadowdark Constitution section 2 and common Reviewer
      authority directly; no submitted row depends on that citation.
