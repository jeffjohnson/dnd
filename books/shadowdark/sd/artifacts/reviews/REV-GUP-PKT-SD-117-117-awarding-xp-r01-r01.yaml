reviewer_findings:
  - id: RF-01
    subject: awarding_xp_and_treasure_identity_split
    disposition: approved_two_distinct_identities
    refs: [M001, M002, M003, M004, M005, M006, M007]
    detail: >-
      Treasure is the rated input whose quality, monetary value, magic-item
      content, and expected value are resolved on this page. Awarding XP is the
      broader procedure that converts treasure into XP and separately awards
      XP for clever thinking. M007 has no Treasure input, so folding both
      identities into rule_treasure would misdescribe an independent award
      source and attach it conceptually to the treasure-quality table. M001
      correctly connects the narrower input to the broader procedure.
  - id: RF-02
    subject: two_award_rows
    disposition: approved_intentionally_distinct
    refs: [M002, M007]
    detail: >-
      Treasure awards and clever-thinking awards are two explicit source
      statements. Both improve XP through the same procedure, but their
      distinct aspects preserve separate award bases; clever thinking bypasses
      Treasure and its quality table. The near-duplicate is intentional, not a
      restatement.
  - id: RF-03
    subject: treasure_structure
    disposition: approved
    refs: [M003, M004, M005, M006]
    detail: >-
      The named table resolves Treasure quality; Magic Item and Coin are
      explicitly named sources or value media; and Level scales expected
      treasure value. These four rows retain the reusable structure while
      excluding all numeric magnitudes and unregistered example categories.
  - id: RF-04
    subject: registry_additions
    disposition: approved
    proposed_ids:
      - rule_awarding_xp
      - rule_treasure
      - tbl_xp_for_treasure_quality
    detail: >-
      The two rules have distinct source-supported roles and the named table
      is their reusable quality resolver. All three use approved prefixes and
      mechanically matching kinds, have complete labels and rationales, and
      are absent from the current registry.
  - id: RF-05
    subject: rejected_candidates_and_forward_references
    disposition: rejected_candidates_confirmed
    detail: >-
      Treasure-quality labels and level bands differ only by excluded
      magnitudes; the XP reset already exists at its page-39 defining locus;
      three source bullets lack endpoints; per-character distribution lacks a
      character or party identity; and table examples do not define treasure
      contents. Earlier packets may now author successors pointing to Treasure,
      but their source-scoped references cannot be added from page 117.
  - id: RF-06
    subject: xp_neighborhood_count
    disposition: informational_nonblocking
    detail: >-
      XP has six incident canonical rows and four MODIFIES rows into it, but
      only three of those four are awards. The fourth is Level MODIFIES XP with
      aspect total reset. The GUR's named award sources are correct; only its
      prose count conflates the reset with an award. No proposed row depends on
      that count.
  - id: RF-07
    subject: unrepresentable_distribution_rule
    disposition: informational_nonblocking
    detail: >-
      Giving each character the full treasure award is mechanically important
      but cannot be represented without character or party identities. This is
      a recurring ontology boundary, not authority to invent participant nodes
      in this packet, and it does not make any submitted relationship false.
completeness_statement: >-
  Printed page 117, all seven submitted rows, all three node proposals, all
  five rejected-candidate groups, IDQ-01, the M002/M007 near-duplicate, and the
  current XP and treasure-adjacent neighborhoods were independently checked
  against Constitution 1.7, the registry, and canonical state. The two-rule
  identity split is required by the source's non-treasure clever-thinking
  award. All seven rows are source-supported, collision-free, correctly
  grained, and correctly await the three approved registrations.
