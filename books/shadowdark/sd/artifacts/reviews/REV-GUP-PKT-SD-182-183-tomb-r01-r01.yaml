reviewer_findings:
  - id: RF-01
    subject: encounter_table_resolver
    disposition: approved
    refs: [M001]
    detail: >-
      The source-named Tomb Encounters Table is a further resolver of canonical
      Encounter on the distinct tomb-selection aspect. The heading and first
      twenty-three data rows begin on printed page 182.
  - id: RF-02
    subject: explicit_resource_effects
    disposition: approved
    refs: [M002, M003]
    detail: >-
      The row keyed 36-37 explicitly removes all unused luck tokens, and the
      row keyed 44-45 explicitly extinguishes all light. MODIFIES correctly
      represents both effects, and their source-read worsens polarities are
      authored rather than inferred.
  - id: RF-03
    subject: distinct_hit_point_assertions
    disposition: approved
    refs: [M004, M006]
    detail: >-
      These are distinct assertions, not a duplicate or restatement. The row
      keyed 54-55 drains Hit Points from everyone within near, while 92-93
      heals only those who listen. Their assertion keys differ by aspect and
      condition, their source loci differ, and their source-read polarities
      are correctly opposite: worsens for encounter drain and improves for
      encounter healing.
  - id: RF-04
    subject: rival_crawlers_and_treasure_results
    disposition: approved
    refs: [M005, M007]
    detail: >-
      The rows keyed 74-75 and 00 explicitly invoke Rival Crawlers and the
      Treasure table respectively. Each is a table outcome feeding into the
      named canonical mechanic on printed page 183.
  - id: RF-05
    subject: source_omissions
    disposition: approved_omission
    detail: >-
      The remaining creatures, scenery, language, alignment markers, named
      but unregistered Sphere of Annihilation, lich teleportation and repeated
      encounter instruction do not support another current relationship.
      Magnitudes for drain, healing, range and duration are deliberately not
      stored, and the appended supporting context is outside packet scope.
  - id: RF-06
    subject: table_registration_and_scope
    disposition: approved
    detail: >-
      Tomb Encounters Table is source-named, fresh, correctly prefixed and
      supports all seven submitted rows. Its ID and label are absent from the
      current registry and no canonical edge uses the proposed endpoint.
  - id: RF-07
    subject: light_source_classification_boundary
    disposition: informational_nonblocking
    detail: >-
      DEC-2026-0104 does not apply because the source modifies existing light
      through extinguishing and does not identify an item as a Light Source.
      No CLASSIFIED_AS assertion is submitted or required.
  - id: RF-08
    subject: authority_metadata
    disposition: informational_nonblocking
    detail: >-
      Builder validation text still names stale DEC-2026-0003, which is not a
      Shadowdark Decision. This Review applies current Shadowdark Constitution
      section 2 and the common Reviewer authority directly; no submitted row
      depends on that citation.
