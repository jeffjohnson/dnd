reviewer_findings:
  - id: RF-01
    subject: verified_node_routing_authority
    disposition: approved
    detail: >-
      All twelve proposed nodes in the GUP carry routing_basis: 'Constitution 1.8 section 2: approved prefix and kind, valid ID, no duplicate'. Prefix monster_ and kind monster are approved vocabulary under Constitution 1.8 section 2.
  - id: RF-02
    subject: source_named_monster_identities
    disposition: approved
    detail: >-
      The Primary Source Material on pages 232–239 contains twelve distinct creature headings and complete stat blocks: MERFOLK and MIMIC on page 232; MINOTAUR and MOOSE on page 233; MORDANTICUS THE FLAYED on page 234; MUMMY and MUSHROOMFOLK on page 236; NAGA, NAGA, BONE, and NIGHTMARE on page 237; OBE-IXX OF AZARUMME on page 238; and OCHRE JELLY on page 239. Labels preserve exact source wording and punctuation; IDs drop commas where present and use standard snake_case transliteration with approved prefix monster_. All twelve IDs and labels are absent from the 579-row canonical node registry, which currently holds 148 monster identities.
  - id: RF-03
    subject: stat_block_locus_artwork_and_zero_edges
    disposition: approved
    detail: >-
      Constitution 1.8 sections 2.4 and 2.5 exclude individual creature stat-block descriptions, modifiers, artwork, and combat traits from graph content. Mimic Stick (DC 15 STR or adhere, auto-hit with bite); Minotaur Charge (straight line, x2 damage on hit) and chainmail armor notation; Mordanticus the Flayed Legendary Undead, Crown of Gehemna (3/day spell fail within far), Necrosis (DC 15 CON or 0 HP, healing spells DC 15), Phylactery, and spells (Absorb, Banish, Bind, Blast, Phase, True Name); Page 235 full-page artwork div; Mummy Supreme Undead, Desiccated (takes x2 damage from fire), and Necrosis; Mushroomfolk Sunblind (blinded in bright light) and Telepathic (speak mentally within double near); Naga Poison (DC 15 CON or paralyzed 1d4 rounds) and spells (Agony, Hypnotize, Whispers); Naga, Bone Greater Undead (morale immune, silver or magical damage only); Nightmare Impervious (fire immunity for self and rider); Obe-Ixx of Azarumme Legendary Undead, Blood Drain (heals 2d8 HP, target loses 1d6 CON, rises as vampire at 0 CON), Charm, Moonbite Properties (+2 greatsword, thrown, returns, healing spells DC 15), Shapechange (giant bat, dire wolf), and Ur-Vampire (sarcophagus resting, sunlight damage, wooden stake from Tal-Yool); and Ochre Jelly Split (split into two smaller oozes up to 4 times if cut/chopped) all operate on creature combat and action loci rather than global rulesets or general spell systems. Equipment parentheticals and standard stat fields (AC, HP, ATK, MV, S-D, LV) are similarly excluded under 2.4 and 2.5. All candidate rejections in the GUR are verified correct under Constitution 2.4/2.5. The zero-edge plan and empty edges component are complete.
  - id: RF-04
    subject: graph_invariant_4_ancestry_language_distinction
    disposition: approved
    detail: >-
      Graph Invariant 4 requires strict differentiation between creature identity nodes and any corresponding ancestry, class, or language nodes. Verified that none of the proposed creature identities (including Merfolk, Minotaur, Mushroomfolk, or Naga) conflate with any playable ancestry (Dwarf, Elf, Goblin, Halfling, Half-Orc, Human), character class (Fighter, Priest, Thief, Wizard), or language in canonical Shadowdark registries. While language_merran exists, monster_merfolk is strictly a creature identity; minotaur, mushroomfolk, and naga do not correspond to any language or ancestry nodes.
  - id: RF-05
    subject: page_attributions
    disposition: approved
    detail: >-
      Leading content on page 232 (Merfolk and Mimic) precedes the first marker in this packet ({#p233}) and resolves structurally from the preceding packet boundary. Seven explicit page markers follow: {#p233} on Minotaur (carrying to Moose); {#p234} on Mordanticus the Flayed; {#p235} on full-page-artwork div; {#p236} on Mummy (carrying to Mushroomfolk); {#p237} on Naga (carrying to Naga, Bone and Nightmare); {#p238} on Obe-Ixx of Azarumme; and {#p239} on Ochre Jelly. The claimed eight-page span (232–239) and all twelve defining loci agree with the markers and structural placement rules.
completeness_statement: >-
  Independently read the complete claimed Primary Source Material on pages 232–239 at its pinned checksum, verified all twelve creature identities against their defining stat blocks, derived page attributions directly from explicit markers {#p233} through {#p239} and structural leading content resolution for page 232, evaluated Graph Invariant 4 against canonical registries, confirmed the exclusion of all stat-block combat traits, creature-specific spell actions, unique artifact properties, full-page artwork, equipment parentheticals, and attributes under Constitution 2.4 and 2.5, and verified that Builder authority citations strictly cite Constitution 1.8 section 2. The packet yields 12 new node registrations and 0 edge insertions, with 0 errors and 0 warnings. Mechanically complete and approved for integration.
