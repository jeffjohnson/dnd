      Longbow of the Elven Kings +1 bonus magnitude and personality roleplay guidance;
      Magic Ink 1d4 uses quantity;
      Memnon's Blazing Javelin +1 and +3 set bonus magnitudes and once per day frequency;
      Memnon's Discordant Blade +1 and +3 set bonus magnitudes, once per day frequency, level 9 target threshold, DC 18 Con check DC, 3d8 damage dice magnitude, relinquishment curse narrative lore, daily LV 2 slaying requirement, and 1d6 HP loss dice magnitude;
