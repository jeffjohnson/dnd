      Mirror of Mischief evil duplicate creation narrative and chaos sowing roleplay flavor;
      Moonwrought Chainmail +1 bonus magnitude, once per day frequency, and +1 next check bonus magnitude;
      Necklace of Charm 18 (+4) stat target magnitude;
      Necrotic Mace of Withering +1 bonus magnitude, nightmares flavor, and DC 12 Wis check DC;
      Nightcloak Armor +1 bonus magnitude and once per day frequency;
      Obsidian Witchknife +2 bonus magnitude;
      and supporting context passages (pp. 282–283, 34–35) are out of packet scope.
      All omissions confirmed correct.
