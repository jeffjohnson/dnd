  - id: RF-02
    subject: magic_item_edges
    disposition: approved
    refs: [M001, M002, M003, M004, M005, M006, M007, M008, M009, M010, M011, M012, M013, M014, M015, M016, M017, M018, M019, M020, M021, M022, M023, M024, M025, M026]
    detail: >-
      Edges M001–M026 assert mechanical relations for the magic items: M001 asserts item_kytherian_cog
      MODIFIES rule_luck_token (aspect: "luck token allocation", condition: "at start of session", polarity: improves);
      M002 asserts item_longbow_of_the_elven_kings MODIFIES cbt_attack_roll (aspect: "attack bonus", condition: "when attacking with this weapon", polarity: improves);
      M003 asserts item_longbow_of_the_elven_kings CONSTRAINS cbt_attack_roll (aspect: "attack advantage", condition: "against aberrations and outsiders", polarity: governs);
      M004 asserts item_magic_ink MODIFIES item_gear (aspect: "invisible writing", condition: "when cool", polarity: improves);
      M005 asserts item_memnons_blazing_javelin MODIFIES cbt_attack_roll (aspect: "attack bonus", condition: "when attacking with this weapon", polarity: improves);
      M006 asserts alignment_chaotic GATES item_memnons_blazing_javelin (aspect: "item usability", condition: "to wield item", polarity: enables);
      M007 asserts item_memnons_blazing_javelin TRIGGERS spell_lightning_bolt (aspect: "lightning bolt activation", condition: "when thrown", polarity: neutral);
      M008 asserts item_memnons_discordant_blade MODIFIES cbt_attack_roll (aspect: "attack bonus", condition: "when attacking with this weapon", polarity: improves);
      M009 asserts alignment_chaotic GATES item_memnons_discordant_blade (aspect: "item usability", condition: "to wield item", polarity: enables);
      M010 asserts item_memnons_entropic_armor MODIFIES cbt_armor_class (aspect: "armor bonus", condition: "while wearing armor", polarity: improves);
      M011 asserts alignment_chaotic GATES item_memnons_entropic_armor (aspect: "item usability", condition: "to wear armor", polarity: enables);
      M012 asserts item_memnons_entropic_armor CONSUMES item_gear (aspect: "weapon destruction", condition: "when struck by nonmagical weapons", polarity: neutral);
      M013 asserts item_moonwrought_chainmail MODIFIES cbt_armor_class (aspect: "armor bonus", condition: "while wearing armor", polarity: improves);
      M014 asserts item_moonwrought_chainmail MODIFIES cbt_attack_roll (aspect: "ranged attack bonus", condition: "after command word spoken", polarity: improves);
      M015 asserts item_moonwrought_chainmail MODIFIES rule_spellcasting_check (aspect: "spellcasting bonus", condition: "after command word spoken", polarity: improves);
      M016 asserts item_necklace_of_charm MODIFIES abil_charisma (aspect: "stat replacement", condition: "while wearing necklace", polarity: improves);
      M017 asserts item_necrotic_mace_of_withering MODIFIES cbt_attack_roll (aspect: "attack bonus", condition: "when attacking with this weapon", polarity: improves);
      M018 asserts alignment_chaotic GATES item_necrotic_mace_of_withering (aspect: "item usability", condition: "to wield item", polarity: enables);
      M019 asserts class_priest GATES item_necrotic_mace_of_withering (aspect: "item usability", condition: "to wield item", polarity: enables);
      M020 asserts item_necrotic_mace_of_withering MODIFIES spell_cure_wounds (aspect: "spell inversion", condition: "when casting cure wounds", polarity: improves);
      M021 asserts item_necrotic_mace_of_withering CONSTRAINS rule_resting (aspect: "rest benefit denial", condition: "on failed check", polarity: governs);
      M022 asserts item_nightcloak_armor MODIFIES cbt_armor_class (aspect: "armor bonus", condition: "while wearing armor", polarity: improves);
      M023 asserts item_nightcloak_armor MODIFIES abil_dexterity (aspect: "automatic check success", condition: "to hide", polarity: improves);
      M024 asserts item_obsidian_witchknife MODIFIES cbt_attack_roll (aspect: "attack bonus", condition: "when attacking with this weapon", polarity: improves);
      M025 asserts alignment_lawful CONSTRAINS item_obsidian_witchknife (aspect: "wielding prohibition", condition: "for lawful beings", polarity: governs);
      and M026 asserts item_obsidian_witchknife MODIFIES rule_spellcasting_check (aspect: "spellcasting bonus", condition: "when wounded during casting", polarity: improves).
      All edge types, directions, conditions, and polarities strictly conform to Constitution 1.8 section 6.1 and Graph Invariant 14.
      Edges are held pending until node registrations are applied; approved for inclusion in the Approved bundle upon integration.
