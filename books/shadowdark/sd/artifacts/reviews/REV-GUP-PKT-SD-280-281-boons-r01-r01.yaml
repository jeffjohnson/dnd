reviewer_findings:
  - id: RF-01
    subject: boons_rule_and_tables_node_additions
    disposition: approved
    detail: >-
      The four proposed nodes rule_boons (Boons, rule, p. 280), tbl_oaths (Oaths Table, tbl, p. 280),
      tbl_secrets (Secrets Table, tbl, p. 281), and tbl_blessings (Blessings Table, tbl, p. 281) are
      source-named from explicit headings in the Primary Source Material. Prefixes rule_ and tbl_, and
      kinds rule and tbl, are approved vocabulary under Constitution 1.8 section 2. Proposed IDs and
      labels are confirmed absent from the canonical node registry (681 rows). Routing bases correctly cite
      Constitution 1.8 section 2. Reviewer approval granted for all four node registrations.
  - id: RF-02
    subject: boons_relationship_and_resolution_edges
    disposition: approved
    refs: [M001, M002, M003, M004]
    detail: >-
      Edge M001 asserts rule_boons FEEDS_INTO rule_treasure with aspect "boon utility" based on XP VALUE
      (p. 280), correctly capturing that boons provide non-monetary value that feeds into treasure valuation
      for XP. Derived deterministic polarity "neutral" conforms to Constitution 1.8 section 6.1 and Graph
      Invariant 14. Edges M002, M003, and M004 assert rule_boons RESOLVED_BY each corresponding boon generator
      table (tbl_oaths with aspect "oath selection", tbl_secrets with aspect "secret selection", and tbl_blessings
      with aspect "blessing selection"). Derived deterministic polarity "governs" conforms to Constitution 1.8
      section 6.1 and Graph Invariant 14. All four edges held pending until node registrations are applied; approved
      for inclusion in the Approved bundle.
  - id: RF-03
    subject: table_entries_and_candidate_rejections
    disposition: approved_omission
    detail: >-
      Independently verified that all individual table rows, generation outcomes, and specific narrative favors
      are properly excluded from edges under Graph Invariant 11 and Constitution 1.8 sections 2.4 and 2.5:
      Oaths table entries (procuring audience, pardoning crimes, dryad protection, teleportation) are specific
      narrative outcomes; Secrets table entries (prompts pairing detail 1 and detail 2) are random generation
      prompts; Blessings table entries (Wraithsight, Nine Lives, Demonskin, Spiderwalk, Merfolk's Kiss, Gede's
      Blessing, Arcane Eye, Shune's Mark, Ghostwalk, Death's Sting, Rite of Rage, Divine Halo) are table outcome
      benefits; specific numeric magnitudes (1d6 hit points, 1d4 rounds, DC 15) are strictly excluded under
      Graph Invariant 11; mentions of deities (Gede, Shune) or knights of St. Terragnis represent narrative/flavor
      naming rather than mechanical worship rules (Constitution 2.4); introductory prose examples are illustrative
      flavor; and repeated context passages (Awarding XP p. 117, Level advancement p. 39, Treasure overview p. 269)
      are out of packet scope. All omissions confirmed correct.
  - id: RF-04
    subject: page_attributions
    disposition: approved
    detail: >-
      Primary Source Material opens on page 280 with explicit marker {#p280} on BOONS, carrying through the XP VALUE
      subsection and OATHS TABLE. Explicit marker {#p281} on SECRETS TABLE attributes that table and BLESSINGS TABLE
      to printed page 281. Page attributions on M001 (p. 280), M002 (p. 280), M003 (p. 281), and M004 (p. 281)
      strictly conform to placement rules.
