reviewer_findings:
  - id: RF-01
    subject: magic_weapon_tables_node_additions
    disposition: approved
    detail: >-
      The five proposed nodes tbl_weapon_type (Weapon Type Table, p. 292), tbl_weapon_bonus
      (Weapon Bonus Table, p. 292), tbl_weapon_feature (Weapon Feature Table, p. 292), tbl_weapon_benefit
      (Weapon Benefit Table, p. 293), and tbl_weapon_curse (Weapon Curse Table, p. 293) are source-named
      from explicit headings in the Primary Source Material. Prefix tbl_ and kind tbl are approved vocabulary
      under Constitution 1.8 section 2. Proposed IDs and labels are confirmed absent from the canonical
      node registry (712 rows). Routing bases correctly cite Constitution 1.8 section 2. Reviewer approval
      granted for all five node registrations.
  - id: RF-02
    subject: magic_weapon_resolution_edges
    disposition: approved
    refs: [M001, M002, M003, M004, M005]
    detail: >-
      Edges M001–M005 assert item_magic_item RESOLVED_BY each corresponding magic weapon generator table:
      M001 targets tbl_weapon_type with aspect "weapon type selection" and condition "for magic weapons";
      M002 targets tbl_weapon_bonus with aspect "weapon bonus selection" and condition "for magic weapons";
      M003 targets tbl_weapon_feature with aspect "weapon feature selection" and condition "for magic weapons";
      M004 targets tbl_weapon_benefit with aspect "weapon benefit selection" and condition "for magic weapons";
      and M005 targets tbl_weapon_curse with aspect "weapon curse selection" and condition "for magic weapons".
      Derived deterministic polarity "governs" conforms to Constitution 1.8 section 6.1 and Graph Invariant 14.
      All five edges are held pending until node registrations are applied; approved for inclusion in the
      Approved bundle upon integration.
  - id: RF-03
    subject: table_entries_and_candidate_rejections
    disposition: approved_omission
    detail: >-
      Independently verified that all individual table rows, roll outcomes, numeric magnitudes, bonus numbers,
      flavour descriptors, and out-of-scope passages are properly excluded from edges under Graph Invariant 11
      and Constitution 1.8 sections 2.4 and 2.5: Weapon Type Table entries (Arrows, Bastard sword, Club, etc.)
      are roll outcome base weapon forms; Weapon Bonus Table entries (+0, +1, +2, +3) are roll outcome numeric
      values; Weapon Feature Table entries (Trails sparkles, Starmetal, Gem in pommel/handle, etc.) are cosmetic
      descriptors; Weapon Benefit Table entries (5 rounds, 1d4 extra damage, DC 15 CHA check, 1d6 damage, regain 1d6 HP,
      double damage to 1d4) contain numeric magnitudes and dice expressions prohibited on edges under Graph Invariant 11;
      Weapon Curse Table entries (You can't see 1d4, turn into a rat every day at midnight for one hour, swim checks
      extreme DC 18, contested CHA (+2)) contain specific DCs, stat bonuses, durations, and dice expressions prohibited
      on edges under Graph Invariant 11 and Constitution 1.8 §§2.4/2.5; and supporting context passages (Magic item
      attributes p. 282, starting gear pp. 34–37, resting p. 86, combat turns p. 88) are out of packet scope.
      All omissions confirmed correct.
  - id: RF-04
    subject: page_attributions
    disposition: approved
    detail: >-
      Primary Source Material opens on page 292 with explicit marker {#p292} on WEAPONS, carrying through WEAPON TYPE TABLE,
      WEAPON BONUS TABLE, and WEAPON FEATURE TABLE. Explicit marker {#p293} on WEAPON BENEFIT TABLE attributes that table
      and WEAPON CURSE TABLE to printed page 293. Page attributions on M001–M003 (p. 292) and M004–M005 (p. 293)
      strictly conform to placement rules.
