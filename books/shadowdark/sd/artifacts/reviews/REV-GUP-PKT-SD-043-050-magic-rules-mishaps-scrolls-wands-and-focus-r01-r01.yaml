reviewer_findings:
  - id: OBS-01-DISPOSITION
    disposition: accepted_table_grain
    rationale: >-
      The three separately headed mishap tables are the stable source-named
      mechanical identities. Their selection by spell tier and invocation by
      critical failure are fully represented. Individual cells mix names,
      magnitudes, narrative consequences, and heterogeneous mechanics without
      separately referenced identities. The active constitution does not require
      a node per table result, and the approved Shadowdark table precedent stores
      the table relationship without enumerating every outcome. This does not
      prevent a later packet from asserting a relationship to a source-named
      mishap when that later source supplies two lawful endpoints.
  - id: IDQ-01-DISPOSITION
    disposition: approved_as_rule
    rationale: >-
      Critical Success and Critical Failure each have a source heading and state
      a procedure with downstream consequences. The approved rule_ prefix and
      rule kind preserve those named mechanics without inventing an unsupported
      outcome kind.
  - id: IDQ-02-DISPOSITION
    disposition: approved_as_constrains
    rationale: >-
      The overlapping-effects rule bounds how concurrent durations interact and
      therefore lawfully CONSTRAINS Spell Duration. OVERRIDES would require one
      of Constitution section 7's supersession bases, none of which describes
      same-spell instance precedence, and the graph has no distinct occurrence
      identities with which to form a non-self-loop override.
  - id: NEAR-MISS-DISPOSITION
    disposition: distinct_assertions
    rationale: >-
      M025 is ordinary scroll-casting expenditure, distinct from the canonical
      Learning Spells expenditure by source endpoint. M006 targets the specific
      Spellcasting Check and is distinct from the canonical Difficulty Class to
      Check relationship. Neither assertion key collides with canonical state.
completeness_statement: >-
  Pages 43 through 50 were independently read with page markers applied under
  the persistence rule. All thirty-six submitted relationships are supported,
