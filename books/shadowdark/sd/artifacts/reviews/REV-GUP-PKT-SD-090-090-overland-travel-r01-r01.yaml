  - id: total_darkness_not_excluded
    severity: blocking
    ref: M007
    detail: >-
      Constitution 1.7 defines EXCLUDES as actively preventing a relation. The
      page says Total Darkness is rare outside, not impossible, so the submitted
      empty-condition EXCLUDES row overstates the source. Overland Travel
      instead CONSTRAINS Total Darkness's outdoor occurrence with authored
      governs/read polarity.
