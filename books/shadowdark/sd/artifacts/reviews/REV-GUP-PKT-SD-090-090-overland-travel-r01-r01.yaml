reviewer_findings:
  - id: RF-01
    subject: rations_deprivation_resolution
    disposition: approved_explicit_reference
    ref: M019
    detail: >-
      The page-90 rule ends the blocked-healing state when the character eats
      or drinks. The canonical Rations definition on page 34 explicitly says
      it is one day of food and water supply for one person, so M019 covers both
      halves of the combined Food and Water rule. explicit_reference accurately
      records that the endpoint name comes from the defining equipment locus.
  - id: RF-02
    subject: encounter_cadence_restatement
    disposition: approved_nonduplication
    refs: [M004, M005]
    detail: >-
      The existing rule_danger_level FEEDS_INTO rule_encounter row already
      records check cadence. The packet correctly avoids duplicating it and
      adds only the distinct overland-context relationships, preserving the
      source's hour-based cadence without encoding numeric intervals.
  - id: RF-03
    subject: magnitude_only_categories
    disposition: informational_nonblocking
    detail: >-
      Danger-level values, travel methods, rates, light duration, hex width,
      deprivation periods, and damage amounts are magnitude-only distinctions
      here. Retaining them in the immutable source rather than minting graph
      identities is consistent with graph grain; the named Hex unit and Hexes
      Crossed Table remain mechanically operative and are correctly proposed.
  - id: RF-04
    subject: gur_registry_snapshot
    disposition: informational
    detail: >-
      The GUR says 265 registry rows; the independently measured current
      registry contains 289. The compiler used live state, all five proposals
      are fresh, and the stale prose count changes no operation.
