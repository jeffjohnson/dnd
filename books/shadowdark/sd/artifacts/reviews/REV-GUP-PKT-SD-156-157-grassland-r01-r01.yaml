reviewer_findings:
  - id: RF-01
    subject: encounter_table_resolver
    disposition: approved
    refs: [M001]
    detail: >-
      The source-named Grassland Encounters Table is a further resolver of
      canonical Encounter on the distinct grassland-selection aspect.
  - id: RF-02
    subject: rival_crawling_party
    disposition: approved
    refs: [M002]
    detail: >-
      The cell's rival crawling party is the canonical Rival Crawlers
      procedure expressed with a shifted inflection. Both distinguishing
      elements, rival and crawler, are present, matching page 126's defining
      prose about a rival party of Shadowdark crawlers. This differs from the
      generic castle-district crawlers cell that lacked rival.
  - id: RF-03
    subject: luck_token_award
    disposition: approved
    refs: [M003]
    detail: >-
      The mammoth result explicitly grants a Luck Token. FEEDS_INTO correctly
      follows the Carousing Outcome and Desert encounter table-benefit
      precedents without claiming that the encounter modifies token rules.
  - id: RF-04
    subject: boulder_wedge_near_miss
    disposition: rejected_candidate_confirmed
    detail: >-
      Wedges on strings holding precarious boulders describe a device at rest.
      The source states no concealment, trigger, operation, participant action
      or consequence. Treating it as a trap would require supplying the
      deadfall mechanism rather than recognizing one the source states, so its
      omission correctly applies the post-Desert boundary.
  - id: RF-05
    subject: remaining_omissions_and_scan_use
    disposition: verified
    detail: >-
      Weather, wildfire, teetering terrain, hypnotic flutes, creature stat
      magnitudes and the reroll instruction state no additional representable
      mechanic. The scans are discovery aids only: the rival reach was found by
      reading, while the word damage in a creature modifier earns no rule row.
  - id: RF-06
    subject: table_registration_and_authority_metadata
    disposition: approved_with_informational_note
    detail: >-
      Grassland Encounters Table is source-named, fresh, correctly prefixed and
      supports all three rows. Builder validation text still names stale
      DEC-2026-0003, but this Review applies current Shadowdark Constitution
      section 2 and common Reviewer authority directly.
