  - id: RF-02
    subject: source_named_monster_identities
    disposition: approved
    detail: >-
      The Primary Source Material on page 241 contains four distinct creature headings and complete stat blocks grouped under the OUTSIDERS family heading: PRIMORDIAL SLIME, RIME WALKER, VOID SPAWN, and VOID SPIDER. Labels preserve exact source wording; IDs use standard snake_case transliteration with approved prefix monster_. All four IDs and labels are absent from the 597-row canonical node registry, which currently holds 166 monster identities.
  - id: RF-03
    subject: stat_block_locus_family_lore_and_zero_edges
    disposition: approved
    detail: >-
      Constitution 1.8 sections 2.4 and 2.5 exclude individual creature stat-block descriptions, modifiers, family lore, and combat traits from graph content. The introductory family narrative describing Outsiders as alien horrors from cosmos/Dark Realms born from the nightmares of gods is excluded under 2.4. Stat-block traits across the four creatures—Primordial Slime Impervious (fire damage only) and Dissolve (destroys non-magical gear); Rime Walker Impervious (cold immune) and Ice Aura (enemies in near DC 12 CON or lose action); Void Spawn Impervious (cold immune) and Toxin (DC 12 CON or paralyzed 1d4 rounds); and Void Spider Impervious (cold immune), Phase (corporeal/incorporeal toggle), and Poison (DC 12 CON or 0 HP in 1d4 rounds)—operate purely on individual creature combat and action loci rather than modular rulesets. Equipment parentheticals and standard stat fields (AC, HP, ATK, MV, S-D, LV) are similarly excluded under 2.4 and 2.5. All candidate rejections in the GUR are verified correct under Constitution 2.4/2.5. The zero-edge plan and empty edges component are complete.
  - id: RF-04
    subject: graph_invariant_4_ancestry_language_class_distinction
    disposition: approved
    detail: >-
      Graph Invariant 4 requires strict differentiation between creature identity nodes and any corresponding ancestry, class, or language nodes. Verified that none of the proposed creature identities (Primordial Slime, Rime Walker, Void Spawn, Void Spider) conflate with any playable ancestry, character class, or language in canonical Shadowdark registries. All are strictly creature identities under Chapter 11 monster listings.
  - id: RF-05
    subject: page_attributions
    disposition: approved
    detail: >-
      Explicit page marker {#p241} is anchored directly to the OUTSIDERS heading and persists across all four member creature stat blocks on page 241. The claimed single-page span (241) and all four defining loci agree with the marker.
