reviewer_findings:
  - id: RF-01
    subject: desert_encounter_resolver
    disposition: approved
    refs: [M001]
    detail: >-
      The source-named Desert Encounters Table is a further resolver of
      canonical Encounter on the distinct desert-selection aspect.
  - id: RF-02
    subject: luck_token_award
    disposition: approved
    refs: [M002]
    detail: >-
      The phoenix result explicitly grants a Luck Token. FEEDS_INTO matches the
      canonical Carousing Outcome table precedent for a one-time table benefit;
      it does not claim the encounter changes token capacity or supply rules.
  - id: RF-03
    subject: wording_vs_substance_boundary
    disposition: differentiated_precedent
    detail: >-
      The page-147 crawlers cell, page-151 sinkhole and page-152 nets do not
      move as one bloc. Generic crawlers does not identify the Rival Crawlers
      procedure, and the sinkhole states no participant fall, check or damage.
      By contrast, a concealed device that snaps upward is itself an explicit
      trap mechanism. Mechanical identity may be established by the stated
      operation; the exact registry label need not appear verbatim.
  - id: RF-04
    subject: desert_weather_comparison
    disposition: rejected_candidates_confirmed
    detail: >-
      Sandstorm duration, a collapsing dune and threatening floods state no
      damage, check or other representable mechanic. Their omission correctly
      contrasts with the Arctic cells that expressly inflict damage.
  - id: RF-05
    subject: table_registration_and_remaining_omissions
    disposition: approved
    detail: >-
      Desert Encounters Table is source-named, fresh, correctly prefixed and
      supports the reviewed and required rows. Creature identities,
      magnitude-only chance and duration content, the underspecified riddle,
      the self-referential reroll instruction and supporting context were
      correctly withheld.
  - id: RF-06
    subject: authority_metadata
    disposition: informational_nonblocking
    detail: >-
      Builder-generated routing text still names the stale DEC-2026-0003
      identifier. This Review applies current Shadowdark Constitution section
      2 and common Reviewer authority directly; no submitted row depends on
      that stray citation.
