    severity: blocking
    detail: >-
      The bone-barbed nets are concealed beneath the sand and snap upward as
      an encounter result. That is an explicit trap mechanism even though the
      noun trap is absent. The table therefore needs a FEEDS_INTO relationship
      to canonical Traps. Requiring the exact registry label in source text
      would make graph extraction lexical rather than mechanical.
