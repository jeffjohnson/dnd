reviewer_findings:
  - id: RF-01
    subject: verified_node_routing_authority
    disposition: approved
    detail: >-
      All ten proposed nodes in the GUP carry routing_basis: 'Constitution 1.8
      section 2: approved prefix and kind, valid ID, no duplicate'. The Builder
      authority citation fix is active and no foreign DEC-2026-0003 citation
      exists anywhere in the GUP or in its validation report.
  - id: RF-02
    subject: source_named_monster_identities
    disposition: approved
    detail: >-
      The Primary Source Material on pages 216 and 217 contains ten distinct
      creature headings and complete stat blocks: ELEPHANT, ELF, ETTERCAP, FAIRY,
      FROG, GIANT, GARGOYLE, GELATINOUS CUBE, GHAST, GHOST, and GHOUL. Labels
      preserve exact source wording and comma placement; IDs use standard
      snake_case transliteration with approved prefix monster_. All ten IDs and
      nine of ten labels are absent from the 517-row canonical node registry, which
      currently holds 86 monster identities.
  - id: RF-03
    subject: evaluation_of_monster_elf_label_collision_under_invariant_4
    disposition: approved
    detail: >-
      The Builder validation report raised an informational warning for proposed
      node monster_elf due to label collision with canonical ancestry_elf ('Elf').
      Under Graph Invariant 4, labels do not determine graph identity. Node
      ancestry_elf (kind: ancestry) represents the player character ancestry from
      SD p. 16, whereas monster_elf (kind: monster) represents the NPC creature
      stat block from SD p. 216. They maintain distinct unique IDs, prefixes, kinds,
      and defining loci. This follows the established canonical precedent of
      ancestry_goblin (kind: ancestry) and lang_goblin (kind: lang) coexisting with
      the identical label 'Goblin'. The identity is distinct, valid, and approved.
  - id: RF-04
    subject: stat_block_locus_and_zero_edges
    disposition: approved
    detail: >-
      Constitution 1.8 sections 2.4 and 2.5 exclude individual creature stat-block
      descriptions, modifiers, and values from graph content. The special ability
      descriptions (Charge, Feyblood, Poison Web, Fairy Poison, Tongue, Gargoyle
      Impervious, Engulf, Rubbery, Toxin, Undead, Carrion Stench, Paralyze, Greater
      Undead, Life Drain, Possess) describe creature-local combat traits and
      magnitudes, not cross-mechanic graph relationships. All 18 rejected
      candidates in the GUR are correctly excluded under the locus test. The
      zero-edge plan and empty edges component are complete.
  - id: RF-05
    subject: page_attribution
    disposition: approved
    detail: >-
      Two explicit page markers govern this packet: {#p216} on the ELEPHANT
      heading (persisting through ELF, ETTERCAP, FAIRY, FROG, GIANT, and GARGOYLE)
      and {#p217} on the GELATINOUS CUBE heading (persisting through GHAST, GHOST,
      and GHOUL). All ten defining loci and the claimed two-page span (216–217)
      agree with the source markers.
