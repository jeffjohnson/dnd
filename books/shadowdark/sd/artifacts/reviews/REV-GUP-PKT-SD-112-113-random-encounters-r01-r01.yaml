reviewer_findings:
  - id: RF-01
    subject: encounter_overland_cross_reference
    disposition: approved
    ref: M001
    detail: >-
      Page 112 explicitly directs the Encounter cadence reader to Overland
      Travel. CROSS_REFERENCES preserves that pointer in its source-reading
      direction. The reverse canonical row, rule_overland_travel FEEDS_INTO
      rule_encounter with the same aspect, states that Overland Travel supplies
      the cadence mechanic. The two rows are complementary in meaning and
      differ in type, so the direction warning is nonblocking.
  - id: RF-02
    subject: encounter_resolution_tables
    disposition: approved
    refs: [M002, M003, M004]
    detail: >-
      The source names distinct tables for starting distance and current
      activity. Encounter is resolved by each table, while Distance supplies
      the distance-table bands. These rows preserve the reusable procedures
      without minting magnitude-only identities for individual results.
  - id: RF-03
    subject: reaction_check_mechanics
    disposition: approved
    refs: [M005, M006, M007, M008]
    detail: >-
      An encounter triggers the named Reaction Check; its table resolves the
      attitude and Charisma supplies the interaction modifier. The source says
      interaction reveals the characters' presence and position, so EXCLUDES
      Hiding and Sneaking is the accurate unhedged relation rather than a
      weaker constraint.
  - id: RF-04
    subject: registry_additions
    disposition: approved
    proposed_ids:
      - rule_reaction_check
      - tbl_random_encounter_distance
      - tbl_random_encounter_activity
      - tbl_random_encounter_reaction
    detail: >-
      All four source-named procedures or tables are reusable endpoints, use
      constitution-approved prefixes and mechanically matching kinds, have
      nonblank labels and rationales, and do not collide with the current
      registry.
  - id: RF-05
    subject: rejected_candidates
    disposition: rejected_candidates_confirmed
    detail: >-
      Existing cadence rows remain canonical restatements; the page's one-face
      encounter threshold is not The D6 Decider's half-range procedure; loud
      disturbance and activity effects are hedged or lack endpoints; always-
      hostile creatures lack an authorized creature-category identity; the
      treasure percentage is an excluded magnitude with no packet-local
      endpoint; and time pressure is a design property rather than a separate
      relationship.
  - id: RF-06
    subject: forward_pointer_and_taxonomy_gaps
    disposition: informational_nonblocking
    detail: >-
      The new Reaction Check identity closes the page-104 forward-reference
      target, but connecting that earlier packet requires its own successor.
      The loud-disturbance and always-hostile-creature observations remain
      useful evidence of ontology boundaries; neither makes a submitted row
      false or authorizes this packet to invent noise or creature-family nodes.
  - id: RF-07
    subject: trigger_polarity_count
    disposition: informational_nonblocking
    detail: >-
      The GUR says four canonical TRIGGERS rows use neutral polarity; the
      current canonical graph contains six. The exact count is stale, but the
      claimed convention is still correct and M005's authored neutral/read
      polarity is source-supported.
completeness_statement: >-
  Pages 112 and 113, all eight submitted rows, all four node proposals, every
  rejected candidate, the direction warning, and the current graph
  neighborhood were independently checked against Constitution 1.7, the
  registry, and canonical state. The relationships are source-supported,
  collision-free, correctly grained, and complete for the packet's bounded
  mechanics. One row is immediately applicable and seven correctly await the
  four approved registrations.
