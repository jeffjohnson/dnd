      Constitution 1.8 section 2. Reviewer approval granted for all four node registrations.
  - id: RF-02
    subject: utility_resolution_edges
    disposition: approved
    refs: [M001, M002, M003, M004]
    detail: >-
      Edges M001–M004 assert item_magic_item RESOLVED_BY each corresponding utility item generator table:
      M001 targets tbl_utility_type with aspect "utility type selection" and condition "for utility items";
      M002 targets tbl_utility_feature with aspect "utility feature selection" and condition "for utility items";
      M003 targets tbl_utility_benefit with aspect "utility benefit selection" and condition "for utility items";
      and M004 targets tbl_utility_curse with aspect "utility curse selection" and condition "for utility items".
      Derived deterministic polarity "governs" conforms to Constitution 1.8 section 6.1 and Graph Invariant 14.
      All four edges are held pending until node registrations are applied; approved for inclusion in the
      Approved bundle upon integration.
  - id: RF-03
    subject: table_entries_and_candidate_rejections
    disposition: approved_omission
    detail: >-
      Independently verified that all individual table rows, roll outcomes, numeric magnitudes, flavour narrative,
      and out-of-scope passages are properly excluded from edges under Graph Invariant 11 and Constitution 1.8
      sections 2.4 and 2.5: Creeg quotation is flavour narrative/dialogue; Utility Type Table entries (Brooch, Ring,
      Boots, etc.) are roll outcome item forms; Utility Feature Table entries (Shaped like a raven, Iridescent,
      Made of basilisk hide, etc.) are cosmetic/aesthetic descriptors; Utility Benefit Table entries (5 gear slots,
      18 (+4), DC 15 to cast, immune 1d4, 1 hour, 2 rounds) contain numeric magnitudes and dice expressions prohibited
      on edges under Graph Invariant 11; Utility Curse Table entries (1d4 damage, disadvantage on CON checks, 1d8 damage,
      1d10 gp) contain numeric magnitudes and dice expressions prohibited on edges under Graph Invariant 11 and
      Constitution 1.8 §§2.4/2.5; and supporting context passages (Magic item attributes, p. 282) are out of packet scope.
      All omissions confirmed correct.
  - id: RF-04
    subject: page_attributions
    disposition: approved
    detail: >-
      Primary Source Material opens on page 290 with explicit marker {#p290} on UTILITY, carrying through UTILITY TYPE TABLE
      and UTILITY FEATURE TABLE. Explicit marker {#p291} on UTILITY BENEFIT TABLE attributes that table and UTILITY CURSE
