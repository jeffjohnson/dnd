reviewer_findings:
  - id: RF-01
    subject: encounter_table_resolver
    disposition: approved
    refs: [M001]
    detail: >-
      The source-named Ruins Encounters Table is a further resolver of
      canonical Encounter on the distinct ruins-selection aspect.
  - id: RF-02
    subject: first_encounter_table_light_source_reach
    disposition: approved_precedent
    refs: [M002]
    detail: >-
      The gas leak explicitly makes every light source explode and go out.
      MODIFIES Light Source at gas extinguishing with worsens/read polarity
      matches the canonical Light Mishaps precedent and records the stated
      effect without confusing ordinary light with the Light spell.
  - id: RF-03
    subject: first_encounter_table_surprise_reach
    disposition: approved_precedent
    refs: [M003]
    detail: >-
      Kobolds sneaking up for a surprise attack explicitly cause canonical
      Surprise. TRIGGERS is correct because the encounter causes occurrence;
      neutral/read preserves the trigger while Surprise's directed benefits
      and constraints remain at its own defining locus. A hasty ambush that
      never names Surprise correctly remains unlinked.
  - id: RF-04
    subject: rival_crawlers_reach
    disposition: approved
    refs: [M004]
    detail: >-
      The two rival-crawler cells explicitly invoke the canonical Rival
      Crawlers procedure and share one assertion key, so a single table-to-
      procedure row is complete. The dead crawler in the final cell lacks the
      rival qualifier and supplies no additional Rival Crawlers relationship.
  - id: RF-05
    subject: treasure_availability_boundary
    disposition: approved
    refs: [M005]
    detail: >-
      A dead crawler's body holding a random magic item expressly states the
      canonical category and makes the item available to be taken. This meets
      the settled category-plus-availability limb of the Treasure test. No
      direct table-to-item row is warranted because Magic Item already feeds
      Treasure.
  - id: RF-06
    subject: architecture_versus_traps_boundary
    disposition: approved_omission_precedent
    detail: >-
      A rusty portcullis slamming and a groaning wall collapsing at a touch
      state failures of existing architecture, not devices set to catch
      someone. Neither invokes the finding, disabling and avoiding procedure
      represented by canonical Traps. Operation and non-creature agency remain
      necessary but are not sufficient: the source must identify a trap or a
      deliberately placed catching mechanism. Both omissions therefore stand.
  - id: RF-07
    subject: scan_measurement_disclosure
    disposition: informational_nonblocking
    detail: >-
      The whole-label scan undercounts by one cell because the goblin
      scavengers cell also matches the Goblin ancestry and language labels.
      Those ordinary category collisions support no edge and change no
      submitted or rejected decision.
  - id: RF-08
    subject: table_registration_and_other_omissions
    disposition: approved
    detail: >-
      Ruins Encounters Table is source-named, fresh, correctly prefixed and
      supports all five rows. Creatures, named people, decaying architecture,
      ordinary objects, magnitudes and table arithmetic were correctly
      withheld where no stated mechanic or supported endpoint exists.
  - id: RF-09
    subject: authority_metadata
    disposition: informational_nonblocking
    detail: >-
      Builder validation text still names stale DEC-2026-0003. This Review
      applies current Shadowdark Constitution section 2 and common Reviewer
      authority directly; no submitted row depends on that citation.
