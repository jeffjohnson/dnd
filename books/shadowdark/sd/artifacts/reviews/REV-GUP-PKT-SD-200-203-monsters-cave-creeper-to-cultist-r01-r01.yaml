blocking_findings:
  - id: unsupported_routing_basis
    detail: >-
      Each of the twelve proposed nodes cites DEC-2026-0003 as authority, but
      that is not a Shadowdark Decision. Constitution 1.8 section 2 explicitly
      approves the monster_ prefix and kind and directs source-backed node
      proposals through ordinary GUR/GUP/Review workflow. Apply each exact
      row-local routing_basis correction; retain all identities, labels,
      source interpretations, omissions, and the zero-edge result unchanged.
