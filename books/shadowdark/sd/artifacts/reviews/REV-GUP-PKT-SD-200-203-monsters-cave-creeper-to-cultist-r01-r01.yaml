      checksum: sha256:629e72cde3206228e1d1e569957dfff6aa275728c18ff4890c81cfcdc6e0c93d
reviewer_findings:
  - id: RF-01
    subject: node_routing_authority
    disposition: approved_with_revision
    refs:
      - monster_cave_creeper
      - monster_centaur
      - monster_centipede_giant
      - monster_centipede_swarm
      - monster_chimera
      - monster_chuul
      - monster_cloaker
      - monster_cockatrice
      - monster_couatl
      - monster_crab_giant
      - monster_crocodile
      - monster_cultist
    detail: >-
      All twelve source-supported identities are collision-free, but every
      submitted routing_basis invokes nonexistent Shadowdark DEC-2026-0003.
      Constitution 1.8 section 2 authorizes the approved monster_ prefix/kind
      and normal GUR/GUP/Review workflow. The twelve row-local corrections
      replace only that false authority claim.
  - id: RF-02
    subject: source_named_creature_identities
    disposition: approved
    detail: >-
      Each proposal corresponds to a distinct source heading and defining stat
      block: Cave Creeper on printed page 200; Centaur, Centipede, Giant,
      Centipede, Swarm, Chimera and Chuul on 201; Cloaker, Cockatrice, Couatl
      and Crab, Giant on 202; Crocodile and Cultist on 203. Labels match the
      source, including the commas in Centipede, Giant; Centipede, Swarm; and
      Crab, Giant. IDs are valid snake_case transliterations. All twelve IDs
      and exact labels are absent from the live registry.
  - id: RF-03
    subject: stat_block_locus_and_zero_edges
    disposition: approved
    detail: >-
      Constitution 1.8 sections 2 and 2.5 distinguish creature identities from
      individual stat-block descriptions and values. All twelve identities are
      supported at their own defining stat blocks. No family grouping or
      reusable mechanic dependency is stated at that locus; the GUR/GUP's
      zero-edge result is correct and complete.
  - id: RF-04
    subject: named_ability_omissions_and_references
    disposition: approved
    detail: >-
      Independently checked the fourteen named ability occurrences: Toxin;
      Poison on both centipedes; Fire Breath; Grab; Phantoms; Screech; Petrify;
      Change Shape; Couatl's Poison; Restore; Crab, Giant's Crush; Fearless;
      and Deathtouch. Each remains creature-local under Constitution 2.5.
      Phantoms resembles Mirror Image, Change Shape resembles Shapechange, and
      Couatl's Poison resembles Sleep, but none names that spell or uses the
      source's italic-reference convention; functional resemblance alone does
      not establish a spell reference. Screech's DISADV abbreviation directly
      names rule_disadvantage, but the ability is still a stat-block-local
      description and creates no edge. Fearless's morale exemption and Restore's
      healing/reference language are likewise correctly omitted. The paralysis
      text's third recurrence does not establish a shared-locus rule. Crab,
      Giant's Crush is distinct from the Bears' differently functioning Crush.
  - id: RF-05
    subject: page_attribution_and_packet_seam
    disposition: approved
    detail: >-
      The p201, p202, and p203 markers on CENTAUR, CLOAKER, and CROCODILE
      headings begin those pages under SOURCE_MARKDOWN placement rules, with
      persistence through subsequent headings. CAVE CREEPER precedes the first
      marker and inherits page 200 through the current manifest's independent
      leading-page locator and the prior packet's page_end/adjacent Cave Brute
      entry. The two packets cite page 200 but claim disjoint source content;
      this is not duplicate coverage.
  - id: RF-06
    subject: residual_validator_authority_wording
    disposition: non_blocking_observation
    detail: >-
      The validation report's informational node_addition_normal_workflow
      prose repeats “per DEC-2026-0003.” This is residual stock compiler text,
      not authority in the GUP's row-local routing_basis fields and not a
      separate blocker once those fields are corrected as specified. The report
      wording remains noted for the owner of the systemic compiler defect.
