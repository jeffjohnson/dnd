  - id: RF-02
    subject: treasure_table_resolution_edge
    disposition: approved
    refs: [M001]
    detail: >-
      Edge M001 asserts rule_treasure RESOLVED_BY tbl_treasure_7_9 with aspect "treasure selection". The d100
      table determines random treasure selection for 7th- to 9th-level monsters and unguarded finds. RESOLVED_BY
      correctly captures the relationship between the core rule and its resolving table. Derived deterministic
      polarity "governs" conforms to Constitution 1.8 section 6.1 and Graph Invariant 14. Edge held pending until
      node registration is applied; approved for inclusion in the Approved bundle.
  - id: RF-03
    subject: table_entries_and_candidate_rejections
    disposition: approved_omission
    detail: >-
      Independently verified that all 50 table entries in the d100 table are properly excluded from individual
      edges under Graph Invariant 11 and Constitution 1.8 sections 2.4 and 2.5: monetary values (cp, sp, gp) are
      numeric magnitudes; mundane equipment items are roll outcomes whose definitions reside on pages 33–37; art
      curios (such as gold holy symbol of Madeera with pearl, red dragon mask, gold censer) are decorative flavor;
      craftsmanship mentions (elf archer statuette, dwarf horn mug, human cameo) are aesthetic descriptors;
      major/moderate magic items and blessings (spell scrolls, Potions of Healing/Polymorph, Crystal Ball,
      Immovable Rod, Scorpion idol with Death's Sting blessing, Necromancy circle with Ghostwalk blessing, Owl
      statue with Arcane Eye blessing, +2/+3 magic items) have defining loci in later magic item chapters (pp. 276+);
      and potion healing dice expressions (3d8 damage) are numeric magnitudes. All omissions confirmed correct.
  - id: RF-04
    subject: page_attributions
    disposition: approved
    detail: >-
      Primary Source Material opens on page 274 with explicit marker {#p274} on TREASURE 7-9, carrying through entry
      44-45. Explicit inline marker {#p275} on entry 46-47 attributes the remainder of the table (entries 46-47 through
