reviewer_findings:
  - id: RF-01
    subject: optional_process_and_inputs
    disposition: approved
    refs: [M001, M003]
    detail: >-
      The page presents The Gauntlet as an elective process that consumes
      0-Level Characters and produces a surviving 1st-Level Character.
      FEEDS_INTO for the starting characters and GATES for graduation preserve
      the explicit procedure while correctly leaving excluded quantities out.
      Both rows are optional because the GM may choose whether to use the
      process.
  - id: RF-02
    subject: dying_override
    disposition: approved
    ref: M002
    detail: >-
      Inside The Gauntlet, a 0-level character at zero hit points dies
      immediately rather than entering Dying. OVERRIDES with
      supersession_basis optional_variant precisely records that elective
      replacement. Matching the canonical Fatality Mode row's immediate-death
      aspect is intentional: the two distinct optional sources impose the same
      effect on the same target without sharing an assertion key.
  - id: RF-03
    subject: gauntlet_identity
    disposition: approved
    proposed_id: rule_the_gauntlet
    detail: >-
      The Gauntlet is a source-named reusable campaign-opening procedure with
      three relationships. Its rule_ identity and mechanically matching kind
      are constitution-approved, its label and rationale are complete, and it
      is absent from the current registry.
  - id: RF-04
    subject: random_generation_pointer
    disposition: informational_nonblocking
    detail: >-
      The page-40 pointer names a process distributed across ten canonical
      rows and nine tables, not a single graph identity. Choosing one table as
      the target would misstate the reference. This is a vocabulary limit that
      may recur for chapter-level pointers, but it neither falsifies the three
      submitted rows nor authorizes a new aggregate identity in this packet.
  - id: RF-05
    subject: graduation_and_staging_rejections
    disposition: rejected_candidates_confirmed
    detail: >-
      Class selection already follows from the canonical 1st-Level Character
      GATES Class row, while future-character continuity is narrative. Traps,
      monsters, rewards, random-generation preference, build tuning, backup
      pools, and total-loss replacements are hedged staging advice, excluded
      magnitudes, or facts without distinct endpoints. None warrants another
      packet-local relationship.
  - id: RF-06
    subject: computed_evidence_counts
    disposition: verified
    detail: >-
      The stated 692 canonical edges, 322 registry rows, eight relationships
      touching Dying, one existing OVERRIDES into Dying, four relationships
      touching 0-Level Character, and six touching 1st-Level Character all
      match direct measurements. The evidence-count process correction is
      effective for this packet.
