reviewer_findings:
  - id: RF-01
    subject: encounter_table_resolver
    disposition: approved
    refs: [M001]
    detail: >-
      The source-named Slums Encounters Table is a further resolver of
      canonical Encounter on the distinct slums-selection aspect.
  - id: RF-02
    subject: rival_crawlers_wording
    disposition: approved_precedent
    refs: [M002]
    detail: >-
      A rival crawling group is a fourth grammatical form that expressly
      identifies the canonical Rival Crawlers procedure. The qualifier and
      crawler stem together support the table-to-procedure reach even though
      exact-label scans miss the inflected wording.
  - id: RF-03
    subject: coin_treasure_availability
    disposition: approved
    refs: [M003]
    detail: >-
      A loose flagstone conceals a box of gold pieces. The book's gp notation
      identifies canonical Coin, which already feeds Treasure, and the hidden
      cache states availability to be found. The row therefore satisfies the
      settled category-plus-availability test while correctly omitting the
      numeric amount and the unidentified potion.
  - id: RF-04
    subject: spell_scroll_treasure_gap
    disposition: approved_omission
    detail: >-
      The final Spell Scroll result exactly names a canonical category and
      makes it available, but Spell Scroll has no canonical path into Treasure.
      A direct table-to-item row would mistype the relationship. The omission
      proves category, availability and an existing Treasure route are three
      independently necessary elements; a later defining-locus link may justify
      a successor but does not authorize inference now.
  - id: RF-05
    subject: love_potion_spell_boundary
    disposition: approved_omission
    detail: >-
      The love-potion parenthetical genuinely refers to Polymorph, but it
      describes stock and a possible effect. Nobody drinks it and no spell is
      cast. The occurrence-versus-effect distinction therefore withholds a
      TRIGGERS row consistently with the Web precedent.
  - id: RF-06
    subject: table_registration_and_other_omissions
    disposition: approved
    detail: >-
      Slums Encounters Table is source-named, fresh, correctly prefixed and
      supports all three rows. Creatures, named people, offered shelter and
      spells, scenery, prices, magnitudes and table arithmetic were correctly
      withheld where no stated mechanic or supported endpoint exists.
  - id: RF-07
    subject: authority_metadata
    disposition: informational_nonblocking
    detail: >-
      Builder validation text still names stale DEC-2026-0003. This Review
      applies current Shadowdark Constitution section 2 and common Reviewer
      authority directly; no submitted row depends on that citation.
