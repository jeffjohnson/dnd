reviewer_findings:
  - id: RF-01
    subject: verified_node_routing_authority
    disposition: approved
    detail: >-
      All six proposed nodes in the GUP carry routing_basis: 'Constitution 1.8
      section 2: approved prefix and kind, valid ID, no duplicate'. The Builder
      authority citation fix is active and no foreign DEC-2026-0003 citation
      exists anywhere in the GUP or in its validation report.
  - id: RF-02
    subject: source_named_dragon_identities
    disposition: approved
    detail: >-
      The Primary Source Material on pages 210 and 211 contains six distinct
      creature headings and complete stat blocks: DRAGON, DESERT; DRAGON, FIRE;
      DRAGON, FOREST; DRAGON, FROST; DRAGON, SEA; and DRAGON, SWAMP. Labels
      preserve source commas and exact capitalization; IDs use standard
      snake_case transliteration with approved prefix monster_. All six IDs and
      exact labels are absent from the 495-row canonical node registry, which
      currently holds 64 monster identities.
  - id: RF-03
    subject: family_introduction_and_lair_treasure_boundary
    disposition: approved
    detail: >-
      The DRAGONS family introduction provides narrative lore describing dragons
      as winged reptiles carrying ancient magic, and sets procedural lair treasure
      quantities (level x 100 gp and 1d4 items from 80-100 on the treasure table).
      Under Constitution 1.8 sections 2.4 and 2.5, environment composition, loot
      quantities, and narrative framing remain outside the graph absent an
      evidence-bearing Architect Decision. No family-level node or membership edge
      is proposed.
  - id: RF-04
    subject: stat_block_locus_and_zero_edges
    disposition: approved
    detail: >-
      Constitution 1.8 sections 2 and 2.5 exclude individual creature stat-block
      descriptions, modifiers, and values from graph content. All eleven named
      ability and attack trait descriptions (Stormblood, Lightning Breath, Mirage,
      Fireblood, Fire Breath, Animate Plants, Poison Breath, Frostblood, Ice Breath,
      Steam Breath, Water Spout, Smog Breath) describe creature-local combat
      attacks and magnitudes (DC 15, damage dice, 2d100 feet flinging, 1/day,
      1-round durations), not cross-mechanic graph relationships. All seventeen
      rejected candidates in the GUR are correctly excluded under the locus test.
      The zero-edge plan and empty edges component are complete.
  - id: RF-05
    subject: page_attribution
    disposition: approved
    detail: >-
      Explicit page marker {#p210} is anchored to the DRAGONS heading and applies
      to the family introduction, Dragon, Desert, and Dragon, Fire blocks. Marker
      {#p211} is anchored to DRAGON, FOREST and persists through Dragon, Frost,
      Dragon, Sea, and Dragon, Swamp. The claimed two-page span (210-211) and all
      six defining loci agree with the explicit markers.
