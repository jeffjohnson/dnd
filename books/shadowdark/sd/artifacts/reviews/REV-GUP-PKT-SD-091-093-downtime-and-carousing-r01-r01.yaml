reviewer_findings:
  - id: RF-01
    subject: carousing_xp_relationships
    disposition: approved_distinct_relationships
    refs: [M005, M018]
    detail: >-
      M005 records the page-91 rule-level fact that Carousing converts coin
      into XP. M018 records the page-93 resolution fact that the Outcome Table
      determines the XP award. Their sources, endpoints, aspects, and impact
      paths are distinct; retaining both does not duplicate one assertion.
  - id: RF-02
    subject: downtime_alternatives
    disposition: approved
    ref: M003
    detail: >-
      The bounded source names Carousing and Learning as the two activities and
      permits choosing one downtime activity. Their ALTERNATIVE_TO relation is
      therefore source-supported. A later third activity would require new
      pairwise assertions but would not invalidate this pair.
  - id: RF-03
    subject: carousing_coin_consumption
    disposition: approved
    ref: M004
    detail: >-
      Carousing explicitly converts earned coin and requires every participant
      to contribute to the event cost. rule_carousing CONSUMES item_coin with
      aspect event cost accurately records expenditure of a finite resource.
  - id: RF-04
    subject: xp_label_normalization
    disposition: informational_correction
    refs: [M005, M018]
    detail: >-
      The GUR incorrectly claims the exact registry label is Experience Points.
      The canonical label is XP, and the compiler correctly normalized both
      submitted labels without changing identity or semantics.
  - id: RF-05
    subject: fiction_facing_outcomes
    disposition: informational_nonblocking
    detail: >-
      NPC, faction, debt, access, and forward-referenced treasure outcomes lack
      current graph identities or belong to later defining packets. They are
      correctly retained in source rather than represented by invented nodes.
  - id: RF-06
    subject: gur_registry_snapshot
    disposition: informational
    detail: >-
      The GUR says 270 registry rows; the independently measured current
      registry contains 294 after intervening integration. None of the five
      proposed identities is now canonical, so the count drift changes no
      operation.
completeness_statement: >-
  All nineteen rows and five proposed registrations were independently checked
  against pages 91 through 93, Constitution 1.7, the current registry, and the
  canonical neighborhood. Eighteen rows are correct as submitted, including
  the distinct rule-level and table-level XP assertions, the downtime
  alternative, and coin consumption. M013 is source-supported only after
  replacing absolute EXCLUDES semantics with CONSTRAINS and governs/read
  polarity. The exact row-local correction is sufficient; no new identity or
  escalation is required.
