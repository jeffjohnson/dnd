reviewer_findings:
  - id: RF-01
    subject: tavern_and_table_structure
    disposition: approved
    refs: [M001, M002, M003]
    detail: >-
      Taverns is a valid rule identity and is correctly resolved by the Tavern
      Generator, Menu, and Drinks tables. The four submitted procedure/table
      registrations are source-named, fresh, and otherwise approval-ready.
  - id: RF-02
    subject: drink_identity_grain
    disposition: revision_required_item_identities
    refs: [M004, M005, M006, M007, M008, M009, M010, M011, M012]
    detail: >-
      Each boldface drink is a named purchasable item at its defining locus.
      The nine expressible effects must originate from their specific items,
      not the aggregate table. This preserves which drink changes which stat,
      removes the artificial same-source near duplicates, and establishes the
      same object grain that later potion extraction must apply.
  - id: RF-03
    subject: all_twelve_drink_registrations
    disposition: required
    detail: >-
      Register all twelve drinks, not only the nine with currently expressible
      effect rows. Clear Spirits and Autumn Mead have real mechanics whose
      generic another/next-drink target cannot yet be represented, while House
      Ale's free-first-mug fact is magnitude-bound. Missing an edge does not
      erase a source-named item identity under DEC-2026-0003.
  - id: RF-04
    subject: duration_and_status_gaps
    disposition: informational_nonblocking
    detail: >-
      The one-hour duration on six stat changes and Barnacle Grog's blindness
      consequence remain unrepresentable under the current row shape and
      status vocabulary. Re-sourcing the rows does not claim permanence; it
      records only the supported relation. No invented condition, duration, or
      spell-as-status edge is permitted in the successor.
  - id: RF-05
    subject: cross_drink_effects
    disposition: informational_nonblocking
    detail: >-
      Clear Spirits ends a bad effect of another drink and Autumn Mead doubles
      the next drink's effect, but neither statement names a fixed target and
      doubling is magnitude-bearing. Individual drink identities are still
      required; these two relationships remain omitted until a truthful
      generic-target representation exists.
  - id: RF-06
    subject: remaining_rejected_candidates
    disposition: confirmed
    detail: >-
      Tavern quality bands, known-for descriptions, menu prices, and food
      names remain descriptive or magnitude-only. They do not justify extra
      identities or relationships in this packet.
  - id: RF-07
    subject: gur_template_artifact
    disposition: informational_nonblocking
    detail: >-
      IDQ-01 contains the literal placeholder "collapse %d distinct drinks."
      Independent source measurement gives six stat-changing drinks. The
      formatting artifact does not change the identity-grain finding.
completeness_statement: >-
  Printed pages 136 and 137, all three quality bullets, all three tables, all
  44 data rows, all twelve drinks, all twelve submitted relationships, all four
  submitted node proposals, all rejected candidates, IDQ-01, and the item and
  table-sourced canonical precedents were independently checked against
  Constitution 1.7, DEC-2026-0003, the registry, and canonical state. M001–M003
  and the four submitted registrations are correct. M004–M012 use the wrong
  source grain and require twelve item proposals plus exact source corrections
  before this packet can be approved.
