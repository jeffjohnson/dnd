blocking_findings:
  - id: drink_identity_grain_conflated
    severity: blocking
    refs: [M004, M005, M006, M007, M008, M009, M010, M011, M012]
    detail: >-
      The Tavern Drinks Table contains twelve individually named, priced,
      purchasable objects. Nine carry distinct mechanical effects. Sourcing all
      effects from tbl_tavern_drinks loses which drink produces which effect,
      creates artificial opposite-direction near duplicates on Charisma and
      Wisdom, and prevents later source-backed references from targeting the
      drinks. Anonymous mishap and carousing-result precedents do not control
      source-named game objects; the item_ grain does.
    source_citation:
      path: books/shadowdark/sd/packets/claimed/PKT-SD-136-137-taverns/source.md
      page: '137'
      section: TAVERN DRINKS TABLE
      evidence: >-
        Twelve boldface drink names are individually priced. Nine state a
        check, ability change, hit-point recovery, or XP award, while Clear
        Spirits and Autumn Mead explicitly affect other drinks.
