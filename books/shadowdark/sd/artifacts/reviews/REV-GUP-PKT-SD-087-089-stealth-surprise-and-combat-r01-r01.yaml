blocking_findings:
  - id: missing_hidden_position_reveal
    severity: blocking
    detail: >-
      The SURPRISE text explicitly says attacking from hiding gives away the
      attacker's position afterward unless the GM determines otherwise. The
      GUP records the attack advantage but no relationship for losing the
      hiding state. cbt_attack_roll is canonical and
      rule_hiding_and_sneaking is proposed by this packet, so the relationship
      is representable without a new identity or architectural decision.
    source_citation:
      path: books/shadowdark/sd/packets/claimed/PKT-SD-087-089-stealth-surprise-and-combat/source.md
      page: '87'
      section: SURPRISE
      evidence: >-
        Attacking from hiding gives away the attacker's position afterwards
        unless the GM determines otherwise.
  - id: missing_dying_natural_twenty_recovery
    severity: blocking
    detail: >-
      The DEATH text explicitly restores hit points when a dying character
      rolls a Natural 20 on a subsequent turn. The GUP records ordinary
      regained hit points ending the dying state but omits this named recovery
      input. rule_natural_twenty and rule_hit_points are both canonical, so the
      relationship is representable without a new identity or architectural
      decision and without storing the numeric magnitude.
    source_citation:
      path: books/shadowdark/sd/packets/claimed/PKT-SD-087-089-stealth-surprise-and-combat/source.md
      page: '89'
      section: DEATH
      evidence: >-
        On a subsequent dying turn, a Natural 20 causes the character to rise
        with hit points.
