reviewer_findings:
  - id: RF-01
    subject: action_spellcasting_opposed_direction
    disposition: approved_distinct_relationships
    ref: M020
    detail: >-
      The canonical rule_spellcasting_check CONSUMES rule_action row records
      the action cost at Spellcasting's defining locus. M020 records page 88's
      explicit pointer from the Actions list to Spellcasting. CROSS_REFERENCES
      is directionally appropriate to that pointer and is semantically
      distinct from the reverse CONSUMES relationship.
  - id: RF-02
    subject: critical_hit_identity
    disposition: approved_canonical_reuse
    refs: [M026, M027]
    detail: >-
      The page-89 Critical Hit rule expressly covers both attack rolls and
      spellcasting checks and sends the spell case back to page 45's canonical
      Critical Success procedure. Reusing rule_critical_success preserves that
      shared event and avoids a near-duplicate cbt_critical_hit identity.
      rule_natural_twenty remains the roll-face input, not a competing event
      identity.
  - id: RF-03
    subject: stealth_terrain_domain_boundary
    disposition: informational_nonblocking
    detail: >-
      Stealth, detection, and terrain apply beyond combat, but candidate-domain
      promotion is not required to register their source-named rules or approve
      the submitted relationships. DBQ-01 therefore does not block this packet.
  - id: RF-04
    subject: external_invisibility_gap
    disposition: informational_out_of_scope
    detail: >-
      The confirmed missing connection between spell_invisibility and
      rule_invisibility belongs to the already integrated PKT-SD-062-065
      lineage. It requires a separately scoped successor and neither changes
      nor blocks the rows reviewed here.
  - id: RF-05
    subject: gur_registry_snapshot
    disposition: informational
    detail: >-
      The GUR says 253 registry rows; the independently measured current
      registry contains 277. The compiler used live state, all twelve proposals
      are fresh, and the stale prose count changes no operation.
completeness_statement: >-
  All 43 submitted rows and twelve proposed registrations were independently
  checked against pages 87 through 89, Constitution 1.7, the current registry,
  and the canonical neighborhood. Every submitted row is correct as written,
  including M020's distinct cross-reference direction and reuse of canonical
  rule_critical_success. Approval is withheld because two explicit mechanics
  are absent: an attack reveals a hidden attacker, and Natural 20 restores hit
  points during the dying sequence. A successor adding those relationships
  while preserving all submitted material will be complete.
