    detail: >-
      r03 consumes REV-GUP-PKT-SD-195-195-monster-family-angels-r01-r01,
      directly supersedes GUP r02, and applies all four node-local routing_basis
      corrections exactly as specified. The unsupported DEC-2026-0003 claims are
      gone from the node proposals; constitution 1.8 section 2 is correctly
      named as the ordinary-workflow authority. The four source identities and
      labels are unchanged and approved.
  - id: RF-02
    subject: bless_and_luck_token
    disposition: approved_omission
    detail: >-
      Bless explicitly grants a luck token, and rule_luck_token is canonical;
      the shared target and encounter-table FEEDS_INTO precedents were checked.
      Bless remains a limited-use trait stated only under the seraph's own
      stat block. Constitution 2.5 excludes edges from such descriptions.
      Using monster_angel_seraph as the edge source would conflate the creature
      with its separate trait, and no shared-locus statement generalizes Bless
      to angels. The GUR's omission is correct even though the target is explicit.
  - id: RF-03
    subject: other_abilities_and_rank_taxonomy
    disposition: approved_omission
    detail: >-
      Command, Crown of Fire, Horn, Moonlight Aura, and Truesight are individual
      stat-block descriptions without a source-supported edge that survives
      constitution 2.5. Crown of Fire and Moonlight Aura are distinct abilities,
      not one shared mechanic. The introductory hierarchy gives relative ranks
      but no mechanical consequence; no family or membership node is warranted.
  - id: RF-04
    subject: individual_values_flavour_and_scope
    disposition: approved_omission
    detail: >-
      The four flavour descriptions, printed individual stat-block values, and
      appended context from pages 189, 85, and morale are correctly excluded.
      The GUP edge component is header-only, and the zero-edge extraction is
      complete.
  - id: RF-05
    subject: superseded_review_null_gup_r02
    disposition: approved
    detail: >-
      The immutable, review_id-null r02 is directly superseded by active GUP
      r03. r03 records this Review's predecessor as its provenance.review_id;
      the bounded scanner identifies r03 as the sole active Reviewer item and
      reports zero lineage errors. The superseded r02 was not consumed as an
      approval or used as source evidence.
  - id: RF-06
    subject: build_test_snapshot_and_live_suite
    disposition: approved
    detail: >-
      The immutable r03 GUP and validation report record 938 passing Builder
      tests in their build snapshot. I independently ran the current complete
      Builder suite after the routing_basis implementation and observed 942
      tests, zero failures, and zero errors, including the four new
      NodeRoutingBasisCorrectionCase tests. The current test gate is therefore
      independently green; the GUP's recorded snapshot is preserved as issued.
  - id: RF-07
    subject: generated_validation_report_authority_text
    disposition: approved
    detail: >-
      The r03 validation report's four informational node_addition_normal_workflow
      messages still say "per DEC-2026-0003" even though the corrected GUP node
      routing_basis now names constitution 1.8 section 2 and the cited Decision
      is not a Shadowdark authority. This is stale generated diagnostic text,
      not the operative routing_basis or an approval gate: the node proposals
      have been independently judged under constitution section 2, and the
      report is clean. No broader tooling change was made within this packet
      review; the remaining default/report text is flagged for Architect/owner
      awareness.
