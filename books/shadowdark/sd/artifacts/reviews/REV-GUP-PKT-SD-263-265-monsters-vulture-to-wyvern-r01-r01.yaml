reviewer_findings:
  - id: RF-01
    subject: verified_node_routing_authority
    disposition: approved
    detail: >-
      All twelve proposed nodes in the GUP carry routing_basis: 'Constitution 1.8 section 2: approved prefix and kind, valid ID, no duplicate'. Prefix monster_ and kind monster are approved vocabulary under Constitution 1.8 section 2.
  - id: RF-02
    subject: source_named_monster_identities
    disposition: approved
    detail: >-
      The Primary Source Material on pages 263–265 contains twelve distinct creature headings and complete stat blocks: VULTURE, WASP, GIANT, WERERAT, WEREWOLF, and WIGHT on page 263; WILL-Oʼ-WISP, WOLF, WOLF, DIRE, and WOLF, WINTER on page 264; and WORG, WRAITH, and WYVERN on page 265. Labels preserve exact source wording and punctuation; IDs drop commas/punctuation where appropriate and use standard snake_case transliteration with approved prefix monster_. All twelve IDs are absent from the 661-row canonical node registry, which currently holds 230 monster identities.
  - id: RF-03
    subject: stat_block_locus_and_zero_edges
    disposition: approved
    detail: >-
      Constitution 1.8 sections 2.4 and 2.5 exclude individual creature stat-block descriptions, modifiers, and combat traits from graph content. Vulture Carrion Tracker; Giant Wasp Venom; Wererat and Werewolf Impervious (silver/magic only) and Lycanthropy infection; Wight Greater Undead and Life Drain (CON damage/death); Will-o'-Wisp Life Drain; Wolf and Dire Wolf Pack Hunter; Winter Wolf Impervious (cold immune) and Frost Breath; Worg language notes; Wraith Greater Undead, Incorporeal, and Life Drain; Wyvern Poison; and weapon/armor annotations all operate strictly on creature combat/action loci rather than ruleset-wide mechanics or global systems. All candidate rejections in the GUR are verified correct under Constitution 2.4/2.5. The zero-edge plan and empty edges component are complete.
  - id: RF-04
    subject: graph_invariant_4_creature_ancestry_language_and_class_distinction
    disposition: approved
    detail: >-
      Graph Invariant 4 requires strict differentiation between creature identity nodes and any corresponding ancestry, class, or language nodes. Verified that none of the proposed creature identities conflate with playable ancestries, classes, or languages in canonical Shadowdark registries. Worg's mention of speaking Goblin operates as a creature attribute rather than an identity collision with language_goblin. All proposed nodes are strictly creature identities defined under Chapter 11 monster listings.
  - id: RF-05
    subject: page_attributions
    disposition: approved
    detail: >-
      Primary Source Material opens directly on page 263 with explicit marker {#p263} on Vulture (persisting through Giant Wasp, Wererat, Werewolf, and Wight). Two explicit page markers follow: {#p264} on Will-o'-Wisp (persisting through Wolf, Dire Wolf, and Winter Wolf); and {#p265} on Worg (persisting through Wraith and Wyvern). The claimed three-page span (263–265) and all twelve defining loci agree with the markers and structural placement rules.
completeness_statement: >-
  Independently read the complete claimed Primary Source Material on pages 263–265 at its pinned checksum, verified all twelve creature identities against their defining stat blocks, derived page attributions directly from explicit markers {#p263}, {#p264}, and {#p265}, evaluated Graph Invariant 4, confirmed the exclusion of all stat-block combat traits, lycanthropy infections, breath weapons, life drains, venom/poison mechanics, immunities, equipment annotations, and attributes under Constitution 2.4 and 2.5, and verified that Builder authority citations strictly cite Constitution 1.8 section 2. The packet yields 12 new node registrations and 0 edge insertions, with 0 errors and 0 warnings. Mechanically complete and approved for integration.
