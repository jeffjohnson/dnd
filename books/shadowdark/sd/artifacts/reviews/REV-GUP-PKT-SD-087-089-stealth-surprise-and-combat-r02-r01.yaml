    disposition: approved
    ref: M044
    detail: >-
      M044 exactly restores the omitted page-87 consequence: an attack from
      hiding ends position concealment unless the GM determines otherwise.
      cbt_attack_roll EXCLUDES rule_hiding_and_sneaking is directionally and
      semantically correct, and negates/derived is the required polarity.
  - id: RF-02
    subject: dying_natural_twenty_recovery
    disposition: approved
    ref: M045
    detail: >-
      M045 exactly restores the omitted page-89 recovery input. A Natural 20
      on a dying character's subsequent turn improves Hit Points; the existing
      rule_hit_points EXCLUDES rule_dying row carries the resulting exit from
      the state. The qualitative row correctly omits the numeric magnitude.
  - id: RF-03
    subject: successor_preservation
    disposition: nonblocking_verified
    detail: >-
      M001 through M043 are byte-equivalent as row objects to r01. All twelve
      node proposals retain their substantive fields; executable Reviewer
      metadata is carried forward and rule_hiding_and_sneaking correctly adds
      M044 to its dependent refs.
  - id: RF-04
    subject: action_spellcasting_opposed_direction
    disposition: approved_distinct_relationships
    ref: M020
    detail: >-
      The inherited warning remains nonblocking. M020 records page 88's pointer
      from the Actions list to Spellcasting, while the reverse canonical
      CONSUMES row records action cost. The relationships differ in type,
      aspect, provenance, and purpose.
  - id: RF-05
    subject: critical_hit_identity
    disposition: approved_canonical_reuse
    refs: [M026, M027, M045]
    detail: >-
      rule_natural_twenty is the roll-face input and rule_critical_success is
      the shared critical event used by attack and spellcasting checks. M045
      adds a different Natural-20 consequence and does not alter the prior
      identity ruling or collide with the automatic-hit row.
completeness_statement: >-
