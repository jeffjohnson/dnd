  - id: RF-02
    subject: rival_crawlers_results
    disposition: approved
    refs: [M002]
    detail: >-
      Four table cells expressly name rival crawlers. They support one
      table-to-procedure FEEDS_INTO assertion under the common assertion key;
      the first supporting cell is on printed page 178.
  - id: RF-03
    subject: luck_token_award
    disposition: approved
    refs: [M003]
    detail: >-
      The brass-wolf result expressly imparts good luck and names the luck
      token. FEEDS_INTO with aspect encounter award captures the supported
      dependency without storing the percentage magnitude.
  - id: RF-04
    subject: van_dinkle_reference
    disposition: approved
    refs: [M004]
    detail: >-
      The Van Dinkle flask cell explicitly points to printed page 137, the
      defining locus of canonical Van Dinkle Whiskey. The incidental vessel
      wording does not rename that identity; CROSS_REFERENCES and
      explicit_reference capture exactly the source's page pointer.
  - id: RF-05
    subject: source_omissions
    disposition: approved_omission
    detail: >-
      The remaining barroom scenes, creatures, contests, trapdoor, rumour,
      flaming oil, magic-item proper name and repeated encounter instruction
      do not state additional graph-supported mechanics under the current
      packet and neighborhood. Withholding those rows avoids inferred effects,
      incidental-mention identities and duplicate encounter-table assertions.
  - id: RF-06
    subject: table_registration_and_scope
    disposition: approved
    detail: >-
      Tavern Encounters Table is source-named, fresh, correctly prefixed and
      supports all four submitted rows. The ID and label are absent from the
      current registry and no canonical edge uses the proposed endpoint.
  - id: RF-07
    subject: authority_metadata
    disposition: informational_nonblocking
    detail: >-
      Builder validation text still names stale DEC-2026-0003, which is not a
      Shadowdark Decision. This Review applies current Shadowdark Constitution
      section 2 and the common Reviewer authority directly; no submitted row
      depends on that citation.
