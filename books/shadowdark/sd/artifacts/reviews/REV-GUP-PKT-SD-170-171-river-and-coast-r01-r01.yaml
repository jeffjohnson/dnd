      canonical Rival Crawlers procedure and supports the table-to-procedure
      reach.
  - id: RF-04
    subject: treasure_acquisition_boundary
    disposition: approved
    refs: [M004]
    detail: >-
      A half-buried treasure chest containing a magic item expressly states a
      canonical Treasure category and availability for acquisition. The table
      therefore feeds Treasure under the settled test. No direct table-to-item
      row is warranted because canonical Magic Item already feeds Treasure.
  - id: RF-05
    subject: movement_target_search
    disposition: approved_omissions
    detail: >-
      The complete movement-adjacent registry sweep, including Swimming,
      corrects the prior search-method gap. Swimming's canonical rows govern
      character breath, speed, rough-water checks and drowning; none of this
      packet's water scenes states those mechanics. No Movement, Swimming,
      Overland Travel or sea-travel row is supported.
