    subject: scan_measurement_disclosure
    disposition: informational_nonblocking
    detail: >-
      The whole-label scan undercounts by one cell because the spear-lined pit
      also matches canonical Spear. That match is an ordinary object mention
      and changes neither the pit's trap disposition nor any submitted row.
  - id: RF-07
    subject: table_registration_and_other_omissions
    disposition: approved
    detail: >-
      River And Coast Encounters Table is source-named, fresh, correctly
      prefixed and supports all four rows. Creatures, named people, maritime
      scenes, pearls, wrecks, magnitudes and table arithmetic were correctly
      withheld where no stated mechanic or supported endpoint exists.
  - id: RF-08
    subject: authority_metadata
    disposition: informational_nonblocking
    detail: >-
