      Proposed IDs and labels are confirmed absent from the canonical node registry (744 rows). Routing bases
      correctly cite Constitution 1.8 section 2. Reviewer approval granted for all 12 node registrations.
  - id: RF-02
    subject: magic_item_edges
    disposition: approved
    refs: [M001, M002, M003, M004, M005, M006, M007, M008, M009, M010, M011, M012, M013, M014, M015, M016, M017, M018]
    detail: >-
      Edges M001–M018 assert mechanical relations for the 12 magic items: M001 asserts item_gauntlets_of_might
      MODIFIES abil_strength (aspect: "stat replacement", condition: "while wearing gauntlets", polarity: improves);
      M002 asserts item_genie_lamp TRIGGERS monster_djinni (aspect: "genie emergence", condition: "when lamp rubbed", polarity: neutral);
      M003 asserts item_genie_lamp TRIGGERS monster_efreeti (aspect: "genie emergence", condition: "when lamp rubbed", polarity: neutral);
      M004 asserts item_genie_lamp TRIGGERS spell_wish (aspect: "wish granting", condition: "after emergence or defeat", polarity: neutral);
      M005 asserts item_gloves_of_agility MODIFIES abil_dexterity (aspect: "stat replacement", condition: "while wearing gloves", polarity: improves);
      M006 asserts item_goblin_bomb TRIGGERS cbt_damage_roll (aspect: "explosion damage", condition: "when bomb explodes", polarity: neutral);
      M007 asserts item_greataxe_of_the_horde MODIFIES cbt_attack_roll (aspect: "attack bonus", condition: "when attacking with this weapon", polarity: improves);
      M008 asserts item_greataxe_of_the_horde MODIFIES cbt_attack_roll (aspect: "critical hit conversion", condition: "on a regular hit", polarity: improves);
      M009 asserts item_greataxe_of_the_horde MODIFIES abil_charisma (aspect: "battle rage check", condition: "when below half hit points", polarity: worsens);
      M010 asserts item_hat_of_intellect MODIFIES abil_intelligence (aspect: "stat replacement", condition: "while wearing hat", polarity: improves);
      M011 asserts item_hat_of_the_hound TRIGGERS monster_mastiff (aspect: "mastiff transformation", condition: "when transformed", polarity: neutral);
      M012 asserts item_helm_of_mind_reading TRIGGERS spell_detect_thoughts (aspect: "detect thoughts casting", condition: "when cast from helm", polarity: neutral);
      M013 asserts item_horned_helm_of_ramlaat MODIFIES cbt_armor_class (aspect: "armor bonus", condition: "while wearing helm", polarity: improves);
      M014 asserts item_horned_helm_of_ramlaat MODIFIES abil_strength (aspect: "knockdown advantage", condition: "to knock down creatures or objects", polarity: improves);
      M015 asserts item_hourglass_of_the_black_sands MODIFIES rule_spell_duration (aspect: "spell duration extension", condition: "when casting a spell", polarity: improves);
      M016 asserts item_immovable_rod MODIFIES ex_movement (aspect: "spatial fixation", condition: "when button clicked", polarity: improves);
      M017 asserts item_jewel_of_barbalt MODIFIES cbt_attack_roll (aspect: "critical success threshold", condition: "on attack rolls", polarity: improves);
      and M018 asserts item_jewel_of_barbalt MODIFIES cbt_attack_roll (aspect: "critical failure threshold", condition: "on attack rolls", polarity: worsens).
      All edge types, directions, conditions, and polarities strictly conform to Constitution 1.8 section 6.1 and Graph Invariant 14.
      Edges are held pending until node registrations are applied; approved for inclusion in the Approved bundle upon integration.
  - id: RF-03
    subject: near_duplicate_findings
    disposition: approved
    refs: [M007, M008, M017, M018]
    detail: >-
      Confirmed that the two pairs of near-duplicate edges assert distinct mechanics:
      Pair 1 (M007 vs M008): item_greataxe_of_the_horde MODIFIES cbt_attack_roll with aspect "attack bonus"
      under condition "when attacking with this weapon" (+2 weapon bonus) versus aspect "critical hit conversion"
      under condition "on a regular hit" (daily hit conversion). These are independent mechanical effects.
      Pair 2 (M017 vs M018): item_jewel_of_barbalt MODIFIES cbt_attack_roll with aspect "critical success threshold"
      and polarity improves versus aspect "critical failure threshold" and polarity worsens. These represent opposing
      mechanical modifications (expanded crit success vs expanded crit failure). Both assertions confirmed valid and distinct.
  - id: RF-04
    subject: narrative_and_candidate_rejections
    disposition: approved_omission
    detail: >-
      Independently verified that all narrative lore, cosmetic descriptions, DC figures, numeric bonuses, dice rolls, durations,
      frequencies, and out-of-scope passages are properly excluded from edges under Graph Invariant 11 and Constitution 1.8 sections 2.4 and 2.5:
      Gauntlets of Might 18 (+4) stat target magnitude;
      Genie Lamp 50% emergence probability;
      Gloves of Agility 18 (+4) stat target magnitude;
      Goblin Bomb near distance range, 1d4 rounds fuse timer, and 2d8 damage magnitude;
      Greataxe of the Horde +2 bonus magnitude, once per day frequency, half HP trigger, DC 12 check DC, 1d4 rounds rage duration, and nearest creature attack requirement;
      Hat of Intellect 18 (+4) stat target magnitude;
      Hat of the Hound 10 rounds duration limit per day;
      Helm of Mind Reading three times per day frequency and +4 bonus magnitude;
      Horned Helm of Ramlaat +1 AC bonus magnitude and delicate objects headbutt flavor;
      Hourglass of the Black Sands once per day frequency and 1d4 rounds duration extension;
      Immovable Rod 5,000 lbs weight capacity;
      Jewel of Barbalt 18-20 critical success range and 1-3 critical failure range;
      and supporting context passages (pp. 282–283, 34–35) are out of packet scope.
      All omissions confirmed correct.
  - id: RF-05
    subject: page_attributions
    disposition: approved
    detail: >-
      Primary Source Material spans pages 303–305: GAUNTLETS OF MIGHT, GENIE LAMP, GLOVES OF AGILITY, and GOBLIN BOMB
      precede explicit marker {#p304} on page 303 (M001–M006); explicit marker {#p304} covers GREATAXE OF THE HORDE,
      HAT OF INTELLECT, HAT OF THE HOUND, HELM OF MIND READING, and HORNED HELM OF RAMLAAT (M007–M014); explicit marker {#p305}
      covers HOURGLASS OF THE BLACK SANDS, IMMOVABLE ROD, and JEWEL OF BARBALT (M015–M018).
      Page attributions strictly conform to placement rules.
