    detail: >-
      All three proposed nodes in the GUP carry routing_basis: 'Constitution 1.8 section 2: approved prefix and kind, valid ID, no duplicate'. Prefix monster_ and kind monster are approved vocabulary under Constitution 1.8 section 2.
  - id: RF-02
    subject: source_named_goblin_identities
    disposition: approved
    detail: >-
      The Primary Source Material on page 221 contains three distinct creature headings and complete stat blocks: GOBLIN; GOBLIN, BOSS; and GOBLIN, SHAMAN. Labels preserve exact source wording and comma placement; IDs drop commas and use standard snake_case transliteration with approved prefix monster_. All three IDs are absent from the 538-row canonical node registry, which currently holds 107 monster identities.
  - id: RF-03
    subject: label_collision_evaluation_under_invariant_4
    disposition: approved
    detail: >-
      Validation report warning on proposed label 'Goblin' colliding with canonical ancestry_goblin and lang_goblin was audited against Graph Invariant 4. ancestry_goblin (kind: ancestry) represents the player character ancestry from SD p. 16, lang_goblin (kind: lang) represents the language from SD p. 30, and monster_goblin (kind: monster) represents the creature stat block from SD p. 221. Labels do not determine identity (Invariant 4); distinct prefixes and kinds preserve graph integrity without collision or ambiguity, following established precedent (monster_elf vs ancestry_elf).
  - id: RF-04
    subject: stat_block_locus_and_zero_edges
    disposition: approved
    detail: >-
      Constitution 1.8 sections 2.4 and 2.5 exclude individual creature stat-block descriptions, modifiers, and values from graph content. Keen Senses ("Can't be surprised") describes creature combat defense on creature locus. Armor notations (chainmail on Boss, leather on Shaman) explain AC values. Goblin Shaman innate WIS spells (Bug Brain, Skitter, Stink Bomb) operate with creature-specific DCs and durations under monster spellcasting rules on creature locus rather than cross-mechanic character spell edges. All nine candidate rejections in the GUR are verified correct under Constitution 2.4/2.5. The zero-edge plan and empty edges component are complete.
  - id: RF-05
    subject: family_lore_and_taxonomy_excluded
    disposition: approved
    detail: >-
      The two-paragraph family introduction on page 221 describes goblin physical traits, underground warrens, subservience to hobgoblins/bugbears/giants, and social hierarchy under bosses and shamans. Under Constitution 1.8 section 2.4, narrative lore and family grouping are excluded absent an explicit Decision.
  - id: RF-06
    subject: page_attribution
    disposition: approved
    detail: >-
      Explicit page marker {#p221} is anchored directly to the GOBLINS heading and persists through all three creature stat blocks on page 221. The claimed single-page span (221) and all three defining loci agree with the marker.
