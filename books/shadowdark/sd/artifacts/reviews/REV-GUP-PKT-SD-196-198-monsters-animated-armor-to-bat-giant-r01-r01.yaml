      - monster_archmage
      - monster_assassin
      - monster_azer
      - monster_badger
      - monster_bandit
      - monster_basilisk
      - monster_bat_giant
    detail: >-
      The twelve source-supported identities are collision-free, but every
      submitted routing_basis invokes nonexistent Shadowdark DEC-2026-0003.
      Constitution 1.8 section 2 authorizes the approved monster_ prefix and
      ordinary source-backed GUR/GUP/Review workflow. The twelve exact,
      row-local corrections replace only that false authority claim.
  - id: RF-02
    subject: source_named_creature_identities
    disposition: approved
    detail: >-
      Each proposal corresponds to a separate creature heading and complete
      stat block in the claimed source: five at printed page 196, five at 197,
      and two at 198. The labels preserve source punctuation, including
      `Ape, Snow` and `Bat, Giant`; their IDs use valid lowercase snake_case
      transliterations. The Constitution 1.8 `monster_` prefix and kind are
      approved for source-defined creatures. All twelve IDs and exact labels
      are absent from the current node registry; no exact-label collision was
      found.
  - id: RF-03
    subject: stat_block_locus_and_zero_edges
    disposition: approved_omission
    detail: >-
      Constitution 1.8 sections 2.4 and 2.5 preserve the distinction between
      creature identity and an individual stat-block description or value.
      The identities belong at these stat-block defining loci, but individual
      AC, HP, attacks, movement, modifiers, alignment, level, spell DCs, and
      creature-local descriptions do not become graph properties or edges.
      The GUR's zero-edge shape is source- and constitution-consistent; it
      proposes no family grouping or inferred dependency.
  - id: RF-04
    subject: named_ability_omissions
    disposition: approved_omission
    detail: >-
      Independently checked the fifteen named ability entries across the
      twelve blocks against the source: Statue, Thick Fur, Beguile, Magic
      Bolt, Death Bolt, Enervate, Fireblast, Float, Mithralskin, Void Step,
      Execute, Impervious, Rage, Ambush, and Petrify. Each remains a
      stat-block-local description under Constitution 2.5, including Rage's
      morale reference, Execute's surprise reference, and Ambush's
      hiding/detecting references. None establishes a reusable shared-locus
      mechanic or a source-identified spell/item dependency in this packet.
  - id: RF-05
    subject: scope_and_component
    disposition: approved
    detail: >-
      All three printed pages in the claimed packet are in scope, no tables or
      non-source context are treated as graph content, and the accompanying
      edges CSV contains only its header. No proposed IDs or labels collide
      with current registry rows; no current canonical edge cites printed
      pages 196 through 198.
