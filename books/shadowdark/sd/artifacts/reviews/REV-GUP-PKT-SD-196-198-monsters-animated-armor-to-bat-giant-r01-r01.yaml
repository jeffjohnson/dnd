blocking_findings:
  - id: nonexistent_shadowdark_decision_reference
    detail: >-
      Each of the twelve proposed node routing_basis values cites
      DEC-2026-0003 as Shadowdark authority, but no such Shadowdark Decision
      exists. Constitution 1.8 section 2 explicitly lists `monster_` as the
      approved prefix/kind and states that source-backed nodes under approved
      prefixes follow normal GUR/GUP/Review workflow. Replace each node-local
      routing_basis exactly as specified in that node's exact_corrections.
      The twelve identities, labels, source loci, and zero-edge extraction are
      otherwise approved and must remain unchanged.
    current_authority:
      path: rulesets/shadowdark/governance/constitution.md
      checksum: sha256:629e72cde3206228e1d1e569957dfff6aa275728c18ff4890c81cfcdc6e0c93d
reviewer_findings:
  - id: RF-01
    subject: node_routing_authority
    disposition: approved_with_revision
    refs:
      - monster_animated_armor
      - monster_ankheg
      - monster_ape
      - monster_ape_snow
