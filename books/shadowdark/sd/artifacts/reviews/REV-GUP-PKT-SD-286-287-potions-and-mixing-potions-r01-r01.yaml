      Prefix tbl_ and kind tbl are approved vocabulary under Constitution 1.8 section 2. Proposed IDs and
      labels are confirmed absent from the canonical node registry (695 rows). Routing bases correctly cite
      Constitution 1.8 section 2. Reviewer approval granted for all four node registrations.
  - id: RF-02
    subject: potion_resolution_edges
    disposition: approved
    refs: [M001, M002, M003, M004]
    detail: >-
      Edges M001–M004 assert item_magic_item RESOLVED_BY each corresponding potion generation or mixing table
      (tbl_potion_features with aspect "potion feature selection" and condition "for potions", tbl_mixing_potions
      with aspect "potion mixing outcome" and condition "when mixing potions", tbl_potion_benefit with aspect
      "potion benefit selection" and condition "for potions", and tbl_potion_curse with aspect "potion curse selection"
      and condition "for potions"). Derived deterministic polarity "governs" conforms to Constitution 1.8 section 6.1
      and Graph Invariant 14. All four edges are held pending until node registrations are applied; approved for inclusion
      in the Approved bundle.
  - id: RF-03
    subject: table_entries_and_candidate_rejections
    disposition: approved_omission
    detail: >-
      Independently verified that all individual table rows, roll outcomes, and numeric magnitudes are properly
      excluded from edges under Graph Invariant 11 and Constitution 1.8 sections 2.4 and 2.5: Potion Features Table
      sensory/visual descriptors are aesthetic roll outcomes; Mixing Potions Table mishap results (float 2 rounds,
      fumes DC 12 CON, explode DC 12 DEX, +/-1 to stat, etc.) are roll outcome mishaps; Potion Benefit Table entries
      (immune 5 rounds, heal dice 1d4 to 4d10, fly near, stat becomes 18 (+4), purple flying gas, etc.) and Potion Curse
      Table entries (DC 15 WIS, 1 HP newt, stat becomes 3 (-4), DC 15 CON or 2d10 damage, antimagic shell 1 hour, etc.)
      contain numeric magnitudes (durations, DCs, hit points, damage/healing dice expressions) and specific roll effects
      excluded from edge aspects and conditions under Graph Invariant 11 and Constitution 1.8 §§2.4/2.5; and supporting
      context passages (Magic item attributes, pp. 282-283) are out of packet scope. All omissions confirmed correct.
  - id: RF-04
    subject: page_attributions
    disposition: approved
    detail: >-
      Primary Source Material opens on page 286 with explicit marker {#p286} on POTIONS, carrying through POTION FEATURES
      TABLE and MIXING POTIONS TABLE. Explicit marker {#p287} on POTION BENEFIT TABLE attributes that table and POTION CURSE
      TABLE to printed page 287. Page attributions on M001–M002 (p. 286) and M003–M004 (p. 287) strictly conform to
      placement rules.
