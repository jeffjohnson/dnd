    detail: >-
      The four proposed nodes tbl_potion_features (Potion Features Table, p. 286), tbl_mixing_potions
      (Mixing Potions Table, p. 286), tbl_potion_benefit (Potion Benefit Table, p. 287), and tbl_potion_curse
