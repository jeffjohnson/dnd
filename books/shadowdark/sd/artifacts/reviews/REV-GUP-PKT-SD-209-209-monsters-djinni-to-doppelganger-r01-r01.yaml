  - id: RF-02
    subject: source_named_djinni_and_doppelganger_identities
    disposition: approved
    detail: >-
      The Primary Source Material on page 209 contains two distinct creature
      headings and complete stat blocks: DJINNI and DOPPELGANGER. Labels preserve
      exact capitalization; IDs use standard snake_case transliteration with
      approved prefix monster_. Both IDs and exact labels are absent from the
      493-row canonical node registry, which currently holds 62 monster
      identities.
  - id: RF-03
    subject: stat_block_locus_and_zero_edges
    disposition: approved
    detail: >-
      Constitution 1.8 sections 2 and 2.5 exclude individual creature stat-block
      descriptions, modifiers, and values from graph content. The five special
      ability descriptions (Djinni's Impervious, Whirlwind, Wish; Doppelganger's
      Change Shape, Telepathy) describe creature-local combat traits and
      magnitudes (DC 18, 2d100 feet thrown distance, once per week casting), not
      cross-mechanic graph relationships. All eight rejected candidates in the
      GUR are correctly excluded under the locus test. The zero-edge plan and
      empty edges component are complete.
  - id: RF-04
    subject: wish_ability_creature_locus_boundary
    disposition: approved
    detail: >-
      Djinni's Wish ability explicitly references the Wish spell on page 73
      (`spell_wish`), but modifies the invocation conditions for this creature
      specifically (once per week, for a mortal, without making a spellcasting
      check). Under Constitution 1.8 section 2.5, this remains an ability of the
      creature's own stat block rather than an edge modifying or triggering the
      general Wish spell rule.
  - id: RF-05
    subject: page_attribution
    disposition: approved
    detail: >-
      Explicit page marker {#p209} is anchored directly to the DJINNI heading and
      persists through DOPPELGANGER. The claimed single-page span (209) and both
      defining loci agree with the marker.
