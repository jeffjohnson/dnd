  - id: RF-02
    subject: rival_crawlers_reach
    disposition: approved
    refs: [M002]
    detail: >-
      Rival crawlers accusing the characters of looting explicitly invoke the
      canonical Rival Crawlers procedure. Rival gangs and rival dog fighters
      use ordinary descriptive language and correctly do not create additional
      rows.
  - id: RF-03
    subject: encounter_healing
    disposition: approved
    refs: [M003]
    detail: >-
      Cups of mulled wine expressly heal hit points. MODIFIES Hit Points at
      encounter healing with improves/read polarity preserves the stated
      mechanic while correctly excluding its numeric magnitude.
  - id: RF-04
    subject: treasure_category_precedent
    disposition: approved_precedent
    refs: [M004]
    detail: >-
      The cell expressly identifies the result as a magic item, which is a
      canonical source category feeding Treasure. Under the Deep Tunnels
      precedent, the canonical category term is the operative explicit basis;
      the earlier words treasure chest described its container and were not a
      second requirement. This remains materially different from the page-147
      magic sword appearing in a statue's hand, which describes a particular
      object in scenery without stating acquisition or a category-level result.
      One FEEDS_INTO row to Treasure is sufficient because canonical Magic Item
      already feeds Treasure; no direct table-to-item row is warranted.
  - id: RF-05
    subject: trap_agency_boundary
    disposition: approved_omission
    detail: >-
      Hidden thieves choosing to pull ropes describe an ambush controlled by
      participants, not a placed mechanism operating when triggered. Withholding
      a table-to-Traps reach is consistent with the settled mechanism test and
      does not weaken the approved Desert, Forest or Jungle rows.
  - id: RF-06
    subject: scan_and_template_disclosures
    disposition: informational_nonblocking
    detail: >-
      OBS-01 contains unsubstituted placeholders, but its computed values are
      independently confirmed as three rival-stem cells at indices 14, 35 and
      36, with only 36 naming Rival Crawlers. A fuller stemmer also finds
      Falling through falls, producing seventeen rather than fifteen candidate
      cells; the grave scene states no character-rule consequence, so neither
      issue changes any submitted or rejected decision.
  - id: RF-07
    subject: table_registration_and_omissions
    disposition: approved
    detail: >-
      Low District Encounters Table is source-named, fresh, correctly prefixed
      and supports all four rows. Creatures, named people, organizations,
      scenery, object quantities, reroll arithmetic and effects without a
      supported canonical endpoint were correctly withheld.
  - id: RF-08
    subject: authority_metadata
    disposition: informational_nonblocking
    detail: >-
      Builder validation text still names stale DEC-2026-0003. This Review
      applies current Shadowdark Constitution section 2 and common Reviewer
      authority directly; no submitted row depends on that citation.
