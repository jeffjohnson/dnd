reviewer_findings:
  - id: RF-01
    subject: registry_only_table_identities
    disposition: approved_registry_additions_only
    proposed_ids: [tbl_adventure_generator, tbl_adventuring_site_name]
    detail: >-
      Both proposals are source-named tables at their defining loci, use the
      approved tbl_ prefix and matching kind, and are absent from the registry.
      The settled registry-only disposition applies: DEC-2026-0003 permits
      node approval without an edge, and inventing relationships merely to
      give the generators degree would be the defect.
  - id: RF-02
    subject: adventure_parent_identity
    disposition: rejected_candidate_confirmed
    detail: >-
      No Adventure, Campaign, Adventuring Site, or NPC identity exists. The
      page-106 defining locus already rejected Adventure and Campaign because
      no mechanic consumes those structural labels. Minting rule_adventure on
      pages 122–123 solely to parent these tables would reverse a sound earlier
      judgment from the wrong source locus.
  - id: RF-03
    subject: no_supported_relationships
    disposition: no_edge_approved
    detail: >-
      The opening instruction concerns combining phrase fragments and editing
      connecting words. Neither table states a check, value, duration,
      consequence, trigger, or parent rule. The epigraph is fiction. Zero edge
      decisions are complete rather than incomplete.
  - id: RF-04
    subject: exact_label_collision_measurement
    disposition: rejected_candidates_confirmed
    detail: >-
      The measured exact-label matches are class_wizard, class_thief, and
      class_priest. Each occurrence is a fictional character fragment in a
      generated premise, not a statement about the player class. No match
      supports a relationship.
  - id: RF-05
    subject: table_cell_terminology
    disposition: informational_nonblocking_correction
    detail: >-
      The two tables contain 40 data rows total and 120 generated-text cells
      when the d20 index cells are excluded. The GUR calls these "40 table
      cells," using the row count as the cell count. The three-match result and
      all substantive dispositions remain correct.
  - id: RF-06
    subject: page_attribution
    disposition: verified
    detail: >-
      The p122 and p123 markers are attached to headings, not buried in table
      rows. Page 122 contains the instruction and Adventure Generator Table;
      page 123 contains Adventuring Site Name Table and the epigraph.
completeness_statement: >-
  Printed pages 122 and 123, the instruction, both twenty-row tables, all 120
  generated-text cells, the epigraph, both node proposals, all three rejected
  candidate groups, and the page-106 parent-identity precedent were
  independently checked against Constitution 1.7, DEC-2026-0003, the registry,
  and canonical state. Both named tables are valid registry-only identities.
  The packet correctly contains no edges because the source states no legal
  relationship to or from either table.
