reviewer_findings:
  - id: RF-01
    subject: corrected_node_routing_authority
    disposition: approved
    detail: >-
      All twelve routing_basis values now exactly match REV r01-r01's
      row-local Constitution 1.8 section 2 correction. I independently
      confirmed the string is exact on all twelve nodes and the r02 validation
      report records reviewer_corrected_node_field: 12 with zero unapplied
      corrections. No identity, label, edge, or extraction judgment changed.
  - id: RF-02
    subject: source_named_creature_identities
    disposition: approved
    detail: >-
      All twelve labels match separate creature headings and defining stat
      blocks in the claimed source, five on p196, five on p197, and two on
      p198. `Ape, Snow` and `Bat, Giant` retain source commas in labels while
      IDs use valid snake_case transliteration. Constitution 1.8 section 2
      approves the monster_ prefix and kind. All twelve proposed IDs and exact
      labels remain absent from the current registry.
  - id: RF-03
    subject: zero_edge_locus_boundary
    disposition: approved_omission
    detail: >-
      Constitution 1.8 sections 2.4 and 2.5 exclude individual stat-block
      descriptions, properties, and numeric values from graph content. The
      twelve identities are located at their defining stat blocks, but no
      family grouping or reusable mechanic dependency is stated at this locus.
      The header-only edge component and zero-edge result are complete.
  - id: RF-04
    subject: named_ability_omissions
    disposition: approved_omission
    detail: >-
      The fifteen named ability entries were checked individually against
      their printed stat blocks: Statue, Thick Fur, Beguile, Magic Bolt, Death
      Bolt, Enervate, Fireblast, Float, Mithralskin, Void Step, Execute,
      Impervious, Rage, Ambush, and Petrify. These remain creature-local
      descriptions under Constitution 2.5. Rage, Execute, and Ambush explicitly
      name shared morale/surprise/hiding mechanics but still do not establish a
      shared-locus dependency; spell-like names/effects are not source
      references to canonical spell identities.
  - id: RF-05
    subject: scope_and_registry
    disposition: approved
    detail: >-
      The claimed source, GUR, GUP, validation report, node registry, and local
      canonical edge baseline match the reviewed checksums. All twelve IDs and
      exact labels are absent from the 437-row node registry, current canonical
      edges number 866, and no edge cites printed pages 196 through 198.
  - id: RF-06
    subject: validator_informational_authority_text
    disposition: non_blocking_observation
    detail: >-
      The validation report's informational node_addition_normal_workflow
      prose still says the ordinary workflow is “per DEC-2026-0003,” which the
      GUR correctly identifies as a nonexistent Shadowdark Decision. This is
      residual stock compiler wording, not a routing_basis field on the GUP:
      all twelve GUP values now cite Constitution 1.8 section 2, and the same
      report records twelve reviewer_corrected_node_field results and zero
      unapplied corrections. No further GUP edit is requested; the report
      wording is noted for the owner of the systemic compiler defect.
