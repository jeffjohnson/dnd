    subject: verified_node_routing_authority
    disposition: approved
    detail: >-
      All six proposed nodes in the GUP carry routing_basis: 'Constitution 1.8 section 2: approved prefix and kind, valid ID, no duplicate'. Prefix monster_ and kind monster are approved vocabulary under Constitution 1.8 section 2.
  - id: RF-02
    subject: source_named_monster_identities
    disposition: approved
    detail: >-
      The Primary Source Material on pages 239–240 contains six distinct creature headings and complete stat blocks: OCTOPUS, GIANT, OGRE, and ONI on page 239; ORC, ORC, CHIEFTAIN, and OTYUGH on page 240. Labels preserve exact source wording and punctuation; IDs drop commas where present and use standard snake_case transliteration with approved prefix monster_. All six IDs and labels are absent from the 591-row canonical node registry, which currently holds 160 monster identities.
  - id: RF-03
    subject: stat_block_locus_and_zero_edges
    disposition: approved
    detail: >-
      Constitution 1.8 sections 2.4 and 2.5 exclude individual creature stat-block descriptions, modifiers, and combat traits from graph content. Giant Octopus Grab (DC 15 STR or immobilized) and Ink (in place of attacks blinds in near 1d4 rounds); Ogre greatclub attack; Oni Shapeshift (in place of attacks turn into any humanoid) and spells (Fade, Hellfrost, Mist); Orc equipment annotations (chainmail + shield) and Rage (1/day immune to morale checks, +1d4 damage for 3 rounds); Orc, Chieftain equipment annotations (chainmail) and Rage; and Otyugh bite and Disease (DC 15 CON or infected, 1d6 HP loss per day) all operate on creature combat and action loci rather than global rulesets or general spell systems. Equipment parentheticals and standard stat fields (AC, HP, ATK, MV, S-D, LV) are similarly excluded under 2.4 and 2.5. All candidate rejections in the GUR are verified correct under Constitution 2.4/2.5. The zero-edge plan and empty edges component are complete.
  - id: RF-04
    subject: graph_invariant_4_orc_identity_distinction
    disposition: approved
    detail: >-
      Graph Invariant 4 requires strict differentiation between creature identity nodes and any corresponding ancestry, class, or language nodes. Verified that monster_orc and monster_orc_chieftain are strictly distinct from ancestry_half_orc (playable ancestry) and lang_orcish (language). Core Shadowdark contains no playable 'Orc' ancestry (only Half-Orc is playable). Creature stat blocks for Orc and Orc, Chieftain reside purely in Chapter 11 monster listings and carry the approved prefix monster_ and kind monster.
  - id: RF-05
    subject: page_attributions
    disposition: approved
    detail: >-
      Leading content on page 239 (Octopus, Giant, Ogre, and Oni) precedes the first explicit marker in this packet ({#p240}) and resolves structurally from the preceding packet boundary. One explicit page marker follows: {#p240} on Orc, which carries across Orc, Chieftain and Otyugh. The claimed two-page span (239–240) and all six defining loci agree with the markers and structural placement rules.
completeness_statement: >-
