reviewer_findings:
  - id: RF-01
    subject: wandering_monster_treasure_constraint
    disposition: approved
    refs: [M001]
    detail: >-
      Section TREASURE states that wandering monsters have only a 50% chance of carrying treasure.
      Asserting rule_encounter CONSTRAINS rule_treasure on aspect "treasure chance" with condition
      "for wandering monsters" is fully supported. The 50% probability is a numeric magnitude properly
      excluded under Graph Invariant 11. Authored polarity "governs" at polarity_basis "read" conforms
      to Constitution 1.8 section 5 and Graph Invariants 14-15.
  - id: RF-02
    subject: carousing_cross_reference
    disposition: approved
    refs: [M002]
    detail: >-
      Section FLEETING explicitly cites Carousing (pg. 92) as the mechanism through which PCs expend
      accumulated wealth for rapid XP advancement. Explicit page reference supports rule_treasure
      CROSS_REFERENCES rule_carousing with aspect "carousing reference". Deterministic neutral polarity
      at derived basis conforms to Constitution 1.8 section 6.1 and Invariant 14.
  - id: RF-03
    subject: unguarded_treasure_level_feed_and_near_duplicate_evaluation
    disposition: approved
    refs: [M003]
    detail: >-
      Section UNGUARDED specifies that unguarded treasure is randomly generated by rolling on the treasure
      table matching the discovering character's level. Asserting exp_level FEEDS_INTO rule_treasure on
      aspect "unguarded treasure" and condition "for unguarded treasure" is fully supported. Builder validation
      flagged a near_vs_canonical finding against canonical row 697 (exp_level FEEDS_INTO rule_treasure,
      aspect "expected value", SD p. 117). Evaluated near_vs_canonical relationship: canonical row 697 defines
      monetary benchmark scaling by party level from p. 117 ("HOW MUCH GOLD?"), whereas M003 defines random table
      selection for unguarded loot by discovering character level from p. 269 ("UNGUARDED"). M003 represents a
      distinct mechanical rule with distinct aspect and condition; approved as an independent addition.
  - id: RF-04
    subject: gear_capacity_treasure_constraint
    disposition: approved
    refs: [M004]
    detail: >-
      Section DEALING WITH LOOT specifies that treasure occupies gear slots (typically one gear slot,
      coins one slot per 100), subjecting loot to carrying capacity limits. Asserting rule_gear_capacity
      CONSTRAINS rule_treasure on aspect "slot occupancy" is fully supported. Numeric slot counts and coin
      thresholds are properly excluded under Graph Invariant 11. Authored polarity "governs" at polarity_basis
      "read" conforms to Constitution 1.8 section 5 and Graph Invariants 14-15.
  - id: RF-05
    subject: candidate_rejections_and_omissions
    disposition: approved_omission
    detail: >-
      Independently verified GUR candidate rejections: TREASURE opening prose is high-level summary of p. 117 rules;
      TREASURE TABLES refers to tables on pg. 270 (packet 120); DEALING WITH LOOT coin-slot clause is a reminder of p. 35
      and contains numeric magnitudes; DEALING WITH LOOT selling prose is advisory GM flavor; MAGIC ITEM VALUES contains
      dice expressions and monetary magnitudes (1d6x100, 2d6x100 gp) excluded by Graph Invariant 11; and UNGUARDED
      wizard example is a worked illustrative example. Zero candidate nodes were proposed and none are required.
      All omissions strictly adhere to Constitution 1.8 sections 2.4 and 2.5 and Graph Invariant 11.
  - id: RF-06
    subject: page_attribution
    disposition: approved
    detail: >-
      Primary Source Material opens directly with explicit marker {#p269} on TREASURE OVERVIEW. All six subsections
      reside on printed page 269. The Supporting Source Context includes repeated passages from p. 117 and p. 39,
      which are out of packet scope and properly excluded. Page 269 attribution for all 4 candidate edges is verified.
