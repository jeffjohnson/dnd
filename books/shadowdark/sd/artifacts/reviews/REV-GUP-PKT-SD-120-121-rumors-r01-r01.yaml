reviewer_findings:
  - id: RF-01
    subject: registry_only_table_identity
    disposition: approved_registry_addition_only
    proposed_id: tbl_rumors
    detail: >-
      Rumors Table is a source-named table at its defining locus, uses the
      approved tbl_ prefix and matching kind, and is absent from the registry.
      The settled PKT-SD-118-119 disposition applies: DEC-2026-0003 permits
      node approval without an edge, and inventing a relationship merely to
      give the table degree would be the defect.
  - id: RF-02
    subject: no_supported_relationships
    disposition: no_edge_approved
    detail: >-
      These pages contain only fifty fictional rumor prompts. They state no
      trigger, roll instruction, parent rule, check, duration, or mechanical
      consequence, and no canonical rule names the table. Zero edge decisions
      are therefore complete rather than incomplete.
  - id: RF-03
    subject: exact_label_collision_measurement
    disposition: informational_nonblocking_correction
    detail: >-
      Whole-word exact-label matching does produce eight canonical matches,
      but their composition is abil_mighty, ancestry_goblin, class_thief,
      class_wizard, lang_goblin, rule_dying, spell_bless, and spell_light.
      rule_wizards_and_thieves does not exactly match the singular phrase
      "Wizard Thief game." The GUR's conclusion remains correct: all eight are
      fictional mentions and support no relationship.
  - id: RF-04
    subject: abbreviated_deity_references
    disposition: rejected_candidates_confirmed
    detail: >-
      Shune and St. Terragnis genuinely refer to the canonical deities despite
      not matching their full labels, but a cult planning a coup and a church
      offering a reward are fiction about organizations, not mechanics of the
      deity identities. They correctly yield no edges.
  - id: RF-05
    subject: table_row_page_marker
    disposition: verified
    detail: >-
      The p121 marker appears in the last cell of the twenty-fourth result row
      and applies to that row as a unit. Direct counting confirms 50 results:
      23 on printed page 120 and 27 on page 121, matching the immediately prior
      two-page d100-table precedent.
  - id: RF-06
    subject: magnitude_and_prompt_rejections
    disposition: rejected_candidates_confirmed
    detail: >-
      Bounty value, creature count, and slumber duration are excluded
      magnitudes embedded in optional fiction. All remaining prompts likewise
      name scenes, people, places, or objects without asserting relationships
      between graph identities.
completeness_statement: >-
  Printed pages 120 and 121, all fifty rumor prompts, the page marker, the sole
  node proposal, all three rejected-candidate groups, and the prior
  registry-only disposition were independently checked against Constitution
  1.7, DEC-2026-0003, the registry, and canonical state. Rumors Table is a
  valid registry-only identity. The packet correctly contains no edges because
  the source states no legal relationship to or from the table.
