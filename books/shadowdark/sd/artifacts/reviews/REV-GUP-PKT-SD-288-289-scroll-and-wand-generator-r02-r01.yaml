reviewer_findings:
  - id: RF-01
    subject: scroll_and_wand_tables_node_additions
    disposition: approved
    detail: >-
      The nine proposed nodes tbl_scroll_feature (Scroll Feature Table, p. 288), tbl_wand_feature
      (Wand Feature Table, p. 288), tbl_scroll_and_wand_curses_benefits (Scroll and Wand Curses/Benefits Table,
      p. 288), tbl_scroll_and_wand_spell_tier (Scroll and Wand Spell Tier Table, p. 288), tbl_scroll_and_wand_tier_1_spell
      (Scroll and Wand Tier 1 Spell Table, p. 288), tbl_scroll_and_wand_tier_2_spell (Scroll and Wand Tier 2 Spell Table,
      p. 289), tbl_scroll_and_wand_tier_3_spell (Scroll and Wand Tier 3 Spell Table, p. 289),
      tbl_scroll_and_wand_tier_4_spell (Scroll and Wand Tier 4 Spell Table, p. 289), and tbl_scroll_and_wand_tier_5_spell
      (Scroll and Wand Tier 5 Spell Table, p. 289) are source-named from explicit headings in the Primary Source Material.
      Prefix tbl_ and kind tbl are approved vocabulary under Constitution 1.8 section 2. Proposed IDs and
      labels are confirmed absent from the canonical node registry (699 rows). Routing bases correctly cite
      Constitution 1.8 section 2. Reviewer approval granted for all nine node registrations.
  - id: RF-02
    subject: scroll_and_wand_resolution_edges
    disposition: approved
    refs: [M001, M002, M003, M004, M005, M006, M007, M008, M009]
    detail: >-
      Edges M001–M009 assert item_magic_item RESOLVED_BY each corresponding generator table: M001 targets
      tbl_scroll_feature with aspect "scroll feature selection" and condition "for scrolls"; M002 targets
      tbl_wand_feature with aspect "wand feature selection" and condition "for wands"; M003 targets
      tbl_scroll_and_wand_curses_benefits with aspect "curses and benefits routing" and condition "for scrolls and wands";
      M004 targets tbl_scroll_and_wand_spell_tier with aspect "spell tier selection" and condition "for scrolls and wands";
      and M005–M009 target tbl_scroll_and_wand_tier_1_spell through tbl_scroll_and_wand_tier_5_spell with aspect
      "spell selection" and condition "for scrolls and wands". Derived deterministic polarity "governs" conforms to
      Constitution 1.8 section 6.1 and Graph Invariant 14. All nine edges are held pending until node registrations
      are applied; approved for inclusion in the Approved bundle upon integration.
  - id: RF-03
    subject: table_entries_and_candidate_rejections
    disposition: approved_omission
    detail: >-
      Independently verified that all individual table rows, roll outcomes, and numeric magnitudes are properly
      excluded from edges under Graph Invariant 11 and Constitution 1.8 sections 2.4 and 2.5: Scroll Feature Table
      sensory/material descriptors (e.g., papyrus, bronze tube, sheepskin, vellum) and Wand Feature Table descriptors
      (e.g., runic bone, carved ash, faceted glass) are aesthetic roll outcomes; Scroll and Wand Curses/Benefits Table
      mappings (d100 item category roll bands 2-6 / 7-8 / 9-11 / 12 routing to magic armor/weapon/potion/item curses and benefits)
      are roll outcome routing bands; Scroll and Wand Spell Tier Table mappings (2-5 Tier 1, 6-7 Tier 2, 8-9 Tier 3,
      10-11 Tier 4, 12 Tier 5) are roll outcome dice bands; Scroll and Wand Tier 1–5 Spell Tables list spell roll outcomes
      whose canonical loci reside in spell lists (pp. 44–73) and do not mint duplicate node identities; and supporting
      context passages (Magic item attributes, pp. 282-283; Potions, pp. 286-287) are out of packet scope.
      All omissions confirmed correct.
  - id: RF-04
    subject: page_attributions
    disposition: approved
    detail: >-
      Primary Source Material opens on page 288 with explicit marker {#p288} on SCROLL AND WAND GENERATOR, carrying
      through SCROLL FEATURE TABLE, WAND FEATURE TABLE, SCROLL AND WAND CURSES/BENEFITS TABLE, SCROLL AND WAND SPELL TIER TABLE,
      and SCROLL AND WAND TIER 1 SPELL TABLE. Explicit marker {#p289} carries through SCROLL AND WAND TIER 2 SPELL TABLE,
      SCROLL AND WAND TIER 3 SPELL TABLE, SCROLL AND WAND TIER 4 SPELL TABLE, and SCROLL AND WAND TIER 5 SPELL TABLE.
      Page attributions on M001–M005 (p. 288) and M006–M009 (p. 289) strictly conform to placement rules.
