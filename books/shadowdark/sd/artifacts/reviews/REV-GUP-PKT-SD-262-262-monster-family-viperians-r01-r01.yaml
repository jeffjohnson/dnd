  - id: RF-04
    subject: graph_invariant_4_creature_ancestry_language_and_class_distinction
    disposition: approved
    detail: >-
      Graph Invariant 4 requires strict differentiation between creature identity nodes and any corresponding ancestry, class, or language nodes. Evaluated proposed node monster_viperian_wizard against canonical class_wizard. Labels do not determine identity; the distinct label ("Viperian Wizard" vs "Wizard"), kind (monster vs class), and approved prefix (monster_ vs class_) preserve ontological integrity. None of the proposed creature identities conflate with playable ancestries, classes, or languages.
