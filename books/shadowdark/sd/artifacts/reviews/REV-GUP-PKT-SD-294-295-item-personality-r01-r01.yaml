    disposition: approved
    refs: [M001, M002, M003]
    detail: >-
      Edges M001–M003 assert item_magic_item RESOLVED_BY each corresponding conscious item personality table:
      M001 targets tbl_item_virtue with aspect "item virtue selection" and condition "for conscious magic items";
      M002 targets tbl_item_flaw with aspect "item flaw selection" and condition "for conscious magic items";
      and M003 targets tbl_item_personality_trait with aspect "personality trait selection" and condition
      "for conscious magic items". Derived deterministic polarity "governs" conforms to Constitution 1.8
      section 6.1 and Graph Invariant 14. All three edges are held pending until node registrations are applied;
      approved for inclusion in the Approved bundle upon integration.
  - id: RF-03
    subject: table_entries_and_candidate_rejections
    disposition: approved_omission
    detail: >-
      Independently verified that alignment determination prose (GM discretion, taxonomy exclusion under
      Constitution 1.8 §§2.2/2.4), contested Charisma check prose ((+2) bonus numeric magnitude under Invariant 11),
      Item Virtue Table entries (dice bands, creature categories, narrative boons under Invariant 11), Item Flaw
      Table entries (dice bands, roleplay quirks under Invariant 11), Item Personality Trait Table entries (roleplay
