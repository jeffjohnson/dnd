reviewer_findings:
  - id: RF-01
    subject: wager_resolution_alternative
    disposition: approved
    ref: M001
    detail: >-
      The source presents Wizards and Thieves for resolving a wager with a more
      complex system than a stat check. The minigame and rule_check are thus
      substitutable resolution procedures, exactly matching ALTERNATIVE_TO.
  - id: RF-02
    subject: coin_mechanics
    disposition: approved
    refs: [M002, M003]
    detail: >-
      Each player contributes coin to the pot, so the game consumes a finite
      resource. A player without coins leaves the game, so item_coin also
      constrains continued participation with governs/read polarity. These are
      distinct source-backed relationships.
  - id: RF-03
    subject: stakes_tables
    disposition: approved
    refs: [M004, M005, M006, M007]
    detail: >-
      The four named d4 tables resolve what the game is played for at their
      respective stakes tiers. Registering each table and connecting the game
      through RESOLVED_BY preserves the source's actual resolution structure
      without minting identities for each narrative result.
  - id: RF-04
    subject: page_marker_boundary
    disposition: approved
    detail: >-
      The non-heading page-95 marker belongs to the paragraph containing it.
      M001 and M002 correctly cite page 94; the game-ending constraint and all
      four stakes-table rows correctly cite page 95.
  - id: RF-05
    subject: low_yield_scope
    disposition: informational_nonblocking
    detail: >-
      Dice cancellation, active-player rotation, pot transfers, and winner
      determination are internal minigame procedure whose distinctions are
      numeric or lack reusable graph identities. The seven submitted rows
      capture the externally queryable mechanics without inflating the graph.
  - id: RF-06
    subject: deferred_carousing_cross_reference
    disposition: informational_out_of_scope
    detail: >-
      The page-91 Carousing pointer to this minigame belongs to the already
      integrated PKT-SD-091-093 lineage and requires a separately scoped
      successor. Its absence does not make any row in this packet false.
  - id: RF-07
    subject: gur_registry_snapshot
    disposition: informational
    detail: >-
      The GUR says 275 registry rows; the independently measured current
      registry contains 299. None of the five proposed identities is canonical,
      so the stale count changes no operation.
completeness_statement: >-
  All seven rows and five proposed registrations were independently checked
  against pages 94 and 95, Constitution 1.7, the current registry, and the
  canonical neighborhood. The wager alternative, coin consumption and
  participation constraint, and four stakes-table resolution rows are all
  source-supported and collision-free. The unusual page boundary is correct,
  and no reusable mechanical relationship is omitted from this deliberately
  low-yield minigame packet. The packet is approval-ready.
