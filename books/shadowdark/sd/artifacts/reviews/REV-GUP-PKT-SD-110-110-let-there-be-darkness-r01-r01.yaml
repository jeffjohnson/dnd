      light source," and its first bullet supplies the individual direct
      objects "torches and lanterns." In that grammatical construction the
      two named items are explicit instances of the light-source subject, not
      merely nearby items inferred from light mechanics. DEC-2026-0104's exact
      bounded form therefore applies to each canonical item.
