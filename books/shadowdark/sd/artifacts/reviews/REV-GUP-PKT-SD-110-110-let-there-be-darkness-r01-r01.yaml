reviewer_findings:
  - id: RF-01
    subject: light_source_classification_precedent
    disposition: relationship_required
    detail: >-
      Advice prose is not automatically classification evidence. Here, however,
      the list's governing subject is the light source and the first bullet
      names Torch and Lantern as the individual things to imperil. That clears
      DEC-2026-0104's source-explicit bar without inferring membership from
      duration, extinguishing, or other mechanics. The ruling is limited to
      these two items and does not classify Campfire or create a generic item
      taxonomy.
  - id: RF-02
    subject: light_mishap_table_edges
    disposition: approved
    refs: [M001, M002, M003, M004, M005, M006]
    detail: >-
      The named table resolves mishaps for a Light Source; Dexterity, Check,
      and Difficulty Class supply its avoidance procedure; the table can
      extinguish a Light Source and its Fire result inflicts Damage. These six
      relationships accurately preserve the reusable mechanics while excluding
      numeric magnitudes.
  - id: RF-03
    subject: light_mishap_table_identity
    disposition: approved
    proposed_id: tbl_light_mishaps
    detail: >-
      Light Mishaps Table is a source-named reusable resolution table. Its tbl_
      identity and label are collision-free, mechanically complete, and needed
      by all six approved relationships.
  - id: RF-04
    subject: remaining_attack_the_light_advice
    disposition: rejected_candidates_confirmed
    detail: >-
      The Dispel Magic bullet restates its canonical premature-duration rule.
      The enemy, environment, and dropping bullets are suggestions or hedged
      possibilities without the identities or definite mechanics needed for
      additional rows. The opening time-pressure statement is a design goal,
      not an input to a named mechanic.
  - id: RF-05
    subject: table_outcomes_and_trigger
    disposition: informational_nonblocking
    detail: >-
      Dud, Fire, Air, Water, Earth, and Spark are outcome labels whose reusable
      mechanics are already captured by the table-level rows; separate nodes
      would preserve only flavor plus excluded magnitudes. The source supplies
      no definite trigger for rolling the table, so no trigger row is owed.
completeness_statement: >-
  Page 110, all six submitted rows, the proposed table registration, all five
  rejected-candidate groups, and IDQ-01 were independently checked against
  Constitution 1.7, DEC-2026-0104, its terminal implementation Review, the
  current registry, and the canonical neighborhood. The six table rows and
  registration are correct. The packet is incomplete only because its explicit
  Torch and Lantern identifications require two bounded CLASSIFIED_AS rows.
