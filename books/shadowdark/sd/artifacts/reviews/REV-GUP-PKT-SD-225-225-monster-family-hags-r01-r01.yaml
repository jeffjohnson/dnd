      Constitution 1.8 sections 2.4 and 2.5 exclude individual creature stat-block descriptions, modifiers, and combat traits from graph content. Shapechange ("Instantly change to look like any other humanoid", shared across all three hags) represents a creature action locus rather than a general polymorph or shapechanging rule system. Night Hag Blind (DC 15 CHA check, 1d4 days blinded) and Sea Hag Terrify (first sight DC 15 CHA check, 1d4 rounds attack disadvantage) operate on creature combat loci. Weald Hag Drink Pain (near range, DC 12 CHA check, 2d4 damage dealt and HP regained) operates on creature attack locus. All eight candidate rejections in the GUR are verified correct under Constitution 2.4/2.5. The zero-edge plan and empty edges component are complete.
  - id: RF-04
    subject: family_lore_and_origins_excluded
    disposition: approved
    detail: >-
      The two-paragraph family introduction on page 225 describes hags as sinister crones from the Unseelie realms and provides habitat descriptions (sea caves, places of depravity, deep boggy woods). Under Constitution 1.8 section 2.4, narrative worldbuilding lore is excluded absent an explicit Decision.
