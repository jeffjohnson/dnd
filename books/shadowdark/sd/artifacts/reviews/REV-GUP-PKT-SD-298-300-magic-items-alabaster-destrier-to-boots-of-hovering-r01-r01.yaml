  - id: RF-02
    subject: magic_item_edges
    disposition: approved
    refs: [M001, M002, M003, M004, M005, M006, M007, M008, M009, M010, M011, M012, M013, M014, M015, M016, M017, M018, M019, M020, M021]
    detail: >-
      Edges M001–M021 assert mechanical relations for the 12 magic items: M001 asserts item_alabaster_destrier
      TRIGGERS monster_pegasus (aspect: "pegasus transformation", condition: "when command word spoken", polarity: neutral);
      M002 asserts item_amulet_of_secrecy CONSTRAINS spell_scrying (aspect: "magical detection", condition: "while wearing amulet", polarity: governs);
      M003 asserts item_amulet_of_vitality MODIFIES abil_constitution (aspect: "stat replacement", condition: "while wearing amulet", polarity: improves);
      M004 asserts item_armor_of_saint_terragnis MODIFIES cbt_armor_class (aspect: "armor bonus", condition: "while wearing armor", polarity: improves);
      M005 asserts deity_saint_terragnis GATES item_armor_of_saint_terragnis (aspect: "armor eligibility", condition: "to wear armor", polarity: enables);
      M006 asserts alignment_lawful GATES item_armor_of_saint_terragnis (aspect: "armor eligibility", condition: "to wear armor", polarity: enables);
      M007 asserts item_armor_of_saint_terragnis TRIGGERS monster_archangel (aspect: "avatar summoning", condition: "when summoned", polarity: neutral);
      M008 asserts item_armor_of_the_oni MODIFIES cbt_armor_class (aspect: "armor bonus", condition: "while wearing armor", polarity: improves);
      M009 asserts item_armor_of_the_oni MODIFIES cbt_damage_roll (aspect: "melee damage bonus", condition: "for melee attacks while wearing armor", polarity: improves);
      M010 asserts item_armor_of_the_oni GATES lang_diabolic (aspect: "language comprehension", condition: "while wearing armor", polarity: enables);
      M011 asserts item_armor_of_the_oni CONSTRAINS cbt_attack_roll (aspect: "attack disadvantage", condition: "against demons while wearing armor", polarity: governs);
      M012 asserts item_armor_of_the_oni CONSTRAINS rule_spellcasting_check (aspect: "spellcasting disadvantage", condition: "against demons while wearing armor", polarity: governs);
      M013 asserts item_bag_of_badgers TRIGGERS monster_badger (aspect: "badger extraction", condition: "when bag reached into", polarity: neutral);
      M014 asserts item_bag_of_devouring CONSUMES item_gear (aspect: "item consumption", condition: "for items placed inside bag", polarity: neutral);
      M015 asserts item_bag_of_holding MODIFIES rule_gear_capacity (aspect: "gear capacity expansion", condition: "for items stored in bag", polarity: improves);
      M016 asserts item_bead_of_force TRIGGERS spell_resilient_sphere (aspect: "spell entrapment", condition: "on a hit", polarity: neutral);
      M017 asserts item_blade_of_vengeance MODIFIES cbt_attack_roll (aspect: "attack bonus", condition: "when attacking with this weapon", polarity: improves);
      M018 asserts item_blade_of_vengeance TRIGGERS spell_turn_undead (aspect: "turn undead casting", condition: "when cast from weapon", polarity: neutral);
      M019 asserts item_blade_of_vengeance CONSTRAINS cbt_attack_roll (aspect: "attack advantage", condition: "against undead creatures", polarity: governs);
      M020 asserts item_boots_of_dancing MODIFIES abil_dexterity (aspect: "removal difficulty", condition: "to remove boots", polarity: worsens);
      and M021 asserts item_boots_of_hovering MODIFIES ex_movement (aspect: "insubstantial movement", condition: "on insubstantial surfaces", polarity: improves).
      All edge types, directions, conditions, and polarities strictly conform to Constitution 1.8 section 6.1 and Graph Invariant 14.
      Edges are held pending until node registrations are applied; approved for inclusion in the Approved bundle upon integration.
  - id: RF-03
    subject: narrative_and_candidate_rejections
    disposition: approved_omission
    detail: >-
      Independently verified that all narrative lore, flavour text, DC numbers, dice rolls, durations, and out-of-scope passages
      are properly excluded from edges under Graph Invariant 11 and Constitution 1.8 sections 2.4 and 2.5:
      Iraga narrative quote (p. 298) is lore; Armor of Saint Terragnis spell DC 18 (p. 298) contains numeric difficulty prohibited under Invariant 11;
      Bag of Devouring destruction timeframe (1d6 rounds) contains dice expressions and time duration prohibited under Invariant 11;
      Bag of Holding gear slot capacity limit (10 gear slots) contains numeric slot count prohibited under Invariant 11;
      Blade of Vengeance Witch-Kings personality lore contains non-mechanical narrative history;
      Boots of Dancing removal DC 15 contains numeric difficulty prohibited under Invariant 11;
      Boots of Hovering duration (1 turn) contains numeric duration prohibited under Invariant 11;
      and supporting context passages (pp. 282, 34–37, 86, 88) are out of packet scope.
      All omissions confirmed correct.
  - id: RF-04
    subject: page_attributions
    disposition: approved
    detail: >-
      Primary Source Material spans pages 298–300: explicit marker {#p298} opens ALABASTER DESTRIER, AMULET OF SECRECY,
      AMULET OF VITALITY, and ARMOR OF SAINT TERRAGNIS; explicit marker {#p299} covers ARMOR OF THE ONI, BAG OF BADGERS,
      BAG OF DEVOURING, BAG OF HOLDING, and BEAD OF FORCE; explicit marker {#p300} covers BLADE OF VENGEANCE,
      BOOTS OF DANCING, and BOOTS OF HOVERING. Page attributions on M001–M007 (p. 298), M008–M016 (p. 299), and
