reviewer_findings:
  - id: RF-01
    subject: encounter_table_resolver
    disposition: approved
    refs: [M001]
    detail: >-
      The source-named Temple District Encounters Table is a further resolver
      of canonical Encounter on the distinct temple-selection aspect. The
      heading and first twenty-three data rows begin on printed page 180.
  - id: RF-02
    subject: rival_crawlers_result
    disposition: approved
    refs: [M002]
    detail: >-
      The row keyed 74-75 explicitly names a rival group of crawlers. It
      invokes the canonical Rival Crawlers mechanic as the table's encounter
      result, supporting FEEDS_INTO on printed page 181.
  - id: RF-03
    subject: source_omissions
    disposition: approved_omission
    detail: >-
      The remaining spectacles, creatures, deity mentions, augury, blessing,
      holy-water effect, offered coin, trapdoor and repeated encounter
      instruction do not support another current graph relationship. The
      source neither names the spell identities as such nor supplies missing
      effect or category endpoints, and Constitution sections 2.2 and 2.4 do
      not permit deity-group membership or taxonomy edges.
  - id: RF-04
    subject: table_registration_and_scope
    disposition: approved
    detail: >-
      Temple District Encounters Table is source-named, fresh, correctly
      prefixed and supports both submitted rows. The ID and label are absent
      from the current registry and no canonical edge uses the proposed
      endpoint.
  - id: RF-05
    subject: authority_metadata
    disposition: informational_nonblocking
    detail: >-
      Builder validation text still names stale DEC-2026-0003, which is not a
      Shadowdark Decision. This Review applies current Shadowdark Constitution
      section 2 and the common Reviewer authority directly; no submitted row
      depends on that citation.
