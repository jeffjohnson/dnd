reviewer_findings:
  - id: RF-01
    subject: creature_identity_registrations
    disposition: approved
    detail: >-
      The ABOLETH and ACOLYTE headings each name a distinct creature and each
      has its own defining stat block on printed page 194. Constitution 2.5
      excludes each creature's individual values and descriptions from graph
      content; it does not erase the source-defined creature identity those
      values describe. The existing monster_ prefix and kind cover these
      identities, and current ID and label collision checks are clear. The
      two isolated registrations are correctly approved without inventing
      edges or storing stat-block values.
  - id: RF-02
    subject: declined_stat_block_abilities_and_values
    disposition: approved
    detail: >-
      Curse, Enslave, Telepathic, and Healing Touch are each stated only under
      one creature's stat block. No shared dependency or canonical ability
      identity is stated; the WIS Spell tag does not make Healing Touch a
      canonical spell. The individual printed fields likewise remain values,
      not dependencies. The GUR's seven rejected-candidate groups consistently
      apply constitution 2.5 and keep appended material out of scope.
  - id: RF-03
    subject: extraction_count_provenance
    disposition: approved
    detail: >-
      The GUR prose reports 432 node-registry rows and 867 canonical edges.
      Independent CSV DictReader counts of the current nodes.csv and
      edges_master.csv are 431 and 866 data rows respectively. Each reported
      total is one higher, consistent with a header-counting slip. This is an
      informational measurement discrepancy only: the GUP's compiler report
      is clean and the current registry identity checks were independently
      verified against live files; no decision here relies on the quoted
      counts.
  - id: RF-04
    subject: empty_edge_component_and_completeness
    disposition: approved
    detail: >-
      The packet's full printed page contains the two stat blocks and their
      described abilities, but no assertion connecting graph mechanics that
      survives the constitution boundary. The GUP's edge CSV is header-only,
      with zero additions or pending rows, so the Approved bundle must carry
      that exact zero-row component while registering the two approved nodes.
completeness_statement: >-
  Independently read the complete in-scope page 194 at the recorded source
  checksum, verified the page marker and both creature headings/stat blocks,
  checked the two proposed identities and their collision neighborhood, and
  reviewed all seven rejected-candidate groups plus OBS-01 through OBS-04.
  The zero-edge result and isolated node registrations are deliberate and
  complete. The GUR's off-by-one registry/edge totals are recorded as
  informational provenance, not as a GUP correction or a blocker.
