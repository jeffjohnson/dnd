reviewer_findings:
  - id: RF-01
    subject: encounter_table_resolver
    disposition: approved
    refs: [M001]
    detail: >-
      The source-named Jungle Encounters Table is a further resolver of
      canonical Encounter on the distinct jungle-selection aspect.
  - id: RF-02
    subject: encounter_trap_mechanisms
    disposition: approved_precedent
    refs: [M002]
    detail: >-
      M002 is supported by both the expressly named net traps and the statue
      mouth that shoots javelins when encountered. The latter states an
      operating trap mechanism and therefore satisfies the mechanism test
      settled for Desert and applied in Forest. Both cells support the same
      table-to-Traps assertion key, so one row is complete. Reeds merely
      concealing a snake pit state concealment but no operating mechanism and
      correctly do not create another relationship.
  - id: RF-03
    subject: rival_crawlers_reach
    disposition: approved
    refs: [M003]
    detail: >-
      A rival crawling party explicitly invokes the canonical Rival Crawlers
      procedure and supports the table-to-procedure reach. The second crawler
      mention does not create a duplicate row because both mentions would
      share the same assertion key.
  - id: RF-04
    subject: sleep_flower_boundary
    disposition: approved_omission
    detail: >-
      Perfumed flowers lulling creatures into sleep name no caster, named
      spell or check. They therefore do not support a causal row to
      spell_sleep and are materially different from the page-158 ward that
      explicitly casts Web.
  - id: RF-05
    subject: scan_measurement_disclosures
    disposition: informational_nonblocking
    detail: >-
      A fuller stemmer also finds Falling through falls and Heal through
      healing, producing fifteen rather than thirteen candidate cells. Neither
      supplies a missing relationship: an object falling is not the character
      Falling rule, and offered healing states no accepted or resolved effect.
      The scan variance changes no submitted or rejected decision.
  - id: RF-06
    subject: table_registration_and_omissions
    disposition: approved
    detail: >-
      Jungle Encounters Table is source-named, fresh, correctly prefixed and
      supports all three rows. Creature identities, durations, magnitudes,
      offered services, scene descriptions and effects lacking a supported
      canonical endpoint were correctly withheld.
  - id: RF-07
    subject: authority_metadata
    disposition: informational_nonblocking
    detail: >-
      Builder validation text still names stale DEC-2026-0003. This Review
      applies current Shadowdark Constitution section 2 and common Reviewer
      authority directly; no submitted row depends on that citation.
