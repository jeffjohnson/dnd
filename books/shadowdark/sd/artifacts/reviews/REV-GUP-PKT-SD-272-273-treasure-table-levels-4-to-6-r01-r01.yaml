    detail: >-
      The proposed node tbl_treasure_4_6 (Treasure 4-6 Table) is source-named from heading TREASURE TABLE 4-6
      on printed pages 272–273. Prefix tbl_ and kind tbl are approved vocabulary under Constitution 1.8 section 2.
      Proposed ID and label are confirmed absent from the canonical node registry (675 rows). Routing basis
      correctly cites Constitution 1.8 section 2. Reviewer approval granted.
  - id: RF-02
    subject: treasure_table_resolution_edge
    disposition: approved
    refs: [M001]
    detail: >-
      Edge M001 asserts rule_treasure RESOLVED_BY tbl_treasure_4_6 with aspect "treasure selection". The d100
      table determines random treasure selection for 4th- to 6th-level monsters and unguarded finds. RESOLVED_BY
      correctly captures the relationship between the core rule and its resolving table. Derived deterministic
      polarity "governs" conforms to Constitution 1.8 section 6.1 and Graph Invariant 14. Edge held pending until
      node registration is applied; approved for inclusion in the Approved bundle.
  - id: RF-03
    subject: table_entries_and_candidate_rejections
    disposition: approved_omission
    detail: >-
      Independently verified that all 50 table entries in the d100 table are properly excluded from individual
      edges under Graph Invariant 11 and Constitution 1.8 sections 2.4 and 2.5: monetary values (cp, sp, gp) are
      numeric magnitudes; mundane equipment items are roll outcomes whose definitions reside on pages 33–37; art
      curios (such as statuette of Memnon, holy symbol of Ramlaat, incense repulsive to undead) are decorative flavor;
      craftsmanship mentions (elf woman painting, goblin doll, dwarven chainmail) are aesthetic flavor; minor and
      moderate magic items (spell scrolls, Potions of Healing/Flying/Giant Strength, Ring of Feather Falling,
      Kytherian Cog, +2 magic armor/weapon) have defining loci in later magic item chapters (pp. 276+); and potion
      healing dice expressions (2d6 hit points) are numeric magnitudes. All omissions confirmed correct.
  - id: RF-04
    subject: page_attributions
    disposition: approved
    detail: >-
      Primary Source Material opens on page 272 with explicit marker {#p272} on TREASURE 4-6, carrying through entry
      44-45. Explicit inline marker {#p273} on entry 46-47 attributes the remainder of the table (entries 46-47 through
      00) to printed page 273. Page 272 attribution on M001 accurately reflects the table heading and locus origin.
