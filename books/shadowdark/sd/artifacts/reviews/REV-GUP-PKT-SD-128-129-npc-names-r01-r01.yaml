reviewer_findings:
  - id: RF-01
    subject: registry_only_name_tables
    disposition: approved_registry_additions_only
    proposed_ids:
      - tbl_npc_names_by_ancestry
      - tbl_npc_names_by_syllable
      - tbl_npc_name_identifier
    detail: >-
      All three proposals are source-named tables at their defining loci, use
      the approved tbl_ prefix and matching kind, carry complete labels and
      rationales, and are absent from the registry. The settled 118–119
      disposition applies: DEC-2026-0003 permits a valid identity to be
      registered without an edge, and inventing a relationship merely to give
      the table degree would be the defect.
  - id: RF-02
    subject: ancestry_axis_indexing
    disposition: no_edge_approved
    detail: >-
      The ancestry columns genuinely index the first table, but no mechanical
      identity independently reaches that table. All five canonical sys_-to-
      table FEEDS_INTO rows were independently measured and every target is
      also reached by RESOLVED_BY from a mechanical procedure. An ancestry
      indexing row here would be the sole mechanical-looking attachment for a
      table of suggested names, even though no rule consumes a name. Rejecting
      that row is consistent with the page-38 Character Names disposition.
  - id: RF-03
    subject: character_names_cross_reference
    disposition: rejected_candidate_confirmed
    detail: >-
      The explicit page-38 cross-reference cannot become a CROSS_REFERENCES
      row because no Character Names table identity exists. The original
      page-38 core-test conclusion remains sound: names are non-mechanical.
      Its orphan-avoidance rationale has since been superseded by the approved
      registry-only-table practice, so a future bounded successor for
      PKT-SD-038-038 may register that table and then reconsider this pointer;
      this packet cannot create the missing target outside its source scope.
  - id: RF-04
    subject: name_cells_and_usage_guidance
    disposition: rejected_candidates_confirmed
    detail: >-
      The 216 names, syllable fragments, and epithets are descriptive content,
      not reusable mechanics. The instruction to use some or all syllables is
      guidance for composing prose, not a graph relationship. No candidate
      states a check, value, trigger, permission, or mechanical consequence.
  - id: RF-05
    subject: source_structure_and_page_attribution
    disposition: verified
    detail: >-
      Direct inspection confirms three named tables, 44 data rows, and 216
      name cells. Both page markers are on headings: the ancestry table and
      two guidance sentences are page 128, while the syllable and identifier
      tables are page 129.
  - id: RF-06
    subject: gur_template_artifact
    disposition: informational_nonblocking
    detail: >-
      The GUR contains the literal placeholder "All %d axis-into-table
      FEEDS_INTO rows." Independent canonical measurement gives five, and all
      five satisfy the stated mechanical-anchor distinction. The formatting
      artifact changes no proposal, relationship, or disposition.
completeness_statement: >-
