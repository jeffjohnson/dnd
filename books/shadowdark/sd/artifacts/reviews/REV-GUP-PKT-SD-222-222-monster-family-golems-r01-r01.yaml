    detail: >-
      The Primary Source Material on page 222 contains four distinct creature headings and complete stat blocks: GOLEM, CLAY; GOLEM, FLESH; GOLEM, IRON; and GOLEM, STONE. Labels preserve exact source wording and comma placement; IDs drop commas and use standard snake_case transliteration with approved prefix monster_. All four IDs and labels are absent from the 541-row canonical node registry, which currently holds 110 monster identities.
  - id: RF-03
    subject: stat_block_locus_and_zero_edges
    disposition: approved
    detail: >-
      Constitution 1.8 sections 2.4 and 2.5 exclude individual creature stat-block descriptions, modifiers, and combat traits from graph content. Golem defensive traits (damage immunities and elemental healing by acid/electricity/fire) describe creature combat defense on creature locus. Curse (Clay Golem healing restriction), Berserk (Flesh Golem low-HP attack and damage escalation), Poison Breath (Iron Golem DC 15 CON area attack), and Slow (Stone Golem DC 15 CON speed halving) describe creature combat actions and magnitudes, excluded under Constitution 2.5. All nine candidate rejections in the GUR are verified correct under Constitution 2.4/2.5. The zero-edge plan and empty edges component are complete.
  - id: RF-04
    subject: family_lore_and_crafting_notes_excluded
    disposition: approved
    detail: >-
      The two-paragraph family introduction on page 222 describes golems as constructed beings imbued with rudimentary sentience and notes that making a golem requires rare, expensive materials and complicated rituals. Under Constitution 1.8 section 2.4, narrative lore and non-mechanical worldbuilding descriptions are excluded absent an explicit Decision.
  - id: RF-05
    subject: page_attribution
    disposition: approved
    detail: >-
