reviewer_findings:
  - id: RF-01
    subject: protection_from_evil_alignment_shape
    disposition: approved
    ref: M012
    detail: >-
      Chaotic alignment bounds which beings are affected by Protection from
      Evil, so alignment_chaotic CONSTRAINS the spell and governs its
      applicability. Rebuke Unholy is different: the caster's alignment is an
      input selecting between target sets, so M018 through M020 correctly use
      FEEDS_INTO. A single alignment edge type across both mechanics would erase
      that source-level distinction.
  - id: RF-02
    subject: check_and_threshold_pairs
    disposition: approved
    refs: [M013, M014, M021, M022, M037, M038]
    detail: >-
      Each resisting or detecting check and its spellcasting-check threshold
      are independently load-bearing. The CONSTRAINS plus FEEDS_INTO pairs
      correctly apply the established Illusion settlement.
  - id: RF-03
    subject: rebuke_alignment_identity_grain
    disposition: approved
    refs: [M018, M019, M020]
    detail: >-
      The source separately states the lawful, neutral, and chaotic caster
      cases. Three canonical alignment identities preserve which value selects
      targets; one sys_alignment row would collapse those distinctions.
  - id: RF-04
    subject: prophecy_penance_history
    disposition: informational_correction
    ref: M001
    detail: >-
      M001 is correct, but GUR OBS-06 and its completeness statement are
      factually wrong in calling this rule_penance's first spell use and first
      inbound use. Canonical spell_dominion already has the same
      rule_penance GATES spell relationship with aspect recasting, and
      rule_penance has other inbound edges. This historical prose error does
      not alter M001 or require a row correction.
completeness_statement: >-
  All 47 submitted rows and ten proposed spell registrations were independently
  checked against pages 68 through 70, Constitution 1.7, the active registry,
  and the canonical neighborhood. Every submitted row is correct as written,
  including the distinct alignment semantics and the check/threshold pairs.
  Approval is withheld because the packet omits the explicit, source-backed
  Rebuke Unholy destruction outcome. A successor adding that one relationship
  while preserving all submitted material will be complete.
