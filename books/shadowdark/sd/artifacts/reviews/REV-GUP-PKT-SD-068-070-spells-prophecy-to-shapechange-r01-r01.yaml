blocking_findings:
  - id: missing_rebuke_unholy_destruction_outcome
    severity: blocking
    detail: >-
      REBUKE UNHOLY explicitly destroys an eligible creature that fails its
      resistance check by the stated margin. The GUP records the resistance,
      threshold input, and level bound but no edge for the resulting lethal
      outcome. rule_death is canonical and already receives TRIGGERS edges from
      lethal spells including Cloudkill and Disintegrate, so no new identity or
      architectural choice is required. Without this row, a change to the
      spell's destruction outcome would not reach rule_death in impact analysis.
    source_citation:
      path: books/shadowdark/sd/packets/claimed/PKT-SD-068-070-spells-prophecy-to-shapechange/source.md
      page: '69'
      section: REBUKE UNHOLY
      evidence: >-
        An affected creature is destroyed when it fails the rebuke check by the
        stated margin and is within the caster-level bound.
