reviewer_findings:
  - id: RF-01
    subject: party_uniformity_endpoint
    disposition: approved
    refs: [M013]
    detail: >-
      The unhedged source rule that all rival crawlers share one alignment is
      mechanical and belongs in the graph. rule_rival_crawlers is the named
      procedure that generates the party, and CONSTRAINS sys_alignment with
      aspect party uniformity accurately limits alignment selection inside
      that procedure. It does not constrain the global Alignment axis. A
      separate party or member identity would add an unsupported participant
      abstraction and is not required for this bounded relationship.
  - id: RF-02
    subject: generator_and_axis_rows
    disposition: approved
    refs: [M001, M002, M003, M009, M010, M011, M012]
    detail: >-
      The Ancestry, Class, and Alignment tables resolve corresponding parts of
      Rival Crawlers. The axis-level rows preserve the established graph grain
      without redundantly encoding thirteen already-canonical result members.
      Alignment also feeds the Signature Tactics table because its columns are
      explicitly indexed by alignment. The FEEDS_INTO and RESOLVED_BY
      directions describe distinct input and output roles and do not collide.
  - id: RF-03
    subject: descriptive_generator_tables
    disposition: approved
    refs: [M004, M005, M006, M007, M008]
    detail: >-
      Renown, Secret, Wealth, Party Name, and Signature Tactics are source-named
      tables that resolve parts of Rival Crawlers. Their individual results are
      descriptive or magnitude-only and correctly remain unregistered while
      the table identities and generator relationships are retained.
  - id: RF-04
    subject: registry_additions
    disposition: approved
    proposed_ids:
      - rule_rival_crawlers
      - tbl_rival_crawler_ancestry
      - tbl_rival_crawler_class
