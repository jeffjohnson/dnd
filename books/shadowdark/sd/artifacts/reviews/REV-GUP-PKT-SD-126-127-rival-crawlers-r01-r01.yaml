      - tbl_rival_crawler_secret
      - tbl_rival_crawler_wealth
      - tbl_rival_crawler_party_name
      - tbl_rival_crawler_signature_tactics
    detail: >-
      All nine proposals are source-named identities at their defining locus,
      use approved prefixes and matching kinds, carry complete labels and
      rationales, and are absent from the current registry. Each supports at
      least one approved relationship.
  - id: RF-05
    subject: status_and_precedent
    disposition: approved_core
    refs: [M001, M002, M003, M004, M005, M006, M007, M008, M009, M010, M011, M012, M013]
    detail: >-
      Pages 126–127 present Rival Crawlers and all eight generator tables as
      ordinary GM procedures without offering a choose-versus-roll alternative
      or optional-mode framing. Core status is consistent with the settled NPC
      generator ruling for pages 124–125; the optional page-40 character
      generation context does not transfer its source-specific status here.
  - id: RF-06
    subject: source_structure_count
    disposition: informational_correction
    detail: >-
      The source contains eight tables and 51 data rows, not the 52 stated in
      the GUR units note: 6 + 4 + 3 + 4 + 6 + 4 + 20 + 4 = 51. This descriptive
      count does not alter any proposed identity, relationship, page
      attribution, or completeness conclusion.
