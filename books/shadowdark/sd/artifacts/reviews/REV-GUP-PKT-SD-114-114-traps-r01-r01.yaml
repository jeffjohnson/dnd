reviewer_findings:
  - id: RF-01
    subject: check_trap_near_duplicate
    disposition: approved_intentionally_distinct
    refs: [M001, M004]
    detail: >-
      The shared endpoints and type preserve two different source statements.
      M001 governs the usual check for avoiding a trap's effect. M004 governs
      a disabling attempt only when time pressure or exceptional skill makes a
      check necessary. Their aspects and M004's condition encode genuinely
      different moments of trap handling, not a restatement.
  - id: RF-02
    subject: discovery_and_disabling_rules
    disposition: approved
    refs: [M002, M003]
    detail: >-
      Searching the correct area automatically finds the trap, so Check is
      EXCLUDED_FROM trap discovery without hedging. The source separately
      names Thieves as having disabling access. These rows coexist with the
      two CONSTRAINS rows because discovery, avoidance, and disabling are
      distinct procedures.
  - id: RF-03
    subject: traps_table_mechanics
    disposition: approved
    refs: [M005, M006]
    detail: >-
      The named table resolves trap selection and its damage column inflicts
      Damage. The table-level relations retain the reusable mechanics while
      excluding numeric damage magnitudes and unsupported identities for
      individual fictional triggers or results.
  - id: RF-04
    subject: registry_additions
    disposition: approved
    proposed_ids: [rule_traps, tbl_traps]
    detail: >-
      Traps is the source-named packet procedure and Traps Table is its named
      reusable resolution table. Both use constitution-approved prefixes and
      mechanically matching kinds, have complete labels and rationales, and
      are absent from the current registry.
  - id: RF-05
    subject: condition_vocabulary_gap
    disposition: informational_nonblocking
    detail: >-
      Sleep, blindness, confusion, paralysis, unconsciousness, and
      petrification are table effects, but the registry has no condition or
      status identities for them. The same-name canonical nodes spell_sleep,
      spell_blind_deafen, and spell_confusion are spells and cannot substitute
      without falsely asserting that a trap casts those spells. The gap may
      warrant a future Architect vocabulary decision, but it neither makes a
      submitted row false nor authorizes this packet to invent identities.
  - id: RF-06
    subject: rejected_candidates
    disposition: rejected_candidates_confirmed
    detail: >-
      Individual table triggers are fictional examples rather than general
      mechanics; A Tell and pacing are GM design advice; tinkering lacks a
      named identity and does not establish a Learning or Thievery relation;
      and the opening use of peril and surprise is thematic rather than the
      canonical combat Surprise rule. The exclusions are complete and avoid
      both unsupported generalization and misleading same-name reuse.
