reviewer_findings:
  - id: RF-01
    subject: encounter_table_resolver
    disposition: approved
    refs: [M001]
    detail: >-
      The source-named Deep Tunnels Encounters Table selects encounters for
      that environment. RESOLVED_BY from canonical Encounter follows the
      established chapter representation with a distinct tunnel-selection
      aspect and creates no assertion collision.
  - id: RF-02
    subject: trap_and_rival_results
    disposition: approved
    refs: [M002, M003]
    detail: >-
      The drow-made trap explicitly triggers and the rival-crawlers result
      explicitly names the canonical procedure. The table-level FEEDS_INTO
      rows are the correct grain. Live state confirms they become the third
      encounter-table reach to Traps and the fifth total inbound reach to
      Rival Crawlers, fourth from an encounter table.
  - id: RF-03
    subject: healing_result
    disposition: approved
    refs: [M004]
    detail: >-
      The motes explicitly heal hit points when caught. MODIFIES Hit Points at
      encounter healing, with the stated condition and authored improves
      polarity, preserves the mechanic without storing the excluded magnitude.
  - id: RF-04
    subject: treasure_category_precedent
    disposition: approved
    refs: [M005]
    detail: >-
      The cell expressly identifies an ancient treasure chest holding a random
      magic item, so it asserts that this encounter yields Treasure. This is
      materially different from earlier cells that merely described a
      horseshoe, an appearing sword, or an appraisal. One FEEDS_INTO row to
      canonical Treasure is sufficient because canonical Magic Item already
      feeds Treasure; no direct table-to-item row is warranted. Future
      encounter cells earn this treatment only when the source itself uses a
      canonical category, not merely because an object could belong to it.
  - id: RF-05
    subject: sinkhole_near_miss
    disposition: rejected_candidate_confirmed
    detail: >-
      The floor-gives-way cell states an environmental opening and its depth,
      but does not state that a character falls, makes a check, or takes
      damage. A FEEDS_INTO Falling row would infer an unstated participant
      consequence from scenery. Withholding it is consistent with the page-144
      sinkhole result and does not prevent a later explicit falling statement
      from earning a row.
  - id: RF-06
    subject: discovery_method_disclosures
    disposition: informational_nonblocking
    detail: >-
      Direct source reading confirms the submitted Traps row despite the
      singular/plural label mismatch, and confirms Hit Points through the HP
      abbreviation even though neither described automated scan can recover
      that label. These are method-description limitations, not defects in the
      compiled assertions.
  - id: RF-07
    subject: table_registration_and_omissions
    disposition: approved
    detail: >-
      Deep Tunnels Encounters Table is source-named, fresh, correctly prefixed
      and supports every approved row. Creature identities, status effects
      lacking endpoints, magnitude-only material, the direct Magic Item reach,
      the self-referential reroll instruction and supporting context were
      correctly withheld.
  - id: RF-08
    subject: authority_metadata
    disposition: informational_nonblocking
    detail: >-
      Builder-generated routing text still names the stale DEC-2026-0003
      identifier. This Review applies current Shadowdark Constitution section
      2 and common Reviewer authority directly; no submitted row depends on
      that stray citation.
