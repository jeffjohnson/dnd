blocking_findings:
  - id: unsupported_routing_basis
    detail: >-
      Each proposed node currently cites DEC-2026-0003 as authority. That is not
      a Shadowdark Decision. Constitution 1.8 section 2 explicitly approves the
      monster_ prefix and kind and routes source-backed proposals through normal
      GUR/GUP/Review workflow. Apply the exact row-local routing_basis
      correction on all twelve proposals; retain every identity, label, locus,
      omission and the zero-edge plan unchanged.
    current_authority:
      path: rulesets/shadowdark/governance/constitution.md
      checksum: sha256:629e72cde3206228e1d1e569957dfff6aa275728c18ff4890c81cfcdc6e0c93d
reviewer_findings:
  - id: RF-01
    subject: node_routing_authority
    disposition: approved_with_revision
    refs:
      - monster_bat_swarm
      - monster_bear_brown
      - monster_bear_polar
      - monster_beastman
      - monster_berserker
      - monster_black_pudding
      - monster_boar
      - monster_brain_eater
      - monster_bugbear
      - monster_bulette
      - monster_camel
      - monster_cave_brute
    detail: >-
      All twelve proposed identities use the approved monster_ kind and pass
      the live duplicate checks, but their submitted routing_basis fields cite
      nonexistent Shadowdark DEC-2026-0003. The exact row-local corrections
      replace only that unsupported authority text with Constitution 1.8
      section 2, which governs ordinary source-backed node proposals.
  - id: RF-02
    subject: source_named_creature_identities
    disposition: approved
    detail: >-
      The claimed source contains twelve distinct creature headings with
      complete stat blocks, from BAT, SWARM through CAVE BRUTE. Labels match
      those headings exactly, including the commas in Bat, Swarm, Bear, Brown
      and Bear, Polar; each proposed ID is a valid snake_case transliteration.
      All twelve IDs and exact labels are absent from the 449-row live node
      registry, which contains 18 monster identities.
  - id: RF-03
    subject: stat_block_locus_and_zero_edges
    disposition: approved
    detail: >-
      The creature nodes are proposed at their own stat-block defining loci.
      Constitution 1.8 sections 2 and 2.5 exclude individual stat-block
      descriptions and values from graph content. The GUR and GUP correctly
      propose no edges, shared creature-family identity, or general rule; the
      accompanying edges CSV is header-only.
  - id: RF-04
    subject: named_ability_omissions
    disposition: approved
    detail: >-
      Independently checked all fifteen named abilities in the twelve blocks:
      Crush (two instances), Thick Fur, Brutal, Rage, Impervious, Corrosive,
      Gore, Hear Thoughts, Latch, Mind Blast, Mind Control, Stealthy, Leap and
      Bewilder. Their stat-block-local locus remains decisive under Constitution
      2.5 even when text repeats or references canonical mechanics. Rage repeats
      verbatim, Crush repeats within the packet, and Thick Fur repeats an earlier
      creature ability; repetition does not establish a shared-locus rule.
      Impervious names different effects on the Azer and Black Pudding. Bugbear's
      Stealthy shares a label with abil_stealthy but describes a different
      mechanic; no link to that ancestry benefit is warranted.
  - id: RF-05
    subject: page_attribution_and_packet_seam
    disposition: approved
    detail: >-
      The p199 marker is on the BERSERKER heading and the p200 marker on the
      BUGBEAR heading; placement and persistence assign the following complete
      headings through the next marker. The first four headings lack an in-file
      marker and inherit p198 from the packet's independent locator and
      immediately preceding Bat, Giant entry recorded in the prior packet
      manifest. The two packets cite a shared printed page, but claim disjoint
      source content; this does not create duplicate coverage.
  - id: RF-06
    subject: residual_validator_wording
    disposition: approved
    detail: >-
      The validation report's informational node_addition_normal_workflow
      details also repeat “per DEC-2026-0003.” This is the same erroneous stock
      authority wording found in the GUP fields; correct the twelve GUP fields
      exactly as specified. The report text is informational and does not add
      an independent blocker once the actual GUP routing_basis values are
      corrected, though the systemic compiler wording remains for its owner.
completeness_statement: >-
  Independently read the complete claimed Primary Source Material for pages
  198 through 200, checked all twelve creature headings/stat blocks and all
  fifteen named abilities, derived page attribution from the source markers and
  the manifest's independent leading-page locator, and verified the GUR's
  candidate and omission judgments. The twelve node identities and zero-edge
  result are source-complete. Approval is withheld only until all twelve
  incorrect routing_basis fields are replaced with the exact Constitution 1.8
  section 2 corrections.
