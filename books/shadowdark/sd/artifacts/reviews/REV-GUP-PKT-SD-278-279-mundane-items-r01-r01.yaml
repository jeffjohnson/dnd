reviewer_findings:
  - id: RF-01
    subject: mundane_items_table_node_additions
    disposition: approved
    detail: >-
      The three proposed nodes tbl_gemstones (Gemstones Table, p. 278), tbl_gemstone_unique_feature
      (Gemstone Unique Feature Table, p. 278), and tbl_luxury_items (Luxury Items Table, p. 279) are
      source-named from explicit headings in the Primary Source Material. Prefix tbl_ and kind tbl
      are approved vocabulary under Constitution 1.8 section 2. Proposed IDs and labels are confirmed
      absent from the canonical node registry (678 rows). Routing bases correctly cite Constitution 1.8
      section 2. Reviewer approval granted for all three node registrations.
  - id: RF-02
    subject: treasure_table_resolution_edges
    disposition: approved
    refs: [M001, M002, M003]
    detail: >-
      Edges M001, M002, and M003 assert rule_treasure RESOLVED_BY each table (tbl_gemstones with aspect
      "gemstone values", tbl_gemstone_unique_feature with aspect "gemstone feature", and tbl_luxury_items
      with aspect "luxury item selection"). RESOLVED_BY correctly models the mechanical relationship
      between the core treasure rule and its resolving generator/value tables. Derived deterministic polarity
      "governs" conforms to Constitution 1.8 section 6.1 and Graph Invariant 14. Edges held pending until
      node registrations are applied; approved for inclusion in the Approved bundle.
  - id: RF-03
    subject: table_entries_and_candidate_rejections
    disposition: approved_omission
    detail: >-
      Independently verified that all individual table rows and values are properly excluded from edges
      under Graph Invariant 11 and Constitution 1.8 sections 2.4 and 2.5: gemstone monetary values (40 gp,
      120 gp, 200 gp, 280 gp, 360 gp) and giant gem multiplier (×2) are numeric magnitudes excluded by
      Invariant 11; d20 unique features (forgery, misshapen, etc.) and d20 luxury item combinations (with 1d4
      sub-rolls) are roll outcomes; mentions of deities (Memnon, Ord, Madeera) on altars and alignments (Chaos,
      Neutrality, Law) on icons are decorative/curio flavor rather than mechanical deity or alignment rules
      (Constitution 2.2, 2.4); mentions of shields or helms as holy relics are trade goods rather than armor
      class rules; introductory prose examples (statues, silk, etc.) are illustrative trade goods; Jorbin epigraph
      quote is flavor dialogue; and repeated treasure overview context (p. 269) is out of packet scope. All omissions
      confirmed correct.
  - id: RF-04
    subject: page_attributions
    disposition: approved
    detail: >-
      Primary Source Material opens on page 278 with explicit marker {#p278} on MUNDANE ITEMS, carrying through
      GEMSTONES TABLE and GEMSTONE UNIQUE FEATURE TABLE. Explicit marker {#p279} on LUXURY ITEMS TABLE attributes
      that table and the closing proverb to printed page 279. Page attributions on M001 (p. 278), M002 (p. 278),
      and M003 (p. 279) strictly conform to placement rules.
