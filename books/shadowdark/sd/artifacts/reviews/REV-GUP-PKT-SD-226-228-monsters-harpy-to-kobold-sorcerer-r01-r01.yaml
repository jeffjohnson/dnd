reviewer_findings:
  - id: RF-01
    subject: verified_node_routing_authority
    disposition: approved
    detail: >-
      All twelve proposed nodes in the GUP carry routing_basis: 'Constitution 1.8 section 2: approved prefix and kind, valid ID, no duplicate'. Prefix monster_ and kind monster are approved vocabulary under Constitution 1.8 section 2.
  - id: RF-02
    subject: source_named_monster_identities
    disposition: approved
    detail: >-
      The Primary Source Material on pages 226–228 contains twelve distinct creature headings and complete stat blocks: HARPY, HELL HOUND, HIPPOGRIFF, and HIPPOPOTAMUS on page 226; HOBGOBLIN, HORSE, HYDRA, and INVISIBLE STALKER on page 227; JELLYFISH, KNIGHT, KOBOLD, and KOBOLD, SORCERER on page 228. Labels preserve exact source wording and punctuation; IDs drop commas where present and use standard snake_case transliteration with approved prefix monster_. All twelve IDs and labels are absent from the 555-row canonical node registry, which currently holds 124 monster identities.
  - id: RF-03
    subject: stat_block_locus_and_zero_edges
    disposition: approved
    detail: >-
      Constitution 1.8 sections 2.4 and 2.5 exclude individual creature stat-block descriptions, modifiers, and combat traits from graph content. Harpy Song (near range, DC 15 CHA or captivated), Hell Hound Impervious (fire immunity) and Fire Breath (near cone, DC 12 DEX or 3d6 fire), Hippopotamus Stumpy (advantage to resist knockdown/push), Hobgoblin Phalanx (+1 AC per adjacent ally), Hydra modular Heads (5 attacks, 12 dmg to sever, 2 regrow next turn unless 5 fire dmg taken), Invisible Stalker Bound (compelled service), Invisible (can only be attacked if location known, attacks against have disadvantage), and Tracking (flawless tracking), Jellyfish Toxin (DC 15 CON or paralyzed 1d4 rounds), Knight Oath (advantage vs fear/morale checks), Kobold Dodge (reaction to avoid attack on DC 15 DEX), Kobold Sorcerer Dodge (reaction to avoid attack on DC 15 DEX), and Kobold Sorcerer spells (Scorpion Sting and Spider Swarm) operate on creature combat and action loci rather than global rulesets or general spell systems. Equipment parentheticals (e.g. Knight plate mail and shield, Hobgoblin spear and shield) and standard stat fields (AC, HP, ATK, MV, S-D, LV) are similarly excluded under 2.4 and 2.5. All eighteen candidate rejections in the GUR are verified correct under Constitution 2.4/2.5. The zero-edge plan and empty edges component are complete.
  - id: RF-04
    subject: graph_invariant_4_ancestry_language_distinction
    disposition: approved
    detail: >-
      Graph Invariant 4 requires strict differentiation between creature identity nodes and any corresponding ancestry or language nodes. Verified that neither Hobgoblin nor Kobold exists as an playable ancestry or language in canonical Shadowdark registries (languages are Common, Dwarvish, Elvish, Sylvan, etc.; ancestries are Dwarf, Elf, Goblin, Halfling, Half-Orc, Human). The proposed nodes monster_hobgoblin, monster_kobold, and monster_kobold_sorcerer are purely creature identities defined under Chapter 11 monster listings and do not conflate with any ancestry or language node.
  - id: RF-05
    subject: page_attributions
    disposition: approved
    detail: >-
      Explicit page markers {#p226}, {#p227}, and {#p228} are anchored directly to their respective headings across the packet. Harpy, Hell Hound, Hippogriff, Hippopotamus are anchored at {#p226}; Hobgoblin, Horse, Hydra, Invisible Stalker are anchored at {#p227}; Jellyfish, Knight, Kobold, Kobold Sorcerer are anchored at {#p228}. The claimed three-page span (226–228) and all twelve defining loci agree with the markers.
completeness_statement: >-
  Independently read the complete claimed Primary Source Material on pages 226–228 at its pinned checksum, verified all twelve creature identities against their defining stat blocks, derived page attributions directly from explicit markers {#p226}, {#p227}, and {#p228}, evaluated Graph Invariant 4 for hobgoblin and kobold against the canonical registry, confirmed the exclusion of all stat-block combat traits, modular heads, innate breath weapons, creature-specific spells, equipment parentheticals, and attributes under Constitution 2.4 and 2.5, and verified that Builder authority citations strictly cite Constitution 1.8 section 2. The packet yields 12 new node registrations and 0 edge insertions, with 0 errors and 0 warnings. Mechanically complete and approved for integration.
