reviewer_findings:
  - id: RF-01
    subject: turn_undead_opposed_direction
    disposition: approved_distinct_relationships
    ref: M039
    detail: >-
      The canonical class_priest GATES spell_turn_undead row records access to
      the spell as a Priest class feature. M039 records the spell entry's
      printed casting-class classification in the constitutionally mandated
      spell-to-class direction. The two rows differ in relationship, aspect,
      provenance, and purpose; their opposite directions are correct and do
      not contradict one another.
  - id: RF-02
    subject: turn_undead_canonical_reuse
    disposition: approved
    refs: [M034, M035, M036, M037, M038, M039]
    detail: >-
      spell_turn_undead is correctly reused rather than re-proposed. Its six
      page-72 rows do not collide with the page-20 access gate or spells-known
      exclusion. M037 correctly applies the established Rebuke Unholy lethal
      outcome model with qualitative condition grain.
  - id: RF-03
    subject: shield_of_faith_casting_class
    disposition: approved_as_printed
    ref: M003
    detail: >-
      The primary SHIELD OF FAITH entry explicitly prints "Tier 3, wizard".
      Under incoming-packet authority, M003 must preserve that printed class
      even though the repeated spell-list context and devotional wording point
      toward Priest. The discrepancy is source-facing and is not repaired by
      graph inference.
  - id: RF-04
    subject: unrepresented_compelled_flight
    disposition: informational_nonblocking
    detail: >-
      Turn Undead's ordinary failed-check flight outcome has no canonical
      flight, fear, morale, or compelled-movement identity. It is correctly not
      forced onto ex_movement. The same ontology gap affects Rebuke Unholy and
      does not make any submitted row false.
  - id: RF-05
    subject: gur_registry_snapshot
    disposition: informational
    detail: >-
      The GUR says 239 registry rows; the independently measured current
      registry contains 263. The compiler used live state, spell_turn_undead
      resolved canonically, and none of the nine proposed spells is registered,
      so the stale prose count changes no operation.
