reviewer_findings:
  - id: RF-01
    subject: verified_node_routing_authority
    disposition: approved
    detail: >-
      All eight proposed nodes in the GUP carry routing_basis: 'Constitution 1.8
      section 2: approved prefix and kind, valid ID, no duplicate'. The Builder
      authority citation fix is active and no foreign DEC-2026-0003 citation
      exists anywhere in the GUP or in its validation report.
  - id: RF-02
    subject: source_named_elemental_identities
    disposition: approved
    detail: >-
      The Primary Source Material on page 215 contains eight distinct creature
      headings and complete stat blocks: ELEMENTAL, AIR, LESSER; ELEMENTAL, AIR,
      GREATER; ELEMENTAL, EARTH, LESSER; ELEMENTAL, EARTH, GREATER; ELEMENTAL,
      FIRE, LESSER; ELEMENTAL, FIRE, GREATER; ELEMENTAL, WATER, LESSER; and
      ELEMENTAL, WATER, GREATER. Labels preserve exact source wording and comma
      placement; IDs drop commas and use standard snake_case transliteration with
      approved prefix monster_. All eight IDs and exact labels are absent from
      the 509-row canonical node registry, which currently holds 78 monster
      identities.
  - id: RF-03
    subject: stat_block_locus_and_zero_edges
    disposition: approved
    detail: >-
      Constitution 1.8 sections 2.4 and 2.5 exclude individual creature stat-block
      descriptions, modifiers, and values from graph content. The special ability
      descriptions (Impervious; Whirlwind; Avalanche; Inferno; Whirlpool)
      describe creature-local combat traits and magnitudes, not cross-mechanic
      graph relationships. Whirlpool's instruction to treat as underwater is GM
      adjudication guidance for creatures trapped inside, operating on creature
      locus without modifying swimming or suffocation rules. All ten rejected
      candidates in the GUR are correctly excluded under the locus test. The
      zero-edge plan and empty edges component are complete.
  - id: RF-04
    subject: family_taxonomy_and_tier_rules_excluded
    disposition: approved
    detail: >-
      The two-paragraph family introduction on page 215 describes elementals as
      beings of pure energy with opposing elemental pairs (Earth/Air, Fire/Water)
      and explains tier scaling (Lesser at LV 6 with 2 damage dice, Greater at LV
      9 with 3 damage dice). Under Constitution 1.8 section 2.4, narrative lore
      and family taxonomy are excluded absent an explicit Decision. Tier scaling
      is a design pattern instantiated across individual creature stat blocks,
      properly excluded from graph edges.
  - id: RF-05
    subject: page_attribution
    disposition: approved
    detail: >-
      Explicit page marker {#p215} is anchored directly to the ELEMENTALS heading
      and persists through all eight creature stat blocks on page 215. The claimed
      single-page span (215) and all eight defining loci agree with the marker.
