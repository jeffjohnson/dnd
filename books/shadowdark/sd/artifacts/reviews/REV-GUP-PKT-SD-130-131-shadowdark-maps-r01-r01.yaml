reviewer_findings:
  - id: RF-01
    subject: room_type_canonical_rule_labels
    disposition: rejected_candidates_confirmed
    detail: >-
      Trap, Minor hazard, Major hazard, and Treasure name generated room
      contents, not the canonical rule procedures rule_traps, rule_hazards,
      and rule_treasure. Those rules are not axes with members, so neither
      RESOLVED_BY direction is truthful. FEEDS_INTO would invert containment,
      GATES would invent a precondition, and the constitution permits
      CLASSIFIED_AS only for four bounded forms that do not include rooms or
      tables. The missing generic containment relation is an expressiveness
      observation, not a material canonical mismatch in this packet.
  - id: RF-02
    subject: two_tier_generator_structure
    disposition: approved
    refs: [M001, M002, M003, M004, M006, M007, M008, M009, M010, M011, M012, M013]
    detail: >-
      Shadowdark Maps is directly resolved by the four top-level tables. The
      Room Type result then supplies which of the eight contents tables is
      used, so FEEDS_INTO from tbl_map_room_type to those tables preserves the
      source's two-tier procedure without flattening it. All twelve directions
      and aspects match the source and have no canonical collision.
  - id: RF-03
    subject: danger_level_resolver
    disposition: approved
    refs: [M005]
    detail: >-
      The Map Danger Level Table is the first source-backed procedure that
      resolves canonical rule_danger_level. Its three existing relationships
      are all outbound uses of Danger Level; none determines it. RESOLVED_BY
      with aspect map selection correctly fills that neighborhood gap.
  - id: RF-04
    subject: registry_additions
    disposition: approved
    proposed_ids:
      - rule_shadowdark_maps
      - tbl_map_danger_level
      - tbl_map_site_size
      - tbl_map_site_type
      - tbl_map_room_type
      - tbl_map_trap
      - tbl_map_monster_mob
      - tbl_map_minor_hazard
      - tbl_map_major_hazard
      - tbl_map_solo_monster
      - tbl_map_treasure
      - tbl_map_npc
      - tbl_map_boss_monster
    detail: >-
      All thirteen proposals are source-named identities at their defining
      loci, use approved prefixes and matching kinds, carry complete labels
      and rationales, and are absent from the current registry. Every proposal
      supports at least one approved relationship.
  - id: RF-05
    subject: unrepresented_physical_procedure
    disposition: informational_nonblocking
    detail: >-
      Dice positions, room outlines, walls, passages, and the highest-result
      placement rule lack supported graph endpoints or magnitude fields.
      Omitting them avoids inventing drawing-technique identities. The
      approved table relationships retain the expressible procedural
      scaffolding without claiming full representation of the physical method.
  - id: RF-06
    subject: source_structure_and_status
    disposition: verified_core
    detail: >-
      Direct inspection confirms five procedure paragraphs, twelve named
      tables, and 55 data rows, split four tables on page 130 and eight on page
      131. The procedure is presented as ordinary GM guidance rather than an
      optional mode, so all thirteen submitted rows are correctly core.
