  - id: RF-02
    subject: magic_item_edges
    disposition: approved
    refs: [M001, M002, M003, M004, M005, M006, M007, M008, M009, M010, M011, M012, M013, M014, M015, M016, M017, M018, M019, M020, M021, M022, M023, M024, M025, M026, M027, M028, M029, M030, M031, M032, M033, M034, M035, M036, M037, M038, M039, M040, M041, M042, M043, M044, M045, M046, M047]
    detail: >-
      Edges M001–M047 model mechanics across the 12 magic items:
      Ring of Ramlaat: M001 asserts item_ring_of_ramlaat MODIFIES cbt_damage_roll (melee damage multiplier, during rage, improves); M002 asserts item_ring_of_ramlaat CONSTRAINS rule_spellcasting_check (spellcasting prohibition, during rage, governs); M003 asserts item_ring_of_ramlaat MODIFIES cbt_attack_roll (enemy melee attack advantage, for enemies attacking wielder during rage, worsens); M004 asserts alignment_chaotic FEEDS_INTO item_ring_of_ramlaat (item alignment, , neutral);
      Robe of the Archmage: M005 asserts class_wizard GATES item_robe_of_the_archmage (item usability, to wear robe, enables); M006 asserts tbl_wizard_titles GATES item_robe_of_the_archmage (wearer title, to wear robe, enables); M007 asserts item_robe_of_the_archmage MODIFIES cbt_armor_class (unarmored ac bonus, while wearing robe, improves); M008 asserts item_robe_of_the_archmage MODIFIES rule_spellcasting_check (fixed spellcasting check dc, for chosen known spells, improves); M009 asserts item_robe_of_the_archmage MODIFIES spell_disintegrate (spellcasting advantage, when casting disintegrate, improves);
      Robe of the Druid: M010 asserts class_wizard GATES item_robe_of_the_druid (item usability, to wear robe, enables); M011 asserts tbl_wizard_titles GATES item_robe_of_the_druid (wearer title, to wear robe, enables); M012 asserts item_robe_of_the_druid MODIFIES cbt_armor_class (unarmored ac bonus, while wearing robe, improves); M013 asserts item_robe_of_the_druid MODIFIES rule_spellcasting_check (lost spell restoration, twice per day, improves); M014 asserts item_robe_of_the_druid MODIFIES spell_shapechange (spellcasting advantage and duration, when casting shapechange, improves);
      Robe of the Sorcerer: M015 asserts class_wizard GATES item_robe_of_the_sorcerer (item usability, to wear robe, enables); M016 asserts tbl_wizard_titles GATES item_robe_of_the_sorcerer (wearer title, to wear robe, enables); M017 asserts item_robe_of_the_sorcerer MODIFIES cbt_armor_class (unarmored ac bonus, while wearing robe, improves); M018 asserts item_robe_of_the_sorcerer MODIFIES cbt_damage_roll (spell damage bonus, when casting damaging spells, improves); M019 asserts abil_intelligence FEEDS_INTO item_robe_of_the_sorcerer (spell damage bonus modifier, , neutral); M020 asserts item_robe_of_the_sorcerer MODIFIES spell_power_word_kill (spellcasting advantage, when casting power word kill, improves);
      Scarab of Protection: M021 asserts item_scarab_of_protection TRIGGERS abil_constitution (death prevention check, on death, neutral); M022 asserts item_scarab_of_protection CONSTRAINS rule_death (death negation, on successful constitution check, governs);
      Scimitar of the Ash Moon: M023 asserts item_scimitar_of_the_ash_moon MODIFIES cbt_attack_roll (attack bonus, when attacking with this weapon, improves); M024 asserts item_scimitar_of_the_ash_moon MODIFIES cbt_damage_roll (damage bonus, when attacking with this weapon, improves); M025 asserts item_scimitar_of_the_ash_moon TRIGGERS rule_death (decapitation instant death, on critical hit, inflicts);
      Shield of the Crusader: M026 asserts alignment_lawful GATES item_shield_of_the_crusader (wielder alignment, to wield shield, enables); M027 asserts item_shield_of_the_crusader MODIFIES cbt_armor_class (shield bonus, while wielding shield, improves); M028 asserts item_shield_of_the_crusader MODIFIES cbt_armor_class (holy flames armor bonus, after prayer spoken, improves);
      Shield of the Lion: M029 asserts item_shield_of_the_lion MODIFIES cbt_armor_class (shield bonus, while wielding shield, improves); M030 asserts item_shield_of_the_lion TRIGGERS rule_morale (ferocious roar morale check, when commanded, neutral);
      Shield of the Witch-King: M031 asserts alignment_chaotic GATES item_shield_of_the_witch_king (wielder alignment, to wield shield, enables); M032 asserts alignment_chaotic FEEDS_INTO item_shield_of_the_witch_king (item alignment, , neutral); M033 asserts item_shield_of_the_witch_king MODIFIES cbt_armor_class (shield bonus, while wielding shield, improves); M034 asserts item_shield_of_the_witch_king MODIFIES cbt_damage_roll (damage resistance, from undead creatures, improves); M035 asserts item_shield_of_the_witch_king CONSTRAINS rule_hit_points (healing blockage, when at zero hit points, governs);
      Shortsword of the Thief: M036 asserts item_shortsword_of_the_thief MODIFIES cbt_attack_roll (attack bonus, when attacking with this weapon, improves); M037 asserts item_shortsword_of_the_thief MODIFIES cbt_damage_roll (damage bonus, when attacking with this weapon, improves); M038 asserts ancestry_halfling MODIFIES item_shortsword_of_the_thief (weapon bonus enhancement, when wielded by a halfling, improves); M039 asserts class_thief MODIFIES item_shortsword_of_the_thief (weapon bonus enhancement, when wielded by a thief, improves); M040 asserts item_shortsword_of_the_thief MODIFIES rule_luck_token (luck token recovery, once per day, improves);
      Silver Mace of Wrath: M041 asserts item_silver_mace_of_wrath MODIFIES cbt_attack_roll (attack bonus, when attacking with this weapon, improves); M042 asserts item_silver_mace_of_wrath MODIFIES cbt_damage_roll (damage bonus, when attacking with this weapon, improves); M043 asserts item_silver_mace_of_wrath MODIFIES cbt_damage_roll (damage multiplier, against creatures with lycanthropy, improves);
      Sphere of Annihilation: M044 asserts item_sphere_of_annihilation TRIGGERS abil_intelligence (control check, to move sphere, neutral); M045 asserts class_wizard MODIFIES item_sphere_of_annihilation (control check advantage, when controlling sphere, improves); M046 asserts item_sphere_of_annihilation MODIFIES cbt_attack_roll (obliteration attack bonus, when sphere enters occupied space, improves); and M047 asserts item_sphere_of_annihilation TRIGGERS rule_death (obliteration instant death, on a hit, inflicts).
      All edge types, directions, conditions, and polarities strictly conform to Constitution 1.8 section 6.1 and Graph Invariant 14.
      Edges are held pending until node registrations are applied; approved for inclusion in the Approved bundle upon integration.
  - id: RF-03
    subject: near_duplicate_findings
    disposition: approved
    refs: [M027, M028, M042, M043]
    detail: >-
      Audited two near-duplicate findings reported by the Builder:
      1) M027 and M028 both connect item_shield_of_the_crusader MODIFIES cbt_armor_class. M027 models the baseline static +1 shield bonus while wielding, whereas M028 models the temporary holy flames prayer AC bonus (+2 for 3 rounds). These are distinct mechanical effects from two separate rules sentences.
      2) M042 and M043 both connect item_silver_mace_of_wrath MODIFIES cbt_damage_roll. M042 models the static +1 magical damage bonus on hit, whereas M043 models the conditional double damage multiplier against lycanthropes. These are distinct mechanical effects.
      Both pairs are confirmed valid, non-redundant mechanical assertions and approved.
  - id: RF-04
    subject: grain_warning_evaluation
    disposition: approved
    refs: [M035]
    detail: >-
      Evaluated grain warning on M035 regarding the spelled-out word 'zero' in condition 'when at zero hit points'.
      In Shadowdark, 'at zero hit points' designates the discrete qualitative game state threshold of unconsciousness and dying (0 HP),
      as opposed to an arbitrary arithmetic scalar modifier. The condition accurately identifies when Ix-Natheer blocks healing magic.
      Confirmed acceptable and approved under Graph Invariant 11 and Constitution 1.8 section 2.5.
  - id: RF-05
    subject: narrative_and_candidate_rejections
    disposition: approved_omission
    detail: >-
      Independently verified that all narrative lore, cosmetic descriptions, DC figures, numeric bonuses, dice rolls, durations,
      frequencies, ranges, and out-of-scope passages are properly excluded from edges under Graph Invariant 11 and
      Constitution 1.8 sections 2.4 and 2.5:
      Ring of Ramlaat ram skull appearance, 5 rounds duration, and aggressive personality flavor;
      Robe of the Archmage red silk gold-hemmed appearance, 15 AC base figure, 3 spells count, and DC 11 check figure;
      Robe of the Druid green velvet appearance, 15 AC base figure, 1 lost spell count, and 1 hour shapechange duration;
      Robe of the Sorcerer black leather appearance and 15 AC base figure;
      Scarab of Protection gold-dipped scarab appearance and DC 18 Constitution check figure;
      Scimitar of the Ash Moon efreeti pommel appearance and +3 bonus magnitude;
      Shield of the Crusader crimson cross appearance, +1 shield bonus magnitude, +2 prayer bonus magnitude, and 3 rounds duration;
      Shield of the Lion lion face appearance, +1 shield bonus magnitude, once per day frequency, and near range;
      Shield of the Witch-King spiny black steel appearance, +2 shield bonus magnitude, half damage fraction, and Ix-Natheer spirit lore;
      Shortsword of the Thief stubby gray blade appearance, +1/+2 bonus magnitudes, and 1 luck token count;
      Silver Mace of Wrath crescent moon flanges appearance, +1 bonus magnitude, and double damage multiplier magnitude;
      Sphere of Annihilation 3-foot spherical void appearance, DC 18 check threshold figure, near distance movement, and +7 attack bonus magnitude;
      and supporting context passages (pp. 34–37, 59, 86, 282–283) are out of packet scope.
      All omissions confirmed correct.
  - id: RF-06
    subject: page_attributions
    disposition: approved
    detail: >-
      Primary Source Material spans pages 312–315 with four explicit page markers:
      RING OF RAMLAAT is headed by {#p312} on page 312 (M001–M004);
      ROBE OF THE ARCHMAGE is headed by {#p313} covering Robe of the Archmage, Robe of the Druid, and Robe of the Sorcerer on page 313 (M005–M020);
      SCARAB OF PROTECTION is headed by {#p314} covering Scarab of Protection, Scimitar of the Ash Moon, Shield of the Crusader, Shield of the Lion, and Shield of the Witch-King on page 314 (M021–M035);
      SHORTSWORD OF THE THIEF is headed by {#p315} covering Shortsword of the Thief, Silver Mace of Wrath, and Sphere of Annihilation on page 315 (M036–M047).
      All page attributions strictly conform to source placement.
