  - id: RF-02
    subject: treasure_table_resolution_edge
    disposition: approved
    refs: [M001]
    detail: >-
      Edge M001 asserts rule_treasure RESOLVED_BY tbl_treasure_0_3 with aspect "treasure selection". The d100
      table determines random treasure selection for 0th- to 3rd-level monsters and unguarded finds. RESOLVED_BY
      correctly captures the relationship between the core rule and its resolving table. Derived deterministic
      polarity "governs" conforms to Constitution 1.8 section 6.1 and Graph Invariant 14. Edge held pending until
      node registration is applied; approved for inclusion in the Approved bundle.
  - id: RF-03
    subject: table_entries_and_candidate_rejections
    disposition: approved_omission
    detail: >-
      Independently verified that all 50 table entries in the d100 table are properly excluded from individual
      edges under Graph Invariant 11 and Constitution 1.8 sections 2.4 and 2.5: monetary values (cp, sp, gp) are
      numeric magnitudes; mundane equipment items are roll outcomes whose definitions reside on pages 33–37; art
      curios (such as obsidian statuette of Shune the Vile) are descriptive flavor; craftsmanship mentions (elf-forged,
      dwarven, halfling) are aesthetic flavor; and minor magic items (spell scroll, Potion of Invisibility, Bag of
      Holding) have defining loci in later magic item chapters (pp. 276+). All omissions confirmed correct.
  - id: RF-04
    subject: page_attributions
    disposition: approved
    detail: >-
      Primary Source Material opens on page 270 with explicit marker {#p270} on TREASURE 0-3, carrying through entry
      44-45. Explicit inline marker {#p271} on entry 46-47 attributes the remainder of the table (entries 46-47 through
      00) to printed page 271. Page 270 attribution on M001 accurately reflects the table heading and locus origin.
