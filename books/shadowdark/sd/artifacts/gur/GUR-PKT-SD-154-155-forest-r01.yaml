completeness_statement: 'Both printed pages in scope were read in full at the recorded checksum: 1 named
  table, 50 data rows, 0 sentences of prose. The packet yields 1 new identity and 3 rows, reusing 3 canonical
  identities whose labels the building script asserted equal to the registry. The proposed table carries
  edges, so nothing is left unattached.

  Every row was checked against the 791 canonical edges for an assertion-key collision, for a shared source,
  type and target under a different aspect, and for duplicates within the patch; there are none of any,
  and no canonical row cited either page before. The script locates the supporting cell for each row and
  asserts its page, which matters because the page break falls inside the table.

  6 candidates were rejected and each is recorded with its reason. The largest deliberate loss is the
  creature and scene content, which belongs to the unextracted monster chapter or states no mechanic at
  all. 9 of the 12 apparent registry references in the cells are spurious collisions with ordinary English,
  measured rather than filtered by eye. No assertion depends on any other ruleset.'
trap_cells_note: 'Two cells support M002 and they are worth distinguishing, because they fall on either
  side of the test the Reviewer settled one packet ago.

  Cell 23 of 50 says rusty bear traps spring out from beneath the leaf litter. It names traps and states
  the mechanism, so it qualifies under any reading.

  Cell 26 says a catgut wire triggers a wide, falling net hidden above. It contains no form of the word
  trap. Under the test I was applying before the desert overturn it would have been declined; under the
  settled test it qualifies, because a tripwire and a concealed net state how the device operates.

  One row is written. Both cells are on the same page and support the same five-field assertion key, so
  a second row would be a duplicate rather than a distinct assertion. The building script locates both
  and asserts there is exactly one of each.'
