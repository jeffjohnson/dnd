rejected_candidates:
- text_locus: the creature results across the table, pp154 and 155
  quoted_gist: giant spiders, an owlbear, boars, centaurs, elves, a panther, giant wasps, an otyugh, apes,
    a giant snake, badgers, treants, goblins on worgs, a blood vine, a weald hag, faeries, violent fungi,
    wolves, kobolds, a mage, orcs, brown bears, a centipede swarm, a dryad, a leprechaun, a shambling
    mound, a dire wolf, giant frogs, Hrugin the troll, an ogre, green knights, a bugbear king, cave creepers,
    a forest dragon, berserkers and the Wandering Merchant
  why_considered: Two are individually named, Hrugin the troll and the Blood of Ramlaat tribe, and the
    green knights carry a size class in parentheses.
  rejection_reason: A creature's defining locus is its stat block in the unextracted monster chapter and
    the registry holds no monster_ identity. Seventh packet running for the same disposition. Hrugin appears
    in the same cell as the rival crawlers he is dragging, and only the crawlers earn a row, because rule_rival_crawlers
    is canonical and no troll identity is.
- text_locus: the status-effect and restraint results, pp154 and 155
  quoted_gist: glowing pixie-dust causing intense drowsiness, a blood vine trying to strangle a berserker,
    faeries trying to hog-tie the characters with thread and needle, thick webs filling the forest
  why_considered: Each states an effect on a participant rather than a scene, and drowsiness, strangling
    and being hog-tied are the kind of thing a CONSTRAINS row would carry if there were an identity for
    the state.
  rejection_reason: There is no status identity and the condition vocabulary has no term for one, which
    is the gap recorded at PKT-SD-136-137 and at traps and hazards before that. None of these cells states
    a check, a die or a duration either. Fifth locus to lose rows to the same missing vocabulary.
- text_locus: the falling tree, p154
  quoted_gist: an ancient, rotted tree snaps and falls toward the characters
  why_considered: rule_falling is canonical and a tree falling on someone is the most obviously harmful
    event on the page.
  rejection_reason: 'rule_falling governs a character falling, not an object falling on one, and the cell
    states no check, no damage and no consequence. Under the revised test this is the same disposition
    as the floor giving way on printed page 151: an event is described and no mechanism is stated. The
    tree is also not what the registry scan matched on rule_falling; that was the word falling in the
    catgut-wire cell.'
- text_locus: the safe shelter and trading camps, p155
  quoted_gist: an abandoned, overgrown stone chapel offers safe shelter, and a camp of berserkers is willing
    to trade for goods
  why_considered: rule_resting is canonical and is constrained by danger level, so a place offering safe
    shelter is close to stating a rest condition; item_coin and rule_shop exist for the trading camp.
  rejection_reason: Neither cell states a mechanism. Safe shelter names no rest, no duration and no danger
    level, and willing to trade names no goods, no prices and no shop. Both are situations a GM uses.
    This is the reading that declined the campfire on printed page 149 for the same reason.
- text_locus: the two-encounter instruction, p155
  quoted_gist: one result instructs the reader to roll twice more and combine the results, rerolling that
    result if it comes up again
  why_considered: It is the only instruction on the page, and the stem scan flags it as matching rule_encounter.
  rejection_reason: The match is on the plain word encounters in the instruction's own text; M001 already
    carries the table's relation to rule_encounter. The rest is arithmetic on the table's own roll. Declined
    in the same form in each of the six preceding chapter packets.
- text_locus: the appended random encounter procedure and monster attributes, out of scope
  quoted_gist: the printed page 112 and 113 encounter procedure and the printed page 189 monster attributes
    page
  why_considered: Both are in the file and the first is the rule this table resolves.
  rejection_reason: Both are Supporting Source Context, outside the bounded scope. PKT-SD-112-113 is already
    integrated, so extracting from it would duplicate canonical rows and cite pages outside this packet's
    range.
non_edge_observations:
- id: OBS-01
  subject: the revised mechanism test applied prospectively for the first time
  detail: 'The Reviewer overturned my desert decline one packet ago and replaced my test. Mine was that
    the source must name the thing; the settled one is that the source must state the mechanism, because
    requiring the registry label verbatim makes extraction lexical rather than mechanical.

    This page is the first to be read under it, and it makes a difference here. Two cells support M002.
    One says rusty bear traps spring out from beneath the leaf litter and would have qualified under either
    test. The other says a catgut wire triggers a wide, falling net hidden above, and contains no form
    of the word trap; under my old test it would have been declined exactly as the desert nets were, and
    under the settled test it plainly qualifies, because a tripwire and a concealed net are a trap mechanism
    stated in full.

    Recorded so the change of test is visible in the artifact where it first bites, rather than only in
    the desert successor''s revision_reason. One row is written, since both cells support the same assertion
    key and a second would be a duplicate.'
- id: OBS-02
  subject: what the revised test still does not reach
  detail: 'Adopting the mechanism test does not make this chapter''s dangerous scenery extractable, and
    it is worth being explicit about that so the change is not read as wider than it is. A rotted tree
    falling toward the party, a blood vine strangling a berserker, pixie-dust causing drowsiness and faeries
    hog-tying the characters all state an event and none states a mechanism: no check, no die, no duration,
    no named procedure and, for the status effects, no vocabulary to carry the state even if one were
    stated.

    The difference is that a tripwire and a net describe how the thing operates, which is what a trap
    is, whereas a tree falling describes only that it falls. The test asks what the cell says happens,
    not whether I can name the rule that would cover it.'
- id: OBS-03
  subject: the DEC-2026-0003 citation is now known to be in Builder tooling too
  detail: 'I reported at PKT-SD-142-143 that twelve GURs of mine cite a Shadowdark DEC-2026-0003 that
    does not exist, and that the grounding for ordinary registry additions is constitution section 2.
    The Integrator has since localised it further: three of the five findings in the Builder validation
    report for PKT-SD-152-153 cite the same identifier in their detail text, so it is emitted by Builder
    tooling as well as sitting in my published artifacts.

    Recorded here only so the two halves are linked in the artifact record rather than only in messages.
    Neither affects a row or a registration. Fixing tooling is not mine to do and I am proposing nothing;
    my own half is already handled by omitting the citation from every GUR since printed page 142, and
    this packet''s authority list omits it.'
