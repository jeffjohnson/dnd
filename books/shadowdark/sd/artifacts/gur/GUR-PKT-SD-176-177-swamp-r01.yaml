completeness_statement: 'Both printed pages in scope were read in full at the recorded checksum: 1 named
  table, 50 data rows, 0 sentences of prose. The packet yields 1 new identity and 4 rows, reusing 4 canonical
  identities whose labels the building script asserted equal to the registry. The proposed table carries
  edges, so nothing is left unattached.

  Every row was checked against the 830 canonical edges for an assertion-key collision, for a shared source,
  type and target under a different aspect, and for duplicates within the patch; there are none of any,
  and no canonical row cited either page before. The script locates the supporting cell for each row and
  asserts its page, which matters because the page break falls inside the table.

  6 candidates were rejected and each is recorded with its reason. The largest deliberate loss is the
  creature and scene content, which belongs to the unextracted monster chapter or states no mechanic at
  all. 6 of the 12 apparent registry references in the cells are spurious collisions with ordinary English,
  measured rather than filtered by eye. No assertion depends on any other ruleset.'
vision_note: 'M002 is the chapter''s first CONSTRAINS row, so the type, the target and the polarity are
  each argued.

  The cell, at row index 9 of 50, states that a cloud of mosquitoes whines, bites and obscures vision.
  Obscures is hedged: sight is impeded, not prevented. That is CONSTRAINS rather than EXCLUDES under the
  test settled at PKT-SD-114-114, and it is the mirror of the mountain blizzard that bars travel outright
  and took EXCLUDES.

  The target is rule_vision, canonical with 3 rows, which the light source gates, invisibility excludes
  and which itself excludes hiding. A cloud between the eye and the world is squarely what that identity
  covers, and no other candidate is close; rule_light_source concerns illumination and nothing here dims
  a light.

  The polarity is governs at basis read, and it is a convention rather than a judgement. All 76 CONSTRAINS
  rows in canonical carry governs, 6 of them from a tbl_ source, so writing anything else would break
  a uniform pattern. The bite is not carried: the cell states no damage, no check and no duration, so
  only the sight effect survives.'
treasure_reach_note: 'M004 rests on row index 49 of 50, the hundredth slot, where the Swamp Shambler offers
  a random magic item. All three elements of the settled test are present.

  The canonical category is named exactly. The route exists, 1 row from item_magic_item to rule_treasure
  on xp source at printed page 117, which is the element the spell scroll lacked one packet ago. And the
  item is available, on the limb the Integrator confirmed alongside active bestowal.

  The verb is the part worth checking, because offers is weaker than bestows and stronger than sells;
  see OBS-02. An offer with no price makes the item available to be taken, where a sale states stock and
  a cost the cell never resolves. As before the row is routed through rule_treasure rather than pointing
  at the item, and the word random is not a quantity so nothing is excluded on that ground.'
measured_figures_note: 'Figures quoted in this artifact''s prose are computed by the building script from
  the claimed source and the canonical files, and the finished document is checked for unsubstituted format
  specifiers before it is written. Located cells: the mosquito cloud at index 9, the rival crawlers at
  36, the magic item at 49 and the swamp tar at 45, of 50 rows. Canonical counts at extraction: 19 resolvers
  on rule_encounter, 76 CONSTRAINS rows of which 76 carry governs and 6 have a tbl_ source, 3 rows on
  rule_vision, 16 inbound on rule_rival_crawlers and 10 inbound on rule_treasure. This is packet 18 of
  the chapter''s claimed set.'
