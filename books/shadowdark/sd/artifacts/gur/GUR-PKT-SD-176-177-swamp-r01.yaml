rejected_candidates:
- text_locus: the healing swamp tar, p177
  quoted_gist: bubbling swamp tar has healing and anti-toxin properties
  why_considered: rule_hit_points is canonical and two encounter tables have earned MODIFIES rows to it,
    the deep tunnels motes and the low district mulled wine, both of which state an amount.
  rejection_reason: No amount, no check, no application and no item identity for the tar. Having healing
    properties is a description of a substance, not a restoration performed. This is the fourth healing
    decline in the chapter, after a lost priest on printed page 151, a Reverend Sister on 159 and a mushroomfolk
    mystic on 161, and all four are declined for the same missing amount. Anti-toxin is worse off still,
    since there is no poison or status identity for it to remove, the same inverse gap recorded on printed
    page 169 for the curse-ending algae.
- text_locus: the torches and the lit lantern, pp176 and 176
  quoted_gist: peasants with torches and pitchforks chasing a werewolf, and a headless scarecrow standing
    on a rock holding a lit lantern
  why_considered: item_torch and item_lantern are both canonical and both are the items DEC-2026-0104
    classified as light sources, so a light row looked available, and this packet does assert a vision
    row from the same page.
  rejection_reason: Neither cell states a radius, a duration, fuel or darkness. Peasants carry torches
    because it is night and a scarecrow holds a lantern because it is eerie; nothing in either engages
    rule_light_source. The mosquito cell earns a row because it states an effect on a canonical rule,
    and these two state only that a light source is present, which is the same reading that declined the
    cave paintings on printed page 149 and the shuttered lanterns on 173.
- text_locus: the creature results across the table, pp176 and 177
  quoted_gist: giant frogs, stingbats, giant leeches, giant rats, giant spiders, a giant snake, a werewolf,
    a hill giant, goblins, a goblin wizard, a priest of Shune and the Wandering Merchant
  why_considered: Three are individually named with a type or an alignment in parentheses, Blugbort the
    goblin wizard, Gorgoth the priest of Shune, and Ol Greenguts the giant frog, and the hundredth row
    names the Swamp Shambler with a creature type.
  rejection_reason: A creature's defining locus is its stat block in the unextracted monster chapter and
    the registry holds no monster_ identity. The Swamp Shambler earns nothing itself; its cell earns a
    row because it offers a magic item, and the row is sourced from the table. Seventeenth packet running
    for the same disposition. A priest of Shune is also not deity_shune_the_vile, which is the shrine
    reasoning from printed page 167.
- text_locus: the bog hazards that state no mechanic, pp176 and 177
  quoted_gist: dense mud giving way into a field of quicksand, a knight stuck up to his neck in it, dense
    patches of stinging nettles and toxic thorns, a yellow haze of poisonous swamp gas drifting over the
    bog, patches of burning oil floating on the water, and a filmy puddle that is actually a gray ooze
  why_considered: The mosquito cell on this page shows that an environmental result can state an effect
    on a canonical rule, so the others were checked against the same standard rather than dismissed as
    scenery.
  rejection_reason: Only the mosquito cell names a rule the graph holds and says what happens to it. The
    rest state presence and no effect, which is the fourteenth locus to lose rows to the absence of stated
    mechanics. Worth recording that having one qualifying environmental cell on the page made the comparison
    sharper rather than looser.
- text_locus: the two-encounter instruction, p177
  quoted_gist: one result instructs the reader to roll twice more and combine the results, rerolling that
    result if it comes up again
  why_considered: It is the only instruction on the page, and the stem scan flags it as matching rule_encounter.
  rejection_reason: The match is on the plain word encounters in the instruction's own text; M001 already
    carries the table's relation to rule_encounter. Declined in the same form in each of the seventeen
    preceding chapter packets.
- text_locus: the appended random encounter procedure and monster attributes, out of scope
  quoted_gist: the printed page 112 and 113 encounter procedure and the printed page 189 monster attributes
    page
  why_considered: Both are in the file and the first is the rule this table resolves.
  rejection_reason: Both are Supporting Source Context, outside the bounded scope. PKT-SD-112-113 is already
    integrated, so extracting from it would duplicate canonical rows and cite pages outside this packet's
    range.
non_edge_observations:
- id: OBS-01
  subject: the chapter's first CONSTRAINS row, and its first reach to vision
  detail: 'A cloud of mosquitoes whines, bites and obscures vision. M002 is the first CONSTRAINS row this
    chapter has produced and rule_vision''s first inbound row from anywhere outside printed pages 63,
    84 and 87.

    It completes a set. The chapter now has an EXCLUDES row from mountain weather that bars travel and
    a CONSTRAINS row from swamp insects that obscure vision, which are the unhedged and hedged halves
    of the same test settled at PKT-SD-114-114. Bars prevents; obscures impedes. Having both in one chapter,
    from environmental cells on terrain tables sixteen printed pages apart, is the clearest demonstration
    of that distinction the intake has produced.

    Measured for the polarity rather than chosen: canonical holds 76 CONSTRAINS rows and 76 of them carry
    governs, so the convention is uniform and the value is not a judgement I am making. 6 of those rows
    have a tbl_ source, so a table constraining a rule is an established shape.'
- id: OBS-02
  subject: offers, for sale, and bestows are three different things
  detail: 'The hundredth row has the Swamp Shambler offer a random magic item and it carries M004. The
    market cell one chapter packet earlier had the Wandering Merchant sell a random scroll and earned
    nothing. Both use a verb of presentation and only one qualifies, so the distinction is worth stating.

    A sale is a transaction: the cell states stock and a counterparty and says nothing about the party
    obtaining anything, because obtaining it would cost them something the cell does not mention. An offer
    with no price is availability, which is the limb the Integrator confirmed alongside active bestowal,
    and it sits between the sphinx bestowing on printed page 167 and the half-buried chest on 171 rather
    than outside them.

    The scroll also failed on category and on route, so this is not a reversal of that decline; it isolates
    which of its three grounds was about the verb. Recorded because the remaining four packets will each
    have a hundredth slot and the verbs in them will vary.'
- id: OBS-03
  subject: one qualifying environmental cell made the rest easier to refuse
  detail: 'This page has a mosquito cloud that obscures vision, and it has the usual bog scenery: sucking
    mud, insects, rotting logs. The first carries a row and the rest do not, and the comparison on a single
    page is sharper than the comparison across packets has been.

    The chapter has now had three pages where an environmental cell earned a row while its neighbours
    did not: arctic weather dealing damage beside inert blizzards elsewhere, mountain weather barring
    travel beside an eruption raining lava, and this one. In each case the qualifying cell names a rule
    the graph holds and says what happens to it, and the others state presence. Recorded because it is
    the same test as the trap boundary in a different clothing, and because fourteen loci have now lost
    rows to the absence of stated mechanics, which is worth a total rather than another instance.'
