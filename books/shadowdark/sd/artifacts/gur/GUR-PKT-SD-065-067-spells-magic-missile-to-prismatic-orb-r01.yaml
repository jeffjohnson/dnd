page_attribution_basis: 'Two markers resolve this packet: p66 ends the PASSWALL heading and p67 ends POLYMORPH.
  Placement rule 1 applies each to its whole heading and the persistence rule carries it forward, giving
  p66 to PASSWALL, PILLAR OF SALT and PLANE SHIFT, and p67 to POLYMORPH, POWER WORD KILL and PRISMATIC
  ORB.

  MAGIC MISSILE, MASS CURE, MIRROR IMAGE and MISTY STEP precede the first marker. SOURCE_MARKDOWN gives
  such content no resolved page unless packet metadata supplies an independent authoritative locator,
  and the claimed manifest supplies one under leading_content_page_resolution: a page''s first heading
  carries that page''s marker throughout this intake, none of these four carries one, so none begins a
  page and all four continue the page before p66. That page''s identity is fixed independently of this
  file by the p65 marker inside PKT-SD-062-065, whose manifest records page_end 65 and whose final entry,
  MAGIC CIRCLE, immediately precedes MAGIC MISSILE alphabetically. The four entries are printed page 65.
  No page length was estimated and no line number was used.'
shared_page_note: 'Printed page 65 is cited by two packets: PKT-SD-062-065 holds MAGIC CIRCLE and this
  packet holds the four entries following it on the same page. This is the second mid-page split in the
  intake after the page 62 split, so it is now a recurring shape rather than an anomaly, and it should
  be expected wherever an operator line-range boundary falls inside a page. It does not breach the zero-overlap
  rule, which bars claiming the same source content, not citing the same printed page; no line, heading
  or sentence is claimed twice.'
scope_boundary: The bounded scope is the Primary Source Material section, the ten alphabetically sequenced
  entries from MAGIC MISSILE to PRISMATIC ORB. The trailing Supporting Source Context is out of scope
  and contributed nothing; its markers p44 through p53 and p86 were not used.
source_summary: Ten spell entries in alphabetical order, each a heading, a tier and class line, a duration
  line, a range line and effect prose. Magic Missile grants advantage on its own casting check and deals
  damage. Mass Cure heals all nearby allies. Mirror Image creates duplicates, counted from the caster's
  level, that absorb attacks until none remain. Misty Step teleports the caster a short distance. Passwall
  opens a tunnel through a barrier. Pillar of Salt turns a target to salt and becomes permanent if focus
  is held. Plane Shift moves the caster and willing creatures to another plane. Polymorph transforms a
  creature, with reversion at reduced hit points. Power Word Kill slays a creature, and a failed casting
  becomes a critical failure whose mishap is rolled with disadvantage. Prismatic Orb deals energy damage,
  doubled when the chosen energy is anathema to the target.
graph_state_at_extraction: 'Read from the repository at extraction, not recalled: the canonical graph
  holds 243 registry rows and 405 edges, with 53 spell_ identities canonical and 26 CLASSIFIED_AS rows
  in production from INT-20260926-002 and -003. None of the ten entries in this packet exists yet. The
  canonical edge set was loaded so every proposed row could be checked against the section 4 assertion
  key.'
classification_basis: 'Tier and casting class are extracted for every entry from its own header line and
  from nothing else, using the two forms constitution section 2.4 authorizes for spells: spell_ to a tier
  value with aspect spell tier, exactly one per spell, and spell_ to class_wizard or class_priest with
  aspect casting class, one or more. Ten tier rows and eleven class rows result; Plane Shift is the only
  entry naming both classes.

  This packet is the first to use all five tier values. rule_spell_tier_4, canonical since the scaffold
  but unreferenced until now, gains its first three users in Passwall, Pillar of Salt and Polymorph. The
  four spell packets published before CLASSIFIED_AS existed, PKT-SD-054-056 through PKT-SD-061-062, still
  owe classification successors and are unaffected by this GUR.'
