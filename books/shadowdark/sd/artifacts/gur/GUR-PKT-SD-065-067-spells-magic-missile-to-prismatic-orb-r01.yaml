authored_polarity_declaration: Authored polarity appears on nine rows and no others, each with basis read
  as invariant 15 requires, and each is a MODIFIES, TRIGGERS or CONSTRAINS row as constitution section
  5 allows. The three CONSTRAINS rows take governs. Magic Missile, Mass Cure, Misty Step and Plane Shift
  take improves; Polymorph's reversion takes worsens. Magic Missile, Prismatic Orb's base damage, Prismatic
  Orb's anathema row and Power Word Kill's critical failure take inflicts. The 21 CLASSIFIED_AS rows and
  the four FEEDS_INTO, one EXCLUDES and one GATES row carry none, since section 5 derives those.
domains_touched: []
candidate_domains:
- proposed: magic
  basis: Every entry belongs to the spell machinery. Recorded as a candidate only, consistent with the
    five spell packets already published; constitution section 8 reserves domain promotion to an Architect
    Decision.
domain_boundary_questions: []
candidate_general_rules: []
candidate_general_rules_note: None proposed. The classification rows repeat two shapes across ten entries,
  but they enumerate per-entry source facts rather than instancing a rule, and the Analyst is prohibited
  from promoting a general rule.
non_edge_observations:
- id: OBS-01
  subject: magnitudes are excluded from every row
  detail: Every quantity in this packet stays in the source. Magic Missile, Mass Cure and Prismatic Orb
    state dice expressions; Prismatic Orb states a multiplier for anathema energy; Mirror Image derives
    its duplicate count from half the caster's level with a floor; Polymorph bounds an unwilling target
    at half the caster's level and reverts at a fraction of hit points; Pillar of Salt and Power Word
    Kill bound a target by level; several entries state durations in rounds. The rows carry the relationship
    and the constraint only. Where a magnitude is the whole of a fact, as with Prismatic Orb's doubling,
    the row records that the relationship exists and is conditioned, not its size.
- id: OBS-02
  subject: Passwall yields no mechanical row
  detail: 'Passwall opens a tunnel in a barrier. There is no canonical barrier, wall, door or tunnel identity,
    and minting one would create an identity the source does not define as a mechanic. Passwall therefore
    contributes its two classification rows and nothing else. This matches Knock in PKT-SD-062-065, which
    had the same shape for the same reason, and the two together suggest a real gap: the rulebook repeatedly
    acts on physical obstacles the graph has no way to name. Recorded, not worked around.'
- id: OBS-03
  subject: the specific mishap table is not selected
  detail: 'Power Word Kill says a failed casting is a critical failure whose mishap is rolled with disadvantage.
    Three mishap tables are canonical, tbl_wizard_mishaps_tier_1_2, tier_3_4 and tier_5, and the rule
    that selects among them by tier is already in production from PKT-SD-043-050. Since this is a tier
    5 wizard spell the tier 5 table follows, but that conclusion is mine by applying the selection rule,
    not the entry''s statement, so no row asserts it. The two rows asserted are what the entry does say:
    it triggers critical failure on a failed check, and disadvantage feeds its mishap roll. A reader who
    wants the table follows the tier classification and the existing selection row, which is exactly what
    the tier scaffold was built to make possible.'
- id: OBS-04
  subject: advantage is asserted twice, deliberately
  detail: 'Magic Missile grants advantage on its own casting check, which is two facts: the spell improves
    that check, and Advantage is the named rule supplying the improvement. Both are asserted, as MODIFIES
    from the spell to rule_spellcasting_check and as FEEDS_INTO from rule_advantage to the spell. This
    follows the settlement in REV-GUP-PKT-SD-062-065-spells-illusion-to-magic-circle-r01-r01, which required
    exactly this pairing for Illusion: the constraint and the rule supplying its threshold each get a
    row, so a change to the supplying rule reaches the spell. Applied here at extraction rather than waiting
    for the same correction.'
- id: OBS-05
  subject: planes, allies and creature types are not proposed
  detail: Plane Shift moves creatures to another plane, Mass Cure heals allies, Polymorph turns a target
    into a natural creature and Prismatic Orb names an energy type with a fire elemental as the source's
    own example. None is proposed. There is no canonical plane, ally, creature-type or energy-type identity,
    these are categories rather than named mechanics, and taxonomy-only membership stays outside the graph
    under constitution section 2.4. This matches OBS-06 of PKT-SD-062-065.
- id: OBS-06
  subject: Mirror Image's level input is FEEDS_INTO, not CONSTRAINS
  detail: 'Three entries here bound a target by level and take CONSTRAINS, which bounds without changing
    a value. Mirror Image is different: the caster''s level is not a bound on the spell but the input
    its duplicate count is computed from, so it takes FEEDS_INTO. The distinction is deliberate and worth
    checking, because both shapes read as level mattering to a spell and they answer different questions.'
- id: OBS-07
  subject: Pillar of Salt's permanence is a gate, not a duration
  detail: Focus appears twice for this entry. Once as the sustained duration, matching every other Focus
    spell in production, and once as a gate on the permanent transformation, because the entry states
    that sustaining focus for a stated number of rounds makes the change permanent. The two rows differ
    in type and aspect and so are distinct under the section 4 assertion key. The number of rounds is
    a magnitude and is not stored; the condition names the circumstance instead.
unresolved_identity_questions:
- id: IDQ-01
  subject: whether Prismatic Orb's anathema row should exist at all
  detail: 'The entry says the orb deals doubled damage when the chosen energy is anathema to the target.
    The whole content of that fact is a multiplier, which no field may store, so the row asserted carries
    only that damage is conditionally modified and names the circumstance. A Reviewer could hold that
    a row whose only substance is an excluded magnitude should not be asserted, and that the base damage
    row plus the source text suffices.

    I asserted it because the conditional relationship is itself a mechanical fact, a reader querying
    what changes Prismatic Orb''s damage should find something, and the alternative silently drops a stated
    rule. Consequence if wrong: one row is withdrawn and nothing else changes. Flagged rather than decided
    quietly.'
architectural_escalations: []
architectural_escalation_note: 'None raised. Every identity uses an approved prefix, every row uses a
  legal edge type, and the 21 classification rows use only the two authorized spell forms with the exact
  aspects section 2.4 names. No new prefix, edge type, domain promotion or general rule is requested.
  Three limits are recorded rather than questioned: physical obstacles have no identity, OBS-02; the mishap
  table is reachable through the tier classification rather than asserted, OBS-03; and category nouns
  stay out of the graph, OBS-05. IDQ-01 is a question for the Reviewer about one row, not an Architect
  matter.'
completeness_statement: All ten entries in the bounded scope were read at the recorded checksum and each
  produced at least its classification rows. The packet yields 10 spell identities, 18 mechanical rows
  and 21 classification rows, 39 rows in total, every one checked against the 405 canonical edges for
  an assertion-key collision before publication; there are none. Seventeen canonical identities are reused
  rather than re-proposed, verified against the registry at extraction. All five tier values are referenced
  for the first time in a single packet. What is deliberately not asserted is listed as OBS-01 through
  OBS-07, and the single open question is IDQ-01. No assertion depends on any other ruleset.
