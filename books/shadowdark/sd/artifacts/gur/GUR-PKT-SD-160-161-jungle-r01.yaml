architectural_escalation_note: None raised. The one proposed identity uses an approved prefix, every row
  uses a legal edge type at status core, no row carries supersession_basis and none is an OVERRIDES, and
  no CLASSIFIED_AS row appears. The authority list omits the nonexistent Shadowdark DEC-2026-0003; registry
  authority for this ruleset is constitution section 2, as recorded in GUR-PKT-SD-142-143-arctic-r01.
completeness_statement: 'Both printed pages in scope were read in full at the recorded checksum: 1 named
  table, 50 data rows, 0 sentences of prose. The packet yields 1 new identity and 3 rows, reusing 3 canonical
  identities whose labels the building script asserted equal to the registry. The proposed table carries
  edges, so nothing is left unattached.

  Every row was checked against the 800 canonical edges for an assertion-key collision, for a shared source,
  type and target under a different aspect, and for duplicates within the patch; there are none of any,
  and no canonical row cited either page before. The script locates the supporting cell for each row and
  asserts its page, which matters because the page break falls inside the table.

  7 candidates were rejected and each is recorded with its reason. The largest deliberate loss is the
  creature and scene content, which belongs to the unextracted monster chapter or states no mechanic at
  all. 6 of the 11 apparent registry references in the cells are spurious collisions with ordinary English,
  measured rather than filtered by eye. No assertion depends on any other ruleset.'
trap_cells_note: 'Three cells bear on M002, at row indices 12, 38 and 26 of 50, and they sit at three
  different strengths under the test settled at the desert overturn.

  Index 12 reads that Bloodspear tribe lizardfolk check net traps for game. It names traps and carries
  the row.

  Index 38 reads that javelins shoot from the mouth of a hulking stone statue. No form of the word trap
  appears, and it states an operation, so it qualifies on the same ground as the desert bone-barbed nets
  and the forest tripwire.

  Index 26 reads that flimsy reeds and grass cover a swarm of snakes in a pit. It states concealment and
  no operation, which is the shape declined for the grassland boulders one packet before last.

  One row is written because all three support the same five-field assertion key, so a second would be
  a duplicate. Nothing here turns on grading the weaker two, and the row is cited to the named cell.'
measured_figures_note: Figures quoted in this artifact's prose are computed by the building script from
  the claimed source, not read off the page. For this packet that includes the trap cell indices [12,
  26, 38], the crawler cell indices [19, 36] and their separation of 17 rows, the rival stem matching
  exactly 1 cell, and the sleep cell at index 22. The previous packet quoted a cell separation that was
  typed rather than computed and was wrong; see OBS-03.
