rejected_candidates:
- text_locus: the creature results across the table, pp160 and 161
  quoted_gist: a medusa, a T-Rex, viperians, lizardfolk, a kobold sorcerer, a panther, a gorilla, drow
    in four cells, giant scorpions, stingbats, giant frogs, velociraptors, a forest dragon, a troll, zombies,
    a brachiosaurus, pterodactyls, a drider, faeries, a giant snake, spiders, giant centipedes, crocodiles,
    berserkers, a basilisk, a naga, a cyclops, a sphinx and the Wandering Merchant
  why_considered: Two carry statistics in parentheses, a giant zombie given as triple level and damage,
    and one is individually named, Doctor Bartom Halsy.
  rejection_reason: A creature's defining locus is its stat block in the unextracted monster chapter and
    the registry holds no monster_ identity. The zombie's parenthetical is a modifier on that creature
    rather than a rule, and both its terms are magnitudes. Tenth packet running for the same disposition.
- text_locus: the sleep-inducing flowers, p160
  quoted_gist: heady, perfumed flowers lull creatures into a deep sleep
  why_considered: spell_sleep is canonical and the registry scan matched it here, and this packet does
    assert a row to a spell on a neighbouring page, so the shape looked available.
  rejection_reason: 'It is the precise complement of the high district row and the distinction is the
    one the Integrator affirmed on that packet. There, the source says a malfunctioning ward casts web,
    so the row records a stated casting. Here nothing is cast: flowers have a scent and creatures fall
    asleep, with no caster, no spell named and no check. A row would fabricate a casting, which is exactly
    why pointing tbl_traps at spell_sleep, spell_blind_deafen and spell_confusion was rejected at the
    traps packet. Recorded as OBS-02.'
- text_locus: the zombies that were formerly crawlers, p160
  quoted_gist: zombies described in parentheses as former crawlers
  why_considered: The crawler stem matches, and this packet carries a rival crawler row from another cell,
    so consistency had to be checked rather than assumed.
  rejection_reason: The qualifier rival is absent and crawler alone is this book's generic word for an
    adventurer. The cell is also about what the zombies used to be, not about a party being encountered.
    Same disposition as the castle district cell on printed page 147 and the guild crawlers on 158; this
    is its fifth application.
- text_locus: the quicksand, the pit and the other hazards, pp160 and 161
  quoted_gist: a patch of muddy ground that is a pool of quicksand, an arm jutting from a dark pool of
    it, biting ants pouring across the ground, carnivorous flowers flinging poisonous darts
  why_considered: rule_hazards is canonical and quicksand is the plainest hazard the chapter has produced,
    appearing in two separate cells.
  rejection_reason: No cell states a check, a die, a duration or a consequence, and the word hazard does
    not appear on the page. The flowers flinging darts are a creature acting, not a device, so they do
    not reach rule_traps either. Eighth locus to lose rows to the absence of stated mechanics for dangerous
    scenery.
- text_locus: the healing salves, p161
  quoted_gist: a wandering mushroomfolk mystic offers healing salves
  why_considered: rule_hit_points is canonical and took a row from the deep tunnels table for motes that
    heal a stated amount.
  rejection_reason: No amount, no check, no acceptance and no item identity for a salve. This is the third
    offer of healing in the chapter, after a lost priest on printed page 151 and a Reverend Sister on
    159, and all three are declined on the same ground.
- text_locus: the two-encounter instruction, p161
  quoted_gist: one result instructs the reader to roll twice more and combine the results, rerolling that
    result if it comes up again
  why_considered: It is the only instruction on the page, and the stem scan flags it as matching rule_encounter.
  rejection_reason: The match is on the plain word encounters in the instruction's own text; M001 already
    carries the table's relation to rule_encounter. The rest is arithmetic on the table's own roll. Declined
    in the same form in each of the nine preceding chapter packets.
- text_locus: the appended random encounter procedure and monster attributes, out of scope
  quoted_gist: the printed page 112 and 113 encounter procedure and the printed page 189 monster attributes
    page
  why_considered: Both are in the file and the first is the rule this table resolves.
  rejection_reason: Both are Supporting Source Context, outside the bounded scope. PKT-SD-112-113 is already
    integrated, so extracting from it would duplicate canonical rows and cite pages outside this packet's
    range.
non_edge_observations:
- id: OBS-01
  subject: three cells bear on the trap row and they sit at different strengths
  detail: 'Net traps checked by lizardfolk name the thing outright. Javelins shooting from the mouth of
    a stone statue state an operation with no noun, which is the shape the Reviewer settled at the desert
    overturn. Flimsy reeds and grass covering a pit of snakes state concealment but no operation, which
    is the shape I declined for the grassland boulders.

    One row is written and the named cell carries it, so nothing in this packet turns on grading the other
    two. Recorded because the three appear together and make the scale visible in a way no single page
    has yet: named, operation stated, concealment only. The middle case is the one the overturn added,
    and having it on the same page as the other two is the clearest evidence I have that the settled test
    sits where it should.'
- id: OBS-02
  subject: the complement of the high district spell row, one page later
  detail: 'Last packet a malfunctioning ward casts web on the characters and earned the intake''s first
    causal table-to-spell row. This page has perfumed flowers that lull creatures into a deep sleep, and
    spell_sleep is canonical, and it earns nothing.

    The difference is the whole of the distinction the Integrator affirmed. There a caster and a named
    spell are stated, so the row records a casting the source asserts. Here there is a scent and an outcome,
    with no caster, no spell named and no check, so a row would fabricate a casting. It is the same reasoning
    that rejected pointing tbl_traps at spell_sleep, spell_blind_deafen and spell_confusion at the traps
    packet, and I checked that neither tbl_traps nor tbl_hazards points at any spell_ identity today,
    so that boundary is still intact. Having the two cases one page apart is worth recording, because
    the occurrence-versus-effect split will be tested constantly in the monster chapter.'
- id: OBS-03
  subject: a figure I asserted without computing, and the fix
  detail: 'In OBS-02 of the previous packet I wrote that the two crawler cells sat twelve rows apart.
    The Integrator measured the separation as thirty-one and was right: the cells are at row indices 3
    and 34. Nothing depended on it, no row or citation was affected, and the substantive point about the
    qualifier stands, but the figure was typed rather than computed, which is the one habit this intake
    is supposed to have no exceptions about, and I had been applying it to headline counts while letting
    a narrative distance through by eye.

    The fix is in the tooling rather than in resolve. The driver for this packet computes every figure
    that appears in its prose, including separations between cells, and the trap and crawler indices quoted
    above are all derived from located cells rather than read off the page. Recorded here rather than
    only corrected in a message, because the previous packet''s artifact is published and carries the
    wrong number.'
