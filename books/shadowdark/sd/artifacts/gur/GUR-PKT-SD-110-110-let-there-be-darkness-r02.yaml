page_attribution_basis: One marker resolves this packet. p110 ends the LET THERE BE DARKNESS heading,
  which is also the section's first heading, and placement rule 1 applies it to that whole heading while
  the persistence rule carries it across both subsections. All six rows cite printed page 110. No content
  precedes the marker and no page is shared.
scope_boundary: The bounded scope is the Primary Source Material section, the single printed page 110
  and its two subsections. The trailing Supporting Source Context is out of scope.
source_summary: 'One page in two halves. ATTACK THE LIGHT tells the GM that limited light duration is
  a main source of time pressure, that light sources should not be set-and-forget, and gives five bulleted
  ideas for imperilling them: put torches and lanterns at risk on random encounter tables, have enemies
  extinguish them, have opposing spellcasters dispel light spells, have the environment threaten them,
  and remember that dropping one may extinguish or break it. The LIGHT MISHAPS TABLE then gives six d6
  results, each naming a hazard and most calling for a Dexterity check at a stated difficulty: the source
  simply goes out, it flares and burns the holder for damage, wind or thin air blows it out, water hits
  it, falling debris covers it, or it sparks and sets flammable objects alight.'
graph_state_at_extraction: 'Read from the repository at extraction, not recalled: the canonical graph
  holds 304 registry rows and 642 edges. The registry was read in full and matched against what the page
  is doing. Measured facts that shaped this extraction: zero CLASSIFIED_AS rows currently point at rule_light_source;
  rule_light_source carries three rows, all from printed pages 84 and 90; item_torch carries two and item_lantern
  one, none of which is a classification; and spell_dispel_magic CONSTRAINS rule_spell_duration with aspect
  premature end is already canonical from printed page 59.

  Every proposed row was checked against the canonical edge set for an assertion-key collision and for
  the weaker case of a shared source, type and target under a different aspect; there are none of either.'
two_halves_note: 'The page''s two halves are treated differently on purpose. ATTACK THE LIGHT is advice,
  in the same class as the CORE ETHOS principles rejected in PKT-SD-101-109: it tells the GM what to do
  rather than stating what the rules are, and its five bullets are introduced as ''ideas''. It yields
  nothing, and each bullet is dispositioned in rejected_candidates.

  The LIGHT MISHAPS TABLE is not advice. It is a named d6 table whose entries state checks, difficulties,
  a damage figure and definite outcomes, and it is the first genuinely mechanical content in the Game
  Master half of the book. It yields all six rows.'
