authored_polarity_declaration: Authored polarity appears on three rows and no others, each with basis
  read as invariant 15 requires, and each is a MODIFIES, TRIGGERS or CONSTRAINS row as constitution section
  5 allows. The single CONSTRAINS row takes governs. The extinguishing row takes worsens, because the
  table degrades the light source's state. The Fire result takes inflicts. The two FEEDS_INTO rows and
  the RESOLVED_BY row carry none, since section 5 derives those.
naming_note: 'tbl_light_mishaps follows the naming of the three canonical wizard mishap tables, tbl_wizard_mishaps_tier_1_2
  and its siblings, which are the closest precedent in the registry. Those are named for the caster and
  tier they apply to; this one is named for what suffers the mishap, because the source titles it LIGHT
  MISHAPS TABLE and it applies to any light source rather than to a class of character.

  The shape of its rows also follows those tables: they are TRIGGERS targets of rule_critical_failure
  and receive a selection input, where this one is a RESOLVED_BY target of the thing it acts on. The difference
  is that a wizard mishap is triggered by a specific failure, while a light mishap is a procedure the
  GM turns to.'
