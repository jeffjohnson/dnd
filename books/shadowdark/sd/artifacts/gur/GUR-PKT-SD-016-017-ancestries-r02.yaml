page_attribution_basis: >-
  Two plain markers, both resolved through the Pandoc AST rather than positionally. {#p16} ends the
  DWARF heading and {#p17} ends the HALFLING heading, so under SOURCE_MARKDOWN placement rule 1 each
  whole heading starts on that page. Under the persistence rule ELF, GOBLIN and HALF-ORC inherit
  page 16 and HUMAN inherits page 17. Re-verified at extraction: the parser reports DWARF, ELF,
  GOBLIN and HALF-ORC with their benefit sentences on page 16, and HALFLING and HUMAN with theirs on
  page 17. No marker is malformed and no content in the bounded scope lacks a resolved page.

scope_boundary: >-
  Only the Primary Source Material section, printed pages 16 and 17, is in scope. The trailing
  Supporting Source Context reproduces printed page 15, whose primary packet is
  PKT-SD-015-015-stats-and-stat-modifiers. The parser confirms those spans resolve to page 15. No
  assertion in this GUR is drawn from them and no row in this GUR cites page 15.

source_summary: >-
  Printed pages 16 and 17 present six playable ancestries, each as a heading followed by a sentence
  of flavour description, a sentence naming the languages the character knows, and one bolded,
  separately named mechanical benefit. Page 16 also carries a closing epigraph. This summary is
  orientation only; every assertion below cites its page.

graph_state_at_extraction: >-
  The Shadowdark canonical graph is still empty. rulesets/shadowdark/registries/nodes.csv is
  header-only, domain_registry.yaml has no domains, general_rules.json is an empty object, and
  character_races.yaml remains inactive with an empty membership set. Constitution 1.2 section 2
  states that the empty character-race registry is not a gate on ancestry proposals, and section 2.1
  states that ancestry, class and creature identity are distinct. No canonical node exists to reuse,
  so reused_nodes is empty. Identically spelled IDs in adnd1e or basicdnd are unrelated identities
  under section 2 and were not consulted as authority.

