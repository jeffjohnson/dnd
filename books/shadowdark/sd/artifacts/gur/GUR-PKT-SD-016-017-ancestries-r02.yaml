    These IDs are referenced by edges below but are NOT proposed by this GUR. They are candidates in
    a sibling GUR that is published and Builder-ready but not approved or integrated, so they are
    not canonical and cannot appear in reused_nodes. They are listed so Builder and Reviewer can see
    the dependency explicitly and de-duplicate against that GUR rather than treat these as competing
    new proposals. If those identities change in review, the rows below that use them must follow.
  depends_on_gur: GUR-PKT-SD-011-014-character-overview-and-starting-level-r03
  depends_on_gur_checksum: sha256:746bb3b2481e649959f1cd2811d64ceb91d80a411a9a49b6307f61bc4ac58b6b
  identities:
    - id: rule_hit_points
      label: Hit Points
      used_by: M013, M014
      defining_locus: 'SD page 12, OVERVIEW, the HP entry'
    - id: rule_talent_roll
      label: Talent Roll
      used_by: M021
      defining_locus: 'SD page 13, talent rolls; SD page 14, one class talent roll'
    - id: sys_ancestry
      label: Ancestry
      used_by: none
      defining_locus: 'SD page 12, OVERVIEW, the ANCESTRY entry'
      note: >-
        Listed because constitution section 2.1 distinguishes the ancestry subsystem from its
        members and a reader will expect the relation. No edge here attaches a member to the axis;
        see IDQ-01 for why.

