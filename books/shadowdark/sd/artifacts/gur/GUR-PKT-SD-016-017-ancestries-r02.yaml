revision_reason: >-
  Revision 1 referenced rule_hit_points and rule_talent_roll from a sibling GUR under
  cross_gur_identities but did not propose them, so three rows, M013, M014 and M021, used an
  endpoint the patch itself did not propose. Builder's compile of the sibling packet showed that
  this exact shape is reported as endpoint_unresolved and fails invariant 1, because the
  cross_gur_identities block is an Analyst annotation the compiler does not read. This revision adds
  both identities to candidate_nodes so the patch proposes every endpoint it uses, and repoints the
  sibling dependency to that packet's current leaf. It was published before this packet was
  compiled, so no compile was wasted on the defect. No edge, aspect, condition, citation, polarity,
  status or reading changes, and no identity is renamed.

borrowed_identity_correction: >-
  Proposing these two identities here is not a competing naming and does not make this packet their
  defining locus. Both IDs and labels are reproduced exactly as
  GUR-PKT-SD-011-014-character-overview-and-starting-level-r03 proposes them from printed pages 12
  to 14, which remains the defining locus recorded on each node. Under SOURCE_MARKDOWN Source
  Identity Authority this packet's mentions of hit points and the talent roll are secondary: they
  support the relationships these two pages state, but they do not name concepts defined elsewhere.
  ESCALATION_CONTRACT states that a proposed node using an approved prefix and kind, passing
  identity and duplicate checks and isolable as a normal GUP registry addition, is ordinary Builder
  and Reviewer work rather than an Architect escalation. Where both patches propose the same
  identity, Reviewer de-duplicates and the Integrator applies one registry addition.
  sys_ancestry remains listed under cross_gur_identities and is deliberately not proposed here,
  because no edge in this GUR uses it; see IDQ-01.

unblocking_note: >-
  This packet was claimed and read in full, then held without a GUR because Shadowdark Constitution
  1.0 section 2 offered no prefix under which an individual ancestry identity could be formed, and
  every assertion on these two pages takes an ancestry as its source node. The Analyst escalated
  rather than mint a prefix. DEC-2026-0087 resolved that question and constitution 1.2 section 2.1
  now authorises the ancestry_ prefix, the ancestry kind, the six ancestry IDs below, and the six
  separately named abil_ benefit IDs below, naming this packet as their defining locus. Those
  identities are reproduced here exactly as section 2.1 states them. They remain ordinary candidate
  proposals requiring Builder normalisation and Reviewer approval; section 2.1 authorises the
  identity form, not the assertions, and explicitly does not register a node or approve an edge.

