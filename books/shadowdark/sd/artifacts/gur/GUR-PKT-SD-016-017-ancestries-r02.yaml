      resource, but the source names no resource identity, so no CONSUMES edge is drawn; see OBS-02.
  - ref: M021
    source_id: abil_ambitious
    source_label: Ambitious
    edge_type: MODIFIES
    target_id: rule_talent_roll
    target_label: Talent Roll
    aspect: roll count
    condition: at first level
    polarity: improves
    polarity_basis: read
    book: SD
    page: 17
    section: HUMAN
    evidence: explicit_rule
    pass: 1
    status: core
    supersession_basis: ''
    general_rule_id: ''
    review_flag: ''
    analyst_rationale: >-
      The benefit grants a further talent roll at first level. The number granted is a magnitude and
      is excluded; the level restriction is a qualitative applicability condition, not a threshold
      value, and is retained. rule_talent_roll is the identity proposed by
      GUR-PKT-SD-011-014-character-overview-and-starting-level-r03, which records that its own page
      14 states a first-level character receives one class talent roll; this row modifies that same
      mechanic rather than a second one. Read aloud as Ambitious improves Talent Roll.

authored_polarity_declaration: >-
  Seven rows carry authored polarity, all improves with basis read: M013, M014, M015, M016, M018,
  M019 and M021. Every one is MODIFIES, which constitution section 5 requires to carry
  source-reviewed authored polarity. Each was read aloud as source polarity target before being
  recorded, and each reading is stated in that row's analyst_rationale. No other row carries a
  polarity or polarity_basis value. The six GATES rows in M001 through M006, the GATES row M020 and
  the EXCLUDES row M017 take derived polarity enables and negates from the section 5 table, and the
  six FEEDS_INTO rows take derived neutral; the Analyst authors none of them. No row uses basis
  heuristic or unset.

domains_touched: []
candidate_domains:
  - proposed: character_creation
    basis: >-
      Ancestry is chosen while making a character and every benefit here is received at creation.
      Recorded as a candidate only; the Shadowdark domain registry is empty and constitution section
      8 reserves domain promotion to an Architect Decision. This is the second packet to suggest
      this candidate, which is noted but does not promote it: section 8 states a lone occurrence
      does not promote a domain, and the Analyst does not decide a candidate domain is official.

domain_boundary_questions:
  - >-
    Several benefits here reach into combat and spellcasting rather than character creation, so
    whether an ancestry benefit belongs to the creation domain, to the domain of the mechanic it
    modifies, or to both cannot be settled from these two pages. Deferred; no domain is asserted on
    any edge in this GUR.

candidate_general_rules:
  - proposed: every ancestry supplies the languages its character knows
    establishing_locus: 'SD pages 16 and 17, the You know the ... languages sentence in all six entries'
    basis: >-
      The sentence appears once per ancestry in identical shape, which is why M007 through M012
      repeat one form. If approved as a general rule it could replace those six explicit edges with
      derived applications, and would extend automatically to ancestries added by later source.
    not_applied: >-
      Recorded as a candidate only. Constitution section 5 requires a separate Architect ruling with
      an establishing locus, scope, counterexamples and affected set before a general rule exists,
      and section 2.1 states that no inherited general rule is created by the ancestry amendment. No
      edge in this GUR sets general_rule_id, and under invariant 19 the establishing edges would
      leave it empty in any case. The Analyst has applied nothing graph-wide.
  - proposed: every ancestry gates one separately named benefit
    establishing_locus: 'SD pages 16 and 17, the bolded benefit sentence in all six entries'
    basis: >-
      The same one-benefit-per-ancestry shape produces M001 through M006. Constitution section 2.1
      anticipates further source-defined ancestries using the same kind through normal workflow, so
      a rule here would cover them.
    not_applied: >-
      Recorded as a candidate only, on one packet of evidence, and deliberately not promoted. A
      later ancestry with two benefits or none would be a counterexample, and no packet yet read can
      rule that out. The Analyst does not promote a general rule.

non_edge_observations:
  - id: OBS-01
    subject: flavour sentences carry no mechanics
    detail: >-
      Each entry opens with a descriptive sentence, for example that dwarves carve stone kingdoms
      inside mountains or that elves see far and live long. Page 16 also closes with an epigraph
      about the Primordial Age and the flight of the gods. These establish setting, not mechanical
      dependency, and fail the impact test: changing them would require no other mechanic to be
      reviewed. No node or edge is proposed from any of them. The epigraph in particular names gods
      and kingdoms that are not mechanics on this page.
  - id: OBS-02
    subject: mechanics named in passing whose identity is deliberately not minted here
    detail: >-
      Three terms are used mechanically but not defined: advantage on the per-level hit point roll
      in Stout, the daily use limit and round duration in Stealthy, and the melee and ranged weapon
      categories in Mighty and Farsight. Advantage and the weapon categories are named resolution
      mechanics whose defining loci are later packets in this intake; asserting identities for them
      from an incidental mention would place them under the wrong packet's provenance, which
      SOURCE_MARKDOWN Source Identity Authority forbids. The use limit implies a finite per-day
      resource, but the source names no resource identity, so no CONSUMES edge is drawn. Each is
      instead carried in the aspect or condition of the row that needs it.
  - id: OBS-03
    subject: navigational page pointer in the Human entry
    detail: >-
      The Human entry cites printed page 32 for the additional common language. That is a reader
      pointer to a packet not claimed here, not a mechanical dependency between two named mechanics,
      and no identity on page 32 has been read. A CROSS_REFERENCES edge would need a target node
      this packet cannot supply. The pointer is recorded here so the packet that claims page 32 can
      assert the relation from its own defining locus.
  - id: OBS-04
    subject: magnitudes deliberately excluded
    detail: >-
      The pages carry a hit point bonus, two attack and spellcasting bonuses, an attack and damage
      bonus, a daily use count, a duration in rounds, a count of additional languages, a count of
      additional talent rolls and a level number. All are numeric bonuses, counts, durations or
      thresholds, excluded by constitution section 1 and invariant 11. They remain in the immutable
      claimed packet, which is the authority for the values themselves. No aspect in this GUR
      contains a digit, and the only condition that refers to a level, at first level in M021,
      states applicability rather than a threshold value.
  - id: OBS-05
    subject: supporting source context reproduces another packet's page
    detail: >-
      The trailing Supporting Source Context reproduces printed page 15, STATS and the STAT
      MODIFIERS TABLE, whose primary packet is PKT-SD-015-015-stats-and-stat-modifiers. The parser
      resolves those spans to page 15, outside this packet's declared span of 16 to 17. It is
      orientation only. No assertion here is drawn from it and no row cites page 15, so the
      zero-overlap scope rule across the intake holds for this packet.
  - id: OBS-06
    subject: the packet manifest declares constitution 1.0
    detail: >-
      packet.yaml for this packet records constitution_version 1.0 because it was written at claim,
      before DEC-2026-0087 and DEC-2026-0089. This GUR declares 1.2 and was validated against it.
      Constitution section 9 states that immutable packet manifests are not rewritten merely for an
      additive version bump, so the manifest is left exactly as published and the discrepancy is
      recorded here rather than repaired. It affects no assertion: the manifest's authority is over
      page attribution, source identity and composition, none of which changed between versions.

unresolved_identity_questions:
  - id: IDQ-01
    subject: no edge attaches an ancestry to the ancestry subsystem
    detail: >-
      sys_ancestry is proposed by GUR-PKT-SD-011-014 as the ancestry axis, and these six ancestries
      are its members. No edge here states that membership. The closed section 3 vocabulary has no
      membership type, and none of the thirteen expresses it without asserting something the source
      does not say: FEEDS_INTO would claim an ancestry supplies an input to the axis, and GATES
      would claim it is a precondition for the axis.
      The pairwise ALTERNATIVE_TO alternative was also rejected. Mutual exclusivity of the six is
      genuinely stated, but on printed page 14 as Choice of ancestry, which belongs to
      PKT-SD-011-014, not to these two pages. Asserting it here would take an assertion from another
      packet's locus, and fifteen pairwise rows would be a poor representation of one choice.
      Consequence if wrong: the graph will hold six ancestry nodes with no link to the axis node
      until a packet that states the relation is read, so a query for members of the ancestry
      subsystem returns nothing. The Analyst judged an absent edge better than an invented one.
      This is not an Architect escalation: it proposes no new type and asks for no ontology change.
      Reviewer should confirm the omission is right rather than assume it was an oversight.
  - id: IDQ-02
    subject: the language subsystem is analyst-named and its members are not proposed
    detail: >-
      sys_language has no source name. The six entries name individual languages, Common, Dwarvish,
      Elvish, Sylvan, Goblin and Orcish, but never name the axis, and the Human entry points to
      printed page 32 for the rest of the subject. No individual language identity is proposed here:
      there is no approved prefix whose kind clearly covers a language, and the defining locus is a
      packet not yet claimed, so minting six language identities from a list inside an ancestry
      entry would fix an ontology from the wrong locus.
      Consequence if wrong: if page 32 turns out to give the subsystem a source name, or to warrant
      an individual language identity, M007 through M012 would need their target repointed. That is
      a repoint of six rows with one identity, which is a cheaper correction than retracting six
      minted language nodes.
      This is not an Architect escalation under ESCALATION_CONTRACT: sys_ is an approved prefix with
      an unchanged kind, so the subsystem node is an ordinary registry addition. The question of
      whether languages need their own prefix is deferred to the packet that defines them, which
      will have the evidence this one lacks.
  - id: IDQ-03
    subject: five targets are named here but defined in packets not yet read
    detail: >-
      cbt_attack_roll, cbt_damage_roll, rule_spellcasting_check, rule_surprise and rule_invisibility
      are all reached by benefits on these pages, but none is defined here. Attack and damage rolls
      and spellcasting checks are named directly by the source; surprise and invisibility appear
      only as states, in you cannot be surprised and you can become invisible, and their IDs are
      Analyst-named from those states.
      Under SOURCE_MARKDOWN Source Identity Authority, an incidental mention supports the
      relationship stated in its own packet but does not name a concept whose defining mechanics
      belong to another source. These rows therefore assert the relationships this packet states
      while treating the identities as provisional. The Combat section on printed page 88 is the
      likely defining locus for the first two and surprise; invisibility and spellcasting checks
      belong to the spell rules.
      Consequence if wrong: the packet that defines each mechanic may use a different source spelling
      or split one of these into several identities, requiring a repoint. Builder and Reviewer should
      de-duplicate against those packets when they are read rather than accept these stems as
      settled, and the defining packet's name takes precedence over the stem proposed here.

