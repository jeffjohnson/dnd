completeness_statement: 'Both printed pages in scope were read in full at the recorded checksum: 1 named
  table, 50 data rows, 0 sentences of prose. The packet yields 1 new identity and 5 rows, reusing 5 canonical
  identities whose labels the building script asserted equal to the registry. The proposed table carries
  edges, so nothing is left unattached.

  Every row was checked against the 810 canonical edges for an assertion-key collision, for a shared source,
  type and target under a different aspect, and for duplicates within the patch; there are none of any,
  and no canonical row cited either page before. The script locates the supporting cell for each row and
  asserts its page, which matters because the page break falls inside the table.

  6 candidates were rejected and each is recorded with its reason. The largest deliberate loss is the
  creature and scene content, which belongs to the unextracted monster chapter or states no mechanic at
  all. 11 of the 18 apparent registry references in the cells are spurious collisions with ordinary English,
  measured rather than filtered by eye. No assertion depends on any other ruleset.'
travel_stoppage_note: 'M002 is the chapter''s first EXCLUDES row and the type was chosen against a close
  alternative, so it is argued here.

  The cell, at row index 0 of 50, states that a howling blizzard or thunderstorm bars travel for a stated
  number of days. Bars is unhedged: travel does not happen. EXCLUDES is defined as prevention and CONSTRAINS
  as bounding without changing a value, and the disposition settled at PKT-SD-114-114 is that a hedged
  prohibition is CONSTRAINS while an unhedged one is EXCLUDES. Nothing here is hedged, so EXCLUDES.

  The target is rule_overland_travel rather than ex_movement. The cell is on a terrain encounter table,
  the travel it bars is measured in days, and rule_overland_travel is the procedure printed page 90 defines
  for crossing the map, with hexes as its unit and days and hours as its clock. ex_movement is the local
  movement mechanic and is not what a multi-day blizzard stops.

  No polarity is written. EXCLUDES is not among the three types constitution section 5 reserves, and every
  one of the 24 canonical EXCLUDES rows carries negates at basis derived, so the value is Builder''s to
  derive.'
treasure_reach_note: 'M005 applies the category rule the Integrator affirmed, and this page also refuses
  it, so the two cells are set out together.

  M005 rests on row index 49 of 50: Rathgamnon the Sphinx flies in to bestow a magic item. It names the
  canonical category, item_magic_item, and states an acquisition, bestow, which is stronger than the dropped
  item in a gutter that carried the previous treasure row. item_magic_item already feeds rule_treasure
  on xp source from printed page 117, so the routing is the same and no direct table-to-item row is written.

  Row index 29 is refused: a fire dragon sleeps on a hill of coins encircled by lava. item_coin also routes
  to rule_treasure in canonical, on monetary value from the same page, so the path exists. What is missing
  is any acquisition; the coins are under a sleeping dragon. The rule is that the cell must name a category
  the graph routes to treasure and state that the party gets it, and only the first of those is present
  here.'
measured_figures_note: 'Figures quoted in this artifact''s prose are computed by the building script from
  the claimed source and the canonical files, and the finished document is checked for unsubstituted format
  specifiers before it is written. Located cells for this packet: the travel stoppage at index 0, the
  rival crawlers at 36, the luck token shrine at 45, the bestowed magic item at 49 and the dragon''s hoard
  at 29, of 50 rows. Canonical counts read at extraction: 24 EXCLUDES rows of which 0 have a tbl_ source,
  12 rows on rule_overland_travel, 5 inbound on rule_luck_token, 5 inbound on rule_treasure, 11 inbound
  on rule_rival_crawlers, 14 resolvers on rule_encounter, and 1 row from item_coin to rule_treasure.'
