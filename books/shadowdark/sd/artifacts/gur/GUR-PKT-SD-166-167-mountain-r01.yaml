rejected_candidates:
- text_locus: the dragon's hill of coins, p167
  quoted_gist: a fire dragon sleeps on a hill of coins encircled by lava
  why_considered: 'item_coin is canonical and, unlike the spell scroll declined one packet ago, it does
    have a canonical path to treasure: item_coin FEEDS_INTO rule_treasure on monetary value at printed
    page 117. So the third of the three grounds that refused the scroll is satisfied here, and a dragon
    on a hoard is the most treasure-like image in the chapter.'
  rejection_reason: 'The second ground fails and it is decisive. Nothing is acquired: the coins are under
    a sleeping dragon behind a ring of lava, and the cell states no taking, no offer and no find. The
    magic item two rows later is bestowed on the characters, which is why that one carries a row and this
    one does not. Recorded as OBS-02, because having the permitting and restraining cases on one page
    is the clearest statement of the rule the chapter has produced.'
- text_locus: the creature results across the table, pp166 and 167
  quoted_gist: goblins in four cells, a goat giant, a manticore, a wyvern, hobgoblins, dwarf bandits,
    a troll, salamanders, bats, pyromancers, fire giants, orcs, a frost giant, harpies, a mountain lion,
    a reaver, a will-o'-wisp, berserkers, an ettercap, beastmen, a nightmare, apes, a fire dragon, a cyclops,
    a roc, hell hounds, a minotaur, a sphinx and the Wandering Merchant
  why_considered: Four are individually named, Braaqul the hobgoblin spy, Skaldor the troll, Hiraldo the
    Swordsman and Rathgamnon the Sphinx, and the last of these appears in the cell that carries a row.
  rejection_reason: A creature's defining locus is its stat block in the unextracted monster chapter and
    the registry holds no monster_ identity. Rathgamnon earns nothing himself; his cell earns a row because
    it states that a magic item is bestowed, and the row is sourced from the table rather than from him.
    Twelfth packet running for the same disposition.
- text_locus: the geological and weather catastrophes, pp166 and 167
  quoted_gist: a boulder breaking loose into an avalanche, an earthquake unleashing landslides, a volcanic
    eruption raining ash, hot gas and lava, a stack of logs tumbling down the slopes, apes rolling rocks
    at creatures below
  why_considered: These are the most destructive scenes in the chapter, and one cell on this very page
    does earn a mechanical row from weather, so the page proves the category is capable of it.
  rejection_reason: That is exactly why the contrast is worth stating. The blizzard cell says weather
    bars travel, which is a stated effect on a canonical procedure. An eruption that rains lava states
    no check, no die, no duration and no effect on any rule; it describes what the characters see. Eleventh
    locus to lose rows to the absence of stated mechanics for dangerous scenery, and the first where a
    sibling cell on the same page shows what stating one looks like.
- text_locus: the ettercap's web funnel and the trapped peasant, pp166 and 167
  quoted_gist: an ettercap spins a funnel of webs over a narrow ravine, and a peasant lies with a leg
    trapped beneath a fallen boulder
  why_considered: A funnel of webs spun across a ravine is a concealed structure that catches things,
    which is close to the tripwire and net cells that earned rule_traps rows, and the second cell contains
    the word trapped.
  rejection_reason: The web is a creature's own body product and the ettercap is present, so it is the
    creature acting rather than a placed device operating, which is the agency distinction recorded at
    printed page 163. Trapped beneath a boulder is the ordinary English sense, describing a peasant pinned
    by a rock, with no device, no concealment and no trigger. Neither reaches rule_traps.
- text_locus: the two-encounter instruction, p167
  quoted_gist: one result instructs the reader to roll twice more and combine the results, rerolling that
    result if it comes up again
  why_considered: It is the only instruction on the page, and the stem scan flags it as matching rule_encounter.
  rejection_reason: The match is on the plain word encounters in the instruction's own text; M001 already
    carries the table's relation to rule_encounter. The rest is arithmetic on the table's own roll. Declined
    in the same form in each of the twelve preceding chapter packets.
- text_locus: the appended random encounter procedure and monster attributes, out of scope
  quoted_gist: the printed page 112 and 113 encounter procedure and the printed page 189 monster attributes
    page
  why_considered: Both are in the file and the first is the rule this table resolves.
  rejection_reason: Both are Supporting Source Context, outside the bounded scope. PKT-SD-112-113 is already
    integrated, so extracting from it would duplicate canonical rows and cite pages outside this packet's
    range.
non_edge_observations:
- id: OBS-01
  subject: the chapter's first EXCLUDES row, and its first reach to the travel rule
  detail: 'A howling blizzard or thunderstorm bars travel for a stated number of days. That is the first
    cell in thirteen chapter packets to state an effect on a canonical procedure rather than on a character,
    and M002 is the chapter''s first EXCLUDES row.

    Measured rather than recalled: canonical holds 24 EXCLUDES rows and 0 of them have a tbl_ source,
    so a table excluding a rule is a new shape for the graph as well as for this chapter. rule_overland_travel
    carries 12 rows, all from printed page 90, and every one is an input to it or an output from it; this
    is its first exclusion.

    The duration is lost, as durations always are, so the graph will say that mountain weather prevents
    overland travel without saying it lets up. That is the fourth expressiveness gap recorded at PKT-SD-136-137
    showing up again, and it is the first time it has cost precision on a prevention rather than on a
    bonus.'
- id: OBS-02
  subject: the treasure rule permits and refuses on one page
  detail: 'Two cells on printed page 167 name a canonical category the graph routes to treasure. A sphinx
    flies in to bestow a magic item, and a fire dragon sleeps on a hill of coins. The first carries M005
    and the second earns nothing.

    The difference is acquisition, not category and not path. Both categories route to rule_treasure in
    canonical, item_magic_item on xp source and item_coin on monetary value, both from printed page 117,
    so the third ground that refused the spell scroll one packet ago is satisfied by both cells here.
    What separates them is that the sphinx gives the item to the characters while the coins lie under
    a sleeping dragon behind a ring of lava, with no taking, offer or find stated.

    Recorded because the rule has now been applied permissively twice and restrictively twice, and this
    is the first page carrying one of each. A reader wanting to know what the disposition actually is
    can read these two cells and needs nothing else.'
- id: OBS-03
  subject: a real mention the scans cannot reach, because the label is longer than the cell
  detail: 'One cell reads that a shrine to Madeera grants a luck token for an offering. The canonical
    identity is deity_madeera_the_covenant, label Madeera the Covenant, and neither scan matches it: both
    require every word of the label to be present and the cell has one of three.

    This is a third distinct way the scans miss, after inflection at printed page 149 and the reordered
    rival crawling party at 157. Here the source shortens a name the registry stores in full. The cell
    earns no deity row in any case, because a shrine to a god is not the god, which is the name-collision
    reading settled at printed page 125, so nothing was lost this time. Recorded because the next long-labelled
    identity may matter: the registry holds deities and abilities whose labels are two and three words,
    and a source that abbreviates any of them is invisible to both scans.'
