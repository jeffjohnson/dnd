rejected_candidates:
  - text_locus: 'CONTENTS, p2 and p3'
    quoted_gist: >-
      a two-page index naming roughly one hundred sections, among them Stats, Ancestry, Fighter
      Class, Priest Class, Thief Class, Wizard Class, Background, Alignment, Deities, Titles,
      Languages, Gear, Level Advancement, Casting Spells, Wizard Mishaps, Luck Tokens, Making Checks,
      Turn Order, Crawling, Resting, Stealth and Surprise, Combat, Carousing, Traps, Hazards,
      Awarding XP and Monster Attributes, each against a printed page number
    why_considered: >-
      This is by far the largest concentration of mechanical vocabulary in the packet and names most
      of the subsystems the finished graph will contain. A naive extraction would mint on the order of
      a hundred identities from it in one pass, and several of the names match identities sibling
      GURs have already proposed, which could make the list look like corroboration.
    rejection_reason: >-
      A table of contents is navigation, not rules. It states no procedure, no precondition and no
      dependency between any two mechanics; it states only that a section with a given name begins on
      a given printed page. Every row fails the core test identically, because striking a contents row
      would require no mechanic to be reviewed. Constitution section 1 states that source layout and
      document metadata are not graph mechanics, and section 6 requires a citation to name the page
      that carries the assertion, which for every one of these names is a later page in another
      packet.
      Minting identities here would also breach SOURCE_MARKDOWN Source Identity Authority in the most
      direct way available: a contents row is the purest possible secondary listing, so it cannot name
      a concept whose defining mechanics belong to another page, and the spelling in an index is
      chosen for the index. Each of these concepts must be proposed from its own defining locus by the
      packet that claims that page, and several already have been.
  - text_locus: 'ART, p1'
    quoted_gist: 'eight named artists, each followed by the printed pages they illustrated'
    why_considered: >-
      The page lists are the only place in the book that enumerates which printed pages are artwork,
      so they could be read as bearing on page classification or on which pages hold no content.
    rejection_reason: >-
      An attribution of authorship, not a mechanic, and not a page classification either. Page
      classes are declared only by the source steward on the identified page under SOURCE_MARKDOWN
      1.8; an artist credit listing page 108 is not a steward declaration about page 108, and treating
      it as one would let the Analyst classify pages it has never read. The lists name no game concept
      at all.
  - text_locus: 'LEGAL, p1'
    quoted_gist: >-
      printed in China, not for resale or redistribution, permission to copy for personal use,
      copyright 2023 The Arcane Library, and The Arcane Library and Shadowdark trademarks
    why_considered: >-
      Considered only for completeness, since every block on an in-scope page must be accounted for,
      and because the trademark and copyright lines interact with the third-party licence that the
      back-matter packet also declined to extract.
    rejection_reason: >-
      Printing, copyright, permission and trademark statements concern publication rights between a
      publisher and a reader. They identify no game mechanic, so there is no ordered pair to assert,
      and they fail the core test completely. This is the same disposition the back-matter packet
      reached for the licence text on printed page 325, reached independently here from this page.
  - text_locus: 'SHADOWDARK title heading and WRITING, DESIGN, LAYOUT, p1'
    quoted_gist: 'the book title and the name of its writer and designer'
    why_considered: 'Read for completeness; the title is the work name and could be mistaken for a source identity.'
    rejection_reason: >-
      The book identity already exists as registry data, not as graph content: book sd with citation
      code SD is registered in rulesets/shadowdark/registries/books.yaml and source sd-steward-intake
      in sources.yaml. Constitution section 2 admits no prefix for a book, an author or a publisher,
      and section 1 excludes document metadata. Nothing here is a mechanic.

non_edge_observations:
  - id: OBS-01
    subject: the packet is front matter and yields nothing by its nature
    detail: >-
      The claim manifest recorded the packet's shape and deliberately declined to answer whether any
      of pages 1 through 4 yields a graph-constitutable mechanic, leaving that to extraction. This GUR
      answers it: none does. Two pages are steward-classified artwork, one page is a title, credit and
      legal block, and two pages are an index. Every element that named a game concept is enumerated
      in rejected_candidates with its locus and reason, so the emptiness is auditable rather than
      asserted. This is the expected outcome for this material, not a source defect, and no page needs
      to be returned to the steward for correction on this ground. The page-1 class discrepancy
      recorded above is a separate intake question and is not an extraction defect.
  - id: OBS-02
    subject: the contents table is a useful planning artifact and should not be mistaken for one
    detail: >-
      Recorded because the temptation will recur. The contents list is the best available map of what
      the remaining intake contains and of which printed pages carry which subsystem, and a reader may
      reasonably consult it to understand the book's shape. It must not become evidence. Constitution
      section 6 states that other sources cannot resolve a Shadowdark ambiguity, and the same logic
      applies within the book: an index entry cannot settle a spelling, an identity, a page
      attribution or a dependency that belongs to the page it points at. In particular, an index
      spelling must never be preferred over the spelling at a concept's defining locus, and the page
      numbers here are the index's own claims, not page markers under SOURCE_MARKDOWN.
  - id: OBS-03
    subject: two steward-classified artwork pages bound this packet
    detail: >-
      Pages 1 and 4 both carry full-page-artwork. Restated here so the completeness accounting below
      is readable on its own: both remain in the declared span, contribute no graph content, and
      create no obligation. The Analyst neither authored the classifications nor treated either as
      licence to skip a page that in fact holds content. The AST confirms both Divs are empty; the
      separate question of the text also attributed to page 1 is recorded in
      page_class_content_discrepancy.
  - id: OBS-04
    subject: no magnitudes are present to exclude
    detail: >-
      Recorded for symmetry with the other Shadowdark GURs, which each account for the magnitudes
      they deliberately dropped. This packet contains many numerals, but every one is a printed page
      number in a contents row or an artist credit, or a year in a copyright line. None is a game
      value, die expression, bonus or threshold, so constitution section 1 and invariant 11 exclude
      nothing here that a reader might otherwise expect to find represented.
  - id: OBS-05
    subject: packet wrapper is intake metadata
    detail: >-
      The supplied file opens with an intake wrapper naming the packet and a shadowdark.md line range
      ahead of the Primary Source Material heading, so the parser reports four blocks preceding the
      first resolved page. The claim manifest is the independent page locator that SOURCE_MARKDOWN
      Attribution Rules requires for such content, and it records that the wrapper contains no
      rulebook prose, heading or marker. The condition is identical in kind to the other packets
      claimed from this intake and strands no source content.

architectural_escalations: []
architectural_escalation_note: >-
  None raised. An empty extraction is not an architectural question. ESCALATION_CONTRACT states that
  an unsupported edge should simply be rejected rather than escalated, and every candidate here was
  considered and rejected on the ordinary core test; a packet in which every candidate is rejected is
  that routine outcome repeated, not a governance matter. No new prefix, edge type, domain promotion,
  general rule or identity migration is requested, and no constitution or registry change is
  proposed. The page-1 class discrepancy is an intake matter for the source steward under
  SOURCE_MARKDOWN, which ESCALATION_CONTRACT explicitly excludes from Architect escalation, and it
  blocks nothing because this packet asserts nothing.

completeness_statement: >-
  All four printed pages in the declared span are accounted for. Pages 1 and 4 are the steward's
  full-page-artwork pages. Page 1 additionally carries the SHADOWDARK title heading, the WRITING,
  DESIGN, LAYOUT credit, the ART block with all eight named artists and their complete page lists,
  and the four-line LEGAL block, all of which were read. Pages 2 and 3 carry the CONTENTS heading and
  the complete table of contents, every row of which was read, from the Introduction row through the
  Join The Dark row, including the Modes of Play row whose last cell carries the page-3 marker. Every
  page marker was resolved through the Pandoc AST and the resolved page set matches the declared span
  with no gap. The Supporting Source Context is present and states that no passages are appended, so
  nothing out of scope was read as evidence. No candidate node, edge, general rule or domain is
  proposed; every element that named a game concept is recorded in rejected_candidates with its locus
  and the reason it fails the core test, and the remaining material is accounted for in OBS-01
  through OBS-05 rather than silently dropped. No assertion depends on any other ruleset.
