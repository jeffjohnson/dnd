null_extraction_declaration: >-
  This GUR proposes no candidate node, no candidate edge, no candidate general rule and no domain.
  That is a property of the source material, not an incomplete reading. Every page was read in full
  and every element that named a game concept was considered against the core test and rejected for
  a stated reason; those rejections are enumerated in rejected_candidates rather than left implicit.
  The handoff is the ordinary Builder handoff and the status is the ordinary proposed. The Analyst
  did not use the terminal withdrawal form, which ARTIFACT_LIFECYCLE reserves for a GUR whose source
  scope a later packet wholly supersedes; nothing supersedes this packet and it is not withdrawn.
  The precedent for a normal, empty Analyst extraction in this repository is
  GUR-PKT-PHB-001-006-preamble, whose r02 carries zero nodes and zero edges, declares status
  proposed, and completed the ordinary Builder, Review and Integration lifecycle. The sibling
  Shadowdark back-matter packet GUR-PKT-SD-322-325-community-credits-and-licensing-r01 is the same
  shape at the other end of the book.

page_attribution_basis: >-
  Four page assignments resolve through the Pandoc AST rather than positionally. Pages 1 and 4 are
  empty fenced Divs carrying the full-page-artwork class, the form SOURCE_MARKDOWN 1.8 requires for a
  classified page with no source heading. Page 1 is additionally marked at the end of the SHADOWDARK
  heading and page 2 at the end of the CONTENTS heading, which placement rule 1 applies to the whole
  heading. Page 3 is marked in the last cell of the Modes of Play table row, which placement rule 2
  applies to the entire row including every cell before the marker; the parser confirms page 3 begins
  at that row, and the persistence rule carries page 3 through the remaining contents rows to the end
  of the table. The resolved page set is 1, 2, 3 and 4, matching the declared span with no gap.

page_class_treatment: >-
  Pages 1 and 4 are classified full-page-artwork by the repository source steward. Under
  SOURCE_MARKDOWN 1.8 and constitution section 6 the class is page-local intake metadata and creates
  no node, edge, domain, general rule, citation or uncovered-page obligation, and a classified page
  inside a declared span is not an uncovered page. Both pages are retained in the packet manifest's
  composition and in the completeness accounting below rather than renumbered or dropped. The Analyst
  did not author either classification and does not extend it; the AST confirms both Divs are empty
  and carry no unknown class, and that neither classification is inherited by pages 2 or 3.

page_class_content_discrepancy: >-
  Carried forward from the claim manifest, unresolved by design, and repeated here so a downstream
  reader meets it without opening the packet. The page-1 Div declares full-page-artwork, which the
  contract defines as a page containing full-page artwork and no graph-constitutable content, yet the
  SHADOWDARK title heading and the credit and legal blocks are also attributed to page 1 because that
  heading carries its own {#p1} marker and no later marker intervenes before {#p2}. Both statements
  about page 1 are literally true together only if the cover art and the credits share one printed
  page; the likelier reading is that the cover is page 1 and the title and credits sit on a leaf the
  intake folded into it.
  The Analyst does not settle it. Only the source steward declares or amends a page class, and a
  pipeline role must not invent, remove or reinterpret one. Critically, it changes no extraction
  outcome: the credits, art attributions and legal notice are not graph-constitutable content under
  constitution section 1 whatever page they sit on, and this GUR proposes no assertion, so no
  citation anywhere depends on resolving it. It is recorded rather than repaired, and a corrected
  incoming packet, not an edit to this immutable claimed copy, is the route if the steward intends
  the title and credits to carry their own printed page.

scope_boundary: >-
  The bounded scope is the Primary Source Material section, printed pages 1 through 4. The trailing
  Supporting Source Context is present and empty, so this packet reproduces no other packet's pages.
  Verified against the next packet in operator sequence, 002-introduction-and-the-basics.md, whose
  first marker is {#p5}: the two spans abut without overlapping.

source_summary: >-
  Front matter of the Shadowdark main rules. Page 1 is a cover-art page carrying the SHADOWDARK title
  and the credit blocks: writing, design and layout attributed to one person, art attributed to eight
  named artists each with a list of the printed pages they illustrated, and a legal block giving the
  printer, a not-for-resale notice, a copyright line and a trademark notice. Pages 2 and 3 are the
  table of contents. Page 4 is a second artwork page. This summary is orientation only.

graph_state_at_extraction: >-
  The Shadowdark canonical graph is empty: nodes.csv is header-only, domain_registry.yaml has no
  domains, general_rules.json is an empty object, and character_races.yaml is inactive. The three
  supplied slices named in the packet manifest as missing remain immaterial, and that assessment is
  re-made here at extraction rather than carried over from claim: with no proposed identity there is
  nothing to match against a registry slice, no neighborhood to compare for redundancy or
  contradiction, and no approved general rule that could apply. reused_nodes is empty because nothing
  is reused and nothing is proposed.

