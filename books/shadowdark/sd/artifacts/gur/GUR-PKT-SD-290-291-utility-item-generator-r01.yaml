source_summary: >-
  Pages 290–291 present the Utility Item Generator section, comprising four tables for randomly generating utility items:
  - UTILITY TYPE TABLE (d20) determines base item type (Brooch, Ring, Boots, Cloak, Amulet, Flask, Tome, Circlet, etc.);
  - UTILITY FEATURE TABLE (d20) provides distinctive visual, thematic, and physical features;
  - UTILITY BENEFIT TABLE (d12) provides supernatural benefits and magical capabilities;
  - UTILITY CURSE TABLE (d12) provides drawbacks and curses for cursed utility items.

