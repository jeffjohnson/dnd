rejected_candidates:
  - text_locus: 'Creeg character quote, p290'
    quoted_gist: 'That rock with wings really was quite useful after all. -Creeg, human wizard, triggering a magical trap from afar'
    why_considered: 'Checked for wizard class, trap triggering, or magic item flavour connections.'
    rejection_reason: >-
      Illustrative flavour narrative and character dialogue; quotes do not define mechanical rules or character identities (Constitution 2.4).
  - text_locus: 'UTILITY TYPE TABLE specific item entries, p290'
    quoted_gist: 'Brooch, Ring, Boots, Cloak, Amulet, Flask, Tome, Circlet, Eyepatch, Gauntlets, Holy symbol, Hat, Goblet, Helm, Statuette, Goggles, Bag, Rock, Surcoat, Mask'
    why_considered: 'Checked for independent item node additions.'
    rejection_reason: >-
      Entries on the d20 type table represent random generation roll outcomes indicating physical item form rather than distinct mechanical rules or item statistics.
  - text_locus: 'UTILITY FEATURE TABLE aesthetic entries, p290'
    quoted_gist: 'Shaped like a raven... Iridescent... Made of basilisk hide... Possessed by a spirit... Made of shaped smoke... Throbs like a heart'
    why_considered: 'Checked for monster part, material, or sensory quality relationship edges.'
    rejection_reason: >-
      Cosmetic aesthetic motifs and physical descriptions for utility items; they introduce no independent mechanical rules or combat statistics.
  - text_locus: 'UTILITY BENEFIT TABLE specific benefit mechanics, p291'
    quoted_gist: 'Connects to an interdimensional pocket with 5 gear slots... A stat becomes 18 (+4)... Harmful spells that target you are DC 15... immune to 1d4...'
    why_considered: 'Checked for edges connecting to gear capacity, stats, spell DCs, or damage immunities.'
    rejection_reason: >-
      Specific entries on the d12 benefit table represent random generation roll outcomes. They contain numeric values (5 gear slots, 18 (+4), DC 15, 1 hour, 2 rounds) and dice expressions (1d4) prohibited on edges under Graph Invariant 11.
  - text_locus: 'UTILITY CURSE TABLE specific curse mechanics, p291'
    quoted_gist: 'Deals 1d4 damage... Cannot be healed by magic; only by resting... Disadvantage on CON checks... Must drink blood... Must eat 1d10 gp...'
    why_considered: 'Checked for edges connecting to damage, healing, ability checks, or currency.'
    rejection_reason: >-
      Specific entries on the d12 curse table represent random generation roll outcomes. They contain damage expressions (1d4, 1d8), monetary amounts (1d10 gp), and dice mechanics prohibited on edges under Graph Invariant 11.
