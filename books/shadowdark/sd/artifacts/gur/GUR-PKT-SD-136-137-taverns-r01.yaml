authored_polarity_declaration: '9 of the 12 rows carry authored polarity and 3 do not, which is the first
  authored polarity this chapter''s generator pages have produced.

  The authored rows are the 8 MODIFIES rows and the single TRIGGERS row, both among the three types constitution
  section 5 reserves, and every one is at basis read because the source states the direction in the cell
  itself: minus one and plus one for the stats, regain for the hit points, plus one experience for the
  whiskey. The six ability rows split 3 improves and 3 worsens, matching the 3 upward and 3 downward stat
  cells the script measured. rule_hit_points and exp_xp take improves. The TRIGGERS row takes neutral,
  matching both existing inbound TRIGGERS rows on rule_check, because a forced check is not itself a benefit
  or a harm; its harmful outcome is the blinding, which has no identity and is recorded as OBS-01.

  The remaining 3 rows are RESOLVED_BY, which is not a reserved type, so Builder derives governs on them.'
status_note: All 12 rows are core, following the disposition settled as IDQ-01 of PKT-SD-124-125 and applied
  in the four packets since. Nothing here declares itself optional as The Gauntlet and the modes of play
  do, and the drinks table is not an optional rule merely because a character need not drink.
