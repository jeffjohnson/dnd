rejected_candidates:
- text_locus: the blinding consequence of the barnacle grog, p137
  quoted_gist: a constitution check or the drinker is blinded for an hour
  why_considered: The outcome of a failed check needs its own row, not just the check, and this is the
    clearest failure consequence on the page. M004 carries the check itself and no row carries what a
    failure produces.
  rejection_reason: There is no identity for blindness and none may be minted from a table result cell.
    spell_blind_deafen is a spell, not a status, so pointing at it would assert that drinking the grog
    casts a spell. The condition vocabulary has no term for a status effect either, which is the same
    gap traps and hazards each lost a page to. Recorded as OBS-01.
- text_locus: the duration on every stat change, p137
  quoted_gist: 7 of the 12 drinks state a duration of one hour, and all 6 of the stat changes are among
    them
  why_considered: It is the difference between a drink and a permanent injury, and the six ability rows
    as written do not carry it, so the graph will show a tavern drink as changing a stat the way a talent
    does.
  rejection_reason: No field stores a duration, and a condition may never spell a quantity, so one hour
    cannot be written anywhere. Nothing survives to carry it. This is a real and significant loss rather
    than a discarded triviality and is recorded as OBS-02.
- text_locus: the clear spirits and autumn mead entries, p137
  quoted_gist: one drink ends a bad effect of another drink and one doubles the effect of the next drink
  why_considered: Both are unhedged mechanical statements, and negation and amplification are exactly
    what MODIFIES and the negates polarity exist for.
  rejection_reason: Both relate one drink to another drink, and drinks have no identities. The only available
    source and target would both be tbl_tavern_drinks, which is a self-edge, and doubling is a magnitude
    besides. These two entries are the strongest argument for per-drink identities and are named as such
    in IDQ-01 rather than buried here.
- text_locus: the three quality bullets, p136
  quoted_gist: poor, standard and wealthy taverns serve stated numbers of menu entries from stated columns
    and stated numbers of drinks
  why_considered: The three grades index the menu table's three price columns, which is the axis-selection
    shape that earns a FEEDS_INTO row, and they are the same three grades the settlement district tables
    produce.
  rejection_reason: The grades are a graded quality band, and graded bands were declined as identities
    four times in this chapter already, for age, wealth, renown and settlement size. Without identities
    the bullets reduce to how many of each, which is a magnitude. What survives is that the procedure
    is resolved by the menu and drinks tables, which M002 and M003 carry.
- text_locus: the Known For column, p136
  quoted_gist: twenty things a tavern is known for, including wizard patrons, Thieves Guild spies, City
    Watch patrons, hostility toward spellcasters, a ban on all weapons and cult rituals in the basement
  why_considered: Several name identities the graph holds. class_wizard and class_thief are canonical,
    and a ban on all weapons reads like an EXCLUDES row against the weapon identities.
  rejection_reason: Each is a description of a place, not a rule that binds anyone. A tavern known for
    wizard patrons does not relate to class_wizard mechanically, and the weapons ban states no check,
    no penalty and no enforcement; it is a hook for a GM. Asserting any of them would make the graph claim
    mechanics the source does not state, which is the same reading that declined the district points of
    interest one page earlier.
- text_locus: the menu table's price columns, p137
  quoted_gist: three columns headed poor, standard and wealthy, each with a coin range
  why_considered: item_coin is canonical, so a row joining the menu to the money identity looked available.
  rejection_reason: The columns' whole content is prices, which are magnitudes. Stripped of them the statement
    is that food costs money, which the graph does not need and which no rule on this page turns on.
non_edge_observations:
- id: OBS-01
  subject: the only stated failure consequence on the page is unexpressible
  detail: 'The barnacle grog forces a constitution check and blinds the drinker for an hour on a failure.
    M004 carries the check and nothing carries the blinding, because no status identity exists and the
    condition vocabulary has no term for one.

    This is the third place this specific gap has cost a row. Traps and hazards each lost the larger part
    of a page to it, and it will recur at volume in the monster chapter, where sleep, paralysis and petrification
    are ordinary. Recorded again here so the count is visible: the gap is not an occasional inconvenience,
    it is systematic, and the monster chapter is thirty-odd packets away.'
- id: OBS-02
  subject: six rows say permanent where the source says one hour
  detail: 'Every one of the 6 stat changes on this table lasts an hour and says so in the cell, as does
    the blinding, giving 7 timed effects among the 12 drinks. Nothing in the row shape can carry that.
    So the graph will show tbl_tavern_drinks MODIFIES abil_charisma at improves beside tbl_thief_talents
    MODIFIES abil_charisma at improves, and a reader will have no way to tell that one is a permanent
    character advancement and the other wears off before the next crawl.

    This is worse than an omission, because the surviving rows are not merely thin, they read as a stronger
    claim than the source makes. It is the clearest case yet for a duration facet, and it is a fourth
    distinct expressiveness gap alongside the condition vocabulary, participant identities and containment.
    Recorded rather than escalated, because the Analyst records gaps and an Architect decides them, and
    because no row submitted here is false on its face.'
- id: OBS-03
  subject: the page-134 pointer can now be paid
  detail: 'OBS-01 of PKT-SD-136-137''s predecessor recorded that printed page 134 directs the reader to
    roll taverns here and that the reach could not be asserted because no tavern identity existed. Proposing
    rule_taverns removes half that obstacle. The other half stands: the direction is printed on page 134,
    which is outside this packet''s range, so asserting it from here would put a citation outside the
    declared span.

    The debt therefore stays where it was, as a bounded successor to PKT-SD-134-135 that can be written
    once this packet integrates, and printed page 138 will complete it for shops. Recorded so the sequencing
    is explicit rather than rediscovered: the successor is not blocked on a decision, only on integration.'
unresolved_identity_questions:
- id: IDQ-01
  question: Should the 12 drinks be item_ identities rather than result cells of tbl_tavern_drinks?
  analyst_reading: 'No, and the rows are written that way. The precedent is direct: tbl_light_mishaps
    and tbl_carousing_outcome both carry their results'' mechanics at table level and neither minted a
    per-result identity, and 30 canonical rows in total already have a tbl_ source under an authored type.
    The 19 existing item_ identities are all gear the rules reach for by name, and no rule reaches for
    a named drink.'
  why_it_is_a_question: The counter-argument is stronger here than in either precedent and I do not want
    it lost. These drinks are priced, purchasable objects with individually distinct effects, which is
    closer to gear than a light mishap or a carousing outcome is. Two entries relate to other drinks,
    one ending a bad effect and one doubling the next, and those two are expressible only if drinks are
    identities; with the table-level reading they vanish entirely. And the six ability rows collapse %d
    distinct drinks into two directions per stat, so the graph can say a drink may raise or lower charisma
    but not which one does which.
  impact_if_overturned: Twelve new item_ identities and roughly 10 additional rows, replacing 9 of the
    12 submitted rows. The change is additive to the identity set and re-sources the effect rows from
    the drinks rather than the table, so no submitted row would be wrong, but 9 of them would be superseded.
    I would rather the Reviewer rule on it now than have it reopened when the potions page is extracted,
    which faces the same question with a stronger claim to item_ because potions are gear.
unresolved_identity_questions_note: 'One raised. The structural choices otherwise follow dispositions
  already settled: the table-as-parent shape from PKT-SD-130-131, the core status from PKT-SD-124-125,
  and the refusal to propose graded bands as identities from four earlier packets in this chapter.'
architectural_escalations: []
architectural_escalation_note: None raised. All 4 identities use an approved prefix, every row uses a
  legal edge type at status core, no row carries supersession_basis and none is an OVERRIDES, and no CLASSIFIED_AS
  row appears. OBS-01 and OBS-02 record expressiveness gaps an Architect may want, the status vocabulary
  and a duration facet, but neither asks for a Decision here and neither makes a submitted row false.
completeness_statement: 'Both printed pages in scope were read in full at the recorded checksum: 3 quality
  bullets, 3 named tables and 44 data rows, of which 12 are drinks. The packet yields 4 new identities
  and 12 rows, reusing 7 canonical identities whose labels the assembling script asserted equal to the
  registry. No proposed identity is left carrying no edge.

  Three rows are structural, resolving the procedure by its three tables. The other 9 carry the mechanics
  the drinks table states, sourced from the table rather than from per-drink identities for the reasons
  argued in table_level_mechanics_note and questioned in IDQ-01. 9 rows carry authored polarity at basis
  read and 3 do not; the script asserts that the 3 improves and 3 worsens ability rows match the 3 upward
  and 3 downward stat cells measured in the source. Every row was checked against the 752 canonical edges
  for an assertion-key collision, for a shared source, type and target under a different aspect, and for
  duplicates within the patch; the only shared source-type-target pairs are the two deliberate ones on
  abil_charisma and abil_wisdom, argued in repeated_target_note, and no canonical row cited either page
  before.

