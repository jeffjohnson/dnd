units_note: 'Figures name their unit. Measured by the assembling script from the claimed source: 3 quality
  bullets, 3 named tables and 44 data rows across them, of which 12 are drinks. Of those drink rows 6
  state a stat change, 3 upward and 3 downward, and 7 state a duration of one hour.'
page_attribution_basis: 'Both markers sit on headings. p136 ends the TAVERNS heading and p137 ends the
  TAVERN MENU TABLE heading, and placement rule 1 applies each to its whole heading with the persistence
  rule carrying it forward. Verified against the claimed source that no marker appears inside a table
  row.

  So the 3 quality bullets and the tavern generator table are printed page 136, and the menu and drinks
  tables are printed page 137. Each row is cited to the page of the table it concerns, so 1 row cites
  136 and 11 cite 137.'
scope_boundary: 'The bounded scope is the Primary Source Material section, printed pages 136 and 137:
  3 quality bullets and 3 named tables. The Supporting Source Context section is declared but empty; it
  states that no passages were appended, so nothing is excluded by it and no row could cite it.'
source_summary: 'A tavern generator, and the first page in this chapter whose tables state mechanics rather
  than only flavour. Three bullets fix what a poor, standard or wealthy tavern serves: how many menu entries
  from which price columns, and how many drinks. The generator table gives a tavern its two-part name
  and the thing it is known for. The menu table gives food in three price columns. The drinks table gives
  12 drinks, each with a price and most with a stated game effect: a constitution check with a blinding
  consequence, temporary stat changes in both directions, hit point recovery per mug, and an experience
  award for the most expensive bottle. Two entries act on other drinks rather than on the drinker.'
graph_state_at_extraction: 'Read from the repository at extraction, not recalled, and every figure here
  is computed by the assembling script from the canonical files and the claimed source.

  The canonical graph holds 380 registry rows and 752 edges, and 0 rows cite printed pages 136 or 137,
  so nothing in this span has been extracted before. No tavern, menu or drink identity exists; the registry
  was searched for all three and returned nothing. The registry holds 94 tbl_ and 19 item_ identities.

  Seven existing identities were read in full first. rule_check carries 53 rows and already has 2 inbound
  TRIGGERS, from rule_action and rule_improvise, both at polarity neutral. rule_hit_points has 14 inbound
  MODIFIES rows. exp_xp has 6 inbound rows, one of which is already from a table. The four ability identities
  this page touches carry 11, 5, 7, 9 rows respectively for constitution, charisma, wisdom and intelligence,
  and none of them is reached from a generator table in this chapter.'
table_level_mechanics_note: 'This is the judgement the packet turns on, so it is argued before the rows
  rather than after. The drinks are named, priced and mechanically distinct, which is the shape that suggests
  one identity per drink. They get none; the table carries their mechanics instead.

  Two canonical tables already work this way and were read before deciding. tbl_light_mishaps MODIFIES
  rule_light_source on extinguishing and TRIGGERS rule_damage on flare burn, both from printed page 110,
  and tbl_carousing_outcome MODIFIES exp_xp on outcome award from printed page 93. Neither minted an identity
  for an individual result, and between them they establish that a table is an acceptable source for the
  mechanics its cells state. Counting all three authored types, 30 canonical rows already have a tbl_
  source.

  The alternative was 12 item_ identities. It is rejected because the existing 19 item_ identities are
  gear the rules reach for by name, armor, torches, rations, wands, and no rule anywhere reaches for a
  named drink; because minting them would make this the finest-grained page in the book for no downstream
  consumer; and because the same reasoning would then demand identities for the 12 menu entries, which
  state nothing at all. The cost is that the graph cannot say which drink does which thing, and that cost
  is recorded as IDQ-01 so the Reviewer can overturn it rather than having to infer that it was considered.'
repeated_target_note: 'Two identities are each reached twice from the drinks table, and the pairs are
  deliberate. abil_charisma takes a stat penalty row at worsens and a stat bonus row at improves, and
  abil_wisdom takes the same pair, because the table states changes in both directions for both stats:
  one drink stains the teeth and one sparkles, one dulls the senses and one is aged and smooth.

  The five-field assertion key separates them on aspect, and the pattern is canonical already: tbl_priest_talents
  reaches rule_spellcasting_check twice on different aspects, and spell_judgement reaches rule_hit_points
  twice at opposite polarities. Collapsing each pair into one row would have forced a single polarity
  onto a two-directional fact, which is exactly the vague-aspect merge that had to be corrected on the
  modes of play page.

  The assembling script checks the pairs against the source rather than against my reading: it counts
  the drink cells stating a stat change, 6 of them, 3 upward and 3 downward, and asserts that the same
  numbers of upward and downward ability rows were written.'
