source_summary: >-
  Page 269 provides a high-level overview of treasure in Shadowdark, organized into six subsections:
  - TREASURE: explains treasure's role in character advancement and sets a 50% chance for wandering monsters to carry treasure;
  - FLEETING: discusses wealth turnover with an explicit cross-reference to Carousing on pg. 92;
  - TREASURE TABLES: references random loot generation by monster level using the tables on pg. 270;
  - UNGUARDED: defines generation of unguarded treasure using the discovering character's level;
  - DEALING WITH LOOT: states that treasure typically occupies one gear slot and coins occupy one slot per 100, subject to GM determination, with advice on selling loot;
  - MAGIC ITEM VALUES: provides GM guidance on the rare valuation and sale of magic items (1d6 x 100 gp for weak items, 2d6 x 100 gp for powerful items).

