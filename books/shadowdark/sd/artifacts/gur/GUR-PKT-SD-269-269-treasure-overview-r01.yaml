rejected_candidates:
  - text_locus: 'TREASURE prose, p269'
    quoted_gist: 'Treasure is the driving force behind character advancement. Claiming treasure grants the characters XP and gives them valuable resources.'
    why_considered: 'Checked for relationship between rule_treasure, exp_xp, and rule_awarding_xp.'
    rejection_reason: >-
      High-level overview summarizing the core advancement rules established on page 117
      (rule_treasure FEEDS_INTO rule_awarding_xp and rule_awarding_xp MODIFIES exp_xp).
      Does not define a new mechanical relationship or alter the procedure.
  - text_locus: 'TREASURE TABLES prose, p269'
    quoted_gist: 'You can use treasure tables (pg. 270) to randomly determine what loot a monster is carrying. The treasure table the monster uses corresponds to its level.'
    why_considered: 'Checked for monster level feeding into treasure tables (mstat_monster_level, tbl_treasure_...).'
    rejection_reason: >-
      The treasure tables themselves are published on page 270 (packet 120) and are not canonical nodes
      in the registry at this packet. Invariant 1 prohibits edges referencing non-existent nodes.
      Furthermore, mstat_monster_level FEEDS_INTO rule_treasure is already canonical from page 192 (LEVEL),
      and the example contains numeric magnitudes.
  - text_locus: 'DEALING WITH LOOT coin slot clause, p269'
    quoted_gist: 'coins occupy one slot per 100'
    why_considered: 'Checked for rule_gear_capacity CONSTRAINS item_coin or an exclusion relationship.'
    rejection_reason: >-
      Already stated on page 35 in the Basic Gear Table (Coins 100, 1 slot, first 100 free) and
      analyzed in GUR-PKT-SD-033-037 (OBS-03). The 100-coin threshold is a numeric magnitude prohibited
      from edge aspect/condition by Invariant 11. The parenthetical mention on page 269 is an incidental
      reminder rather than a new rule.
  - text_locus: 'DEALING WITH LOOT selling prose, p269'
    quoted_gist: 'Characters can sell most treasure based on its material value, but they may need to find a curio collector to offload strange or obscure items.'
    why_considered: 'Checked for selling mechanics, currency conversion, or merchant interaction rules.'
    rejection_reason: >-
      Advisory GM guidance and economy flavor; no mechanical formula, DC, or procedure is defined.
      Selling items according to value is covered under standard equipment and downtime rules.
  - text_locus: 'MAGIC ITEM VALUES prose, p269'
    quoted_gist: 'Magic items can rarely be bought or sold. In such a case, weak magic items are worth 1d6 x 100 gp. Powerful ones, if not priceless, are worth 2d6 x 100 gp.'
    why_considered: 'Checked for item_magic_item valuation or connection to item_coin.'
    rejection_reason: >-
      1d6 x 100 gp and 2d6 x 100 gp are dice expressions, multipliers, and numeric monetary magnitudes
      prohibited on edges by Invariant 11 and Constitution section 5. The rarity of sale and pricing advice
      are discretionary GM guidance rather than a fixed mechanical modification of magic item rules.
      item_magic_item is already canonical and feeds into rule_treasure as an XP source from page 117.
  - text_locus: 'UNGUARDED worked example, p269'
    quoted_gist: 'For example, a 6th-level wizard finds a treasure chest. The wizard rolls on the Treasure 4-6 table to determine whatʼs inside.'
    why_considered: 'Mentions wizard class and specific level bands/tables.'
    rejection_reason: >-
      Worked illustrative example containing numeric magnitudes; examples do not generate independent edges.
