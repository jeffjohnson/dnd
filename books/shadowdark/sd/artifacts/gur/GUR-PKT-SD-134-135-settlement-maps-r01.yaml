authored_polarity_declaration: No authored polarity appears. Every row is RESOLVED_BY or FEEDS_INTO, neither
  of which is among the three types constitution section 5 reserves for authored polarity, so assigning
  one is prohibited to the Analyst and invariant 15 has nothing to require. Builder derives governs on
  the 4 RESOLVED_BY rows and neutral on the 10 FEEDS_INTO rows.
status_note: All 14 rows are core, following the disposition settled as IDQ-01 of PKT-SD-124-125 and applied
  in the three packets since. The roll-or-choose offer applies to the settlement type rather than to the
  procedure, and the alignment paragraph's offer is between two scopes of the same roll, not between using
  the rule and not; neither makes the page optional, and nothing here declares itself optional as The
  Gauntlet and the modes of play do.
