units_note: 'Figures name their unit. Measured by the assembling script from the claimed source: 7 procedure
  paragraphs, 11 named tables and 51 data rows across them, of which 8 are the district results on the
  settlement districts table.'
page_attribution_basis: 'Both markers sit on headings. p134 ends the SETTLEMENT MAPS heading and p135
  ends the SETTLEMENT SLUMS TABLE heading, and placement rule 1 applies each to its whole heading with
  the persistence rule carrying it forward. Verified against the claimed source that no marker appears
  inside a table row.

  So the 7 procedure paragraphs and the settlement type, districts and alignment tables are printed page
  134, and the 8 district point-of-interest tables are printed page 135. Each row is cited to the page
  of the table it concerns, so 6 rows cite 134 and 8 cite 135.'
scope_boundary: 'The bounded scope is the Primary Source Material section, printed pages 134 and 135:
  7 paragraphs of procedure and 11 named tables. The trailing Supporting Source Context repeats the random
  encounter procedure from printed pages 112 and 113, whose primary packet is already integrated; it is
  out of scope and no row cites it.'
source_summary: A settlement generator. Roll or choose a settlement type, then roll the number and size
  of dice that type lists onto a blank sheet of paper. The outline of where they fell is the settlement's
  shape, and each die's number, read against the districts table, is the district at that position, with
  the highest roll holding the seat of government. Each district has a rolled number of points of interest,
  drawn from whichever of the eight district tables on the facing page matches it. An alignment is rolled
  for the settlement as a whole or per district, and a chaotic result makes the place risky for random
  encounter purposes. The page closes by directing the reader to the tavern and shop generators later
  in the chapter.
graph_state_at_extraction: 'Read from the repository at extraction, not recalled, and every figure here
  is computed by the assembling script from the canonical files and the claimed source.

  The packet metadata records 361 registry rows, 730 edges and 327 nodes, measured at claim. The previous
  packet integrated between the claim and this extraction, so the figures below are larger; they are re-measured
  here rather than carried forward, and the difference is that integration and nothing else.

  The canonical graph holds 368 registry rows and 738 edges, and 0 rows cite printed pages 134 or 135,
  so nothing in this span has been extracted before. No settlement, district, point-of-interest, tavern
  or shop identity exists. The registry holds 83 tbl_ identities.

  Four existing identities were read in full first. sys_alignment carries 12 rows, of which 3 are RESOLVED_BY,
  so this page''s table is the next one and the keys were checked against all of them. alignment_chaotic
  carries 7 rows and none of them touches danger level or encounters. rule_danger_level carries 5 rows
  and rule_encounter 10, and the path from the first to the second already exists in canonical, which
  is why this page adds only the row that reaches rule_danger_level.'
two_tier_structure_note: 'The rows follow the two-tier shape settled on printed pages 130 and 131 and
  applied again on 132 and 133, because the page has the same structure: a procedure that rolls some tables
  directly and reaches others through a result.

  Three tables are rolled directly by the procedure and take RESOLVED_BY rows from rule_settlement_maps:
  type, districts and alignment. The 8 district tables on printed page 135 are reached only when the districts
  table produces their district, so each takes a FEEDS_INTO row from tbl_settlement_districts. That is
  the same relation and the same fan-out the eight map contents tables carry from tbl_map_room_type, and
  it uses a single shared aspect for the same reason: the 8 rows differ only in which district was rolled.

  The assembling script asserts the correspondence rather than trusting the reading. For each of the 8
  district results it checks that the name appears as a result row on the districts table and that a table
  of that name exists on printed page 135, so no district is left without a table and no table is invented.'
settlement_type_feeds_districts_note: 'M005 is the row most likely to be read as redundant, so it is argued
  here. tbl_settlement_type FEEDS_INTO tbl_settlement_districts with aspect district dice.

  The type table''s second column is not decoration. It gives both how many dice are thrown and how many
  sides they have, and those same dice are then read against the districts table, one district per die.
  So the type determines how many districts a settlement has and, because the districts table runs from
  1 to 8 while the smallest type''s dice cannot reach the upper entries, which districts are reachable
  at all. A small settlement can never roll a castle district.

  That is one relation, not two: the count and the range are the same fact about the same dice, and splitting
  them would need an identity for a die. The specific die counts and sizes are magnitudes and no field
  may store them, so the row carries only the direction, type into districts.'
chaotic_alignment_note: 'M006 is the only row here that reaches outside the generator, so it is argued
  too. alignment_chaotic FEEDS_INTO rule_danger_level with aspect settlement danger.

  The source says to treat chaotic settlements and districts as risky when checking for random encounters.
  Risky is one of the three values rule_danger_level has carried since printed page 86, and those values
  were twice declined as identities, on printed pages 86 and 90, so the row cannot name it. What survives
  is the direction: a rolled alignment supplies the danger level for the place, which is exactly what
  FEEDS_INTO carries.

  The row stops there deliberately. rule_danger_level already feeds rule_encounter in canonical, with
  aspect check cadence, so a second row from alignment_chaotic to rule_encounter would restate a path
  the graph already has and would assert a direct relation the source does not state. The mention of random
  encounters names the consumer, not a second edge.'
