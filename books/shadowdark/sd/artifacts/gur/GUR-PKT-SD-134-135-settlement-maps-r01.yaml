rejected_candidates:
- text_locus: the tavern and shop pointers, p134
  quoted_gist: roll taverns on pg. 136 and shops on pg. 138
  why_considered: It is an explicit numbered cross-reference, which is the strongest form of pointer the
    book uses, and the district tables produce poor, standard and wealthy taverns and shops as results,
    so the generator plainly reaches those two pages.
  rejection_reason: Neither endpoint exists. No tavern or shop identity is canonical, and printed pages
    136 and 138 are the subject of packets nobody has claimed. A GUR must propose every endpoint it uses,
    and proposing them here would mint identities for content outside this packet's bounded scope and
    pre-empt the Analyst who extracts those pages. Recorded as OBS-01 and owed as a successor once both
    are canonical.
- text_locus: the dice-throwing, outline and street directions, p134
  quoted_gist: roll the dice together on a blank sheet of paper, draw a broad outline around where they
    fell to get the settlement's shape, and separate the districts by rough lines to create main streets
  why_considered: It is the most concrete instruction on the page and is what actually produces the map,
    so leaving it out feels like leaving out the procedure itself.
  rejection_reason: 'Its content is entirely about the physical artefact: where dice land on paper and
    what the reader draws around them. There is no identity for a sheet, an outline or a street, and the
    relation asserted would be between the procedure and a drawing rather than between game concepts.
    This is the third consecutive packet whose signature instruction fails this way; recorded as OBS-02.'
- text_locus: the seat of government direction, p134
  quoted_gist: the settlement's seat of government is located in the district with the highest roll
  why_considered: It is unhedged and deterministic, and it singles out one district from the rest, which
    is the shape a GATES or a CONSTRAINS row sometimes takes.
  rejection_reason: 'Its whole content is a comparison of die results, which is arithmetic on magnitudes
    and no field may store it. Stripped of the comparison the statement says a settlement has a seat of
    government, which is setting rather than mechanics: nothing checks against it, nothing is gated by
    it, and no other rule in the graph mentions one. Proposing an identity for it would produce a node
    with no relation to assert.'
- text_locus: the points of interest quantity, p134
  quoted_gist: each district has a rolled number of main points of interest
  why_considered: It is what makes the 8 district tables get rolled at all, so a row carrying the quantity
    looked available alongside the ones carrying the reach.
  rejection_reason: The statement's only content beyond the reach is how many, which is a magnitude, and
    a condition may never spell a quantity. What survives is that a district produces points of interest
    from its table, which the 8 FEEDS_INTO rows already carry. A separate row would need an identity for
    a point of interest and would assert nothing those rows do not.
- text_locus: the district point-of-interest results, p135
  quoted_gist: 36 data rows across the 8 district tables, naming flophouses, graveyards, guildhouses,
    a City Watch outpost and garrison, apothecaries, libraries, temples, shrines and a wizard's tower
  why_considered: Several results name things the graph holds or nearly does. The temple district alone
    gives a minor deity's chapel, a forbidden shrine, a major god's temple and a revered holy site, and
    sys_deity is canonical; the university district gives a wizard's tower and class_wizard is canonical.
  rejection_reason: All are locations a GM places on a map, and none states a check, a value, a duration
    or a consequence. A chapel to a minor deity is a building, not a relation to sys_deity, and a wizard's
    tower is not a relation to class_wizard; asserting either would make the graph claim a mechanical
    link the source never states. This is the same reading that declined the map contents descriptions
    on printed page 131 and the hex developments on 133. The tavern and shop results are the exception
    in kind and are handled above.
non_edge_observations:
- id: OBS-01
  subject: the tavern and shop pointers are owed and cannot be paid yet
  detail: 'This page ends by directing the reader to roll taverns on printed page 136 and shops on printed
    page 138, and its district tables produce poor, standard and wealthy taverns and shops among their
    results. Both are real mechanical reaches and both are unassertable in this revision because neither
    endpoint exists: no tavern or shop identity is canonical, and the packets covering those pages are
    unclaimed.

    Recorded so the debt is visible rather than lost. Once those pages are extracted and integrated, this
    packet owes a successor carrying the reach from the district tables to whatever tavern and shop identities
    they mint. The shape is the one PKT-SD-091-093 and PKT-SD-101-109 already owe for carousing and treasure
    pointers, and it is the ordinary cost of extracting a chapter in page order: a generator can name
    the thing that comes after it before the graph holds it.'
- id: OBS-02
  subject: a third consecutive signature mechanic acts on the artefact
  detail: 'The instruction that gives this page its character is throwing dice onto paper, drawing an
    outline around where they land and reading each die''s position as a district. It is precise and fully
    determinate, and almost none of it reaches the graph, because its subject is a sheet of paper.

    That is now three packets running. On printed page 130 it was scattering dice to place rooms; on 132
    it was stepping around the terrain table as a circular loop; here it is the same dice-on-paper technique
    applied to a town. Recorded as a set because the pattern is stable enough to be worth a name: the
    generators in this chapter are procedures performed on the artefact, and the vocabulary holds relations
    between game concepts, so the more distinctive the generator the less of it survives. What does survive
    in all three cases is which table resolves what, and that is not nothing, but a reader of the graph
    alone would not know these pages are about drawing.'
- id: OBS-03
  subject: the eight districts are the same eight the encounter chapter uses
  detail: 'The 8 district results here are slums, low, artisan, market, high, temple, university and castle.
    The encounter chapter that follows carries a separate page-length table for each of those districts,
    plus taverns, and those pages are among the unclaimed packets.

    Recorded because it is a structural correspondence a later Analyst will need and because it is not
    yet assertable. Nothing on this page points at the encounter tables and nothing there is canonical,
    so any row joining them would be inferred rather than read. When that chapter is extracted the question
    will be whether a district result reaches its encounter table the way it reaches its point-of-interest
    table here; the answer belongs to whoever holds both loci, not to this packet.'
