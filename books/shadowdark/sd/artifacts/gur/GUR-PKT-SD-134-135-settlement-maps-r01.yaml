completeness_statement: 'Both printed pages in scope were read in full at the recorded checksum: 7 procedure
  paragraphs, 11 named tables and 51 data rows. The packet yields 12 new identities and 14 rows, reusing
  3 canonical identities whose labels the assembling script asserted equal to the registry. No proposed
  identity is left carrying no edge.

  The rows follow the two-tier shape settled on printed pages 130 and 131: three tables are rolled directly
  and take RESOLVED_BY rows from the procedure, and the 8 district tables are reached through a districts
  result and take FEEDS_INTO rows from it under one shared aspect, as the map contents tables do. Two
  rows reach further and are argued separately, M005 for the dice the type table supplies and M006 for
  the danger level a chaotic alignment sets. Every row was checked against the 738 canonical edges for
  an assertion-key collision, for a shared source, type and target under a different aspect, and for duplicates
  within the patch; there are none of any, and no canonical row cited either page before.

  Five candidates were rejected and each is recorded with its reason. The largest deliberate loss is the
  tavern and shop pointers, recorded as OBS-01 and owed as a successor, followed by the dice-on-paper
  technique recorded as OBS-02. No assertion depends on any other ruleset.'
