rejected_candidates:
  - text_locus: 'OATHS TABLE entries, p280'
    quoted_gist: 'The duke will procure you an audience with the queen; The City Watch will pardon a crime...; The Circle of Mages will magically teleport you anywhere'
    why_considered: 'Checked whether individual oath outcomes warrant discrete rule or encounter nodes.'
    rejection_reason: >-
      Individual oath results are specific narrative outcomes and table generation details; they do not establish independent mechanical rules or procedures.
  - text_locus: 'SECRETS TABLE entries, p281'
    quoted_gist: 'The True Name of The king; The one manipulating A powerful demon; Proof of the crimes by A revered knight of St. Terragnis'
    why_considered: 'Checked for monster/demon, title, or NPC relationship edges.'
    rejection_reason: >-
      Table entries provide narrative prompt combinations for secrets. Mention of demons, kings, or knights provides illustrative examples and plot hooks rather than mechanical rule interactions (Constitution 1, 2.4).
  - text_locus: 'BLESSINGS TABLE individual blessings, p281'
    quoted_gist: 'Wraithsight... Nine Lives... Demonskin... Spiderwalk... Merfolkʼs Kiss... Gedeʼs Blessing... Arcane Eye... Shuneʼs Mark... Ghostwalk... Deathʼs Sting... Rite of Rage... Divine Halo'
    why_considered: 'Checked whether blessings constitute individual spell, talent, or rule nodes, or connect to deities Gede and Shune.'
    rejection_reason: >-
      Blessings are table outcome benefits from a d12 table rather than spells, items, or general rules. Mention of deities (Gede, Shune) in blessing names represents flavor naming rather than clerical worship mechanics (Constitution 2.4). Specific numeric values (1d6 hit points, 1d4 rounds, DC 15) are magnitudes excluded under Invariant 11.
  - text_locus: 'Introductory prose boon examples, p280'
    quoted_gist: 'A favor owed by a unicorn, a title granted by a baron, or the promise of safe harbor by a dryad you helped... The identity of a murderer...'
    why_considered: 'Checked for monster or social rule nodes.'
    rejection_reason: >-
      Illustrative narrative examples defining the concept of boons; no discrete rules or mechanics are introduced.
  - text_locus: 'Supporting source context passages, p39, p117, p269'
    quoted_gist: 'Awarding XP (lines 3609–3650), Level advancement (lines 1017–1060), Treasure overview (lines 9886–9920)'
    why_considered: 'Checked for supporting context relationships.'
    rejection_reason: >-
      Supporting source context from earlier packets is out of scope per Scope Boundary; no row here may cite pages outside 280–281.
