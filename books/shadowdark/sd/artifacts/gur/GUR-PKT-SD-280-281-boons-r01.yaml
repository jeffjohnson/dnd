source_summary: >-
  Pages 280–281 present the Boons section, which covers non-monetary sources of value or benefit:
  - Introductory prose defines boons and introduces three categories: Oaths, Secrets, and Blessings;
  - XP VALUE defines that a boon's XP value is based on its utility (ranging from normal to legendary treasure);
  - OATHS TABLE provides a d8 table of favors, titles, and promises;
  - SECRETS TABLE provides a d12 two-part generator table for valuable secrets;
  - BLESSINGS TABLE provides a d12 table of magical gifts and enchantments.

