source_summary: >-
  The DROW family: two introductory paragraphs of narrative framing describing drow as lithe,
  subterranean elves living in decadent, matriarchal societies centered on spider-demon goddess worship,
  followed by three stat blocks: Drow, Drow, Drider, and Drow, Priestess. Drow carries Poison (sleep)
  and Sunblind; Drow, Drider carries Poison (paralyzed 1d4 rounds) and Sunblind; Drow, Priestess carries
  Poison (paralyzed 1d4 rounds), Sunblind, and three innate WIS spells: Snuff, Summon Spiders, and Web.
  All three stat blocks include a mithral chainmail notation for AC 16.

