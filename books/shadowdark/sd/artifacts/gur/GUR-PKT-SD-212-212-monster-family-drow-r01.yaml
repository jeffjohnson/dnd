non_edge_observations:
  - id: OBS-01
    subject: Divergent Poison effects within the same family
    detail: >-
      Drow inflicts sleep on a failed DC 15 CON check, while Drow, Drider and Drow, Priestess inflict
      paralyzed for 1d4 rounds on the same check. This divergence under the same ability name reinforces
      that stat-block abilities define creature-specific parameters rather than global status effects.
  - id: OBS-02
    subject: Monster stat-block spells operate on creature locus
    detail: >-
      Drow, Priestess carries Snuff, Summon Spiders, and Web as innate WIS spells with unique DCs (12,
      14, 13) and creature-specific parameters. Under monster spellcasting rules and Constitution 2.5,
      these operate on the creature's attack/spellcasting locus rather than creating cross-mechanic
      edges into the general character spell list.
  - id: OBS-03
    subject: Mithral chainmail notation explains creature AC
    detail: >-
      All three creatures carry the notation "AC: 16 (mithral chainmail)". This explains the creature's
      inherent AC value on its stat block without modifying the general equipment or material rules.

