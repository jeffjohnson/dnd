source_summary: >-
  Pages 286–287 present the Potions and Mixing Potions section, comprising four tables:
  - POTION FEATURES TABLE (d8) provides three columns of physical and sensory characteristics;
  - MIXING POTIONS TABLE (d12) determines mishaps, side effects, and bonus benefits when combining potions;
  - POTION BENEFIT TABLE (d12) provides supernatural benefits and magical effects;
  - POTION CURSE TABLE (d12) provides drawbacks and curses for cursed potions.

