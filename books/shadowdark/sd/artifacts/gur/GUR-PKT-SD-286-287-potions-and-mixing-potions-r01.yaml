rejected_candidates:
  - text_locus: 'POTION FEATURES TABLE sensory entries, p286'
    quoted_gist: 'Spicy, Pickled spider inside, Bubbling, Deep blue, Citrus smell, Swirling vortex, Blood red'
    why_considered: 'Checked for item, creature, or sensory property edges.'
    rejection_reason: >-
      Cosmetic sensory descriptors and appearance traits for potions; they introduce no mechanical rules or statistics.
  - text_locus: 'MIXING POTIONS TABLE specific outcome details, p286'
    quoted_gist: 'Drinker floats 2 rounds, Fumes: DC 12 CON or 1d4 dmg, Explodes: DC 12 DEX or 1d6 dmg, Drinker -1 to random stat'
    why_considered: 'Checked for ability check, damage, or condition modifier edges.'
    rejection_reason: >-
      Individual roll results on the d12 mixing potions table represent one-off mishap and variation outcomes. Numeric expressions (2 rounds, DC 12, 1d4 damage, -1 to stat) are magnitudes excluded under Invariant 11.
  - text_locus: 'POTION BENEFIT TABLE individual benefit entries, p287'
    quoted_gist: 'Immune 5 rounds... Heals, 1d4... Read the minds of all creatures within near for 1 hour... Fly a near distance for 5 rounds... A stat becomes 18 (+4) for 5 rounds... Cures any disease or affliction'
    why_considered: 'Checked whether individual potion benefits warrant separate spell or ability nodes.'
    rejection_reason: >-
      Individual benefits are roll outcomes on a d12 generation table rather than standalone player abilities or spells. Numeric durations (5 rounds, 1 hour), healing dice (1d4 to 4d10), and stat scores (18 (+4)) are magnitudes excluded under Invariant 11.
  - text_locus: 'POTION CURSE TABLE individual curse entries, p287'
    quoted_gist: 'DC 15 WIS check or attack nearest creature for 3 rounds... Turn into a 1 HP newt for 3 rounds... DC 15 CON check or take 2d10 damage... You are the source of an antimagic shell spell for 1 hour'
    why_considered: 'Checked whether curses warrant standalone condition or spell relationship edges.'
    rejection_reason: >-
      Individual curses are table roll results for cursed potions. Numeric check DCs (DC 15), durations (3 rounds, 1 hour), HP changes (1 HP), and damage (2d10) are magnitudes excluded under Invariant 11. Reference to antimagic shell describes the nature of a specific curse effect rather than a structural spell relation.
  - text_locus: 'Proposal of rule_mixing_potions, p286'
    quoted_gist: 'MIXING POTIONS TABLE'
    why_considered: 'Evaluated whether mixing potions warrants a dedicated rule node.'
    rejection_reason: >-
      The source text contains no standalone rule prose or procedure outside of the table itself; the table is registered as tbl_mixing_potions and attached directly to item_magic_item.
  - text_locus: 'Supporting source context passages, pp34-37, p55, p86, pp282-283'
    quoted_gist: 'Magic item attributes, Starting gear, Resting, Combat actions, Referenced spell ANTIMAGIC SHELL'
    why_considered: 'Checked for edges citing supporting context passages.'
    rejection_reason: >-
      Supporting source context is repeated material from earlier packets and is out of scope per Scope Boundary; no row here may cite pages outside 286–287.
