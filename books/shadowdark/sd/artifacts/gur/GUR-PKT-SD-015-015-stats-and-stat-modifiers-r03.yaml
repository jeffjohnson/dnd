    basis: >-
      The page sits in the character-creation sequence and governs how the six stats first come into
      existence. Recorded as a candidate only; the Shadowdark domain registry is empty and
      constitution section 8 reserves domain promotion to an Architect Decision. A single occurrence
      does not promote a domain.
  - proposed: core_resolution
    basis: >-
      The stat modifier produced here is the value later resolution mechanics consume. Recorded as a
      candidate only, on one page of evidence, and not promoted.

domain_boundary_questions:
  - >-
    Whether stat generation and the stat modifier belong to one domain or to separate
    character-creation and resolution domains cannot be settled from a single page. Deferred; no
    domain is asserted on any edge in this GUR.

candidate_general_rules:
  - proposed: every stat score yields its modifier through the stat modifiers table
    establishing_locus: 'SD page 15, STAT MODIFIERS TABLE'
    basis: >-
      The table is stated once and applies uniformly to all six stats, which is why M001 through
      M006 repeat one shape. If approved as a general rule this could replace those six explicit
      edges with derived applications.
    not_applied: >-
      Recorded as a candidate only. Constitution section 5 requires a separate Architect ruling with
      an establishing locus, scope, counterexamples and affected set before a general rule exists.
      No edge in this GUR sets general_rule_id, and under invariant 19 the establishing edges would
      leave it empty in any case. The Analyst does not promote it and has applied nothing graph-wide.

non_edge_observations:
  - id: OBS-01
    subject: the Important for statements are advisory, not mechanical
    detail: >-
      Four stat entries end with a sentence of the form Important for a named class: Strength for
      fighters, Dexterity for thieves, Intelligence for wizards, Wisdom for priests. Constitution and
      Charisma carry no such sentence. No class node is proposed here and no edge is drawn to one.
      The classes are defined on printed pages 18 through 25, which belong to other packets in this
      intake, and the mechanical prime-stat dependency should be asserted there against the class's
      own defining locus. Drawing it here would mint four class identities from a page that only
      points at them, and would place the assertion under the wrong packet's provenance.
  - id: OBS-02
    subject: stat descriptions are example applications
    detail: >-
      Each stat entry lists illustrative uses such as fighting with a sword, bashing open doors,
      swimming, shooting a bow, balancing on a ledge, holding a breath, deciphering runes and
      recognizing omens. These are examples of the stat's reach, not named mechanics with their own
      identity on this page. No weapon, item, action or check node is proposed from them. Several
      name mechanics that later packets define properly; those packets own them.
  - id: OBS-03
    subject: magnitudes deliberately excluded
    detail: >-
      The page carries the generation dice expression, the nine score bands of the modifier table
      with their values from minus four to plus four, and the qualifying score for the optional
      reroll. All are magnitudes, die expressions and thresholds, excluded from the graph by
      constitution section 1 and invariant 11. They remain in the immutable claimed packet, which is
      the authority for the values themselves. No aspect or condition in this GUR contains a digit.
  - id: OBS-04
    subject: packet wrapper is intake metadata
    detail: >-
      The supplied file opens with an intake wrapper naming the packet and a shadowdark.md line
      range, ahead of the Primary Source Material heading. The marker linter correctly reports it as
      content preceding the first marker. It is informational under the sd extraction profile and
      contributes nothing to the graph. The claimed packet manifest is the independent page locator
      that SOURCE_MARKDOWN Attribution Rules requires for such content.

unresolved_identity_questions:
  - id: IDQ-01
    subject: one shared stat modifier identity or six per-stat modifiers
    detail: >-
      This GUR proposes a single abil_stat_modifier because the source states one table serving all
      six stats and one Modifier column. The alternative is six identities such as a Strength
      modifier and a Dexterity modifier, which would let later packets cite exactly which modifier a
      mechanic consumes. Page 15 does not settle it: it says to note each total and modifier, which
      reads either way.
      Consequence if wrong: later packets that say to add a specific stat's modifier would either
      attach to a single shared node and lose which stat was meant, or require a migration to split
      it into six. The Analyst chose the shared node because minting six identities from a page that
      names one table would assert a distinction the source has not yet drawn, and splitting later
      is a cleaner migration than merging.
      This is not an Architect escalation: abil_ is an approved prefix and the kind is unchanged, so
      under ESCALATION_CONTRACT this is an ordinary registry addition for Builder and Reviewer to
      confirm against the next packet that consumes a modifier.
  - id: IDQ-02
    subject: two proposed nodes are analyst-named, not source-named
    detail: >-
      rule_stat_generation and rule_stat_reroll have no source name. The only heading is STATS, which
      covers the whole section including the six stats, so it cannot serve as the procedure's
      identity without conflating the procedure with the stats it produces. The reroll sentence has
      no heading at all. Both are flagged source_named false in candidate_nodes.
      Under Incoming Packet Authority the packet governs spelling for mechanics it explicitly names;
      it names neither of these, so no packet-derived spelling is being overridden and no legacy
      identity is in conflict. Reviewer should confirm the two IDs against the defining loci rather
      than accept the Analyst's wording, and a later packet that names either procedure explicitly
      takes precedence over these stems.

architectural_escalations: []
architectural_escalation_note: >-
  None raised. Every proposed node uses an approved constitution section 2 prefix with an unchanged
  kind, every edge uses one of the thirteen legal types, and no new prefix, edge type, domain
  promotion or general-rule application is requested. ESCALATION_CONTRACT states that a proposed node
  under an approved prefix and kind which passes identity and duplicate checks is ordinary
  GUR/GUP/Review work, not an escalation. IDQ-01 and IDQ-02 are recorded for Reviewer rather than
  escalated for the same reason.

completeness_statement: >-
  Every section of printed page 15 was read and considered: the STATS heading, the determination
  sentence, the optional reroll sentence, all six bolded stat entries with their descriptions and
  their Important for notes, the STAT MODIFIERS TABLE heading, and all nine table rows. The packet
  contains no other printed page and no Supporting Source Context. Content not converted to an edge
  is accounted for in OBS-01 through OBS-04 rather than silently dropped. Fourteen edges are
  proposed across ten candidate nodes, no node is reused because the Shadowdark graph is empty, and
  no assertion depends on any other ruleset.
