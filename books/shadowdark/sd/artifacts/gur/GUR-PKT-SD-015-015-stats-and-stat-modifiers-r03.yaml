dec_2026_0091_scope_note: >-
  The Decision authorises renaming candidate-node keys and retaining all values, so two
  things a reader might expect were deliberately not done. No packet was recompiled and no
  GUP was produced; step 3 explicitly forbids it. The cross_gur_identities block, where this
  GUR has one, still names the sibling GUR revision and checksum that was current when the
  predecessor was published, because repointing it would change a value the Decision says to
