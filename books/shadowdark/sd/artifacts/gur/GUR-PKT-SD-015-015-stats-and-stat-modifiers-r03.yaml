source_summary: >-
  Printed page 15 of the Shadowdark main rules, headed STATS, states how a character's six stats are
  generated, names each stat with examples of what it covers, and provides the STAT MODIFIERS TABLE
  mapping a stat score to a modifier. One optional sentence permits generating a new set when no
  stat is high enough. This summary is orientation only; every assertion below cites the page.

graph_state_at_extraction: >-
  The Shadowdark canonical graph is empty at this extraction. rulesets/shadowdark/registries/nodes.csv
  contains only its header row, domain_registry.yaml has no domains, general_rules.json is an empty
  object, and character_races.yaml is inactive. No node in this GUR could be reused because no
  Shadowdark identity exists yet; every identity below is a candidate. Identical IDs in adnd1e or
  basicdnd are unrelated identities under constitution section 2 and were not consulted as authority.

