source_summary: >-
  Twelve creature stat blocks: Owlbear (cantankerous bear-owl, Crush), Panther (stealthy hunter, rend),
  Peasant (commoner in worn clothes, club), Pegasus (noble winged horse, hooves), Phoenix (immortal fire eagle,
  Impervious, Explosion, Heat Aura, Rebirth), Piranha, Swarm (school of fanged fish, Savage), Pirate (seafaring
  scoundrel, cutlass, dagger), Priest (clergy leader, chainmail + shield, mace, WIS spells Anoint, Healing Touch,
  Holy Flame, Rebuke), Purple Worm (castle-sized chitinous worm, Poison, Swallow), Rakshasa (demonic feline
  illusionist, Impervious, Mesmerism, holy weapon Weakness), Rat (plague rodent, Disease), and Rat, Dire
  (child-sized savage rodent, Disease).

