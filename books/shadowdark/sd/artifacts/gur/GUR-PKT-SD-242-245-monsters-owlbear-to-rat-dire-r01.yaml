non_edge_observations:
  - id: OBS-01
    subject: Phoenix legendary trait suite governs an immortal fiery elemental creature
    detail: >-
      Phoenix possesses Impervious (fire immunity, magical damage only), Explosion (on-death 10d6 damage on
      DC 18 DEX within double near), Heat Aura (turn-start 2d6 damage on DC 15 CON within near), and Rebirth
      (hatching from egg in 1d4 days). All operate on creature combat and life-cycle loci under Constitution 2.5.
  - id: OBS-02
    subject: Purple Worm Swallow and Poison represent massive beast attack riders
    detail: >-
      Swallow triggers on a natural 18-20 bite attack, dealing 2d10 damage per round in darkness with a
      20-damage regurgitation threshold; sting Poison imposes DC 15 CON or drop to 0 HP. Both operate on
      creature attack loci under Constitution 2.5.
  - id: OBS-03
    subject: Rakshasa defenses, mesmerism, and holy weapon weakness operate on creature locus
    detail: >-
      Rakshasa is immune to non-magical damage and spells of tier 3 or lower (Impervious); possesses mind-reading
      and disguise (Mesmerism); and carries a bespoke instant-death condition from a crossbow bolt enchanted by
      holy weapon (Weakness). This operates on creature defense locus under Constitution 2.5.
  - id: OBS-04
    subject: Priest stat block declares monster-specific spell actions
    detail: >-
      Priest lists Anoint (DC 12), Healing Touch (DC 11), Holy Flame (DC 13), and Rebuke (DC 13). Under
      Constitution 2.5, monster stat-block spells operate on creature action locus and do not establish player
      spell identities.
  - id: OBS-05
    subject: Invariant 4 evaluated for Priest
    detail: >-
      monster_priest is defined at its stat block locus on SD p243 and is architecturally distinct from the
      player character class identity class_priest (SD p30). Separate kinds (monster vs class) and prefixes
      maintain integrity.
  - id: OBS-06
    subject: Rat and Dire Rat Disease impose recurring Constitution damage
    detail: >-
      Both creatures impose Disease on bite hits (Rat DC 9 CON, Dire Rat DC 12 CON) dealing 1d4 CON damage that
      cannot be healed while ill, repeating daily until success, with death at 0 CON. This operates on creature
      attack/disease rider locus under Constitution 2.5.

