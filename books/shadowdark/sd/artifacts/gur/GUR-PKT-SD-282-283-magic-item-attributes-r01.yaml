source_summary: >-
  Pages 282–283 present the Magic Item Attributes section, covering qualities and random generation procedures:
  - QUALITIES defines magic item qualities including Bonus (+0 to +3 on AC or attack/damage), Benefit, Curse, and Personality (telepathy, virtues, flaws);
  - RANDOM MAGIC ITEM TYPE TABLE provides a d6 table selecting between Armor, Potion, Scroll, Utility, Wand, and Weapon;
  - RANDOM MAGIC ITEM QUALITIES TABLE provides a 2d6 table determining numbers of benefits and curses;
  - RANDOM MAGIC ITEM PERSONALITY TABLE provides a 2d6 table determining virtues and flaws for conscious items;
  - MAGIC ITEM IDEA GENERATOR provides a d20 name and concept generator table;
  - CONSUMABLES establishes usage constraints for potions and consumable items (must consume entire item, user chooses effect order).

