rejected_candidates:
  - text_locus: 'QUALITIES Bonus subsection numeric magnitudes, p282'
    quoted_gist: 'from +0 to +3... +0 items are the most frequent, and +3 items are very rare'
    why_considered: 'Checked whether specific numeric bonus ranges or distribution frequencies warrant edge conditions or separate nodes.'
    rejection_reason: >-
      Numeric magnitudes (+0, +1, +2, +3) and rarity/frequency statements are excluded from aspect/condition strings by Invariant 11 and Constitution section 5. The general modification to AC, attack, and damage is captured in M001-M003 without numeric encoding.
  - text_locus: 'RANDOM MAGIC ITEM TYPE TABLE Page column cross references, p282'
    quoted_gist: 'pg. 284, pg. 286, pg. 288, pg. 290, pg. 288, pg. 292'
    why_considered: 'Checked for CROSS_REFERENCES edges to specific item category tables.'
    rejection_reason: >-
      The referenced pages (284, 286, 288, 290, 292) are in future packets and outside this packet's bounded scope (SD pp. 282–283) per Scope Boundary and Invariant 10.
  - text_locus: 'QUALITIES Personality subsection telepathy prose, p282'
    quoted_gist: 'Magic items with personalities can communicate telepathically with their wielders.'
    why_considered: 'Checked whether telepathic communication warrants a separate ability or rule node.'
    rejection_reason: >-
      Descriptive property of conscious magic items rolled under the personality table; does not define an independent mechanical resolution procedure or character ability.
  - text_locus: 'MAGIC ITEM IDEA GENERATOR table entries, p283'
    quoted_gist: 'The Crimson Blade of Thundering Death... Ortivalʼs Rite of the Archmage... Memnonʼs Litany... Shuneʼs Shield... Ordʼs Armor'
    why_considered: 'Checked for edges to deities (Memnon, Shune, Ord, Madeera) or named figures (Ortival, Krull, Brak).'
    rejection_reason: >-
      Table entries provide cosmetic name components for magic item concepts. Mention of deities and characters provides flavor and lore rather than mechanical deity worship, spellcasting, or class relations (Constitution 2.2, 2.4).
  - text_locus: 'RANDOM MAGIC ITEM QUALITIES TABLE and RANDOM MAGIC ITEM PERSONALITY TABLE dice results, p282'
    quoted_gist: '2d6, Benefit 1/2, Curse 1, Virtue 1, Flaw 1'
    why_considered: 'Checked whether benefits, curses, virtues, and flaws should be separate nodes.'
    rejection_reason: >-
      Individual count thresholds (1 benefit, 1 curse, etc.) and dice bands (2-3, 4-7, etc.) are table resolution outputs excluded under Invariant 11.
