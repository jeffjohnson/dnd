rejected_candidates:
- text_locus: the four treasure quality categories, p117
  quoted_gist: Poor, Normal, Fabulous and Legendary, each bolded, each given a stated experience value
    and a description, and each repeated in the table with examples
  why_considered: Four named, bolded categories with their own descriptions, appearing twice on the page.
    They are the most identity-shaped thing here, and the spell tiers were minted as five identities on
    a similar footing.
  rejection_reason: 'Each category''s entire mechanical content is an experience value, which is a magnitude
    no field may store. Stripped of the number, Poor and Fabulous differ only in adjectives. This is the
    same reasoning that declined the danger levels and travel methods in PKT-SD-090-090, the carousing
    outcomes in PKT-SD-091-093 and the light mishap results in PKT-SD-110-110.

    The spell tiers are not a counter-example. They were authorised by an Architect Decision and each
    carries classification relations to individual spells, so each connects to something. A treasure category
    connects to nothing but its own value. The table is proposed and rule_treasure is RESOLVED_BY it,
    which carries what is expressible: quality determines the award.'
- text_locus: the XP reset sentence, p117
  quoted_gist: '''When PCs gain a new level, their XP resets to zero.'''
  why_considered: A definite mechanical statement joining two canonical identities, exp_level and exp_xp.
  rejection_reason: 'Restatement, verified rather than assumed: exp_level MODIFIES exp_xp with aspect
    total reset is already canonical from printed page 39, which is the advancement chapter and its defining
    locus. A row from here would repeat the fact under a worse citation, and choosing a different aspect
    to avoid the collision would put two rows behind one rule.'
- text_locus: three of the five SOURCES OF XP bullets, p117
  quoted_gist: oaths, secrets and blessings; meaningful trophies and tokens; and gems alongside gold
  why_considered: The one-row-per-bullet test from PKT-SD-111-111 says each bullet is a separate statement,
    so declining three of five needs a reason rather than a silence.
  rejection_reason: 'None has an identity and none can be minted from a list of examples. There is no
    oath, secret, blessing, trophy or gem concept in the graph, and this page defines none of them; it
    lists them as kinds of thing a GM might treat as treasure. The two bullets that are asserted, magic
    items and gold, are asserted because their identities already exist and the page names them as sources,
    not because they matched a string. Gems specifically are declined even though they appear in the same
    bullet as gold, because item_coin is coin and a gem is not.

    One row per bullet is the default, not a requirement to produce a row where there is no endpoint.'
- text_locus: the per-character distribution rule, p117
  quoted_gist: '''Each PC gets the full XP value of each treasure.'''
  why_considered: 'An unhedged mechanical rule, and a consequential one: it means a party of four converts
    one treasure into four times its experience.'
  rejection_reason: There is no identity for a character or a party, so the rule has no source and no
    target beyond exp_xp, which M002 already connects. The statement is about how an award is distributed
    among people, and people are not in this graph. Recorded as OBS-02 because it is a genuinely important
    rule that the vocabulary cannot hold.
- text_locus: the gold guideline and its level bands, p117
  quoted_gist: each group should gain about a stated amount of gold per treasure find scaled by average
    party level, restated as three bands covering levels zero to three, four to six and seven to nine
  why_considered: The bands look like named tiers of the kind that might be minted, and the guideline
    is the page's only quantitative rule about gold rather than experience.
  rejection_reason: 'Partially rejected. The relation it states, that expected treasure value scales with
    party level, is asserted as M006, and that gold is the medium of that value is M005. The three bands
    are not proposed: each is a pair of numbers and nothing else, which is the OBS-01 magnitude exclusion,
    and they merely restate the same scaling the multiplier already expresses. The word about in the source
    marks the whole guideline as approximate, which is a further reason not to carry its figures.'
non_edge_observations:
- id: OBS-01
  subject: magnitudes are excluded from every row
  detail: 'This page is almost entirely numeric: four experience values for the quality categories, repeated
    in the table, a stated award for clever thinking, a gold multiplier per average party level, and three
    level bands each with a gold figure. None reaches a field.

    What survives is the structure: treasure feeds the award, quality determines it through the table,
    party level scales the expected value, and gold is the medium. A reader wanting any figure reads printed
    page 117. No row carries a condition and no aspect carries a digit.'
- id: OBS-02
  subject: the per-character distribution rule cannot be carried
  detail: 'Each character receives the full experience value of each treasure rather than a share. That
    is unhedged, mechanically consequential and invisible to the graph, because there is no identity for
    a character or a party for the rule to relate.

    Worth flagging as a distinct gap from the condition vocabulary recorded over the last two packets.
    Conditions are things the rules do to characters; this is a rule about characters as countable participants.
    The party has surfaced before, in the carousing cost shared between participants and in the Wizards
    and Thieves pot, and was unrepresentable each time. It is a recurring shape rather than a one-off.'
- id: OBS-03
  subject: treasure now exists but its contents do not
  detail: 'rule_treasure is proposed here and closes three earlier forward references, but it is thin
    by design: this page defines treasure only as a thing with a quality rating that converts to experience.
    What treasure actually consists of is not here. The table''s examples name a bag of gold, a gem, fine
    armor, a magic scroll, a magic sword, mithral chainmail and a named artefact, several of which have
    canonical identities, and none is asserted because they are examples of quality tiers rather than
    statements about those items.

    If a later chapter gives treasure its own contents or generation tables, that page is their locus
    and rule_treasure will gain rows there. Recorded so the identity''s thinness is understood as scope
    rather than omission.'
unresolved_identity_questions:
- id: IDQ-01
  subject: whether Awarding XP and Treasure should be one identity or two
  detail: 'I proposed both and connected them with M001. The alternative is a single identity carrying
    everything, most naturally rule_treasure, with the award rows hanging off it directly.

    My reason for two: the page is titled AWARDING XP and its rule is about experience, while treasure
    is the thing rated and is what three earlier packets pointed at. They also behave differently, since
    clever thinking awards experience without any treasure at all, which M007 carries and which a single
    treasure identity could not hold without misdescribing it. Keeping them apart is also what lets the
    quality table attach to treasure rather than to the award rule.

    The case against is that rule_awarding_xp carries only two rows, both into exp_xp, and a reader might
    reasonably see it as a label for the page rather than a mechanic. Consequence if wrong: M001 disappears,
    M002 and M007 repoint to rule_treasure, and one identity is withdrawn; no other row changes. Flagged
    because it is a structural choice at a locus three other packets depend on, and I would rather it
    were settled deliberately than inherited.'
architectural_escalations: []
architectural_escalation_note: None raised. All three identities use an approved prefix, every row uses
  a legal edge type at status core, no row carries supersession_basis and none is an OVERRIDES, and no
  CLASSIFIED_AS row appears. OBS-02 records a recurring gap around characters and parties as countable
  participants, which is recorded for the Architect alongside the condition vocabulary rather than escalated
  from inside a packet.
completeness_statement: 'The whole of printed page 117, its opening rules, four category bullets, two
  lists, gold guideline and closing table, was read at the recorded checksum. The packet yields 3 new
  identities and 7 rows, all citing page 117, reusing 4 canonical identities whose labels the assembling
  script asserted equal to the registry. Every row was checked against the 695 canonical edges for an
  assertion-key collision, for a shared source, type and target under a different aspect, and for duplicates
  within the patch; there are none of any, and no canonical row cited this page before.

  Five candidates were rejected and each is recorded with its reason, including one verified restatement
  of the canonical printed page 39 experience reset. What is deliberately not asserted is listed as OBS-01
  through OBS-03, and the single open question, IDQ-01, concerns whether this page should yield one identity
  or two. Every figure in this GUR was computed from the canonical files rather than counted by hand.
  No assertion depends on any other ruleset.'
