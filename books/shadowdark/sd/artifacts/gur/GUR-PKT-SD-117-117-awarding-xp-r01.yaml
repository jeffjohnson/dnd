authored_polarity_declaration: Authored polarity appears on two rows and no others, both MODIFIES into
  exp_xp and both improves with basis read, as constitution section 5 and invariant 15 require. The four
  FEEDS_INTO rows and the RESOLVED_BY row carry none, since section 5 derives those. No CONSTRAINS or
  TRIGGERS row appears in this packet.
two_award_rows_note: 'M002 and M007 are both rule_awarding_xp MODIFIES exp_xp and they are two statements,
  not one repeated. The page''s main rule is that experience comes from treasure, which is M002 with aspect
  treasure award. The SOURCES OF XP list then names clever thinking, with its own stated award, and that
  is not treasure at all: it is a character''s play at the table. M007 carries it with aspect clever thinking.

  Keeping them apart matters because they differ in kind. Everything else on the page flows through treasure
  and its quality categories; clever thinking bypasses that entirely, and collapsing the two would imply
  that ingenuity is rated on the treasure quality table, which it is not. This applies the one-statement-per-row
  test from PKT-SD-111-111.'
