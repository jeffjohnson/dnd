page_attribution_basis: One marker resolves this packet. p117 ends the AWARDING XP heading, which is also
  the section's first heading, and placement rule 1 applies it to that whole heading while the persistence
  rule carries it across the three subsections and the table. All seven rows cite printed page 117. No
  content precedes the marker and no page is shared.
scope_boundary: The bounded scope is the Primary Source Material section, the single printed page 117.
  The trailing Supporting Source Context is out of scope.
source_summary: 'Characters gain experience from the valuable treasures and boons they earn, and awards
  need not reflect monetary value since boons and fabled items have intangible worth. Treasure falls into
  four named quality categories, each worth a stated amount of experience. Each character receives the
  full value of each treasure, and experience resets on gaining a level. Five sources of experience are
  listed: gold and gems, oaths and secrets and blessings, magic items, meaningful trophies, and clever
  thinking, the last with its own stated award. A guideline then gives the gold value a group should find
  per treasure, scaled by average party level and restated as three level bands. A table closes the page,
  repeating the four quality categories with their experience values and giving examples of each.'
graph_state_at_extraction: 'Read from the repository at extraction, not recalled, and every figure below
  is computed from the canonical files by the assembling script rather than counted by hand, which is
  the method adopted after two prose count slips earlier in this intake.

  The canonical graph holds 323 registry rows and 695 edges. No canonical row cites printed page 117,
  so nothing in this span has been extracted before, and no treasure identity existed despite four earlier
  packets pointing forward to this page. exp_xp carries 6 rows, of which 4 already grant an award by modifying
  it. item_coin carries 5 rows and item_magic_item 1.

  Every proposed row was checked against the canonical edge set for an assertion-key collision, for a
  shared source, type and target under a different aspect, and for duplicates within the patch; there
  are none of any. Every reused label was asserted equal to the registry label by the script.'
forward_reference_closed_note: 'This page is the treasure locus that earlier packets pointed at and could
  not reach. PKT-SD-101-109 recorded a pointer from printed page 105 to treasure on page 117 among its
  six unassertable forward references, and PKT-SD-091-093 declined two carousing outcomes granting an
  item from a treasure table for the same reason. rule_treasure is proposed here from its defining locus.

  As with the Reaction Check in PKT-SD-112-113, the pointers themselves remain unassertable from here,
  because the referring sentences lie in those packets'' bounded scopes and both are integrated. This
  is the third forward reference the intake has resolved simply by reaching the target page in ordinary
  sequence, and the third that still owes a successor at the referring page.'
