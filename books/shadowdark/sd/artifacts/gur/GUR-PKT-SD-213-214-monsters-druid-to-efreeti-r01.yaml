source_summary: >-
  Five monster stat blocks across printed pages 213 and 214: Druid, Dryad, Duergar, Dung Beetle, Giant,
  and Efreeti. Druid carries five innate INT spells (Barkskin, Conjure Flames, Imbue, Summon Bear,
  Thunderclap). Dryad carries Charm and Meld. Duergar carries Enlarge, Invisibility, Sunblind, and
  a chainmail + shield AC notation. Dung Beetle, Giant carries Knock. Efreeti carries Impervious,
  Wall of Flame, and Wish.

