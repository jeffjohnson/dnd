non_edge_observations:
  - id: OBS-01
    subject: Wish on Efreeti mirrors Wish on Djinni
    detail: >-
      Efreeti's Wish ability (p214) matches Djinni's Wish ability (p209), allowing casting of Wish
      once per week for a mortal without a spellcasting check. Both operate on creature locus under
      Constitution 2.5.
  - id: OBS-02
    subject: Druid monster stat-block spells operate on creature locus
    detail: >-
      Druid carries five distinct spells (Barkskin, Conjure Flames, Imbue, Summon Bear, Thunderclap)
      as innate INT spells with creature-specific DCs. Under monster spellcasting rules and
      Constitution 2.5, these operate on creature locus rather than establishing edges in the
      character spellcasting system.
  - id: OBS-03
    subject: Impervious recurs on Efreeti
    detail: >-
      Impervious recurs on Efreeti with non-magical damage immunity and fire immunity, consistent with
      its usage on Balor (p204) and Archdevil (p206).

