units_note: 'Figures name their unit. Measured by the building script from the claimed source: 1 named
  table, 50 data rows keyed to a hundred-sided roll, 0 sentences of prose, 23 rows on printed page 148
  and 27 on 149.'
page_attribution_basis: 'The page break falls inside the table, as it has in every packet of this chapter
  so far. The p148 marker sits on the CAVE ENCOUNTERS heading under placement rule 1. The p149 marker
  sits in the last cell of one table row, and acceptance test 3 applies a table-row marker to the whole
  row, so that row is page 149 and persistence carries 149 to every row after it.

  The script locates the marker by row index rather than by eye and derives each row''s page from it:
  23 rows are page 148 and 27 are 149. Each submitted row is cited to the page of the cell it rests on,
  and the script asserts that placement from the located cell index rather than from my reading.'
scope_boundary: 'The bounded scope is the Primary Source Material section, printed pages 148 and 149:
  one named table of 50 rows and no prose. The Supporting Source Context appends the random encounter
  procedure from printed pages 112 and 113 and the monster attributes page from 189. Both are out of scope
  and no row cites either.

  That exclusion matters here because the appended encounter procedure is the very rule this table resolves.
  Its content belongs to PKT-SD-112-113, which is already integrated, and re-asserting it would duplicate
  canonical rows from a repeated passage.'
source_summary: 'A single hundred-sided encounter table for caves, 50 rows, with no procedure, no heading
  prose and no instructions. Most results are underground creatures: manticores, gnolls, a basilisk, drow,
  duergar, cloakers, darkmantles, a drider, ettercaps, a bulette. A handful are environmental: dripping
  acid, superheated steam from stalagmites, toxic spores, falling rock. One cell puts a kobold in a bear
  trap, two mention rival crawlers, and one instructs the reader to roll twice and combine.'
graph_state_at_extraction: 'Read from the repository at extraction, not recalled, and every figure here
  is computed by the building script from the canonical files and the claimed source.

  The canonical graph holds 405 registry rows and 780 edges, and 0 rows cite printed page 148 or 149,
  so nothing in this span has been extracted before. The registry holds 105 tbl_ identities and 0 monster_
  identities, the latter being the figure that governs how much of this table is extractable at all.

  rule_encounter carries 13 rows, of which 5 are RESOLVED_BY. The script asserts that the proposed table
  id is absent from the registry before using it.'
chapter_disposition_note: 'The disposition for this chapter was argued in full at PKT-SD-142-143 and is
  applied here rather than re-argued. In short: no procedure identity, because the table''s own title
  names rule_encounter and that rule has been canonical since printed page 112, so this table is a further
  resolver of an existing rule rather than evidence of a new one. No terrain or district identity, because
  values were declined at their own defining loci for danger level, treasure quality and settlement size.
  No creatures and no named characters, because the registry holds 0 monster_ identities and a creature''s
  defining locus is its stat block, not a line in an encounter table.

  What remains is the small set of cells that state a mechanic or name a canonical procedure, and those
  are found by measurement rather than by reading.'
name_match_measurement_note: 'The cells were matched against the whole registry by script, not scanned
  by eye, because a table of 50 prose cells is where a reference gets missed and where a false one gets
  asserted. Both happened in earlier packets: rule_natural_twenty was missed at PKT-SD-101-109 by keyword-searching
  instead of reading the registry, and a false absence claim about rule_invisibility reached production
  from PKT-SD-062-065.

  13 of the 50 cells contain a token sequence matching a canonical label. 2 of the matched identities
  are real references: rule_rival_crawlers, rule_traps. The other 7 are ordinary English colliding with
  an identity label: ancestry_dwarf, ancestry_elf, ancestry_goblin, item_campfire, lang_giant, lang_goblin,
  spell_light.

  The pattern is the same as the three packets before it and the volume is higher, because a cave table
  is full of giants, dwarves, elves and goblins. A giant frog is not lang_giant, a hill giant queen is
  not lang_giant, a dwarf knight is not ancestry_dwarf, and a goblin shaman is neither ancestry_goblin
  nor lang_goblin; each names a creature in the unextracted monster chapter, not a playable ancestry or
  a language. spell_light matches twice, on the edge of the light and on cave paintings that emit soft
  light, and neither is a spell. item_campfire is the one worth pausing on: dwarves roasting mutton around
  a campfire names a canonical item, but the cell states no mechanic, so it is scenery in exactly the
  way zombies in armor were at PKT-SD-142-143.'
