rejected_candidates:
- text_locus: the creature results across the table, pp148 and 149
  quoted_gist: manticores, mushroomfolk, deep gnomes, gnolls, a giant frog, ghouls, a basilisk, beastmen,
    bugbears, orcs, a hill giant queen, drow, a chimera, cave creepers, kobolds, a troll overlord, duergar,
    cloakers, giant spiders, darkmantles, a drider, a water elemental, ettercaps, a grick, an otyugh,
    violet fungus, a wraith, a wyvern, stingbats, an ochre jelly, lizardfolk, giant centipedes, a bulette
    and the Wandering Merchant
  why_considered: 'This is the densest creature table the chapter has produced so far, and several entries
    are individually named: a Blue Tusk clan goblin shaman, a troll overlord, Binkin and Bobbin, the Wandering
    Merchant.'
  rejection_reason: A creature's defining locus is its stat block in the unextracted monster chapter,
    and the registry holds no monster_ identity. Proposing any of these would take identity ownership
    from the packet that owns the defining locus and fix a label from an incidental mention. This is the
    fourth packet running in which the same distinction is drawn, and the volume here is the argument
    for drawing it consistently rather than case by case.
- text_locus: the environmental results that state no mechanic, pp148 and 149
  quoted_gist: dripping water that is actually searing acid, cracked stalagmites venting superheated steam,
    toxic spores puffing up from fungi, sharp stalagmites that fall at the slightest vibration, webbing
    strung across a passage
  why_considered: These are the closest thing in the chapter so far to the arctic weather cells that earned
    a TRIGGERS row to rule_damage, and four of them would harm anyone who walked into them. rule_hazards
    is canonical from printed page 115.
  rejection_reason: The arctic row was earned because two cells state a die of damage and a cadence. Not
    one cell here states a check, a die, a value or a consequence, and the word damage does not appear
    on the page. Searing acid and falling stalagmites are situations a GM adjudicates. The word hazard
    does not appear either, so rule_hazards has nothing to attach to. Recorded as OBS-02 because this
    is the page where the absence is most conspicuous.
- text_locus: the campfire, p149
  quoted_gist: a patrol of dwarves roasts mutton around a campfire
  why_considered: item_campfire is canonical, and the cell scan flagged it as one of 13 name matches.
  rejection_reason: 'The cell states no mechanic: nobody lights it, nothing is warmed by it, no light
    radius or rest is invoked. It is scenery that happens to be named the same as an identity, which is
    the reading that declined zombies in armor against item_armor at PKT-SD-142-143 and a pottery shop
    against rule_shop at PKT-SD-144-145.'
- text_locus: the two light results, pp148 and 149
  quoted_gist: ghouls stalking from the edge of the light, and luminous cave paintings that emit soft
    light
  why_considered: rule_light_source is canonical and DEC-2026-0104 is implemented and open, so a classification
    row was available in principle, and cave paintings that emit light are an odd enough object to test
    it.
  rejection_reason: DEC-2026-0104 governs item_ to rule_light_source classification, and neither of these
    is an item identity or could be one from an encounter cell. The edge of the light is a description
    of where ghouls stand. The cave paintings state no radius, no duration and no fuel, so nothing about
    them is mechanically a light source in the sense printed page 34 defines. spell_light matched both
    cells in the scan and neither is a spell.
- text_locus: the two-encounter instruction, p149
  quoted_gist: one result instructs the reader to roll twice more and combine the results, rerolling that
    result if it comes up again
  why_considered: It is the only instruction on the page and it is fully mechanical.
  rejection_reason: Its content is arithmetic on the table's own roll, which is a magnitude, and what
    would remain is a self-edge asserting nothing. Declined in the same form in each of the three preceding
    chapter packets.
- text_locus: the appended random encounter procedure and monster attributes, out of scope
  quoted_gist: the printed page 112 and 113 encounter procedure and the printed page 189 monster attributes
    page
  why_considered: Both are in the file and the first is the rule this table resolves.
  rejection_reason: Both are Supporting Source Context, outside the bounded scope. PKT-SD-112-113 is already
    integrated, so extracting from it would duplicate canonical rows and cite pages outside this packet's
    range.
non_edge_observations:
- id: OBS-01
  subject: both rival crawler cells were found and only one carries the row
  detail: 'Two cells name the generator: one has a troll dragging the dead body of a rival crawler, singular,
    and one has a group of rival crawlers fleeing a swarm of spiders. The row is carried by the plural
    cell.

    Recorded because the singular cell would not have been found by the registry scan at all. The canonical
    label is Rival Crawlers, and the token-subset match requires both words, so a cell saying rival crawler
    matches nothing. I located it with a separate search on the singular stem after the scan, which is
    a limitation of the method worth naming: the scan finds label matches, not concept matches, and a
    source that inflects a name will slip past it. One row is correct either way, since both cells support
    the same assertion key and a second would be a duplicate, but a packet where only the singular form
    appeared would have lost the row silently.

    This also sharpens the near-miss recorded one packet ago. The castle district cell said crawlers with
    no rival and got no row; these say rival crawler and rival crawlers and one does. The distinguishing
    token is rival, and that is now tested in both directions.'
- id: OBS-02
  subject: the chapter's environmental hazards are consistently unexpressible
  detail: 'This page has searing acid dripping from the ceiling, superheated steam venting from stalagmites,
    toxic spores, and stalagmites that fall at the slightest vibration. Every one would hurt a character
    and not one states a die, a check or a consequence, so none reaches the graph.

    Four packets in, the pattern is clear enough to state: this chapter states mechanics only for weather,
    and only twice, both on the arctic page. Everything else dangerous is left to the GM. The graph will
    therefore show these tables as almost inert, and a reader would not guess that a cave table is full
    of things that can kill you. It is an accurate reflection of what the source states rather than a
    gap in the extraction, but it is worth having on the record once for the whole chapter rather than
    implicitly in twenty-two rejection notes.'
