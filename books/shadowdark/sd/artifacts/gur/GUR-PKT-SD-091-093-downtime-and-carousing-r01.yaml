non_edge_observations:
- id: OBS-01
  subject: magnitudes are excluded from every row
  detail: 'The outcome table is the densest numeric content extracted so far and none of it reaches a
    field: seven event costs in coin, seven event bonuses, fourteen die results, fourteen experience awards,
    six percentages of total wealth, a fine duration, two treasure-table ranges and the learning check''s
    difficulty number. All stay in the immutable packet. No row in this packet carries a condition, so
    there is no opportunity for a spelled quantity to enter one; verified programmatically that no aspect
    carries a digit.'
- id: OBS-02
  subject: the fourteen outcomes are not proposed as identities
  detail: Each row of the outcome table names a vivid event and a benefit. None is proposed. The events
    are narrative rather than mechanical, and the benefits reduce to experience, which is asserted, luck
    tokens, which are asserted, NPC relationships, which have no identity, and treasure items, discussed
    in OBS-04. Proposing fourteen identities whose mechanical content is already carried by three rows
    would inflate the registry without adding a queryable fact. This follows the same reasoning as the
    danger levels and travel methods in the preceding packet.
- id: OBS-03
  subject: NPC allies, enemies and debts are not representable
  detail: 'Seven of the fourteen outcomes grant a relationship: a priest ally, a famous bard ally, an
    ally in the City Watch, an NPC ally or enemy, a noble''s debt, being barred from a tavern. There is
    no NPC, faction, reputation or relationship identity in the graph and none is proposed, since minting
    one is not an Analyst act and the source defines no mechanic for them. The carousing overview''s promise
    of an NPC contact is therefore recorded and not asserted.

    This is the same class of gap as the spells that act on the fiction, recorded across the spell chapter.
    Here it is more visible because the relationship outcomes are half the table.'
- id: OBS-04
  subject: two forward references are deliberately not asserted
  detail: 'The page points to the Wizards and Thieves game on printed page 94 for playing out a gambling
    scene, and two outcomes grant an item from a treasure table by range. Neither target exists as a canonical
    identity: page 94 is the next packet''s defining locus and the treasure chapter is unextracted.

    Asserting either would require proposing an identity whose defining locus belongs to another packet,
    which would pre-empt that packet''s own extraction and risk a label or kind that its own page contradicts.
    Both are recorded here so the connection is available to whoever extracts those pages. The Time Passes
    reference is different and is asserted, because that rule is already canonical from printed page 82.'
- id: OBS-05
  subject: what learning cannot acquire is carried, what it can is not enumerated
  detail: 'The page states the exclusion precisely, that class and ancestry unique talents cannot be learned,
    and that is asserted against the canonical rule_talents. What learning can acquire is given only by
    example, a new language or riding a sandworm, with the real answer being whatever the GM agrees. The
    examples are not asserted: languages are canonical identities but the page is not their defining locus
    and does not state a mechanic connecting learning to any particular one.

    What is carried instead is the two general effects the page does state, that learning enables new
    actions and grants advantage on certain checks.'
unresolved_identity_questions:
- id: IDQ-01
  subject: whether carousing should carry its own experience row at all
  detail: 'Two rows point at exp_xp: rule_carousing MODIFIES it from printed page 91, and tbl_carousing_outcome
    MODIFIES it from printed page 93. I judged these to be different facts, the first that carousing converts
    coin into experience and the second that the table sets how much, and cited each to the page that
    states it.

    A Reviewer could reasonably hold this to be one fact carried twice, which is exactly the duplication
    I argued against in the restatement notes of the last two packets, and prefer only the table row.
    My reason for keeping both is that the page 91 statement is the reason a player chooses carousing
    at all and survives even if the table is later revised, whereas the page 93 row is about quantity.
    But I hold it loosely.

    Consequence if wrong: the page 91 row is withdrawn, carousing keeps its coin and table rows, and the
    experience connection survives through the table. Flagged rather than defaulted.'
architectural_escalations: []
architectural_escalation_note: None raised. Every identity uses an approved prefix, every row uses a legal
  edge type, no CLASSIFIED_AS row appears and no row targets a sys_ axis. The two forward references in
  OBS-04 are recorded rather than escalated, because they resolve naturally when those pages are extracted.
  The relationship gap in OBS-03 is recorded for the Architect as part of the standing pattern rather
  than raised from inside a packet.
completeness_statement: All six headings in the bounded scope were read at the recorded checksum. The
  packet yields 5 new identities and 19 rows across three printed pages, every one checked against the
  614 canonical edges for an assertion-key collision, for a shared source, type and target under a different
  aspect, and for duplicates within the patch; there are none of any, and the ALTERNATIVE_TO row was compared
  with sorted endpoints. Ten canonical identities are reused rather than re-proposed, found by reading
  the registry in full. Carousing is described on two pages and carries one identity, with each row cited
  to the page that states it, explained in one_rule_two_pages_note. The two tables sit on different printed
  pages and are cited separately. No row carries a condition and no aspect carries a digit. What is deliberately
  not asserted is listed as OBS-01 through OBS-05, and the single open question is IDQ-01. No assertion
  depends on any other ruleset.
