page_attribution_basis: 'Three markers resolve this packet: p91 ends the DOWNTIME heading, p92 ends the
  second CAROUSING heading and p93 ends the CAROUSING OUTCOME TABLE heading. Placement rule 1 applies
  each to its whole heading and the persistence rule carries it forward.

  The p93 marker matters and is easy to get wrong. It sits on the outcome table''s own heading, so that
  table is printed page 93, while the event table, which precedes it under the p92 marker, is printed
  page 92. The two tables are on different pages and are cited separately: rows touching the event table
  cite 92, rows touching the outcome table cite 93. No content precedes the first marker and no page is
  shared with another packet.'
scope_boundary: The bounded scope is the Primary Source Material section, printed pages 91 to 93, covering
  the downtime frame, its two activities and the two carousing tables. The trailing Supporting Source
  Context is out of scope.
source_summary: 'Between adventures a character undertakes one downtime activity. Carousing spends coin
  to convert it into experience, usually yields an NPC contact and may yield a magic item, can run for
  days of game time, and points to the Time Passes rule. Learning acquires an auxiliary skill, requires
  a willing instructor, cannot take another class''s or ancestry''s unique talents, enables new actions
  or grants advantage on certain checks, and is resolved by a hard Intelligence check whose difficulty
  eases by one step on each retry. Carousing is then given in full: participants share the cost, each
  rolls against an outcome table with the event''s bonus, and each gains the experience and consequences
  their result states.'
graph_state_at_extraction: 'Read from the repository at extraction, not recalled: the canonical graph
  holds 270 registry rows and 614 edges. The registry was read in full rather than keyword-searched, which
  is now the standing method; it surfaced rule_luck_token, rule_difficulty_class, rule_talents and exp_xp
  as existing identities this packet touches. Every proposed row was checked against the canonical edge
  set for an assertion-key collision, for the weaker case of a shared source, type and target under a
  different aspect, and for duplicates within the patch itself; there are none of any. The single ALTERNATIVE_TO
  row was compared with its endpoints sorted, as constitution section 4 requires.'
one_rule_two_pages_note: 'Carousing is described twice in this packet, in overview on printed page 91
  and in full on printed page 92. It is one rule and carries one identity, rule_carousing, proposed from
  page 91 where it is first named.

  Its rows are cited to whichever page states them, not all to one page. The coin cost, the experience
  conversion and the Time Passes pointer are page 91 statements. The two table-resolution rows are page
  92 statements. Nothing is asserted twice: the page 92 text restates that carousing costs coin and yields
  experience, and those restatements are not given second rows, because a second row for one fact reads
  as two rules.'
