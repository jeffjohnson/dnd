authored_polarity_declaration: Authored polarity appears on four rows and no others, each with basis read
  as invariant 15 requires, and each is a MODIFIES or CONSTRAINS row as constitution section 5 allows.
  The single CONSTRAINS row takes governs. The two experience awards take improves, and so does the retry
  easing, because lowering a difficulty improves the check's prospects. There is no TRIGGERS row in this
  packet. The seven FEEDS_INTO, two GATES, two RESOLVED_BY, one ALTERNATIVE_TO, one CONSUMES, one CROSS_REFERENCES
  and one EXCLUDES row carry none, since section 5 derives those.
alternative_to_note: 'One ALTERNATIVE_TO row appears, between carousing and learning, and it is the mechanical
  content of the downtime frame rather than a convenience. The page states that a character chooses one
  downtime activity, which makes the two mutually exclusive, and ALTERNATIVE_TO is the type for exactly
  that. Its endpoints were sorted before the collision check, as constitution section 4 requires for this
  type.

  The row will need revisiting when further downtime activities are extracted, because mutual exclusivity
  among three or more activities is not expressible as a single pairwise row. Recorded now rather than
  discovered later.'
