rejected_candidates:
- text_locus: the creature results across the table, pp142 and 143
  quoted_gist: a kraken, a frost troll, orcs, a snow ape, skeletons, will-o'-wisps, a mammoth, a wyvern,
    hobgoblins, winter wolves, harpies, goblins, a lich's skull, treants, smilodons, remorhaz, a wight,
    a frost dragon, a roc, a frost giant, zombies, duergar, an ogre, snow apes, giant spiders, halflings,
    ghouls, dwarves, a purple worm, an owlbear, a cubi devil and the Wandering Merchant
  why_considered: They are the substance of the table and several are individually named rather than generic,
    the Waste Walker, the Lumberjack, Hermit Leedrin, the Ice Rat Tribe and the Wandering Merchant, three
    of them with a level and equipment in parentheses. Under the ruling settled at PKT-SD-136-137 a source-named
    object earns an identity.
  rejection_reason: 'That ruling attaches an identity to a named result at its defining locus, and a creature''s
    defining locus is its stat block in the monster chapter, not a line in a terrain table. The registry
    holds 0 monster_ identities and the chapter is unclaimed, so proposing any of these would mint identities
    for content another packet owns and would fix their labels from an incidental mention. The Wandering
    Merchant is the clearest case: it has its own entry on printed page 213, inside an unclaimed packet.
    Recorded as OBS-02.'
- text_locus: the two-encounter instruction, p143
  quoted_gist: one result instructs the reader to roll twice more and combine the results, reversing that
    result if it comes up again
  why_considered: It is the only instruction on the page, it is unhedged and fully mechanical, and a table
    that reaches itself is a genuine structure.
  rejection_reason: 'Its content is arithmetic on the table''s own roll: how many times to roll and which
    results to discard. Those are magnitudes. What would remain is a self-edge from the table to itself,
    which asserts nothing and which the earlier packets declined in the same form for the cross-drink
    effects on printed page 137.'
- text_locus: the terrain name in the heading and the table title, p142
  quoted_gist: the page is headed ARCTIC and its table is the ARCTIC ENCOUNTERS TABLE
  why_considered: Twenty-two packets in this chapter are named for a terrain or a city district, and the
    hex terrain table on printed page 132 lists terrain features whose names line up with them. An identity
    for the terrain, or a row from the hex terrain table to this one, would make the chapter navigable.
  rejection_reason: 'Terrain values were declined as identities at their own loci, as danger levels and
    treasure qualities and settlement sizes were, and nothing here changes that. The row to the hex terrain
    table is a different matter: it may well be true, but this page never mentions hexes, terrain selection
    or overland travel, so there is no in-scope evidence for it and asserting it would be inference rather
    than reading. Recorded as OBS-03.'
- text_locus: the environmental results that state no mechanic, pp142 and 143
  quoted_gist: thin ice weakened by hot springs shifts and cracks, an unnatural glow from a crevasse,
    a sliding ziggurat of ice, a humming mushroom field, a prismatic portal to the Fey realm, sulfuric
    regenerative springs
  why_considered: rule_hazards is canonical from printed page 115 and cracking ice under a party is the
    plainest hazard on the page, and regenerative springs sound like healing.
  rejection_reason: None of these cells states a check, a value, a duration or a consequence; each describes
    a thing the party finds and leaves the GM to adjudicate. The word hazard does not appear on the page.
    The two weather cells are different in kind precisely because they state a die of damage and a cadence,
    and those are carried by M002.
- text_locus: the appended random encounter procedure, out of scope
  quoted_gist: the whole of the printed page 112 and 113 encounter procedure, including the check cadence
    by danger level, the distance and activity tables, the reaction check and the treasure clause
  why_considered: It is in the file, it is the rule this table resolves, and it states relationships the
    graph would want.
  rejection_reason: It is Supporting Source Context, out of the bounded scope, and its primary packet
    PKT-SD-112-113 is already integrated. Extracting from it would duplicate canonical rows and cite pages
    outside this packet's range. The same applies to the monster attributes passage from printed page
    189, whose primary packet is unclaimed.
non_edge_observations:
- id: OBS-01
  subject: the chapter's yield per packet will be very low and that is correct
  detail: 'This packet reads 50 source rows and submits 4 edges and 1 identity. Twenty-one more packets
    of the same shape follow. On the reading set out in chapter_disposition_note each will yield one table
    registration, one RESOLVED_BY row to rule_encounter, and whatever small number of its cells state
    a mechanic or name a canonical procedure.

    Recorded so that the thinness is visible as a disposition rather than mistaken for incomplete work.
    The chapter is a body of creature references waiting on a chapter that has not been extracted, and
    the graph will only be able to say what these tables contain once the monster identities exist. That
    is a sequencing fact about the intake, not a defect in these packets, and a later pass could add the
    creature reaches without revising anything submitted here.'
- id: OBS-02
  subject: five results are individually named characters and none can be proposed
  detail: 'The Waste Walker, the Lumberjack, Hermit Leedrin, the Ice Rat Tribe and the Wandering Merchant
    are named, and three carry a level and equipment in parentheses, which is closer to a stat block than
    anything else in the table. Under the ruling settled one packet ago a source-named object earns an
    identity, so the question had to be asked rather than assumed away.

    They get none, because that ruling attaches the identity at the defining locus and these are incidental
    mentions. The Wandering Merchant demonstrates it: it has a full entry in the monster chapter, on a
    page inside an unclaimed packet, and minting it here would fix its label and kind from a one-line
    encounter result. Recorded because the distinction between the drink ruling and this one is fine and
    will be tested again in every packet of this chapter.'
- id: OBS-03
  subject: the terrain chapter and the hex terrain table line up and nothing says so
  detail: 'The hex terrain table on printed page 132, canonical since PKT-SD-132-133, lists terrain features
    whose names correspond to the terrain packets of this chapter. A GM who rolls a terrain on that table
    and then wants an encounter in it has to find the matching table by name, because neither page cross-references
    the other.

    No row is asserted for it. This page never mentions hexes, terrain selection or overland travel, so
    there is no in-scope evidence and the correspondence is my inference from two table titles, which
    is exactly the standard that declined the district-to-encounter correspondence at PKT-SD-134-135.
    Recorded now rather than at the end of the chapter so that whoever holds both loci can weigh it once,
    with all twenty-two tables in hand, rather than twenty-two times.'
unresolved_identity_questions: []
unresolved_identity_questions_note: 'None. The question this chapter might have raised, whether a tables-only
  page carries a procedure identity, does not arise here in the form it took at PKT-SD-138-141: there
  the tables resolved something the graph did not hold, and here the table''s own title names a rule canonical
  since printed page 112. The chapter disposition is set out in chapter_disposition_note and rests on
  dispositions already settled rather than on a new reading.'
architectural_escalations: []
architectural_escalation_note: None raised. The one proposed identity uses an approved prefix, every row
  uses a legal edge type at status core, no row carries supersession_basis and none is an OVERRIDES, and
  no CLASSIFIED_AS row appears. authority_correction_note records a citation defect in twelve published
  GURs of mine and resolves it against constitution section 2; it asks for nothing and invalidates nothing.
completeness_statement: 'Both printed pages in scope were read in full at the recorded checksum: 1 named
  table, 50 data rows, 0 sentences of prose. The packet yields 1 new identity and 4 rows, reusing 4 canonical
  identities whose labels the assembling script asserted equal to the registry. The proposed table carries
  edges, so nothing is left unattached.

  The rows are one RESOLVED_BY making this table a third resolver of rule_encounter, one TRIGGERS to rule_damage
  at inflicts for the two weather cells, and two FEEDS_INTO rows reaching rule_traps and rule_rival_crawlers.
  The script locates the supporting cell for each and asserts its page rather than taking my word for
  it, which matters here because the page break falls inside the table. Every row was checked against
  the 773 canonical edges for an assertion-key collision, for a shared source, type and target under a
  different aspect, and for duplicates within the patch; there are none of any, and no canonical row cited
  either page before.

  Five candidates were rejected and each is recorded with its reason. The largest deliberate loss by far
  is the creature content, which is most of the table and which belongs to the unextracted monster chapter;
  OBS-01 records that the same will be true of the twenty-one packets after this one. 10 of the 13 apparent
  registry references in the cells are spurious collisions with ordinary English, measured rather than
  filtered by eye. No assertion depends on any other ruleset.'
