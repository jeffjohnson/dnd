authority_correction_note: 'Twelve GURs published into this intake, from PKT-SD-032-032 onward, cite rulesets/shadowdark/escalations/decisions/DEC-2026-0003.yaml
  as authority for registry additions approved separately from edges. That file does not exist. Shadowdark
  holds twenty Decisions and none is numbered 0003; the only DEC-2026-0003 in the repository is AD&D-scoped,
  and matching identifiers across rulesets are unrelated.

  The citation is mine, it propagated from the first packet that used it, and it is wrong. The substantive
  rule it was reaching for does exist for Shadowdark, in constitution section 2, which states that the
  Shadowdark node registry is the only registry for this graph and that normal new nodes under the approved
  prefixes follow GUR, GUP and Review rather than individual Architect approval. Nothing published was
  wrongly authorised and no row depends on the stray citation, so no successor is proposed for it here.

  From this packet onward the authority list omits it and any registry-only proposal cites constitution
  section 2. Recorded in the artifact rather than only in a message because published artifacts are never
  edited and a reader of those twelve needs to find the correction somewhere. Separately, the Integrator
  has reported that its own diff reports print a constitution 3.2 locus that does not exist in the Shadowdark
  constitution either; that is its defect to route and is noted here only so the two are not confused.'
units_note: 'Figures name their unit. Measured by the assembling script from the claimed source: 1 named
  table, 50 data rows keyed to a hundred-sided roll, 0 sentences of prose, 23 rows on printed page 142
  and 27 on 143.'
page_attribution_basis: 'The page break falls inside the table, which is the second time this intake has
  met that form after PKT-SD-118-119, so the rows were resolved by scanning rather than by estimating.

  The p142 marker sits on the ARCTIC heading and placement rule 1 applies it to the whole heading. The
  p143 marker sits in the last cell of the row keyed 46-47, and acceptance test 3 applies a table-row
  marker to the whole row, so that row is 143 and persistence carries 143 to every row after it. The script
  locates the marker by index rather than by eye and derives each row''s page from it: 23 rows are 142
  and 27 are 143.

  Each submitted row is cited to the page of the cell it rests on, and the script asserts that placement
  from the located cell indices rather than from my reading.'
scope_boundary: 'The bounded scope is the Primary Source Material section, printed pages 142 and 143:
  one named table of 50 rows and no prose. The Supporting Source Context appends two passages, the random
  encounter procedure from printed pages 112 and 113 and the monster attributes page from 189. Both are
  out of scope and no row cites either.

  That exclusion matters more here than usual and is worth stating plainly. The appended encounter procedure
  is the very rule this table resolves, and extracting from it would be easy and wrong: its content belongs
  to PKT-SD-112-113, which is already integrated, and re-asserting it would duplicate canonical rows from
  a repeated passage.'
source_summary: 'A single hundred-sided encounter table for arctic terrain, 50 rows, with no procedure,
  no heading prose and no instructions. Most results are creatures and scenes: a kraken in ice, cannibal
  bandits, a frost dragon behind a waterfall, a frost giant with a bear-drawn sled. A few state mechanics:
  two weather results deal damage per round to the unsheltered, two concern traps, and one sends the reader
  to the rival crawler generator. One result instructs the reader to roll twice and combine.'
graph_state_at_extraction: 'Read from the repository at extraction, not recalled, and every figure here
  is computed by the assembling script from the canonical files and the claimed source.

  The canonical graph holds 402 registry rows and 773 edges, and 0 rows cite printed page 142 or 143,
  so nothing in this span has been extracted before. The registry holds 102 tbl_ identities and 0 monster_
  identities, the latter being the figure that governs how much of this table is extractable at all.

  Four identities were read in full first. rule_encounter carries 10 rows, of which 2 are RESOLVED_BY,
  both from printed page 112 and both resolving an aspect of an encounter rather than the encounter itself.
  rule_damage carries 22 inbound rows, 19 of them TRIGGERS, from the light mishaps and traps tables among
  others, which is the precedent M002 follows exactly. rule_traps carries 5 rows and rule_rival_crawlers
  10, the latter having gained its first inbound row one packet ago.'
chapter_disposition_note: 'This is the first of twenty-two packets of one shape, so the reasoning is set
  out once here and will be applied rather than re-argued.

  No procedure identity is proposed. The page establishes no procedure: it has no prose, no instructions,
  and nothing that resolves anything. What it has is a table whose own title names encounters, and rule_encounter
  has been canonical since printed page 112. So the table is a third resolver of an existing rule, not
  the resolver of a new one. This is the exact inverse of printed page 138, where five tables named a
  thing the graph did not hold and a procedure identity had to be argued for; here the thing is already
  held.

  Terrain is not proposed as an identity. Arctic, desert, swamp and the rest are values of an unnamed
  axis, and values were declined at their own defining loci for danger level on printed pages 86 and 90,
  for treasure quality on 117, and for settlement size on 133. Minting them from a chapter of table titles
  would be the finest grain in the graph resting on the weakest evidence.

  Creatures are not proposed. The monster chapter is unextracted and the registry holds 0 monster_ identities,
  so almost every cell in this table names something the graph cannot hold yet. Proposing them from an
  encounter result would take identity ownership from the packets that own their defining loci, which
  is the error the drink ruling corrected in the other direction: a named result earns an identity at
  its defining locus, and a creature''s defining locus is its stat block, not a line in a terrain table.

  What is left is the small set of cells that state a mechanic or name a canonical procedure, and those
  are found by measurement rather than by reading, as name_match_measurement_note records.'
name_match_measurement_note: 'The cells were matched against the whole registry by script, not scanned
  by eye, because a table of 50 prose cells is exactly where a reference gets missed and where a false
  one gets asserted. Both happened in earlier packets: rule_natural_twenty was missed at PKT-SD-101-109
  by keyword-searching instead of reading the registry, and a false absence claim about rule_invisibility
  reached production from PKT-SD-062-065.

  17 of the 50 cells contain a token sequence matching a canonical label. Only 3 identities among those
  matches are real references. The rest are ordinary English that happens to collide with an identity
  label: ancestry_dwarf, ancestry_human, item_armor, lang_giant, rule_distance, rule_dying, rule_falling,
  rule_round, weapon_greataxe, weapon_greatsword. A dying mammoth is not rule_dying, sun falling on ice
  is not rule_falling, wolves trailing at a distance is not rule_distance, damage per round is not rule_round,
  a frost giant is not lang_giant, human trappers are not ancestry_human, dwarf corpses are not ancestry_dwarf,
  and zombies in armor are not item_armor.

  Recording the count matters more than recording the conclusion. It says that 10 of 13 apparent references
  in this table are spurious, which is the ratio a later Analyst should expect in the twenty-one packets
  after this one, and it is why the measurement is worth running each time rather than trusting a read.'
