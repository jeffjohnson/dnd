authored_polarity_declaration: 'One of the 4 rows carries authored polarity. M002 is a TRIGGERS row, which
  constitution section 5 reserves, and it takes inflicts at basis read because the source states the harm
  in the cell: a blizzard and a temperature drop each deal a stated die of damage per round to anyone
  unsheltered. The magnitudes and the cadence are not storable and are not stored; the direction is.

  The other 3 rows are RESOLVED_BY and FEEDS_INTO, neither reserved, so Builder derives governs on M001
  and neutral on M003 and M004.'
status_note: All 4 rows are core. The chapter is reference material for a GM but it is not declared optional,
  and the same disposition was settled as IDQ-01 of PKT-SD-124-125 and applied in the five packets since.
