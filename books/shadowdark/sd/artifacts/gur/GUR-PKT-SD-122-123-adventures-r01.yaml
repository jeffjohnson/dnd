architectural_escalation_note: None raised. Both identities use an approved prefix and need no new vocabulary,
  and the registry-addition mechanism they rely on is settled. OBS-02 notes that a parent identity would
  require revisiting an earlier rejection at its own locus, which is a matter for whoever revisits printed
  page 106 rather than a request from here.
completeness_statement: 'Both printed pages in scope were read in full at the recorded checksum, including
  all 40 table cells and the epigraph. The packet yields 2 new identities and no rows, both declared registry_addition_only
  with their basis, applying the settled disposition of IDQ-01 in PKT-SD-118-119.

  Three candidates were rejected and each is recorded with its reason: the wording instruction, both tables
  in full, and the epigraph. The name-collision temptation was measured rather than argued: 3 canonical
  labels appear across the cells and all are fictional characters rather than the player classes they
  name. Both page markers sit on headings, verified against the claimed source, unlike the buried table-row
  markers of the two preceding packets. Every figure in this GUR was computed rather than counted by hand.
  No assertion depends on any other ruleset.'
