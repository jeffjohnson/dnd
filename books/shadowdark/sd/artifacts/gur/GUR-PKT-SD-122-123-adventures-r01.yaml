registry_addition_only_declaration: 'This GUR proposes two candidate nodes and no candidate edge, no general
  rule and no domain, under the registry-addition shape DEC-2026-0003 provides and the disposition settled
  as IDQ-01 of PKT-SD-118-119.

  It is the third consecutive registry-only packet and the first with two tables rather than one. The
  pages carry two named d20 generators, 40 rows between them, plus a short instruction on using them and
  a character epigraph. There is no rule for either table to be resolved by: I searched the registry for
  an adventure, site, campaign or NPC identity and there is none, and no canonical row names either table.

  The absence is not an oversight of an earlier packet either. PKT-SD-101-109 read the ADVENTURES section
  on printed page 106, which defines what an adventure and a campaign are, and rejected both as structural
  vocabulary for describing play: nothing in the ruleset reads whether the characters are on an adventure,
  no check turns on it and no value derives from it. That rejection stands, so these generators have nothing
  above them to attach to, and inventing a parent identity now would reverse it from the wrong locus.'
page_attribution_basis: 'Both markers sit on headings, which is a return to the ordinary case after two
  packets whose page boundaries were buried in table rows. p122 ends the ADVENTURES heading and p123 ends
  the ADVENTURING SITE NAME TABLE heading, and placement rule 1 applies each to its whole heading with
  the persistence rule carrying it forward.

  The split is therefore clean and follows the tables: the ADVENTURE GENERATOR TABLE and the introductory
  instruction are printed page 122, and the ADVENTURING SITE NAME TABLE and the epigraph that follows
  it are printed page 123. Verified from the claimed source that no marker appears inside any table row
  in this packet, unlike the two preceding ones. No row in this GUR cites either page, because this GUR
  asserts no row.'
scope_boundary: 'The bounded scope is the Primary Source Material section, printed pages 122 and 123:
  one instruction, two tables and one epigraph. The trailing Supporting Source Context is out of scope.'
source_summary: Two d20 adventure generators with three columns each, to be combined into a premise and
  a place name. The opening instruction tells the GM to use some or all of the rolled details and to modify
  the connecting words as needed, with a worked example showing three ways to phrase the same rolled name.
  The first table combines a verb, a subject and a circumstance into an adventure premise; the second
  combines three name fragments into a site name. A character epigraph closes the page.
graph_state_at_extraction: 'Read from the repository at extraction, not recalled, and every figure here
  is computed by the assembling script from the canonical files and the claimed source.

  The canonical graph holds 328 registry rows and 702 edges, and 0 rows cite printed pages 122 or 123,
  so nothing in this span has been extracted before. The registry holds 46 tbl_ identities of which 2
  carry no edge, and 25 identities overall carry no edge. These two tables would be the third and fourth
  unattached tables and the 26th and 27th registry-only identities.

  I also searched the registry for any identity these generators could hang from and found none: no adventure,
  adventuring site, campaign or NPC identity exists.'
name_collision_measurement: 'The measurement introduced in PKT-SD-120-121 was run again, since it is cheap
  and it reads the whole temptation at once. The assembling script searched all 40 table cells for the
  exact label of every canonical identity on whole-word boundaries.

  It found 3 canonical labels present, all in the first table''s columns, and all three are fictional:
  the evil wizard of an adventure premise is not class_wizard, the Thief who might be imprisoned is not
  class_thief, and the High priest sacrificing innocents is not class_priest. Each is a character in a
  generated scenario rather than a player class.

  That is markedly fewer than the 8 found on the rumors table, which fits: these tables are fragments
  of phrases rather than whole sentences, so they name fewer concrete things. The result is again zero
  assertable relationships.'
