rejected_candidates:
- text_locus: the opening instruction and its example, p122
  quoted_gist: use some or all of the rolled details and names, modify the connecting words as needed,
    with three phrasings of the same rolled site name shown as an example
  why_considered: It is the only prose on either page and it is an instruction rather than fiction, which
    is the shape that usually yields something. It also relates the two tables to their own output, which
    looked like it might support a row.
  rejection_reason: It is guidance on wording, not a mechanic. Use some or all states no rule about how
    many columns are rolled, and modify the connecting words concerns English rather than the game. There
    is no identity for a generated result, and the instruction's subject is the GM's prose style. Nothing
    here states a relationship between two identities.
- text_locus: both tables in full, pp122 to 123
  quoted_gist: 40 cells across two three-column d20 tables, naming goblets, prisoners, cults, demons,
    werewolves, vampires, a Thieves' Guild, mines, abbeys, tombs and necropolises
  why_considered: Completeness, and because 3 cells contain the exact label of a canonical identity, measured
    rather than estimated.
  rejection_reason: 'Every cell is a phrase fragment for assembling a name or a premise, with no mechanical
    content at all: no check, value, duration or consequence, and in most cases not even a complete sentence.
    The three label matches are fictional characters in generated scenarios rather than the player classes,
    listed in name_collision_measurement. Monsters named here, including a werewolf and a vampire, have
    no identity and their chapter is unextracted.'
- text_locus: the epigraph, p123
  quoted_gist: a quoted line from Creeg, human wizard, reacting to a generated site name
  why_considered: Completeness. Creeg is one of the four example characters from the example of play on
    printed pages 96 to 100, so the same fictional person recurs across the book.
  rejection_reason: Fiction, and PKT-SD-096-100 already rejected the whole cast as fiction in a story
    rather than rules. An epigraph reacting to a table result is no more mechanical than the transcript
    was. Recorded only so the page is fully dispositioned.
non_edge_observations:
- id: OBS-01
  subject: three consecutive registry-only packets, and why that is the book
  detail: 'This is the third packet in a row yielding registry additions and no relationships, after the
    Something Happens and Rumors tables. Between them they are four tables and no rows.

    The shape is now clear enough to state as a property of the source rather than a run of thin readings.
    The Game Master half alternates between rules pages and inspiration pages. The rules pages have yielded
    well: traps six rows, the optional modes twenty-five, random encounters eight, awarding experience
    seven. The inspiration pages yield identities and nothing else, because a table of prompts states
    no relationship. Both kinds are read the same way and the difference is entirely in what the page
    says.'
- id: OBS-02
  subject: the generators have nothing above them, and that is a standing rejection rather than a gap
  detail: 'Every other table registered in this intake with edges is reached by a rule. These two are
    not, and the reason is worth distinguishing from the previous two packets. There the page simply had
    no prose. Here there is a candidate parent in the book: PKT-SD-101-109 read the ADVENTURES section
    on printed page 106, which defines what an adventure and a campaign are, and rejected both because
    nothing in the ruleset reads whether the characters are on an adventure.

    So the absence of a parent is a consequence of a deliberate earlier judgement, not an accident. Minting
    rule_adventure now to give these generators a home would reverse that judgement from the wrong locus,
    since page 106 is where an adventure is defined and page 122 is only where one is rolled for. If the
    earlier rejection is ever revisited, page 106 is where it should be, and these tables would gain their
    rows there.'
- id: OBS-03
  subject: the collision measurement scales with sentence completeness
  detail: 'The same search that found eight canonical labels in the fifty rumor prompts found only 3 in
    these 40 cells. That is not because these tables are less tempting but because their cells are phrase
    fragments rather than whole sentences, so they name fewer concrete things.

    Worth recording as a property of the method: the measurement surfaces the temptation in proportion
    to how much prose a table carries, and a fragment table needs the same judgement applied with less
    to go on. It also remains blind to abbreviated references, as the Shune and St. Terragnis cases showed
    last packet, so a low count is not by itself evidence that nothing was missed.'
