rejected_candidates:
- text_locus: the creature and named-character results, pp144 and 145
  quoted_gist: an efreeti out of a brass lamp, a manticore crash-landing in a square, a woman who rises
    as a wererat, kobolds raiding a bakery, Thieves Guild goons, the Bywater Barons, Pliny the Swift,
    and the Wandering Merchant
  why_considered: Several are individually named rather than generic, which is the shape that earned identities
    for the tavern drinks at PKT-SD-136-137.
  rejection_reason: That ruling attaches an identity to a named result at its defining locus, and a creature's
    defining locus is its stat block in the unextracted monster chapter. The Wandering Merchant appears
    here for the second time in three packets and has its own entry on printed page 213, inside an unclaimed
    packet; minting it from an encounter line would fix its label and kind from an incidental mention.
    The gangs and named people have no locus anywhere.
- text_locus: the violent and hazardous scenes that state no mechanic, pp144 and 145
  quoted_gist: an anvil plunging toward a bystander, a red-hot hammer flying toward a character, a deep
    sinkhole falling open, a poison dart that kills a passer-by, a toxic cloud of smoke, a stampede of
    horses, dissidents tipping a statue toward a crowd
  why_considered: Each is plainly dangerous, and rule_damage and rule_hazards are both canonical. The
    arctic table one packet ago produced a TRIGGERS row to rule_damage from cells of roughly this kind.
  rejection_reason: It produced that row because two arctic cells state a die of damage and a cadence.
    Not one cell here states a check, a die, a value or a consequence; every one of them describes a situation
    and leaves the GM to adjudicate it. The word damage does not appear on the page, and the word hazard
    does not either. Asserting a damage row from a falling anvil would be inferring the mechanic rather
    than reading it, and would make this table claim something the arctic table earned and this one did
    not.
- text_locus: the magical weapon appraisal, p145
  quoted_gist: an appraisal reveals that a character's weapon is actually magical
  why_considered: item_magic_item is canonical, and this is the one cell in the table that changes the
    party's sheet rather than the scene in front of them.
  rejection_reason: It states no check, no procedure and no property. Appraisal is not a canonical rule,
    nothing on this page says how a weapon is identified, and the magic item chapter that governs that
    is unextracted. What the cell gives a GM is a plot gift, and a row from this table to item_magic_item
    would assert that the encounter table is a source of magic items, which the source does not say.
- text_locus: the two-encounter instruction, p145
  quoted_gist: one result instructs the reader to roll twice more and combine the results, rerolling that
    result if it comes up again
  why_considered: It is the only instruction on the page and it is fully mechanical, and a table that
    reaches itself is a genuine structure.
  rejection_reason: 'Its content is arithmetic on the table''s own roll: how many times to roll and which
    results to discard. Those are magnitudes. What would remain is a self-edge from the table to itself,
    which asserts nothing. Declined in the same form at PKT-SD-142-143 and, for the cross-drink effects,
    at PKT-SD-136-137.'
- text_locus: the appended random encounter procedure and monster attributes, out of scope
  quoted_gist: the whole printed page 112 and 113 encounter procedure and the printed page 189 monster
    attributes page
  why_considered: Both are in the file, and the first is the rule this table resolves.
  rejection_reason: Both are Supporting Source Context, outside the bounded scope. PKT-SD-112-113 is already
    integrated, so extracting from it would duplicate canonical rows and cite pages outside this packet's
    range, and the monster attributes packet is unclaimed.
non_edge_observations:
- id: OBS-01
  subject: this district has a canonical counterpart table and the pair is still not assertable
  detail: 'tbl_settlement_artisan_district became canonical at PKT-SD-134-135, from printed page 135,
    where it gives the points of interest in an artisan district. This packet proposes tbl_artisan_district_encounters,
    the encounters for the same district. Two tables, one district, and nothing joining them.

    OBS-03 of PKT-SD-134-135 predicted exactly this and left the question to whoever held both loci. I
    now hold one of them and still decline, on the same ground: this page never mentions settlements,
    districts or points of interest, and page 135 never mentions encounters. The correspondence is between
    two table titles, which is the standard that declined the hex-terrain correspondence one packet ago.
    Recorded again because eight of this chapter''s twenty-two packets are city districts and the same
    pairing will recur for each.'
- id: OBS-02
  subject: this table yields one reach where the arctic table yielded three
  detail: 'The arctic table carried a damage row and a traps row as well as the rival crawler row. This
    one carries only the rival crawler row, because no cell states a die of damage and none mentions a
    trap. The difference is in the source rather than in the reading: a blizzard that deals damage per
    round is a stated mechanic, and an anvil falling toward a bystander is a scene.

    Recorded so the variation across the chapter is visible as it accumulates. It is the reason each packet''s
    cells are measured rather than assumed to match the previous one, and it suggests the terrain tables
    will yield more than the district tables, since weather and terrain are where this book states environmental
    damage.'
