source_summary: >-
  The DEMONS family: two paragraphs of narrative framing, that demons are Chaos incarnate and
  mostly unique, with a few lesser demons sharing a common form, followed by five stat blocks.
  Balor carries three named abilities, Impervious, Grab and Hellfire; Dretch and Glabrezu carry
  one each; Marilith carries one, Parry; Vrock carries two, Carrion Mist and Screech.

