stat_block_boundary_note: >-
  The test settled at PKT-SD-194-194 and confirmed across five following packets is applied
  without modification: a stat-block description is excluded under constitution 2.5 regardless
  of what it references, because the exclusion is about each instance's own locus. This page
  adds two further confirmations of the recurrence pattern; see recurrence_note.

recurrence_note: >-
  Crush recurs a third time, on Glabrezu, and the shape is the one Crab, Giant carried two
  packets ago, a save against STR or a stated amount of damage, not the Bears' extra-die-on-
  double-hit shape from three packets ago. Crush therefore has two distinct, independently
  recurring shapes under one name now, neither of them the other, which is a sharper instance of
  OBS-02 and OBS-03 from the two preceding packets than either alone.
  Screech recurs on Vrock in close paraphrase of Cloaker's own Screech, the same effect, enemies
  disadvantaged on attacks and checks for a stated duration, with a different DC, which is a new
  middle case between the Rage-shaped verbatim recurrence and the Crush-shaped same-name-
  different-meaning recurrence: same name, same effect, different magnitude. All instances
  remain excluded individually under the locus test regardless of which recurrence shape they
  take.

creature_identity_note: >-
  All five proposed nodes carry no edge in this GUR, for the reason settled at PKT-SD-194-194:
  each creature's defining locus is its stat block, and this page is that locus for all five. No
  family-level identity is proposed; unlike the Angels, this family's introduction states no
  rank hierarchy to even consider, only narrative framing, and constitution 2.4 would keep any
  family grouping out of the graph in any case absent a Decision.

