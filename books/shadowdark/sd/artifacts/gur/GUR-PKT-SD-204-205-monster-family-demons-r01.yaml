non_edge_observations:
  - id: OBS-01
    subject: one ability name now carries two distinct, independently recurring shapes
    detail: >-
      Crush means an extra die of damage on a double hit for the Bears, verbatim between the
      two of them, and a save against STR or a stated amount of damage for Crab, Giant and now
      Glabrezu, close but not verbatim between those two. Four creatures, one name, two stable
      shapes, neither shape merging with the other. This sharpens the earlier finding that an
      ability name is a flavour choice rather than a reference: it is not even consistently a
      flavour choice for one effect, but for a small family of effects the designer reuses.
  - id: OBS-02
    subject: a new recurrence category, same effect with a tuned magnitude
    detail: >-
      Screech on Cloaker and Screech on Vrock are the first pair in the chapter that are neither
      verbatim, like Rage, nor differently meant under a shared name, like Impervious and the
      first Crush pair. They state the same effect with a different DC, which is the shape a
      single shared mechanic with a per-creature difficulty would take if one existed. It still
      does not exist: each instance is printed under its own creature's block, so each remains
      excluded under the locus test, but this is the closest the chapter has come to a case
      where a future ruling might find a shared identity, were one ever sought.

