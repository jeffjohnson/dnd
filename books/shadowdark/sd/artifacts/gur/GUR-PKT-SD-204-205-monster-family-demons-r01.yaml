      the marilith may trade two of its longsword attacks next round to deflect an incoming
      melee attack that would hit
    why_considered: >-
      cbt_melee_attack is canonical and the ability states a direct consequence against it, and
      weapon_longsword is canonical and named directly.
    rejection_reason: >-
      A stat-block description under the locus test, the same ground as every other ability that
      has named a real shared identity since printed page 195; the traded attack count is a
      magnitude.
  - text_locus: 'Carrion Mist, p205'
    quoted_gist: >-
      each time the vrock is hit, a stated chance of a near-sized cube of carrion mist causing
      all enemies to save against CON or vomit violently for a stated duration
    why_considered: 'rule_damage was checked and ruled out because the effect is a status, not damage.'
    rejection_reason: 'A stat-block description; there is no vomiting or sickened condition identity, and the chance and duration are magnitudes.'
  - text_locus: 'Screech, p205'
    quoted_gist: 'all enemies in range save against WIS or suffer DISADV on checks and attacks for a stated duration'
    why_considered: 'The second occurrence of DISADV naming rule_disadvantage, and a close paraphrase of Cloaker''s own Screech. See recurrence_note.'
    rejection_reason: 'A stat-block description under the locus test, the same ground as Cloaker''s Screech two packets ago.'
