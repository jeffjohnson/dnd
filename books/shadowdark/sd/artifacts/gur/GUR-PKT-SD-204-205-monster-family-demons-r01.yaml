rejected_candidates:
  - text_locus: 'the family introduction, p204'
    quoted_gist: >-
      demons as Chaos incarnate from the Dark Realms, mostly unique in form and power, with a
      few lesser demons sharing a common appearance
    why_considered: >-
      Checked against the Angels precedent for a rank hierarchy or grouping statement.
    rejection_reason: >-
      Narrative framing, not a taxonomy; unlike the Angels introduction it names no ranks and
      states no relation between the five creatures below it beyond calling them lesser and
      recognised. No mechanic depends on it.
  - text_locus: 'Impervious, p204'
    quoted_gist: 'the balor is fire immune and only damaged by magical sources'
    why_considered: 'The third occurrence of this ability name, checked against item_magic_item for a real reference.'
    rejection_reason: >-
      No scan hit and no real reference on reading: magical does not match the registry label
      Magic Item, which requires both magic and item. A stat-block description in any case, the
      same ground as its two earlier occurrences, each with yet another different effect.
  - text_locus: 'Grab, p204'
    quoted_gist: >-
      a save against STR or be bound in the whip, taking damage per round held, with a repeated
      save to break free and an ability to fling a held target
    why_considered: 'The same shape as Chuul''s Grab two packets ago, checked independently.'
    rejection_reason: 'A stat-block description; there is no bound or held condition identity, the same gap as Chuul''s Grab.'
  - text_locus: 'Hellfire, p204'
    quoted_gist: 'a save against DEX or ongoing damage until the flames are extinguished'
    why_considered: 'rule_damage is canonical and the ability states a persistent effect against it.'
    rejection_reason: 'A stat-block description; the damage is a magnitude and the duration is open-ended rather than naming any status identity.'
  - text_locus: 'Gas, p204'
    quoted_gist: 'all creatures nearby save against CON or are blinded for a stated duration'
    why_considered: 'The same shape as Dretch''s cloud-area effects elsewhere in the chapter, checked on its own terms.'
    rejection_reason: 'A stat-block description; there is no blinded condition identity, the same gap noted since printed page 203.'
  - text_locus: 'Crush, p204'
    quoted_gist: 'a save against STR or take a stated amount of damage'
    why_considered: >-
      The third occurrence of this ability name and the second in the save-against-STR-or-
      damage shape Crab, Giant carried. See recurrence_note.
    rejection_reason: 'A stat-block description under the locus test; the damage is a magnitude.'
  - text_locus: 'Parry, p205'
