rejected_candidates:
- text_locus: the masked spear-lined pit, p170
  quoted_gist: woven reeds or seaweed mask a deep, spear-lined pit
  why_considered: Concealment is stated outright and the pit is lined with spears, so the intent is unambiguous,
    and the net cell three rows later earns a rule_traps reach on this very page.
  rejection_reason: It states concealment and no operation, which is the shape declined for the grassland
    boulder wedges and the jungle concealing reeds. The net launches; the reeds mask. Nothing turns on
    it here because the net cell carries the row and both would compile to the same assertion key, but
    the line is worth holding so that it means something on a page where only the weaker cell appears.
- text_locus: the swimming and water-peril cells, pp170 and 171
  quoted_gist: a tidal surge grabbing at the characters and threatening to pull them in, giant leeches
    biting warm-blooded swimmers, an elephant swimming with its trunk above the surface, a tsunami raising
    the shore for a stated number of rounds
  why_considered: rule_swimming is canonical and I did not check it when I declined the ocean reefs one
    packet ago; the Integrator looked for it on my behalf and found it. This is the first page since that
    omission, and this time I checked it before reading the table rather than after.
  rejection_reason: 'It carries 4 rows, all from printed page 85, and every one is a character in the
    water: constitution feeding a breath check, swim speed constraining movement, a check for rough water,
    and drowning damage on a failed breath check. None of these cells states a check, a die, a breath,
    a speed or a drowning. The leeches bite swimmers and the elephant swims, which are descriptions of
    who is in the water rather than statements about the swimming rule. The tsunami states only a height
    and a duration, both magnitudes. Recorded as OBS-02.'
- text_locus: the pearls and the grounded galleon, pp170 and 171
  quoted_gist: opaline shellfish clustered in tide pools that have pearls, and the massive galleon Silver
    Sea run deeply aground
  why_considered: The hundredth slot on this page does earn a treasure row, so the page proves the category
    is live, and pearls and a wrecked ship are both the sort of thing a party would strip.
  rejection_reason: Neither names a canonical category. A pearl is not item_coin and there is no gem identity;
    a galleon is not any identity at all. Neither states an acquisition either, so both fail the test
    on both elements rather than one. This is the same reading that declined the dragon's coin hoard,
    which at least named a category.
- text_locus: the creature results across the table, pp170 and 171
  quoted_gist: basilisks, a giant snake, kobolds, a troll, a piranha swarm, a sea hag, black puddings,
    orcs, river bandits, lions, a hippogriff, a crocodile, goblin gem divers, apes, centaurs, hippopotami,
    a giant crab, faeries, lizardfolk, a gladiator, griffons, a treant, gargoyles, giant leeches, a snake
    swarm, mastiffs, stingbats, cultists, giant frogs and the Wandering Merchant
  why_considered: Six are individually named, Mirell, Falsted, Yggral the treant, Marga the Wise, the
    kobold sorcerer Mortimus and Quargot the fisherman, which is the most named people on any terrain
    page in the chapter.
  rejection_reason: A creature's defining locus is its stat block in the unextracted monster chapter and
    the registry holds no monster_ identity. Fourteenth packet running for the same disposition.
- text_locus: the two-encounter instruction, p171
  quoted_gist: one result instructs the reader to roll twice more and combine the results, rerolling that
    result if it comes up again
  why_considered: It is the only instruction on the page, and the stem scan flags it as matching rule_encounter.
  rejection_reason: The match is on the plain word encounters in the instruction's own text; M001 already
    carries the table's relation to rule_encounter. The rest is arithmetic on the table's own roll. Declined
    in the same form in each of the fourteen preceding chapter packets.
- text_locus: the appended random encounter procedure and monster attributes, out of scope
  quoted_gist: the printed page 112 and 113 encounter procedure and the printed page 189 monster attributes
    page
  why_considered: Both are in the file and the first is the rule this table resolves.
  rejection_reason: Both are Supporting Source Context, outside the bounded scope. PKT-SD-112-113 is already
    integrated, so extracting from it would duplicate canonical rows and cite pages outside this packet's
    range.
non_edge_observations:
- id: OBS-01
  subject: the hundredth-slot prediction made last packet is tested and holds
  detail: 'OBS-01 of the ocean packet recorded, from a survey of all fourteen claimed packets, that the
    result on a roll of 00 is a gift in every table of this chapter, and said the slot should be checked
    deliberately rather than reached last. This packet is the first case since, and it holds: the hundredth
    row is a half-buried treasure chest containing a magic item, and it carries M004.

    Re-measured now across all 15 claimed packets rather than carried forward, 5 of them name a magic
    item in that slot: 150-151-deep-tunnels, 162-163-low-district, 166-167-mountain, 168-169-ocean, 170-171-river-and-coast.
    Recorded because a prediction that is stated and then tested is worth more than one that is only stated,
    and because the remaining eight packets should be read the same way.'
- id: OBS-02
  subject: a near-fit target I failed to check, checked here first
  detail: 'When I declined the ocean coral reefs one packet ago I named two candidate targets, rule_overland_travel
    and ex_movement, and said no correct target existed. I had not looked for rule_swimming, which is
    canonical with 4 rows. The Integrator went looking on my behalf, found it, and confirmed it does not
    fit reefs hindering ships. The conclusion was right and the search was incomplete, which is a different
    defect from a wrong answer and a more dangerous one, because it produces correct declines for insufficient
    reasons.

    This is the first page since that omission, and I checked swimming before reading the table rather
    than after. It carries a breath check from constitution, a swim speed constraint on movement, a rough
    water check and drowning damage, all from printed page 85 and all about a character in the water.
    The four candidate cells here state none of those things. The fix is procedural: when declining for
    want of a target, enumerate the registry for the relevant kind rather than naming the two that came
    to mind. The building script now lists every movement-adjacent identity in the registry and this artifact
    records the list.'
- id: OBS-03
  subject: both trap shapes appear on one page, four rows apart
  detail: 'Woven reeds mask a deep, spear-lined pit. Four rows later a weighted and barbed net launches
    out of the silt. The second carries M002 and the first earns nothing, and the distinction is the one
    the Reviewer settled at the desert overturn: the net states an operation and the reeds state only
    concealment.

    The jungle packet showed three strengths on one page and this one shows the two that matter sitting
    adjacent, in the same idiom, from the same writer. Recorded because the pit is the more dangerous
    of the two as written, being lined with spears, and it still earns nothing; the test is what the cell
    says happens, not how bad the outcome would be.'
