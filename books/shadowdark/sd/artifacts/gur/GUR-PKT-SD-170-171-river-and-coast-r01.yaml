units_note: 'Figures name their unit. Measured by the building script from the claimed source: 1 named
  table, 50 data rows keyed to a hundred-sided roll, 0 sentences of prose, 23 rows on printed page 170
  and 27 on 171.'
page_attribution_basis: 'The page break falls inside the table, as it has in every packet of this chapter
  so far. The p170 marker sits on the RIVER AND COAST heading under placement rule 1. The p171 marker
  sits in the last cell of one table row, and acceptance test 3 applies a table-row marker to the whole
  row, so that row is page 171 and persistence carries 171 to every row after it.

  The script locates the marker by row index rather than by eye and derives each row''s page from it:
  23 rows are page 170 and 27 are 171. Each submitted row is cited to the page of the cell it rests on,
  and the script asserts that placement from the located cell index rather than from my reading.'
scope_boundary: 'The bounded scope is the Primary Source Material section, printed pages 170 and 171:
  one named table of 50 rows and no prose. The Supporting Source Context appends the random encounter
  procedure from printed pages 112 and 113 and the monster attributes page from 189. Both are out of scope
  and no row cites either.

  That exclusion matters here because the appended encounter procedure is the very rule this table resolves.
  Its content belongs to PKT-SD-112-113, which is already integrated, and re-asserting it would duplicate
  canonical rows from a repeated passage.'
source_summary: 'A single hundred-sided encounter table for rivers and coasts, 50 rows, with no procedure,
  no heading prose and no instructions. Most results are waterside creatures and scenes: basilisks sunning
  on rocks, kobolds with reed snorkels, a hippogriff wrestling a crocodile, goblin gem divers, an elephant
  swimming with its trunk up, giant frogs croaking insults in Common. Two cells describe concealed devices,
  one names rival crawlers, and the hundredth slot is a half-buried treasure chest.'
graph_state_at_extraction: 'Read from the repository at extraction, not recalled, and every figure here
  is computed by the building script from the canonical files and the claimed source.

  The canonical graph holds 416 registry rows and 818 edges, and 0 rows cite printed page 170 or 171,
  so nothing in this span has been extracted before. The registry holds 116 tbl_ identities and 0 monster_
  identities, the latter being the figure that governs how much of this table is extractable at all.

  rule_encounter carries 24 rows, of which 16 are RESOLVED_BY. The script asserts that the proposed table
  id is absent from the registry before using it.'
chapter_disposition_note: 'The disposition for this chapter was argued in full at PKT-SD-142-143 and is
  applied here rather than re-argued. In short: no procedure identity, because the table''s own title
  names rule_encounter and that rule has been canonical since printed page 112, so this table is a further
  resolver of an existing rule rather than evidence of a new one. No terrain or district identity, because
  values were declined at their own defining loci for danger level, treasure quality and settlement size.
  No creatures and no named characters, because the registry holds 0 monster_ identities and a creature''s
  defining locus is its stat block, not a line in an encounter table.

  What remains is the small set of cells that state a mechanic or name a canonical procedure, and those
  are found by measurement rather than by reading.'
name_match_measurement_note: 'The cells were matched against the whole registry by script, not scanned
  by eye, because a table of 50 prose cells is where a reference gets missed and where a false one gets
  asserted. Both happened in earlier packets: rule_natural_twenty was missed at PKT-SD-101-109 by keyword-searching
  instead of reading the registry, and a false absence claim about rule_invisibility reached production
  from PKT-SD-062-065.

  Two scans are run, because at PKT-SD-148-149 the whole-label scan was shown to fail in both directions:
  it reports ordinary English that collides with a label, and it misses an inflected mention, since a
  cell saying bear trap does not recover canonical Traps and a rival crawler does not recover Rival Crawlers.
  The second scan compares stems, which closes that gap at the cost of widening the first, so both are
  reported rather than one replacing the other. It was proved against PKT-SD-148-149 and recovers exactly
  the two cells the label scan missed there.

  Whole-label scan: 12 of the 50 cells match. Stem scan: 14 cells match, adding 2 identities the label
  scan did not reach (rule_encounter, rule_round). 3 of all matched identities are real references: rule_rival_crawlers,
  rule_traps, rule_treasure. item_magic_item, rule_encounter are real mentions deliberately not given
  a row of their own, for the reasons in rejected_candidates. The rest are ordinary English colliding
  with an identity label: ancestry_elf, ancestry_goblin, ancestry_halfling, lang_common, lang_giant, lang_goblin,
  rule_dying, rule_round, rule_turn.

  lang_giant matches five cells where giant qualifies an animal, and rule_turn matches twice on things
  that turn out to be something else, black puddings and gargoyles, which is the same verb collision seen
  at printed pages 159 and 163. rule_dying matches a dying giant snake, ancestry_halfling a halfling clinging
  to a dinghy, ancestry_elf an exhausted elf, and lang_common giant frogs croaking insults in Common,
  which is the first time that identity has appeared in the chapter and is still a joke rather than a
  language rule.'
