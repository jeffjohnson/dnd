completeness_statement: 'Both printed pages in scope were read in full at the recorded checksum: 1 named
  table, 50 data rows, 0 sentences of prose. The packet yields 1 new identity and 4 rows, reusing 4 canonical
  identities whose labels the building script asserted equal to the registry. The proposed table carries
  edges, so nothing is left unattached.

  Every row was checked against the 818 canonical edges for an assertion-key collision, for a shared source,
  type and target under a different aspect, and for duplicates within the patch; there are none of any,
  and no canonical row cited either page before. The script locates the supporting cell for each row and
  asserts its page, which matters because the page break falls inside the table.

  6 candidates were rejected and each is recorded with its reason. The largest deliberate loss is the
  creature and scene content, which belongs to the unextracted monster chapter or states no mechanic at
  all. 9 of the 14 apparent registry references in the cells are spurious collisions with ordinary English,
  measured rather than filtered by eye. No assertion depends on any other ruleset.'
trap_cells_note: 'Two cells bear on M002, at row indices 22 and 26 of 50, and only the second qualifies.

  Index 22 reads that woven reeds or seaweed mask a deep, spear-lined pit. Concealment is stated and no
  operation is: nothing springs, launches or triggers, and nobody falls in.

  Index 26 reads that a weighted and barbed net launches out of the silt or sand. That is concealment
  and an operation, which is the test settled when the Reviewer overturned my desert decline, and it is
  the same idiom as the desert bone-barbed nets that snap up.

  One row is written and it is cited to the net cell. Both cells are on printed page 171, so the citation
  would be identical either way, but the row rests on the cell that qualifies.'
target_search_note: 'Recorded because of the omission described in OBS-02. When a cell states an effect
  and no row is written for want of a target, the registry is enumerated rather than searched from memory.
  The movement-adjacent identities in the registry at extraction are: ex_movement, rule_climbing, rule_falling,
  rule_hex, rule_overland_hex_maps, rule_overland_travel, rule_swimming, spell_feather_fall, tbl_hex_cataclysm_type,
  tbl_hex_danger_level, tbl_hex_points_of_interest, tbl_hex_settlement_name, tbl_hex_terrain, tbl_hexes_crossed,
  tbl_new_hex. For this packet the water cells were checked against rule_swimming specifically, which
  carries 4 rows all from printed page 85, and none of them is reached by any cell here.'
measured_figures_note: 'Figures quoted in this artifact''s prose are computed by the building script from
  the claimed source and the canonical files, and the finished document is checked for unsubstituted format
  specifiers before it is written. Located cells: the masked pit at index 22, the launching net at 26,
  the rival crawlers at 36, the treasure chest at 49 and the swimming mentions at [23, 33], of 50 rows.
  Canonical counts at extraction: 16 resolvers on rule_encounter, 7 inbound FEEDS_INTO on rule_traps,
  13 inbound on rule_rival_crawlers, 7 inbound on rule_treasure and 4 rows on rule_swimming.'
