rejected_candidates:
- text_locus: the group of crawlers dressed like the party, p147
  quoted_gist: the characters spot a group of crawlers dressed exactly like them
  why_considered: It is the nearest thing on this page to the rival crawler reach asserted in the two
    previous packets, and rule_rival_crawlers is canonical with three inbound rows. A second party of
    adventurers is, in substance, what that generator produces.
  rejection_reason: 'The word rival is absent, and crawler is this book''s general term for an adventurer
    rather than a name for the procedure; it appears in at least twelve claimed packets in that generic
    sense, including the defining prose on printed page 126, which reads a rival party of Shadowdark crawlers.
    The two cells that did earn the row, on printed pages 143 and 145, both say rival crawlers. Beyond
    the wording, this cell''s content is the resemblance rather than the party: what it hands a GM is
    a hook about doubles or impostors, not an instruction to generate a rival party. Asserting it would
    widen the test from does the source name the thing to could this be produced by some procedure, which
    would sweep in every creature cell in the chapter. Recorded as OBS-02.'
- text_locus: the named individuals and titled figures, pp146 and 147
  quoted_gist: Targ the Betrayer, Robal Goodwin, Sir Galvin, the singer Branzolini, the disguised Duke,
    the Overlord, and the Wandering Merchant
  why_considered: Source-named people, which is the shape that earned identities for the tavern drinks
    at PKT-SD-136-137.
  rejection_reason: That ruling attaches an identity at the defining locus, and none of these has one.
    Most appear once in the book, in this cell, with no stat block and no rule; the Overlord is setting,
    and the Wandering Merchant has a monster entry on printed page 213 inside an unclaimed packet. Minting
    any of them here would fix a label and kind from an incidental mention. This is the third packet running
    in which the same distinction has had to be drawn.
- text_locus: the violent and destructive scenes that state no mechanic, pp146 and 147
  quoted_gist: a gargoyle breaking loose overhead and falling, a lion tearing free, an elephant bursting
    from the coliseum, a catapult igniting in fast flames, a crossbow bolt flying at the characters, an
    explosion at the garrison, smoke pouring from the theatre, the street crumbling open
  why_considered: rule_damage and rule_hazards are both canonical, and the arctic table one chapter packet
    earlier produced a TRIGGERS row to rule_damage.
  rejection_reason: That row was earned by two cells that state a die of damage and a cadence. Not one
    cell here states a check, a die, a value or a consequence, and neither the word damage nor the word
    hazard appears on the page. This is the second district packet in a row where the scenes are dangerous
    and the mechanics are absent, which is a fact about the source rather than about the reading.
- text_locus: the objects a character might come away with, pp146 and 147
  quoted_gist: a golden horseshoe in the gutter filth, a key blown from a window box, a scroll handed
    to a passing woman, a magic sword appearing in a statue's hand, bags of stolen royal gold
  why_considered: item_coin, item_spell_scroll and item_magic_item are all canonical, and a magic sword
    appearing is the clearest acquisition on the page.
  rejection_reason: None of these cells states that a character obtains anything, nor how, nor with what
    property. A sword appearing in a statue's hand is an event a GM narrates; a scroll passing between
    two other people is scenery. The same disposition declined the magical-weapon appraisal one packet
    ago, and it holds more easily here because these cells do not even reach the party.
- text_locus: the two-encounter instruction, p147
  quoted_gist: one result instructs the reader to roll twice more and combine the results, rerolling that
    result if it comes up again
  why_considered: It is the only instruction on the page and it is fully mechanical.
  rejection_reason: Its content is arithmetic on the table's own roll, which is a magnitude, and what
    would remain is a self-edge asserting nothing. Declined in the same form at PKT-SD-142-143 and PKT-SD-144-145.
- text_locus: the appended random encounter procedure and monster attributes, out of scope
  quoted_gist: the printed page 112 and 113 encounter procedure and the printed page 189 monster attributes
    page
  why_considered: Both are in the file and the first is the rule this table resolves.
  rejection_reason: Both are Supporting Source Context, outside the bounded scope. PKT-SD-112-113 is already
    integrated, so extracting from it would duplicate canonical rows and cite pages outside this packet's
    range.
non_edge_observations:
- id: OBS-01
  subject: this packet yields one row and that is the disposition working
  detail: 'The table has 50 rows and this packet submits one edge, the resolver, plus the table registration.
    Nothing else in it states a mechanic or names a canonical procedure.

    OBS-01 of PKT-SD-142-143 recorded that the chapter''s yield per packet would be very low and that
    the thinness is a disposition rather than incomplete work. This is the floor of that prediction and
    it is worth marking when it is reached: arctic gave four rows, artisan two, castle one. The content
    that is not being extracted is creatures, named people and scenes, and the first of those becomes
    extractable once the monster chapter exists. A later pass can add those reaches without revising anything
    submitted here.'
- id: OBS-02
  subject: the first near-miss on the rival crawler reach
  detail: 'Two packets running have carried a row from the encounter table to rule_rival_crawlers, on
    cells reading a group of rival crawlers and rival crawlers challenge the group. This page has a group
    of crawlers dressed exactly like them, and it gets no row.

    Recorded because the distinction is thin enough to look arbitrary from outside, and because it is
    the line the whole chapter rests on. Crawler is the book''s general word for an adventurer and appears
    in that sense throughout the intake; rival crawlers is the name of a procedure. If the generic word
    were enough, the test would become could this be produced by some procedure, and on that test every
    creature cell in these twenty-two tables reaches the monster chapter. The Reviewer may hold that the
    substance outweighs the wording here, and if so the row is a one-line addition; I would rather be
    told than widen the test myself.'
- id: OBS-03
  subject: the only level-three area heading in the chapter
  detail: 'The area heading on this page is level three where all twenty-one others are level two. I checked
    every packet in the chapter rather than assuming this one is the odd case, and it is.

    It changes nothing about page attribution, because placement rule 1 applies a marker to its whole
    heading at any level. It does mean the area heading and the table heading sit at the same level, so
    the building script identifies the table section by its title rather than by heading level; the earlier
    version, which relied on the level, failed loudly on this packet rather than mis-deriving, which is
    the behaviour the assertions were put there for.'
