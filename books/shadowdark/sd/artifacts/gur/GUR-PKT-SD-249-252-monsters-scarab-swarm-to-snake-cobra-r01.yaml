non_edge_observations:
  - id: OBS-01
    subject: Scarecrow Scream and Siren Song operate on creature combat action locus
    detail: >-
      Scarecrow can substitute attacks with Scream (DC 12 CHA or paralyzed 1d4 rounds in double near), and Siren
      can substitute claw attacks with Song (DC 15 CHA or paralyzed 1d4 rounds in double near, with 1 day immunity
      on success). Both operate on creature combat action loci under Constitution 2.5.
  - id: OBS-02
    subject: Scorpion and Giant Scorpion Poison and Grab operate on creature combat riders
    detail: >-
      Both scorpions deliver sting Poison reducing targets to 0 HP on failed CON saves (Scorpion DC 9, Giant
      Scorpion DC 12), and Giant Scorpion claw imposes Grab (DC 12 STR or held). All operate on creature attack
      rider loci under Constitution 2.5.
  - id: OBS-03
    subject: Shadow Drain imposes ability score drain and death transformation on creature combat locus
    detail: >-
      Shadow touch reduces target STR by 1 on failed DC 12 CON save; at 0 STR the target dies and rises as a new
      shadow. This operates on creature attack and death/spawn loci under Constitution 2.5.
  - id: OBS-04
    subject: Shambling Mound Impervious and Engulf govern creature defense and engulfment mechanics
    detail: >-
      Shambling Mound is immune to fire and healed by lightning (Impervious), and engulfs targets hit by both slams
      in the same round, suffocating them in 2d4 rounds unless escaped on DC 15 STR (Engulf). Both operate on creature
      defense and attack rider loci under Constitution 2.5.
  - id: OBS-05
    subject: Megalodon Fearless and Skeleton Undead provide morale check immunity on creature locus
    detail: >-
      Shark, Megalodon (Fearless) and Skeleton (Undead) are immune to morale checks. These traits operate on creature
      defense locus under Constitution 2.5.
  - id: OBS-06
    subject: Snake, Cobra Poison imposes accelerated death timer on creature attack locus
    detail: >-
      Cobra bite delivers lethal venom requiring DC 18 CON check or drops victim to 0 HP with a death timer of 1.
      This operates on creature attack rider locus under Constitution 2.5.

