rejected_candidates:
- text_locus: the crawlers with the Mercenaries Guild, p158
  quoted_gist: crawlers with the Mercenaries Guild confront the characters
  why_considered: It is a party of adventurers confronting the characters, which is in substance what
    the rival crawler generator produces, and this same page carries a cell that does earn the reach.
  rejection_reason: 'The qualifier rival is absent, and crawler alone is this book''s generic word for
    an adventurer. That is the disposition settled at printed page 147 and affirmed since: the qualifier
    identifies the procedure, not the noun. Having both cells on one page makes the distinction easy to
    check rather than harder, and the building script asserts that the crawler stem matches exactly two
    cells here while the rival stem matches exactly one.'
- text_locus: the named nobles and titled figures, pp158 and 159
  quoted_gist: the Overlord, the Duke's son, Baron Clard's wife, Duchess Gorvalt, Lord Larvin, Miss Fralk,
    Sir Wyndos the Bold, Sir Faust, a Reverend Sister given as an acolyte, and the Wandering Merchant
  why_considered: More individually named people than any table in the chapter so far, and one carries
    a creature type in parentheses.
  rejection_reason: None has a defining locus in the graph. The acolyte parenthetical points at the unextracted
    monster chapter, where that creature's stat block lives, and the rest appear once each in this cell.
    Ninth packet running for the same disposition.
- text_locus: the healing and blessing offer, p159
  quoted_gist: a Reverend Sister offers healing or blessing to a character
  why_considered: rule_hit_points is canonical and took a row from the deep tunnels table for motes of
    light that heal.
  rejection_reason: The deep tunnels cell states an amount healed and a condition for it. This one states
    that healing is offered, with no amount, no check, no spell named and no acceptance. The same wording
    was declined on printed page 151, where a lost priest also offers healing, so this is the second instance
    of one disposition rather than a new call.
- text_locus: the brass monkey statue, p159
  quoted_gist: a brass monkey statue turns one copper piece into one gold piece a stated percentage of
    the time
  why_considered: item_coin is canonical and this is the only cell in the chapter that changes money rather
    than describing it, so a reach looked available.
  rejection_reason: The cell's entire content is two denominations and a probability, all magnitudes.
    Stripped of them it says a statue sometimes changes a coin into another coin, which states no procedure
    and names no rule. The same reading declined the filth tax levied in gold at the top of the page.
- text_locus: the violent and hazardous scenes that state no mechanic, pp158 and 159
  quoted_gist: casks of wine careening at the characters, a panther tearing free of its leash, a chamber
    pot thrown down at them, a dagger flying at a character, poisoned wine, drugged tarts, zombies and
    a vampire hidden in a crowd
  why_considered: Several would harm a character, and poison and drugs are the kind of thing a status
    vocabulary would carry.
  rejection_reason: Not one states a check, a die, a value or a consequence, and the word damage does
    not appear on the page. The poison and drug cells fail twice over, since there is no status identity
    and the condition vocabulary has no term for one. Seventh locus to lose rows to that gap.
- text_locus: the two-encounter instruction, p159
  quoted_gist: one result instructs the reader to roll twice more and combine the results, rerolling that
    result if it comes up again
  why_considered: It is the only instruction on the page, and the stem scan flags it as matching rule_encounter.
  rejection_reason: The match is on the plain word encounters in the instruction's own text; M001 already
    carries the table's relation to rule_encounter. The rest is arithmetic on the table's own roll. Declined
    in the same form in each of the eight preceding chapter packets.
- text_locus: the appended random encounter procedure and monster attributes, out of scope
  quoted_gist: the printed page 112 and 113 encounter procedure and the printed page 189 monster attributes
    page
  why_considered: Both are in the file and the first is the rule this table resolves.
  rejection_reason: Both are Supporting Source Context, outside the bounded scope. PKT-SD-112-113 is already
    integrated, so extracting from it would duplicate canonical rows and cite pages outside this packet's
    range.
non_edge_observations:
- id: OBS-01
  subject: the first encounter cell in the chapter to cast a named spell
  detail: 'One cell has a malfunctioning magical ward cast web on the characters, with the spell name
    italicised in the source the way this book marks a spell reference. spell_web is canonical from printed
    page 73 with 5 rows.

    This is the first time in nine chapter packets that a result names a mechanic the graph already holds
    in full rather than a procedure to be run. It is also the first row anywhere in the intake from a
    tbl_ source to a spell_ target under a causal type: the only existing tbl_ to spell_ rows are the
    two spells-known tables constraining the spell families they count, which is a different relation
    entirely.

    Recorded because the shape is new and will recur. Later chapters, and the monster chapter in particular,
    will have creatures casting named spells, and the type and polarity settled here are the precedent
    for those.'
- id: OBS-02
  subject: both crawler wordings appear on one page and only one earns a row
  detail: 'The crawler stem matches exactly two cells here. One reads crawlers with the Mercenaries Guild
    confront the characters and earns nothing; the other reads rival crawlers brandish their new sheriff
    pins and writs and carries M003. The building script asserts both counts rather than my reading them.

    This is the cleanest test the chapter has offered of the rule settled at printed page 147 and affirmed
    since, that the qualifier identifies the procedure and the noun does not. Until now the two readings
    were on different pages and could have been reconciled as inconsistency between packets. Here they
    are twelve rows apart in one table, written by the same hand on the same page, and the book plainly
    means two different things by them: one is a guild of adventurers-for-hire, the other is a rival party.'
- id: OBS-03
  subject: two identities this intake minted are now producing scan collisions
  detail: 'rule_shop matches a basilisk charging out of a curio shop, and rule_taverns matches a cry for
    help from behind a tavern. Both identities were minted by this intake from printed pages 138 and 136,
    both within the last ten packets, and neither cell asserts anything about the generators they name.

    Recorded as a measurement about the method rather than about this page. The spurious rate of a registry
    scan rises as the registry grows, and it rises fastest for identities whose labels are ordinary nouns,
    which is what a chapter of generators for shops, taverns and settlements produces. rule_shop has now
    collided twice, here and on printed page 144. It is a reason to keep reporting both scans and the
    discarded matches rather than only the conclusion.'
