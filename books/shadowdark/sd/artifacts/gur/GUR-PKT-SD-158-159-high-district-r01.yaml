completeness_statement: 'Both printed pages in scope were read in full at the recorded checksum: 1 named
  table, 50 data rows, 0 sentences of prose. The packet yields 1 new identity and 3 rows, reusing 3 canonical
  identities whose labels the building script asserted equal to the registry. The proposed table carries
  edges, so nothing is left unattached.

  Every row was checked against the 797 canonical edges for an assertion-key collision, for a shared source,
  type and target under a different aspect, and for duplicates within the patch; there are none of any,
  and no canonical row cited either page before. The script locates the supporting cell for each row and
  asserts its page, which matters because the page break falls inside the table.

  7 candidates were rejected and each is recorded with its reason. The largest deliberate loss is the
  creature and scene content, which belongs to the unextracted monster chapter or states no mechanic at
  all. 6 of the 11 apparent registry references in the cells are spurious collisions with ordinary English,
  measured rather than filtered by eye. No assertion depends on any other ruleset.'
spell_reach_note: 'M002 is a new shape for this chapter and both its type and its polarity were chosen
  rather than defaulted, so both are argued here.

  The cell reads that a malfunctioning magical ward casts web on the characters. TRIGGERS is the type,
  because the encounter causes the casting to occur; FEEDS_INTO would say the table supplies an input
  to the spell, which is not what happens, and MODIFIES would say the encounter changes how web works,
  which is false.

  The polarity is neutral at basis read, and that is the deliberate part. Web is plainly adverse: its
  canonical rows have the check constraining escape from it and it excluding movement for an entangled
  target at negates. But that direction is stated on printed page 73, not in this cell. What this cell
  states is that the spell is cast on the characters, and nothing about benefit or harm. Writing inflicts
  here would import the spell''s own nature into the trigger row and double-count it, which is the same
  error as restating a path the graph already has. The precedent for a neutral TRIGGERS row is rule_action
  TRIGGERS rule_check on risk resolution, also at basis read.

  If the Reviewer holds that casting a restraining spell on the party is harm stated by context, the change
  is one field and I would rather be told than choose the stronger claim myself.'
