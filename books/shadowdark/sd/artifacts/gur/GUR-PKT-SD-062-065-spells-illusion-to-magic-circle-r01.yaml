page_attribution_basis: 'Three markers resolve this packet: p63 ends the INVISIBILITY heading, p64 ends
  LAY TO REST and p65 ends MAGIC CIRCLE. Placement rule 1 applies each to its whole heading and the persistence
  rule carries it to the following unmarked entries, giving p63 to INVISIBILITY, JUDGEMENT and KNOCK,
  p64 to LAY TO REST, LEVITATE, LIGHT, LIGHTNING BOLT and MAGE ARMOR, and p65 to MAGIC CIRCLE.

  ILLUSION precedes the first marker. SOURCE_MARKDOWN gives such content no resolved page unless packet
  metadata supplies an independent authoritative locator, and the claimed manifest supplies one under
  leading_content_page_resolution: a page''s first heading carries that page''s marker throughout this
  intake, ILLUSION carries none, so it continues the preceding page, whose identity the p62 marker inside
  PKT-SD-061-062 fixes independently of this file. ILLUSION is printed page 62 and its two rows cite it.
  No page length was estimated and no line number was used.'
shared_page_note: Printed page 62 is cited by two packets. PKT-SD-061-062 holds its entries up to HOLY
  WEAPON and this packet holds ILLUSION, because the operator's split falls inside a printed page rather
  than on its boundary. This is the first such split in the intake and is flagged rather than smoothed
  over. It does not breach the zero-overlap rule, which bars two packets from claiming the same source
  content, not from citing the same printed page; no line, heading or sentence is claimed twice.
scope_boundary: The bounded scope is the Primary Source Material section, the ten alphabetically sequenced
  entries from ILLUSION to MAGIC CIRCLE. The trailing Supporting Source Context is out of scope and contributed
  nothing; its markers p44 through p53, p82, p83, p85 and p86 were not used.
source_summary: Ten spell entries in alphabetical order. Each opens with a heading, then a line giving
  the spell's tier and its casting class or classes, then a duration line, then a range line, then effect
  prose. Illusion creates a sensory illusion that a check can disbelieve. Invisibility hides a touched
  creature until it attacks or casts. Judgement banishes a creature to be judged by the caster's god and
  returns it healed, harmed or unchanged. Knock opens mundane locks and barriers loudly. Lay to Rest destroys
  an undead creature. Levitate floats the caster vertically. Light makes a touched object glow for a stated
  span of real time. Lightning Bolt strikes a line of creatures for damage. Mage Armor sets the caster's
  armor class. Magic Circle wards those inside against a named creature type.
graph_state_at_extraction: 'Read from the repository at extraction, not recalled: the canonical graph
  holds 228 registry rows and 365 edges, and 43 spell_ identities are canonical. None of the ten entries
  in this packet exists yet. The canonical edge set was loaded so every proposed row could be checked
  against the section 4 assertion key; there are no collisions. Production holds 5 CLASSIFIED_AS rows,
  all from the tier scaffold integrated as INT-20260926-002, so the 21 classification rows below are the
  first to classify individual spells.'
classification_basis: 'This is the first spell packet extracted since DEC-2026-0103 opened CLASSIFIED_AS
  and its implementation reached terminal Reviewer approval in REV-IMP-DEC-2026-0103-r01-r01, so the tier
  and class line is extracted here rather than recorded as an omission. Constitution section 2.4 authorizes
  exactly the two forms used: a spell_ to class_wizard or class_priest with aspect casting class, cardinality
  one or more, and a spell_ to one of the five tier values with aspect spell tier, cardinality exactly
  one.

  Both are read from each entry''s own header line and from nothing else. Every entry yields exactly one
  tier row; nine yield one class row and LIGHT yields two, because its header names both classes. Tiers
  1, 2, 3 and 5 are used. No entry in this packet is tier 4, so rule_spell_tier_4 is canonical but unreferenced
  here, which is a fact about these ten spells rather than a gap in the scaffold.

  The four spell packets already published, PKT-SD-054-056 through PKT-SD-061-062, still owe classification
  successors; each recorded the omission at the time and none is affected by this GUR. No CLASSIFIED_AS
  row here targets a sys_ axis or any grouping identity.'
light_source_note: LIGHT produces illumination and is deliberately not connected to rule_light_source.
  DEC-2026-0104 authorizes only an item_ to rule_light_source classification, requires an independent
  Review of IMP-DEC-2026-0104-r01 that does not yet exist, and asserts nothing about Torch, Lantern or
  Campfire. A spell is not an item_, so no form of that row is available for this entry under any reading,
  and inventing an adjacent shape would be the widening the Decision refused. Recorded as OBS-05 for the
  Architect rather than worked around.
