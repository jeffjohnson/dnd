authored_polarity_declaration: 'Authored polarity appears on nine rows and on no others. Constitution
  section 5 restricts it to MODIFIES, TRIGGERS and CONSTRAINS, and every one of those rows carries it
  with basis read, as invariant 15 requires. The five CONSTRAINS rows take governs, because each bounds
  a spell without changing a value. Levitate and Mage Armor take improves. Lightning Bolt takes inflicts.
  The two Judgement rows are the only pair that differ: the same relationship improves hit points on a
  favourable verdict and worsens them on an unfavourable one, so each is carried as its own row distinguished
  by condition rather than averaged into one. The 21 CLASSIFIED_AS rows and the six FEEDS_INTO and EXCLUDES
  rows carry none, since section 5 derives those.'
domains_touched: []
candidate_domains:
- proposed: magic
  basis: Every entry belongs to the spell machinery. Recorded as a candidate only, consistent with the
    four spell packets already published; constitution section 8 reserves domain promotion to an Architect
    Decision.
domain_boundary_questions: []
candidate_general_rules: []
candidate_general_rules_note: None proposed. The classification rows repeat two shapes across ten entries,
  but they enumerate per-entry source facts rather than instancing a rule, and the Analyst is prohibited
  from promoting a general rule.
non_edge_observations:
- id: OBS-01
  subject: magnitudes are excluded from every row
  detail: Each entry states quantities and none reaches a field. Judgement and Lay to Rest each bound
    the target's level, Lightning Bolt states a damage dice expression, Mage Armor states the armor class
    it sets and the higher value on a critical, Light states how long it lasts, and several entries state
    a duration in rounds. The rows carry the relationship and the constraint; the numbers stay in the
    immutable packet. A reader who needs the value reads the source.
- id: OBS-02
  subject: range and duration values are not asserted except where a rule node exists
  detail: 'Each header gives a range band and a duration. Neither is extracted as a value. Duration is
    asserted only where a named rule carries it: rule_focus for the three Focus entries and rule_real_time
    for Light, both canonical. The close, near and far bands are the distance vocabulary defined on printed
    page 85 and already canonical as a movement concept, but no entry here states a mechanic that turns
    on its own band, so no range row is asserted. This matches the four spell packets already in production.'
- id: OBS-03
  subject: Knock yields no mechanical row
  detail: 'Knock opens a door, window, gate, chest or portal and defeats mundane locks and barriers, and
    makes a loud noise. None of those has a canonical identity: there is no lock, door, barrier or noise
    node, and proposing one would mint an identity the source does not define as a mechanic. Knock therefore
    contributes its three classification rows and nothing else. Its audibility plainly matters to stealth,
    and abil_stealthy is canonical, but the entry states no stealth mechanic and the connection would
    be mine rather than the source''s.'
- id: OBS-04
  subject: Knock is named by a spell in an already-integrated packet
  detail: 'The Hold Portal entry on printed page 62 states that the knock spell ends it. That text lies
    inside PKT-SD-061-062''s bounded scope, not this packet''s, so the row is not asserted here even though
    this packet also cites page 62 and now proposes the identity the sentence names. PKT-SD-061-062''s
    own GUR recorded the pending reference as OBS-05, spells that act on other spells. Once spell_knock
    is canonical that observation becomes actionable, and it belongs to a successor for that packet rather
    than to this one. Flagged so the pairing is not lost: the graph will hold both spells and not the
    relation between them.'
- id: OBS-05
  subject: Light is a light source the graph cannot yet say is one
  detail: 'Light makes an object glow and illuminate out to a distance band, which is the same mechanical
    role the torch and lantern play. DEC-2026-0104 authorizes only an item_ to rule_light_source classification,
    and a spell is not an item_, so no available form expresses this even once that Decision''s implementation
    is reviewed. The gap the original light-source observation described therefore persists in a second
    shape: a query for what provides light will miss this spell. Recorded for the Architect, not worked
    around.'
- id: OBS-06
  subject: creatures and creature types named in effect prose are not proposed
  detail: Judgement acts on an intelligent creature, Lay to Rest on an undead creature, and Magic Circle
    wards against a creature type the caster names, with demons given as the source's own example. None
    is proposed. There is no canonical undead or creature-type identity, these are categories rather than
    named mechanics, and taxonomy-only membership stays outside the graph under constitution section 2.4.
    This matches OBS-03 of the PKT-SD-061-062 GUR.
- id: OBS-07
  subject: the disbelief threshold is not asserted separately
  detail: 'Illusion is disbelieved by a Wisdom check made against the caster''s last spellcasting check,
    so two things are true: a check bounds the spell, and the spellcasting check supplies the number it
    is measured against. Only the first is asserted, as rule_check CONSTRAINS spell_illusion. That follows
    the row already in production for Hold Monster, which collapsed the same pair into a single CONSTRAINS
    row. The choice is consistency rather than conviction; if Reviewer prefers the threshold carried as
    its own FEEDS_INTO row from rule_spellcasting_check, the same correction applies to both packets and
    should be made once rather than diverging here.'
- id: OBS-08
  subject: Invisibility is asserted as preventing sight, not as granting a state
  detail: 'The entry says a creature becomes invisible. There is no canonical invisibility or condition
    identity to classify it as, and minting one is not an Analyst act, so the row asserted is the mechanical
    consequence the source states: the spell excludes being seen, against the canonical rule_vision. The
    two rows that end it, on attacking and on casting, share the aspect duration end and differ by source,
    which keeps them distinct under the section 4 assertion key.'
unresolved_identity_questions:
- id: IDQ-01
  subject: whether ILLUSION's page should be resolved by this Analyst at all
  detail: 'SOURCE_MARKDOWN says content before the first marker has no resolved page unless packet metadata
    supplies an independent authoritative locator, and in the same passage says that ambiguous attribution
    must be flagged rather than guessed. I resolved ILLUSION to page 62 on a structural basis recorded
    in the claimed manifest and in page_attribution_basis above, and I judge that a locator rather than
    a guess, because it rests on a marker in another claimed packet and on the intake''s uniform marker
    convention, not on page length or line numbers.

    A Reviewer could reasonably hold the stricter reading: that only the operator may supply the locator,
    and that ILLUSION''s two rows should be withheld until a marker exists. Consequence if my reading
    is wrong: two rows, both on ILLUSION, lose their page and must be withdrawn or recited; the other
    37 rows are untouched, since every one of them sits under an explicit marker. Flagged rather than
    left implicit because it is the first mid-page split in the intake.'
architectural_escalations: []
architectural_escalation_note: 'None raised. Every identity uses an approved prefix, every row uses a
  legal edge type, the 21 classification rows use only the two forms constitution section 2.4 authorizes
  for spells with the exact aspects it names, and no new prefix, edge type, domain promotion or general
  rule is requested. Three limits are observed and recorded rather than questioned: the light-source form
  is unavailable to a spell under DEC-2026-0104, OBS-05; creature taxonomy stays out of the graph, OBS-06;
  and the cross-packet Knock reference belongs to the other packet, OBS-04. IDQ-01 is a question for the
  Reviewer about one page attribution, not an Architect matter.'
completeness_statement: All ten entries in the bounded scope were read at the recorded checksum and each
  produced at least its classification rows. The packet yields 10 spell identities, 18 mechanical rows
  and 21 classification rows, 39 rows in total, every one checked against the 365 canonical edges for
  an assertion-key collision before publication; there are none. Sixteen canonical identities are reused
  rather than re-proposed, verified against the registry at extraction. Tier and casting class are extracted
  for every entry, which closes for this packet the omission the four earlier spell packets recorded and
  still owe as successors. What is deliberately not asserted is listed as OBS-01 through OBS-08, and the
  single open question is IDQ-01. No assertion depends on any other ruleset.
