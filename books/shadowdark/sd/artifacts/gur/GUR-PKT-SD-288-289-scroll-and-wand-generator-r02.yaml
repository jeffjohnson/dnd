source_summary: >-
  Pages 288–289 present the Scrolls and Wands Generator section, comprising nine tables:
  - SCROLL FEATURE TABLE (d8) provides material and visual details for scrolls;
  - WAND FEATURE TABLE (d8) provides material and visual details for wands;
  - SCROLL AND WAND CURSES/BENEFITS TABLE (2d6) routes curse and benefit rolls to Armor, Potion, Utility, or Weapon tables;
  - SCROLL AND WAND SPELL TIER TABLE (2d6) determines the spell tier (Tier 1 through Tier 5) of the scroll or wand;
  - SCROLL AND WAND TIER 1 through TIER 5 SPELL TABLES (d12 each) randomly select specific spells of the determined tier.

