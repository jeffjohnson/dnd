rejected_candidates:
  - text_locus: 'SCROLL FEATURE TABLE aesthetic entries, p288'
    quoted_gist: 'Branded on leather... Etched on copper leaf... Tattooed on dragon skin'
    why_considered: 'Checked for item material or crafting relationship edges.'
    rejection_reason: >-
      Cosmetic physical descriptions and material details for scrolls; they do not establish independent mechanical rules or item statistics.
  - text_locus: 'WAND FEATURE TABLE aesthetic entries, p288'
    quoted_gist: 'Carved from bone... Blinking eye in handle... Sleek starmetal... Made of tiny skulls'
    why_considered: 'Checked for item material or monster part relationship edges.'
    rejection_reason: >-
      Cosmetic physical descriptions and visual motifs for wands; they introduce no mechanical rules or combat statistics.
  - text_locus: 'SCROLL AND WAND CURSES/BENEFITS TABLE category routing targets, p288'
    quoted_gist: 'Armor, Potion, Utility, Weapon'
    why_considered: 'Checked for CROSS_REFERENCES edges to armor, potion, utility, or weapon tables.'
    rejection_reason: >-
      Table entries route the referee to other generation tables. In-packet cross-references or references across packets are generation instructions rather than structural rule relationships.
  - text_locus: 'Individual spell entries on Tier 1 through 5 tables, pp288-289'
    quoted_gist: 'Alarm, Burning hands, Acid arrow, Fireball, Arcane eye, Wish, etc.'
    why_considered: 'Checked for direct edges between the tier tables and all 60 individual spell nodes in the canonical graph.'
    rejection_reason: >-
      Spell entries listed in these tables represent random roll selection outcomes from d12 tables. The canonical spell nodes are defined in their respective spell chapters (pp. 44–73); listing them as generator outcomes on scroll/wand tables does not modify their spell rules or create structural dependencies.
  - text_locus: 'Tier ranges and dice bands, pp288-289'
    quoted_gist: '2-5: Tier 1, 6-7: Tier 2, 8-9: Tier 3, 10-11: Tier 4, 12: Tier 5'
    why_considered: 'Checked for numeric tier conditions.'
    rejection_reason: >-
      Numeric dice bands and tier ranges are roll table structures excluded from aspect/condition strings by Invariant 11.
  - text_locus: 'Supporting source context passages, pp34-37, pp44-73, p86, pp282-283'
    quoted_gist: 'Magic item attributes, Starting gear, Resting, Combat actions, Referenced spell texts'
    why_considered: 'Checked for edges citing supporting context passages.'
    rejection_reason: >-
      Supporting source context is repeated material from earlier packets and is out of scope per Scope Boundary; no row here may cite pages outside 288–289.
