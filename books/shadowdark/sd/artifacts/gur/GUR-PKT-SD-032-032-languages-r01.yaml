authored_polarity_declaration: >-
  No polarity is authored because no edge is proposed. Constitution section 5 restricts authored
  polarity to MODIFIES, TRIGGERS and CONSTRAINS; none of those, and no other type, appears here.

rejected_candidates:
  - text_locus: 'COMMON LANGUAGES TABLE and RARE LANGUAGES TABLE headings, p32'
    quoted_gist: 'two separately headed tables dividing the fourteen languages into ten common and four rare'
    why_considered: >-
      The division is mechanically load-bearing elsewhere. The wizard entry on printed page 24 grants
      a stated number of additional common languages and a stated number of rare ones and points at
      this page, and the priest entry offers a choice among three that are all rare. Two tbl_
      identities would also be uncontroversial on their own terms, and section 2.3 explicitly permits
      tbl_common_languages and tbl_rare_languages to be proposed.
    rejection_reason: >-
      Section 2.3 permits those tables only when an explicit source relationship needs one, and no
      relationship here does. The same section then forecloses the representation directly: table
      headings are source context, not a stored language property, an automatic table-membership edge,
      a general rule or an inferred relationship, and the table layout must not be used to invent a
      membership vocabulary or a language hierarchy. Proposing the two tables with nothing to attach
      them to would add two nodes whose only purpose would be to carry the membership the ruling
      declines to store.
  - text_locus: 'Who Speaks It column, both tables, p32'
    quoted_gist: >-
      each language paired with its speakers, from Most humanoids and Dwarves through to Elder things
      and elementals
    why_considered: >-
      This column is half the content of the page and is the only thing on it that relates a language
      to anything else. A language exists to be spoken by someone, so the pairing looks like the
      page's substance rather than decoration.
    rejection_reason: >-
      The speakers are overwhelmingly creatures the book defines in its Monsters chapter and this page
      does not define at all: about twenty of them, from ogres and trolls to sahuagin, viperians,
      manticores and elementals. Minting them from a two-word table cell is the secondary-listing case
      SOURCE_MARKDOWN Source Identity Authority prohibits, and it would fix twenty creature spellings
      from the wrong locus.
      The three entries that do name things with canonical identities, Dwarves, Elves and goblins, are
      worse rather than better: constitution section 2.1 states that ancestry and creature identity
      are distinct and that a shared label does not merge them, so an edge from lang_dwarvish to
      ancestry_dwarf would silently answer the question that section reserves. See IDQ-01.
  - text_locus: 'closing epigraph, p32'
    quoted_gist: 'an attributed line about language being the key to the most important doors'
    why_considered: 'Read for completeness, as every block on an in-scope page must be considered.'
    rejection_reason: >-
      Flavour. It states no dependency and names no mechanic; its speaker is a character in an
      anecdote. Striking it would require no mechanic to be reviewed.

non_edge_observations:
  - id: OBS-01
    subject: the payoff of these identities is in other packets, not this one
    detail: >-
      This GUR adds fourteen registry rows and no assertions, which could look like poor value for a
      packet that was escalated for and held overnight. The value is real but lands elsewhere.
      Eight published rows currently say only that something supplies starting languages: six from
      the ancestries GUR, one from the priest entry and one from the wizard entry, each attaching to
      the sys_language axis because the individuals could not be named when they were written. The
      source states those links precisely: the dwarf knows Common and Dwarvish, the elf Common,
      Elvish and Sylvan, the goblin Common and Goblin, the half-orc Common and Orcish, the halfling
      and human Common, and the priest one of Celestial, Diabolic or Primordial. Once these fourteen
      identities are registered, successor revisions of those GURs can name them.
      The Analyst is not publishing those successors now. Each would be a revision to an immutable
      artifact in another packet's lineage, several of those packets are mid-pipeline, and
      DEC-2026-0100 has just made clear that reissuing a published GUR needs a better reason than
      convenience. The right moment is after these nodes are integrated, and the right form is an
      ordinary source-read revision rather than a mechanical repoint.
  - id: OBS-02
    subject: sys_language is canonical but is deliberately not reused here
    detail: >-
      The language axis is in the registry and this page is arguably its defining locus too. It is not
      listed under reused_nodes, because reused_nodes records identities the patch's edges resolve
      against and this patch has no edges; declaring it would produce a node with no use, which is the
      accidental-orphan shape the fourteen proposals explicitly distinguish themselves from.
      No axis-to-member edge is drawn either. Section 2.3 says sys_language remains the aggregate axis
      and neither merges with nor replaces an individual language, and the same paragraph forbids
      using the table layout to invent a membership vocabulary. This matches the treatment the
      alignment and deity packet gave its own axes for the same reason.
  - id: OBS-03
    subject: the common and rare split is recorded as source context on each node
    detail: >-
      Every proposed node names which of the two tables it came from in its source_evidence and
      defining_locus, exactly as constitution section 2.3's own enumeration does with its Source table
      column. That is provenance prose, not a stored property, and no field or edge encodes it.
      Recorded because a reader who knows the wizard entry depends on the distinction will look for it
      and should find the deliberate boundary rather than an omission.
  - id: OBS-04
    subject: no magnitudes are present to exclude
    detail: >-
      Recorded for symmetry with the other GURs in this intake, which each account for the magnitudes
      they dropped. Page 32 contains no numerals at all: no die expression, count, bonus, threshold or
      duration. The two tables have no index column, unlike every other table read so far, because
      they are enumerations rather than rollable tables. Nothing is excluded that a reader might
      expect represented.
  - id: OBS-05
    subject: packet wrapper and supporting context
    detail: >-
      The supplied file opens with an intake wrapper ahead of the Primary Source Material heading, for
      which the claim manifest is the independent page locator SOURCE_MARKDOWN Attribution Rules
      requires; it contains no rulebook prose, heading or marker. The trailing Supporting Source
      Context reproduces printed page 15 and is orientation only, contributing nothing here.
  - id: OBS-06
    subject: the packet manifest declares an earlier constitution version
    detail: >-
      packet.yaml for this packet records constitution_version 1.2, which was current when it was
      claimed. This GUR declares 1.5 and was validated against it. The manifest is left exactly as
      published: constitution section 9 says not to rewrite immutable packet manifests merely for an
      additive bump, and DEC-2026-0100 says the same of GURs. The discrepancy affects no proposal,
      since the manifest's authority is over page attribution, source identity and composition, none
      of which changed across 1.3, 1.4 or 1.5.

unresolved_identity_questions:
  - id: IDQ-01
    subject: three language rows name speakers that collide with canonical ancestry labels
    detail: >-
      The Dwarvish row names Dwarves, the Elvish row Elves, and the Goblin row lists goblins among
      bugbears and hobgoblins. ancestry_dwarf, ancestry_elf and ancestry_goblin are canonical, so in
      three of fourteen rows an edge would have had a resolvable target.
      No edge is drawn. Constitution section 2.1 states that ancestry, class and creature identity are
      distinct and that a shared label does not merge an ancestry with a creature, and the Goblin row
      shows why that matters here: it places goblins alongside bugbears and hobgoblins, which are
      plainly creatures rather than playable ancestries, so the row is about a creature family and not
      about the ancestry a player may choose. Reading Dwarves and Elves differently from goblins in
      the same column would be inconsistent.
      Consequence if wrong: if the Monsters chapter or a later Decision establishes that the playable
      ancestry and the creature are one identity, this page supports three speaker edges and a
      successor revision can add them. Nothing published here would need retracting, because no
      assertion was made either way.
  - id: IDQ-02
    subject: lang_draconic is proposed twice across two packets
    detail: >-
      GUR-PKT-SD-040-042-random-characters-r01 proposes lang_draconic from a secondary mention,
      because the priest reroll rule on printed page 40 needed an endpoint and a GUR must propose
      every non-canonical endpoint it uses. This GUR proposes the same identity from its defining
      locus on printed page 32. The ID and label are identical and both are taken from constitution
      section 2.3's enumeration, so the two proposals agree in every field that matters.
      Reviewer should de-duplicate to a single registry addition, which is the ordinary path for a
      cross-packet identity. Recorded explicitly because the duplication is the visible consequence of
      a deliberate ordering choice: the random-characters packet was extracted first while this one
      was still held pending DEC-2026-0098, and the alternative would have been to drop the only
      non-routine rule on that page.
      Consequence if wrong: none to either assertion. If Builder or Reviewer prefers a single
      proposal, this one is from the defining locus and should be the survivor.

architectural_escalations: []
architectural_escalation_note: >-
  None raised, and none remains outstanding for this packet. The escalation it was held on,
  ESC-2026-09-22T18.43.24.006Z, was decided as DEC-2026-0098, which added the lang_ prefix and
  enumerated these fourteen identities. Every proposed node uses that approved prefix with the
  machine kind section 2.3 states, no edge is proposed at all, and no new prefix, edge type, domain
  promotion or general-rule application is requested.
  The three relationships this page might have supported are each closed by an existing authority
  rather than by an open question, so none of them is escalated: section 2.3 forecloses table
  membership, SOURCE_MARKDOWN forecloses minting creature identities from a table cell, and section
  2.1 forecloses merging an ancestry with a creature by label. IDQ-01 records the last of these so
  that a later Decision can reopen it deliberately if the Monsters chapter warrants.

completeness_statement: >-
  The single printed page in the declared span is accounted for. Page 32 was read in full: the
  LANGUAGES heading, the COMMON LANGUAGES TABLE with both column headings and all ten rows, the RARE
  LANGUAGES TABLE with both column headings and all four rows, and the closing attributed epigraph.
  Both tables' Who Speaks It columns were read in full and are dispositioned in rejected_candidates
  and IDQ-01. Every page marker was resolved through the Pandoc AST and the resolved page set matches
  the declared span with no gap. The Supporting Source Context reproducing printed page 15 is out of
  scope and contributed nothing.
  Fourteen candidate nodes are proposed and no candidate edges, which is the intended shape and is
  declared as such in artifact_shape_declaration, with each node marked registry_addition_only and
  carrying its basis. The fourteen are exactly the fourteen constitution section 2.3 enumerates, with
  its IDs and labels. No node is reused. Content not converted to a proposal or an edge is accounted
  for in rejected_candidates and OBS-01 through OBS-06, and the two questions the Analyst could not
  settle are recorded in IDQ-01 and IDQ-02 rather than resolved silently. No assertion depends on any
  other ruleset.
