unblocking_note: >-
  This packet was claimed and read in full on 2026-09-22, then held without a GUR because
  Constitution 1.2 section 2 offered no prefix under which an individual language identity could be
  formed, and essentially all of this page's content is individual languages. The Analyst escalated
  rather than mint a prefix, as ESC-2026-09-22T18.43.24.006Z. DEC-2026-0098 resolved it and
  Constitution 1.4 section 2.3, carried forward into 1.5, now authorises lang_ with machine kind
  language and enumerates the fourteen identities below. This GUR proposes exactly those fourteen,
  reproduced as section 2.3 states them.

artifact_shape_declaration: >-
  This GUR proposes fourteen candidate nodes and no candidate edges. That is deliberate and is the
  packet's actual result, not an incomplete reading. It is a shape this intake has not produced
  before, and it is distinct from the three null extractions already published for the front matter,
  the character names table and the back matter, which proposed nothing at all.
  Printed page 32 is the defining locus for every language the book names, so the identities belong
  here under SOURCE_MARKDOWN Source Identity Authority. The page states no relationship the closed
  edge vocabulary may express, for reasons set out in why_no_edges below. Registry additions are
  isolated from edge insertions by design, and DEC-2026-0003 lets Reviewer approve a node change on
  its own, so a proposal-only GUR is a valid artifact rather than a defective one. Each node carries
  registry_addition_only with its basis so that an accidental orphan is still distinguishable from
  this intended shape.

why_no_edges: >-
  Three candidate relationships were considered and each is closed off by a specific authority rather
  than by the Analyst's preference.
  The first is table membership, that Dwarvish is a common language and Celestial a rare one. That
  distinction is genuinely mechanical elsewhere: the wizard entry on printed page 24 grants a stated
  number of each and points at this page. Constitution section 2.3 nonetheless forecloses it in
  terms, saying table headings are source context and not a stored language property, an automatic
  table-membership edge, a general rule or an inferred relationship, and that the table layout must
  not be used to invent a membership vocabulary or a language hierarchy. The Analyst follows that
  ruling rather than arguing with it here.
  The second is the Who Speaks It column, which pairs each language with the creatures that use it.
  Asserting those would require about twenty creature identities, ogres, trolls, bugbears,
  hobgoblins, merfolk, sahuagin, sirens, lizardfolk, viperians, centaurs, dryads, faeries, minotaurs,
  beastmen, manticores, angels, demons, devils, dragons, elder things and elementals, none of which
  exists and none of which this page defines. Minting them from a two-word table cell is exactly the
  secondary-listing case SOURCE_MARKDOWN Source Identity Authority prohibits; the Monsters chapter is
  their defining locus.
  The third is the subset of that column naming things that do have canonical identities: Dwarves,
  Elves and goblins. Constitution section 2.1 states that ancestry, class and creature identity are
  distinct and that a shared label does not merge an ancestry with a creature. The dwarves who speak
  Dwarvish are the people of the world, and whether they are the same identity as the playable
  ancestry_dwarf is precisely the question that section refuses to answer by label. Drawing the edge
  would settle it silently.
  The relationships that do connect these identities to the graph are already asserted from their own
  loci, at the axis level: six ancestry rows, one priest row and one wizard row each say that an
  ancestry or class supplies starting languages. Those rows can be refined to name specific languages
  once these identities are registered, which is the practical payoff of this GUR and was the
  argument the escalation made.

