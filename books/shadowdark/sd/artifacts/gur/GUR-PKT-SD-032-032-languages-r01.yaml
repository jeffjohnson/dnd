source_summary: >-
  Printed page 32 is the LANGUAGES heading followed immediately by two tables and a closing
  attributed epigraph. There is no framing prose and the page states no rule. The COMMON LANGUAGES
  TABLE lists ten languages against the creatures that speak each; the RARE LANGUAGES TABLE lists
  four the same way. This summary is orientation only.

graph_state_at_extraction: >-
  The Shadowdark canonical graph holds 45 registry rows after INT-20260922-002 and INT-20260922-003.
  The registry was read at extraction rather than recalled. No lang_ identity is canonical, so all
  fourteen are proposed here. sys_language is canonical but is not reused, because no row uses it and
  a declared node with no edge would be an accidental orphan rather than the intended registry
  addition; see OBS-02. The domain registry is still empty and general_rules.json is still an empty
  object.

