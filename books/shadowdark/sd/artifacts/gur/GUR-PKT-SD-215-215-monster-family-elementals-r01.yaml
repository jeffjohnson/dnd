source_summary: >-
  The ELEMENTALS family: two introductory paragraphs describing elementals as semi-humanoid beings of
  pure energy with opposing elemental pairs (earth/air, fire/water) and standardizing tier statistics
  (Lesser at LV 6 with 2 damage dice, Greater at LV 9 with 3 damage dice), followed by eight stat blocks.
  Air Elementals carry Impervious and Whirlwind; Earth Elementals carry Impervious and Avalanche; Fire
  Elementals carry Impervious (with fire immunity) and Inferno; Water Elementals carry Impervious and
  Whirlpool.

