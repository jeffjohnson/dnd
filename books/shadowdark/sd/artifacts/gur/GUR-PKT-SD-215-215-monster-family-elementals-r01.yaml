rejected_candidates:
  - text_locus: 'the family introduction (paragraph 1), p215'
    quoted_gist: >-
      Elementals are semi-humanoid beings of pure energy that speak rudimentary Primordial. Earth and air
      are anathema to each other, as are fire and water.
    why_considered: >-
      Checked for family taxonomy, language mechanics (Primordial), or opposing element vulnerability/damage rules.
    rejection_reason: >-
      Narrative lore and conceptual opposition; no mechanical rule or vulnerability edge is specified
      in text; constitution 2.4.
  - text_locus: 'size and damage rule (paragraph 2), p215'
    quoted_gist: >-
      Lesser elementals are LV 6 and their slam deals 2 dice of damage. Greater elementals are LV 9 and
      their slam deals 3 dice of damage.
    why_considered: 'Checked for family-wide template or general rule.'
    rejection_reason: >-
      Stat-block summary and design rule for the stat blocks on this page; level and damage dice are
      magnitudes reflected on each creature locus; constitution 2.4/2.5.
  - text_locus: 'Impervious (Air, Earth, Fire, Water Elementals), p215'
    quoted_gist: 'Only damaged by magical sources. [Fire immune on Fire Elementals]'
    why_considered: 'Eighth occurrence of Impervious; checked against item_magic_item and damage immunity.'
    rejection_reason: >-
      Stat-block description on creature locus. Damage from magical sources only and fire immunity are
      creature-specific defenses; locus test applies.
  - text_locus: 'Whirlwind (Elemental, Air, Lesser and Greater), p215'
    quoted_gist: 'All within close DC 15 DEX or flung 2d20 feet in random direction.'
    why_considered: 'Checked for forced movement mechanics or comparison with Djinni Whirlwind.'
    rejection_reason: >-
      Stat-block attack description on creature locus; DC 15 and distance 2d20 feet are magnitudes;
      locus test applies.
  - text_locus: 'Avalanche (Elemental, Earth, Lesser and Greater), p215'
    quoted_gist: 'All within close DC 15 STR or entombed for 1d4 rounds under mounds of earth.'
    why_considered: 'Checked for entombed or paralyzed condition identity.'
    rejection_reason: >-
      Stat-block attack description on creature locus; DC 15 and 1d4 rounds duration are magnitudes;
      no shared entombed status exists; locus test applies.
  - text_locus: 'Inferno (Elemental, Fire, Lesser and Greater), p215'
    quoted_gist: 'All within near DC 15 DEX or 3d8 damage.'
    why_considered: 'Checked for area damage or fire hazard mechanics.'
    rejection_reason: >-
      Stat-block attack description on creature locus; DC 15 and 3d8 damage are magnitudes; locus
      test applies.
  - text_locus: 'Whirlpool (Elemental, Water, Lesser and Greater), p215'
    quoted_gist: >-
      All within close DC 15 STR or immobilized inside water elemental (treat as underwater). DC 15
      STR to escape on turn.
    why_considered: 'Checked against swimming/suffocation rules (treat as underwater) and immobilized condition.'
    rejection_reason: >-
      Stat-block attack description on creature locus. Narrative instruction to treat as underwater
      and DC 15 STR save/escape checks are creature-specific mechanics; locus test applies.
  - text_locus: 'the flavour text for all eight elementals, p215'
    quoted_gist: >-
      howling tornado of wind, thundering pillar of earth, roaring column of flames, and crashing
      vortex of water
    why_considered: 'Read for completeness across all in-scope blocks.'
    rejection_reason: 'Narrative description throughout.'
  - text_locus: 'the stat-block fields on each of the eight elementals, p215'
    quoted_gist: >-
      armor class, hit points, attacks, movement (including fly, burrow, swim), the six stat
