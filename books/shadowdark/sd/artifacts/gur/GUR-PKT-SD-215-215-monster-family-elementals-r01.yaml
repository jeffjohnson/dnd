non_edge_observations:
  - id: OBS-01
    subject: Elementals follow systematic opposing pair and tier scaling design
    detail: >-
      Elementals are structured in opposing pairs (Earth/Air, Fire/Water) and two tiers (Lesser LV 6
      with 2 damage dice, Greater LV 9 with 3 damage dice). The introductory text explains this design
      pattern, while the individual stat blocks instantiate the exact figures.
  - id: OBS-02
    subject: Water Elemental Whirlpool references the underwater environment
    detail: >-
      Whirlpool on Water Elementals instructs the GM to "treat as underwater" for creatures immobilized
      inside. This provides GM adjudication context for suffocation and movement rather than establishing
      a cross-mechanic edge to swimming rules.
  - id: OBS-03
    subject: Impervious recurs across all eight elementals
    detail: >-
      Impervious appears on all eight elemental stat blocks, granting immunity to non-magical damage
      (and fire immunity on Fire Elementals). As established across prior packets, this ability
      remains a creature locus defense.

