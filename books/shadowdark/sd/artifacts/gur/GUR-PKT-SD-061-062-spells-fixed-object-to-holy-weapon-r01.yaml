architectural_escalation_note: >-
  None raised by this packet. Every proposed node uses the approved spell_ prefix with an unchanged
  kind, every edge uses one of the thirteen legal section 3 types, and no new prefix, edge type,
  domain promotion or general-rule application is requested.
  The tier and class membership question is genuinely architectural and is raised separately rather
  than from inside any one spell packet, because it now spans ancestries, alignments, deities,
  languages and spells and will recur for monsters and treasure. That escalation does not block this
  GUR: every row here is correct whatever the ruling, and a later successor revision can add
  membership rows without retracting an assertion.

