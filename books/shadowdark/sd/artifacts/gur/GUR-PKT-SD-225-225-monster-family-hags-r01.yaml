source_summary: >-
  The HAGS family: two introductory paragraphs describing hags as sinister unseelie crones suffused
  with cursed magic inhabiting sea caves, places of depravity, and deep woods, followed by three stat
  blocks: Hag, Night; Hag, Sea; and Hag, Weald. All three share the Shapechange trait. Hag, Night
  carries Blind; Hag, Sea carries Terrify; Hag, Weald carries Drink Pain.

