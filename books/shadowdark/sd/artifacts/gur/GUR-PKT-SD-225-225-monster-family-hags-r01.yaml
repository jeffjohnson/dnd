non_edge_observations:
  - id: OBS-01
    subject: All three hags share the Shapechange trait
    detail: >-
      Night Hag, Sea Hag, and Weald Hag each possess Shapechange ("Instantly change to look like any other
      humanoid"). This represents a creature-specific action locus under Constitution 2.5 rather than a general
      polymorph or shapechanging rule subsystem.
  - id: OBS-02
    subject: Night Hag Blind and Sea Hag Terrify utilize Charisma saves against status penalties
    detail: >-
      Night Hag Blind imposes a DC 15 CHA check against blindness lasting 1d4 days, while Sea Hag Terrify
      imposes a DC 15 CHA check upon seeing her true form against attack disadvantage lasting 1d4 rounds.
      Both operate on creature combat loci under Constitution 2.5.
  - id: OBS-03
    subject: Weald Hag Drink Pain is a life-drain attack rider
    detail: >-
      Weald Hag Drink Pain operates at near range with a DC 12 CHA check, dealing 2d4 damage and regaining that
      many HP. This operates on creature attack locus under Constitution 2.5.
  - id: OBS-04
    subject: Hags family introduction provides narrative worldbuilding
    detail: >-
      The introductory paragraphs discuss origins in the Unseelie realms and typical habitats (sea caves,
      places of depravity, deep boggy woods) as narrative color without game mechanics; excluded under
      Constitution 2.4.

