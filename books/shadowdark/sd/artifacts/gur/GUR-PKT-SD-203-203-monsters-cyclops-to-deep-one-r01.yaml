rejected_candidates:
  - text_locus: 'Darkness, p203'
    quoted_gist: 'the darkmantle extinguishes all light sources within near'
    why_considered: >-
      rule_light_source is canonical and the ability names the concept directly, in its plural
      form, the same shape already canonical from tbl_tomb_encounters and tbl_ruins_encounters
      at printed pages 182 and 172. The whole-registry scan missed this one; see
      scan_limitation_note for why, and the cell was read regardless.
    rejection_reason: >-
      A stat-block description under the locus test, the same ground as every other ability that
      has named a real shared identity since printed page 195. The near distance is a magnitude.
  - text_locus: 'Sunblind, p203'
    quoted_gist: 'the deep one is blinded in bright light'
    why_considered: >-
      The inverse of Dark-Adapted, so it was checked for whether the same shared-locus exception
      could apply in reverse.
    rejection_reason: >-
      It does not: Dark-Adapted is stated once on the shared Monster Attributes page about a
      whole class of creatures, while Sunblind is stated once under this one creature's own
      block. There is also no blinded or bright-light condition identity in the registry, the
      same gap noted for every status effect since Curse at printed page 194.
  - text_locus: 'the flavour text for all three creatures, p203'
    quoted_gist: >-
      reclusive one-eyed giants, a floating black octopus with red eyes, and cultish amphibious
      fish-people
    why_considered: 'Read for completeness, as every block on an in-scope page must be considered.'
    rejection_reason: 'Narrative description throughout, the disposition applied since printed page 194.'
  - text_locus: 'the eight stat-block fields on each of the three creatures, p203'
    quoted_gist: 'armour class, hit points, attacks, movement, the six stat modifiers, alignment and level for each creature'
    why_considered: 'Every field names a canonical shared identity directly, the case constitution 2.5 names by example.'
    rejection_reason: 'Unchanged from every stat-block packet since printed page 194. 24 field values are excluded on this ground alone.'
  - text_locus: 'the appended shared-system context, out of scope'
    quoted_gist: 'the monster attributes, movement and conditions, and morale pages'
    why_considered: 'All three are in the file and directly relevant to reading a stat block correctly.'
    rejection_reason: 'Supporting Source Context, outside the bounded scope, each already integrated from its own primary packet.'

non_edge_observations:
  - id: OBS-01
    subject: a fourth scan blind spot, this one a plural
    detail: >-
      The stemmer used throughout this intake strips sources to sourc because it checks the
      suffix es before s and sources ends in the letter pair es; the singular label Light Source
      stems unchanged to source, so the two never meet. This is a new failure mode distinct from
      the partial name, the over-stem and the abbreviation already catalogued, and it is the
      first to involve a plural of a two-word label. Recorded because it was caught only by
      reading the cell, which remains the control regardless of how many scan variants exist.
  - id: OBS-02
    subject: a named target with no identity now has one, and the earlier decline still stands
    detail: >-
      Deep one was named in Aboleth's Curse ability at printed page 194 as an example of a
      target with no registry identity. It now has one, registered at its own defining locus.
      The earlier decline is not reopened: Curse was excluded as a stat-block description
      regardless of what it named, not merely because its named target was absent, so the new
      identity changes nothing about that packet's completed assertion. See deep_one_note.

