source_summary: >-
  Three monster stat blocks: Cyclops, a giant with no named ability; Darkmantle, whose Darkness
  ability extinguishes light sources; and Deep One, whose Sunblind ability is vulnerable to
  bright light. Deep One is the creature Aboleth's Curse ability named without an identity at
  printed page 194; this page is its defining locus.

graph_state_at_extraction: >-
  Read from the repository at extraction, not recalled. The canonical graph holds 473 registry
  rows and 866 edges, and 0 rows cite printed page 203 from this packet's content. The registry
  holds 42 monster_ identities and no monster_deep_one. The script asserts that all three
  proposed ids in this packet are absent from the registry before use.

stat_block_boundary_note: >-
  The test settled at PKT-SD-194-194 and confirmed across the four following packets is applied
  without modification: a stat-block description is excluded under constitution 2.5 regardless
  of what it references, because the exclusion is about each instance's own locus. Darkness
  reaches an existing canonical identity directly, the same shape as Bless, Rage, Brutal, Bewilder
  and Screech in the preceding four packets, and is declined on the same ground; see
  light_source_note.

scan_limitation_note: >-
  The whole-registry scan was run before any disposition was written, and it missed Darkness's
  reference to rule_light_source: the cell's plural light sources stems incorrectly against the
  singular label Light Source under the simple suffix stemmer used throughout this intake,
  because sources ends in the two-letter sequence es and strips to sourc rather than source. This
  is a fourth distinct scan blind spot, after the partial name at PKT-SD-178-179, the over-stem
  at PKT-SD-180-181, and the abbreviation at PKT-SD-182-183 and again twice in this chapter. The
  reference was found by reading the cell, and the script asserts the stemmer's exact mismatched
  output rather than merely noting that the scan missed it.

deep_one_note: >-
  Deep One's registration here closes a loop opened at PKT-SD-194-194. The Aboleth's Curse
  ability, DC 15 CON or target gains a magical curse, turning into a deep one over 2d10 days, was
  declined there in part because no identity for the named target creature deep one existed at
  that time. monster_deep_one is registered in this GUR at its defining locus, this page's own
  stat block.
  This does not retroactively change PKT-SD-194-194's Curse decline, which remains correct: Curse
  is still excluded as a stat-block description under constitution 2.5 regardless of what it
  names, the same ground Bless's reference to rule_luck_token did not survive. The identity now
  existing means a future packet that states a transformation into a deep one with its own
  mechanical dependency, rather than as flavour on another creature's ability, would have a
  canonical target to point at; nothing on this page states such a dependency itself.

creature_identity_note: >-
  All three proposed nodes carry no edge in this GUR, for the reason settled at PKT-SD-194-194:
  each creature's defining locus is its stat block, and this page is that locus for all three.
  No family-level identity is proposed.

