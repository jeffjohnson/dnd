authored_polarity_declaration: >-
  No row carries authored polarity. Constitution section 5 restricts authored polarity to MODIFIES,
  TRIGGERS and CONSTRAINS, and this packet proposes none of those: every row is either RESOLVED_BY or
  FEEDS_INTO, which Builder derives as governs and neutral respectively. No polarity or
  polarity_basis value is set by the Analyst on any row.

domains_touched: []
candidate_domains:
  - proposed: character_advancement
    basis: >-
      A title is a consequence of gaining levels and changes as advancement proceeds. Recorded as a
      candidate only; the domain registry is empty and constitution section 8 reserves promotion to
      an Architect Decision. This is the first packet to suggest this particular candidate, and a
      lone occurrence does not promote a domain.

domain_boundary_questions:
  - >-
    A title depends on level, which is advancement, and on alignment, which is a creation choice, and
    its only stated effect is social. Whether that places it in an advancement domain, a character
    domain or neither cannot be settled here. Deferred; no domain is asserted on any edge.

candidate_general_rules:
  - proposed: every class resolves its title on its own titles table indexed by level and alignment
    establishing_locus: 'SD pages 30 and 31, the four titles tables'
    basis: >-
      M001 through M012 are twelve rows expressing three relationships repeated across four
      structurally identical tables. If approved as a general rule, eight of the twelve could become
      derived applications and any later class would be covered automatically.
    not_applied: >-
      Recorded as a candidate only. Constitution section 5 requires a separate Architect ruling with
      an establishing locus, scope, counterexamples and affected set before a general rule exists,
      and the Analyst is prohibited from promoting one. Unlike the class-benefit candidates recorded
      in the four class GURs, the complete affected set is visible on these two pages, which makes
      this the cleanest general-rule candidate in the intake so far. No edge in this GUR sets
      general_rule_id, and under invariant 19 the establishing edges would leave it empty in any case.

non_edge_observations:
  - id: OBS-01
    subject: the four class identities are carried in conditions rather than as edges
    detail: >-
      Each table belongs to one class, and the class GURs propose class_fighter, class_priest,
      class_thief and class_wizard from their own defining loci. This GUR does not propose them and
      draws no class-to-table edge. The class linkage is carried in the condition of M001 through
      M004, which is the same treatment the class GURs gave their own talents tables.
      The alternative, four GATES rows from each class to its titles table, would say the same thing
      twice and would pull four identities into this patch that no other row here needs. Recorded so
      the absence of class nodes in a packet plainly about per-class tables is visibly deliberate.
  - id: OBS-02
    subject: the three alignments are named as column headings and not proposed
    detail: >-
      Every table's columns are headed Lawful, Chaotic and Neutral. These are the three alignments,
      and their defining locus is printed page 27, which this Analyst has claimed but deliberately
      not extracted: constitution section 2 provides no prefix under which an individual alignment
      identity can be formed, and that question is being escalated to the Architect separately.
      M009 through M012 therefore attach to the alignment subsystem rather than to its three members,
      which is the assertion these pages support without pre-empting the ruling. If individual
      alignment identities are later authorised, a successor revision could refine these four rows to
      name which column each alignment selects; nothing published here would need retracting, because
      the dependency on alignment is true at the axis level regardless.
  - id: OBS-03
    subject: the title names in the table cells are not proposed as identities
    detail: >-
      The four tables contain sixty cells holding names such as Squire, Knave, Warrior, Paladin,
      Chaos Knight, Archmage and Bandit King/Queen. They are source-named and each occupies a bounded
      cell, which is ordinarily what makes an identity proposable.
      None is proposed. A title name is the output of the lookup, not a mechanic: not one of the
      sixty states a dependency, a value, a permission or a procedure, so not one would produce an
      edge, and sixty orphan nodes would be the worst instance of that error available in this
      intake. The mechanical content of these pages is entirely in which two inputs select a cell,
      which M005 through M012 carry. This is the same disposition the background packet gave its
      twenty named backgrounds, reached independently here.
      Several cells also collide with identities elsewhere: Barbarian and Acolyte are also
      backgrounds, Ranger is also a background, and Paladin and Druid are class names in other games
      but not in this one. Constitution section 2 states that labels do not determine identity, and
      no merge is invited by a shared word.
  - id: OBS-04
    subject: the stated effect of a title is social and is not extracted
    detail: >-
      The framing sentences say a character's legend precedes them, that renown grows for good or
      ill, and that an improved title could present opportunities previously out of reach. The last
      is the closest this page comes to a mechanical effect, and it is deliberately not extracted:
      could present opportunities names no second mechanic, no check, no permission and no value, and
      striking it would require no mechanic to be reviewed. It is a statement about fiction, not a
      rule. If a later chapter gives titles a mechanical consequence, that chapter is its locus.
  - id: OBS-05
    subject: magnitudes deliberately excluded
    detail: >-
      The pages carry the level bands in every table's first column, five per table across four
      tables. All are threshold values, excluded by constitution section 1 and invariant 11. They
      remain in the immutable claimed packet, which is the authority for which title applies at which
      level. No aspect in this GUR contains a digit and no condition encodes a numeric value.
  - id: OBS-06
    subject: packet wrapper and supporting context
    detail: >-
      The supplied file opens with an intake wrapper ahead of the Primary Source Material heading,
      for which the claim manifest is the independent page locator SOURCE_MARKDOWN Attribution Rules
      requires; it contains no rulebook prose, heading or marker. The trailing Supporting Source
      Context reproduces printed page 15 and is orientation only, contributing nothing here.

unresolved_identity_questions:
  - id: IDQ-01
    subject: whether four per-class titles tables should be one table
    detail: >-
      This GUR proposes four table identities because the source prints four separately headed
      tables. The alternative, one titles table with a class dimension, is the same question the
      fighter GUR raised as IDQ-02 about talents tables and which the wizard GUR recorded as settled
      in the negative once all four talents tables were read.
      The titles case is weaker than the talents case in one respect and stronger in another: all
      four titles tables share an identical shape, three alignment columns and five level bands,
      which a single table could express, but they are printed as four separately headed tables under
      one section heading, and invariant 5 makes a separately referenced table its own node.
      Consequence if wrong: four identities would merge into one, which is a v2-style merge
      migration, and M001 through M012 would collapse to three rows with a class dimension. The
      Analyst followed the source's own division, as in the talents case, and records the question
      rather than deciding it.

architectural_escalations: []
architectural_escalation_note: >-
  None raised by this packet. Every proposed node uses an approved constitution section 2 prefix with
  an unchanged kind, every edge uses one of the thirteen legal section 3 types, and no new prefix,
  edge type, domain promotion or general-rule application is requested.
  This packet does depend on a question being escalated separately: whether an individual alignment
  can have a node identity, raised from printed page 27 where alignment is defined. That escalation
  does not block this GUR, because M009 through M012 attach to the alignment subsystem, which is an
  approved sys_ identity already proposed by a sibling GUR. See OBS-02.

completeness_statement: >-
  Both printed pages in the declared span are accounted for. Page 30 was read in full: the TITLES
  heading, all three framing sentences dispositioned in OBS-04, the FIGHTER TITLES TABLE heading, its
  four column headings and all five rows, and the PRIEST TITLES TABLE heading, its four column
  headings and all five rows. Page 31 was read in full: the THIEF TITLES TABLE and WIZARD TITLES
  TABLE with their headings, column headings and all five rows each. All sixty title cells across the
  four tables were read and are dispositioned in OBS-03, and the twenty level bands in OBS-05. Every
  page marker was resolved through the Pandoc AST and the in-scope resolved page set matches the
  declared span with no gap; the wizard table's inheritance of page 31 is stated explicitly in
  page_attribution_basis. The Supporting Source Context reproducing printed page 15 is out of scope
  and contributed nothing. Twelve edges are proposed across seven candidate nodes, three of which are
  also proposed by sibling GURs from their defining loci and are marked as such. No node is reused
  because the Shadowdark graph is empty. Content not converted to an edge is accounted for in OBS-01
  through OBS-06, and the one identity question the Analyst could not settle is recorded in IDQ-01
  rather than resolved by picking a plausible answer. No assertion depends on any other ruleset.
