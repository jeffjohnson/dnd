page_attribution_basis: >-
  Two markers resolve in the Primary Source Material, both through the Pandoc AST rather than
  positionally. {#p30} ends the TITLES heading and {#p31} ends the THIEF TITLES TABLE heading;
  placement rule 1 applies each to its whole heading. Under the persistence rule the framing
  sentences and the fighter and priest tables fall on page 30, and the wizard table, which carries no
  marker of its own, inherits page 31 from the thief table heading. That inheritance is the one page
  attribution here a positional reading could get wrong, and it is why the wizard rows below cite
  page 31. A third page the parser resolves, 15, lies entirely inside the out-of-scope Supporting
  Source Context.

scope_boundary: >-
  The bounded scope is the Primary Source Material section, printed pages 30 and 31. The trailing
  Supporting Source Context reproduces printed page 15, whose primary packet is
  PKT-SD-015-015-stats-and-stat-modifiers, outside this packet's declared span. No assertion here is
  drawn from it and no row cites page 15.

source_summary: >-
  Printed pages 30 and 31 carry the TITLES heading, three sentences framing what a title is and why
  it matters, and four titles tables, one for each class. Each table is indexed by character level
  down its rows and by alignment across three columns, and each cell holds a title name. This summary
  is orientation only; every assertion below cites its page.

graph_state_at_extraction: >-
  The Shadowdark canonical graph is still empty; nodes.csv is header-only, the domain registry has no
  domains, general_rules.json is an empty object, and character_races.yaml is inactive. The three
  supplied slices named in the packet manifest as missing remain immaterial, re-assessed here rather
  than carried over from claim. reused_nodes is empty. Three of the seven identities below are
  already proposed by sibling GURs from their defining loci and are marked as such.

cross_packet_identity_note: >-
  rule_title, exp_level and sys_alignment are proposed by sibling GURs from their defining loci and
  are proposed again here because this patch uses them as edge endpoints. A GUR must propose every
  endpoint its edges use: an endpoint present only in a sibling GUR is not canonical, is not proposed
  by the patch, and fails invariant 1 as endpoint_unresolved. Proposing them is not a competing
  naming; each records its defining locus and the sibling GUR that also proposes it, and each ID and
  label is reproduced exactly.

