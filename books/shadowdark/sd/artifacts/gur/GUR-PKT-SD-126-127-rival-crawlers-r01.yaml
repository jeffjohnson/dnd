units_note: 'Figures name their unit, following the correction on PKT-SD-122-123. Measured by the assembling
  script from the claimed source: 8 named tables and 52 data rows across them, on two printed pages.'
page_attribution_basis: 'Both markers sit on headings. p126 ends the RIVAL CRAWLERS heading and p127 ends
  the RIVAL CRAWLER PARTY NAME TABLE heading, and placement rule 1 applies each to its whole heading with
  the persistence rule carrying it forward. Verified against the claimed source that no marker appears
  inside a table row.

  The split runs between tables: the opening prose and the ancestry, class, alignment, renown, secret
  and wealth tables are printed page 126, and the party name and signature tactics tables are printed
  page 127.'
scope_boundary: 'The bounded scope is the Primary Source Material section, printed pages 126 and 127:
  a short prose opening, an interposed rolling instruction, and 8 named tables. The trailing Supporting
  Source Context is out of scope.'
source_summary: 'A rival party of crawlers has a rolled number of members, all of the same alignment.
  Eight tables generate one: ancestry and class per member, then party alignment, renown, secret, wealth,
  name and signature tactics. A sentence between the alignment and renown tables says to roll for each
  rival''s starting level. The tactics table is unusual in being indexed by alignment, with one column
  of four tactics for each of the three alignments.'
graph_state_at_extraction: 'Read from the repository at extraction, not recalled, and every figure here
  is computed by the assembling script from the canonical files and the claimed source.

  The canonical graph holds 336 registry rows and 704 edges, and 0 rows cite printed pages 126 or 127,
  so nothing in this span has been extracted before. No rival, crawler, renown or tactic identity exists.
  The registry holds 54 tbl_ identities and 31 identities overall carry no edge.

  The 2 NPC-table rows integrated from printed page 124 were read before anything here was written, because
  this page is the same kind of generator and the comparison decides both the aspect shape and the status.'
why_this_page_has_no_orphans: 'The immediately preceding packet registered six NPC tables and left four
  of them carrying no edge. This packet registers 8 tables and leaves none. The difference is one paragraph,
  and it is worth setting out because the two pages are adjacent, similar in purpose and opposite in outcome.

  Printed page 124 is tables only. There is no sentence defining what an NPC is for the purposes of the
  graph, so there was nothing for the tables to be resolved by, and only those tables whose results were
  already identities could carry a row. Printed page 126 opens with prose: a rival party of crawlers has
  a rolled number of members, all of the same alignment. That sentence defines the thing the tables generate,
  so rule_rival_crawlers is a source-named identity with a stated property, and each table is a procedure
  resolving part of it.

  So every table here gets a RESOLVED_BY row from the generator, including the four whose results are
  purely descriptive, and the three whose results are canonical axes get a second row from the axis as
  well. That second form is the one PKT-SD-124-125 established. The two are different facts: the generator
  is resolved by the renown table, and the ancestry axis is selected from by the ancestry table.'
