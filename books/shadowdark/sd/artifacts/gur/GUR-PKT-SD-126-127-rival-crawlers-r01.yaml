candidate_general_rules_note: None proposed. The 8 generator-to-table rows share a shape, but they enumerate
  8 named source tables rather than instancing a rule, and the Analyst is prohibited from promoting a
  general rule.
rejected_candidates:
- text_locus: the member count and the starting level instruction, p126
  quoted_gist: a rival party has a rolled number of members, and a separate sentence says to roll for
    each rival's starting level
  why_considered: The level sentence names exp_level, which is canonical and heavily connected, and it
    is a standalone instruction rather than a table row.
  rejection_reason: 'Both statements are entirely a die expression. The member count says how many rivals
    to make and the level sentence says what to roll, and neither states a relationship the vocabulary
    can carry: there is no table identity for the level roll, and a row from the generator to exp_level
    would assert that rival crawlers modify or constrain Level, which is not what a random starting value
    is. Recorded as OBS-02 because the level roll is the one genuinely mechanical statement on the page
    that yields nothing.'
- text_locus: the results of the renown, secret, wealth and party name tables, pp126 to 127
  quoted_gist: four renown bands, six party secrets, four wealth bands, and twenty name fragments with
    what the party is known for
  why_considered: Each set is named and enumerated, and the secrets include a Thieves' Guild debt and
    a curse, which brush concepts elsewhere in the book.
  rejection_reason: 'No identity exists for a renown level, a party secret, a wealth band or a party name,
    and none of these states a mechanic: no check, value, duration or consequence. The wealth bands repeat
    the NPC wealth bands declined on printed page 124 and the treasure quality categories declined on
    117. The tables themselves are registered and each carries a RESOLVED_BY row from the generator, which
    is what is expressible.'
- text_locus: the individual ancestry, class and alignment results, p126
  quoted_gist: six ancestries, four classes and three alignments, all canonical identities by name
  why_considered: Thirteen results across three tables are canonical identities, which is more than any
    previous table in the intake.
  rejection_reason: Carried at the axis rather than per member, as PKT-SD-124-125 settled and RF-02 of
    its Review confirmed. Thirteen result-level rows would restate membership the graph already holds
    and would still fail to preserve the tables' weighting, which is a magnitude no field may store; the
    ancestry table gives Human five of twelve results and Goblin one.
- text_locus: the signature tactics themselves, p127
  quoted_gist: twelve tactics across three alignment columns, including always negotiate, never use stealth,
    ambush rivals and target the helpless
  why_considered: 'Two tactics name mechanics the graph holds: never use stealth brushes rule_hiding_and_sneaking,
    and ambush rivals brushes rule_surprise.'
  rejection_reason: They are behavioural descriptions of how a GM should play a rival party, not rules
    binding it. Never use stealth states a preference rather than a prohibition, and there is no identity
    for a tactic. What is mechanically real about this table is that alignment selects which column to
    read, and that is asserted as M012.
non_edge_observations:
- id: OBS-01
  subject: one paragraph is the difference between four orphans and none
  detail: 'Set out in full under why_this_page_has_no_orphans. Printed page 124 is tables only and left
    four of six registered tables carrying no edge. Printed page 126 opens with one paragraph defining
    what the tables generate, and all 8 of its tables carry a row.

    Recorded as the sharpest available illustration of what the closed vocabulary needs. It is not prose
    as such, and it is not that these tables are better: it is that a parent identity has to be source-named
    before its tables can attach to anything. The NPC page could have had the same structure had it opened
    with a sentence saying what an NPC is.'
- id: OBS-02
  subject: the starting level roll yields nothing
  detail: 'The page tells the GM to roll for each rival''s starting level, and exp_level is canonical
    with a large neighbourhood, so this looks like the most promising sentence on the page. It yields
    nothing.

    Its whole content is a die expression. There is no table identity for the roll, so nothing can be
    RESOLVED_BY anything, and a row from the generator to exp_level would have to claim that rival crawlers
    modify or constrain Level, which misdescribes assigning a random starting value. The comparable case
    is the member count in the same paragraph. Both are recorded rather than forced.'
- id: OBS-03
  subject: the tactics table is indexed by an identity rather than resolving to one
  detail: 'Every other table in this intake maps a die result to an outcome. This one has three columns
    headed by the three canonical alignments, so the reader uses the party''s alignment to choose a column
    and then rolls within it. Alignment is an input to the table rather than an output of it, which is
    why M012 is FEEDS_INTO while the alignment table''s row is RESOLVED_BY.

    Worth recording because the two rows sit on the same identity and could look contradictory: sys_alignment
    is resolved by one table on this page and feeds into another. Both are true, and the direction is
    what distinguishes generating the alignment from consuming it.'
unresolved_identity_questions:
- id: IDQ-01
  subject: whether party uniformity of alignment is properly a CONSTRAINS row
  detail: 'The opening prose says all members of a rival party share one alignment, and I carried it as
    rule_rival_crawlers CONSTRAINS sys_alignment with aspect party uniformity. It is the only authored-polarity
    row in the packet and the one I am least certain of.

    The case for it: the statement is a real mechanical restriction, it is unhedged, and it is the only
    thing the opening paragraph says that is not a die expression. It also explains why the alignment
    table''s column is headed Party Alignment while ancestry and class are rolled per member, which a
    reader would otherwise have to infer.

    The case against: CONSTRAINS bounds a mechanic without changing a value, and what this sentence bounds
    is arguably not the alignment axis but how many times the generator consults it. Since neither a party
    nor a member has an identity, the row has to attach the constraint to the axis, which is the nearest
    available endpoint rather than the right one. This is the same missing-participant gap recorded as
    OBS-02 of PKT-SD-117-117 and twice before that.

    Consequence if wrong: one row is withdrawn, the packet keeps its other 12 rows, and the uniformity
    fact survives only in the source. Flagged rather than defaulted.'
architectural_escalations: []
architectural_escalation_note: None raised. All 9 identities use an approved prefix, every row uses a
  legal edge type at status core, no row carries supersession_basis and none is an OVERRIDES, and no CLASSIFIED_AS
  row appears; section 2.4 keeps ancestry, class and alignment membership outside the graph and these
  tables resolve rather than classify. IDQ-01 touches the standing missing-participant gap but asks only
  whether one row should exist, which is a Reviewer judgement.
completeness_statement: 'Both printed pages in scope were read in full at the recorded checksum: one prose
  opening, one interposed rolling instruction, 8 named tables and 52 data rows. The packet yields 9 new
  identities and 13 rows, reusing 3 canonical identities whose labels the assembling script asserted equal
  to the registry. No identity is left carrying no edge, which is the first generator page in this chapter
  where that is true and is explained in why_this_page_has_no_orphans.

  Every row was checked against the 704 canonical edges for an assertion-key collision, for a shared source,
  type and target under a different aspect, and for duplicates within the patch; there are none of any,
  and no canonical row cited either page before. Four candidates were rejected and each is recorded with
  its reason. What is deliberately not asserted is listed as OBS-01 through OBS-03, and the single open
  question, IDQ-01, is whether the party-uniformity row should exist at all. No assertion depends on any
  other ruleset.'
