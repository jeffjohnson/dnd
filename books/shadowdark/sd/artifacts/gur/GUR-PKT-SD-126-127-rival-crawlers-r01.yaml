authored_polarity_declaration: Authored polarity appears on one row and no other. rule_rival_crawlers
  CONSTRAINS sys_alignment takes governs with basis read, as constitution section 5 and invariant 15 require
  for a CONSTRAINS row. The 11 RESOLVED_BY rows and the single FEEDS_INTO row carry none, since section
  5 derives those.
status_note: 'All rows are core, following the disposition of IDQ-01 in PKT-SD-124-125, which was settled
  in favour of core on the same question. The reasoning transfers exactly: the random character tables
  on printed pages 40 and 41 are optional because that context expressly permits choosing instead of rolling,
  and this page presents its tables directly with no alternative and no variant status. Nothing on pages
  126 or 127 declares itself optional, unlike The Gauntlet on printed page 116 or the modes of play on
  111.

  Recorded rather than left implicit because it is the second packet to take this reading, and a third
  GM-side generator will presumably inherit it.'
