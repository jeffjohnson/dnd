page_attribution_basis: >-
  Six page assignments resolve through the Pandoc AST rather than positionally. Pages 5, 7, 8 and 9
  are plain markers ending headings, which placement rule 1 applies to the whole heading. Page 6 is a
  plain marker ending the first narrative paragraph; because no content follows it on that source
  line, rule 1 applies it to the entire paragraph rather than splitting it. Page 10 is an empty
  fenced Div carrying the artwork class. The persistence rule carries each assignment forward to the
  next marker, which is what places the CHECKS, HIT POINTS and STATS material on page 9 and the
  CHARACTERS, DESCRIBE AN ACTION, MOVEMENT and ROUNDS material on page 8. The resolved page set is 5
  through 10 with no gap, and every cited row below falls on page 8 or page 9.

page_class_treatment: >-
  Page 10 is classified full-page-artwork by the repository source steward. Under SOURCE_MARKDOWN 1.8
  and constitution section 6 the class is page-local intake metadata and creates no node, edge,
  domain, general rule, citation or uncovered-page obligation, and a classified page inside a
  declared span is not an uncovered page. It is retained in the completeness accounting below rather
  than renumbered or dropped. The AST confirms the Div is empty, carries no unknown class, and that
  no earlier page inherits the classification.

scope_boundary: >-
  The bounded scope is the Primary Source Material section, printed pages 5 through 10. The trailing
  Supporting Source Context is present and empty, so this packet reproduces no other packet's pages.
  Verified against its neighbours in operator sequence: the packet claiming pages 1 to 4 ends at page
  4 and the packet claiming pages 11 to 14 opens at {#p11}, so this span abuts both without overlap.

source_summary: >-
  Pages 5 and 6 are the INTRODUCTION: a heading, an epigraph, and an in-fiction narrative about four
  named crawlers descending into the Shadowdark. Page 7 is SHADOWDARK, three prose subsections
  describing what the game is, what characterises it, and where to start. Pages 8 and 9 are THE
  BASICS, a compressed summary of core play covering the player and GM roles, turns and actions,
  movement, rounds, the dice and advantage, the six stats and the modifier, the check procedure
  against a difficulty class, and hit points, damage, recovery and death. Page 10 is artwork. This
  summary is orientation only; every assertion below cites its page.

extraction_posture: >-
  THE BASICS is a summary section whose own closing line says the next chapters expand upon it, so
  most mechanics it names are defined more fully on a later printed page: the dice and advantage at
  Rolling the Dice, checks at Making Checks, turns at Turn Order, stats at Stats, and damage, death
  and recovery in Combat and Resting. SOURCE_MARKDOWN Source Identity Authority governs this
  directly: a secondary or summary statement can support a relationship stated in its own packet, but
  it does not name a concept whose defining mechanics belong to another source. This GUR therefore
  asserts the relationships these two pages actually state, treats the identities it must mint as
  provisional, and declines to convert descriptive prose, narrative, or a mechanic named without a
  stated relationship into an edge. Several identities are provisional in the sense recorded in
  IDQ-03: their fuller defining locus is a later packet, which should reuse these IDs rather than
  mint rivals.

graph_state_at_extraction: >-
  The Shadowdark canonical graph is still empty; nodes.csv is header-only, the domain registry has no
  domains, general_rules.json is an empty object, and character_races.yaml is inactive. The three
  supplied slices named in the packet manifest as missing remain immaterial, re-assessed here rather
  than carried over from claim: there is no canonical identity to match, no neighborhood to compare
  for redundancy or contradiction, and no approved general rule to apply. No canonical node exists to
  reuse, so reused_nodes is empty. Three identities below are already proposed by sibling GURs and
  are marked as such on their candidate nodes.

cross_packet_identity_note: >-
  rule_hit_points, abil_stat_modifier and abil_constitution are proposed by sibling GURs from their
  defining loci and are proposed again here because this patch uses them as edge endpoints. A GUR
  must propose every endpoint its edges use: an endpoint present only in a sibling GUR is not
  canonical, is not proposed by the patch, and fails invariant 1 as endpoint_unresolved. Proposing
  them is not a competing naming; each carries its defining locus and the sibling GUR that also
  proposes it, and the ID and label are reproduced exactly. Where two patches propose one identity,
  Reviewer de-duplicates and the Integrator applies a single registry addition.

