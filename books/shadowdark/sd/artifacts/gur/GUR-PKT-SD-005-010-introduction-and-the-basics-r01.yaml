non_edge_observations:
  - id: OBS-01
    subject: pages 5, 6 and 7 are narrative and description, and yield nothing
    detail: >-
      Page 5 is a heading and an epigraph. Page 6 is an in-fiction account of four named crawlers,
      naming spiders, a scythe trap, a hidden door, winged creatures, treasure, torches and wounds.
      Page 7 describes what the game is and what characterises it. All of it was read and none of it
      is a rule: the narrative names no mechanic with an identity and states no dependency, and the
      description states design intent. Striking any of it would require no mechanic to be reviewed.
      The crawler names are characters in an anecdote, not source-defined identities, and the
      creatures and the trap are narrated events whose real loci are the Monsters and Traps chapters.
  - id: OBS-02
    subject: the torch sentence on page 7 is a real rule in descriptive clothing
    detail: >-
      Page 7 states that a torch holds back the darkness for one hour of real-world time. That is a
      genuine and distinctive mechanic, not merely flavour, and it is recorded here so it is not
      lost. It is nonetheless not extracted. The sentence names no second mechanic, so there is no
      ordered pair to assert; the duration is a magnitude; and the sentence sits inside a prose
      answer to What Defines This Game rather than at a defining locus. Its real locus is the
      light and crawling material on the printed pages the contents lists near Crawling, and the
      packet that claims those pages should assert it from there with the identities it defines.
  - id: OBS-03
    subject: mechanics named on page 9 without a stated relationship
    detail: >-
      Three are named and deliberately not extracted. Advantage and disadvantage are defined under
      THE DICE as rolling twice and taking the better or worse result, but the page states no
      relationship between either and any other named mechanic, so any edge would be invented; their
      fuller locus is Rolling the Dice. The six dice are equipment the reader must own, not
      mechanics. Weapons appear only in typical weapons deal damage, a clause whose purpose is to
      illustrate the damage figure; minting a weapon identity from it would fix a weapon family from
      an illustrative aside rather than from the gear and weapon chapters that define it.
      Advantage in particular is worth tracking: the ancestries packet's Stout benefit already
      depends on it, and that GUR recorded the same deferral. Two packets now point at a locus
      neither of them owns, which is the ordinary signal that the defining packet should be read
      before either asserts anything about it.
  - id: OBS-04
    subject: the Game Master is an adjudicating role, not a proposed node
    detail: >-
      The GM appears three times on page 8 and twice on page 9: determining whether actions succeed,
      narrating results, controlling monsters and environment, beginning the round order, and
      choosing a check's linked stat and difficulty class. No GM identity is proposed. Constitution
      section 2 offers no prefix whose kind covers a person at the table, and section 8 states that
      structural roles are query-time conclusions rather than stored assertions. The mechanical
      content of those sentences is captured where it is assertable: that a check has a linked stat
      and a difficulty class is carried by M006 and M007, which do not need a GM node to be true.
  - id: OBS-05
    subject: the stat-to-modifier relationship is stated here but owned by another packet
    detail: >-
      Page 9 restates that each stat has a modifier and lists all six stats with one-line
      descriptions. That relationship is already asserted from its defining locus by
      GUR-PKT-SD-015-015, where the six stats feed the stat modifiers table and the modifier is
      derived from it. Re-asserting it here would create a second, shallower path between the same
      concepts from a summary page, which is exactly the redundancy the local-neighborhood check
      exists to prevent. Only the modifier's role in a check, which page 15 does not state, is
      asserted here, as M006. The score range and the modifier range on this page are magnitudes.
  - id: OBS-06
    subject: hit point recovery by resting is deliberately omitted as a duplicate assertion
    detail: >-
      Page 9 states that you regain lost HP after a night of rest. The identical assertion is already
      proposed by GUR-PKT-SD-011-014 from printed page 12, as resting MODIFIES hit points on the
      aspect recovery with authored polarity improves. Under constitution section 4 the assertion key
      is source, type, target, aspect and condition, so a row emitted here would collide with that
      one and the two could not both enter production. The Analyst therefore omits it rather than
      varying the aspect to make a near-duplicate pass. The overnight framing on this page adds a
      qualification that page 12 lacks, which the packet claiming the Resting chapter should settle
      from its own defining locus.
  - id: OBS-07
    subject: magnitudes deliberately excluded
    detail: >-
      The pages carry the movement allowance and its measurement in feet, the six die sizes, the
      multiples notation, the stat range, the modifier range, the die rolled for a check, the example
      difficulty value, the typical weapon damage expression, the zero hit point state, the death
      countdown expression and its minimum floor, and the torch duration. All are magnitudes, die
      expressions, ranges or thresholds, excluded by constitution section 1 and invariant 11. They
      remain in the immutable claimed packet, which is the authority for the values themselves. No
      aspect in this GUR contains a digit, and the only condition naming a numeric state, when hit
      points reach zero in M009, names the state the rule itself defines rather than a tunable value.
  - id: OBS-08
    subject: the Quickstart Set is an external product
    detail: >-
      Page 8 recommends starting with a premade character from the free digital Quickstart Set. That
      product is not a registered Shadowdark book or source, is not supplied, and constitution
      section 6 requires a book and exact source to be registered before its first packet is claimed.
      Nothing mechanical is stated about it.
  - id: OBS-09
    subject: packet wrapper is intake metadata
    detail: >-
      The supplied file opens with an intake wrapper naming the packet and a shadowdark.md line range
      ahead of the Primary Source Material heading, so the parser reports four blocks preceding the
      first resolved page. The claim manifest is the independent page locator that SOURCE_MARKDOWN
      Attribution Rules requires for such content, and it records that the wrapper contains no
      rulebook prose, heading or marker. No source content is stranded.

unresolved_identity_questions:
  - id: IDQ-01
    subject: whether damage and the damage roll are one identity or two
    detail: >-
      This GUR proposes rule_damage for what injuries inflict and what reduces hit points. The
      ancestries GUR separately proposes cbt_damage_roll, from Mighty granting a bonus to damage
      rolls with melee weapons. They may be one concept seen from two sides, the roll that generates
      an amount and the amount that is applied, or two mechanics that should stay separate.
      Neither packet can settle it. Page 9 never mentions a roll, only that weapons deal damage; page
      16 never mentions hit points, only the roll the bonus applies to. The Combat chapter on printed
      page 88 is the defining locus for both and will state the sequence explicitly.
      Consequence if wrong: if they are one identity, the graph carries two nodes where one belongs
      and a merge migration is needed; if they are two and are merged early, a bonus to a roll becomes
      indistinguishable from a change to applied damage, which are different assertions. The Analyst
      kept them separate because splitting a wrongly merged identity is the harder migration and
      because neither source page supports the merge.
      This is not an Architect escalation: both use approved prefixes with unchanged kinds and each
      is an ordinary registry addition. It is recorded for Builder and Reviewer to carry forward.
  - id: IDQ-02
    subject: rule_death names an event the source states in the passive voice
    detail: >-
      The source says characters at zero HP die and that dead characters are retired from play. It
      names no procedure and gives the concept no heading of its own; the heading is HIT POINTS. The
      ID is Analyst-named from the event. The alternative was to fold the countdown into
      rule_hit_points and assert nothing, but that would lose three genuine dependencies, including
      the one on Constitution, and would make the retirement of a character invisible in the graph.
      Consequence if wrong: a later chapter may name this procedure explicitly, in which case the
      packet that claims it takes precedence over this stem under Incoming Packet Authority and these
      three rows are repointed. Reviewer should confirm the stem rather than accept it.
  - id: IDQ-03
    subject: five identities are minted here from a page that defers to later chapters
    detail: >-
      rule_turn, rule_action, rule_check, ex_movement, rule_round and rule_difficulty_class are all
      named in bold on pages 8 and 9, but THE BASICS closes by saying the next chapters expand upon
      it, and the contents list shows Turn Order, Making Checks and Rolling the Dice on later printed
      pages. Under SOURCE_MARKDOWN Source Identity Authority these pages can support the
      relationships they state, which is what the eleven rows do, but the defining loci are later.
      The Analyst minted them rather than deferring because the relationships on these two pages are
      stated plainly and completely, and deferring would mean discarding source-supported assertions
      rather than merely postponing identity. Every such node records its fuller locus.
      Consequence if wrong: a defining chapter may use a different source spelling or split one of
      these into several identities, requiring a repoint. Builder and Reviewer should de-duplicate
      against those packets as they are read, and the defining packet's name takes precedence over
      the stem proposed here.

architectural_escalations: []
architectural_escalation_note: >-
  None raised. Every proposed node uses an approved constitution section 2 prefix with an unchanged
  kind, every edge uses one of the thirteen legal section 3 types, and no new prefix, edge type,
  domain promotion or general-rule application is requested. ESCALATION_CONTRACT states that a
  proposed node under an approved prefix and kind which passes identity and duplicate checks is
  ordinary GUR, GUP and Review work rather than an escalation, and that a weak or missing citation is
  not grounds to escalate. IDQ-01 through IDQ-03 are recorded for Reviewer on that basis, and the
  deferrals in OBS-02, OBS-03 and OBS-06 resolve themselves when the relevant defining packets are
  claimed.

completeness_statement: >-
  All six printed pages in the declared span are accounted for. Page 5's heading and epigraph and
  page 6's narrative in full were read and are dispositioned in OBS-01. Page 7's three subsections
  were read; their descriptive content is in OBS-01 and the one embedded rule is in OBS-02. Page 8
  was read in full: the premade-character note in OBS-08, and the CHARACTERS, DESCRIBE AN ACTION,
  MOVEMENT and ROUNDS subsections, which supply M001 through M005, with the GM material in OBS-04.
  Page 9 was read in full: THE DICE in OBS-03, STATS in OBS-05, CHECKS supplying M006 and M007, HIT
  POINTS supplying M008 through M011 with its recovery sentence in OBS-06, and the closing WHAT'S
  NEXT? paragraph, which states only that later chapters expand on this one. Page 10 is the steward's
  full-page-artwork page. Every page marker was resolved through the Pandoc AST and the resolved page
  set matches the declared span with no gap. The Supporting Source Context is present and empty, so
  nothing out of scope was read as evidence. Eleven edges are proposed across eleven candidate nodes,
  three of which are also proposed by sibling GURs from their defining loci and are marked as such.
  No node is reused because the Shadowdark graph is empty. Content not converted to an edge is
  accounted for in OBS-01 through OBS-09, and every identity the Analyst could not settle is recorded
  in IDQ-01 through IDQ-03 rather than resolved by picking a plausible ID. No assertion depends on any
  other ruleset.
