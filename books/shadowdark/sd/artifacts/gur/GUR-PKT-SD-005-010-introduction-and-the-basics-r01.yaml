    Whether the turn-and-round structure and the check machinery are one domain or two cannot be
    settled from a summary page whose own text defers to later chapters. Deferred; no domain is
    asserted on any edge in this GUR.
  - >-
    Death sits between the resolution and character domains: it is reached through damage but
    retires a character permanently. Deferred for the same reason.

