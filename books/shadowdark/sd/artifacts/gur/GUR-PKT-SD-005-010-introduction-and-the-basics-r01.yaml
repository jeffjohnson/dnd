authored_polarity_declaration: >-
  Four rows carry authored polarity, all with basis read: M002 TRIGGERS neutral, M004 CONSTRAINS
  governs, M008 MODIFIES worsens and M009 TRIGGERS inflicts. Each is one of the three types
  constitution section 5 requires to carry source-reviewed authored polarity, each was read aloud as
  source polarity target before being recorded, and each reading is stated in that row's
  analyst_rationale. M002 uses neutral deliberately rather than as a default: neutral is in the
  section 5 vocabulary, and a check is the means by which an action is resolved rather than a benefit
  or harm to it. No row uses basis heuristic or unset. No other row carries a polarity or
  polarity_basis value; the three GATES rows and the five FEEDS_INTO rows take their derived polarity
  from the section 5 table and the Analyst authors none of them.

