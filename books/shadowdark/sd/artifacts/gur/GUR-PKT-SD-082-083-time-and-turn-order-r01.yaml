non_edge_observations:
  - id: OBS-01
    subject: three relationships restated here are already asserted from printed page 8
    detail: >-
      The TURNS AND ROUNDS subsection restates that a round completes when each person has taken a turn, and the PLAYER TURN steps restate that a turn allows an action and a move and that skipping the action allows a second move. GUR-PKT-SD-005-010 asserts all three from printed page 8, as a turn feeding the round, a turn gating the action, a turn gating movement and an action constraining the additional move. Each is now canonical.
            Re-emitting any of them would produce an identical source, type, target, aspect and condition and collide under the assertion key, so omitting them is required rather than optional. This page adds the ordering of turns, which M005 carries, and the timer step, which is dispositioned in OBS-02.
  - id: OBS-02
    subject: personal and GM timers are a procedure with no second identity
    detail: >-
      Both turn sequences begin with counting down timers, the player's for spells and effects and the GM's for everything else. A timer is not a named mechanic in this book; the things being timed are spell durations and effects, whose expiry M002 already carries from the TIME PASSES rule. Asserting a timer identity from a step in a procedure would mint a mechanic the source never defines.
  - id: OBS-03
    subject: the light-source dependency is real and belongs to the next packet
    detail: >-
      The REAL TIME subsection says tracking real time matters because most light sources last one hour of real time. That is a genuine dependency and it is not asserted here: no light identity exists, the torch and lantern entries on printed page 34 deferred it, and Light is defined on printed page 84, which is the next packet in the intake. That packet should assert it from its own locus, and the duration is a magnitude in any case.
  - id: OBS-04
    subject: the encounter definition names examples rather than mechanics
    detail: >-
      An encounter is defined as a challenge that stops the characters' progress, illustrated by a monster charging out of the darkness, a sinkhole opening and a town guard halting the party. The examples name no identity this graph holds and the Monsters chapter is not claimed. M003 and M006 carry the two relationships the page states about encounters, that passing time triggers a check and that the round paces it.
  - id: OBS-05
    subject: magnitudes deliberately excluded
    detail: >-
      The pages carry the real-time-to-rounds conversion, the random encounter roll band, the die and modifier for initiative, and the movement allowance restated in the player turn. All are conversions, thresholds, die expressions or distances, excluded by constitution section 1 and invariant 11. They remain in the immutable claimed packet. No aspect contains a digit.

unresolved_identity_questions:
  - id: IDQ-01
    subject: whether real time is properly a graph identity
    detail: >-
      rule_real_time is proposed because the page gives it its own heading and states a rule, and because M001 needs an endpoint for the conversion the source supplies. It is unusual among the identities in this graph: it describes how the table measures elapsed time rather than a mechanic characters interact with, and its only stated consequence, light-source tracking, is deferred to the next packet.
            Consequence if wrong: if Reviewer judges it out of scope, the node and M001 are withdrawn together and nothing else changes. The Analyst proposed it because the light dependency will need it shortly and because the conversion is a real rule, but records the doubt rather than presenting it as settled.

