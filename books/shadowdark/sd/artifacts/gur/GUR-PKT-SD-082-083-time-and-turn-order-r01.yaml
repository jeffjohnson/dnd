scope_boundary: >-
  The bounded scope is the Primary Source Material section, printed pages 82 through 83. Any other
  page the parser resolves lies inside the trailing Supporting Source Context, is claimed by another
  packet, and contributed nothing here.

source_summary: >-
  Printed page 82 is TIME, tying game time to real time, restating turns and rounds, and defining what happens when time is fast-forwarded. Page 83 is TURN ORDER, defining initiative, the ordered steps of a player turn and a GM turn, and what an encounter is. This summary is orientation only; every assertion below cites its page.

extraction_posture: >-
  This packet is the defining locus for initiative and for the encounter, and it restates several relationships already asserted from printed page 8. The restatements are not re-emitted; each would collide under the section 4 assertion key. What is new is how initiative is rolled and ordered, what fast-forwarding time does to ongoing effects, and how often an encounter is checked for.

