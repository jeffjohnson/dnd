page_attribution_basis: 'One textual marker resolves this packet. p73 ends the WALL OF FORCE heading,
  which is also the section''s first heading, and placement rule 1 applies it to that whole heading while
  the persistence rule carries it across every subsequent entry, since no further textual marker appears.
  All five entries are printed page 73 and every row cites it.

  There is no leading-content question here and no shared page: printed page 72 belongs wholly to PKT-SD-070-072.
  The packet''s second page, 74, carries a class rather than content and is discussed below.'
page_class_note: 'The packet declares one page class, retained from the source exactly as SOURCE_MARKDOWN
  1.8 requires: printed page 74 is full-page-artwork, attached as an empty fenced Div with the reserved
  p74 identifier, declared by the repository source steward and AST-verified at claim.

  That classification is page-local intake metadata. It is never a node, edge, domain, general rule, citation
  or evidence of a mechanic, and no row in this GUR cites page 74, which was asserted programmatically
  before publication rather than checked by eye. The absence of page 74 from the extraction is therefore
  declared rather than an omission. This is the first spell packet to carry a page class; the precedent
  for including a classified page in the span comes from PKT-SD-001-004 and PKT-SD-005-010.'
scope_boundary: 'The bounded scope is the Primary Source Material section: five entries from WALL OF FORCE
  to ZONE OF TRUTH on printed page 73, plus the classified page 74. The trailing Supporting Source Context
  is out of scope and contributed nothing.'
source_summary: Five spell entries in alphabetical order, each a heading, a tier and class line, a duration
  line, a range line and effect prose, followed by a full-page-artwork page. Wall of Force conjures a
  barrier nothing on the same plane can pass. Web entangles a creature, which escapes on a successful
  check against the caster's spellcasting check. Wish alters reality as the GM interprets, and a failed
  casting becomes a critical failure whose mishap is rolled with disadvantage. Wrath makes the caster's
  weapons magical and adds damage. Zone of Truth compels a creature to speak truthfully while it remains
  in range.
chapter_completion_note: 'This is the final packet of the spell chapter. With it every spell entry the
  book prints has been claimed and extracted, across nine packets from PKT-SD-051-053 through this one.

  The chapter does not finish complete, and the shortfall is worth stating precisely rather than leaving
  to be discovered. Measured at extraction: 80 spell identities are canonical excluding the two list aggregates,
  and exactly 40 carry a tier and a casting class. The other 40, alphabetically spell_acid_arrow through
  spell_holy_weapon, were extracted before DEC-2026-0103 created CLASSIFIED_AS and each recorded the omission
  at the time. This packet adds five more classified identities, so once it integrates the standing figure
  is 85 identities with 45 classified and 40 owed.

  Those 40 need classification successors for PKT-SD-054-056, PKT-SD-057-058, PKT-SD-059-060 and PKT-SD-061-062.
  That work is sequenced by DEC-2026-0103 step 4 and is not part of this packet. Until it is done, a query
  filtering spells by tier or by casting class returns slightly over half the spell list, which is the
  kind of partial answer that reads as complete and is worth guarding against.'
graph_state_at_extraction: 'Read from the repository at extraction, not recalled: the canonical graph
  holds 248 registry rows and 531 edges, with 89 CLASSIFIED_AS rows in production. None of the five entries
  in this packet exists yet. The canonical edge set was loaded so every proposed row could be checked
  against the section 4 assertion key.'
repeated_construction_note: 'Three of the five entries repeat a construction already in production, and
  each was checked against the canonical rows rather than assumed distinct.

  Wish repeats Power Word Kill''s failed-casting construction exactly: canonical holds spell_power_word_kill
  TRIGGERS rule_critical_failure with aspect failed casting and the same condition, and rule_disadvantage
  FEEDS_INTO that spell with aspect mishap roll. The two Wish rows take the identical shape and differ
  only in the spell, which keeps them distinct under the assertion key. Matching the shape deliberately
  means a reader can find both spells with one query.

  Wrath repeats Holy Weapon''s weapon-empowerment construction, which canonical carries as two rows into
  cbt_attack_roll and cbt_damage_roll with aspect blessed weapon. Wrath uses aspect empowered weapons
  because the source describes a different effect, and the rows differ in source in any case.

  Wall of Force repeats Resilient Sphere''s impassable-barrier construction into ex_movement. All three
  pairs were verified non-colliding before publication.'
