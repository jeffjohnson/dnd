authored_polarity_declaration: Authored polarity appears on four rows and no others, each with basis read
  as invariant 15 requires, and each is a MODIFIES, TRIGGERS or CONSTRAINS row as constitution section
  5 allows. Web's escape check takes governs. Wrath's two rows take improves. Wish's failed casting takes
  inflicts. The 10 CLASSIFIED_AS rows and the three FEEDS_INTO and two EXCLUDES rows carry none, since
  section 5 derives those.
classification_basis: Tier and casting class are extracted for all five entries from their own header
  lines and nothing else, giving five tier rows and five class rows. No entry here names two classes,
  so this is the first spell packet since classification opened where the class count equals the entry
  count. Tiers 2, 4 and 5 are used; nothing here is tier 1 or tier 3.
