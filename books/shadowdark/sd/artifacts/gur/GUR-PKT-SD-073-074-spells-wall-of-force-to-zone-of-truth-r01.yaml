non_edge_observations:
- id: OBS-01
  subject: magnitudes are excluded from every row
  detail: 'Wrath states a weapon bonus and an additional damage die, three entries state a duration in
    rounds, and Wall of Force and Web state area sizes. None reaches a field. The single condition in
    this packet names the circumstance of a failed casting and spells no quantity. Verified programmatically:
    zero rows carry a digit in aspect or condition.'
- id: OBS-02
  subject: Zone of Truth's compulsion is not representable
  detail: 'The entry compels a creature to speak truthfully and prevents a deliberate lie. There is no
    canonical speech, truth, lie or compulsion identity, so only the Focus duration is asserted. This
    is the fifth entry across five consecutive packets whose principal effect has no representable target,
    after Knock, Passwall, Restoration and Silence.

    Naming the pattern plainly, now that the chapter is complete: the graph reliably captures effects
    that touch a named rule, and reliably misses effects that act on the fiction. That is a property of
    the closed vocabulary rather than a defect in any packet, and it is recorded here so the chapter''s
    coverage is not mistaken for total.'
- id: OBS-03
  subject: Wall of Force and Web both exclude movement, for different reasons
  detail: Wall of Force blocks passage through a conjured barrier; Web holds a creature in place. Both
    are asserted as EXCLUDES into ex_movement and they differ by aspect, impassable wall against entangled
    target, which keeps them distinct and preserves the difference for a reader. Resilient Sphere in PKT-SD-068-070
    already carries the barrier shape, so the graph now holds three movement exclusions from three spells.
- id: OBS-04
  subject: Wish's open-ended effect is not asserted
  detail: 'Wish alters reality as the GM interprets it. Nothing about that is mechanically constitutable:
    there is no target, no check and no bounded outcome, only an instruction to the GM. The only rows
    Wish yields are its classifications and the failed-casting penalty, which is the one part of the entry
    with mechanical content. A tier 5 spell contributing almost nothing to the graph is the correct outcome
    here, not a gap.'
unresolved_identity_questions: []
unresolved_identity_questions_note: None. Every construction in this packet has a settled precedent in
  production, listed in repeated_construction_note. IDQ-01 of PKT-SD-068-070, whether alignment should
  CONSTRAIN or FEED_INTO, remains open and unanswered, but no row here depends on it since no entry turns
  on alignment.
architectural_escalations: []
architectural_escalation_note: 'None raised. Every identity uses an approved prefix, every row uses a
  legal edge type, and the classification rows use only the two authorized spell forms. Two standing gaps
  are recorded rather than escalated from inside a packet, and both are now chapter-wide rather than local:
  effects acting on the fiction have no representable target, OBS-02, and compelled flight still has no
  identity, carried from PKT-SD-070-072 OBS-02. The classification debt of 40 unclassified canonical spells
  is quantified in chapter_completion_note and is sequenced work, not an escalation.'
completeness_statement: All five entries in the bounded scope were read at the recorded checksum and each
  produced at least its classification rows. The packet yields 5 spell identities, 9 mechanical rows and
  10 classification rows, 19 rows in total, every one checked against the 531 canonical edges for an assertion-key
  collision before publication; there are none, including against the three constructions this packet
  repeats from production. Thirteen canonical identities are reused rather than re-proposed, verified
  against the registry at extraction. Every row cites printed page 73 and no row cites the classified
  page 74, asserted programmatically. What is deliberately not asserted is listed as OBS-01 through OBS-04.
  The spell chapter is complete with this packet, and the 40 spells still owed classification successors
  are enumerated in chapter_completion_note. No assertion depends on any other ruleset.
