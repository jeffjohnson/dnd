rejected_candidates:
- text_locus: the Damage or Effect column, p114
  quoted_gist: 'six status effects across the table''s twelve rows: sleep, paralyze, blind, confuse, unconscious
    and petrify'
  why_considered: These are the most substantial mechanical content in the table after the damage figures,
    and three of the six have same-named canonical identities, spell_sleep, spell_blind_deafen and spell_confusion.
    A row from the table to each looked available.
  rejection_reason: 'The same-named identities are the wrong things and using them would be a real error,
    not merely a thin row. spell_sleep is the wizard spell defined on printed page 71 with a tier, a casting
    class, a range and a duration. A trap that puts a character to sleep does not cast that spell, and
    asserting tbl_traps TRIGGERS spell_sleep would claim the trap casts it. The other two are the same
    shape.

    What the table actually needs is a condition identity, and none exists anywhere in the graph: no sleep,
    paralysis, blindness, confusion, unconsciousness or petrification concept, and none of the six is
    defined as a mechanic on this page either. The one near neighbour, rule_dying, covers unconsciousness
    only as part of the death sequence on printed page 89, which is a different state from a trap knocking
    someone out. Recorded as OBS-02; nothing is asserted.'
- text_locus: the Trigger column, p114
  quoted_gist: twelve triggers, among them a tripwire, a pressure plate, opening a door, breaking a light
    beam, speaking a word and casting a spell
  why_considered: 'Two of the twelve name things the graph holds: a light beam is adjacent to rule_light_source,
    and casting a spell is rule_spellcasting_check, which is canonical and heavily connected.'
  rejection_reason: 'These are flavour entries describing what sets a trap off in fiction, not mechanics.
    The page states no rule about any of them: nothing says a spellcasting check must be checked against
    nearby cursed statues. Asserting rule_spellcasting_check TRIGGERS tbl_traps from a single table cell
    would create a general rule the book does not make. The light beam is not rule_light_source either;
    it is scenery. This follows the reasoning applied to the light mishap results in PKT-SD-110-110 and
    the carousing outcomes in PKT-SD-091-093.'
- text_locus: A Tell, p114
  quoted_gist: most traps should have a hint or tell, and the GM is cautioned against making traps too
    frequent or the pace will suffer
  why_considered: It is one of three bolded rules in the section and the other two both yielded rows,
    so treating it differently needs a reason.
  rejection_reason: It is advice to the GM about designing traps, not a rule about how a trap works. Should
    have a tell states no mechanic, there is no identity for a tell, and the pacing caution is about the
    game rather than the fiction. This is the CORE ETHOS class of statement rejected throughout PKT-SD-101-109.
    The bolding marks a heading for the paragraph, not a defined term; the other two bolded paragraphs
    yielded rows because they state mechanics, not because they are bold.
- text_locus: trained in tinkering, p114
  quoted_gist: '''Thieves and characters who are trained in tinkering can describe how they disable or
    circumvent a trap'''
  why_considered: The thief half is asserted as M003. The tinkering half names a trained skill, and rule_learning
    is canonical from printed page 91, where learning a new skill enables new actions and grants advantage
    on certain checks. A row from rule_learning to rule_traps would connect the two.
  rejection_reason: 'Tinkering is not a named identity anywhere in the graph and this page does not define
    it. Connecting rule_learning to traps would assert that the learning rule specifically grants trap
    disabling, which the source does not say; learning grants whatever the GM agrees, and tinkering appears
    here only as an example of the kind of training that would qualify. abil_thievery was also considered
    and declined: it is the thief benefit from printed page 22 and already carries its own row modifying
    checks on trained tasks, and traps are not named there. The thief row is asserted because the class
    is named outright; the rest is left where the source leaves it.'
- text_locus: the opening sentence, p114
  quoted_gist: '''Traps add peril and surprise to crawling.'''
  why_considered: It names two canonical identities, rule_crawling_round and rule_surprise, and places
    traps in relation to both.
  rejection_reason: It is a thematic framing sentence rather than a mechanic. Surprise here is the ordinary
    word, not rule_surprise, which is the combat and stealth rule defined on printed page 87 about beginning
    a turn undetected; a trap springing is not that. Peril is not a mechanic at all. Asserting either
    would put a resemblance into the graph, which constitution section 8 excludes in favour of source-supported
    dependency.
non_edge_observations:
- id: OBS-01
  subject: magnitudes are excluded from every row
  detail: The table's twelve damage expressions across three tiers of severity and the d12 roll itself
    are all magnitudes and none reaches a field. The table is carried as an identity and the rows say
    that traps are resolved by it and that it inflicts damage, which is everything expressible. The one
    condition in this packet names a circumstance, time pressure or a demand for great skill, and spells
    no quantity; verified that no aspect or condition carries a digit.
- id: OBS-02
  subject: the graph has no condition identities, and the same-named spells are not substitutes
  detail: 'Half of what the traps table delivers is a status effect and the graph can carry none of it.
    Six effects appear across the twelve rows and no sleep, paralysis, blindness, confusion, unconsciousness
    or petrification identity exists.

    The trap worth flagging is that three of the six have same-named canonical identities, spell_sleep,
    spell_blind_deafen and spell_confusion, which are spells and not conditions. Pointing the table at
    them would assert that a pressure plate casts a wizard spell. The near miss is real: a keyword search
    for sleep in the registry returns spell_sleep and nothing else, so an extractor matching on names
    rather than on what the page is doing would land on it.

    This is a larger gap than the individual ones recorded in earlier packets, because conditions recur
    across traps, hazards, monsters and spells, and the next two packets in the queue are hazards and
    the gauntlet. Recorded for the Architect as a standing shape rather than escalated from inside a packet.'
- id: OBS-03
  subject: the automatic-discovery rule contradicts nothing but is easy to mis-read
  detail: 'M002 says a check is not an input to trap discovery, because a character who searches the right
    area finds the trap automatically. That sits alongside M001 and M004, which both say a check does
    bound trap handling. The three are consistent, and the distinction is which moment of the trap they
    describe: finding, avoiding and disabling.

    Recorded because a reader seeing one EXCLUDED_FROM and two CONSTRAINS rows between the same pair might
    read them as contradictory. They are not; they are three sentences of the source, and three_check_rows_note
    sets out which is which. The GM chapter''s INFORMATION principle on printed page 104 states the same
    discovery rule as advice, and it was rejected there in PKT-SD-101-109 as advice; this page is its
    defining locus and it is asserted here.'
unresolved_identity_questions: []
unresolved_identity_questions_note: 'None. The three judgements that could have gone otherwise are each
  argued against a settled test: the hedging test decides M001 and M002 in opposite directions, the one-statement-per-row
  test produces the three check rows rather than one, and the same-named-spell trap is a matter of fact
  rather than judgement once the registry is read.'
architectural_escalations: []
architectural_escalation_note: None raised. Both identities use an approved prefix, every row uses a legal
  edge type at status core, no row carries supersession_basis and none is an OVERRIDES, and no CLASSIFIED_AS
  row appears. OBS-02 records a gap that will recur across several remaining chapters, but creating a
  condition vocabulary is an Architect matter and is recorded rather than requested from inside a packet.
completeness_statement: 'The whole of printed page 114, its four prose paragraphs and its twelve-row table,
  was read at the recorded checksum. The packet yields 2 new identities and 6 rows, all citing page 114,
  reusing 3 canonical identities whose labels were verified character for character. Every row was checked
  against the 683 canonical edges for an assertion-key collision, for a shared source, type and target
  under a different aspect, and for duplicates within the patch; there are none of any, and no canonical
  row cited this page before.

  Five candidates were rejected and each is recorded with its reason, the most consequential being the
  table''s status effects, which have no identity and must not be pointed at the same-named spells. What
  is deliberately not asserted is listed as OBS-01 through OBS-03 and there are no open identity questions.
  No assertion depends on any other ruleset.'
