page_attribution_basis: One marker resolves this packet. p114 ends the TRAPS heading, which is also the
  section's first heading, and placement rule 1 applies it to that whole heading while the persistence
  rule carries it across the table. All six rows cite printed page 114. No content precedes the marker
  and no page is shared.
scope_boundary: The bounded scope is the Primary Source Material section, the single printed page 114
  and its table. The trailing Supporting Source Context is out of scope.
source_summary: 'Traps add peril to crawling, and a character typically gets a relevant stat check to
  avoid a trap''s effects. Three bolded rules follow. Most traps should have a tell, and the GM is warned
  against making them too frequent. Characters who search a specific area or object for a trap find it
  automatically. Thieves and characters trained in tinkering can describe how they disable or circumvent
  a trap: given enough time and a reasonable method they simply succeed, and the GM might call for a stat
  check only under time pressure or where great skill is needed. A d12 table then gives twelve traps,
  each with a trigger and a damage figure, most also naming a status effect.'
graph_state_at_extraction: 'Read from the repository at extraction, not recalled: the canonical graph
  holds 318 registry rows and 683 edges. The registry was read in full and every reused label verified
  character for character. No canonical row cites printed page 114, so nothing in this span has been extracted
  before.

  Two measured facts shaped the extraction. No trap identity existed, so this page is the defining locus.
  And no identity exists for any status effect the table names; searching for sleep, paralyse, blind,
  confuse, petrify and unconscious returns only spell_sleep, spell_blind_deafen and spell_confusion, which
  are spells rather than conditions, discussed in OBS-02. Every proposed row was checked against the canonical
  edge set for an assertion-key collision, for a shared source, type and target under a different aspect,
  and for duplicates within the patch; there are none of any.'
three_check_rows_note: 'Three rows run between rule_check and rule_traps and they are three distinct source
  statements, not one fact repeated. Recording the split explicitly because three rows on one pair invites
  the duplication objection, and because the one-row-per-statement lesson from PKT-SD-111-111 is what
  produced them.

  The page says three different things about checks and traps. A character typically gets a check to avoid
  a trap''s effects, which is M001, a bound on the trap. A character who searches a specific area finds
  the trap automatically, which is M002: the check is not an input to discovery at all. And a disabling
  attempt succeeds outright given time and method, with a check called for only under pressure, which
  is M004, a bound that applies conditionally.

  Each carries its own aspect, effect avoidance, trap discovery and disabling attempt, so the five-field
  keys differ and none collides. Collapsing them would lose the most interesting thing this page says,
  which is that a check is required, excluded and conditional at three different moments of dealing with
  the same trap.'
hedging_note: 'Two rows turn on the hedging test and they resolve in opposite directions, which is worth
  showing since the test has previously only been used to move rows away from EXCLUDES.

  M001 is hedged: characters typically get a check to avoid a trap''s effects. Typically marks a bound
  rather than an absolute, so CONSTRAINS with governs. M002 is not hedged: characters who search a specific
  area or object automatically find it, with no usually, typically or may. That is absolute, so the check
  is genuinely not an input to discovery and EXCLUDED_FROM is correct. EXCLUDED_FROM rather than EXCLUDES
  because the direction runs from the thing excluded to the mechanic it is excluded from, and it is the
  check that drops out of trap discovery rather than traps preventing checks generally.

  M004 is hedged again, the GM might call for a check, and takes CONSTRAINS with a condition naming the
  circumstance rather than restating it as certainty.'
