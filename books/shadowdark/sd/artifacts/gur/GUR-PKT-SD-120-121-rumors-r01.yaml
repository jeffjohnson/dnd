rejected_candidates:
- text_locus: the whole of the RUMORS TABLE, pp120 to 121
  quoted_gist: 50 results naming beasts, assassins, bounties, cults, ruins, named treasures, factions
    and a waking dragon
  why_considered: Completeness, and because 8 of the results contain the exact label of a canonical identity,
    which is measured in name_collision_measurement rather than estimated.
  rejection_reason: 'Every result is a story hook with no mechanical content: no check, difficulty, value,
    duration, damage or consequence. The label matches are all false positives, listed individually in
    name_collision_measurement, and the two real deity references are fiction about a cult and a church
    rather than statements about the deities. A row from any of them would assert a relationship the page
    does not make.'
- text_locus: the absence of any rule to attach the table to, pp120 to 121
  quoted_gist: the page is a heading and a table, with no sentence saying when or why rumors are rolled
    for
  why_considered: Every table in the intake except the one registered by the immediately preceding packet
    is reached by a rule through a RESOLVED_BY row.
  rejection_reason: 'There is nothing to attach it to, verified against the canonical edge set rather
    than assumed: no rule on this page and no canonical rule elsewhere names it. This is the same finding
    as OBS-02 of PKT-SD-118-119, and the registry-addition disposition is the settled answer to it.'
- text_locus: the bounty, the viperian count and the dragon's slumber, pp120 to 121
  quoted_gist: a bounty in gold pieces, a dice expression for how many viperians guard a shrine, and a
    dragon's slumber given in years
  why_considered: These are the only numbers on the page, and a dice expression in particular usually
    marks a mechanic.
  rejection_reason: All three are magnitudes inside fiction, and the fiction is what carries them. The
    dice expression sets how many creatures a GM should place in a scene the GM is free not to use at
    all, which is not a rule about viperians; there is no viperian identity in any case, the Monsters
    chapter being unextracted.
non_edge_observations:
- id: OBS-01
  subject: the second table-row marker, at the same ordinal position
  detail: 'Measured rather than noticed: the p121 marker falls on the twenty-fourth of 50 result rows,
    exactly where the p119 marker fell in PKT-SD-118-119. Both are two-page d100 tables typeset the same
    way, so the page break lands in the same place.

    Recorded because it makes the hazard predictable rather than surprising. A two-page d100 table in
    this book should be expected to carry its page marker buried around halfway down, in the last cell
    of a row, where reading headings alone would miss it. Two further such tables may well appear in the
    remaining chapters.'
- id: OBS-02
  subject: measured name collisions, all false
  detail: '8 canonical labels appear in these prompts on whole-word boundaries and none supports a row.
    The detail is in name_collision_measurement. Recorded as an observation as well because the measurement
    is reusable: running the same search over a narrative table is a cheap way to see the whole temptation
    at once rather than meeting it result by result, and it also surfaced the two abbreviated deity references
    that an exact-label search misses.

    The previous two packets each had one such near miss argued in prose, the trap effects and the Caltrops
    cell. Measuring is better than arguing: it produced a list, and the list is self-evidently fiction.'
- id: OBS-03
  subject: two adjacent packets of pure prompts
  detail: 'This is the second consecutive packet whose entire content is a d100 table of narrative prompts,
    and the second to yield a registry addition and nothing else. Together they are 100 prompts contributing
    two identities and no relationships.

    Recorded so the pattern is visible rather than looking like two separate thin readings. The Game Master
    half of this book alternates between rules pages that yield well, such as traps and the optional modes,
    and inspiration pages that yield almost nothing. The queue shows adventures, NPCs and rival crawlers
    next, and the packet titles suggest more of the latter kind.'
