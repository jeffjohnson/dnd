completeness_statement: 'Both printed pages in scope were read in full at the recorded checksum, including
  all 50 table results individually. The packet yields 1 new identity and no rows, declared registry_addition_only
  with its basis, applying the settled disposition of IDQ-01 in PKT-SD-118-119.

  Three candidates were rejected and each is recorded with its reason. The name-collision temptation was
  measured rather than argued: 8 canonical labels appear in the prompts and all 8 are false positives,
  enumerated in name_collision_measurement, plus two abbreviated deity references that are real but still
  fiction. The page attribution rests on the intake''s second table-row marker, with the row split measured
  from the claimed source. Every figure in this GUR was computed rather than counted by hand. No assertion
  depends on any other ruleset.'
