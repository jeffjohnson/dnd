registry_addition_only_declaration: 'This GUR proposes one candidate node and no candidate edge, no general
  rule and no domain, under the registry-addition shape DEC-2026-0003 provides.

  The page is structurally identical to the packet immediately before it: a heading and a 50-row d100
  table of narrative prompts, no prose, no rule for the table to be resolved by, no stated trigger and
  no mechanical consequence on any result. The difference from that packet is that the question is now
  settled. IDQ-01 of PKT-SD-118-119 asked whether an unattached table should be registered at all, and
  it was answered yes: the registry is the list of approved node IDs rather than a projection of the graph,
  so an identity may exist before any relationship does, and inventing a relationship to justify the node
  would be the defect. That disposition is applied here rather than re-argued, so this GUR raises no identity
  question.'
page_attribution_basis: 'The second table-row marker in the intake, and the same shape as the first. p120
  ends the RUMORS heading and behaves normally under placement rule 1. p121 sits at the end of the last
  cell of one table row, the one about three thieves pulling off a gemstone heist. Under the Attribution
  Rules a table-row marker applies to the row as a unit even when the cited evidence is in a cell before
  it, and acceptance test 3 requires a last-column table marker to be assigned to the whole row, so that
  entire row is printed page 121 and the persistence rule carries 121 to every row below.

  Measured from the claimed source rather than counted by eye: 50 result rows, 23 on printed page 120
  and 27 on 121. Notably the marker falls at the same ordinal position as in PKT-SD-118-119, the twenty-fourth
  row of fifty, which is what a two-page d100 table looks like when it is typeset the same way twice.
  No row in this GUR cites either page, because this GUR asserts no row.'
scope_boundary: 'The bounded scope is the Primary Source Material section, printed pages 120 and 121:
  one heading and one table. The trailing Supporting Source Context is out of scope.'
source_summary: 'A single d100 table titled RUMORS, spanning two printed pages with no accompanying prose.
  Its results are hooks a GM can put in a character''s ear: a beast the size of a ship is rampaging, assassins
  are coming, a bounty has been placed, a cult plans a coup at midnight, a named jewel is hidden in named
  caves, a dragon has woken. Most name places, people, factions or treasures invented for the entry. None
  states a check, a value, a duration or a consequence.'
graph_state_at_extraction: 'Read from the repository at extraction, not recalled, and every figure here
  is computed by the assembling script from the canonical files and the claimed source.

  The canonical graph holds 327 registry rows and 702 edges, and 0 rows cite printed pages 120 or 121,
  so nothing in this span has been extracted before. The registry holds 45 tbl_ identities of which 1
  carry no edge, that one being tbl_something_happens registered by the immediately preceding packet,
  and 24 identities overall carry no edge. This table would be the second unattached table and the 25th
  registry-only identity.'
name_collision_measurement: 'The temptation on a page like this is to assert a row because a prompt mentions
  something the graph holds. Rather than argue against that in the abstract, I measured it: the assembling
  script searched all 50 prompts for the exact label of every canonical identity, on whole-word boundaries.

  It found 8 canonical labels present in the prompts. Every one is a false positive, and the list is worth
  reading because it shows how the trap works. A dying sage is not rule_dying, the death sequence from
  printed page 89. A mighty group of heroes is not abil_mighty, the dwarf benefit from page 18. Goblin
  spelunkers are neither ancestry_goblin nor lang_goblin. The Moon Druids blessing a sword is not spell_bless.
  Fire that will not light is not spell_light. A Wizard Thief game is the closest to real, since rule_wizards_and_thieves
  is canonical from page 94, but the prompt is that a gambler will bet a ruby on one, which states nothing
  about the game''s rules.

  Two further references are real but did not match on exact label because the source abbreviates: the
  cult of Shune and the Church of St. Terragnis name deity_shune_the_vile and deity_saint_terragnis. Those
  are genuinely the canonical deities, and they are still fiction: a cult planning a coup says nothing
  mechanical about the deity.

  So the measured result is 8 label matches and zero assertable relationships, which is the clearest evidence
  yet for the test the last three packets applied. The source must state a relationship; mentioning two
  things that have identities is not enough.'
