source_summary: >-
  Page 267 presents the TREASURE chapter title and an epigraph attributed to Ralina, a halfling thief.
  Pages 267–268 present a continuous narrative fiction scene: four dungeon crawlers (Ralina the halfling
  thief, Jorbin the dwarf, Creeg the wizard, and Iraga the templar of Saint Terragnis) lower Ralina into a
  square pit to retrieve a grapefruit-sized sapphire from a black pedestal, triggering a clockwork trap
  with crushing walls from which she is pulled in the nick of time.

