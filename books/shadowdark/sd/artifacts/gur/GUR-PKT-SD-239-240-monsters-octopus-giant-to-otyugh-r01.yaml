non_edge_observations:
  - id: OBS-01
    subject: Giant Octopus Grab and Ink represent creature combat riders and visual suppression actions
    detail: >-
      Grab imposes an immobilized state with automatic tentacle damage (DC 15 STR escape check), while Ink
      blinds all creatures within near for 1d4 rounds in place of attacks. Both operate on creature combat loci
      under Constitution 2.5.
  - id: OBS-02
    subject: Oni Shapeshift and creature spells govern a sorcerous ogre-demon
    detail: >-
      Shapeshift allows turning into any humanoid or back in place of attacks; spells (Fade, Hellfrost, Mist)
      operate on creature action locus under Constitution 2.5 without establishing player spell identities.
  - id: OBS-03
    subject: Orc and Orc Chieftain share the Rage trait
    detail: >-
      Rage is a 1/day combat buff granting morale immunity and +1d4 damage for 3 rounds. This operates on
      creature combat buff locus under Constitution 2.5.
  - id: OBS-04
    subject: Invariant 4 evaluated for Orc
    detail: >-
      Orc as a monster (monster_orc, monster_orc_chieftain) is distinct from the character language (lang_orcish)
      and character ancestry (ancestry_half_orc). Separate kind and prefix maintain architectural integrity.
  - id: OBS-05
    subject: Otyugh Disease is an attack rider on its bite attack
    detail: >-
      Disease imposes a DC 15 CON check, followed by daily recurring checks against 1d6 unhealable HP loss
      until a success. This operates on creature combat rider locus under Constitution 2.5.

