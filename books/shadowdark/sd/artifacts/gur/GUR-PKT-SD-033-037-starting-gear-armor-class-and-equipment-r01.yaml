authored_polarity_declaration: >-
  Twenty rows carry authored polarity, all with basis read. The MODIFIES rows are the three armor
  ratings and the shield bonus, all improves; the chainmail and plate mail check penalties, both
  worsens; mithral's two rows, both improves; the crowbar, improves; the caltrops movement penalty,
  worsens; and the finesse, thrown and versatile property effects, all improves. The CONSTRAINS rows
  are the basic gear table, the armor table, loading, two-handed and the weapons table, all governs.
  The TRIGGERS rows are the two damage rows, caltrops and oil flask, both inflicts.
  Each is among the three types constitution section 5 requires to carry source-reviewed authored
  polarity, and each was read aloud as source polarity target before being recorded. No row uses
  basis heuristic or unset. No other row carries a polarity or polarity_basis value: the GATES,
  FEEDS_INTO, CONSUMES, EXCLUDES and EXCLUDED_FROM rows take their derived polarity from the section
  5 table and the Analyst authors none of them.

domains_touched: []
candidate_domains:
  - proposed: equipment
    basis: >-
      Gear, carrying capacity, armor and weapons are a coherent cluster occupying five printed pages
      and given their own chapter by the contents list. This is the strongest single-packet evidence
      for a domain candidate so far. Recorded as a candidate only; the domain registry is empty and
      constitution section 8 reserves promotion to an Architect Decision, and the Analyst does not
      decide a candidate domain is official.
  - proposed: combat
    basis: >-
      Armor class, the attack roll, the damage roll and every weapon property sit in combat rather
      than in equipment, and this packet supplies most of their inputs. Recorded as a candidate only;
      now suggested by a fourth packet, and deliberately not treated as promotion.

domain_boundary_questions:
  - >-
    An item and its combat effect are inseparable here: a weapon is equipment that exists to feed a
    damage roll, and an armor is equipment that exists to change armor class. Whether that makes
    equipment and combat one domain or two cannot be settled from these pages. Deferred; no domain is
    asserted on any edge in this GUR.

candidate_general_rules:
  - proposed: every weapon supplies the damage die of an attack made with it
    establishing_locus: 'SD page 37, WEAPONS TABLE, the Damage column'
    basis: >-
      Fifteen rows repeat one shape exactly, which is the largest single repetition in the intake so
      far. If approved as a general rule those fifteen explicit edges could become derived
      applications, and any weapon added by a supplement would be covered automatically.
    not_applied: >-
      Recorded as a candidate only. Constitution section 5 requires a separate Architect ruling with
      an establishing locus, scope, counterexamples and affected set before a general rule exists,
      and the Analyst is prohibited from promoting one. A possible counterexample is already visible
      and is why the Analyst is not confident it should be promoted: the versatile weapons carry two
      damage dice rather than one, and mithral shows that the tables admit modifier rows that are not
      ordinary members. No edge in this GUR sets general_rule_id, and under invariant 19 the
      establishing edges would leave it empty in any case.
  - proposed: a weapon carrying a property tag is subject to that property
    establishing_locus: 'SD page 37, the WEAPONS TABLE Properties column and the five bolded definitions below it'
    basis: >-
      Thirteen rows repeat this shape across five properties. The table and the definitions together
      are exactly the establishing locus a general rule would need.
    not_applied: >-
      Recorded as a candidate only, and deliberately not promoted for the same reason. No edge sets
      general_rule_id.

non_edge_observations:
  - id: OBS-01
    subject: three relationships this page states are omitted because sibling GURs already assert them
    detail: >-
      All three would collide under the constitution section 4 assertion key, so omitting them is
      required rather than optional. GEAR SLOTS restates that carrying capacity is the higher of the
      Strength stat and a fixed floor; GUR-PKT-SD-011-014 already asserts Strength feeding gear
      capacity on the aspect carry limit, and gear capacity constraining gear on the aspect items
      carried, both from printed page 13. The ARMOR CLASS subsection restates that a character may
      wear the armor listed for their class; the same GUR asserts the class axis constraining armor,
      and the four class GURs assert it per class. The same subsection restates that 0-level
      characters may wield all armor until 1st level; that GUR asserts it as the beginner's luck
      override.
      The Analyst omitted each rather than varying an aspect to make a near-duplicate pass. What this
      page adds beyond them, the slot quantities, the armor slot costs and the mithral reduction, is
      asserted on its own rows.
  - id: OBS-02
    subject: the twelve starting items and the eighteen gear entries are not all proposed
    detail: >-
      Page 33 lists twelve items a 0-level character may start with and page 34 describes eighteen in
      bolded entries, tabulated on page 35. Only six item identities are proposed: backpack, coin,
      crowbar, lantern, oil flask and caltrops. Each of those is proposed because it carries a stated
      mechanical effect that produces an edge.
      The rest are described without one. Arrows and crossbow bolts are ammunition for named weapons;
      a mirror is a small polished mirror; a gem is valuable; rations are a day of food; a pole is a
      length of wood; rope is rope. Flint and steel says routine attempts to light a fire always
      succeed, which is the closest call among them and was rejected because a routine attempt is not
      a named mechanic and no check is invoked. Proposing the remainder would create item nodes whose
      only content is a price and a slot count, both magnitudes, and they would be orphans.
      This is a deliberate line and it will need revisiting: the gear entries for torch and lantern
      both point at Light on printed page 84, and once that packet is claimed a torch will have a
      real dependency and should be proposed there or in a successor revision here.
  - id: OBS-03
    subject: the coin carrying allowance is not given its own exclusion row
    detail: >-
      The basic gear table gives coin an allowance of a stated number free to carry, in the same
      shape as the backpack's first one free. The backpack gets an EXCLUDED_FROM row and coin does
      not, which is a deliberate asymmetry: the backpack's exemption is total and unconditional,
      while coin's is a threshold above which coins do occupy slots, and the threshold is a magnitude
      the graph must not store. An unconditional exclusion row for coin would therefore assert
      something false. The allowance remains in the immutable claimed packet.
  - id: OBS-04
    subject: three mechanics this packet depends on are defined on pages it does not claim
    detail: >-
      The weapons table classifies every weapon by a range band, close, near or far, and points at
      Distances on printed page 85. The armor table forbids swimming in plate mail. The gear entries
      for torch and lantern describe light in terms of those same distance bands and point at Light
      on printed page 84. None of the three has an identity here: the bands, swimming and light are
      all defined elsewhere, and printed page 85 is reproduced in this packet's own Supporting Source
      Context and was deliberately not read.
      The consequences are recorded rather than forced. The range dependency is carried at table
      level by the weapons table constraining the attack roll, which is true without naming the
      bands. The no-swim clause is dropped entirely, because this packet has no swimming identity to
      target and inventing one from a Properties cell would fix an exploration mechanic from an armor
      row. The light dependency is dropped for the same reason and flagged in OBS-02.
  - id: OBS-05
    subject: advantage and disadvantage remain the unextracted mechanism, now on both sides
    detail: >-
      The crowbar grants advantage; chainmail and plate mail impose disadvantage. This is the first
      packet in the intake where the negative half appears, and it is treated symmetrically with the
      positive half: the rows assert the effect on the check, improves or worsens, rather than the
      mechanism. Printed page 9 defines both terms without relating either to another named mechanic,
      and Rolling the Dice on printed page 78, which is reproduced in this packet's Supporting Source
      Context and was not read, is the defining locus. This is now the seventh packet to depend on
      advantage.
  - id: OBS-06
    subject: the shield and two-handed interaction is a real inference and is deliberately not drawn
    detail: >-
      The shield's Properties cell reads that it occupies one hand, and the two-handed property says
      a weapon must be used with two hands. Together they imply that a shield cannot be carried with
      a two-handed weapon, which is a genuine and useful mechanical consequence. No edge asserts it.
      The source states the two facts separately and never draws the conclusion, and an edge here
      would be the Analyst's reasoning rather than a reading. Responsibility 16 admits a negative
      dependency only when the text denies a relationship a reader would assume; this text denies
      nothing, it merely makes two statements a reader can combine. Recorded so a later reader can
      see the inference was noticed and declined, and so a Reviewer who wants it asserted can request
      it explicitly.
  - id: OBS-07
    subject: the crawling kit is a bundle rather than an item
    detail: >-
      The crawling kit table lists seven items with quantities, slots and costs and states a total
      cost and slot count for the bundle. It is proposed as a table rather than an item because it is
      a purchasing convenience assembled from items already described, not a new piece of equipment.
      Its one edge records that taking it has a carrying consequence. Its component rows restate
      quantities and costs for items the basic gear table already covers, all magnitudes, and no
      component edge is drawn.
  - id: OBS-08
    subject: magnitudes deliberately excluded
    detail: >-
      These pages are denser in magnitudes than any packet so far. Excluded are the starting item
      die, the starting gold expression and multiplier, the armor class base, every cost in three
      tables, every quantity per gear slot, every gear slot count, the crawling kit totals, the coin
      conversion rates, the three armor ratings and the shield bonus, the mithral cost multiplier and
      slot reduction, all fifteen weapon damage expressions including the paired versatile dice, the
      caltrops damage and speed fraction and duration, the oil flask duration and damage, the lantern
      fuel duration, the torch duration, and the rope and pole lengths. All are costs, magnitudes,
      die expressions, durations or thresholds, excluded by constitution section 1 and invariant 11.
      They remain in the immutable claimed packet, which is the authority for the values themselves.
      No aspect in this GUR contains a digit and no condition encodes a numeric value.

unresolved_identity_questions:
  - id: IDQ-01
    subject: whether this page or printed page 13 is the defining locus for armor class and gear capacity
    detail: >-
      This GUR records printed page 13 as the defining locus for cbt_armor_class, item_gear and
      rule_gear_capacity, because the overview packet proposed them there. Page 13 names armor class
      and says class determines wearable armor; this page gives the actual calculation. Page 13 says
      a character carries items equal to the higher of Strength and a floor; this page repeats it and
      adds the slot mechanics. A reasonable reader could call these pages the defining loci.
      Nothing turns on it, which is why it is recorded rather than escalated: both pages use the same
      names with the same grammatical number, so no identity conflict arises under SOURCE_MARKDOWN
      Source Identity Authority and no rename is proposed.
      Consequence if wrong: none to the rows, which would be unchanged; only the defining_locus field
      on three candidate nodes would name a different page. Reviewer may correct it freely.
  - id: IDQ-02
    subject: mithral is a material modifier represented as an item
    detail: >-
      Mithral is proposed under item_ with the other armors, but its table row is unlike theirs: it
      has no armor rating, its cost is a multiplier and its slot entry is a reduction, and it is
      marked metal armor only. It modifies another armor rather than being one.
      OVERRIDES was considered for its two rows, on the reading that mithral replaces the penalty its
      base armor imposes, and rejected. OVERRIDES requires a supersession basis from the closed
      section 7 list, and none of the four fits a material property; the relationship is also not a
      replacement of one rule by another but a change to a value, which is MODIFIES. The two rows
      therefore carry the condition that they apply only when mithral is applied to metal armor.
      Consequence if wrong: if a later Decision prefers a material kind or an OVERRIDES treatment,
      two rows repoint or change type and the node's kind changes; no source reading changes. The
      thief class entry names mithral chainmail as a single permitted armor, which is further
      evidence that the book treats material and armor as combinable rather than separate, and a
      Reviewer may reasonably want that combination expressed once the class deferrals are revisited.
  - id: IDQ-03
    subject: the weapon kind is new and is not stated by the constitution
    detail: >-
      Constitution section 2 glosses the weapon_ prefix as a weapon identity or weapon family but
      does not state a machine kind for it, as section 2.1 does for ancestry. This GUR uses the kind
      weapon for all fifteen, by analogy with the prefix name and with how class_ and ancestry_
      behave.
      Consequence if wrong: fifteen nodes need a kind correction, which is a registry change and not
      a re-reading of source. This is not an Architect escalation: the prefix itself is approved and
      unchanged, and ESCALATION_CONTRACT reserves escalation for a new prefix or a changed kind, not
      for naming the kind a prefix already implies. Recorded so Builder and Reviewer can settle it
      deterministically rather than each guessing.

architectural_escalations: []
architectural_escalation_note: >-
  None raised. Every proposed node uses an approved constitution section 2 prefix with an unchanged
  kind, every edge uses one of the thirteen legal section 3 types, and no new prefix, edge type,
  domain promotion or general-rule application is requested. Crucially, unlike the alignment, deity
  and language packets this Analyst escalated earlier today, every identity this packet needs has an
  approved prefix: weapon_ for the fifteen weapons, item_ for the armors and gear, tbl_ for the four
  tables and rule_ for the five weapon properties. ESCALATION_CONTRACT states that a proposed node
  under an approved prefix and kind which passes identity and duplicate checks is ordinary GUR, GUP
  and Review work rather than an escalation, which is why this packet proceeds and those are held.
  IDQ-01 through IDQ-03 are recorded for Reviewer on that basis, and the deferrals in OBS-02, OBS-04
  and OBS-05 resolve when the relevant defining packets are claimed.

completeness_statement: >-
  All five printed pages in the declared span are accounted for. Page 33 was read in full: the
  STARTING GEAR, AC heading, the STARTING GEAR subsection with both tier statements and all twelve
  listed items, and the ARMOR CLASS subsection, whose calculation supplies the Dexterity row and
  whose two other sentences are dispositioned in OBS-01. Page 34 was read in full: the GEAR heading
  and all eighteen bolded entries, of which six supply rows and the rest are dispositioned in OBS-02.
  Page 35 was read in full: the BASIC GEAR TABLE heading, its three column headings and all eighteen
  rows, and the GEAR SLOTS subsection, dispositioned in OBS-01 and OBS-03. Page 36 was read in full:
  the CRAWLING KIT TABLE with its cost and slot statement and all seven rows, and the ARMOR TABLE
  with its five column headings and all five rows. Page 37 was read in full: the WEAPONS TABLE with
  its six column headings and all fifteen rows, all five bolded property definitions, and the weapon
  type and range notes, dispositioned in OBS-04.
  Every page marker was resolved through the Pandoc AST and the in-scope resolved page set matches
  the declared span with no gap; the three blocks that inherit their page under the persistence rule
  are named explicitly in page_attribution_basis. The Supporting Source Context reproducing printed
  pages 78 through 81 and 85 is out of scope, was deliberately not read as evidence, and contributed
  nothing. Fifty-eight edges are proposed across forty-seven candidate nodes, twelve of which are
  also proposed by sibling GURs and are marked as such; this is the largest extraction in the intake
  so far and pays back the weapon and armor identity deferrals recorded by four earlier class GURs.
  No node is reused because the Shadowdark graph is empty. Content not converted to an edge is
  accounted for in OBS-01 through OBS-08, and every identity question the Analyst could not settle is
  recorded in IDQ-01 through IDQ-03 rather than resolved by picking a plausible answer. No assertion
  depends on any other ruleset.
