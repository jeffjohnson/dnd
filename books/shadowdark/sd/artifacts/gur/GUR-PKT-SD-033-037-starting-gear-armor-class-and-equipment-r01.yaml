page_attribution_basis: >-
  Five markers resolve in the Primary Source Material, all through the Pandoc AST rather than
  positionally, and all plain markers ending headings, which placement rule 1 applies to each whole
  heading: page 33 at STARTING GEAR, AC; page 34 at GEAR; page 35 at BASIC GEAR TABLE; page 36 at
  CRAWLING KIT TABLE; page 37 at WEAPONS TABLE. Three blocks carry no marker of their own and take
  their page from the persistence rule, which is where a positional reading would go wrong: the GEAR
  SLOTS subsection falls on page 35, the ARMOR TABLE on page 36, and the five weapon property
  definitions with the type and range notes on page 37. Rows below are cited accordingly. Five
  further pages the parser resolves, 78 through 81 and 85, lie entirely inside the out-of-scope
  Supporting Source Context.

out_of_scope_context_warning: >-
  This packet's Supporting Source Context reproduces printed pages 78 through 81 and 85, which define
  advantage and disadvantage, the check procedure, how stats are used, and the distance bands. Those
  are exactly the mechanics this packet's entries keep invoking: the crowbar grants advantage, two
  armors impose disadvantage, and the weapons table classifies every weapon by a range band. They
  were not read as evidence. Every assertion below is drawn from printed pages 33 to 37 and cites one
  of them, and where an entry depends on a mechanic defined on one of those pages the dependency is
  recorded as an observation rather than asserted from borrowed text.

scope_boundary: >-
  The bounded scope is the Primary Source Material section, printed pages 33 through 37. Five further
  pages appear only as Supporting Source Context and are claimed by other packets, so the
  zero-overlap rule across the intake holds for this packet.

source_summary: >-
  Printed pages 33 to 37 are the equipment chapter. Page 33 gives the starting gear for each of the
  two starting tiers and defines armor class. Page 34 describes eighteen items of adventuring gear in
  bolded entries. Page 35 tabulates those items with cost and quantity per gear slot and states the
  carrying capacity rule. Page 36 gives a bundled crawling kit and the armor table with five entries.
  Page 37 gives the weapons table with fifteen entries and defines five weapon properties plus the
  weapon type and range notation. This summary is orientation only; every assertion below cites its
  page.

extraction_posture: >-
  This packet is the defining locus for identities that four earlier GURs deferred to it. The priest,
  thief and wizard class entries each name permitted weapons, and all four class entries state
  permitted armor; in each case the Analyst declined to mint an identity from a permission list and
  recorded the debt, because SOURCE_MARKDOWN Source Identity Authority names a permission list as a
  secondary listing that cannot name a concept defined elsewhere. This is where that debt is paid.
  Fifteen weapons and five armors are therefore proposed here, from the tables that define them. The
  grain rule still applies in full: a weapon's cost, damage die, range band and slot count are
  magnitudes and none is stored. What is stored is that a weapon supplies the damage die, that a
  property applies to the weapons whose row carries it, and what each property then does.

graph_state_at_extraction: >-
  The Shadowdark canonical graph is still empty; nodes.csv is header-only, the domain registry has no
  domains, general_rules.json is an empty object, and character_races.yaml is inactive. The three
  supplied slices named in the packet manifest as missing remain immaterial, re-assessed here rather
  than carried over from claim. reused_nodes is empty. Twelve of the identities below are already
  proposed by sibling GURs and are marked as such.

cross_packet_identity_note: >-
  Twelve identities below are proposed by sibling GURs and are proposed again here because this patch
  uses them as edge endpoints. A GUR must propose every endpoint its edges use: an endpoint present
  only in a sibling GUR is not canonical, is not proposed by the patch, and fails invariant 1 as
  endpoint_unresolved. Proposing them is not a competing naming; each records its defining locus and
  the sibling GUR that also proposes it, and each ID and label is reproduced exactly.
  Three of them are unusual in that this page is arguably their fuller locus rather than a secondary
  mention: cbt_armor_class, whose calculation is stated here for the first time; item_gear; and
  rule_gear_capacity, whose rule is restated here in full. The Analyst keeps printed pages 12 and 13
  as the recorded defining loci because the overview packet proposed them there and both pages use
  the same names, so no identity conflict arises. See IDQ-01.

