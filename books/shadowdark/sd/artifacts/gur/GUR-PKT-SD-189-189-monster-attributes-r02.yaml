rejected_candidates:
  - text_locus: 'ARMOR CLASS, p189'
    quoted_gist: 'just like characters, monsters have an AC that denotes how difficult it is to harm them'
    why_considered: 'cbt_armor_class is canonical with 12 rows and the sentence names it directly.'
    rejection_reason: >-
      It states scope, not dependency. Striking it would leave cbt_armor_class and all its rows
      unchanged, which is the core test failing cleanly. Constitution 2.5 now states the same
      result independently: a stat-block description creates no identity, edge or property
      store. Unchanged from r01.
  - text_locus: 'ATTACKS, p189'
    quoted_gist: >-
      most monsters can make one or two attacks per turn, but some can make more, and attack
      bonuses and damage are listed for each
    why_considered: 'cbt_attack_roll, rule_damage and rule_turn are all named in one sentence.'
    rejection_reason: >-
      Scope and a magnitude. The number of attacks is a quantity and no field may store one; the
      hedges most and some can make more confirm a range rather than a rule. Listed for each
      points at the stat blocks, which constitution 2.5 places outside graph content. Unchanged
      from r01.
  - text_locus: 'MOVEMENT, p189'
    quoted_gist: >-
      monsters can typically move near each turn, some can move other distances, and a special
      mode such as flying or swimming is noted after the distance
    why_considered: 'ex_movement has 22 rows and rule_distance CONSTRAINS it already.'
    rejection_reason: >-
      Typically hedges a default value and near is a distance band already carried by
      rule_distance CONSTRAINS ex_movement from printed page 85. Nothing states a new
      dependency. Unchanged from r01.
  - text_locus: 'STAT MODIFIERS, p189'
    quoted_gist: >-
      monsters have modifiers listed for Strength, Dexterity, Constitution, Intelligence, Wisdom
      and Charisma
    why_considered: >-
      Seven canonical identities are named in one sentence, which is the densest naming on the
      page.
    rejection_reason: >-
      Scope. abil_stat_modifier FEEDS_INTO rule_check is canonical from printed page 9 and is
      unconditioned, so it already covers a monster's modifiers. Unchanged from r01.
  - text_locus: 'ALIGNMENT, p189'
    quoted_gist: >-
      all monsters have a typical alignment for their species, and an individual monster might
      have a different one
    why_considered: 'sys_alignment is canonical with 13 rows and the three alignment_ identities exist.'
    rejection_reason: >-
      Constitution section 2.4 keeps alignment membership out of the graph and names
      sys_alignment explicitly as something no classification row may point at. The sentence
      states no effect of a monster's alignment on any mechanic, and section 2.5 now also lists
      alignment among the stat-block values that are not graph content. Unchanged from r01.
  - text_locus: 'the two restated spellcasting rules, p189'
    quoted_gist: >-
      a natural 1 on an INT or CHA spell sends the caster to the Wizard Mishap tables at printed
      page 46, and a natural 1 on a WIS spell incurs penance
    why_considered: >-
      Four canonical identities are named and one carries an explicit printed page pointer,
      which is the shape that earned a CROSS_REFERENCES row at PKT-SD-178-179.
    rejection_reason: >-
      Both relations are already canonical from their defining locus at printed page 45:
      rule_critical_failure TRIGGERS each of the three wizard mishap tables, and TRIGGERS
      rule_penance. Both are unconditioned as to who is casting, so they already cover monsters,
      and the page's instruction to treat monster spellcasting the same as character
      spellcasting is why. A pointer earns a row when the relation it names is not already
      carried; here it is carried. Unchanged from r01.
  - text_locus: 'treat monster spellcasting the same as character spellcasting, p189'
    quoted_gist: 'the opening sentence of the SPELLCASTING subsection'
    why_considered: 'It equates two things outright, and ALTERNATIVE_TO is the vocabulary''s equivalence type.'
    rejection_reason: >-
      ALTERNATIVE_TO means mutually exclusive or substitutable options, not identity of subject,
      and there is no second identity for monster spellcasting to be alternative to. It is the
      instruction that makes the two restatements redundant rather than an assertion of its own.
      Unchanged from r01.
  - text_locus: 'the CON half of the hit point calculation, p189'
    quoted_gist: 'and adding its CON modifier, with a stated minimum'
    why_considered: 'abil_constitution is canonical and the sentence states that it feeds the calculation.'
    rejection_reason: >-
      abil_constitution FEEDS_INTO rule_hit_points on hit point value is canonical from printed
      page 14 and carries no condition, so it already covers a monster's hit points. The stated
      minimum is a magnitude. Only the monster level half of this sentence is a new assertion and
      M001 now carries it. Unchanged from r01 except that the other half is no longer blocked.
  - text_locus: 'the dice expression in the hit point calculation, p189'
    quoted_gist: 'by rolling a number of d8s per monster level'
    why_considered: >-
      It is the mechanism by which the dependency M001 records actually operates, so a reader
      may expect to find it represented.
    rejection_reason: >-
      A die expression is a magnitude and constitution section 1 excludes it from every field.
      DEC-2026-0105 states the same limit for this exact row: it records the stated
      relationship, not dice, a level number, or an individual monster's hit points. M001
      asserts that monster level is an input and stops there.
  - text_locus: 'blinding or deafening still hinders a monster, p189'
    quoted_gist: 'the closing sentence of the DARK-ADAPTED subsection'
    why_considered: 'It bounds the dark-adapted ability, so it looked like a condition on M002 or a row of its own.'
    rejection_reason: >-
      There is no identity for a blinded or deafened state and none may be minted from a
      limiting clause; the registry holds no condition or status identity of any kind. The
      sentence also does not limit what M002 asserts, which is only that darkness penalties are
      ignored. Recorded because the absence of a status vocabulary will recur across the monster
      chapter. Unchanged from r01.
  - text_locus: 'the non-humanoid qualifier on dark-adapted, p189'
    quoted_gist: 'all non-humanoid monsters are dark-adapted'
    why_considered: >-
      Constitution section 2.1 permits GATES to express eligibility for a named benefit, so an
      eligibility row into abil_dark_adapted was considered once the ruling existed.
    rejection_reason: >-
      Non-humanoid monsters are a creature grouping and the graph has no identity for it.
      DEC-2026-0105 authorises mstat_ for a shared creature statistic or rating, which a
      humanoid/non-humanoid split is not, and constitution 2.5 requires an Architect Decision for
      any broader use. Proposing a grouping identity here would be exactly the widening the
      ruling forbids, so M002 records what the ability does and not who has it.

non_edge_observations:
  - id: OBS-01
    subject: six of eight subsections state scope, and the ruling confirms the reading
    detail: >-
      Six subsections say that monsters have an attribute the graph already holds. r01 declined
      all six from the core test alone, before any ruling existed. Constitution 2.5 now reaches
      the same result from the other direction, stating that individual creature stat-block
      values are not graph content merely because they are printed.
      Recorded because the two are independent. The core test declined them because striking the
      sentence would change nothing; the ruling declines them because a stat block is data about
      one creature. A later reader should see that the boundary was not invented to justify a
      thin packet.
  - id: OBS-02
    subject: the same bold mark means the opposite of what it meant one packet ago
    detail: >-
      PKT-SD-187-188 bolded six words in fiction and its GUR argued they were prose emphasis,
      the tell being that the bolded set included words that are not mechanics in any reading.
      This page bolds nine terms and every one is a defined stat abbreviation. So bolding is
      evidence of a defined term in rules text and evidence of nothing in narrative, and the two
      packets are adjacent. Unchanged from r01.
  - id: OBS-03
    subject: the tier inversion is the first circular pair in the graph
    detail: >-
      rule_spell_tier FEEDS_INTO rule_difficulty_class on casting difficulty is canonical from
      printed page 44: a character's tier sets the DC. M003 asserts the reverse for a monster.
      That is not a contradiction and not a duplicate: the two rows differ in type, aspect and
      condition, so they are distinct under the five-field key, and each is what the source says
      for its own subject. The graph exists for impact analysis, and the honest answer to what
      depends on the spellcasting DC is that for monsters the tier does. Unchanged from r01.
  - id: OBS-04
    subject: what the first mstat_ identity commits the chapter to
    detail: >-
      mstat_monster_level is the first identity under a prefix created for this packet, so it is
      worth stating what it does not commit the chapter to. It is not a template for the other
      seven attributes on this page, all of which keep their existing shared identities. It is
      not a container for a creature's printed LV. And it does not make the stat blocks
      extractable: constitution 2.5 and the Decision's post-implementation requirements both say
      the remaining monster packets apply the same boundary and escalate only a genuinely
      broader mstat_ use.
      The practical consequence for the roughly sixty stat-block packets ahead is that each will
      yield creature identities and named special abilities, not eight rows of printed values.
      The Analyst records that expectation here rather than rediscovering it per packet.
  - id: OBS-05
    subject: a blocked GUR is not a failed one
    detail: >-
      r01 is immutable at its path with next_role architect, readiness blocked and the
      escalation in blocking_ids. It is the durable record of why this packet paused for an
      afternoon, and nothing in it was wrong: its two drafted rows are M002 and M003 here,
      field for field.
      Recorded because the artifact store now holds two GURs for one packet with very different
      shapes, and the reason is governance rather than a corrected reading. Anyone auditing this
      packet should read r01 first.

