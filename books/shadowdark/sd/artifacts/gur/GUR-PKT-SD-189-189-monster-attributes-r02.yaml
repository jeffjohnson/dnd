source_summary: >-
  One page of rules text in eight subsections describing the attributes printed in a monster
  stat block: armour class, hit points, attacks, movement, stat modifiers, alignment,
  spellcasting and dark-adapted. Bold marks the defined abbreviations. Six subsections state
  scope, which yields nothing; three state a dependency, which yields the three rows below.

graph_state_at_extraction: >-
  Read from the repository at publication, not recalled. The canonical graph holds 424 registry
  rows and 851 edges, and 0 rows cite printed page 189. The registry holds 0 monster_
  identities, 0 mstat_ identities and 19 abil_ identities; the script asserts that both proposed
  ids are absent before using them.
  rule_hit_points carries 26 inbound rows, rule_total_darkness 4 in total, rule_spell_tier 10
  and rule_difficulty_class 6. exp_level carries 30 rows, which is the figure the escalation
  turned on and which no row here touches.

mstat_boundary_observed: >-
  Constitution 2.5 bounds this proposal and the boundary is honoured literally rather than
  approximately.
  mstat_monster_level is proposed for the shared statistic the source names, and M001 records
  only the stated relationship that monster level feeds hit-point calculation. No row stores how
  many levels any creature has, no dice expression appears, and no individual creature is named
  or implied.
  The six subsections that describe a stat block's fields produce nothing, which section 2.5
  states outright: a stat-block description or an individual value never creates an identity,
  edge, property store, or completeness obligation. That is the same disposition r01 reached
  from the core test, so the ruling confirms the reading rather than changing it.
  No second mstat_ identity is proposed. AC, attacks, movement, the stat modifiers, alignment,
  the DC and the tier all keep their existing shared identities, which the ruling requires and
  which the registry already supplies.

