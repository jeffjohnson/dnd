completeness_statement: >-
  The single printed page in the declared span was read in full at the recorded checksum, which
  was recomputed at this publication and is identical to the one r01 recorded: 9 headings and 8
  paragraphs, no table and no list. Every subsection is dispositioned, six as scope and three as
  rows.
  The packet yields 2 new identities and 3 rows, reusing 4 canonical identities whose labels were
  asserted equal to the registry. Both proposed ids were asserted absent from the registry before
  use. Every row was checked against the 851 canonical edges for an assertion-key collision, for
  a shared source, type and target under a different aspect, and for duplicates within the patch;
  there are none of any, and no canonical row cited page 189 before. M001 shares its aspect with
  an existing row into the same target and differs in source, which is intended and recorded.
  This successor changes no published artifact. r01 remains immutable with its blocked handoff,
  and the escalation remains immutable at its decided path with the bytes r01 checksummed.
  No assertion depends on any other ruleset.

tier_inversion_note: >-
  M003 asserts the reverse of a canonical row, so the reasoning is set out rather than left to
  the aspect.
  At printed page 44 a spell's tier feeds its casting difficulty. That is the character case,
  where tier is known and the DC follows. Page 189 states the monster case, where the DC is
  printed in the stat block and the tier is worked back from it.
  DERIVED_FROM is the type, because the constitution defines it as computed or looked up from,
  running derived to source, which is exactly the direction stated. FEEDS_INTO would duplicate
  the existing row's direction and say the opposite of this sentence. The condition carries the
  subject, for a monster, qualitatively; the fixed amount subtracted is a magnitude and is not
  stored anywhere in the row.
  Worth noting against constitution 2.5: this row survives the creature-statistic boundary
  because both endpoints are shared mechanics and the dependency is stated between them. It says
  nothing about any individual creature's DC or tier, which is what the boundary excludes.

