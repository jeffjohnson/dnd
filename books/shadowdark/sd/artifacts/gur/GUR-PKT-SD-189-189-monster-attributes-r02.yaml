row_provenance_note: >-
  M001 is written to the Decision's own specification rather than composed by the Analyst. The
  ruling states the assertion as mstat_monster_level FEEDS_INTO rule_hit_points with aspect hit
  point value and condition for a monster, and those are the exact values used; the script
  asserts that the ruling text contains both strings before emitting the row.
  That aspect is deliberately the one abil_constitution already uses into the same target. The
  two rows are distinct under the five-field key because their sources differ, which the script
  asserts against the 851 canonical rows, and the shared aspect is the point: the source
  describes one hit-point calculation with two inputs, and the graph now shows both.
  M002 and M003 are r01's D001 and D002 unchanged in every field. They never depended on the
  ruling on their own terms; they were held only by the relay pause, and the Decision's step 2
  directs that they be preserved.

