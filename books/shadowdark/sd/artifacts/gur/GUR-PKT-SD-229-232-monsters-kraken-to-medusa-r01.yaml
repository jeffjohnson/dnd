non_edge_observations:
  - id: OBS-01
    subject: Kraken environmental and area combat actions operate on creature action loci
    detail: >-
      Kraken possesses Storm (1-mile radius turbulence with 1:6 vessel capsizing risk), Lightning Bolt (far line
      dealing 6d6 damage on DC 15 DEX), and Crush (double damage against objects). None alters universal
      environment or object damage rules; all operate on creature action loci under Constitution 2.5.
  - id: OBS-02
    subject: Lich defensive traits and spell repertoire govern an apex undead spellcaster
    detail: >-
      Phylactery establishes an immortality condition tied to an external object; Supreme Undead grants morale
      and non-magical damage immunity; Paralysis adds a DC 15 CON rider. Spells (Flight, Null, Shadow Leap,
      Sigil of Doom, Wither) operate on creature action loci under Constitution 2.5.
  - id: OBS-03
    subject: Monster stat-block spells operate on creature action locus
    detail: >-
      Leprechaun, Lich, and Mage stat blocks declare creature-specific spell actions. Per Constitution 2.5,
      monster stat-block spells operate on creature action locus and do not establish standalone player spell
      identities.
  - id: OBS-04
    subject: Medusa gaze petrification and venom operate on creature combat locus
    detail: >-
      Petrify imposes a DC 15 CON check against petrification upon direct eye contact (affecting the medusa
      as well), while snake bite Poison imposes DC 15 CON or drop to 0 HP. Both operate as creature combat
      riders under Constitution 2.5.

