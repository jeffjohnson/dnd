page_attribution_basis: 'Every entry in this packet sits under an explicit marker, so unlike the two preceding
  packets no page is inherited from a neighbour. Three markers resolve it: p68 ends the PROPHECY heading,
  which is also the section''s first heading, p69 ends REBUKE UNHOLY and p70 ends SCRYING. Placement rule
  1 applies each to its whole heading and the persistence rule carries it forward, giving p68 to PROPHECY,
  PROTECTION FROM ENERGY and PROTECTION FROM EVIL, p69 to REBUKE UNHOLY, REGENERATE, RESILIENT SPHERE
  and RESTORATION, and p70 to SCRYING, SENDING and SHAPECHANGE. No page is shared with another packet.'
scope_boundary: The bounded scope is the Primary Source Material section, the ten alphabetically sequenced
  entries from PROPHECY to SHAPECHANGE. The trailing Supporting Source Context is out of scope and contributed
  nothing.
source_summary: Ten spell entries in alphabetical order, each a heading, a tier and class line, a duration
  line, a range line and effect prose. Prophecy asks the caster's god a question and cannot be recast
  until penance is completed. Protection from Energy makes a creature immune to a chosen energy type.
  Protection from Evil penalises chaotic attackers and casters against the target and can expel a possessing
  entity on a failed check. Rebuke Unholy makes creatures opposed to the caster's alignment flee or be
  destroyed. Regenerate heals over time and regrows body parts. Resilient Sphere conjures an impassable
  sphere. Restoration ends a curse, illness or affliction. Scrying views a distant creature or place,
  harder if unfamiliar, and can be detected. Sending delivers a mental message. Shapechange transforms
  the caster into a creature bounded by level, reverting at reduced hit points.
graph_state_at_extraction: 'Read from the repository at extraction, not recalled: the canonical graph
  holds 253 registry rows and 444 edges, with 63 spell_ identities canonical and 47 CLASSIFIED_AS rows
  in production from INT-20260926-002, -003 and -004. None of the ten entries in this packet exists yet.
  The canonical edge set was loaded so every proposed row could be checked against the section 4 assertion
  key.'
classification_basis: 'Tier and casting class are extracted for every entry from its own header line and
  nothing else, using the two forms constitution section 2.4 authorizes for spells. Ten tier rows and
  eleven class rows result; Protection from Evil is the only entry naming both classes. Tiers 1, 3, 4
  and 5 are used; no entry here is tier 2.

  Two entries turn on alignment and neither produces a CLASSIFIED_AS row. Section 2.4 keeps alignment
  membership outside the graph, and the alignment facts here are not memberships anyway: they are mechanical
  inputs, so they are carried as ordinary CONSTRAINS and FEEDS_INTO rows against the canonical alignment
  identities. No CLASSIFIED_AS row in this packet targets sys_alignment or any alignment identity.'
