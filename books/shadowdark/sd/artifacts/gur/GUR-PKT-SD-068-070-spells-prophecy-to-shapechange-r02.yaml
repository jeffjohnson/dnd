  review_flag: ''
  analyst_rationale: Required by REV-GUP-PKT-SD-068-070-spells-prophecy-to-shapechange-r01-r01. The REBUKE
    UNHOLY entry on printed page 69 states that a creature failing the rebuke check by the stated margin,
    and within the caster-level bound, is destroyed rather than merely put to flight. M021 through M023
    carry the check, its threshold and the level bound, but none carries the lethal outcome, so a query
    for what causes death did not reach this spell. TRIGGERS is the cause-to-effect type and rule_death
    is canonical, already receiving the same shape from spell_cloudkill and spell_disintegrate. The failure
    margin is a magnitude and is not stored; the condition names the circumstance instead.
authored_polarity_declaration: Authored polarity appears on eleven rows and no others, each with basis
  read as invariant 15 requires, and each is a MODIFIES or CONSTRAINS row as constitution section 5 allows.
  The six CONSTRAINS rows take governs. Regenerate takes improves. Protection from Evil's two rows, Scrying's
  unfamiliar-subject row and Shapechange's reversion take worsens. No TRIGGERS row appears in this packet.
  The 21 CLASSIFIED_AS rows and the twelve FEEDS_INTO, two EXCLUDES and one GATES row carry none, since
  section 5 derives those.
polarity_direction_note: Three worsens rows deserve a word because the benefit runs opposite to the polarity.
  Protection from Evil helps its target, but the rows assert what it does to the attack roll and to the
  hostile spellcasting check, and it worsens both. Polarity is read against the thing the row modifies,
  not against whoever benefits. The same reading is already in production for every protective effect,
  and reading it the other way would make the field mean different things on different rows.
domains_touched: []
candidate_domains:
- proposed: magic
  basis: Every entry belongs to the spell machinery. Recorded as a candidate only; constitution section
    8 reserves domain promotion to an Architect Decision.
domain_boundary_questions: []
candidate_general_rules: []
candidate_general_rules_note: None proposed. The classification rows repeat two shapes across ten entries,
  but they enumerate per-entry source facts rather than instancing a rule, and the Analyst is prohibited
  from promoting a general rule.
non_edge_observations:
- id: OBS-01
  subject: magnitudes are excluded from every row
  detail: Regenerate states a healing dice expression, Rebuke Unholy a failure margin and a flight duration,
    Scrying an explicit DC, Shapechange a creature level bound and the hit point values it reverts at
    and to, and several entries a duration in rounds. None reaches a field. The one condition in this
    packet names a circumstance, that the caster's hit points are depleted, and deliberately avoids the
    number the source gives. That wording follows the correction applied to the equivalent Polymorph row
    in the previous packet, where an earlier phrasing spelled the quantity out.
- id: OBS-02
  subject: Restoration yields no mechanical row
  detail: 'Restoration ends a curse, illness or affliction. None of the three has a canonical identity,
    none is defined as a mechanic anywhere read so far, and minting one here would invent an identity
    the source does not define. Restoration therefore contributes its two classification rows and nothing
    else. This is the third entry in three packets with this shape, after Knock and Passwall, and the
    pattern is now worth naming: the rulebook repeatedly acts on things it never defines mechanically,
    and the graph has no way to represent the effect.'
- id: OBS-03
  subject: energy types and creature categories are not proposed
  detail: Protection from Energy and Rebuke Unholy both turn on categories the source names, fire, cold
    and electricity in one and demons, devils, outsiders, angels and natural creatures in the other. None
    is proposed. These are taxonomy, which section 2.4 keeps outside the graph, and no canonical identity
    exists for any of them. The rows assert the mechanical relationship, immunity to damage and selection
    of targets, without naming the members.
- id: OBS-04
  subject: the check and its threshold are carried as two rows throughout
  detail: 'Three entries resolve through a check made against the caster''s spellcasting check: Protection
    from Evil''s expulsion, Rebuke Unholy''s resistance and Scrying''s detection. Each produces two rows,
    a CONSTRAINS from rule_check and a FEEDS_INTO from rule_spellcasting_check, rather than one collapsed
    row. This applies the settlement in REV-GUP-PKT-SD-062-065-r01-r01, which required exactly that split
    for Illusion so a change to the supplying rule reaches the spell. Applied at extraction rather than
    after a correction, as it was for Magic Missile in the previous packet.'
- id: OBS-05
  subject: Rebuke Unholy's alignment rows are three, not one
  detail: The entry gives a different target set for a lawful or neutral caster than for a chaotic one.
    Rather than assert a single row against sys_alignment, which is a source-context grouping the constitution
    keeps out of classification and which would lose which alignment selects what, each of the three canonical
    alignment identities gets its own FEEDS_INTO row with aspect target selection. The three share an
    aspect and differ by source, so they remain distinct under the section 4 assertion key. Which creatures
    each alignment selects is not asserted, per OBS-03.
- id: OBS-06
  subject: Prophecy is the second spell to use Penance, not the first
  detail: 'rule_penance has been canonical since the class chapter and until now nothing pointed at it.
    Prophecy gates its own recasting on completing penance, which is a precondition, so GATES runs from
    the gate to the gated. This is worth noting because it is the kind of connection the intake exists
    to find: a rule defined in one chapter and consumed by a spell thirty pages later, invisible to anyone
    reading either page alone.'
  correction: 'Revision 1 stated this observation as ''Prophecy is the first spell to use Penance'' and
    asserted that nothing pointed at rule_penance until now. Both claims are false; see corrected_observation
    for the measured position. The observation''s point survives the correction and is strengthened by
    it: a rule defined in the class chapter is consumed by spells thirty pages later, and it is now known
    to happen twice, in Dominion on page 60 and Prophecy on page 68.'
- id: OBS-07
  subject: Resilient Sphere's own mobility is not asserted
  detail: The sphere blocks passage, which is asserted, and the caster can roll it a distance each turn,
    which is not. The second is movement of the conjured object rather than of a creature, and ex_movement
    is the creature movement rule; asserting it there would conflate two different things. Recorded rather
    than forced into the nearest node.
- id: OBS-08
  subject: Rebuke Unholy's flight outcome is still not carried
  detail: 'The entry states two outcomes for a failed check: destruction for an eligible target failing
    severely, which M048 now carries, and fleeing from the caster for a stated number of rounds otherwise.
    The second is not asserted. There is no canonical flight, fear or morale identity, and ex_movement
    is the creature movement rule rather than a compelled-movement effect, so pointing the outcome there
    would conflate two different things.

    This is recorded now because the Review''s finding was that an outcome went uncarried, and the honest
    position is that one still does, for a reason that is a missing identity rather than an oversight.
    If Reviewer or Architect considers compelled flight worth representing it needs an identity first,
    and that is not an Analyst act.'
unresolved_identity_questions:
- id: IDQ-01
  subject: whether alignment_chaotic CONSTRAINS Protection from Evil is the right direction
  detail: 'Protection from Evil penalises chaotic beings acting against the target. I asserted alignment_chaotic
    CONSTRAINS the spell, reading the alignment as bounding who the spell affects, which matches how exp_level
    bounds a target elsewhere in this packet. The defensible alternative is FEEDS_INTO, reading the alignment
    as an input selecting targets, which is exactly how the three Rebuke Unholy rows are cast in the same
    GUR. The two entries genuinely differ, one bounds and one selects, but a Reviewer may reasonably want
    a single shape for alignment across both.

    Consequence if wrong: one row changes type and the Rebuke Unholy rows are unaffected either way. Flagged
    because it is a convention question that will recur every time alignment gates an effect, and it should
    be settled once.'
architectural_escalations: []
architectural_escalation_note: None raised. Every identity uses an approved prefix, every row uses a legal
  edge type, and the 21 classification rows use only the two authorized spell forms with the exact aspects
  section 2.4 names. No new prefix, edge type, domain promotion or general rule is requested, and no CLASSIFIED_AS
  row points at an alignment identity or a sys_ axis. The recurring limit recorded in OBS-02, that the
  rulebook acts on undefined things such as curses, barriers and locks, is named for the third time and
  is left for the Architect to weigh rather than escalated from inside a packet.
completeness_statement: This revision is scoped to the single correction REV-GUP-PKT-SD-068-070-spells-prophecy-to-shapechange-r01-r01
  requires. It carries revision 1's 47 rows and 10 nodes forward unchanged and adds one row, spell_rebuke_unholy
  TRIGGERS rule_death with aspect rebuke destruction on printed page 69, for 48 rows and 10 nodes in total.
  The new row was checked against the canonical edge set for an assertion-key collision before publication;
  there is none, and it does not collide with the two existing spell rows pointing at rule_death, which
  differ in source and aspect. Revision 1's observations stand as written except OBS-06, which was factually
  wrong and is corrected under corrected_observation, and OBS-08 is added to record an outcome that remains
  uncarried for want of an identity. IDQ-01 stands unanswered. Nothing else in the packet was re-read
  or re-extracted, because the Review found nothing else wanting.
revision_reason: 'Revision 1 was independently reviewed as source-supported in all 47 rows and all 10
  node registrations, with no row or node requiring alteration. Approval was withheld for one missing
  relationship, the lethal outcome of Rebuke Unholy, and this revision adds exactly that row and nothing
  else.

  This is the second successive packet where the withheld row was an outcome the entry states but no row
  carried. The shape is worth naming: I extracted the resolution machinery of an effect, the check and
  its threshold and its bound, and did not extract what the resolution produces. Rebuke Unholy''s flight
  outcome has the same gap and is discussed in OBS-08 below.'
preservation_statement: Every one of revision 1's 47 candidate edges is carried forward unchanged, in
  order, with its original ref, and every one of its 10 candidate nodes is carried forward unchanged.
  The new row takes the next ref, M048. This revision was built by loading the published revision 1 from
  disk and appending one row, not by regenerating the packet, and the build asserts that. The Review's
  preserve_reviewed_rows and preserve_approved_node_registrations lists were checked against the result.
  The only other change is the correction recorded under corrected_observation, which alters no row.
polarity_fields_note: 'This row carries polarity inflicts with polarity_basis read, exactly as the Review
  specifies, and that is consistent with the position I took on the two previous successors rather than
  a reversal of it.

  Constitution section 5 confines author-assigned polarity to MODIFIES, TRIGGERS and CONSTRAINS with basis
  read. This is a TRIGGERS row, so the polarity is mine to author and invariant 15 requires it. The two
  earlier successors were FEEDS_INTO rows, where section 5 derives the polarity and the Analyst is prohibited
  from assigning it, which is why those fields were omitted there. Same rule, opposite outcome, because
  the edge type differs. The three canonical rows already pointing at rule_death from a spell all carry
  inflicts with basis read, so this row matches its neighbours.'
corrected_observation: 'OBS-06 of revision 1 is factually wrong and is corrected here rather than quietly
  deleted. It claimed that rule_penance had nothing pointing at it until Prophecy and that this was its
  first use by a spell. The Review''s RF-04 flagged this and I verified it against the canonical edge
  set rather than taking the flag on trust.

  Measured: six canonical rows already touch rule_penance. rule_critical_failure TRIGGERS it on printed
  page 45, it GATES rule_spellcasting_check and is RESOLVED_BY tbl_sacrifice_value on page 44, sys_alignment
  and sys_deity both FEED_INTO it on page 44, and, decisively, rule_penance GATES spell_dominion with
  aspect recasting on page 60. Dominion therefore carries the identical gate and Prophecy is the second
  spell to use it, not the first.

  The error was in the observation prose only. No row is affected: the Prophecy row targets a different
  spell, so it never collided, and the collision check I ran before publishing revision 1 passed correctly.
  What failed was that I asserted a claim about the graph''s contents from impression instead of measuring
  it, in the same artifact where I had measured everything else. The corrected reading is the more interesting
  one anyway: two spells in different chapters share one recasting gate, which is a pattern rather than
  a one-off.'
