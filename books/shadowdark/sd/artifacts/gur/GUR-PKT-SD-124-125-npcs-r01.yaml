rejected_candidates:
- text_locus: the six ancestry results and three alignment results, p124
  quoted_gist: Human, Elf, Dwarf, Halfling, Half-orc and Goblin; Lawful, Neutral and Chaotic
  why_considered: Every one of these nine results is a canonical identity by name, which is the strongest
    set of matches any table in this intake has produced. Rows from each table to each individual result
    looked available.
  rejection_reason: 'Nine rows would assert that the NPC tables select those particular ancestries and
    alignments, which is true but is already carried more economically by the two rows asserted from the
    axes. The axis is what the table selects from, and sys_ancestry and sys_alignment exist precisely
    to stand for their members; the canonical random character tables from printed pages 40 and 41 take
    the same single-row-per-axis shape rather than one row per member.

    Asserting per member would also embed the tables'' weighting, since Human occupies five of twelve
    results and Goblin one, and weighting is a magnitude no field may store. One row per axis carries
    the relationship and loses nothing expressible.'
- text_locus: the NPC AGE TABLE and NPC WEALTH TABLE bands, p124
  quoted_gist: six age bands from Child to Ancient, and four wealth bands from Poor to Extravagant
  why_considered: Both sets are named, bounded and enumerated, which is the identity-shaped pattern. Wealth
    in particular sits beside a canonical money identity, item_coin, and Poor echoes the Poor treasure
    quality from printed page 117.
  rejection_reason: Neither set has any mechanical content. An age band states nothing that any rule reads,
    and a wealth band states no amount, so item_coin has nothing to receive. This is the reasoning that
    declined the treasure quality categories on printed page 117, the danger levels on 86 and 90, and
    the light mishap results on 110, and it applies more strongly here because these bands do not even
    carry a number. The echo of Poor between the wealth and treasure tables is coincidence of vocabulary,
    not a shared identity.
- text_locus: the NPC QUALITIES TABLE, p125
  quoted_gist: twenty rows of appearance, habit and secret, including being a werewolf, having a pet basilisk,
    being a half-demon, having left the Thieves' Guild and having been a wizard's apprentice
  why_considered: Some secrets name creatures and organisations, and a wizard's apprentice brushes class_wizard.
  rejection_reason: Narrative, and the same name-collision shape measured across the last two packets.
    A wizard's apprentice in an NPC's backstory is not class_wizard, a werewolf and a basilisk have no
    identity and the Monsters chapter is unextracted, and the Thieves' Guild is an invented organisation
    with no mechanical role. No result states a check, a value or a consequence.
- text_locus: the NPC OCCUPATION TABLE, p125
  quoted_gist: a grid read on two dice giving sixteen trades from gravedigger to merchant
  why_considered: Its two-dice grid form is unlike any other table in the intake so far, which raised
    the question of whether the reading procedure itself is a mechanic.
  rejection_reason: The grid is a layout for indexing sixteen results with two dice, not a rule; nothing
    turns on it beyond finding a cell. No occupation identity exists and none of the sixteen trades has
    a mechanical role anywhere read so far. Recorded as OBS-03 because the form is novel even though the
    disposition is routine.
non_edge_observations:
- id: OBS-01
  subject: the test that separates a generator with edges from one without
  detail: 'Four consecutive packets have been registry-only or nearly so, and this one is not, which makes
    the distinguishing test worth stating for the remaining chapters. It is not whether the page has prose,
    which is how I described it on the last three packets. It is whether the table''s results are already
    identities.

    Ancestry and alignment resolve to canonical axes, so each earns one RESOLVED_BY row. Age, wealth,
    qualities and occupation resolve to descriptions, so they carry nothing. The prompt tables of the
    last three packets fail the same test for the same reason, and would have failed it even if their
    pages had carried prose. Stating it this way also predicts the remaining generators: a table whose
    column is a list of things the graph already names will yield a row, and a table of phrases will not.'
- id: OBS-02
  subject: weighting is deliberately not carried
  detail: 'The ancestry table is weighted, with Human occupying five of twelve results and Goblin one,
    and the alignment table likewise favours Lawful. Neither weighting reaches the graph, because a die
    range is a magnitude no field may store.

    Worth recording because the loss is real and a reader might not expect it. The graph will say that
    NPC ancestry is resolved by this table and not that most NPCs are human. That is a consequence of
    the single-row-per-axis shape rather than of this extraction, and asserting per result would not have
    preserved the weighting either.'
- id: OBS-03
  subject: the first two-dice grid table in the intake
  detail: 'The occupation table is laid out as a four-by-four grid read on two dice rather than as a list
    of ranges, which is a form no earlier packet has met. It changes nothing about the disposition, since
    the table is registered and carries no edge either way, but it is recorded so a later extractor meeting
    the same form knows it has been seen and treated as an ordinary named table.

    Measured for the record: this packet holds 6 named tables, 43 data rows across them and 95 text cells
    excluding each row''s die index.'
unresolved_identity_questions:
- id: IDQ-01
  subject: whether the two asserted rows should be core or optional
  detail: 'I marked both core and the question is genuine, because the 6 structurally identical rows already
    in canonical are all optional.

    Those are the random character tables on printed pages 40 and 41, and their optionality comes from
    their context: a player may simply choose an ancestry, so rolling for it is an alternative to choosing.
    Nothing on pages 124 and 125 offers an alternative. The book states no other way to determine an NPC''s
    ancestry or alignment, so these tables are not a variant of anything, which is why I read them as
    core.

    The case against is consistency of appearance: a reader asking what resolves sys_ancestry will get
    one optional row and one core row, which looks like an inconsistency until the reason is read. There
    is also a fair argument that everything in the Game Master half is advisory, which would make the
    whole page optional; I did not take that route because the page itself says nothing of the kind, unlike
    The Gauntlet on printed page 116 and the modes of play on 111, both of which declare their own optionality
    and were marked optional throughout.

    Consequence if wrong: two status fields change and no row, identity or aspect moves. Flagged because
    status is the field a reader most easily takes on trust, and because the remaining chapters hold more
    GM-side generators that will inherit whichever way this goes.'
architectural_escalations: []
architectural_escalation_note: None raised. All six identities use an approved prefix, both rows use a
  legal edge type, no row carries supersession_basis and none is an OVERRIDES, and no CLASSIFIED_AS row
  appears. IDQ-01 is a status judgement within existing rules rather than a request for a ruling.
completeness_statement: 'Both printed pages in scope were read in full at the recorded checksum: 6 named
  tables, 43 data rows and 95 text cells excluding die indexes, with no prose on either page. The packet
  yields 6 new identities and 2 rows. Two identities carry edges and four are declared registry_addition_only
  with their basis.

  Every row was checked against the 702 canonical edges for an assertion-key collision, for a shared source,
  type and target under a different aspect, and for duplicates within the patch; there are none of any,
  and no canonical row cited either page before. Both reused labels were asserted equal to the registry
  by the script. Four candidates were rejected and each is recorded with its reason, the most consequential
  being the nine individual ancestry and alignment results, which are carried by two axis rows instead.
  What is deliberately not asserted is listed as OBS-01 through OBS-03, and the single open question,
  IDQ-01, is whether the two rows should be core or optional. No assertion depends on any other ruleset.'
