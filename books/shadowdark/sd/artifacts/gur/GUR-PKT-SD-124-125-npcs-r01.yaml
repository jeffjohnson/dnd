units_note: 'Figures in this GUR name their unit explicitly, because a previous packet called data rows
  cells and was corrected. Measured by the assembling script from the claimed source: 6 named tables,
  43 data rows across them, and 95 text cells once each row''s leading die-index cell is excluded. Where
  a count appears below it says which of the three it is.'
page_attribution_basis: 'Both markers sit on headings. p124 ends the NPCS heading and p125 ends the NPC
  QUALITIES TABLE heading, and placement rule 1 applies each to its whole heading with the persistence
  rule carrying it forward. Verified against the claimed source that no marker appears inside a table
  row in this packet.

  The split therefore runs between tables rather than through one: the ancestry, alignment, age and wealth
  tables are printed page 124, and the qualities and occupation tables are printed page 125. Both asserted
  rows cite page 124.'
scope_boundary: 'The bounded scope is the Primary Source Material section, printed pages 124 and 125:
  6 named NPC generation tables and no prose whatever. The trailing Supporting Source Context is out of
  scope.'
source_summary: Six NPC generation tables with no accompanying prose. Ancestry rolls one of the six ancestries.
  Alignment rolls one of the three alignments. Age gives one of six bands from child to ancient. Wealth
  gives one of four bands from poor to extravagant. Qualities gives an appearance, a habit and a secret
  in three columns. Occupation is a grid read on two dice, giving one of sixteen trades.
graph_state_at_extraction: 'Read from the repository at extraction, not recalled, and every figure here
  is computed by the assembling script from the canonical files and the claimed source.

  The canonical graph holds 330 registry rows and 702 edges, and 0 rows cite printed pages 124 or 125,
  so nothing in this span has been extracted before. No NPC, age, wealth, occupation or quality identity
  exists. The registry holds 48 tbl_ identities and 27 identities overall carry no edge.

  Decisively for this packet, canonical already holds 6 RESOLVED_BY rows running from a sys_ axis to a
  random table, all from printed pages 40 and 41 and all at status optional. Those were read before anything
  here was written, because two of this packet''s tables have the same shape and the comparison decides
  both the aspect and the status; see IDQ-01.'
two_kinds_of_table_note: 'This packet breaks the registry-only run of the last three, and the reason is
  a real distinction rather than a change of approach. Six tables sit on these two pages and they are
  not all the same kind of thing.

  Two of them resolve to identities the graph already holds. The ancestry table''s results are the six
  canonical ancestries and the alignment table''s three results are the three canonical alignments, so
  each selects from an existing axis and each earns a RESOLVED_BY row from that axis. This is exactly
  the shape canonical already carries 6 times from printed pages 40 and 41, where the random character
  tables resolve the same two axes plus class, deity and language.

  The other four resolve to nothing. Age, wealth, qualities and occupation each produce a descriptive
  band or a phrase, and no identity exists for an age, a wealth level, a personal quality or a trade.
  They are registered and carry no edge, exactly as the four prompt tables of the last three packets were.

  So the same page yields both kinds, and what separates them is whether the table''s output is already
  an identity. That is a sharper test than the page-level one I have been applying, and it is worth stating
  because the remaining chapters hold more generators.'
