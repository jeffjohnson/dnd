rejected_candidates:
  - text_locus: 'the family introduction (paragraph 1), p210'
    quoted_gist: >-
      Dragons are winged, formidable reptiles who carry the ancient magic of the land in their blood.
      Evil dragons are vain and cunning, while good dragons are noble and sagacious. They can live for
      many thousands of years.
    why_considered: 'Checked for family taxonomy, alignment restrictions, or dragon-wide trait mechanics.'
    rejection_reason: 'Narrative lore and descriptive framing. No cross-mechanic dependency exists.'
  - text_locus: 'lair treasure rule (paragraph 2), p210'
    quoted_gist: 'A dragonʼs lair has its level x 100 in gold pieces and 1d4 items from the 80-100 range on its treasure table.'
