non_edge_observations:
  - id: OBS-01
    subject: Lair treasure rule operates as GM procedural and loot guidance rather than a system rule dependency
    detail: >-
      The family introduction specifies that a dragon's lair contains level x 100 in gold pieces and
      1d4 items from the 80-100 range on its treasure table. Under Constitution 2.4 and 2.5, this
      procedural advice describes encounter environment composition and loot quantities rather than
      cross-mechanic relationships between gameplay rules.
  - id: OBS-02
    subject: Water Spout flinging creatures 2d100 feet echoes Djinni Whirlwind
    detail: >-
      Water Spout on Dragon, Sea flings targets 2d100 feet in a random direction on a failed DC 15
      STR check, echoing the 2d100 feet random flinging in Djinni's Whirlwind (p209). This confirms
      that recurring displacement figures are narrative magnitude expressions on creature attack
      loci rather than invocations of a general systemic forced-movement rule.
  - id: OBS-03
    subject: Elemental blood traits specify creature damage immunities
    detail: >-
      Stormblood (Dragon, Desert), Fireblood (Dragon, Fire), and Frostblood (Dragon, Frost) grant
      immunities to electricity, fire, and cold respectively. Like Impervious on fiends and golems,
      these traits operate entirely within each creature's stat block under the locus rule.

