source_summary: >-
  The DRAGONS family: two introductory paragraphs describing dragons as winged reptiles carrying ancient
  magic in their blood, and setting their lair treasure rule (level x 100 in gp and 1d4 items from the
  80-100 range on its treasure table), followed by six dragon stat blocks across two pages. On page 210:
  Dragon, Desert carries Stormblood, Lightning Breath, and Mirage; Dragon, Fire carries Fireblood and
  Fire Breath. On page 211: Dragon, Forest carries Animate Plants and Poison Breath; Dragon, Frost
  carries Frostblood and Ice Breath; Dragon, Sea carries Steam Breath and Water Spout; Dragon, Swamp
  carries Smog Breath.

