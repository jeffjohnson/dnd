non_edge_observations:
  - id: OBS-01
    subject: the seven deferrals this packet closes, and why none is restated
    detail: >-
      Stout rolls hit points with advantage, Grit grants it on checks to overcome an opposing force, Thievery grants it on trained tasks, a thief talent grants it on initiative, a priest and a wizard talent each grant it on casting one chosen spell, and the crowbar grants it on prying. Chainmail and plate mail impose disadvantage, and the Blind/Deafen spell imposes it on tasks needing a lost sense.
            Every one of those rows asserts the effect on the mechanic it touches and is already canonical or published. This packet asserts what advantage and disadvantage themselves do to a check. The two layers are complementary rather than duplicative: a query asking what Grit does still reaches the check directly, and a query asking what advantage means now has an answer. No row here names any of those nine sources, so no assertion-key collision arises.
  - id: OBS-02
    subject: the example task lists are illustrative and are not extracted
    detail: >-
      Page 80 lists four example tasks under each of the six stats, twenty-four in all, from smashing open locked doors to fooling onlookers with sleight of hand. None is a named mechanic with its own identity; each is a sentence describing a kind of action. The mechanical content of the page is that a stat governs a class of task, which M007 through M012 carry, and the lists are how the source illustrates it. The page's note distinguishing Intelligence from Wisdom is guidance for the GM in the same way.
  - id: OBS-03
    subject: the random-outcome procedure is registered without an edge
    detail: >-
      The d6 decider is a named procedure with its own heading, and it is proposed. It relates a random chance to a die roll and names no second mechanic this graph holds: the thing being decided is left open by the source, whose own example is whether a dropped torch goes out. The outcome bands are magnitudes. It is therefore a registry addition only, marked and given its basis.
  - id: OBS-04
    subject: consequences naming mechanics defined elsewhere
    detail: >-
      The natural 20 rule says an attack is a critical hit and points at the Combat chapter on printed page 89; the natural 1 rule says the attack might strike an ally. Neither critical hit nor striking an ally is an identity yet, and printed page 89 is not claimed. M004 and M005 assert the part that reaches an existing identity, the automatic hit and miss on the attack roll, and the rest waits for the Combat packet.
  - id: OBS-05
    subject: when to roll, and the four standard difficulties, are not extracted
    detail: >-
      Page 81 says a check is called for when failure has a negative consequence, the action requires skill, and there is time pressure, and that a character usually succeeds at what they are trained to do without rolling. These are conditions for invoking the check rather than dependencies between two mechanics; negative consequence, skill and time pressure are not identities. The four standard difficulty values are magnitudes, and that the difficulty class feeds the check is already canonical from printed page 9, so a row here would collide under the section 4 assertion key.
  - id: OBS-06
    subject: magnitudes deliberately excluded
    detail: >-
      The pages carry the two natural die values, the d6 decider's outcome bands, the luck token limit of one at a time, the per-session award ranges, and all four standard difficulty values. All are die values, thresholds or counts, excluded by constitution section 1 and invariant 11. They remain in the immutable claimed packet. No aspect contains a digit.

unresolved_identity_questions:
  - id: IDQ-01
    subject: how the natural die results relate to the canonical spellcasting criticals
    detail: >-
      rule_critical_success and rule_critical_failure are canonical, proposed from printed page 45 where they are defined as what happens on a natural 20 or 1 on a spellcasting check. This page defines the natural results generally, for any d20 roll, and gives their effect on an attack.
            The Analyst proposed rule_natural_twenty and rule_natural_one rather than reusing the canonical pair, because the two are not obviously the same thing: the page 45 identities are outcomes of one specific check with spell-specific consequences including mishaps and penance, while these are properties of a die result that apply to attacks as well. Merging them silently would assert that a critical hit and a critically failed spell are one mechanic.
            Consequence if wrong: if Reviewer judges them the same, these two nodes are withdrawn and M004 and M005 repoint to the canonical pair, which is a two-row change and no re-reading of source. If they are genuinely distinct, a later Decision may want a relationship between them; the vocabulary offers none that is obviously right, which is why none is asserted.

