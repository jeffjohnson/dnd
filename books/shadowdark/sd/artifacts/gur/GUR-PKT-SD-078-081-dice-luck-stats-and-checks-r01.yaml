page_attribution_basis: >-
  Markers resolve through the Pandoc AST rather than positionally, each a plain marker ending a
  heading, which placement rule 1 applies to the whole heading. Every subsection carries no marker of
  its own and takes its page from the persistence rule, so each row below is cited to the page of the
  subsection it is drawn from rather than to the page of the nearest heading above it in the file.

scope_boundary: >-
  The bounded scope is the Primary Source Material section, printed pages 78 through 81. Any other
  page the parser resolves lies inside the trailing Supporting Source Context, is claimed by another
  packet, and contributed nothing here.

source_summary: >-
  Printed page 78 is ROLLING THE DICE, defining advantage, disadvantage, their cancellation, the two natural die results and a general random-outcome procedure. Page 79 defines the luck token. Page 80 gives example tasks for each of the six stats. Page 81 is MAKING CHECKS, saying when a check is called for, giving four standard difficulty values and defining a contested check. This summary is orientation only; every assertion below cites its page.

extraction_posture: >-
  This packet closes the longest-running deferral in the intake. Seven earlier packets asserted that something improves or worsens a check or a roll while recording that the mechanism, advantage or disadvantage, was defined elsewhere and could not be named. Printed page 78 is that locus, so both are proposed here and given their effect rows. Those seven earlier assertions are not restated: each is a different source's effect on a different mechanic, correctly asserted from its own locus, and repeating them here would duplicate them at a shallower grain.

