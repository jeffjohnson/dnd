completeness_statement: 'Every printed page in scope was accounted for at the recorded checksum, which
  the script asserts against the packet manifest before parsing: 1 named table, 50 data rows, 0 sentences
  of prose on pages 184 and 185, and 1 steward-classified page at 186 that supplies no content. The packet
  yields 1 new identity and 4 rows, reusing 4 canonical identities whose labels the building script asserted
  equal to the registry. The proposed table carries edges, so nothing is left unattached.


  Every row was checked against the 847 canonical edges for an assertion-key collision, for a shared source,
  type and target under a different aspect, and for duplicates within the patch; there are none of any,
  and no canonical row cited any page in this span before. The script locates the supporting cell for
  each row and asserts its page.


  10 candidates were rejected and each is recorded with its reason. One of them, the Wizards and Thieves
  challenge, is a contestable judgement and is flagged as such with the exact row it would become if Reviewer
  reads it the other way. The largest deliberate loss remains the creature content. 7 of the 10 identities
  the first two scans reach are spurious collisions, and two identities the page needs are reachable by
  no scan at all; both facts are asserted by the script rather than observed. No assertion depends on
  any other ruleset.'
spell_casting_note: 'M003 is the second TRIGGERS row into a spell in the graph, so both limbs of the settled
  test are shown rather than asserted.


  The reference. The cell at index 26 italicises the spell name, which the chapter''s measurement has
  established as this book''s convention for pointing at an identity, and the script asserts that this
  is the only emphasised cell on the page. spell_charm_person is canonical from printed page 57 with 1
  row, a CONSTRAINS from exp_level on target level, so the identity and its defining locus are both settled
  elsewhere and nothing is renamed here.


  The occurrence. A practicing wizard targets a PC with the spell. That is a casting directed at a character,
  which is what the ward at printed page 158 stated and what the crone''s love potions at 174 did not.


  The type and polarity. TRIGGERS, because the encounter causes the casting to occur; FEEDS_INTO would
  say the table supplies an input to the spell and MODIFIES would say it changes how the spell works,
  both false. Polarity neutral at basis read, following the web row and the ambush surprise at 173: spell_charm_person
  carries its own directed consequences at its own locus, and what this cell states is that a casting
  happens.'
trap_test_note: 'M002 rests on the cell at index 22, where a PC steps on a prank rune and their shoes
  are glued down. The three-element trap test is applied element by element, because two trapdoors failed
  it in the three preceding packets.


  A stated operation: the rune acts when stepped on and the cell says what it does. The chained trapdoor
  at printed page 179 failed here, since nothing happened at all.


  Non-creature agency: a rune is not a creature, so the row belongs to the table rather than to an unextractable
  monster.


  Deliberately set: a prank rune is placed by someone to catch someone. The trapdoor falling open at printed
  page 180 failed here, since a cellar door coming open is architecture rather than a device.


  The row is FEEDS_INTO rule_traps on aspect encounter trap, the settled shape with 8 canonical rows already
  using it, and Builder derives neutral. No magnitude is stored; the cell states none in any case.'
treasure_reach_note: 'M004 rests on the hundredth cell at index 49, where an archmage entrusts a random
  magic item to the characters. All three elements of the settled test are present and this is the cleanest
