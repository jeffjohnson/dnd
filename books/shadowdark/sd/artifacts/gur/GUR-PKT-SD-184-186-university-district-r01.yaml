units_note: 'Figures name their unit. Measured by the building script from the claimed source: 1 named
  table, 50 data rows keyed to a hundred-sided roll, 0 sentences of prose, 23 rows on printed page 184
  and 27 on 185, and 1 classified page carrying no rows. The script asserts the recorded packet checksum
  against the claimed file before reading a single cell.'
page_attribution_basis: 'This packet spans three printed pages where the chapter has used two, so the
  attribution is set out in full.


  The p184 marker sits on the UNIVERSITY DISTRICT heading under placement rule 1. The p185 marker sits
  in the last cell of the row keyed 46-47, and acceptance test 3 applies a table-row marker to the whole
  row, so that row is page 185 and persistence carries 185 to every row after it. The script locates the
  marker by row index, asserts it is in the row''s final cell, and derives each row''s page: the marker
  is at index 23, 23 rows are page 184 and 27 are 185.


  The p186 marker is an empty fenced Div bearing the class full-page-artwork and follows the table. The
  script asserts that no table row rests on it, so the classified page contributes no citation and no
  row cites page 186. See page_class_note.'
page_class_note: 'This is the first classified page in the chapter, so the handling is stated rather than
  assumed, and it is read from the Pandoc AST rather than matched in raw text.


  The AST carries exactly one class-bearing block in the whole file: an empty fenced Div with identifier
  p186 and the single class full-page-artwork, which is a member of the closed SOURCE_MARKDOWN 1.8 vocabulary
  admitted by DEC-2026-0084. The script asserts the identifier, the exact class list, that the Div is
  empty, and that the claimed manifest records the same classification.


  The class is steward-authored, page-local intake metadata. It creates no node, edge, domain, citation
  or evidence of mechanics, and it does not carry to a later page. Printed page 186 remains inside the
  declared span and inside completeness accounting; the Analyst owes no extraction for it and its emptiness
  is a steward declaration, not a finding of mine.'
scope_boundary: 'The bounded scope is the Primary Source Material section, printed pages 184 to 186: one
  named table of 50 rows, no prose, and one classified page. The Supporting Source Context appends the
  random encounter procedure from printed pages 112 and 113 and the monster attributes page from 189.
  Both are out of scope and no row cites either.


  That exclusion matters here because the appended encounter procedure is the very rule this table resolves.
  Its content belongs to PKT-SD-112-113, which is already integrated, and re-asserting it would duplicate
  canonical rows from a repeated passage.'
source_summary: 'A single hundred-sided encounter table for a settlement''s university district, 50 rows,
  with no procedure, no heading prose and no instructions. The results are magical academia going wrong:
  a drunk apprentice summoning a demon, two professors duelling with spells, a spellbook flapping out
  of a window, a statue animating in a frenzy. Four cells carry rows, and one of them is the second spell-casting
  row the graph has ever had. This is the last packet of the encounters chapter.'
graph_state_at_extraction: 'Read from the repository at extraction, not recalled, and every figure here
  is computed by the building script from the canonical files and the claimed source.


  The canonical graph holds 423 registry rows and 847 edges, and 0 rows cite printed page 184, 185 or
  186, so nothing in this span has been extracted before. The registry holds 123 tbl_ identities and 0
  monster_ identities, the latter being the figure that governs how much of this table is extractable
  at all.


  rule_encounter carries 31 rows, of which 23 are RESOLVED_BY and 21 name a location encounter table.
  This table is the last of that set. The script asserts that the proposed table id is absent from the
  registry before using it.'
chapter_disposition_note: 'The disposition for this chapter was argued in full at PKT-SD-142-143 and is
  applied here rather than re-argued: no procedure identity, no location identity, and no creatures or
  named characters, because the registry holds 0 monster_ identities and a creature''s defining locus
  is its stat block.


  The district-parent question settled at PKT-SD-178-179 recurs for the third time. tbl_settlement_university_district
  is canonical with 1 row and is not this table''s parent; UNIVERSITY DISTRICT is the location axis naming
  which of the 21 location tables this is.


  This packet closes the chapter, so the shape of the whole is worth one line: 21 location tables were
  canonical before it and this is the 22nd packet of the claimed set, every one of them resolving the
  same rule_encounter identity that has been canonical since printed page 112.'
name_match_measurement_note: 'The cells were matched against the whole registry by script, not scanned
  by eye. Three scans are run: scan 1 matches a whole registry label on word boundaries, scan 2 matches
  every stemmed token of a label, scan 3 flags a cell sharing a distinctive token of a multi-token label
  and is deliberately noisy.


  Scan 1: 8 of 50 cells match, over these identities: class_wizard, item_armor, item_magic_item, lang_giant,
  spell_charm_person, spell_light. Scan 2: 10 cells match, adding rule_encounter, rule_taverns, spell_fly,
  spell_wizard_spells. Scan 3: 20 cells match, adding 64 identities no other scan reaches, none of which
  is a real reference.


  Of the 10 identities the first two scans reach, 2 are real references that carry a row, spell_charm_person
  and item_magic_item. rule_encounter is a real mention deliberately not given a row of its own. The remaining
  7 are ordinary English colliding with an identity label: class_wizard, item_armor, lang_giant, rule_taverns,
  spell_fly, spell_light, spell_wizard_spells. class_wizard matches four cells and not one is the class;
  a university district is full of wizards. spell_fly and rule_taverns both match a tavern called the
  Flying Snail, lang_giant matches giant rats, item_armor animated armour suits and spell_light a red
  light.


  Two identities this page needs are reachable by no scan, and the script asserts both rather than my
  noticing them. rule_traps is unreachable because the cell says rune and never says trap, and it carries
  M002. rule_wizards_and_thieves is unreachable because the cell writes the title with an ampersand where
  the registry label spells out and, so no token of the label matches; it carries no row, for the reason
  in rejected_candidates. That is a fifth and sixth distinct scan blind spot in four packets; see OBS-03.'
