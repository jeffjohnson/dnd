authored_polarity_declaration: '1 of the 4 rows carries authored polarity: M003, a TRIGGERS, which constitution
  section 5 reserves. Its value is neutral at basis read, following the ward casting at printed page 158
  and the ambush surprise at 173 for the same reason: the target carries its own directed consequences
  at its own locus, and what this cell states is that a casting happens, not whether it is good for anyone.
  Canonical holds 5 TRIGGERS rows with a tbl_ source and 2 of them are neutral, the other three being
  damage rows that inflict.


  The remaining 3 rows are RESOLVED_BY or FEEDS_INTO, neither reserved, so Builder derives governs and
  neutral respectively.'
