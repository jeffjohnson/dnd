rejected_candidates:
- text_locus: the Wizards and Thieves champion, p184
  quoted_gist: the school's Wizards and Thieves champion challenges a PC
  why_considered: 'This is the one judgement call on the page and a reviewer could reasonably differ,
    so it is set out at length. rule_wizards_and_thieves is canonical with 7 rows, an ALTERNATIVE_TO rule_check
    on wager resolution and four RESOLVED_BY stake tables, so unlike the dancing and drinking contests
    declined at printed page 178 the thing named here has a full procedure in the graph. No scan reaches
    it: the cell writes the title with an ampersand and the registry label spells out and, so the reference
    was found by reading the cell.'
  rejection_reason: 'The cell does not state that the game is played. It states that a person holding
    a title challenges a PC, and the registry noun appears attributively inside that title rather than
    as something that happens. The two TRIGGERS rows this chapter has earned both state an occurrence
    outright: a ward casts web on the characters, and kobolds surprise them. A challenge is an invitation
    that the cell never resolves, and no wager, stake, pot or check is named.


    Recorded as the packet''s one contestable decline. If Reviewer reads the challenge as stating an occasion
    of play, the row would be the table TRIGGERS rule_wizards_and_thieves at neutral and basis read, and
    the correction belongs in an exact_corrections mapping rather than in a re-extraction.'
- text_locus: the scholar's ruby and the fortune teller's fee, p185
  quoted_gist: a scholar offers a ruby as a prize for answering a riddle, and a witch tells fortunes from
    a stall for a stated sum
  why_considered: The hundredth cell on this page does earn a treasure row, so the page proves the category
    and route are live; these two were tested against the same three-element test rather than waved away.
  rejection_reason: Neither names a canonical category. A ruby is not an identity in the registry and
    its defining locus would be the unclaimed treasure chapter, which is the same ground that declined
    Brak's Cube at printed page 179; a prize for a riddle is also conditional on something the cell does
    not resolve. The fortune teller's fee is a price and a magnitude, declined on the same ground as the
    priest's offered coin at printed page 181 and the merchant's per-beetle payment at 175.
- text_locus: the mixed potions and the alchemical reagents, pp184 and 185
  quoted_gist: a shifty man sells cheap potions that are all mixed, and the Wandering Merchant sells caustic
    alchemical reagents
  why_considered: Potions recur across this chapter and the merchant appears in most of its pages.
  rejection_reason: There is no potion or reagent identity in the registry and none may be minted from
    an encounter cell; the magic item chapter that would define one is unclaimed. Both cells are also
    sales, which OBS-02 of the swamp packet placed below the availability line, and neither states an
    effect.
- text_locus: the rival university, p185
  quoted_gist: students from a rival university vandalize a revered statue
  why_considered: Scan 3 flags this cell for rule_rival_crawlers, which carries 20 inbound rows and has
    appeared in almost every packet of this chapter.
  rejection_reason: It is the adjective rival and nothing more. A rival university is not a rival crawling
    party; no crawlers appear on this page at all, which makes it the first table in the chapter with
    no rival-crawler row. Recorded because the scan flag is exactly the kind that gets waved through.
- text_locus: the spell-shaped cells that name no spell, pp184 and 185
  quoted_gist: two professors' feud boiling over into spell-slinging, the sky raining acid because a spell
    went wrong, a wizard summoning a marilith, a professor summoning a vrock and losing control, and a
    magic cauldron disgorging rats
  why_considered: One cell on this page names a spell and earns a row, so the others were tested against
    the same standard on the same page rather than dismissed.
  rejection_reason: None of them names a spell. The graph has an identity for each named spell and none
    for a spell in general, which is the disposition applied to the goblin mage's offered spell at printed
    page 175. Summoning, spell-slinging and a spell gone wrong are descriptions of magic happening, not
    references to a mechanic the graph holds. The page's single italicised term is the one that earns
    M003; the script asserts that 1 cell is emphasised and that it is that one.
- text_locus: the creature and named-character results, pp184 and 185
  quoted_gist: a marilith, purple stingbats, giant rats, gargoyles, kobolds, a cockatrice, a naga, a vrock,
    an oni in disguise, Old Rolf the animating wyvern statue and Professor Krall with his zombies
  why_considered: Two are individually named and several carry a type in apposition, which is the shape
    that has prompted the question in each packet of this chapter.
  rejection_reason: A creature's defining locus is its stat block in the unextracted monster chapter and
    the registry holds 0 monster_ identities. This is the 22nd and final packet of the chapter to record
    the same disposition; the monster chapter begins at the next operator sequence.
- text_locus: the campus incidents that state no mechanic, pp184 and 185
  quoted_gist: tentacles through a sewer grate, a hit man on a stage, burning ash from a tower window,
    a librarian handing over a strange book, a spellbook flapping away, an occult ritual the PCs stumble
    into and an animated owl statue following them
  why_considered: Four cells on this page do state an outcome for a canonical rule, so the rest were tested
    against that same standard on the same page.
  rejection_reason: None of them names a rule the graph holds and says what happens to it. Burning ash
    states no damage, the ritual states no effect, and the rest are description. This is the same reading
    applied throughout the chapter.
- text_locus: the classified page, p186
  quoted_gist: an empty fenced Div declaring printed page 186 full-page artwork
  why_considered: It is inside the declared span, so its treatment has to be stated rather than left implicit;
    it is the chapter's first classified page.
  rejection_reason: It is steward-authored intake metadata and carries no source content. SOURCE_MARKDOWN
    1.8 is explicit that a page class is never a node, edge, domain, citation or evidence of mechanics.
    No row cites page 186 and the script asserts that no table row rests on it. See page_class_note; this
    is not an uncovered-page obligation.
- text_locus: the two-encounter instruction, p185
  quoted_gist: one result instructs the reader to roll two encounters and combine the results, rerolling
    that result if it comes up again
  why_considered: It is the only instruction on the page, and the stem scan flags it as matching rule_encounter.
  rejection_reason: The match is on the plain word encounters in the instruction's own text; M001 already
    carries the table's relation to rule_encounter. Declined in the same form in each of the 21 preceding
    chapter packets, and this is the last of them.
- text_locus: the appended random encounter procedure and monster attributes, out of scope
  quoted_gist: the printed page 112 and 113 encounter procedure and the printed page 189 monster attributes
    page
  why_considered: Both are in the file and the first is the rule this table resolves.
  rejection_reason: Both are Supporting Source Context, outside the bounded scope. PKT-SD-112-113 is already
    integrated, so extracting from it would duplicate canonical rows and cite pages outside this packet's
    range.
non_edge_observations:
- id: OBS-01
  subject: the second spell-casting row the graph has ever had
  detail: 'M003 is only the 2nd TRIGGERS row into a spell; canonical holds 1, the ward casting web at
    printed page 158. The occurrence-versus-reference split has been tested four times since and failed
    on one limb or the other every time: the crone''s love potions at 174 had italics and no casting,
    the augury at 181 had an event and no marked reference, the teleporting lich at 182 the same, and
    the blessing at 181 had neither.


    This cell has both. A practicing wizard targets a PC with the spell, which is a casting stated outright,
    and the source italicises the name, which is its convention for pointing at an identity. The script
    asserts that exactly 1 cell on the page is emphasised and that it is this one, so the typographic
    half of the argument is measured rather than recalled.


    Recorded because the test has now produced one row from six candidate cells across five packets, and
    that ratio is the evidence that it is doing work rather than rubber-stamping.'
- id: OBS-02
  subject: the first trap cell in the chapter to pass all three elements
  detail: 'Two trapdoors were declined in the three preceding packets, the chained one at printed page
    179 for stating no operation and the one falling open at 180 for not being deliberately set. The prank
    rune at index 22 passes all three elements: a character steps on it and their shoes are glued down,
    which is a stated operation; a rune is not a creature; and a prank rune is placed on purpose.


    The third element is the one that usually fails, because decaying architecture and natural hazards
    are not set by anyone. It is worth noting that the word prank is what carries it: the rune exists
    to catch someone.


    The row is FEEDS_INTO rule_traps on aspect encounter trap, which is the settled shape for this chapter
    with 8 canonical rows already using it.'
- id: OBS-03
  subject: six ways for the scans to return nothing, over four packets
  detail: 'The script asserts that no scan reaches rule_traps or rule_wizards_and_thieves on this page.
    rule_traps carries M002.


    The catalogue is now: a partial multi-word name at PKT-SD-178-179, fixed by adding scan 3; an over-stemmed
    short label at PKT-SD-180-181; an abbreviation at PKT-SD-182-183; a synonym here, where the cell says
    rune and the identity is Traps; and an ampersand here, where the cell writes Wizards and Thieves with
    the symbol and the label spells the word. The sixth, from PKT-SD-180-181, is a single capital letter
    standing for an alignment.


    No further scan is proposed. A synonym is not reachable by string matching at all, and that is the
    point: the scans narrow attention and have never been the reading. What has changed across these four
    packets is that the script now asserts which targeted identities no scan reached, so the claim that
    every cell was read is checkable rather than merely stated.'
- id: OBS-04
  subject: the chapter closes
  detail: 'This is the last packet of the encounters chapter. With it, 22 location encounter tables resolve
    rule_encounter, every one of them a further resolver of a rule canonical since printed page 112 rather
    than a procedure of its own, which is the disposition argued at PKT-SD-142-143 and never reopened.


    The chapter''s recurring shapes were: a rival-crawler result on almost every page, a treasure result
    in most hundredth slots, a trap result on eight pages, and a handful of environmental cells that stated
    an effect on a canonical rule. This page is the first with no rival-crawler row.


    The next operator sequence begins the monster chapter. That chapter defines the monster_ identities
    whose absence has been the single largest deliberate loss in every packet of this one, so the declines
    recorded here are recoverable later by an Architect-directed pass rather than lost; nothing in this
    chapter asserted a creature relationship that a stat block would contradict.'
