units_note: 'Figures name their unit. Measured by the building script from the claimed source: 1 named
  table, 50 data rows keyed to a hundred-sided roll, 0 sentences of prose, 23 rows on printed page 180
  and 27 on 181. The script asserts the recorded packet checksum against the claimed file before reading
  a single cell.'
page_attribution_basis: 'The page break falls inside the table, as it has in every packet of this chapter.
  The p180 marker sits on the TEMPLE DISTRICT heading under placement rule 1. The p181 marker sits in
  the last cell of the row keyed 46-47, and acceptance test 3 applies a table-row marker to the whole
  row, so that row is page 181 and persistence carries 181 to every row after it.


  The script locates the marker by row index rather than by eye, asserts that it is in the row''s final
  cell, and derives each row''s page from it: the marker is at row index 23, 23 rows are page 180 and
  27 are 181. Each submitted row is cited to the page of the cell it rests on, and the script asserts
  that placement from the located cell index rather than from my reading.'
scope_boundary: 'The bounded scope is the Primary Source Material section, printed pages 180 and 181:
  one named table of 50 rows and no prose. The Supporting Source Context appends the random encounter
  procedure from printed pages 112 and 113 and the monster attributes page from 189. Both are out of scope
  and no row cites either.


  That exclusion matters here because the appended encounter procedure is the very rule this table resolves.
  Its content belongs to PKT-SD-112-113, which is already integrated, and re-asserting it would duplicate
  canonical rows from a repeated passage.'
source_summary: 'A single hundred-sided encounter table for a settlement''s temple district, 50 rows,
  with no procedure, no heading prose and no instructions. Almost every result is religious spectacle
  and street crowd: an exorcism expelling an erinyes, penitents in chains carrying a high priest, a monk
  setting himself alight, a man turning into a fire elemental mid-rapture. One cell names a rival crawling
  group and carries the packet''s only dependency row. Several cells name a deity, a saint or a spell-shaped
  effect, and none of those earns anything.'
graph_state_at_extraction: 'Read from the repository at extraction, not recalled, and every figure here
  is computed by the building script from the canonical files and the claimed source.


  The canonical graph holds 421 registry rows and 838 edges, and 0 rows cite printed page 180 or 181,
  so nothing in this span has been extracted before. The registry holds 121 tbl_ identities and 0 monster_
  identities, the latter being the figure that governs how much of this table is extractable at all.


  rule_encounter carries 29 rows, of which 21 are RESOLVED_BY and 19 name a location encounter table.
  The script asserts that the proposed table id is absent from the registry before using it.'
chapter_disposition_note: 'The disposition for this chapter was argued in full at PKT-SD-142-143 and is
  applied here rather than re-argued. In short: no procedure identity, because the table''s own title
  names rule_encounter and that rule has been canonical since printed page 112, so this table is a further
  resolver of an existing rule rather than evidence of a new one. No terrain or district identity. No
  creatures and no named characters, because the registry holds 0 monster_ identities and a creature''s
  defining locus is its stat block, not a line in an encounter table.


  The district question settled at PKT-SD-178-179 recurs and is answered the same way. tbl_settlement_temple_district
  is canonical with 1 row, and it is not this table''s parent: the heading TEMPLE DISTRICT is the location
  axis naming which of the 19 location tables this is, exactly as the artisan and market districts were
  handled at their own pages.


  What remains is the small set of cells that state a mechanic or name a canonical procedure, and those
  are found by measurement rather than by reading. On this page that set has one member.'
name_match_measurement_note: 'The cells were matched against the whole registry by script, not scanned
  by eye. Three scans are run, the third added at PKT-SD-178-179 after it was shown that the first two
  are both blind to a cell naming part of a multi-word identity. Scan 1 matches a whole registry label
  on word boundaries; scan 2 matches every stemmed token of a label; scan 3 flags any cell sharing a distinctive
  token of a multi-token label and is deliberately noisy.


  Scan 1: 10 of 50 cells match, over these identities: alignment_chaotic, class_priest, deity_gede, ex_movement,
  rule_turn, spell_augury, spell_light. Scan 2: 15 cells match, adding rule_encounter, rule_falling, rule_rival_crawlers,
  weapon_dagger. Scan 3: 30 cells match on a partial label, adding 53 identities no other scan reaches;
  it is the only scan that recovers deity_saint_terragnis, from a cell that abbreviates Saint Terragnis
  to St. Terragnis, and deity_madeera_the_covenant, from the Font of Madeera. Neither earns a row, but
  neither is a collision either, and the first two scans could not see them.


  Of the 11 identities the first two scans reach, 1 is a real reference that carries a row, rule_rival_crawlers.
  alignment_chaotic, deity_gede, deity_madeera_the_covenant, deity_saint_terragnis, rule_encounter, spell_augury,
  weapon_dagger are real mentions deliberately not given a row of their own, for the reasons in rejected_candidates.
  The remaining 5 are ordinary English colliding with an identity label: class_priest, ex_movement, rule_falling,
  rule_turn, spell_light.


  class_priest matches six cells and not one of them is the class; a temple district is full of priests.
  spell_light matches a burst of light and a monk lighting himself on fire, rule_turn matches two cells
  where a person turns into something, rule_falling a man falling down in rapture and a trapdoor falling
  open, and ex_movement the sentence-initial word Movement. alignment_chaotic is counted as a real mention
  rather than a collision: holy water that burns the chaotic does mean the alignment.


  One real reference is reachable by no scan, and the reason is a defect in the stemmer worth recording
  rather than hiding. The hundredth cell offers a rare blessing; spell_bless is canonical. The stemmer
  strips the trailing s from Bless and the trailing ing from blessing, so the two never meet, and the
  label is one token so scan 3 skips it. The script asserts both facts rather than asserting that no match
  exists. It was found by reading the cell. See OBS-02.'
