rejected_candidates:
- text_locus: the uttered augury, p181
  quoted_gist: a commoner's eyes turn white and she utters an augury
  why_considered: 'spell_augury is canonical and the whole-label scan matches this cell exactly. Canonical
    holds 1 TRIGGERS row into a spell, the ward casting web at printed page 158, and this looked like
    the second: unlike the crone''s love potions declined at printed page 174, an event actually occurs
    here.'
  rejection_reason: 'The reference is not made. The occurrence-versus-reference split settled across printed
    pages 158 and 174 has two limbs and this cell fails the other one from the polymorph decline. There
    the spell name was italicised, which is this book''s reference convention, and no casting occurred;
    here a casting-shaped event occurs and the name is bare. The script measured the convention across
    this chapter''s claimed tables: web and polymorph are italicised where the source means the spell,
    and this table emphasises 0 cells in total. An augury with an indefinite article and no emphasis is
    the ordinary English word for an omen, which is exactly what a commoner in a trance produces. Reading
    it as the priest spell would be my inference. spell_augury carries 0 canonical rows, so nothing about
    the graph''s current shape argues the other way either.'
- text_locus: the rare blessing in the hundredth slot, p181
  quoted_gist: a high priest selects a PC to receive a rare blessing
  why_considered: spell_bless is canonical. The hundredth slot is where this chapter's boon sits, and
    a high priest conferring something on a named PC is as close to an event as the page gets.
  rejection_reason: A blessing is not the Bless spell. The cell does not name a spell, does not italicise,
    and states no effect, no duration and no check; spell_bless carries 0 canonical rows, so there is
    no existing shape to attach to either. This is the same reading as the augury three cells earlier,
    and the treasure test fails at the first element too, because no canonical category is named and nothing
    material changes hands. Worth recording that no scan could see this cell; see OBS-02.
- text_locus: the holy water that burns the chaotic, p181
  quoted_gist: a priest flings holy water from a brush and it burns the chaotic
  why_considered: 'alignment_chaotic is canonical and the whole-label scan matches. The verb burns is
    the closest this page comes to a stated harm, and the arctic table earned a TRIGGERS row into rule_damage
    from weather, so the shape exists: rule_damage holds 23 inbound rows, 3 of them from a tbl_ source.'
  rejection_reason: 'No damage is named and none is stated. The two arctic cells that earned that row
    say damage per round in the cell itself; this one says burns and stops. There is also no correctly
    typed row available for the alignment half: constitution section 2.4 keeps alignment membership out
    of the graph, and the 15 canonical alignment rows are the deities'' own divine-alignment cross-references
    from printed pages 28 and 29, not effects conditioned on a target''s alignment. Asserting either row
    would add a mechanic the page does not state.'
- text_locus: the deities and the saint, p181
  quoted_gist: debauched cultists of Gede hand out cups of wine, a temple of St. Terragnis offers sanctuary
    to the unarmed, and the Font of Madeera has a stated chance of ending a curse
  why_considered: Three canonical deity identities are named on one page, at indices 31, 44 and 45, which
    is more than any packet of this chapter has carried. deity_ identities hold 7 canonical rows between
    them. Two of the three are recovered only by scan 3, one abbreviated and one embedded in a place name.
  rejection_reason: 'None of the three states a mechanic, and constitution section 2.4 forecloses the
    membership reading in any case: a cell naming a deity creates no classification, hierarchy or grouping
    edge. Cultists handing out wine is scenery, sanctuary to the unarmed names no rule, and the Font''s
    curse-ending chance fails for want of a target, since there is no curse or status identity in the
    registry. That last is the same inverse gap recorded for the curse-ending algae on printed page 169
    and for the swamp tar''s anti-toxin properties on 177. A temple of a deity is also not the deity,
    which is the shrine reasoning from printed page 167.'
- text_locus: the priest's offer of coin, p181
  quoted_gist: a priest with a forced smile offers a stated sum in gold to new converts
  why_considered: 'The slums packet established that the book''s currency notation names item_coin, and
    the route is live: item_coin FEEDS_INTO rule_treasure carries 1 row on monetary value from printed
    page 117, with 11 rows inbound on rule_treasure overall. Coin is offered to the party rather than
    taken from them, so the availability limb looked satisfied.'
  rejection_reason: 'It is a price, not a find. The slums packet declined the Wandering Merchant paying
    a stated sum per giant dung beetle on exactly this ground, that a stated price is a magnitude, and
    the high district declined both the Overlord''s filth tax and the brass monkey statue for the same
    reason. What the cell states is a transaction: the party receives the sum by converting. The treasure
    rows in this chapter rest on coin or an item being present and obtainable, the flagstone box and the
    half-buried chest, not on a sum named as consideration.'
- text_locus: the trapdoor that falls open, p180
  quoted_gist: a trapdoor in an alley falls open onto the cellar of a temple
  why_considered: 'This is a second trapdoor in three packets and it is closer than the tavern''s, because
    something actually happens: the tavern''s was chained shut and this one opens. rule_traps carries
    inbound FEEDS_INTO rows from several tables in this chapter.'
  rejection_reason: 'It fails the third element of the settled three-element trap test. An operation is
    arguably stated and the agency is not a creature''s, but nothing says the trapdoor was deliberately
    set, and nothing resolves: no trigger, no concealment, no harm, no check. A cellar door in an alley
    coming open is architecture behaving badly, which is the same reading that declined the decaying structures
    earlier in the intake.'
- text_locus: the live sacrifice, p180
  quoted_gist: chaos cultists begin a live sacrifice and the victim is a beloved NPC
  why_considered: tbl_sacrifice_value is canonical with 2 rows and scan 3 flags this cell for it, so the
    enumeration was done rather than assumed.
  rejection_reason: Different sense of the word. tbl_sacrifice_value is resolved by rule_penance at printed
    page 44 and takes spell tier as an input; it prices a penitent's offering. A cult murdering an NPC
    on an altar shares the noun and nothing else, and the cell states no value, no penance and no procedure.
    Recorded because the match is the clearest single-word sense collision the chapter has produced.
- text_locus: the concealed daggers, p180
  quoted_gist: two beggars conceal wavy daggers up their sleeves
  why_considered: weapon_dagger is canonical and the stem scan reports this cell, so a row looked available.
  rejection_reason: The cell states that a weapon is present and hidden. No attack, no damage, no check,
    no property of the weapon. This is the presence-rather-than-effect reading that has declined torches,
    lanterns, campfires and an oil flask earlier in the chapter.
- text_locus: the crowd, spectacle and creature results, pp180 and 181
  quoted_gist: an erinyes expelled by exorcism, a priest turning into a bone naga, a man turning into
    a fire elemental, a domini angel, cobras held up to be kissed, the Overlord with his knights, Baron
    Hallin, the Holy Bull Run and the Parade of the Nine
  why_considered: Several are individually named and two carry a creature type in apposition, which is
    the shape that has prompted the question in each packet of this chapter.
  rejection_reason: A creature's defining locus is its stat block in the unextracted monster chapter and
    the registry holds 0 monster_ identities. This is the 20th packet running for the same disposition.
    The Parade of the Nine additionally names a grouping constitution section 2.2 excludes from graph
    identity by name, so it could not become a node even if the monster chapter were claimed.
- text_locus: the spectacle cells that state no mechanic, pp180 and 181
  quoted_gist: a roof cistern collapsing, gems dumped into an alms box, a stampede of pilgrims, a poisoned
    dart thrown at a PC, acid thrown in the street, a monk setting himself alight and blindfolded pilgrims
    blocking the way
  why_considered: Several of these have an obvious procedural reading in a system that has damage, checks
    and movement, so each was tested against the standard the arctic weather cell set rather than dismissed
    as scenery.
  rejection_reason: Not one names a rule the graph holds and says what happens to it. Collapsing stone,
    poison, acid and fire all state an event and no outcome; the gems go into an alms box rather than
    to the party, so they are not available either. This page is the chapter's clearest case of dense
    incident with no stated mechanics.
- text_locus: the two-encounter instruction, p181
  quoted_gist: one result instructs the reader to roll two encounters and combine the results, rerolling
    that result if it comes up again
  why_considered: It is the only instruction on the page, and the stem scan flags it as matching rule_encounter.
  rejection_reason: The match is on the plain word encounters in the instruction's own text; M001 already
    carries the table's relation to rule_encounter. Declined in the same form in each of the 19 preceding
    chapter packets.
- text_locus: the appended random encounter procedure and monster attributes, out of scope
  quoted_gist: the printed page 112 and 113 encounter procedure and the printed page 189 monster attributes
    page
  why_considered: Both are in the file and the first is the rule this table resolves.
  rejection_reason: Both are Supporting Source Context, outside the bounded scope. PKT-SD-112-113 is already
    integrated, so extracting from it would duplicate canonical rows and cite pages outside this packet's
    range.
non_edge_observations:
- id: OBS-01
  subject: the thinnest page of the chapter, and why that is the right result
  detail: 'This packet yields 2 rows from 50 cells, the fewest of any page in the chapter. It is worth
    stating plainly that thinness here is a finding rather than a shortfall.


    The page is dense with incident: an exorcism, a self-immolation, two transformations, poison, acid,
    a riot of pilgrims. Nearly all of it is creature content belonging to an unextracted chapter, and
    almost everything else states an event without stating an outcome for any rule the graph holds. Three
    cells came close and each failed on a different element already settled elsewhere: the augury on the
    reference limb, the holy water on a missing named effect, the priest''s coin on price rather than
    availability.


    Recorded because a two-row packet invites a second pass looking for something missed, and the enumeration
    above is the record that the pass was already made. Every cell was read; 30 of 50 were flagged by
    at least the widest scan and each flag was resolved.'
- id: OBS-02
  subject: the stemmer can lose a match by over-stemming
  detail: 'Scan 2 exists to recover inflected mentions, and on this page it did its job for the rival
    crawling group. It also silently lost one. The hundredth cell says blessing and spell_bless is canonical;
    the stemmer strips the trailing s from Bless to give bles and the trailing ing from blessing to give
    bless, so the two never meet. Scan 3 cannot help because Bless is a single token and that scan only
    considers multi-token labels.


    This is the opposite failure from the one at PKT-SD-178-179. There the scans were too strict about
    completeness and a partial name slipped through; here the stemmer is too aggressive on a short word
    and a complete name slipped through. Widening the stemmer would fix this case and create others, so
    the script instead asserts the mismatch explicitly, which turns a silent miss into a recorded one.


    The cell earns nothing on the merits, so nothing was lost this time. That is luck, not method. The
    method is that every cell is read; see name_match_measurement_note, where this is stated rather than
    left to the scan counts.'
- id: OBS-03
  subject: the italic convention, measured rather than asserted
  detail: 'The augury decline rests on the source''s italic convention for naming a spell, so the convention
    was measured rather than recalled. The script walks the Pandoc AST for emphasis spans across this
    chapter''s claimed tables. 8 emphasised cells exist in total: 2 spell names, web at printed page 158
    and polymorph at 174; four proper names of ships; one magic item''s name; and one ordinary emphasis
    on the word their. This table emphasises 0 cells.


    So italics mark a name the source is pointing at, and both spell references in the chapter carry them.
    That is what makes the bare augury here weak as a reference, and it is also why the polymorph decline
    at printed page 174 turned on occurrence rather than on reference: its italics had already settled
    the reference half.


    Recorded because an argument from a typographic convention is only as good as the count behind it,
    and because the monster chapter ahead will italicise heavily.'
