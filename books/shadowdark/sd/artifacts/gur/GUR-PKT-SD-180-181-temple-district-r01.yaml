architectural_escalation_note: None raised. The one proposed identity uses an approved prefix, both rows
  use a legal edge type at status core, neither carries supersession_basis and neither is an OVERRIDES,
  and no CLASSIFIED_AS row appears. The deity and alignment mentions are excluded by constitution section
  2.4 rather than by a question that needs governance. The authority list omits the nonexistent Shadowdark
  DEC-2026-0003; registry authority for this ruleset is constitution section 2, as recorded in GUR-PKT-SD-142-143-arctic-r01.
completeness_statement: 'Both printed pages in scope were read in full at the recorded checksum, which
  the script asserts against the packet manifest before parsing: 1 named table, 50 data rows, 0 sentences
  of prose. The packet yields 1 new identity and 2 rows, reusing 2 canonical identities whose labels the
  building script asserted equal to the registry. The proposed table carries edges, so nothing is left
  unattached.


  Every row was checked against the 838 canonical edges for an assertion-key collision, for a shared source,
  type and target under a different aspect, and for duplicates within the patch; there are none of any,
  and no canonical row cited either page before. The script locates the supporting cell for each row and
  asserts its page, which matters because the page break falls inside the table.


  12 candidates were rejected and each is recorded with its reason. The largest deliberate loss is the
  creature and spectacle content, which belongs to the unextracted monster chapter or states no mechanic
  at all. 5 of the 11 identities the first two scans reach are spurious collisions with ordinary English,
  and one real reference is reachable by no scan at all because the stemmer over-stems its label; both
  facts are asserted by the script rather than observed. No assertion depends on any other ruleset.'
measured_figures_note: 'Figures quoted in this artifact''s prose are computed by the building script from
  the claimed source and the canonical files, and the finished document is checked for unsubstituted format
  specifiers before it is written. Located cells: the rival crawling group at 36, the augury at 30, the
  blessing at 49, the holy water at 39, Gede at 31, St. Terragnis at 44, the Font of Madeera at 45, the
  trapdoor at 18, the live sacrifice at 0, the offered coin at 32, the daggers at 13 and the two-encounter
  instruction at 48, of 50 rows. Canonical counts at extraction: 21 resolvers on rule_encounter of which
  19 are location tables, 18 inbound on rule_rival_crawlers, 11 inbound on rule_treasure, 1 from item_coin,
  23 inbound on rule_damage of which 3 have a tbl_ source, 1 TRIGGERS row into a spell, 0 on spell_augury,
  0 on spell_bless, 2 on tbl_sacrifice_value, 7 on deity_ identities, 15 on alignment_ identities and
  1 on tbl_settlement_temple_district. This is packet 20 of the chapter''s claimed set.'
