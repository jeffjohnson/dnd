classified_as_gate_note: >-
  DEC-2026-0103 added the bounded CLASSIFIED_AS edge type at Constitution 1.6 and prohibits any such
  row until Builder's implementation has terminal Reviewer approval. No implementation report exists
  at extraction time. The ruling also confines the type to spell casting class and spell tier, so
  even once open it would not admit the light-source and campfire classifications this packet
  declines; those are recorded in the observations rather than asserted.

in_flight_identity_note: >-
  rule_encounter is proposed by a sibling GUR published earlier today
  and is not yet canonical, so this patch proposes it again to satisfy invariant 1. The ID and label
  are reproduced exactly and the sibling is named on the node, so Reviewer de-duplicates to one
  registry addition. This is the ordinary consequence of extracting adjacent packets faster than the
  pipeline integrates them, not a competing naming.

