non_edge_observations:
  - id: OBS-01
    subject: the hit-point recovery is already canonical and is not restated
    detail: >-
      Page 86 says a successful rest regains all lost hit points and recovers non-permanent stat damage. The canonical graph already carries rule_resting MODIFIES rule_hit_points on the aspect recovery, asserted from printed page 12 where the overview first states it. A row here would have the same source, type, target, aspect and condition and would collide under the constitution section 4 assertion key, so omitting it is required rather than optional.
            The stat-damage recovery is a second effect and is not asserted either: stat damage is not an identity in this graph and no packet read so far defines it. That is a genuine gap and is recorded here rather than papered over.
  - id: OBS-02
    subject: what else a rest restores is stated generically
    detail: >-
      The page adds that some talents, spells or items regain their use after a rest. Those relationships are already asserted individually from their own loci and are canonical: resting gates a failed spell's recasting, a wand's restoration, and the Heal spell's recasting. A generic row here would duplicate them at a vaguer grain and would have no determinate target.
  - id: OBS-03
    subject: the campfire is a light source and is not said to be one
    detail: >-
      A campfire casts light and lasts a stated time, which makes it a light source in every ordinary sense. No row says so, for the membership reason recorded in the sibling crawling packet: DEC-2026-0103 confined CLASSIFIED_AS to spell classifications. M005 asserts what is assertable, that building one consumes torches.
  - id: OBS-04
    subject: magnitudes deliberately excluded
    detail: >-
      The page carries the sleep duration, the interruption check difficulty, the three danger-level intervals, the torch count for a campfire, the campfire duration and its light radius. All are durations, thresholds, counts or distances, excluded by constitution section 1 and invariant 11. They remain in the immutable claimed packet. No aspect contains a digit, and the conditions name circumstances rather than quantities.

unresolved_identity_questions:
  - id: IDQ-01
    subject: the torch is proposed here rather than from its own gear entry
    detail: >-
      item_torch is proposed by this packet, but its defining locus is the bolded Torch entry on printed page 34. That packet deliberately did not propose it: at the time the torch's only stated content was a duration and a light radius, both magnitudes, with no second identity to relate it to, so it would have been an orphan.
            This page gives it a relationship, that a campfire is built from torches, so the identity becomes proposable. The node records printed page 34 as its defining locus and takes its label from there, so no spelling is fixed from this secondary mention.
            Consequence if wrong: if Reviewer prefers the torch to be proposed from its own entry, a successor revision of the gear packet can do so and this proposal de-duplicates against it. The Analyst judged that leaving the only stated torch relationship unassertable for the sake of ordering would lose more than it protects.

architectural_escalations: []
architectural_escalation_note: >-
  None raised. Every proposed node uses an approved constitution section 2 prefix with an unchanged
  kind, every edge uses one of the fourteen legal section 3 types, and no new prefix, edge type,
  domain promotion or general-rule application is requested. The membership questions this packet
  declines were settled against representation by DEC-2026-0103, which confined CLASSIFIED_AS to
  spell classifications; they are recorded in the observations rather than re-escalated.

completeness_statement: >-
  All printed pages in the declared span are accounted for, and every heading, subsection, bolded
  entry, list and paragraph within them was read. Each produced either an edge or a dispositioning
  observation; nothing was skipped. Every page marker was resolved through the Pandoc AST and each
  row is cited to the page of the subsection it is drawn from. Every row was checked against the
  canonical edge set for an assertion-key collision before publication. Content not converted to an
  edge is accounted for in the observations above, and the question the Analyst could not settle is
  recorded rather than resolved silently. No assertion depends on any other ruleset.
