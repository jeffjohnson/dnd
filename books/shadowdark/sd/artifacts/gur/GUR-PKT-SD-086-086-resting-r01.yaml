  Markers resolve through the Pandoc AST rather than positionally, each a plain marker ending a
  heading, which placement rule 1 applies to the whole heading. The bolded entries under MOVEMENT and
  the subsections elsewhere carry no marker of their own and take their page from the persistence
  rule, so each row is cited to the page of the subsection it is drawn from.

scope_boundary: >-
  The bounded scope is the Primary Source Material section, printed pages 86 through 86. Any other
  page the parser resolves lies inside the trailing Supporting Source Context, is claimed by another
  packet, and contributed nothing here.

source_summary: >-
  A single page. RESTING gives what a rest costs and requires, what interrupts it and what a successful one restores. DANGER LEVEL gives three named levels of surroundings with their random-encounter cadences. CAMPFIRE gives a light source built from torches. This summary is orientation only; every assertion below cites its page.

extraction_posture: >-
  rule_resting is canonical and already carries its hit-point recovery row from printed page 12. This page states that rule more fully, and that fuller statement is deliberately not re-emitted; see OBS-01. What is new is the ration cost, the interruption check, the danger level and the campfire.

graph_state_at_extraction: >-
  The canonical graph holds 175 registry rows, read at extraction rather than recalled, together with
  the canonical edge set so every proposed row could be checked against the section 4 assertion key
  before publication. The domain registry is still empty and general_rules.json is still an empty
  object.

