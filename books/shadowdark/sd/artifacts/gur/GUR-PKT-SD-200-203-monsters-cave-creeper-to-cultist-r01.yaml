rejected_candidates:
  - text_locus: 'Toxin, p200, and Poison, p201 (twice)'
    quoted_gist: 'a save against CON or be paralyzed for a stated duration, identical across three creatures'
    why_considered: >-
      The third verbatim recurrence of one effect under two names, tested against the locus rule
      rather than assumed excluded by precedent alone.
    rejection_reason: >-
      A stat-block description under constitution 2.5 for each of the three instances
      individually; the duration is a magnitude and there is no paralyzed condition identity.
      See recurrence_note.
  - text_locus: 'Fire Breath, p201'
    quoted_gist: 'a near-sized cube dealing a stated amount of damage on a failed DEX save'
    why_considered: 'rule_damage is canonical and the ability states an area effect against it.'
    rejection_reason: 'A stat-block description; the damage and area are magnitudes, the same ground as Mind Blast at the preceding packet.'
  - text_locus: 'Grab, p201'
    quoted_gist: "a save against STR or be held, with a repeated save to break free on the target's turn"
    why_considered: 'The same shape as Latch at the preceding packet, checked independently.'
    rejection_reason: 'A stat-block description; there is no held or grappled condition identity, the same gap as Latch.'
  - text_locus: 'Phantoms, p202'
    quoted_gist: >-
      once a day, in place of attacks, the cloaker creates illusory duplicates and it is random
      whether an attack hits the cloaker or a duplicate
    why_considered: >-
      spell_illusion is canonical and the stem scan reports a partial match, and the mechanic
      resembles spell_mirror_image's duplicate-based defence closely enough to check directly.
      See resemblance_note.
    rejection_reason: >-
      Neither spell is named, and the book's italic reference convention is absent. A stat-block
      description under the locus test regardless.
  - text_locus: 'Screech, p202'
    quoted_gist: 'enemies in range save against WIS or suffer DISADV on attacks and checks for a stated duration'
    why_considered: >-
      rule_disadvantage is canonical and the ability states it by abbreviation, DISADV, which no
      scan catches because the registry label is spelled in full; found by reading.
    rejection_reason: >-
      A stat-block description under the locus test, the same ground as Rage, Execute, Ambush and
      Bewilder in the preceding two packets.
  - text_locus: 'Change Shape, p202'
    quoted_gist: 'in place of attacks, the couatl transforms into another similarly-sized creature'
    why_considered: 'Resembles spell_shapechange closely enough to check directly. See resemblance_note.'
    rejection_reason: 'Not named as the canonical spell and carries no italic marking. A stat-block description regardless.'
  - text_locus: "Couatl's Poison, p202"
    quoted_gist: 'a save against CON or fall into a natural, deep sleep for a stated duration'
    why_considered: 'Resembles spell_sleep closely enough to check directly. See resemblance_note.'
    rejection_reason: >-
      Not named as the canonical spell and carries no italic marking; the plain word sleep is
      the same shape that declined the plain word teleport on Void Step at printed page 197. A
      stat-block description regardless.
  - text_locus: 'Restore, p202'
    quoted_gist: >-
      in place of attacks, the couatl touches a creature to remove a curse or affliction, or to
      heal a stated amount
    why_considered: >-
      rule_hit_points is canonical and the healing half of the ability names it directly.
    rejection_reason: >-
      The healing amount is a magnitude and the dependency is already canonical and unconditioned
      from printed page 14, the same ground as every other healing ability since printed page
      182. Removing a curse or affliction has no identity to attach to; no curse, affliction or
      condition identity exists in the registry.
  - text_locus: "Crab, Giant's Crush, p202"
    quoted_gist: 'a save against STR or take a stated amount of damage'
    why_considered: >-
      Shares a name with the Bears' Crush ability from two packets ago, checked for whether it
      is the same mechanic rather than assumed. See recurrence_note.
    rejection_reason: >-
      A stat-block description; and, independently, a different effect from the Bears' Crush
      despite the shared name, confirming OBS-02 from that packet in the other direction.
  - text_locus: 'Fearless, p203'
    quoted_gist: 'the cultist is immune to morale checks'
    why_considered: >-
      rule_morale is canonical and the ability states a direct exemption, the isolated form of
      the clause Rage and Berserker's Rage carried alongside a damage bonus.
    rejection_reason: 'A stat-block description under the locus test settled for this exact clause twice already.'
  - text_locus: 'Deathtouch, p203'
    quoted_gist: 'a WIS-tagged spell dealing a stated amount of damage to one creature within close'
    why_considered: 'rule_damage is canonical and the ability states a damage amount directly.'
    rejection_reason: >-
      A stat-block description, the same ground as every other INT- or WIS-tagged named ability
      since printed page 196; the damage is a magnitude.
  - text_locus: 'the flavour text for all twelve creatures, pp200 to 203'
    quoted_gist: >-
      giant paralytic centipedes, herd-dwelling centaurs, a four-headed chimera, a lobster-like
      chuul, a manta-ray cloaker, a lizard-chicken cockatrice, a jewelled couatl, an armoured
      crab, a scaly crocodile, and a wild-eyed cultist
    why_considered: 'Read for completeness, as every block on an in-scope page must be considered.'
    rejection_reason: 'Narrative description throughout, the disposition applied since printed page 194.'
  - text_locus: 'the eight stat-block fields on each of the twelve creatures, pp200 to 203'
    quoted_gist: >-
      armour class, hit points, attacks, movement, the six stat modifiers, alignment and level
      for each creature
    why_considered: 'Every field names a canonical shared identity directly, the case constitution 2.5 names by example.'
    rejection_reason: 'Unchanged from every stat-block packet since printed page 194. 96 field values are excluded on this ground alone.'
  - text_locus: 'the appended shared-system context, out of scope'
    quoted_gist: 'the monster attributes, movement and conditions, morale, and complete magic rules pages'
    why_considered: 'All four are in the file and directly relevant to reading a stat block correctly.'
    rejection_reason: 'Supporting Source Context, outside the bounded scope, each already integrated from its own primary packet.'

non_edge_observations:
  - id: OBS-01
    subject: resemblance to a canonical spell's effect is not a reference, confirmed three times on one page
    detail: >-
      Phantoms, Change Shape and Couatl's Poison each resemble a canonical spell's mechanic
      closely enough that each was checked individually against that specific spell rather than
      waved through on the Void Step precedent. All three lack a name match and all three lack
      the italic marking. Three confirmations on one page is a stronger result than one, and it
      is recorded because the monster chapter's remaining creatures will very likely keep
      producing abilities that resemble a named spell in effect; the test to apply is unchanged,
      a name match or an italic mark, not a functional resemblance.
  - id: OBS-02
    subject: a third real-identity reference found only by abbreviation
    detail: >-
      DISADV on Cloaker's Screech is the second ability in two packets caught only by reading,
      not by scan, because the registry label is spelled in full and the cell abbreviates it;
      ADV on Bugbear's Stealthy was the first. Recorded because a scan that only matches full
      words will keep missing this book's abbreviations, and reading every cell remains the
      control on that gap.
  - id: OBS-03
    subject: a shared ability name can mean a different thing in both directions now
    detail: >-
      Crab, Giant's Crush differs from the Bears' Crush, extending Impervious's lesson from the
      preceding packet to a second ability name. Two ability names have now each been shown to
      carry an inconsistent meaning across creatures, which is enough to treat the pattern as
      established rather than coincidental: an ability's name in this chapter is a flavour
      choice, not a stable reference.

