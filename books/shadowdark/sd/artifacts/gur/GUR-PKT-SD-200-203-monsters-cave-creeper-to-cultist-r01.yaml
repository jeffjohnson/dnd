  Read from the repository at extraction, not recalled. The canonical graph holds 461 registry
  rows and 866 edges, and 0 rows cite printed pages 200 through 203. The registry holds 30
  monster_ identities. The script asserts that all twelve proposed ids in this packet are absent
  from the registry before use.

stat_block_boundary_note: >-
  The test settled at PKT-SD-194-194 and confirmed across the three following packets is applied
  without modification: a stat-block description is excluded under constitution 2.5 regardless
  of what it references, how many creatures carry the same text, or how closely it resembles a
  canonical spell's effect, because the exclusion is about each instance's own locus and the
  book's own reference convention is the italic marking, which no ability on this page carries.

recurrence_note: >-
  The paralysis clause, DC 12 CON or paralyzed 1d4 rounds, is now verbatim across three
  creatures under two names: Toxin on Cave Creeper, Poison on Centipede, Giant and Poison again
  on Centipede, Swarm. All three are excluded individually under the locus test; see the running
  account in measured_figures_note. Crab, Giant's own ability is also named Crush, the same name
  as the Bears' ability two packets ago, but states a save-or-damage effect rather than an
  extra-die-on-double-hit, which is independent confirmation of OBS-02 from that packet: a
  shared name does not imply a shared mechanic, in either direction.

resemblance_note: >-
  Three abilities were checked against a specific canonical spell for resemblance and each was
  confirmed to lack the book's citation convention before being declined.
  Phantoms, on the Cloaker, creates illusory duplicates and randomises which is hit, which is
  close in function to spell_mirror_image's own duplicate-based defence; the ability names
  itself Phantoms, not Mirror Image, and carries no italic marking.
  Change Shape, on the Couatl, transforms the creature into another similarly-sized creature,
  close to spell_shapechange; again, no name match and no italics.
  Couatl's Poison causes a natural, deep sleep rather than damage, close to spell_sleep; the
  cell uses the plain word sleep rather than a marked reference, the same shape that declined
  Void Step's plain teleport at printed page 197.
  All three are stat-block descriptions in any case, so the resemblance question does not
  change the disposition, but each was checked individually rather than waved through on
  precedent alone.

