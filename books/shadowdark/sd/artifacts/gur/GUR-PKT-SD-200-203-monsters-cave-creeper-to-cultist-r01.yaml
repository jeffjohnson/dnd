source_summary: >-
  Twelve monster stat blocks spanning Cave Creeper to Cultist. The paralysis effect recurs a
  third time under a new name, Toxin on Cave Creeper and Poison on both centipedes, all three
  verbatim. Three abilities resemble a canonical spell in effect without naming it: Cloaker's
  Phantoms resembles Mirror Image, and Couatl carries both a Change Shape ability resembling
  Shapechange and a Poison ability whose sleep effect resembles Sleep.

