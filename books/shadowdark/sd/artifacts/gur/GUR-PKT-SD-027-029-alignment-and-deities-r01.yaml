page_attribution_basis: >-
  Three markers resolve in the Primary Source Material, all through the Pandoc AST rather than
  positionally. The page-27 marker ends the ALIGNMENT heading and the page-28 marker ends the DEITIES
  heading, which placement rule 1 applies to each whole heading. The page-29 marker ends the MEMNON
  (CHAOTIC) heading, so that whole entry begins on page 29 and, under the persistence rule, the
  RAMLAAT, SHUNE THE VILE and THE LOST entries after it inherit page 29. That inheritance is the one
  attribution here a positional reading could get wrong, and it is why the Memnon, Ramlaat and Shune
  rows below cite page 29 while the Terragnis, Gede, Madeera and Ord rows cite page 28. A fourth page
  the parser resolves, 15, lies entirely inside the out-of-scope Supporting Source Context.

scope_boundary: >-
  The bounded scope is the Primary Source Material section, printed pages 27 through 29. The trailing
  Supporting Source Context reproduces printed page 15, whose primary packet is
  PKT-SD-015-015-stats-and-stat-modifiers, outside this packet's declared span. No assertion here is
  drawn from it and no row cites page 15.

source_summary: >-
  Printed page 27 defines alignment as a character's role in the conflict between Law, Chaos and
  Neutrality, glosses each of the three, directs the player to choose one, and gives each of Chaotic,
  Lawful and Neutral its own heading and description. Printed pages 28 and 29 define deities: gods
  are personifications of the three alignments, a character may worship any deity or none, a priest
  must choose one god to serve and that god can revoke the priest's spellcasting for blasphemous
  acts. Three collective groupings are named, and eight entries follow, each with its own heading
  carrying a parenthesised alignment tag. This summary is orientation only; every assertion below
  cites its page.

graph_state_at_extraction: >-
  The Shadowdark canonical graph is no longer empty. Integrations INT-20260922-002 and
  INT-20260922-003 applied thirty nodes and thirty-five edges, and
  rulesets/shadowdark/registries/nodes.csv now carries thirty rows. This is the first packet this
  Analyst has extracted against a non-empty registry, and the procedure changes accordingly: the
  registry was checked before proposing anything, and an identity already canonical is reused rather
  than re-proposed.
  One endpoint this packet needs, rule_spellcasting_check, is canonical and is therefore listed under
  reused_nodes with no proposal. Of the identities proposed below, none is canonical: neither
  sys_alignment nor sys_deity has been integrated, and the three alignment and seven deity
  identities are new under Constitution 1.3. The domain registry is still empty and
  general_rules.json is still an empty object, so no domain or general rule is available to apply.

reused_nodes:
  - id: rule_spellcasting_check
    label: Spellcasting Check
    canonical_since: INT-20260922-002 or INT-20260922-003
    used_by: M004
    basis: >-
      Present in rulesets/shadowdark/registries/nodes.csv with kind rule at extraction time, so it
      resolves against the registry and needs no proposal. Reusing it rather than re-proposing it is
      what constitution section 3.2 and Analyst responsibility 2 require, and it avoids asking the
      Integrator to register a node that is already registered.

cross_packet_identity_note: >-
  sys_deity is proposed by GUR-PKT-SD-020-021-priest-class-r01 from printed page 20 and is proposed
  again here because M004 uses it as an endpoint and it is not yet canonical. A GUR must propose
  every endpoint its edges use unless the endpoint is canonical; an endpoint that is neither is an
  invariant 1 failure. Proposing it is not a competing naming: the ID and label are reproduced
  exactly and its defining locus is recorded below as these pages, which is where the subsystem is
  actually defined, while the priest entry only referred to it.
  sys_alignment is deliberately not proposed. It is a sibling candidate and these pages are its
  defining locus too, but no edge in this GUR uses it, and proposing an unused node would create an
  orphan; see OBS-01.

