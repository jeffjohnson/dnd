authored_polarity_declaration: >-
  One row carries authored polarity: M004 CONSTRAINS governs, basis read. CONSTRAINS is among the
  three types constitution section 5 requires to carry source-reviewed authored polarity, and the row
  was read aloud as source polarity target before being recorded. It does not use basis heuristic or
  unset. No other row carries a polarity or polarity_basis value: the three ALTERNATIVE_TO rows and
  the seven CROSS_REFERENCES rows both take derived neutral from the section 5 table, and the Analyst
  authors neither.

domains_touched: []
candidate_domains:
  - proposed: character_creation
    basis: >-
      Alignment is chosen when a character is made, and the priest's deity with it. Recorded as a
      candidate only; now suggested by an eighth packet, which is noted and deliberately not treated
      as promotion. Constitution section 8 reserves promotion to an Architect Decision and the
      Analyst does not decide a candidate domain is official.

domain_boundary_questions:
  - >-
    Alignment is a creation choice whose only stated mechanical effects land elsewhere: it selects a
    titles column on printed pages 30 and 31 and bounds a priest's deity on printed page 20. Whether
    that makes it a creation concept or a cross-cutting one cannot be settled here. Deferred; no
    domain is asserted on any edge in this GUR.

candidate_general_rules: []
candidate_general_rules_note: >-
  None proposed, and the omission is deliberate rather than incidental. The seven alignment-tag rows
  repeat one shape and would ordinarily suggest a rule that every deity references an alignment. The
  Analyst does not propose it: constitution section 2.2 states that the section creates no general
  rule, and a rule covering the seven would be very close to the grouping or membership semantics the
  same section forbids. The three ALTERNATIVE_TO rows are one stated exclusivity expressed pairwise,
  not a repeated shape.

non_edge_observations:
  - id: OBS-01
    subject: no edge attaches an individual to its axis, by ruling rather than by oversight
    detail: >-
      sys_alignment and sys_deity are the subsystem identities and the three alignments and seven
      deities are their members, so a reader will look for eleven membership edges and find none.
      Constitution section 2.2 is explicit that the section creates no grouping kind, membership
      edge or hierarchy, and the section 3 vocabulary has no membership type; the nearest candidates
      would each assert something false, since FEEDS_INTO would claim a member supplies an input to
      its axis and GATES would claim it is a precondition for the axis.
      The consequence is recorded plainly: a query for the members of the alignment subsystem returns
      nothing, and the connection between alignment_lawful and sys_alignment exists only in the
      shared prefix, which invariant 4 says is not identity. sys_alignment is therefore not proposed
      at all here, because no edge would use it and an unused node is an orphan. sys_deity is
      proposed only because M004 genuinely needs it as an endpoint.
  - id: OBS-02
    subject: the three collective groupings are named and deliberately not represented
    detail: >-
      Page 28 names The Four Lords, the lawful and neutral gods who stand for justice, order and
      mercy; The Dark Trio, the chaotic deities; and The Nine, the original nine gods still invoked
      in oaths. Each is source-named and each describes a real set of the individuals proposed here.
      None is proposed, and no edge relates any deity to one. Constitution section 2.2 names all
      three as source context rather than graph identities or membership evidence, and the ruling
      reasons that the packet gives them no independently load-bearing mechanic and that the graph
      has no membership edge type. The Analyst agrees on the source reading: nothing on these pages
      turns mechanically on whether a god belongs to The Four Lords.
  - id: OBS-03
    subject: The Lost is left wholly unrepresented
    detail: >-
      An eighth entry, THE LOST, carries a question mark where the others carry an alignment tag, and
      says two of The Nine are lost to the ages with their names expunged. No node is proposed, no
      edge is drawn, and no alignment is attributed to it.
      This is the one entry where the Analyst would otherwise have had to invent something, and
      constitution section 2.2 forecloses each option by name: deity_the_lost is prohibited because
      The Lost denotes two deities rather than one, an anonymous deity node is prohibited, and an
      unknown-alignment node is prohibited. The question-mark heading records an unknown source
      value, not a graph value. The section also states the remedy, that a later source naming an
      individual follows ordinary deity_ proposal and Review workflow, so nothing is permanently
      lost by the silence. Recorded because an entry with its own heading producing no node at all is
      exactly the kind of gap a later reader would otherwise read as an omission.
  - id: OBS-04
    subject: the spellcasting revocation is asserted once at the axis, not seven times
    detail: >-
      Page 28 says a priest's deity can revoke the gift of spellcasting. Because seven deities are
      proposed here, it would be possible to write the rule seven times, once per god, and doing so
      would have the incidental effect of giving every deity a second edge.
      M004 asserts it once, from sys_deity. The source states the rule of a priest's deity
      generically and never of a named one, and seven rows would assert seven things the page does
      not say while adding nothing a query could not reach through the subsystem. The Analyst notes
      the temptation explicitly because the alternative would have improved the apparent connectivity
      of the deity nodes, which is not a reason to assert anything.
  - id: OBS-05
    subject: two relationships stated here are already asserted by the priest packet
    detail: >-
      Page 28 says priests must choose one god to serve faithfully, and printed page 20 says to
      choose a god who matches your alignment. GUR-PKT-SD-020-021-priest-class-r01 already asserts
      both, as class_priest gating sys_deity on the aspect deity selection and sys_alignment
      constraining sys_deity on the aspect matching alignment.
      Neither is repeated here. Both would collide under the constitution section 4 assertion key,
      since source, type, target, aspect and condition would all match, so omitting them is required
      rather than optional. The Analyst records the coincidence because this packet is the defining
      locus for the deity subsystem while the priest packet asserted the relationships first, which
      is the reverse of the usual order.
  - id: OBS-06
    subject: descriptive content in the alignment and deity entries yields nothing
    detail: >-
      Each alignment entry describes a mentality: survival of the fittest, good of the whole, nature
      must take its course. Each deity entry describes a character: a legendary knight who ascended,
      a god of feasts whose anger brings storms, the first manifestation of Law who carries the
      Covenant on her skin, a twin who schemes to rend it, a Pillager whose worshippers live by a
      prophecy, a whisperer of arcane secrets who schemes to displace Ord.
      All of it is setting. None names a mechanic, states a dependency or would require review if
      changed. Two details are worth naming as considered and rejected: that many elves and halflings
      worship Gede, and that many orcs worship Ramlaat, relate deities to ancestries that are
      canonical nodes, and an edge was available. They are demographic colour rather than rules, the
      word many concedes they are not universal, and no mechanic follows from them.
  - id: OBS-07
    subject: no magnitudes are present to exclude
    detail: >-
      Recorded for symmetry with the other Shadowdark GURs, which each account for the magnitudes
      they dropped. These three pages contain almost no numerals: the only counts are the three
      alignments, the nine gods and the two Lost, which are enumerations of source content rather
      than game values. Nothing here is a die expression, bonus, threshold or duration, so
      constitution section 1 and invariant 11 exclude nothing a reader might expect represented.
  - id: OBS-08
    subject: packet wrapper and supporting context
    detail: >-
      The supplied file opens with an intake wrapper ahead of the Primary Source Material heading,
      for which the claim manifest is the independent page locator SOURCE_MARKDOWN Attribution Rules
      requires; it contains no rulebook prose, heading or marker. The trailing Supporting Source
      Context reproduces printed page 15 and is orientation only, contributing nothing here.

unresolved_identity_questions:
  - id: IDQ-01
    subject: how a deity's alignment tag should be represented
    detail: >-
      This is the packet's central representational question and the Analyst wants it reviewed rather
      than accepted. Each deity heading carries a parenthesised alignment, and page 28 says gods are
      personifications of the three alignments. The relationship is explicit and in-packet. The
      difficulty is that the closed section 3 vocabulary has no type meaning is-a or has-property.
      Three options were weighed. CONSTRAINS, from the alignment to the deity, would say an alignment
      bounds who may serve that god; that is the true mechanical import, but it is stated on printed
      page 20 in another packet, so drawing it here would combine two packets into an inference,
      which constitution section 2.2 forbids in terms. DERIVED_FROM was rejected because a god is not
      computed or looked up from an alignment. Proposing no edge at all was seriously considered: it
      would leave the seven deities as orphans, and the Analyst would then not have proposed them,
      which would leave DEC-2026-0093's deity_ authorisation entirely unused by the packet it was
      granted for.
      CROSS_REFERENCES was chosen because it means explicitly points elsewhere and therefore asserts
      precisely what the page does, that this entry names that alignment, without importing the
      eligibility rule. It also passes the core test: if alignment_lawful were removed or redefined,
      Saint Terragnis's entry would need review.
      Consequence if wrong: if Reviewer judges these seven rows too weak to be mechanical assertions,
      they should be rejected together with the seven deity nodes, and this packet reduces to the
      three alignment rows and M004. If a later Decision defines a property or membership type, the
      seven repoint to it. Either way nothing else in the GUR depends on them.
  - id: IDQ-02
    subject: three pairwise rows express one three-way exclusivity
    detail: >-
      Choose one of the following three alignments is a single statement about three options, and it
      is recorded as three ALTERNATIVE_TO rows because the vocabulary is binary and ALTERNATIVE_TO is
      its only symmetric type. The pairwise expansion is complete and lossless for three options, but
      it does grow quadratically, and a later source adding a fourth alignment would require three
      further rows rather than one.
      Consequence if wrong: if a Decision later introduces an n-way exclusivity representation, these
      three rows would be replaced by one. Recorded so the choice is visible as a choice; the Analyst
      judged three explicit rows better than asserting nothing about an exclusivity the source states
      plainly.

