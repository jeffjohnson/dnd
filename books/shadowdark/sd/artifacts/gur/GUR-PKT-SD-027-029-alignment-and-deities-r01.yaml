unblocking_note: >-
  This packet was claimed and read in full on 2026-09-22, then held without a GUR because
  Constitution 1.2 section 2 offered no prefix under which an individual alignment or an individual
  deity identity could be formed, and the mechanically load-bearing content of these pages is
  expressed in terms of those individuals. The Analyst escalated rather than mint a prefix, as
  ESC-2026-09-22T18.39.08.936Z. DEC-2026-0093 resolved it and Constitution 1.3 section 2.2 now
  authorises alignment_ with machine kind alignment and deity_ with machine kind deity, and
  enumerates three alignment and seven deity identities. This GUR is DEC-2026-0093 step 5 and uses
  only those authorised identities, reproduced exactly as section 2.2 states them.

dec_2026_0093_boundaries_observed: >-
  The ruling draws four explicit prohibitions and each is honoured, not merely avoided by accident.
  No identity or edge is created for The Four Lords, The Dark Trio or The Nine, which are named on
  page 28 and are source context rather than graph identities; see OBS-02. No deity_the_lost node,
  no anonymous deity node and no unknown-alignment node is created, and The Lost is left entirely
  unrepresented; see OBS-03. No grouping kind, membership edge or hierarchy is proposed, which is
  why no edge attaches an individual alignment to sys_alignment or an individual deity to sys_deity
  even though both axes exist as sibling candidates; see OBS-01. And no inferred relationship is
  drawn, which is the reason the seven alignment tags are represented as they are rather than as the
  eligibility constraint a reader might expect; see IDQ-01.

