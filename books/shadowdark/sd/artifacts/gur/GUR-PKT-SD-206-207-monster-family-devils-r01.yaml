non_edge_observations:
  - id: OBS-01
    subject: Impervious recurs across multiple creature families with varying scopes of protection
    detail: >-
      Impervious appears on Iron Golem, Balor (p204), Archdevil (p206), and Imp (p207). On Balor and
      Archdevil it grants fire immunity plus immunity to non-magical damage; on Imp it grants fire
      immunity only. This confirms that recurring ability names remain creature-specific flavour
      labels rather than shared mechanical identities.
  - id: OBS-02
    subject: Poison recurs with divergent effects within the same creature family
    detail: >-
      Poison appears on both Erinyes and Imp on page 207. On Erinyes it causes a target to turn on
      allies for 1d4 rounds with a DC 15 CON save and DC 15 WIS recovery; on Imp it causes fitful
      sleep for 1d4 hours with a DC 12 CON save. Different saves, DCs, durations, and effects under
      the same ability name within a single family confirm that creature abilities do not denote a
      uniform condition or rule.

