source_summary: >-
  The DEVILS family: two paragraphs of narrative framing describing devils as the vile reflection
  of angels and naming imps, cubi, barbed and horned devils, erinyes, and archdevils, followed by
  six stat blocks. Archdevil carries three special abilities (Impervious, Crown of Darkness,
  Soulbind); Devil, Barbed carries one (Barb); Devil, Cubi carries three (Change Shape, Charm,
  Drain); Devil, Erinyes carries one special ability (Poison) plus a +1 plate mail AC notation;
  Devil, Horned carries one (Iron Hide); Devil, Imp carries three (Impervious, Contract, Poison).

