non_edge_observations:
  - id: OBS-01
    subject: Grab recurs as a fourth distinct instance
    detail: >-
      Grab appears on Chuul (p201), Balor (p204), and Pterodactyl (p208). Pterodactyl's Grab
      imposes the held effect with a DC 15 STR check to avoid and break free, without dealing
      ongoing damage like Chuul or Balor. This confirms ability names describe creature-specific
      effects rather than uniform cross-creature rules.

