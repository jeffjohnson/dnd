page_attribution_basis: >-
  Three markers resolve through the Pandoc AST rather than positionally. The page-75 marker ends the
  GAMEPLAY heading and the page-77 marker ends the ADVENTURING heading, which placement rule 1
  applies to each whole heading. The page-76 marker is the interesting one: it sits at the end of the
  first narrative line rather than on a heading, so rule 1 applies it to that entire paragraph, and
  the persistence rule carries page 76 through the rest of the scene. No row cites a page because no
  row exists.

scope_boundary: >-
  The bounded scope is the Primary Source Material section, printed pages 75 through 77. Nothing
  outside it was read as evidence.

source_summary: >-
  Page 75 is the GAMEPLAY chapter heading and an epigraph about approaching the Shadowdark like a
  sleeping bear. Page 76 is an in-fiction scene at a demon-faced door. Page 77 is ADVENTURING, three
  short subsections naming the people who delve, urging the reader to imagine actions beyond the
  character sheet, and introducing the chapters that follow. This summary is orientation only.

