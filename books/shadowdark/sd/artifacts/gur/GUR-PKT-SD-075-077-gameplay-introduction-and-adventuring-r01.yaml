rejected_candidates:
  - text_locus: 'the narrative scene, p76'
    quoted_gist: >-
      a guttering torch, a checked-for-trap on a stone door, a demon carving, screams in the cavern,
      heaps of gold and jewels, a named hoard, and a mob of ghouls
    why_considered: >-
      Several of these are concepts the graph already holds or soon will: the torch is a gear entry
      on printed page 34, traps have their own chapter on printed page 114, and ghouls are a monster
      the Monsters chapter defines. The paragraph is also bolded in several places, which in this
      book usually marks a defined term.
    rejection_reason: >-
      It is a story. The bolding is emphasis in prose, not the term-definition bolding the rules
      sections use, and no sentence states a rule: a character lifts a torch, pushes a door and sees
      treasure. Nothing would need review if the scene were struck. Constitution section 8 states
      that source-supported dependencies rather than resemblance determine edges, and the resemblance
      here is entirely to concepts defined properly elsewhere.
  - text_locus: 'OUTSIDE THE SHEET, p77'
    quoted_gist: >-
      advice to imagine what you would really do, with examples of lifting a helm visor, listening at
      a door and tearing down tapestries to hamper pursuers, and a reminder to use stats, spells,
      gear and talents without being limited to them
    why_considered: >-
      This names four mechanics that are all canonical identities, and it is the closest the packet
      comes to a rule about how play works.
    rejection_reason: >-
      It is guidance to the player about how to think, not a mechanic. It states no dependency: no
      stat feeds anything here, no gear is consumed, and the three examples are inventions of the
      moment rather than procedures. Striking the whole subsection would leave every mechanic it
      names unchanged, which is the core test failing cleanly.
  - text_locus: 'CRAWLERS and ONWARD!, p77'
    quoted_gist: >-
      the names given to those who delve, and a sentence introducing the chapters that follow
    why_considered: 'Read for completeness, as every block on an in-scope page must be considered.'
    rejection_reason: >-
      Crawlers, delvers, explorers, adventurers and treasure hunters are synonyms for player
      characters rather than a mechanic, and no rule keys off which word is used. ONWARD! is
      navigational, pointing at sections whose own packets own them.
  - text_locus: 'the epigraph, p75'
    quoted_gist: 'a line about the Shadowdark being like a sleeping bear and a ten-foot pole'
    why_considered: 'Considered because a pole is a gear item in the equipment chapter.'
    rejection_reason: >-
      An epigraph. The pole is a figure of speech here, not the item entry on printed page 34, and
      constitution section 2 states that labels do not determine identity.

non_edge_observations:
  - id: OBS-01
    subject: an advice chapter opening yields nothing, and that is the expected result
    detail: >-
      The claim manifest recorded the packet's shape and declined to say whether it yields a
      mechanic. It does not. Two of the three pages are fiction and framing, and the third is advice
      addressed to the reader about how to approach play. Every element is enumerated in
      rejected_candidates with its locus and reason, so the emptiness is auditable rather than
      asserted, and no page needs returning to the steward.
  - id: OBS-02
    subject: how this differs from the four earlier null extractions
    detail: >-
      The front matter, character names and back matter packets yielded nothing because they are
      apparatus: credits, an index, a name table, a licence. The spell lists packet yielded nothing
      because its content belongs to defining loci elsewhere. This packet is different again: its
      subject genuinely is play, and it names real mechanics, but it discusses them rather than
      ruling on them. Recorded because a reader scanning for gaps should be able to tell a chapter
      the Analyst found empty from a chapter the Analyst failed to read.
  - id: OBS-03
    subject: no magnitudes are present to exclude
    detail: >-
      The only numeral across the three pages is the ten-foot pole in the epigraph, which is a figure
      of speech rather than a game value. Nothing is excluded that a reader might expect represented.
  - id: OBS-04
    subject: packet wrapper and supporting context
    detail: >-
      The supplied file opens with an intake wrapper ahead of the Primary Source Material heading,
      for which the claim manifest is the independent page locator SOURCE_MARKDOWN Attribution Rules
      requires; it contains no rulebook prose, heading or marker. Any trailing Supporting Source
      Context is orientation only and contributed nothing.

