source_summary: >-
  Pages 298–300 present the initial alphabetical segment of the MAGIC ITEMS chapter, detailing twelve distinct magic items:
  - Alabaster Destrier (p. 298): statuette transforming into a pegasus once per day for lawful or neutral riders;
  - Amulet of Secrecy (p. 298): prevents detection by divination magic (such as scrying or crystal ball), cursed with sensation of being watched;
  - Amulet of Vitality (p. 298): replaces wearer's Constitution score with 18 (+4);
  - Armor of Saint Terragnis (p. 298): +3 plate mail wearable only by lawful worshippers of Saint Terragnis, raises hostile spell DC to 18, summons archangel avatar once per month;
  - Armor of the Oni (p. 299): +1 plate mail granting Diabolic language and +1 melee damage, cursed with disadvantage on attacks and spellcasting against demons;
  - Bag of Badgers (p. 299): produces an angry badger once per day to throw near;
  - Bag of Devouring (p. 299): pouch destroying items placed inside it in 1d6 rounds;
  - Bag of Holding (p. 299): expands gear capacity by holding up to 10 gear slots, destroyed if placed in another extra-dimensional space;
  - Bead of Force (p. 299): thrown marble entrapping target in a resilient sphere spell;
  - Blade of Vengeance (p. 300): +2 bastard sword granting advantage against undead and casting turn undead once per day;
  - Boots of Dancing (p. 300): cursed boots causing uncontrolled movement and requiring DC 15 Dexterity check to remove;
  - Boots of Hovering (p. 300): allows walking on insubstantial surfaces for one turn.

