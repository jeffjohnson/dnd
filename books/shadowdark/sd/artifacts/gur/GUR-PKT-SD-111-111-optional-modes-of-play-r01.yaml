candidate_domains_note: None proposed. The modes cut across every part of the game, touching light, initiative,
  death, resting, experience, checks, damage and luck tokens, so assigning them to one domain would misdescribe
  them. If a domain for optional or variant rules were ever wanted, that is an Architect matter and section
  8 reserves it.
