why_the_modes_are_identities: 'Eight of the nine proposed identities are the modes themselves, and that
  is a different judgement from the one made about the danger levels in PKT-SD-090-090 and the carousing
  outcomes in PKT-SD-091-093, both of which were declined. The difference is worth stating because the
  surface resemblance is close: all three are named items under a heading.

  The declined ones carried only a magnitude. Unsafe, Risky and Deadly differ from each other by an interval
  and nothing else, so an identity for each would hold nothing a field could carry and connect to nothing.
  Each mode here carries between one and four mechanical relations to canonical rules: Grinder Mode alone
  touches resting, the dwarf ancestry, advantage and spellcasting recovery. Without identities those relations
  have no source, and the page''s actual content would be unrepresentable.

  The ninth identity is the frame, rule_modes_of_play, which carries the fact that makes every other row
  optional. It is the same shape as rule_downtime in PKT-SD-091-093, with one deliberate difference: downtime''s
  activities are mutually exclusive and took an ALTERNATIVE_TO row, whereas this page says to mix and
  match, so no exclusivity is asserted between the modes.'
authored_polarity_declaration: 'Authored polarity appears on eleven rows and no others, each with basis
  read as invariant 15 requires, and each is a MODIFIES or CONSTRAINS row as constitution section 5 allows.
  The single CONSTRAINS row takes governs. Five take worsens: the shortened light timer, the fixed death
  timer, the raised stabilize difficulty and the reduced rest recovery. Four take improves: the dwarven
  recovery advantage, the repeated-action benefit, exploding damage and the expanded luck token supply,
  plus the monster experience award. One takes neutral, Chaos Mode''s initiative reroll, because rerolling
  every round is neither better nor worse for the party as a whole; it is a change of procedure.

  The eight GATES rows, the four FEEDS_INTO rows and the one OVERRIDES row carry none, since section 5
  derives those.'
supersession_note: 'One OVERRIDES row appears, rule_fatality_mode over rule_dying, with supersession_basis
  optional_variant as constitution section 7 requires and invariant 20 checks. optional_variant rather
  than explicit_replacement because the mode is offered as an option a table may adopt, not a rule the
  book replaces; the dying state remains in force in a default game. This matches the one canonical optional
  OVERRIDES precedent, rule_stat_reroll over rule_stat_generation from printed page 15, which carries
  the same basis at the same status, and differs from the two core OVERRIDES rows, which both carry explicit_replacement.

  Fatality Mode is the only mode that removes a rule rather than adjusting one, which is why it is the
  only OVERRIDES here. Deadly Mode looks similar but is not: it fixes the death timer at its minimum and
  hardens stabilizing, leaving the dying state intact, so it takes two MODIFIES rows.'
