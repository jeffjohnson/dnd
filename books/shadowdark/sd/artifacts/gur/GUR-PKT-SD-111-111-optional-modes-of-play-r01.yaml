candidate_general_rules_note: None proposed. The eight GATES rows repeat one shape, but they enumerate
  eight named modes rather than instancing a rule, and the Analyst is prohibited from promoting a general
  rule.
non_edge_observations:
- id: OBS-01
  subject: magnitudes are excluded from every row
  detail: 'Every mode is defined partly by a number and none reaches a field: the shortened light duration,
    the fixed death timer value, the raised stabilize difficulty, the hit point die and stat damage a
    rest restores, the count of spells regained, the fraction of a monster''s level granted as experience,
    the starting luck tokens. All stay in the immutable packet. No row in this packet carries a condition,
    so there is no opportunity for a spelled quantity to enter one; no aspect carries a digit.

    Blitz Mode is the starkest case. Its entire content is a number: light timers last a stated span.
    The row carries that the mode shortens the light timer and that the change is for the worse, which
    is everything expressible, and a reader who needs the figure reads printed page 111.'
- id: OBS-02
  subject: Fatality Mode is the only mode that removes a rule
  detail: 'Recorded because the distinction drove a type choice. Fatality Mode says characters die at
    zero hit points, which deletes the dying state, its timer, its two aided escapes and its unaided one
    in a single sentence. That is OVERRIDES.

    Deadly Mode reads similarly but does the opposite: it keeps the dying state and makes it harsher,
    fixing the timer at its minimum and raising the stabilize difficulty. Those are two MODIFIES rows.
    A reader comparing the two modes should be able to see from the graph that one adjusts the death machinery
    and the other abolishes it, and the type carries that.'
- id: OBS-03
  subject: the forced GM reroll is not representable
  detail: 'Pulp Mode''s last bullet lets a player spend a luck token to force the GM to reroll a roll.
    It is not asserted. There is no identity for the GM, for a GM roll, or for rerolling as distinct from
    the luck token''s existing canonical reroll row, rule_luck_token MODIFIES rule_check with aspect reroll
    from printed page 79.

    The other two new token uses are asserted, because each points at a canonical identity: a critical
    hit at rule_critical_success and an extra action at rule_action. The asymmetry is in the source, not
    the extraction. This is the same class of gap as the NPC outcomes in PKT-SD-091-093: the graph holds
    what the rules touch and misses what sits between players and GM.'
- id: OBS-04
  subject: Hunter Mode implies monster levels the graph does not hold
  detail: 'The mode grants experience equal to a fraction of a defeated monster''s level. exp_xp is canonical
    and the award is asserted against it, but nothing connects it to monsters, because no monster identity
    exists and the Monsters chapter is unextracted. exp_level is the character level identity and pointing
    there would be wrong, since a monster''s level is a different quantity that happens to share a name.

    So the row says Hunter Mode improves experience, and what it is improved by remains unstated. When
    the Monsters chapter is extracted this row may deserve a companion, and that will be a judgement at
    that locus rather than here.'
- id: OBS-05
  subject: no exclusivity is asserted between the modes
  detail: 'The page opens by telling the reader to mix and match, so the eight modes are explicitly compatible
    and no ALTERNATIVE_TO row appears. This is deliberately the opposite of the downtime activities in
    PKT-SD-091-093, where the source said a character chooses one activity and that exclusivity was the
    frame''s mechanical content.

    Two modes are arguably in tension in play, since Deadly Mode tunes a death timer that Fatality Mode
    abolishes, but the source does not say they conflict and an Analyst inference about how two optional
    rules interact is not a source-supported dependency.'
unresolved_identity_questions: []
unresolved_identity_questions_note: 'None. The one judgement that could have gone otherwise, whether to
  propose the modes as identities at all, is argued in why_the_modes_are_identities against the two packets
  where the parallel judgement went the other way, and the distinguishing test is whether the named thing
  carries relations or only a magnitude. If Reviewer disagrees, the consequence is large and clean: the
  nine identities and all 24 rows fall together, because every row runs to or from a mode.'
architectural_escalations: []
architectural_escalation_note: None raised. Every identity uses an approved prefix, every row uses a legal
  edge type at a legal status, the single OVERRIDES row carries a section 7 basis, and no CLASSIFIED_AS
  row appears. The status optional convention is already established in production and needs no ruling.
completeness_statement: All eight modes and the framing sentence on the single page in scope were read
  in full at the recorded checksum. The packet yields 9 new identities and 24 rows, all citing printed
  page 111 and all at status optional, reusing 14 canonical identities. Every row was checked against
  the 650 canonical edges for an assertion-key collision, for a shared source, type and target under a
  different aspect, and for duplicates within the patch; there are none of any. Every reused label was
  verified character for character against the registry. No row carries a condition and no aspect carries
  a digit. What is deliberately not asserted is listed as OBS-01 through OBS-05, and there are no open
  identity questions. No assertion depends on any other ruleset.
