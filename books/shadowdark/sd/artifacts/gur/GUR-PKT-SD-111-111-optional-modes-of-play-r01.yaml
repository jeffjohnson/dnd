page_attribution_basis: One marker resolves this packet. p111 ends the MODES OF PLAY heading, which is
  also the section's first heading, and placement rule 1 applies it to that whole heading while the persistence
  rule carries it across all eight mode subsections. All 24 rows cite printed page 111. No content precedes
  the marker and no page is shared.
scope_boundary: The bounded scope is the Primary Source Material section, the single printed page 111
  and its eight named modes. The trailing Supporting Source Context is out of scope.
source_summary: One page of eight optional modes, introduced as rules to mix and match for new challenges
  and gameplay styles. Blitz shortens light timers. Chaos rerolls initiative every round. Deadly fixes
  the death timer at its minimum and raises the difficulty of stabilizing. Fatality removes the dying
  state entirely, killing a character at zero hit points. Grinder cuts what a rest restores, gives dwarves
  advantage on that roll, and limits how many lost spells a caster regains. Hunter grants experience for
  defeated monsters by their level. Momentum gives advantage on repeating a failed action and makes damage
  dice explode without cap. Pulp removes the cap on luck tokens, starts each session with several, and
  lets a token buy a critical hit, an extra action or a forced GM reroll.
optional_status_note: 'Every one of the 24 rows carries status optional, and this is the first packet
  in the intake where that is the entire character of the page rather than an incidental property of one
  rule. The source states it plainly in its opening line: these are optional rules to mix and match.

  The distinction matters for anyone reading the graph. A query that does not filter on status will now
  return, for instance, that Fatality Mode overrides the dying state and that damage dice explode, neither
  of which is true of a default Shadowdark game. Precedent exists and was checked rather than assumed:
  production held 639 core rows and 11 optional ones before this packet, the optional ones being the random-character
  tables and the stat-reroll variant from printed pages 15, 40 and 41.

  Nothing here is marked core even where it touches a core rule. Blitz Mode modifies the light timer,
  but the modification is optional; the underlying timer rule stays core and untouched at its own locus.'
graph_state_at_extraction: 'Read from the repository at extraction, not recalled: the canonical graph
  holds 305 registry rows and 650 edges. The registry was read in full and matched against what each mode
  actually changes, which is how the fourteen reused identities were found; several, including rule_stabilize,
  rule_dying and rule_luck_token, would not have surfaced from a keyword search on the words this page
  uses.

  Every proposed row was checked against the canonical edge set for an assertion-key collision, for the
  weaker case of a shared source, type and target under a different aspect, and for duplicates within
  the patch; there are none of any. Every reused label was additionally checked character for character
  against the registry, a check added after discovering that a label I wrote in PKT-SD-091-093 was normalised
  downstream.'
