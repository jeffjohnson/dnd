non_edge_observations:
  - id: OBS-01
    subject: Keen Senses surprise immunity operates on creature locus
    detail: >-
      Keen Senses ("Can't be surprised") recurs identically across Goblin, Goblin Boss, and Goblin
      Shaman. Under Constitution 2.5, this constitutes a creature defense trait on combat locus
      rather than a structural alteration of the general surprise rule.
  - id: OBS-02
    subject: Goblin Shaman innate WIS spells operate on creature locus
    detail: >-
      Bug Brain, Skitter, and Stink Bomb are defined directly in the Goblin Shaman stat block with
      individual DCs (13, 12, 12) and creature-specific durations, operating under monster spellcasting
      rules without cross-mechanic character spell edges.
  - id: OBS-03
    subject: Armor notations explain inherent AC values
    detail: >-
      Goblin Boss (chainmail) and Goblin Shaman (leather) list armor notations explaining their AC 14
      and 12 values within the creature stat blocks.

