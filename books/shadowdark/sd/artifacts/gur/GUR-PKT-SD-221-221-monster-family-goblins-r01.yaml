rejected_candidates:
  - text_locus: 'the family introduction (paragraphs 1 and 2), p221'
    quoted_gist: >-
      Goblins are the smallest and most numerous of the goblinoids, often serving hobgoblins,
      bugbears, or even hill giants as replaceable lackeys. They live in filthy, subterranean warrens
      built of scavenged materials. The goblin boss rules by cruelty and strength, and the shaman
      wields cryptic sorcery.
    why_considered: >-
      Checked for goblinoid taxonomy, faction rules, or servile relationships to other monsters.
    rejection_reason: >-
      Narrative lore, social hierarchy, and descriptive framing across two paragraphs; constitution 2.4.
  - text_locus: 'Keen Senses trait on all three goblins, p221'
    quoted_gist: 'Canʼt be surprised.'
    why_considered: 'Checked against rule_surprise.'
    rejection_reason: >-
      Stat-block trait on creature locus. Immunity to surprise is a creature-specific defense trait;
      constitution 2.5 locus rule applies.
