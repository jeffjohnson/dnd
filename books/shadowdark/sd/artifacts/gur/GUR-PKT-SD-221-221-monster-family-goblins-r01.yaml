source_summary: >-
  The GOBLINS family: two introductory paragraphs describing goblins as the smallest and most
  numerous goblinoids living in subterranean warrens under cruel bosses and sorcerous shamans,
  followed by three stat blocks: Goblin, Goblin, Boss, and Goblin, Shaman. All three carry Keen
  Senses (cannot be surprised). Goblin, Boss carries an armor notation (chainmail). Goblin, Shaman
  carries an armor notation (leather) and three innate WIS spells: Bug Brain, Skitter, and Stink Bomb.

