source_summary: >-
  Pages 274–275 present the Treasure 7-9 section, consisting of a d100 random treasure table (TREASURE TABLE 7-9)
  containing 50 roll entries. The table determines loot carried by 7th- to 9th-level monsters or found as
  unguarded treasure by 7th- to 9th-level characters. Entries include coins, mundane and ornate gear (boots,
  greatsword, mirror, bastard swords, longbow, chess board, shield, chainmail, robe, lantern, surcoat, helm),
  trade goods, art objects, and curios (statuette of elf archer, taxidermied smilodon, cameo necklace, ivory horn mug,
  unicorn horn, basilisk egg, holy symbol of Madeera, dragon mask, gold censer, statue of armored angel, cockatrice eggs,
  giant pearl, gold python, oil painting, tentacled idol, wyvern hatchling in amber, obsidian statue of horse,
  faceted emerald), and high-tier magic items and blessings (Potion of Healing, Potion of Polymorph, 3rd-tier magic wand,
  4th-tier spell scroll, Crystal Ball, 4th-tier magic wand with flaw, Immovable Rod, +2 magic armor, +2 mithral magic
  armor with virtue, Scorpion idol with Death's Sting blessing, Necromancy circle with Ghostwalk blessing, Owl statue
  with Arcane Eye blessing, +2 magic weapon with flaw, and +3 magic weapon with virtue).

