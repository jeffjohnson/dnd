rejected_candidates:
  - text_locus: 'TREASURE TABLE 7-9 monetary values, pp274–275'
    quoted_gist: '2 cp, 5 sp, 12 sp, 15 gp, 20 gp, 25 gp, 30 gp, 35 gp, 40 gp, 45 gp, 50 gp, 55 gp, 60 gp, 65 gp, 70 gp, 75 gp, 25 gp each, 80 gp, 85 gp, 90 gp, 95 gp, 110 gp, 120 gp, 200 gp, 250 gp, 260 gp, 300 gp, 320 gp, 350 gp, 500 gp, 900 gp'
    why_considered: 'Checked for item_coin monetary relationships or price valuations.'
    rejection_reason: >-
      Monetary values and prices are numeric magnitudes prohibited from edge aspect and condition
      by Invariant 11 and Constitution section 5. They do not generate edges.
  - text_locus: 'TREASURE TABLE 7-9 mundane gear items, pp274–275'
    quoted_gist: 'boots, greatsword, mirror, bastard swords, longbow, shield, chainmail, robe, lantern, surcoat, helm'
    why_considered: 'Checked for table edges to canonical weapons, armor, and gear items.'
    rejection_reason: >-
      Mundane equipment items listed as loot are roll outcomes rather than definitions or modifications
      of equipment rules. Equipment definitions have their defining loci on pages 33–37 (Basic Gear, Weapons, Armor).
      Random encounter, shop, and treasure tables do not link to mundane gear outcomes unless a specific
      mechanical modification is introduced.
  - text_locus: 'TREASURE TABLE 7-9 art objects, curios, and deity mentions, pp274–275'
    quoted_gist: 'Gold holy symbol of Madeera with a large pearl; red dragon mask; gold censer; statue of armored angel; wyvern hatchling in amber'
    why_considered: 'Checked for deity_madeera_the_covenant or special item proposals.'
    rejection_reason: >-
      The holy symbol is an ornate trade curio / art object sold for coin value. It does not define or alter
      worship, spells, or rules for deity_madeera_the_covenant. Minting identities from incidental descriptive
      curios is prohibited.
  - text_locus: 'TREASURE TABLE 7-9 ancestry and craftsmanship descriptors, pp274–275'
    quoted_gist: 'statuette of an elf archer; horn mug carved with drinking dwarves; cameo necklace of a humanʼs profile'
    why_considered: 'Checked for edges to ancestry_elf, ancestry_dwarf, or ancestry_human.'
    rejection_reason: >-
      Aesthetic craftsmanship descriptors and subject matter of artwork. Constitution section 2.4
      prohibits ancestry membership or property edges without mechanical rules.
  - text_locus: 'TREASURE TABLE 7-9 magic items, blessings, and special loot, p275'
    quoted_gist: 'Potion of Healing; Potion of Polymorph; Magic wand, 3rd-tier; 4th-tier spell scroll; Crystal Ball; Magic wand, 4th-tier; Immovable Rod; +2 magic armor; +2 mithral magic armor; Scorpion idol, Deathʼs Sting blessing; Necromancy circle, Ghostwalk blessing; Owl statue, Arcane Eye blessing; +2 magic weapon; +3 magic weapon'
    why_considered: 'Checked for candidate magic item nodes (item_crystal_ball, item_immovable_rod, etc.) or edges to item_magic_item, item_spell_scroll, item_wand.'
    rejection_reason: >-
      Specific magic items, boons/blessings, magic armor generation, magic weapon benefits, virtues, flaws, and curses
      have their defining loci in the magic item chapters (pages 276+, packets 124–130+). Individual table
      results on random treasure tables do not mint new item or boon identities ahead of their defining loci,
      and Invariant 1 prohibits edges referencing non-existent nodes. Nor do loot tables feed into item categories;
      rather, item_magic_item and item_coin feed into rule_treasure as advancement inputs (page 117).
  - text_locus: 'TREASURE TABLE 7-9 Potion of Healing healing value, p275'
    quoted_gist: 'Potion of Healing (heals 3d8 damage)'
    why_considered: 'Checked for edge from tbl_treasure_7_9 to rule_hit_points or rule_damage.'
    rejection_reason: >-
      The 3d8 damage expression is a die expression and numeric magnitude prohibited under Invariant 11.
      Furthermore, the healing mechanic belongs to the potion item definition in packet 128 (Potions),
      not to this loot table roll entry.
  - text_locus: 'Context: Treasure overview passages, p269'
    quoted_gist: 'The treasure table the monster uses corresponds to its level... The GM can randomly generate unguarded treasure by rolling on the treasure table that matches the discovering characterʼs level.'
    why_considered: 'Checked for exp_level or mstat_monster_level feeding into tbl_treasure_7_9.'
    rejection_reason: >-
      Supporting source context from packet 119 is out of scope per Scope Boundary; no row here may cite page 269.
      Both exp_level and mstat_monster_level feeding into rule_treasure are already canonical from pages 269 and 192,
      and rule_treasure is resolved by tbl_treasure_7_9 on page 274.
