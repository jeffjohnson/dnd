page_attribution_basis: >-
  Markers resolve through the Pandoc AST rather than positionally, each a plain marker ending a
  heading, which placement rule 1 applies to the whole heading. The bolded entries under MOVEMENT and
  the subsections elsewhere carry no marker of their own and take their page from the persistence
  rule, so each row is cited to the page of the subsection it is drawn from.

scope_boundary: >-
  The bounded scope is the Primary Source Material section, printed pages 84 through 85. Any other
  page the parser resolves lies inside the trailing Supporting Source Context, is claimed by another
  packet, and contributed nothing here.

source_summary: >-
  Printed page 84 is CRAWLING: it describes the Shadowdark as a place, defines the crawling round as the unit of exploration play, states that characters need light to see, gives the light-source timer rules, and defines total darkness with its two consequences. Page 85 is MOVEMENT: it fixes the three distance bands and gives rules for climbing, falling, moving through creatures and swimming, then defines regrouping, discusses conditions generally, and lists example crawling actions. This summary is orientation only; every assertion below cites its page.

extraction_posture: >-
  This packet is the defining locus for light sources and for the three distance bands. Both have been deferred repeatedly: the torch and lantern gear entries on printed page 34 pointed here for light, and the weapons table, several spell entries and the movement allowance all express themselves in close, near and far without those bands existing as an identity. Both are now proposed and given their rows.
  What the packet does not do is attach individual items to the light-source concept. That is membership, which DEC-2026-0103 confined to spell classifications; see OBS-01.

graph_state_at_extraction: >-
  The canonical graph holds 175 registry rows, read at extraction rather than recalled, together with
  the canonical edge set so every proposed row could be checked against the section 4 assertion key
  before publication. The domain registry is still empty and general_rules.json is still an empty
  object.

