candidate_general_rules_note: >-
  None proposed. The movement modes repeat a shape, each being resolved by a check and bounding
  speed, but each states its own distinct rule rather than instancing a general one, and the Analyst
  is prohibited from promoting a general rule in any case.

non_edge_observations:
  - id: OBS-01
    subject: no item is attached to the light-source concept
    detail: >-
      A torch, a lantern and a campfire are all light sources, and all three are or will be item identities. No row says so. Saying it would be a membership assertion, and DEC-2026-0103 authorised CLASSIFIED_AS only for spell casting class and spell tier, leaving all other taxonomy outside the graph.
            The consequence is concrete and worth stating: a query for what provides light returns nothing, even though the rule that light is needed to see is asserted as M001. The individual timers on the torch and lantern entries remain magnitudes in their own packets. This is the clearest case so far of the boundary the Decision drew costing something real, and it is recorded rather than worked around.
  - id: OBS-02
    subject: darkness-adapted beings are an exception with no identity
    detail: >-
      The VISION subsection says light is needed by all characters but not by the darkness-adapted beings of the Shadowdark, and the TOTAL DARKNESS rule applies its penalty only to a creature that is not darkness-adapted. That exception is mechanical, and it is not asserted: darkness-adapted is a property of creatures the Monsters chapter defines, no creature identity exists, and inventing one from an exception clause would fix a creature category from the wrong locus. M001 and M002 assert the rule as it applies to characters.
  - id: OBS-03
    subject: the light-timer stacking options are procedure, not dependency
    detail: >-
      Page 84 gives two options when more than one light source is lit, riding along on the current timer or extinguishing the old ones and starting fresh, and adds that the GM may rule otherwise because the point is to keep tracking simple. This is guidance about how to administer a timer rather than a relation between two mechanics, and the timer duration is a magnitude. Not extracted.
  - id: OBS-04
    subject: either-or stat choices are not split into two rows here
    detail: >-
      Climbing and moving through enemies each call for a Strength or Dexterity check, and swimming calls for a Strength check in rough water and a Constitution check for breath. Only the Constitution one is asserted as a stat dependency, in M013, because the source ties breath specifically to Constitution. The Strength-or-Dexterity choices are recorded as resolution by the ordinary check without naming either stat, because the page offers the choice rather than making either stat a dependency of the movement mode. This differs deliberately from the Farsight and talents rows elsewhere, where the source attaches a distinct effect to each branch.
  - id: OBS-05
    subject: conditions and example actions yield nothing
    detail: >-
      The CONDITIONS subsection says some effects impose a condition, gives blindness and being webbed as examples, and says advantage, disadvantage and common sense apply. It names no condition mechanic with an identity; blindness and webbing come from effects defined elsewhere. The ACTIONS subsection lists six example crawling actions, from prying a gem to giving a speech; these illustrate what a player might do and state no rule. THE SHADOWDARK subsection is setting description.
  - id: OBS-06
    subject: magnitudes deliberately excluded
    detail: >-
      The pages carry the light-source duration, the three distance measurements, the climb and swim speed fractions, the climb failure margin, the fall damage expression and its distance interval, and the drowning damage expression. All are durations, distances, fractions, thresholds or die expressions, excluded by constitution section 1 and invariant 11. They remain in the immutable claimed packet. No aspect contains a digit and no condition restates a quantity.

unresolved_identity_questions:
  - id: IDQ-01
    subject: whether the distance bands should also be individual identities
    detail: >-
      rule_distance is proposed as one identity covering the band system. The three bands, close, near and far, are each source-named and each is used by name across the book, so three identities were considered instead.
            They were not proposed, for two reasons. Each band's content is a measurement, which is a magnitude the graph does not store, so three nodes would carry nothing but their names. And relating a band to the band system would be membership, which is outside the graph. What is mechanically true and assertable is that the band system bounds movement, which M005 carries.
            Consequence if wrong: if a later Decision makes the individual bands representable, three nodes are added and weapon ranges and spell ranges can point at them; nothing here is retracted, because M005 stays true either way.

architectural_escalations: []
architectural_escalation_note: >-
  None raised. Every proposed node uses an approved constitution section 2 prefix with an unchanged
  kind, every edge uses one of the fourteen legal section 3 types, and no new prefix, edge type,
  domain promotion or general-rule application is requested. The membership questions this packet
  declines were settled against representation by DEC-2026-0103, which confined CLASSIFIED_AS to
  spell classifications; they are recorded in the observations rather than re-escalated.

completeness_statement: >-
  All printed pages in the declared span are accounted for, and every heading, subsection, bolded
  entry, list and paragraph within them was read. Each produced either an edge or a dispositioning
  observation; nothing was skipped. Every page marker was resolved through the Pandoc AST and each
  row is cited to the page of the subsection it is drawn from. Every row was checked against the
  canonical edge set for an assertion-key collision before publication. Content not converted to an
  edge is accounted for in the observations above, and the question the Analyst could not settle is
  recorded rather than resolved silently. No assertion depends on any other ruleset.
