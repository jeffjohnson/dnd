rejected_candidates:
  - text_locus: 'TREASURE TABLE 0-3 monetary values, pp270–271'
    quoted_gist: '(1 cp), (2 cp), (6 gp), (10 gp), (60 gp), (80 gp), (100 gp), (150 gp), (200 gp), etc.'
    why_considered: 'Checked for item_coin monetary relationships or price valuations.'
    rejection_reason: >-
      Monetary values and prices are numeric magnitudes prohibited from edge aspect and condition
      by Invariant 11 and Constitution section 5. They do not generate edges.
  - text_locus: 'TREASURE TABLE 0-3 mundane gear items, pp270–271'
    quoted_gist: 'torch, lantern, dagger, greataxe, longbow, arrows, leather armor, shield, bastard sword, greatsword, shortsword, chainmail, warhammers'
    why_considered: 'Checked for table edges to canonical weapons, armor, and gear items.'
    rejection_reason: >-
      Mundane equipment items listed as loot are roll outcomes rather than definitions or modifications
      of equipment rules. Equipment definitions have their defining loci on pages 33–37 (Basic Gear, Weapons, Armor).
      Random encounter, shop, and treasure tables do not link to mundane gear outcomes unless a specific
      mechanical modification is introduced.
  - text_locus: 'TREASURE TABLE 0-3 art objects and curio mentions, pp270–271'
    quoted_gist: 'Bent, tin fork; Silver tooth; Obsidian statuette of Shune the Vile; Jade-and-gold scarab pin; Mithral locket; Gold monkey idol'
    why_considered: 'Checked for deity_shune_the_vile or curio/valuables node proposals.'
    rejection_reason: >-
      These entries are descriptive flavor for valuable items and art objects sold for coin value.
      The obsidian statuette of Shune the Vile is an art object curio and does not define or alter
      worship, spells, or rules for deity_shune_the_vile. Minting identities from incidental descriptive
      curios is prohibited.
  - text_locus: 'TREASURE TABLE 0-3 ancestry and craftsmanship descriptors, pp270–271'
    quoted_gist: 'Pair of elf-forged shortswords; painting of a halfling; Two finely forged dwarven shields'
    why_considered: 'Checked for edges to ancestry_elf, ancestry_halfling, or ancestry_dwarf.'
    rejection_reason: >-
      Aesthetic craftsmanship descriptors and subject matter of artwork. Constitution section 2.4
      prohibits ancestry membership or property edges without mechanical rules.
  - text_locus: 'TREASURE TABLE 0-3 minor magic items and special loot, p271'
    quoted_gist: '1st-tier spell scroll; Potion of Invisibility; Magic wand, 2nd-tier spell; Egg of The Cockatrice; +1 armor (benefit, curse); Bag of Holding (virtue, flaw); +1 magic weapon (benefit)'
    why_considered: 'Checked for candidate magic item nodes (item_bag_of_holding, item_egg_of_the_cockatrice, item_potion_of_invisibility) or edges to item_magic_item, item_spell_scroll, item_wand.'
    rejection_reason: >-
      Specific magic items, magic armor generation, magic weapon benefits, virtues, flaws, and curses
      have their defining loci in the magic item chapters (pages 276+, packets 124–130+). Individual table
      results on random treasure tables do not mint new item identities ahead of their defining loci,
      and Invariant 1 prohibits edges referencing non-existent nodes. Nor do loot tables feed into item categories;
      rather, item_magic_item and item_coin feed into rule_treasure as advancement inputs (page 117).
  - text_locus: 'Context: Treasure overview passages, p269'
    quoted_gist: 'The treasure table the monster uses corresponds to its level... The GM can randomly generate unguarded treasure by rolling on the treasure table that matches the discovering characterʼs level.'
    why_considered: 'Checked for exp_level or mstat_monster_level feeding into tbl_treasure_0_3.'
    rejection_reason: >-
      Supporting source context from packet 119 is out of scope per Scope Boundary; no row here may cite page 269.
      Both exp_level and mstat_monster_level feeding into rule_treasure are already canonical from pages 269 and 192,
      and rule_treasure is resolved by tbl_treasure_0_3 on page 270.
