source_summary: >-
  Pages 270–271 present the Treasure 0-3 section, consisting of a d100 random treasure table (TREASURE TABLE 0-3)
  containing 50 roll entries. The table determines loot carried by 0th- to 3rd-level monsters or found as
  unguarded treasure by 0th- to 3rd-level characters. Entries include mundane coins and equipment (fork, torch,
  pebbles, lantern, tooth, dagger, vials, mirror, greataxe, longbow and arrows, leather armor, shield, bastard sword,
  greatsword, shortswords, spikes, mead tankard, cloak, game pieces, chainmail, warhammers, slippers and robe),
  valuable trade goods and art objects (emerald chips, golden bowl, statuette of Shune the Vile, pearls, scarab pin,
  halfling locket, dwarven shields, silvered daggers, dragon scales, sapphire fragment, circlet, gold monkey idol,
  cracked emerald), and minor magic items (1st-tier spell scroll, Potion of Invisibility, 2nd-tier magic wand,
  Egg of The Cockatrice, +1 armor with benefit and curse, Bag of Holding with virtue and flaw, and +1 magic weapon with benefit).

