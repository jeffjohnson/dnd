authored_polarity_declaration: Authored polarity appears on two rows and no other, each with basis read
  as invariant 15 requires. The CONSTRAINS row takes governs and the TRIGGERS row takes inflicts. The
  RESOLVED_BY row carries none, since constitution section 5 derives it. No MODIFIES row appears in this
  packet.
hedging_note: 'Every mechanical sentence on this page is hedged, and that decided the one type choice
  worth explaining. Some hazards inhibit or prevent movement; some deal ongoing damage; certain hazards
  weaken. None is absolute.

  M001 therefore takes CONSTRAINS rather than EXCLUDES even though the sentence contains the word prevent,
  because the hedge governs the sentence: some hazards prevent movement, not hazards prevent movement.
  The same sentence''s tail, that hazards can even fully entrap characters, is an intensification of the
  same fact rather than a second fact, and is hedged again with can, so it does not earn a separate EXCLUDES
  row. Three canonical spells do hold EXCLUDES rows against ex_movement, from Resilient Sphere, Wall of
  Force and Web, and each of those states its prevention absolutely; the contrast is the test working.'
