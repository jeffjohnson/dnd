page_attribution_basis: One marker resolves this packet. p115 ends the HAZARDS heading, which is also
  the section's first heading, and placement rule 1 applies it to that whole heading while the persistence
  rule carries it across the table. All three rows cite printed page 115. No content precedes the marker
  and no page is shared.
scope_boundary: The bounded scope is the Primary Source Material section, the single printed page 115
  and its table. The trailing Supporting Source Context is out of scope.
source_summary: 'Hazards are passive danger in the environment, usually impossible to defeat or permanently
  disable, and unlike traps most are obvious from the start. Four bolded paragraphs follow. Movement Restriction:
  some hazards inhibit or prevent movement and can fully entrap characters, with quicksand and slippery
  ice as examples. Damage: some deal ongoing damage, such as toxic spores or acid rain. Weakening: certain
  hazards weaken or hamper characters, such as antimagic zones or vapours that sap physical strength.
  Combining: the most insidious hazards combine more than one type. A d12 table then gives twelve examples
  in each of the three columns.'
graph_state_at_extraction: 'Read from the repository at extraction, not recalled: the canonical graph
  holds 320 registry rows and 689 edges. The registry was read in full and every reused label verified
  character for character. No canonical row cites printed page 115, so nothing in this span has been extracted
  before, and no hazard identity existed.

  rule_traps and tbl_traps became canonical in the immediately preceding integration and their five rows
  were read before anything here was written, because this page defines hazards partly by contrast with
  traps. Every proposed row was checked against the canonical edge set for an assertion-key collision,
  for a shared source, type and target under a different aspect, and for duplicates within the patch;
  there are none of any. The new movement row does not collide with the nine canonical rows already constraining
  or excluding ex_movement, which differ in source.'
low_yield_note: 'Three rows from a page that closely parallels the traps page, which yielded six. The
  difference is not effort and it is worth setting out, because the two pages look alike and a reader
  comparing them will notice.

  The traps prose states how a check interacts with a trap at three separate moments, finding, avoiding
  and disabling, and each of those is a relation between two canonical identities. The hazards prose states
  no check interaction at all. What it states instead is what hazards do, in three kinds: restrict movement,
  deal damage, and weaken. Two of those have a canonical target and are asserted. The third does not,
  and that is the whole of the difference; see OBS-01.

  The page also says hazards usually cannot be defeated or disabled, which is the exact converse of the
  trap disabling rule now in production, and that could not be carried either. See OBS-02.'
