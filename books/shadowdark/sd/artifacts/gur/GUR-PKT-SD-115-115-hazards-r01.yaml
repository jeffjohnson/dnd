unresolved_identity_questions_note: 'None. The three judgements that could have gone otherwise are each
  argued against a settled test: the hedging test decides M001''s type, the incidental-locus test decides
  the Caltrops cell, and the missing-endpoint rule decides Weakening and the undefeatability claim. What
  remains open is not a question for this packet but the condition vocabulary recorded as OBS-01, which
  is an Architect matter.'
architectural_escalations: []
architectural_escalation_note: None raised. Both identities use an approved prefix, every row uses a legal
  edge type at status core, no row carries supersession_basis and none is an OVERRIDES, and no CLASSIFIED_AS
  row appears. OBS-01 records accumulating evidence for a condition vocabulary and OBS-02 records an expressiveness
  limit, and neither is escalated from inside a packet.
completeness_statement: 'The whole of printed page 115, its opening statement, four bolded paragraphs
  and thirty-six-cell table, was read at the recorded checksum. The packet yields 2 new identities and
  3 rows, all citing page 115, reusing 2 canonical identities whose labels were verified character for
  character. Every row was checked against the 689 canonical edges for an assertion-key collision, for
  a shared source, type and target under a different aspect, and for duplicates within the patch; there
  are none of any, and no canonical row cited this page before.

  Five candidates were rejected and each is recorded with its reason. The yield is low relative to the
  parallel traps page and low_yield_note explains why in terms of what the two pages state rather than
  how they were read. What is deliberately not asserted is listed as OBS-01 through OBS-03 and there are
  no open identity questions. No assertion depends on any other ruleset.'
