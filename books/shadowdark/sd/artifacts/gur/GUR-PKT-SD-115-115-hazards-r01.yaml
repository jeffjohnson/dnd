rejected_candidates:
- text_locus: Weakening, p115
  quoted_gist: '''Certain hazards weaken or hamper the characters. These could include antimagic zones
    or vapors that sap physical strength.'''
  why_considered: 'It is one of the three stated kinds of hazard and the other two both yielded rows,
    so declining it needs a reason. Its two examples also point at canonical identities: an antimagic
    zone at rule_spellcasting_check and sapped physical strength at abil_strength, with abil_stat_modifier
    a further candidate.'
  rejection_reason: The general statement has no target. Weakening or hampering a character is not a named
    mechanic and there is no identity for a weakened state, which is the same condition-vocabulary gap
    recorded as OBS-02 of PKT-SD-114-114. The two examples are introduced with could include, which marks
    them as illustrations of the kind rather than as rules; asserting rule_hazards MODIFIES abil_strength
    from them would claim that hazards as a class reduce Strength, which the page does not say. Recorded
    as OBS-01 because this is the second consecutive packet where the missing condition vocabulary costs
    the larger part of a page's content.
- text_locus: the opening statement, p115
  quoted_gist: '''There is often no way to defeat or permanently disable them.'' and ''Unlike traps, most
    hazards are obvious from the start.'''
  why_considered: 'This is the closest call in the packet. Both sentences define hazards by contrast with
    traps, rule_traps is canonical as of the immediately preceding integration, and its five rows include
    exactly the two things being contrasted: class_thief GATES rule_traps on disabling access, and rule_check
    EXCLUDED_FROM rule_traps on trap discovery. A reader who has both pages in view should be able to
    see the contrast.'
  rejection_reason: 'Neither sentence states a relation between two identities. The first says hazards
    usually cannot be disabled, which is the absence of a relation, and the graph has no way to assert
    that something does not connect to anything; there is no disabling identity for hazards to be excluded
    from, since disabling exists in the graph only as an aspect on a thief row. The second says hazards
    are obvious, and obviousness has no identity either.

    An ALTERNATIVE_TO row between hazards and traps was considered and rejected on the vocabulary: that
    type means mutually exclusive or substitutable, and hazards and traps are neither, they are two kinds
    of danger that can appear in the same room. Recorded as OBS-02.'
- text_locus: the Movement column entry for Caltrops, p115
  quoted_gist: Caltrops listed as one of twelve example movement hazards
  why_considered: item_caltrops is canonical, a gear entry from the equipment chapter, and this cell names
    it exactly. Under the incidental-locus test both endpoints exist and the page appears to state a relationship,
    which is the shape that carried the torch extinguish row in PKT-SD-096-100.
  rejection_reason: 'It fails the test that the previous packet''s condition effects failed, in mirror
    image, and declining it is the same discipline. Thirty-six flavour entries fill this table and exactly
    one happens to share a name with a canonical identity; asserting that one would be selecting a row
    because a string matched, not because the page states a rule. The page states no mechanic about caltrops
    at all, only that they are an example of a movement hazard, and the same cell could as easily have
    read loose gravel.

    The incidental-locus test requires the source to state a relationship, not merely to mention two things
    that both have identities. Here the relationship asserted would be that the purchasable gear item
    is a hazard rule, which conflates an object a character buys and deploys with passive environmental
    danger. Recorded as OBS-03.'
- text_locus: the rest of the Hazards Table, p115
  quoted_gist: thirty-five further example hazards across three columns, including antimagic zones, magical
    silence, snuffed light sources, sleep-inducing spores and confusing reflections
  why_considered: 'Several name concepts adjacent to canonical identities: snuffing light sources is close
    to rule_light_source, magical silence to spell_silence, antimagic to rule_spellcasting_check, and
    sleep-inducing and confusing to the same spells that tempted the previous packet.'
  rejection_reason: 'They are flavour prompts for a GM choosing a hazard, in the same class as the trap
    triggers rejected in PKT-SD-114-114 and the carousing outcomes in PKT-SD-091-093. The page states
    no mechanic for any individual entry: no check, no value, no duration. The sleep and confusion entries
    are the same near miss as last packet, where the same-named canonical identities are spells rather
    than conditions, and pointing at them would assert that a patch of spores casts a spell.'
- text_locus: Combining, p115
  quoted_gist: '''The most insidious hazards combine one or more of these types into a single threat.'''
  why_considered: It is the fourth bolded paragraph and says something about the relation between the
    three kinds.
  rejection_reason: 'It is a statement about the three categories rather than about the game: it tells
    the GM that a hazard may do more than one of the three things, which the three asserted and unasserted
    kinds already allow. No mechanic turns on whether a hazard is combined, and there is no identity for
    a combination. This is design advice in the CORE ETHOS class rejected throughout PKT-SD-101-109.'
non_edge_observations:
- id: OBS-01
  subject: the missing condition vocabulary now costs a full third of a page
  detail: 'Weakening is one of the three kinds of hazard the page defines and none of it reaches the graph.
    There is no identity for a weakened, hampered, sickened, disoriented, exhausted or blinded state,
    and the page''s own examples are hedged illustrations rather than rules.

    This is the second consecutive packet where that gap takes the larger part of the content, after the
    traps table''s six status effects. The two pages together suggest the shape of what is missing: a
    small vocabulary of conditions that traps, hazards and probably monsters all inflict. I am not proposing
    it, because minting a vocabulary is not an Analyst act and doing it from a hazards page would put
    it at the wrong locus. Recorded for the Architect as accumulating evidence rather than as a request.'
- id: OBS-02
  subject: the graph cannot express that hazards are undefeatable
  detail: 'The page''s most distinctive claim is that hazards usually cannot be defeated or permanently
    disabled, stated by explicit contrast with traps. Traps now carry class_thief GATES rule_traps on
    disabling access; hazards carry no corresponding row and cannot, because asserting an absence is not
    something the vocabulary does. There is no disabling identity to exclude hazards from, disabling existing
    in the graph only as an aspect on the thief row.

    The consequence is that a reader querying how to deal with a hazard finds only that it restricts movement
    and deals damage, with nothing to say that dealing with it is largely not possible. The same applies
    to obviousness: traps carry an explicit discovery row and hazards carry nothing, so the contrast the
    source draws is invisible. Recorded rather than forced.'
- id: OBS-03
  subject: Caltrops is a name collision and declining it is the same discipline as last packet
  detail: 'item_caltrops is canonical and Caltrops appears in the Movement column. Asserting a row would
    have been name matching: thirty-six entries fill this table and one happens to collide with a registry
    string.

    Worth recording alongside the previous packet''s near miss, because the two run in opposite directions
    and the same test settles both. There the tempting identities were spells with condition names, and
    pointing at them would have said a trap casts a spell. Here the tempting identity is a real gear item,
    and pointing at it would say a purchasable object is a hazard rule. In both cases the source mentions
    two things that have identities without stating a relationship between them, which is exactly what
    the incidental-locus test excludes.'
