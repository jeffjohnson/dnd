authored_polarity_declaration: '4 of the 7 rows carry authored polarity, each on MODIFIES, which constitution
  section 5 reserves, and each at basis read because the source states the direction in the cell itself.
  The magnitudes in those cells are not storable and are not stored; the direction is. Three are worsens
  and one is improves. The remaining 3 rows are RESOLVED_BY or FEEDS_INTO, neither reserved, so Builder
  derives governs and neutral respectively.


  This is the chapter''s largest authored-polarity set from one page. Canonical holds 128 MODIFIES rows
  of which 25 have a tbl_ source, so a table modifying a rule is a well-established shape rather than
  something this page invents.'
status_note: All 7 rows are core, following the disposition settled as IDQ-01 of PKT-SD-124-125 and applied
  throughout this chapter.
