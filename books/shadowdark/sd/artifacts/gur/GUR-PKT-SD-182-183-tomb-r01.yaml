units_note: 'Figures name their unit. Measured by the building script from the claimed source: 1 named
  table, 50 data rows keyed to a hundred-sided roll, 0 sentences of prose, 23 rows on printed page 182
  and 27 on 183. The script asserts the recorded packet checksum against the claimed file before reading
  a single cell.'
page_attribution_basis: 'The page break falls inside the table, as it has in every packet of this chapter.
  The p182 marker sits on the TOMB heading under placement rule 1. The p183 marker sits in the last cell
  of the row keyed 46-47, and acceptance test 3 applies a table-row marker to the whole row, so that row
  is page 183 and persistence carries 183 to every row after it.


  The script locates the marker by row index rather than by eye, asserts that it is in the row''s final
  cell, and derives each row''s page from it: the marker is at row index 23, 23 rows are page 182 and
  27 are 183. Each submitted row is cited to the page of the cell it rests on. That matters more here
  than in the last two packets, because this page carries rows from both sides of the break.'
scope_boundary: 'The bounded scope is the Primary Source Material section, printed pages 182 and 183:
  one named table of 50 rows and no prose. The Supporting Source Context appends the random encounter
  procedure from printed pages 112 and 113 and the monster attributes page from 189. Both are out of scope
  and no row cites either.


  That exclusion matters here because the appended encounter procedure is the very rule this table resolves.
  Its content belongs to PKT-SD-112-113, which is already integrated, and re-asserting it would duplicate
  canonical rows from a repeated passage.'
source_summary: 'A single hundred-sided encounter table for tombs, 50 rows, with no procedure, no heading
  prose and no instructions. The bulk is undead and vermin, wraiths, ghouls, zombies, shadows and scarab
  swarms, all of which belong to the unextracted monster chapter. What distinguishes this page from the
  two before it is that several cells state an actual outcome rather than only an event: a wind that strips
  luck tokens, a patch of darkness that puts out light, a carving that drains hit points, a bell that
  heals, and a secret cache that yields treasure. This is the chapter''s densest page for mechanical content.'
graph_state_at_extraction: 'Read from the repository at extraction, not recalled, and every figure here
  is computed by the building script from the canonical files and the claimed source.


  The canonical graph holds 422 registry rows and 840 edges, and 0 rows cite printed page 182 or 183,
  so nothing in this span has been extracted before. The registry holds 122 tbl_ identities and 0 monster_
  identities, the latter being the figure that governs how much of this table is extractable at all.


  rule_encounter carries 30 rows, of which 22 are RESOLVED_BY and 20 name a location encounter table.
  The script asserts that the proposed table id is absent from the registry before using it.'
chapter_disposition_note: 'The disposition for this chapter was argued in full at PKT-SD-142-143 and is
  applied here rather than re-argued: no procedure identity, no terrain or location identity, and no creatures
  or named characters, because the registry holds 0 monster_ identities and a creature''s defining locus
  is its stat block. This page loses more to that disposition than any other, since most of its cells
  are undead.


  What it gains instead is a set of cells that name a canonical rule and say what happens to it. Four
  of the seven rows below are MODIFIES rows with authored polarity, where the last two packets produced
  none at all. Each of the four is argued individually in its own note, because the type and the direction
  are the parts a reader cannot check from the row alone.'
name_match_measurement_note: 'The cells were matched against the whole registry by script, not scanned
  by eye. Three scans are run: scan 1 matches a whole registry label on word boundaries, scan 2 matches
  every stemmed token of a label, scan 3 flags a cell sharing a distinctive token of a multi-token label
  and is deliberately noisy.


  Scan 1: 11 of 50 cells match, over these identities: ancestry_elf, ancestry_halfling, ancestry_human,
  lang_common, rule_rival_crawlers, rule_round, rule_treasure, spell_heal, spell_light. Scan 2: 16 cells
  match, adding item_armor, rule_encounter, rule_luck_token, rule_turn, spell_teleport. Scan 3: 21 cells
  match, adding 44 identities no other scan reaches, none of which is a real reference on this page.


  Of the 14 identities the first two scans reach, 3 are real references that carry a row: rule_luck_token,
  rule_rival_crawlers and rule_treasure. lang_common, rule_encounter, rule_total_darkness, spell_teleport
  are real mentions deliberately not given a row of their own, for the reasons in rejected_candidates.
  The remaining 8 are ordinary English colliding with an identity label: ancestry_elf, ancestry_halfling,
  ancestry_human, item_armor, rule_round, rule_turn, spell_heal, spell_light. spell_heal matches the verb
  heal, spell_light the noun light, rule_turn a wererat turning and rule_round two durations given per
  round, which is the same collision the arctic table recorded.


  The important measurement on this page is a negative one, and the script asserts it rather than my noticing
  it. No scan reaches rule_hit_points and no scan reaches rule_light_source, yet 3 of the 7 rows target
  those two identities. The cells write HP where the registry says Hit Points, and write light and darkness
  where the registry says Light Source. An abbreviation defeats all three scans at once: scans 1 and 2
  need every token of the label, and scan 3 needs a shared token, and HP shares none with Hit Points.
  See OBS-01; this is the third distinct scan blind spot found in three packets, and the first where rows
  actually depended on it.'
