unresolved_identity_questions_note: None. Every structural choice follows the chapter disposition settled
  at PKT-SD-142-143, the occurrence-versus-reference split settled across printed pages 158 and 174, and
  the three-element treasure test.
architectural_escalations: []
architectural_escalation_note: 'None raised. The one proposed identity uses an approved prefix, every
  row uses a legal edge type at status core, no row carries supersession_basis and none is an OVERRIDES,
  and no CLASSIFIED_AS row appears. DEC-2026-0104 is cited only to record that the light cell was checked
  against the light-source classification form and does not meet it: the cell states an effect on light,
  and classifies no item as a light source. The authority list omits the nonexistent Shadowdark DEC-2026-0003;
  registry authority for this ruleset is constitution section 2, as recorded in GUR-PKT-SD-142-143-arctic-r01.'
completeness_statement: 'Both printed pages in scope were read in full at the recorded checksum, which
  the script asserts against the packet manifest before parsing: 1 named table, 50 data rows, 0 sentences
  of prose. The packet yields 1 new identity and 7 rows, reusing 6 canonical identities whose labels the
  building script asserted equal to the registry. The proposed table carries edges, so nothing is left
  unattached.


  Every row was checked against the 840 canonical edges for an assertion-key collision, for a shared source,
  type and target under a different aspect, and for duplicates within the patch. There is no canonical
  collision and no duplicate; one pair inside the patch shares source, type and target and is separated
  by aspect, which the script asserts explicitly and OBS-02 explains. No canonical row cited either page
  before. The script locates the supporting cell for each row and asserts its page.


  11 candidates were rejected and each is recorded with its reason. The largest deliberate loss is the
  undead and vermin content, which belongs to the unextracted monster chapter. 8 of the 14 identities
  the first two scans reach are spurious collisions with ordinary English, and two identities that carry
  3 of the 7 rows are reachable by no scan at all; both facts are asserted by the script rather than observed.
  No assertion depends on any other ruleset.'
luck_token_note: 'M002 is the first row in the intake that removes a resource, so the type and the polarity
  are argued.


  The cell at index 18 states that a screaming wind of spirits robs all unused luck tokens. The word all
  is not a quantity and nothing numeric is stored.


  MODIFIES is the type. rule_luck_token carries 7 inbound rows: 5 are FEEDS_INTO awards from encounter
  tables, which say the table supplies the pool, and 2 are MODIFIES from Pulp Mode on starting supply
  and token capacity, which say something changes what the pool holds. This cell is the second kind. FEEDS_INTO
  would assert the opposite of what the cell says and would derive neutral, losing the direction entirely.
  CONSUMES was checked and rejected: its canonical uses are an actor spending its own coin, and nothing
  here is spent.


  The polarity is worsens at basis read, because the cell states the direction: tokens are taken. rule_luck_token''s
  own outbound rows make it a benefit, improving a check and supplying an extra action, so removing it
  is a loss without my having to judge that.'
light_source_note: 'M003 follows an existing shape closely enough that the argument is short.


  The cell at index 22 states that a patch of shadowy darkness extinguishes all light. The measurement
  in the cell is a magnitude and is not stored; the extinguishing is.


  rule_light_source carries 6 inbound rows and 3 of them are MODIFIES at polarity worsens for exactly
  this effect, including tbl_ruins_encounters on gas extinguishing at printed page 172, which is an encounter-table
  cell putting out a light in the same chapter. That row is the template and this one differs only in
  aspect and source page. EXCLUDES was considered, since the cell is unhedged, but the two canonical extinguishing
  rows both use MODIFIES and worsens, and departing from a uniform convention on an unremarkable instance
  of it would be the wrong place to reopen the question.'
hit_points_note: 'M004 and M006 reach the same target in opposite directions from one page, so both are
  argued together.


  The cell at index 26 has a jackal carving drain hit points per round from everyone within a stated range.
  The cell at index 45 has a bell heal those who listen for a stated number of rounds. Every figure in
  both is a magnitude and none is stored; M006''s condition is written as for those who listen so that
  the duration does not enter it.


  MODIFIES is the type for both. rule_hit_points carries 24 inbound rows, 17 of them MODIFIES and 2 from
  a tbl_ source: tbl_deep_tunnels_encounters and tbl_low_district_encounters, both on aspect encounter
  healing at polarity improves. M006 reuses that aspect exactly and differs only in source, and M004 is
  its inverse. Routing M004 through rule_damage instead was considered and declined in rejected_candidates,
  because the cell names Hit Points and not Damage.


  The polarities are read from the cells, worsens for a drain and improves for a heal, and 4 canonical
  MODIFIES rows into this target already carry worsens, so neither direction is novel. The two rows are
  distinct assertions under the five-field key; see OBS-02.'
treasure_reach_note: 'M007 rests on the hundredth cell at index 49, where a secret cache holds items drawn
  from a named treasure table. All three elements of the settled test are present, and this cell satisfies
  the first more directly than any earlier one in the chapter.


  The category is named: the cell says treasure, which is the registry label exactly, rather than naming
  a category that routes to it. That is the element the market scroll and the tavern''s Brak''s Cube both
  failed. Availability is stated, since a cache holds the items and the party finds it. The route is the
  established one, the table pointing at rule_treasure on aspect encounter treasure, which 8 of the 11
  inbound rows already use.


  The cell also refers to a specific treasure table by its key range. No such table is in the registry
  and its defining locus is the unclaimed treasure chapter, so no row points at it and none is proposed;
  unlike the Van Dinkle flask at printed page 179 there is no page pointer and no canonical target, so
  the CROSS_REFERENCES reading is unavailable. The quantity of items is a magnitude and is not stored.'
measured_figures_note: 'Figures quoted in this artifact''s prose are computed by the building script from
  the claimed source and the canonical files, and the finished document is checked for unsubstituted format
  specifiers before it is written. Located cells: the luck-token wind at 18, the darkness at 22, the draining
  carving at 26, the rival crawlers at 36, the healing bell at 45, the secret cache at 49, the italicised
  artifact at 9, the teleporting lich at 0 and the ancient Common at 13, of 50 rows. The page emphasises
  1 cell: Sphere of Annihilation. Canonical counts at extraction: 22 resolvers on rule_encounter of which
  20 are location tables, 24 inbound on rule_hit_points of which 17 are MODIFIES and 2 have a tbl_ source,
  6 inbound on rule_light_source of which 3 are extinguishing MODIFIES, 7 inbound on rule_luck_token of
  which 5 are encounter awards, 19 inbound on rule_rival_crawlers, 11 inbound on rule_treasure of which
  8 are encounter treasure, 4 on rule_total_darkness, 3 on spell_teleport, 0 on lang_common, and 128 MODIFIES
  rows of which 25 have a tbl_ source. This is packet 21 of the chapter''s claimed set.'
