rejected_candidates:
- text_locus: the darkness as a total-darkness row, p182
  quoted_gist: a patch of shadowy darkness extinguishes all light
  why_considered: rule_total_darkness is canonical with 4 rows and scan 3 flags this cell for it. A patch
    that puts out all light plainly produces darkness, so a second row from the table to that identity
    was considered alongside M003.
  rejection_reason: The cell does not name it, and the graph already carries the relation. rule_light_source
    EXCLUDES rule_total_darkness at printed page 84 is exactly the statement that where a light source
    is, total darkness is not; asserting a second row here would restate that consequence from a page
    that does not say it. What the cell states is an effect on the light, which M003 records, and inferring
    the downstream state is the reader's job at query time.
- text_locus: the italicised artifact, p182
  quoted_gist: the Sphere of Annihilation glides along, moving randomly, in italics
  why_considered: This is the page's only emphasised cell, and the chapter's italic convention marks a
    name the source is pointing at. At printed pages 158 and 174 that convention carried a spell reference,
    so the reference here is genuinely made.
  rejection_reason: 'The reference is made and there is nothing to point at. No registry identity exists
    for this artifact and its defining locus is the unclaimed magic item chapter, so the same disposition
    applies as to the italicised magic item in the tavern hundredth slot at printed page 179. The cell
    also states no mechanic: it glides and moves randomly, with no damage, no check and no effect on any
    rule the graph holds. Minting an identity from an incidental mention is prohibited.'
- text_locus: the teleporting lich, p182
  quoted_gist: a distracted, muttering lich teleports into the room
  why_considered: spell_teleport is canonical with 3 rows and the stem scan reports this cell. An occurrence
    is plainly stated, which is the limb the crone's love potions lacked at printed page 174.
  rejection_reason: The reference limb fails, exactly as the augury did at printed page 181. The verb
    is bare and unemphasised; the page's one italicised term is the artifact, not this. A lich arriving
    by teleportation is a creature using a creature's movement, and its defining locus is a stat block
    in the unextracted monster chapter. Reading the verb as the wizard spell would be my inference.
- text_locus: the drained hit points as a damage row, p183
  quoted_gist: a jackal carving drains hit points per round to everyone within near
  why_considered: The arctic table earned a TRIGGERS row into rule_damage from two weather cells, so that
    shape was the obvious alternative to the MODIFIES row M004 records.
  rejection_reason: The source names the target and it is not Damage. The arctic cells say damage in the
    cell itself; this one says it drains HP, which is the abbreviation of the registry label Hit Points.
    Routing it through rule_damage would substitute an identity the cell does not use for one it does,
    and rule_damage MODIFIES rule_hit_points already carries that consequence from printed page 9. See
    hit_points_note.
- text_locus: the healing bell's duration and the drain's radius, p183
  quoted_gist: the bell heals those who listen for a stated number of rounds, and the carving drains a
    stated amount per round to all within near
  why_considered: Both cells state a duration and one states a range, and rule_round and rule_distance
    are canonical identities for exactly those concepts.
  rejection_reason: Every one of those figures is a magnitude and no field may store one. rule_round matching
    these cells is the per-round collision the arctic table already recorded. The condition on M006 is
    written qualitatively, for those who listen, precisely so that the number of rounds does not enter
    the row; a condition never spells a quantity.
- text_locus: the ancient Common, p182
  quoted_gist: mummies lope around moaning in ancient Common
  why_considered: lang_common is canonical and scan 1 matches this cell exactly. Individual language identities
    were authorised by DEC-2026-0098, so the reference is real.
  rejection_reason: 'The cell states no mechanic. Nothing turns on whether the party understands the moaning:
    no check, no comprehension rule, no consequence. Constitution section 2.3 is explicit that a language
    reference creates no membership or property edge, and lang_common carries 0 canonical rows, so there
    is no existing shape to attach to either.'
- text_locus: the alignment letters in three cells, p183
  quoted_gist: chanting acolytes marked C, a radiant wight marked L and the archmage Rantarim marked N
  why_considered: These are the monster-stat shorthand for the three canonical alignment identities, and
    they appear three times on one page.
  rejection_reason: They are creature attributes in an unextracted chapter's notation, attached to creatures
    that have no identity here. Constitution section 2.4 keeps alignment membership out of the graph in
    any case. No scan reports them, because a single capital letter matches no label; they were found
    by reading the cells.
- text_locus: the undead and vermin results, pp182 and 183
  quoted_gist: a lich, wraiths, ghasts, wererats, a scarab swarm, mummies, a gelatinous cube, a ghost,
    shadows, zombies, ghouls, gargoyles, a black ooze, a cockatrice, a seraph and Muggins Greenbottle
    the halfling tomb robber
  why_considered: Two are individually named and several carry a type in apposition, which is the shape
    that has prompted the question in each packet of this chapter. This page has more creature content
    than any other in the chapter.
  rejection_reason: A creature's defining locus is its stat block in the unextracted monster chapter and
    the registry holds 0 monster_ identities. This is the 21th packet running for the same disposition,
    and the largest single loss to it.
- text_locus: the tomb incidents that state no mechanic, pp182 and 183
  quoted_gist: necrotic energy chilling an area, rot flowers bursting through stone, an oni demanding
    its stolen sword, a vampire offering passage for blood, a commenting skull, a cloud of blood whispering
    secrets and a ghoul pinned by iron spikes
  why_considered: Four cells on this page do state an outcome for a canonical rule, so the rest were tested
    against that same standard on the same page rather than dismissed as scenery.
  rejection_reason: None of them names a rule the graph holds and says what happens to it. The vampire's
    offer is a bargain with no stated terms, the chill states no damage or check, and the rest are description.
    Having four qualifying cells beside them makes the comparison sharper rather than looser, which is
    the same effect recorded for the swamp mosquitoes.
- text_locus: the two-encounter instruction, p183
  quoted_gist: one result instructs the reader to roll two encounters and combine the results, rerolling
    that result if it comes up again
  why_considered: It is the only instruction on the page, and the stem scan flags it as matching rule_encounter.
  rejection_reason: The match is on the plain word encounters in the instruction's own text; M001 already
    carries the table's relation to rule_encounter. Declined in the same form in each of the 20 preceding
    chapter packets.
- text_locus: the appended random encounter procedure and monster attributes, out of scope
  quoted_gist: the printed page 112 and 113 encounter procedure and the printed page 189 monster attributes
    page
  why_considered: Both are in the file and the first is the rule this table resolves.
  rejection_reason: Both are Supporting Source Context, outside the bounded scope. PKT-SD-112-113 is already
    integrated, so extracting from it would duplicate canonical rows and cite pages outside this packet's
    range.
non_edge_observations:
- id: OBS-01
  subject: an abbreviation defeats all three scans at once
  detail: 'The script asserts that no scan reaches rule_hit_points and no scan reaches rule_light_source.
    3 of the 7 rows target those two identities.


    The cause is different from the two blind spots already recorded. At PKT-SD-178-179 a partial name
    defeated scans 1 and 2 and scan 3 was written for it. At PKT-SD-180-181 the stemmer over-stemmed a
    short label. Here the cells write HP where the registry writes Hit Points, and an abbreviation shares
    no token with the label it abbreviates, so scan 3 cannot help either: it matches on a shared distinctive
    token and there is none. The light cells are the same shape in a different key, saying light and darkness
    where the identity is Light Source.


    Three packets, three distinct ways for a complete scan suite to return nothing for a real reference.
    The conclusion is not a fourth scan. It is that the scans narrow attention and have never been the
    reading, and the honest form of that claim is an assertion in the script naming the identities no
    scan reached, which is what the name_match_measurement_note now carries.'
- id: OBS-02
  subject: two rows to one target in opposite directions
  detail: 'M004 and M006 share source, type and target: the table MODIFIES rule_hit_points twice, once
    worsening and once improving. The script asserts that this is the only such pair in the patch and
    that no canonical row shares the triple.


    They are two assertions, not one contradiction. The key is source, type, target, aspect and condition,
    and they differ in aspect, encounter drain against encounter healing. The shape is already canonical:
    spell_judgement carries 2 rows to rule_hit_points, worsening and improving, separated by condition.
    The graph''s job is to record that a change to Hit Points would require reviewing both cells of this
    table, and it would.


    Recorded because a reviewer scanning the patch will see the same target twice with opposite polarity
    and should be able to find the reasoning without reconstructing it.'
- id: OBS-03
  subject: the first cell in the intake that takes a resource away
  detail: 'rule_luck_token has appeared in four packets of this chapter and every previous appearance
    granted a token: 5 FEEDS_INTO rows on aspect encounter award, from the desert phoenix, the grassland,
    the mountain offering and now not this one. The screaming wind at index 18 strips all unused tokens
    instead.


    That inversion is why M002 is a MODIFIES and not a FEEDS_INTO. An award supplies the token pool, which
    is what FEEDS_INTO says; a robbery changes what the pool holds, which is what MODIFIES says, and only
    MODIFIES can carry the direction the cell states. CONSUMES was the third candidate and it says something
    else again: its canonical uses are a carouser and a wizards-and-thieves pot spending coin, an actor
    expending its own resource for a purpose. Nobody here is spending anything.


    Recorded because the chapter''s luck-token rows now split into two shapes, and the remaining packets
    will meet both.'
