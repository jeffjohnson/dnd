rejected_candidates:
  - text_locus: 'Statue, p196'
    quoted_gist: 'when standing still, the animated armor looks exactly like a suit of armor'
    why_considered: 'item_armor is canonical and the stem scan matches the cell directly.'
    rejection_reason: >-
      A stat-block description, stated once under this creature's own block. It also states no
      dependency on item_armor as a mechanic; the creature merely resembles an inert object, and
      nothing changes about rule item_armor if the sentence were struck.
  - text_locus: 'Thick Fur, p196'
    quoted_gist: 'the snow ape is cold immune'
    why_considered: 'A damage-type immunity, the same shape as Azer''s Impervious on this page.'
    rejection_reason: >-
      A stat-block description. There is no cold-damage sub-identity in the registry for it to
      modify or exclude even if the boundary allowed a row.
  - text_locus: "Beguile and Enervate, Archmage's and Apprentice's Focus-tagged spells, pp196 and 197"
    quoted_gist: >-
      two abilities tagged Focus, each stupefying a target for the duration
    why_considered: >-
      rule_focus is canonical with a FEEDS_INTO row into every canonical spell that carries the
      Focus tag, so a comparable row into these abilities was considered.
    rejection_reason: >-
      Those canonical rows exist because each target is itself a canonical spell_ identity from
      the spells chapter's own defining locus. Beguile and Enervate are not canonical spell_
      identities; they are this creature's own named abilities, stat-block descriptions with no
      identity for rule_focus to feed into. There is also no identity for a stupefied condition,
      the same gap noted for every other named status in the chapter.
  - text_locus: "Magic Bolt, Death Bolt and Fireblast, p196 and p197"
    quoted_gist: >-
      three damage-dealing spells with their own names, DCs and dice
    why_considered: 'rule_damage is canonical and each ability states a damage amount directly.'
    rejection_reason: >-
      Stat-block descriptions; the damage figures are magnitudes and the dependency on
      rule_damage they would state is already canonical and unconditioned from printed page 9,
      the same reading applied to every other creature's attack and spell damage since printed
      page 194.
  - text_locus: 'Float and Void Step, p197'
    quoted_gist: >-
      the archmage flies double near for a stated duration, and separately teleports itself and
      up to four willing targets up to a stated distance
    why_considered: >-
      spell_fly MODIFIES ex_movement on flight and spell_teleport MODIFIES ex_movement on
      teleportation are both canonical, and Void Step''s own text uses the plain verb teleport,
      which is as close as any ability text in the chapter has come to a spell''s own canonical
      name.
    rejection_reason: >-
      Neither ability is named as the canonical spell, marked with this book's italic reference
      convention, or stated to invoke it; each is the archmage's own named ability with its own
      profile. The plain-verb use is the same shape that separated the bare teleporting lich at
      printed page 182 from the italicised web casting at 158: an ordinary verb describing what
      happens is not a citation. See spell_naming_note.
  - text_locus: 'Mithralskin, p197'
    quoted_gist: "the archmage's AC becomes a stated value for a stated duration"
    why_considered: >-
      item_mithral is canonical and the ability's own name contains the word.
    rejection_reason: >-
      A name collision, not a reference; the ability states a magical AC change and never
      mentions armor, mithral or any item. The same reading already applied to Reptilian and
      Draconic monster qualities at printed page 190.
  - text_locus: 'Execute, p197'
    quoted_gist: 'the assassin deals triple damage against a surprised target'
    why_considered: >-
      rule_surprise is canonical with several rows and this ability states a direct consequence
      of a target being surprised, which is the clearest real-identity reference on this page
      after Rage.
    rejection_reason: >-
      A stat-block description under the locus test; see locus_precedent_note. The damage
      multiplier is also a magnitude.
  - text_locus: 'Impervious, p197'
    quoted_gist: 'the azer is fire immune'
    why_considered: 'Same shape as Thick Fur, checked independently rather than assumed identical.'
    rejection_reason: 'A stat-block description, for the same reason as Thick Fur.'
  - text_locus: 'Rage, p197'
    quoted_gist: >-
      once a day, the badger becomes immune to morale checks and deals bonus damage for a stated
      duration
    why_considered: >-
      rule_morale is canonical with three rows and this ability states a direct exemption from
      it, the strongest real-identity reference on the page.
    rejection_reason: >-
      A stat-block description under the locus test; see locus_precedent_note. The bonus damage
      and duration are magnitudes.
  - text_locus: 'Ambush, p197'
    quoted_gist: 'the bandit deals an extra die of damage against an undetected target'
    why_considered: >-
      rule_hiding_and_sneaking and rule_detecting are both canonical and this ability's trigger,
      undetected, is their shared vocabulary.
    rejection_reason: >-
      A stat-block description under the locus test; see locus_precedent_note. The extra die is
      a magnitude.
  - text_locus: 'Petrify, p198'
    quoted_gist: >-
      a creature that touches the basilisk or meets its gaze must save or be petrified
    why_considered: >-
      The same shape as Curse at printed page 194, checked independently rather than assumed
      identical.
    rejection_reason: >-
      A stat-block description; there is no petrified condition identity in the registry, the
      same gap noted for Curse, Enslave and Horn.
  - text_locus: 'the flavour text for all twelve creatures, pp196 to 198'
    quoted_gist: >-
      an old suit of armor animated by a vengeful spirit, horse-sized burrowing insects, hooting
      apes, a cloaked magician, a wizened magic-user, a black-cloaked killer, bronze-skinned
      dwarves, clawed burrowers, a hard-bitten rogue, massive six-legged lizards, and a
      leathery eagle-sized bat
    why_considered: 'Read for completeness, as every block on an in-scope page must be considered.'
    rejection_reason: >-
      Narrative description throughout, the same disposition applied to every creature's
      italicised opening line since printed page 194.
  - text_locus: 'the eight stat-block fields on each of the twelve creatures, pp196 to 198'
    quoted_gist: >-
      armour class, hit points, attacks, movement, the six stat modifiers, alignment and level
      for each creature
    why_considered: >-
      Every field names a canonical shared identity directly, the case constitution 2.5 names by
      example.
    rejection_reason: >-
      Unchanged from every stat-block packet since printed page 194. 96 field values across
      twelve creatures are excluded on this ground alone.
  - text_locus: 'the appended shared-system context, out of scope'
    quoted_gist: >-
      the monster attributes, movement and conditions, morale, and complete magic rules pages
    why_considered: 'All four are in the file and directly relevant to reading a stat block correctly.'
    rejection_reason: >-
      Supporting Source Context, outside the bounded scope, each already integrated from its own
      primary packet.

non_edge_observations:
  - id: OBS-01
    subject: three real-identity references in one packet, and the boundary holds for all three
    detail: >-
      Bless at printed page 195 was the first ability to name an existing canonical identity.
      This packet has three more: Rage names rule_morale, Execute names rule_surprise and Ambush
      names rule_hiding_and_sneaking and rule_detecting together. All three are declined on the
      same locus ground. Four for four is enough to treat the question as settled rather than
      reopened per packet; the measured_figures_note below gives the running count.
  - id: OBS-02
    subject: a plain verb is not a citation, even when it matches a spell's own name
    detail: >-
      Void Step's text says teleport, the exact word the canonical spell is named for, and it is
      still declined, because the book's own convention for a real reference is the italic
      marking tested at printed pages 158, 174, 181 and 182, and this sentence carries none. This
      is the clearest case yet that the test is typographic and structural, not lexical: sharing
      a word with a spell's name is not the same as the source pointing at that spell.
  - id: OBS-03
    subject: zero edges across three consecutive stat-block packets, at increasing scale
    detail: >-
      Two creatures, then four, then twelve; forty candidate identities proposed if this one is
      approved, so far, and zero rows across all of them. The non-edge pattern is now established
      at a scale large enough to extrapolate: the roughly fifty remaining stat-block packets
      should be expected to follow it, and a packet that departs from it, by stating a
      dependency the way the shared Monster Attributes, Generator or Designing Monsters pages
      did, should be treated as the exception worth flagging rather than the default worth
      assuming.

