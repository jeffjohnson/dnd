  monster_ identities, all registered in the two preceding packets at degree 0. The script
  asserts that all twelve proposed ids in this packet are absent from the registry before use.

stat_block_boundary_note: >-
  The test settled at PKT-SD-194-194 and confirmed at PKT-SD-195-195 is applied without
  modification: a stat-block description is excluded under constitution 2.5 regardless of what
  it references, because the exclusion is about the ability's own locus, not its content. This
  packet adds no new exception and finds none; it is the third consecutive confirmation at a
  larger sample, fifteen named-ability sentences across twelve creatures.
  Three abilities reach an existing canonical identity directly, the same shape as the Seraph's
  Bless at printed page 195, and each is declined on the same ground: the badger's Rage states
  immunity to morale checks, the assassin's Execute triples damage against a surprised target,
  and the bandit's Ambush adds damage when undetected. rule_morale, rule_surprise and
  rule_hiding_and_sneaking are all canonical and all three abilities are still one creature's own
  limited trait, printed once under its own block. See locus_precedent_note.

spell_naming_note: >-
  Six of the Archmage's abilities and one of the Apprentice's are tagged INT Spell, each with its
  own name, DC and effect; none names a canonical spell_ identity and none is equated with one.
  Two are close enough to be worth recording. Void Step's effect text reads Teleport up to 100
  miles, using the plain verb rather than citing the canonical spell by name or by the italic
  marking this book uses for a genuine reference, which is the same test that separated the web
  casting at printed page 158 from the bare teleport verb at 182. Mithralskin's name itself
  echoes the canonical item_mithral, but the ability states no use of mithral armor, only a
  numeric AC change; the name is a collision, not a citation, the same reading already applied to
  Reptilian and Draconic monster qualities at printed page 190.

locus_precedent_note: >-
  Rage, Execute and Ambush are tested against the Bless precedent directly rather than against a
  fresh reading, because the shape is now familiar: an individual creature's named ability can
  name a real shared mechanic and still be excluded, because constitution 2.5 excludes the
  description itself, not only a description whose target is absent from the registry. None of
  the three states a dependency between two shared mechanics; each states what one creature can
  do, once, under its own stat block. A future packet that stated the same effect generally, for
  a whole class of creatures at one locus, would meet the exception Dark-Adapted met at printed
  page 189; none of these three does.

creature_identity_note: >-
  All twelve proposed nodes carry no edge in this GUR, for the reason settled at PKT-SD-194-194:
  each creature's defining locus is its stat block, and this page is that locus for all twelve.
  Registering them here provides the stable canonical id a future packet can reuse. No
  family-level identity is proposed; these twelve share no stated family grouping the way the
  Angels did, and constitution 2.4 would keep any such grouping out of the graph in any case
  absent a Decision.

