rejected_candidates:
  - text_locus: 'ITEM PERSONALITY alignment determination, p294'
    quoted_gist: 'The GM determines a conscious magic itemʼs alignment unless otherwise noted.'
    why_considered: 'sys_alignment is canonical and the sentence explicitly mentions a conscious magic item''s alignment.'
    rejection_reason: >-
      The sentence delegates alignment selection to GM/referee discretion rather than defining a mechanical rule dependency between entities (there is no GM node in the graph). Furthermore, per Constitution sections 2.2 and 2.4, taxonomy-only alignment membership is excluded from the graph and sys_alignment may not be targeted by classification or item edges. The sentence establishes no mechanical impact on character or item statistics.
  - text_locus: 'ITEM PERSONALITY contested Charisma check, p294'
    quoted_gist: 'A conscious item may make a contested CHA check (+2) to resist or insist on how itʼs used.'
    why_considered: 'abil_charisma is canonical and the sentence mentions a conscious magic item making a contested CHA check.'
    rejection_reason: >-
      The item invokes the existing general contested check procedure (rule_contested_check on SD p. 81) using Charisma. The (+2) value is a specific roll modifier / bonus number excluded under Graph Invariant 11. The conscious item does not possess an independent ability score that modifies abil_charisma, nor does it alter the core Charisma mechanic. No legal edge type connects an item to an ability score node for an ad-hoc check bonus.
  - text_locus: 'ITEM VIRTUE TABLE specific entries and mechanics, p294'
    quoted_gist: 'translates Primordial... Senses hiding creatures within near... Owed a favor by a 1d4: 1-2. unicorn, 3. dragon, 4. noble... Calming presence to 1d4... Lawful, intimidating to chaotic creatures... Can undo a great 1d4...'
    why_considered: 'Checked for edges connecting to languages (Primordial), detection, creature types, alignments, or spell undoing.'
    rejection_reason: >-
      Specific entries on the d20 virtue table represent random generation roll outcomes. They contain dice expressions (1d4), creature categories, and narrative benefits prohibited on edges under Graph Invariant 11.
  - text_locus: 'ITEM FLAW TABLE specific entries and mechanics, p295'
    quoted_gist: 'Afraid of 1d4: 1. the dark, 2. vermin, 3. heights, 4. water... Dislikes 1d4: 1. elves, 2. dwarves, 3. humans, 4. goblins... Objects to 1d4: 1. gambling, 2. carousing, 3. stealth, 4. theft... Wonʼt harm 1d4: 1-2. lawful, 3. neutral, 4. chaotic... Objects to 1d4: 1. negotiating, 2-3. fighting, 4. planning'
    why_considered: 'Checked for edges connecting to ancestries, carousing, stealth, or combat actions.'
    rejection_reason: >-
      Specific entries on the d20 flaw table represent random generation roll outcomes. They contain dice expressions (1d4), narrative quirks, and behavioral restrictions prohibited on edges under Graph Invariant 11.
  - text_locus: 'ITEM PERSONALITY TRAIT TABLE specific personality entries, p295'
    quoted_gist: 'Imperious, Polite, Puritanical, Charming, Anxious, Righteous, Critical, Theatrical, Bossy, Noble, Greedy, Protective, Impulsive, Brave, Vicious, Loyal'
    why_considered: 'Checked for independent trait node additions or edges.'
    rejection_reason: >-
      The 16 entries on the d4, d4 grid represent random roll outcomes providing roleplaying personality descriptors. They introduce no distinct mechanical rules or combat statistics.
  - text_locus: 'Supporting source context passages, pp282, 34-37, 86, 88'
    quoted_gist: 'Magic item attributes (p282); Armor class, gear, basic gear table, armor table, weapons table (pp34-37); Resting (p86); Combat turns, actions (p88)'
    why_considered: 'Checked for edges citing supporting context passages.'
    rejection_reason: >-
      Supporting source context is repeated material from earlier packets (014-starting-gear-armor-class-and-equipment, 033-resting, 034-stealth-surprise-and-combat, 126-magic-item-attributes) and is out of scope per Scope Boundary; no row here may cite pages outside 294–295.
