source_summary: >-
  Pages 294–295 present the Item Personality section, governing conscious magic items:
  - ITEM PERSONALITY establishes that the GM determines a conscious magic item's alignment, and that a conscious item may make a contested CHA check (+2) to resist or insist on how it is used;
  - ITEM VIRTUE TABLE (d20) provides distinctive virtues and positive behavioral traits or minor supernatural capabilities;
  - ITEM FLAW TABLE (d20) provides quirks, drawbacks, phobias, and behavioral flaws;
  - ITEM PERSONALITY TRAIT TABLE (d4, d4) provides overarching personality demeanor and disposition traits (16 personality combinations).

