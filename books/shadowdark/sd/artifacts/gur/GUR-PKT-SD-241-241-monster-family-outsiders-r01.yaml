non_edge_observations:
  - id: OBS-01
    subject: Outsiders share cold and elemental immunities across the family
    detail: >-
      Primordial Slime is impervious to all damage except fire, while Rime Walker, Void Spawn, and Void Spider
      are immune to cold damage. These represent creature defense profiles operating on creature defense locus
      under Constitution 2.5.
  - id: OBS-02
    subject: Rime Walker Ice Aura and Void Spider Phase govern tactical combat presence
    detail: >-
      Ice Aura imposes a DC 12 CON check at turn start to avoid losing an action, while Phase allows Void Spider
      to toggle corporeal/incorporeal once per round. Both operate on creature combat loci under Constitution 2.5.
  - id: OBS-03
    subject: Attack riders Dissolve, Toxin, and Poison operate on creature combat loci
    detail: >-
      Primordial Slime destroys a random piece of non-magical gear, Void Spawn inflicts paralysis on DC 12 CON,
      and Void Spider inflicts delayed drop to 0 HP on DC 12 CON. All operate on creature attack loci under
      Constitution 2.5.
  - id: OBS-04
    subject: Outsiders family introduction provides cosmic horror lore
    detail: >-
      The introductory text describing origins in the cosmic reaches and the nightmares of gods serves as
      narrative setting lore without defining encounter or gameplay subsystems; excluded under Constitution 2.4.

