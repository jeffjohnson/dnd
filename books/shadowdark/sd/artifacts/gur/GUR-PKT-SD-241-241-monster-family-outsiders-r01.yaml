source_summary: >-
  The OUTSIDERS family: two introductory paragraphs describing alien horrors born from the nightmares
  of gods, followed by four stat blocks: Primordial Slime (ooze harmed only by fire, Dissolve gear
  destruction), Rime Walker (space-ice being, cold immune, Ice Aura), Void Spawn (scythe/tentacle bulb,
  cold immune, paralytic Toxin), and Void Spider (phase-shifting arachnid, cold immune, lethal Poison).

