authored_polarity_declaration: 'Authored polarity appears on one row and no other. rule_encounter TRIGGERS
  rule_reaction_check takes neutral with basis read, as constitution section 5 and invariant 15 require
  for a TRIGGERS row. neutral rather than inflicts because an encounter''s reaction check is as likely
  to produce a friendly creature as a hostile one; the table''s range runs from hostile to friendly and
  the source does not weight it. Four canonical TRIGGERS rows already carry neutral, so the value is established.

  The three RESOLVED_BY rows, two FEEDS_INTO rows, one CROSS_REFERENCES row and one EXCLUDES row carry
  none, since section 5 derives those. No MODIFIES or CONSTRAINS row appears in this packet.'
excludes_choice_note: 'One EXCLUDES row appears, rule_reaction_check over rule_hiding_and_sneaking with
  aspect revealed position, and it was tested against the hedging rule before being written. The source
  says the interacting characters reveal their presence and position to the creatures, with no hedging
  adverb: not usually, not typically, not may. It is an absolute consequence of choosing to interact,
  so EXCLUDES is correct rather than CONSTRAINS.

  This is the test that two downstream corrections established, where rule_overland_travel over rule_total_darkness
  on rarely and rule_talents over rule_learning on typically were both moved from EXCLUDES to CONSTRAINS.
  Applying it here in the other direction is the point: the test distinguishes, it does not simply discourage
  EXCLUDES.'
