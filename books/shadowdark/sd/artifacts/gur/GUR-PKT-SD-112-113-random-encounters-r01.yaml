page_attribution_basis: 'Two markers resolve this packet and both sit on headings, which is a return to
  the ordinary case after two packets whose boundaries rested on trailing paragraph markers. p112 ends
  the RANDOM ENCOUNTERS heading and p113 ends the REACTION CHECK heading, and placement rule 1 applies
  each to its whole heading while the persistence rule carries it forward.

  One detail worth naming: p113 sits on a third-level heading nested inside the page 112 section, so REACTION
  CHECK, its table and the TREASURE note that follows are all printed page 113 even though their parent
  heading is page 112. Heading level does not affect placement or persistence. Four rows cite page 112
  and four cite page 113.'
scope_boundary: The bounded scope is the Primary Source Material section, printed pages 112 and 113. The
  trailing Supporting Source Context is out of scope.
source_summary: 'The full treatment of random encounters. They exist to keep time pressure up. The GM
  checks during crawling rounds, not combat, on a cadence set by the environment''s danger level, rolling
  a die with an encounter on the lowest result, and may also check after a loud disturbance; for overland
  travel the cadence is counted in hours instead and the page points to printed page 90. Three tables
  follow: a roll for the creatures'' starting distance in the close, near and far bands, a roll for what
  they are currently doing, which may affect how likely they are to notice the characters, and a reaction
  check for their attitude, to which an interacting character may add their Charisma modifier at the cost
  of revealing their presence and position. Some creatures are always hostile. A randomly encountered
  creature has a stated chance of carrying no treasure.'
graph_state_at_extraction: 'Read from the repository at extraction, not recalled: the canonical graph
  holds 314 registry rows and 675 edges. The registry was read in full and every reused label verified
  character for character against it. No canonical row cites printed page 112 or 113, confirmed by query,
  so nothing in this span has been extracted before.

  rule_encounter already carries six rows from printed pages 82, 83, 84, 86 and 90, and those were read
  before anything here was written, because three of them are the cadence relations this page restates.
  No monster, creature, treasure or noise identity exists. Every proposed row was checked against the
  canonical edge set for an assertion-key collision, for a shared source, type and target under a different
  aspect, and for duplicates within the patch; there are none of any.'
restatement_note: 'This page has the highest restatement density of any packet so far, and three exact
  collisions were avoided by checking rather than by noticing.

  HOW OFTEN? gathers the encounter cadence in one place, but each per-context relation is already canonical
  from the page that established it: rule_crawling_round FEEDS_INTO rule_encounter with aspect check cadence
  from printed page 84, rule_danger_level FEEDS_INTO rule_encounter with the same aspect from page 86,
  and rule_overland_travel FEEDS_INTO rule_encounter with aspect overland cadence from page 90. Asserting
  any of them here would repeat an identical five-field key, since the intervals that differ between contexts
  are magnitudes no field stores.

  What this page adds and the others do not is the explicit pointer to the overland rules by page number,
  which is carried as M001, a CROSS_REFERENCES row rather than a second cadence row. That is the same
  treatment given to the Time Passes pointers in PKT-SD-090-090 and PKT-SD-091-093.'
forward_reference_closed_note: 'PKT-SD-101-109 recorded, as part of OBS-02 and a rejected candidate, that
  the NEUTRAL ARBITER section on printed page 108 points to a Reaction Check on printed page 113 and that
  the reference could not be asserted because no such identity existed. This packet is that page and proposes
  rule_reaction_check from its defining locus.

  The pointer itself is still not asserted here, and deliberately. The sentence making it is on page 108,
  inside PKT-SD-101-109''s bounded scope, and that packet is integrated. Connecting them needs a successor
  GUR for that packet, exactly as with the carousing pointer to Wizards and Thieves in PKT-SD-091-093.
  This is the second forward reference the intake has resolved by reaching the target page, and the second
  that still owes a successor at the referring page.'
