rejected_candidates:
- text_locus: HOW OFTEN?, p112
  quoted_gist: the GM checks during crawling rounds and not combat, on a cadence set by the danger level
    with a stated interval for each of Unsafe, Risky and Deadly, and counts hours instead of rounds for
    overland travel
  why_considered: It is the fullest statement of the encounter cadence in the book and reads like the
    rule's home.
  rejection_reason: 'Every relation it states is already canonical from the page that established it,
    and asserting any would repeat an identical five-field key; see restatement_note, which names the
    three rows and their pages. The three danger levels are not proposed for the same reason they were
    declined in PKT-SD-090-090: each differs from the others only by an interval, which is a magnitude
    no field stores. The one genuinely new thing, the explicit pointer to printed page 90, is asserted
    as M001.'
- text_locus: the encounter roll, p112
  quoted_gist: '''the GM rolls 1d6. An encounter occurs on a result of 1'''
  why_considered: rule_d6_decider is canonical as The D6 Decider and this is a d6 roll deciding an outcome,
    so a RESOLVED_BY row looked available on the same reasoning that carried the torch extinguish roll
    in PKT-SD-096-100.
  rejection_reason: It is a different procedure that happens to use the same die. The D6 Decider, at its
    defining locus on printed page 78, splits the range in half, with the lower half the worse outcome
    and the upper half the better. This roll turns on a single face. Pointing rule_encounter at rule_d6_decider
    would assert that the encounter check runs the decider's procedure, which it does not, and the difference
    between them is entirely in thresholds that no field may store. Checked against page 78 directly rather
    than inferred from the identity's name.
- text_locus: the loud disturbance clause, p112
  quoted_gist: '''The GM might also check for an encounter if the characters create a loud disturbance.'''
  why_considered: A second trigger for a canonical rule, and one that also appeared in the example of
    play, where PKT-SD-096-100 rejected it as narration. Here it is in a rules section, so the earlier
    rejection does not settle it.
  rejection_reason: There is no identity for noise or disturbance and minting one is not an Analyst act;
    nothing in the graph could be its source. The clause is also hedged with might, which under the test
    established by two downstream corrections marks a bound rather than a rule, and there is nothing to
    bound. Recorded as OBS-02 because the same sentence has now been met twice from different pages and
    still cannot be carried.
- text_locus: the activity table's effect on notice, p112
  quoted_gist: '''This might impact how likely they are to notice the characters.'''
  why_considered: rule_detecting is canonical from printed page 87 and this points at it in substance.
  rejection_reason: 'Doubly hedged, might impact how likely, and it states no mechanic: no modifier, no
    check, no condition. A row from it would assert a dependency the source only gestures at. The table
    itself is carried, as M004, so a reader reaches the activity; what the activity does to detection
    is left where the source leaves it, with the GM.'
- text_locus: the always-hostile clause, p113
  quoted_gist: '''Some vicious creatures, such as undead, are always hostile.'''
  why_considered: An absolute statement, unhedged, that would exclude the reaction check entirely for
    a class of creature. Under the hedging test this is exactly the shape that earns EXCLUDES.
  rejection_reason: The type is right and the endpoint does not exist. There is no undead identity, no
    creature-category identity and no monster identity, the Monsters chapter being unextracted, and section
    2.4 keeps creature-family taxonomy outside the graph in any case. Some vicious creatures is not a
    category the source defines. This is the clearest case in the packet of a real mechanical fact that
    the graph has no way to hold; recorded as OBS-03.
- text_locus: TREASURE, p113
  quoted_gist: a stated percentage chance that a randomly encountered creature or group has no treasure
  why_considered: It is a definite mechanical statement with a number, in a rules section.
  rejection_reason: Its entire content is a magnitude and its endpoint does not exist. There is no treasure
    identity and the treasure chapter, which printed page 105 pointed to as page 117, is unextracted.
    A row asserting that encounters relate to treasure, stripped of the percentage, would carry nothing
    a reader could use and would pre-empt that chapter's defining locus.
- text_locus: PURPOSE, p112
  quoted_gist: random encounters keep time pressure up, and lingering risks more of them
  why_considered: Completeness; it is the section that explains why the rule exists.
  rejection_reason: 'Time pressure is a design property with no identity, and the lingering claim is already
    carried mechanically by the cadence rows from pages 84, 86 and 90: checking more often over more rounds
    is what lingering costs. This is the same rejection made for the TIME core principle in PKT-SD-101-109.'
non_edge_observations:
- id: OBS-01
  subject: magnitudes are excluded from every row
  detail: The three cadence intervals, the die and the single face that produces an encounter, the three
    distance bands' die ranges, the six activity ranges on two dice, the five attitude thresholds, and
    the treasure percentage are all magnitudes and none reaches a field. The three tables are carried
    as identities and the rows say what each resolves, which is everything expressible; the numbers stay
    in the immutable packet. No row carries a condition and no aspect carries a digit.
- id: OBS-02
  subject: a loud disturbance has now been met twice and still cannot be carried
  detail: 'PKT-SD-096-100 rejected the secret encounter check made for noise as narration in an example
    of play. This page states the same thing in a rules section, hedged with might, and it is rejected
    again for a different reason: there is no identity for noise or disturbance to be the source of a
    row.

    Recorded because two independent pages now gesture at the same relation and the graph holds neither.
    If a later chapter names disturbance as a mechanic, that page is its defining locus and this relation
    becomes assertable there. Until then a reader querying what triggers an encounter will find the five
    canonical cadence and environment rows and not this one.'
- id: OBS-03
  subject: always-hostile creatures are the clearest unrepresentable fact in the packet
  detail: 'The source says some vicious creatures, such as undead, are always hostile. That is an absolute,
    unhedged exclusion of the reaction check for a class of creature, and it would be a genuinely useful
    row: a reader asking when the reaction check does not apply should find it.

    It cannot be carried. There is no undead, creature-category or monster identity, the Monsters chapter
    is unextracted, and constitution section 2.4 keeps creature-family taxonomy outside the graph regardless.
    Some vicious creatures is not a defined category. So the graph will show that an encounter triggers
    a reaction check with no stated exception, which is narrower than the source. Flagged for the Architect
    as a concrete instance of the taxonomy boundary costing a real mechanical fact, rather than as a request
    for a ruling.'
- id: OBS-04
  subject: the reaction check is the second forward reference the intake has reached
  detail: 'PKT-SD-101-109 pointed at this page and could not assert the pointer. The identity now exists,
    and connecting the two still needs a successor for that packet, since the referring sentence is on
    printed page 108 inside its bounded scope. The same shape occurred with the carousing pointer to Wizards
    and Thieves.

    Worth noting that both resolved the same way: the target page, reached in ordinary sequence, supplied
    the identity without any special handling. The forward references the GM chapter makes to treasure,
    adventures, NPCs, rival crawlers and monsters should resolve the same way as those chapters are reached.'
unresolved_identity_questions: []
unresolved_identity_questions_note: None. Every judgement in this packet had either a settled precedent
  or a missing endpoint that decides it. The EXCLUDES choice is argued in excludes_choice_note against
  the hedging test, the restatements are argued against the canonical rows in restatement_note, and the
  four rejections that turn on a missing identity are not judgement calls at all.
architectural_escalations: []
architectural_escalation_note: None raised. Every identity uses an approved prefix, every row uses a legal
  edge type at status core, and no CLASSIFIED_AS row appears. OBS-03 records a real mechanical fact the
  vocabulary cannot hold, but it is the taxonomy boundary the constitution sets deliberately, so it is
  recorded as a consequence rather than raised as a request.
completeness_statement: 'All ten sections across both pages in scope were read in full at the recorded
  checksum. The packet yields 4 new identities and 8 rows, four citing printed page 112 and four citing
  page 113, reusing 5 canonical identities whose labels were verified character for character. Every row
  was checked against the 675 canonical edges for an assertion-key collision, for a shared source, type
  and target under a different aspect, and for duplicates within the patch; there are none of any, and
  no canonical row cited either page before this.

  Seven candidates were rejected and each is recorded with its reason: one a set of restatements that
  would have collided exactly, one a procedure that shares a die with a canonical rule but not its method,
  four turning on an endpoint that does not exist, and one a design property. What is deliberately not
  asserted is listed as OBS-01 through OBS-04 and there are no open identity questions. No assertion depends
  on any other ruleset.'
