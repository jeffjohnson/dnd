page_attribution_basis: >-
  Eight markers resolve in the Primary Source Material, all through the Pandoc AST rather than
  positionally, and all plain markers ending headings, which placement rule 1 applies to each whole
  heading: page 43 at MAGIC, 44 at CASTING SPELLS, 45 at CRITICAL SUCCESS, 46 at WIZARD MISHAPS, 47
  and 48 at the two later mishap tables, 49 at SCROLLS AND WANDS, and 50 at SPELL ATTRIBUTES.
  Several blocks carry no marker and take their page from the persistence rule, which is where a
  positional reading would go wrong: CRITICAL FAILURE and its two branch clauses fall on page 45, the
  PENANCE subsection and the SACRIFICE VALUE TABLE on page 44, and all five SPELL ATTRIBUTES
  subsections including FOCUS on page 50. Rows below are cited accordingly, and the three mishap
  rows in M015 through M017 are each cited to the page its own table is printed on rather than to the
  page the rule that invokes them appears on.

this_packet_closes_five_deferrals: >-
  Five earlier packets referred to mechanics defined here and recorded the deferral rather than
  inventing an identity. The ancestries, priest, wizard, fighter and thief GURs each asserted an
  effect on the spellcasting check or on a check generally while noting that the mechanism was
  defined elsewhere, and the priest and wizard GURs deferred the spell tier explicitly. Those pages
  were also reproduced as Supporting Source Context inside four of those packets, and this Analyst
  declined to read them as evidence at the time. They are in scope here for the first time.
  What this packet adds is the definitions: how a spellcasting check is actually made and against
  what difficulty, what a tier is and what it drives, and what focus means. It does not restate the
  earlier effects, which remain asserted from their own loci and are already canonical.

graph_state_at_extraction: >-
  The canonical graph holds 142 registry rows and 225 edges after the integrations to date. The
  registry and the canonical edge set were both read at extraction rather than recalled, the second
  to check for assertion-key collisions against rows already in production. Fourteen identities this
  packet needs are canonical and are listed under reused_nodes with no proposal; that is the largest
  reuse in the intake so far and reflects this chapter sitting downstream of most of what has already
  been extracted. Thirteen identities are new and are proposed below. The domain registry is still
  empty and general_rules.json is still an empty object.

collision_check_against_canonical: >-
  Ten canonical edges already touch endpoints this packet uses, and each was checked against the
  constitution section 4 assertion key before any row here was written. Two near-misses are worth
  naming. The canonical row abil_learning_spells CONSUMES item_spell_scroll on the aspect scroll
  expenditure is distinct from M025 only by source_id: the wizard's Learning Spells benefit and an
  ordinary scroll casting are two separate ways a scroll is used up, and the source states both. The
  canonical row rule_difficulty_class FEEDS_INTO rule_check on the aspect success threshold is
  distinct from M006 only by target, the ordinary check versus the spellcasting check. Neither
  collides, and neither is a duplicate reading.

