authored_polarity_declaration: >-
  Thirteen rows carry authored polarity, all with basis read. The TRIGGERS rows are M008 and M009,
  both neutral, and M011 through M014, all inflicts. The MODIFIES row is M010, improves. The
  CONSTRAINS rows are M028 through M032 and M035, all governs. Each type is among the three
  constitution section 5 requires to carry source-reviewed authored polarity, and each row was read
  aloud as source polarity target before being recorded.
  M008 and M009 use neutral deliberately rather than as a default. The check produces the critical
  outcome; whether that outcome helps or harms is carried by the outcome's own rows, M010 for the
  benefit and M011 through M014 and M027 for the harm. Recording the trigger as improves or inflicts
  would state the valence twice and would make the two symmetrical rows disagree about a mechanic
  that is one roll. No row uses basis heuristic or unset. No other row carries a polarity value: the
  GATES, FEEDS_INTO, CONSUMES and RESOLVED_BY rows take their derived polarity from the section 5
  table and the Analyst authors none of them.

domains_touched: []
candidate_domains:
  - proposed: magic
    basis: >-
      This is the chapter the candidate was raised against. The priest and wizard packets each
      recorded it from a class entry; this packet is its defining locus and supplies the casting
      procedure, tiers, mishaps, scrolls, wands, ranges, durations and focus. Three packets now
      support it. Recorded as a candidate only; constitution section 8 reserves promotion to an
      Architect Decision and the Analyst does not decide a candidate domain is official.

domain_boundary_questions:
  - >-
    Casting consumes an action and is checked at the start of a turn, so the magic material reaches
    into turn structure; damage forces a focus check, so it reaches into combat. Whether magic is a
    domain or a subsystem crossing several cannot be settled here. Deferred; no domain is asserted on
    any edge in this GUR.

candidate_general_rules:
  - proposed: a spell's tier drives every value the casting rules derive from it
    establishing_locus: 'SD page 50, TIERS, with its uses on pages 44, 45 and 49'
    basis: >-
      The tier feeds the casting difficulty, selects which of three mishap tables applies, and fixes
      the sacrifice value, which is five rows from one attribute. A rule would cover any later
      tier-derived value without a new row.
    not_applied: >-
      Recorded as a candidate only. Constitution section 5 requires a separate Architect ruling with
      an establishing locus, scope, counterexamples and affected set, and the Analyst is prohibited
      from promoting one. The Analyst is also not confident it should be promoted: the three uses
      derive different kinds of thing, a threshold, a table choice and a currency amount, so a single
      rule would have to be stated loosely enough to be hard to check. No edge sets general_rule_id.

non_edge_observations:
  - id: OBS-01
    subject: the three mishap tables' contents are not extracted
    detail: >-
      Pages 46 to 48 carry three rollable tables whose rows are the actual mishaps. Only the tables'
      identities and their two relationships, being triggered by a critical failure and being
      selected by tier, are asserted. The individual mishap outcomes are not.
      That is the same disposition the four class talents tables received, and for the same reason
      where it applies: an outcome row would need an edge type meaning produces, which the closed
      vocabulary lacks. It is a larger omission here, because several mishap entries plainly do
      describe mechanical effects rather than names. The Analyst read all three tables and judged
      that extracting individual outcomes would require minting an identity per mishap from a table
      cell, with no defining locus anywhere else in the book to govern the spellings. If Reviewer
      wants them, they are better raised as a bounded question than decided inside this packet.
  - id: OBS-02
    subject: the spellcasting talent is named but not given its own identity
    detail: >-
      Page 44 says characters with the spellcasting talent can cast spells. M002 gates the check on
      the canonical talents mechanic rather than on a distinct spellcasting-talent identity. No page
      in this packet defines such a talent, the four class talents tables do not list one by that
      name, and minting one here would fix an identity from a single referring clause. The class
      entries grant spellcasting directly, which is already asserted from their own loci.
  - id: OBS-03
    subject: casting from a scroll without knowing the spell is not assertable
    detail: >-
      Page 49 says a spellcaster may use a scroll or wand for a spell on their spell list even if
      they do not know it. The permission is genuinely mechanical and is the point of the section,
      and it is not extracted: it relates a caster to a spell they do not know, and neither knowing a
      spell nor a caster's spell list is an identity this graph holds. The spells-known tables from
      the priest and wizard entries are the closest, and they count spells rather than represent
      knowing one.
      M023 and M024 assert what is expressible, that using a scroll or wand is resolved by a
      spellcasting check. Recorded so the narrower assertion is visibly a limit of the vocabulary
      rather than a misreading of the page.
  - id: OBS-04
    subject: the casting difficulty formula is stated twice and asserted once
    detail: >-
      Page 44 gives the difficulty as a base plus the spell's tier, and page 49 restates the identical
      formula for a spell cast from a scroll or wand. M005 carries it once. A second row would have
      the same source, type, target, aspect and condition and would collide under the section 4
      assertion key, so omitting it is required rather than optional. The restatement is evidence
      that the scroll and wand rules reuse the ordinary casting procedure, which is what M023 and
      M024 record.
  - id: OBS-05
    subject: three focus rules are stated and not extracted
    detail: >-
      Page 50 says a caster cannot cast other focus spells while focusing, may end a focus spell at
      any time, and does not lose the ability to cast the spell when focus merely fails. The first is
      self-referential, relating focus to itself, and an edge would be a self-loop; the second and
      third state the absence of a consequence rather than a dependency. All three are real rules and
      none has two named mechanics to connect. The fourth clause, that a critical failure on a focus
      check is treated as a standard critical failure, is already carried by M009 and the critical
      failure's own rows.
  - id: OBS-06
    subject: distraction is named alongside damage and is not asserted
    detail: >-
      Page 50 says a caster must make a maintenance check if they take damage or become distracted,
      giving an earthquake as an example. M035 asserts the damage half only. Distraction is not a
      named mechanic anywhere in the book read so far and the example is narrative, so an identity
      would be minted from an aside. Recorded so the partial extraction of that sentence is visibly
      deliberate.
  - id: OBS-07
    subject: the penance failure mode is stated and not extracted
    detail: >-
      Page 44 says inadequate or subversive penance, such as donating a sacrifice to a party member,
      displeases the deity further and makes the spell loss permanent. This is a real and unusual
      rule. It is not asserted because it describes a quality of a performance rather than a relation
      between two mechanics: the graph has no identity for an inadequate penance, and inventing one
      would be an Analyst judgment about what counts as adequate.
  - id: OBS-08
    subject: the wizard and priest magic characterisations are flavour
    detail: >-
      Page 44 opens by describing wizard magic as fickle and volatile and priest magic as miraculous
      and instinctive, and page 43 carries an attributed epigraph. The priest sentence gestures at
      losing spells until penance, which is the rule M011 and M018 assert from the CRITICAL FAILURE
      and PENANCE subsections that state it properly. The descriptions themselves name no mechanic
      and state no dependency.
  - id: OBS-09
    subject: magnitudes deliberately excluded
    detail: >-
      The pages carry the casting die and both stat-modifier expressions, the difficulty base, the
      natural roll values for both criticals, the doubling factor, the tier range, every value in the
      sacrifice table, the die and every row band of all three mishap tables, and the distance and
      duration bands named in the RANGE and DURATION subsections. All are die expressions, thresholds,
      multipliers, currency amounts or index values, excluded by constitution section 1 and invariant
      11. They remain in the immutable claimed packet, which is the authority for the values
      themselves. No aspect in this GUR contains a digit and no condition encodes a numeric value.

unresolved_identity_questions:
  - id: IDQ-01
    subject: whether the two criticals are procedures or outcomes
    detail: >-
      rule_critical_success and rule_critical_failure are proposed under rule_ with kind procedure,
      because each has its own heading and each states what follows. They are arguably outcomes of a
      roll rather than procedures in their own right, and the constitution offers no outcome kind.
      The Analyst chose rule_ because the alternative was to fold both into the spellcasting check
      and lose seven rows, including the branch to penance and the three mishap tables, which are the
      most distinctive rules in the chapter.
      Consequence if wrong: two nodes need a kind correction, which is a registry change rather than
      a re-reading of source, and no row repoints. Recorded because the same question will recur
      wherever the book names an outcome of a roll.
  - id: IDQ-02
    subject: overlapping effects was modelled as CONSTRAINS rather than OVERRIDES
    detail: >-
      Page 50 says two ongoing effects of the same spell on one target do not combine and that the
      most powerful takes precedence. Precedence reads like OVERRIDES, which means supersedes or
      replaces.
      OVERRIDES was rejected on two grounds. It requires a supersession basis from the closed section
      7 list, and none of the four fits a same-spell precedence rule. And its endpoints would have to
      be two instances of one spell, which the graph cannot distinguish: the edge would be a self-loop
      on whichever spell identity was chosen. M032 therefore records that the rule bounds how
      durations interact, which is what the page's own example, the longer remaining duration, is
      about.
      Consequence if wrong: one row changes type and gains a basis, and a Decision would have to say
      which basis applies. Recorded rather than decided quietly.

architectural_escalations: []
architectural_escalation_note: >-
  None raised. Every proposed node uses an approved constitution section 2 prefix with an unchanged
  kind, every edge uses one of the thirteen legal section 3 types, and no new prefix, edge type,
  domain promotion or general-rule application is requested. ESCALATION_CONTRACT states that a
  proposed node under an approved prefix and kind which passes identity and duplicate checks is
  ordinary GUR, GUP and Review work rather than an escalation, and that an unsupported edge should
  simply be rejected rather than escalated, which is what OBS-03 and OBS-05 through OBS-07 record.
  IDQ-01 and IDQ-02 are recorded for Reviewer on the same basis. OBS-01 flags the one question the
  Analyst thinks may deserve a bounded ruling later, whether rollable outcome tables should have
  their rows represented at all, but it blocks nothing here and is not escalated from this packet.

completeness_statement: >-
  All eight printed pages in the declared span are accounted for. Page 43 is the chapter heading and
  an epigraph, in OBS-08. Page 44 was read in full: the CASTING SPELLS heading and both magic
  characterisations in OBS-08, the CASTING subsection supplying M001 through M006 with its talent
  clause in OBS-02, the RESULTS subsection supplying M007, and the PENANCE subsection supplying M018
  through M021 with its failure mode in OBS-07, and the SACRIFICE VALUE TABLE with all its rows
  supplying M021 and M022. Page 45 was read in full: CRITICAL SUCCESS supplying M008 and M010, and
  CRITICAL FAILURE supplying M009 and M011 through M014 with both branch clauses. Pages 46, 47 and 48
  are the three mishap tables, whose identities supply M012 through M017 and whose rows are
  dispositioned in OBS-01. Page 49 was read in full: USING SCROLLS AND WANDS supplying M023 and M024
  with its knowledge permission in OBS-03 and its restated formula in OBS-04, SCROLLS supplying M025,
  and WANDS supplying M026 and M027. Page 50 was read in full: TIERS, RANGE, DURATION, OVERLAPPING
  EFFECTS and FOCUS, supplying M028 through M036, with three unextractable focus rules in OBS-05 and
  distraction in OBS-06.
  Every page marker was resolved through the Pandoc AST and the resolved page set matches the
  declared span with no gap; the blocks that inherit their page under the persistence rule are named
  in page_attribution_basis. Thirty-six edges are proposed across thirteen candidate nodes, with
  fourteen canonical nodes reused rather than proposed, the largest reuse in the intake so far. Every
  row was checked against the 225 canonical edges for an assertion-key collision before publication,
  recorded in collision_check_against_canonical. Content not converted to an edge is accounted for in
  OBS-01 through OBS-09, and the two questions the Analyst could not settle are recorded in IDQ-01
  and IDQ-02 rather than resolved silently. No assertion depends on any other ruleset.
