source_summary: >-
  Two monster stat blocks. Aboleth is a large aquatic creature with three named abilities,
  Curse, Enslave and Telepathic. Acolyte is a low-level human trainee with one named ability,
  Healing Touch. Both blocks print the same eight fields the Monster Attributes page defines:
  armour class, hit points, attacks, movement, the six stat modifiers, alignment and level.

