rejected_candidates:
  - text_locus: 'Curse, p194'
    quoted_gist: >-
      a save-or-suffer ability turning the target into a deep one over a stated number of days
    why_considered: >-
      It is the strongest candidate on the page: a named, titled ability with a real mechanical
      effect, not mere flavour, and it is the first content in the chapter that looks like it
      could need its own identity under the broad abil_ kind, ability or derived ability
      mechanic, the same kind abil_dark_adapted used one packet ago.
    rejection_reason: >-
      It is a stat-block description under constitution 2.5, printed once under Aboleth's own
      block rather than in a shared locus. No existing canonical identity for a curse, a
      transformation or the named target creature deep one exists, so no dependency on a shared
      mechanic could be stated even if an identity were minted; minting abil_curse would create
      an identity with nothing to connect it to anything already in the graph, which is what the
      boundary excludes. See stat_block_boundary_note.
  - text_locus: 'Enslave, p194'
    quoted_gist: >-
      a save-or-be-controlled ability usable in place of the creature's attacks
    why_considered: >-
      In place of attacks reads like a dependency on the attack mechanic, and DC 15 WIS echoes
      the save structure used throughout the book.
    rejection_reason: >-
      A stat-block description under the same boundary. In place of attacks describes when the
      creature chooses to use the ability, not a rule the ability depends on or modifies;
      cbt_attack_roll is unaffected whether or not this ability exists. There is no canonical
      identity for a controlled condition, which the Analyst already noted absent at printed
      page 189 when declining blinded and deafened for the same reason.
  - text_locus: 'Telepathic, p194'
    quoted_gist: 'a passive ability to read the thoughts of all creatures within far'
    why_considered: >-
      spell_detect_thoughts is canonical and named almost identically, so the ability looked like
      it might be that spell in a different form.
    rejection_reason: >-
      The ability is not cast, has no DC, no check and no duration; it is passive and automatic,
      which is not how spell_detect_thoughts works at its own defining locus. Equating the two
      would assert an identity the text does not state. Declined as a stat-block description like
      the others.
  - text_locus: 'Healing Touch (WIS Spell), p194'
    quoted_gist: >-
      an ability tagged as a WIS spell, with its own DC and a stated amount of healing
    why_considered: >-
      The WIS Spell tag is the page's one explicit pointer to the shared spellcasting system, and
      rule_spellcasting_check is canonical with 40 rows, so a dependency looked plausible.
    rejection_reason: >-
      The instruction that monster spellcasting is treated the same as character spellcasting is
      already canonical and unconditioned from printed page 189, so it already covers this
      ability without a new row; re-asserting it here would duplicate that canonical relation
      from a restatement, the same reason the two spellcasting restatements were declined at 189.
      Healing Touch itself is not one of the 87 canonical spell_ identities and has no defining
      locus in the spells chapter; it is this creature's own named ability, a stat-block
      description under 2.5.
  - text_locus: 'the flavour text for both creatures, p194'
    quoted_gist: >-
      an italicised line describing the Aboleth as an antediluvian catfish that hates
      intelligent beings, and the Acolyte as a religious trainee who knows basic rites
    why_considered: 'Read for completeness, as every block on an in-scope page must be considered.'
    rejection_reason: >-
      Narrative description, the same disposition applied to the battle scene at printed page
      188. No sentence states a rule.
  - text_locus: 'the eight stat-block fields on each creature, p194'
    quoted_gist: >-
      AC 16, HP 39, the attack line, MV near (swim), the six stat modifiers, AL C and LV 8 for
      Aboleth; the equivalent eight for Acolyte
    why_considered: >-
      Every field names a canonical shared identity directly: cbt_armor_class, rule_hit_points,
      cbt_attack_roll, ex_movement, abil_stat_modifier, sys_alignment and mstat_monster_level.
    rejection_reason: >-
      This is the exact case constitution 2.5 names by example. Each field is a printed value on
      one creature, not a dependency between two mechanics; the shared mechanics themselves are
      already canonical from printed page 189 and reused there, not re-derived per creature.
      Extracting these would also be unbounded: the chapter has roughly sixty more stat-block
      packets, and if this shape earned rows here it would have to everywhere.
  - text_locus: 'the appended shared-system context, out of scope'
    quoted_gist: >-
      the monster attributes, movement and conditions, morale, and complete magic rules pages
    why_considered: >-
      All four are in the file, unusually extensive, and directly relevant to reading a stat
      block correctly.
    rejection_reason: >-
      All four are Supporting Source Context, outside the bounded scope, and each is already
      integrated from its own primary packet. Extracting from any would duplicate canonical rows
      and cite pages outside this packet's range.

non_edge_observations:
  - id: OBS-01
    subject: the first stat-block packet is a null-edge packet, and the two prior escalations are why
    detail: >-
      This packet yields 0 rows and 2 identities, the first time the chapter has produced nodes
      with no accompanying edge. That shape is the direct, intended consequence of DEC-2026-0105:
      the whole reason that Decision was sought was to settle, before the roughly sixty
      stat-block packets ahead, that a stat block's own values are not graph content. Zero rows
      here is the boundary working as designed, not a shortfall.
      It is worth stating plainly because the shape will repeat. Most remaining monster packets
      are expected to look like this one: identities registered, no rows, unless a stat block's
      prose states an explicit dependency the way PKT-SD-189, 190-191 and 192-193 did from the
      shared pages.
  - id: OBS-02
    subject: locus, not content, separates a shared ability from a stat-block description
    detail: >-
      abil_dark_adapted and the four abilities declined here are all the same shape of text, a
      bolded name followed by a sentence of mechanical effect. Only one of the five earned a row.
      The difference is where each is printed. Dark-Adapted is stated once, in the shared Monster
      Attributes page, about a whole class of creatures at once; Curse, Enslave, Telepathic and
      Healing Touch are each stated once, under one creature's own block.
      Recorded because this is the test the remaining chapter will need repeatedly, and it is a
      fact about the page rather than a reading of the ability's importance. A dramatic ability
      printed under one creature is still stat-block content; a minor one printed on the shared
      page would still be a shared mechanic.
  - id: OBS-03
    subject: a node without an edge is a considered choice, not an omission
    detail: >-
      Every prior tbl_ or rule_ registration in this book paired with at least one edge in the
      same GUR, because those identities exist to be resolved by or to resolve something. A
      creature identity is different: it exists because the source names a distinct thing, and
      its defining locus is exactly the page that also states its individual values, which this
      Decision excludes. The two facts collide only for creature identities, not for tables or
      rules, which is why this is the first packet to produce the isolated-registration shape
      that ARTIFACT_LIFECYCLE and ESCALATION_CONTRACT both already contemplate.
      Recorded so a reader does not mistake a deliberately edgeless node for an incomplete
      extraction; completeness_statement confirms every block on the page was dispositioned.
  - id: OBS-04
    subject: an acolyte was already named without a row, and this does not retroactively change it
    detail: >-
      PKT-SD-182-183-tomb declined 2d4 chanting acolytes, among other creature content on printed
      page 183, for want of a monster_ identity. monster_acolyte now exists. That earlier packet's
      GUR, GUP, Review and Integration are immutable and are not reopened or corrected by this
      registration; a future packet that names an acolyte may now reuse the identity, but the
      tomb packet's row was correctly declined under the rules in force when it was written,
      since no such identity existed at that time.

