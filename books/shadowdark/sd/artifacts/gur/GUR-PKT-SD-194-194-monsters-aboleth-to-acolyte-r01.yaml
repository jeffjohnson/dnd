stat_block_boundary_note: >-
  Constitution 2.5 is the operative text for this entire packet and is quoted rather than
  paraphrased where it decides something: individual creature stat-block values, including AC,
  HP, LV, attacks, movement, modifiers, alignment, DC, and tier, are not graph content merely
  because they are printed for that creature, and a stat-block description never creates an
  identity, edge, property store, or completeness obligation.
  The word including before the eight named fields is a non-exhaustive list, and the sentence
  that follows it reaches further: a stat-block description, not only a stat-block value, is
  excluded. Curse, Enslave, Telepathic and Healing Touch are each a stat-block description,
  printed once under one creature's own block, so each is excluded by that sentence directly and
  none is escalated.
  The distinction that matters is locus, not form. abil_dark_adapted, registered at printed page
  189, survived the same boundary because its locus was the shared Monster Attributes page,
  applying to all non-humanoid monsters at once; it is a shared mechanic described in a shared
  place. Curse, Enslave, Telepathic and Healing Touch are each stated once, under one creature,
  and nothing in the source suggests they recur; that is what makes them stat-block content
  rather than a shared mechanic, and it is a factual distinction rather than a judgement call.

creature_identity_note: >-
  Both proposed nodes carry no edge in this GUR, so the reasoning for registering them at all is
  set out here rather than left to a why_needed field.
  A creature's identity is not one of its values. Constitution 2.5 excludes AC, HP, LV and the
  rest because they are the creature's printed fields; it does not exclude the creature itself,
  which is what those fields describe. monster_ is declared as creature or creature family, and
  DEC-2026-0097 uses monster_dwarf as a test fixture for an unregistered creature, confirming the
  prefix denotes the creature and not one of its attributes.
  This chapter has declined to name a creature from an encounter table in every packet since
  PKT-SD-142-143, and every one of those declines gave the same reason: a creature's defining
  locus is its stat block, not a line in a table. This page is that locus for Aboleth and
  Acolyte. Registering them here, at their defining locus, is what that repeated reasoning was
  for; deferring it to a future encounter-table or family packet would mint the identity from a
  locus the chapter has already ruled is not the right one.
  A registration with no edge in the same patch is an ordinary, contemplated shape rather than an
  exception. ARTIFACT_LIFECYCLE lists proposed registry additions isolated from edge changes as
  a normal component of a GUP, and ESCALATION_CONTRACT names a node that passes identity and
  duplicate checks and can be isolated as a normal GUP registry addition as a case that does not
  escalate. Both proposals meet that description.
  What is not claimed: that either creature participates in any stated dependency on this page.
  None does. The identity is registered so that a later packet whose own content does state a
  dependency, an encounter table, a family page, or a cross-reference, can reuse a stable
  canonical id rather than re-deriving one, per the reuse discipline already applied throughout
  this book.

