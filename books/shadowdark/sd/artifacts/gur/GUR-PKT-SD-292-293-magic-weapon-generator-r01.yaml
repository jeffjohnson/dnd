source_summary: >-
  Pages 292–293 present the Magic Weapon Generator section under WEAPONS, comprising five tables for randomly generating magic weapons:
  - WEAPON TYPE TABLE (d20) determines base weapon type (Arrows, Bastard sword, Club, Crossbow, Crossbow bolts, Dagger, Greataxe, Greatsword, Javelin, Longbow, Longsword, Mace, Shortbow, Shortsword, Staff, Warhammer);
  - WEAPON BONUS TABLE (2d6) determines magic weapon bonus (+0, +1, +2, +3);
  - WEAPON FEATURE TABLE (d20) provides distinctive visual, thematic, and physical features;
  - WEAPON BENEFIT TABLE (d12) provides supernatural combat benefits and magical properties;
  - WEAPON CURSE TABLE (d12) provides drawbacks and curses for cursed magic weapons.

