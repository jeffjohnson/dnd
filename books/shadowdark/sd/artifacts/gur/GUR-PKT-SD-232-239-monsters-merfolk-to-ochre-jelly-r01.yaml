source_summary: >-
  Twelve creature stat blocks: Merfolk (ocean dweller, spear), Mimic (object-disguised beast, Stick),
  Minotaur (bull-man, Charge), Moose (towering grazer, antlers), Mordanticus the Flayed (unique mummy-lich,
  Legendary Undead, Crown of Gehemna, Necrosis, Phylactery, INT spells), Mummy (embalmed undead, Supreme
  Undead, Desiccated, Necrosis), Mushroomfolk (subterranean fungal humanoid, Sunblind, Telepathic), Naga
  (giant cobra spellcaster, Poison, CHA spells), Naga, Bone (undead naga husk, Greater Undead), Nightmare
  (flaming warhorse, Impervious), Obe-Ixx of Azarumme (unique ur-vampire conqueror, Legendary Undead, Blood
  Drain, Charm, Moonbite Properties, Shapechange, Ur-Vampire), and Ochre Jelly (quivering slime, Split).
  Printed page 235 is classified full-page-artwork and holds no rulebook prose.

