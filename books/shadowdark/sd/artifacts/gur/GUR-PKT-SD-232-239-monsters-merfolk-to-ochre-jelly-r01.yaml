non_edge_observations:
  - id: OBS-01
    subject: Unique legendary monsters Mordanticus and Obe-Ixx feature bespoke trait suites
    detail: >-
      Mordanticus the Flayed (p234) and Obe-Ixx of Azarumme (p238) represent high-level unique boss encounters.
      Both possess Legendary Undead (morale immunity, magical damage only, hostile spells DC 18 to cast) and
      bespoke defense and attack traits (Crown of Gehemna, Necrosis, Phylactery, Blood Drain, Charm, Moonbite
      Properties, Ur-Vampire). These operate on creature combat loci under Constitution 2.5.
  - id: OBS-02
    subject: Monster stat-block spells operate on creature action locus
    detail: >-
      Mordanticus and Naga stat blocks list creature-specific spell actions (e.g. Absorb, Banish, Bind, Blast,
      Phase, True Name; Agony, Hypnotize, Whispers). Under Constitution 2.5, monster stat-block spells operate
      on creature action locus and do not establish standalone player spell identities.
  - id: OBS-03
    subject: Ochre Jelly Split represents an iconic slashing damage reaction
    detail: >-
      When cut or chopped, Ochre Jelly divides into two smaller oozes with halved remaining HP (up to four splits).
      This operates as a creature defense trait on creature locus under Constitution 2.5.
  - id: OBS-04
    subject: Page 235 full-page artwork is excluded from graph extraction
    detail: >-
      Page 235 contains an artwork illustration between Mordanticus and Mummy, classified as .full-page-artwork
      in the Pandoc AST and excluded by steward declaration.

