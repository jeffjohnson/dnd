rejected_candidates:
  - text_locus: 'Song (Harpy), p226'
    quoted_gist: >-
      Enemies who can hear within double near DC 12 CHA or dazed and drawn to harpy for 1d4 rounds. Immune for
      1 day if passed check.
    why_considered: 'Checked for dazed condition, range/charm mechanics, or immunity rules.'
    rejection_reason: >-
      Stat-block attack action on creature locus; DC 12 CHA check, double near range, dazed/drawn rider,
      1d4 rounds duration, and 1 day immunity operate on creature combat locus; constitution 2.5.
  - text_locus: 'Impervious (Hell Hound), p226'
    quoted_gist: 'Fire immune.'
    why_considered: 'Checked for damage immunity profiles.'
    rejection_reason: >-
      Stat-block defense trait on creature locus; fire damage immunity is a creature-specific defense profile;
      constitution 2.5 locus test applies.
  - text_locus: 'Fire Breath (Hell Hound), p226'
    quoted_gist: >-
      Fills a near-sized cube extending from hell hound. DC 15 DEX or 3d8 damage. Cannot use again for 1d4 rounds.
    why_considered: 'Checked for breath weapon area, saving throw, damage, or recharge mechanics.'
    rejection_reason: >-
      Stat-block attack description on creature locus; near cube area, DC 15 DEX check, 3d8 fire damage, and
      1d4 rounds recharge operate on creature combat locus; constitution 2.5.
  - text_locus: 'Stumpy (Hippopotamus), p226'
