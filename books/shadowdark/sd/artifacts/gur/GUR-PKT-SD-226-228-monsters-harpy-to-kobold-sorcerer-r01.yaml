non_edge_observations:
  - id: OBS-01
    subject: Harpy Song and Hell Hound Fire Breath represent creature combat riders and breath attacks
    detail: >-
      Song imposes a DC 12 CHA check against dazed/drawn state at double near range, while Fire Breath fills
      a near cube with 3d8 fire damage on DC 15 DEX (1d4 rounds recharge). Both operate on creature combat
      loci under Constitution 2.5.
  - id: OBS-02
    subject: Hydra Heads mechanics establish modular head-based stat management
    detail: >-
      Hydra Heads governs variable head count, head stats (LV 2, AC 15, 1 bite), head sprouting on turn start
      unless cauterized, and aggregate level calculation. This operates on creature stat block locus under
      Constitution 2.5.
  - id: OBS-03
    subject: Invisible Stalker exhibits three innate traits
    detail: >-
      Bound defines a narrative dismissal contingency; Invisible defines innate natural invisibility; Tracking
      grants quarry sensing. All operate on creature locus under Constitution 2.4/2.5.
  - id: OBS-04
    subject: Kobold Sorcerer spells operate as creature stat block actions
    detail: >-
      Kobold Sorcerer features Scorpion Sting (DC 11 CHA, 1d6 damage + DISADV on next roll) and Spider Swarm
      (DC 12 CHA, summons spider swarm for 1d4 rounds). Per Constitution 2.5, monster stat-block spells operate
      on creature action locus and do not establish standalone player spell identities.
  - id: OBS-05
    subject: Invariant 4 evaluated for Hobgoblin and Kobold
    detail: >-
      Neither appears as an ancestry or language in canonical Shadowdark core registries; both are registered as
      distinct creature identities (monster_hobgoblin, monster_kobold, monster_kobold_sorcerer) at their defining
      loci in chapter 11.

