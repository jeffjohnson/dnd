non_edge_observations:
  - id: OBS-01
    subject: Gibbering introduces an inline d8 confusion action table on creature locus
    detail: >-
      Gibbering specifies an inline random-action table (d8: 1-3 do nothing, 4-5 move random direction,
      6-7 attack nearest, 8 flee) on failed DC 12 WIS save within near. Under Constitution 2.5, this
      describes a creature-specific aura effect rather than establishing a systemic confusion status.
  - id: OBS-02
    subject: Latch specifies attachment and auto-hit parameters on attack locus
    detail: >-
      Latch on Gibbering Mouther allows the creature to attach to a bitten target so bites auto-hit
      next round until torn off with a DC 12 STR check. This operates entirely within the creature's
      attack mechanics.
  - id: OBS-03
    subject: Gnoll Rage provides self-contained combat buffs
    detail: >-
      Rage on Gnoll grants immunity to morale checks and +1d4 damage for 3 rounds 1/day, operating
      within the creature's stat-block parameters.

