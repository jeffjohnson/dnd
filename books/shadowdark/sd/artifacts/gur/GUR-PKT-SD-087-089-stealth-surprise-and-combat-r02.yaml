  analyst_rationale: Required by REV-GUP-PKT-SD-087-089-stealth-surprise-and-combat-r01-r01. Printed page
    87 states that attacking from hiding gives away the attacker's position afterwards unless the GM determines
    otherwise. Revision 1 carried what hiding is and what surprise grants, but not what attacking costs
    the hider, so the graph showed stealth enabling an attack and never showed the attack ending the stealth.
    EXCLUDES is the type that actively prevents a relation, and the GM's discretion is carried in the
    condition rather than by weakening the row.
