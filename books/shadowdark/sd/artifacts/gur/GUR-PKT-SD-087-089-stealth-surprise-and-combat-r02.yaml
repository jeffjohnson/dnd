page_attribution_basis: 'Three markers resolve this packet: p87 ends the STEALTH AND SURPRISE heading,
  p88 ends COMBAT and p89 ends DAMAGE. Placement rule 1 applies each to its whole heading and the persistence
  rule carries it to the following unmarked sections.

  Worth noting for the reader: p87 and p88 end second-level headings while p89 ends a third-level heading
  nested inside the COMBAT section. The placement and persistence rules do not distinguish heading levels,
  so DAMAGE, TERRAIN, MORALE and DEATH all take page 89 even though they sit under a heading whose own
  marker was p88. No page is shared with another packet and no content precedes the first marker.'
scope_boundary: The bounded scope is the Primary Source Material section, printed pages 87 to 89, covering
  stealth and surprise, the combat round and its action menu, damage and critical hits, terrain, morale
  and death. The trailing Supporting Source Context is out of scope.
source_summary: Procedural rules text rather than entries. Page 87 defines hiding and sneaking as a stat
  check with two stated limitations, detecting as the counter-procedure, and surprise as the advantage
  of beginning a turn undetected. Page 88 opens combat, determines surprise, calls for an initiative roll,
  states what a character may do on a turn, and lists five named actions. Page 89 defines damage and its
  subtraction from hit points, the election to knock out rather than kill, critical hits, terrain effects
  on targeting and movement, morale and flight, and the death sequence of dying, timer, stabilization
  and death.
graph_state_at_extraction: 'Read from the repository at extraction, not recalled: the canonical graph
  holds 253 registry rows and 550 edges. No canonical row cites pages 87, 88 or 89, confirmed by query,
  so nothing in this span has been extracted before. The canonical edge set was loaded so every proposed
  row could be checked against the section 4 assertion key, and additionally checked for the weaker case
  of an existing row sharing the same source, type and target under a different aspect; there are none
  of either.'
restatement_note: 'This packet restates rules whose defining loci are elsewhere in the book, and the restatements
  are deliberately not re-asserted. Recording them because their absence would otherwise look like an
  extraction gap.

  COMBAT TURNS restates the turn, action and movement relations defined on printed page 8 and already
  canonical as rule_turn GATES rule_action, rule_turn GATES ex_movement and rule_action CONSTRAINS ex_movement.
  COMBAT INITIATIVE restates the initiative relations defined on printed page 83 and already canonical
  as abil_dexterity FEEDS_INTO cbt_initiative and cbt_initiative FEEDS_INTO rule_turn. DAMAGE restates
  the damage-to-hit-points relation defined on printed page 9 and already canonical as rule_damage MODIFIES
  rule_hit_points with aspect current total; this packet adds what page 9 does not carry, that a successful
  attack roll triggers damage and that the damage roll feeds it.

  In each case the earlier page is the defining locus and the row already exists. Re-asserting under a
  fresh aspect would create a second row for one fact, which reads as two rules. Where the source explicitly
  points elsewhere, as CAST A SPELL does to printed page 44, that pointer is carried as a CROSS_REFERENCES
  row rather than duplicating the referenced rule.'
