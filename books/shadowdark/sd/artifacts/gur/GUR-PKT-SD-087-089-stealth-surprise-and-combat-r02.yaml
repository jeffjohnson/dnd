  analyst_rationale: Required by REV-GUP-PKT-SD-087-089-stealth-surprise-and-combat-r01-r01. Printed page
    89 states that a dying character rolling the highest natural result on a subsequent turn rises with
    hit points. Revision 1 carried the descent into dying, its timer and the two ways out by healing or
    stabilization, but not this third way out, so the graph showed a dying character with no unaided escape.
    The hit point value is a magnitude and is not stored; the condition names the circumstance. rule_natural_twenty
    is canonical and is reused, not proposed.
authored_polarity_declaration: 'Authored polarity appears on eighteen rows and no others, each with basis
  read as invariant 15 requires, and each is a MODIFIES, TRIGGERS or CONSTRAINS row as constitution section
  5 allows. The seven CONSTRAINS rows take governs. Surprise''s three benefits and the critical success
  damage row take improves. Terrain''s two obscured-target rows take worsens. The successful hit, the
  dying state and the expired timer take inflicts. Two TRIGGERS rows take neutral: an improvised action''s
  resolution, which may help or hurt, and a critical success on an attack roll, whose benefit is asserted
  by its own separate row rather than by the trigger''s polarity. The fifteen FEEDS_INTO, five EXCLUDES,
  two CROSS_REFERENCES, one GATES, one EXCLUDED_FROM and one OVERRIDES row carry none, since section 5
  derives those.'
supersession_note: One OVERRIDES row appears, rule_knockout over rule_death, with supersession_basis explicit_replacement
  as constitution section 7 requires and invariant 20 checks. The basis is explicit_replacement rather
  than optional_variant because the source states a substitution the attacker elects at the moment of
  reducing a creature, replacing the lethal outcome entirely, rather than offering an alternative rule
  a table may adopt.
domains_touched: []
candidate_domains:
- proposed: combat
  basis: Most of this packet is the combat procedure. Recorded as a candidate only; constitution section
    8 reserves domain promotion to an Architect Decision.
- proposed: exploration
  basis: Stealth, detection and terrain sit as readily in exploration as in combat, and the source places
    stealth in its own section ahead of combat. Recorded as a candidate and as a boundary question rather
    than resolved.
domain_boundary_questions:
- id: DBQ-01
  subject: stealth and terrain straddle combat and exploration
  detail: 'Hiding, sneaking, detecting and terrain are printed inside the same span as the combat procedure
    and interact with it, but they apply equally outside combat, and the source gives STEALTH AND SURPRISE
    its own second-level heading separate from COMBAT. Recorded rather than resolved: the Analyst may
    not decide a candidate domain is official.'
candidate_general_rules: []
candidate_general_rules_note: None proposed. The melee and ranged attack rows share a shape, as do the
  two named attack actions' bounds, but they are two source-named actions rather than instances of a rule,
  and the Analyst is prohibited from promoting a general rule.
non_edge_observations:
- id: OBS-01
  subject: Morale is the identity two integrated spells needed
  detail: 'rule_morale is proposed here from its defining locus. It is the rule by which reduced enemies
    flee, and flight is exactly the outcome that PKT-SD-068-070 and PKT-SD-070-072 could not carry: Rebuke
    Unholy and Turn Undead both state that a failed check makes a creature flee, and both recorded the
    omission because no flight, fear or morale identity existed. It exists once this packet integrates.

    This GUR does not connect those spells to it. Their rows belong to their own packets and both are
    integrated, so the connection needs a successor GUR for each, which is work outside this packet''s
    scope and outside the one-packet relay currently in flight. Recorded so the now-closable gap is not
    lost. Note also that morale is a monster-facing rule and the spells are character-facing, so whether
    one identity properly serves both is a judgement for the Reviewer of those successors, not something
    this packet settles.'
- id: OBS-02
  subject: Dying is proposed as distinct from Death
  detail: 'The source treats these as different states and the graph should too. A character at zero hit
    points is unconscious and dying: the state is timed, escapable by healing or stabilization, and reversible
    by rising above zero. Death is the terminal outcome when the timer expires, and the source adds that
    a dead character is retired from the game.

    rule_death was already canonical from printed page 9, where it receives a trigger from hit points
    and a timer from Constitution and rounds. Those page 9 rows are not restated. What this packet adds
    is the intermediate state, so the graph can distinguish a character who can still be saved from one
    who cannot. The retirement sentence is a table-procedure statement with no mechanical target and is
    not asserted.'
- id: OBS-03
  subject: magnitudes are excluded from every row
  detail: 'This packet is dense with numbers and none reaches a field: the morale and stabilize DCs, the
    death timer dice and its minimum, the natural roll that triggers a critical hit, the roll that revives
    a dying character, the hit point value it revives at, the halved ranks and halved hit points that
    trigger morale, the halved movement through hampering terrain, and the half-body concealment threshold
    for interposing terrain. Every one stays in the immutable packet. Verified programmatically: zero
    rows carry a digit in aspect or condition, and no condition spells a quantity in words.'
- id: OBS-04
  subject: the five named actions are extracted unevenly, by design
  detail: 'Melee Attack, Ranged Attack, Improvise and Multitask are proposed because each states a distinct
    mechanical relation: a governing stat and a resolution, or an explicit exclusion from the action cost.
    Cast A Spell is not proposed, because it names no mechanic of its own here and only points to printed
    page 44, where the relation is already canonical; that pointer is carried as a CROSS_REFERENCES row
    from rule_action instead. An action list is not by itself a reason to mint five identities.'
- id: OBS-05
  subject: terrain carries both a penalty and an absolute bar
  detail: 'Partial concealment worsens an attack or a spell, and total concealment prevents targeting
    altogether. These are different in kind, not degree, so they are separate rows against cbt_attack_roll:
    a MODIFIES with aspect obscured target and an EXCLUDES with aspect unseen target. Collapsing them
    into one row would lose the distinction between a harder shot and no shot.'
- id: OBS-06
  subject: the clockwise turn order and the GM's monster modifier are not asserted
  detail: 'COMBAT INITIATIVE states that turns proceed clockwise from the highest result and that the
    GM uses the highest Dexterity modifier among monsters. Both are table procedure rather than mechanical
    relation: the first describes seating, the second tells the GM which number to use in a roll already
    asserted from printed page 83. Neither is extracted, and the initiative relations themselves are not
    restated, per restatement_note.'
unresolved_identity_questions:
- id: IDQ-01
  subject: whether a critical hit is the canonical Critical Success
  detail: 'rule_critical_success is canonical from printed page 45, where the spell chapter defines it
    for a spellcasting check and gives it one effect, doubling a sustained spell. This packet''s DAMAGE
    section says a critical hit occurs on the highest natural roll of an attack roll or a spellcasting
    check, and doubles a weapon''s damage dice.

    I treated them as one identity and pointed the new rows at rule_critical_success, because the trigger
    is the same roll result and the source uses one concept with two consequences. The alternative reading
    is that Critical Hit is a distinct combat identity that happens to share a trigger. I did not mint
    a second node, because minting a near-duplicate of a canonical identity is the harder error to undo
    and because the existing row rule_spellcasting_check TRIGGERS rule_critical_success already covers
    half of what this page states.

    Consequence if wrong: two rows repoint to a new cbt_critical_hit identity and the page 45 rows are
    untouched. Flagged because it is an identity-merge decision and those are not mine to make silently.'
  update_at_revision_2: 'New evidence, recorded rather than acted on. rule_natural_twenty is canonical
    and already MODIFIES cbt_attack_roll, so the graph holds a natural-twenty identity distinct from rule_critical_success,
    and M045 now uses it. That bears directly on the question: this packet''s critical-hit sentence names
    the same roll result that rule_natural_twenty represents, so a third reading is available in which
    the trigger belongs to rule_natural_twenty and rule_critical_success is only the consequence.

    I have not changed the two approved rows, because the Reviewer confirmed all 43 as source-supported
    and a successor is not the place to reopen approved rows on my own initiative. If the identity question
    is settled toward separation, the repointing should be done deliberately and with this evidence in
    view.'
carried_forward_findings:
- id: CF-01
  subject: an integrated row is missing because of a false claim I made
  detail: 'Found while surveying the registry for this packet, and reported rather than left. rule_invisibility
    is canonical, introduced by INT-20260922-003 and carrying abil_stealthy GATES rule_invisibility from
    printed page 17. OBS-08 of GUR-PKT-SD-062-065 stated that no canonical invisibility identity existed
    and asserted only spell_invisibility EXCLUDES rule_vision on that basis. The claim was false when
    written: the identity had been canonical for four days.

    The consequence is live. Production holds a halfling benefit gating rule_invisibility and, separately,
    a spell named Invisibility with no connection to it, so a query from either reaches neither. The spell
    almost certainly owes a row to rule_invisibility.

    I am not fixing it here. Those rows belong to PKT-SD-062-065, are integrated, and amending another
    packet''s canonical output from inside a bundle scoped to this one would put an unreviewed change
    into it. It needs a successor GUR for that packet, and the exact shape of the row is a judgement for
    its Reviewer. Recorded so the defect is tracked rather than rediscovered.

    This is the third claim of this class I have made from impression rather than measurement, after the
    penance superlative in PKT-SD-068-070 and an earlier miscounted probe. My preflight now scans narrative
    text for claimed absences and superlatives and warns when the named term is in fact canonical; it
    reproduces both known errors.'
architectural_escalations: []
architectural_escalation_note: None raised. Every identity uses an approved prefix, every row uses a legal
  edge type, and no CLASSIFIED_AS row appears, correctly, since this packet contains no spells and no
  items. The one OVERRIDES row carries a section 7 basis. DBQ-01 records a domain boundary rather than
  resolving it, IDQ-01 records an identity-merge question for the Reviewer, and CF-01 reports a defect
  in another packet's integrated output for separate repair.
completeness_statement: This revision is scoped to the two corrections REV-GUP-PKT-SD-087-089-stealth-surprise-and-combat-r01-r01
  requires. It carries revision 1's 43 rows and 12 nodes forward unchanged and adds two rows, cbt_attack_roll
  EXCLUDES rule_hiding_and_sneaking on printed page 87 and rule_natural_twenty MODIFIES rule_hit_points
  on printed page 89, for 45 rows and 12 nodes in total. Both new rows were checked against the canonical
  edge set for an assertion-key collision and for the weaker case of a shared source, type and target
  under a different aspect; there are none of either. rule_natural_twenty is reused from the registry,
  not proposed, and its existing row was read before writing M045. Neither condition carries a digit or
  spells a quantity. Revision 1's observations, its domain boundary question DBQ-01 and its carried-forward
  finding CF-01 all stand as written; IDQ-01 gains an update recorded above. Nothing else in the packet
  was re-read or re-extracted, because the Review found nothing else wanting.
revision_reason: 'Revision 1 was independently reviewed as source-supported in all 43 rows and all 12
  node registrations, with no row or node requiring alteration. Approval was withheld for two missing
  relationships and this revision adds exactly those two rows and nothing else.

  Both are outcomes the source states and revision 1 did not carry, which is the third consecutive packet
  where that is the withheld finding. The pattern is consistent enough to name: I extract what a rule
  is and what resolves it more reliably than what it produces and what ends it. Here the graph had stealth
  enabling an attack but not the attack ending the stealth, and a dying character with a timer and two
  aided escapes but not the unaided one.'
preservation_statement: Every one of revision 1's 43 candidate edges is carried forward unchanged, in
  order, with its original ref, and every one of its 12 candidate nodes is carried forward unchanged.
  The new rows take the next refs, M044 and M045. This revision was built by loading the published revision
  1 from disk and appending, not by regenerating the packet, and the build asserts that. The Review's
  preserve lists were checked against the result.
polarity_fields_note: 'The two rows are treated differently on purpose, and the Review specifies each
  correctly.

  M044 is an EXCLUDES row, where constitution section 5 derives the polarity and the Analyst is prohibited
  from assigning it, so polarity and polarity_basis are omitted and Builder derives negates. M045 is a
  MODIFIES row, where section 5 makes the polarity mine to author and invariant 15 requires it, so it
  carries improves with basis read exactly as specified. Same rule, opposite handling, because the edge
  type differs.

  Noting with thanks that the Review states the omission convention explicitly for the derived case rather
  than restating the literal field values as earlier Reviews did. That removes the disclosure I have had
  to attach to the last three successors.'
natural_twenty_note: 'rule_natural_twenty is canonical with label Natural 20 and already carries rule_natural_twenty
  MODIFIES cbt_attack_roll, alongside a sibling rule_natural_one. Both were verified in the registry and
  the edge set before this row was written rather than taken from the Review on trust. M045 targets rule_hit_points,
  so it does not collide with the existing row.

  I had not found these two identities when surveying for revision 1, because I searched the registry
  for critical, advantage and death and not for natural. That is the same failure mode as CF-01 in revision
  1, at smaller cost: there the unfound identity produced a false claim in prose, here it produced a missing
  row the Reviewer caught. The lesson is that a keyword survey is only as good as the words chosen, and
  the surer check is to read the registry slice around every concept a page names.'
