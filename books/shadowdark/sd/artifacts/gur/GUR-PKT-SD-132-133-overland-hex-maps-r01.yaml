units_note: 'Figures name their unit. Measured by the assembling script from the claimed source: 6 named
  tables and 48 data rows across them.'
page_attribution_basis: 'Both markers sit on headings. p132 ends the OVERLAND HEX MAPS heading and p133
  ends the HEX POINTS OF INTEREST TABLE heading, and placement rule 1 applies each to its whole heading
  with the persistence rule carrying it forward. Verified against the claimed source that no marker appears
  inside a table row.

  So the four procedure paragraphs and the new hex, danger level, terrain and cataclysm tables are printed
  page 132, and the points of interest and settlement name tables are printed page 133. Each row is cited
  to the page of the table it concerns, so six rows cite 132 and two cite 133.'
scope_boundary: 'The bounded scope is the Primary Source Material section, printed pages 132 and 133:
  four paragraphs of procedure and 6 named tables. The trailing Supporting Source Context is out of scope.'
source_summary: A hex map generator. Roll or choose a starting terrain from the terrain table, then roll
  on the new hex table each time the characters enter an empty hex; that table gives the new terrain relative
  to the current one, a step down, the same, a step up, or an entirely new roll. The terrain table is
  read as a circular loop, so stepping past either end wraps around, and the source works that through
  with an example. Each hex also gets a die roll for whether it holds a point of interest. Separate tables
  give the hex's danger level, the cataclysm type when the terrain result calls for one, the point of
  interest as a location and a development, and settlement names in three columns by size.
graph_state_at_extraction: 'Read from the repository at extraction, not recalled, and every figure here
  is computed by the assembling script from the canonical files and the claimed source.

  The canonical graph holds 361 registry rows and 730 edges, and 0 rows cite printed pages 132 or 133,
  so nothing in this span has been extracted before. No hex map, terrain-step, cataclysm, point-of-interest
  or settlement identity exists. The registry holds 77 tbl_ identities.

  Two existing identities were read in full first. rule_danger_level carries 4 rows, of which 1 is a RESOLVED_BY,
  the one this intake added from printed page 130 a packet ago. rule_hex carries 2 rows, both from printed
  page 90, feeding overland travel as the distance unit and gating the navigation check.'
two_tier_structure_note: 'The rows follow the same two-tier shape settled on printed pages 130 and 131
  one packet ago, because the page has the same structure: a procedure that rolls some tables directly
  and reaches others through a result.

  Four tables are rolled directly by the procedure and take RESOLVED_BY rows from rule_overland_hex_maps:
  terrain, new hex, danger level and points of interest. Two are reached only through a result and take
  FEEDS_INTO rows from the table that reaches them. The cataclysm table is reached when the terrain result
  is a prior hex plus cataclysm, so tbl_hex_terrain feeds it. The settlement name table''s three columns
  are indexed by settlement size, and the sizes are results of the points of interest table, so that table
  feeds it.

  The settlement indexing satisfies the test set in PKT-SD-128-129: an indexing row is assertable only
  where the table is independently reached by a mechanical identity, and here the chain runs rule_overland_hex_maps
  to points of interest to settlement name, so the table is reached. It is reached from a table rather
  than directly, which is the same position the eight map contents tables occupy.'
cross_chapter_link_note: 'M008 is the row worth checking, because it is the only one that reaches outside
  this page. rule_hex FEEDS_INTO rule_overland_hex_maps with aspect mapped unit.

  rule_hex was proposed from printed page 90, where overland travel counts movement in hexes and the navigation
  check fires on leaving one. It carries 2 canonical rows, both from that page. This page never explains
  what a hex is; it assumes it and generates terrain for them, which is exactly the relationship the row
  asserts, that the hex is the unit this map is built from.

  Without it the generator would sit unconnected to the travel rules that consume its output, which would
  be a false picture: a reader asking what an overland hex map is made of would find six tables and no
  link to the hex the characters actually cross. The direction is input to process, the hex supplying
  the unit the procedure populates, which matches how rule_hex already feeds overland travel as the distance
  unit.'
