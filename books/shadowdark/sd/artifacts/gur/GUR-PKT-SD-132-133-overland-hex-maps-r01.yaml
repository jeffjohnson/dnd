rejected_candidates:
- text_locus: the circular loop rule and its worked example, p132
  quoted_gist: treat steps on the terrain table as a circular loop, with an example showing that stepping
    up from the last entry wraps to the first
  why_considered: It is the most precise mechanical statement on the page, unhedged, and the source spends
    a whole paragraph working it through, which usually marks something load-bearing.
  rejection_reason: 'Its content is entirely about arithmetic on table positions: which row a step of
    plus or minus one lands on, and what happens at the ends. Row positions are magnitudes and no field
    may store them, and there is no identity for a table row or a step for the rule to relate. What survives
    is that the new hex table resolves the next terrain, M002, and that the terrain table is what the
    procedure starts from, M001. Recorded as OBS-01.'
- text_locus: the point of interest die roll, p132
  quoted_gist: for each hex roll a die, and on the lowest result the hex has one point of interest
  why_considered: It is the trigger for the points of interest table, so a row carrying the trigger rather
    than just the resolution looked available.
  rejection_reason: The trigger's whole content is a die face, which is a magnitude. Stripped of it the
    statement reduces to the fact that the procedure may produce a point of interest, which M004 already
    carries as the procedure being resolved by that table. A separate trigger row would need an identity
    for the roll and would assert nothing the resolution row does not.
- text_locus: the Safe result on the HEX DANGER LEVEL TABLE, p132
  quoted_gist: the table's four results are Safe, with an instruction to reroll if the terrain is a cataclysm,
    then Unsafe, Risky and Deadly
  why_considered: Three of the four are the values rule_danger_level has carried since printed page 86,
    and the fourth is not. A row distinguishing this table's wider range looked worth considering, as
    did proposing Safe as an identity.
  rejection_reason: The four values are not identities and were twice declined as such, on printed pages
    86 and 90, precisely so the aggregate could carry relations instead. Proposing Safe alone now would
    be inconsistent and would leave the other three unproposed. The reroll instruction is conditional
    table-reading guidance whose content is which result to discard. M005 carries what is expressible,
    that this table resolves the danger level. The discrepancy itself is real and is recorded as OBS-02.
- text_locus: the points of interest and settlement name results, p133
  quoted_gist: twenty locations paired with twenty developments, and twenty-four settlement names in three
    columns
  why_considered: Several developments name things the graph holds or nearly does, including a sleeping
    dragon, a religious cult, a circle of wizards, a great treasure and a door to another plane. Village,
    Town, City and Metropolis are also a graded series, which is the shape that sometimes marks identities.
  rejection_reason: 'All are flavour for a GM populating a map, and none states a check, a value, a duration
    or a consequence. The settlement sizes are a series but carry nothing beyond their own ordering, which
    is the reasoning that declined the age, wealth and renown bands over the last four packets. The names
    are names, which PKT-SD-128-129 established are not mechanics at any scale. The treasure development
    is the closest call and still fails: hiding a great treasure describes a location, not a relation
    to rule_treasure.'
non_edge_observations:
- id: OBS-01
  subject: the circular loop is the page's best mechanic and is unexpressible
  detail: 'The terrain table is read as a loop, so a step up from the last entry wraps to the first, and
    the source works a full example through to make it unambiguous. It is precise, unhedged and genuinely
    mechanical, and none of it reaches the graph, because its entire content is arithmetic on table row
    positions.

    This is the second consecutive packet whose most distinctive mechanic is invisible for the same kind
    of reason. On printed page 130 it was scattering dice on paper and reading their positions; here it
    is stepping around a table. Both are procedures performed on the artefact rather than relations between
    game concepts, and the vocabulary holds relations. Worth recording as a pair, because together they
    show the boundary is about what a mechanic acts on rather than how precise it is.'
- id: OBS-02
  subject: this danger level table carries a value the canonical rule does not
  detail: 'rule_danger_level has carried three values since printed page 86, Unsafe, Risky and Deadly,
    and both the resting rule and the two encounter cadence rows are built on that set. This page''s table
    gives four: Safe, with a reroll instruction if the terrain is a cataclysm, and then the other three.
    The site danger table on printed page 130, integrated a packet ago, gives only the canonical three.

    The graph cannot show the discrepancy, because the values are not identities; M005 says only that
    this table resolves the danger level, exactly as M005 of the previous packet did for the site table.
    So a reader will see two tables resolving one rule and will not see that one of them can produce a
    band the rule''s own consumers never mention. Recorded because it is a real source variance rather
    than an extraction choice, and because it is the kind of thing a future Decision on danger level values
    would want.'
- id: OBS-03
  subject: the generator connects to the travel rules through one row
  detail: 'M008 is the only row on this page that reaches outside it, joining the generator to rule_hex
    from printed page 90. That single row is what makes the page part of the exploration machinery rather
    than a self-contained appendix: the hexes this procedure fills with terrain are the same hexes overland
    travel counts and navigation fires on.

    Recorded because the link is easy to miss and because its absence would have been a false picture
    rather than merely a thin one. The two pages are forty-two printed pages apart and neither cross-references
    the other by number, so nothing but the shared identity connects them.'
unresolved_identity_questions: []
unresolved_identity_questions_note: 'None. The structural choices here follow dispositions already settled:
  the two-tier shape from PKT-SD-130-131, the indexing test from PKT-SD-128-129, the core status from
  PKT-SD-124-125, and the refusal to propose danger level values from PKT-SD-086-086 and PKT-SD-090-090.
  The one judgement that is mine alone, the rule_hex link, is argued in cross_chapter_link_note and rests
  on an identity whose own defining locus states the same relationship in the other direction.'
architectural_escalations: []
architectural_escalation_note: None raised. All 7 identities use an approved prefix, every row uses a
  legal edge type at status core, no row carries supersession_basis and none is an OVERRIDES, and no CLASSIFIED_AS
  row appears. OBS-02 records a source variance a future Decision might want but asks for nothing.
completeness_statement: 'Both printed pages in scope were read in full at the recorded checksum: four
  procedure paragraphs, 6 named tables and 48 data rows. The packet yields 7 new identities and 8 rows,
  reusing 2 canonical identities whose labels the assembling script asserted equal to the registry. No
  proposed identity is left carrying no edge.

  The rows follow the two-tier shape settled on printed pages 130 and 131: four tables are rolled directly
  and take RESOLVED_BY rows from the procedure, and two are reached through a result and take FEEDS_INTO
  rows from the table that reaches them. One row, M008, reaches outside the page to rule_hex and is argued
  in cross_chapter_link_note. Every row was checked against the 730 canonical edges for an assertion-key
  collision, for a shared source, type and target under a different aspect, and for duplicates within
  the patch; there are none of any, and no canonical row cited either page before.

  Four candidates were rejected and each is recorded with its reason. The largest deliberate loss is the
  circular loop rule, recorded as OBS-01, and OBS-02 records that this page''s danger level table can
  produce a band the canonical rule''s consumers never mention. No assertion depends on any other ruleset.'
