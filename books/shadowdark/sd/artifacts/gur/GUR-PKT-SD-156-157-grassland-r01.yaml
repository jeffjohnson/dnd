completeness_statement: 'Both printed pages in scope were read in full at the recorded checksum: 1 named
  table, 50 data rows, 0 sentences of prose. The packet yields 1 new identity and 3 rows, reusing 3 canonical
  identities whose labels the building script asserted equal to the registry. The proposed table carries
  edges, so nothing is left unattached.

  Every row was checked against the 794 canonical edges for an assertion-key collision, for a shared source,
  type and target under a different aspect, and for duplicates within the patch; there are none of any,
  and no canonical row cited either page before. The script locates the supporting cell for each row and
  asserts its page, which matters because the page break falls inside the table.

  6 candidates were rejected and each is recorded with its reason. The largest deliberate loss is the
  creature and scene content, which belongs to the unextracted monster chapter or states no mechanic at
  all. 5 of the 9 apparent registry references in the cells are spurious collisions with ordinary English,
  measured rather than filtered by eye. No assertion depends on any other ruleset.'
wording_variation_note: 'M002 rests on a cell reading a rival crawling party, at row index 36 of 50. That
  is a third distinct wording for this reach and the first that neither scan recovers.

  The canonical label is Rival Crawlers. The whole-label scan requires both words and finds nothing here,
  because the cell says crawling rather than crawlers; the stem scan reduces crawling to crawl and crawlers
  to crawler, which still do not match. The reach was found by reading and confirmed by searching the
  stem rival, which returns exactly this one cell.

  It qualifies on substance. The defining prose on printed page 126 reads that a rival party of Shadowdark
  crawlers has a stated number of members, so this cell names that thing with the inflection moved, and
  both distinguishing elements are present. The contrast is the castle district cell on printed page 147,
  which said crawlers with no rival and was correctly declined; crawler alone is the book''s generic word
  for an adventurer.'
