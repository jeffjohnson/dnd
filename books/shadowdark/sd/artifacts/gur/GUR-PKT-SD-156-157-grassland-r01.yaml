rejected_candidates:
- text_locus: the creature results across the table, pp156 and 157
  quoted_gist: a roc, smilodons, mammoths, a wizard, giant dung beetles, an air elemental, griffons, kobolds,
    an earth elemental, wyverns, velociraptors, hill giants, gnolls, a rhino, a giant snake, an orc, berserkers,
    bandits, lions, a druid, pegasi, a basilisk, a chimera, ankhegs, a bulette, a T-Rex, a stone golem,
    a shadow, a cave brute and the Wandering Merchant
  why_considered: One is individually named with statistics, a bandit chieftain given as double level
    and damage, which is the closest thing to a stat block any encounter cell in this chapter has carried.
  rejection_reason: A creature's defining locus is its stat block in the unextracted monster chapter and
    the registry holds no monster_ identity. The chieftain's parenthetical is a modifier on an unextracted
    creature rather than a rule, and both of its terms are magnitudes. Eighth packet running for the same
    disposition.
- text_locus: the wedges and precarious boulders, p156
  quoted_gist: wedges on strings hold precarious boulders in place
  why_considered: This is the closest call on the page and the first real test of whether I have over-corrected
    after the desert overturn. Wedges, strings and precariously held boulders are the construction of
    a deadfall, and the settled test is that a stated mechanism earns the reach to rule_traps even where
    the word trap is absent, which is how the desert bone-barbed nets and the forest catgut wire both
    qualified.
  rejection_reason: The two cells that qualified state an operation. The nets snap up from beneath the
    sand; the wire triggers a hidden falling net. This cell states only that the wedges hold the boulders
    in place, which is the device at rest. Nothing is concealed, nothing is triggered, nobody sets it
    off, and the sentence's only verb is hold. A reader can infer that boulders held precariously will
    fall, but inference is what the settled test excludes; it asks what the cell says happens. Recorded
    as OBS-02 because declining immediately after being overturned for strictness deserves to be visible
    rather than quietly made.
- text_locus: the weather and terrain results, pp156 and 157
  quoted_gist: dark clouds rolling in with a violent thunderstorm imminent, smoke on the wind from a growing
    wildfire, a fossilized tree teetering on an eroding mud pillar
  why_considered: The arctic table earned the chapter's only TRIGGERS row to rule_damage from two weather
    cells.
  rejection_reason: Those arctic cells state a die of damage per round to the unsheltered. A storm that
    is imminent and a wildfire that rages nearby state neither harm nor a check, and the teetering tree
    states only that it teeters. This is the third terrain page in a row whose weather is inert, after
    desert and forest, which continues to show that the arctic row came from the source.
- text_locus: the hypnotic flutes and other status effects, p157
  quoted_gist: cursed wind flutes on poles hypnotize with their sound
  why_considered: Hypnosis is an effect on a participant rather than a scene, and the flutes are described
    as cursed, which is a mechanical word elsewhere in this book.
  rejection_reason: There is no status identity and the condition vocabulary has no term for one, and
    the cell states no check, no duration and no consequence. Sixth locus to lose rows to the same missing
    vocabulary.
- text_locus: the two-encounter instruction, p157
  quoted_gist: one result instructs the reader to roll twice more and combine the results, rerolling that
    result if it comes up again
  why_considered: It is the only instruction on the page, and the stem scan flags it as matching rule_encounter.
  rejection_reason: The match is on the plain word encounters in the instruction's own text; M001 already
    carries the table's relation to rule_encounter. The rest is arithmetic on the table's own roll. Declined
    in the same form in each of the seven preceding chapter packets.
- text_locus: the appended random encounter procedure and monster attributes, out of scope
  quoted_gist: the printed page 112 and 113 encounter procedure and the printed page 189 monster attributes
    page
  why_considered: Both are in the file and the first is the rule this table resolves.
  rejection_reason: Both are Supporting Source Context, outside the bounded scope. PKT-SD-112-113 is already
    integrated, so extracting from it would duplicate canonical rows and cite pages outside this packet's
    range.
non_edge_observations:
- id: OBS-01
  subject: a third wording for the rival crawler reach
  detail: 'The six canonical rows into rule_rival_crawlers come from cells saying rival crawlers, plural
    and exact. This cell says a rival crawling party, which is neither the registry label nor a form the
    stem scan recovers, and the scan did not flag it.

    It still earns the row, and under the settled test rather than in spite of it. The defining prose
    on printed page 126 reads that a rival party of Shadowdark crawlers has a stated number of members,
    so a rival crawling party is that thing described in the book''s own words with the inflection moved.
    Both distinguishing elements are present, rival and crawler, which is exactly what the castle district
    cell lacked when it said only crawlers.

    Recorded because the three wordings now seen, rival crawlers, a rival crawler and a rival crawling
    party, mean the scan has missed this reach twice in eight packets. The scan finds label matches; the
    reading finds the reach. I now search the stem rival separately in every packet of this chapter for
    that reason.'
- id: OBS-02
  subject: declining the boulders one packet after being overturned for strictness
  detail: 'The Reviewer overturned my desert decline because a concealed device that snaps upward is a
    trap mechanism whether or not the word trap appears. This page has wedges on strings holding precarious
    boulders in place, and I have declined it. Doing that immediately after an overturn deserves to be
    visible rather than quietly made.

    The reason is that the settled test asks what the cell states, and the two cells that qualified state
    an operation: the nets snap up, the wire triggers a net. This one states that the wedges hold the
    boulders in place, which is the device at rest, with no concealment, no trigger and nobody setting
    it off. To assert it I would have to supply the operation myself, which is the inference the settled
    test excludes.

    I am conscious that the opposite failure is available here, over-correcting into looseness after being
    told I was strict, and that is the reason to state the ground plainly. If the Reviewer holds that
    a rigged deadfall is a mechanism at rest and still a mechanism, the row is a one-line addition and
    I would rather be told.'
- id: OBS-03
  subject: the word damage appears on this page and earns nothing
  detail: 'One cell describes a bandit chieftain as double level and damage. rule_damage is canonical
    and the registry scan flagged it, and it is the only time the word has appeared in this chapter outside
    the arctic weather cells that earned the chapter''s single TRIGGERS row.

    It earns nothing, because the parenthetical is a modifier on the creature''s own statistics rather
    than harm the table inflicts, and both of its terms are magnitudes. Recorded as the cleanest demonstration
    available that the measurement is a discovery aid and not a decision procedure: on the arctic page
    the word accompanied a stated die per round and earned a row, and here the same word accompanies a
    stat block and earns none.'
