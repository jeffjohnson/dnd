authored_polarity_declaration: No authored polarity appears. The three rows are FEEDS_INTO, OVERRIDES
  and GATES, none of which is among the three types constitution section 5 reserves for authored polarity,
  so assigning one is prohibited to the Analyst and invariant 15 has nothing to require. Builder derives
  neutral, neutral and enables respectively.
supersession_note: 'One OVERRIDES row, rule_the_gauntlet over rule_dying, with supersession_basis optional_variant
  as constitution section 7 requires and invariant 20 checks. optional_variant rather than explicit_replacement
  because The Gauntlet is a process a GM may elect, not a rule the book replaces, which is the same reasoning
  applied to rule_fatality_mode over the same target in PKT-SD-111-111 and to rule_stat_reroll on printed
  page 15.

  The aspect immediate death deliberately matches the Fatality Mode row rather than being varied to look
  distinct. The two rules do the same thing to the same target and a reader should see that; the keys
  stay distinct because the sources differ, which was verified rather than assumed. Shadowdark now has
  two separate optional ways to remove the dying state, and matching aspects make that visible in one
  query.'
