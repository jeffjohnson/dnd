completeness_statement: 'The whole of printed page 116 and its four subsections was read at the recorded
  checksum. The packet yields 1 new identity and 3 rows, all citing page 116 and all at status optional,
  reusing 3 canonical identities whose labels the assembling script asserted equal to the registry. Every
  row was checked against the 692 canonical edges for an assertion-key collision, for a shared source,
  type and target under a different aspect, and for duplicates within the patch; there are none of any,
  and no canonical row cited this page before.

  Five candidates were rejected and each is recorded with its reason. The low yield is explained in OBS-03
  and is a property of the page rather than of the reading: its rules are largely counts, and counts do
  not reach fields. Every figure in this GUR was computed from the canonical files rather than counted
  by hand. No assertion depends on any other ruleset.'
