rejected_candidates:
- text_locus: the random generation pointer, p116
  quoted_gist: '''The Gauntlet works best when the players use the random generation process (see pg.
    40) to create four 0-level characters each.'''
  why_considered: It is an explicit page pointer, and four such pointers have been carried as CROSS_REFERENCES
    rows earlier in this intake, to Time Passes twice, to multitasking and to overland travel. The shape
    looked identical.
  rejection_reason: 'It differs in the one way that matters: there is no single identity to point at.
    Every earlier pointer named a specific rule that exists as one node. The random generation process
    is not one node; it is 10 canonical rows across printed pages 40 and 41, resolving ancestry, class,
    deity, alignment, two kinds of language, both spell lists and starting gear against nine separate
    tables. Choosing one of those tables to receive the pointer would misrepresent the reference, and
    tbl_random_character is a gear table rather than the process as a whole.

    The sentence is also hedged with works best when, so it recommends rather than requires. Recorded
    as OBS-02.'
- text_locus: the graduation sentence, p116
  quoted_gist: '''Each player''s active surviving character graduates to 1st level, gains a class, and
    becomes their character for future adventures.'''
  why_considered: Three consequences in one sentence, and the one-row-per-statement lesson from PKT-SD-111-111
    suggests three rows. sys_class is canonical and gaining a class looks like a clean GATES row.
  rejection_reason: 'Partially rejected, and the reason is restatement rather than conflation. The graduation
    to 1st level is asserted as M003. Gaining a class is not, because exp_level_one GATES sys_class with
    aspect class selection is already canonical from printed page 14: once the survivor is 1st level the
    class follows from the existing row, and asserting rule_the_gauntlet GATES sys_class would put a second
    path to the same consequence into the graph. Becoming their character for future adventures is narrative
    continuity with no mechanic.

    This is the distinction between two facts and one fact with a downstream consequence. Recorded so
    the single row does not read as a missed pair.'
- text_locus: HOW TO RUN IT, p116
  quoted_gist: the Gauntlet usually takes place in a dungeon stocked with brutal traps, large groups of
    monsters and evil plots; the monsters and traps are not undefeatable but many are likely to cause
    casualties; include enticing rewards
  why_considered: rule_traps became canonical two packets ago and is named here directly, so a row from
    The Gauntlet to traps looked available under the incidental-locus test.
  rejection_reason: 'It is advice about staging, hedged with usually, and it states no mechanic. Traps
    appear as an example of what to stock a dungeon with, not as a rule about how The Gauntlet works;
    asserting rule_the_gauntlet CONSTRAINS rule_traps or similar would claim a relation the page does
    not make. This is the same treatment given to the Caltrops cell in PKT-SD-115-115: the source must
    state a relationship, not merely mention two things that have identities.'
- text_locus: the replacement and TOTAL LOSS rules, p116
  quoted_gist: players play one 0-level character at a time and replace the dead from their backup pool
    with a fitting explanation; a player who loses every character may create a rolled number more
  why_considered: These are definite procedural rules rather than advice, unlike most of the page's second
    half, and TOTAL LOSS has its own heading.
  rejection_reason: Both are entirely about quantities of characters, and the quantities are magnitudes
    no field may store. Stripped of the numbers, replacing a dead character from a pool and creating more
    when the pool empties both reduce to the relation already asserted as M001, that 0-level characters
    feed the process. There is no identity for a backup pool and minting one would add a node whose whole
    content is a count.
- text_locus: the build-tuning rationale and the DEADLY! framing, p116
  quoted_gist: random generation prevents build tuning and over-investing in a single character; The Gauntlet
    is much deadlier than a typical adventure and most characters will not survive
  why_considered: Completeness. The word prevents is unhedged and looked like an EXCLUDES candidate.
  rejection_reason: Build tuning and over-investment are player behaviours, not mechanics, and have no
    identity; the sentence explains why the process is designed as it is. Much deadlier and most characters
    will not survive are characterisations of the experience, and the one mechanical fact behind them,
    instant death at zero hit points, is asserted as M002.
non_edge_observations:
- id: OBS-01
  subject: the second optional override of the dying state
  detail: 'rule_dying now receives two OVERRIDES rows, both optional, both with aspect immediate death:
    rule_fatality_mode from printed page 111 and rule_the_gauntlet from this page. Before this packet
    it carried 8 rows of which 1 was an override.

    Recorded because the pair says something the individual rows do not. Shadowdark offers two distinct
    elective ways to remove the death timer, one a table-wide mode and one a campaign-opening process,
    and a reader querying what can remove the dying state should find both together. Matching the aspect
    rather than varying it is what makes that query work.'
- id: OBS-02
  subject: a page pointer with no single identity to point at
  detail: 'The page points to the random generation process on printed page 40, and this is the first
    pointer in the intake that cannot be carried. The four carried so far each named one rule that exists
    as one node. This one names a process spread across 10 canonical rows and nine tables, with no node
    standing for the process itself.

    Worth flagging as a shape rather than a one-off, because the Game Master chapter makes several more
    pointers to chapters rather than to rules: Adventures on printed page 122, NPCs on 124, Rival Crawlers
    on 126 and treasure on 117. If those chapters produce a process spread over many rows rather than
    a single named rule, their pointers will be unassertable for the same reason, and that is a property
    of the vocabulary rather than a gap in the extraction.'
- id: OBS-03
  subject: the page is mostly quantities
  detail: 'Four numbers carry most of this page''s procedure: how many 0-level characters each player
    makes, how many survive, how many are played at a time, and how many more a wiped-out player may create.
    None reaches a field, and once they are removed the replacement and total-loss rules reduce to the
    single relation already asserted, that 0-level characters feed the process.

    This is why a page with four subsections yields three rows. It is not that the page is advice, as
    the Game Master chapter largely was; it is that the page''s rules are almost entirely about counts.'
