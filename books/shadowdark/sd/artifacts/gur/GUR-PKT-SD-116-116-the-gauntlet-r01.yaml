page_attribution_basis: 'One marker resolves this packet. p116 ends the first THE GAUNTLET heading and
  placement rule 1 applies it to that whole heading, with the persistence rule carrying it across every
  subsection. All three rows cite printed page 116.

  Note that the page repeats its own title: a second-level THE GAUNTLET heading carries the marker and
  a third-level THE GAUNTLET heading immediately follows it, unmarked. They are two headings, both page
  116, and the section field of the first row names the third-level one where the text actually sits.
  The same doubling appeared on printed pages 101 and 102 in PKT-SD-101-109, though there the two were
  on different pages.'
scope_boundary: The bounded scope is the Primary Source Material section, the single printed page 116.
  The trailing Supporting Source Context is out of scope.
source_summary: 'The Gauntlet is a process a GM can use to determine starting characters. It works best
  when players randomly generate several 0-level characters each, which the page says prevents build tuning.
  It is much deadlier than a typical adventure and most characters will not survive: a 0-level character
  who falls to zero hit points dies instantly rather than entering the dying state. Each player ends with
  one survivor, who graduates to 1st level, gains a class and becomes their character for future adventures.
  It is usually run in a dungeon stocked with brutal traps and large groups of monsters, players play
  one 0-level character at a time and replace the dead from their pool, and a player who loses every character
  may create a rolled number more.'
graph_state_at_extraction: 'Read from the repository at extraction, not recalled, and every figure in
  this GUR is computed from the canonical files by the assembling script rather than counted by eye. Two
  prose count slips have been caught downstream in this intake, on rule_encounter and on the traps neighbourhood,
  both from counting by hand, so the method has changed.

  The canonical graph holds 322 registry rows and 692 edges. No canonical row cites printed page 116,
  so nothing in this span has been extracted before and no Gauntlet identity existed. rule_dying carries
  8 rows, of which 1 is an OVERRIDES into it. exp_level_zero carries 4 rows and exp_level_one carries
  6. The random character generation the page points to accounts for 10 canonical rows across printed
  pages 40 and 41, all at status optional.

  Every proposed row was checked against the canonical edge set for an assertion-key collision, for a
  shared source, type and target under a different aspect, and for duplicates within the patch; there
  are none of any. Every reused label was asserted equal to the registry label by the script rather than
  checked by reading.'
optional_status_note: 'All three rows carry status optional. The page opens by saying Game Masters can
  use a process called The Gauntlet, which makes the whole process elective in the same way the modes
  of play on printed page 111 are, and those took status optional throughout.

  This matters most for the OVERRIDES row. Instant death at zero hit points for a 0-level character is
  true inside The Gauntlet and nowhere else; the ordinary dying rules from printed page 89 remain in force
  for a 0-level character in a normal adventure, and the CHARACTER DEATH advice on printed page 108 assumes
  exactly that when it says deaths happen especially among 0-level adventurers. A core row here would
  assert that 0-level characters never get a death timer, which is false.'
