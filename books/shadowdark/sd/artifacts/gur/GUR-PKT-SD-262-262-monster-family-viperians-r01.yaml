source_summary: >-
  The VIPERIANS family: introductory prose describing a fallen snake-people civilization and the
  roles of wizards and ophids, followed by three stat blocks: Viperian (snake-headed warrior, scimitar,
  javelin), Viperian Ophid (giant anaconda body with humanoid torso, falchion, longbow, Impervious),
  and Viperian Wizard (black-scaled sorcerer, dagger, creature INT spells Hiss, Summon Cobra, Venom,
  Whispers).

