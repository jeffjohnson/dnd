source_summary: >-
  Two procedures. MONSTER GENERATOR on printed page 190 tells the GM how to build a monster from
  the party's level: it defines PL as the average character level, sets the monster's armour
  class from it, and rolls a Combat result on a twenty-row table that supplies the attack bonus
  and the level, alongside a quality, a strength and a weakness. MAKE IT WEIRD on 191 adds up to
  three mutations from a twelve-row table and treats a mutated monster as higher level for
  treasure. The tables' cells are the generated creature's own qualities and abilities.

graph_state_at_extraction: >-
  Read from the repository at extraction, not recalled. The canonical graph holds 426 registry
  rows and 854 edges, and 0 rows cite printed page 190 or 191. The registry holds 124 tbl_
  identities, 98 rule_ identities and 1 mstat_ identity.
  The endpoints this packet reuses carry 12 rows on cbt_armor_class, 27 on cbt_attack_roll, 30
  on exp_level and 1 on mstat_monster_level, that last being the row integrated from the
  preceding packet. The script asserts that all three proposed ids are absent from the registry
  before using them.

mstat_boundary_observed: >-
  Constitution 2.5 is the governing boundary for this chapter and it cuts cleanly here, so the
  cut is stated rather than left implicit.
  This page is a procedure, not a stat block. Its prose states dependencies between shared
  mechanics: what a generated monster's armour class is computed from, what the generator table
  supplies, and what mutations do to the level used for treasure. Those are exactly the explicit
  dependencies section 2.5 preserves, and four of the five rows below are of that kind.
  The two tables' cells are the opposite. A quality, a strength and a weakness are the generated
  creature's own values and abilities, which section 2.5 excludes from graph content whether the
  creature is printed in a stat block or rolled up at the table. 120 of the 123 scannable units
  are such cells and none yields a row.
  mstat_monster_level is reused twice and no new mstat_ identity is proposed. In particular PL
  is not proposed as one; see pl_identity_note.

