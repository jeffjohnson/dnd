pl_identity_note: >-
  PL is the one place this page could have produced a second escalation, so the reasoning is set
  out in full.
  The source says PL is the average character level of the adventuring party, and then that the
  monster's armour class is PL plus a fixed amount. PL is therefore a defined term with a
  mechanical role, and it has no identity.
  It is not an mstat_. DEC-2026-0105 and constitution 2.5 bound that prefix to a shared creature
  statistic or rating, and PL describes the party rather than a creature; section 2.5 requires an
  Architect Decision for any use outside that boundary. Proposing mstat_party_level would have
  been precisely the widening the ruling anticipated and forbade.
  No escalation is needed because the source closes the gap itself. PL is not an independent
  quantity but a restatement of character level, defined in the same breath as it is used, so
  the dependency the page asserts is between the generated monster's armour class and the
  characters' level. M002 states exactly that, with DERIVED_FROM because the source says the
  armour class is computed from it, and with the fixed amount left out as the magnitude it is.
  The condition carries the subject qualitatively, for a generated monster, so the row cannot be
  read as a claim about every armour class in the game.
  What is lost is the word PL itself, which is a label rather than a mechanic, and constitution
  section 2 states that labels do not determine identity. What is kept is the dependency, which
  is what the graph is for: if character level changed, this procedure would need review.

completeness_statement: >-
  Both printed pages in the declared span were read in full at the recorded checksum, which the
  script asserts against the packet manifest before parsing: 4 headings, 6 prose paragraphs, 2
  named tables totalling 32 data rows, and 1 epigraph. Every block is dispositioned.
  The packet yields 3 new identities and 5 rows, reusing 4 canonical identities whose labels the
  script asserted equal to the registry, and all three proposed ids were asserted absent before
  use. Every proposed identity carries at least one edge, so nothing is left unattached.
  Every row was checked against the 854 canonical edges for an assertion-key collision, for a
  shared source, type and target under a different aspect, and for duplicates within the patch;
  there are none of any, and no canonical row cited either page before. The script asserts that
  every submitted row cites 190 or 191 and that neither table carries a page marker.
  9 candidates were rejected and each is recorded with its reason. The largest deliberate loss
  is the 120 table cells, which constitution 2.5 excludes as one generated creature's own values
  and abilities. No assertion depends on any other ruleset.

