rejected_candidates:
  - text_locus: 'the generator table cells, p190'
    quoted_gist: >-
      sixty cells across the Quality, Strength and Weakness columns, naming things like beastlike
      and draconic qualities, absorbing magic, a poison sting, a petrifying gaze, ranged attacks
      and turning invisible, and weaknesses to cold, fire, silver, iron, garlic and music
    why_considered: >-
      Several cells match a canonical identity on a scan: spell_light on a light weakness,
      lang_draconic on a draconic quality, abil_stealthy on a stealthy strength, lang_reptilian
      on a reptilian quality, cbt_ranged_attack on ranged attacks and rule_turn on turning
      invisible.
    rejection_reason: >-
      These are the generated creature's own qualities, strengths and weaknesses, which
      constitution 2.5 excludes from graph content: an individual value or ability never creates
      an identity, edge or property store. That the creature is rolled up rather than printed
      changes nothing. Every matched identity is also an unmarked ordinary-English collision
      rather than a reference: a draconic quality is not the Draconic language, a stealthy
      monster is not the halfling ability Stealthy, and a reptilian quality is not the Reptilian
      language. The damage figures are magnitudes.
  - text_locus: 'the mutations table cells, p191'
    quoted_gist: >-
      thirty-six cells naming mutations such as wings, tentacles, extra limbs, breathing fire,
      fast healing, speaking Common, knowing spells, teleporting in bursts, an antimagic field
      and being blessed by a god
    why_considered: >-
      lang_common matches speaking Common, spell_teleport matches teleporting, spell_heal
      matches fast healing and rule_damage matches three damage cells, so six cells carry a scan
      hit and two name a spell-shaped effect.
    rejection_reason: >-
      Same disposition as the generator cells, and for the same reason: these are abilities of
      one generated creature. Speaking Common states no check and no consequence, which is the
      reading that declined the mummies moaning in ancient Common at printed page 182. Teleport,
      antimagic and reflecting spells are unmarked, so the reference limb fails as it did for the
      augury at 181 and the teleporting lich at 182. The damage and AC figures are magnitudes.
  - text_locus: 'the monster generator damage and attack defaults, p190'
    quoted_gist: 'it deals a stated damage die and has a stated number of attacks'
    why_considered: >-
      rule_damage and cbt_attack_roll are canonical and the sentence names both, immediately
      after the sentence that does earn M003.
    rejection_reason: >-
      Both figures are magnitudes and the sentence states nothing else about them. It gives the
      generated creature's default values rather than a dependency: no rule changes if the die
      changes. M003 exists because the preceding clause states that the Combat result is the
      attack bonus, which is a dependency between the table and the attack roll; this clause has
      no such structure.
  - text_locus: 'the mutation count and the flying spider example, p191'
    quoted_gist: >-
      roll up to three mutations per monster, and an example that a spider with wings can fly a
      near distance, and another that a monster with tentacles can restrain creatures
    why_considered: >-
      The count is the one number governing the procedure, and the examples name spell_fly and
      rule_distance on a scan.
    rejection_reason: >-
      Three is a magnitude. The examples are explicitly offered as examples, in the source's own
      words you might decide and you might determine, so they state what a GM may invent rather
      than what the rules provide. Flying a near distance matches spell_fly and rule_distance as
      ordinary English; no spell is cast and no distance rule is engaged.
  - text_locus: 'the presupposed link from monster level to treasure, p191'
    quoted_gist: >-
      treat a mutated monster as two levels higher than normal for rolling treasure
    why_considered: >-
      The clause takes for granted that a monster's level governs the treasure it yields, which
      would be a dependency from mstat_monster_level to rule_treasure. rule_treasure is canonical
      with 15 rows and exp_level already feeds it on expected value from printed page 117.
    rejection_reason: >-
      The sentence presupposes that link rather than stating it, and its defining locus is the
      treasure chapter, which is unclaimed. Asserting it from a parenthetical about mutations
      would put a load-bearing relationship in the graph on the weakest possible evidence, and
      the packet that does define it would then find it already present with the wrong citation.
      M005 records what this sentence does state, which is that mutations raise the level used
      for that roll.
  - text_locus: 'PL as its own identity, p190'
    quoted_gist: 'PL is the average character level of the adventuring party'
    why_considered: >-
      PL is a defined, bolded term that the whole generator turns on, and a reader may expect an
      identity for it. It was considered carefully because the preceding packet escalated an
      almost identical question about monster level.
    rejection_reason: >-
      PL is a party statistic, not a creature statistic, so constitution 2.5 does not cover it
      and minting an mstat_ identity for it would be the broader use that section reserves to an
      Architect Decision. No escalation is raised because none is needed: the source defines PL
      in terms of character level in the same sentence that uses it, so the dependency is
      expressible between two canonical identities and M002 expresses it. See pl_identity_note.
  - text_locus: 'the MAKE IT WEIRD framing, p191'
    quoted_gist: 'adventurers fear the unknown, so keep monsters unfamiliar by adding mutations'
    why_considered: 'Read for completeness, as every block on an in-scope page must be considered.'
    rejection_reason: >-
      Advice to the GM about why to use the procedure. It states no dependency and striking it
      would leave the mutations table and every mechanic it touches unchanged.
  - text_locus: 'the closing epigraph, p191'
    quoted_gist: 'a dwarf fighter describing a goblin with nine rows of teeth that flew like a bat'
    why_considered: >-
      The attribution names an ancestry and a class and the text names a goblin, so four
      canonical identities match on a scan.
    rejection_reason: >-
      An epigraph, and the same disposition as the epigraph at printed page 187. Constitution
      section 2 states that labels do not determine identity; a dwarf fighter in a byline is a
      person, and the goblin is a creature in an anecdote.
  - text_locus: 'the appended monster attributes page, out of scope'
    quoted_gist: 'the printed page 189 monster attributes page'
    why_considered: >-
      It is in the file, its subject is adjacent, and it was integrated one packet ago so its
      identities are fresh in the registry.
    rejection_reason: >-
      It is Supporting Source Context, outside the bounded scope, and
      PKT-SD-189-189-monster-attributes already carries its three rows. Extracting from it would
      duplicate canonical assertions and cite a page outside this packet's range.

non_edge_observations:
  - id: OBS-01
    subject: the boundary cuts this page in half, and both halves are the ruling working
    detail: >-
      123 scannable units, 3 of them prose sentences that earn rows and 120 of them table cells
      that earn nothing. That ratio is not a thin reading; it is constitution 2.5 applied to a
      page that contains both kinds of content at once.
      The prose states dependencies between shared mechanics: what the armour class is computed
      from, what the table supplies, what mutations do to the level used for treasure. The cells
      state one generated creature's qualities and abilities. DEC-2026-0105 preserves the first
      and excludes the second, and this is the first page where both appear side by side, which
      makes it a better test of the boundary than either the stat-block page before it or the
      encounter tables before that.
  - id: OBS-02
    subject: character level and monster level are both here, and they are not the same identity
    detail: >-
      The escalation one packet ago turned on refusing to alias monster LV onto exp_level, and
      DEC-2026-0105 created mstat_monster_level to keep them apart. This page uses both, which is
      the first time the distinction has had to hold in one artifact.
      M002 reaches exp_level because PL is defined as the average character level of the party:
      the party's level really does determine the generated monster's armour class. M004 reaches
      mstat_monster_level because the Combat result supplies the monster's own level. Had the two
      been merged, this page would assert that a monster's level determines its own armour class,
      which is not what the source says.
      Recorded because it is the first evidence that the ruling was worth the pause.
  - id: OBS-03
    subject: no page break falls inside a table, for the first time in twenty packets
    detail: >-
      Every packet of the encounters chapter and both monster packets before this one had either
      a mid-table page break or a single page. Here both markers sit on headings and the script
      asserts that neither table contains one, so page attribution is settled before any row is
      written rather than derived per row.
      Recorded because the mid-table break has been the standing citation hazard in this book and
      its absence is worth noting rather than assuming it will continue.
  - id: OBS-04
    subject: what the generator does not commit the monster chapter to
    detail: >-
      rule_monster_generator and its table describe how to build a creature that has no stat
      block. It would be easy to read that as licence to represent the attributes of creatures
      that do have one, since the generator sets exactly the fields a stat block prints.
      It is not. The generator's rows exist because the prose states dependencies between shared
      mechanics; a stat block states values. The roughly sixty stat-block packets ahead still
      yield creature identities and named abilities under constitution 2.5 and the
      post-implementation requirements of DEC-2026-0105, and nothing here widens that.

