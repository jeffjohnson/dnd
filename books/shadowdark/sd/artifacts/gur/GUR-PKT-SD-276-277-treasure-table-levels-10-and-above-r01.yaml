rejected_candidates:
  - text_locus: 'TREASURE TABLE 10+ monetary values, pp276–277'
    quoted_gist: '5 sp each, 3 gp, 5 gp, 50 gp, 12 gp each, 60 gp, 65 gp, 70 gp, 100 gp, 110 gp, 115 gp, 120 gp, 40 gp each, 130 gp, 140 gp, 220 gp, 230 gp, 240 gp, 250 gp, 260 gp, 280 gp, 360 gp, 720 gp, 840 gp, 900 gp, 1,200 gp'
    why_considered: 'Checked for item_coin monetary relationships or price valuations.'
    rejection_reason: >-
      Monetary values and prices are numeric magnitudes prohibited from edge aspect and condition
      by Invariant 11 and Constitution section 5. They do not generate edges.
  - text_locus: 'TREASURE TABLE 10+ mundane and fine gear items, pp276–277'
    quoted_gist: 'silver plates, chainmail, greatswords, ring, shield, dagger, plate mail, lute, greataxe, staff, robe'
    why_considered: 'Checked for table edges to canonical weapons, armor, and gear items.'
    rejection_reason: >-
      Mundane and fine equipment items listed as loot are roll outcomes rather than definitions or modifications
      of equipment rules. Equipment definitions have their defining loci on pages 33–37 (Basic Gear, Weapons, Armor).
      Random encounter, shop, and treasure tables do not link to mundane gear outcomes unless a specific
      mechanical modification is introduced.
  - text_locus: 'TREASURE TABLE 10+ art objects, curios, and deity mentions, pp276–277'
    quoted_gist: 'Soapstone statuette of Gede; Stained glass pane of St. Terragnis vs. a dragon; Armor of Saint Terragnis; Staff of Ord; Scroll of the Covenant'
    why_considered: 'Checked for deity_gede, deity_saint_terragnis, deity_ord, or special item proposals.'
    rejection_reason: >-
      The statuette and stained glass pane are trade curios and artwork sold for coin value. The named items
      (Armor of Saint Terragnis, Staff of Ord, Scroll of the Covenant) are legendary artifacts whose defining
      loci belong to the magic item chapters. Mentions of deities in names or artwork do not define or alter
      worship, spells, or rules for deity_gede, deity_saint_terragnis, or deity_ord. Minting identities from
      incidental descriptive curios is prohibited.
  - text_locus: 'TREASURE TABLE 10+ ancestry and language descriptors, pp276–277'
    quoted_gist: 'dwarvish honey mead; elvish chainmail; lost language'
    why_considered: 'Checked for edges to ancestry_dwarf, ancestry_elf, or sys_language.'
    rejection_reason: >-
      Aesthetic craftsmanship descriptors and subject matter. Constitution sections 2.3 and 2.4
      prohibit ancestry or language edges without mechanical rules.
  - text_locus: 'TREASURE TABLE 10+ legendary magic items, artifacts, and blessings, p277'
    quoted_gist: 'Potion of Healing; Potion of Extirpation; 4th-tier and 5th-tier spell scrolls; 5th-tier magic wand; giant diamond casting wish; Portable Hole; Demonskin blessings idol; Scroll of the Covenant with Divine Halo blessings; Brakʼs Cube of Perfection; Flying Carpet; +3 mithral magic armor; +3 magic weapon; Obsidian Witchknife; Armor of Saint Terragnis; Staff of Ord'
    why_considered: 'Checked for candidate magic item nodes (item_portable_hole, item_flying_carpet, etc.) or edges to item_magic_item, item_spell_scroll, item_wand.'
    rejection_reason: >-
      Specific magic items, artifacts, boons/blessings, and item generators have their defining loci
      in the magic item chapters (pages 276+, packets 124–130+). Individual table results on random treasure tables
      do not mint new item, artifact, or boon identities ahead of their defining loci, and Invariant 1 prohibits
      edges referencing non-existent nodes. Nor do loot tables feed into item categories; rather, item_magic_item
      and item_coin feed into rule_treasure as advancement inputs (page 117).
  - text_locus: 'TREASURE TABLE 10+ Potion of Healing healing value, p277'
    quoted_gist: 'Potion of Healing (heals 4d10 damage)'
    why_considered: 'Checked for edge from tbl_treasure_10_plus to rule_hit_points or rule_damage.'
    rejection_reason: >-
      The 4d10 damage expression is a die expression and numeric magnitude prohibited under Invariant 11.
      Furthermore, the healing mechanic belongs to the potion item definition in packet 128 (Potions),
      not to this loot table roll entry.
  - text_locus: 'Context: Treasure overview passages, p269'
    quoted_gist: 'The treasure table the monster uses corresponds to its level... The GM can randomly generate unguarded treasure by rolling on the treasure table that matches the discovering characterʼs level.'
    why_considered: 'Checked for exp_level or mstat_monster_level feeding into tbl_treasure_10_plus.'
    rejection_reason: >-
      Supporting source context from packet 119 is out of scope per Scope Boundary; no row here may cite page 269.
      Both exp_level and mstat_monster_level feeding into rule_treasure are already canonical from pages 269 and 192,
      and rule_treasure is resolved by tbl_treasure_10_plus on page 276.
