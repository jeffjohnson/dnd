source_summary: >-
  Pages 276–277 present the Treasure 10+ section, consisting of a d100 random treasure table (TREASURE TABLE 10+)
  containing 50 roll entries. The table determines loot carried by 10th-level and higher monsters or found as
  unguarded treasure by 10th-level and higher characters. Entries include coins, ornate and masterwork gear
  (silver plates, chainmail, ceremonial greatswords, crimson chainmail and shield, minotaur-shaped plate mail,
  blue crashing-wave plate mail, dragonbone greataxe, silvered staff, silk robe with pearl buttons, elvish chainmail),
  lavish trade goods, art objects, and curios (statuette of Gede, dwarvish honey mead, stained glass pane of
  St. Terragnis vs. dragon, marble throne, jade sculpture of meditating elephant-man, masterwork lute, gold scarab,
  painting of ancient king, gold pendant, egg-shaped emerald, silver skull, opalized giant conch shell, gold sarcophagus,
  chunk of meteorite, taxidermied adult dragon, silver torc, flawless diamond), and legendary magic items, blessings,
  and named artifacts (Potion of Healing, Potion of Extirpation, 4th-tier and 5th-tier spell scrolls, 5th-tier magic wand,
  giant diamond casting wish, Portable Hole, idol with Demonskin blessings, Scroll of the Covenant with Divine Halo blessings,
  Brakʼs Cube of Perfection, Flying Carpet, +3 mithral magic armor, +3 magic weapon, the Obsidian Witchknife, the Armor
  of Saint Terragnis, and the Staff of Ord).

