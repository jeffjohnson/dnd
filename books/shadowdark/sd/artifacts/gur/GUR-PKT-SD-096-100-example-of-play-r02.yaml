rejected_candidates:
- text_locus: the cast list, p96
  quoted_gist: Jorbin a dwarf fighter, Ralina a halfling thief, Iraga a half-orc priest and Creeg a human
    wizard, described as 1st-level crawlers
  why_considered: These are the most tempting candidates in the packet, because unlike most names in prose
    each pairs two identities the graph already holds. ancestry_dwarf, ancestry_halfling, ancestry_half_orc
    and ancestry_human are canonical, so are class_fighter, class_thief, class_priest and class_wizard,
    and exp_level_one is canonical too. Four ancestry-to-class pairings with a level could be read as
    four statements about legal combinations.
  rejection_reason: They are fictional people in a story, not rules. The book nowhere states that a dwarf
    may be a fighter as a rule; it shows one who is. Reading a demonstration as a constraint would also
    produce a false graph, since the absence of an elf wizard from this cast says nothing whatever about
    elves. Constitution section 8 states that source-supported dependencies rather than resemblance determine
    edges, and the resemblance here is to identities defined properly in the character chapter.
- text_locus: the GM's torch damage ruling, p98
  quoted_gist: asked whether a lit torch can be jabbed into the jelly, the GM answers 'Absolutely. Make
    an attack roll with it like a melee weapon', and then 'I'd say a lit torch does 1d4 damage from the
    flames'
  why_considered: This looks more like a mechanic than anything else in the packet. item_torch is canonical,
    cbt_melee_attack and cbt_damage_roll are canonical, and the sentence assigns a weapon-style damage
    die to a named gear item, which is exactly the shape of a real weapon row.
  rejection_reason: 'The GM is improvising and the text says so: ''I''d say'' is an adjudication in the
    moment, not a rule. Verified rather than assumed, item_torch carries exactly one canonical row, item_campfire
    CONSUMES it from printed page 86, and the gear entry at its own defining locus on printed page 34
    gives it no damage value. Asserting a damage row from here would create, out of a table ruling, a
    property the rulebook never gives the item. What the passage genuinely illustrates is rule_improvise,
    canonical from printed page 88, which already states that the GM may call for an attack roll.'
- text_locus: the torch extinguish roll, p98
  quoted_gist: '''Now I need you to roll a d6 to see if the torch extinguishes. 1-3 is bad'', and the
    player''s reply that they had forgotten about it'
  why_considered: The player's 'Forgot about it' implies a standing rule rather than an invention, which
    made this the one rejection I expected to overturn. If such a rule exists it would belong to the light-source
    machinery, where rule_light_source is canonical.
  rejection_reason: It is not a rule anywhere the graph can see. I read the LIGHT SOURCES section at its
    defining locus, printed page 84 in the claimed PKT-SD-084-085 source, and it states only that light
    sources last about an hour of real time, how two simultaneous sources share a timer, and that the
    GM may rule counter to that. There is no extinguish roll. The five canonical rows citing page 84 carry
    no such relation either. So the roll is either a GM improvisation like the damage figure, or a rule
    stated on a page not yet extracted. Either way this transcript is not its defining locus and asserting
    it here would invent a mechanic or pre-empt a page. Recorded as OBS-02 so that whoever extracts the
    remaining chapters can confirm which it is.
  overturned_at_revision_2: 'OVERTURNED by REV-GUP-PKT-SD-096-100-example-of-play-r01-r01 and now carried
    as M001. The rejection''s factual half was right and I verified it correctly: no extinguish rule appears
    at the light source locus on printed page 84. Its reasoning was wrong, because I treated ''not stated
    at the item''s own locus'' as settling the matter, without asking whether the direction invoked a
    procedure canonical elsewhere. It did. rule_d6_decider is canonical as The D6 Decider, so page 98
    applies an existing procedure to an existing item rather than defining either, which SOURCE_MARKDOWN
    permits from an incidental locus.'
- text_locus: the darkness cancelling a talent's advantage, p99
  quoted_gist: '''Your Thievery talent would normally give you advantage on this, but the blinding darkness
    cancels it'''
  why_considered: Three canonical identities meet in one sentence, abil_thievery, rule_advantage and rule_total_darkness,
    and the cancellation is a real mechanical interaction.
  rejection_reason: Already canonical from its own locus and not stated as a new rule here. rule_advantage
    ALTERNATIVE_TO rule_disadvantage with aspect cancellation is in production from printed page 78, and
    rule_total_darkness MODIFIES rule_check with aspect sight tasks from printed page 84. The sentence
    applies both; it establishes neither. A row from here would attach page 99 as a second citation to
    facts the graph already holds correctly.
- text_locus: the failed casting costing the spell until a rest, p99
  quoted_gist: '''The magic fizzles out, and I can''t cast light again until we finish a rest'''
  why_considered: A clear statement of a consequence, naming a canonical spell and a canonical rule.
  rejection_reason: 'Already canonical from its own locus, verified: rule_resting GATES rule_spellcasting_check
    with aspect failed spell recovery is in production from printed page 44. The player is stating the
    rule that page establishes, in character. Restating it here would duplicate the fact under a worse
    citation.'
- text_locus: the death timer, p99
  quoted_gist: '''you''re out cold. Roll a d4 plus your CON mod to see how many rounds until you die'',
    and the result of three rounds'
  why_considered: The death sequence was extracted only two packets ago and this is the same machinery
    in motion, so it was worth checking whether the transcript adds anything the DEATH section on printed
    page 89 omits.
  rejection_reason: 'It adds nothing. Every element is already canonical: rule_hit_points TRIGGERS rule_dying,
    abil_constitution FEEDS_INTO rule_dying, rule_round FEEDS_INTO rule_dying and rule_dying TRIGGERS
    rule_death, all from printed page 89. The transcript shows the rule running and states no part of
    it that page 89 does not.'
- text_locus: the scum jelly and its behaviour, p97 to p99
  quoted_gist: a creature with tendrils, an armor class, two attacks a round, the ability to see in the
    dark, apparent resistance to a dagger and vulnerability to fire, and advantage against a prone target
  why_considered: monster_ is an approved prefix and this creature is named and given statistics in play,
    which is more mechanical detail than many monsters get in a narrative.
  rejection_reason: 'A monster''s defining locus is its entry in the Monsters chapter, which is unextracted,
    and that entry will state its statistics properly. Proposing an identity here would pre-empt that
    page and risk a label or kind its own entry contradicts, which is the same reasoning that left the
    Wizards and Thieves reference unasserted in PKT-SD-091-093. The dagger resistance is weaker still:
    it is a player''s guess, prefaced ''Maybe'', and the GM neither confirms nor denies it.'
- text_locus: the secret random encounter check, p96
  quoted_gist: '''The GM secretly makes a random encounter check due to the noise but rolls a 3 on the
    d6. No encounter for now.'''
  why_considered: rule_encounter is canonical and noise causing a check is a plausible mechanical relation
    that the crawling rules might not carry.
  rejection_reason: The narration describes what this GM did, not what a GM must do. rule_encounter already
    carries five canonical cadence and trigger rows from printed pages 82, 83, 84 and 86, and none of
    them is a noise trigger; adding one from a parenthetical in a transcript would assert a rule the rules
    sections do not state. If noise triggering an encounter is a rule in this book, it belongs to whichever
    page says so.
non_edge_observations:
- id: OBS-01
  subject: the example is an unusually complete index of the graph
  detail: 'Recorded because it is useful rather than because it is actionable. Read as a checklist rather
    than as source, this transcript touches initiative, Dexterity modifiers, advantage from a talent,
    difficulty classes at two named tiers, a random encounter check, armor class, disadvantage from a
    prepared reaction, spellcasting checks against a DC, damage dice, a natural one, a natural twenty,
    monster attack bonuses, zero hit points, the death timer, spell loss until a rest, and healing. Every
    one is canonical.

    That makes the packet a reasonable end-to-end sanity check on the graph: a reader could trace this
    scene through the canonical rows without gaps. The two places where the trace fails are the two GM
    improvisations, which is exactly where the source stops being rules.'
- id: OBS-02
  subject: the torch extinguish roll may be a rule on an unextracted page
  detail: 'Flagged for whoever extracts the remaining chapters. The player''s ''Forgot about it'' reads
    as a standing rule rather than an invention, but no such rule appears at the light-source locus on
    printed page 84, which I read directly, and no canonical row carries it. Roughly a hundred and ten
    packets remain unclaimed, including the GM chapter, so the rule may yet appear.

    If it does, its own page is its defining locus and this transcript should not be cited for it. If
    it never does, the roll was a GM improvisation and the graph is correct to omit it. Recorded so that
    the question is answered by evidence later rather than guessed now.'
- id: OBS-03
  subject: an example of play cannot be a defining locus, stated once for the intake
  detail: 'Worth stating as a general position because this is the first transcript and there may be others.
    A rule''s defining locus is the page that states it. An example shows a rule in operation, and its
    details are chosen to make the scene work rather than to be complete or normative: the GM sets a DC
    because this door is tough, assigns torch damage because a player asked, and rolls an encounter check
    because there was noise. Treating any of that as source would put table adjudication into the graph
    with the same authority as the rules sections, and would do it under citations that a reader checking
    the page would find unpersuasive.

    The test applied throughout this packet was therefore: does some other page state this, and if so
    is that page already extracted. Where the answer was yes the candidate was rejected as a restatement
    with the existing row named. Where the answer was no, the candidate was rejected as an improvisation
    or deferred to the page that will state it.'
- id: OBS-04
  subject: an incidental locus may support a relationship it does not define
  detail: 'This is the correction OBS-03 needed and did not have. OBS-03 said an example of play is never
    a defining locus, and that remains true. What it wrongly implied is that nothing in an example can
    therefore be asserted.

    The two are different questions. A defining locus is where an identity or a rule is established, and
    an example is never that. An incidental locus is a passage that applies two things already defined
    elsewhere, and a stated relationship between them can be carried from it without redefining either.
    Page 98 defines neither the torch nor The D6 Decider, and M001 does not claim it does; it records
    that the source directs one to be resolved by the other.

    The practical test this adds to the one in OBS-03: when an example states a mechanic not found at
    the obvious locus, check whether both endpoints are canonical before rejecting. If they are, the passage
    may be an incidental locus rather than an improvisation. Applied to the packet''s other GM ruling,
    the torch damage figure, the test still rejects it: there is no canonical identity for a torch''s
    damage to be resolved by, and the GM''s ''I would say'' marks it as invention.

    The failure that produced this was not a failure to look. rule_d6_decider was in the registry listing
    I read in full for this packet, with degree zero. I read the identity and did not connect ''The D6
    Decider'' to a direction to roll a d6. Reading the registry in full is necessary and is not sufficient;
    the identities have to be matched against what the page is actually doing.'
architectural_escalations: []
architectural_escalation_note: 'None raised. A null extraction is an ordinary outcome under the existing
  rules and needs no ruling: the constitution''s core test simply excludes everything in this packet.
  Nothing here requests a new prefix, edge type, domain or general rule, and no boundary was found that
  the contracts do not already settle.'
completeness_statement: 'AMENDED AT REVISION 2. This revision is scoped to the single correction REV-GUP-PKT-SD-096-100-example-of-play-r01-r01
  requires. Revision 1 proposed nothing, so there is nothing to preserve, and this revision proposes one
  edge and no node, both endpoints being already canonical.

  Seven of revision 1''s eight rejections stand unchanged and were independently confirmed. The eighth,
  the torch extinguish roll, is overturned and carried as M001; its entry in rejected_candidates is amended
  in place rather than deleted, so the reasoning that produced the wrong call stays legible. OBS-04 records
  the distinction I missed, between a defining locus and an incidental one. Two stale figures in revision
  1 are corrected in graph_state_at_extraction and the stale gate statement in classified_as_gate_note,
  none of which affects any row. No assertion depends on any other ruleset.'
revision_reason: 'Revision 1 was a null extraction. Its seven other rejections stand unchanged and were
  independently confirmed, but the Reviewer overturned OBS-02, the torch extinguish roll, and this revision
  adds the single row that finding requires. The packet is therefore no longer a null extraction, and
  null_extraction_declaration is amended below rather than left standing as though nothing changed.

  I got this one wrong and the way I got it wrong is worth recording. Revision 1 rejected the roll because
  no extinguish rule appears at the light source locus on printed page 84, which I verified correctly.
  What I failed to do was ask whether the roll invoked a procedure canonical somewhere else. rule_d6_decider
  has been canonical throughout and sat in the registry dump I read in full for this very packet, with
  degree zero, connected to nothing. I read the identity and did not recognise that The D6 Decider was
  what a direction to roll a d6 was invoking.'
polarity_fields_note: The Review specifies polarity governs with basis derived and then directs that both
  fields be omitted so Builder derives them. They are omitted. RESOLVED_BY is not one of the three types
  constitution section 5 reserves for authored polarity, so assigning it is prohibited to the Analyst,
  and all four RESOLVED_BY rows already in production carry governs with basis derived without any having
  been authored that way in a GUR.
