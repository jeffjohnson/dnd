null_extraction_declaration: 'AMENDED AT REVISION 2. This is no longer a null extraction. Revision 1 proposed
  no node and no edge, and the Reviewer overturned one of its eight rejections, so this revision proposes
  one candidate edge and still no candidate node, no candidate general rule and no domain. Both endpoints
  of the single row are already canonical, so nothing needs registering.

  The original reasoning survives for the other seven candidates and is left in place below rather than
  rewritten: all five pages were read in full and every element naming a game concept was considered against
  the core test. The general position stated as OBS-03, that an example of play is never a defining locus,
  also survives and is in fact the basis on which the Reviewer admitted this row: the transcript is an
  incidental locus applying two identities defined elsewhere, not the defining locus of either. That distinction
  is the correction I missed, and it is now recorded as OBS-04.'
classified_as_gate_note: 'AMENDED AT REVISION 2, because revision 1''s statement of the gate was stale
  by the time it was published. Verified against the live artifacts rather than restated: REV-IMP-DEC-2026-0104-r01-r01
  is status approved with handoff readiness terminal, so the item to rule_light_source CLASSIFIED_AS form
  is no longer gated. Its handoff states that the Analyst may now publish ordinary source-backed successors
  for items explicitly identified as Light Sources.

  That changes nothing in this packet and no CLASSIFIED_AS row appears here. The torch appears in this
  transcript only in play, and DEC-2026-0104 requires a source locus that explicitly identifies the item
  as a light source, which an example of play is not. The single row added at this revision is RESOLVED_BY,
  not CLASSIFIED_AS. Torch, Lantern and Campfire still need ordinary source-backed artifacts from their
  own loci, which is work for the packets that own those pages.'
