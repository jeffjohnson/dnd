source_summary: A transcript of an imagined session. Four example characters, a dwarf fighter, a halfling
  thief, a half-orc priest and a human wizard, explore a tomb. They roll initiative, kick open a door
  on a hard Strength check with advantage from a talent, and the GM secretly checks for a random encounter.
  They find a pool that turns out to be a jelly, fight it, discover a dagger barely harms it, burn it
  with a spell and then with a torch, lose the torch to an extinguish roll and are plunged into darkness.
  A failed casting costs the wizard a spell until a rest, a character drops to zero hit points and rolls
  a death timer, another lights a spare torch, and a healing spell revives him. The text is dialogue interleaved
  with italic narration of the dice.
graph_state_at_extraction: 'AMENDED AT REVISION 2. Read from the repository at extraction, not recalled:
  the canonical graph holds 280 registry rows and 640 edges. Two figures in revision 1 were wrong and
  are corrected here.

  First, revision 1 said five canonical rows touch rule_encounter. Six do, from printed pages 82, 83,
  84, 86 and 90. The sixth is rule_overland_travel FEEDS_INTO rule_encounter, a row I authored myself
  two packets earlier and did not count. Second, revision 1 implied that reading the registry in full
  was sufficient to find every relevant identity; it is not, as OBS-04 records.

  The single row added at this revision was checked against the canonical edge set for an assertion-key
  collision and for the weaker case of a shared source, type and target under a different aspect. There
  are none: rule_d6_decider has degree zero and carries no rows at all, and item_torch carries exactly
  one row, item_campfire CONSUMES it from printed page 86, which is a different type and target.'
