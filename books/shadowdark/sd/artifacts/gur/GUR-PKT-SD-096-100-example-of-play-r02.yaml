  analyst_rationale: Required by REV-GUP-PKT-SD-096-100-example-of-play-r01-r01, which overturned OBS-02
    of revision 1. Printed page 98 directs a d6 roll to determine whether a lit torch goes out, and the
    player's reply that they had forgotten about it confirms a standing procedure rather than an invention.
    rule_d6_decider is canonical as The D6 Decider and item_torch is canonical, so the sentence applies
    an existing procedure to an existing item without redefining either. RESOLVED_BY is the thing-to-procedure
    type and the direction runs from the item to the procedure that resolves the question. The die faces
    that count as extinguishing are a magnitude and are not stored.
