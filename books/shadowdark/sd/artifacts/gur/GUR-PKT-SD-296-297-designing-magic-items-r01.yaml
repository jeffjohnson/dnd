source_summary: >-
  Pages 296–297 present the Designing Magic Items section:
  - DESIGNING MAGIC ITEMS and MAGIC ITEM QUALITIES provide GM guidelines for creating custom magic items, emphasizing uniqueness, power level roughly equivalent to a class talent, and preferring passive riders over complex active checks to maintain game pace;
  - GAME-BREAKERS provides cautionary design guidance regarding mechanics that impact Shadowdark core systems, specifically warning against unlimited light or darkvision (which remove light pressure) and expanding gear slots (which undermine inventory management);
  - Page 297 is full-page artwork.

