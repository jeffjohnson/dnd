rejected_candidates:
  - text_locus: 'DESIGNING MAGIC ITEMS heading and procedure, p296'
    quoted_gist: 'DESIGNING MAGIC ITEMS'
    why_considered: 'Checked whether a procedure node rule_designing_magic_items should be minted, analogous to rule_designing_monsters.'
    rejection_reason: >-
      Unlike Designing Monsters (SD p. 192), which defined a mechanical level-to-damage/attack derivation procedure and resolved via a table, this section contains exclusively qualitative design advice and philosophy for the GM. It defines no mechanical formula, roll, lookup, or table; minting an unattached rule node would create degree-zero orphan clutter.
  - text_locus: 'MAGIC ITEM QUALITIES Unique guideline, p296'
    quoted_gist: 'All magic items should be distinct from each other. Magic is mysterious, and so should be each magical dagger or spell scroll. Give them personalities, strange curses, or unique appearances.'
    why_considered: 'Checked for candidate relationship edges to item personality, curses, or items.'
    rejection_reason: >-
      Narrative ethos and creative guidance for the GM. It defines no mechanical constraint or dependency between entities; striking it leaves all magic item generation and rules unchanged (failing the core test).
  - text_locus: 'MAGIC ITEM QUALITIES Power Level heuristic, p296'
    quoted_gist: 'A magic itemʼs benefits should each be roughly equivalent to a class talent in power and scope. Magic items can be mighty, but they should rarely eclipse what a character can contribute.'
    why_considered: 'Mentions class talents (rule_talents), suggesting a potential comparative constraint edge.'
    rejection_reason: >-
      Qualitative benchmark and design guideline for GMs when authoring custom items. Magic items do not grant or inherit class talents mechanically, nor does rule_talents constrain item generation tables. The comparison is an advisory heuristic for the creator, not a binding game mechanic.
  - text_locus: 'MAGIC ITEM QUALITIES Nature of Effects advice, p296'
    quoted_gist: 'Magical effects that are passive riders... are easier for players to manage than effects that need to be activated... Avoid effects that could easily go forgotten or bog down the pace of the game by adding frequent checks or rolls.'
    why_considered: 'Checked for mechanics governing active versus passive item activation.'
    rejection_reason: >-
      Pacing and user-experience advice for game masters. It establishes no mechanical distinction, activation rule, or check dependency in the ruleset.
  - text_locus: 'GAME-BREAKERS Darkvision or Light cautionary guideline, p296'
    quoted_gist: 'Use extreme caution with effects that obviate the need for torches or the light spell. Such effects remove the time pressure and resource management of tightly limited light sources. Magic items should not glow indefinitely or provide an unlimited way to see in the dark.'
    why_considered: 'Explicitly mentions torches (item_torch), the light spell (spell_light), and darkvision (rule_darkvision), suggesting possible constraint edges.'
    rejection_reason: >-
      Advisory warning to GMs designing homebrew items, explaining the game-design rationale for resource scarcity. It does not alter how item_torch, spell_light, or rule_darkvision function in play, nor does it forbid specific printed items (such as torches or glowing features). Striking this passage changes zero mechanics in the graph.
  - text_locus: 'GAME-BREAKERS Gear Slots cautionary guideline, p296'
    quoted_gist: 'The amount of gear a character can carry ties into the time pressure of light sources... Enhancing gear slots can reduce these core challenges to mere speed bumps. Access to such effects should be rare and limited.'
    why_considered: 'Explicitly mentions gear slots (rule_gear_capacity), suggesting a potential constraint on magic items enhancing gear capacity.'
    rejection_reason: >-
      Design philosophy and cautionary guidance for GMs. Official items (such as the interdimensional pocket on the Utility Benefit Table, p. 291) already enhance gear capacity. The advice that access should be rare and limited is an advisory recommendation for campaign management, not a deterministic mechanical rule or edge constraint.
  - text_locus: 'Full-page artwork, p297'
    quoted_gist: '::: {#p297 .full-page-artwork} :::'
    why_considered: 'Accounted for all blocks in the bounded scope.'
    rejection_reason: >-
      Pure full-page illustration with class full-page-artwork; contains no text, mechanics, or graph content.

non_edge_observations:
  - id: OBS-01
    subject: Pure design guidance chapter yields a null extraction consistent with established precedent
    detail: >-
      PKT-SD-296-297-designing-magic-items contains exclusively advice, creative philosophy, and design cautions
      addressed to the Game Master regarding custom magic item creation. Unlike PKT-SD-192-193 (Designing Monsters),
      which contained concrete formulas and a 1:1 table resolving monster level, this section contains no tables,
      no derivations, and no mechanical dependencies. In accordance with Constitution 1.8 Section 1, Section 2.4,
      and precedents such as PKT-SD-075-077, PKT-SD-187-188, and PKT-SD-267-268, GM advice that does not bind
      game mechanics yields no candidate nodes or edges.
  - id: OBS-02
    subject: Mention of core systems confirms systemic design rationale without asserting new dependencies
    detail: >-
      The Game-Breakers subsection articulates the design rationale connecting light scarcity, gear slots, and
      time pressure. While this provides valuable insight into the interconnectedness of Shadowdark's crawling
      procedures, the connections are already modeled at their defining loci (in the crawling, gear, and magic chapters).
      An exhortation to preserve those systems when creating new items creates no new graph edges.

