null_extraction_declaration: 'This GUR proposes no candidate node, no candidate edge, no candidate general
  rule and no domain. That is a property of the source material, not an incomplete reading. Both pages
  were read in full and every block naming a game concept was considered against the core test and rejected
  for a stated reason. The handoff is the ordinary Builder handoff and the status is the ordinary proposed;
  this is not a withdrawal, because nothing supersedes this packet.


  It is the 7th null extraction in the intake. The script counts the prior 6 from the artifact store rather
  than from recollection: PKT-SD-001-004-credits-and-contents; PKT-SD-038-038-character-names; PKT-SD-051-053-priest-and-wizard-spell-lists;
  PKT-SD-075-077-gameplay-introduction-and-adventuring; PKT-SD-096-100-example-of-play; PKT-SD-322-325-community-credits-and-licensing.
  PKT-SD-075-077-gameplay-introduction-and-adventuring is the governing precedent, being the same shape
  of chapter opening, and its reasoning is applied here rather than re-argued.


  What makes this one worth reading carefully is where it sits. It opens the monster chapter, whose absence
  has been the single largest deliberate loss in all 22 packets of the encounters chapter just completed.
  A reader arriving here expecting the monster_ identities to begin should know that they do not begin
  on these two pages.'
units_note: 'Figures name their unit. Measured by the building script from the claimed source via the
  Pandoc AST: 14 blocks in scope, being 1 heading, 1 block-quoted epigraph and 12 paragraphs of narrative.
  2 blocks are on printed page 187 and 12 on 188. 0 numerals appear anywhere in the in-scope text once
  page-marker text is removed, so there is no magnitude to exclude. No table, no list. The script asserts
  the recorded packet checksum against the claimed file before reading a single block.'
page_attribution_basis: 'Two markers, resolved through the Pandoc AST rather than positionally.


  The p187 marker ends the MONSTERS heading, which placement rule 1 applies to the whole heading; the
  epigraph beneath it inherits 187 by persistence. The p188 marker is the final token of the first narrative
  paragraph, and the script asserts it is trailing rather than inline before applying rule 1, because
  the two readings differ: trailing puts the whole paragraph on 188, while an inline marker would split
  it. Persistence then carries 188 through the eleven paragraphs that follow.


  This is the same shape as the page-76 marker in PKT-SD-075-077-gameplay-introduction-and-adventuring.
  No row cites a page because no row exists.'
scope_boundary: The bounded scope is the Primary Source Material section, printed pages 187 and 188. The
  file's Supporting Source Context section states that no passages are appended, so unlike every packet
  of the preceding chapter there is no out-of-scope rules text in the file at all. Nothing outside the
  bounded scope was read as evidence.
source_summary: 'Page 187 is the MONSTERS chapter heading and an epigraph attributed to Creeg, a human
  wizard. Page 188 is a single continuous scene: a party fights the Ten-Eyed Oracle, a fungus-crusted
  floating beast with a scarred central eye. Ralina slips on a pillar, Iraga raises a blessed sword that
  blazes with holy light, Creeg drops his invisibility and Jorbin appears behind the creature. This summary
  is orientation only.'
graph_state_at_extraction: 'Read from the repository at extraction, not recalled, and every figure is
  computed by the building script from the canonical files and the claimed source.


  The canonical graph holds 424 registry rows and 851 edges, and 0 rows cite printed page 187 or 188.
  The registry holds 0 monster_ identities, unchanged by this packet. The domain registry is still empty
  and general_rules.json is still an empty object; the script asserts both rather than assuming them.


  reused_nodes is empty because no row here uses any identity, and nothing is proposed.'
name_match_measurement_note: 'The prose was matched against the whole registry by script even though no
  row was expected, because a null extraction is the easiest kind to get wrong by not looking. The same
  three scans are run as on the table packets, with blocks in place of cells.


  Scan 1: 5 of 14 blocks match, over these identities: ancestry_dwarf, ancestry_human, class_wizard, rule_invisibility,
  rule_round, spell_invisibility, spell_light. Scan 2: 7 blocks match, adding rule_turn. Scan 3: 5 blocks
  match, adding 15 identities no other scan reaches.


  Not one of the 8 identities the first two scans reach is a real reference; every one is ordinary English
  or a person in a story. ancestry_dwarf matches the dwarf who charges, ancestry_human the epigraph''s
  attribution, class_wizard the same attribution, rule_round a round scar, rule_turn eyestalks turning,
  and spell_light a blaze of holy light.


  The pair worth naming is rule_invisibility and spell_invisibility, both matched on Creeg dropping his
  invisibility magic. Those two identities are precisely the ones a false absence claim reached production
  about from PKT-SD-062-065, so the reference is recorded here as seen and dispositioned rather than passed
  over: it is a character in a story ceasing to be invisible, and it states nothing about either mechanic.'
