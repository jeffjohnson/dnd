rejected_candidates:
- text_locus: the Ten-Eyed Oracle, p188
  quoted_gist: a floating beast crusted with fungus and barnacles, with ten writhing eyestalks and a scarred
    central eye that once stared into the heart and mind of any creature, named The Ten-Eyed Oracle and
    bolded
  why_considered: This is the packet's strongest temptation and it is the reason the claim manifest flagged
    the hazard in advance. The creature is named, capitalised, bolded, given a history and given a stated
    former power over the minds of creatures. It opens the monster chapter, and the registry holds 0 monster_
    identities, so minting the first one here would look like progress.
  rejection_reason: 'A creature''s defining locus is its stat block, and this is fiction. The chapter''s
    defining pages are later packets and none is claimed. Nothing here is mechanical: the eye''s power
    is described in the past tense as something the scar destroyed, no check, save, range or effect is
    stated, and the creature has no attributes. This is the same disposition applied to every named creature
    in the 22 packets of the encounters chapter, and it would be a poor moment to abandon it, because
    the identity minted from a story would then have to be reconciled against the real stat block when
    it arrives.'
- text_locus: the six bolded words, pp187 and 188
  quoted_gist: the narrative bolds beast, eye, Ten-Eyed, sword, magic and charged
  why_considered: 'In the rules sections of this book bold marks a defined term, and the chapter''s italic
    convention for naming a spell was measured and used to carry a row at printed page 185. A typographic
    convention that carries evidence in one place invites the same reading here, and three of the six
    words name mechanics closely: a sword, magic and a charge.'
  rejection_reason: 'It is prose emphasis, which PKT-SD-075-077 settled for exactly this shape of scene.
    The tell is the set itself, measured rather than sampled: 6 bolded words and they are beast, eye,
    Ten-Eyed, sword, magic, charged. Beast, eye and Ten-Eyed are not mechanics in any reading, so the
    bolding cannot be term-definition bolding; it is a narrative device highlighting the creature''s features.
    Sword names no registry identity, the weapon registry has 15 specific weapons and no generic sword,
    magic names no spell, and charged is a verb of motion rather than a named action.'
- text_locus: Creeg's invisibility, p188
  quoted_gist: Creeg drops his invisibility magic and Jorbin blinks into sight
  why_considered: Both rule_invisibility and spell_invisibility are canonical and both scans match this
    block. These are the two identities a false absence claim reached production about from PKT-SD-062-065,
    so this block is dispositioned explicitly rather than left to the collision list.
  rejection_reason: 'A character in a story stops being invisible. The cell states no casting, no duration,
    no condition on ending it and no effect on any mechanic; dropping a concealment is narrative staging
    so that the ally can appear behind the creature. Neither identity is named: the text says invisibility
    magic, not either label. Striking the sentence would leave both mechanics unchanged, which is the
    core test failing cleanly.'
- text_locus: the blessed sword and the blaze of holy light, p188
  quoted_gist: Iraga raises her blessed sword high, filling the amphitheater with a blaze of holy light,
    and the Oracle screeches and recoils, blinded
  why_considered: 'This is the only sentence in the packet where something has an effect on something
    else: a light blinds a creature. rule_light_source and rule_vision are canonical and the preceding
    chapter earned rows from cells that put out a light or obscured sight, so the shape is live.'
  rejection_reason: The effect is on a character in a story, not on a mechanic. No light source is named
    or classified, no blinded condition exists in the registry, no duration or check is stated, and the
    creature it happens to has no identity. The preceding chapter's qualifying cells all named a rule
    the graph holds and said what happened to it; this one names none. DEC-2026-0104 also requires a source
    locus that explicitly identifies an item as a light source, and a blessed sword blazing in a story
    is not that.
- text_locus: the epigraph and its attribution, p187
  quoted_gist: a line about horrors that writhe and creep in the darkness never being meant to be seen,
    attributed to Creeg, human wizard
  why_considered: The attribution names an ancestry and a class, both canonical identities, and darkness
    is adjacent to rule_total_darkness.
  rejection_reason: An epigraph. Constitution section 2 states that labels do not determine identity,
    and a character described as a human wizard is a person in a byline rather than an assertion about
    ancestry_human or class_wizard. Darkness here is atmosphere, not the light rule; the same reading
    declined the ten-foot pole in the epigraph at printed page 75.
- text_locus: the remaining narrative blocks, p188
  quoted_gist: Ralina clinging to a pillar and slipping, a chip of stone breaking free under her foot,
    the Oracle's eyestalks turning toward her, her cry of Now, the dwarf charging and the battle being
    joined
  why_considered: 'Read for completeness, as every block on an in-scope page must be considered. Several
    describe actions that have procedures elsewhere in the book: climbing, hiding, being detected, initiative
    and a charge into combat.'
  rejection_reason: 'It is a story, and the resemblance is entirely to procedures defined properly in
    their own packets. No sentence states a rule: nobody rolls, nothing is checked, no order of action
    is established. Striking the scene would leave rule_climbing, rule_hiding_and_sneaking, rule_detecting
    and cbt_initiative exactly as they are, which is the core test failing across the board.'
non_edge_observations:
- id: OBS-01
  subject: a chapter opening yields nothing, and that is the expected result
  detail: The claim manifest recorded the packet's shape, predicted a null extraction and declined to
    assert one in advance. It holds. Two pages, 14 blocks, 0 numerals, and every block enumerated in rejected_candidates
    with its locus and reason, so the emptiness is auditable rather than asserted. No page needs returning
    to the steward and no source is missing.
- id: OBS-02
  subject: how this differs from the six earlier null extractions
  detail: 'The script lists the prior 6 from the artifact store: PKT-SD-001-004-credits-and-contents;
    PKT-SD-038-038-character-names; PKT-SD-051-053-priest-and-wizard-spell-lists; PKT-SD-075-077-gameplay-introduction-and-adventuring;
    PKT-SD-096-100-example-of-play; PKT-SD-322-325-community-credits-and-licensing.


    Four of them are apparatus, being credits, a name table, a licence and a spell index whose content
    belongs to defining loci elsewhere. Two are prose: the gameplay chapter opening, which discusses play
    without ruling on it, and the example of play. This packet is closest to the gameplay opening and
    differs in one respect that matters for a reader scanning for gaps: it opens the chapter that will
    supply the monster_ identities, so its emptiness could be misread as the chapter having been processed.
    It has not been. Operator sequence 81 is the monster attributes page and is unclaimed.'
- id: OBS-03
  subject: no magnitudes are present to exclude
  detail: The script asserts that 0 numerals appear in the in-scope text once page-marker text is removed.
    The ten eyestalks are written as a word, and the creature's name uses the same number, but neither
    is a game value; nothing is excluded that a reader might expect represented. This is the first packet
    in many where the standing warning that every quantity is a magnitude has nothing to bite on.
- id: OBS-04
  subject: packet wrapper and absent supporting context
  detail: The supplied file opens with an intake wrapper ahead of the Primary Source Material heading,
    for which the claim manifest is the independent page locator SOURCE_MARKDOWN Attribution Rules requires;
    it contains no rulebook prose, heading or marker. The Supporting Source Context section is present
    but explicitly empty, which is the first time in this run of packets that no repeated passage is appended.
    Nothing was excluded from a repeated passage because there was none.
