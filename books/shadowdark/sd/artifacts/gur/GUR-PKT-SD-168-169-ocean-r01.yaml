rejected_candidates:
- text_locus: the coral reefs that hinder ships, p168
  quoted_gist: treacherous coral reefs hinder the passage of ships
  why_considered: One packet ago a blizzard that bars travel earned the chapter's first EXCLUDES row to
    rule_overland_travel, and hinder is the hedged counterpart that would take CONSTRAINS under the test
    settled at PKT-SD-114-114. The type was available and correct.
  rejection_reason: The type is available and the target is not. What is hindered is the passage of ships,
    and the graph holds no identity for a ship or for sea travel. rule_overland_travel is the printed
    page 90 procedure for crossing the map in hexes on land, and stretching it to cover a reef slowing
    a hull would assert a scope the source never gives it. ex_movement is the local mechanic and is not
    what a reef impedes either. Recorded as OBS-02, because this is the mountain row's near twin failing
    on a different element.
- text_locus: the algae that can end a curse, p169
  quoted_gist: a rare bloom of scintillating algae can end one curse
  why_considered: It states an effect on the party rather than a scene, and ending something is the negates
    shape the vocabulary can carry.
  rejection_reason: 'There is no curse identity in the registry and none may be minted from an encounter
    cell. This is the same missing-status gap that has now cost rows at taverns, traps, hazards and five
    encounter packets, appearing here in its inverse form: not a state inflicted but a state removed,
    and equally unexpressible because the state itself has nothing to point at.'
- text_locus: the weather and water hazards, pp168 and 169
  quoted_gist: a massive whirlpool threatening all ships within, a whipping storm battering the group,
    a rogue wave that is a water elemental, high waves tossing jellyfish through the air, a water spout
    tearing across the surface, a colossal rogue wave lasting a stated number of rounds
  why_considered: Six cells, more sea hazards than any page in the chapter has terrain hazards, and the
    mountain page showed one packet ago that weather can state a mechanic.
  rejection_reason: The mountain blizzard says travel is barred. These say threatens, batters, tears across
    and lasts, none of which states a check, a die, a value or an effect on a named rule; the one that
    states a duration states nothing the duration applies to. Twelfth locus to lose rows to the absence
    of stated mechanics for dangerous scenery.
- text_locus: the creature results across the table, pp168 and 169
  quoted_gist: a storm giant in three cells, a hydra, a kraken, a merfolk prince, a water elemental, a
    giant octopus, sahuagin, pirates, giant rats, a plesiosaurus, sirens, a ghost with skeletons, sharks,
    a bone naga, will-o'-wisps, wights, a sea hag, an archmage, brain eaters, a sea dragon, a megalodon,
    harpies and the Wandering Merchant
  why_considered: Three are individually named, Lyrellos the merfolk prince, Sillenion the sea dragon
    with a size class in parentheses, and the archmage with an alignment.
  rejection_reason: A creature's defining locus is its stat block in the unextracted monster chapter and
    the registry holds no monster_ identity. Thirteenth packet running for the same disposition.
- text_locus: the two-encounter instruction, p169
  quoted_gist: one result instructs the reader to roll twice more and combine the results, rerolling that
    result if it comes up again
  why_considered: It is the only instruction on the page, and the stem scan flags it as matching rule_encounter.
  rejection_reason: The match is on the plain word encounters in the instruction's own text; M001 already
    carries the table's relation to rule_encounter. The rest is arithmetic on the table's own roll. Declined
    in the same form in each of the thirteen preceding chapter packets.
- text_locus: the appended random encounter procedure and monster attributes, out of scope
  quoted_gist: the printed page 112 and 113 encounter procedure and the printed page 189 monster attributes
    page
  why_considered: Both are in the file and the first is the rule this table resolves.
  rejection_reason: Both are Supporting Source Context, outside the bounded scope. PKT-SD-112-113 is already
    integrated, so extracting from it would duplicate canonical rows and cite pages outside this packet's
    range.
non_edge_observations:
- id: OBS-01
  subject: the hundredth slot is a boon in every packet of this chapter
  detail: 'Measured across all 14 claimed packets of this chapter rather than noticed: the last row of
    every table, the result on a roll of 00, is a gift or a stroke of luck. Four of them name a magic
    item outright, in 150-151-deep-tunnels, 162-163-low-district, 166-167-mountain, 168-169-ocean. The
    others are beneficial potions, a unicorn in a sunbeam, an angel gifting a boon, a couatl offering
    a blessing, a diamond pushed into a character''s hand, a royal invitation, a legendary library materialising,
    regenerative springs and a weapon revealed as magical.

    This is a structural fact about the chapter that no single packet could show and that changes how
    the remaining nine should be read. The hundredth slot is where the treasure rule will be tested every
    time, and three of the four rows that rule has produced so far come from it. Recorded so that a later
    Analyst checks that cell deliberately rather than reaching it last and tired.'
- id: OBS-02
  subject: the mountain travel row has a near twin here that fails on the target
  detail: 'One packet ago a blizzard barring travel earned the chapter''s first EXCLUDES row to rule_overland_travel.
    This page has treacherous coral reefs that hinder the passage of ships, which is the same kind of
    statement one notch weaker, and it earns nothing.

    The type would have been available: hinder is hedged where bars is not, so CONSTRAINS rather than
    EXCLUDES, which is the test settled at PKT-SD-114-114 and which the Integrator has just affirmed on
    the mountain row. What fails is the target. The graph holds no ship and no sea-travel identity, and
    rule_overland_travel is defined on printed page 90 as crossing the map in hexes on land, carrying
    13 rows all from that page. Asserting it here would widen a canonical identity''s scope from a cell
    that never mentions it.

    Recorded because the pair makes the boundary legible: the mountain row was earned by the target existing,
    not by the weather being dramatic. A whole mode of travel in this book has no identity yet, and the
    ocean chapter is where that first costs something.'
- id: OBS-03
  subject: the missing status vocabulary appears in its inverse form
  detail: 'A rare bloom of scintillating algae can end one curse. There is no curse identity, so nothing
    is expressible, and that is the same gap recorded at PKT-SD-136-137 and at traps and hazards before
    it.

    What is new is the direction. Every previous instance was a state inflicted on the characters that
    the graph could not record: lethargy, hallucination, being stuck, drowsiness, sleep, blindness. This
    one is a state removed, and it is equally unexpressible for the same reason, because the state itself
    has nothing to point at. Recorded because a status vocabulary proposal that only considered afflictions
    would be half a solution; the book also has things that lift them.'
