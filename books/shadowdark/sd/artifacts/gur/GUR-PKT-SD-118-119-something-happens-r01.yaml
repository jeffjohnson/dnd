registry_addition_only_declaration: 'This GUR proposes one candidate node and no candidate edge, no general
  rule and no domain. That is a property of the source material, not an incomplete reading, and it is
  the registry-addition shape DEC-2026-0003 provides for: a node change may be approved on its own, separately
  from any edge insertion.

  The page is a heading and a 50-row d100 table of narrative prompts, with no prose at all. There is no
  rule on the page for the table to be resolved by, no stated trigger telling a GM when to roll it, and
  no mechanical consequence attached to any result. What exists is a named source table, and that is what
  is registered.

  The precedent is the languages packet, PKT-SD-032-032, which registered fourteen language identities
  from their defining locus with no edges because printed page 32 stated no expressible relationship.
  The same reasoning applies here.'
page_attribution_basis: 'This packet contains the intake''s first table-row marker and the attribution
  turns entirely on it, so it is set out in full.

  p118 ends the SOMETHING HAPPENS! heading and behaves normally under placement rule 1. p119 sits nowhere
  near a heading: it is at the end of the last cell of a single table row, the one reading that a pair
  of yellow eyes watches from the darkness. SOURCE_MARKDOWN Attribution Rules state that a table-row marker
  applies to the row as a unit even when the cited evidence is in a cell before the marker, and acceptance
  test 3 requires a parser to assign a last-column table marker to the whole row.

  So that entire row is printed page 119, not merely the text after the marker, and the persistence rule
  carries 119 to every row below it. Measured from the claimed source rather than counted by eye: the
  table has 50 result rows, of which 23 are printed page 118 and 27 are printed page 119. No row in this
  GUR cites either page, because this GUR asserts no row; the attribution serves the record and the registry
  addition.'
scope_boundary: 'The bounded scope is the Primary Source Material section, printed pages 118 and 119:
  one heading and one table. The trailing Supporting Source Context is out of scope.'
source_summary: 'A single d100 table of narrative prompts titled SOMETHING HAPPENS TABLE!, spanning two
  printed pages, with no accompanying prose. Its results are events a GM can drop into play: the ground
  opens, an unseen foe leaps out, a stranger presses a coin into a character''s hand, every light source
  goes out, a demon makes an offer. None states a check, a value, a duration or a consequence; each is
  a sentence of fiction for the GM to adjudicate.'
graph_state_at_extraction: 'Read from the repository at extraction, not recalled, and every figure here
  is computed by the assembling script from the canonical files and from the claimed source rather than
  counted by hand.

  The canonical graph holds 326 registry rows and 702 edges, and 0 rows cite printed pages 118 or 119,
  so nothing in this span has been extracted before. The registry holds 44 tbl_ identities and 0 of them
  currently has degree zero, which is the fact that made the registry-addition question worth arguing
  rather than assuming; see IDQ-01. 23 identities in the registry overall carry no edge, all of them language
  and spell identities registered from their own defining loci.'
