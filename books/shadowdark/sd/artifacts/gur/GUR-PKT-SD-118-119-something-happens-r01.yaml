rejected_candidates:
- text_locus: the result reading that every light source suddenly extinguishes, p119
  quoted_gist: 'one of the table''s results: every light source suddenly extinguishes'
  why_considered: This is the single most mechanical-looking result in the table and the closest call
    in the packet. rule_light_source is canonical and heavily connected, light is the book's central resource,
    and the sentence is unhedged and absolute.
  rejection_reason: 'It is a prompt for the GM, not a rule. The table is a list of things that might happen,
    and this result says no more about the light rules than the neighbouring result about a seagull says
    about birds. Nothing states when the table is rolled, so nothing in the graph would connect to a source;
    a row would have to run from the table itself, asserting that the Something Happens table extinguishes
    light, which is true only of one result in 50.

    The light source machinery already carries its real extinguishing rules from their own loci, the d6
    decider from printed page 78 and the light mishaps table from 110. This is the same treatment given
    to the trap triggers in PKT-SD-114-114 and the hazard cells in PKT-SD-115-115.'
- text_locus: results naming concepts that have canonical identities, pp118 to 119
  quoted_gist: an unseen foe leaping from hiding at close range, being magically scryed upon, an attempted
    pickpocketing, goblins tumbling into sight, a demon and a radiant being
  why_considered: 'Each brushes an existing identity: rule_hiding_and_sneaking and rule_distance, spell_scrying,
    abil_thievery, ancestry_goblin, and the deity identities.'
  rejection_reason: Name collisions in fiction, which is the error the last two packets were careful to
    avoid in both directions. Being scryed upon is not the Scrying spell being cast under its own rules;
    a goblin in a prompt is not the goblin ancestry a player may choose. The source states no relationship
    in any of these, only a scene. The incidental-locus test requires the page to state a relationship
    between two identities, and a table of prompts states none.
- text_locus: the absence of a trigger or a roll instruction, pp118 to 119
  quoted_gist: the page consists of a heading and a table, with no sentence saying when or why the table
    is consulted
  why_considered: 'Every other table in the intake is reached by a rule: the traps and hazards tables
    by their rules, the carousing tables by carousing, the encounter tables by the encounter rule, the
    mishap tables by critical failure. A RESOLVED_BY row was expected here by analogy and its absence
    is conspicuous.'
  rejection_reason: There is nothing to attach it to. No rule on this page, and no canonical rule elsewhere
    names this table; I checked the canonical edge set rather than assuming. Inventing a rule identity
    so the table has a parent would mint something the source does not name, and pointing the table at
    rule_encounter or a similar neighbour would assert a connection the book never makes. Recorded as
    OBS-02.
non_edge_observations:
- id: OBS-01
  subject: the first table-row marker in the intake
  detail: 'Worth recording as a parsing precedent rather than as a finding, since it will recur. Every
    marker in this intake so far has ended a heading or a paragraph. This one sits in the last cell of
    a table row, and under the Attribution Rules and acceptance test 3 it belongs to the whole row rather
    than to the text after it.

    The practical consequence is that a long table can straddle a page boundary invisibly, with the marker
    buried mid-table. Measured here: 50 result rows, 23 on printed page 118 and 27 on 119. Any later packet
    whose table spans a page will have the same shape, and reading only headings would miss it entirely.'
- id: OBS-02
  subject: a named table with nothing to attach it to
  detail: 'Every other table registered in this intake is reached by a rule through a RESOLVED_BY row.
    This one is not, because the page contains no prose and no canonical rule elsewhere names it, which
    I verified against the edge set.

    The registry will therefore hold a table that answers no query about when it is used. That is the
    source''s shape rather than a defect: the book prints a table of prompts and leaves its use entirely
    to the GM. If a later chapter names it, that page is where the connecting row belongs. Comparable
    to rule_d6_decider, which sat at degree zero from its own registration until the example of play gave
    it its first edge.'
- id: OBS-03
  subject: fifty-one results and none is a mechanic
  detail: 'Recorded so the emptiness is understood as measured rather than skimmed. All 50 results were
    read. None states a check, a difficulty, a value, a duration, a damage figure or a consequence; each
    is one sentence of fiction. Several name things the graph holds, which is discussed in the rejections,
    and several more name things it does not, such as NPCs, demons and weather.

    This is the most purely narrative page the intake has met, more so than the example of play, which
    at least demonstrated rules in operation. A GM rolling on this table gets a situation to adjudicate,
    and adjudication is exactly what the constitution declines to model.'
unresolved_identity_questions:
- id: IDQ-01
  subject: whether an unattached table should be registered at all
  detail: 'I propose registering tbl_something_happens with no edge, and the alternative is a true null
    extraction that registers nothing.

    The case for registering: it is a named source table, the registry is an inventory of the book''s
    identities, and DEC-2026-0003 exists precisely so a node can be approved without an edge. PKT-SD-032-032
    set the precedent with fourteen languages, and the registry already holds 23 identities carrying no
    edge. If a later chapter names this table, the identity will be waiting, exactly as rule_d6_decider
    was.

    The case against, which I want tested rather than assumed away: all 44 tbl_ identities currently in
    the registry carry at least one edge, so an unattached table would be the first of its kind, and the
    languages precedent is not quite the same shape, since those were individually named members of a
    vocabulary other rows already pointed at in aggregate. Nothing points at this table, in aggregate
    or otherwise. A registry entry that answers no query has a cost in noise.

    Consequence either way: registering it and being wrong leaves one inert row in the registry, removable
    by a later Decision; declining and being wrong loses a named identity that a later chapter may need,
    recoverable by a successor. Both are cheap, which is why I am asking rather than escalating, but the
    first of a kind is worth a deliberate answer.'
architectural_escalations: []
architectural_escalation_note: None raised. The single identity uses an approved prefix and needs no new
  vocabulary. IDQ-01 asks how an existing mechanism, the DEC-2026-0003 registry addition, applies to a
  case it has not yet met, which is a Reviewer judgement rather than a request for a ruling.
completeness_statement: 'Both printed pages in scope were read in full at the recorded checksum, including
  all 50 table results individually. The packet yields 1 new identity and no rows, and the identity is
  declared registry_addition_only with its basis, following PKT-SD-032-032 and DEC-2026-0003.

  Three candidates were rejected and each is recorded with its reason: one result that looks mechanical
  and is not, a group of results that collide by name with canonical identities, and the missing RESOLVED_BY
  row that every other registered table carries. The page attribution rests on the intake''s first table-row
  marker and is set out in page_attribution_basis, with the row split measured from the claimed source.
  What is deliberately not asserted is listed as OBS-01 through OBS-03, and the single open question,
  IDQ-01, asks whether an unattached table should be registered at all. Every figure in this GUR was computed
  rather than counted by hand. No assertion depends on any other ruleset.'
