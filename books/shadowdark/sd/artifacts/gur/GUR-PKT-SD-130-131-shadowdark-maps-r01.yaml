candidate_general_rules_note: None proposed. The eight contents rows share a shape, but they enumerate
  eight named source tables rather than instancing a rule, and the Analyst is prohibited from promoting
  a general rule.
rejected_candidates:
- text_locus: the physical dice-scattering procedure, p130
  quoted_gist: take the number of dice the size gives and roll them together on blank paper, note where
    each fell, draw an outline around them, separate rooms with walls and passages matching the type
  why_considered: It is the most distinctive thing on the page and the actual heart of the generator,
    stated imperatively across three paragraphs.
  rejection_reason: It is a procedure performed on paper with no game-mechanical endpoints. There is no
    identity for a die's position, a room's outline, a wall or a passage, and minting them would create
    a cluster describing a drawing technique rather than a rule any other mechanic reads. The dice counts
    are magnitudes. What survives is that the size table supplies the dice count and the type table shapes
    the connections, both carried as RESOLVED_BY rows from the procedure. Recorded as OBS-01 because the
    loss is large and deliberate.
- text_locus: the room type results naming canonical rules, p130
  quoted_gist: the ten room types include Trap, Minor hazard, Major hazard and Treasure
  why_considered: Four of the ten results name identities the graph already holds, rule_traps, rule_hazards
    and rule_treasure, all canonical and all extracted within the last twelve packets. Under the results-are-identities
    test from PKT-SD-124-125 this looked like it should yield rows.
  rejection_reason: 'That test does not transfer, and working out why is IDQ-01. It applied where a table
    selects among the members of an axis, so the axis is what the table resolves: sys_ancestry holds six
    ancestries and the table picks one. rule_traps is not an axis and has no members; a room being a trap
    room is not the traps rule taking a value. Neither RESOLVED_BY direction reads correctly, and the
    honest relation, that a generated site contains traps, has no type in the closed vocabulary that fits
    without inventing a containment semantic. Recorded as IDQ-01 rather than forced.'
- text_locus: the highest-roll placement rule, p130
  quoted_gist: the site's objective or boss monster is located in the room with the highest room type
    roll
  why_considered: An unhedged placement rule, and it interlocks with the room type table, whose highest
    result is Boss monster.
  rejection_reason: 'Its content is an ordering over die results, which is a magnitude relation no field
    may store, and there is no identity for a room or a position for the rule to relate. It is also partly
    redundant: the room type table already makes the boss its top result, so the sentence mainly tells
    a reader which room to pick when two rooms tie or when an objective replaces the boss. Neither half
    is expressible.'
- text_locus: the contents tables' own results, p131
  quoted_gist: descriptor pairs such as Crude and Ensnaring for traps or Sneaky and Ambusher for a solo
    monster, and single descriptors such as Short fall, Antimagic zone, Hidden, Captive and Supreme sorcerer
  why_considered: 'Some brush canonical concepts: an antimagic zone echoes the hazard examples on printed
    page 115, a drowning hazard echoes swimming, and Rival adventurers echoes rule_rival_crawlers, canonical
    from printed page 126.'
  rejection_reason: 'All are flavour descriptors for a GM filling in a room, and none states a check,
    a value, a duration or a consequence. The Rival adventurers result is the closest call and still fails:
    it names a kind of NPC to put in a room, not a relation to the rival crawler generator, and asserting
    one would claim map generation invokes that generator, which the page does not say. The eight tables
    are proposed and each is reached from the room type, which is what is expressible.'
non_edge_observations:
- id: OBS-01
  subject: the page's most distinctive content is its least expressible
  detail: 'The physical procedure is what makes this generator unusual: dice are scattered on paper and
    their positions become the map. None of it reaches the graph, because a die''s position, a room outline,
    a wall and a passage have no identities and minting them would describe a drawing technique rather
    than a rule.

    Recorded because the gap is the opposite shape from the ones logged over the last few packets. Those
    were tables of flavour with no mechanics to find. Here there is a genuine, precise, physical mechanic
    and the vocabulary has nothing to hold it with. What the graph keeps is the table structure around
    it, which is real but is the scaffolding rather than the method.'
- id: OBS-02
  subject: the first table in the intake whose result selects another table
  detail: 'tbl_map_room_type is the hinge of this page: its result determines which of eight contents
    tables a reader rolls. No earlier packet has had a table select another table, and the shape is carried
    as eight FEEDS_INTO rows from the room type into each contents table.

    Set out in two_tier_structure_note. Worth flagging separately because it also settles how the eight
    contents tables avoid being registry additions: their results are purely descriptive, which by the
    PKT-SD-124-125 test would leave them unattached, but they are reached from the room type rather than
    from nothing. Reached, just not from the top.'
- id: OBS-03
  subject: the danger level gains its first resolver
  detail: 'rule_danger_level has been canonical since printed page 86 and carries 3 rows, all of them
    outbound: it constrains resting and feeds the encounter cadence twice. None of them says how a danger
    level is arrived at. This page''s table is the first thing in the intake to resolve it, so M005 completes
    a rule that has been consumed three times without ever being determined.

    Worth recording because it is the kind of link the intake exists to find, and because it is a reminder
    that the three danger level values were twice declined as identities, on printed pages 86 and 90,
    precisely so that the aggregate could carry relations like this one.'
unresolved_identity_questions:
- id: IDQ-01
  subject: whether a room type naming a canonical rule should yield a row
  detail: 'Four of the ten room types name canonical identities: Trap, Minor hazard, Major hazard and
    Treasure point at rule_traps, rule_hazards and rule_treasure. I asserted nothing and want that tested,
    because it is the largest thing I declined on this page and the reasoning is finer than the earlier
    table tests.

    Why the results-are-identities test does not transfer: that test applied where a table selects among
    the members of an axis, and the axis is then what the table resolves. sys_ancestry holds six ancestries
    and the NPC table picks one, so sys_ancestry RESOLVED_BY that table reads correctly. rule_traps is
    not an axis and has no members. A room being a trap room is not the traps rule taking a value, so
    RESOLVED_BY is wrong in both directions.

    What the source actually states is containment: a generated site contains rooms, and some of those
    rooms contain traps, hazards or treasure. No type in the closed vocabulary carries containment. FEEDS_INTO
    would say traps supply an input to map generation, which inverts the relation; GATES would say traps
    are a precondition, which is false; CROSS_REFERENCES has no page pointer to rest on.

    Consequence of my choice: a reader asking what a generated dungeon contains finds eight contents tables
    and not the three rules those contents are instances of, so the map generator sits beside the traps
    and hazards rules without touching them. If Reviewer sees a type that fits, four rows follow and no
    existing row changes. If not, this is a genuine expressiveness limit worth the Architect''s attention
    alongside the condition vocabulary and the missing participant identities.'
architectural_escalations: []
architectural_escalation_note: None raised. All 13 identities use an approved prefix, every row uses a
  legal edge type at status core, no row carries supersession_basis and none is an OVERRIDES, and no CLASSIFIED_AS
  row appears. IDQ-01 may be an expressiveness limit rather than a judgement call, but it is put to the
  Reviewer first rather than escalated from inside a packet, since a fitting type may exist that I have
  not seen.
completeness_statement: 'Both printed pages in scope were read in full at the recorded checksum: five
  procedure paragraphs, 12 named tables and 55 data rows. The packet yields 13 new identities and 13 rows,
  reusing 1 canonical identity whose label the assembling script asserted equal to the registry. No proposed
  identity is left carrying no edge.

  The rows mirror the procedure''s two tiers rather than flattening it, which is argued in two_tier_structure_note:
  four tables are rolled directly and take RESOLVED_BY rows from the procedure, and eight are reached
  through the room type and take FEEDS_INTO rows from it. Every row was checked against the 717 canonical
  edges for an assertion-key collision, for a shared source, type and target under a different aspect,
  and for duplicates within the patch; there are none of any, and no canonical row cited either page before.

