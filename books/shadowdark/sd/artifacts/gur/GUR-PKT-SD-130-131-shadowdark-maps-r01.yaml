units_note: 'Figures name their unit. Measured by the assembling script from the claimed source: 12 named
  tables and 55 data rows across them, on two printed pages.'
page_attribution_basis: 'Both markers sit on headings. p130 ends the SHADOWDARK MAPS heading and p131
  ends the MAP TRAP TABLE heading, and placement rule 1 applies each to its whole heading with the persistence
  rule carrying it forward. Verified against the claimed source that no marker appears inside a table
  row.

  So the procedure''s prose and the four top-level tables, danger level, site size, site type and room
  type, are printed page 130, and the eight contents tables are printed page 131. Five rows cite page
  130 and eight cite page 131.'
scope_boundary: 'The bounded scope is the Primary Source Material section, printed pages 130 and 131:
  five paragraphs of procedure and 12 named tables. The trailing Supporting Source Context is out of scope.'
source_summary: 'A physical dungeon generator. Roll or choose a site size and type, take the number of
  dice the size gives, and roll them together on blank paper. Note where each die fell, draw an outline
  around them to form the site''s shape, and separate rooms with walls and passages matching the site
  type. The number showing on each die gives that room''s type, and the reader then rolls on the corresponding
  contents table. The site''s objective or boss monster sits in the room with the highest room type roll.
  Finally roll the site''s overall danger level. Twelve tables support this: four rolled directly and
  eight reached through the room type.'
graph_state_at_extraction: 'Read from the repository at extraction, not recalled, and every figure here
  is computed by the assembling script from the canonical files and the claimed source.

  The canonical graph holds 348 registry rows and 717 edges, and 0 rows cite printed pages 130 or 131,
  so nothing in this span has been extracted before. No map, site or room identity exists. The registry
  holds 65 tbl_ identities and 34 identities overall carry no edge.

  rule_danger_level was read in full before anything here was written: it carries 3 rows, all from printed
  pages 86 and 90, and 0 of them is a RESOLVED_BY row from it. That matters because this page''s danger
  level table is the first thing in the intake to resolve it.'
two_tier_structure_note: 'The rows deliberately mirror the procedure''s two tiers rather than flattening
  every table onto the parent, and that choice is the main thing to check in this packet.

  Four tables are rolled directly by the procedure: danger level, site size, site type and room type.
  Each takes a RESOLVED_BY row from rule_shadowdark_maps. The other eight are not rolled directly at all.
  The prose says the number on each die gives the room''s type and then to roll on the corresponding table
  for its contents, so the room type is what selects among those eight. Each therefore takes a FEEDS_INTO
  row from tbl_map_room_type rather than a second RESOLVED_BY row from the parent.

  The alternative was twelve uniform parent rows, which would have been simpler and wrong: it would say
  a reader rolls the boss monster table as a step of the procedure, when in fact they roll it only if
  a room came up as a boss room. Carrying the hinge preserves the shape a reader needs, and it makes tbl_map_room_type
  visibly the centre of the page with nine incident rows.

  This is the first packet in the intake where a table''s own result selects another table, so the shape
  is new. It is also why the eight contents tables are not registry additions despite their results being
  purely descriptive: they are reached, just not from the top.'
