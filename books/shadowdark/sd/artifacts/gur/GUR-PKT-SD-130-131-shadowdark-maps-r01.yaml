authored_polarity_declaration: No authored polarity appears. Every row is RESOLVED_BY or FEEDS_INTO, neither
  of which is among the three types constitution section 5 reserves for authored polarity, so assigning
  one is prohibited to the Analyst and invariant 15 has nothing to require. Builder derives governs on
  the five RESOLVED_BY rows and neutral on the eight FEEDS_INTO rows.
status_note: All rows are core, following the disposition settled as IDQ-01 of PKT-SD-124-125 and applied
  again in PKT-SD-126-127. This page presents its procedure directly, with roll or choose offered only
  for the site size and type rather than as an alternative to the procedure itself, and nothing here declares
  the page optional in the way The Gauntlet on printed page 116 and the modes of play on 111 do.
