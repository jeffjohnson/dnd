  Analyst authors none of it.

domains_touched: []
candidate_domains:
  - proposed: character_creation
    basis: >-
      A background is chosen when a character is made and the twenty entries are creation-time
      identities. Recorded as a candidate only; now suggested by a seventh packet, which is noted and
      deliberately not treated as promotion. Constitution section 8 reserves promotion to an
      Architect Decision and the Analyst does not decide a candidate domain is official.

domain_boundary_questions:
  - >-
    A background is chosen at creation but its only mechanical effect lands during play, on checks in
    arbitrary situations. Whether it belongs to a creation domain, a resolution domain or both cannot
    be settled from one page. Deferred; no domain is asserted on either edge in this GUR.

candidate_general_rules: []
candidate_general_rules_note: >-
  None proposed. This page states one rule about one mechanic and repeats no shape within itself. The
  RESOLVED_BY relationship in M001 resembles the four class talents tables, but a rule covering both
  would have to span a background and a talent roll, which are different mechanics, and the Analyst
  does not propose a general rule spanning mechanics on the strength of a shared table idiom.

non_edge_observations:
  - id: OBS-01
    subject: the twenty named backgrounds are deliberately not proposed as identities
    detail: >-
      The table names Urchin, Wanted, Cult Initiate, Thieves' Guild, Banished, Orphaned, Wizard's
      Apprentice, Jeweler, Herbalist, Barbarian, Mercenary, Sailor, Acolyte, Soldier, Ranger, Scout,
      Minstrel, Scholar, Noble and Chirurgeon, each in bold with a one-line description. They are
      source-named and each has a bounded entry, which is ordinarily what makes an identity
      proposable, so the omission is a decision and not an oversight.
      None of them states a mechanical dependency. Each description says what the character knows or
      once did: grew up in the streets, can appraise value, knows plants and poisons, served in an
      army. Not one names a second mechanic, a value, a check, a permitted item or a procedure, so
      not one would produce an edge. Twenty nodes with no edges would be twenty orphans, and the
      Analyst has already withdrawn one orphan from this intake rather than publish it.
      The mechanical content of the section is entirely in M002: whatever the background is, it may
      improve a check when the GM judges it relevant. That assertion is true of all twenty and does
      not need them enumerated. If a later packet gives a specific background a specific mechanical
      effect, that packet is its defining locus and can propose it then with an edge to carry it.
  - id: OBS-02
    subject: several background names collide with identities elsewhere in the book
    detail: >-
      Barbarian, Ranger, Acolyte and Scout appear in this table, and Barbarian, Acolyte and several
      others also appear as titles in the titles tables on printed pages 30 and 31; Wizard's
      Apprentice echoes the wizard class and Thieves' Guild the thief. These are not the same
      concepts. A background named Barbarian is a character's history; a title named Barbarian is
      what a neutral fighter is called at a given level.
      Recorded because this is exactly the situation SOURCE_MARKDOWN Source Identity Authority warns
      about, where a shared label invites a false merge, and because constitution section 2 states
      that labels do not determine identity. Since no background identity is proposed here, no
      collision is created; the observation exists so that a later packet does not resolve a name
      clash by merging a background into a title or a class.
  - id: OBS-03
    subject: the advantage mechanism is not named on this page
    detail: >-
      Unlike the class benefits, which say advantage explicitly, this page says only that a background
      may provide advantages in a given situation, using the ordinary English word rather than the
      named mechanic. M002 therefore asserts an improvement to the check without claiming the page
      invokes the advantage mechanic. Recorded to distinguish this case from the six packets that do
      name advantage and whose deferral is a different matter.
  - id: OBS-04
    subject: magnitudes deliberately excluded
    detail: >-
      The page carries the table's die expression and its twenty row numbers. Both are die
      expressions and index values, excluded by constitution section 1 and invariant 11. They remain
      in the immutable claimed packet, which is the authority for the values themselves. Neither
      aspect in this GUR contains a digit and neither condition encodes a numeric value.
  - id: OBS-05
    subject: packet wrapper and supporting context
    detail: >-
      The supplied file opens with an intake wrapper ahead of the Primary Source Material heading,
      for which the claim manifest is the independent page locator SOURCE_MARKDOWN Attribution Rules
      requires; it contains no rulebook prose, heading or marker. The trailing Supporting Source
      Context reproduces printed page 15 and is orientation only, contributing nothing here.

unresolved_identity_questions:
  - id: IDQ-01
    subject: the page says advantages in a situation, not advantage on a check
    detail: >-
      M002 targets rule_check. The page never uses the word check: it says the background may provide
      advantages in a given situation. The Analyst read a situation as resolved by a check because
      that is the only resolution mechanic the book has introduced, printed page 9 establishing that
      a risky action is resolved by one, and because a benefit that attaches to nothing would be
      unassertable.
      Consequence if wrong: if the Making Checks chapter on printed page 81 or a later section gives
      backgrounds a different mechanical hook, for example a distinct trained-task mechanic like the
      thief's Thievery, M002 repoints to it. Nothing else in this GUR depends on the choice.
      This is not an Architect escalation: rule_ is an approved prefix, the identity already exists as
      a sibling proposal, and ESCALATION_CONTRACT states that a weak citation is not grounds to
      escalate and that an edge one is unsure of should simply be rejected. The Analyst judged the
      edge supported enough to propose and has recorded the exact uncertainty rather than hiding it.

architectural_escalations: []
architectural_escalation_note: >-
  None raised. Both proposed identities use an approved constitution section 2 prefix with an
  unchanged kind, both edges use one of the thirteen legal section 3 types, and no new prefix, edge
  type, domain promotion or general-rule application is requested. ESCALATION_CONTRACT states that a
  proposed node under an approved prefix and kind which passes identity and duplicate checks is
  ordinary GUR, GUP and Review work rather than an escalation. IDQ-01 is recorded for Reviewer on
  that basis.
  Note for contrast: the sibling packet covering printed pages 27 to 29, alignment and deities, is
  being escalated rather than extracted, because its named members have no approved prefix. This
  packet's twenty backgrounds are not escalated, because the Analyst is not proposing them at all and
  nothing here is blocked by their absence; see OBS-01.

completeness_statement: >-
  The single printed page in the declared span is accounted for. Page 26 was read in full: the
  BACKGROUND heading, the sentence about background knowledge and skills, the sentence directing the
  player and GM to determine situational advantages which supplies M002, the BACKGROUNDS TABLE
  heading and its column headers which supply M001, and all twenty table rows with their names and
  descriptions, dispositioned in OBS-01 and OBS-02. Every page marker was resolved through the Pandoc
  AST and the in-scope resolved page set matches the declared span with no gap. The Supporting Source
  Context reproducing printed page 15 is out of scope and contributed nothing. Two edges are proposed
  across three candidate nodes, one of which is also proposed by a sibling GUR from its defining
  locus and is marked as such. No node is reused because the Shadowdark graph is empty. Content not
  converted to an edge is accounted for in OBS-01 through OBS-05, and the one reading the Analyst
  could not settle is recorded in IDQ-01 rather than resolved silently. No assertion depends on any
  other ruleset.
