page_attribution_basis: >-
  One marker resolves in the Primary Source Material, through the Pandoc AST rather than
  positionally. {#p26} ends the BACKGROUND heading, which placement rule 1 applies to the whole
  heading, and the persistence rule carries page 26 through both framing sentences and every row of
  the backgrounds table. Both rows below cite page 26. A second page the parser resolves, 15, lies
  entirely inside the out-of-scope Supporting Source Context.

scope_boundary: >-
  The bounded scope is the Primary Source Material section, printed page 26. The trailing Supporting
  Source Context reproduces printed page 15, whose primary packet is
  PKT-SD-015-015-stats-and-stat-modifiers, outside this packet's declared span. No assertion here is
  drawn from it and no row cites page 15.

source_summary: >-
  Printed page 26 is a short section: the BACKGROUND heading, one sentence saying a character's
  background knowledge and skills might prove useful in play, one sentence directing the player and
  GM to determine together whether a background grants advantages in a given situation, and a
  twenty-row rollable table of named backgrounds each with a one-line description. This summary is
  orientation only; both assertions below cite page 26.

graph_state_at_extraction: >-
  The Shadowdark canonical graph is still empty; nodes.csv is header-only, the domain registry has no
  domains, general_rules.json is an empty object, and character_races.yaml is inactive. The three
  supplied slices named in the packet manifest as missing remain immaterial, re-assessed here rather
  than carried over from claim. reused_nodes is empty. One of the three identities below is already
  proposed by a sibling GUR from its defining locus and is marked as such.

cross_packet_identity_note: >-
  rule_check is proposed by a sibling GUR from its defining locus and is proposed again here because
  this patch uses it as an edge endpoint. A GUR must propose every endpoint its edges use: an
  endpoint present only in a sibling GUR is not canonical, is not proposed by the patch, and fails
  invariant 1 as endpoint_unresolved. Proposing it is not a competing naming; it records its defining
  locus and the sibling GUR that also proposes it, and the ID and label are reproduced exactly.

prior_withdrawal_note: >-
  An earlier draft of GUR-PKT-SD-011-014 proposed rule_background from printed page 12, where the
  OVERVIEW entry names a background and says a character is adept at tasks related to it. The Analyst
  withdrew that node before publication because no edge in that packet used it and it would have been
  an orphan. This packet is the mechanic's defining locus, states two relationships to it, and
  therefore proposes it properly. Recorded so the earlier withdrawal is not mistaken for a judgment
  that the concept is not graph-constitutable.

