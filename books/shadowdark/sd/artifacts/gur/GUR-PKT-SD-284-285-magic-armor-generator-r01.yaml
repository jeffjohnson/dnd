source_summary: >-
  Pages 284–285 present the Magic Armor Generator section, comprising five tables for generating magic armor:
  - ARMOR TYPE TABLE (2d6) determines base armor type (Leather, Chainmail, Shield, Plate mail, Mithral + reroll);
  - ARMOR BONUS TABLE (2d6) determines the magical bonus (+0, +1, +2, +3);
  - ARMOR FEATURE TABLE (d20) provides distinctive visual and thematic features;
  - ARMOR BENEFIT TABLE (d12) provides supernatural benefits and defensive gifts;
  - ARMOR CURSE TABLE (d12) provides drawbacks and curses for cursed armor.

