rejected_candidates:
  - text_locus: 'ARMOR TYPE TABLE rows naming base armors and materials, p284'
    quoted_gist: 'Leather, Chainmail, Shield, Plate mail, Mithral + reroll'
    why_considered: 'Checked for direct edges to item_leather_armor, item_chainmail, item_shield, item_plate_mail, and item_mithral.'
    rejection_reason: >-
      Table entries name existing canonical items as roll outcomes from a 2d6 generation table. They represent random generator outputs rather than structural dependencies or rule modifications, and do not establish separate edges.
  - text_locus: 'ARMOR BONUS TABLE numeric values, p284'
    quoted_gist: '2-5: +0, 6-8: +1, 9-11: +2, 12: +3'
    why_considered: 'Checked for combat modifier edges with specific numeric bonus amounts.'
    rejection_reason: >-
      Numeric bonuses (+0 to +3) and dice roll ranges (2-5, 6-8, 9-11, 12) are numeric magnitudes excluded from aspect and condition by Invariant 11 and Constitution section 5. The rule that magic armor bonuses modify AC was established on SD p. 282.
  - text_locus: 'ARMOR FEATURE TABLE aesthetic detail entries, p284'
    quoted_gist: 'Demonic, horned face... Studded with shark teeth... Dragon scales... Draped in holy symbols... Covered in frost'
    why_considered: 'Checked for monster, deity, or elemental damage relationship edges.'
    rejection_reason: >-
      All 20 table entries are cosmetic, aesthetic visual motifs for armor appearance. They introduce no mechanical rules, statistics, or damage modifiers.
  - text_locus: 'ARMOR BENEFIT TABLE individual benefit entries, p285'
    quoted_gist: 'Checks to stabilize you are easy (DC 9)... You know Diabolic and are immune to fire, lava, and magma... You have a +4 bonus to your death timers... Treat critical hits against you as normal hits'
    why_considered: 'Checked whether individual benefits warrant separate ability or rule nodes.'
    rejection_reason: >-
      Individual entries are table roll results defining specific one-off magic item perks rather than general system rules or standalone player abilities. Numeric expressions (DC 9, 3 rounds, +4 bonus, 3 points) are magnitudes excluded under Invariant 11.
  - text_locus: 'ARMOR CURSE TABLE individual curse entries, p285'
    quoted_gist: 'You take 2d10 damage if you remove this armor... Armor uses 5 gear slots... Beneficial spells that target you are hard to cast (DC 15)... You have disadvantage on Dexterity checks'
    why_considered: 'Checked whether individual curses warrant separate condition or penalty nodes.'
    rejection_reason: >-
      Individual entries are specific roll outcomes for cursed items on a d12 table. Dice damage (2d10), gear slot numbers (5 slots), DC numbers (DC 15), and probability chances (1-in-6) are magnitudes excluded under Invariant 11.
  - text_locus: 'Supporting source context passages, pp34-37, p86, pp282-283'
    quoted_gist: 'Magic item attributes (lines 10284–10356), Starting gear and armor table (lines 856–986), Resting (lines 2639–2672), Combat actions (lines 2714–2729)'
    why_considered: 'Checked for edges citing supporting context passages.'
    rejection_reason: >-
      Supporting source context is repeated material from earlier packets and is out of scope per Scope Boundary; no row here may cite pages outside 284–285.
