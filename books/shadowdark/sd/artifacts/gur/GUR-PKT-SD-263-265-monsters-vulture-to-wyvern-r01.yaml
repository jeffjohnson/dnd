non_edge_observations:
  - id: OBS-01
    subject: Wererat and Werewolf lycanthropy affliction threshold operates on creature combat locus
    detail: >-
      Both Wererat and Werewolf transmit lycanthropy upon dealing 12 or more damage from the same creature, and share
      immunity to non-silver, non-magical damage sources (Impervious). Both operate on creature combat and curse rider
      loci under Constitution 2.5.
  - id: OBS-02
    subject: Wight, Will-o'-Wisp, and Wraith Life Drain attacks impose CON ability score damage on creature attack locus
    detail: >-
      Wight, Will-o'-Wisp, and Wraith possess Life Drain dealing 1d4 CON damage on hit, with death at 0 CON. Wight and
      Wraith are additionally Greater Undead (immune to morale checks, silver/magical damage only). All operate on creature
      attack and defense loci under Constitution 2.5.
  - id: OBS-03
    subject: Wolf and Dire Wolf Pack Hunter proximity damage bonuses operate on creature combat locus
    detail: >-
      Wolf and Dire Wolf deal +1 damage on hits while close to / next to an ally. This operates on creature combat locus
      under Constitution 2.5.
  - id: OBS-04
    subject: Winter Wolf Frost Breath cube area damage operates on creature combat action locus
    detail: >-
      Winter Wolf can exhale a near-sized cube of frost dealing 3d8 damage on DC 15 DEX with a 1d4 round recharge, and is
      cold immune (Impervious). Both operate on creature combat action and defense loci under Constitution 2.5.
  - id: OBS-05
    subject: Wraith Incorporeal ability operates as a tactical corporeality toggle on creature locus
    detail: >-
      Wraith can toggle between corporeal and incorporeal states in place of attacks. This operates on creature action
      locus under Constitution 2.5.

