    why_considered: 'Checked for sensory tracking or scent mechanics.'
    rejection_reason: >-
      Stat-block sensory trait on creature locus; tracking radius operates on creature locus; constitution 2.5.
  - text_locus: 'Venom (Wasp, Giant), p263'
    quoted_gist: 'DC 9 CON or go to 0 HP.'
    why_considered: 'Checked for lethal poison mechanics.'
    rejection_reason: >-
      Stat-block attack rider on creature locus; DC 9 CON check and drop to 0 HP operate on creature attack rider
      locus; constitution 2.5.
  - text_locus: 'Impervious and Lycanthropy (Wererat and Werewolf), p263'
    quoted_gist: >-
      Impervious: Only damaged by silver or magical sources; Lycanthropy: If 12 or more damage from the same
      wererat/werewolf, contract lycanthropy
    why_considered: 'Checked for damage immunity profiles and lycanthropy transmission curse mechanics.'
    rejection_reason: >-
      Stat-block defense trait and curse rider on creature locus; damage resistance and 12-damage affliction
      threshold operate on creature combat locus; constitution 2.5.
  - text_locus: 'Greater Undead and Life Drain (Wight, Will-o-Wisp, Wraith), pp263–265'
    quoted_gist: >-
      Greater Undead: Immune to morale checks, only damaged by silver or magical sources; Life Drain: 1d4 CON
      damage, death if reduced to 0 CON
