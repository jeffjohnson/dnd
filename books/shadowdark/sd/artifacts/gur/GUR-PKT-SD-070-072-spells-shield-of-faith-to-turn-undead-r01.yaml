page_attribution_basis: 'Two markers resolve this packet: p71 ends the SILENCE heading and p72 ends SUMMON
  EXTRAPLANAR. Placement rule 1 applies each to its whole heading and the persistence rule carries it
  forward, giving p71 to SILENCE, SLEEP, SMITE, SPEAK WITH DEAD and STONESKIN, and p72 to SUMMON EXTRAPLANAR,
  TELEKINESIS, TELEPORT and TURN UNDEAD.

  SHIELD OF FAITH precedes the first marker and resolves to printed page 70 through the locator in the
  claimed manifest, on the structural basis used and accepted for the two preceding packets: a page''s
  first heading carries its marker, this heading carries none, so it continues the page before p71, whose
  identity the p70 marker inside PKT-SD-068-070 fixes independently of this file. That packet''s last
  entry, SHAPECHANGE, immediately precedes SHIELD OF FAITH alphabetically. No page length was estimated.'
shared_page_note: Printed page 70 is cited by two packets, PKT-SD-068-070 and this one. This is the third
  mid-page split in the intake after pages 62 and 65. It does not breach the zero-overlap rule, which
  bars claiming the same source content, not citing the same printed page.
scope_boundary: The bounded scope is the Primary Source Material section, the ten alphabetically sequenced
  entries from SHIELD OF FAITH to TURN UNDEAD. The trailing Supporting Source Context is out of scope
  and contributed nothing.
source_summary: Ten spell entries in alphabetical order, each a heading, a tier and class line, a duration
  line, a range line and effect prose. Shield of Faith and Stoneskin both improve armor class. Silence
  mutes sound in an area and deafens those inside. Sleep puts a level-bounded number of low-level creatures
  to sleep. Smite deals damage. Speak with Dead questions a corpse and punishes recasting within a stated
  interval. Summon Extraplanar calls a level-bounded creature controlled only while focus holds, dismissed
  by a successful check. Telekinesis lifts a weight-bounded target. Teleport moves the caster and willing
  creatures. Turn Undead makes undead flee or destroys them on a severe failure within a level bound.
graph_state_at_extraction: 'Read from the repository at extraction, not recalled: the canonical graph
  holds 239 registry rows and 492 edges. Nine of this packet''s ten entries are new. The tenth, spell_turn_undead,
  is already canonical and is reused; its two existing rows, a class access gate and a spells-known exclusion
  from printed page 20, were read so the rows proposed here could be checked against them. The canonical
  edge set was loaded so every proposed row could be checked against the section 4 assertion key.'
reused_canonical_spell_note: 'spell_turn_undead is the first already-canonical spell a spell packet has
  encountered. It was registered from the priest class chapter, where the spell is named as a class feature,
  and it carries two rows from printed page 20: class_priest GATES it with aspect spell access, and it
  is EXCLUDED_FROM tbl_priest_spells_known with aspect spell count.

  Neither row describes what the spell does. This packet is its defining locus as a spell and supplies
  its mechanics, its tier and its casting class for the first time. It is reused rather than re-proposed,
  and the label in this GUR matches the registry exactly, so the compiler resolves it rather than attempting
  an addition. None of the six rows proposed for it collides with the two existing rows: they differ in
  type, direction or aspect in every case, and the classification row runs from the spell to class_priest
  while the existing access row runs the other way.'
classification_basis: Tier and casting class are extracted for every entry from its own header line and
  nothing else. Ten tier rows and eleven class rows result; Speak with Dead is the only entry naming both
  classes. All five tier values are used, two entries each.
