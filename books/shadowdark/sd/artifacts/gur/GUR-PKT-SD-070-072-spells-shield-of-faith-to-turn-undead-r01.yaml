authored_polarity_declaration: Authored polarity appears on ten rows and no others, each with basis read
  as invariant 15 requires, and each is a MODIFIES, TRIGGERS or CONSTRAINS row as constitution section
  5 allows. The four CONSTRAINS rows take governs. Shield of Faith, Stoneskin and Teleport take improves.
  Smite, Speak with Dead's recasting penalty and Turn Undead's destruction take inflicts. The 21 CLASSIFIED_AS
  rows and the six FEEDS_INTO and two GATES rows carry none, since section 5 derives those.
domains_touched: []
candidate_domains:
- proposed: magic
  basis: Every entry belongs to the spell machinery. Recorded as a candidate only; constitution section
    8 reserves domain promotion to an Architect Decision.
domain_boundary_questions: []
candidate_general_rules: []
candidate_general_rules_note: None proposed. The classification rows repeat two shapes across ten entries
  but enumerate per-entry source facts rather than instancing a rule, and the Analyst is prohibited from
  promoting a general rule.
non_edge_observations:
- id: OBS-01
  subject: the Turn Undead destruction row is asserted at extraction
  detail: 'Turn Undead is structurally identical to Rebuke Unholy in the preceding packet: a check against
    the caster''s spellcasting check, destruction on a severe failure within a level bound, flight otherwise.
    The Review of that packet withheld approval because the lethal outcome was not carried to rule_death.
    That row is present here at extraction rather than after a correction, with the same aspect shape
    and the same treatment of the failure margin as an excluded magnitude.

    The two spells are close enough that the graph now shows a real pattern: two priest effects, one tier
    1 and one tier 3, resolving identically against different target categories. Neither row collides
    with the other, since they differ in source.'
- id: OBS-02
  subject: the flight outcome is still not carried, for both spells
  detail: 'Turn Undead''s other stated outcome, fleeing from the caster for a stated number of rounds,
    is not asserted, for the same reason recorded as OBS-08 of the preceding packet: there is no canonical
    flight, fear or morale identity, and ex_movement is the creature movement rule rather than a compelled-movement
    effect, so pointing the outcome there would conflate two different things.

    It is now two spells with the same uncarried outcome rather than one, which makes the missing identity
    a recurring gap rather than an isolated one. Minting it is not an Analyst act. Recorded for the Architect.'
- id: OBS-03
  subject: Silence yields only a duration row
  detail: 'Silence mutes sound and deafens creatures in the area. Neither sound nor deafness has a canonical
    identity; spell_blind_deafen exists but is another spell, not a condition, so it is not a target.
    Only the Focus duration is asserted. Whether muting sound prevents spellcasting is a question the
    entry does not answer and this GUR does not decide: no row claims it either way. This is the fourth
    entry in four packets whose main effect has no representable target, after Knock, Passwall and Restoration.'
- id: OBS-04
  subject: weight, sigils and control state are not proposed
  detail: Telekinesis bounds its target by weight, Teleport refers to teleportation sigils and to an off-target
    chance, and Summon Extraplanar describes a summoned creature turning hostile. None has a canonical
    identity and none is proposed. rule_gear_capacity is the carried-load rule and is not a general weight
    concept, so Telekinesis's bound is not asserted against it; doing so would conflate a spell's lifting
    limit with a character's encumbrance.
- id: OBS-05
  subject: Summon Extraplanar's control is a gate, not a duration
  detail: Focus appears twice for this entry, once as the sustained duration and once as a gate on control
    of the summoned creature, because losing focus does not end the spell but turns the creature hostile.
    The two rows differ in type and aspect and so stay distinct under the section 4 assertion key. The
    same shape appears in Pillar of Salt in PKT-SD-065-067, where focus sustained the spell and separately
    gated permanence.
- id: OBS-06
  subject: Sleep takes both a FEEDS_INTO and a CONSTRAINS row from level
  detail: 'The entry uses the caster''s level twice and differently: it sets how many creatures may be
    chosen, which is an input, and the targets are bounded by their own level, which is a bound. Both
    rows run from exp_level to the spell and differ in type and aspect, so they are distinct. This mirrors
    the Mirror Image distinction recorded as OBS-06 of PKT-SD-065-067 and is worth checking rather than
    assuming duplication.'
- id: OBS-07
  subject: Shield of Faith's class line reads oddly and is extracted as printed
  detail: The entry is named Shield of Faith, its prose speaks of holy conviction, and its header line
    says wizard. Every comparable devotional effect in the book is a priest spell. This may be a source
    inconsistency, but the Analyst does not author or correct source, and the classification row says
    wizard because the header says wizard. Recorded so that if the steward later revises the page, the
    row is known to depend on that line rather than on a reading of the prose.
unresolved_identity_questions: []
unresolved_identity_questions_note: 'None. The judgement calls in this packet all have a settled precedent
  to follow: the death row follows the Rebuke Unholy correction, the two-row check and threshold split
  follows the Illusion settlement, and the dual-use-of-level split follows Mirror Image. IDQ-01 of the
  preceding packet, whether alignment should CONSTRAIN or FEED_INTO, is still open but no row here depends
  on it: no entry in this packet turns on alignment.'
architectural_escalations: []
architectural_escalation_note: 'None raised. Every identity uses an approved prefix, every row uses a
  legal edge type, and the classification rows use only the two authorized spell forms. The recurring
  gaps are recorded rather than escalated from inside a packet: compelled flight now affects two spells,
  OBS-02, and undefined targets now affect four entries across four packets, OBS-03.'
completeness_statement: All ten entries in the bounded scope were read at the recorded checksum and each
  produced at least its classification rows. The packet yields 9 new spell identities, one reused canonical
  spell, 18 mechanical rows and 21 classification rows, 39 rows in total, every one checked against the
  492 canonical edges for an assertion-key collision before publication; there are none, including against
  the two rows spell_turn_undead already carries. Seventeen canonical identities are reused rather than
  re-proposed, verified against the registry at extraction. All five tier values are used. What is deliberately
  not asserted is listed as OBS-01 through OBS-07. No assertion depends on any other ruleset.
