rejected_candidates:
  - text_locus: 'Charge (Elephant), p216'
    quoted_gist: 'Move up to double near in straight line and make 1 tusks attack. If hit, ×3 damage.'
    why_considered: 'Checked for shared charge rule (echoes Triceratops, p208).'
    rejection_reason: >-
      Stat-block attack description on creature locus. Movement distance and damage multiplier ×3 are
      magnitudes; locus test applies.
  - text_locus: 'Feyblood (Elf), p216'
    quoted_gist: 'ADV on DEX checks while in the natural wilds.'
    why_considered: 'Names advantage and DEX checks; checked against character race ancestry or shared elf mechanics.'
    rejection_reason: >-
      Stat-block trait on creature locus. Conditional advantage on creature checks in natural wilds is
      a creature-specific trait; locus test applies.
  - text_locus: 'Poison Web (Ettercap), p216'
    quoted_gist: 'One target stuck in place and 1d4 damage/round. DC 12 DEX to escape on turn.'
    why_considered: 'Checked for stuck/entangled condition or persistent damage rules.'
    rejection_reason: >-
      Stat-block attack on creature locus. Stuck in place and 1d4 damage/round with DC 12 DEX escape
      are creature-specific attack riders; locus test applies.
