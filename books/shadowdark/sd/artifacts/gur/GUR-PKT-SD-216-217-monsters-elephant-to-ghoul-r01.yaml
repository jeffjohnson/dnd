non_edge_observations:
  - id: OBS-01
    subject: Undead traits grant morale immunity and damage protections on creature locus
    detail: >-
      Undead on Ghast and Ghoul grants immunity to morale checks, while Greater Undead on Ghost adds
      damage restrictions (only damaged by silver or magical sources). Under Constitution 2.5, these
      remain creature locus defenses.
  - id: OBS-02
    subject: Paralyze and Toxin attack riders specify creature save parameters
    detail: >-
      Paralyze on Ghast and Ghoul (DC 12 CON) and Toxin on Gelatinous Cube (DC 15 CON) both impose
      paralyzed for 1d4 rounds on hit. These operate as creature attack riders under the locus rule.
  - id: OBS-03
    subject: Ghost Possess uses a contested ability check on creature locus
    detail: >-
      Possess on Ghost uses a contested Charisma check against a target within close range to inhabit
      its body for 2d4 rounds, operating entirely within creature combat action parameters.

