source_summary: >-
  Ten monster stat blocks across printed pages 216 and 217: Elephant, Elf, Ettercap, Fairy, Frog, Giant,
  Gargoyle, Gelatinous Cube, Ghast, Ghost, and Ghoul. On page 216: Elephant carries Charge; Elf carries
  Feyblood; Ettercap carries Poison Web; Fairy carries Poison (sleep); Frog, Giant carries Tongue;
  Gargoyle carries Impervious. On page 217: Gelatinous Cube carries Engulf, Rubbery, and Toxin; Ghast
  carries Undead, Carrion Stench, and Paralyze; Ghost carries Greater Undead, Life Drain, and Possess;
  Ghoul carries Undead and Paralyze.

