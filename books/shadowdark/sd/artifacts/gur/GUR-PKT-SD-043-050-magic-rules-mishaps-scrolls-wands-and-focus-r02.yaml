revision_reason: >-
  This is DEC-2026-0103 sequence step 4, the spell-tier scaffold, published now that
  REV-IMP-DEC-2026-0103-r01-r01 is approved and terminal and its handoff states that Analyst may
  publish the scaffold. It adds the five source-named tier values as ordinary rule_ identities and
  classifies each as the existing spell-tier aggregate, so the aggregate's downstream mechanical
  effects become reachable from an individual tier without any numeric value entering an edge field.
  Printed page 50 is the defining locus: it states that spells are classified according to their
  tiers and gives the range those tiers run over. Revision 1 proposed the aggregate rule_spell_tier
  from that same locus and asserted its three downstream effects; this revision supplies the values
  the aggregate classifies.

why_this_revision_carries_only_the_new_rows: >-
  Revision 1's thirteen candidate nodes and thirty-six edges are integrated and canonical. A
  successor GUR that repeated them would collide with production on every row: each would present an
  identical source, type, target, aspect and condition and fail the constitution section 4 assertion
  key, and each node would be rejected as already canonical.
  This revision therefore carries only the five new identities and their five classification rows,
  and reuses the canonical aggregate. That is a deliberate departure from the field-only successors
  published under DEC-2026-0091, which restated their packets in full because nothing from those
  packets had been integrated yet. The difference is integration state, not a change of practice.
  Nothing from revision 1 is withdrawn, reinterpreted or superseded in substance; it remains the
  reading of record for printed pages 43 to 50 and its rows stay in production untouched.

classified_as_gate_note: >-
  The gate DEC-2026-0103 set is open for this use and only this use. IMP-DEC-2026-0103-r01 exists and
  REV-IMP-DEC-2026-0103-r01-r01 is approved with a terminal handoff, which the Decision made the
  precondition for any CLASSIFIED_AS row. The five rows below are the tier-value-to-aggregate form
  constitution section 2.4 authorizes, with the exact aspect that section names.
  The separate item-to-light-source form added by DEC-2026-0104 is NOT used here and may not be used
  yet: IMP-DEC-2026-0104-r01 exists but has no independent Review, and that Decision requires one
  before any Analyst successor asserts a Light Source classification. No row in this revision targets
  rule_light_source, and the torch, lantern and campfire classifications the crawling and resting
  packets declined remain unasserted.

