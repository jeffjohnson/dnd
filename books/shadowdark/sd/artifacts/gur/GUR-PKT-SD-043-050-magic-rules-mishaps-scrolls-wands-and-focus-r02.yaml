non_edge_observations:
  - id: OBS-01
    subject: no spell is classified by this revision
    detail: >-
      This revision builds the scaffold and stops there. It proposes the five tier values and
      connects each to the aggregate; it classifies no individual spell as any tier, and it asserts
      no casting class for any spell. Those rows belong to the spell packets, whose entries state
      each spell's tier and class on their own pages, and DEC-2026-0103 sequences them after this
      scaffold for exactly that reason: a spell cannot point at a tier value that does not exist.
      Forty-three spells are canonical and roughly forty-five more are unextracted. All of them
      currently have no tier and no casting class in the graph, which is the gap the escalation
      identified and which the remaining steps close.
  - id: OBS-02
    subject: the tier range is a magnitude and is not stored
    detail: >-
      Printed page 50 gives the range the tiers run over. That range is a magnitude and no field
      records it. What records the tier is the discrete identity: five nodes with the source's own
      labels. Constitution section 2.4 states this design explicitly, that tier is represented by its
      classification identity rather than a numeric value, and it is the reason the aggregate row
      exists at all rather than a number on a spell.
  - id: OBS-03
    subject: the ordering of the five tiers is not represented
    detail: >-
      The source presents the tiers as an ordered progression, and DEC-2026-0103 itself calls tier
      one ordered source category. Nothing here records that Tier 2 is higher than Tier 1. No legal
      edge type expresses ordinal succession, and inventing one would be the general-taxonomy
      widening that Decision explicitly refused.
      The consequence is worth stating plainly: a query asking which spells are tier 3 or higher
      cannot be answered from the graph, even once every spell is classified. The ordering remains in
      the immutable packet and in the labels. Recorded rather than worked around.
  - id: OBS-04
    subject: revision 1 remains the reading of record for this packet
    detail: >-
      Everything printed on pages 43 to 50 other than the tier values was read, extracted and
      dispositioned in revision 1, whose thirty-six edges and nine observations are integrated and
      unchanged. This revision adds to that record rather than replacing it, and a reader wanting the
      packet's full extraction should read revision 1 alongside it. The completeness statement below
      covers only what this revision adds.

unresolved_identity_questions:
  - id: IDQ-01
    subject: whether a tier value is properly a procedure
    detail: >-
      The five nodes take kind procedure, because constitution section 2.4 names them as ordinary
      rule_ proposals and rule_ is glossed as a named rule or procedure, but a tier value is neither
      a rule nor a procedure in the ordinary sense. It is a category label.
      The Analyst used the kind the prefix implies rather than inventing one, since section 2.4
      fixes the prefix and the labels and says nothing about a distinct kind, and minting a new kind
      is not an Analyst act. The same tension already exists for rule_spell_tier itself, which
      revision 1 proposed with the same kind and which is now canonical, so the five values are at
      least consistent with their aggregate.
      Consequence if wrong: five nodes and possibly their aggregate need a kind correction, which is
      a registry change rather than a re-reading of source, and no row repoints. Recorded so Builder
      and Reviewer settle it deterministically rather than each choosing.

architectural_escalations: []
architectural_escalation_note: >-
  None raised. Every proposed node uses the prefix and the exact label constitution section 2.4
  fixes, every row uses the CLASSIFIED_AS form that section authorizes with the exact aspect it
  names, and no new prefix, edge type, domain promotion or general-rule application is requested.
  The two limits this revision observes rather than questions are recorded above: the item-to-light-
  source form is not used because DEC-2026-0104's implementation is not yet reviewed, and tier
  ordering is not represented because no legal type expresses it.

completeness_statement: >-
  This revision is scoped to DEC-2026-0103 sequence step 4 and covers the TIERS subsection on printed
  page 50, which was re-read at the recorded checksum before publication. It proposes the five tier
  identities section 2.4 enumerates, with that section's exact IDs and labels verified against the
  section rather than transcribed, and five CLASSIFIED_AS rows connecting each to the canonical
  aggregate, which is reused rather than proposed. All five rows were checked against the 350
  canonical edges for an assertion-key collision before publication; there are none, and there were
  no CLASSIFIED_AS rows in production before these. The remainder of printed pages 43 to 50 is
  covered by revision 1, which is integrated and unchanged, as OBS-04 records. What this revision
  deliberately does not do is classify any spell, which OBS-01 explains, or represent tier ordering,
  which OBS-03 explains. No assertion depends on any other ruleset.
