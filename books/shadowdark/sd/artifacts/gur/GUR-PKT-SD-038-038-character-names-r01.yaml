rejected_candidates:
  - text_locus: 'CHARACTER NAMES TABLE column headings, p38'
    quoted_gist: 'six columns headed Dwarf, Elf, Goblin, Halfling, Half-Orc and Human'
    why_considered: >-
      These are exactly the six ancestries DEC-2026-0087 authorised and
      GUR-PKT-SD-016-017-ancestries-r03 proposes, so unlike most table headings in this book these
      map to identities that already exist as candidate proposals. An ancestry-supplies-a-name-column
      edge could therefore be written without minting anything, which is what makes this the closest
      call on the page and the reason the decision is argued rather than asserted.
    rejection_reason: >-
      The dependency is real but the target is not a mechanic. Ancestry does select the column, yet
      what the column yields is a suggested given name, and no rule anywhere in the book reads a
      character's name. The edge would pass a structural check and fail the core test, which asks
      whether the target would need review if the source changed; nothing would. Constitution section
      1 also limits the graph to mechanical dependencies, and section 8 says source-supported
      dependency, not resemblance to a familiar shape, determines an edge. The shape here resembles
      the titles tables, which is precisely the trap; see why_this_is_null_when_titles_was_not.
  - text_locus: 'CHARACTER NAMES TABLE body, p38'
    quoted_gist: 'one hundred and twenty given names such as Hilde, Eliara, Iggs, Willow, Vara and Zali'
    why_considered: >-
      Each is source-named and occupies a bounded cell, which is ordinarily what makes an identity
      proposable, and the table is by far the largest enumerated set read so far in this intake.
    rejection_reason: >-
      A given name is not a mechanic. None of the one hundred and twenty states a dependency, a
      value, a permission or a procedure, so none would produce an edge, and proposing them would
      create one hundred and twenty orphan nodes. This is the same disposition the background packet
      gave its twenty named backgrounds and the titles packet gave its sixty title cells, reached
      independently here and at larger scale.
  - text_locus: 'CHARACTER NAMES heading, p38'
    quoted_gist: 'the section heading over the table'
    why_considered: >-
      A rule_character_name identity was considered, on the model of rule_title and rule_background,
      both of which were proposed from their own sections.
    rejection_reason: >-
      Those two identities each carry a mechanical consequence: a title is determined by level,
      class and alignment, and a background improves a check. A character name carries none. The node
      would have no edge and would be an orphan, and the Analyst has already withdrawn one orphan
      from this intake rather than publish it. The character overview on printed page 12 names NAME
      as a character element without attaching any mechanic to it, which is consistent.
  - text_locus: 'closing epigraph, p38'
    quoted_gist: 'an attributed line about whoever named you getting it right, spoken to a named troll'
    why_considered: 'Read for completeness, as every block on an in-scope page must be considered; it also names a creature.'
    rejection_reason: >-
      Flavour. It states no dependency, and the troll it names is a character in an anecdote rather
      than a monster identity; the Monsters chapter is the defining locus for any creature identity.

non_edge_observations:
  - id: OBS-01
    subject: the page yields nothing by its nature, not by an incomplete reading
    detail: >-
      The claim manifest recorded the packet's shape and deliberately declined to answer whether it
      yields a graph-constitutable mechanic. This GUR answers it: it does not. One table of
      suggestions and one epigraph, with no framing prose and no stated rule. Every element is
      enumerated in rejected_candidates with its locus and reason, so the emptiness is auditable
      rather than asserted. This is the expected outcome for this material and no page needs to be
      returned to the steward.
  - id: OBS-02
    subject: the ancestry columns are usable evidence for a different packet, not for this one
    detail: >-
      Recorded because the observation is worth keeping even though it produces no edge here. The six
      column headings confirm, from a page that is not the ancestries packet, that the book treats
      exactly those six as the ancestry set, with the same spellings and the same hyphenation in
      Half-Orc that constitution section 2.1 fixes. That is corroboration of an identity decision
      already made, not a new assertion, and it is not cited by any row because no row exists.
  - id: OBS-03
    subject: magnitudes and an index column deliberately excluded
    detail: >-
      The table's first column is a twenty-row die index. It is a die expression and index value,
      excluded by constitution section 1 and invariant 11. It remains in the immutable claimed
      packet, which is the authority for the values themselves. No aspect or condition exists in this
      GUR to contain a digit.
  - id: OBS-04
    subject: packet wrapper is intake metadata and there is no supporting context
    detail: >-
      The supplied file opens with an intake wrapper ahead of the Primary Source Material heading,
      for which the claim manifest is the independent page locator SOURCE_MARKDOWN Attribution Rules
      requires; it contains no rulebook prose, heading or marker. Unlike most packets in this intake
      this one has no Supporting Source Context at all, so no out-of-scope page was available to be
      misread as evidence.

