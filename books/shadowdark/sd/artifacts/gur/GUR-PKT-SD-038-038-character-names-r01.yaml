  CHARACTER NAMES heading, which placement rule 1 applies to the whole heading, and the persistence
  rule carries page 38 through the table and the closing epigraph. The parser resolves no other page
  in this file, and the resolved page set matches the declared span exactly.

scope_boundary: >-
  The bounded scope is the Primary Source Material section, printed page 38. This packet has no
  Supporting Source Context: the parser resolves only page 38, so it reproduces no other packet's
