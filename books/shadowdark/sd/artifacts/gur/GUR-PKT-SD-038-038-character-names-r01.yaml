source_summary: >-
  Printed page 38 is a single rollable table of one hundred and twenty given names, twenty rows
  against six columns headed Dwarf, Elf, Goblin, Halfling, Half-Orc and Human, followed by an
  attributed epigraph. The page carries no framing prose and states no rule. This summary is
  orientation only.

