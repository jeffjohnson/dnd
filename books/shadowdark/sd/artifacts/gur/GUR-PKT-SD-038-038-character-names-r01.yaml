null_extraction_declaration: >-
  This GUR proposes no candidate node, no candidate edge, no candidate general rule and no domain.
  That is a property of the source material, not an incomplete reading. The page was read in full and
  every element that named a concept was considered against the core test and rejected for a stated
  reason; those rejections are enumerated in rejected_candidates rather than left implicit. The
  handoff is the ordinary Builder handoff and the status is the ordinary proposed. The Analyst did
  not use the terminal withdrawal form, which ARTIFACT_LIFECYCLE reserves for a GUR whose source
  scope a later packet wholly supersedes; nothing supersedes this packet and it is not withdrawn.
  This is the third null extraction in this intake, after the front matter on printed pages 1 to 4
  and the back matter on printed pages 322 to 325, and the repository precedent remains
  GUR-PKT-PHB-001-006-preamble, whose r02 carries zero nodes and zero edges and completed the
  ordinary lifecycle.

why_this_is_null_when_titles_was_not: >-
  This is the judgment most likely to be questioned, so it is stated plainly. Printed pages 30 and 31
  carry four titles tables indexed by level and alignment, and the Analyst extracted twelve edges
  from them. This page carries one names table indexed by ancestry and the Analyst extracts nothing.
  The difference is not the table; it is whether the thing the table produces is a mechanic.
  A title is one. The character overview on printed page 12 names TITLE as an element of a character
  and says a title is based on level, class and alignment, and rule_title was proposed from that
  defining locus and is used by three published GURs. The titles tables resolve an existing mechanic,
  so their inputs are real dependencies.
  A character's name is not. The same overview entry for NAME says only Choose a worthy name for your
  adventurer. No mechanic was proposed from it, nothing anywhere in the book depends on a character's
  name, and this page adds no rule about names beyond offering suggestions. Extracting an
  ancestry-to-table dependency here would assert that ancestry determines something mechanical, when
  what it determines is which list of suggestions a player may roll on for inspiration.
  Put as the core test: if this entire page were struck, no mechanic in the book would need review.
  If the titles tables were struck, rule_title would be left unresolvable.

page_attribution_basis: >-
