page_attribution_basis: >-
  Two markers resolve in the Primary Source Material, both through the Pandoc AST rather than
  positionally. The page-40 marker ends the RANDOM CHARACTERS heading and the page-41 marker ends the
  RANDOM CHARACTER LANGUAGE (COMMON) TABLE heading; placement rule 1 applies each to its whole
  heading. Under the persistence rule the ancestry, class, priest spells, deity and rare language
  tables fall on page 40, and the wizard spells table, the alignment table, the GEAR subsection and
  the final gear table fall on page 41, none of which carries a marker of its own. That inheritance
  is the attribution a positional reading would get wrong, and it is why the rows below split between
  the two pages as they do. Page 42 is an empty fenced Div carrying the artwork class. A fourth page
  the parser resolves, 15, lies entirely inside the out-of-scope Supporting Source Context.

page_class_treatment: >-
  Page 42 is classified full-page-artwork by the repository source steward. Under SOURCE_MARKDOWN 1.8
  and constitution section 6 the class is page-local intake metadata and creates no node, edge,
  domain, general rule, citation or uncovered-page obligation, and a classified page inside a
  declared span is not an uncovered page. It is retained in the completeness accounting below. The
  AST confirms the Div is empty and that neither earlier page inherits the classification.

scope_boundary: >-
  The bounded scope is the Primary Source Material section, printed pages 40 through 42. The trailing
  Supporting Source Context reproduces printed page 15, whose primary packet is
  PKT-SD-015-015-stats-and-stat-modifiers, outside this packet's declared span. No assertion here is
  drawn from it and no row cites page 15.

source_summary: >-
  Printed pages 40 and 41 are an optional character generator. Three framing sentences say the tables
  may be used to generate a 0-level or 1st-level character, direct the reader to roll stats,
  background and class talents by the ordinary rules, and say to make selections where no table is
  provided. Nine rollable tables follow, covering ancestry, class, priest spells, deity, rare and
  common language, wizard spells, alignment and starting gear, and a GEAR subsection fixes what
  random characters of each starting tier carry. Page 42 is artwork. This summary is orientation
  only; every assertion below cites its page.

extraction_posture: >-
  This packet defines no mechanic. Every concept its tables enumerate is defined elsewhere and most
  are already canonical, so the question here is not which identities to mint but whether a random
  selection table creates a mechanical dependency at all. The Analyst's reading is that it does, and
  of one specific kind: each table is an alternative resolution procedure for a choice the ordinary
  rules leave to the player, which is exactly what RESOLVED_BY expresses and the same shape the
  backgrounds and titles tables were given. What the tables produce is deliberately not enumerated
  as edges; see OBS-01.
  Every row carries status optional, because the section opens by saying the tables can be used
  rather than must be. That is the first use of the optional status in this intake and it is the
  packet's most characteristic property.

graph_state_at_extraction: >-
  The Shadowdark canonical graph holds 45 registry rows after INT-20260922-002 and INT-20260922-003.
  The registry was read at extraction rather than recalled. Five identities this packet needs are
  canonical and are listed under reused_nodes with no proposal: sys_ancestry, sys_class,
  sys_alignment, sys_language and item_gear. Nine more identities it names are also canonical but are
  not used by any row here, for the reason in OBS-01, so they are neither reused nor proposed.
  Five identities it needs are not canonical and are proposed below: sys_deity, spell_priest_spells,
  spell_wizard_spells, class_priest and lang_draconic. Each is proposed by a sibling GUR or
  authorized by constitution section 2.2 or 2.3, and each records that. The domain registry is still
  empty and general_rules.json is still an empty object.

cross_packet_identity_note: >-
  sys_deity, spell_priest_spells, spell_wizard_spells and class_priest are proposed by sibling GURs
  that have not yet been integrated, and are proposed again here because rows in this patch use them
  as endpoints. A GUR must propose every endpoint its edges use unless the endpoint is canonical.
  Each ID and label is reproduced exactly from the packet that defines it, and its defining locus is
  recorded, so Reviewer can de-duplicate to a single registry addition.
  lang_draconic is not proposed by any sibling GUR. It is authorized by constitution section 2.3,
  which DEC-2026-0098 added, and its defining locus on printed page 32 is claimed but not yet
  extracted. It is proposed here because M010 needs it; see IDQ-02.

