authored_polarity_declaration: >-
  No row carries authored polarity. Constitution section 5 restricts authored polarity to MODIFIES,
  TRIGGERS and CONSTRAINS, and this packet proposes none of those: nine rows are RESOLVED_BY and one
  is EXCLUDES, which Builder derives as governs and negates respectively. No polarity or
  polarity_basis value is set by the Analyst on any row.

domains_touched: []
candidate_domains:
  - proposed: character_creation
    basis: >-
      Every table here resolves a creation-time choice. Recorded as a candidate only; now suggested
      by a ninth packet, which is noted and deliberately not treated as promotion. Constitution
      section 8 reserves promotion to an Architect Decision and the Analyst does not decide a
      candidate domain is official.

domain_boundary_questions:
  - >-
    An optional generator sits oddly in any domain: it touches ancestry, class, alignment, deity,
    language, spells and gear without belonging to any of them. Whether optional procedures form
    their own domain cannot be settled here. Deferred; no domain is asserted on any edge.

candidate_general_rules:
  - proposed: a character choice with a random table may be resolved by rolling on it
    establishing_locus: 'SD pages 40 and 41, the nine random character tables'
    basis: >-
      Nine rows repeat one shape exactly, and the framing sentence generalises it in the source's own
      words by saying to make selections where no table is provided. If approved, the nine explicit
      rows could become derived applications and any later optional table would be covered.
    not_applied: >-
      Recorded as a candidate only. Constitution section 5 requires a separate Architect ruling with
      an establishing locus, scope, counterexamples and affected set before a general rule exists,
      and the Analyst is prohibited from promoting one. A counterexample is visible on the page
      itself and is why the Analyst is not confident: stats, background and class talents also have
      tables, and the framing sentence sends the reader to roll those by their ordinary rules rather
      than on a table here, so the rule would need to distinguish a generator table from an ordinary
      one. No edge in this GUR sets general_rule_id.

non_edge_observations:
  - id: OBS-01
    subject: what the tables produce is deliberately not enumerated as edges
    detail: >-
      The ancestry table's six rows are the six canonical ancestries, the class table's four rows are
      the four classes, the alignment table's three rows are the three alignments and the deity
      table's seven rows are the seven authorized deities. Every one of those identities exists, and
      twenty rows could be written from table to outcome.
      None is. The closed section 3 vocabulary has no produces or selects type, and no legal type
      means it: RESOLVED_BY reversed would say an ancestry is resolved by a table that merely lists
      it among six, GATES would say the table is a precondition for the ancestry existing, and
      FEEDS_INTO would say the table supplies an input to it. Each asserts something false.
      What the page mechanically adds is that the choice may be made by rolling, and the nine
      axis-level rows carry exactly that. The consequence is recorded plainly: a query for which
      ancestries the random table can produce returns nothing, and the enumeration lives only in the
      immutable packet. Nine canonical identities named on these pages are therefore neither reused
      nor proposed, because no row uses them and an unused node is an orphan.
  - id: OBS-02
    subject: seventeen named spells are not proposed
    detail: >-
      The priest table names five spells and the wizard table twelve, all in italics. They are
      source-named and bounded, which is ordinarily what makes an identity proposable, and the
      spell_ prefix is approved.
      None is proposed. This packet is not their defining locus: the contents list places the priest
      and wizard spell lists on printed pages 51 and 52 and the Spells chapter beyond, and
      SOURCE_MARKDOWN Source Identity Authority names a selection table as exactly the kind of
      secondary listing that cannot name a concept defined elsewhere. Proposing seventeen spells from
      a generator table would also fix seventeen spellings from the wrong place. M008 and M009 assert
      the relationship at the family level, which is what this page supports.
  - id: OBS-03
    subject: the fixed 1st-level loadout is not asserted
    detail: >-
      The GEAR subsection says a random 1st-level character has a crawling kit, one weapon, leather
      armor if they can wear it, and a stated sum of gold. This is a genuine rule and a real
      alternative to the ordinary starting gear on printed page 33, which gives a 1st-level character
      rolled gold to buy equipment instead of a fixed kit.
      It is not asserted, for two reasons that both point the same way. Its components,
      tbl_crawling_kit, item_leather_armor and item_coin, are identities proposed by
      GUR-PKT-SD-033-037 that are not yet canonical, and the ordinary starting gear rows they would
      have to relate to are asserted in that same GUR; expressing the substitution here would state
      a relationship between two rules whose own assertions live in another packet and have not been
      through Review. The one weapon is also unspecified, so no weapon identity applies.
      The substitution is worth capturing and the Analyst expects to return to it. Once the gear
      packet is integrated, either a successor revision here or a revision there can assert it with
      the identities settled. Recorded so the omission is visibly deferred rather than missed.
  - id: OBS-04
    subject: two reroll outcomes are not extractable
    detail: >-
      The priest spells table's highest row and the common language table's highest row both read
      Reroll. A reroll outcome names no mechanic and produces no result; it is an instruction about
      using the table, and an edge would have to point at the table itself. Not extracted.
      This is deliberately treated differently from the Draconic reroll in M010, which is not a bare
      reroll outcome but a conditional exclusion attached to a named language for a named class, and
      which therefore does relate two identities.
  - id: OBS-05
    subject: the framing sentences point at three mechanics resolved elsewhere
    detail: >-
      The opening directs the reader to roll stats, background and class talents as normal, citing
      printed pages 15, 26 and 20 to 24. All three already have resolution rows asserted from their
      own defining loci: stat generation in GUR-PKT-SD-015-015, the backgrounds table in
      GUR-PKT-SD-026-026, and the four class talents tables in the four class GURs. Repeating any of
      them here would duplicate an existing assertion, and in the background case would collide under
      the constitution section 4 assertion key. The third sentence, to make selections where no table
      is provided, states a default rather than a dependency.
  - id: OBS-06
    subject: The Lost is absent from the deity table, consistently with the ruling
    detail: >-
      The random deity table has seven rows and names exactly the seven deities constitution section
      2.2 authorizes. The Lost, which has its own heading on printed page 29, is not among them.
      Recorded because it is independent source evidence for the ruling's reasoning: section 2.2
      holds that The Lost denotes two unnamed deities rather than one identity, and a generator table
      that must yield a usable result omits it. Nothing is asserted from this; it is corroboration of
      a decision already made, not a new reading.
  - id: OBS-07
    subject: magnitudes deliberately excluded
    detail: >-
      The pages carry a die expression and row bands for each of the nine tables, the count of
      starting items for a 0-level character, and the gold sum for a 1st-level one. All are die
      expressions, index values, counts or currency amounts, excluded by constitution section 1 and
      invariant 11. They remain in the immutable claimed packet, which is the authority for the values
      themselves. No aspect in this GUR contains a digit, and the one condition naming a level spells
      it in words rather than encoding a threshold.
  - id: OBS-08
    subject: the packet manifest declares an earlier constitution version
    detail: >-
      packet.yaml for this packet records constitution_version 1.4, which was current when the packet
      was claimed a few minutes before DEC-2026-0100 advanced the Constitution to 1.5. This GUR
      declares 1.5 and was validated against it.
      The manifest is left exactly as published. Constitution section 9 says not to rewrite immutable
      packet manifests merely for an additive bump, and DEC-2026-0100 says the same of GURs. The
      discrepancy affects no assertion: the manifest's authority is over page attribution, source
      identity and composition, none of which changed between 1.4 and 1.5, whose only effect was to
      move the historical version list into the ruleset manifest.
  - id: OBS-09
    subject: packet wrapper and supporting context
    detail: >-
      The supplied file opens with an intake wrapper ahead of the Primary Source Material heading,
      for which the claim manifest is the independent page locator SOURCE_MARKDOWN Attribution Rules
      requires; it contains no rulebook prose, heading or marker. The trailing Supporting Source
      Context reproduces printed page 15 and is orientation only, contributing nothing here.

unresolved_identity_questions:
  - id: IDQ-01
    subject: the gear table's printed heading does not distinguish it
    detail: >-
      Eight tables on these pages carry headings beginning RANDOM CHARACTER and naming their subject.
      The ninth, the gear table, is headed simply RANDOM CHARACTER TABLE. Taken literally that
      heading would be the source name for a table of gear, which is misleading, and it collides in
      spirit with the eight siblings.
      The Analyst proposed tbl_random_gear with the label Random Character Gear Table and marked the
      node source_named false, recording that the label is Analyst-supplied. Reusing the printed
      heading verbatim would produce an identity whose name does not say what it resolves, and
      SOURCE_MARKDOWN gives the packet authority over spelling for mechanics it explicitly names,
      which this heading arguably fails to do for its own content.
      Consequence if wrong: if Reviewer prefers the printed heading, the label changes and the ID may
      follow; one row repoints and nothing else changes. Recorded rather than decided quietly,
      because it is the one place in this packet where the Analyst did not take the source's own
      wording.
  - id: IDQ-02
    subject: lang_draconic is proposed from a secondary mention
    detail: >-
      lang_draconic is authorized by constitution section 2.3 and its defining locus is the rare
      languages table on printed page 32, which this Analyst has claimed but not yet extracted. It is
      proposed here from a generator table row, which is a secondary mention.
      The Analyst proposed it because M010 needs an endpoint and a GUR must propose every endpoint it
      uses that is not canonical, and because the exclusion it carries is the only non-routine rule
      on these pages and would otherwise be lost. The ID and label are taken from section 2.2's
      enumeration rather than derived from this mention, so no spelling is being fixed from the wrong
      locus.
      Consequence if wrong: when printed page 32 is extracted it will propose the same identity from
      its defining locus, and Reviewer de-duplicates to one registry addition, which is the ordinary
      path. If that packet is extracted first, this proposal becomes redundant and harmless.

architectural_escalations: []
architectural_escalation_note: >-
  None raised. Every proposed node uses an approved constitution section 2 prefix with an unchanged
  kind, including lang_ under section 2.3 and sys_ for the deity axis, every edge uses one of the
  thirteen legal section 3 types, and no new prefix, edge type, domain promotion or general-rule
  application is requested. ESCALATION_CONTRACT states that a proposed node under an approved prefix
  and kind which passes identity and duplicate checks is ordinary GUR, GUP and Review work rather
  than an escalation. IDQ-01 and IDQ-02 are recorded for Reviewer on that basis.
  Unrelated to this packet's content: the Analyst raised ESC-2026-09-23T11.55.59.428Z earlier today
  on which constitution versions an incoming GUR may declare, after finding every active GUR leaf
  uncompilable. It was decided as DEC-2026-0100, which moved the historical list into
  rulesets/shadowdark/ruleset.yaml and advanced the Constitution to 1.5. This GUR was staged
  declaring 1.4 and was updated to 1.5 before publication, which is not a reissue: it had not been
  published, and DEC-2026-0100 prohibits reissuing a published GUR solely to advance its version.

completeness_statement: >-
  All three printed pages in the declared span are accounted for. Page 40 was read in full: the
  RANDOM CHARACTERS heading, all three framing sentences dispositioned in OBS-05, and the ancestry,
  class, priest spells, deity and rare language tables with their headings, column headings and every
  row, supplying M001, M002, M004, M006, M008 and M010. Page 41 was read in full: the common
  language, wizard spells and alignment tables supplying M003, M005 and M009, the GEAR subsection
  with both starting-tier statements of which the 0-level one supplies M007 and the 1st-level one is
  dispositioned in OBS-03, and the final gear table with all twelve rows. Page 42 is the steward's
  full-page-artwork page.
  Every page marker was resolved through the Pandoc AST and the in-scope resolved page set matches
  the declared span with no gap; the four blocks that inherit page 41 under the persistence rule are
  named in page_attribution_basis. The Supporting Source Context reproducing printed page 15 is out
  of scope and contributed nothing. Ten edges are proposed across fourteen candidate nodes, with five
  canonical nodes reused rather than proposed; this is the first extraction in the intake to reuse
  canonical identities. Content not converted to an edge is accounted for in OBS-01 through OBS-09,
  in particular the twenty table outcomes and seventeen named spells that are deliberately not
  enumerated, and the two questions the Analyst could not settle are recorded in IDQ-01 and IDQ-02
  rather than resolved silently. No assertion depends on any other ruleset.
