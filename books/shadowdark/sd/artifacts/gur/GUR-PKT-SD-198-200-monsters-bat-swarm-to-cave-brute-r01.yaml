rejected_candidates:
  - text_locus: 'Crush, pp198 (twice) and Gore, p199'
    quoted_gist: >-
      an extra die of damage for hitting the same target with both claws, repeated verbatim on
      two bears, and the boar's tusk equivalent under a different name
    why_considered: >-
      The densest within-packet recurrence of one ability shape yet seen, tested against the
      locus rule rather than assumed excluded by precedent alone.
    rejection_reason: >-
      A stat-block description under constitution 2.5 for each of the three instances
      individually; the extra die is a magnitude. See recurrence_note.
  - text_locus: 'Thick Fur, p198'
    quoted_gist: 'the polar bear is cold immune'
    why_considered: 'Verbatim repeat of Ape, Snow''s ability from two packets ago.'
    rejection_reason: 'A stat-block description, for the same reason as its first occurrence.'
  - text_locus: 'Brutal, p198'
    quoted_gist: 'the beastman deals a stated bonus damage with melee weapons'
    why_considered: >-
      cbt_melee_attack is canonical and the ability names it directly.
    rejection_reason: >-
      A stat-block description stating this creature's own attack bonus, the same ground as
      every other creature's listed attack bonus since printed page 194; the bonus is a
      magnitude and cbt_melee_attack's existing machinery already covers melee attacks generally.
  - text_locus: 'Rage, p199'
    quoted_gist: >-
      once a day, the berserker becomes immune to morale checks and deals bonus damage for a
      stated duration
    why_considered: 'Verbatim repeat of Badger''s ability from the preceding packet, naming rule_morale directly.'
