source_summary: >-
  Twelve monster stat blocks spanning Bat, Swarm to Cave Brute. This page shows the chapter's
  first dense verbatim recurrence of named abilities: Rage repeats Badger's ability from the
  preceding packet exactly, on Berserker; Crush repeats itself verbatim between Bear, Brown and
  Bear, Polar, and Boar's Gore shares its shape under a different name; Thick Fur repeats Ape,
  Snow's text exactly, on Bear, Polar; and Impervious repeats Azer's name, though not its
  meaning, on Black Pudding.

