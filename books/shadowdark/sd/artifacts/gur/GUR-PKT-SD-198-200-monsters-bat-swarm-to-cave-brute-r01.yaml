non_edge_observations:
  - id: OBS-01
    subject: verbatim recurrence does not graduate an ability to a shared locus
    detail: >-
      Rage, Crush and Thick Fur each repeat word for word across creatures, the first time this
      chapter has shown exact textual recurrence rather than merely similar shape. All three
      remain excluded, individually, because constitution 2.5's boundary is about where a
      description is printed, not how many times the same words appear across the book. A future
      ruling could decide that a trait repeated enough times warrants a shared identity, the way
      Dark-Adapted's own class-wide statement did, but that would need the source to say so
      generally, not merely to repeat itself. See recurrence_note for the full accounting.
  - id: OBS-02
    subject: a shared name across creatures can carry a different, even opposite, meaning
    detail: >-
      Impervious means fire immune on the Azer and harmed only by fire on the Black Pudding,
      which is closer to the reverse. This is independent evidence that ability names in this
      chapter are flavour labels chosen per creature rather than references to a fixed mechanic,
      reinforcing the locus test rather than merely being consistent with it.
  - id: OBS-03
    subject: an exact label match to a registered identity is not the same identity
    detail: >-
      Bugbear's Stealthy exactly matches abil_stealthy's label, the Halfling ancestry benefit,
      and states an unrelated mechanic. Every prior name collision in this chapter has been
      against ordinary English; this is the first against a real, registered identity, and
      confirms that constitution section 2's labels do not determine identity applies as firmly
      inside the monster chapter as it did when ancestries and languages were authorised. See
      label_collision_note.
  - id: OBS-04
    subject: the chapter's first leading-content packet since the spells chapter
    detail: >-
      This packet's first four creatures carry no marker and continue PKT-SD-196-198's final
      page under the rule first applied at PKT-SD-062-065. The derivation is recorded in the
      packet manifest rather than here, and is flagged for Reviewer as a shared-page citation,
      not a content overlap. Recorded because the monster chapter's longer per-page creature
      count makes this split more likely to recur than it did in the spells chapter.

