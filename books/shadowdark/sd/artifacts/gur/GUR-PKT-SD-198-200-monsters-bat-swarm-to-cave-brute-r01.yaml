  from the registry before use.

stat_block_boundary_note: >-
  The test settled at PKT-SD-194-194 and confirmed at the two following packets is applied
  without modification: a stat-block description is excluded under constitution 2.5 regardless
  of what it references or how many other creatures carry the same text, because the exclusion
  is about each instance's own locus. Verbatim repetition does not convert an instance into a
  shared-locus statement, which requires one mechanic named once at a place the source presents
  as covering a class, the way Dark-Adapted does; it is evidence that the designer reused a
  standard trait, not evidence that the source states it generally. See recurrence_note.

recurrence_note: >-
  This packet is the densest recurrence the chapter has shown and is worth recording in full
  rather than per rejected candidate.
  Rage, verbatim, appears a second time: Badger carried it in the preceding packet and Berserker
  carries it here, word for word, including the immune to morale checks clause that names
  rule_morale. Crush appears twice within this single packet, verbatim, on Bear, Brown and Bear,
  Polar, and Boar's Gore restates the same shape, extra damage for hitting with both of a
  paired natural weapon, under a third name. Thick Fur repeats Ape, Snow's exact text on Bear,
  Polar. None of these is stated once at a shared locus; each is printed under its own creature's
  own block, so each remains excluded individually under the same test.
  Impervious is the sharper case: the name repeats from Azer, but the meaning does not. Azer is
  immune to fire; Black Pudding is harmed only by fire, which is closer to the opposite effect.
  A shared name across two creatures does not imply a shared mechanic even when the name is
  identical, which is independent evidence for the locus test: if ability names tracked a real
  shared identity, two creatures sharing a name would be expected to share an effect, and these
  do not.

label_collision_note: >-
  Bugbear's Stealthy is the sharpest label test the chapter has produced, because it matches an
  already-registered identity exactly rather than colliding with ordinary English. abil_stealthy
  is canonical as the Halfling ancestry benefit, authorised under DEC-2026-0087, and GATES to
  rule_invisibility on limited-use access. Bugbear's Stealthy states advantage on checks to
  sneak and hide, a different and unrelated mechanic. Constitution section 2 states that labels
  do not determine identity; this is the clean instance of that rule inside the monster chapter,
  and the two must never be merged or connected by any row. The ability is declined on the
  ordinary stat-block-description ground in any case, so no row depends on resolving the label
  question, but the distinction is recorded because a future packet or reviewer could otherwise
  read the shared label as a shared identity.

