page_attribution_basis: >-
  Two markers resolve in the Primary Source Material, both through the Pandoc AST rather than
  positionally. {#p18} ends the FIGHTER CLASS heading, which placement rule 1 applies to the whole
  heading, and the persistence rule carries page 18 through every following block including the
  benefits, the talents table and its five rows, and the closing epigraph. Page 19 is an empty fenced
  Div carrying the artwork class. Every row below therefore cites page 18. A third page the parser
  resolves, 15, lies entirely inside the out-of-scope Supporting Source Context.

page_class_treatment: >-
  Page 19 is classified full-page-artwork by the repository source steward. Under SOURCE_MARKDOWN 1.8
  and constitution section 6 the class is page-local intake metadata and creates no node, edge,
  domain, general rule, citation or uncovered-page obligation, and a classified page inside a
  declared span is not an uncovered page. It is retained in the completeness accounting below. The
  AST confirms the Div is empty and that page 18 does not inherit the classification.

scope_boundary: >-
  The bounded scope is the Primary Source Material section, printed pages 18 and 19. The trailing
  Supporting Source Context reproduces printed page 15, STATS and the STAT MODIFIERS TABLE, whose
  primary packet is PKT-SD-015-015-stats-and-stat-modifiers. The parser resolves those spans to page
  15, outside this packet's declared span. No assertion here is drawn from them and no row cites page
  15, so the zero-overlap rule across the intake holds for this packet.

source_summary: >-
  Printed page 18 is the complete fighter class entry: a heading, a flavour sentence, three
  attribute lines giving permitted weapons, permitted armor and a hit point die per level, three
  separately named and bolded class benefits, a five-row rollable talents table, and an attributed
  epigraph. Page 19 is artwork. This summary is orientation only; every assertion below cites page 18.

graph_state_at_extraction: >-
  The Shadowdark canonical graph is still empty; nodes.csv is header-only, the domain registry has no
  domains, general_rules.json is an empty object, and character_races.yaml is inactive. The three
  supplied slices named in the packet manifest as missing remain immaterial, re-assessed here rather
  than carried over from claim: there is no canonical identity to match, no neighborhood to compare
  for redundancy or contradiction, and no approved general rule to apply. reused_nodes is empty.
  Twelve of the seventeen identities below are already proposed by sibling GURs from their defining
  loci and are marked as such.

cross_packet_identity_note: >-
  item_armor, rule_hit_points, rule_gear_capacity, rule_talent_roll, cbt_armor_class, exp_level,
  abil_strength, abil_dexterity, abil_constitution, cbt_attack_roll, cbt_damage_roll and rule_check
  are proposed by sibling GURs from their defining loci and are proposed again here because this
  patch uses them as edge endpoints. A GUR must propose every endpoint its edges use: an endpoint
  present only in a sibling GUR is not canonical, is not proposed by the patch, and fails invariant 1
  as endpoint_unresolved. Proposing them is not a competing naming; each records its defining locus
  and the sibling GUR that also proposes it, and each ID and label is reproduced exactly. Where two
  patches propose one identity, Reviewer de-duplicates and the Integrator applies a single registry
  addition.

