authored_polarity_declaration: >-
  Ten rows carry authored polarity, all with basis read: M001 CONSTRAINS governs, and M006, M008,
  M009, M011, M014, M015, M016, M017 and M018 MODIFIES improves. Every one is among the three types
  constitution section 5 requires to carry source-reviewed authored polarity, and each was read aloud
  as source polarity target before being recorded. No row uses basis heuristic or unset. No other row
  carries a polarity or polarity_basis value: the three GATES rows, the four FEEDS_INTO rows and the
  one RESOLVED_BY row take their derived polarity from the section 5 table and the Analyst authors
  none of them. Every improves reading is one-directional in the source; no row on this page can
  worsen the mechanic it targets.

domains_touched: []
candidate_domains:
  - proposed: character_creation
    basis: >-
      A class is chosen at creation and its permissions and benefits are received then. Recorded as a
      candidate only; the domain registry is empty and constitution section 8 reserves promotion to
      an Architect Decision. This is now the third packet to suggest this candidate, which is noted
      and is deliberately not treated as promotion.
  - proposed: combat
    basis: >-
      Weapon Mastery, the attack and damage rolls, armor class and permitted armor all sit in combat
      rather than creation, and the class entry mixes the two freely. Recorded as a candidate only,
      and not promoted.

domain_boundary_questions:
  - >-
    A class entry deliberately spans creation, combat and carrying capacity, so whether a class node
    belongs to one domain or to each domain it reaches cannot be settled from this page. Deferred; no
    domain is asserted on any edge in this GUR.

candidate_general_rules:
  - proposed: every class gates the benefits printed in its own entry
    establishing_locus: 'SD page 18, the Hauler, Weapon Mastery and Grit benefits inside the FIGHTER CLASS entry'
    basis: >-
      M003, M004 and M005 repeat one shape, and the contents list shows three further class entries
      on printed pages 20 to 25 that are likely to repeat it again. The ancestries packet recorded a
      structurally identical candidate for ancestry benefits.
    not_applied: >-
      Recorded as a candidate only. Constitution section 5 requires a separate Architect ruling with
      an establishing locus, scope, counterexamples and affected set before a general rule exists,
      and the counterexamples cannot be assessed until the other three class entries are read. No
      edge in this GUR sets general_rule_id, and under invariant 19 the establishing edges would
      leave it empty in any case.
  - proposed: every class resolves its talent roll on its own talents table
    establishing_locus: 'SD page 18, FIGHTER TALENTS TABLE'
    basis: 'M012 is the fighter instance; three further class entries are likely to supply the same shape.'
    not_applied: >-
      Recorded as a candidate only, on one class entry. Deliberately not promoted, and no edge sets
      general_rule_id.

non_edge_observations:
  - id: OBS-01
    subject: the permitted weapons line is not extracted, unlike the armor line
    detail: >-
      The entry's Weapons line reads All weapons, and the parallel Armor line reads All armor and
      shields. The armor line is extracted as M001 because item_armor already exists as an identity
      proposed from its defining locus on printed page 13. No comparable weapon identity exists: the
      constitution's weapon_ prefix covers a weapon identity or weapon family, and All weapons is
      neither, being a statement that no restriction applies. Minting a node to carry the absence of
      a restriction would put an artifact of this one class entry into the registry.
      The relationship is real and is deliberately deferred rather than dropped: the Weapons chapter
      on printed page 292 and the Gear section on printed page 34 are the defining loci, and the
      packet that claims them should assert class weapon permissions with the identities it defines.
      Recorded so the omission is visibly a decision rather than an oversight.
  - id: OBS-02
    subject: this page's class rows coexist with the class-axis rows from the overview packet
    detail: >-
      GUR-PKT-SD-011-014 asserts, from printed pages 12 to 14, that the class axis constrains armor,
      feeds hit points and feeds talents, using sys_class as the source. This GUR asserts the
      fighter-specific versions using class_fighter. They do not collide under the section 4
      assertion key because the source_id differs, and they are not redundant: the axis rows record
      that a character's class determines these things at all, and these rows record what this
      particular class determines. Recorded because a reader meeting both may suspect duplication.
      Whether the axis rows should later be withdrawn in favour of per-class rows, once all four
      classes are read, is a question for Reviewer and ultimately for the packet that completes the
      set; the Analyst does not pre-empt it from one class entry.
  - id: OBS-03
    subject: advantage is the mechanism behind Grit and is still not extractable
    detail: >-
      Grit grants advantage on certain checks. Advantage is defined on printed page 9 as rolling
      twice and taking the better result, but that page states no relationship between advantage and
      any other named mechanic, so the introduction packet deliberately did not propose it. This is
      now the third packet whose content depends on advantage, after the ancestries packet's Stout
      benefit and the introduction packet's own definition.
      M011 therefore asserts the effect, Grit improving the check, rather than the mechanism, Grit
      granting advantage. That is the assertion this page supports without inventing an identity the
      source has not yet given a relationship to. The Rolling the Dice chapter on printed page 78 is
      the defining locus, and the packet claiming it should propose advantage and let these three
      benefits be repointed through it if Reviewer prefers the mechanism to the effect.
  - id: OBS-04
    subject: the Grit stat choice is recorded in a condition rather than as edges
    detail: >-
      Grit is keyed to either Strength or Dexterity, chosen by the player. M011 carries this as the
      condition for the chosen stat rather than as two rows targeting the two stats, because the
      benefit modifies the check, not the stat: whichever stat is chosen, what changes is how checks
      of that type resolve. Two stat-targeted rows would assert that Grit changes Strength or
      Dexterity, which the source does not say. This differs deliberately from M015 through M017,
      where the talents row does raise the stat itself and three rows are therefore correct.
  - id: OBS-05
    subject: the final talents table row is a choice with no fixed target
    detail: >-
      The highest outcome row reads Choose a talent or points to distribute to stats. Its first
      branch refers back to the table it is printed in, and its second distributes an unspecified
      number of points across unspecified stats. Neither branch names a determinate target, so no
      edge can be drawn without the Analyst choosing one. The stat-raising row that does name its
      three candidate stats is extracted as M015 through M017; this row is not. Recorded so the
      asymmetry between the two rows is visibly deliberate.
  - id: OBS-06
    subject: flavour and epigraph carry no mechanics
    detail: >-
      The entry opens with a sentence about gladiators, duelists and elven archers and closes with an
      attributed epigraph about a whistling axe. Both establish tone. They name no mechanic and state
      no dependency, and striking them would require no mechanic to be reviewed. The epigraph's
      speaker is a character in an anecdote, and the dwarf ancestry it mentions is not being related
      to the fighter class by that mention.
  - id: OBS-07
    subject: magnitudes deliberately excluded
    detail: >-
      The page carries the hit point die, the Weapon Mastery attack and damage bonus, the level
      fraction and its rounding, the talents table's die expression and all five of its row ranges,
      the attack bonus, the stat increase, the armor class bonus and the distributable points. All
      are die expressions, numeric bonuses or thresholds, excluded by constitution section 1 and
      invariant 11. They remain in the immutable claimed packet, which is the authority for the values
      themselves. No aspect in this GUR contains a digit and no condition encodes a numeric value.
  - id: OBS-08
    subject: supporting source context reproduces another packet's page
    detail: >-
      The trailing Supporting Source Context reproduces printed page 15, STATS and the STAT MODIFIERS
      TABLE, whose primary packet is PKT-SD-015-015. The parser resolves those spans to page 15,
      outside this packet's declared span of 18 to 19. It is orientation only; no assertion here is
      drawn from it and no row cites page 15.

unresolved_identity_questions:
  - id: IDQ-01
    subject: whether a class benefit and an ancestry benefit share the abil_ kind appropriately
    detail: >-
      Hauler, Weapon Mastery and Grit are proposed under abil_ with kind ability, the same prefix and
      kind constitution section 2.1 assigns to the six ancestry benefits. That section settles the
      ancestry case explicitly and says independently named mechanical benefits use the existing
      abil_ kind; it does not speak to class benefits, but the reasoning transfers directly and no
      other approved prefix fits a named benefit.
      Consequence if wrong: if class benefits later warrant their own kind, these three and their
      counterparts in the remaining class entries would need a kind migration, which is a registry
      change rather than a re-reading of source. The Analyst chose consistency with the settled
      ancestry case over minting a distinction the constitution has not drawn.
      This is not an Architect escalation: abil_ is an approved prefix with an unchanged kind, so
      these are ordinary registry additions under ESCALATION_CONTRACT.
  - id: IDQ-02
    subject: the talents table is proposed per class rather than as one shared table
    detail: >-
      tbl_fighter_talents is scoped to this class because the table is printed inside the class entry
      under its own class-specific heading. The alternative, one shared talents table with per-class
      rows, cannot be assessed from this packet: the other three class entries have not been read and
      the contents list does not show a shared table.
      Consequence if wrong: if the remaining entries turn out to share one table, four per-class
      identities would need merging into one, which is a v2-style merge migration. The Analyst
      followed the source's own division, since the heading names this table as the fighter's.
      Reviewer should revisit once the priest, thief and wizard entries are extracted.

architectural_escalations: []
architectural_escalation_note: >-
  None raised. Every proposed node uses an approved constitution section 2 prefix with an unchanged
  kind, every edge uses one of the thirteen legal section 3 types, and no new prefix, edge type,
  domain promotion or general-rule application is requested. class_ is the approved prefix for a
  character class and section 2.1 confirms that class identity is distinct from ancestry and creature
  identity, so class_fighter is an ordinary proposal from its defining locus. ESCALATION_CONTRACT
  states that a proposed node under an approved prefix and kind which passes identity and duplicate
  checks is ordinary GUR, GUP and Review work rather than an escalation. IDQ-01 and IDQ-02 are
  recorded for Reviewer on that basis, and the deferrals in OBS-01 and OBS-03 resolve when the
  relevant defining packets are claimed.

