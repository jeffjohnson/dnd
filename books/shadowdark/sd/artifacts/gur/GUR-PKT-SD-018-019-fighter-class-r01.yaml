  Both printed pages in the declared span are accounted for. Page 18 was read in full: the FIGHTER
  CLASS heading, the flavour sentence in OBS-06, the Weapons line in OBS-01, the Armor line supplying
  M001, the Hit Points line supplying M002, the Hauler benefit supplying M006 and M007, the Weapon
  Mastery benefit supplying M008 through M010, the Grit benefit supplying M011 with its stat choice
  in OBS-04, the FIGHTER TALENTS TABLE heading and column headers supplying M012, all five table rows
  of which four supply M013 through M018 and the fifth is dispositioned in OBS-05, and the closing
  epigraph in OBS-06. Page 19 is the steward's full-page-artwork page. Every page marker was resolved
  through the Pandoc AST and the in-scope resolved page set matches the declared span with no gap.
  The Supporting Source Context reproducing printed page 15 is out of scope and contributed nothing.
  Eighteen edges are proposed across seventeen candidate nodes, twelve of which are also proposed by
  sibling GURs from their defining loci and are marked as such. No node is reused because the
  Shadowdark graph is empty. Content not converted to an edge is accounted for in OBS-01 through
  OBS-08, and every identity the Analyst could not settle is recorded in IDQ-01 and IDQ-02 rather
  than resolved by picking a plausible ID. No assertion depends on any other ruleset.
