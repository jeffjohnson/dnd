rejected_candidates:
  - text_locus: 'ARMOR CLASS, p189'
    quoted_gist: 'just like characters, monsters have an AC that denotes how difficult it is to harm them'
    why_considered: >-
      cbt_armor_class is canonical with 12 rows and the sentence names it directly.
    rejection_reason: >-
      It states scope, not dependency. The sentence says who has AC, not what AC depends on or
      what depends on it, and it says so by comparison with characters. Striking it would leave
      cbt_armor_class and all 12 of its rows unchanged, which is the core test failing cleanly.
      Six of this page's eight subsections fail in exactly this way and each is recorded
      separately rather than as one block, because a reader should be able to see that each was
      considered.
  - text_locus: 'ATTACKS, p189'
    quoted_gist: >-
      most monsters can make one or two attacks per turn, but some can make more, and attack
      bonuses and damage are listed for each
    why_considered: >-
      cbt_attack_roll has 27 rows, rule_damage 25 and rule_turn is canonical, so three identities
      are named in one sentence.
    rejection_reason: >-
      Scope and a magnitude. The number of attacks is a quantity and no field may store one; the
      hedge most and the exception some can make more confirm the sentence is describing a range
      rather than stating a rule. Listed for each points at the stat blocks, which are later
      packets and not this locus.
  - text_locus: 'MOVEMENT, p189'
    quoted_gist: >-
      monsters can typically move near each turn, some can move other distances, and a special
      mode such as flying or swimming is noted after the distance
    why_considered: >-
      ex_movement has 22 rows, rule_distance CONSTRAINS it already, and rule_swimming is
      canonical, so a movement row looked available.
    rejection_reason: >-
      Typically is a hedge over a default value and near is a distance band, which
      rule_distance CONSTRAINS ex_movement already carries from printed page 85. Nothing here
      states a new dependency; it states what a stat block prints.
  - text_locus: 'STAT MODIFIERS, p189'
    quoted_gist: >-
      monsters have modifiers listed for Strength, Dexterity, Constitution, Intelligence, Wisdom
      and Charisma
    why_considered: >-
      Seven canonical identities are named in one sentence, abil_stat_modifier and the six
      stats, which is the densest naming on the page.
    rejection_reason: >-
      Scope. abil_stat_modifier FEEDS_INTO rule_check is canonical from printed page 9 and is
      unconditioned, so it already covers a monster's modifiers. The sentence adds that monsters
      have them, which is not a dependency between mechanics.
  - text_locus: 'ALIGNMENT, p189'
    quoted_gist: >-
      all monsters have a typical alignment for their species, and an individual monster might
      have a different one
    why_considered: >-
      sys_alignment is canonical with 13 rows and the three alignment_ identities exist under
      DEC-2026-0093.
    rejection_reason: >-
      Constitution section 2.4 keeps alignment membership out of the graph and names
      sys_alignment explicitly as something no classification row may point at. The sentence is
      membership and nothing else: it states no effect of a monster's alignment on any mechanic.
      The species qualifier is also a grouping the graph has no identity for.
  - text_locus: 'the two restated spellcasting rules, p189'
    quoted_gist: >-
      a natural 1 on an INT or CHA spell sends the caster to the Wizard Mishap tables at printed
      page 46, and a natural 1 on a WIS spell incurs penance
    why_considered: >-
      Four canonical identities are named and one carries an explicit printed page pointer,
      which is the shape that earned a CROSS_REFERENCES row at PKT-SD-178-179.
    rejection_reason: >-
      Both relations are already canonical from their own defining locus at printed page 45:
      rule_critical_failure TRIGGERS each of the three wizard mishap tables on mishap roll, and
      TRIGGERS rule_penance on priest spell loss. Both are unconditioned as to who is casting, so
      they already cover monsters, and the page's opening instruction to treat monster
      spellcasting the same as character spellcasting is exactly why. A pointer earns a row when
      the relation it names is not already carried; here it is carried, so re-asserting from
      page 189 would duplicate a canonical assertion from a restatement.
  - text_locus: 'treat monster spellcasting the same as character spellcasting, p189'
    quoted_gist: 'the opening sentence of the SPELLCASTING subsection'
    why_considered: >-
      It is the page's only sentence that equates two things outright, and ALTERNATIVE_TO is the
      vocabulary's equivalence type.
    rejection_reason: >-
      ALTERNATIVE_TO means mutually exclusive or substitutable options, not identity of subject.
      The sentence says monster spellcasting is the same mechanic, not an alternative to it, and
      there is no second identity for monster spellcasting to be alternative to. It is the
      instruction that makes the two restatements above redundant rather than an assertion of
      its own.
  - text_locus: 'the CON half of the hit point calculation, p189'
    quoted_gist: 'and adding its CON modifier, with a stated minimum'
    why_considered: >-
      abil_constitution is canonical and the sentence states that it feeds the calculation.
    rejection_reason: >-
      abil_constitution FEEDS_INTO rule_hit_points on hit point value is canonical from printed
      page 14 and carries no condition, so it already covers a monster's hit points. The stated
      minimum is a magnitude. Only the monster level half of this sentence is a new assertion,
      and that is the row the escalation blocks.
  - text_locus: 'blinding or deafening still hinders a monster, p189'
    quoted_gist: 'the closing sentence of the DARK-ADAPTED subsection'
    why_considered: >-
      It bounds the dark-adapted ability, so it looked like a condition on D001 or a row of its
      own.
    rejection_reason: >-
      There is no identity for a blinded or deafened state and none may be minted from a
      limiting clause; the registry holds no condition or status identity of any kind. The
      sentence also does not limit what D001 asserts, which is only that darkness penalties are
      ignored, so it is not a condition on that row either. Recorded because the absence of a
      status vocabulary will recur across the monster chapter.

non_edge_observations:
  - id: OBS-01
    subject: six of eight subsections state scope, and that is the page's real shape
    detail: >-
      Six subsections say that monsters have an attribute the graph already holds, and each is
      declined separately above. It is worth stating the pattern once as well: this page is a
      reader's guide to a stat block, not a rules page, and its function is to tell you what the
      abbreviations in the next eighty pages mean.
      That matters for the escalation's second question. If a stat block's printed values are
      not graph content, this page is almost entirely apparatus and the chapter after it is
      mostly creature identities and named abilities. If they are, this page is the legend for
      roughly five hundred rows. The Analyst cannot tell which from the page itself, which is
      why it is asked rather than assumed.
  - id: OBS-02
    subject: the same bold mark means the opposite of what it meant one packet ago
    detail: >-
      PKT-SD-187-188 bolded six words in fiction and the GUR argued they were prose emphasis,
      with the tell being that the bolded set included words that are not mechanics in any
      reading. This page bolds nine terms and every one is a defined stat abbreviation printed
      in the stat blocks that follow.
      So bolding is evidence of a defined term in rules text and evidence of nothing in
      narrative, and the two packets are adjacent. Recorded because a later reader comparing the
      two dispositions should find the reason here rather than infer an inconsistency.
  - id: OBS-03
    subject: the tier inversion is the first circular pair in the graph
    detail: >-
      rule_spell_tier FEEDS_INTO rule_difficulty_class on casting difficulty is canonical from
      printed page 44: a character's tier sets the DC. D002 would assert the reverse for a
      monster, the tier derived from the DC.
      That is not a contradiction and not a duplicate. The two rows differ in type, aspect and
      condition, so they are distinct under the five-field key, and both are what the source
      says for their own subject. The graph exists for impact analysis, and the honest answer to
      what depends on the spellcasting DC is that for monsters the tier does.
      Recorded because a reviewer meeting a cycle for the first time should see that it was
      noticed and intended rather than overlooked.

