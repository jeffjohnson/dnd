architectural_escalation_note: >-
  One escalation, raised on the first trigger in ESCALATION_CONTRACT: no existing node ID
  represents the concept and a new kind or prefix may be needed. The contract's do-not-escalate
  test was applied and does not rescue the case, because the candidate prefixes are approved but
  their declared kinds describe something else, so choosing one decides what a prefix means.
  The escalation asks for no new edge type, no membership relation, no creature registration and
  no domain promotion. abil_dark_adapted is an ordinary proposal under an approved prefix and is
  deliberately not part of it.

tier_inversion_note: >-
  D002 asserts the reverse of a canonical row, so the reasoning is set out rather than left to
  the aspect.
  At printed page 44 a spell's tier feeds its casting difficulty: rule_spell_tier FEEDS_INTO
  rule_difficulty_class on casting difficulty. That is the character case, where tier is known
  and the DC follows. Page 189 states the monster case, where the DC is printed in the stat
  block and the tier is worked back from it.
  DERIVED_FROM is the type, because the constitution defines it as computed or looked up from,
  running derived to source, which is exactly the direction stated. FEEDS_INTO would duplicate
  the existing row's direction and say the opposite of this sentence. The condition carries the
  subject, for a monster, qualitatively and with no quantity in it; the fixed amount subtracted
  is a magnitude and is not stored anywhere in the row.
  The two rows are distinct under the five-field key by type, aspect and condition, and the
  script asserts no collision against the 851 canonical rows.

completeness_statement: >-
  The single printed page in the declared span was read in full at the recorded checksum, which
  the script asserts against the packet manifest before parsing: 9 headings and 8 paragraphs,
  no table and no list. Every subsection is dispositioned, six as scope in rejected_candidates,
  two as drafted rows in proposed_pending_ruling, and one as the blocking identity question.
  This GUR publishes no candidate node and no candidate edge. That is not a null extraction:
  the page yields three assertions and the Analyst has drafted two of them and escalated the
  third. The distinction matters for anyone scanning the artifact store, because a reader who
  sees empty candidate arrays here and at PKT-SD-187-188 would otherwise read two very
  different results as the same.
  No assertion depends on any other ruleset. The packet is not forwarded to Builder and no
  second packet has been selected.

