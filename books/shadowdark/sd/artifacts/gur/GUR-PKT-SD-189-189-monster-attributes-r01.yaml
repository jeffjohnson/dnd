page_attribution_basis: >-
  One marker and no ambiguity. The p189 marker ends the MONSTER ATTRIBUTES heading, which
  placement rule 1 applies to the whole heading, and persistence carries 189 to every block
  after it. The packet is one printed page, so every row this packet would carry cites 189 and
  no row can rest on a different page.

scope_boundary: >-
  The bounded scope is the Primary Source Material section, printed page 189. The file appends
  no Supporting Source Context. This page has itself been the appended context in many earlier
  packets, each of which declined to extract from it because its primary packet was unclaimed;
  this is that packet, so page 189 is an extraction surface for the first time and nothing here
  duplicates a row cited to it.

source_summary: >-
  One page of rules text in eight subsections, describing the attributes printed in a monster
  stat block: armour class, hit points, attacks, movement, stat modifiers, alignment,
  spellcasting and dark-adapted. Bold marks the defined abbreviations AC, HP, LV, ATK, MV, the
  six stat letters, AL and tier. This is term-definition bolding, unlike the prose emphasis at
  PKT-SD-187-188 one packet earlier, and the contrast is worth naming because the same
  typographic mark means different things in the two packets.

graph_state_at_extraction: >-
  Read from the repository at extraction, not recalled. The canonical graph holds 424 registry
  rows and 851 edges, and 0 rows cite printed page 189. The registry holds 0 monster_
  identities.
  Every attribute this page names already has an identity except one. AC is cbt_armor_class with
  12 rows, HP is rule_hit_points with 30, ATK is cbt_attack_roll with 27, damage is rule_damage
  with 25, MV is ex_movement with 22, the stat modifiers are abil_stat_modifier with 2 plus the
  six named stats, AL is sys_alignment with 13, spellcasting is rule_spellcasting_check with 40,
  the DC is rule_difficulty_class with 6 and the tier is rule_spell_tier with 10. Monster level
  has none, and that is what the escalation asks about.

why_this_packet_is_blocked: >-
  Three of the eight subsections state a dependency rather than a scope. Two of them use only
  canonical identities and are drafted below as proposed_pending_ruling. The third, the hit
  point calculation, needs a subject identity for monster level that does not exist and that no
  approved prefix covers.
  The Analyst could have written that row against exp_level and moved on. That identity carries
  30 canonical rows and every one of them is character progression, so the aliasing would be a
  repository-wide convention chosen silently at the first of 38 incoming monster files. The
  escalation exists because the choice should be a ruling.
  The whole packet is blocked rather than the one row, because HERDR_HANDOFFS 2.4 pauses the
  packet at its originating stage and because the ruling may change how the other two rows are
  written: if the Architect establishes a monster subject identity, the dark-adapted row
  acquires a natural eligibility source it currently lacks.

proposed_pending_ruling_note: >-
  The two rows below are drafted, not published as candidate_edges, because this GUR is blocked
  and a blocked GUR must not present Builder with a compilable patch. They are recorded here so
  the reading is auditable now and so the successor revision after the ruling is a small
  edit rather than a re-extraction. Neither depends on the escalation's outcome on its own
  terms; both are held only by the relay pause.

proposed_pending_ruling:
  - ref: D001
    source_id: abil_dark_adapted
    source_label: Dark-Adapted
    edge_type: EXCLUDES
    target_id: rule_total_darkness
    target_label: Total Darkness
    aspect: darkness penalties
    condition: ''
    book: SD
    page: 189
    section: DARK-ADAPTED
    evidence: explicit_rule
    pass: 1
    status: core
    supersession_basis: ''
    general_rule_id: ''
    review_flag: ''
    requires_new_node: abil_dark_adapted
    basis: >-
      The source states that dark-adapted senses allow a monster to ignore the penalties of
      total darkness. rule_total_darkness MODIFIES rule_check on sight tasks at polarity worsens
      is the canonical penalty, from printed page 84, and this ability negates it. Ignore is
      unhedged, so EXCLUDES rather than CONSTRAINS under the test settled at PKT-SD-114-114.
      Builder derives negates.
  - ref: D002
    source_id: rule_spell_tier
    source_label: Spell Tier
    edge_type: DERIVED_FROM
    target_id: rule_difficulty_class
    target_label: Difficulty Class
    aspect: monster tier
    condition: for a monster
    book: SD
    page: 189
    section: SPELLCASTING
    evidence: explicit_rule
    pass: 1
    status: core
    supersession_basis: ''
    general_rule_id: ''
    review_flag: ''
    basis: >-
      The source states that a monster's tier is its spellcasting DC less a fixed amount. The
      amount is a magnitude and is not stored; the derivation is. Both endpoints are canonical.
      This inverts rather than repeats the canonical rule_spell_tier FEEDS_INTO
      rule_difficulty_class on casting difficulty from printed page 44, where a character's tier
      determines the DC. The two are different assertions under the five-field key and the
      condition distinguishes the subject; see tier_inversion_note.

