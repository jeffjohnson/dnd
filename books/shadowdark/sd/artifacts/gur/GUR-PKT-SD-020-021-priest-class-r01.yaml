authored_polarity_declaration: >-
  Seven rows carry authored polarity, all with basis read: M001, M007 and M011 CONSTRAINS governs,
  and M013, M014, M015, M016 and M017 MODIFIES improves. That is eight rows in total across the two
  types, each among the three constitution section 5 requires to carry source-reviewed authored
  polarity, and each was read aloud as source polarity target before being recorded. No row uses
  basis heuristic or unset. No other row carries a polarity or polarity_basis value: the four GATES
  rows, the two FEEDS_INTO rows, the two RESOLVED_BY rows and the one EXCLUDED_FROM row take their
  derived polarity from the section 5 table and the Analyst authors none of them.

domains_touched: []
candidate_domains:
  - proposed: magic
    basis: >-
      Spells, spell tiers, spells known and spellcasting checks are a coherent cluster this entry
      depends on heavily and which the contents list gives its own chapter. Recorded as a candidate
      only; the domain registry is empty and constitution section 8 reserves promotion to an
      Architect Decision. This is the first packet to suggest it, and a lone occurrence does not
      promote a domain.
  - proposed: character_creation
    basis: >-
      A class is chosen at creation, and the language, deity and starting spell choices are all made
      then. Recorded as a candidate only; now suggested by a fourth packet, which is noted and
      deliberately not treated as promotion.

domain_boundary_questions:
  - >-
    A spellcasting class entry spans creation, magic and combat at once. Whether the class node
    belongs to one domain or to each domain it reaches cannot be settled here. Deferred; no domain is
    asserted on any edge in this GUR.
  - >-
    Whether the deity subsystem belongs to the character domain or to its own cannot be settled from
    a page that only requires a priest to choose one. Deferred.

candidate_general_rules:
  - proposed: every class gates the benefits printed in its own entry
    establishing_locus: 'SD page 20, the Languages, Turn Undead, Deity and Spellcasting benefits inside the PRIEST CLASS entry'
    basis: >-
      M004, M006 and M008 repeat the shape the fighter GUR recorded from printed page 18, and two
      further class entries remain on printed pages 22 to 25. Two class entries now show it.
    not_applied: >-
      Recorded as a candidate only. Constitution section 5 requires a separate Architect ruling with
      an establishing locus, scope, counterexamples and affected set before a general rule exists,
      and the counterexamples cannot be assessed until the thief and wizard entries are read. That a
      second packet now supports it is noted and is deliberately not treated as promotion. No edge in
      this GUR sets general_rule_id.
  - proposed: every class resolves its talent roll on its own talents table
    establishing_locus: 'SD page 20, PRIEST TALENTS TABLE'
    basis: 'M012 is the priest instance and matches the fighter instance exactly in shape; two of four class entries now show it.'
    not_applied: >-
      Recorded as a candidate only, and deliberately not promoted with two entries of four read. No
      edge sets general_rule_id. This candidate also bears on IDQ-02 in the fighter GUR, which asked
      whether the per-class tables are really one shared table; two separately headed and materially
      different tables are now evidence that they are not, but the question stays open until all four
      are read.

non_edge_observations:
  - id: OBS-01
    subject: the permitted weapons line is again not extracted, and here it is a real list
    detail: >-
      Unlike the fighter's All weapons, this entry names seven specific weapons: club, crossbow,
      dagger, mace, longsword, staff and warhammer. That is a genuine enumerated permission and a
      real dependency, and it is deliberately not extracted. Proposing seven weapon identities from a
      class entry would fix seven names from a permission list rather than from the Weapons chapter
      on printed page 292 or the Gear section on printed page 34, which SOURCE_MARKDOWN Source
      Identity Authority reserves as their defining loci; a permission list is named there as exactly
      the kind of secondary listing that cannot name a concept defined elsewhere.
      This is the strongest instance so far of a deferral that will need paying back. The packet that
      claims the weapon pages should assert class weapon permissions with the identities it defines,
      and Reviewer should expect to see this entry revisited then.
  - id: OBS-02
    subject: the holy symbol is a granted item with a gear-slot statement
    detail: >-
      The Deity benefit adds that the priest has a holy symbol for their god and that it takes up no
      gear slots. Both halves are mechanical: an item is granted, and it is exempted from carrying
      capacity. Neither is extracted. No item identity for the holy symbol exists and this entry is
      not its defining locus, and the gear-slot exemption would need that identity as its source to
      be expressible as an EXCLUDED_FROM row parallel to M005. Recorded so the omission is visibly a
      decision; the Gear section is the locus that can supply the identity.
  - id: OBS-03
    subject: three specific languages are named and not proposed
    detail: >-
      The Languages benefit names Celestial, Diabolic and Primordial. As in the ancestries packet, no
      individual language identity is proposed: there is no approved prefix whose kind clearly covers
      a language, and the defining locus is the Languages section on printed page 32. M003 asserts
      the relationship the page states, that the class supplies starting languages, without fixing an
      ontology for languages from a class entry.
  - id: OBS-04
    subject: spell tier is a mechanic this packet depends on but does not define
    detail: >-
      The spells-known table is organised by spell tier, the entry grants two tier 1 spells at the
      outset, and the talents table is indirectly affected. Tier is plainly a real mechanic. It is
      not proposed here: the table's columns are its only appearance, the page defines nothing about
      what a tier is, and the contents list places Spell Attributes on printed page 50, which the
      Supporting Source Context of this very packet reproduces and which this extraction deliberately
      did not read. M011 therefore stores that the table bounds how many priest spells are known,
      with the per-tier structure left to the packet that defines tiers.
  - id: OBS-05
    subject: advantage remains the unextracted mechanism behind a talents row
    detail: >-
      The highest talents row grants advantage on casting one known spell. As with the fighter's Grit
      and the dwarf's Stout, M013 asserts the effect rather than the mechanism, because printed page
      9 defines advantage without relating it to any other named mechanic. This is now the fourth
      packet to depend on advantage. The Rolling the Dice chapter on printed page 78 is the defining
      locus, and the accumulating dependency is the ordinary signal that it should be claimed before
      long.
  - id: OBS-06
    subject: three navigational page pointers are not drawn as edges
    detail: >-
      The entry points at Deities on printed page 28, the priest spell list on printed page 51 and
      Spellcasting on printed page 44. Each is a reader pointer to a packet not claimed here. A
      CROSS_REFERENCES edge needs two identities, and in each case the target is a page rather than a
      named mechanic this packet can supply. The relationships those pointers stand behind are
      asserted where this page states them in its own words, as M006, M007, M008 and M018.
  - id: OBS-07
    subject: the final talents row is again a choice with no fixed target
    detail: >-
      The highest outcome row reads Choose a talent or points to distribute to stats, identical in
      shape to the fighter's. Its first branch refers back to the table it is printed in and its
      second distributes an unspecified number of points across unspecified stats, so neither branch
      names a determinate target. Not extracted, for the same reason recorded in the fighter GUR.
  - id: OBS-08
    subject: flavour carries no mechanics
    detail: >-
      The entry opens with a sentence about templars, shamans and zealots who wield the power of
      their gods. It establishes tone, names no mechanic and states no dependency. That it gestures
      at the deity relationship does not make it the source of M006 or M007, both of which are drawn
      from the Deity benefit's own words.
  - id: OBS-09
    subject: magnitudes deliberately excluded
    detail: >-
      The pages carry the hit point die, the count of starting spells and their tier, the talents
      table's die expression and all five row ranges, the attack bonus, the spellcasting bonus, the
      stat increase, the distributable points, and every one of the fifty cells in the spells-known
      table together with its ten level rows and five tier columns. All are die expressions, counts,
      numeric bonuses or thresholds, excluded by constitution section 1 and invariant 11. They remain
      in the immutable claimed packet. No aspect in this GUR contains a digit and no condition
      encodes a numeric value.
  - id: OBS-10
    subject: the supporting source context was available and deliberately unread
    detail: >-
      This packet reproduces printed pages 44 through 50 and 86 as Supporting Source Context, which
      includes the casting procedure, critical results, mishap tables, scrolls and wands, spell
      attributes and resting. Those pages would answer several questions this extraction left open,
      notably what a spellcasting check is and what a spell tier is. They were not read as evidence.
      Recorded explicitly because the omission would otherwise look like an oversight rather than the
      scope rule being obeyed: reproduced context is orientation, and the packet claiming those pages
      owns their assertions.

unresolved_identity_questions:
  - id: IDQ-01
    subject: whether a spell family and an individual spell should share the spell_ prefix
    detail: >-
      spell_priest_spells is proposed for the family and spell_turn_undead for one member, both under
      spell_. The constitution's own gloss for the prefix is spell or source-named spell family, so
      both are admitted by its text, and priest spells is the source's own name for the family.
      Consequence if wrong: if the family should instead be a subsystem or a table, M008, M011 and
      M018 repoint, and the same question recurs for wizard spells in a later packet. The Analyst
      followed the constitution's explicit wording rather than minting a distinction it has not drawn.
      This is not an Architect escalation: spell_ is an approved prefix with an unchanged kind.
  - id: IDQ-02
    subject: turn undead is named here but its spell entry is elsewhere
    detail: >-
      The class entry names the turn undead spell in italics and states two relationships to it, but
      the spell's own entry is in the Spells chapter on a printed page not yet claimed. Under
      SOURCE_MARKDOWN Source Identity Authority this entry supports the relationships it states but
      does not name a concept whose defining mechanics belong elsewhere, so the identity is
      provisional and records that.
      Consequence if wrong: the spell's own entry may use a different capitalisation or a longer
      name, in which case M004 and M005 repoint. Reviewer should de-duplicate against the Spells
      packet when it is read.
  - id: IDQ-03
    subject: sys_deity is proposed here after the overview packet declined to propose it
    detail: >-
      GUR-PKT-SD-011-014 recorded in its own observations that Deity was named on printed page 12
      alongside Alignment but was not proposed, because its defining locus is printed pages 27 to 29.
      This GUR proposes it. The difference is that page 12 stated no relationship to a deity, so a
      node there would have been an orphan, whereas page 20 states two: the class requires the
      choice, and alignment bounds it. An identity is proposed when an edge needs it and not before.
      Consequence if wrong: if the Deities pages name the subsystem differently, or distinguish a
      deity from the act of serving one, M006 and M007 repoint and the node may split. The Analyst
      judged that recording two stated relationships with a provisional identity is better than
      discarding them, and the node carries its defining locus so the later packet governs the name.
      This is not an Architect escalation: sys_ is an approved prefix with an unchanged kind, and the
      node is an ordinary registry addition.

architectural_escalations: []
architectural_escalation_note: >-
  None raised. Every proposed node uses an approved constitution section 2 prefix with an unchanged
  kind, every edge uses one of the thirteen legal section 3 types, and no new prefix, edge type,
  domain promotion or general-rule application is requested. ESCALATION_CONTRACT states that a
  proposed node under an approved prefix and kind which passes identity and duplicate checks is
  ordinary GUR, GUP and Review work rather than an escalation, and that a weak or missing citation is
  not grounds to escalate. IDQ-01 through IDQ-03 are recorded for Reviewer on that basis, and the
  deferrals in OBS-01 through OBS-06 resolve when the relevant defining packets are claimed.

completeness_statement: >-
  Both printed pages in the declared span are accounted for. Page 20 was read in full: the PRIEST
  CLASS heading, the flavour sentence in OBS-08, the Weapons line in OBS-01, the Armor line supplying
  M001, the Hit Points line supplying M002, the Languages benefit supplying M003 with its three named
  languages in OBS-03, the Turn Undead benefit supplying M004 and M005, the Deity benefit supplying
  M006 and M007 with its holy symbol in OBS-02, the Spellcasting benefit and all three of its
  following paragraphs supplying M008, M009 and M018 with their page pointers in OBS-06, the PRIEST
  TALENTS TABLE heading and column headers supplying M012, and all five talents rows of which four
  supply M013 through M017 and the fifth is dispositioned in OBS-07. Page 21 was read in full: the
  PRIEST SPELLS KNOWN BY SPELL TIER TABLE heading, its Level column and five tier columns supplying
  M010 and M011, and all ten level rows, whose fifty cells are magnitudes recorded in OBS-09. Every
  page marker was resolved through the Pandoc AST and the in-scope resolved page set matches the
  declared span with no gap. The Supporting Source Context reproducing printed pages 15, 44 through
  50 and 86 is out of scope, was deliberately not read as evidence, and contributed nothing; this is
  recorded in OBS-10 because those pages would have answered open questions. Eighteen edges are
  proposed across sixteen candidate nodes, ten of which are also proposed by sibling GURs from their
  defining loci and are marked as such. No node is reused because the Shadowdark graph is empty.
  Content not converted to an edge is accounted for in OBS-01 through OBS-10, and every identity the
  Analyst could not settle is recorded in IDQ-01 through IDQ-03 rather than resolved by picking a
  plausible ID. No assertion depends on any other ruleset.
