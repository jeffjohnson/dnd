page_attribution_basis: >-
  Two markers resolve in the Primary Source Material, both through the Pandoc AST rather than
  positionally. {#p20} ends the PRIEST CLASS heading and {#p21} ends the PRIEST SPELLS KNOWN BY SPELL
  TIER TABLE heading; placement rule 1 applies each to its whole heading, and the persistence rule
  carries page 20 through the benefits and the talents table, and page 21 through every row of the
  spells-known table. Rows below therefore cite page 20 except M010 and M011, which cite page 21.

out_of_scope_context_warning: >-
  This packet's Supporting Source Context is unusually large and reproduces printed pages 44 through
  50 and 86, which include the casting-spells procedure, critical results, the wizard mishaps tables,
  scrolls and wands, spell attributes and resting. Those are precisely the pages this class entry
  points at, which makes them tempting to read as evidence for the spell mechanics asserted below.
  They were not used. Every assertion in this GUR is drawn from printed page 20 or 21 and cites one
  of them. Where this entry refers to a procedure defined on one of those pages, the reference is
  recorded as an observation and the identity is marked provisional, exactly as if the text were
  absent from the file.

scope_boundary: >-
  The bounded scope is the Primary Source Material section, printed pages 20 and 21. The parser
  resolves nine further pages inside the trailing Supporting Source Context, all claimed by other
  packets, so the zero-overlap rule across the intake holds for this packet.

source_summary: >-
  Printed page 20 is the priest class entry: a heading, a flavour sentence, three attribute lines
  giving permitted weapons, permitted armor and a hit point die per level, four separately named
  benefits covering known languages, a granted turn undead spell, a deity chosen to match alignment,
  and spellcasting with its spells-known and level-progression paragraphs, and a five-row rollable
  talents table. Printed page 21 is the spells-known table, ten character-level rows across five
  spell-tier columns. This summary is orientation only; every assertion below cites its page.

graph_state_at_extraction: >-
  The Shadowdark canonical graph is still empty; nodes.csv is header-only, the domain registry has no
  domains, general_rules.json is an empty object, and character_races.yaml is inactive. The three
  supplied slices named in the packet manifest as missing remain immaterial, re-assessed here rather
  than carried over from claim. reused_nodes is empty. Ten of the sixteen identities below are
  already proposed by sibling GURs from their defining loci and are marked as such.

cross_packet_identity_note: >-
  item_armor, rule_hit_points, sys_language, sys_alignment, exp_level, rule_talent_roll,
  rule_spellcasting_check, cbt_attack_roll, abil_strength and abil_wisdom are proposed by sibling
  GURs from their defining loci and are proposed again here because this patch uses them as edge
  endpoints. A GUR must propose every endpoint its edges use: an endpoint present only in a sibling
  GUR is not canonical, is not proposed by the patch, and fails invariant 1 as endpoint_unresolved.
  Proposing them is not a competing naming; each records its defining locus and the sibling GUR that
  also proposes it, and each ID and label is reproduced exactly. Where two patches propose one
  identity, Reviewer de-duplicates and the Integrator applies a single registry addition.

