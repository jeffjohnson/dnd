  The single printed page in the declared span is accounted for. Page 39 was read in full: the LEVEL
  ADVANCEMENT heading; the EXPERIENCE POINTS subsection, whose award and timing content is
  dispositioned in OBS-04; the LEVELING UP subsection, supplying M002, M003 and M005, with its new
  title and new spells clause in OBS-01 and its maximum HP clause supplying M006; the ADVANCEMENT
  TABLE heading, its three column headings and all ten rows, supplying M001 and M004 with their
  values in OBS-05; the TALENT ROLL subsection, supplying M004's condition, with its class-table
  clause in OBS-02 and its duplicate-stacking clause in OBS-03; the INCREASED HP subsection,
  supplying M006; and the closing epigraph in OBS-06. Every page marker was resolved through the
  Pandoc AST and the in-scope resolved page set matches the declared span with no gap. The Supporting
  Source Context reproducing printed page 15 is out of scope and contributed nothing. Six edges are
  proposed across five candidate nodes, four of which are also proposed by sibling GURs from their
  defining loci and are marked as such. No node is reused because the Shadowdark graph is empty.
  Content not converted to an edge is accounted for in OBS-01 through OBS-06, and the one question
  the Analyst could not settle is recorded in IDQ-01 rather than resolved silently. No assertion
  depends on any other ruleset.
