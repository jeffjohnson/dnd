non_edge_observations:
  - id: OBS-01
    subject: this page does not duplicate the overview packet's experience and level rows
    detail: >-
      GUR-PKT-SD-011-014 asserts from printed page 12 that experience feeds level on the aspect level
      gain, and that level feeds title on the aspect title determination. Neither is repeated here.
      M001 and M002 target the advancement table rather than the mechanics, which makes them distinct
      under the constitution section 4 assertion key and, more importantly, records something the
      overview could not: that the threshold is a lookup and that it scales with the level already
      held.
      The title consequence is deliberately omitted entirely. LEVELING UP says a character gets any
      new title listed for their level, but that assertion is already carried twice, by the overview
      packet at the mechanic level and by the titles packet at the table level, and a third row from
      a page that only mentions it in passing would add a shallower path between concepts already
      connected. The same reasoning covers the new spells this subsection mentions, which the priest
      and wizard GURs assert from their own spells-known tables.
  - id: OBS-02
    subject: the class-specific talent table is not targeted from here
    detail: >-
      TALENT ROLL says the roll is made on your class's talent table. Four such tables exist as
      candidate identities, one per class, each asserted by its own class GUR as resolving the talent
      roll. M004 therefore asserts only what this page adds, which is when the entitlement arises.
      Drawing an edge from this page to four class tables would restate four published rows from a
      page that names none of them individually.
  - id: OBS-03
    subject: the duplicate-talents rule is stated but not extractable as an edge
    detail: >-
      TALENT ROLL adds that duplicate talents stack unless noted. This is a real rule about how talent
      results combine, and it is not extracted: it relates a talent result to another instance of
      itself rather than to a second named mechanic, and the graph has no self-relation that would
      express stacking without asserting a loop. The character overview on printed page 13 makes the
      same statement about talents combining, and the Analyst did not extract it there either.
      Recorded so the omission is visibly consistent rather than accidental.
  - id: OBS-04
    subject: how experience is awarded is deferred to its own chapter
    detail: >-
      EXPERIENCE POINTS says awards are based on the quality of treasure and boons gained during a
      session, that the GM may award them immediately or at the end of a session, and points at
      Awarding XP on printed page 117. Treasure and boons are real concepts with their own chapters,
      and an award-source dependency is genuine, but neither is defined here and this page gives
      neither an identity. The packet that claims printed page 117 is the defining locus and should
      assert it from there. The timing sentence is GM procedure rather than a mechanical dependency,
      consistent with OBS-04 of the introduction GUR.
  - id: OBS-05
    subject: magnitudes deliberately excluded
    detail: >-
      The page carries the level multiplier in the threshold rule, the reset value, all ten rows of
      the advancement table with their talent marks and experience thresholds, the highest level the
      table reaches, and the class hit point die. All are multipliers, threshold values, index values
      or die expressions, excluded by constitution section 1 and invariant 11. They remain in the
      immutable claimed packet, which is the authority for the values themselves. No aspect in this
      GUR contains a digit and no condition encodes a numeric value; the two conditions that refer to
      levels name the circumstance the source names rather than a tunable threshold.
  - id: OBS-06
    subject: flavour and packet mechanics
    detail: >-
      The page closes with an attributed epigraph about certain doom being a challenge, which
      establishes tone and states no dependency. The supplied file opens with an intake wrapper ahead
      of the Primary Source Material heading, for which the claim manifest is the independent page
      locator SOURCE_MARKDOWN Attribution Rules requires. The trailing Supporting Source Context
      reproduces printed page 15 and is orientation only, contributing nothing here.

unresolved_identity_questions:
  - id: IDQ-01
    subject: whether printed page 39 or printed page 12 is the defining locus for XP and Level
    detail: >-
      This GUR records printed page 12 as the defining locus for both and reproduces its spellings,
      but page 12 is a one-line overview entry and this page is the full mechanic. A reasonable
      reader could call page 39 the defining locus.
      Nothing turns on it here, which is why it is recorded rather than escalated: both pages use XP
      and Level with the same spelling and the same grammatical number, so no identity conflict
      arises under SOURCE_MARKDOWN Source Identity Authority and no rename is proposed. The question
      matters only if a later packet uses a third spelling, in which case the defining locus decides.
      Consequence if wrong: none to the rows, which would be unchanged. The defining_locus field on
      two candidate nodes would name a different page. Reviewer may correct it without affecting any
      assertion.

