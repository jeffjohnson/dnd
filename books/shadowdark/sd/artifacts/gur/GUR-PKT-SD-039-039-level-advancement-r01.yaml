page_attribution_basis: >-
  One marker resolves in the Primary Source Material, through the Pandoc AST rather than
  positionally. The page-39 marker ends the LEVEL ADVANCEMENT heading, which placement rule 1 applies
  to the whole heading, and the persistence rule carries page 39 through all five subsections, the
  advancement table and the closing epigraph. Every row below cites page 39. A second page the parser
  resolves, 15, lies entirely inside the out-of-scope Supporting Source Context.

scope_boundary: >-
  The bounded scope is the Primary Source Material section, printed page 39. The trailing Supporting
  Source Context reproduces printed page 15, whose primary packet is
  PKT-SD-015-015-stats-and-stat-modifiers, outside this packet's declared span. No assertion here is
  drawn from it and no row cites page 15.

source_summary: >-
  Printed page 39 is the advancement chapter. EXPERIENCE POINTS says what experience represents, that
  awards are based on treasure and boons gained in a session, and that the GM may award them at any
  time. LEVELING UP gives the threshold for gaining a level in terms of the character's current
  level, states that the total resets on reaching a new level, and lists what a new level brings.
  ADVANCEMENT TABLE gives ten level rows against a talent column and a threshold column. TALENT ROLL
  says a roll is taken on the class's own talent table at the indicated levels and that duplicates
  stack unless noted. INCREASED HP says to roll the class's hit point die and add it to maximum hit
  points. An attributed epigraph closes the page. This summary is orientation only.

graph_state_at_extraction: >-
  The Shadowdark canonical graph is still empty; nodes.csv is header-only, the domain registry has no
  domains, general_rules.json is an empty object, and character_races.yaml is inactive. The three
  supplied slices named in the packet manifest as missing remain immaterial, re-assessed here rather
  than carried over from claim. reused_nodes is empty. Four of the five identities below are already
  proposed by sibling GURs from their defining loci and are marked as such.

cross_packet_identity_note: >-
  exp_xp, exp_level, rule_talent_roll and rule_hit_points are proposed by sibling GURs from their
  defining loci and are proposed again here because this patch uses them as edge endpoints. A GUR
  must propose every endpoint its edges use: an endpoint present only in a sibling GUR is not
  canonical, is not proposed by the patch, and fails invariant 1 as endpoint_unresolved. Proposing
  them is not a competing naming; each records its defining locus and the sibling GUR that also
  proposes it, and each ID and label is reproduced exactly.
  This packet is an unusual case of that rule. Printed page 39 is arguably the fuller locus for
  experience and levelling than printed page 12, which names them in a one-line overview entry. The
  Analyst nonetheless treats page 12 as the defining locus and reproduces its spellings, because
  SOURCE_MARKDOWN Source Identity Authority keys identity to where a concept is defined and both
  pages use the same names, so nothing turns on it. No rename is proposed; see IDQ-01.

