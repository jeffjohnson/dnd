non_edge_observations:
  - id: OBS-01
    subject: Gorgon Charge and Petrifying Breath represent creature combat riders
    detail: >-
      Charge triples gore damage on a straight-line move, while Petrifying Breath imposes a DC 15 CON check
      against petrification in a near-sized cube. Both operate on creature attack loci under Constitution 2.5.
  - id: OBS-02
    subject: Gray Ooze defensive and reactive traits (Impervious and Corrosive) operate on creature defense loci
    detail: >-
      Impervious grants damage immunity against acid, cold, and fire, while Corrosive dissolves nonmagical metal
      on a 1–3 on a d6 upon touch. Both operate on creature defense/trait loci under Constitution 2.5.
  - id: OBS-03
    subject: Grick and Grimlow Grab abilities impose immobilized or restrained states via attack riders
    detail: >-
      Grick's tentacle hit immobilizes the target (DC 15 STR check to escape), while Grimlow's grab pulls a
      target within near into its maw (DC 15 STR check or pulled and bit automatically). Both operate on
      creature combat loci under Constitution 2.5.
  - id: OBS-04
    subject: Guard stat block explicitly annotates equipment components in its stat fields
    detail: >-
      Guard stat block lists chain mail + shield in AC and spear / longsword in attacks. Per Constitution 2.5,
      these parentheticals specify creature baseline stat derivation rather than defining or modifying the
      equipment rules themselves.

