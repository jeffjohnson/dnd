authored_polarity_declaration: >-
  Three rows carry authored polarity, all with basis read: M005 MODIFIES improves, M006 CONSTRAINS
  governs, M012 CONSTRAINS governs. Each was read aloud as source polarity target before being
  recorded. No other row carries polarity or polarity_basis. The four GATES rows, the OVERRIDES row,
  the ALTERNATIVE_TO row and every FEEDS_INTO row are deterministic under constitution section 5 and
  are left for Builder to derive.

domains_touched: []
candidate_domains:
  - proposed: character_creation
    basis: >-
      Pages 12 to 14 are the character-creation frame: what a sheet contains and what a character
      begins with. Candidate only; the Shadowdark domain registry is empty and promotion requires an
      Architect Decision under constitution section 8.
  - proposed: character_advancement
    basis: >-
      Level, XP, the two starting tiers and the route between them are advancement rather than
      creation. Candidate only, and deliberately distinguished from character_creation rather than
      merged, because the two are separable here. Not promoted.

domain_boundary_questions:
  - >-
    Creation and advancement overlap on this page: the starting tiers are both a creation choice and
    an advancement state. Whether they are one domain or two cannot be settled from an overview.
    Deferred; no domain is asserted on any edge.

candidate_general_rules:
  - proposed: talent benefits combine, including duplicates of the same talent
    establishing_locus: 'SD page 13, TALENTS'
    basis: >-
      Stated once as a property of talents generally rather than of any individual talent, which is
      the shape of a general rule. If approved it would govern every talent a later packet defines.
    not_applied: >-
      Candidate only. Constitution section 5 requires a separate Architect ruling with establishing
      locus, scope, counterexamples and affected set. No edge here sets general_rule_id and no
      application has been made graph-wide.
  - proposed: a computed hit point total has a lower floor
    establishing_locus: 'SD page 14, both starting lists'
    basis: >-
      Both lists impose a minimum on the computed total. The floor is structural; its value is a
      magnitude and is excluded from the graph.
    not_applied: >-
      Candidate only, and weaker than the first: two occurrences on one page of the same procedure
      may be one rule stated twice rather than a general rule. Recorded so a later packet that
      repeats the floor can be compared against it. Not promoted and not applied.

non_edge_observations:
  - id: OBS-01
    subject: the two starting checklists are not modelled edge by edge
    detail: >-
      The 0-level list contains stats, choice of ancestry, hit points, background, choice of
      alignment and starting gear. The 1st-level list contains those plus choice of class, one class
      talent roll, title, and a different hit point computation. Only the discriminating facts are
      asserted as edges: M019, M020 and M021 for the three elements exclusive to first level, M017
      and M018 for the hit point inputs, and M013 and M014 for the relationship between the tiers.
      The shared elements are deliberately not emitted as a parallel pair of membership edges from
      each tier to each element, which would add roughly fifteen rows asserting only that a checklist
      lists them. Each shared element's real dependency belongs to its own defining locus: stats page
      15, ancestry page 16, background page 26, alignment page 27, gear page 33. Recorded here so the
      omission is visible rather than silent.
  - id: OBS-02
    subject: background is named but no identity is proposed
    detail: >-
      The BACKGROUND entry states that a character is adept at tasks related to their background,
      and background appears in both starting lists. That adeptness is a real modifier to task
      resolution, but no task, check or resolution identity is in scope on these pages; the check
      mechanic is printed page 30 and background's own defining locus is page 26. No edge is drawn
      rather than inventing a target to attach it to.
      Because no edge can be drawn, no background identity is proposed either. An earlier draft of
      this GUR proposed rule_background and then asserted nothing about it, which would have added a
      registry identity carrying no claim and pre-empted the naming choice belonging to page 26.
      That is the same drift IDQ-04 warns about, so the node was withdrawn before publication. The
      page 26 packet should mint it.
  - id: OBS-03
    subject: class weapon permission is deferred
    detail: >-
      The ATTACKS entry states that a character may wield the weapons listed for their class. The
      parallel armor statement is asserted as M006 because armor is a single named item category,
      but the weapon statement points at per-class weapon lists printed on pages 18 to 25 and at the
      equipment section on page 33. Asserting it here would require either a generic weapon-category
      identity the source does not name or a premature per-class list. Deferred to those defining
      loci, which should attach to sys_class.
  - id: OBS-04
    subject: the agility contribution to armor class is deferred
    detail: >-
      The AC entry says a character is hard to injure whether because they are agile or because they
      wear armor. The armor half is asserted as M007. The agility half is not: the sentence says
      agile, not Dexterity, and treating the two as the same identity would be an inference rather
      than a reading. The AC defining locus is pages 33 to 37 and should settle it.
  - id: OBS-05
    subject: navigational page pointers are not edges
    detail: >-
      The packet points to Combat on page 88, Gear on page 34, The Gauntlet on page 116, first
      adventure consequences on page 39, and the starting-list pages 15, 16, 20 to 24, 26, 27, 30 and
      33. CROSS_REFERENCES exists in the vocabulary, but these point at page numbers rather than at
      identities that can be resolved without reading those packets, and emitting them would assert
      targets this Analyst has not read. They are recorded here instead. A later pass may add
      CROSS_REFERENCES edges once the targets exist as identities.
  - id: OBS-06
    subject: damage reducing hit points is not asserted
    detail: >-
      The HP entry says damage from weapons, traps, spells or other sources temporarily reduces hit
      points. The recovery half is asserted as M005 because resting is a single named procedure. The
      damage half names four unrelated sources and no damage identity, so asserting it would require
      minting a damage concept the page does not define. Deferred to the combat locus on page 88.
  - id: OBS-07
    subject: hit point replacement on advancement
    detail: >-
      The 1st-level list states that the new hit points replace those the character had at level
      zero. This is not emitted as a separate OVERRIDES row because it is the ordinary consequence of
      the progression already recorded by M014 together with the differing inputs in M017 and M018;
      a distinct row would assert a supersession the source frames as recomputation.
  - id: OBS-08
    subject: deity is named but not proposed
    detail: >-
      The OVERVIEW heading reads ALIGNMENT & DEITY and the gloss describes only the alignment axis.
      Alignment is proposed; deity is not, because this page says nothing mechanical about it. Its
      defining locus is printed pages 27 to 29.
  - id: OBS-09
    subject: magnitudes and non-source content excluded
    detail: >-
      Excluded under constitution section 1 and invariant 11: the fixed number in the carry limit,
      the hit point floor in both starting lists, and the level numbers where they function as
      values. Also excluded as non-source: the intake wrapper, and the walkthrough web address in the
      OVERVIEW introduction, which is a publisher pointer and not a mechanic. No aspect or condition
      in this GUR contains a digit; where a level had to be named in a condition it is spelled as a
      word.
  - id: OBS-10
    subject: page 11 carries no mechanical content
    detail: >-
      Printed page 11 is the CHARACTERS chapter opening: a heading and a one-sentence epigraph about
      the wise and the foolish. It is flavour text, yields no assertion, and is not a classified page
      under SOURCE_MARKDOWN, merely a page whose content is not mechanical. It is inside the declared
      span and accounted for here rather than left unexplained.

unresolved_identity_questions:
  - id: IDQ-01
    subject: ancestry and class are proposed as subsystem axes, and individual ancestries have no prefix
    detail: >-
      This packet needs the ancestry and class axes, not their members: it says ancestry grants
      talents and that a class is chosen at first level. Both are proposed under sys_, an approved
      prefix for a whole subsystem, so neither requires an escalation and both are ordinary registry
      additions.
      The forward problem is recorded here deliberately. Constitution 1.0 section 2 lists twelve
      prefixes and none of them fits an individual ancestry: not class_, which is a character class
      and which section 2 explicitly warns against conflating with ancestry, and not monster_. The
      character race registry is inactive pending source review. Printed pages 16 to 17 are the
      ancestries packet and will need individual identities. No escalation is raised from this packet
      because the Analyst has not read that source and ESCALATION_CONTRACT requires the smallest
      relevant source excerpt and affected set; raising it here would be speculation about a page not
      yet read. It should be raised from that packet, which is its defining locus.
  - id: IDQ-02
    subject: this packet is evidence bearing on the shared stat modifier question
    detail: >-
      GUR-PKT-SD-015-015-stats-and-stat-modifiers-r02 IDQ-01 asked whether the modifier is one shared
      identity or six per-stat identities, and chose one shared identity because page 15 names one
      table. Page 14 is the first evidence on the other side: it computes hit points from the
      Constitution modifier specifically, and a single shared identity cannot express which stat is
      meant. M017 works around this by drawing the edge from abil_constitution directly, which is
      accurate but loses the fact that it is the modifier rather than the raw score that is used.
      This does not resolve the question and no change is proposed to that GUR here. It is recorded so
      Reviewer weighs both packets together rather than settling IDQ-01 on page 15 alone.
  - id: IDQ-03
    subject: one proposed node is analyst-named
    detail: >-
      rule_gear_capacity has no source name. The source states the carrying limit under the heading
      GEAR, which names the equipment rather than the limit, so the heading cannot serve as the
      identity without conflating the two. Flagged source_named false. The gear defining locus is
      printed page 33 and may name the mechanic explicitly; if it does, that name takes precedence
      over this stem.
  - id: IDQ-04
    subject: several identities are proposed from an overview rather than their defining locus
    detail: >-
      cbt_armor_class, item_armor, item_gear, rule_resting, rule_talents, rule_talent_roll,
      rule_title, sys_alignment, exp_level and exp_xp are all named on these pages
      but described more fully later: armor, gear and AC on pages 33 to 37, resting on page 86,
      talents in the class packets on pages 18 to 25, background on page 26, alignment on pages 27 to
      29, title on pages 30 to 31, and level and XP in the advancement material.
      Each stem is taken from the source's own heading or bolded term on this page, so none is
      invented, and SOURCE_MARKDOWN permits a secondary mention to support a relationship it states.
      The risk being flagged is the reverse one: a later defining packet should reuse these IDs rather
      than mint a rival, and where a defining locus names a mechanic differently, that locus governs.
      Reviewer should treat these as provisional stems, not settled identities.

architectural_escalations: []
architectural_escalation_note: >-
  None raised. Every proposed node uses an approved constitution section 2 prefix with an unchanged
  kind, every edge uses one of the thirteen legal types, and nothing here requests a new prefix, a
  new edge type, a domain promotion or a general-rule application. ESCALATION_CONTRACT classes a
  proposed node under an approved prefix and kind as ordinary GUR, GUP and Review work. The one
  genuine prefix gap this Analyst can foresee, an individual ancestry identity, is recorded in IDQ-01
  and belongs to the ancestries packet where the source evidence for it exists.

completeness_statement: >-
  Every section of printed pages 11 through 14 was read and considered: the CHARACTERS heading and
  epigraph; the OVERVIEW introduction; all sixteen OVERVIEW entries from NAME through GEAR; the
  STARTING LEVEL heading; and both the 0-LEVEL and 1ST-LEVEL subsections including their bulleted
  starting lists. The Supporting Source Context section reproducing printed page 15 was identified as
  out of scope and contributed nothing; no citation in this GUR names page 15. Content not converted
  to an edge is accounted for in OBS-01 through OBS-10 rather than silently dropped, including the
  NAME entry, which asks the reader to choose a name and states no mechanic. Twenty-one edges are
  proposed across seventeen candidate nodes and two cross-GUR identities that this GUR does not
  propose. No canonical node was reused because the Shadowdark graph is empty, and no assertion
  depends on any other ruleset.
