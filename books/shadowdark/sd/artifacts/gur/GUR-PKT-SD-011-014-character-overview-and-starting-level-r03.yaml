revision_reason: >-
  Revision 2 corrected the production column name but left a second, independent defect that
  Builder's compile of revision 1 had already reported and the Analyst had not accounted for. Of the
  forty-four validation errors on that compile, forty-two were the evidence field name across
  twenty-one rows; the remaining two were endpoint_unresolved on M011 source abil_strength and M017
  source abil_constitution, each reported as not resolving to a canonical node and not proposed by
  the patch, in breach of invariant 1. This revision adds those two identities to candidate_nodes so
  the patch proposes every endpoint it uses. No edge, aspect, condition, citation, polarity, status
  or reading changes, and no identity is renamed.

borrowed_identity_correction: >-
  Revision 1 and revision 2 recorded abil_strength and abil_constitution only under
  cross_gur_identities, on the reasoning that the stats packet is their defining locus and this
  packet should not appear to mint rivals. That reasoning about identity was right and is retained
  below, but it was the wrong mechanism: cross_gur_identities is an Analyst annotation that the
  Builder compiler does not read, and the compiled patch reported cross_packet_dependencies as
  empty. A GUR must propose every endpoint its edges use or the edge fails invariant 1.
  Proposing them here is not a competing naming and does not make this packet their defining locus.
  Both IDs and labels are reproduced exactly as GUR-PKT-SD-015-015-stats-and-stat-modifiers-r02
  proposes them from printed page 15, which remains the defining locus recorded on each node below.
  ESCALATION_CONTRACT states that a proposed node using an approved prefix and kind, passing
  identity and duplicate checks and isolable as a normal GUP registry addition, is ordinary Builder
  and Reviewer work rather than an Architect escalation, which is exactly this case. Where both
  patches propose the same identity, Reviewer de-duplicates and the Integrator applies one registry
  addition; the validation report already describes that route for every other node in this patch.

prior_revision_reason: >-
  Revision 1 wrote the production column as evidence_class on all twenty-one candidate edges.
  Shadowdark constitution section 4 names that column evidence. The same defect in the companion
  stats GUR caused Builder's compile of that packet to fail with twenty-eight validation errors;
  this GUR had not yet been compiled, so the correction is published before a second wasted compile
  rather than after one. This revision renames the field on every affected row, repoints the
  cross_gur_identities dependency to the corrected stats GUR leaf, and changes nothing else. No
  source reading, identity, edge type, direction, aspect, condition, citation, status, supersession
  basis or authored polarity value differs from revision 1.

cross_gur_dependency_update: >-
  Revision 1 named GUR-PKT-SD-015-015-stats-and-stat-modifiers-r01 and its checksum as the source of
  abil_strength and abil_constitution, and described it as not yet compiled. That revision has since
  been compiled into a GUP that is not approvable, and has been superseded by
  GUR-PKT-SD-015-015-stats-and-stat-modifiers-r02, which carries the identical identities with the
  same field correction. This revision names the current active leaf and its current checksum so
  Builder de-duplicates against the artifact it will actually compile. The two identities themselves
  are unchanged; only the artifact pointer and its status description moved.

revalidation_under_current_constitution: >-
  Revision 1 declared constitution 1.0; this revision declares 1.2, which section 9 permits only
  with full revalidation. The claimed packet source was re-read in full at the checksum recorded
  below, which still matches, including its Supporting Source Context, which remains orientation
  only and contributes no assertion. Every proposed prefix (sys_, exp_, rule_, cbt_, item_, abil_)
  remains approved under section 2, every edge type used remains in the section 3 closed vocabulary,
  the section 4 assertion key and column order are unchanged, and the section 5 authored-polarity
  rules still permit exactly the three rows that carry polarity, all with basis read. The 1.1
  amendment added the ancestry kind and six ancestry identities; this packet proposes no individual
  ancestry and its sys_ancestry subsystem node is precisely the reading section 2.1 now states
  explicitly, so that amendment confirms revision 1's treatment rather than altering it. The 1.2
  amendment concerns concurrency and changes no assertion here. Every edge was re-checked against
  the source text, not carried forward on trust.

