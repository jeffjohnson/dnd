source_summary: >-
  Printed pages 11 through 14. Page 11 opens the CHARACTERS chapter with an epigraph. Pages 12 and 13
  are an OVERVIEW naming each element of a character sheet with a one or two sentence gloss. Page 14
  is STARTING LEVEL, which states what a 0-level and a 1st-level character each begin with and how a
  0-level character advances. Orientation only; every assertion below cites its page.

extraction_posture: >-
  This is an overview whose job is largely to name concepts defined more fully later, and it is read
  that way. SOURCE_MARKDOWN Source Identity Authority states that a secondary listing or incidental
  mention can support a relationship stated in its own packet but does not rename a concept whose
  defining mechanics belong elsewhere. Accordingly this GUR asserts the relationships the page
  actually states, and does not convert its navigational page pointers into edges or invent
  identities the page merely gestures at. Several proposed identities are provisional in the sense
  recorded in IDQ-04: their fuller defining locus is a later packet, which should reuse these IDs
  rather than mint rivals.

graph_state_at_extraction: >-
  The Shadowdark canonical graph is still empty; nodes.csv is header-only, the domain registry is
  empty, general_rules.json is an empty object and the character race registry is inactive. No
  canonical node exists to reuse, so reused_nodes is empty. This is the second Shadowdark packet
  analysed and it references identities already proposed by the first; those are recorded under
  cross_gur_identities rather than re-proposed here.

