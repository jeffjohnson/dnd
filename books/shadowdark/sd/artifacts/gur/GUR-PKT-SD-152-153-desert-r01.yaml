rejected_candidates:
- text_locus: the creature results across the table, pp152 and 153
  quoted_gist: a purple worm, bandits from the Hidden City, salamanders, a sphinx, ankhegs, berserkers,
    a scarab swarm, kobolds, lizardfolk, gladiators, an efreeti, desert elves, lions, rust monsters, mummies,
    shadows, a giant scorpion, a bone naga, manticores, an iron golem, a fire elemental, centaurs, vultures,
    cobras, a fire dragon, a djinni, Algariz the desert dragon, hobgoblins on hippogriffs, a mage, cultists,
    a phoenix, bulettes and the Wandering Merchant
  why_considered: Two are individually named, Algariz the desert dragon with a size class in parentheses
    and the Steelsworn clan, and the Wandering Merchant appears for the fifth time in six packets.
  rejection_reason: A creature's defining locus is its stat block in the unextracted monster chapter and
    the registry holds no monster_ identity. Sixth packet running for the same disposition, and the Wandering
    Merchant in particular has an entry on printed page 213 inside an unclaimed packet.
- text_locus: the bone-barbed nets, p152
  quoted_gist: a stated number of bone-barbed nets snap up from beneath the sand
  why_considered: 'In substance this is a trap: something concealed underfoot that springs when the party
    walks into it. rule_traps is canonical and has taken a FEEDS_INTO row from three encounter tables
    already, most recently a drow-made trap that triggers on printed page 150.'
  rejection_reason: 'The word trap does not appear in the cell, and the three rows that earned it all
    say trap: a bear trap on printed page 149, rusty bear traps on 143, a drow-made trap on 150. Reading
    a snapping net as a trap would replace the test that the source names the thing with a test of whether
    I can recognise the category, which is the same widening declined for the crawlers cell on printed
    page 147 and the floor giving way on 151. Recorded as OBS-02.'
- text_locus: the weather and terrain results, pp152 and 153
  quoted_gist: a blinding sandstorm for a stated number of hours, a towering sand dune shifting and collapsing
    toward the characters, a sweeping rain threatening floods, a funnel of sand collapsing in
  why_considered: The arctic table earned the chapter's only TRIGGERS row to rule_damage from two weather
    cells, and a sandstorm and a collapsing dune are the same kind of thing.
  rejection_reason: The arctic cells state a die of damage per round to the unsheltered. These state a
    duration and a direction of travel and nothing else; the word damage does not appear on the page.
    This is the direct comparison that shows the arctic row was earned by the source rather than by the
    reading, and it is worth noting that the desert page, which is the arctic page's obvious twin, states
    no damage at all.
- text_locus: the chance-bearing and riddle results, pp152 and 153
  quoted_gist: a brass lamp with a stated percentage chance of an efreeti inside, and a sphinx demanding
    the answer to a riddle
  why_considered: The lamp is the only cell in the chapter so far to state a probability, and a riddle
    demanded by a creature reads like a check.
  rejection_reason: A percentage is a magnitude and no field may store one; stripped of it the lamp is
    an object in the sand. The sphinx states no check, no stat, no consequence for a wrong answer and
    no reward for a right one, so rule_check has nothing to attach to. This is the reading that declined
    the appraisal on printed page 145.
- text_locus: the two-encounter instruction, p153
  quoted_gist: one result instructs the reader to roll twice more and combine the results, rerolling that
    result if it comes up again
  why_considered: It is the only instruction on the page, and the stem scan flags it as matching rule_encounter.
  rejection_reason: The match is on the plain word encounters in the instruction's own text; M001 already
    carries the table's relation to rule_encounter. The rest is arithmetic on the table's own roll, which
    is a magnitude, and what would survive is a self-edge. Declined in the same form in each of the five
    preceding chapter packets.
- text_locus: the appended random encounter procedure and monster attributes, out of scope
  quoted_gist: the printed page 112 and 113 encounter procedure and the printed page 189 monster attributes
    page
  why_considered: Both are in the file and the first is the rule this table resolves.
  rejection_reason: Both are Supporting Source Context, outside the bounded scope. PKT-SD-112-113 is already
    integrated, so extracting from it would duplicate canonical rows and cite pages outside this packet's
    range.
non_edge_observations:
- id: OBS-01
  subject: the luck token row follows a table precedent exactly
  detail: 'One cell has a reborn phoenix rise into the sky and grants a luck token. rule_luck_token is
    canonical from printed page 79 with 6 rows, and one of them is the precise precedent: tbl_carousing_outcome
    FEEDS_INTO rule_luck_token on outcome benefit, a table result granting a token, integrated from printed
    page 93.

    Recorded because the type choice was not obvious. rule_pulp_mode reaches the same target with MODIFIES
    at improves, on starting supply and token capacity, and those rows change the rule''s own parameters.
    Granting one token is an instance of the rule operating, not a change to it, so FEEDS_INTO is right
    and the polarity is Builder''s to derive as neutral. Taking MODIFIES here would have asserted that
    a desert encounter alters how luck tokens work.'
- id: OBS-02
  subject: the nets are a trap in substance and are declined on wording
  detail: 'A cell has bone-barbed nets snap up from beneath the sand. That is a concealed device that
    springs on the party, which is what rule_traps governs, and three encounter tables have already earned
    a reach to it.

    All three say trap. This one does not, and the disposition that has held since printed page 147 is
    that the source must name the thing rather than that I must recognise it. This is the third near-miss
    of that kind, after the crawlers on 147 and the floor giving way on 151, and the three together are
    now a better description of the chapter''s boundary than any single one: the encounter tables are
    full of situations the rules could govern, and the graph records only the ones the source labels.
    If the Reviewer takes a different view on any of the three, they should probably all move together.'
- id: OBS-03
  subject: the desert page is the arctic page's twin and states no damage
  detail: 'Arctic and desert are the same hex terrain result on printed page 132, Desert/arctic, and the
    two tables are built alike. The arctic table has a blizzard and a temperature drop that each deal
    a stated die of damage per round to the unsheltered, which is the only TRIGGERS row this chapter has
    produced. The desert table has a sandstorm lasting a stated number of hours, a collapsing dune and
    a sweeping rain, and states no damage at all.

    Recorded because it is the cleanest available demonstration that the arctic row came from the source
    rather than from a habit of reading weather as harm. Two pages of the same kind, one states mechanics
    and one does not, and the graph reflects the difference.'
