    quoted_gist: '40 gp, 120 gp, 200 gp, 280 gp, 360 gp, ×2'
    why_considered: 'Checked for item_coin monetary relationships or price valuations.'
    rejection_reason: >-
      Monetary values (40 gp, 120 gp, etc.) and multipliers (×2) are numeric magnitudes prohibited
      from edge aspect and condition by Invariant 11 and Constitution section 5. They do not generate edges.
  - text_locus: 'LUXURY ITEMS TABLE entry descriptors and subtables, p279'
    quoted_gist: '1d4: 1. Memnon, 2. Ord, 3-4. Madeera; 1d4: 1. Chaos, 2. Neutrality, 3-4. Law; 1d4: 1. shield, 2. helm, 3. bracers 4. greaves'
    why_considered: 'Checked for deity_memnon, deity_ord, deity_madeera_the_covenant, alignment identities, or armor edges.'
    rejection_reason: >-
      Table entry descriptors and dice options (1d4 subtables) are generation details and cosmetic
      variations. Mention of deity names or alignments on icons/altars does not establish mechanical
      worship or alignment rules (Constitution 2.2, 2.4). Mention of shields or helms as holy relics
      describes trade goods rather than armor class calculations.
