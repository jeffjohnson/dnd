source_summary: >-
  Pages 278–279 present the Mundane Items section, which covers valuable non-magical treasure:
  - Introductory prose defines mundane treasure and discusses luxury items and gemstones;
  - GEMSTONES TABLE lists standard gemstone types (pearl, emerald, ruby, sapphire, diamond) and their base gold piece values, plus a x2 multiplier for giant gems;
  - GEMSTONE UNIQUE FEATURE TABLE provides a d20 table of distinctive physical details and quirks for gemstones;
  - LUXURY ITEMS TABLE provides a d20 generator combining features with luxury objects (with 1d4 subtables for specific items);
  - A closing dwarven proverb is quoted from Jorbin.

