non_edge_observations:
- id: OBS-01
  subject: magnitudes are excluded from every row
  detail: 'This page is almost entirely numeric and none of it reaches a field: the three encounter intervals
    by danger level, the die expression and multiplier for remaining light, the hex width in miles, the
    four hexes-per-day rates in the table, the halved rate for difficult terrain, the deprivation periods
    for water and for food, and the damage die per day. Every one stays in the immutable packet. No row
    in this packet carries a condition at all, so there is no opportunity for a spelled quantity to enter
    one; verified programmatically that no aspect carries a digit.'
- id: OBS-02
  subject: the three danger levels are not proposed as identities
  detail: 'Unsafe, Risky and Deadly are named on this page and each is given an interval. They are not
    proposed, because rule_danger_level is already canonical from printed page 86 as the single rule,
    its three values were not proposed there either, and the only thing distinguishing them here is an
    interval, which is a magnitude no field may store. Proposing three identities whose entire content
    is an excluded number would add nodes that carry nothing.

    This is a different judgement from the spell tiers, which were minted as five identities, and the
    difference is worth stating: the tier values each carry classification relations to spells and were
    authorized by a Decision, whereas the danger levels carry only a rate. If that judgement is wrong
    the correction is additive and no existing row repoints.'
- id: OBS-03
  subject: the hexes crossed table's rows are not proposed as identities
  detail: Walking, Mounted and Sailing are travel methods named only in the table and carrying only a
    rate. They are not proposed, for the same reason as OBS-02. The table itself is proposed, as tbl_hexes_crossed,
    and the rule is RESOLVED_BY it, which is the shape used for every other canonical table. Difficult
    and arduous terrain are the two table rows with a canonical counterpart, so the terrain rule is carried
    as a constraint on the table rather than as two new identities.
- id: OBS-04
  subject: the hex is proposed but its size is not
  detail: 'rule_hex is proposed because the page uses it as a real mechanical unit: travel is counted
    in hexes, the extra-hex check is per hex, and the navigation check fires on exiting one. Its stated
    width in miles is a magnitude and is not stored anywhere, so the identity carries the unit without
    the number. rule_distance is canonical and is a different concept, the close, near and far band vocabulary
    used in combat and spells, so the two are deliberately not conflated.'
- id: OBS-05
  subject: what ends deprivation is carried, what causes it is not timed
  detail: 'Recorded because the last three packets each had a Review finding of exactly this shape. The
    deprivation rule has three stated facts: it inflicts damage, the damage cannot be healed until the
    character eats or drinks, and it begins after stated periods. The first two are carried, as a TRIGGERS
    into damage and an EXCLUDES against hit point recovery, and the ending condition is carried as the
    rations row. The third is only a magnitude and has nothing to point at: no identity represents elapsed
    days without supply, and rule_time_passes is a GM procedure for advancing the clock rather than a
    hunger timer. So the graph will show what deprivation does and how it stops, but not when it starts.'
unresolved_identity_questions:
- id: IDQ-01
  subject: whether rations should be linked to the deprivation rule at all
  detail: 'The page says the damage cannot be healed until eating or drinking. It does not say rations.
    I asserted item_rations EXCLUDES rule_food_and_water with evidence explicit_reference, because rations
    are the book''s food item, canonical from printed page 34, and already consumed by the resting rule,
    so eating in Shadowdark means rations.

    Two reasonable objections. The row supplies an endpoint the source did not name, which is the kind
    of small inference that accumulates; and it covers food while saying nothing about water, for which
    no identity exists, so the rule''s two halves are treated unequally.

    I asserted rather than omitted because the last three Reviews each withheld approval for an outcome
    or an ending the source stated and I had not carried, and this is an ending the source states. Consequence
    if wrong: one row is withdrawn, the deprivation rule keeps its other two rows, and the ending condition
    survives in the source text only. Flagged so the choice is the Reviewer''s rather than mine by default.'
architectural_escalations: []
architectural_escalation_note: None raised. Every identity uses an approved prefix, every row uses a legal
  edge type, no CLASSIFIED_AS row appears, and no row targets a sys_ axis. rule_light_source is used as
  an ordinary endpoint, which DEC-2026-0104 does not restrict; that Decision governs only the item classification
  form, which is still gated and is not used here. The two standing cross-packet items from earlier packets,
  the rule_invisibility gap and the rule_morale connection, are unchanged and unaffected by this packet.
completeness_statement: All seven headings in the bounded scope were read at the recorded checksum. The
  packet yields 5 new identities and 19 rows, every one checked against the 595 canonical edges both for
  an assertion-key collision and for a shared source, type and target under a different aspect; there
  are none of either. Fifteen canonical identities are reused rather than re-proposed, found by reading
  the registry in full rather than by keyword search. One restatement, the danger-level encounter cadence
  from printed page 86, is deliberately not re-asserted and is explained in restatement_note; it would
  have collided exactly. No row carries a condition and no aspect carries a digit. What is deliberately
  not asserted is listed as OBS-01 through OBS-05, and the single open question is IDQ-01. No assertion
  depends on any other ruleset.
