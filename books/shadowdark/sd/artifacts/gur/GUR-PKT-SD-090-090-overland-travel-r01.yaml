page_attribution_basis: One marker resolves this packet. p90 ends the OVERLAND TRAVEL heading, which is
  also the section's first heading, and placement rule 1 applies it to that whole heading while the persistence
  rule carries it across every subsequent subsection, since no further marker appears in the span. All
  nineteen rows cite printed page 90. No content precedes the first marker and no page is shared with
  another packet.
scope_boundary: The bounded scope is the Primary Source Material section, the single printed page 90 and
  its seven headings. The trailing Supporting Source Context is out of scope.
source_summary: One page of procedural rules that explicitly add to the crawling rules rather than replacing
  them. Play continues in initiative order and the page points to the Time Passes rules for elapsed travel
  time. Random encounters are checked on a cadence set by the danger level. Light source duration remaining
  is rolled for, and total darkness rarely occurs outdoors. Travel rate is a number of hexes per day by
  method, given in a table that also covers difficult and arduous terrain, with a check required for each
  extra hex attempted. Navigation in unfamiliar territory requires a check on leaving a hex, and failure
  moves the group into a random adjacent hex. Deprivation of food or water inflicts damage after stated
  periods, and that damage cannot be healed until the character eats or drinks.
graph_state_at_extraction: 'Read from the repository at extraction, not recalled: the canonical graph
  holds 265 registry rows and 595 edges. This time the registry was read in full rather than searched
  by keyword, which is a deliberate change of method: on the previous packet a keyword survey missed rule_natural_twenty
  and cost a required row that the Reviewer had to catch. Reading the whole registry surfaced rule_danger_level,
  rule_time_passes, rule_encounter, rule_total_darkness and item_rations as existing identities this page
  touches, several of which a keyword search for travel terms would not have returned.

  Every proposed row was checked against the canonical edge set both for an assertion-key collision and
  for the weaker case of an existing row sharing source, type and target under a different aspect; there
  are none of either.'
restatement_note: 'One restatement is deliberately not re-asserted, and it is the sharpest so far because
  it would have collided exactly rather than merely duplicated.

  rule_danger_level FEEDS_INTO rule_encounter with aspect check cadence is already canonical from printed
  page 86, where the resting rules define the danger levels and their encounter cadence. This page states
  the same relationship for overland travel with different intervals. The intervals are magnitudes and
  no field stores them, so an overland row carrying that pair, type and aspect would be the identical
  assertion, rejected under the section 4 key.

  What is asserted instead is the pair of rows that are genuinely new: the danger level feeds the overland
  rule, and the overland rule feeds the encounter check with aspect overland cadence. That preserves the
  fact this page adds, which is that overland travel has its own cadence, without duplicating the fact
  page 86 already carries.'
