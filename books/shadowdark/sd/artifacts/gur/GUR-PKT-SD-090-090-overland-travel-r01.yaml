authored_polarity_declaration: Authored polarity appears on five rows and no others, each with basis read
  as invariant 15 requires, and each is a MODIFIES, TRIGGERS or CONSTRAINS row as constitution section
  5 allows. The three CONSTRAINS rows take governs. Navigation's misdirection takes worsens. Deprivation
  takes inflicts. The eight FEEDS_INTO, three EXCLUDES, one CROSS_REFERENCES, one RESOLVED_BY and one
  GATES row carry none, since section 5 derives those.
evidence_class_note: 'Seventeen rows are explicit_rule and two are explicit_reference. Measured rather
  than asserted: production holds 595 rows, of which 588 are explicit_rule and 7 are explicit_reference,
  and all 7 come from printed pages 28 and 29. These two are therefore the first use of that class since
  page 29, and both are deliberate.

  The Time Passes row is explicit_reference because the page''s assertion is the pointer itself: it names
  the rule and its page number and tells the reader to use it as needed, rather than stating a mechanic.
  The rations row is explicit_reference because the page says deprivation ends on eating or drinking without
  naming rations; rations are the book''s food item, canonical from printed page 34 and already consumed
  by resting, so the connection is sound but is a reference rather than a statement. IDQ-01 records the
  alternative reading.'
