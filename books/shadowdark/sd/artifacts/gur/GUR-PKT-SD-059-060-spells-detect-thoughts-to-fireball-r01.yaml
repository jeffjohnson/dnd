authored_polarity_declaration: >-
  Rows carrying authored polarity are the MODIFIES and TRIGGERS rows listed above, each with basis
  read and each read aloud as source polarity target before being recorded. A damage or death row is
  inflicts, a restorative or enabling row is improves, and a hindrance is worsens. No row uses basis
  heuristic or unset.
  Every CONSTRAINS row carries governs with basis read, as invariant 15 requires. Each runs from a
  check or a level to the spell it bounds, and governs rather than worsens is the reading because the
  row records a bound on when the spell applies, not a degradation of it. EXCLUDES, GATES and
  FEEDS_INTO rows take their derived polarity from the section 5 table and the Analyst authors none
  of them.

domains_touched: []
candidate_domains:
  - proposed: magic
    basis: >-
      Every identity proposed here is a spell. Recorded as a candidate only; the priest, wizard and
      magic-rules packets each recorded it already. Constitution section 8 reserves promotion to an
      Architect Decision and the Analyst does not decide a candidate domain is official.

domain_boundary_questions:
  - >-
    Spells reach damage, death, movement, hit points, carrying capacity and the check machinery, so a
    spell node belongs to magic and to whatever domain its effect touches. Deferred; no domain is
    asserted on any edge.

candidate_general_rules: []
candidate_general_rules_note: >-
  None proposed. The repeated shapes here, a damaging spell triggering damage or a focus spell taking
  its duration from focus, look like general-rule candidates but are not: each row states a different
  spell's own effect, and a rule covering them would have to assert that every spell of a kind
  behaves alike, which the entries do not say and which the counterexamples on these pages contradict.

non_edge_observations:
  - id: OBS-01
    subject: the tier and class lines are the largest deliberate omission
    detail: >-
      Restated here because it is the single most consequential decision in this packet and should not
      be buried in a prose field. Every entry states its tier and its casting class. Neither is
      asserted, for the reason in why_attribute_lines_are_not_edges. The consequence is concrete: a
      query for which spells a wizard may cast, or for which spells are tier 5, returns nothing, and
      the canonical row making a spell's tier drive its casting difficulty has no per-spell tier to
      draw on.
  - id: OBS-02
    subject: a Focus duration is asserted and the other three attribute values are not
    detail: >-
      The asymmetry is deliberate. Focus names a mechanic defined on printed page 50 and already
      canonical, so a focus row relates two identities. Instant, a count of rounds or days, close,
      near, far and self are values of a category rather than identities, and the family-level rows
      from the magic-rules packet already carry that range and duration bound a spell at all.
  - id: OBS-03
    subject: creatures named in effect prose are not proposed
    detail: >-
      Several entries summon or create a creature, naming zombies, skeletons, wights, wraiths, demons,
      devils and angels. None is proposed. The Monsters chapter is their defining locus and is not yet
      claimed, and minting a creature identity from a spell's effect sentence is the secondary-listing
      case SOURCE_MARKDOWN Source Identity Authority prohibits. The summoning relationships are
      therefore not asserted either, and the affected spells are registry additions.
  - id: OBS-04
    subject: qualified bonuses and properties are collapsed to the relationship
    detail: >-
      Some entries qualify an effect, such as dealing a larger die against undead, or add a property,
      such as a weapon becoming magical. The graph stores the relationship, not the magnitude, so a
      qualified bonus is one MODIFIES row and the qualification is not stored; a property with no
      second identity is not asserted at all. Both are recorded here so the flattening is visible.
  - id: OBS-05
    subject: spells that act on other spells
    detail: >-
      A few entries target magic itself rather than a creature, ending a spell, suppressing casting in
      an area, or declining to affect another instance of themselves. Where the target is the casting
      mechanic or the duration attribute, a row is asserted. Where the target is an unnamed other
      spell, no row is possible: the graph has no identity for an arbitrary spell, and the entries
      that name a specific other spell name one whose own entry is in a later packet.
  - id: OBS-06
    subject: magnitudes deliberately excluded
    detail: >-
      These entries are dense in magnitudes: every damage and healing die expression, every duration
      in rounds or days, every level threshold, every bonus, every area and distance band, every
      weight and capacity. All are die expressions, thresholds, counts or magnitudes, excluded by
      constitution section 1 and invariant 11. They remain in the immutable claimed packet, which is
      the authority for the values themselves. No aspect in this GUR contains a digit, and the
      conditions that refer to a level name it qualitatively rather than encoding the threshold.

unresolved_identity_questions:
  - id: IDQ-01
    subject: spell identities are proposed alongside two existing family identities
    detail: >-
      spell_wizard_spells and spell_priest_spells are canonical, proposed from the class entries as
      source-named families. The ten identities here are individual spells under the same prefix,
      which constitution section 2 admits, its gloss being a spell or source-named spell family.
      Nothing relates an individual to its family, for the membership reason above, so the graph now
      holds both levels with no link between them.
      Consequence if wrong: if a Decision later provides a membership representation, forty or more
      rows can be added without retracting anything published here. If instead the families are judged
      redundant once individuals exist, that is a merge question for the packets that proposed them.
  - id: IDQ-02
    subject: spells sharing a name with another identity
    detail: >-
      Some spell names collide with identities already in the graph or likely to enter it, and
      constitution section 2 states that labels do not determine identity. No merge is asserted here.
      Reviewer should treat a shared label as coincidence unless a defining locus says otherwise.

architectural_escalations: []
architectural_escalation_note: >-
  None raised by this packet. Every proposed node uses the approved spell_ prefix with an unchanged
  kind, every edge uses one of the thirteen legal section 3 types, and no new prefix, edge type,
  domain promotion or general-rule application is requested.
  The tier and class membership question is genuinely architectural and is raised separately rather
  than from inside any one spell packet, because it now spans ancestries, alignments, deities,
  languages and spells and will recur for monsters and treasure. That escalation does not block this
  GUR: every row here is correct whatever the ruling, and a later successor revision can add
  membership rows without retracting an assertion.

completeness_statement: >-
  All printed pages in the declared span are accounted for. Every one of the ten spell entries was
  read in full, including its heading, its tier and class line, its duration and range lines, and all
  of its effect prose. Each entry produced either one or more edges or a marked registry-addition-only
