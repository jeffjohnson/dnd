page_attribution_basis: >-
  Markers resolve through the Pandoc AST rather than positionally. Each is a plain marker ending a
  spell heading, which placement rule 1 applies to the whole heading, and the entries between markers
  take their page from the persistence rule. Every row below is cited to the page of its own spell's
  entry, which for an unmarked entry is the page of the last marked heading at or before it.

out_of_scope_context_warning: >-
  This packet's Supporting Source Context reproduces printed pages 44 through 53 and 82 through 86,
  which define the casting procedure, the spell tiers, durations and ranges, and both spell lists.
  Those are precisely the attributes every entry here carries. They were not read as evidence. Every
  assertion below is drawn from an entry on printed pages 59 to 60 and cites one of them, and the
  attribute lines themselves are dispositioned rather than asserted.

scope_boundary: >-
  The bounded scope is the Primary Source Material section, printed pages 59 through 60. The magic
  rules on printed pages 43 to 50 are claimed by PKT-SD-043-050 and the two spell lists by
  PKT-SD-051-053; nothing here is drawn from either.

source_summary: >-
  Ten complete spell entries in alphabetical order. Each carries a heading, an italic line giving the
  spell's tier and the class or classes that may cast it, a duration line, a range line, and prose
  describing the effect. This summary is orientation only; every assertion below cites its page.

extraction_posture: >-
  Each entry is its own defining locus under SOURCE_MARKDOWN Source Identity Authority, so all ten
  spells are proposed here. What is extractable is the effect prose, and only where it names a second
  identity this graph already holds. The four attribute lines are not asserted; see
  why_attribute_lines_are_not_edges. 3 of the ten entries state no relationship between two
  identities and are registry additions only, each marked and given its basis so that an accidental
  orphan remains distinguishable.

why_attribute_lines_are_not_edges: >-
  Every entry opens with a tier and class line, a duration and a range. All four are category
  membership: this spell is tier 2, is a wizard spell, has a focus duration, reaches near. No legal
  edge type in the closed section 3 vocabulary expresses membership, and the Analyst has now declined
  the same shape for ancestries against their axis, alignments and deities against theirs, and
  languages against their tables, in each case because the nearest candidate types assert something
  false rather than something unprovable.
  Two of the four are already carried at the family level from their own defining locus: printed page
  50 states that range bounds a spell's delivery distance and duration bounds how long its effects
  last, and GUR-PKT-SD-043-050 asserts both against the two spell families. Re-asserting them per
  spell would multiply one stated rule by forty.
  The one exception is a Duration line reading Focus. That value names a mechanic rather than a
  category, and printed page 50 defines focus as a duration the caster sustains, so a focus row is a
  real dependency on a real identity and is asserted.
  The tier and class lines are the load-bearing omission and the Analyst does not minimise it: tier
  drives the casting difficulty and the mishap table, and class membership gates scroll and wand use.
  Both are stated per spell only here. That question is raised for the Architect rather than decided
  in a packet; see architectural_escalation_note.

why_some_spells_carry_no_edge: >-
  A spell is a registry addition only when its effect prose names no second identity this graph
  holds. Three patterns account for every such entry. Some describe a fictional change with no
  mechanical hook, such as altering one's anatomy or fixing an object in place. Some summon or create
  a creature, and no creature identity exists because the Monsters chapter is their defining locus
  and is not yet claimed. Some grant information from the GM, such as a yes-or-no answer to a
  question, which is a procedure of play rather than a relation between two mechanics.
  Each is still proposed, because this page is the spell's defining locus and registry additions are
  isolated from edge insertions, so Reviewer may approve the identity on its own under DEC-2026-0003.
  A later packet that defines the missing identity can assert the relationship then.

graph_state_at_extraction: >-
  The canonical graph holds 155 registry rows after the integrations to date, and the registry was
  read at extraction rather than recalled. Every endpoint these entries reach is already canonical,
  so this GUR reuses rather than proposes for all of them and proposes only the ten spells. No spell
  named here is canonical. The domain registry is still empty and general_rules.json is still an
  empty object.

