non_edge_observations:
  - id: OBS-01
    subject: the armor line reads None and EXCLUDES was considered and rejected
    detail: >-
      This is the one class entry whose Armor line denies rather than permits, and EXCLUDES, which
      actively prevents a relation, reads naturally for it. M001 uses CONSTRAINS anyway, deliberately.
      All four class entries state the same rule in the same place, namely which armor this class may
      wear, and they differ only in the permitted set: all armor and shields for the fighter and
      priest, two named armors for the thief, none for the wizard. Representing three of them as
      CONSTRAINS and the fourth as EXCLUDES would make one rule appear as two different kinds of
      relationship, and a query asking which classes bound armor would have to know to look for both.
      The graph stores the relationship, not its magnitude, and an empty permitted set is the value
      here. Recorded so Reviewer can overturn this if it prefers the sharper reading; it is a
      presentation choice within the closed vocabulary, not a source question, and nothing else in
      the row would change.
  - id: OBS-02
    subject: common and rare languages are a classification this entry uses but does not define
    detail: >-
      The Languages benefit grants additional common languages and rare languages, distinguishing two
      kinds. That distinction is mechanical and is not extracted: this entry uses the classification
      and points at printed page 32 for it, which is the Languages section and its defining locus. As
      in the ancestries and priest packets, no individual language identity is proposed either. M003
      asserts that the class supplies starting languages, which is what this page supports without
      fixing a language ontology from a class entry.
  - id: OBS-03
    subject: spell tier is again depended on and again not defined here
    detail: >-
      The spells-known table is organised by spell tier, the entry grants three tier 1 spells at the
      outset, and a talents row refers to any tier you know. Tier is plainly a real mechanic and is
      not proposed, for the reason recorded in the priest GUR: the table's columns are its only
      appearance, the page defines nothing about what a tier is, and Spell Attributes on printed page
      50 is the defining locus. That page is reproduced in this packet's own Supporting Source
      Context and was deliberately not read. Two packets now defer this identity.
  - id: OBS-04
    subject: advantage remains the unextracted mechanism behind a talents row
    detail: >-
      One talents row grants advantage on casting a chosen known spell. As with Stout, Grit, Thievery,
      the thief's initiative talent and the priest's casting talent, M018 asserts the effect rather
      than the mechanism, because printed page 9 defines advantage without relating it to any other
      named mechanic. This is the sixth packet to depend on advantage. Rolling the Dice on printed
      page 78 is the defining locus, and the dependency is now the most-repeated deferral in the
      intake.
  - id: OBS-05
    subject: four navigational page pointers are not drawn as edges
    detail: >-
      The entry points at Languages on printed page 32, the wizard spell list on printed page 52,
      Spellcasting on printed page 44, and Magic Item Attributes on printed page 282. Each is a reader
      pointer to a packet not claimed here. A CROSS_REFERENCES edge needs two identities, and in each
      case the target is a page rather than a named mechanic this packet can supply. The relationships
      those pointers stand behind are asserted where this page states them in its own words.
  - id: OBS-06
    subject: the final talents row is again a choice with no fixed target
    detail: >-
      The highest outcome row reads Choose a talent or points to distribute to stats, identical in
      shape to the other three classes'. Neither branch names a determinate target, so no edge can be
      drawn without the Analyst choosing one. All four class entries have now repeated this row
      verbatim, which confirms it is a standard closing row rather than a class-specific effect and
      makes it a good candidate for a single ruled treatment once a role that may raise an escalation
      considers the set complete.
  - id: OBS-07
    subject: the two permitted weapons are not proposed
    detail: >-
      The Weapons line names dagger and staff. As in the priest and thief entries, no weapon identity
      is proposed: a permission list is a secondary listing under SOURCE_MARKDOWN Source Identity
      Authority and cannot name a concept whose defining locus is the Weapons chapter on printed page
      292 or the Gear section on printed page 34. All four class entries have now deferred this, and
      the debt is now four entries deep.
  - id: OBS-08
    subject: flavour carries no mechanics
    detail: >-
      The entry opens with a sentence about rune-tattooed adepts, bespectacled magi and
      flame-conjuring witches. It establishes tone, names no mechanic and states no dependency.
  - id: OBS-09
    subject: magnitudes deliberately excluded
    detail: >-
      The pages carry the hit point die, the counts of additional languages, the study time and
      difficulty value for learning a spell, the count and tier of starting spells, every one of the
      fifty cells in the spells-known table together with its ten level rows and five tier columns,
      the talents table's die expression and all five row ranges, the magic item count, the stat
      increase, the spellcasting bonus, the additional spell count and the distributable points. All
      are die expressions, counts, numeric bonuses, durations or thresholds, excluded by constitution
      section 1 and invariant 11. They remain in the immutable claimed packet. No aspect in this GUR
      contains a digit and no condition encodes a numeric value.
  - id: OBS-10
    subject: the supporting source context was available and deliberately unread
    detail: >-
      This packet reproduces printed pages 44 through 50 and 86, including the wizard mishaps tables
      and the scrolls-and-wands material that this class entry depends on directly. Those pages would
      answer what a spellcasting check is, what a spell tier is, and what a spell scroll does. They
      were not read as evidence. Recorded explicitly because the omission would otherwise look like
      an oversight rather than the scope rule being obeyed.

unresolved_identity_questions:
  - id: IDQ-01
    subject: the four class entries are now complete and their shared shape is unresolved
    detail: >-
      With the wizard entry, all four classes are extracted. Each produced the same five relationship
      shapes: a class constrains armor, feeds hit points, gates its own benefits, resolves its talent
      roll on its own table, and for the two casters gates a spell family and a spells-known table.
      Each also deferred the same two things, the permitted weapons list and the advantage mechanism.
      No single packet can settle whether these shapes should remain as per-class rows, be promoted to
      general rules, or coexist with the class-axis rows the overview packet asserted from printed
      pages 12 to 14. That question is now ripe and is recorded here because this is the packet that
      completes the evidence for it, not because this packet can answer it.
      Consequence if wrong: if general rules are later approved for these shapes, the per-class rows
      become derived applications and the establishing rows must be identified; under invariant 19
      the establishing edges would leave general_rule_id empty, which every row here already does.
      Nothing published needs retracting either way.
  - id: IDQ-02
    subject: two item identities are minted from single mentions
    detail: >-
      item_spell_scroll is named twice in one benefit and item_magic_item once in a talents row.
      Neither is defined here; their loci are Scrolls and Wands on printed page 49 and the magic item
      chapters beginning at printed page 282. Both are proposed only because M007 and M015 need
      endpoints and a GUR must propose every endpoint its edges use.
      Consequence if wrong: the defining chapters may use different spellings, may distinguish a
      scroll from a spell scroll, or may split magic items by type, in which case M007 and M015
      repoint. The Analyst judged that recording a stated CONSUMES relationship and a stated creation
      permission with provisional identities is better than discarding them. Reviewer should
      de-duplicate against those packets when they are read, and the defining packet's name takes
      precedence over these stems.

