page_attribution_basis: >-
  Two markers resolve in the Primary Source Material, both through the Pandoc AST rather than
  positionally. {#p24} ends the WIZARD CLASS heading and {#p25} ends the WIZARD SPELLS KNOWN BY SPELL
  TIER TABLE heading; placement rule 1 applies each to its whole heading. The persistence rule
  carries page 24 through the three benefits and page 25 through both tables. The WIZARD TALENTS
  TABLE carries no marker of its own, so under the persistence rule it inherits page 25; every row
  drawn from it is cited accordingly, which is the one page attribution on this page that a
  positional reading could get wrong.

out_of_scope_context_warning: >-
  This packet's Supporting Source Context reproduces printed pages 44 through 50 and 86, which
  include the wizard mishaps tables and the scrolls-and-wands material that this class entry depends
  on directly. They were not used. Every assertion in this GUR is drawn from printed page 24 or 25
  and cites one of them. Where this entry refers to a mechanic defined on one of those pages, the
  identity is proposed as provisional and the reference is recorded as an observation, exactly as if
  the text were absent from the file.

scope_boundary: >-
  The bounded scope is the Primary Source Material section, printed pages 24 and 25. The parser
  resolves nine further pages inside the trailing Supporting Source Context, all claimed by other
  packets, so the zero-overlap rule across the intake holds for this packet.

source_summary: >-
  Printed page 24 is the wizard class entry: a heading, a flavour sentence, three attribute lines
  giving two permitted weapons, an armor line reading None, and a hit point die per level, and three
  separately named benefits covering additional known languages, permanently learning a spell from a
  scroll on a successful check, and spellcasting with its spells-known and level-progression
  paragraphs. Printed page 25 carries the spells-known table, ten character-level rows across five
  spell-tier columns, and a five-row rollable talents table. This summary is orientation only; every
  assertion below cites its page.

graph_state_at_extraction: >-
  The Shadowdark canonical graph is still empty; nodes.csv is header-only, the domain registry has no
  domains, general_rules.json is an empty object, and character_races.yaml is inactive. The three
  supplied slices named in the packet manifest as missing remain immaterial, re-assessed here rather
  than carried over from claim. reused_nodes is empty. Eight of the fifteen identities below are
  already proposed by sibling GURs from their defining loci and are marked as such.

cross_packet_identity_note: >-
  item_armor, rule_hit_points, sys_language, exp_level, rule_talent_roll, rule_spellcasting_check,
  rule_check and abil_intelligence are proposed by sibling GURs from their defining loci and are
  proposed again here because this patch uses them as edge endpoints. A GUR must propose every
  endpoint its edges use: an endpoint present only in a sibling GUR is not canonical, is not proposed
  by the patch, and fails invariant 1 as endpoint_unresolved. Proposing them is not a competing
  naming; each records its defining locus and the sibling GUR that also proposes it, and each ID and
  label is reproduced exactly.

