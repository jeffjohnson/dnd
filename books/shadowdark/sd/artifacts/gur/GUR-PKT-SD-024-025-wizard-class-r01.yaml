    establishing_locus: 'SD page 24, the Languages, Learning Spells and Spellcasting benefits inside the WIZARD CLASS entry'
    basis: >-
      M004 and M009 repeat the shape recorded from the fighter, priest and thief entries. All four
      class entries now show it, and the ancestries packet recorded a structurally identical
      candidate for ancestry benefits.
    not_applied: >-
