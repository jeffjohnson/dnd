authored_polarity_declaration: >-
  Six rows carry authored polarity, all with basis read: M001 and M012 CONSTRAINS governs, and M016,
  M017, M018 and M019 MODIFIES improves. Each is among the three types constitution section 5
  requires to carry source-reviewed authored polarity, and each was read aloud as source polarity
  target before being recorded. No row uses basis heuristic or unset. No other row carries a polarity
  or polarity_basis value: the five GATES rows, the four FEEDS_INTO rows, the two RESOLVED_BY rows,
  the one CONSUMES row and the one EXCLUDED_FROM row take their derived polarity from the section 5
  table and the Analyst authors none of them.

domains_touched: []
candidate_domains:
  - proposed: magic
    basis: >-
      Spells, spell tiers, spells known, spellcasting checks, spell scrolls and magic items are a
      coherent cluster this entry depends on more heavily than any packet read so far, and the
      contents list gives magic its own chapter. Recorded as a candidate only; the priest packet
      recorded the same candidate from its own page, so two packets now support it. Constitution
      section 8 reserves promotion to an Architect Decision and a lone occurrence does not promote a
      domain; two do not either, and the Analyst does not decide a candidate domain is official.
  - proposed: character_creation
    basis: >-
      A class is chosen at creation and its languages and starting spells are received then. Recorded
      as a candidate only; now suggested by a sixth packet, and deliberately not treated as promotion.

domain_boundary_questions:
  - >-
    The wizard entry reaches magic, items and creation at once, and unlike the other three classes it
    barely touches combat. Whether that makes a class node's domain class-specific cannot be settled
    here. Deferred; no domain is asserted on any edge in this GUR.

