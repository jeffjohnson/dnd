      escalation once a role that may raise one judges the affected set complete. No edge in this GUR
      sets general_rule_id.
  - proposed: every class resolves its talent roll on its own talents table
    establishing_locus: 'SD page 25, WIZARD TALENTS TABLE'
    basis: >-
      M014 is the wizard instance and completes the set of four. Four separately headed and
      materially different tables are now read, which settles the fighter GUR's IDQ-02 in the
      negative: they are not one shared table.
    not_applied: >-
