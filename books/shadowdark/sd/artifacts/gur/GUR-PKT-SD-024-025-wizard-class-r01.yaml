architectural_escalation_note: >-
  None raised. Every proposed node uses an approved constitution section 2 prefix with an unchanged
  kind, every edge uses one of the thirteen legal section 3 types, and no new prefix, edge type,
  domain promotion or general-rule application is requested. ESCALATION_CONTRACT states that a
  proposed node under an approved prefix and kind which passes identity and duplicate checks is
  ordinary GUR, GUP and Review work rather than an escalation.
  IDQ-01 records that the class-shape question is now ripe, and the two general-rule candidates above
  are the strongest in the intake so far. The Analyst does not escalate them: constitution section 5
  and the Analyst prohibitions reserve general-rule promotion to an Architect ruling and forbid the
  Analyst from promoting one, and nothing here is blocked in the meantime, since every affected row is
  published with general_rule_id empty and remains correct whether or not a rule is later approved.
  Recorded for Reviewer and Architect to act on when they judge the affected set complete.

completeness_statement: >-
  Both printed pages in the declared span are accounted for. Page 24 was read in full: the WIZARD
  CLASS heading, the flavour sentence in OBS-08, the Weapons line in OBS-07, the Armor line supplying
  M001 with the EXCLUDES alternative in OBS-01, the Hit Points line supplying M002, the Languages
  benefit supplying M003 with its common and rare distinction in OBS-02, the Learning Spells benefit
  and both its following paragraphs supplying M004 through M008, and the Spellcasting benefit and all
  three of its following paragraphs supplying M009, M010 and M013, with their page pointers in
  OBS-05. Page 25 was read in full: the WIZARD SPELLS KNOWN BY SPELL TIER TABLE heading, its Level
  column and five tier columns supplying M011 and M012, all ten level rows whose fifty cells are
  magnitudes recorded in OBS-09, the WIZARD TALENTS TABLE heading and column headers supplying M014,
  and all five talents rows of which four supply M015 through M019 and the fifth is dispositioned in
  OBS-06. Every page marker was resolved through the Pandoc AST and the in-scope resolved page set
  matches the declared span with no gap; the talents table's page attribution follows the persistence
  rule and is stated explicitly in page_attribution_basis. The Supporting Source Context reproducing
  printed pages 15, 44 through 50 and 86 is out of scope, was deliberately not read as evidence, and
  contributed nothing, as recorded in OBS-10. Nineteen edges are proposed across fifteen candidate
  nodes, eight of which are also proposed by sibling GURs from their defining loci and are marked as
  such. No node is reused because the Shadowdark graph is empty. Content not converted to an edge is
  accounted for in OBS-01 through OBS-10, and every identity the Analyst could not settle is recorded
  in IDQ-01 and IDQ-02 rather than resolved by picking a plausible ID. No assertion depends on any
  other ruleset.
