rejected_candidates:
- text_locus: the creature results across the table, pp150 and 151
  quoted_gist: brain eaters, an albino hydra, drow in six cells, beastmen, an aboleth overlord, giant
    leeches, mushroomfolk, deep gnomes, cave creepers, a mummy, ropers, a purple worm in three cells,
    a strangler, hell hounds, cockatrice, minotaurs, darkmantles, astral spiders, cloakers, a cave brute,
    gibbering mouthers, a bone naga, a shadow, a night hag, the Ten-Eyed Oracle and the Wandering Merchant
  why_considered: The densest creature table in the chapter so far, and two entries are individually named.
  rejection_reason: A creature's defining locus is its stat block in the unextracted monster chapter and
    the registry holds no monster_ identity. Proposing any of these would take identity ownership from
    the packet that owns the defining locus. Fifth packet running for the same disposition.
- text_locus: the floor giving way into a sinkhole, p151
  quoted_gist: the floor gives way into a sinkhole of a stated depth in feet
  why_considered: rule_falling is canonical from printed page 85 with 2 rows and already triggers rule_damage,
    and a floor giving way under the party with a measured depth is as close as this chapter has come
    to invoking it. Depth in feet is exactly what a falling rule consumes.
  rejection_reason: The cell never says fall or falling, states no check and states no damage; what it
    states beyond the event is a depth, which is a magnitude. An almost identical cell on printed page
    144, a deep sinkhole falling open with a river far below, was declined two packets ago on exactly
    this ground, and the only difference here is that the floor gives way underfoot rather than beside
    the party. That is too fine a line to carry a row across seventeen remaining packets of this chapter.
    Recorded as OBS-02; if the Reviewer holds that a floor giving way states a fall, the row is a one-line
    addition.
- text_locus: the status-effect results, pp150 and 151
  quoted_gist: shimmering spores that cause lethargy, sour gas causing auditory hallucinations, dripping
    ooze that douses flames and sticks creatures in place, gravity reversing for a stated number of rounds
  why_considered: Each states an effect on the characters rather than merely a scene, which is more than
    most cells in this chapter manage, and sticking creatures in place is a restraint that a CONSTRAINS
    row could carry if there were an identity for it.
  rejection_reason: There is no status identity and the condition vocabulary has no term for one, which
    is the gap recorded at PKT-SD-136-137 as OBS-01 and at traps and hazards before that. Lethargy, hallucination
    and being stuck have nothing to point at, and the gravity cell's only extra content is a duration.
    This is the fourth locus to lose rows to the same missing vocabulary.
- text_locus: the magic item inside the treasure chest, p151
  quoted_gist: the chest holds a random magic item
  why_considered: item_magic_item is canonical, so a second row from this table to it was available beside
    the treasure row.
  rejection_reason: 'It would restate a path the graph already has. item_magic_item already feeds rule_treasure
    as an experience source from printed page 117, so the chain from this table through treasure already
    reaches it, and a direct row would also mistype the relation: a table does not supply an input to
    an item. One cell, one row.'
- text_locus: the two-encounter instruction, p151
  quoted_gist: one result instructs the reader to roll twice more and combine the results, rerolling that
    result if it comes up again
  why_considered: It is the only instruction on the page, and the stem scan flags it as matching rule_encounter,
    which is a canonical identity this packet does assert a row to.
  rejection_reason: The match is on the plain word encounters in the instruction's own text, not a reference
    to the procedure; M001 already carries the table's relation to rule_encounter. The instruction's remaining
    content is arithmetic on the table's own roll, which is a magnitude, and what would survive is a self-edge
    asserting nothing. Declined in the same form in each of the four preceding chapter packets.
- text_locus: the appended random encounter procedure and monster attributes, out of scope
  quoted_gist: the printed page 112 and 113 encounter procedure and the printed page 189 monster attributes
    page
  why_considered: Both are in the file and the first is the rule this table resolves.
  rejection_reason: Both are Supporting Source Context, outside the bounded scope. PKT-SD-112-113 is already
    integrated, so extracting from it would duplicate canonical rows and cite pages outside this packet's
    range.
non_edge_observations:
- id: OBS-01
  subject: the stem scan earned its place on its first real outing
  detail: 'The whole-label scan was shown at PKT-SD-148-149 to miss inflected mentions, so a second scan
    comparing stems now runs beside it. It was proved before use by running it against that packet, where
    it recovers exactly the two cells the label scan missed, bear trap against Traps and a rival crawler
    against Rival Crawlers.

    On this page the stem scan reaches the drow-made trap cell that carries M002, which the label scan
    again misses for the same reason: the cell says a trap, singular, and the canonical label is Traps.
    So the row this packet submits second would have depended entirely on my reading had the method not
    been fixed one packet ago. Recorded because it is the first case where the correction changed what
    the measurement found rather than merely confirming it.'
- id: OBS-02
  subject: the floor giving way is the closest declined call in the chapter
  detail: 'One cell has the floor give way into a sinkhole of a stated depth in feet. rule_falling is
    canonical, already triggers rule_damage, and consumes exactly the quantity this cell states. I declined
    it, and it is the nearest thing to a coin toss this chapter has produced.

    The reason is consistency rather than caution. Printed page 144 has a deep sinkhole falling open with
    a river far below, declined two packets ago because it states no check and no damage, and the only
    difference here is that the floor gives way underfoot rather than beside the party. Drawing a row
    across that difference would mean every dangerous scene in the seventeen packets remaining has to
    be re-argued individually, which is how a chapter disposition dissolves. If the Reviewer holds that
    a floor giving way under the party states a fall, the row is a one-line addition and I would rather
    be told than draw the line finer myself.'
- id: OBS-03
  subject: the first encounter result in the chapter that benefits the party
  detail: 'Measured against the ten canonical rows this chapter has produced so far, across printed pages
    142 to 149. One of them reaches the party''s sheet, the arctic weather damage at inflicts; the other
    nine are four resolvers, three rival crawler reaches and two trap reaches. So an encounter result
    has affected the party before, and this is the first time one has done so in the party''s favour:
    motes of light that heal a stated amount if caught, and a treasure chest holding a random magic item.
    The healing row is the chapter''s second authored row and its first at improves.

    Recorded because it revises the expectation OBS-01 of PKT-SD-142-143 set. These tables are not uniformly
    inert; a small number of cells across the chapter do state mechanics, and they are found by reading
    every cell rather than by assuming the chapter is homogeneous. Five packets in, the yield is four
    rows, two, one, three and now five.'
unresolved_identity_questions:
- id: IDQ-01
  question: Does an encounter cell naming treasure earn a row to rule_treasure, when cells describing
    individual objects do not?
  analyst_reading: Yes, and M005 is written on that basis. The cell uses the book's own categories, treasure
    and magic item, rather than describing a thing; the earlier declines were all descriptions of objects
    with no category attached.
  why_it_is_a_question: I declined three closely related cells in the two preceding packets, so the line
    is one I am drawing rather than one the source draws, and seventeen packets of this chapter remain
    in which treasure results will recur. If the line is wrong it is better wrong once than seventeen
    times. The counter-argument is that the cell states no value, no table to roll on and no procedure,
    and that random magic item points at a chapter that has not been extracted.
  impact_if_overturned: M005 is withdrawn and nothing else changes; the other four rows do not depend
    on it. If instead the Reviewer holds that the earlier object cells should also have carried rows,
    that is a successor for PKT-SD-146-147 and PKT-SD-144-145 rather than a correction here.
unresolved_identity_questions_note: One raised, on the treasure reach. Every other structural choice follows
  the chapter disposition settled at PKT-SD-142-143.
architectural_escalations: []
architectural_escalation_note: None raised. The one proposed identity uses an approved prefix, every row
  uses a legal edge type at status core, no row carries supersession_basis and none is an OVERRIDES, and
  no CLASSIFIED_AS row appears. The authority list omits the nonexistent Shadowdark DEC-2026-0003; registry
  authority for this ruleset is constitution section 2, as recorded in GUR-PKT-SD-142-143-arctic-r01.
completeness_statement: 'Both printed pages in scope were read in full at the recorded checksum: 1 named
  table, 50 data rows, 0 sentences of prose. The packet yields 1 new identity and 5 rows, reusing 5 canonical
  identities whose labels the building script asserted equal to the registry. The proposed table carries
  edges, so nothing is left unattached.

  Every row was checked against the 783 canonical edges for an assertion-key collision, for a shared source,
  type and target under a different aspect, and for duplicates within the patch; there are none of any,
  and no canonical row cited either page before. The script locates the supporting cell for each row and
  asserts its page, which matters because the page break falls inside the table.

  6 candidates were rejected and each is recorded with its reason. The largest deliberate loss is the
  creature and scene content, which belongs to the unextracted monster chapter or states no mechanic at
  all. 10 of the 16 apparent registry references in the cells are spurious collisions with ordinary English,
  measured rather than filtered by eye. No assertion depends on any other ruleset.'
treasure_reach_note: 'M005 is the row most likely to be questioned and it is precedent-setting, so it
  is argued here and raised as IDQ-01.

  The cell reads that an ancient treasure chest holds a random magic item. It names two canonical identities
  in the book''s own terms, rule_treasure from printed page 117 and item_magic_item, and what it states
  is that this encounter yields treasure. That has a canonical consequence: treasure is rated for quality
  and feeds the experience award.

  It has to be squared with two declines. A golden horseshoe in the gutter on printed page 147 and a magic
  sword appearing in a statue''s hand on the same page both got nothing, and so did an appraisal revealing
  a weapon is magical on 145. The distinction I am drawing is that those cells describe objects, while
  this one classifies what is found using the category the graph holds. A horseshoe is a horseshoe; a
  treasure chest holding a random magic item is treasure and a magic item.

  Only one row is written for the cell. item_magic_item already feeds rule_treasure, so the chain reaches
  it, and a direct row from a table to an item would mistype the relation.'
