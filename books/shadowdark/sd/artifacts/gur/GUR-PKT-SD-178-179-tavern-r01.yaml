rejected_candidates:
- text_locus: the table's relation to rule_taverns, p178
  quoted_gist: the section heading TAVERN above the TAVERN ENCOUNTERS TABLE heading
  why_considered: This is the first page in the chapter whose location word is a canonical identity. rule_taverns
    carries 3 rows from printed pages 136 and 137, all RESOLVED_BY to the tavern generator, drinks and
    menu tables. A fourth resolver pointing at this table would have been the obvious shape, and unlike
    swamp or slums there is a real node to point from.
  rejection_reason: 'The source does not state it. This table sits in the encounters chapter, its own
    title names encounters, and the heading TAVERN is the location axis that names which of the 18 location
    tables this is, exactly as SWAMP and SLUMS did. The settlement chapter has the same shape already
    and it was resolved the same way: tbl_settlement_artisan_district and tbl_settlement_market are canonical
    and neither is an endpoint of the artisan or market encounters table''s rows. A parent has to be stated,
    not inferred from a shared word, and inferring one here would make the chapter''s 18 preceding packets
    inconsistent.'
- text_locus: the magic item in the hundredth slot, p179
  quoted_gist: a die sits in a dusty corner and it is Brak's Cube of Perfection, named in italics
  why_considered: 'The hundredth slot has earned a treasure row on several pages of this chapter, and
    availability is stated as plainly here as anywhere: the die is simply sitting there to be picked up.
    rule_treasure carries 11 inbound rows and the route from item_magic_item exists, 1 row on xp source
    from printed page 117.'
  rejection_reason: The canonical category is not named. Every treasure row in this chapter rests on a
    cell that says magic item, the exact label of an identity the graph already feeds to Treasure. This
    cell names one particular item instead, Brak's Cube of Perfection, which has no registry identity
    and whose defining locus is not in this packet. Element one of the settled three-element test therefore
    fails on its own, before availability or routing is reached. This is a different failure from the
    spell scroll one packet before last, which named a canonical category and failed on routing with 0
    rows from item_spell_scroll to rule_treasure; see OBS-01. Pointing a row at the cube itself would
    propose an identity from an incidental mention, and pointing one at item_magic_item would assert a
    category the cell does not use.
- text_locus: the Wandering Merchant's flask as treasure, p179
  quoted_gist: the Wandering Merchant has a Van Dinkle flask and the cell cites page 137
  why_considered: The cell names a canonical item and the merchant is standing in front of the characters,
    so the treasure test was applied to it as well as the cross-reference reading that M004 records.
  rejection_reason: 'Has is bare possession. It is weaker than sells, which OBS-02 of the swamp packet
    already placed below the line, and far weaker than the offers and bestows that carry rows elsewhere
    in the chapter; the cell states no price, no transfer and no way for the party to obtain it. The routing
    element fails independently: item_van_dinkle_whiskey carries 1 outbound row and it goes to exp_xp,
    with 0 rows reaching rule_treasure from it. Two of three elements fail, so the cell earns the reference
    row and nothing else.'
- text_locus: the chained trapdoor, p179
  quoted_gist: everyone in the room avoids a chained trapdoor of stone set in the floor
  why_considered: rule_traps is canonical with 8 inbound FEEDS_INTO rows, several of them from encounter
    tables in this chapter, and the word trapdoor is the closest this page comes to one. No scan reports
    it, because trapdoor is one token and Traps is another; it was found by reading the cell.
  rejection_reason: 'It fails the first element of the settled three-element trap test outright: the cell
    states no operation. Nothing triggers, nothing is concealed, nothing resolves; a chained stone trapdoor
    in a tavern floor is a feature the patrons walk around. The second and third elements are not reached.
    This is the same reading that declined the portcullis on printed page 172.'
- text_locus: the shared rumour, p179
  quoted_gist: a sympathetic City Watch guard shares an inside rumour with the party
  why_considered: 'tbl_rumors is a registered identity, so a cell that hands the party a rumour looked
    like it might reach it. No scan reports this cell either: the registry label is Rumors Table and the
    cell says rumor.'
  rejection_reason: The cell states no mechanism. It does not say to roll, to consult a table, or to treat
    the rumour as an input to anything; a guard telling the party something is narration. The target's
    own machinery is absent as well, since tbl_rumors carries 0 canonical rows in either direction, so
    there is no procedure for this cell to feed even if it stated one.
- text_locus: the contest cells, pp178 and 179
  quoted_gist: two rival bards start a singing contest, a dwarf in clogs challenges a PC to a dancing
    contest, rival crawlers challenge the PCs to a drinking contest, and a half-orc and a halfling arm
    wrestle
  why_considered: rule_contested_check is canonical from printed page 81 with 1 row. 3 cells use the word
    contest, at indices [17, 23, 25], and a fourth has two patrons arm wrestling, so four cells pit two
    parties against each other. It is the densest cluster of contest language the intake has produced.
  rejection_reason: No cell states the mechanism. None says to make a contested check, an opposed roll
    or a check of any kind; they state that a contest is proposed or underway and stop there. Deciding
    that a drinking contest is resolved by rule_contested_check would be my inference about how the table
    should be run, which is exactly the step the chapter has refused everywhere else. The one cell in
    this group that does earn a row, the drinking contest at index 25, earns it for naming rival crawlers
    rather than for being a contest.
- text_locus: the flask of flaming oil, p178
  quoted_gist: a hooded patron smashes a flask of flaming oil on the floor and runs
  why_considered: item_oil_flask is canonical and the stem scan reports this cell, so a row looked available.
  rejection_reason: The cell states no damage, no check, no area and no duration. It states that a flammable
    object is broken, which is presence rather than effect, and it is the same reading that declined the
    torches and the lit lantern on printed page 176 and the campfire on 173.
- text_locus: the barroom incident cells that state no mechanic, pp178 and 179
  quoted_gist: a brawl erupting over a dice game, a chandelier being swung on, loaded dice, a purse lifted
    from a belt, a painting that changes when unobserved, a chair broken over a man's head and a note
    warning of spies
  why_considered: The luck token cell on this page shows that a barroom result can name a canonical rule
    and say what it does, so the rest were checked against the same standard rather than dismissed as
    scenery.
  rejection_reason: Only the luck token cell names a rule the graph holds and states an outcome for it.
    The rest state an event and no mechanic. Theft, brawling and cheating at dice all have obvious procedural
    readings in a system that has checks, and none of those readings is on the page.
- text_locus: the creature and named-character results, pp178 and 179
  quoted_gist: a vampire at the door, Overlord's Assassins, chaos cultists, a sprinting crocodile, a seared
    cobra, City Watch guards, Atticus Gnarl the halfling wizard, Violet Dorn the bard and the Wandering
    Merchant
  why_considered: Three are individually named and two carry a type in apposition, which is the shape
    that has prompted the question in each packet of this chapter.
  rejection_reason: A creature's defining locus is its stat block in the unextracted monster chapter and
    the registry holds 0 monster_ identities. This is the 19th packet running the same disposition. The
    Wandering Merchant is the one of these that touches a row, and the row is about the drink the cell
    cites, not about the merchant.
- text_locus: the two-encounter instruction, p179
  quoted_gist: one result instructs the reader to roll two encounters and combine the results, rerolling
    that result if it comes up again
  why_considered: It is the only instruction on the page, and the stem scan flags it as matching rule_encounter.
  rejection_reason: The match is on the plain word encounters in the instruction's own text; M001 already
    carries the table's relation to rule_encounter. Declined in the same form in each of the 18 preceding
    chapter packets.
- text_locus: the appended random encounter procedure and monster attributes, out of scope
  quoted_gist: the printed page 112 and 113 encounter procedure and the printed page 189 monster attributes
    page
  why_considered: Both are in the file and the first is the rule this table resolves.
  rejection_reason: Both are Supporting Source Context, outside the bounded scope. PKT-SD-112-113 is already
    integrated, so extracting from it would duplicate canonical rows and cite pages outside this packet's
    range.
non_edge_observations:
- id: OBS-01
  subject: the hundredth slot failed on a third, separate element
  detail: 'The treasure test has three elements and this chapter has now lost a hundredth slot to each
    of them in turn. The market cell failed on category, saying scroll where the registry says Spell Scroll.
    The slums cell named the category exactly and failed on routing, because item_spell_scroll carries
    0 rows to rule_treasure. This cell fails on category again but in the opposite direction from the
    market one: it is not vaguer than the canonical label, it is more specific, naming Brak''s Cube of
    Perfection where the qualifying cells say magic item.


    That is worth separating because the two category failures look alike and are not. A vague word fails
    because it may not be the canonical category. A proper name fails because it is certainly not a category
    at all, and the identity it does name has no registry row and no defining locus in any claimed packet.
    Availability was stated and the 1 route from item_magic_item was available; neither helped.


    Recorded because the remaining packets of this chapter each have a hundredth slot and the naming in
    them varies, and because this is the cleanest demonstration the intake has produced that the three
    elements are independent rather than three phrasings of one judgement.'
- id: OBS-02
  subject: the chapter's first CROSS_REFERENCES row, and what made it available
  detail: 'M004 is the first CROSS_REFERENCES row from any encounter table. Canonical holds 13 of them,
    11 at evidence explicit_reference, 0 with a tbl_ source and 0 with an item_ target, so both endpoint
    shapes are new even though the type is not.


    It exists because the source did the pointing. The cell ends with a printed page number in parentheses,
    which is the same shape as the canonical row rule_encounter CROSS_REFERENCES rule_overland_travel,
    written from a see-page sentence on printed page 112. One other cell in this chapter carried a page
    pointer, the otyugh on printed page 176, and it earned nothing because its target has no identity
    to point at. Here the target is canonical and the pointer resolves to that target''s own defining
    locus.


    Recorded because a page pointer is easy to read as decoration. It is not: it is the source explicitly
    naming another locus, which is the whole content of the type.'
- id: OBS-03
  subject: two scans were not enough on this page
  detail: 'The chapter has run a whole-label scan and a stem scan since PKT-SD-148-149, where the second
    was added because the first missed inflected mentions. Both require every token of a registry label
    to be present in the cell, so both are blind to a cell that names part of a multi-word identity. This
    page contains exactly that case and it carries a row: Van Dinkle flask against Van Dinkle Whiskey.


    A third scan was written for it, matching on a distinctive token of a multi-token label. It reports
    20 of the 50 cells and is mostly noise, 52 identities that no other scan reaches and that share only
    a common word. It recovered the one real reference the other two could not see, and that ratio is
    the point rather than a defect: a triage scan is allowed to be noisy if every hit is read.


    Three further candidates on this page are invisible to all three scans, the trapdoor, the rumour and
    the contests, and each was found by reading every cell. The scans narrow attention; they have never
    been the reading.'
- id: OBS-04
  subject: four cells, one assertion key
  detail: '4 cells name rival crawlers, at indices [12, 25, 30, 36]: they claim the tavern as theirs,
    challenge the party to a drinking contest, whisper over a book and try to pawn off an undecipherable
    map. That is the most any page in this chapter has carried, against two on printed page 172.


    All four produce one row. The assertion key is source, type, target, aspect and condition, and every
    one of these cells is the table feeding an encounter result to the same rule; splitting them by flavour
    would need four different aspects, each of which would be a description of the cell rather than of
    the mechanical facet. The row is cited to the first supporting cell, which is on page 178.


    Recorded because a page with four supporting cells and one row looks like an undercount until the
    key is stated.'
