units_note: 'Figures name their unit. Measured by the building script from the claimed source: 1 named
  table, 50 data rows keyed to a hundred-sided roll, 0 sentences of prose, 23 rows on printed page 178
  and 27 on 179. The script asserts the recorded packet checksum against the claimed file before reading
  a single cell.'
page_attribution_basis: 'The page break falls inside the table, as it has in every packet of this chapter.
  The p178 marker sits on the TAVERN heading under placement rule 1. The p179 marker sits in the last
  cell of the row keyed 46-47, and acceptance test 3 applies a table-row marker to the whole row, so that
  row is page 179 and persistence carries 179 to every row after it.


  The script locates the marker by row index rather than by eye, asserts that it is in the row''s final
  cell, and derives each row''s page from it: the marker is at row index 23, 23 rows are page 178 and
  27 are 179. Each submitted row is cited to the page of the cell it rests on, and the script asserts
  that placement from the located cell index rather than from my reading.'
scope_boundary: 'The bounded scope is the Primary Source Material section, printed pages 178 and 179:
  one named table of 50 rows and no prose. The Supporting Source Context appends the random encounter
  procedure from printed pages 112 and 113 and the monster attributes page from 189. Both are out of scope
  and no row cites either.


  That exclusion matters here because the appended encounter procedure is the very rule this table resolves.
  Its content belongs to PKT-SD-112-113, which is already integrated, and re-asserting it would duplicate
  canonical rows from a repeated passage.'
source_summary: 'A single hundred-sided encounter table for taverns, 50 rows, with no procedure, no heading
  prose and no instructions. Most results are barroom incident and local colour: a vampire asking to be
  invited in, a half-orc lifting a table over his head, a landscape painting that changes when nobody
  is looking, a woman lifting a purse from a belt. Four cells name rival crawlers, one awards a luck token,
  one points the reader to another printed page for a named drink, and the hundredth slot names a magic
  item by its own name.'
graph_state_at_extraction: 'Read from the repository at extraction, not recalled, and every figure here
  is computed by the building script from the canonical files and the claimed source.


  The canonical graph holds 420 registry rows and 834 edges, and 0 rows cite printed page 178 or 179,
  so nothing in this span has been extracted before. The registry holds 120 tbl_ identities and 0 monster_
  identities, the latter being the figure that governs how much of this table is extractable at all.


  rule_encounter carries 28 rows, of which 20 are RESOLVED_BY and 18 name a location encounter table.
  The script asserts that the proposed table id is absent from the registry before using it.'
chapter_disposition_note: 'The disposition for this chapter was argued in full at PKT-SD-142-143 and is
  applied here rather than re-argued. In short: no procedure identity, because the table''s own title
  names rule_encounter and that rule has been canonical since printed page 112, so this table is a further
  resolver of an existing rule rather than evidence of a new one. No terrain or district identity. No
  creatures and no named characters, because the registry holds 0 monster_ identities and a creature''s
  defining locus is its stat block, not a line in an encounter table.


  One part of that disposition needs restating rather than citing, because this is the first page of the
  chapter where the location word is itself a canonical identity. rule_taverns is canonical with 3 rows
  from printed pages 136 and 137. It is still not the parent of this table; see the rejected candidate
  for the full reason.


  What remains is the small set of cells that state a mechanic or name a canonical procedure, and those
  are found by measurement rather than by reading.'
name_match_measurement_note: 'The cells were matched against the whole registry by script, not scanned
  by eye, because a table of 50 prose cells is where a reference gets missed and where a false one gets
  asserted. Both have happened in this intake: rule_natural_twenty was missed at PKT-SD-101-109 by keyword-searching
  instead of reading the registry, and a false absence claim about rule_invisibility reached production
  from PKT-SD-062-065.


  Three scans are run on this page rather than the chapter''s usual two, and the third is new here. Scan
  1 matches a whole registry label on word boundaries. Scan 2 matches every stemmed token of a label,
  which recovers an inflected mention scan 1 misses. Both require the complete label, so neither can see
  a cell that names part of a multi-word identity. Scan 3 flags any cell sharing a distinctive token of
  a multi-token label and is deliberately noisy; its output is triage rather than a result.


  Scan 1: 17 of 50 cells match, over these identities: ancestry_dwarf, ancestry_elf, ancestry_half_orc,
  ancestry_halfling, class_fighter, class_priest, class_wizard, item_coin, rule_luck_token, rule_rival_crawlers.
  Scan 2: 20 cells match, adding item_oil_flask, rule_encounter, rule_loading, rule_taverns. Scan 3: 20
  cells match on a partial label, and it is the only scan that recovers item_van_dinkle_whiskey, from
  a cell that says Van Dinkle flask against the registry label Van Dinkle Whiskey. That recovery is why
  the third scan was written, and it carries M004.


  Of the 14 identities the first two scans reach, 2 are real references that carry a row, rule_luck_token
  and rule_rival_crawlers. item_oil_flask, rule_encounter, rule_taverns are real mentions deliberately
  not given a row of their own, for the reasons in rejected_candidates. The remaining 9 are ordinary English
  colliding with an identity label: ancestry_dwarf, ancestry_elf, ancestry_half_orc, ancestry_halfling,
  class_fighter, class_priest, class_wizard, item_coin, rule_loading.


  Ancestry labels dominate the false set: ancestry_halfling matches 4 cells and ancestry_half_orc 3, every
  one of them a person in a barroom rather than a playable ancestry. class_fighter matches a pit fighter,
  class_wizard a halfling named in a cell and class_priest a weeping drunk, the usual creature-versus-class
  collision. item_coin matches a coin purse and a coin box, and rule_loading matches loaded dice.


  Three candidates on this page are reachable by no scan and were found by reading every cell: the chained
  trapdoor at index 37, the shared rumour at index 40, and the contest cells at [17, 23, 25]. The script
  asserts that rule_traps, tbl_rumors and rule_contested_check appear in none of the three scans'' output,
  so each was considered because the cell was read rather than because a scan pointed at it. Each is recorded
  in rejected_candidates with the reason it earns nothing. Recording them is the point: a scan that reports
  nothing for a cell is not evidence that the cell holds nothing.'
