  or a CONSTRAINS, the three types constitution section 5 reserves, so Builder derives every value: governs
  for the RESOLVED_BY and neutral for the two FEEDS_INTO and the CROSS_REFERENCES. This is the first packet
  of the chapter with no authored polarity at all, which follows from the page carrying no cell that states
  an effect on a value.'
