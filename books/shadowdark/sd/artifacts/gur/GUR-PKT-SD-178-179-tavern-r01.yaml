completeness_statement: 'Both printed pages in scope were read in full at the recorded checksum, which
  the script asserts against the packet manifest before parsing: 1 named table, 50 data rows, 0 sentences
  of prose. The packet yields 1 new identity and 4 rows, reusing 4 canonical identities whose labels the
  building script asserted equal to the registry. The proposed table carries edges, so nothing is left
  unattached.


  Every row was checked against the 834 canonical edges for an assertion-key collision, for a shared source,
  type and target under a different aspect, and for duplicates within the patch; there are none of any,
  and no canonical row cited either page before. The script locates the supporting cell for each row and
  asserts its page, which matters because the page break falls inside the table.


  11 candidates were rejected and each is recorded with its reason. The largest deliberate loss is the
  creature and barroom-incident content, which belongs to the unextracted monster chapter or states no
  mechanic at all. 9 of the 14 identities the first two scans reach are spurious collisions with ordinary
  English, measured rather than filtered by eye, and the one real reference neither of those scans could
  see was recovered by a third scan written for this page. No assertion depends on any other ruleset.'
van_dinkle_reference_note: 'M004 is the chapter''s first CROSS_REFERENCES row, so the identity, the type
  and the evidence class are each argued.


  The identity first. The cell at index 47 says the Wandering Merchant has a Van Dinkle flask and cites
  printed page 137 in parentheses. The registry label is Van Dinkle Whiskey and its defining locus is
  that same page 137, the TAVERN DRINKS TABLE, already claimed and integrated. SOURCE_MARKDOWN 1.4 is
  explicit that a secondary or incidental mention can support a relationship stated in its own packet
  but does not rename a concept whose defining mechanics belong to another locus, so the canonical identity
