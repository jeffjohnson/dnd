rejected_candidates:
  - text_locus: 'Stealthy and Backstab (Thief), p259'
    quoted_gist: 'Stealthy: ADV on DEX checks to sneak and hide; Backstab: Deal ×2 damage against surprised creatures.'
    why_considered: 'Checked for stealth advantage traits and surprise damage multiplier mechanics.'
    rejection_reason: >-
      Stat-block traits on creature locus; sneak advantage and double surprise damage operate on creature combat
      action locus; constitution 2.5.
  - text_locus: 'Animate Tree (Treant), p259'
    quoted_gist: '2/day. In place of attacks, one tree within near awakens as a treant ally without this ability. Reverts back in 1 day.'
    why_considered: 'Checked for temporary summoning mechanics or minion creation rules.'
    rejection_reason: >-
      Stat-block combat action on creature locus; 2/day awakening of a temporary treant ally operates on creature
      action locus; constitution 2.5.
  - text_locus: 'Regenerate (Troll and Frost Troll), pp259–260'
    quoted_gist: >-
      Troll: Regains 2d6 HP on its turn unless its wounds are cauterized with fire or acid; Frost Troll: Regains 2d6 HP
      on its turn unless its wounds are cauterized with acid
    why_considered: 'Checked for regeneration rules and elemental cauterization bypass mechanics.'
    rejection_reason: >-
      Stat-block recovery traits on creature locus; turn-start HP recovery and damage-type suppression operate on
      creature combat locus; constitution 2.5.
  - text_locus: 'Impervious (Frost Troll), p260'
    quoted_gist: 'Cold and fire immune.'
    why_considered: 'Checked for damage immunity profiles.'
    rejection_reason: >-
      Stat-block defense trait on creature locus; cold and fire immunities are creature-specific defense profiles;
      constitution 2.5.
  - text_locus: 'Healing Horn (Unicorn), p260'
    quoted_gist: 'A touch heals 2d6 HP or ends one curse or disease.'
    why_considered: 'Checked for healing touch actions and condition cleansing rules.'
    rejection_reason: >-
      Stat-block restorative action on creature locus; HP healing and condition removal operate on creature action
      locus; constitution 2.5.
  - text_locus: 'Supreme Undead and Greater Undead (Vampire and Vampire Spawn), pp260–261'
    quoted_gist: >-
      Supreme Undead: Immune to morale checks, only damaged by magical sources; Greater Undead: Immune to morale
      checks, only damaged by silver or magical sources
    why_considered: 'Checked for damage resistance profiles and morale check immunities.'
    rejection_reason: >-
      Stat-block defense traits on creature locus; weapon resistance and morale immunities are creature-specific
      defense profiles; constitution 2.5.
  - text_locus: 'Blood Drain (Vampire and Vampire Spawn), pp260–261'
    quoted_gist: >-
      Vampire: heals 2d6 HP, target loses 1d4 CON, at 0 CON target dies and rises as loyal vampire or vampire spawn;
      Vampire Spawn: heals 2d6 HP, target loses 1d4 CON, at 0 CON target dies and rises as allied vampire spawn
    why_considered: 'Checked for attack riders, life drain healing, ability drain, and death-spawn mechanics.'
    rejection_reason: >-
      Stat-block attack riders and spawn triggers on creature locus; self-heal, CON reduction, and spawn creation
      operate on creature combat locus; constitution 2.5.
  - text_locus: 'Charm and Shapechange (Vampire), p260'
    quoted_gist: >-
      Charm: One humanoid who sees vampire within near DC 15 CHA or under control 1d4 days; Shapechange: In place of
      attacks, turn into a bat, wolf, or back into regular form
    why_considered: 'Checked for mental control conditions and polymorph/shapechanging rules.'
    rejection_reason: >-
      Stat-block combat actions on creature locus; DC 15 CHA control and beast form transformation operate on creature
      action locus; constitution 2.5.
  - text_locus: 'Vampire Physiology, Sunlight, Coffin, and Stake Rules (Vampire and Vampire Spawn), pp260–261'
