non_edge_observations:
  - id: OBS-01
    subject: Invariant 4 evaluated for Thief
    detail: >-
      monster_thief is defined at its stat block locus on SD p259 and is distinct from the character class
      identity class_thief (SD p34). Separate kinds (monster vs class) and prefixes (monster_ vs class_)
      prevent collisions and preserve ontological integrity.
  - id: OBS-02
    subject: Treant Animate Tree operates as a temporary creature summoning action on creature combat locus
    detail: >-
      Treant can awaken one tree within near twice per day as a treant ally without the awakening ability,
      reverting back in 1 day. This operates on creature action and combat locus under Constitution 2.5.
  - id: OBS-03
    subject: Troll and Frost Troll regeneration traits govern creature turn-start healing and vulnerability bypass
    detail: >-
      Troll recovers 2d6 HP per turn unless cauterized with fire or acid; Frost Troll is cold and fire immune and
      recovers 2d6 HP per turn unless cauterized with acid. Both operate on creature recovery and defense loci under
      Constitution 2.5.
  - id: OBS-04
    subject: Unicorn Healing Horn operates on creature healing/restoration touch action locus
    detail: >-
      Unicorn healing horn heals 2d6 HP or removes a curse or disease on touch. This operates on creature action
      locus under Constitution 2.5.
  - id: OBS-05
    subject: Vampire and Vampire Spawn blood drain, charm, shapechange, and undead vulnerabilities operate on creature combat and physiological loci
    detail: >-
      Vampire and Vampire Spawn share coffin dependency (2d6 HP loss/day), direct sunlight damage (3d8/round), and
      wooden stake heart impalement at 0 HP requirement, as well as Blood Drain CON reduction/spawning. Vampire further
      possesses Charm (DC 15 CHA 1d4 days) and Shapechange (bat, wolf). All operate on creature combat and physiological
      loci under Constitution 2.5.

