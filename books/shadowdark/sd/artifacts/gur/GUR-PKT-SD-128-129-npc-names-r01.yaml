registry_addition_only_declaration: 'This GUR proposes three candidate nodes and no candidate edge, no
  general rule and no domain, under the registry-addition shape DEC-2026-0003 provides and the disposition
  settled as IDQ-01 of PKT-SD-118-119.

  Three named tables sit on these pages with 44 data rows and 216 name cells between them, preceded by
  two sentences about how to use them. The ancestry table is indexed by the six canonical ancestries,
  which looked like it should yield a row and does not; the reason is set out in why_the_ancestry_indexing_yields_nothing
  and it is the substance of this packet.'
page_attribution_basis: 'Both markers sit on headings. p128 ends the NPC NAMES heading and p129 ends the
  NPC NAMES BY SYLLABLE TABLE heading, and placement rule 1 applies each to its whole heading with the
  persistence rule carrying it forward. Verified against the claimed source that no marker appears inside
  a table row.

  So the two prose sentences and the ancestry table are printed page 128, and the syllable and identifier
  tables are printed page 129.'
scope_boundary: 'The bounded scope is the Primary Source Material section, printed pages 128 and 129:
  two sentences of usage guidance and 3 named tables. The trailing Supporting Source Context is out of
  scope.'
source_summary: Three NPC name generators. The first gives twenty suggested given names in each of six
  columns, one per ancestry, and a note says it repeats nothing from the Character Names table on printed
  page 38. The second gives a prefix, two middle syllables and a suffix to be combined, with a note to
  use some or all of them. The third is a grid read on two dice giving an epithet such as The Gray or
  Silvertongue.
graph_state_at_extraction: 'Read from the repository at extraction, not recalled, and every figure here
  is computed by the assembling script from the canonical files and the claimed source.

  The canonical graph holds 345 registry rows and 717 edges, and 0 rows cite printed pages 128 or 129,
  so nothing in this span has been extracted before. The registry holds 62 tbl_ identities and 31 identities
  overall carry no edge. There is no NPC name, name, syllable or epithet identity.

  Two precedent sets were read before anything here was written, because together they decide the whole
  packet. Canonical holds 5 FEEDS_INTO rows running from a sys_ axis into a table, and every one of those
  5 targets is also the target of a RESOLVED_BY row from a mechanical identity. And GUR-PKT-SD-038-038
  rejected the structurally identical ancestry indexing for the Character Names table on printed page
  38.'
why_the_ancestry_indexing_yields_nothing: 'The ancestry table''s six columns are the six canonical ancestries,
  so a reader picks a column by ancestry and rolls within it. That is exactly the shape I asserted one
  packet ago as sys_alignment FEEDS_INTO tbl_rival_crawler_signature_tactics, and it is exactly the shape
  GUR-PKT-SD-038-038 rejected for the Character Names table. Both cannot be right without a distinction,
  so I looked for one rather than picking whichever suited this page.

  The distinction is in the canonical rows and it is clean. All %d axis-into-table FEEDS_INTO rows in
  production share one property: the table they point at is also the target of a RESOLVED_BY row from
  a mechanical identity. The four class title tables are resolved by rule_title, which is determined by
  level, class and alignment and has real mechanical consequence. The signature tactics table is resolved
  by rule_rival_crawlers, which the page defines with a member count and a shared alignment. In each case
  the indexing row describes how to read a table that the graph already reaches for a mechanical reason.

  Neither is true here. There is no NPC name identity, nothing on these pages defines one, and no rule
  anywhere in the book reads a character''s or an NPC''s name. If I asserted sys_ancestry FEEDS_INTO tbl_npc_names_by_ancestry
  it would be the only thing holding the table to the graph, and it would fail the core test exactly as
  PKT-SD-038-038 said: nothing would need review if the names changed.

  So the test is not simply whether an axis indexes the table. It is whether the table is independently
  reached by a mechanical identity. That reading leaves the title rows and the tactics row standing and
  correctly excludes both name tables, and it is the third refinement of this test in three packets: results
  being identities, then a parent being source-named, and now the indexing row needing a mechanical anchor
  of its own.'
