completeness_statement: 'Both printed pages in scope were read in full at the recorded checksum: two sentences
  of guidance, 3 named tables, 44 data rows and 216 name cells. The packet yields 3 new identities and
  no rows, all three declared registry_addition_only with their basis.

  Four candidates were rejected and each is recorded with its reason. The consequential one is the ancestry
  indexing, which is the same shape as 5 FEEDS_INTO rows in production and as a row I asserted one packet
  ago; the distinction that excludes it here is measured against canonical and set out in why_the_ancestry_indexing_yields_nothing.
  CF-01 reports that the Character Names table on printed page 38 has no identity to receive this page''s
  cross-reference, and that the orphan-avoidance ground for that decision has since been superseded. Every
  figure in this GUR was computed rather than counted by hand. No assertion depends on any other ruleset.'
