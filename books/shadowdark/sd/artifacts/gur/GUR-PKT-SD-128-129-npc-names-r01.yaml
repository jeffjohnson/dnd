rejected_candidates:
- text_locus: the ancestry columns of the NPC NAMES BY ANCESTRY TABLE, p128
  quoted_gist: six columns headed Dwarf, Elf, Goblin, Halfling, Half-Orc and Human
  why_considered: All six are canonical identities and the table is genuinely indexed by them, which is
    the same shape as 5 FEEDS_INTO rows already in production and the same shape I asserted for the signature
    tactics table one packet ago.
  rejection_reason: 'Argued in full in why_the_ancestry_indexing_yields_nothing. Every axis-into-table
    row in production points at a table that a mechanical identity also resolves; no such identity exists
    for a name. GUR-PKT-SD-038-038 rejected the identical row for the Character Names table on the core
    test, and that reasoning applies unchanged here: no rule in the book reads a name, so nothing would
    need review if the names changed.'
- text_locus: the cross-reference to the Character Names table, p128
  quoted_gist: '''The NPC Names By Ancestry table has no repeats from the Character Names table (pg. 38).'''
  why_considered: 'An explicit page pointer, and four such pointers have been carried as CROSS_REFERENCES
    rows earlier in this intake. It is also a substantive claim rather than mere signposting: the two
    tables are stated to be disjoint.'
  rejection_reason: 'The target does not exist. GUR-PKT-SD-038-038 was a full null extraction and registered
    no identity for the Character Names table, so there is nothing to point at. This is the second unassertable
    pointer in the intake after the random generation process in PKT-SD-116-116, and it differs in kind:
    that one had no single identity because the process was spread across many rows, whereas this one
    has no identity because an earlier packet deliberately registered none. Recorded as CF-01, because
    the settled practice has changed since that decision.'
- text_locus: the name and syllable and epithet cells, pp128 to 129
  quoted_gist: 216 name cells across three tables, including one hundred and twenty given names, four
    columns of syllable fragments and sixteen epithets
  why_considered: Completeness. The epithets in particular read like descriptors rather than names, which
    raised whether any is a mechanic.
  rejection_reason: A name is not a mechanic and neither is an epithet. None states a dependency, a value,
    a permission or a procedure, and proposing them would create 216 orphan identities. This is the disposition
    PKT-SD-038-038 gave one hundred and twenty given names at the same scale, and the one the background
    and titles packets gave their own cells.
- text_locus: the syllable usage instruction, p128
  quoted_gist: '''For the NPC Names By Syllable table, use some or all of the generated syllables.'''
  why_considered: It is an instruction rather than fiction, and the adventures page's comparable wording
    note was also considered before being declined.
  rejection_reason: It concerns how many columns to use when writing a name down, which is guidance on
    prose rather than a mechanic. Identical in kind to the use-some-or-all instruction rejected in PKT-SD-122-123.
carried_forward_findings:
- id: CF-01
  subject: the Character Names table has no identity, and the practice that justified that has changed
  detail: 'Reported rather than left, because this page''s explicit cross-reference cannot be carried
    and the reason is a precedent shift rather than a defect in reading.

    GUR-PKT-SD-038-038 was a full null extraction for printed page 38 and registered no identity for the
    Character Names table. Its reasoning had two grounds, and I read them directly rather than recalling
    them. The first is the core test: a name is not a mechanic and no rule reads one. That ground is sound
    and this packet applies the same reasoning to the three tables here. The second is orphan avoidance,
    stated as the node would have no edge and would be an orphan, and the Analyst has already withdrawn
    one orphan from this intake rather than publish it.

    That second ground no longer holds. IDQ-01 of PKT-SD-118-119 settled that an unattached source table
    is properly registered rather than dropped, because the registry is the list of approved node IDs
    rather than a projection of the graph. Since that disposition there are 31 registry-only identities,
    including several unattached tables, and this packet proposes three more. Printed page 38 was extracted
    before that question was settled.

    So the Character Names table is arguably now owed a registry addition, which would also give this
    page''s cross-reference a target. That needs a successor for PKT-SD-038-038 and cannot be done from
    here, since page 38 is that packet''s bounded scope and it is integrated. I am not asserting the pointer
    either, because its target does not exist today. Flagged so the inconsistency is visible rather than
    silently carried; whether to act is the Reviewer''s or the Architect''s call, not mine.'
non_edge_observations:
- id: OBS-01
  subject: the axis-indexing test needed a third refinement and now has one
  detail: 'Three packets have each sharpened the same question and it is worth having the progression
    in one place, because I got it imprecise twice.

    PKT-SD-124-125 said the test was whether the table''s results are already identities. PKT-SD-126-127
    corrected that to whether a parent identity is source-named, since a parent lets even a descriptive
    table attach. This packet adds the third piece: an axis-indexing FEEDS_INTO row is assertable only
    when the table is independently reached by a mechanical identity, because otherwise the indexing row
    is the only thing holding the table to the graph and it fails the core test on its own.

    Measured rather than asserted: all 5 axis-into-table rows in production satisfy that condition, and
    the exclusion it produces here matches what PKT-SD-038-038 decided independently for the same shape
    on printed page 38.'
- id: OBS-02
  subject: a name is the clearest thing in the book that is named but not mechanical
  detail: 'Between this page and printed page 38 the book prints roughly two hundred and forty given names,
    four columns of syllables and sixteen epithets, all carefully organised by ancestry, and the graph
    holds none of it beyond three table identities. That is correct and worth stating plainly: NAME appears
    as a character element on printed page 12 with no mechanic attached, and nothing anywhere reads it.

    Recorded because the volume invites the assumption that something so elaborated must matter mechanically.
    It does not, and the same is true of the renown, wealth, secret and occupation bands declined over
    the last three packets.'
- id: OBS-03
  subject: the second two-dice grid table
  detail: 'The identifier table is a four-by-four grid read on two dice, the same form first met as the
    NPC occupation table in PKT-SD-124-125 and recorded there as novel. It is no longer novel and is treated
    identically: an ordinary named table, registered, carrying no edge. Recorded only to close the loop
    on that observation.'
