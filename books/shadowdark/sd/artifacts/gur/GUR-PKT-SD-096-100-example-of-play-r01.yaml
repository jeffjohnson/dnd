null_extraction_declaration: 'This GUR proposes no candidate node, no candidate edge, no candidate general
  rule and no domain. That is a property of the source material, not an incomplete reading. All five pages
  were read in full and every element naming a game concept was considered against the core test and rejected
  for a stated reason. The handoff is the ordinary Builder handoff and the status is the ordinary proposed;
  this is not a withdrawal, because nothing supersedes this packet.

  It is the seventh null extraction in the intake, after the front matter, the languages tables, the character
  names table, the spell lists, the gameplay introduction and the back matter. It is the second whose
  content is prose rather than index or apparatus, after the gameplay introduction, and the first that
  is a transcript.

  The reasoning differs from every earlier null in one way worth stating plainly. The earlier nulls yielded
  nothing because their content was not mechanical. This one yields nothing although it is almost entirely
  mechanical: it demonstrates initiative, advantage, difficulty classes, a random encounter check, armor
  class, damage, spellcasting checks, a natural one, a natural twenty, the death timer and a healing spell,
  in the space of four pages. Every one of those is already canonical from its own defining locus. An
  example is where rules are shown, not where they are made, so a row taken from here would attach a second
  citation to a fact the graph already holds from the page that states it.'
classified_as_gate_note: 'No CLASSIFIED_AS row appears and none was considered. The transcript casts burning
  hands, light and cure wounds, all three canonical spells already carrying their tier and casting class
  from the spell chapter. The item light-source form remains gated: DEC-2026-0104 requires an independent
  Review of IMP-DEC-2026-0104-r01, which does not exist, and the torch appears here only in play.'
