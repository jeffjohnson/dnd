  and behaves normally under placement rule 1. The three that follow are trailing paragraph markers inside
  the dialogue: p97 ends the paragraph ''GM: You''re up, Ralina.'', p98 ends the paragraph closing ''and
  roll a natural 1.'', and p99 ends the paragraph ''PCs (everyone): Oh no!''. Acceptance test 2 assigns
  each to its whole paragraph, and the persistence rule carries each page forward to the next marker.
  None is the inline case that divides a paragraph.

  p100 is a class-bearing marker on an empty Div rather than a content marker. No row cites any page,
  because this GUR asserts no row, so the attribution here serves the record and the rejected candidates
