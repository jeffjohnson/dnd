completeness_statement: 'All five pages in the bounded scope were read in full at the recorded checksum,
  including the classified page 100 which carries no content. Every element naming a game concept was
  considered and each is recorded in rejected_candidates with the reason it was rejected: eight candidates,
  of which four are rejected as restatements of rules canonical from their own pages, two as GM improvisations,
  one as fiction and one as pre-empting an unextracted chapter. Each restatement rejection names the existing
  canonical row and its printed page, verified against the edge set rather than assumed, and the two absence-based
  rejections were additionally verified against the source page at the concept''s own locus.

  The result is zero nodes, zero edges, zero general rules and zero domains. That is the correct reading
  of an example of play and is declared rather than left as an apparent gap. No assertion depends on any
  other ruleset.'
