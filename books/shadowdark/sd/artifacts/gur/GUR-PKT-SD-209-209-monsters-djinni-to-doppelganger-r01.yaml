source_summary: >-
  Two monster stat blocks on printed page 209: Djinni and Doppelganger. Djinni carries three
  special abilities: Impervious (magical sources only), Whirlwind (tornado form throwing enemies
  2d100 feet), and Wish (casts wish pg. 73 once per week for a mortal without spellcasting check).
  Doppelganger carries two special abilities: Change Shape (transforms into similarly-sized
  humanoid) and Telepathy (hears surface thoughts of humanoids within near).

