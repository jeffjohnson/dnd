page_attribution_basis: 'This packet contains the intake''s first non-heading marker and the attribution
  turns on it, so it is set out in full.

  p94 ends the WIZARDS AND THIEVES heading and behaves normally: placement rule 1 applies it to the whole
  heading and the persistence rule carries it forward. p95 does not sit on a heading. It is a trailing
  marker at the end of the paragraph beginning ''No wizard or thief majority''. SOURCE_MARKDOWN acceptance
  test 2 assigns a trailing paragraph marker to the whole paragraph, so that entire paragraph is page
  95 rather than only the text following the marker, and 95 then persists to everything after it.

  The consequence is that the GAMEPLAY section is split across two printed pages: its first five outcome
  paragraphs are page 94 and its last three are page 95. THE GAME ENDS and all four stakes tables are
  page 95. This is not the inline case that divides a paragraph, because the marker sits at the paragraph''s
  end and no evidence follows it within that paragraph. Two rows cite page 94 and five cite page 95.'
scope_boundary: The bounded scope is the Primary Source Material section, printed pages 94 and 95, covering
  the minigame and its four stakes tables. The trailing Supporting Source Context is out of scope.
source_summary: A self-contained dice betting game offered for playing out a wager with a more complex
  system than a stat check allows. Players agree a stake and each adds coins to a pot. All roll to determine
  the active player, who then declares wizard or thief before rolling; sixes and ones cancel one another
  and the resulting majority decides whether the active player takes from the pot or adds to it, and whether
  play passes on. Rolling all wizards takes the whole pot and ends the game; rolling all thieves splits
  the pot among the other players. The game ends when the pot is empty, a player who runs out of coins
  is out, and the winner is whoever ends with the most coins. Four tables list what may be wagered at
  increasing tiers.
graph_state_at_extraction: 'Read from the repository at extraction, not recalled: the canonical graph
  holds 275 registry rows and 633 edges. The registry was read in full. Every proposed row was checked
  against the canonical edge set for an assertion-key collision, for a shared source, type and target
  under a different aspect, and for duplicates within the patch; there are none of any. The single ALTERNATIVE_TO
  row was compared with its endpoints sorted, as constitution section 4 requires.'
low_yield_note: 'Seven rows from two printed pages is the lowest yield per page of any packet in this
  intake, and it is the correct outcome rather than an extraction failure. The reasoning is recorded here
  so nobody re-reads the pages expecting to find more.

  Almost all of this content is the minigame''s internal procedure: who declares, what is rolled, how
  sixes and ones cancel, who takes from or adds to the pot, and who goes next. Those relations hold between
  parts of the minigame itself. They have no canonical counterpart, they would require minting identities
  for the pot, the active player, a declaration and a majority, and every amount involved is a magnitude
  no field may store. Minting that machinery would produce a cluster of nodes connected to each other
  and to nothing else in the graph, which answers no query a reader would ask.

  What is asserted is the three genuine connections to the wider ruleset, that the game substitutes for
  a stat check, consumes coin and is bounded by coin, plus the four tables it is resolved by. That is
  the whole of this packet''s contribution and it is honest at that size. Wish in PKT-SD-073-074 was the
  same shape for the same reason.'
