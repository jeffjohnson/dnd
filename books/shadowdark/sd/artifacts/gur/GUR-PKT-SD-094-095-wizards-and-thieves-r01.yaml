authored_polarity_declaration: Authored polarity appears on one row and no other. item_coin CONSTRAINS
  rule_wizards_and_thieves takes governs with basis read, as constitution section 5 and invariant 15 require
  for a CONSTRAINS row. The four RESOLVED_BY rows, the ALTERNATIVE_TO row and the CONSUMES row carry none,
  since section 5 derives those. No MODIFIES or TRIGGERS row appears in this packet.
excludes_not_used_note: 'No EXCLUDES row appears here and one was considered. A player who runs out of
  coins is out of the game, which reads at first as prevention. It is carried as item_coin CONSTRAINS
  rule_wizards_and_thieves with aspect continued participation instead, because coin bounds how long a
  player keeps playing rather than preventing the game from happening.

  This follows two corrections applied downstream to my earlier rows, where rule_overland_travel EXCLUDES
  rule_total_darkness became CONSTRAINS with aspect outdoor occurrence, and rule_talents EXCLUDES rule_learning
  became CONSTRAINS. Measured across the intake, 35 EXCLUDES rows were authored and 33 stood; the two
  corrected were the two where the source hedged its prohibition. Applied here at extraction rather than
  after a third correction.'
