non_edge_observations:
- id: OBS-01
  subject: the minigame's internal machinery is deliberately not modelled
  detail: The pot, the active player, the declaration of wizard or thief, the cancellation of sixes against
    ones, the majority, the lowest remaining die and the honour-among-thieves remainder are all named
    by the source and none is proposed. Each exists only inside this game, each would connect only to
    the others, and the quantities that give them meaning are magnitudes no field may store. See low_yield_note
    for the full reasoning.
- id: OBS-02
  subject: magnitudes are excluded from every row
  detail: The agreed stake, the ante, the dice pools, the die faces that count as wizards and as thieves,
    the payout equal to the lowest remaining die and the pot value at which the game ends are all magnitudes
    and none reaches a field. No row in this packet carries a condition, so there is no opportunity for
    a spelled quantity to enter one; verified that no aspect carries a digit.
- id: OBS-03
  subject: the stakes tables list things with no identity
  detail: 'Sixteen entries across four tables name copper, drinks, bragging rights, baubles, gold, a sworn
    favour, a trophy, jewellery, a finger, an irreplaceable item, diamonds, a life and a magic item. None
    is proposed. Most are pure flavour with no mechanic, and the two with canonical near-neighbours are
    not asserted either: item_magic_item is canonical but this table names it as a wager rather than stating
    any mechanic about it, and asserting a row would claim a relation the source does not make.

    The tables themselves are proposed and the game is RESOLVED_BY each, which carries what is mechanically
    true: these tables are how a table of players picks what to play for.'
- id: OBS-04
  subject: the carousing cross-reference still needs a successor elsewhere
  detail: 'PKT-SD-091-093 points to printed page 94 from its carousing section, and recorded as its OBS-04
    that the reference could not be asserted because this identity did not yet exist. It exists once this
    packet integrates.

    It is not assertable from here either. The sentence making the reference is on printed page 91, inside
    that packet''s bounded scope and not this one''s, and that packet is integrated. Connecting them needs
    a successor GUR for PKT-SD-091-093. This is the third such standing item, alongside the rule_invisibility
    gap in PKT-SD-062-065 and the rule_morale connection owed by PKT-SD-068-070 and PKT-SD-070-072.'
- id: OBS-05
  subject: turn order here is table procedure, not a graph relation
  detail: Play moves clockwise from the highest roller and the active player changes on certain outcomes.
    No row asserts this against rule_turn or cbt_initiative. Those identities govern the game's own turn
    structure in play, and this minigame's sequence is internal to itself; pointing at them would claim
    the combat turn order governs a tavern dice game. This matches the decision recorded as OBS-06 of
    PKT-SD-087-089, where the clockwise initiative seating was likewise left unasserted.
