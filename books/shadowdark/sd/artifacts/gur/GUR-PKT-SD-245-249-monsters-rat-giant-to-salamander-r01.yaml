source_summary: >-
  Twelve creature stat blocks: Rat, Giant (cunning cat-sized mangy rat, Disease), Rat, Swarm (screeching
  tidal wave of rats, Disease), Rathgamnon (massive winged celestial lion servant of Madeera the Covenant,
  Legendary, Roar, WIS spells Abjure, Abolish, Anchor, Gate, Portent, Time Stop), Reaver (cruelly barbed
  black knight, plate mail + shield, bastard sword, Bloodlust), Remorhaz (massive arctic centipede, burrow,
  Impervious, Melt, Swallow), Rhinoceros (single-horned grassland bull, Charge), Roc (dragon-sized mountain
  hawk, fly, Grab), Roper (stony cavern monstrosity, climb, Impervious, Grab, Pull, Tendrils), Rot Flower
  (carrion-reeking carnivorous flower, Toxin), Rust Monster (metal-consuming insect, climb, Corrosive),
  Sahuagin (shark-toothed vicious hunters, leather + shield, swim, Half-Amphibious), and Salamander
  (fire-colored frilled lizardfolk, flaming spear, iron longbow, Impervious, Heat Aura).

