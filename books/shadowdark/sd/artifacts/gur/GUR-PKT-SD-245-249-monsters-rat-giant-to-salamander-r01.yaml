non_edge_observations:
  - id: OBS-01
    subject: Rathgamnon legendary trait, roar, and creature WIS spells govern a celestial servant of Madeera the Covenant
    detail: >-
      Rathgamnon possesses Legendary (magical damage only, DC 18 hostile spell DC), Roar (in place of attacks, DC 18 CHA
      or blind and speechless 1d4 days within far), and a suite of creature-specific WIS spells (Abjure DC 13, Abolish
      DC 13, Anchor DC 14, Gate DC 14, Portent DC 14, Time Stop DC 15). All operate on creature combat and action loci
      under Constitution 2.5.
  - id: OBS-02
    subject: Remorhaz Melt and Swallow represent extreme thermal and predatory hazards
    detail: >-
      Remorhaz melts non-magical metal on 1-3 on d6 on contact, and swallows targets on natural 18-20 bite attacks
      dealing 2d10 damage per round in darkness with a 20-damage regurgitation threshold. Both operate on creature
      attack and defense loci under Constitution 2.5.
  - id: OBS-03
    subject: Roper tendril manipulation suite (Grab, Pull, Tendrils) operates on creature combat subsystems
    detail: >-
      Roper carries four severable tendrils (AC 18, 4+ damage each), traps targets on DC 15 STR with automatic hits
      the following round, and can substitute a tendril attack to pull a grabbed victim near. All operate on creature
      combat action locus under Constitution 2.5.
  - id: OBS-04
    subject: Rot Flower Toxin and Rust Monster Corrosive operate on creature attack and contact loci
    detail: >-
      Rot Flower bite delivers Toxin (DC 12 CON or unconscious 1d4 rounds), and Rust Monster destroys touching metal
      on 1-3 on d6. Both operate on creature attack and reactive contact loci under Constitution 2.5.
  - id: OBS-05
    subject: Sahuagin Half-Amphibious imposes an environmental submersion constraint on creature locus
    detail: >-
      Sahuagin must be submerged in water every 4 hours or suffocates. This physiological limitation operates on
      creature locus under Constitution 2.5.
  - id: OBS-06
    subject: Salamander Heat Aura and Impervious operate on creature defense and aura loci
    detail: >-
      Salamander is immune to fire (Impervious) and deals 1d8 damage on failed DC 12 CON save to creatures in close
      at start of turn (Heat Aura). Both operate on creature defense and turn-trigger aura loci under Constitution 2.5.
  - id: OBS-07
    subject: Rat and Swarm Disease impose recurring Constitution damage
    detail: >-
      Both Rat, Giant and Rat, Swarm impose Disease on bite attacks (DC 12 CON) dealing 1d4 CON damage that cannot
      be healed while ill, repeating daily until success, with death at 0 CON. This operates on creature attack/disease
      rider locus under Constitution 2.5.

