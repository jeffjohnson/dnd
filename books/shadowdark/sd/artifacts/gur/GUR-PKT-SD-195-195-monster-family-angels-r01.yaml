luck_token_note: >-
  Bless is the packet's hardest case, so the reasoning is set out once more here rather than
  left to the rejected-candidate entry alone.
  The ability states that the seraph may, three times a day, touch a target to grant it a luck
  token. rule_luck_token is canonical and several encounter tables already FEEDS_INTO it on
  aspect encounter award, from printed pages 153, 157, 167 and 179, so the direction this
  sentence describes is a recognised shape in the graph.
  What distinguishes those rows from this ability is locus, not direction. Each award row comes
  from a table, a shared locus any character's roll can reach on that page. Bless is printed
  once, under one named creature's own stat block, and is usable only by that creature, three
  times in a day. Constitution 2.5's exclusion of a stat-block description does not carve out an
  exception for a description whose target happens to be a real identity; the sentence excludes
  the description itself, regardless of content.
  The test this applies is the same one settled at PKT-SD-194-194 for abil_dark_adapted against
  Curse and Enslave: locus, not drama, and here, not target either. A future packet that states
  this same award generally, for a whole class of creatures at one locus, would meet the
  exception Dark-Adapted met. This ability does not.

