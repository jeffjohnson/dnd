source_summary: >-
  The ANGELS family: two paragraphs describing angels generally and naming a four-rank
  hierarchy, seraphim, domini, principi and archangels in ascending power, followed by four
  stat blocks. Archangel has two named abilities, Command and Crown of Fire; Angel, Domini has
  one, Horn; Angel, Principi has two, Moonlight Aura and Truesight; Angel, Seraph has one,
  Bless. Every block prints the same eight fields the Monster Attributes page defines.

graph_state_at_extraction: >-
  Read from the repository at extraction, not recalled. The canonical graph holds 433 registry
  rows and 866 edges, and 0 rows cite printed page 195. The registry holds 2 monster_
  identities, monster_aboleth and monster_acolyte, both registered one packet ago at degree 0.
  This packet tests whether that pattern repeats at the scale of a four-creature family, and it
  does: the script asserts that all four proposed ids are absent from the registry before use.

stat_block_boundary_note: >-
  The test settled at PKT-SD-194-194 is applied here without modification: a stat-block
  description is excluded under constitution 2.5 regardless of what it references, because the
  boundary is locus, not content. A named ability stated once, under one creature's own block,
  is excluded even when it names an existing canonical identity as its target; only a mechanic
  stated once in a shared locus about a whole class of creatures, the way Dark-Adapted was at
  printed page 189, survives it.
  This page gives the boundary its first real test against that exception, because one ability
  does reach an existing shared identity. See luck_token_note for why the exception still does
  not apply.

recurring_shape_note: >-
  Two named abilities share a structural shape without sharing a name: Crown of Fire, on the
  archangel, and Moonlight Aura, on the principi, are both a stated increase to the difficulty of
  hostile spellcasting against the creature. They have different titles and different DCs, and
  neither cross-references the other.
  This is not the shared-locus exception. That exception requires one mechanic, named once, at a
  place the source presents as covering a class of creatures, the way Dark-Adapted covers all
  non-humanoid monsters from a single sentence. Two creatures independently having a
  similar-shaped defence, each printed under its own block with its own name, is recurrence of
  form, not a single shared mechanic. Merging them into one identity would assert that the
  source treats them as the same thing, which it does not: it gives each its own title and its
  own number. Both remain declined, individually, as stat-block descriptions.

creature_identity_note: >-
  All four proposed nodes carry no edge in this GUR, for the reason settled at PKT-SD-194-194:
  a creature's identity is not one of its values, and this page is each creature's defining
  locus. Registering them here provides the stable canonical id a future packet can reuse rather
  than re-deriving one from a non-defining locus. ARTIFACT_LIFECYCLE and ESCALATION_CONTRACT
  both treat an isolated registry addition as ordinary work.
  No family-level identity is proposed for Angels as a whole. Constitution section 2.4 keeps
  creature-family membership out of the graph absent an evidence-bearing Decision, the same
  provision that already excludes ancestry, alignment, deity and language membership, and
  nothing on this page states a mechanical consequence of family membership that would need one.
  The rank hierarchy in the introduction is declined on the same ground as the combat roles at
  printed page 192; see rejected_candidates.

