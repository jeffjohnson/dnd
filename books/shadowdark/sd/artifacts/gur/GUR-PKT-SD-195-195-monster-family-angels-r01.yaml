rejected_candidates:
  - text_locus: 'the family introduction and rank hierarchy, p195'
    quoted_gist: >-
      angels described generally as the divine host of lawful and neutral gods, then ranked
      seraphim below domini below principi below archangels
    why_considered: >-
      Four canonical-adjacent names are given in one paragraph, matching the four stat blocks
      exactly, and the wording above all stand the mighty archangels reads like a rule about
      relative power.
    rejection_reason: >-
      A designer's taxonomy, the same shape declined for the six combat roles at printed page
      192. No mechanic depends on rank: nothing in any of the four stat blocks below states that
      being a domini rather than a seraph changes how a rule works, only that the printed values
      differ, which constitution 2.5 already excludes. Constitution 2.4 keeps creature-family
      and rank-membership out of the graph absent a Decision establishing it as a direct
      mechanical input, and nothing here does.
  - text_locus: 'Command, p195'
    quoted_gist: "a save against CHA to resist the archangel's command"
    why_considered: >-
      A named, titled ability with a real mechanical effect on whoever fails the save.
    rejection_reason: >-
      A stat-block description under constitution 2.5, stated once under the archangel's own
      block. There is no canonical identity for a commanded or compelled condition, the same gap
      noted for blinded, deafened, controlled and paralyzed in earlier monster packets.
  - text_locus: 'Crown of Fire, p195'
    quoted_gist: 'hostile spells targeting the archangel become harder to cast'
    why_considered: >-
      rule_spellcasting_check is canonical with 40 rows and this ability directly raises the
      difficulty of using it against the archangel, which reads as a dependency on that
      mechanic.
    rejection_reason: >-
      A stat-block description under the same boundary, stated once under the archangel's own
      block. It is also the first half of the shape addressed in recurring_shape_note: a second
      creature on this page has a similarly shaped ability under a different name, and neither
      earns a row because each is individual creature content rather than a mechanic stated once
      at a shared locus.
  - text_locus: 'Horn, p195'
    quoted_gist: "an area save against CHA or be paralyzed for a stated duration"
    why_considered: >-
      The attack line on the same creature already lists horn as an alternative attack, so the
      ability's relationship to cbt_attack_roll was checked explicitly.
    rejection_reason: >-
      A stat-block description under the same boundary, stated once under the domini's own
      block. The attack-line mention of horn is the weapon choice, a magnitude-bearing stat-block
      value already excluded; the named ability below it is the area effect, which states no
      dependency on any canonical identity and has no paralyzed condition to attach to, the same
      gap noted for Command.
  - text_locus: 'Moonlight Aura, p195'
    quoted_gist: 'hostile spells targeting the principi have a stated DC'
    why_considered: >-
      The second half of the shape addressed in recurring_shape_note, checked independently
      rather than assumed identical to Crown of Fire.
    rejection_reason: >-
      A stat-block description under the same boundary, stated once under the principi's own
      block, with its own title and its own number. Declined for the same reason as Crown of
      Fire and not merged with it; see recurring_shape_note.
  - text_locus: 'Truesight, p195'
    quoted_gist: 'the principi can see all invisible creatures and objects'
    why_considered: >-
      spell_invisibility is canonical and EXCLUDES rule_vision on being seen at printed page 63,
      so an ability that lets its holder see through that exclusion looked like the clearest
      candidate for a real dependency on this page. rule_detecting is also canonical and was
      checked as a possible target.
    rejection_reason: >-
      The ability states no mechanism for how it interacts with spell_invisibility's exclusion,
      only that the principi can see invisible things; asserting an EXCLUDES or a CONSTRAINS from
      this sentence onto spell_invisibility or rule_vision would be an inference about how the
      two interact, not a stated relationship, and Analyst prohibited actions bar exactly this
      kind of inferred semantic edge. It is also, independently, a stat-block description stated
      once under the principi's own block, the same reading applied to the Aboleth's Telepathic
      at printed page 194.
  - text_locus: 'Bless, p195'
    quoted_gist: 'three times a day, the seraph may touch a target to grant it a luck token'
    why_considered: >-
      This is the packet's hardest case and is argued at length because it is the first ability
      on any stat block to name an existing shared identity as its direct, unambiguous target.
      rule_luck_token is canonical with several FEEDS_INTO rows from encounter tables on aspect
      encounter award, which is structurally the same direction this ability states: something
      grants a luck token.
    rejection_reason: >-
      The locus test still decides it, and the shape of the target does not change that. The
      encounter-table award rows come from a table any roll can reach, printed at a locus that
      covers every encounter on that table; this ability is a specific creature's personal,
      limited-use trait, usable three times a day by one named angel. It is exactly as much a
      stat-block description as Curse or Enslave were at printed page 194, and it happens to name
      a real target where those named none; constitution 2.5 excludes the description regardless
      of what it references. See luck_token_note.
  - text_locus: 'the flavour text for all four creatures, p195'
    quoted_gist: >-
      an archangel with a crown of fire and a blazing greatsword, winged flawless humans glowing
      with bronze sunlight, serene humans sculpted from alabaster with golden eyes, and beautiful
      luminous humanoids with white-feathered wings
    why_considered: 'Read for completeness, as every block on an in-scope page must be considered.'
    rejection_reason: >-
      Narrative description, the same disposition applied to every creature's italicised opening
      line since printed page 194. No sentence states a rule.
  - text_locus: 'the eight stat-block fields on each of the four creatures, p195'
    quoted_gist: >-
      armour class, hit points, attacks, movement, the six stat modifiers, alignment and level
      for the archangel, domini, principi and seraph
    why_considered: >-
      Every field names a canonical shared identity directly, the same set declined at printed
      page 194.
    rejection_reason: >-
      The case constitution 2.5 names by example, unchanged from the prior packet: each field is
      a printed value on one creature, not a dependency between two mechanics. 32 field values
      across four creatures are excluded on this ground alone.
  - text_locus: 'the appended shared-system context, out of scope'
    quoted_gist: >-
      the monster attributes, movement and conditions, and morale pages
    why_considered: 'All three are in the file and directly relevant to reading a stat block correctly.'
    rejection_reason: >-
      All three are Supporting Source Context, outside the bounded scope, and each is already
      integrated from its own primary packet. Extracting from any would duplicate canonical rows
      and cite pages outside this packet's range.

non_edge_observations:
  - id: OBS-01
    subject: the boundary holds at family scale, and the hardest case tested it directly
    detail: >-
      This packet registers four identities and zero rows, confirming that PKT-SD-194-194's
      result was the rule rather than a single instance. The test was not trivial here: Bless
      names an existing canonical identity outright, which Curse and Enslave did not, and the
      boundary still excludes it because the exclusion is about the ability's own locus, not
      about whether its target happens to exist elsewhere in the graph. Recorded because this is
      the strongest evidence yet that the locus test, not a content test, is the correct reading
      of constitution 2.5.
  - id: OBS-02
    subject: recurring shape is not a shared mechanic
    detail: >-
      Crown of Fire and Moonlight Aura are the first case in the chapter of two different
      creatures independently carrying a similarly shaped ability. Both were checked and both
      declined individually rather than merged, because the source gives each its own name and
      its own number and never states that they are the same thing. A future packet may
      eventually print an ability that genuinely recurs by name across creatures; that would be
      the point at which the shared-locus question becomes live again, and it has not happened
      yet.
  - id: OBS-03
    subject: rank and combat role are the same kind of taxonomy, in two different chapters
    detail: >-
      The angel hierarchy declined here and the six combat roles declined at printed page 192
      are the same shape of content: a designer's or narrator's relative vocabulary with no
      stated mechanical consequence. Recorded as a pair because the chapter's remaining families,
      already visible in the incoming filenames, are likely to repeat the hierarchy shape
      (demons, devils and similar multi-rank families), and this packet's disposition is the
      precedent for all of them.

