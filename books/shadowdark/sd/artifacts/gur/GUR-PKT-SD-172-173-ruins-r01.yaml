rejected_candidates:
- text_locus: the portcullis and the collapsing wall, pp172 and 172
  quoted_gist: a rusty portcullis slams down, separating the characters, and a groaning wall collapses
    at the slightest touch
  why_considered: This is the closest call on the page and I want it looked at. Both state an operation,
    which is the element the desert overturn made decisive, and the wall even states a trigger, the slightest
    touch, which is more than the javelin-shooting statue on printed page 161 offered when it earned a
    rule_traps row. A portcullis slamming down to separate a party is the archetypal dungeon trap.
  rejection_reason: 'Every cell that has earned a rule_traps reach describes a device placed to catch
    someone: bone-barbed nets, a catgut wire operating a net, javelins shot from a statue''s mouth, net
    traps set for game, a cultist''s trap, a barbed net launching from silt. A rusty portcullis and a
    groaning wall are architecture failing, not devices set. rule_traps is about finding a trap, disabling
    it and avoiding its effect, and none of those applies to decay. The word rusty and the word groaning
    are the source telling you these are ruins collapsing.

    That is a third axis after operation and agency, and I am less sure of it than of either. If the Reviewer
    holds that a portcullis slamming down is a mechanism regardless of what set it off, the row is a one-line
    addition and the wall would follow it. Recorded as OBS-02.'
- text_locus: the hasty ambush with shuttered lanterns, p172
  quoted_gist: bandits shutter lanterns and set up a hasty ambush
  why_considered: It is an ambush on a page whose other ambush carries a rule_surprise row, and item_lantern
    is canonical and is one of the two items classified as a light source under DEC-2026-0104, so a light
    row looked available too.
  rejection_reason: 'The cell says ambush and not surprise, and the canonical identity is Surprise with
    a defined procedure on printed pages 87 and 88; an ambush that names no surprise, no detection and
    no initiative states no part of it. That is the same qualifier reasoning that separates crawlers from
    rival crawlers. On the light side, bandits shuttering their own lanterns is preparation, not an effect
    on the light source rule: no radius, no duration and no fuel. Both halves fail for the ordinary reason.'
- text_locus: the hazards and decay that state no mechanic, pp172 and 173
  quoted_gist: the floor collapsing into a pit of stated depth, a dense cloud of sulfuric mist rising
    from a crack, ancient clay pots vibrating with hypnotizing resonance, a volatile alchemy lab
  why_considered: The pit states a depth, the mist is sulfuric and the pots hypnotise, all of which sound
    like they should do something.
  rejection_reason: A depth is a magnitude and the cell states no fall, no check and no damage, which
    is the disposition held since the deep tunnels floor on printed page 151. Hypnotising resonance has
    no status identity to point at, the thirteenth locus to lose a row to that gap. The mist and the lab
    state nothing at all beyond being present.
- text_locus: the campfire and the backpack, pp173 and 172
  quoted_gist: a recent campfire still burning with glowing cinders, and a strangler hiding above a backpack
    stuffed with rocks
  why_considered: item_campfire and item_backpack are both canonical and both are matched by the scan.
  rejection_reason: Neither states a mechanic. The campfire burns and nobody uses it; the backpack is
    bait and nobody carries it. item_campfire was declined in exactly this form on printed page 149, where
    dwarves roasted mutton around one, and this is the second instance of that disposition.
- text_locus: the creature results across the table, pp172 and 173
  quoted_gist: a cave brute, a gelatinous cube in two cells, an owlbear, rust monsters, animated armor,
    skeletons, giant dung beetles, an ochre jelly, hobgoblins, beastmen, a giant centipede, a strangler,
    a ghost, kobolds, gricks, giant wasps, a spider swarm, an ogre, giant bats, an ettercap, cultists,
    a dryad, bugbears, a deep gnome, a stone golem, darkmantles, cave creepers, a minotaur and the Wandering
    Merchant
  why_considered: Two are individually named, Mort the goblin and an ogre named Lud, and one cell gives
    dwarven miners a creature type in parentheses.
  rejection_reason: A creature's defining locus is its stat block in the unextracted monster chapter and
    the registry holds no monster_ identity. Fifteenth packet running for the same disposition.
- text_locus: the two-encounter instruction, p173
  quoted_gist: one result instructs the reader to roll twice more and combine the results, rerolling that
    result if it comes up again
  why_considered: It is the only instruction on the page, and the stem scan flags it as matching rule_encounter.
  rejection_reason: The match is on the plain word encounters in the instruction's own text; M001 already
    carries the table's relation to rule_encounter. The rest is arithmetic on the table's own roll. Declined
    in the same form in each of the fifteen preceding chapter packets.
- text_locus: the appended random encounter procedure and monster attributes, out of scope
  quoted_gist: the printed page 112 and 113 encounter procedure and the printed page 189 monster attributes
    page
  why_considered: Both are in the file and the first is the rule this table resolves.
  rejection_reason: Both are Supporting Source Context, outside the bounded scope. PKT-SD-112-113 is already
    integrated, so extracting from it would duplicate canonical rows and cite pages outside this packet's
    range.
non_edge_observations:
- id: OBS-01
  subject: two new targets for the chapter, both on strong precedent
  detail: 'This packet reaches rule_light_source and rule_surprise, neither of which any encounter table
    had touched before. Both follow an existing canonical shape rather than inventing one.

    The light row copies tbl_light_mishaps MODIFIES rule_light_source on extinguishing at worsens and
    basis read, from printed page 110; a gas leak that makes every light source explode and go out is
    that effect from a different source. The surprise row follows the type and polarity settled for the
    web casting on printed page 158: the encounter causes the occurrence, and the direction of benefit
    belongs at the target''s own locus, where rule_surprise already improves the attack roll, initiative
    and the turn.

    Recorded because sixteen packets in, the chapter is still producing first reaches, and both of these
    came from cells the scan flagged. The gas leak was flagged as spell_light, which is wrong, and the
    surprise cell was flagged as rule_surprise, which is right; reading both was what separated them.'
- id: OBS-02
  subject: a third axis on the trap boundary, and the one I am least sure of
  detail: 'A rusty portcullis slams down and separates the characters. A groaning wall collapses at the
    slightest touch. Both state an operation and the wall states a trigger, which is more than the javelin-shooting
    statue offered when it earned a row on printed page 161. Neither gets one here.

    The ground is that every qualifying cell so far describes a device placed to catch someone, and these
    describe architecture failing. rule_traps is about finding a trap, disabling it and avoiding its effect,
    none of which applies to decay. So the boundary now has three axes: the cell must state an operation,
    the mechanism must work without a creature choosing to work it, and it must be something set rather
    than something rotting.

    I am less confident of the third than of the first two and I would rather say so than let it pass
    as settled. It is the first axis I have added without an overturn or an affirmation behind it, and
    a portcullis is the single most trap-like object the chapter has produced. If the Reviewer disagrees,
    both cells move together and the wall comes with the portcullis.'
- id: OBS-03
  subject: the qualifier test now has a second word to test it on
  detail: 'The chapter''s crawler rule is that the qualifier identifies the procedure and the noun does
    not: rival crawlers earns the reach and crawlers alone does not. This page tests the same shape on
    a different pair. One cell has bandits set up a hasty ambush and earns nothing; another has kobolds
    sneak up behind the characters for a surprise attack and carries a row, because surprise is the canonical
    procedure''s own name and ambush is not.

    The hundredth row also uses the bare noun, holding that the body of a dead crawler holds a magic item,
    and it earns a treasure row rather than a rival crawler one, which is the same rule applying twice
    in one cell.

    Recorded because the pattern is now general rather than a quirk of one word. The book uses ordinary
    English for things it has named procedures for, and the graph records only the named form. That is
    a real limit on what these tables can contribute, and it is worth stating plainly rather than discovering
    again in each remaining packet.'
