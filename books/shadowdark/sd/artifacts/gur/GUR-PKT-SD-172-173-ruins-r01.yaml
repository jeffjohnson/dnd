completeness_statement: 'Both printed pages in scope were read in full at the recorded checksum: 1 named
  table, 50 data rows, 0 sentences of prose. The packet yields 1 new identity and 5 rows, reusing 5 canonical
  identities whose labels the building script asserted equal to the registry. The proposed table carries
  edges, so nothing is left unattached.

  Every row was checked against the 822 canonical edges for an assertion-key collision, for a shared source,
  type and target under a different aspect, and for duplicates within the patch; there are none of any,
  and no canonical row cited either page before. The script locates the supporting cell for each row and
  asserts its page, which matters because the page break falls inside the table.

  7 candidates were rejected and each is recorded with its reason. The largest deliberate loss is the
  creature and scene content, which belongs to the unextracted monster chapter or states no mechanic at
  all. 9 of the 16 apparent registry references in the cells are spurious collisions with ordinary English,
  measured rather than filtered by eye. No assertion depends on any other ruleset.'
surprise_reach_note: 'M003 reaches a target no encounter table has touched, so the type and polarity are
  argued.

  The cell, at row index 25 of 50, states that kobolds sneak up behind the characters for a surprise attack.
  TRIGGERS is the type because the encounter causes surprise to occur; FEEDS_INTO would say the table
  supplies an input to the surprise rule and MODIFIES would say it changes how surprise works, both false.

  The polarity is neutral at basis read, following the web casting on printed page 158 and for the same
  reason. rule_surprise already carries its directed consequences at its own locus, improving the attack
  roll, initiative and the turn, all from printed pages 87 and 88, and it is gated by hiding and sneaking
  and negated by keen senses. Writing inflicts here would import that machinery into the trigger row from
  a page-173 locus. What this cell states is that surprise happens, not whether it is good or bad, and
  who it is bad for is a fact about the encounter rather than about the rule.'
measured_figures_note: 'Figures quoted in this artifact''s prose are computed by the building script from
  the claimed source and the canonical files, and the finished document is checked for unsubstituted format
  specifiers before it is written. Located cells: the gas leak at index 18, the surprise attack at 25,
  the hasty ambush at 15, the rival crawlers at [3, 28], the portcullis at 22, the collapsing wall at
  6, the campfire at 46 and the magic item at 49, of 50 rows. Canonical counts at extraction: 17 resolvers
  on rule_encounter, 5 inbound on rule_light_source of which 2 are MODIFIES, 7 rows on rule_surprise,
  8 inbound FEEDS_INTO on rule_traps, 14 inbound on rule_rival_crawlers and 8 inbound on rule_treasure.
  The hundredth slot names a magic item in 6 of the 16 claimed packets of this chapter.'
