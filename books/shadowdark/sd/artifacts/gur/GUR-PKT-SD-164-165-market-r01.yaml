rejected_candidates:
- text_locus: the random scroll for sale, p165
  quoted_gist: the Wandering Merchant has a random scroll for sale
  why_considered: item_spell_scroll is canonical, and one packet ago a dropped magic item earned a reach
    to rule_treasure on the ground that the cell names a canonical category. A random scroll looks like
    the same move, and the word random is the same word the deep tunnels cell used.
  rejection_reason: 'Three things separate it, and the first is decisive. The category named is scroll,
    where the canonical label is Spell Scroll, so the cell does not name the category the graph holds;
    a scroll in a market could be a map or a deed. Second, nothing is found or gained: it is stock offered
    for sale with no price and no purchase, so no acquisition is stated. Third, item_spell_scroll has
    no canonical path into rule_treasure, unlike item_magic_item, so even the routing that carried the
    last two treasure rows is unavailable. Recorded as OBS-02, because this is the first test of the boundary
    the Integrator affirmed one packet ago and it holds in the restraining direction.'
- text_locus: the three gear-theft cells, pp164 and 165
  quoted_gist: children plucking at the characters' gear and pockets, goats chewing on loose gear, a monkey
    in a vest stealing people's gear
  why_considered: item_gear is canonical and carries slot rules from printed pages 35 and 36, and gear
    is the book's own word, matched in three separate cells by the registry scan.
  rejection_reason: None of the three states what is taken, whether anything is lost, or any check to
    prevent it. The canonical gear rows are about how many slots a character has and what fills them,
    and a goat chewing on a strap engages none of that. Theft as scenery is the same disposition that
    declined the pickpockets on printed pages 145 and 163.
- text_locus: the violent and hazardous crowd scenes, pp164 and 165
  quoted_gist: a knife-thrower hurling a blade toward a character, a runaway cart, a collapsing dung pile,
    a firebreather with a stated chance of misfire, sorcerers whose psychic contest starts fires, a bear
    tearing loose, camels spitting, a wraith released from a shattered mirror
  why_considered: Eight cells could injure someone, and the firebreather states a percentage, which is
    closer to a mechanic than most.
  rejection_reason: A percentage is a magnitude and the cell states no consequence for the misfire. None
    of the eight states a check, a die, a value or a duration, and the word damage does not appear on
    the page. Tenth locus to lose rows to the absence of stated mechanics for dangerous scenery.
- text_locus: the apple appearing in a statue's hand, p165
  quoted_gist: a shining, red apple appears in a statue of Gede's hand
  why_considered: deity_gede is canonical and the cell is the near-twin of the magic sword appearing in
    a gladiator statue's hand on printed page 147.
  rejection_reason: Declined for both reasons that applied there and here. A statue of a god is not the
    deity, which is the name-collision reading, and an object appearing in a scene is not an acquisition,
    which is the distinction the Integrator confirmed when it verified that canonical holds zero rows
    citing printed page 147. An apple is not even a canonical category.
- text_locus: the two-encounter instruction, p165
  quoted_gist: one result instructs the reader to roll twice more and combine the results, rerolling that
    result if it comes up again
  why_considered: It is the only instruction on the page, and the stem scan flags it as matching rule_encounter.
  rejection_reason: The match is on the plain word encounters in the instruction's own text; M001 already
    carries the table's relation to rule_encounter. The rest is arithmetic on the table's own roll. Declined
    in the same form in each of the eleven preceding chapter packets.
- text_locus: the appended random encounter procedure and monster attributes, out of scope
  quoted_gist: the printed page 112 and 113 encounter procedure and the printed page 189 monster attributes
    page
  why_considered: Both are in the file and the first is the rule this table resolves.
  rejection_reason: Both are Supporting Source Context, outside the bounded scope. PKT-SD-112-113 is already
    integrated, so extracting from it would duplicate canonical rows and cite pages outside this packet's
    range.
non_edge_observations:
- id: OBS-01
  subject: a defect of mine reached a published artifact and the fix is a build guard
  detail: 'OBS-01 of the previous packet shipped with three unsubstituted format specifiers in its text:
    it reads that the rival stem matches a placeholder number of cells at placeholder indices. The Integrator
    flagged it. The values were correct and stated substituted elsewhere in the same artifact and in the
    handoff message, so no decision moved and no row was affected, but a template that ships its own variable
    names is a defect waiting to mislead a reader, and it is published and cannot be edited.

    The fix is a guard rather than more care. The shared builder now walks every string in the finished
    document and fails the build if any contains an unsubstituted specifier. I proved it before relying
    on it by running the check against the published PKT-SD-162-163 artifact, where it flags exactly the
    one field, and against the published PKT-SD-160-161 artifact, where it flags nothing.

    This is the second build-time guard added after a real defect rather than in anticipation of one,
    the first being the assertions that caught the level-three heading on printed page 146. Recorded because
    the previous artifact is published with the defect in it and a reader needs the correction somewhere.'
- id: OBS-02
  subject: the treasure boundary holds on its first test after being clarified
  detail: 'One packet ago the Integrator accepted that the operative element of the treasure disposition
    is the cell naming a canonical category, and said it would hold later packets to that. This page offers
    the first test and the answer is no.

    The Wandering Merchant has a random scroll for sale. The word random matches the deep tunnels cell,
    the seller is the same recurring figure, and item_spell_scroll is canonical. It still earns nothing,
    because the category named is scroll rather than Spell Scroll, because stock offered for sale is not
    an acquisition, and because item_spell_scroll has no canonical path into rule_treasure the way item_magic_item
    does. Recorded because a boundary that is only ever applied in the permitting direction is not a boundary,
    and this is the case that shows it restrains.'
- id: OBS-03
  subject: the first trap on a city page
  detail: 'A merchant under duress serves as bait for a cultist''s trap. Measured from canonical rather
    than recalled: rule_traps carries 6 inbound FEEDS_INTO rows at extraction, from arctic, cave, deep_tunnels,
    desert, forest, jungle, so this row is number 7 and every one before it is terrain or underground.

    Recorded as a small correction to the shape the chapter appeared to have. It also needs none of the
    mechanism judgement the last five packets have turned on, because the cell simply says trap. After
    four packets of arguing about tripwires, wedges and ropes, the plainest instance of the category arrives
    on the page least expected to carry one.'
