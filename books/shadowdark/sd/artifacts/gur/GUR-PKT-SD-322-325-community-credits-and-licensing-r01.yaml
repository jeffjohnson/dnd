rejected_candidates:
  - text_locus: 'FIND ADVENTURES AND CONTENT, p323'
    quoted_gist: 'the Cursed Scroll zine carries themed character options, monsters, locations and adventures'
    why_considered: >-
      Names four categories of game content, and cs1, cs2 and cs3 are registered books in
      rulesets/shadowdark/registries/books.yaml, so the sentence could be read as saying something
      about a registered supplement.
    rejection_reason: >-
      It is a description of what a product contains, not a rule. It names no specific character
      option, monster or location, states no dependency between two mechanics, and nothing
      downstream would need review if the sentence were struck. Constitution section 7 additionally
      requires supplement source authority, optionality and compatibility to be established from
      supplied source and forbids inferring that a supplement overrides the main rules. See OBS-02.
  - text_locus: 'FIND ADVENTURES AND CONTENT, p323'
    quoted_gist: 'named third-party creators have published adventures, settings and character options'
    why_considered: 'Names character options again, and names the third-party licence by which they exist.'
    rejection_reason: >-
      A pointer to unregistered external products by named people. No such product is a registered
      Shadowdark book or source, none is supplied, and constitution section 6 requires a book and
      exact source to be registered before its first packet is claimed. Nothing mechanical is stated.
  - text_locus: 'ATTRIBUTION STATEMENT, p324'
    quoted_gist: 'this work includes material taken from the System Reference Document 5.1 under a Creative Commons licence'
    why_considered: >-
      A provenance statement about the rules text itself, which could be read as importing another
      system's identities or as establishing a supersession relationship with an external document.
    rejection_reason: >-
      A copyright attribution, not a mechanical relationship. It identifies no Shadowdark mechanic
      and no SRD mechanic, so there is no ordered pair to assert. It gives no basis for an OVERRIDES
      edge: constitution section 7 enumerates the four supersession bases and none covers a licence
      attribution. Importing SRD identities on the strength of this sentence would breach
      constitution section 9, which states that this constitution imports no identities from another
      ruleset, and section 2, under which identically spelled IDs elsewhere are unrelated identities.
  - text_locus: 'SHADOWDARK RPG LICENSING, p324'
    quoted_gist: 'creators may publish their own material using the third-party licence, which will always be published in this book'
    why_considered: >-
      Contains a cross-reference to printed page 325 and a durable commitment about the book's
      contents, so a CROSS_REFERENCES edge was considered.
    rejection_reason: >-
      CROSS_REFERENCES runs between two nodes, and neither end is a mechanic: the source is a
      publishing permission and the target is a page of licence text. Constitution section 1 states
      that source layout and document metadata are not graph mechanics. The pointer is navigational.
  - text_locus: 'SHADOWDARK RPG THIRD-PARTY LICENSE VERSION 1.0, clause 2, p325'
    quoted_gist: >-
      licensees may reference the general concepts, rules and game mechanics, and the names of
      beings, locations, spells and items, but may not reprint verbatim text except monster and
      spell statistics
    why_considered: >-
      The clause explicitly names rules, game mechanics, spells, items, monsters and their
      statistics, which are the very categories the graph represents, and it draws a permission
      boundary around them.
    rejection_reason: >-
      It names the categories as legal subject matter, not as mechanics that depend on one another.
      No specific spell, item or monster is named, so no identity can be formed, and the permission
      it grants runs between a publisher and a licensee rather than between two game mechanics. It
      fails the core test completely: if the clause were struck, no Shadowdark mechanic would need
      review. The same reasoning disposes of clauses 1, 3 and 4 and the governing-law, severability
      and required-notice paragraphs, which concern profits, logos, liability and jurisdiction.
  - text_locus: 'DEDICATION and FONTS, p324'
    quoted_gist: 'thanks to named people, and font copyright notices'
    why_considered: 'Read for completeness, as every block on an in-scope page must be considered.'
    rejection_reason: >-
      Acknowledgements and typeface attributions. They name no game concept at all.
  - text_locus: 'SHADOWDARK RPG COMMUNITY, p323'
    quoted_gist: 'Discord server, newsletter, convention events and open-table games run by the creator'
    why_considered: >-
      Open-table and unscheduled play are recognisable modes of play, so a play-procedure node was
      considered.
    rejection_reason: >-
      The passage describes where real games happen and how to hear about them, not a procedure the
      rules define. It states no resolution step, no precondition and no dependency. Minting a node
      from the phrase would assert a mechanic the book does not have.

non_edge_observations:
  - id: OBS-01
    subject: the packet is back matter and yields nothing by its nature
    detail: >-
      The claim manifest recorded the packet's shape and deliberately declined to answer whether any
      of pages 323 to 325 yields a graph-constitutable mechanic, leaving that to extraction. This
      GUR answers it: none does. The three pages are community promotion, acknowledgements, a
      copyright attribution and a legal licence. Every element that named a game concept is
      enumerated in rejected_candidates with its locus and reason, so the emptiness is auditable
      rather than asserted. This is the expected outcome for this material, not a source defect, and
      no page needs to be returned to the steward for correction.
  - id: OBS-02
    subject: the zine mention does not establish supplement authority for cs1, cs2 or cs3
    detail: >-
      rulesets/shadowdark/registries/books.yaml registers cs1, cs2 and cs3 with source_authority
      pending_source_review. Page 323 names Cursed Scroll as the official zine and lists what it
      contains. Recorded here because a later reader may reach for this sentence as evidence of
      those books' standing. It is not: constitution section 7 requires supplement source authority,
      optionality and compatibility to be established from supplied source and forbids inferring
      that a supplement overrides the main rules from its title or date, and a marketing sentence in
      the main rules is neither the supplement nor a statement of its rules authority. Their
      registry status should change only when their own source is supplied and read. The Analyst
      asserts nothing about them and proposes no registry change; only Architect may alter a
      controlled registry.
  - id: OBS-03
    subject: the SRD attribution does not import another ruleset's identities
    detail: >-
      Recorded for the same defensive reason as OBS-02. Page 324 states that the work includes
      material from SRD 5.1. A reader who knows that document may be tempted to resolve a later
      Shadowdark ambiguity by consulting it. Constitution section 6 forbids exactly that: other
      systems' books and legacy graphs cannot resolve Shadowdark ambiguity. Section 9 states the
      bootstrap imports no identities, mechanics, Decisions or rows from another ruleset. The
      attribution is a legal notice about the text's provenance and changes neither rule.
  - id: OBS-04
    subject: page 322 is excluded by the steward and is not an uncovered page
    detail: >-
      Restated here so the completeness accounting below is readable on its own. The page carries
      the steward's page-intentionally-ignored class on an empty fenced Div. Under SOURCE_MARKDOWN
      1.8 it stays in the declared span and in this accounting, contributes no graph content, and
      creates no obligation. The Analyst neither authored the class nor treated it as licence to
      skip a page that in fact holds content; the AST confirms the Div is empty.
  - id: OBS-05
    subject: packet wrapper is intake metadata
    detail: >-
      The supplied file opens with an intake wrapper naming the packet and a shadowdark.md line
      range ahead of the Primary Source Material heading, so a marker linter reports content
      preceding the first resolved page. The claim manifest is the independent page locator that
      SOURCE_MARKDOWN Attribution Rules requires for such content, and it records that the wrapper
      contains no rulebook prose, heading or marker. The condition is identical in kind to the other
      packets claimed from this intake and strands no source content.
  - id: OBS-06
    subject: the packet manifest declares constitution 1.1
    detail: >-
      packet.yaml records constitution_version 1.1 because it was written at claim, before
      DEC-2026-0089. This GUR declares 1.2 and was validated against it. Constitution section 9
      states that immutable packet manifests are not rewritten merely for an additive version bump,
      so the manifest is left exactly as published and the discrepancy is recorded rather than
      repaired. It affects nothing here: the manifest's authority is over page attribution, source
      identity and composition, none of which changed between 1.1 and 1.2, and this GUR proposes no
      assertion that a constitution version could alter.

