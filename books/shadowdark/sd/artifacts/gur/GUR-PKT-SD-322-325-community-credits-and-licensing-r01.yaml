source_summary: >-
  Back matter of the Shadowdark main rules. Page 322 is excluded by the steward. Page 323, JOIN THE
  DARK, gives community links, a Discord and newsletter address, a note about convention play, and
  pointers to the publisher's site, zine and third-party creators. Page 324, CREDITS, carries a
  dedication, font copyright notices, an SRD 5.1 attribution statement, and a paragraph introducing
  the third-party licence. Page 325 prints the Shadowdark RPG Third-Party License version 1.0 in
  full. This summary is orientation only.

