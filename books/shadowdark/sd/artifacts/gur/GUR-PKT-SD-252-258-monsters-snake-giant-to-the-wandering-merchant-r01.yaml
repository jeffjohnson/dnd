non_edge_observations:
  - id: OBS-01
    subject: Sphinx roar and creature WIS spells operate on creature combat and action loci
    detail: >-
      Sphinx possesses Roar (DC 18 CHA or paralyzed 1d4 rounds in far) and creature-specific WIS spells (Gate DC 14,
      Omens DC 12, Riddle DC 12, Time Bend DC 14, Unmake DC 13). All operate on creature combat action locus under
      Constitution 2.5.
  - id: OBS-02
    subject: Ten-Eyed Oracle eyestalk rays represent a bespoke ten-ray creature attack subsystem
    detail: >-
      The Ten-Eyed Oracle fires 2d4 eyestalk rays per round across ten distinct effects (Charm, Hold, Sleep, Polymorph,
      Cancel, Confusion, Telekinesis, Disintegrate, Petrify, Death). All operate on creature combat action locus under
      Constitution 2.5.
  - id: OBS-03
    subject: The Tarrasque traits constitute an epic-tier creature defense, recovery, and attack suite
    detail: >-
      The Tarrasque features Legendary resistance, Deep Dweller immunities, Permanent Death requiring wish at 0 HP,
      Rampage straight-line triple bite, Reflective Carapace energy deflection, Regeneration of 4d10 HP/turn, Sever
      limb amputation on natural 18+, and Swallow whole into darkness with 4d10 round damage and 30 damage regurgitation
      threshold. All operate on creature combat and defense loci under Constitution 2.5.
  - id: OBS-04
    subject: The Wandering Merchant equipment and inventory traits operate on unique NPC creature locus
    detail: >-
      The Wandering Merchant stat block specifies bespoke magical relics and traits (Amulet of Rahm-Hotep planar teleport,
      Bottomless Bag 200 gear slots summoned by snapping fingers, Dice of Truth unalterable rolls, Lop beheading on natural
      18-20, Reckoning cockatrice curse on theft, Strange Lands environmental immunity). All operate on creature action
      and inventory locus under Constitution 2.5.
  - id: OBS-05
    subject: Venom and blood drain riders (Snake Swarm, Spiders, Stingbat) operate on creature attack loci
    detail: >-
      Snake Swarm delivers delayed lethal poison (0 HP in 1d4 rounds on failed DC 12 CON); Spider poisons deal damage or
      induce temporary paralysis (1d4 rounds for swarm, 1d4 hours for giant spider); Stingbat beak drain auto-hits until
      removed on DC 9 STR. All operate on creature combat attack rider loci under Constitution 2.5.
  - id: OBS-06
    subject: Strangler stealth and surprise damage multiplier operate on creature action/damage locus
    detail: >-
      Strangler possesses Stealthy (ADV on DEX checks to hide/sneak) and Strangle (×2 damage against surprised targets).
      Both operate on creature combat action and damage calculation loci under Constitution 2.5.

