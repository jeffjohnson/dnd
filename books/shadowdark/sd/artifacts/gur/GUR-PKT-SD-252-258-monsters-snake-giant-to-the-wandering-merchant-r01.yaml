source_summary: >-
  Twelve creature stat blocks: Snake, Giant (cow-swallowing serpent, Constrict), Snake, Swarm (roiling
  wave of serpents, Poison), Soldier (trained armed footsoldier, chainmail + shield, longsword, crossbow),
  Sphinx (leonine oracle, Roar, WIS spells Gate, Omens, Riddle, Time Bend, Unmake), Spider (silent web-weaver,
  Poison), Spider, Giant (ambushing cave/tree arachnid, paralyzing Poison), Spider, Swarm (carpet of spiders,
  paralyzing Poison), Stingbat (needle-beaked orange insect-bat, Blood Drain), Strangler (four-limbed gaunt
  predator, Stealthy, Strangle), The Ten-Eyed Oracle (floating barnacled mass with ten eyestalk rays, Legendary,
  Eyestalk Ray suite), The Tarrasque (colossal mountain-sized apex destroyer, Legendary, Deep Dweller, Permanent
  Death, Rampage, Reflective Carapace, Regeneration, Sever, Swallow), and The Wandering Merchant (immortal
  traveling trader, mithral chainmail, +3 vorpal bastard sword, Legendary, Amulet of Rahm-Hotep, Bottomless Bag,
  Dice of Truth, Lop, Reckoning, Strange Lands).

