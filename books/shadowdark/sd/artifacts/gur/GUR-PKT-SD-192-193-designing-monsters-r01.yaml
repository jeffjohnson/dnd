rejected_candidates:
  - text_locus: 'COMBAT ROLE, p192'
    quoted_gist: >-
      six named roles, Mook, Soldier, Striker, Tank, Controller and Legendary, each described by
      relative damage, hit points, armour class and attack bonus, with the striker often stealthy
      and the controller having environment-altering talents
    why_considered: >-
      This is the page's strongest temptation. Six terms are named, capitalised and bolded, each
      with a stated profile, and they read like a taxonomy the graph could hold. The controller
      entry also names talents, and rule_talents is canonical with 5 rows.
    rejection_reason: >-
      They are a designer's vocabulary, not a mechanic. Every profile is stated in relative terms
      only, low, mid-range and high, which are magnitudes without values and cannot be stored in
      any field; nothing is computed from a role and nothing changes if a role is renamed.
      Minting six identities would create exactly the creature classification constitution
      section 2.4 keeps out of the graph, and section 8 adds that structural roles are query-time
      conclusions rather than stored assertions. The talents mention is a description of what a
      controller tends to have, not a dependency.
  - text_locus: 'STAT MODIFIERS and DESCRIPTION, p192'
    quoted_gist: >-
      compare with measuring-stick monsters such as elephants when choosing modifiers, monsters
      can have higher modifiers than PCs, and describe a monster's defining characteristics and
      behaviours
    why_considered: >-
      abil_stat_modifier is canonical and the first subsection is about it, immediately raising
      the question of why M004 reaches it and this does not.
    rejection_reason: >-
      Both are advice about how to choose, not statements of what depends on what. Comparing with
      an elephant is a method for the designer; that monsters can exceed PC modifiers states a
      permission rather than a relationship. M004 exists because a different subsection says the
      attack bonus is based on the modifier, which is a derivation. This is the distinction the
      whole page turns on and it is recorded here rather than only in disposition_note.
  - text_locus: 'MOVEMENT, p192'
    quoted_gist: >-
      most monsters can move near, or double near if large, and note if they can swim, fly, climb
      or burrow
    why_considered: 'ex_movement is canonical with 22 rows and rule_distance already constrains it.'
    rejection_reason: >-
      Most and typically hedge a default value, near is a distance band already carried by
      rule_distance CONSTRAINS ex_movement from printed page 85, and the special modes are a
      list of things to note in a stat block. This is the same reading applied to the identical
      sentence at printed page 189, which the appended context repeats.
  - text_locus: 'the level band descriptors, p192'
    quoted_gist: >-
      each level band is labelled weak, risky, dangerous or mighty, common through unique, and a
      challenge to novice, experienced, expert or supreme crawlers
    why_considered: >-
      The bands are the most structured content on the page and the challenge descriptors read
      like a difficulty mechanic.
    rejection_reason: >-
      There is no identity for a difficulty or rarity rating and none may be minted from an
      adjective list; the descriptors are prose labels on ranges of a value. M006 takes from this
      subsection only the part that names a mechanic the graph holds, which is treasure quality,
      and leaves the labels alone.
  - text_locus: 'the damage and attack-count bands, p193'
    quoted_gist: >-
      each level band lists weapon quality, a damage die range on each attack and a number of
      attacks
    why_considered: >-
      Every figure here is a magnitude, so the subsection could be read as storing nothing at all
      and therefore earning nothing.
    rejection_reason: >-
      The figures are indeed magnitudes and none is stored. What is not a magnitude is the
      direction: the subsection is organised by level and the damage follows from it. M007
      asserts that dependency and nothing else. The attack-count half is declined separately
      because the number of attacks has no identity of its own; cbt_attack_roll is the roll, not
      how many are made, and the page-189 attack sentence was declined on the same ground.
  - text_locus: 'MONSTER TALENTS, p193'
    quoted_gist: 'monsters typically have one to three talents that grant special powers or attacks'
    why_considered: >-
      rule_talents is canonical with 5 rows and this is the only sentence on the page that names
      it directly.
    rejection_reason: >-
      Typically and the count are a hedge and a magnitude, and what remains is that monsters have
      talents, which states scope rather than dependency. Nothing is computed from a talent here
      and no talent is named. Constitution 2.5 reaches the same result: how many talents a
      creature has is one of its stat-block values.
  - text_locus: 'the HOW MANY MONSTERS? prose, p193'
    quoted_gist: >-
      levels can be combined into a different quantity of monsters, an example of four
      fourth-level adventurers facing a combined twelve levels of monsters, large groups being
      deadly because they take more actions each round, and a solo monster being too easy if
      swarmed
    why_considered: >-
      rule_action and rule_round are canonical and the passage explains why the table's output
      needs judgement, which sounds like a constraint on it.
    rejection_reason: >-
      The worked example is entirely magnitudes. The two closing observations are advisory and
      hedged, can be deadly and can be too easy, and state no rule: nothing in the graph changes
      if a group is large. The action-economy remark is an explanation of why the guidance is
      approximate, not an assertion that monster count modifies the action rule.
  - text_locus: 'average party level as its own identity, p193'
    quoted_gist: 'the table''s first column is average party level'
    why_considered: >-
      It is the same shape as PL at printed page 190, a party-level quantity with no identity, and
      consistency required that it be answered the same way rather than by habit.
    rejection_reason: >-
      Average party level is the characters' level and constitution 2.5 bounds mstat_ to a
      creature statistic, so no identity is minted. M002 reaches exp_level directly, which is
      what the column holds. The word average is an aggregation of that value rather than a
      different mechanic, and constitution section 2 states that labels do not determine
      identity.
  - text_locus: 'the appended monster attributes page, out of scope'
    quoted_gist: 'the printed page 189 monster attributes page'
    why_considered: >-
      It is in the file for the third consecutive packet and its MOVEMENT and STAT MODIFIERS
      subsections are near-duplicates of subsections on this page.
    rejection_reason: >-
      It is Supporting Source Context, outside the bounded scope, and
      PKT-SD-189-189-monster-attributes already carries its three rows. The near-duplication is
      the hazard: the in-scope MOVEMENT subsection is declined on its own terms above, not
      because the repeated copy was read.

non_edge_observations:
  - id: OBS-01
    subject: the page alternates guidance and procedure, and the test separates them cleanly
    detail: >-
      Nine subsections: four state a dependency and five do not, and they alternate rather than
      grouping. STAT MODIFIERS is advice and ATTACK BONUS, two subsections later, is a
      derivation; MOVEMENT is advice and LEVEL, immediately after, states what level determines.
      That alternation is why the page was tested subsection by subsection. A verdict on the
      whole page would have been wrong in either direction: read as guidance it loses four real
      dependencies, read as procedure it invents six combat-role identities and a difficulty
      vocabulary.
  - id: OBS-02
    subject: a band of magnitudes can still carry a direction
    detail: >-
      27 numerals appear on this page, more than any other in the chapter, and not one is stored.
      The LEVEL and DAMAGE subsections are tables of values in prose form, and the instinct is
      that a subsection made entirely of magnitudes yields nothing.
      That instinct is wrong here. A band table has an input and an output: the level is what you
      look up by, and the treasure quality and the damage are what you read off. The values
      cannot be stored and the direction can, which is M006 and M007. The test is whether the
      source organises the bands by the input, and this one does, four times over in each
      subsection.
      Recorded because roughly sixty stat-block packets follow and each will present values
      without any such direction, where the correct answer is nothing.
  - id: OBS-03
    subject: two rows reach the attack roll from opposite sides
    detail: >-
      M004 says the monster's attack bonus is derived from its stat modifier and M005 says its
      level bounds that bonus. Both come from the same two-sentence subsection and they are
      different kinds of statement: one supplies the value, the other caps it.
      The cap is hedged, should rarely exceed, which makes it CONSTRAINS rather than EXCLUDES
      under the test settled at PKT-SD-114-114 and applied to the swamp mosquitoes at 176. An
      unhedged must not exceed would have been the same row at the same polarity, so the hedge
      does not change this one, but recording it keeps the reading auditable.
  - id: OBS-04
    subject: the third bridge from character level, and the pattern is now settled
    detail: >-
      exp_level has now been reached from the monster chapter three times: PL at printed page
      190, and average party level here in M002. Each time the source names a party-level
      quantity that has no identity, and each time it is the characters' level under another
      label.
      The pattern is worth stating once so it stops being re-derived: a party-level quantity is
      exp_level, a creature's level is mstat_monster_level, and constitution 2.5 keeps the second
      from absorbing the first. The remaining monster packets will meet this again in the XP and
      treasure material.

