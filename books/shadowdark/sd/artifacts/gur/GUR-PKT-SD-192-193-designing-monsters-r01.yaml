completeness_statement: >-
  Both printed pages in the declared span were read in full at the recorded checksum, which the
  script asserts against the packet manifest before parsing: 11 headings, 23 prose paragraphs and
  1 named table of 4 data rows. Every subsection is dispositioned, four as rows and five as
  declines.
  The packet yields 2 new identities and 7 rows, reusing 6 canonical identities whose labels the
  script asserted equal to the registry, and both proposed ids were asserted absent before use.
  Every proposed identity carries at least one edge, so nothing is left unattached.
  Every row was checked against the 859 canonical edges for an assertion-key collision, for a
  shared source, type and target under a different aspect, and for duplicates within the patch;
  there are none of any, no two rows in the patch share a source, type and target, and no
  canonical row cited either page before. The script asserts that every submitted row cites 192
  or 193 and that the table carries no page marker.
  9 candidates were rejected and each is recorded with its reason. The largest deliberate loss is
  the six combat roles, which are a designer's vocabulary rather than a mechanic. 27 numerals
  appear on the page and none is stored. No assertion depends on any other ruleset.

