source_summary: >-
  A GM's guide to building a monster, in nine short subsections. It names six combat roles,
  advises on stat modifiers and description, states what a monster's level determines, says how
  a monster's attack bonus is derived and bounded, gives damage and attack counts by level band,
  notes that monsters have talents, and closes with a four-row table matching average party
  level to the monster level that makes a one-to-one fight of average difficulty.

graph_state_at_extraction: >-
  Read from the repository at extraction, not recalled. The canonical graph holds 429 registry
  rows and 859 edges, and 0 rows cite printed page 192 or 193. The registry holds 126 tbl_
  identities, 99 rule_ identities and 1 mstat_ identity.
  The endpoints this packet reuses carry 3 rows on mstat_monster_level, 28 on cbt_attack_roll, 2
  on abil_stat_modifier, 15 on rule_treasure, 25 on rule_damage and 31 on exp_level. The script
  asserts that both proposed ids are absent from the registry before using them.

disposition_note: >-
  This page sits between two settled readings and resembles both, so the test was applied
  subsection by subsection rather than to the page as a whole.
  PKT-SD-075-077 yielded nothing because its content was advice about how to think, stating no
  dependency. PKT-SD-190-191 yielded five rows because its content was a construction procedure
  whose prose said what is computed from what. This page contains both kinds in alternating
  subsections.
  The test used is the one that separated them: a sentence of the form one thing is based on, or
  bounded by, or determined by another states a dependency and earns a row; a sentence
  describing what a designer should aim for does not. Four subsections pass it and five do not,
  and each is recorded individually.
  Bands of values keyed to level are the hard case and are treated as follows. The figures in
  them are magnitudes and none is stored. But a band table establishes a direction: the level is
  the input and the damage, or the treasure quality, is the output. Where the source states that
  direction, the dependency is assertable without the values, which is M006 and M007.

mstat_boundary_observed: >-
  mstat_monster_level is the hub of this page and carries 4 of the 7 rows. Every one of them is
  a dependency between shared mechanics: what the monster level is selected from, what it
  constrains, and what it determines. None stores a level value, a band, or any individual
  creature's level, which is the line constitution 2.5 draws.
  No new mstat_ identity is proposed. Average party level is expressed through exp_level for the
  same reason PL was at printed page 190: it is the characters' level, not a creature statistic.

