units_note: 'Figures name their unit. Measured by the assembling script from the claimed source: 0 sentences
  of prose, 5 named tables, 56 data rows across them, 16 results in the interesting customer grid, and
  2 artwork pages. The three tier tables hold 12, 10, 10 results respectively.'
page_attribution_basis: 'Two markers sit on headings and two pages are carried by class-bearing Divs.
  p138 ends the SHOP heading and p139 ends the SHOP GENERATOR TABLE heading, and placement rule 1 applies
  each to its whole heading with the persistence rule carrying it forward. Verified against the claimed
  source that no marker appears inside a table row.

  So the three tier tables are printed page 138 and the generator and customer tables are 139. Each row
  is cited to the page of the table it concerns, so 6 rows cite 138 and 3 cite 139.

  Pages 140 and 141 are empty Divs classed full-page-artwork. They are inside the declared span and in
  completeness accounting, and under constitution section 6 they create no node, edge, citation or uncovered-page
  obligation. No row cites either.'
scope_boundary: 'The bounded scope is the Primary Source Material section, printed pages 138 to 141: 5
  named tables, 2 artwork pages and no prose at all. The Supporting Source Context section is declared
  but empty.'
source_summary: A shop generator, and the only page in this chapter with no prose. The heading is followed
  immediately by three mutually exclusive tables giving what kind of shop a poor, standard or wealthy
  shop is. A generator table then gives the shop a two-part name and something it is known for, in the
  same three-column form the tavern generator uses one page earlier. A 4 by 4 grid gives an interesting
  customer who happens to be there. Two full-page artwork pages close the span.
graph_state_at_extraction: 'Read from the repository at extraction, not recalled, and every figure here
  is computed by the assembling script from the canonical files and the claimed source.

  The canonical graph holds 396 registry rows and 764 edges, and 0 rows cite any of printed pages 138
  to 141, so nothing in this span has been extracted before. No shop, customer or trade identity exists.
  The registry holds 97 tbl_ identities and 37 identities at degree zero.

  Three things were read in full before deciding anything. rule_rival_crawlers carries 9 rows, one CONSTRAINS
  and 8 RESOLVED_BY, all from printed pages 126 and 127, and it is a generator procedure in exactly the
  sense this page needs. The ALTERNATIVE_TO population is 7 rows, covering starting level, the three alignments
  pairwise, advantage against disadvantage, the two downtime activities, and the wizards-and-thieves wager.
  And printed page 124, the tables-only NPC page, yielded 2 canonical rows from six registered tables,
  which is the precedent this packet had to argue against.'
procedure_identity_note: 'This packet turns on one question and it is precedent-setting, so it is argued
  first. Does a shop procedure identity exist on a page with 0 sentences of prose?

  I propose rule_shop, and I am departing from the formulation I have used for four packets, that a source-named
  parent needs prose defining the thing the tables generate. That formulation was a generalisation from
  two pages, not a rule, and it is the wrong test. The right question is whether the source establishes
  that a thing is being generated, and prose is only the commonest way it does so.

  Three in-scope facts establish it here. The three tier tables are named POOR, STANDARD and WEALTHY SHOP
  TABLE and resolve the same thing at three grades, and three mutually exclusive resolvers presuppose
  something they resolve. The generator table gives a shop a name, which is only meaningful for a shop
  being generated. And the customer table asks who else is in it. Five tables that are individually inert
  and jointly a procedure.

  Out of scope and therefore not cited in any row, but corroborating: printed page 134, canonical since
  the settlement packet, directs the reader to roll shops on this page. The book states that this procedure
  exists; it simply states it one spread earlier. Declining the identity on the absence of local prose
  would repeat the rule_d6_decider error, where I rejected a direction because no rule sat at the cited
  page without asking whether it was canonical elsewhere.

  The contrasting precedent is printed page 124 and it does not control. Its six tables are attributes
  of an NPC, ancestry, alignment, age, wealth, qualities, occupation, and nothing in the book says to
  roll an NPC. Here the tables are alternative resolvers of one object and the book says to roll it. Raised
  as IDQ-01 anyway, because the ruling will govern the twenty-two tables-only encounter packets that follow.'
tier_exclusivity_note: 'The three ALTERNATIVE_TO rows are the second judgement worth checking, because
  a reader might take them as redundant beside the three RESOLVED_BY rows.

  They are not redundant, and the distinction is one the previous packets make necessary. On printed pages
  132 and 134 a procedure''s several resolvers are all rolled: a hex map gets a terrain and a danger level
  and a point of interest, and a settlement gets a type and districts and an alignment. Here exactly one
  of the three tier tables is used and the other two are not. RESOLVED_BY alone cannot say that; the graph
  would show three resolvers and imply all three are rolled.

  ALTERNATIVE_TO is defined as mutually exclusive or substitutable and is the only symmetric type, and
  the pairwise form follows the three alignment rows from printed page 27 exactly: three members, three
  rows, one shared aspect. The script derives the pairs from the tier list rather than writing them out,
  so no pair can be missed or duplicated.'
rival_crawlers_note: 'M009 is the only row that reaches outside this page and it needed the name-collision
  test run against it rather than applied by reflex.

  One cell of the interesting customer grid reads Rival crawlers. rule_rival_crawlers is canonical from
  printed pages 126 and 127 with 9 rows, and it is a generator: roll the party''s ancestry, class, alignment,
  wealth, renown, secret, tactics and name. So the result is not a description of a person, it is the
  name of a procedure the book provides, and a GM who rolls that cell runs that procedure. The table reaches
  it, which is FEEDS_INTO in the same sense the hex terrain result reaches the cataclysm table.

  The test it had to pass is the one that declined a wizard''s apprentice on printed page 125. That failed
  because class_wizard is a player class and an apprentice in an NPC''s backstory invokes nothing. The
  same reasoning declines the other 15 cells here, which describe people by ancestry and mood, a loud
  dwarf, a nervous elf, a glum halfling. Those name ancestries the graph holds and still assert nothing,
  because the table selects a customer, not an ancestry. Only the rival crawlers cell names something
  the book then tells you how to generate.'
