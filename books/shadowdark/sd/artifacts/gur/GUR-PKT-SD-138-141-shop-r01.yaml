authored_polarity_declaration: No authored polarity appears. The 9 rows are 5 RESOLVED_BY, 3 ALTERNATIVE_TO
  and 1 FEEDS_INTO, and none of those three types is among the ones constitution section 5 reserves for
  authored polarity, so assigning one is prohibited to the Analyst. Builder derives governs on the RESOLVED_BY
  rows and neutral on the rest, which the derivation table gives for both ALTERNATIVE_TO and FEEDS_INTO.
status_note: All 9 rows are core, following the disposition settled as IDQ-01 of PKT-SD-124-125. Nothing
  here declares itself optional.
