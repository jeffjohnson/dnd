rejected_candidates:
- text_locus: the 32 shop type results across the three tier tables, p138
  quoted_gist: trades and premises from a filthy bakery and a manure collector to a jeweler and a master
    blacksmith, including a moneylender, an apothecary, a scribe, two blacksmiths and used adventuring
    gear
  why_considered: Several name things the graph holds or nearly does. item_gear is canonical and two results
    sell adventuring gear; an apothecary is where potions would come from; a moneylender bears on item_coin.
  rejection_reason: 'Each result is a trade, and a trade is a description of a premises rather than a
    rule. None states a check, a price, a stock list or a consequence, so a shop selling adventuring gear
    asserts nothing about item_gear that the graph could act on. This is the reasoning that declined the
    NPC occupations on printed page 125 and the district points of interest on 135, and it applies unchanged.
    The drink ruling does not reach them: a named result earns an identity when the source gives it mechanics
    or a name to be referred to by, and a shop type is a category, not an object the book names.'
- text_locus: the Known For column of the shop generator table, p139
  quoted_gist: twenty things a shop is known for, including being a Thieves Guild front, fencing illicit
    goods, a password required to enter, free ale with a purchase, heavily armed bodyguards and being
    haunted
  why_considered: A password required to enter reads like a GATES row and accusing customers of theft
    reads like a TRIGGERS row, and both are unhedged.
  rejection_reason: Neither states what the check is, what happens on failure, or what is gated. A password
    required to enter names no identity for the password, the entry or the shop's interior, and the sentence
    is a hook for a GM to improvise rather than a rule to apply. Identical in kind to the tavern Known
    For column one page earlier, declined for the same reason and with the same wording.
- text_locus: the 15 non-rival cells of the interesting customer grid, p139
  quoted_gist: customers described by ancestry, trade and mood, including an odd wizard, a cowled mage,
    a town guard, a half-orc knight, a goblin pirate, a loud dwarf, a nervous elf and a glum halfling
  why_considered: Dwarf, elf, halfling and half-orc are canonical ancestries and wizard is a canonical
    class, so a FEEDS_INTO row from this table to sys_ancestry looked available on the axis-selection
    route.
  rejection_reason: 'The table selects a customer, not an ancestry, and only 5 of its 16 cells name one
    at all, counted by the script against the 6 canonical ancestry labels; the rest are children, a crone,
    a pickpocket, a drunk man. A table whose results are not the members of an axis does not select from
    that axis.

    The script also checked every cell against the whole registry rather than against the ancestries alone,
    so the disposition rests on a measurement. 7 of the 16 cells match a canonical label: the 5 ancestry
    cells, an odd wizard and a count of priests matching class_wizard and class_priest, and the rival
    crawlers cell. All but the last name a category a person belongs to, which is the name-collision shape
    that declined the wizard''s apprentice on printed page 125. Exactly one names a procedure, and the
    script asserts that it is the only one; it is handled as M009 and argued in rival_crawlers_note.'
- text_locus: the two dice notations inside customer cells, p139
  quoted_gist: two cells give a quantity of children and a quantity of priests rather than a single person
  why_considered: A countable group of participants is the fourth instance of a gap already recorded four
    times, and rival crawlers being one of the sixteen cells makes the grid a place where party-sized
    results matter.
  rejection_reason: The counts are magnitudes and no field may store them, and there is no participant
    identity for a character or a group to attach them to. Nothing survives. Noted here rather than as
    a new observation because the gap is already on the record from four earlier packets.
- text_locus: the two artwork pages, p140 and p141
  quoted_gist: two empty fenced Divs classed full-page-artwork
  why_considered: They sit inside the declared span and must be accounted for rather than silently skipped.
  rejection_reason: Constitution section 6 makes a page class page-local intake metadata that creates
    no node, edge, domain, general rule, citation or uncovered-page obligation. They are in the span and
    in completeness accounting and yield nothing, which is the same treatment page 19 received in PKT-SD-018-019.
non_edge_observations:
- id: OBS-01
  subject: the page-134 shop pointer is now payable and the debt is complete
  detail: 'OBS-01 of PKT-SD-134-135 recorded two unpayable pointers, taverns on printed page 136 and shops
    on 138, because neither endpoint existed. rule_taverns became canonical last packet and rule_shop
    is proposed here, so once this integrates both endpoints exist and the bounded successor to PKT-SD-134-135
    can carry both reaches at once.

    The reach still cannot be asserted from here, for the same reason as last packet: the direction is
    printed on page 134, outside this packet''s range, and citing it would put a citation outside the
    declared span. Recorded so the successor is written once rather than twice, and so that it is visible
    that the debt is now complete rather than growing.'
- id: OBS-02
  subject: the prose test was wrong and this is where it broke
  detail: 'For four packets I applied a test of my own making, that a table earns a parent only where
    prose defines the thing the tables generate. It held on printed pages 126, 130, 132, 134 and 136 because
    every one of them had prose, and it was never tested against a page that plainly has a procedure and
    no sentences. This page has 0.

    What the test was reaching for is whether the source establishes that a thing is being generated.
    Prose is the commonest evidence and it is not the only kind: three mutually exclusive tables named
    for one object are evidence, and so is a name generator for that object. Recorded as an observation
    as well as IDQ-01 because the correction matters beyond whether rule_shop survives review. The twenty-two
    encounter packets ahead are tables-only, and they will need the right test rather than this one; on
    the reading proposed here most of them will still mint nothing, because their results resolve rule_encounter,
    which is already canonical, rather than a new procedure.'
- id: OBS-03
  subject: a canonical generator is reachable from another generator for the first time
  detail: 'M009 joins the shop customer table to rule_rival_crawlers. Until now every generator in this
    chapter has been self-contained apart from links to the core rules: the site generator reaches danger
    level, the hex generator reaches the hex, the settlement generator reaches alignment and danger level.
    This is the first row in which one generator''s result sends the reader into another generator''s
    procedure.

    Recorded because it suggests the chapter is more connected than the rows so far show, and because
    it is the kind of link that is easy to miss: the source gives no page number and the connection exists
    only because both ends happen to be named the same thing. Two other results in this chapter may be
    of the same kind and were not reachable when their pages were extracted; whether any of them is worth
    a successor is a question for whoever holds both loci, not for this packet.'
unresolved_identity_questions:
- id: IDQ-01
  question: Does a procedure identity exist on a page that names and generates a thing but contains no
    prose?
  analyst_reading: 'Yes, and rule_shop is proposed on that basis with 5 rows depending on it. The source
    establishes the procedure through structure rather than sentences: three mutually exclusive tables
    named for one object, a name generator for that object, and a table asking who else is present. Out
    of scope but corroborating, printed page 134 directs the reader to roll shops here.'
  why_it_is_a_question: 'It departs from the formulation I have applied for four packets, and the contrasting
    precedent is real: printed page 124 is also tables-only and no procedure identity was minted there,
    leaving four of six tables registered with no edge. I hold that page 124 does not control, because
    its tables are attributes of an NPC rather than alternative resolvers of one object and because nothing
    in the book says to roll an NPC, but that is a distinction I am drawing and the Reviewer may not accept
    it.

    I also want it on the record that I am no longer treating my own prior generalisation as binding.
    The prose test was a summary of five pages that all happened to have prose, and applying it here would
    decline an identity the book plainly assumes exists.'
  impact_if_overturned: 'All 5 RESOLVED_BY rows fall and rule_shop is withdrawn, leaving the 3 ALTERNATIVE_TO
    rows, which stand on their own because they relate the tables to each other, and M009 to rule_rival_crawlers.
    The five tables would then be registered with three of them edgeless under DEC-2026-0003, exactly
    the printed-page-124 outcome. Nothing submitted would be false, so the overturn is a withdrawal rather
    than a correction.

    The ruling governs more than this packet. Twenty-two tables-only encounter packets follow, and although
    I expect most to mint nothing either way because their results resolve the canonical rule_encounter,
    the principle should be settled before the first of them is claimed.'
unresolved_identity_questions_note: 'One raised, and unlike the last packet the reading it questions is
  the one the rows assert. The other structural choices follow settled dispositions: the pairwise ALTERNATIVE_TO
  form from printed page 27, the core status from PKT-SD-124-125, and the name-collision test from PKT-SD-124-125
  applied in rival_crawlers_note.'
architectural_escalations: []
architectural_escalation_note: 'None raised. All 6 identities use an approved prefix, every row uses a
  legal edge type at status core, no row carries supersession_basis and none is an OVERRIDES, and no CLASSIFIED_AS
  row appears. IDQ-01 is an identity question for the Reviewer, not an architectural one: it asks how
  existing rules apply, not for a new type, field or vocabulary.'
completeness_statement: 'All four printed pages in scope were read in full at the recorded checksum: 5
  named tables, 56 data rows, 16 customer results, 2 artwork pages and 0 sentences of prose. The packet
  yields 6 new identities and 9 rows, reusing 1 canonical identity whose label the assembling script asserted
  equal to the registry. No proposed identity is left carrying no edge, which is only true because rule_shop
  is proposed; IDQ-01 records what happens if it is not.

  The rows are 5 RESOLVED_BY from rule_shop to each table, 3 pairwise ALTERNATIVE_TO rows among the tier
  tables, derived from the tier list by the script rather than written out, and one FEEDS_INTO reaching
  rule_rival_crawlers. Every row was checked against the 764 canonical edges for an assertion-key collision
  with ALTERNATIVE_TO endpoints sorted first, for a shared source, type and target under a different aspect,
  and for duplicates within the patch; there are none of any, and no canonical row cited any page in this
  span before.

  Five candidates were rejected and each is recorded with its reason. The largest deliberate loss is the
  32 shop type results, which carry no mechanics. OBS-02 records that the prose test I have used for four
  packets was wrong and why, which matters more than this packet. No assertion depends on any other ruleset.'
