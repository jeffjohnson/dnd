rejected_candidates:
  - text_locus: 'TREASURE TABLE 4-6 monetary values, pp272–273'
    quoted_gist: '3 cp, 5 cp, 1 sp, 10 gp, 12 gp, 4 gp each, 15 gp, 25 gp, 30 gp, 35 gp, 40 gp, 45 gp, 50 gp, 55 gp, 60 gp, 65 gp, 70 gp, 75 gp, 80 gp, 130 gp, 140 gp, 150 gp, 200 gp, 250 gp, 300 gp, 500 gp'
    why_considered: 'Checked for item_coin monetary relationships or price valuations.'
    rejection_reason: >-
      Monetary values and prices are numeric magnitudes prohibited from edge aspect and condition
      by Invariant 11 and Constitution section 5. They do not generate edges.
  - text_locus: 'TREASURE TABLE 4-6 mundane gear items, pp272–273'
    quoted_gist: 'shield, greatsword, javelins, warhammer, chainmail, mace, longsword, crossbow, plate mail'
    why_considered: 'Checked for table edges to canonical weapons, armor, and gear items.'
    rejection_reason: >-
      Mundane equipment items listed as loot are roll outcomes rather than definitions or modifications
      of equipment rules. Equipment definitions have their defining loci on pages 33–37 (Basic Gear, Weapons, Armor).
      Random encounter, shop, and treasure tables do not link to mundane gear outcomes unless a specific
      mechanical modification is introduced.
  - text_locus: 'TREASURE TABLE 4-6 art objects, curios, and deity mentions, pp272–273'
    quoted_gist: 'Green crystal statuette of Memnon; Crimson holy symbol of Ramlaat; delicate ancient vase of Myrkhosian make; rare incense repulsive to undead'
    why_considered: 'Checked for deity_memnon, deity_ramlaat, or special item proposals.'
    rejection_reason: >-
      The crystal statuette and holy symbol are decorative trade curios / art objects sold for coin value.
      They do not define or alter worship, spells, or rules for deity_memnon or deity_ramlaat. The incense
      repulsive to undead is flavor description without mechanical DC or range. Minting identities from
      incidental descriptive curios is prohibited.
  - text_locus: 'TREASURE TABLE 4-6 ancestry and craftsmanship descriptors, pp272–273'
    quoted_gist: 'painting of an elf woman; Goblin-made clockwork dragon doll; Suit of dwarf-made chainmail'
    why_considered: 'Checked for edges to ancestry_elf, ancestry_goblin, or ancestry_dwarf.'
    rejection_reason: >-
      Aesthetic craftsmanship descriptors and subject matter of artwork. Constitution section 2.4
      prohibits ancestry membership or property edges without mechanical rules.
  - text_locus: 'TREASURE TABLE 4-6 magic items and special loot, p273'
    quoted_gist: '2nd-tier spell scroll; Potion of Healing; 3rd-tier spell scroll; Potion of Flying; Potion of Giant Strength; Magic wand, 3rd-tier spell; Ring of Feather Falling; +2 magic armor; Kytherian Cog; +2 magic weapon'
    why_considered: 'Checked for candidate magic item nodes (item_kytherian_cog, item_ring_of_feather_falling, etc.) or edges to item_magic_item, item_spell_scroll, item_wand.'
    rejection_reason: >-
      Specific magic items, magic armor generation, magic weapon benefits, virtues, flaws, and curses
      have their defining loci in the magic item chapters (pages 276+, packets 124–130+). Individual table
      results on random treasure tables do not mint new item identities ahead of their defining loci,
      and Invariant 1 prohibits edges referencing non-existent nodes. Nor do loot tables feed into item categories;
      rather, item_magic_item and item_coin feed into rule_treasure as advancement inputs (page 117).
  - text_locus: 'TREASURE TABLE 4-6 Potion of Healing healing value, p273'
    quoted_gist: 'Potion of Healing (heals 2d6 hit points)'
    why_considered: 'Checked for edge from tbl_treasure_4_6 to rule_hit_points.'
    rejection_reason: >-
      The 2d6 hit points expression is a die expression and numeric magnitude prohibited under Invariant 11.
      Furthermore, the healing mechanic belongs to the potion item definition in packet 128 (Potions),
      not to this loot table roll entry.
  - text_locus: 'Context: Treasure overview passages, p269'
    quoted_gist: 'The treasure table the monster uses corresponds to its level... For example, a 6th-level wizard finds a treasure chest. The wizard rolls on the Treasure 4-6 table to determine whatʼs inside.'
    why_considered: 'Checked for exp_level or mstat_monster_level feeding into tbl_treasure_4_6.'
    rejection_reason: >-
      Supporting source context from packet 119 is out of scope per Scope Boundary; no row here may cite page 269.
      Both exp_level and mstat_monster_level feeding into rule_treasure are already canonical from pages 269 and 192,
      and rule_treasure is resolved by tbl_treasure_4_6 on page 272.
