source_summary: >-
  Pages 272–273 present the Treasure 4-6 section, consisting of a d100 random treasure table (TREASURE TABLE 4-6)
  containing 50 roll entries. The table determines loot carried by 4th- to 6th-level monsters or found as
  unguarded treasure by 4th- to 6th-level characters. Entries include coins, mundane and ornate gear (shield,
  necklace, marbles, greatsword, javelins, pipe, dice, flask, eyepatch, bandoleer, warhammer, ring, chainmail,
  mace, candles, crossbow, plate mail, mirror, lute), trade goods, art objects, and curios (rare spices, painting
  of elf woman, opalescent pearl, tapestry of unicorn, clockwork dragon doll, Myrkhosian vase, incense repulsive
  to undead, minotaur hoof, crystal statuette of Memnon, holy symbol of Ramlaat, chunk of meteorite, amber scarab,
  carved ivory tusk, griffon eggs), and moderate magic items (2nd-tier spell scroll, Potion of Healing, 3rd-tier
  spell scroll, Potion of Flying, Potion of Giant Strength, 3rd-tier magic wand, Ring of Feather Falling, +2 magic
  armor, Kytherian Cog, and +2 magic weapon).

