source_summary: >-
  The GOLEMS family: two introductory paragraphs describing golems as constructed beings imbued with
  rudimentary sentience through rare materials and complex rituals, followed by four stat blocks:
  Golem, Clay; Golem, Flesh; Golem, Iron; and Golem, Stone. All four carry Golem defense profiles
  (immunities and elemental healing). Golem, Clay carries Curse; Golem, Flesh carries Berserk;
  Golem, Iron carries Poison Breath; Golem, Stone carries Slow.

