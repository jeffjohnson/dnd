non_edge_observations:
  - id: OBS-01
    subject: Golem traits systematically vary damage immunities and elemental healing across material types
    detail: >-
      Clay Golem is healed by acid, Flesh Golem is healed by electricity, Iron Golem is healed by fire,
      and Stone Golem is immune to fire, cold, electricity, and non-magical sources without healing.
      These defensive profiles operate on creature defense loci under Constitution 2.5.
  - id: OBS-02
    subject: Clay Golem Curse restricts healing of slam damage
    detail: >-
      Curse on Clay Golem specifies that damage from its slam attacks can only be healed by a level 5+
      priest. This operates as a creature-specific damage rider rather than altering the general priest
      spellcasting or resting rules.
  - id: OBS-03
    subject: Golem crafting lore is narrative worldbuilding
    detail: >-
      The introductory statement that "Making a golem requires rare, expensive materials and a series of
      complicated rituals" represents worldbuilding lore rather than a player-facing crafting subsystem.

