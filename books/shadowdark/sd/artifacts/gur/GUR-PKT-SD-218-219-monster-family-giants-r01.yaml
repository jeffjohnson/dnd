non_edge_observations:
  - id: OBS-01
    subject: Elemental blood traits recur identically to Dragons
    detail: >-
      Fireblood (Giant, Fire), Frostblood (Giant, Frost), and Stormblood (Giant, Storm) provide
      immunity to fire, cold, and electricity respectively, matching the identical blood traits on
      Dragons (pp. 210–211). In both families, these operate as creature locus traits under
      Constitution 2.5.
  - id: OBS-02
    subject: Storm Giant Lightning Bolt water conditional rider operates on creature locus
    detail: >-
      Lightning Bolt on Storm Giant imposes disadvantage on targets if in water. This environmental
      rider operates directly within the monster's special attack description rather than modifying
      the general swimming or underwater combat rules.
  - id: OBS-03
    subject: Boulder throwing recurs across multiple giant types
    detail: >-
      Goat Giant, Hill Giant, and Stone Giant each possess an alternative ranged attack ("1 boulder
      (far)"), each with individual attack bonuses and damage on creature attack locus.

