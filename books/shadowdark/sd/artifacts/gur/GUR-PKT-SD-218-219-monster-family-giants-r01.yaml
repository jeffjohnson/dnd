source_summary: >-
  The GIANTS family: two introductory paragraphs describing the ancient rule of giants and their
  wars with dragons, followed by habitat summaries for seven kinds of giants and seven stat blocks
  across two pages. On page 218: Giant, Cloud carries Alert; Giant, Fire carries Fireblood. On page
  219: Giant, Frost carries Frostblood; Giant, Goat carries boulder throwing; Giant, Hill carries
  boulder throwing; Giant, Stone carries Stone Hide and boulder throwing; Giant, Storm carries
  Stormblood and Lightning Bolt. Several stat blocks include armor notations (leather, plate mail,
  chainmail, mithral chainmail).

