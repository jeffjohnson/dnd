rejected_candidates:
  - text_locus: 'the family introduction (paragraphs 1 and 2), p218'
    quoted_gist: >-
      Giants once ruled the earth long ago, warring with dragons for supremacy over the seas and
      skies. But the weariness of eons eventually caused their glorious societies to erode. Now, they
      live in reclusive clans... Hill and goat giants are brutish louts who ally with goblinkind. Fire
      giants build enclaves in volcanoes, frost giants in frozen wastes. Stone giants live deep
      underground, while cloud giants occupy lofty mountain castles. Mighty storm giants dwell in
      majestic, deep-sea strongholds.
    why_considered: 'Checked for family taxonomy, historic war mechanics with dragons, or habitat constraints.'
    rejection_reason: 'Narrative lore, ancient history, and habitat description across two paragraphs; constitution 2.4.'
  - text_locus: 'armor notations on creature stat blocks, pp218 and 219'
    quoted_gist: 'leather (Cloud, Goat, Hill), plate mail (Fire), chainmail (Frost), mithral chainmail (Storm)'
    why_considered: 'Checked against armor items in equipment registry.'
    rejection_reason: >-
      Stat-block notations explaining inherent AC values on creature loci; locus test applies,
      excluded under constitution 2.5.
  - text_locus: 'Alert (Giant, Cloud), p218'
    quoted_gist: 'ADV on checks to detect sneaking or hiding creatures.'
    why_considered: 'Names advantage and stealth detection; checked against rule_advantage and stealth rules.'
    rejection_reason: >-
      Stat-block trait on creature locus. Advantage on creature checks to detect hiding is a
      creature-specific sensory trait; locus test applies.
  - text_locus: 'Fireblood (Giant, Fire), p218'
    quoted_gist: 'Fire immune.'
    why_considered: 'Checked for fire damage immunity identity.'
    rejection_reason: >-
      Stat-block description on creature locus. Creature-specific damage immunity; constitution 2.5
      locus rule applies.
  - text_locus: 'Frostblood (Giant, Frost), p219'
    quoted_gist: 'Cold immune.'
    why_considered: 'Checked for cold damage immunity identity.'
    rejection_reason: >-
      Stat-block description on creature locus. Creature-specific damage immunity; constitution 2.5
      locus rule applies.
  - text_locus: 'Stone Hide (Giant, Stone), p219'
    quoted_gist: 'Half damage from stabbing and cutting weapons.'
    why_considered: 'Checked against weapon damage resistance mechanics.'
    rejection_reason: >-
      Stat-block defense trait on creature locus; damage halving from weapon types is a magnitude;
      locus test applies.
  - text_locus: 'Stormblood (Giant, Storm), p219'
    quoted_gist: 'Electricity immune.'
    why_considered: 'Checked for electricity damage immunity identity.'
    rejection_reason: >-
      Stat-block description on creature locus. Creature-specific damage immunity; constitution 2.5
      locus rule applies.
  - text_locus: 'Lightning Bolt (Giant, Storm), p219'
    quoted_gist: >-
      3/day, 5′ wide line extending far from giant. All creatures in line DC 15 DEX or 5d10 damage.
      DISADV on check if in water.
    why_considered: 'Mentions disadvantage conditional on being in water; checked for water environmental edge.'
    rejection_reason: >-
      Stat-block attack description on creature locus. Conditional disadvantage in water, 3/day
