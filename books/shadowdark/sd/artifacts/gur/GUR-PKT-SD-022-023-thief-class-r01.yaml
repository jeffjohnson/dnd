  Ten rows carry authored polarity, all with basis read: M001 CONSTRAINS governs, and M005, M007,
  M009, M010, M011, M012, M013 and M014 MODIFIES improves. Each is among the three types constitution
  section 5 requires to carry source-reviewed authored polarity, and each was read aloud as source
  polarity target before being recorded. No row uses basis heuristic or unset. No other row carries a
  polarity or polarity_basis value: the two GATES rows, the two FEEDS_INTO rows and the one
  RESOLVED_BY row take their derived polarity from the section 5 table and the Analyst authors none
  of them.

