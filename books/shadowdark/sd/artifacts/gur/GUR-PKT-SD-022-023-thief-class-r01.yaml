page_attribution_basis: >-
  Two markers resolve in the Primary Source Material, both through the Pandoc AST rather than
  positionally. {#p22} ends the THIEF CLASS heading, which placement rule 1 applies to the whole
  heading, and the persistence rule carries page 22 through the benefits, the five-item trained-task
  list and every row of the talents table. Page 23 is an empty fenced Div carrying the artwork class.
  Every row below therefore cites page 22. A third page the parser resolves, 15, lies entirely inside
  the out-of-scope Supporting Source Context.

page_class_treatment: >-
  Page 23 is classified full-page-artwork by the repository source steward. Under SOURCE_MARKDOWN 1.8
  and constitution section 6 the class is page-local intake metadata and creates no node, edge,
  domain, general rule, citation or uncovered-page obligation, and a classified page inside a
  declared span is not an uncovered page. It is retained in the completeness accounting below. The
  AST confirms the Div is empty and that page 22 does not inherit the classification.

scope_boundary: >-
  The bounded scope is the Primary Source Material section, printed pages 22 and 23. The trailing
  Supporting Source Context reproduces printed page 15, whose primary packet is
  PKT-SD-015-015-stats-and-stat-modifiers, outside this packet's declared span. No assertion here is
  drawn from it and no row cites page 15.

source_summary: >-
  Printed page 22 is the complete thief class entry: a heading, a flavour sentence, three attribute
  lines giving permitted weapons, permitted armor and a hit point die per level, two separately named
  benefits of which one lists five trained tasks, and a five-row rollable talents table. Page 23 is
  artwork. This summary is orientation only; every assertion below cites page 22.

graph_state_at_extraction: >-
  The Shadowdark canonical graph is still empty; nodes.csv is header-only, the domain registry has no
  domains, general_rules.json is an empty object, and character_races.yaml is inactive. The three
  supplied slices named in the packet manifest as missing remain immaterial, re-assessed here rather
  than carried over from claim. reused_nodes is empty. Ten of the fifteen identities below are
  already proposed by sibling GURs from their defining loci and are marked as such.

cross_packet_identity_note: >-
  item_armor, rule_hit_points, cbt_damage_roll, cbt_attack_roll, exp_level, rule_check,
  rule_talent_roll, abil_strength, abil_dexterity and abil_charisma are proposed by sibling GURs from
  their defining loci and are proposed again here because this patch uses them as edge endpoints. A
  GUR must propose every endpoint its edges use: an endpoint present only in a sibling GUR is not
  canonical, is not proposed by the patch, and fails invariant 1 as endpoint_unresolved. Proposing
  them is not a competing naming; each records its defining locus and the sibling GUR that also
  proposes it, and each ID and label is reproduced exactly.

