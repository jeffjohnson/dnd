      A class is chosen at creation and its permissions and benefits are received then. Recorded as a
      candidate only; now suggested by a fifth packet, which is noted and deliberately not treated as
      promotion. Constitution section 8 reserves promotion to an Architect Decision.
  - proposed: combat
