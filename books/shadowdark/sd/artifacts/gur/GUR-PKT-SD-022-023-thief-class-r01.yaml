    not_applied: 'Recorded as a candidate only, with one class entry still unread. No edge sets general_rule_id.'

non_edge_observations:
  - id: OBS-01
    subject: two specific armors are named and not proposed
    detail: >-
      The Armor line names leather armor and mithral chainmail. Unlike the fighter's All armor and
      the priest's All armor and shields, this is an enumerated permission naming two specific items,
      and mithral chainmail in particular is a distinctive identity. Neither is proposed. The Armor
      section on printed page 284 and the Gear section on printed page 34 are the defining loci, and
      SOURCE_MARKDOWN Source Identity Authority names a permission list as exactly the kind of
      secondary listing that cannot name a concept defined elsewhere. M001 asserts the constraint
      against the armor category, which is the assertion this page supports without minting two item
      identities from a class entry. The same reasoning covers the five named weapons.
  - id: OBS-02
    subject: the five trained tasks are not proposed as identities
    detail: >-
      Thievery lists climbing, sneaking and hiding, applying disguises, finding and disabling traps,
      and delicate tasks such as picking pockets and opening locks. These are recognisable adventuring
      activities and several have their own chapters later in the book, notably Stealth and Surprise
      and Traps. None is proposed here. The list is a scope statement for one class benefit, not a
      set of defining entries, and minting five identities from it would fix an ontology for
      exploration activities from a class entry. M007 carries the benefit's effect with the task
      scoping in its condition.
      Traps in particular should be expected to recur: the contents list places Traps on printed page
      114, and a later packet asserting that Thievery helps against traps would be asserting it from
      the right locus.
  - id: OBS-03
    subject: advantage remains the unextracted mechanism, now behind two rows
    detail: >-
      Thievery grants advantage on associated checks and a talents row grants advantage on initiative
      rolls. As with Stout, Grit and the priest's casting talent, M007 and M009 assert the effect
      rather than the mechanism, because printed page 9 defines advantage without relating it to any
      other named mechanic. This is now the fifth packet to depend on advantage. Rolling the Dice on
      printed page 78 is the defining locus and the dependency is accumulating steadily.
  - id: OBS-04
    subject: the initiative talent carries a reroll instruction about the talent roll itself
    detail: >-
      The initiative row reads in full: gain advantage on initiative rolls, reroll if duplicate. The
      reroll clause is an instruction about rolling on this talents table, not about initiative: it
      prevents receiving the same talent twice. It is not extracted as an edge because it would be a
      self-referential row about the table's own use, and because the source states it as a
      parenthetical procedure rather than a dependency between two mechanics. M009 carries only the
      initiative effect. Recorded so the partial extraction of that row is visibly deliberate.
  - id: OBS-05
    subject: the tools of the trade are a granted item with a gear-slot statement
    detail: >-
      Thievery adds that the thief has the necessary tools secreted on their person and that they
      take up no gear slots. This is structurally identical to the priest's holy symbol and is
      deferred for the same reason: no item identity exists, this entry is not its defining locus,
      and the gear-slot exemption needs that identity as its source to be expressible. The Gear
      section is the locus that can supply it. Two class entries now carry this shape, which is worth
      Reviewer's attention when the gear packet is read.
  - id: OBS-06
    subject: the final talents row is again a choice with no fixed target
    detail: >-
      The highest outcome row reads Choose a talent or points to distribute to stats, identical in
      shape to the fighter's and the priest's. Neither branch names a determinate target, so no edge
      can be drawn without the Analyst choosing one. Not extracted, for the reason recorded in the
      fighter GUR. Three class entries have now repeated this row verbatim, which is itself evidence
      that it is a standard closing row rather than a class-specific effect.
  - id: OBS-07
    subject: flavour carries no mechanics
    detail: >-
      The entry opens with a sentence about rooftop assassins, con artists and cat burglars plucking
      a gem from a sleeping demon. It establishes tone, names no mechanic and states no dependency.
      The demon it mentions is narrative, not a monster identity.
  - id: OBS-08
    subject: magnitudes deliberately excluded
    detail: >-
      The page carries the hit point die, the extra weapon die and the level fraction with its
      rounding in Backstab, the talents table's die expression and all five row ranges, the added
      Backstab dice, the stat increase, the attack bonus and the distributable points. All are die
      expressions, numeric bonuses or thresholds, excluded by constitution section 1 and invariant
      11. They remain in the immutable claimed packet. No aspect in this GUR contains a digit and no
      condition encodes a numeric value.

unresolved_identity_questions:
  - id: IDQ-01
    subject: whether Backstab targets the damage roll or a weapon die
    detail: >-
      M005 targets cbt_damage_roll. The source says Backstab deals an extra weapon die of damage,
      which names the die rather than the roll. Whether a weapon die is a separate mechanic from the
      damage roll cannot be settled here: no weapon identity exists in this packet, and the Combat
      chapter on printed page 88 defines how damage is rolled.
      Consequence if wrong: if a weapon die is a distinct mechanic, M005 repoints from the damage
      roll to it and the assertion becomes more precise; nothing else changes. The Analyst targeted
      the damage roll because that is the mechanic the extra die demonstrably affects and because the
      alternative would require minting an identity from a phrase inside a benefit. This also bears
      on IDQ-01 in the introduction packet, which asked whether damage and the damage roll are one
      identity; three packets now touch that question and the Combat packet will settle it.
  - id: IDQ-02
    subject: cbt_initiative is minted from a single talents row
    detail: >-
      Initiative is named once on this page, in a talents row, and is defined nowhere in this packet.
      The contents list places Turn Order on printed page 83, which is its defining locus. The node
      is proposed only because M009 needs an endpoint and a GUR must propose every endpoint its edges
      use.
      Consequence if wrong: the Turn Order chapter may name the mechanic differently, for example as
      part of a turn-order procedure rather than a roll, in which case M009 repoints. Reviewer should
      de-duplicate against that packet when it is read and should treat this stem as provisional.

architectural_escalations: []
architectural_escalation_note: >-
  None raised. Every proposed node uses an approved constitution section 2 prefix with an unchanged
  kind, every edge uses one of the thirteen legal section 3 types, and no new prefix, edge type,
  domain promotion or general-rule application is requested. ESCALATION_CONTRACT states that a
  proposed node under an approved prefix and kind which passes identity and duplicate checks is
  ordinary GUR, GUP and Review work rather than an escalation. IDQ-01 and IDQ-02 are recorded for
  Reviewer on that basis, and the deferrals in OBS-01 through OBS-05 resolve when the relevant
  defining packets are claimed.

completeness_statement: >-
  Both printed pages in the declared span are accounted for. Page 22 was read in full: the THIEF
  CLASS heading, the flavour sentence in OBS-07, the Weapons line in OBS-01, the Armor line supplying
  M001 with its two named armors also in OBS-01, the Hit Points line supplying M002, the Backstab
  benefit supplying M005 and M006, the Thievery benefit supplying M007 with its tools in OBS-05 and
  all five trained tasks in OBS-02, the THIEF TALENTS TABLE heading and column headers supplying
  M008, and all five talents rows of which four supply M009 through M014, with the initiative row's
  reroll clause in OBS-04 and the fifth row in OBS-06. Page 23 is the steward's full-page-artwork
  page. Every page marker was resolved through the Pandoc AST and the in-scope resolved page set
  matches the declared span with no gap. The Supporting Source Context reproducing printed page 15 is
  out of scope and contributed nothing. Fourteen edges are proposed across fifteen candidate nodes,
  ten of which are also proposed by sibling GURs from their defining loci and are marked as such. No
  node is reused because the Shadowdark graph is empty. Content not converted to an edge is accounted
  for in OBS-01 through OBS-08, and every identity the Analyst could not settle is recorded in IDQ-01
  and IDQ-02 rather than resolved by picking a plausible ID. No assertion depends on any other
  ruleset.
