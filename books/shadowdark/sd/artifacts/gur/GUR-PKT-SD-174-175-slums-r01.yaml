rejected_candidates:
- text_locus: the spell scroll in the hundredth slot, p175
  quoted_gist: a soiled parchment flutters to the ground; it is a spell scroll
  why_considered: This is the first cell in the chapter to satisfy both elements of the treasure test
    and still earn nothing, so it deserves a full account. The category is named exactly, spell scroll
    against the canonical label Spell Scroll, which is closer than the market cell that said only scroll.
    Availability is stated outright, since the parchment flutters to the ground in front of the characters.
    Both elements the Integrator settled as jointly necessary are present.
  rejection_reason: 'There is no correctly typed target, and I enumerated rather than assumed. item_spell_scroll
    carries 3 canonical rows and all of them are about casting and expenditure: learning spells consumes
    it at printed page 24, it is resolved by the spellcasting check at 49, and the spellcasting check
    consumes it at 49. 0 of them reach rule_treasure. So the routing that carries every other treasure
    row in this chapter, through a category the graph already feeds to Treasure, is unavailable, and item_coin
    FEEDS_INTO rule_treasure exists where the scroll equivalent does not. A direct row from a table to
    an item would mistype the relation, as it would have for the magic item cells. Recorded as OBS-01,
    because this vindicates the third ground of the market decline as load-bearing rather than redundant.'
- text_locus: the crone's love potions, p174
  quoted_gist: a rangy crone sells love potions, given in parentheses as polymorph to newt, with the spell
    name italicised
  why_considered: This is the closest spell call since the page-158 ward. The spell name is italicised
    in the source, which is this book's reference convention and is exactly what made the Web row assertable,
    and spell_polymorph is canonical with 4 rows.
  rejection_reason: The occurrence-versus-effect split settled at printed page 158 and affirmed twice
    since. There a malfunctioning ward casts Web on the characters, so a casting is stated and the row
    records it. Here a crone has potions for sale and the parenthetical identifies what they would do;
    nobody drinks one, nobody is polymorphed, and no casting occurs in the cell. The italics make the
    reference real, which is why this is closer than the jungle sleep flowers, and the reference is to
    stock rather than to an event. Canonical holds 1 TRIGGERS row into a spell and it is the Web row;
    this would have been the second and it is not earned.
- text_locus: the potion in the flagstone cache and the uncorked vial, pp175 and 174
  quoted_gist: the box under the flagstone also holds a potion, and a halfling at a well glances around
    and uncorks a vial
  why_considered: Potions recur across the chapter, here and in the cave orc mystic's two beneficial potions,
    and the crone's love potions on this same page.
  rejection_reason: There is no potion identity in the registry and none may be minted from an encounter
    cell; the magic item chapter that would define one is unclaimed. The coins in the same box carry the
    row on their own, so nothing is lost here that the potion would have added. The uncorked vial states
    no content and no effect at all.
- text_locus: the safe shelter and the offered spell, pp175 and 175
  quoted_gist: a bent, old woman offers safe shelter inside from ruffians, and a goblin mage lurking on
    a roof offers a spell for a favor
  why_considered: rule_resting is canonical and constrained by danger level, and a spell offered for a
    favour names the thing the whole spell system turns on.
  rejection_reason: 'Safe shelter names no rest, no duration and no danger level, which is the same disposition
    applied to the forest chapel on printed page 155. The offered spell names no spell: there is no identity
    for a spell in general, only for each named one, and the cell names none. Both are offers rather than
    events, which is the same reason the three healing offers were declined.'
- text_locus: the creature and street results, pp174 and 175
  quoted_gist: giant centipedes, giant dung beetles in three cells, street goons, City Watch, thugs, a
    goblin mage, a crone, ruffians and the Wandering Merchant
  why_considered: The dung beetle recurs three times including a cell where the Wandering Merchant pays
    a stated price per beetle, which is the closest this chapter comes to a price list.
  rejection_reason: A creature's defining locus is its stat block in the unextracted monster chapter and
    the registry holds no monster_ identity. A stated price is a magnitude. Sixteenth packet running for
    the same disposition.
- text_locus: the two-encounter instruction, p175
  quoted_gist: one result instructs the reader to roll twice more and combine the results, rerolling that
    result if it comes up again
  why_considered: It is the only instruction on the page, and the stem scan flags it as matching rule_encounter.
  rejection_reason: The match is on the plain word encounters in the instruction's own text; M001 already
    carries the table's relation to rule_encounter. Declined in the same form in each of the sixteen preceding
    chapter packets.
- text_locus: the appended random encounter procedure and monster attributes, out of scope
  quoted_gist: the printed page 112 and 113 encounter procedure and the printed page 189 monster attributes
    page
  why_considered: Both are in the file and the first is the rule this table resolves.
  rejection_reason: Both are Supporting Source Context, outside the bounded scope. PKT-SD-112-113 is already
    integrated, so extracting from it would duplicate canonical rows and cite pages outside this packet's
    range.
non_edge_observations:
- id: OBS-01
  subject: the treasure test passes and the row still cannot be written
  detail: 'The hundredth row is a soiled parchment that flutters to the ground and turns out to be a spell
    scroll. It names the canonical category exactly and states availability, which are the two elements
    the Integrator settled as jointly necessary, and it earns no row.

    What is missing is a target. Every treasure row in this chapter is routed through rule_treasure because
    the named category already feeds it: item_magic_item on xp source and item_coin on monetary value,
    both from printed page 117. item_spell_scroll carries 3 rows and 0 of them reach Treasure; they are
    all about casting and expenditure. A direct table-to-item row would mistype the relation.

    Recorded because it vindicates something I could not previously show. When I declined the market scroll
    I gave three grounds and the third, that the category has no path to Treasure, looked like belt and
    braces beside the first two. Here the first two are satisfied and the third alone refuses the row,
    so it was load-bearing all along. It also identifies a real gap rather than a defect: the treasure
    chapter on printed pages 118 to 123 is unclaimed, and if it gives spell scrolls a value then a successor
    to this packet becomes available.'
- id: OBS-02
  subject: the closest spell call since the ward, and it is declined
  detail: 'A rangy crone sells love potions, and the parenthetical identifies them as polymorph to newt
    with the spell name italicised. That is the same reference convention that made the page-158 Web row
    assertable, and it is a stronger signal than the jungle sleep flowers, which named no spell at all.

    It is still declined, on the occurrence-versus-effect split. The ward casts Web on the characters
    and a casting is stated; the crone has stock and the parenthetical says what it would do to someone
    who drank it. Nobody drinks, nobody is polymorphed.

    Recorded because the spell reach has now been tested three times, once permissively and twice restrictively,
    and each refusal turned on the same question rather than on how spell-like the cell reads. The italics
    are evidence that a spell is referred to; they are not evidence that one is cast.'
- id: OBS-03
  subject: a fourth wording for the rival crawler reach
  detail: 'The cell reads a rival crawling group warily prods at a bricked-up door. The three wordings
    seen before are rival crawlers, a rival crawler singular, and a rival crawling party. Neither scan
    recovers this one, for the same reason as the party form: the canonical label is Rival Crawlers and
    both scans require every word.

    The rival stem search catches it, as it caught the party form, and on this page it returns exactly
    one cell with no noise, unlike printed page 163 where it returned three of which two were rival gangs
    and rival dog fighters. Recorded because four wordings in seventeen packets is now enough to say that
    this particular reach is found by the stem search and not by the scans, and a later Analyst should
    run it rather than trusting the measurement.'
