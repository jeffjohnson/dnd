  rather than searched from memory, following the omission recorded at printed page 171. The item_ identities
  in the registry at extraction are: item_aged_royal_wine, item_armor, item_autumn_mead, item_backpack,
  item_barnacle_grog, item_caltrops, item_campfire, item_chainmail, item_clear_spirits, item_coin, item_crowbar,
  item_dwarvish_gold_ale, item_elvish_brandy, item_gear, item_halfling_summer_wine, item_house_ale, item_lantern,
  item_leather_armor, item_magic_item, item_mithral, item_oil_flask, item_plate_mail, item_rations, item_shield,
  item_spell_scroll, item_stale_ale, item_torch, item_van_dinkle_whiskey, item_vinegary_wine, item_wand,
  item_watered_down_swill. item_spell_scroll carries 3 canonical rows, none reaching rule_treasure, and
  rule_treasure carries 9 inbound rows of which the ones from a category are item_magic_item and item_coin.'
measured_figures_note: 'Figures quoted in this artifact''s prose are computed by the building script from
  the claimed source and the canonical files, and the finished document is checked for unsubstituted format
  specifiers before it is written. Located cells: the rival crawling group at index 36, the flagstone
  cache at 45, the spell scroll at 49, the love potions at 21 and the safe shelter at 44, of 50 rows.
  Canonical counts at extraction: 18 resolvers on rule_encounter, 15 inbound on rule_rival_crawlers, 9
