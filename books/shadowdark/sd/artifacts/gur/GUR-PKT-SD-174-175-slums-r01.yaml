completeness_statement: 'Both printed pages in scope were read in full at the recorded checksum: 1 named
  table, 50 data rows, 0 sentences of prose. The packet yields 1 new identity and 3 rows, reusing 3 canonical
  identities whose labels the building script asserted equal to the registry. The proposed table carries
  edges, so nothing is left unattached.

  Every row was checked against the 827 canonical edges for an assertion-key collision, for a shared source,
  type and target under a different aspect, and for duplicates within the patch; there are none of any,
  and no canonical row cited either page before. The script locates the supporting cell for each row and
  asserts its page, which matters because the page break falls inside the table.

  7 candidates were rejected and each is recorded with its reason. The largest deliberate loss is the
  creature and scene content, which belongs to the unextracted monster chapter or states no mechanic at
  all. 7 of the 14 apparent registry references in the cells are spurious collisions with ordinary English,
  measured rather than filtered by eye. No assertion depends on any other ruleset.'
treasure_reach_note: 'M003 rests on row index 45 of 50: a loose flagstone conceals a box with a stated
  number of gold pieces and a potion. Both elements of the settled test are present and the second is
  worth spelling out.

  The category is coins, and the cell names them in the book''s currency notation rather than by the registry
  label Coin. That is the abbreviation blind spot recorded at printed page 167 for Madeera, appearing
  here on a category that matters: neither scan matches, and the mention is real. Gold pieces are what
  item_coin is, and item_coin FEEDS_INTO rule_treasure on monetary value from printed page 117, so the
  routing exists, 1 row.

  Acquisition is stated on the availability limb the Integrator confirmed: the box is concealed under
  a loose flagstone and is there to be found, which is the same position as the half-buried chest on printed
  page 171 and the dead crawler''s body on 173, and the opposite of the dragon sleeping on its hoard.

  The stated number of coins is a magnitude and is not stored. The potion in the same box has no identity
  and adds nothing to the row.'
