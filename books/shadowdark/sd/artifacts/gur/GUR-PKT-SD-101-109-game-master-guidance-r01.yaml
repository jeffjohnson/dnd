rejected_candidates:
- text_locus: THE ONLY RULE, p102
  quoted_gist: '''The Only Rule is that you make the rules'', that the book is a guide rather than a constraint,
    and that none of it takes precedence over the GM''s judgment'
  why_considered: This is the most tempting candidate in the packet and the one I spent longest on. It
    is phrased as a rule, it is given its own heading, and it states a precedence relation in so many
    words. Constitution section 7 has an OVERRIDES type with an explicit_replacement basis that appears
    built for exactly this shape, and a row saying GM judgment overrides the rules would be a genuinely
    useful thing for a reader to find.
  rejection_reason: 'There is no identity for GM judgment and minting one is not an Analyst act, nor would
    it be right here: judgment is not a Shadowdark mechanic, it is the absence of one. The deeper problem
    is that the statement is unbounded. OVERRIDES in this graph relates two named things, and this sentence
    sets nothing against nothing in particular; it qualifies the entire ruleset at once. A row from it
    would either need every rule as its target or would silently pick one, and both are wrong. Recorded
    as OBS-01 because it is a real property of this ruleset that the graph cannot express.'
- text_locus: SETTING DCS, p107
  quoted_gist: '''The four standard DCs of easy (9), normal (12), hard (15), and extreme (18) are universal'',
    with advice to take the creature into account and to state the check type aloud'
  why_considered: Four named difficulty tiers used by name throughout the book, in the learning rule on
    printed page 91, in the example of play and in the spell chapter. rule_difficulty_class is canonical,
    so tier identities would have an obvious aggregate to classify to, and the DEC-2026-0103 spell tiers
    are a precedent for minting exactly that shape.
  rejection_reason: 'This is not their defining locus and they are not mine to mint. I read the earlier
    page directly rather than assuming: printed page 79, inside the already-integrated PKT-SD-078-081,
    carries the section THE FOUR STANDARD DCS which names all four, gives each its value and an example.
    That is the defining locus and its extraction chose not to mint tier identities. Minting them here
    would put them at the wrong page and silently reverse a judgement another packet already made.

    The precedent also runs the other way from what it first appears. The spell tiers were minted under
    an Architect Decision and because each carries classification relations to spells; the DC tiers carry
    only a number, which is the same reasoning that declined the danger levels in PKT-SD-090-090 and the
    travel methods in the same packet. The remaining content here, taking the creature into account and
    stating the check type aloud, is table procedure.'
- text_locus: STAT CHECKS core principle, p104
  quoted_gist: '''The characters automatically succeed at what they are trained to do. Only use stat checks
    when there is time pressure and failure has dire consequences.'''
  why_considered: A genuine constraint on when rule_check applies, which is canonical, and phrased prescriptively
    rather than as advice.
  rejection_reason: 'Restatement, and its defining locus turns out to be unextracted rather than extracted.
    I read printed page 81 in the claimed PKT-SD-078-081 source: the section WHEN TO ROLL? states ''Usually,
    you succeed at what you''re trained to do without needing to roll a check'' and gives examples. That
    is where the rule lives.

    No canonical row carries it, which makes this a gap in that packet rather than an opportunity here.
    Asserting it from page 104 would attach the rule to the GM advice chapter instead of to the checks
    chapter that states it. Recorded as CF-01 so the gap is repaired at its own locus.'
- text_locus: ACTION ECONOMY core principle, p104
  quoted_gist: '''PCs get just one action per turn. Make it count. Use multitasking (pg. 88) for boring
    small stuff.'''
  why_considered: Two statements in one principle, one a rule and one a pointer.
  rejection_reason: Partially rejected. The one-action-per-turn half is a restatement of printed page
    8, already canonical as rule_turn GATES rule_action with aspect action timing, and is not asserted.
    The pointer half is asserted as M001, because the page's own act is to direct the reader to another
    canonical rule, which the incidental-locus test admits. Recorded here so the split is visible rather
    than looking like a partial reading.
- text_locus: DISTANCE core principle, p104
  quoted_gist: close, near and far are loose and do not require precise measurement
  why_considered: rule_distance is canonical and this states a property of it.
  rejection_reason: Its defining locus is printed page 85, where rule_distance CONSTRAINS ex_movement
    with aspect distance bands is already canonical. The statement here adds only that the bands are imprecise,
    which is guidance about how to adjudicate them rather than a relation to anything.
- text_locus: TIME, DARKNESS, GEAR, INFORMATION, DANGER and REWARDING INVESTMENT core principles, p104
  quoted_gist: 'six of the nine principles: time must haunt every decision, the darkness is the true foe,
    gear is precious and limited, dispense information freely, casting spells is risky and monsters are
    insidious, honour what has been earned'
  why_considered: Each names concepts the graph holds, including darkness, gear, spellcasting risk, languages
    and titles, and the section is headed CORE ETHOS as though stating foundations.
  rejection_reason: They are design principles addressed to the GM, not mechanics. None states a relation
    between two things; each states an attitude to take toward a thing. 'Respect the darkness' names rule_total_darkness
    but asserts nothing about it that a row could carry, and 'if a character learns a new language, make
    it matter' is an instruction to the GM rather than a relation between rule_learning and a language.
    Constitution section 8 makes source-supported dependency the test, and an exhortation supports no
    dependency.
- text_locus: NEUTRAL ARBITER, p108
  quoted_gist: 'four mechanics that tempt players into risk: random encounters with a pointer to Reaction
    Check on page 113, light timers, resource management through gear slots, and XP'
  why_considered: All four name canonical identities, rule_encounter, rule_light_source, rule_gear_capacity
    and exp_xp, and the passage groups them as a set with a shared function, which is close to a real
    claim about the ruleset.
  rejection_reason: The grouping is rhetorical. The passage says these four tempt players, which is a
    statement about play psychology rather than a mechanical relation between them; there is no identity
    for temptation and inventing one would be the general-taxonomy widening the constitution refuses.
    Each underlying mechanic is already canonical from its own page. The one genuinely new thing, the
    Reaction Check on printed page 113, is a forward reference to an unextracted chapter and cannot be
    asserted without pre-empting that packet's defining locus.
- text_locus: CHARACTER DEATH, p108
  quoted_gist: deaths happen especially among 0-level adventurers, and a parenthetical asking whether
    the player remembered to add their Constitution modifier to the death timer
  why_considered: exp_level_zero, abil_constitution, rule_dying and rule_death are all canonical, and
    the death timer relation is named explicitly.
  rejection_reason: Restatement of printed page 89, where abil_constitution FEEDS_INTO rule_dying with
    aspect death timer is already canonical, verified rather than assumed. The 0-level remark is an observation
    about frequency, not a rule; nothing in the book makes death more likely for 0-level characters by
    rule, they simply have fewer hit points.
- text_locus: ADVENTURE HOOKS, THE AUDIENCE and DRAMATIC QUESTION, p103
  quoted_gist: player motivations are reward, heroism and discovery, powerful hooks contain all three,
    the players rather than the characters are the audience, and each encounter has a dramatic question
    that ends it once answered
  why_considered: Reward is defined partly in terms of treasure and XP, both canonical, and the three
    motivations are presented as an enumerated closed set, which resembles a classified vocabulary.
  rejection_reason: 'These classify players, not game elements. Constitution section 2.4 confines CLASSIFIED_AS
    to source-declared classifications that are direct inputs to a named mechanic, and nothing here is
    an input to anything: no rule reads a player''s motivation. The dramatic question is a pacing heuristic
    with no mechanical trigger.'
- text_locus: ON BALANCE, p105
  quoted_gist: typical treasure on page 117 and average monster build on page 192 are calibrations rather
    than goals, plus advice to telegraph danger and make choices meaningful
  why_considered: Two explicit forward page references to chapters with real mechanical content.
  rejection_reason: Both targets are in unextracted chapters with no canonical identity, so neither reference
    can be carried without proposing an identity whose defining locus belongs to another packet. This
    is the same reasoning that left the Wizards and Thieves reference unasserted in PKT-SD-091-093, and
    it resolved correctly there once the target page was extracted. The remaining advice is about encounter
    design.
- text_locus: RUNNING THE GAME, p106
  quoted_gist: definitions of an adventure and a campaign, advice on NPCs with pointers to pages 124 and
    126, and THE MUNDANE on keeping basic gear meaningful
  why_considered: Adventure and campaign are defined in so many words, which is the shape of an identity
    definition, and NPCs are called rich sources of quests, treasure and danger.
  rejection_reason: 'They are structural vocabulary for describing play, not mechanics: nothing in the
    ruleset reads whether the characters are in an adventure or a campaign, no check turns on it and no
    value derives from it. An identity that participates in no relation answers no query. The NPC pointers
    are forward references to unextracted pages, and the absence of any NPC identity is the standing gap
    recorded as OBS-03 of PKT-SD-091-093.'
- text_locus: CHALLENGE VARIETY, p107
  quoted_gist: '''Each class excels at different tasks. Thieves love to scout and talk to NPCs, fighters
    and priests shine in combat, and wizards dominate the environment.'''
  why_considered: Four canonical class identities are each paired with a kind of challenge, which reads
    like four statements about class strengths.
  rejection_reason: It is a characterisation of how the classes tend to play, not a rule granting any
    of them anything. No class gains a bonus to scouting or to combat from this sentence, and the actual
    class abilities are canonical already from the class chapter. Asserting it would put a preference
    into the graph with the same standing as a mechanic, and would imply for instance that a thief is
    worse in combat, which no rule states.
- text_locus: RULES VS RULINGS and CHARACTER SKILL VS PLAYER SKILL, p107
  quoted_gist: stat checks and the standard DCs can resolve any action and nothing more is needed; players
    themselves improve with experience and should be given decisions that rely on wits rather than dice
  why_considered: The first sentence makes a strong claim about rule_check and rule_difficulty_class jointly
    being sufficient for any action, which is close to a completeness property of the two mechanics.
  rejection_reason: It is advice about how much of the book to consult mid-session, addressed to the GM.
    Read as a mechanical claim it would be false, since attack rolls and spellcasting checks are neither
    stat checks nor DCs, so treating it as a row would put a wrong statement into the graph. Player skill
    is not a game quantity.
- text_locus: THE PACT, p102, and SET THE TONE, p109
  quoted_gist: the unspoken agreement of goodwill between GM and players, and advice on choosing an environment,
    a magic level and a theme, on session zero and on starting small
  why_considered: SET THE TONE includes a question about whether priests can use healing spells, which
    touches class_priest and canonical healing spells, and mentions restricting alignment, which touches
    the canonical alignment identities.
  rejection_reason: 'Both are setting-construction advice, and the mechanical touches are hypothetical
    rather than stated: the text asks the GM to decide whether priests heal in their world, which is the
    opposite of the book stating that they do or do not. Asserting a conditional the GM is invited to
    resolve either way would record a rule the book declines to make. The Pact is a social agreement with
    no mechanical content.'
- text_locus: the part opener and its epigraph, p101, and the address to the GM, p102
  quoted_gist: '''At times, the Shadowdark seemed sentient in its malevolence'', and the passage describing
    the GM as world-spinner, storm, army and gods'
  why_considered: Completeness. Every page in the span was read and dispositioned, including the ones
    that plainly carry nothing.
  rejection_reason: Fiction and rhetoric. No game concept is named in a mechanical sense and no relation
    is stated.
carried_forward_findings:
- id: CF-01
  subject: the WHEN TO ROLL rule has a defining locus and no canonical row
  detail: 'Found while checking whether the STAT CHECKS principle on printed page 104 was a restatement,
    and reported rather than left. It is a restatement, and the rule it restates is not in the graph.

    Printed page 81, inside the integrated PKT-SD-078-081, carries the section WHEN TO ROLL?, which states
    that a character usually succeeds at what they are trained to do without rolling, and gives a wizard
    reading runes and a thief finding a trap as examples. I read that source directly. Thirteen canonical
    rows cite printed pages 78 to 81 and none of them carries this rule; rule_check receives the six stat
    inputs, advantage, disadvantage, the luck token and the contested check, but nothing bounding when
    it is called for at all.

    That is a real gap: the graph currently implies a check is always available, when the source''s own
    position is that a check is the exception. Repairing it needs a successor GUR for PKT-SD-078-081,
    not a row here, because page 81 is that packet''s bounded scope and page 104 only restates it.'
- id: CF-02
  subject: rule_d6_decider's defining locus produced no rows and names the torch explicitly
  detail: 'Recorded because it bears directly on the correction applied to the previous packet. rule_d6_decider
    entered canonical with degree zero, and the Reviewer of PKT-SD-096-100 was right that the example
    of play''s torch roll invokes it.

    Reading printed page 78 confirms the overturn more strongly than the Review argued. The THE D6 DECIDER
    section states that where there is a random chance for an outcome the GM calls for a d6, and the example
    it gives is whether a dropped torch goes out. So the torch is named at the procedure''s own defining
    locus, and the row now in production is supported there as well as at page 98.

    The gap is that printed page 78 produced no row for this procedure at all when PKT-SD-078-081 was
    extracted, which is why the identity sat at degree zero. Like CF-01, repairing that belongs to a successor
    for that packet. Both findings concern the same integrated packet, so one successor could carry both.'
non_edge_observations:
- id: OBS-01
  subject: The Only Rule is a property of the ruleset the graph cannot hold
  detail: 'Worth stating plainly because it is the single most important sentence in the chapter and the
    graph will not show it. The book says the GM makes the rules, that its contents are a guide rather
    than a constraint, and that nothing in it takes precedence over the GM''s judgement.

    Every row the intake has produced is therefore defeasible in play, and the graph cannot express that,
    because an OVERRIDES row needs two named endpoints and this qualifies the whole ruleset at once. A
    reader should not infer from the graph''s confident structure that Shadowdark is a rules-tight system;
    it says of itself that it is not. Recorded for the Architect as a documentation matter rather than
    escalated, since no row, identity or type would fix it.'
- id: OBS-02
  subject: this chapter is a good index of what the graph is missing
  detail: 'Read as a checklist rather than as source, the chapter points repeatedly at content the graph
    does not yet hold: the Reaction Check on printed page 113, Adventures on 122, NPCs on 124, Rival Crawlers
    on 126, treasure on 117 and monsters on 192. That is six forward references in nine pages, all to
    chapters among the hundred and five packets still unclaimed.

    It also confirms the standing shape of the gaps rather than adding new ones: NPCs have no identity,
    recorded as OBS-03 of PKT-SD-091-093, and neither do the things this chapter treats as central to
    play, such as adventures, campaigns, encounters as design objects and player motivation.'
- id: OBS-03
  subject: the nine core principles are the clearest case yet of advice resembling rules
  detail: 'The CORE ETHOS section on printed page 104 is headed as principles and foundations, gives nine
    of them their own bold labels, and states each imperatively. Two of the nine restate real rules, action
    economy and distance, and one points usefully at another rule, which is the asserted row. The other
    six state attitudes.

    Recorded because the formatting invites over-extraction: a bold label followed by an imperative sentence
    looks exactly like a defined term in this book''s rules chapters. The test that separates them is
    whether a relation between two named things is stated, and for six of the nine the answer is no.'
architectural_escalations: []
architectural_escalation_note: None raised. The single asserted row uses a legal edge type between two
  canonical identities and needs no ruling. OBS-01 identifies something the vocabulary cannot express,
  but no new prefix, edge type, domain or general rule would fix it, so it is recorded for the Architect
  rather than escalated as a request. The two carried-forward findings are repairs owed to another packet,
  not questions.
completeness_statement: 'All nine pages and all thirteen top-level sections in the bounded scope were
  read in full at the recorded checksum. Sixteen candidates were considered and each is recorded: fifteen
  in rejected_candidates with the reason, and one asserted as M001. Of the rejections, five are restatements
  of rules canonical elsewhere with the existing row and page named and verified, three are forward references
  to unextracted chapters, six are advice or fiction carrying no relation, and one, the four standard
  DCs, is deferred to its own defining locus on printed page 79 which I read directly.

  The result is one edge, no new identity, two canonical identities reused. The row was checked against
  the 641 canonical edges for an assertion-key collision and for a shared source, type and target under
  a different aspect; there is neither. No row carries a condition and no aspect carries a digit. Two
  gaps in the already-integrated PKT-SD-078-081 were found while verifying rejections and are reported
  as CF-01 and CF-02 for repair at their own locus. No assertion depends on any other ruleset.'
