  analyst_rationale: 'The ACTION ECONOMY principle on printed page 104 states that a character gets one
    action per turn and directs the GM to use multitasking, naming its page, for small tasks. The one-action
    statement is a restatement of printed page 8 and is not asserted. The pointer is not: it is this page''s
    own act, and it is the same shape as the cross-reference rows already in production from the overland
    travel and carousing pages to rule_time_passes, and from the combat actions page to rule_spellcasting_check.

    Both endpoints are canonical, so this is an incidental locus supporting a relationship rather than
    defining either identity. It does not collide with the existing rule_multitask EXCLUDED_FROM rule_action
    row from printed page 88, which runs the other way and carries a different type and aspect. Evidence
    is explicit_reference because the page''s assertion is the pointer itself.'
