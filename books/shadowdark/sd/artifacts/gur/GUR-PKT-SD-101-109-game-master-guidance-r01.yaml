near_null_extraction_declaration: 'Nine printed pages yield one row and no new identity. That is the correct
  reading of this chapter and is declared here rather than left as an apparent gap.

  This is the Game Master half''s opening chapter and it is advice about running a game: what a GM is
  for, how to read players, nine stated principles, how to pitch difficulty, how to set a tone. It quotes
  a great many real mechanics in passing and defines almost none of them. Sixteen candidates were considered
  and are recorded below with the reason each was rejected; fifteen are rejected and one is asserted.

  The single asserted row survives the incidental-locus test recorded as OBS-04 of PKT-SD-096-100: both
  endpoints are already canonical and the source states a relationship between them, so the row can be
  carried from a page that defines neither. That test is new as of the previous packet, where I had wrongly
  rejected a row for sitting outside a defining locus, and applying it here is the reason this packet
  is not a null extraction.'
page_attribution_basis: 'Nine markers resolve this packet and every one sits on a heading, which is a
  change from the two preceding packets. p101 ends a first-level part-opener heading carrying only an
  epigraph; p102 through p109 each end a second-level heading. Placement rule 1 applies each to its whole
  heading and the persistence rule carries it to the subsections beneath.

  One detail worth naming: p101 and p102 end headings of identical text, THE GAME MASTER, at different
  levels on different pages. They are two headings, not one; the first is the part opener. The placement
  and persistence rules do not distinguish heading levels. The single asserted row cites page 104.'
scope_boundary: The bounded scope is the Primary Source Material section, printed pages 101 to 109. The
  trailing Supporting Source Context is out of scope.
source_summary: 'The opening chapter of the Game Master half. A part opener and an epigraph, then an address
  to the GM: you hold ultimate power and want only to see the players triumph. The Only Rule is that the
  GM makes the rules and the book is a guide rather than a constraint. The Pact is the unspoken goodwill
  between GM and players. Player motivations are reward, heroism and discovery, the players rather than
  the characters are the audience, and each encounter has a dramatic question that ends it once answered.
  Nine core principles follow: time, darkness, gear, action economy, information, distance, danger, rewarding
  investment and stat checks. Then advice on unpredictability, telegraphing danger and meaningful choices;
  the structure of adventures, campaigns and NPCs; how to set difficulties and vary challenges; why the
  GM is a neutral arbiter and how to treat character death; and how to establish a world, a session zero
  and a first adventure.'
graph_state_at_extraction: 'Read from the repository at extraction, not recalled: the canonical graph
  holds 304 registry rows and 641 edges. The registry was read in full and, following the lesson of the
  previous packet, each identity was matched against what this chapter is doing rather than against its
  nouns alone.

  That mattered twice. It confirmed rule_multitask as the target of the one asserted row, and it confirmed
  that the four standard DCs restated on printed page 107 have no tier identities in the registry, so
  nothing here could be reused for them even if minting were appropriate. The asserted row was checked
  against the canonical edge set for an assertion-key collision and for the weaker case of a shared source,
  type and target under a different aspect; there is neither.'
