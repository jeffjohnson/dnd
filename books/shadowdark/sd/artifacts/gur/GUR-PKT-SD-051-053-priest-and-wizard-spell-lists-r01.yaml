source_summary: >-
  Printed page 51 is the priest spell list, five tier subsections of six spells each. Printed pages 52
  and 53 are the wizard spell list, five tier subsections of nine to twelve spells each. Each entry is
  a bare name. Neither list carries framing prose, attributes or effect text. This summary is
  orientation only.

