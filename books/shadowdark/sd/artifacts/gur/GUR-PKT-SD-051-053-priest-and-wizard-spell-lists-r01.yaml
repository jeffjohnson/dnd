null_extraction_declaration: >-
  This GUR proposes no candidate node, no candidate edge, no candidate general rule and no domain.
  That is a property of the source material, not an incomplete reading. Both lists were read in full
  and every element was considered against the core test and rejected for a stated reason; those
  rejections are enumerated in rejected_candidates. The handoff is the ordinary Builder handoff and
  the status is the ordinary proposed. The Analyst did not use the terminal withdrawal form, which
  ARTIFACT_LIFECYCLE reserves for a GUR whose source scope a later packet wholly supersedes; nothing
  supersedes this packet.
  This is the fourth null extraction in the intake, after the front matter, the character names table
  and the back matter, and it is the first whose subject matter is unambiguously mechanical. The
  reasoning is set out at length below because the conclusion is less obvious here than for a credits
  page.

why_an_index_of_spells_yields_nothing: >-
  These two pages are an index. Each entry is a spell name printed under a tier heading, with no
  attributes, no effect text and no rule. Every named spell has its own entry in the Spells chapter
  beginning on printed page 54, and that entry is its defining locus under SOURCE_MARKDOWN Source
  Identity Authority.
  Minting identities here would fix roughly eighty-five spellings from a secondary listing, which
  that contract prohibits in terms, and would do so for spells whose own entries are in packets not
  yet claimed, where the source gives the authoritative name, tier, class, duration, range and
  effect. Four such packets have already been extracted and propose forty of these spells from their
  own entries; proposing them again from an index would create competing proposals for no gain.
  The relationship the pages do state is list membership: this spell is on the priest list at tier
  three. That is the same shape the Analyst has declined for ancestries against their axis, for
  alignments and deities against theirs, and for languages against their tables, each time because
  no type in the closed section 3 vocabulary expresses membership and the nearest candidates assert
  something false. It is also load-bearing here, more so than in those cases, because printed page 49
  gates scroll and wand use on whether a spell is on the caster's list. That is why the question is
  being escalated rather than quietly dropped; see architectural_escalation_note.

