rejected_candidates:
  - text_locus: 'PRIEST SPELLS LIST and WIZARD SPELL LIST entries, p51 to p53'
    quoted_gist: >-
      roughly eighty-five spell names printed under tier headings, from Cure Wounds and Turn Undead
      through to Wish
    why_considered: >-
      Each is source-named and the spell_ prefix is approved, so an identity could be formed for every
      one. This is also by some margin the most complete inventory of spells in the book, which makes
      it tempting as a registration page.
    rejection_reason: >-
      A bare name in an index is not a defining locus. Each spell's own entry, beginning on printed
      page 54, supplies its tier, class, duration, range and effect, and SOURCE_MARKDOWN Source
      Identity Authority reserves naming to that locus and names a listing like this one as exactly
      the kind of secondary mention that cannot rename or establish a concept. Forty of these spells
      are already proposed from their own entries by the four sibling packets extracted alongside this
      one; the rest await theirs.
  - text_locus: 'TIER subsection headings in both lists, p51 to p53'
    quoted_gist: 'five tier headings per list, grouping the spells by tier'
    why_considered: >-
      The tier grouping is mechanically load-bearing. A spell's tier sets its casting difficulty and
      selects which wizard mishap table applies, both already asserted from the magic-rules packet,
      and the sacrifice a priest owes.
    rejection_reason: >-
      The grouping is membership, and no legal edge type expresses it. The tier's mechanical effects
      are already asserted at the level the source states them, from printed pages 44 and 50, where
      the tier feeds the difficulty class, the mishap tables and the sacrifice table. What is missing
      is which tier each individual spell has, and that is stated in the spell's own entry rather than
      here; see OBS-02.
  - text_locus: 'the two list headings themselves, p51 and p52'
    quoted_gist: 'PRIEST SPELLS LIST and WIZARD SPELL LIST'
    why_considered: >-
      Two tbl_ identities were considered, on the pattern of other separately headed tables, with the
      canonical spell families resolved by them.
    rejection_reason: >-
      Neither is a table; both are bulleted lists, so invariant 5's separately-referenced-table test
      does not obviously apply. More importantly a table identity here would exist only to carry the
      membership the vocabulary declines to store, which is the same reason the languages packet
      declined to propose its two table identities even though constitution section 2.3 expressly
      permits them. If the escalation resolves membership, these two identities may become useful and
      a successor revision can add them.

non_edge_observations:
  - id: OBS-01
    subject: this packet is why the escalation is being raised now rather than later
    detail: >-
      The Analyst flagged earlier that a recurring membership question would need an Architect ruling
      before a large repetitive block was extracted rather than after. This is that block beginning.
      These two pages plus the spell entries behind them are roughly eighty-five spells, and the
      Monsters and Treasure chapters ahead are larger again. Raising it here means at most four
      extracted spell packets would gain successor revisions if membership becomes representable, and
      nothing published would be retracted.
  - id: OBS-02
    subject: the per-spell tier is stated in the entries, not here
    detail: >-
      A reader may expect this page to be where a spell's tier is recorded, since the lists are
      organised by tier. The spell entries state it too, in their italic attribute line, and the four
      sibling packets record that they did not assert it for the same membership reason. Neither
      location currently supplies the per-spell tier to the graph. That is one fact missing from two
      places rather than two separate gaps, and one ruling would resolve both.
  - id: OBS-03
    subject: spells appearing on both lists
    detail: >-
      A few names appear on both the priest and wizard lists, including Light, Protection from Evil
      and Speak with Dead, and one spell entry read in a sibling packet carries two classes on its
      attribute line. Whether that is one spell available to both classes or two same-named spells is
      not settled by an index, and constitution section 2 states that labels do not determine
      identity. The spell entries are the locus that can settle it. Recorded so a later reader does
      not resolve the overlap from this page.
  - id: OBS-04
    subject: no magnitudes are present to exclude
    detail: >-
      Recorded for symmetry with the other GURs in this intake. These pages contain no numerals at all
      apart from the tier numbers in the subsection headings, which are index values rather than game
      quantities. Nothing is excluded that a reader might expect represented.
  - id: OBS-05
    subject: packet wrapper and supporting context
    detail: >-
      The supplied file opens with an intake wrapper ahead of the Primary Source Material heading, for
      which the claim manifest is the independent page locator SOURCE_MARKDOWN Attribution Rules
      requires; it contains no rulebook prose, heading or marker. The trailing Supporting Source
      Context reproduces the magic rules and is orientation only, contributing nothing here.

architectural_escalations: []
architectural_escalation_note: >-
  This packet does not itself raise an escalation, because an index page yielding nothing is not an
  architectural question and ESCALATION_CONTRACT says an unsupported edge should simply be rejected.
  The membership question these pages expose is architectural and is raised separately, as a
  cross-packet escalation rather than from inside any one packet, because it now spans ancestries,
  alignments, deities, languages and spells and will recur for monsters, treasure and magic items.
  Nothing is blocked meanwhile: this GUR and the four spell packets are complete and correct under
  every outcome, and a ruling that makes membership representable would be satisfied by successor
  revisions rather than by retraction.

completeness_statement: >-
  All three printed pages in the declared span are accounted for. Page 51 was read in full: the PRIEST
  SPELLS LIST heading, all five tier subsections and all thirty entries. Pages 52 and 53 were read in
  full: the WIZARD SPELL LIST heading, all five tier subsections and every entry across both pages.
  Every page marker was resolved through the Pandoc AST and the resolved page set matches the declared
  span with no gap. The Supporting Source Context reproducing printed pages 44 through 50 and 86 is
  out of scope and contributed nothing. No candidate node, edge, general rule or domain is proposed;
  every element is recorded in rejected_candidates with its locus and the reason it fails, and the
  remaining material is accounted for in OBS-01 through OBS-05. No assertion depends on any other
  ruleset.
