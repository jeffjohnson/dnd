page_attribution_basis: >-
  Markers resolve through the Pandoc AST rather than positionally. The page-51 marker ends the PRIEST
  SPELLS LIST heading and the page-52 marker ends the WIZARD SPELL LIST heading, which placement rule
  1 applies to each whole heading; the wizard list continues onto page 53 under the persistence rule.
  The five tier subsections in each list carry no marker of their own and inherit their page the same
  way. No row cites a page because no row exists.

scope_boundary: >-
  The bounded scope is the Primary Source Material section, printed pages 51 through 53. The trailing
  Supporting Source Context reproduces printed pages 44 through 50 and 86, which are claimed by
