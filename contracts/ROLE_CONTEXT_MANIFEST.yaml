schema_version: '1.0'
cache_format_version: 1

# The verifier hashes the manifest and its schema in addition to these patterns.
# Patterns are resolved lexically, de-duplicated, and sorted by repository-relative path.
common_patterns:
  - AGENTS.md
  - README.md
  - REPOSITORY_STRUCTURE.md
  - contracts/*.md
  - contracts/ROLE_CONTEXT_MANIFEST.yaml
  - schemas/common/*.json

roles:
  architect:
    stable_patterns:
      - agents/architect/INSTRUCTIONS.md
      - rulesets/{ruleset}/governance/constitution.md
      - rulesets/{ruleset}/ruleset.yaml
      - rulesets/{ruleset}/registries/*.yaml
      - rulesets/{ruleset}/registries/*.json
      - rulesets/{ruleset}/profiles/*.yaml
      - schemas/{ruleset}/graph/*.json
      - schemas/{ruleset}/registries/*.json
  analyst:
    stable_patterns:
      - agents/analyst/INSTRUCTIONS.md
      - rulesets/{ruleset}/governance/constitution.md
      - rulesets/{ruleset}/ruleset.yaml
      - rulesets/{ruleset}/registries/*.yaml
      - rulesets/{ruleset}/registries/*.json
      - schemas/{ruleset}/graph/gur.schema.json
      - schemas/{ruleset}/books/{book}/*.json
  builder:
    stable_patterns:
      - agents/builder/INSTRUCTIONS.md
      - rulesets/{ruleset}/governance/constitution.md
      - rulesets/{ruleset}/ruleset.yaml
      - rulesets/{ruleset}/registries/*.yaml
      - rulesets/{ruleset}/registries/*.json
      - rulesets/{ruleset}/profiles/*.yaml
      - schemas/{ruleset}/graph/*.json
      - schemas/{ruleset}/registries/*.json
      - schemas/{ruleset}/books/{book}/*.json
  reviewer:
    stable_patterns:
      - agents/reviewer/INSTRUCTIONS.md
      - rulesets/{ruleset}/governance/constitution.md
      - rulesets/{ruleset}/ruleset.yaml
      - rulesets/{ruleset}/registries/*.yaml
      - rulesets/{ruleset}/registries/*.json
      - rulesets/{ruleset}/profiles/*.yaml
      - schemas/{ruleset}/graph/*.json
      - schemas/{ruleset}/registries/*.json
      - schemas/{ruleset}/books/{book}/*.json
  integrator:
    stable_patterns:
      - agents/integrator/INSTRUCTIONS.md
      - rulesets/{ruleset}/governance/constitution.md
      - rulesets/{ruleset}/ruleset.yaml
      - rulesets/{ruleset}/registries/*.yaml
      - rulesets/{ruleset}/registries/*.json
      - rulesets/{ruleset}/profiles/*.yaml
      - schemas/{ruleset}/graph/*.json
      - schemas/{ruleset}/registries/*.json
      - schemas/{ruleset}/books/{book}/*.json
