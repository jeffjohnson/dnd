definitions:
  SourceEntityManifest: >-
    An independent inventory of all defined entities, tables, and rules in a source section,
    authored prior to graph extraction and used as a completeness gate.
  passage_id: >-
    A deterministic, immutable identifier for an exact textual span or table cell in a source document.
  entity_role: >-
    A structural classification distinguishing leaf rule instances, category hubs, generic types,
    and reference-only placeholders.
  identity_redirect: >-
    A durable pointer resolving a legacy or erroneous node identifier to its canonical successor
    without duplicating graph nodes or mutating immutable history.
semantic_bounds:
  - >-
    Do not infer class permissions from category membership alone; class-specific restrictions
    must cite exact source passages.
  - >-
    Do not infer rule non-existence from graph edge absence.
  - >-
    Optional rules must remain inactive unless their variant activation predicate is explicitly satisfied.
migration_required: true
migration_scope: >-
  Identity migration from spell_control_weather to spell_control_water, updating incoming and outgoing
  canonical references and publishing an identity redirect record.
constitution_version_impact: >-
  None. Shadowdark Constitution 1.8 remains unchanged.
