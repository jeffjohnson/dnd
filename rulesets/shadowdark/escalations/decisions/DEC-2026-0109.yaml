question: >-
  Approve the minimal shared contracts, entity-role taxonomy, passage-binding semantics,
  coupled spell-offering model, weapon taxonomy, variant applicability dimensions,
  and migration authorization for the November 4 rules graph remediation program.
ruling: >-
  Approve remediation contracts and authoring standards covering:
  1. Source Registration and SourceEntityManifest: Every source is registered with explicit
     edition, printing, and revision. Analysts produce an independent SourceEntityManifest
     listing all defined entries, table rows, and allowable exclusions prior to packet compilation.
     Hard publication gates block any packet omitting a declared defined entity.
  2. Stable Passage IDs and Spans: Every claim must resolve to an immutable passage_id
     bound to exact text spans, character offsets, source hashes, and column/table context.
  3. Entity Role Taxonomy: Nodes declare entity_role (e.g., leaf_instance, category_hub,
     generic_type, reference_only) and definition_status. Generic hubs are never bulk-classified
     as leaf instances.
  4. Identity Migration and Redirects: The canonical identifier for Control Water on SD pp. 57/319
     is spell_control_water. An immutable redirect index routes spell_control_weather to
     spell_control_water without rewriting historical artifacts.
  5. Coupled Spell Offerings: Spell availability is modeled per class list with explicit tier,
     edition, and source version, supporting multi-list and supplement spells.
  6. Weapon Taxonomy and Permissions: 26 weapon instances are categorized under item_weapon
     while class usage permissions remain distinct from item category memberships.
  7. Variant Applicability: Optional rules (such as Fatality Mode) require explicit opt-in
     activation conditions; book enablement alone does not activate optional rules.
rationale:
  - >-
    The November 4 audit revealed structural gaps (omitted spells, misattributed page-70 tiers,
    unanchored passages, conflated item/category roles) that require governed ontology and
    validation gates rather than superficial edge appending.
  - >-
    Enforcing pre-extraction manifests and passage joins prevents regression across future
    source processing while maintaining provenance.
  - >-
    Distinguishing class rules from category memberships ensures queries (e.g. wizard greatsword usage)
    retrieve accurate restrictions rather than categorical errors.
