migration_required: false
migration_scope: >-
  No canonical graph, registry, source, GUR, GUP, Review, Approved bundle, or
  artifact lineage is migrated by this Decision or its implementation. The
  first ordinary integration remains a later transaction using whichever
  current Approved bundle passes its normal checks.
constitution_version_impact: >-
  None. Constitution 1.2 already defines the first-integration gate and the
  active vocabulary; this Decision implements that existing requirement.
affected_contracts: []
affected_registries: []
implementation_bounds:
  - >-
    Integrator may change only the listed Integrator tooling, tests, and
    tooling README. Do not amend the Shadowdark Constitution, role profile,
    schemas, source packets, GURs, GUPs, Reviews, Approved bundles,
    registries, or canonical data during implementation.
  - >-
    Do not create a reusable empty canonical baseline, seed rows, placeholder
    registrations, sample graph data, inferred roles, or a shared-ruleset
    fallback. Do not rename the existing package solely because it now supports
    more than AD&D.
  - >-
    Preserve current AD&D transaction behavior and its complete test suite.
    No basicdnd/rc processing, cleanup, compilation, review, or integration is
    authorized.
acceptance_tests:
  - >-
    A ruleset-neutral vocabulary loader reads the Prefix table from each active
    Constitution by table structure. It yields all thirteen declared
    Shadowdark prefixes and the existing AD&D prefix set, without a hardcoded
    minimum count or section heading; a malformed or missing Prefix table
    fails closed.
  - >-
    The Integrator obtains edge types, authored-versus-derived status, and
    derived polarity from the active Constitution. Focused tests prove that
    Shadowdark and AD&D each retain their declared vocabulary and that a
    malformed polarity table fails before a transaction starts.
  - >-
    An explicit empty role profile is valid bootstrap input. A Shadowdark
    genesis fixture derives blank role fields for every canonical node and
    registry row, while the existing populated AD&D profile retains its
    current role-derivation results.
  - >-
    Queue, validate, and dry-run paths never create a missing canonical
    directory or canonical file. A real genesis write begins only after a
    current Approved-bundle precondition set has passed and inside the
    transaction boundary.
  - >-
    A forced late failure in a genesis transaction restores the exact
    pre-transaction absence of its canonical directory and files and leaves no
    generated manifest, report, integrated-artifact record, or transaction
    snapshot. The existing registry remains byte-identical.
  - >-
    A successful genesis fixture writes exactly its Approved bundle's declared
    edge rows and approved node registrations, with no seed, placeholder,
    sample, inferred, or unapproved row. Derived canonical files are
    reproducible from those rows.
  - >-
    Focused genesis regressions and the complete Integrator suite pass. The
    implementation report records exact commands and outcomes, including the
    escalation's pre-change dry-run failure and a post-change successful
    dry-run that creates no state.
sequence:
  - step: 1
    owner: architect
    action: >-
      Publish and validate this Decision, then move the complete escalation to
      the decided store without changing its contents.
  - step: 2
    owner: integrator
    action: >-
      Implement the bounded ruleset-neutral vocabulary, bootstrap-role, and
      transactional-genesis support with the listed tests and README update.
      Publish a Decision Implementation Report and its validation evidence;
      do not create Shadowdark canonical state.
  - step: 3
    owner: reviewer
    action: >-
      Independently execute and inspect the implementation evidence. Publish
      an immutable implementation Review approving only if every acceptance
      test holds and no canonical state was created.
post_implementation_requirements:
  - >-
    After an approved terminal implementation Review, Integrator rechecks the
    current Shadowdark queue and independently selects only a current,
    checksum-valid Approved bundle. It may then perform the ordinary first
    integration under the implemented genesis transaction. This later graph
    transaction is not acceptance evidence for the tooling Decision.
  - >-
    If the first ordinary transaction fails, Integrator records the normal
    rejection only when an Approved bundle was actually rejected; it must not
    repair upstream interpretation or leave a canonical baseline behind.
exact_diff:
  tooling/integrator/src/adnd1e_integrator/vocabulary.py: Add a ruleset-neutral Constitution vocabulary reader for prefixes, edge types, and derived polarity.
  tooling/integrator/src/adnd1e_integrator/invariants.py: Replace AD&D-heading and literal-prefix-count parsing with the active vocabulary reader.
  tooling/integrator/src/adnd1e_integrator/derive.py: Parameterize polarity and bootstrap role derivation from active ruleset inputs.
  tooling/integrator/src/adnd1e_integrator/canonical.py: Support an in-memory empty graph only within an authorized genesis transaction.
  tooling/integrator/src/adnd1e_integrator/snapshot.py: Restore genesis failures to absence and remove transaction-created outputs.
  tooling/integrator/src/adnd1e_integrator/integrate.py: Gate and execute non-fabricating genesis initialization after normal Approved-bundle verification.
  tooling/integrator/tests/test_vocabulary.py: Cover active Constitution vocabulary parsing and malformed-table rejection.
  tooling/integrator/tests/test_invariants.py: Cover ruleset-specific prefix and invariant behavior.
  tooling/integrator/tests/test_derive.py: Cover empty bootstrap profiles and unchanged populated-profile derivation.
  tooling/integrator/tests/test_transaction.py: Cover genesis success, dry-run non-writing, and late-failure rollback to absence.
  tooling/integrator/tests/test_genesis.py: Add isolated Shadowdark genesis fixtures and non-fabrication assertions.
  tooling/integrator/README.md: Document supported new-ruleset genesis behavior and rollback guarantees.
