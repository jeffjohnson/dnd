request_origin:
  type: integrator_escalation
  summary: >-
    The first Shadowdark Approved bundle is Integrator-ready, but the
    AD&D-specific transaction tool cannot initialize an independent ruleset
    without fabricating a baseline or losing rollback guarantees.
question: >-
  Who implements and independently verifies new-ruleset canonical
  initialization support, and what must a first Shadowdark transaction prove
  before it may create canonical state?
ruling: >-
  Adopt the escalation's Option A. Integrator owns the bounded new-ruleset
  initialization implementation because it owns the transaction, canonical
  storage, rollback, derived-state, and invariant tooling. Reviewer must
  independently approve the resulting Decision Implementation Report before
  any first Shadowdark integration. This Decision does not itself authorize a
  canonical write.

  A genesis transaction has no canonical baseline. It may create
  `rulesets/<ruleset-id>/canonical/` and its canonical files only after a
  specific current Approved bundle has passed all ordinary preconditions and
  only inside that transaction. A late failure restores the exact pre-state:
  the newly created canonical directory and files are absent, and no generated
  manifest, report, or integrated-artifact record remains. An empty,
  header-only baseline may not be created before the transaction or as a
  substitute for an Approved bundle. A successful transaction writes only the
  passed bundle's approved registrations and declared rows, plus required
  derived outputs.

  Ruleset vocabulary must be read from the active ruleset Constitution by
  table structure, not a literal AD&D section heading or a hardcoded minimum
  prefix count. The Integrator must validate the active prefix table and use
  its actual prefix set. It must likewise obtain the active edge-type and
  derived-polarity vocabulary from the active Constitution, so a future
  ruleset cannot silently inherit an AD&D transcription.

  Shadowdark's current `roles.yaml` is valid bootstrap configuration. An empty
  `thresholds` and `tier2` mapping means genesis emits no derived roles; it is
  not a prerequisite to invent thresholds or import AD&D role rules. The
  Integrator must treat an explicit empty profile as no role derivations while
  retaining existing AD&D derivation behavior from its populated profile.
rationale:
  - >-
    Constitution 1.2 and DEC-2026-0083 reserve canonical creation to the
    Integrator and forbid a fabricated baseline, so the first files must be a
    consequence of a verified transaction rather than a governance seed.
  - >-
    The measured heading and prefix-count failures show that the existing tool
    is not a ruleset-neutral transaction implementation. Parsing the active
    vocabulary removes the inherited AD&D assumptions without changing graph
    ontology.
  - >-
    The empty Shadowdark role profile deliberately records that no corpus-based
    thresholds exist. Empty derived roles preserve that fact; invented values
    would be unsupported graph conclusions.
  - >-
    The Integrator implements its owned surface, while an immutable Reviewer
    implementation Review provides the independent verification required by
    Constitution 1.2.
handoff:
  next_role: integrator
  readiness: ready
  reason: >-
    Integrator implements and evidences the bounded genesis capability without
    touching Shadowdark canonical state. Reviewer then independently verifies
    the implementation report.
