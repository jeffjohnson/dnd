migration_required: false
migration_scope: >-
  No canonical row, registry row, source packet, GUR, GUP, Review, Approved
  bundle, or Integration is rewritten or retracted. After terminal approval of
  the Decision implementation, Analyst may publish ordinary source-backed
  successors for current or future packets. Each successor supplies its own
  item evidence; no mass reissue and no inferred Light Source classifications
  are authorized.
constitution_version_impact: >-
  Shadowdark Constitution advances from 1.6 to 1.7. It expands one existing
  bounded edge type by a single mechanically operative item form and preserves
  historical 1.0 through 1.6 input compatibility.
affected_contracts:
  - rulesets/shadowdark/governance/constitution.md
  - rulesets/shadowdark/ruleset.yaml
  - schemas/shadowdark/graph/gur.schema.json
  - schemas/shadowdark/graph/gup.schema.json
affected_registries: []
implementation_bounds:
  - >-
    Architect changes only this Decision, Shadowdark governance and structural
    schemas, and the resolved escalation location.
  - >-
    Builder changes only tooling/builder/src/adnd1e_builder/compiler.py and
    tooling/builder/tests/test_shadowdark_ancestry.py. It extends the existing
    enumerated Shadowdark classifier with the one item-to-rule_light_source
    shape and must not create a generic item classifier or change another
    ruleset's vocabulary.
  - >-
    Builder must reject a non-item source, a target other than rule_light_source,
    a reversed direction, an aspect other than light source, and duplicate
    item-to-light-source rows with specific findings. It must retain all
    DEC-2026-0103 spell validation and cardinality behavior.
  - >-
    Do not create or edit ordinary source, GUR, GUP, Review, Approved, registry,
    or canonical artifacts during implementation. Do not touch basicdnd/rc.
acceptance_tests:
  - >-
    Constitution Version 1.7 or later defines CLASSIFIED_AS as a directed,
    neutral, source-declared mechanically operative classification; retains the
    bounded spell forms and exclusions; and adds only item_ to rule_light_source
    with aspect light source, source-explicit evidence, and at-most-one
    cardinality.
  - >-
    Shadowdark GUR and GUP schemas admit current 1.7 artifacts while preserving
    historical 1.0 through 1.6 admission. No other ruleset schema or edge
    vocabulary changes.
  - >-
    Builder accepts a valid item_ CLASSIFIED_AS rule_light_source light source
    row with derived neutral polarity and rejects non-item sources, non-light
    targets, reversed direction, wrong aspect, and duplicate item-light-source
    classifications with specific findings. All DEC-2026-0103 spell checks
    remain unchanged.
  - >-
    Focused classifier regressions and the complete Builder suite pass. The
    implementation report records exact commands and outcomes; Reviewer
    independently reproduces the focused tests before approval.
acceptance_test_semantics:
  - acceptance_test_index: 1
    kind: versioned_contract_content
    contracts:
      - path: rulesets/shadowdark/governance/constitution.md
        minimum_version: '1.7'
        substantive_anchors:
          - CLASSIFIED_AS remains directed, neutral, source-declared, and mechanically operative rather than general taxonomy membership.
          - Only a source-explicit item may classify as rule_light_source with aspect light source and at-most-one cardinality.
          - Spell forms and taxonomy, sys-axis, and source-context exclusions remain unchanged.
handoff:
  next_role: builder
  readiness: ready
  reason: >-
    Builder implements the one bounded item-to-light-source classifier extension
    and publishes IMP-DEC-2026-0104-r01. Reviewer independently validates it
    before any Analyst successor asserts a Light Source classification.
  blocking_ids: []
sequence:
  - step: 1
    owner: architect
    action: >-
      Publish this Decision, activate Constitution 1.7 and matching Shadowdark
      schemas, and relocate the resolved escalation to decided history.
  - step: 2
    owner: builder
    action: >-
      Extend only the enumerated Shadowdark CLASSIFIED_AS compiler shape and
      focused tests; publish IMP-DEC-2026-0104-r01 with focused and full-suite
      evidence.
  - step: 3
    owner: reviewer
    action: >-
      Independently validate IMP-DEC-2026-0104-r01 and publish the terminal
      Decision Implementation Review.
  - step: 4
    owner: analyst
    action: >-
      After terminal implementation approval, publish only source-backed
      ordinary successors that assert item-to-rule_light_source rows. Start
      with the exact source packet that explicitly identifies an item as a
      light source; do not infer a row from the current mechanics packet.
post_implementation_requirements:
  - >-
    Builder, Reviewer, and Integrator process any Analyst successor through the
    ordinary lifecycle. Current packet artifacts remain valid until a
    source-specific successor exists.
  - >-
    Future classification forms, item property categories, or evidence weaker
    than a source-explicit identification require a new Architect Decision.
