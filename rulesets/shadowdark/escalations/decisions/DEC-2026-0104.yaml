question: >-
  May a source-explicit item be represented as a mechanically operative Light
  Source without widening Shadowdark CLASSIFIED_AS into general item taxonomy?
ruling: >-
  Approve one additional bounded Shadowdark CLASSIFIED_AS form: an item whose
  source evidence explicitly identifies it as a light source may point to
  rule_light_source with aspect light source. The edge is directed item to
  classification, has derived neutral polarity, and each individual item may
  carry at most one such row.

  This authorization is restricted to item_ source IDs, target
  rule_light_source, and the exact aspect light source. It does not establish
  an item hierarchy, a generic provider relation, a property store, or a
  classification form for another rule_ target. A GUR must cite a source locus
  that explicitly identifies that individual item as a light source; the
  existence of light mechanics alone is insufficient. Torch, Lantern, and
  Campfire are not asserted by this Decision and require ordinary
  source-backed successor artifacts before entering the graph.

  The prior spell forms, their spell-specific tier cardinality, and the
  exclusions for sys_ axes, table headings, collective groupings, and
  taxonomy-only memberships remain unchanged. Any further CLASSIFIED_AS shape
  requires a new Architect Decision.
rationale:
  - >-
    Light Source directly gates Vision and excludes Total Darkness at the
    defining locus. The identity of a source-explicit item that provides that
    mechanically required classification is therefore impact-relevant rather
    than merely descriptive taxonomy.
  - >-
    Limiting the form to one item prefix, one target identity, one aspect, and
    source-explicit evidence preserves the closed ontology and prevents the
    classification edge from becoming a general item-property mechanism.
  - >-
    At-most-one cardinality prevents duplicate assertions without requiring
    every item to be classified or inventing a completeness obligation for
    unread equipment sources.
