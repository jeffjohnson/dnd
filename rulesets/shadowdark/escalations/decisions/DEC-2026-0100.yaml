migration_required: false
migration_scope: >-
  No source, packet, GUR, Review, Approved bundle, registry, canonical row, or
  integration is migrated. Existing GURs retain their identities and declared
  historical versions. Downstream recompiles use the ordinary artifact
  lifecycle only after the approved implementation is available.
constitution_version_impact: >-
  Shadowdark Constitution advances from 1.4 to 1.5. It centralizes historical
  GUR-version admission without changing node identity, edge vocabulary, or
  graph semantics.
affected_contracts:
  - rulesets/shadowdark/governance/constitution.md
  - rulesets/shadowdark/ruleset.yaml
  - schemas/shadowdark/graph/gur.schema.json
  - schemas/shadowdark/graph/gup.schema.json
affected_registries: []
implementation_bounds:
  - >-
    Architect changes only the listed Shadowdark Decision, Constitution,
    ruleset manifest, GUR/GUP schemas, and resolved escalation location.
  - >-
    Builder changes only `tooling/builder/src/adnd1e_builder/vocab.py` and
    focused Builder tests. Preserve behavior for rulesets with no governed
    historical list.
  - >-
    Do not edit existing GURs, GUPs, Reviews, Approved bundles, source packets,
    registries, canonical data, Integrator code, shared contracts, or
    `basicdnd/rc`.
acceptance_tests:
  - >-
    Constitution Version 1.5 or later and `rulesets/shadowdark/ruleset.yaml`
    identify historical GUR compatibility as the explicit unique list 1.0,
    1.1, 1.2, 1.3, and 1.4. They state that new output uses current 1.5 and
    historical input is revalidated under the current Constitution.
  - >-
    Shadowdark GUR and GUP schemas accept 1.0 through 1.5 and reject an
    unknown future version. No other ruleset schema is widened.
  - >-
    `RulesetVocabulary.load(..., "shadowdark")` derives its accepted incoming
    GUR versions from the governed list plus current 1.5. It accepts 1.2 and
    1.3, rejects 1.6, and raises a clear configuration error for malformed or
    duplicate governed values rather than silently falling back to a hardcoded
    Shadowdark list. AD&D 1e and Basic D&D behavior remains unchanged.
  - >-
    After a Reviewer-approved implementation report, the unchanged
    GUR-PKT-SD-027-029-alignment-and-deities-r01 compiles without a
    `constitution_version_mismatch`; any ordinary resulting GUP successor
    declares current 1.5. No version-only GUR successor is published.
  - >-
    Focused Builder regressions and the complete Builder suite pass. The
    implementation report records exact commands and outcomes, and Reviewer
    independently reproduces the focused compatibility checks.
acceptance_test_semantics:
  - acceptance_test_index: 1
    kind: versioned_contract_content
    contracts:
      - path: rulesets/shadowdark/governance/constitution.md
        minimum_version: '1.5'
        substantive_anchors:
          - Historical GUR compatibility is governed by the ruleset manifest list plus its current constitution version.
          - Historical artifacts are fully revalidated under the current Constitution and new output declares the current version.
          - Immutable GURs are not rewritten solely because an additive Constitution amendment advances the current version.
handoff:
  next_role: builder
  readiness: ready
  reason: >-
    Builder implements the bounded manifest-driven compatibility loader and
    publishes IMP-DEC-2026-0100-r01. Reviewer independently validates it before
    any queued historical GUR is recompiled.
  blocking_ids: []
sequence:
  - step: 1
    owner: architect
    action: >-
      Publish this Decision, activate Constitution 1.5 and governed historical
      compatibility metadata, update only matching Shadowdark schemas, and
      relocate the resolved escalation to decided history.
  - step: 2
    owner: builder
    action: >-
      Implement manifest-driven Shadowdark historical GUR compatibility and
      focused regressions; publish IMP-DEC-2026-0100-r01.
  - step: 3
    owner: reviewer
    action: >-
      Independently validate the implementation report and publish its Decision
      Implementation Review. Return only implementation defects to Builder.
  - step: 4
    owner: builder
    action: >-
      After terminal approval, recompile queued immutable Shadowdark GURs
      normally, beginning with PKT-SD-027-029; do not ask Analyst to make
      version-only successor GURs.
post_implementation_requirements:
  - >-
    GUPs, Reviews, Approved bundles, and Integrations follow the ordinary
    lifecycle. No direct canonical change is authorized by this Decision.
  - >-
    Future Shadowdark Constitution amendments update the single governed
    manifest list and matching schema range as part of the Architect amendment;
    Builder does not add another Shadowdark-specific code constant.
