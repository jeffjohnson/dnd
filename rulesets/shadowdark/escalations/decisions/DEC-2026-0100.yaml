question: >-
  Which constitution versions may an immutable incoming Shadowdark GUR declare,
  and how is that compatibility governed without repeatedly transcribing it
  into Builder code?
ruling: >-
  Shadowdark accepts incoming GURs declaring any version in its governed
  `historical_gur_constitution_versions` list plus the current
  `constitution_version`. Constitution 1.5 establishes the historical list as
  1.0 through 1.4. Every accepted historical GUR remains subject to full
  validation under the current Constitution; acceptance does not make its
  former interpretation authoritative and does not authorize new artifacts to
  declare an older version.

  The Builder must load this list from `rulesets/shadowdark/ruleset.yaml`,
  validate its values as unique dotted numeric versions, and union it with the
  current manifest version. A missing list retains each other ruleset's
  existing behavior. For Shadowdark, a malformed list is a configuration error,
  not a permissive fallback and not a reason to use the retired hardcoded
  history. This ruleset-owned metadata is the sole source for Shadowdark's
  historical GUR compatibility; the old hardcoded Shadowdark entry must no
  longer control it.

  GUR-PKT-SD-027-029-alignment-and-deities-r01 and every other immutable 1.2
  or 1.3 Shadowdark GUR remain unchanged. After the implementation receives its
  ordinary independent approval, Builder recompiles each queued GUR normally
  against Constitution 1.5, producing only ordinary GUP successors where an
  output revision is required. No version-only Analyst GUR reissue is
  authorized.
rationale:
  - >-
    The historical compatibility rule was missed on two successive amendments:
    schemas admitted versions 1.2 and 1.3 while the Constitution and Builder
    gate retained only 1.0 and 1.1. A structured ruleset field removes that
    repeated transcription point.
  - >-
    The sixteen affected GUR leaves declared the current version at publication.
    Reissuing them solely for a later additive amendment contradicts the
    Constitution's immutable-history rule and creates needless downstream work.
