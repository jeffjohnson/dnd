implementation_bounds:
  - >-
    Change only contracts/HERDR_HANDOFFS.md, tooling/common/send-agent-handoff.ps1,
    and tooling/common/tests/test_herdr_handoff.py. Do not edit role instructions,
    queue derivation, graph schemas, canonical data, source material, or ignored
    historical relay records.
  - >-
    Preserve create-only request identity, exact sender/recipient provider and
    session verification, endpoint checks, one runnable handoff per finishing
    worker, no automatic resend, and the ban on acting while another repository
    agent works. Delivered is terminal for relay transport only and must not be
    interpreted as a worker or artifact terminal state.
  - >-
    Implement the reconciliation parameter set as an operational state command,
    not an artifact, queue, or graph feature. It must not make a new Herdr call,
    schedule a relay, create agents, or alter any record other than the named
    uncertain request while the lock is held.
acceptance_tests:
  - >-
    HERDR_HANDOFFS Version 1.1 or later defines the delivery-evidenced terminal
    state, distinguishes it from recipient settlement and repository work
    completion, preserves the one-agent execution rule, requires working-peer
    polling under the operational lock, and limits uncertain reconciliation to
    the repository owner without request replay.
  - >-
    A fake recipient that transitions from idle to working with its exact
    state_change_seq advanced is recorded delivered with before/after sequence,
    recipient identity, and delivery-observation evidence. The lock releases;
    no test treats this transport result as completed recipient work.
  - >-
    The long-recipient fallback has a separately bounded no-send observation
    probe. Even when the original submission window expires, an advanced
    recipient sequence produces delivered rather than uncertain; an unchanged,
    unreadable, or identity-mismatched sequence remains uncertain and prevents
    replay.
  - >-
    The child Herdr timeout is derived once and is strictly less than its parent
    supervision bound. A simulated short child timeout returns a structured
    timeout or agent_prompt_stalled result for classification instead of being
    killed by the parent first. No prompt is sent after pre-submission expiry.
  - >-
    A working peer is polled until it is idle or done, then the exact prompt is
    sent once. A blocked, unknown, disappeared, provider/session-changed, or
    ambiguous peer sends nothing and fails closed. Deadline expiry while a peer
    is working is recorded as known no-send refusal rather than uncertain or
    delivered.
  - >-
    The reconciliation command accepts only an existing uncertain request and
    a nonempty owner evidence statement, acquires the lock, preserves the
    original uncertain JSON, records repository_owner, timestamp, disposition,
    and evidence, makes no Herdr prompt call, and forbids re-executing that
    request ID. It refuses every other input state and missing evidence.
  - >-
    All existing focused relay tests and the complete Builder suite pass. The
    report records the exact commands and results; unrelated failures remain
    visible and do not weaken the relay's identity, endpoint, no-replay, or
    one-agent guards.
acceptance_test_semantics:
  - acceptance_test_index: 1
    kind: versioned_contract_content
    contracts:
      - path: contracts/HERDR_HANDOFFS.md
        minimum_version: '1.1'
        substantive_anchors:
          - Delivery is terminal for relay transport when the exact recipient state-change sequence advances; it is not recipient work completion.
          - A working peer is polled under the lock, while blocked, unknown, changed, and ambiguous peers fail closed.
          - An uncertain request is reconciled only by the repository owner with auditable evidence and never replayed.
