question: >-
  When a direct Herdr handoff is demonstrably delivered but its recipient is
  still working, what ends the relay's transport lifecycle without weakening
  single-agent execution, and how are busy-peer deferral and genuine uncertainty
  recovered without editing local relay state by hand?
ruling: >-
  Approve OPT-A, OPT-B, and OPT-C with the delivery boundary below; reject
  OPT-D. Amend HERDR_HANDOFFS to version 1.1. A relay request is transport-
  complete when the exact recipient binding's state_change_seq advances after
  submission. Record that state as delivered, release the operational lock, and
  do not wait for the recipient's full AI turn. Delivered means only that the
  exact message started a recipient turn; it is not artifact completion,
  approval, queue consumption, or permission for a second repository agent to
  work. The existing one-agent rule and peer eligibility check remain binding.

  Builder must replace the settlement wait with a bounded delivery-observation
  window using the installed Herdr form `agent prompt <pane> <text> --wait
  --until working --timeout <delivery-window>`. The delivery window is at most
  5000 milliseconds. The parent supervision limit for that child must be set
  from one captured value and strictly exceed the child's timeout by a fixed
  reserve; no second Get-RemainingMs read may make the parent kill the child
  first. The relay must reserve enough time before submission for that window
  and otherwise refuse before sending. A bounded, no-send post-failure agent
  list probe is permitted outside an expired submission budget solely to read
  the recipient binding. If the sequence advanced, record delivered with the
  before/after evidence; if it did not, retain uncertain and forbid resend.

  A working peer is a temporary eligibility condition, not a terminal refusal.
  Under the existing lock, re-list and revalidate every bound agent until all
  are idle or done or the request deadline expires. Blocked, unknown,
  disappeared, changed-provider, changed-session, or ambiguous peers still
  fail closed with no prompt. Expiry while a peer is working records a known
  no-send refusal, preserving the request as audit evidence; it never becomes
  uncertain or a claimed delivery.

  Add an operator-only reconciliation parameter set. It may resolve only an
  existing uncertain record, under the same lock, to delivered or failed with a
  nonempty evidence statement, timestamp, and repository_owner identity. It
  must preserve the original uncertain state as embedded audit evidence, send
  no prompt, and never replay its request ID. Only the repository owner invokes
  this operation; an Architect may direct it only on the owner's explicit
  instruction. A resolved failed delivery requires a newly authored request ID
  if the work still needs delivery. Raising TimeoutMs alone is rejected because
  no fixed timeout bounds an arbitrary recipient turn.
rationale:
  - >-
    The incident evidence proves a recipient state-change sequence is a stronger
    delivery fact than a relay process waiting for the recipient's whole turn.
  - >-
    Locking transport through recipient settlement transformed normal long work
    into an operational deadlock and did not enforce the actual single-agent
    rule, which remains independently checked from live agent state.
  - >-
    The current D1 fallback cannot run after expiry, and D2 guarantees that
    expiry path. A bounded independent observation probe and one captured child
    limit make the intended evidence reachable without permitting another send.
  - >-
    A peer known to be working is neither identity ambiguity nor a failed send;
    waiting through the already bounded eligibility window preserves the exact
    request and removes the one-observation message loss.
  - >-
    Genuine non-delivery remains uncertain and cannot be retried automatically.
    Reconciliation must be explicit, auditable, and owner-controlled rather
    than a hand edit to ignored shared state.
