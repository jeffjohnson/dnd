definitions:
  full-page-artwork: >-
    The steward declares that the identified printed page contains full-page
    artwork and no graph-constitutable content.
  page-intentionally-ignored: >-
    The steward deliberately excludes the identified printed page from graph
    extraction, for example a character sheet or a reader's write-in list.
    This records an exclusion, not a claim that the page is empty or artwork.
  blank-page: >-
    The steward declares that the identified printed page is blank and supplies
    no source content for graph extraction.
semantic_bounds:
  - >-
    Only the source steward declares the classification. Pipeline roles preserve
    it; they do not invent an ignored-page marker to conceal unread, missing,
    uncertain, or mechanically difficult source material.
  - >-
    Use a genuine existing heading or an empty fenced Div with a reserved pN
    identifier. Bare class-bearing paragraph tokens remain invalid; arbitrary
    unknown classes on a page marker remain errors. Do not fabricate headings.
  - >-
    Retain the exact page number and class in packet.yaml composition metadata
    at claim under the existing manifest convention. The page stays in the
    packet's actual declared span, page attribution, and completeness accounting.
    Do not delete it, renumber it, or narrow the span to pages 323-325 only.
  - >-
    A classified page inside the declared span owes no graph-content or
    uncovered-page remediation. This does not waive out-of-span, malformed
    marker, or unrelated source defects. Manifest precedence remains unchanged;
    record a discrepancy rather than silently rewriting a published manifest.
  - >-
    The class belongs only to its identified page; it is not inherited by later
    pages. Marker page-state behavior and the three placement rules are unchanged.
    No class is a node, edge, domain, general rule, citation, or evidence of a mechanic.
  - >-
    This ruling classifies page 322 from the steward declaration; it makes no
    claim to have read that omitted physical page. The packet's pages 323-325
    are not classified by the preceding page-322 marker.
scope:
  contract_scope: universal_across_all_registered_rulesets
  known_affected_packet: books/shadowdark/sd/packets/incoming/144-community-credits-and-licensing.md
  independent_work: >-
    No other packet is blocked by this Decision. The escalation reports 143
    other supplied packets; this count is contextual, not a frozen test or a
    claim that every one is otherwise ready. Their normal gates still apply.
migration_required: false
migration_scope: >-
  No graph, node registry, constitution, source, claimed packet, or published
  artifact is rewritten. Existing full-page-artwork remains valid. Do not
  relabel the live marker or fabricate a blank-page occurrence in real source.
affected_contracts:
