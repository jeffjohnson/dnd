question: >-
  Admit page-intentionally-ignored and blank-page as closed, steward-authored
  page classifications without making metadata into graph content or hiding
  source coverage, and without invalidating an in-progress implementation Review.
ruling: >-
  Approve OPT-A. The prospective closed vocabulary consists of full-page-artwork,
  page-intentionally-ignored, and blank-page. All three are page-local intake
  metadata with the existing attachment, provenance, and in-span coverage rules.
  The deliberate exclusion class does not assert that printed matter is absent;
  blank-page does. Preserve the actual classification instead of relabeling a
  page as artwork. Builder may implement and test this exact prospective
  amendment against this Decision. New-class production intake remains gated
  until independent implementation approval and the final Architect activation
  of SOURCE_MARKDOWN 1.8 or later. Do not modify SOURCE_MARKDOWN during the
  current Review of IMP-DEC-2026-0082-r02.
rationale:
  - The source steward explicitly distinguishes omitted printed matter from artwork and blank pages.
  - A closed vocabulary preserves typo detection and auditable reasons for omitted graph content.
  - Classification belongs to intake metadata, not to the ruleset ontology or canonical graph.
  - >-
    The page 322 marker is a valid empty Pandoc Div. The parser independently
    resolves pages 322 through 325 and reports only its class as unknown;
    no marker repair or source rewrite is needed for this ruling.
  - >-
    The report currently under review pins SOURCE_MARKDOWN 1.7 by checksum.
    Deferred contract activation prevents this independent governance task
    from changing the Reviewer's input while the user permits concurrent work.
handoff:
  next_role: builder
  readiness: ready
  reason: >-
    Implement and test the three-class prospective vocabulary under step 2,
    after the current Reviewer turn and any higher-priority resulting integrity
    repair have finished. Do not edit the contract or process packet 144. The
    later Architect activation is not a prerequisite for this implementation Report.
  blocking_ids: []
