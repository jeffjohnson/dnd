escalation_id: ESC-2026-09-22T18.43.24.006Z
question: >-
  Which source-defined language identities and language-table distinctions may
  the Shadowdark graph represent from the defining languages packet?
ruling: >-
  Approve individual source-named languages under the Shadowdark-only `lang_`
  prefix with machine kind `language`. The authorized ordinary proposal IDs are
  `lang_common`, `lang_dwarvish`, `lang_elvish`, `lang_giant`, `lang_goblin`,
  `lang_merran`, `lang_orcish`, `lang_reptilian`, `lang_sylvan`,
  `lang_thanian`, `lang_celestial`, `lang_diabolic`, `lang_draconic`, and
  `lang_primordial`. Preserve the source labels and capitalization.

  `sys_language` remains the aggregate language axis; it neither merges with
  nor replaces an individual `lang_` identity. The Common Languages and Rare
  Languages tables may be proposed as `tbl_common_languages` and
  `tbl_rare_languages` under the existing `tbl_` kind when a source-supported
  mechanical relationship needs the table. The common/rare headings do not
  create a stored language property, automatic table-membership edge, general
  rule, or canonical registration.

  This is a bounded language ruling, not an automatic rule for every named
  member of every subsystem. A future new kind still requires a defining locus
  and an evidence-bearing Architect escalation. No source relationship, node
  registration, class or ancestry refinement, creature identity, or edge is
  preapproved by this Decision.
rationale:
  - >-
    The packet is the defining locus for fourteen individually named languages,
    and earlier source-backed ancestry and class artifacts already depend on
    individual language identities that the previous vocabulary could not name.
  - >-
    A dedicated language kind keeps individual languages separate from the
    aggregate axis and avoids misusing a table, class, or creature identity.
  - >-
    The common/rare distinction is useful as source-named table context, but
    table layout alone is not a graph relationship and must not invent a
    membership vocabulary or derived attribute.
