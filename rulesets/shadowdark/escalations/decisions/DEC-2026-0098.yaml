migration_required: false
migration_scope: >-
  No existing source, packet, GUR, GUP, Review, Approved bundle, Integration,
  registry row, or canonical row changes. Existing axis-level language rows
  remain valid history. Later source-supported ordinary revisions may refine
  their own packet scope; this Decision does not require or authorize them.
constitution_version_impact: >-
  Shadowdark Constitution advances from 1.3 to 1.4, adding the language
  vocabulary and preserving historical 1.0 through 1.3 readability.
affected_contracts:
  - rulesets/shadowdark/governance/constitution.md
  - rulesets/shadowdark/ruleset.yaml
  - schemas/shadowdark/graph/edge.schema.json
  - schemas/shadowdark/graph/gur.schema.json
  - schemas/shadowdark/graph/gup.schema.json
affected_registries: []
implementation_bounds:
  - >-
    Architect edits only the five listed Shadowdark governance and schema
    files, publishes this Decision, and relocates the unchanged escalation.
  - >-
    Do not edit Builder, Integrator, Reviewer, or Analyst code; source packets;
    GURs; GUPs; Reviews; Approved bundles; registries; canonical data; shared
    contracts; another ruleset; or basicdnd/rc.
  - >-
    This additive amendment authorizes ordinary proposals, not pre-registered
    nodes, source edges, a language property, table-membership edge, general
    rule, class or ancestry migration, creature promotion, or hierarchy.
acceptance_tests:
  - >-
    Shadowdark Constitution Version 1.4 or later lists `lang_` as an
    individual source-named language, enumerates the fourteen exact IDs in
    this Decision with their source labels, retains `sys_language` as a
    separate axis, and states the table-only common/rare boundary.
    ruleset.yaml declares the same current version.
  - >-
    The Shadowdark edge schema accepts `lang_` identities in either endpoint
    and rejects a bare, hyphenated, unknown-prefix, or invalid-grammar form.
    GUR/GUP schemas accept historical 1.0 through 1.3 artifacts and current
    1.4 output, rejecting unknown future versions without widening another
    ruleset.
  - >-
    RulesetVocabulary loads all sixteen active Shadowdark prefixes, including
    `lang_`, from the local Constitution without code changes. No AD&D or
    Basic D&D vocabulary gains the prefix.
  - >-
    The held languages packet may publish an ordinary first GUR under 1.4.
    It uses only source-supported authorized language/table identities and no
    inferred table-membership, anonymous, collective, or unknown-language
    identity. Ordinary Builder, Reviewer, and Integrator lifecycle remains
    required for all downstream artifacts.
acceptance_test_semantics:
  - acceptance_test_index: 1
    kind: versioned_contract_content
    contracts:
      - path: rulesets/shadowdark/governance/constitution.md
        minimum_version: '1.4'
        substantive_anchors:
          - lang_ identifies an individual source-named language and remains separate from sys_language.
          - Fourteen exact source-defined language identities preserve their source labels.
          - Common and rare language tables are table context, not a stored property, automatic membership edge, or general rule.
          - This ruling does not automatically authorize new kinds for other named subsystem members.
