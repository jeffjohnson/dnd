  blocking_ids: []
sequence:
  - step: 1
    owner: architect
    action: >-
      Publish this Decision, activate Constitution 1.4 and matching schemas,
      validate the amendment, and relocate the resolved escalation.
  - step: 2
    owner: analyst
    action: >-
      Publish the first GUR for PKT-SD-032-032-languages under Constitution
      1.4 using only source-supported language and table identities.
post_implementation_requirements:
  - >-
    The languages GUR, GUP, Review, Approved bundle, and Integration follow
    their normal lifecycle. This Decision neither registers language nodes nor
    creates source relationships.
  - >-
    Any later request for another source-specific identity kind needs its own
    defining-locus escalation; no generic subsystem-member rule was adopted.
