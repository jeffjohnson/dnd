schema_version: '1.0'
id: DEC-2026-0090
decision_authoring_contract_version: '1.1'
status: approved
revision: 1
supersedes: null
ruleset_id: shadowdark
book_id: sd
source_id: sd-steward-intake
packet_id: cross-packet
constitution_version: '1.2'
decision_date: '2026-09-22'
request_origin:
  type: reviewer_finding
  summary: >-
    REV-IMP-DEC-2026-0087-r02-r01 found that Constitution 1.2 and the
    Shadowdark GUR/GUP schemas admit historical 1.1 GURs, while
    RulesetVocabulary accepts only historical 1.0 plus current 1.2.
question: >-
  How must the Builder validate a previously published Shadowdark GUR that
  declares Constitution 1.1 after the ruleset has advanced to 1.2?
ruling: >-
  Treat Constitution 1.1 exactly as a historical Shadowdark GUR input version,
  alongside 1.0. RulesetVocabulary for shadowdark must admit 1.0, 1.1, and the
  current manifest version 1.2. A 1.1 GUR is revalidated under 1.2, produces the
  existing constitution_version_older_than_compiler warning, and stamps any new
  compile output with 1.2 while preserving its input version. It must not be
  trusted solely because it was valid under 1.1.

  This is compatibility for immutable historical inputs only. New Shadowdark
  GURs and GUPs continue to declare the current Constitution 1.2. Unknown and
  future versions remain constitution_version_mismatch errors. No published GUR,
  packet, source, graph row, registry, or schema is changed by this Decision.
rationale:
  - >-
    Constitution 1.2 expressly admits 1.0 and 1.1 historical GURs with current
    revalidation, and the current structural schemas already read both versions.
  - >-
    The compiler's one-version omission would turn a governance-approved input
    into an implementation error without a semantic reason.
  - >-
    The existing older-version warning and current-output stamping preserve the
    distinction between compatibility and authoring authority.
handoff:
  next_role: builder
  readiness: ready
  reason: >-
    Builder owns the two bounded vocabulary and focused-regression changes;
    Reviewer independently approves their implementation report afterward.
  blocking_ids: []
