    role: current_incomplete_ruleset_vocabulary
migration_required: false
migration_scope: >-
  This corrects prospective Builder validation. Existing immutable artifacts
  remain unchanged and no historical 1.1 GUR currently exists in Shadowdark.
constitution_version_impact: >-
  None. Constitution 1.2 already defines this compatibility policy; this
  Decision aligns the Builder implementation with it.
affected_contracts: []
affected_registries: []
implementation_bounds:
  - >-
    Change only the Shadowdark historical-version entry in RulesetVocabulary and
    focused Shadowdark ancestry tests. Do not edit the Constitution, ruleset
    manifest, GUR/GUP schemas, packets, source Markdown, graph artifacts,
    registries, queue behavior, or Herdr tooling.
  - >-
    Preserve the current behavior for immutable 1.0 GURs, AD&D, Basic D&D,
    current 1.2 output, and unknown/future versions.
  - NO RC processing, cleanup, compilation, or testing is authorized.
acceptance_tests:
  - >-
    RulesetVocabulary loaded for shadowdark accepts exactly historical 1.0 and
    1.1 plus current manifest version 1.2; no other ruleset is widened.
  - >-
    A focused synthetic 1.1 Shadowdark GUR compiles without
    constitution_version_mismatch, retains constitution_version_older_than_compiler,
    and records 1.2 as the output constitution version with 1.1 as the input
    version. A synthetic unknown future version still fails.
  - >-
    Existing immutable 1.0 Shadowdark GUR compatibility tests remain green and
    their source artifacts are unchanged. The focused test module and complete
    Builder suite pass with exact commands and outcomes recorded in the report.
sequence:
  - step: 1
    owner: architect
    action: Publish this Decision and notify Builder of the bounded implementation.
  - step: 2
    owner: builder
    action: >-
      Update RulesetVocabulary and its focused Shadowdark regression tests,
      validate the three acceptance tests, and publish an implementation report
      with a validation report for Reviewer.
  - step: 3
    owner: reviewer
    action: >-
      Independently verify the implementation and acceptance evidence. Publish
      a terminal approving or corrective implementation Review through ordinary
      immutable lineage.
post_implementation_requirements:
  - >-
    A future historical 1.1 GUR follows ordinary current-input validation,
    Builder compilation, Review, and Integration. This Decision does not make
    any existing or future graph row approved.
exact_diff:
  tooling/builder/src/adnd1e_builder/vocab.py: Add the governed historical 1.1 Shadowdark GUR input version.
  tooling/builder/tests/test_shadowdark_ancestry.py: Add focused 1.1 compatibility and unknown-version regression coverage.
exact_diff_ownership:
  - {path: tooling/builder/src/adnd1e_builder/vocab.py, owner: builder, sequence_step: 2}
  - {path: tooling/builder/tests/test_shadowdark_ancestry.py, owner: builder, sequence_step: 2}
follow_up_owners:
  builder:
    - Implement and report the bounded historical-1.1 compatibility alignment.
  reviewer:
    - Independently review the Builder report before any 1.1 input is relied on.
