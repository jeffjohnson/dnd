migration_required: false
migration_scope: >-
  No graph, registry, source, packet, GUR, GUP, Review, Approved manifest,
  rejection, integration record, or canonical row is changed. The named
  immutable manifests remain at their paths. This Decision changes only future
  queue derivation of their existing lineage.
constitution_version_impact: None. Queue derivation and artifact provenance change; Shadowdark ontology does not.
affected_contracts: []
affected_registries: []
implementation_bounds:
  - >-
    Builder edits only tooling/common/scan_agent_queues.py and its focused test
    module. Do not edit any Stats artifact, integration record, rejection,
    schema, contract, canonical file, or non-queue tooling.
  - >-
    Implement the current required `approves.review_id` link and existing
    legacy-rNN inference. Do not add a broad retirement field, infer from file
    times, accept contradictory Review IDs, or suppress an active unintegrated
    bundle without exact lineage evidence.
  - >-
    No basicdnd/rc processing, cleanup, re-review, or Stats artifact repair is
    authorized.
acceptance_tests:
  - >-
    A manifested Approved bundle resolves its Review solely from
    `approves.review_id`; a conflicting filename-derived, top-level, or
    provenance value cannot select another Review. A missing or checksum-
    mismatched required link is diagnostic and produces no Integrator job.
  - >-
    Explicit Approved-manifest supersedes links select one active leaf. A
    complete same-kind, same-GUP legacy rNN sequence with omitted revision
    metadata selects its latest revision with a `legacy_revision_inference`
    diagnostic rather than producing parallel leaves or work.
  - >-
    The exact Stats r01 through r05 fixture resolves r05 as the only active
    manifest, recognizes INT-20260922-002 as its consuming integration, and
    emits no Integrator item or Reviewer rejection-remediation item for r01
    through r04 or INT-20260922-001.
  - >-
    A valid rejection of an exact active unintegrated bundle still suppresses
    only that bundle and emits one Reviewer remediation item. An unrelated
    integrated successor, stale rejection, malformed link, or missing lineage
    never silently suppresses current work.
  - >-
    Focused queue tests and the complete queue-scanner test suite pass with
    exact commands and outcomes recorded in the implementation report. Existing
    queue behavior outside the bounded Approved-manifest cases remains covered.
sequence:
  - step: 1
    owner: architect
    action: Publish and validate this direct retirement and scanner-semantics Decision.
  - step: 2
    owner: builder
    action: >-
      Implement the bounded scanner derivation and focused regressions. Publish
      a Decision Implementation Report; do not touch Stats workflow artifacts.
  - step: 3
    owner: reviewer
    action: >-
      Independently validate the report and tests. Publish an implementation
      Review; return only code defects to Builder.
post_implementation_requirements:
  - >-
    Stats r01 through r04 and INT-20260922-001 remain discoverable immutable
    history only. INT-20260922-002 remains the exact completed Stats integration.
  - >-
    Future Approved bundles follow normal schema, active-leaf, Review, and
    rejection rules. This Decision authorizes no generic suppression outside
    the exact implementation semantics and named Stats lineage.
