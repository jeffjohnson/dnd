  rulesets/shadowdark/escalations/decisions/DEC-2026-0094.yaml: Publish the direct retirement and exact scanner rules.
  tooling/common/scan_agent_queues.py: Resolve required approves.review_id and manifest active-leaf lineage before queue and rejection derivation.
  tooling/common/tests/test_scan_agent_queues.py: Cover authoritative Review linkage, legacy manifest leaves, consumed Stats history, and active rejection behavior.
