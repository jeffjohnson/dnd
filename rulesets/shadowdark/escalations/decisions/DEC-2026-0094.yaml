request_origin:
  type: repository_owner_directive
  summary: >-
    Retire the stale parallel Stats Approved lineage. It must remain immutable
    history and must not receive another repair.
question: >-
  How must queue derivation treat the stale Stats Approved manifests after their
  resolved successor was integrated, and which manifest fields control Review
  linkage and active-leaf selection?
ruling: >-
  Retire `APPROVED-GUP-PKT-SD-015-015-stats-and-stat-modifiers-r05-r01`
  through `-r04`, including the rejected `-r04`, as immutable historical
  packaging artifacts. They are not repair work. The complete `r01` through
  `r05` same-kind, same-GUP sequence resolves by the established legacy rNN
  rule to `-r05`; that leaf supersedes `-r04` and was consumed by
  `INT-20260922-002`. Do not publish another Stats Review, GUP, Approved
  manifest, rejection, or integration for this stale branch.

  For a manifested Approved bundle, `approves.review_id` is the sole
  authoritative approving Review link. The scanner must use that value before
  any filename-derived fallback and must validate the corresponding declared
  review checksum where present. A top-level or `provenance.review_id` is not
  an alternate link for a manifest that carries `approves`; it cannot override
  or silently substitute for the required field. Filename inference remains a
  reported legacy fallback only for a manifestless bundle.

  The scanner must resolve the Approved manifest's own revision lineage before
  evaluating its GUP, Review, integration, or rejection state. It uses explicit
  `supersedes` first; when a complete same-kind, same-GUP rNN sequence has
  legacy omissions, it uses the existing WORK_QUEUES legacy rNN inference and
  reports it. A rejection produces Reviewer remediation only for an exact
  active, unintegrated bundle. A rejected predecessor with an integrated active
  successor is informational history, not a repair request.
rationale:
  - >-
    The integrated r05 manifest carries the corrected operation index, exact
    Review and GUP provenance, and all fourteen successfully applied rows. A
    further repair would duplicate completed graph work.
  - >-
    `approves.review_id` is the current approved-bundle schema's required
    provenance field. Selecting a stem-derived Review when that field names a
    different Review validates the wrong artifact and is unsafe.
  - >-
    WORK_QUEUES already requires active leaves and defines legacy rNN inference.
    Applying that rule to Approved manifests prevents stale parallel bundle
    records from creating work without changing published history.
handoff:
  next_role: builder
  readiness: ready
  reason: >-
    Builder implements the bounded scanner and test changes. Reviewer then
    independently verifies the implementation report; no Stats artifact repair
    is a prerequisite or permitted follow-up.
  blocking_ids: []
