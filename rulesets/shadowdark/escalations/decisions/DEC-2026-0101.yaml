schema_version: '1.0'
id: DEC-2026-0101
decision_authoring_contract_version: '1.1'
status: approved
revision: 2
supersedes: DEC-2026-0100
ruleset_id: shadowdark
book_id: sd
source_id: sd-steward-intake
packet_id: cross-packet
constitution_version: '1.5'
decision_date: '2026-09-23'
escalation_id: null
request_origin:
  type: reviewer_decision_evidence_integrity_finding
  summary: >-
    Reviewer independently confirmed that DEC-2026-0100's governing ruling
    matches the published 1.5 inputs, while four Decision evidence checksums
    describe pre-amendment bytes and cannot support the current implementation
    Review.
question: >-
  How is DEC-2026-0100's stale Decision-input evidence corrected without
  rewriting immutable history or repeating unchanged Builder implementation?
ruling: >-
  This Decision is the sole active successor to DEC-2026-0100. It corrects
  only the four Architect-owned evidence checkpoints for the already-published
  Constitution 1.5, Shadowdark ruleset manifest, and GUR/GUP schemas. Their
  current bytes implement exactly the compatibility ruling DEC-2026-0100
  described: historical incoming GUR versions 1.0 through 1.4 are governed by
  the explicit manifest list, new output declares 1.5, and historical inputs
  are fully revalidated under the current Constitution.

  The compatibility policy, scope, current 1.5 files, and all ordinary
  downstream requirements are unchanged. DEC-2026-0100 and
  IMP-DEC-2026-0100-r01 remain immutable historical records and are not
  approved. Builder must publish IMP-DEC-2026-0101-r01, a report against this
  active Decision with current Decision and input checksums. It may reuse the
  unchanged implementation files only after rerunning and recording the same
  focused and complete Builder test commands; no code, GUR, GUP, source,
  registry, or canonical-data change is authorized by this correction.

  Reviewer independently reviews IMP-DEC-2026-0101-r01. Only after that
  terminal approval may Builder perform DEC-2026-0100's unchanged ordinary
  recompilation requirement, beginning with
  GUR-PKT-SD-027-029-alignment-and-deities-r01. No version-only Analyst GUR
  successor is authorized.
rationale:
  - >-
    The prior Decision's immutable evidence cannot be repaired in place. A
    reissue is the existing durable mechanism for correcting executable
    Decision inputs without erasing their history.
  - >-
    The implementation itself was independently tested successfully. Requiring
    code churn would manufacture a change unrelated to the evidence defect;
    rerunning the recorded tests against this active Decision preserves the
    normal pre-approval integrity gate.
evidence:
  - {path: rulesets/shadowdark/escalations/decisions/DEC-2026-0100.yaml, checksum: sha256:087e0de08447e0e503adb0fe29093770b4b2c0e0bad505d2d5b33c8ac546bfb8, role: immutable_predecessor_with_stale_architect_evidence}
  - {path: rulesets/shadowdark/decision-implementations/IMP-DEC-2026-0100-r01.yaml, checksum: sha256:b8fc64824188e7ca7300fdae31d5d8decd4b8ccce303637f9e9ec51df717611f, role: independently_tested_unapproved_predecessor_report}
  - {path: rulesets/shadowdark/governance/constitution.md, checksum: sha256:321341469fe0196241864b9f62dd00527607446668b02a2b715a9296ed813e72, role: current_governed_compatibility_contract}
  - {path: rulesets/shadowdark/ruleset.yaml, checksum: sha256:d5901396d6a7c7d53abaaa734de681f8229d23eb923ddd853a1f1ecb0fb94280, role: current_historical_version_metadata}
  - {path: schemas/shadowdark/graph/gur.schema.json, checksum: sha256:78a839dadcb0c698c3e44cbdce1bb9bd8ac1504aadf848180e3c9ff887c3d125, role: current_gur_version_schema}
  - {path: schemas/shadowdark/graph/gup.schema.json, checksum: sha256:18742ef459b6a2bbd76fda2c318f419f6524037d85c58f54260daa71f98dd6fc, role: current_gup_version_schema}
migration_required: false
migration_scope: >-
  No graph, source, packet, GUR, GUP, Review, Approved bundle, registry,
  canonical row, or integration changes. This reissue replaces only the active
  Decision and its required unapproved implementation-report lineage.
constitution_version_impact: None. Constitution 1.5 remains current and unchanged.
affected_contracts: []
affected_registries: []
implementation_bounds:
  - >-
    Architect publishes only this Decision. Do not edit DEC-2026-0100,
    Constitution 1.5, ruleset.yaml, schemas, source artifacts, registries,
    canonical data, shared contracts, or basicdnd/rc.
  - >-
    Builder publishes only IMP-DEC-2026-0101-r01, recording current evidence
    and the required rerun of the existing focused and full Builder tests. Do
    not change code or tests unless a separately discovered defect requires a
    new escalation.
  - >-
    Reviewer reviews only the active DEC-2026-0101 report. Do not approve or
    repair the superseded DEC-2026-0100 report.
acceptance_tests:
  - >-
    The active Decision pins the current checksums of Constitution 1.5,
    ruleset.yaml, and the Shadowdark GUR/GUP schemas. Those files retain the
    manifest-governed historical list 1.0 through 1.4, current version 1.5,
    current-version revalidation, and no-version-only-rewrite rules already
    adopted by DEC-2026-0100.
  - >-
    IMP-DEC-2026-0101-r01 consumes this exact Decision checksum, records the
    unchanged current Builder implementation/test file checksums, and reruns
    the focused and full Builder commands with successful outcomes. It does not
    modify implementation code or tests.
  - >-
    Reviewer independently approves only the active report. The superseded
    DEC-2026-0100 and IMP-DEC-2026-0100-r01 are retained as immutable history
    and create no ready Builder or Reviewer work.
acceptance_test_semantics:
  - acceptance_test_index: 1
    kind: versioned_contract_content
    contracts:
      - path: rulesets/shadowdark/governance/constitution.md
        minimum_version: '1.5'
        substantive_anchors:
          - Historical GUR compatibility is governed by the ruleset manifest list plus its current constitution version.
          - Historical artifacts are fully revalidated under the current Constitution and new output declares the current version.
          - Immutable GURs are not rewritten solely because an additive Constitution amendment advances the current version.
handoff:
  next_role: builder
  readiness: ready
  reason: >-
    Builder reissues the unapproved implementation-report evidence against this
    active Decision after rerunning the recorded focused and full suites.
  blocking_ids: []
sequence:
  - step: 1
    owner: architect
    action: Publish and validate this metadata-only Decision reissue.
  - step: 2
    owner: builder
    action: >-
      Publish IMP-DEC-2026-0101-r01 with current checksums and rerun test
      evidence, without changing code or tests.
  - step: 3
    owner: reviewer
    action: >-
      Independently review IMP-DEC-2026-0101-r01 and publish its Decision
      Implementation Review.
  - step: 4
    owner: builder
    action: >-
      After terminal approval, normally recompile queued immutable Shadowdark
      GURs beginning with PKT-SD-027-029; do not request version-only GURs.
post_implementation_requirements:
  - >-
    The normal GUP, Review, Approved-bundle, and Integration lifecycle follows
    any step-4 recompilation. No direct canonical action is authorized here.
exact_diff:
  rulesets/shadowdark/escalations/decisions/DEC-2026-0101.yaml: Publish the evidence-correction Decision reissue.
  rulesets/shadowdark/decision-implementations/IMP-DEC-2026-0101-r01.yaml: Record current evidence and rerun results for the active Decision.
exact_diff_ownership:
  - {path: rulesets/shadowdark/escalations/decisions/DEC-2026-0101.yaml, owner: architect, sequence_step: 1}
  - {path: rulesets/shadowdark/decision-implementations/IMP-DEC-2026-0101-r01.yaml, owner: builder, sequence_step: 2}
follow_up_owners:
  builder:
    - Publish IMP-DEC-2026-0101-r01 without code or test edits.
  reviewer:
    - Review IMP-DEC-2026-0101-r01 only after Builder publication.
