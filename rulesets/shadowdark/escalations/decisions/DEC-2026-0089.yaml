constitution_version: '1.2'
decision_date: '2026-09-22'
request_origin:
  type: repository_owner_directive
  summary: >-
    Retire serialized Herdr relays and the one-agent-at-a-time restriction.
    Herdr is a simple notification channel: tell a role it has work and let
    repository artifacts and the queue scanner determine what it may do.
question: >-
  How should the repository notify roles of ready work without turning delivery
  observation into a second workflow engine or preventing independent roles
  from progressing concurrently?
ruling: >-
  Supersede and retire DEC-2026-0088's unimplemented relay work. Herdr is a
  best-effort notification channel only. A sender may directly prompt a named
  role with a concise artifact path and requested action, without a background
  relay, local request record, lock, settlement observation, delivery state,
  retry protocol, or turn wait. The prompt is not work authority: each receiver
  verifies current queue state, inputs, checksums, ownership, and prerequisites
  before acting.

  Permit concurrent repository roles. Priority orders dependencies; it does not
  reserve execution. Independent ready work may proceed in parallel. Artifact
  ownership, immutable publication, exact provenance, create-only output, and
  current-input verification remain the coordination boundary. A role must not
  edit another role's files or assume an upstream artifact remains current after
  its own work begins. It rechecks the active leaf and required inputs before
  publication, then follows ordinary revision and Review lifecycle if they
  changed.

  Retire `tooling/common/send-agent-handoff.ps1` from operational use. Preserve
  the file, its tests, local historical request records, DEC-2026-0082, and
  DEC-2026-0088 as history; do not delete or repair them. No Builder
  implementation report or Reviewer implementation Review is required for this
  retirement. Update shared and role instructions immediately. A role may send
  more than one notification when multiple recipients have independent ready
  work, but must make each notification bounded and point the recipient at the
  authoritative artifact or scanner.
rationale:
  - >-
    Immutable artifacts, ownership boundaries, and the queue scanner already
    prevent duplicate graph work. The relay duplicated those controls poorly.
  - >-
    Delivery settlement is not graph state and cannot safely substitute for a
    receiver's current-input verification.
  - >-
    Serializing every role creates idle capacity and deadlocks unrelated work;
    dependency checks, not a global turn lock, determine whether work is safe.
  - >-
    Retaining the old utility and records preserves audit history while removing
    it from every future workflow path.
handoff:
  next_role: none
  readiness: terminal
  reason: >-
    Architect applies the documentation and contract amendment directly. The
    superseded DEC-2026-0088 has no executable Builder or Reviewer follow-up.
  blocking_ids: []
