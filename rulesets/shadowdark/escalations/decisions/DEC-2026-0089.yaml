migration_required: false
migration_scope: >-
  No graph, registry, source, packet, GUR, GUP, Review, Approved bundle,
  canonical row, or role-context receipt is migrated. Existing local Herdr
  files remain ignored historical operations data. Future notifications do not
  read or write those records.
constitution_version_impact: >-
  No ontology impact. Shadowdark Constitution 1.2 removes its contradictory
  serialized-work instruction; the GUR and GUP schemas admit the current 1.2
  declaration while retaining immutable 1.0 and 1.1 artifacts.
