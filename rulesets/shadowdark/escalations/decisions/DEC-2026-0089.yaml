implementation_bounds:
  - >-
    Update only the fifteen listed documentation, governance, and schema paths.
    Do not edit relay tooling or tests, scanner code, packet artifacts, graph
    data, or any .local/herdr history.
  - >-
    Replace serial delivery language with direct notification and concurrent
    role work. Retain all ownership, immutable-artifact, source-authority,
    current-input, validation, and no-RC requirements.
  - >-
    Do not create a replacement coordination service, hidden task store,
    settlement state, lock, or delivery receipt. Herdr is not provenance and a
    missed prompt is remedied by another direct notification, never by altering
    graph artifacts.
acceptance_tests:
  - >-
    HERDR_HANDOFFS Version 2.0 or later defines direct best-effort
    notifications, no relay state or lock, concurrent independent role work,
    receiver-side queue/input verification, and artifact ownership as the
    coordination boundary.
  - >-
    AGENTS, README, REPOSITORY_STRUCTURE, ROLE_CONTEXT_LOADING, WORK_QUEUES,
    all five role instructions, the Shadowdark constitution, and its current
    GUR/GUP schemas contain no
    instruction to serialize roles, defer a handoff, await settlement, use a
    relay, or write a local handoff request state.
  - >-
    DEC-2026-0089 is the active terminal successor to DEC-2026-0088, so queue
    derivation exposes no Builder or Reviewer work from the retired relay
    Decision. Existing relay tooling and local records remain untouched history.
acceptance_test_semantics:
  - acceptance_test_index: 1
    kind: versioned_contract_content
    contracts:
      - path: contracts/HERDR_HANDOFFS.md
        minimum_version: '2.0'
        substantive_anchors:
          - Herdr is a best-effort notification channel, not a relay or workflow state system.
          - Independent repository roles may work concurrently; dependencies and ownership govern publication.
          - Receivers verify current queue state and inputs, while artifact records remain the only provenance.
sequence:
  - step: 1
    owner: architect
    action: >-
      Publish this terminal successor and update the exact documentation and
      contract paths. Validate the Decision and textual consistency. Notify all
      five roles to reload their instructions, then directly notify each role
      that currently has ready work. No relay, wait, or state record is used.
post_implementation_requirements:
  - >-
    Future workers use direct Herdr notifications and the scanner/artifacts.
    The old relay may remain readable for historical troubleshooting only.
