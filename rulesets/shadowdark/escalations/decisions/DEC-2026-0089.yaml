  contracts/ROLE_CONTEXT_LOADING.md: Remove sequential control-operation language.
  contracts/WORK_QUEUES.md: Separate priority from execution serialization.
  agents/architect/INSTRUCTIONS.md: Replace deferred serial relay requirements.
