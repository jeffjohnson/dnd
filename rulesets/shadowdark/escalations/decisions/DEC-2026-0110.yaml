definitions:
  bidirectional_manifest_verification: >-
    A validation procedure that checks both completeness (all declared source entities exist) and
    soundness (no extraneous or unauthorized relationships are present in the output).
  source_scoped_offering: >-
    A reified grant of a rule, spell, or item to a specific class, tier, or archetype within a single,
    unambiguously identified book and source printing.
  held_contradiction_disposition: >-
    An administrative state applied to contradictory source passages where mechanical assertions are paused
    without modifying source text until authoritative primary calibration is delivered.
semantic_bounds:
  - >-
    Never infer spell offerings across classes without explicit source listing in that book's spell list.
  - >-
    Retrieval engines must not fabricate success flags, synthetic passage text, or inaccurate citation page literals.
  - >-
    Testing graph replay requires executing the build/migration process twice into an isolated copy, not
    comparing an in-memory dictionary to itself.
migration_required: true
migration_scope: >-
  Remove two false Priest edges (spell_hold_person, spell_dispel_magic), add 10 shared Witch offerings
  from CS1 pp. 24-25, and restore versioned meta block in canonical graph.json.
constitution_version_impact: >-
