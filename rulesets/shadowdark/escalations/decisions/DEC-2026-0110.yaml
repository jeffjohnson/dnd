question: >-
  Approve the November 6 source reconciliation findings, authorize the removal of unsupported Priest
  classifications for Hold Person and Dispel Magic, authorize restoration of 10 shared Witch spell
  offerings from CS1, govern page-70 list versus detail contradictions, mandate live bidirectional
  manifest publication gates, replace canned retrieval fixtures with authentic graph/passage lookups,
  and update agent workflow instructions across all rulesets.
ruling: >-
  Approve the following corrective actions and workflow contracts:
  1. Core Class Scope Correction: Remove the two unsupported CLASSIFIED_AS class_priest edges
     for spell_hold_person and spell_dispel_magic. Core Rules packet 019 and detail headers in packets 022
     and 023 independently establish Hold Person (Tier 2) and Dispel Magic (Tier 3) as Wizard-only in Core.
  2. Complete Witch Offerings Reconciliation: Add the 10 source-supported Witch spell offerings
     from CS1 pp. 24-25 (Charm Person, Alter Self, Augury, Invisibility, Speak with Dead, Dimension Door,
     Divination, Polymorph, Scrying, Shapechange) targeting class_witch with book=CS1, section='WITCH SPELLS',
     and status=optional. The Witch offerings total 46 distinct source offerings.
  3. Source Contradiction Governance: Establish that when source spell list tables (SD pp. 51-53) contradict
     subsequent alphabetical detail headers (SD p. 70), the master class spell lists govern class and tier
     memberships. Detail text attributes (duration, range) remain held pending steward physical page-image calibration.
  4. Enforced Manifest Gates: Mandate that SourceEntityManifestGate be wired into the live compilation
     and admission boundaries across all rulesets. The gate must perform bidirectional validation: failing if
     required entities are omitted OR if unauthorized extra class memberships are generated.
  5. Text-Grounded Retrieval: Replace prototype canned string fixtures in rules_retrieval.py with real
     graph-traversal and retained-passage lookups. Capped queries must cite verified passage spans and return
     explicit failure or unavailable-evidence states when data is absent.
  6. Universal Agent Workflow Updates: Update agent instructions for Analyst, Builder, Reviewer, and
     Integrator to enforce bidirectional manifest creation, temporary-copy replay diffing, and export
     metadata preservation across all current and future rulesets.
rationale:
  - >-
    The November 6 audit confirmed that remediation_migration.py introduced false Priest memberships for
    Hold Person and Dispel Magic, and that batch_4b_supplement_spells_migration.py omitted 10 shared Witch
    spells due to gap-file filtering.
  - >-
    Independent verification showed existing regression tests passed because they asserted weak lower bounds
    or relied on static prototype returns in rules_retrieval.py rather than dynamic graph state.
  - >-
    True pipeline integrity requires hard gates at the compilation boundary and source-grounded offering
    reconciliation rather than superficial gap-list counting.
