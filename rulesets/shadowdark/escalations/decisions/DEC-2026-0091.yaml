migration_required: false
migration_scope: >-
  No canonical graph, registry, packet, or source migration occurs. Three
  immutable GUR leaves receive ordinary field-only successors; all older GURs,
  GUPs, and Reviews remain unchanged historical evidence.
constitution_version_impact: None. This standardizes artifact input structure and Review execution, not graph ontology.
affected_contracts:
  - contracts/WORK_QUEUES.md
  - agents/architect/INSTRUCTIONS.md
  - agents/analyst/INSTRUCTIONS.md
  - agents/builder/INSTRUCTIONS.md
  - agents/reviewer/INSTRUCTIONS.md
  - agents/integrator/INSTRUCTIONS.md
  - schemas/common/gur.schema.json
  - schemas/common/review.schema.json
affected_registries: []
implementation_bounds:
  - >-
    Architect changes only the listed common schemas and operational
    instructions. Builder changes only compiler.py, review.py, and focused
    tests. Analyst changes only the three named GUR successor files.
  - >-
    Do not add label/evidence aliases, mutate published input artifacts, alter
    source assertions, repair GUP r03 in place, loosen unknown-version or
    unknown-disposition handling, change queue semantics, or edit Herdr tooling.
  - NO RC processing, cleanup, compilation, or testing is authorized.
acceptance_tests:
  - >-
    The common GUR schema accepts a candidate node with nonempty proposed_id,
    proposed_label, kind, and why_needed and rejects a candidate node that
    omits either executable registration field or uses legacy label/evidence.
  - >-
    Builder compilation reports a blocking candidate_node_fields_missing error
    and emits no blank ordinary registration proposal when either canonical
    candidate-node field is absent. Existing valid AD&D candidate nodes remain
    accepted.
  - >-
    A ref-keyed edge_decisions or row_decisions mapping expands each key into
    its matching per-row directive. A mismatched embedded ref or a nondisposition
    map value fails closed, while existing list and approved_refs/refs forms
    retain their behavior.
  - >-
    WORK_QUEUES 1.32 or later and the Analyst/Reviewer instructions document the
    exact executable candidate-node/Review forms. All five role instructions use
    the positional staged YAML argument for validate_artifact.py. The installed
    tool interface is unchanged.
  - >-
    Focused tests and the complete Builder suite pass with exact commands and
    outcomes in the implementation report. The three named legacy GUR leaves
    and every older GUP/Review checksum remain unchanged.
sequence:
  - step: 1
    owner: architect
    action: >-
      Publish this Decision; update the common GUR/Review schema documentation,
      WORK_QUEUES, and role instructions; validate the exact docs and schemas.
  - step: 2
    owner: builder
    action: >-
      Implement candidate-node fail-closed validation and ref-keyed Review map
      execution with focused regressions. Publish a Decision Implementation
      Report and validation report for Reviewer.
  - step: 3
    owner: analyst
    action: >-
      After step 1, publish the three named field-only GUR successors. This may
      proceed concurrently with Builder step 2; preserve every non-key field and
      do not compile a packet.
  - step: 4
    owner: reviewer
    action: >-
      Independently verify the Builder implementation report and all acceptance
      evidence through ordinary immutable Review lineage.
post_implementation_requirements:
  - >-
    After steps 2 through 4 and the relevant corrected GUR, Builder may create
    ordinary successor GUPs and route them through normal Review/Integration.
    The blocked GUP-PKT-SD-015-015-stats-and-stat-modifiers-r03 is not edited or
    implicitly reclassified by this Decision.
