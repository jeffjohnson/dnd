request_origin:
  type: builder_report
  summary: >-
    Current Shadowdark GUR candidate-node fields do not match the Builder's
    input convention, and a schema-valid ref-keyed Review decision map is not
    executable. The staged-validator command is also documented with an
    unsupported --path option.
question: >-
  Which GUR candidate-node fields and Review per-row decision forms are
  executable repository inputs, and how are the observed Shadowdark artifacts
  corrected without silently aliasing or rewriting published history?
ruling: >-
  Candidate-node input uses proposed_id, proposed_label, kind, and why_needed.
  proposed_label is the source or analyst-approved display label, and why_needed
  is the bounded reason the candidate is necessary to represent packet edges.
  The legacy candidate-node spellings label and evidence are not aliases and
  are prohibited on newly published candidate nodes. Add this shape to the
  common GUR schema. The Builder must fail a candidate node that lacks a
  nonempty proposed_label or why_needed before it can emit a blank registration
  proposal.

  A Review's edge_decisions or row_decisions is executable in exactly these
  forms: a list whose individual entries carry ref; a mapping whose keys are
  the exact GUP refs and whose values are individual dispositions; or the
  existing bulk approved_refs/refs form. For the ref-keyed mapping, the key is
  the ref. An embedded ref is optional but, if present, must equal the key.
  A mismatched key/ref or a map entry with no disposition is an executable-input
  error, never a guessed correction. Existing bulk forms remain unchanged.

  Correct the staged-artifact command everywhere it is operationally
  instructed: validate_artifact.py takes the staged YAML path positionally,
  followed by --schema. Do not change the tool interface.

  Published artifacts remain immutable. The three active legacy Shadowdark GUR
  leaves receive Analyst-owned successor revisions that rename only each
  candidate node's label to proposed_label and evidence to why_needed, retaining
  all values and other candidate-node fields. GUP r03 and its reviewed
  predecessor remain history; a later build follows ordinary successor lineage
  from the corrected GUR and an independently current Review.
rationale:
  - >-
    The established AD&D GUR corpus and compiler both use proposed_label and
    why_needed; the Shadowdark spellings otherwise serialize blank node
    registration fields in every affected GUP.
  - >-
    The common Review schema intentionally validates both list and mapping
    decision collections. Ignoring the latter contradicts the declared input
    contract and turns a complete Review into an unread ruling.
  - >-
    Explicit rejection of aliases preserves the source of every correction and
    prevents a parser convenience from becoming unreviewed graph content.
  - >-
    The validator accepts the staged path positionally, so changing docs is the
    smallest correction and avoids an unnecessary interface expansion.
handoff:
  next_role: builder
  readiness: ready
  reason: >-
    Builder implements the bounded compiler and Review-parser changes while
    Analyst may independently publish the three field-only GUR successors.
