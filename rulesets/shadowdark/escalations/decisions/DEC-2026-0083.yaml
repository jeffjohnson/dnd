schema_version: '1.0'
id: DEC-2026-0083
decision_authoring_contract_version: '1.1'
status: approved
revision: 1
supersedes: null
ruleset_id: shadowdark
constitution_version: '1.0'
decision_date: '2026-09-19'
escalation_id: null
request_origin:
  type: repository_owner_directive
  summary: >-
    Prepare an independent Shadowdark graph workspace, map its filesystem,
    register the six named book workspaces, and notify the other agents.
question: >-
  How should Shadowdark and its six books enter this repository without
  inheriting another system's data, guessing editions, or bypassing ownership?
ruling: >-
  Initialize shadowdark as an independent ruleset under Constitution 1.0.
  Register sd, cs1, cs2, cs3, shadowdome, and western-reaches-pg as separate
  books contributing to its future combined graph. Use separate
  <book-id>-steward-intake sources with explicitly unspecified edition/printing.
  Normalize the requested western_reaches_pg to western-reaches-pg under the
  existing book-ID grammar, without changing global schemas or adding an alias.
  Create governance, schemas, profiles, empty graph registries and complete
  non-canonical artifact/intake stores only. Do not create canonical files.
  Authorize one bounded, sequential awareness-only herdr maintenance batch,
  deferred until Architect is idle. This does not launch normal worker jobs.
rationale:
  - Ruleset identity and source-work identity are distinct under SCOPE_AND_IDENTITY.
  - Shared graph representation does not imply shared source facts or node identities.
  - No source packets have been supplied; editions and supplement precedence cannot be inferred.
  - Empty durable directories make intake paths available without fabricated artifacts.
  - Existing universal contracts and role ownership remain unchanged.
handoff:
  next_role: none
  readiness: terminal
  reason: >-
    Architect bootstrap is direct work. No worker artifact is presently ready;
    source intake is the next external prerequisite. Awareness notifications
    authorize acknowledgment only, not implementation or packet processing.
  blocking_ids: []
migration_required: false
migration_scope: >-
  None. No existing source, artifact, registry, canonical row, Decision, or
  common contract changes. No import from AD&D or Basic D&D is authorized.
constitution_version_impact:
  shadowdark: 'New independent Constitution 1.0; no other constitution changes.'
affected_contracts:
  - rulesets/shadowdark/governance/constitution.md
  - rulesets/shadowdark/WORKSPACE.md
affected_registries:
  - rulesets/shadowdark/registries/books.yaml
  - rulesets/shadowdark/registries/sources.yaml
  - rulesets/shadowdark/registries/nodes.csv
  - rulesets/shadowdark/registries/character_races.yaml
  - rulesets/shadowdark/registries/domain_registry.yaml
  - rulesets/shadowdark/registries/general_rules.json
scope_policy:
  ruleset_id: shadowdark
  book_ids: [sd, cs1, cs2, cs3, shadowdome, western-reaches-pg]
  first_intake_recommendation: books/shadowdark/sd/packets/incoming/
  source_policy: >-
    Steward transcription intake is registered per book. Edition/printing is
    explicitly unspecified, not guessed. Do not merge different editions into
    one source ID; register another source before claiming such input.
  packet_policy: No packet ID or checksum is invented before actual source intake.
  source_authority: >-
    SD is the user-designated main rules. Supplement compatibility and
    optionality require source evidence; titles do not establish overrides.
  schema_composition: >-
    Apply common artifact schemas AND ruleset schemas AND book constraints.
    Ruleset graph scope fields do not replace runtime book/source registration.
acceptance_tests:
  - >-
    All six registered books have distinct source IDs, matching book/source
    manifests and citation codes, complete packet/artifact/work/report/archive
    directories, and book extraction/source schemas. All mapped literal
    non-canonical paths exist; placeholders are not literal directories.
  - >-
    All Shadowdark JSON schemas satisfy Draft 2020-12. Each registry and source
    metadata file validates. Common plus Shadowdark scope schemas accept a
    synthetic correctly scoped envelope and reject another ruleset; each book
    source schema rejects another book or source identity.
  - >-
    nodes.csv contains its header only; general rules and domains are empty;
    character-race membership is inactive and empty; no canonical data exists
    and no source packets, GURs, GUPs, or approval artifacts are fabricated.
  - >-
    The role-context resolver resolves every one of the five roles across all
    six registered books using shadowdark authority, never another ruleset's
    constitution, schema, registry, or graph. No other actor receipt is created.
  - >-
    The existing vocabulary loader reads Shadowdark Constitution 1.0, exactly
    its twelve declared prefixes, thirteen edge types, and six citation codes.
    Loading vocabulary is not evidence of production compiler conformance.
  - >-
    Edge schema accepts a synthetic conforming row and rejects illegal prefix,
    illegal edge type, extra production column, multi-page citation, missing
    citation, and inconsistent OVERRIDES supersession_basis.
  - >-
    This Decision passes publication preflight and exact_diff ownership checks.
    All durable changes are confined to the four new Shadowdark namespace roots.
    No shared tooling, existing graph, or common contract is modified.
sequence:
  - step: 1
    owner: architect
    action: >-
      Publish and validate the listed new-scope bootstrap files and filesystem
      map. Preserve existing namespaces and create no canonical files.
  - step: 2
    owner: architect
    action: >-
      Queue the user-requested awareness-only notification batch for the four
      other roles. Discover and pin live role/provider/session/repository
      bindings, wait for Architect idle, hold the common serial-control lock,
      notify one idle role at a time, require a local checksum acknowledgment,
      and stop without retry on blocked/unknown/missing acknowledgment.
      Each recipient reads WORKSPACE.md only and performs no normal work.
follow_up_owners:
  architect:
    - Record source identity changes or source-backed ontology amendments when input requires them.
post_implementation_requirements:
  - >-
    Steward supplies actual bounded Pandoc Markdown packets at the registered
    intake paths; Analyst then performs scoped startup and ordinary extraction.
  - >-
    Builder and Reviewer verify ruleset isolation and current tooling readiness
    before ordinary packet approval. Unimplemented functionality or semantics
    changes require their usual explicit architectural authorization.
  - >-
    Only Integrator initializes canonical state after the first Approved bundle
    and independently verified new-graph transaction support. This Decision is
    not authority to seed, auto-approve, or integrate a graph.
  - >-
    DEC-2026-0082 reusable relay work and DEC-2026-0080 evidence refresh retain
    their own separate scopes and priorities; this bootstrap does not consume them.
coordination_constraints:
  - No parallel agents, runnable broadcast, queue scan, or corpus read during awareness notifications.
  - The local one-time relay is an operational notification, not a production tooling implementation.
  - Uncertain delivery requires user reconciliation; do not automatically resend.
changelog:
  - Created independent Shadowdark governance and empty graph registries.
  - Registered six user-named books and distinct unspecified-edition steward-intake sources.
  - Added complete non-canonical filesystem layout, schemas and source profiles.
  - Documented ordered intake/extraction/build/review/integration gates and awareness-only notifications.
