    action: >-
      After terminal implementation approval, publish the source-backed
      successor for PKT-SD-043-050 that proposes the five Tier identities and
      their tier-category rows, then publish ordinary successors for spell
      packets using only their own header's tier and casting-class evidence.
post_implementation_requirements:
  - >-
    Builder, Reviewer, and Integrator process the Analyst successors through
    the ordinary lifecycle. No role mass-reissues all category artifacts or
    adds a generic ancestry/alignment/deity/language/class membership edge.
  - >-
    Future source-defined classifications outside the bounded spell forms need
    their own Architect Decision with the defining locus and mechanical impact.
