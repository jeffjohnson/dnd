question: >-
  Which source-declared category facts are graph relationships, and how are
  mechanically operative spell casting class and spell tier represented without
  converting the impact graph into a general taxonomy?
ruling: >-
  Add `CLASSIFIED_AS` as a directed Shadowdark edge type, from an individual to
  a source-declared mechanically operative classification, with derived neutral
  polarity. It is not a general membership, hierarchy, parent, table-membership,
  or shared-prefix relation. It is legal only where the exact classification is
  a direct input to a named mechanic and source evidence states the individual
  belongs to it.

  The initial bounded use is spells. A spell may classify as `class_wizard` or
  `class_priest` with aspect `casting class`, and as exactly one of
  `rule_spell_tier_1` through `rule_spell_tier_5` with aspect `spell tier`.
  The five tier values are ordinary `rule_` node proposals, preserving their
  source labels Tier 1 through Tier 5. Each tier value classifies as the existing
  `rule_spell_tier` aggregate with aspect `spell tier category`, so the aggregate
  rule's existing downstream links remain reachable. A spell may have multiple
  casting classes but exactly one tier.

  Casting class and tier are both classifications, but not the same fact:
  casting class is plural eligibility membership; tier is one ordered source
  category. The ordinary edge relation represents both because each is a
  source-stated input to mechanics. Numeric values remain absent from edge
  fields; tier is represented by its discrete classification identity.

  All taxonomy-only membership remains outside the graph. No `CLASSIFIED_AS`
  edge may target a `sys_` axis, language-table heading, named collective,
  generic ancestry/alignment/deity/language/class axis, creature family, or
  other source-context grouping. The existing zero membership rows for the 34
  canonical ancestry, alignment, deity, language, and class identities are
  correct history and receive no migration. A later classification needs its
  own evidence-bearing Architect Decision unless it is one of the bounded spell
  forms above.
rationale:
  - >-
    The graph records impact-relevant relationships, not every taxonomy fact.
    Broad membership would turn `sys_` axes and table headings into generic
    parent nodes with no mechanical dependency.
  - >-
    A spell's casting class gates scroll and wand use, and its tier drives
    casting difficulty, mishap selection, and sacrifice value. Those explicit
    source classifications are mechanical inputs, so leaving them absent loses
    load-bearing paths rather than merely a convenient query.
  - >-
    Discrete tier identities preserve the ordinal category without storing a
    numeric value in `aspect` or `condition`, and connect each spell to the
    existing aggregate spell-tier mechanics.
