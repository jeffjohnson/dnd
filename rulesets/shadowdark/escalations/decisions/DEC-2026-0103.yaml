migration_scope: >-
  No existing canonical row, registry row, source packet, GUR, GUP, Review,
  Approved bundle, or Integration is rewritten or retracted. After independent
  implementation approval, Analyst may publish ordinary successors: first the
  spell-tier scaffold, then source-backed spell classifications. Taxonomy-only
  identities remain unchanged.
constitution_version_impact: >-
  Shadowdark Constitution advances from 1.5 to 1.6. It adds one bounded edge
  semantic and preserves historical 1.0 through 1.5 input compatibility.
affected_contracts:
  - rulesets/shadowdark/governance/constitution.md
  - rulesets/shadowdark/ruleset.yaml
  - schemas/shadowdark/graph/edge.schema.json
  - schemas/shadowdark/graph/gur.schema.json
  - schemas/shadowdark/graph/gup.schema.json
affected_registries: []
implementation_bounds:
  - >-
    Architect changes only the listed Decision, Shadowdark governance, schemas,
    and resolved escalation location.
  - >-
    Builder changes only the listed compiler vocabulary/polarity path and
    focused tests. It must read a ruleset's derived-polarity table from its own
    Constitution or otherwise preserve ruleset scope; adding CLASSIFIED_AS to
    AD&D 1e or Basic D&D's accepted edge vocabulary is forbidden.
  - >-
    Builder enforces the bounded Shadowdark shapes: spell to class_wizard or
    class_priest with `casting class`; spell to exactly one tier value with
    `spell tier`; and tier value to rule_spell_tier with `spell tier category`.
    It rejects a sys_ target, taxonomy-only target, wrong direction, wrong
    aspect, duplicate tier, missing tier, or an unsupported classification.
  - >-
    Do not create the tier nodes, edit source/GUR/GUP/Review/Approved/registry/
    canonical artifacts, add classifications for the existing 34 taxonomy-only
    identities, or touch basicdnd/rc during implementation.
acceptance_tests:
  - >-
    Constitution Version 1.6 or later defines CLASSIFIED_AS as directed,
    neutral, source-declared mechanically operative classification; states its
    individual-to-classification direction and bounded spell forms; and retains
    the explicit exclusion of sys axes, source-context groupings, and
    taxonomy-only membership.
  - >-
    Shadowdark edge, GUR, and GUP schemas admit CLASSIFIED_AS and current 1.6
    artifacts while preserving historical 1.0 through 1.5 admission. No other
    ruleset's edge vocabulary is widened.
  - >-
    Ruleset-scoped Builder polarity derives CLASSIFIED_AS as neutral/derived
    for Shadowdark without adding it to the AD&D 1e or Basic D&D vocabulary.
    Existing ruleset-specific vocabularies and all prior edge semantics remain
    unchanged.
  - >-
    Builder accepts only the three bounded Shadowdark classification forms,
    enforces one tier per spell and plural casting classes, and rejects each
    prohibited target, direction, aspect, cardinality, and unsupported member
    form with a specific finding.
  - >-
    Focused Builder regressions and the complete Builder suite pass. The
    implementation report records exact commands and outcomes; Reviewer
    independently reproduces the classification tests before approval.
acceptance_test_semantics:
  - acceptance_test_index: 1
    kind: versioned_contract_content
    contracts:
      - path: rulesets/shadowdark/governance/constitution.md
        minimum_version: '1.6'
        substantive_anchors:
          - CLASSIFIED_AS is a directed source-declared mechanically operative classification, not general taxonomy membership.
          - Spell casting class may be plural while each spell has exactly one discrete spell tier.
          - Taxonomy-only membership and sys-axis or source-context targets remain outside the graph.
