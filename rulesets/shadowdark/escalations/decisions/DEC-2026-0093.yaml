implementation_bounds:
  - >-
    Until DEC-2026-0092 receives terminal Reviewer approval, do not change the
    listed authority files, schemas, or current 1.2 prefix count. Do not stale
    that implementation's evidence.
  - >-
    At activation, Architect edits only the five listed authority/schema files.
    Do not edit Builder or Integrator code, profile thresholds, source packets,
    GURs, GUPs, Reviews, Approved bundles, registries, canonical data, other
    rulesets, or shared contracts.
  - >-
    No group, pantheon, membership, anonymous deity, unknown-alignment,
    placeholder, or alias identity is authorized. No basicdnd/rc work is
    authorized.
acceptance_tests:
  - >-
    After the DEC-2026-0092 Review gate, Shadowdark Constitution Version 1.3
    or later lists alignment_ as individual alignment and deity_ as individual
    deity; lists exactly the three alignment and seven named deity IDs in this
    Decision; keeps sys_alignment and sys_deity separate; and states that The
    Four Lords, The Dark Trio, The Nine, and The Lost are not graph identities.
    ruleset.yaml declares the same current version.
  - >-
    The Shadowdark edge schema accepts both new stems in either endpoint and
    rejects hyphenated, bare, anonymous, and unapproved-prefix forms. Its
    GUR/GUP schemas admit immutable 1.0 through 1.2 inputs and current 1.3
    output, rejecting an unknown future version without widening another
    ruleset.
  - >-
    The existing RulesetVocabulary loads all fifteen current Shadowdark
    prefixes, including alignment_ and deity_, from the Constitution; the
    existing Builder suite remains green without a code change. No AD&D or
    Basic D&D vocabulary gains either prefix.
  - >-
    The held packet's first GUR uses only the authorized individual identities
    where source text supports an edge, carries no collective or unknown
    placeholder identity, and follows ordinary independent Review. This is a
    downstream artifact requirement, not an Architect activation prerequisite.
acceptance_test_semantics:
  - acceptance_test_index: 1
    kind: versioned_contract_content
    contracts:
      - path: rulesets/shadowdark/governance/constitution.md
        minimum_version: '1.3'
        substantive_anchors:
          - alignment_ identifies a chosen individual alignment and remains separate from sys_alignment.
          - deity_ identifies a source-named individual deity and remains separate from sys_deity.
          - The Four Lords, The Dark Trio, The Nine, and The Lost are not graph identities or membership evidence.
          - The Lost never authorizes a singular, anonymous, or unknown-alignment deity node.
