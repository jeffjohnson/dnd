migration_required: false
migration_scope: >-
  Shadowdark canonical state is empty and no registry identity exists. No
  legacy artifact, source, GUR, GUP, Review, Approved bundle, registry, or
  canonical row is migrated, retracted, renamed, merged, repointed, or
  rewritten. The held packet later receives an ordinary first GUR after
  activation.
constitution_version_impact: >-
  Shadowdark Constitution advances from 1.2 to 1.3 after DEC-2026-0092 Review
  approval. The amendment is additive: it adds alignment_ and deity_ only to
  Shadowdark, lists the ten source-defined identities, preserves historical
  1.0 through 1.2 readability, and declares the collective/nonidentity
  boundary.
