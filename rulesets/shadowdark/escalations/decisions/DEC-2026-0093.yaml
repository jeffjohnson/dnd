request_origin:
  type: analyst_escalation
  summary: >-
    A claimed, defining Shadowdark packet names individual alignments and
    deities that no current prefix admits, so extraction is held rather than
    inventing identities.
question: >-
  Which individual alignment and deity identities may the Shadowdark graph
  represent, and how are the source-named collective groupings and the
  explicitly unnamed Lost handled?
ruling: >-
  Approve Option A. Add the Shadowdark-only `alignment_` prefix with machine
  kind `alignment` and the Shadowdark-only `deity_` prefix with machine kind
  `deity`. `sys_alignment` and `sys_deity` remain the axes or subsystems; they
  do not merge with individual members. The source-defined individual
  alignments are `alignment_chaotic`, `alignment_lawful`, and
  `alignment_neutral`. The source-defined individual deities are
  `deity_saint_terragnis`, `deity_gede`, `deity_madeera_the_covenant`,
  `deity_ord`, `deity_memnon`, `deity_ramlaat`, and `deity_shune_the_vile`.
  Their labels retain the source spelling and capitalization.

  Do not create individual or collective graph identities for The Four Lords,
  The Dark Trio, The Nine, or The Lost. The first three are source-named
  groupings, but the packet gives them no independently load-bearing mechanic
  and the graph has no membership edge type. The Lost explicitly denotes two
  unnamed deities, not one deity: `deity_the_lost`, anonymous deity nodes, and
  an unknown alignment are prohibited. The question-mark heading records an
  unknown source value; it is not a graph value. A later source that names an
  individual Lost deity follows ordinary `deity_` proposal and Review workflow.

  This ruling authorizes ordinary proposals only. It does not preapprove an
  alignment/deity edge, a priest eligibility rule, a grouping membership edge,
  a registry row, a canonical row, a general rule, or a hierarchy. Analyst
  extracts only explicit packet relationships under the existing edge
  vocabulary and Reviewer evaluates their direction and evidence normally.

  Publish this Decision now but defer the Constitution 1.3 activation until
  DEC-2026-0092 has a terminal approved implementation Review. Its active
  implementation acceptance test reads the current 13-prefix Constitution;
  changing that authority before review would invalidate its bounded evidence.
  After that Review, Architect applies the listed additive amendments and
  directly notifies Analyst that this held packet is ready for its first GUR.
rationale:
  - >-
    The three individual choices and seven individually headed named deities
    carry the source's operative alignment and priest statements. A dedicated
    individual kind keeps them separate from their systems and avoids treating
    deities as monsters without source support.
  - >-
    Collective names alone do not justify a new kind or an unapproved
    membership relation. Modeling The Lost as a single deity would contradict
    the source's statement that it refers to two unnamed individuals.
  - >-
    Deferring only activation preserves DEC-2026-0092's independent,
    exact-version evidence while allowing this bounded ontology ruling to be
    durable and ready.
