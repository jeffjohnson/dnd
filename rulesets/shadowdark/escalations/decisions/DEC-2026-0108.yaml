definitions:
  front-cover: >-
    The source steward declares that the identified printed page is the front cover of the
    publication. Where no printed game mechanics or rules are present, it supplies no source content
    for graph extraction.
  back-cover: >-
    The source steward declares that the identified printed page is the back cover of the
    publication. Where printed game content or tables appear on the back cover, that content remains
    eligible for graph extraction; otherwise, it supplies no source content.
semantic_bounds:
  - >-
    Only the source steward declares the classification. Pipeline roles preserve it; they do not invent
    cover markers to conceal unread, missing, uncertain, or mechanically difficult source material.
  - >-
    Use a genuine existing heading or an empty fenced Div with a reserved pN identifier. Bare
    class-bearing paragraph tokens remain invalid; arbitrary unknown classes on a page marker remain
    errors.
  - >-
    Retain the exact page number and class in packet.yaml composition metadata at claim under the
    existing manifest convention. The page stays in the packet's actual declared span and completeness
    accounting.
  - >-
    A classified front-cover page inside the declared span owes no graph-content or uncovered-page
    remediation unless mechanics are present. A back-cover page containing rules or tables (such as the
    CS2 Dead Bandit Treasure Table) remains subject to normal extraction profiles.
