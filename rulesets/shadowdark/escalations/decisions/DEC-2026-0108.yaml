question: >-
  Admit front-cover and back-cover into the closed page-class vocabulary as steward-authored,
  page-local intake metadata without creating graph nodes or excluding valid game content on covers
  (such as the Dead Bandit Treasure Table on CS2 page 68).
ruling: >-
  Approve OPT-A. The closed page-class vocabulary in contracts/SOURCE_MARKDOWN.md is expanded
  from three classes to five: full-page-artwork, page-intentionally-ignored, blank-page,
  front-cover, and back-cover. All five are page-local intake metadata with existing attachment,
  provenance, and in-span coverage rules. The front-cover class declares the front cover of the
  publication; where no game mechanics are present, it supplies no source content for graph
  extraction. The back-cover class declares the back cover of the publication; where printed game
  content or tables appear on the back cover (such as the Dead Bandit Treasure Table on CS2 page 68),
  that content remains eligible for ordinary graph extraction. Builder tooling and test suites
  are updated to recognize the five-class vocabulary.
rationale:
  - >-
    The repository source steward explicitly supplied front-cover and back-cover markers on incoming
    CS2 supplement packets.
  - >-
    A closed vocabulary preserves typo detection and auditable reasons for omitted graph content while
    accommodating standard publication cover structure.
  - >-
    Classification belongs to intake metadata, not to the ruleset ontology or canonical graph.
  - >-
    Game mechanics or tables printed on a back cover remain eligible for extraction according to source
    text and extraction profiles; cover classification does not suppress content extraction.
