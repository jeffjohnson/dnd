question: >-
  How must Shadowdark compiler tests retain coverage of both an approved fresh
  ancestry proposal and a subsequently registered canonical ancestry without
  making the Builder suite depend on the mutable live registry baseline?
ruling: >-
  Authorize Builder to correct only
  `tooling/builder/tests/test_shadowdark_ancestry.py`. Tests that exercise the
  current Shadowdark registry must assert canonical reuse for an already
  registered identity: no fresh `node_additions` proposal is expected, and the
  compiler's `node_proposal_resolved_to_canonical` result is correct.

  Tests that prove `ancestry_` permits an ordinary fresh proposal must construct
  an isolated pre-integration fixture with no matching canonical node. They may
  not rely on the live ruleset registry being header-only. A distinct
  same-label `monster_dwarf` still tests non-merger against `ancestry_dwarf`;
  its expected outcome is evaluated separately from the canonical ancestry.

  This is test-fixture maintenance after valid integrations, not a change to
  node identity, registry contents, compiler behavior, or DEC-2026-0087. The
  failed IMP-DEC-2026-0095-r01 remains immutable history. After this fixture
  repair passes the complete Builder suite, Builder publishes
  IMP-DEC-2026-0095-r02 as its successor; it may become approval-ready only if
  every DEC-2026-0095 acceptance test then passes.
rationale:
  - >-
    A live canonical registry necessarily changes as integrations succeed.
    Tests that assert a production identity is always unregistered become
    invalid precisely when the normal lifecycle is working.
  - >-
    Isolated fixtures preserve the original prefix and fresh-proposal coverage;
    current-state fixtures preserve canonical-reuse coverage. Neither state can
    stand in for the other.
  - >-
    DEC-2026-0095 correctly kept scanner work bounded. A separate Decision
    authorizes the unrelated test repair without waiving its complete-suite
    acceptance gate.
