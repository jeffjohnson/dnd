post_implementation_requirements:
  - >-
    IMP-DEC-2026-0095-r01 remains immutable failed evidence and must not be
    edited or approved. Its successor, rather than a waiver, establishes the
    restored complete-suite gate.
  - >-
    Future Shadowdark tests must not assume a live registry is empty merely
    because a ruleset began empty. Proposal tests use isolated baselines;
    current-state tests derive their expected canonical reuse from registered
    identities.
