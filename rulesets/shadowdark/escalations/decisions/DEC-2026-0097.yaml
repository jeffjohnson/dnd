migration_required: false
migration_scope: >-
  No graph, registry, packet, GUR, GUP, Review, Approved bundle, Integration,
  schema, contract, or production tool changes. Only one Builder test module
  and successor implementation reports change.
constitution_version_impact: None. The existing ancestry identity ruling is unchanged.
affected_contracts: []
affected_registries: []
implementation_bounds:
  - >-
    Builder changes only tooling/builder/tests/test_shadowdark_ancestry.py and
    publishes the two named Decision Implementation Reports.
  - >-
    Cover fresh-proposal semantics with an isolated, pre-integration fixture and
    current-state semantics with the actual registered Shadowdark identities.
  - >-
    Do not alter compiler code, test bootstrap shared by other modules,
    canonical data, registries, source artifacts, schemas, contracts, scanner,
    Integrator code, Herdr, or basicdnd/rc.
  - >-
    Do not loosen a test merely to make it pass. The updated tests must verify
    both canonical reuse and the permitted fresh-proposal path, including the
    ancestry-versus-monster non-merger case.
acceptance_tests:
  - >-
    In a self-contained fixture with no matching canonical identity, every
    DEC-2026-0087 ancestry ID is an ordinary `ancestry_` proposal with an
    approved prefix and no Architect escalation. The fixture setup does not
    read a mutable live nodes registry to establish this result.
  - >-
    Against the current Shadowdark registry, each of the six registered
    ancestry IDs is recognized as canonical reuse and reports
    `node_proposal_resolved_to_canonical`; no test asserts it is a fresh node
    addition or Reviewer registration candidate.
  - >-
    The same-label ancestry and monster test proves the canonical ancestry is
    not merged with `monster_dwarf`, while an unregistered monster remains an
    ordinary proposal.
  - >-
    The focused ancestry module and the complete Builder suite pass. The
    implementation report records exact commands and outcomes.
  - >-
    IMP-DEC-2026-0095-r02 supersedes r01, preserves all passed scanner evidence
    from r01 by exact reference, records a passing complete Builder suite, and
    is approval-ready only with all six DEC-2026-0095 acceptance tests passed.
