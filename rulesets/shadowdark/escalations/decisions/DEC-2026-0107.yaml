implementation_bounds:
  - >-
    Architect changes only this Decision, the decided escalation location, and
    contracts/WORK_QUEUES.md.
  - >-
    Builder changes only tooling/common/scan_agent_queues.py and
    tooling/common/tests/test_scan_agent_queues.py. It implements the bounded
    packet-update Review-lineage rule and publishes
    IMP-DEC-2026-0107-r01. It does not modify the packet's GUR, GUP, Review,
    Approved bundle, edge component, registry, canonical graph, or basicdnd/rc.
  - >-
    Reviewer independently reviews the exact implementation report and
    reproduces the scoped queue projection. It does not create a packet Review
    successor or repackage the existing Approved bundle.
  - >-
    Integrator receives the existing exact Approved bundle only after the
    implementation Review is terminally approved and Reviewer confirms the
    scoped projection has zero packet-lineage errors.
acceptance_tests:
  - >-
    WORK_QUEUES Version 1.36 or later allows an explicit packet-update Review
    successor to supersede a Review of the same or an ancestor GUP in the same
    validated packet lineage, and retains strict ruleset/book/packet scope,
    disconnected roots, and existing Decision-migration grouping.
  - >-
    The scanner correctly resolves a Review on GUP r03 revision 2 superseding
    a Review on ancestor GUP r01 revision 1 as one active Review leaf, without
    `missing_supersedes_target`; the earlier Review creates no second handoff.
  - >-
    Missing targets, cross-packet/book/ruleset links, non-ancestor or unrelated
    GUP links, duplicate IDs/revisions, revision collisions, and forks remain
    errors. Independent disconnected Review roots remain separate. Existing
    decision-migration Review routing and consumption are unchanged.
  - >-
    The scoped Monster Family Angels projection has no Reviewer job for GUP
    r03, has no lineage errors attributable to this packet, and has exactly one
    eligible Integrator item: the pinned Approved bundle whose manifest
    checksum binds the exact Review, GUP, and zero-row edge component. No other
    packet state changes because of these artifacts.
  - >-
    `python -m unittest tooling.common.tests.test_scan_agent_queues -v` passes;
    the implementation report records full output and the exact repository
    scoped projection, and Reviewer independently repeats both checks before
    approving the implementation report.
acceptance_test_semantics:
  - acceptance_test_index: 1
    kind: versioned_contract_content
    contracts:
      - path: contracts/WORK_QUEUES.md
        minimum_version: '1.36'
        substantive_anchors:
          - Packet-update Review supersession may cross GUP revisions only within one validated packet lineage and only to the same or an ancestor GUP.
          - Review links cannot cross ruleset, book, packet, or unrelated GUP lineage; disconnected roots remain separate.
          - Decision-migration Review lineages retain their existing grouping rules.
