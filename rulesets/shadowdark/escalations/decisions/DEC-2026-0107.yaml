question: >-
  How should the scanner resolve an explicit packet-update Review supersedes
  link when the successor reviews a later GUP revision than its predecessor,
  while keeping unrelated Review roots and migration Reviews independent?
ruling: >-
  Select OPT-A with a bounded packet-update rule. Within one exact
  ruleset/book/packet, an explicit Review `supersedes` link may cross GUP
  revisions when the predecessor Review's `reviewed_gup` is the same GUP or an
  ancestor in the successor Review's validated, explicit GUP supersession
  chain. Resolve those linked Review artifacts as one Review lineage
  component, enforce unique IDs and revision numbers, direct predecessor
  links, and one-successor fork rules, and select the component's active Review
  leaf. The selected leaf creates Reviewer or Integrator work only for the
  exact GUP it names.

  Review artifacts with no valid cross-GUP link remain in their existing
  GUP-scoped Review groups. A link cannot cross ruleset, book, packet, GUP
  lineage, or a decision-migration lineage. Do not infer cross-GUP links from
  filenames, revision numbers, timestamps, or proximity. Decision-migration
  Reviews retain their existing stable `lineage_id` behavior.

  For the pinned Monster Family Angels lineage, the active Review
  `REV-GUP-PKT-SD-195-195-monster-family-angels-r03-r02` is the valid leaf for
  `GUP-PKT-SD-195-195-monster-family-angels-r03`; its explicit predecessor
  `REV-GUP-PKT-SD-195-195-monster-family-angels-r01-r01` reviews ancestor GUP
  r01 in the same packet lineage. The exact already-published Approved bundle
  remains eligible for ordinary Integrator verification only after the
  scanner implementation is independently approved and the scoped projection
  validates. No published packet artifact is rewritten.
rationale:
  - >-
    Review artifact revisions describe successive review outcomes for a packet.
    A later GUP revision may preserve the same Review chain while the Review's
    exact input moves forward. A valid direct supersedes link already expresses
    this relation; requiring its predecessor to review the identical GUP
    revision rejects that explicit lineage.
  - >-
    Following only validated ancestor relationships retains provenance and
    prevents a Review from another packet, book, ruleset, independent GUP
    lineage, or future GUP from being joined by a convenient ID reference.
    Disconnected roots and strict missing-target/fork errors preserve
    fail-closed behavior.
  - >-
    The exact Review, GUP, Approved manifest, and zero-row edge component are
    immutable and checksum-consistent. Scanner-owned lineage interpretation
    is the correct repair surface; no Reviewer replacement, bundle rewrite,
    or canonical operation is needed.
