  canonical row, or Integration is changed. Builder changes only shared queue
  scanner logic and its tests, and publishes a Decision Implementation Report.
  Once its exact implementation Review is approved, Reviewer rechecks the
  scoped packet projection and notifies Integrator about the existing exact
  Approved bundle.
