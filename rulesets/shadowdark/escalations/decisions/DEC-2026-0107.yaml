    owner: architect
    action: >-
      Publish this Decision, activate WORK_QUEUES 1.36, and relocate the
      resolved immutable escalation to decided history.
  - step: 2
    owner: builder
    action: >-
      Implement validated cross-GUP explicit Review supersession for packet
      updates and focused positive/negative regressions; publish
      IMP-DEC-2026-0107-r01 with the full scanner module result and scoped
      Monster Family Angels queue projection.
  - step: 3
    owner: reviewer
    action: >-
      Independently review IMP-DEC-2026-0107-r01 and reproduce the focused
      cross-GUP lineage tests and scoped projection. If approved, return
      control to Reviewer for the originating packet, then notify Integrator
      about the exact existing Approved bundle.
post_implementation_requirements:
  - >-
    The implementation Review must reach terminal Approved status before
    Reviewer resumes the ordinary packet relay. Reviewer then verifies the
    current exact Review/GUP/Approved checksums and scoped scanner output; only
    then is the existing bundle sent to Integrator.
  - >-
    Integrator applies the pinned four node registrations and zero-row edge
    component through the ordinary transaction. It notifies Analyst only after
    successful terminal integration. No other packet starts before that
    integration completes.
