request_origin:
  type: builder_queue_bookkeeping_report
  summary: >-
    DEC-2026-0095 fully replaced DEC-2026-0094 step 2 but did not form a
    machine-readable Decision reissue lineage, leaving DEC-2026-0094 ready.
question: >-
  How is the already-replaced DEC-2026-0094 Builder handoff retired without a
  duplicate implementation report or any Stats artifact repair?
ruling: >-
  Reissue DEC-2026-0094 as this terminal Decision leaf. DEC-2026-0095 remains
  the sole controlling scanner implementation authorization, and
  IMP-DEC-2026-0095-r03 remains its active Reviewer-ready implementation
  report. No implementation report, Review, source, GUR, GUP, Approved bundle,
  rejection, Integration, registry, canonical change, or queue-tool edit is
  required for DEC-2026-0099.

  This formal `supersedes: DEC-2026-0094` lineage makes DEC-2026-0094
  immutable informational history under the existing Decision leaf rule. The
  terminal handoff means DEC-2026-0099 creates no downstream job. It does not
  supersede, consume, alter, or delay DEC-2026-0095.
rationale:
  - >-
    A free-text replacement in DEC-2026-0095 cannot suppress a separate
    Decision job. The existing Decision reissue mechanism is the exact durable
    representation for replacing DEC-2026-0094's executable step.
  - >-
    Requiring a second implementation report would duplicate completed scanner
    work and contradict the prior ruling that the stale Stats lineage is not
    repair work.
