    owner: architect
    action: >-
      Publish this Decision, activate Constitution 1.8, Shadowdark version
      metadata and schemas, update WORK_QUEUES 1.35, and relocate the resolved
      escalation to decided history.
  - step: 2
    owner: analyst
    action: >-
      Publish GUR-PKT-SD-189-189-monster-attributes-r02, superseding r01. It
      proposes `mstat_monster_level` and the one source-backed FEEDS_INTO row,
      preserves the independently supported dark-adapted and tier-inversion
      work, and does not encode a creature's printed stat-block values.
  - step: 3
    owner: builder
    action: >-
      Change only the scanner blocked-GUR route and focused regressions; publish
      IMP-DEC-2026-0105-r01 with focused and relevant-suite evidence.
  - step: 4
    owner: builder
    action: >-
      After the Analyst's active GUR successor is published, compile it through
      the normal packet lifecycle and hand the GUP only to Reviewer.
  - step: 5
    owner: reviewer
    action: >-
      Independently validate IMP-DEC-2026-0105-r01. Separately, review the
      ordinary packet GUP only after Builder publishes it; do not conflate the
      two lineages.
post_implementation_requirements:
  - >-
    After step 2, the originating packet resumes its ordinary Analyst -> Builder
    -> Reviewer -> Integrator relay. The active normal packet remains this one;
    Analyst does not select another packet while it is in progress.
  - >-
    The ordinary packet successor must use `mstat_monster_level` only for the
    explicit page-189 shared dependency. It must not create per-creature values,
    rows, or identities. Remaining monster packets apply the same boundary and
    escalate only a genuinely broader `mstat_` use.
  - >-
    Builder, Reviewer, and Integrator process the packet successor through the
    ordinary lifecycle. The Decision implementation report and the packet GUP
    are separate artifacts with separate approval paths.
