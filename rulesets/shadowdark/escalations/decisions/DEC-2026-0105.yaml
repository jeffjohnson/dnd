question: >-
  How does Shadowdark represent the shared monster-level mechanic without
  conflating it with character advancement or converting per-creature stat-block
  values into graph data; and how must queue tooling route an active blocked GUR?
ruling: >-
  Approve `mstat_` as the Shadowdark-only prefix for a shared creature statistic
  or rating that is the input to an explicit mechanic. Approve
  `mstat_monster_level` as the ordinary source-backed proposal for printed
  monster LV. The page-189 assertion is `mstat_monster_level FEEDS_INTO
  rule_hit_points` with aspect `hit point value` and condition `for a monster`.
  It records the stated relationship, not dice, a level number, or an individual
  monster's hit points.

  Individual creature stat-block values are not graph content merely because a
  stat block prints them. The existing shared identities remain the only
  representation for AC, HP, attacks, movement, modifiers, alignment,
  spellcasting, DC, and tier when an explicit dependency is present. A source
  statement that only describes a creature's fields or values produces no node,
  edge, property store, or completeness obligation. A further `mstat_` proposal
  is ordinary workflow only when it denotes a shared creature statistic or
  rating participating in an explicit dependency; any broader use requires a
  new Architect Decision.

  Confirm that a conforming blocked handoff is blocked work, not ordinary ready
  work, for every artifact kind. The active blocked monster-attributes GUR must
  not be inferred as `BUILDER-GUR`; its explicit Architect blocker remains the
  only current routing until this ruling is returned to Analyst.
rationale:
  - >-
    Monster LV is a fixed creature rating, not character advancement. Reusing
    `exp_level` would falsely connect a monster statistic to character titles,
    advancement, weapon mastery, and other progression assertions.
  - >-
    The page supplies one shared mechanical dependency but the chapter's stat
    blocks principally supply individual values. Recording those values would
    violate the graph's impact-analysis grain while adding hundreds of rows
    that do not identify a dependency affected by a rule change.
  - >-
    A dedicated bounded prefix keeps creature identity (`monster_`), character
    advancement (`exp_`), and a shared creature statistic (`mstat_`) distinct.
    It also lets ordinary workflow reuse current shared mechanic identities
    rather than duplicating them on every creature.
  - >-
    WORK_QUEUES already excludes blocked artifacts from ready work. Making the
    routing rule explicit and testing GUR handling prevents a scanner fallback
    from contradicting the artifact's authoritative handoff.
