implementation_bounds:
  - >-
    Architect changes only this Decision, the resolved escalation location,
    Shadowdark governance, its version metadata and schemas, and the shared
    queue contract.
  - >-
    Builder changes only `tooling/common/scan_agent_queues.py` and its focused
    tests. It routes a conforming active blocked GUR as one blocked item for
    its declared role and never infers a Builder GUR job. It must make no
    source, GUR, GUP, Review, registry, canonical, compiler, or basicdnd/rc
    change.
  - >-
    Analyst may publish the ordinary GUR successor after Architect step 1. The
    scanner repair is not a prerequisite for the source successor: the current
    explicit GUR blocker, this Decision, and its resulting source boundary are
    already authoritative.
acceptance_tests:
  - >-
    Constitution Version 1.8 or later defines `mstat_` as a shared creature
    statistic or rating used by an explicit mechanic, authorizes
    `mstat_monster_level` for the Monster Attributes reading, and excludes
    individual creature stat-block values and generic property storage.
  - >-
    Shadowdark ruleset metadata and GUR/GUP schemas admit current 1.8 artifacts
    while preserving historical 1.0 through 1.7 admission. No other ruleset
    prefix or vocabulary changes.
  - >-
    The scanner emits exactly one blocked, non-ReadyCount item for a conforming
    active blocked GUR, preserves its declared next role and blocking IDs, and
    emits neither `BUILDER-GUR` nor legacy handoff inference. Existing ready,
    terminal, malformed, and legacy GUR behavior remains unchanged.
  - >-
    Focused scanner regressions and the complete relevant scanner suite pass.
    The Builder implementation report records exact commands and outcomes, and
    Reviewer independently reproduces the focused blocked-GUR regressions.
acceptance_test_semantics:
  - acceptance_test_index: 1
    kind: versioned_contract_content
    contracts:
      - path: rulesets/shadowdark/governance/constitution.md
        minimum_version: '1.8'
        substantive_anchors:
          - mstat_ names a shared creature statistic or rating used by an explicit mechanic.
          - mstat_monster_level may feed monster hit-point calculation without storing numeric values.
          - Individual creature stat-block values remain outside graph content and property storage.
  - acceptance_test_index: 3
    kind: versioned_contract_content
    contracts:
      - path: contracts/WORK_QUEUES.md
        minimum_version: '1.35'
        substantive_anchors:
          - A conforming blocked handoff creates only blocked work for its declared next role.
          - A blocked active leaf contributes nothing to ReadyCount and never falls through to ordinary or legacy routing.
