  - {path: tooling/integrator/src/adnd1e_integrator/bundles.py, checksum: sha256:c04cf9b9e14e9ceb65650a69ec4de9af61c62fde824f1b8d0cd00f339d901820, role: bounded_integrator_implementation_surface}
