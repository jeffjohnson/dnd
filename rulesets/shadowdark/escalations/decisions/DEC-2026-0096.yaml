    INT-20260922-002 remains the terminal Stats integration. r05-r01 through
    r05-r04 and INT-20260922-001 remain immutable informational history.
  - >-
    Future legacy bundle lineages use the same bounded, reported inference and
    continue through ordinary Review and Integration controls.
