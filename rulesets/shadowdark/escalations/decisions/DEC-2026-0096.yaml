question: >-
  Must Integrator bundle discovery apply the existing bounded legacy rNN
  leaf-resolution rule to manifested Approved bundles that lack complete
  revision metadata, and who owns that implementation?
ruling: >-
  Yes. Integrator bundle discovery must apply the same active-leaf semantics
  already confirmed in DEC-2026-0095: resolve explicit `supersedes` first, then
  apply WORK_QUEUES Legacy Queue Derivation clause 2 only within one artifact
  kind, ruleset, book, and packet when a manifested Approved lineage lacks
  complete revision metadata. The inferred result must be reported as a legacy
  revision inference; it must never be silently converted into a ready bundle.

  For the immutable Stats lineage, the rNN sequence places r05-r01 through
  r05-r05 and r05-r05 remains the sole active leaf. INT-20260922-002 already
  consumes r05-r05. r05-r01 through r05-r04 remain informational history, not
  eligible integration, rejection remediation, manifest repair, or canonical
  work.

  Integrator owns the bounded implementation in its bundle-discovery surface;
  Reviewer independently verifies it. This does not alter DEC-2026-0095, whose
  Builder-owned scanner scope remains intact.
rationale:
  - >-
    Core Rules 3, 4, and 6 apply to every queue derivation. Leaving the
    Integrator without the existing legacy fallback creates a permanent phantom
    job that a stateless successor cannot safely distinguish from real work.
  - >-
    The bounded rule is deterministic and does not infer source facts or modify
    published lineage. Existing post-operation duplicate checks remain a
    defense in depth, not the normal way to reject an item that should be
    classified as history before integration.
  - >-
    A separate Decision preserves DEC-2026-0095's exact Builder scope and
    assigns the Integrator-owned surface to its actual owner.
