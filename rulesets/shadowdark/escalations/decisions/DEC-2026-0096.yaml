migration_required: false
migration_scope: >-
  No source, packet, GUR, GUP, Review, Approved manifest, rejection,
  Integration manifest, Integration record, registry, or canonical row changes.
  The implementation changes only derived Integrator queue classification.
constitution_version_impact: None. This aligns queue derivation with existing workflow rules.
affected_contracts: []
affected_registries: []
implementation_bounds:
  - >-
    Integrator changes only tooling/integrator/src/adnd1e_integrator/bundles.py
    and tooling/integrator/tests/test_bundles.py.
  - >-
    Apply explicit manifest `supersedes` before bounded legacy rNN resolution.
    The fallback is limited to matching Approved kind, ruleset, book, and
    packet; it never uses timestamps, filenames alone, source resemblance, or
    a cross-book comparison.
  - >-
    Expose the inference in the normal Integrator queue result, including the
    affected historical bundle and the selected leaf. A legacy inference cannot
    be silent.
  - >-
    Preserve manifestless legacy component discovery, existing AD&D bundle
    classifications, declared Review linkage, and declared Integration
    consumption behavior.
  - >-
    Do not modify the scanner, Stats artifacts, canonical files, schemas,
    contracts, Reviewer tooling, Builder tooling, Herdr, or basicdnd/rc.
acceptance_tests:
  - >-
    `contracts/WORK_QUEUES.md` Version 1.32 or later retains Core Rules 3, 4,
    and 6 plus Legacy Queue Derivation clauses 1 through 3. Integrator applies
    those anchors before reporting a manifested Approved bundle as ready.
  - >-
    The Stats r05-r01 through r05-r05 fixture resolves exactly one active
    manifest leaf, r05-r05. r05-r01 and r05-r02 are placed using a reported
    legacy rNN inference; r05-r03 and r05-r04 are placed by explicit
    `supersedes`; no historical member reaches the ready queue.
  - >-
    INT-20260922-002 continues to classify r05-r05 as integrated. Its shared
    r05-r01 component path does not make r05-r01 integrated, and no Stats
    artifact is re-applied, repaired, moved, or rewritten.
  - >-
    A matching same-kind, ruleset, book, and packet legacy sequence may infer
    a leaf, while differing book, packet, kind, malformed revision, ambiguous
    lineage, and timestamp-only cases do not create a fallback. Existing AD&D
    ready, superseded, rejected, integrated, and manifestless-legacy fixtures
    retain their classifications.
  - >-
    Focused Integrator bundle tests and the complete Integrator suite pass.
    IMP-DEC-2026-0096-r01 records exact commands and outcomes; Reviewer
    independently reproduces the relevant tests.
acceptance_test_semantics:
  - acceptance_test_index: 1
    kind: versioned_contract_content
    contracts:
      - path: contracts/WORK_QUEUES.md
        minimum_version: '1.32'
        substantive_anchors:
          - Only the active leaf revision of an artifact can create work.
          - A revision is a leaf when no later artifact of the same kind names its ID in `supersedes`.
          - Superseded, consumed, reviewed, integrated, failed, and blocked artifacts are not ready work for the ordinary downstream role.
          - When `supersedes` is absent, infer the latest `rNN` only within one artifact kind and packet.
          - Never infer order from creation or modification time.
handoff:
