migration_required: false
migration_scope: >-
  No graph, registry, source, packet, GUR, GUP, Review, Approved manifest,
  rejection, Integration manifest, Integration record, or canonical row is
  changed. Queue output is derived state only.
constitution_version_impact: None. Queue derivation changes no ontology or constitution text.
affected_contracts: []
affected_registries: []
implementation_bounds:
  - >-
    Builder changes only tooling/common/scan_agent_queues.py and
    tooling/common/tests/test_scan_agent_queues.py.
  - >-
    Read `approves.review_id` and validate its optional declared checksum;
    retain filename linkage only for manifestless legacy bundles. Do not add a
    second authoring convention or treat compatibility fields as authoritative.
  - >-
    Resolve manifested Approved leaves from explicit lineage and the existing
    bounded legacy rNN rule before all downstream queue effects.
  - >-
    Derive integrated IDs from declared `bundle_id` fields in parsed Integration
    manifests and integrated records. Do not infer from arbitrary strings,
    component names, modification time, or an `APPROVED-` filename prefix.
  - >-
    Do not touch Stats, canonical, schemas, contracts, compiler, reviewer,
    integrator, Herdr, or basicdnd/rc files.
acceptance_tests:
  - >-
    `contracts/WORK_QUEUES.md` Version 1.32 or later retains Core Rules 3, 4,
    and 6 plus Legacy Queue Derivation clauses 1 through 3. The scanner honors
    those anchors for manifested Approved bundles.
  - >-
    A manifest declaring only `approves.review_id` resolves that exact Review;
    a conflicting filename stem, top-level field, or provenance field cannot
    select another Review. A declared review checksum mismatch is diagnostic
    and yields no ready downstream work. Manifestless legacy bundles retain
    their reported filename fallback.
  - >-
    The five Stats manifests resolve to exactly one active leaf, r05-r05. The
    explicit r05-r03 through r05-r05 links and legacy rNN placement of r05-r01
    and r05-r02 yield `legacy_revision_inference`; r05-r01 through r05-r04 are
    informational and create no Integrator or Reviewer work.
  - >-
    INT-20260922-002 consumes only r05-r05 whether read from its Integration
    manifest or INT-prefixed integration record. Its r05-r01 component path
    does not mark r05-r01 integrated. No Stats lineage member is a ready
    Integrator item.
  - >-
    A valid exact active Integration Rejection yields one Reviewer remediation
    item; a successor Review that pins that exact rejection consumes it. The
    r05-r04 rejection and its recorded r05-r03 Review successor are
    informational history. Missing, stale, mismatched, wrong-ruleset, or
    ambiguous rejection evidence suppresses nothing.
  - >-
    Focused queue-scanner regressions and the complete common and Builder test
    suites pass. The Decision Implementation Report records exact commands and
    outcomes; Reviewer independently reproduces the relevant tests.
acceptance_test_semantics:
  - acceptance_test_index: 1
    kind: versioned_contract_content
    contracts:
      - path: contracts/WORK_QUEUES.md
        minimum_version: '1.32'
        substantive_anchors:
          - Only the active leaf revision of an artifact can create work.
          - A revision is a leaf when no later artifact of the same kind names its ID in `supersedes`.
          - Superseded, consumed, reviewed, integrated, failed, and blocked artifacts are not ready work for the ordinary downstream role.
          - When `supersedes` is absent, infer the latest `rNN` only within one artifact kind and packet.
          - Never infer order from creation or modification time.
