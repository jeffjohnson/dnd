question: >-
  What must queue derivation treat as authoritative for an Approved bundle's
  Review, active leaf, and integration consumption, including the legacy
  Stats lineage with incomplete manifest revision metadata?
ruling: >-
  Approve the bounded three-part scanner correction. For a manifested Approved
  bundle, `approves.review_id` is its sole approving-Review identity. When an
  optional `approves.review_checksum` is present, it must match that exact
  Review. Top-level or provenance Review fields and filename stems cannot
  replace a manifest-declared Review. Filename-derived Review linkage remains
  only a reported fallback for a manifestless legacy bundle.

  Resolve an Approved manifest's own active leaf before Review, rejection, or
  integration queue derivation. Apply explicit `supersedes` links first. For
  this historical same-kind, same-packet lineage, WORK_QUEUES Legacy Queue
  Derivation clause 2 places r05-r01 through r05-r05 by their rNN sequence,
  reports `legacy_revision_inference`, and selects r05-r05 as the sole active
  leaf. r05-r01 through r05-r04 are immutable informational history, not
  repair or integration work.

  Integration consumption derives only from declared bundle identities:
  `approved_bundles[].bundle_id` in an Integration manifest and `bundle_id` in
  an Integration record with integrated status. Parse eligible records by
  content, not a filename prefix. Do not regex-harvest an `APPROVED-` substring
  from arbitrary strings, including component paths. Thus INT-20260922-002
  consumes only APPROVED-GUP-PKT-SD-015-015-stats-and-stat-modifiers-r05-r05;
  its shared r05-r01 edges component does not consume r05-r01.

  This Decision replaces DEC-2026-0094 step 2 as the controlling Builder
  authorization for the same Stats queue-scanner work. DEC-2026-0094 and all
  published Stats workflow artifacts remain immutable; no reissue, repair,
  re-integration, canonical mutation, schema change, or contract amendment is
  authorized.
rationale:
  - >-
    The Approved-bundle schema requires `approves.review_id`; filename guesses
    can select a Review that the manifest never named and let unrelated
    publication change a byte-identical bundle's queue state.
  - >-
    WORK_QUEUES requires only an active leaf to create work and already defines
    rNN inference for legacy artifacts lacking complete revision metadata.
  - >-
    An integration records its consumed bundle explicitly. Component paths and
    record filenames are not provenance fields and cannot safely establish
    consumption.
