implementation_bounds:
  - >-
    Architect changes only this Decision, the resolved escalation location, and
    the two production-edge endpoint patterns.
  - >-
    Reviewer changes only the Review lineage and the first Approved-bundle
    components for the existing immutable GUP. Reviewer must not edit the GUR,
    GUP, source, schema, registry, canonical graph, or basicdnd/rc.
  - >-
    No Builder implementation report or GUP revision is authorized. The active
    IMP-DEC-2026-0105 scanner-correction lineage is independent and unchanged.
acceptance_tests:
  - >-
    The current Shadowdark production edge schema accepts syntactically valid
    `mstat_` source and target IDs and retains every prior approved prefix and
    invalid-ID rejection behavior.
  - >-
    A schema validation fixture accepts M001 in its actual source position and
    a synthetic valid `mstat_` target position, while an unapproved prefix still
    fails in each position.
  - >-
    Reviewer publishes REV-GUP-PKT-SD-189-189-monster-attributes-r01-r02
    against the exact immutable GUP checksum, records the now-passing schema
    validation, approves M001 through M003 and both proposed identities, and
    creates the first exact Approved bundle for Integrator.
handoff:
