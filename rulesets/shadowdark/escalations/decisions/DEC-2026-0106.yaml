question: >-
  May the Shadowdark production edge schema admit the already authorized
  `mstat_` prefix in both endpoint positions so the Monster Attributes GUP can
  proceed through its ordinary Review and integration lifecycle?
ruling: >-
  Approve the narrow schema correction. `schemas/shadowdark/graph/edge.schema.json`
  admits `mstat_` in both `source_id` and `target_id` patterns, matching
  Constitution 1.8 and DEC-2026-0105. No edge type, prefix meaning,
  classification form, registry format, GUR/GUP schema, canonical row, or
  source artifact changes.

  This is a corrective completion of DEC-2026-0105's approved `mstat_` scope,
  not an expansion. It permits M001 exactly as reviewed:
  `mstat_monster_level FEEDS_INTO rule_hit_points` on `hit point value`,
  conditioned `for a monster`. The ordinary Reviewer successor must revalidate
  the unchanged GUP against this schema before issuing its Approved bundle.
rationale:
  - >-
    DEC-2026-0105 already authorized the first `mstat_` identity and its
    source-backed dependency. The edge schema's omission is a production
    representation defect, not new evidence or an unresolved ontology choice.
  - >-
    Endpoint admission in both directions is required for a prefix to be a
    normal graph identity. Limiting it to M001's source position would create a
    one-sided schema convention unrelated to the Constitution's shared
    creature-statistic kind.
  - >-
    Reusing the immutable GUP and publishing a Reviewer successor preserves
    independent source review and does not fabricate a Builder revision for a
    schema-only correction.
