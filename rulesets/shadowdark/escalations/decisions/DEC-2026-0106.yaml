  readiness: ready
  reason: >-
    Reviewer revalidates the immutable Monster Attributes GUP under the
    corrected production schema, publishes its approval successor and exact
    first Approved bundle, then hands only that bundle to Integrator.
  blocking_ids: []
sequence:
