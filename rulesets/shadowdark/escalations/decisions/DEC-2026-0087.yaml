approved_prefix:
  prefix: ancestry_
  kind: character ancestry
  machine_kind: ancestry
  ruleset_id: shadowdark
  scope: source-defined playable ancestry options; not creature families or classes
approved_identities:
  - {id: ancestry_dwarf, label: Dwarf, page: 16, benefit_id: abil_stout, benefit_label: Stout}
  - {id: ancestry_elf, label: Elf, page: 16, benefit_id: abil_farsight, benefit_label: Farsight}
  - {id: ancestry_goblin, label: Goblin, page: 16, benefit_id: abil_keen_senses, benefit_label: Keen Senses}
  - {id: ancestry_half_orc, label: Half-Orc, page: 16, benefit_id: abil_mighty, benefit_label: Mighty}
  - {id: ancestry_halfling, label: Halfling, page: 17, benefit_id: abil_stealthy, benefit_label: Stealthy}
  - {id: ancestry_human, label: Human, page: 17, benefit_id: abil_ambitious, benefit_label: Ambitious}
identity_bounds:
  - >-
    HALF-ORC normalizes to half_orc under this ruleset's existing snake_case
    grammar; preserve the source hyphen in the label. ancestry_half-orc and
    ancestry_halforc are not alternate IDs. No cross-ruleset alias is created.
  - >-
    The six ancestry names are approved for ordinary node proposals, not
    pre-registered canonical rows or a globally closed membership registry.
    Further source-defined ancestries use this kind through ordinary workflow.
  - >-
    The six bold named benefits are separately source-addressable mechanics.
    Use the listed abil_ identities and the existing ability kind. Do not
    duplicate their mechanics both as direct ancestry effects and as benefit
    effects solely to create a transitive shortcut. No automatic inheritance
    or general rule is authorized.
  - >-
    Analyst may express an ancestry's eligibility for its named benefit with
    existing GATES semantics; this is not evidence that no other source can
    grant a similar benefit. Extract the benefit's actual dependencies with
    existing edge semantics and source evidence. No GRANTS, HAS or MEMBER_OF
    edge is added. Detailed edge choices, conditions and polarity remain
    Analyst extraction and independent Reviewer work, not preapproved here.
  - >-
    A creature sharing an ancestry's label is not the same identity. Do not
    merge or resolve it to an ancestry by label similarity. This ruling does
    not register or infer any monster entry from filenames or flavour prose.
  - >-
    Keep character_races.yaml inactive and unchanged; it neither blocks these
    node proposals nor creates human/demihuman groups or class membership.
    Do not import another ruleset's race taxonomy or activate inheritance.
compatibility:
  new_artifacts: New Shadowdark GURs and GUPs declare current Constitution 1.1.
  historical_gurs: >-
    Admit Shadowdark GURs declaring 1.0 as immutable historical inputs and
    revalidate every candidate under the current 1.1 constitution. Report the
    older input version; stamp new output with the current version. Do not
    accept arbitrary unknown or future versions, bypass validation or rewrite
    the old GURs, packet manifests or their source bytes.
  schema_history: >-
    Shadowdark GUR and GUP structural schemas accept exactly 1.0 and 1.1 at
    this amendment so historical artifacts remain readable; this is not
    permission to author new 1.0 output. Artifact schema_version stays 1.0.
  unaffected_inputs:
    - GUR-PKT-SD-011-014-character-overview-and-starting-level-r01
    - GUR-PKT-SD-015-015-stats-and-stat-modifiers-r01
  implementation_gate: >-
    No ancestry packet GUP may be published before this implementation has an
    exact Approved implementation Review. Isolated synthetic and read-only
    dry compilation is required test evidence, not publication or activation
    of canonical state. Analyst extraction does not depend on that Review.
migration_required: false
migration_scope: >-
  No canonical files exist and nodes.csv is header-only at ruling. No node
  registration, rename, merge, repoint, graph initialization, source edit or
  immutable artifact revision is authorized. Future nodes and edges follow
  GUR, GUP, independent Review and Integrator transaction. Bootstrap support
  remains a separate gate under Constitution section 8.
constitution_version_impact: Shadowdark 1.0 to 1.1 only; additive identity vocabulary and explicit historical-input compatibility.
affected_contracts:
  - rulesets/shadowdark/governance/constitution.md
  - rulesets/shadowdark/ruleset.yaml
  - schemas/shadowdark/graph/edge.schema.json
  - schemas/shadowdark/graph/gur.schema.json
  - schemas/shadowdark/graph/gup.schema.json
affected_registries: []
implementation_bounds:
  - >-
    Use the active RulesetVocabulary for compiler node-kind, prefix approval,
    carried-forward and revision-proposal checks and governance identity
    discovery. Thread the scope through existing helpers rather than adding
    ancestry_ to global AD&D constants. Preserve existing AD&D default callers.
  - >-
    Update only the four named Builder modules where needed and add focused
    tests in test_shadowdark_ancestry.py. Preserve unrelated pending edits.
    Registry.py is read-only tooling, not permission to edit nodes.csv.
  - >-
    Keep this implementation separate from DEC-2026-0084. Do not edit shared
    SOURCE_MARKDOWN, queue semantics, Integrator code, other rulesets' schemas
    or live RC packets. Regression fixtures do not authorize RC processing.
acceptance_tests:
  - >-
    Shadowdark Constitution Version 1.1 or later authorizes ancestry_ as a
    character ancestry, distinguishes it from class_, monster_ and sys_ancestry,
    defines the six IDs including ancestry_half_orc and separate abil_ benefits,
    preserves the inactive race registry and no-inheritance boundary, and
    allows strict current revalidation of historical 1.0 GURs. ruleset.yaml
    declares the same current constitution version.
  - >-
    Shadowdark edge schema accepts all six ancestry IDs in either endpoint and
    rejects ancestry_half-orc, unsupported prefixes and invalid grammar. The
    source-specific ancestry_halforc misspelling is an identity-review error,
    not a reason to replace the open ancestry stem grammar with six constants.
    Its GUR/GUP schemas admit historical 1.0 and current 1.1, reject an unknown
    version, and retain the other envelope constraints. No other ruleset's
    schema, global prefix vocabulary or edge semantics is widened.
  - >-
    Parameterized synthetic Shadowdark compile tests isolate each of the six
    node proposals as machine kind ancestry, prefix_approved true and ordinary
    Reviewer-approvable registration, never an unapproved-prefix escalation.
    Exercise fresh, carried-forward and revision paths plus both endpoints;
    retain source page, spelling and named benefit IDs. Use synthetic fixtures
    for executable row assertions rather than declaring this Decision a Review.
  - >-
    Prefix recognition and governance holding/discovery are ruleset-scoped:
    a synthetic unresolved Shadowdark ancestry identity escalation is recognized
    and still blocks its dependent work; an unsupported prefix still fails;
    ancestry_ is not newly approved in adnd1e or basicdnd. Existing default
    AD&D helper behavior is unchanged and name similarity causes no merge.
  - >-
    The two named immutable Shadowdark 1.0 GURs dry-compile under the current
    vocabulary without constitution_version_mismatch and without source or
    GUR edits. Any unrelated finding remains visible. New output records the
    current constitution and the old input version; an unknown future version
    still fails. No published GUP is needed to evidence this test.
  - >-
    All focused tests and the complete Builder suite pass, with exact commands
    and outcomes in the Report. Report unrelated failures rather than weakening
    gates. Verify the Architect-owned governance and schema changes as inputs;
    retain the source, packet manifest, node registry and existing artifacts
    unchanged and create no canonical state. Evidence all tests before approval.
acceptance_test_semantics:
  - acceptance_test_index: 1
    kind: versioned_contract_content
    contracts:
      - path: rulesets/shadowdark/governance/constitution.md
        minimum_version: '1.1'
        substantive_anchors:
          - ancestry_ identifies a character ancestry, separate from classes, creatures and the ancestry subsystem.
          - Six source-defined ancestry IDs include ancestry_half_orc and separately named abil_ benefits.
          - No automatic inheritance or activation of the inactive character-race registry.
          - Historical 1.0 GURs require current validation; new artifacts declare the current version.
sequence:
  - step: 1
    owner: architect
    action: >-
      Publish this Decision, apply Constitution 1.1, matching ruleset manifest
      and the three schema edits, and move the unchanged escalation to decided.
  - step: 2
    owner: builder
    action: >-
      Implement the bounded ruleset-scoped prefix and historical-input alignment.
      Verify the preceding Architect files and all six acceptance tests. Publish
      IMP-DEC-2026-0087-r01 and its validation report, then route Reviewer.
  - step: 3
    owner: reviewer
    action: >-
      Independently verify the exact implementation and every test, including
      structured versioned-contract-content evidence for test 1, then publish
      its implementation Review. No ancestry GUP or source extraction is a
      prerequisite for approval. Return defects to Builder through normal lineage.
  - step: 4
    owner: analyst
    action: >-
      Complete the existing PKT-SD-016-017-ancestries claim and publish its first
      GUR under 1.1, citing this Decision and the decided escalation. Preserve
      the source/manifest, candidate cross-GUR dependencies and marker pages.
      This is ready after step 1 but scheduled serially after implementation
      approval; no new claim or second escalation for the same prefix is needed.
  - step: 5
    owner: builder
    action: >-
      After step 3, compile the ordinary Shadowdark GURs in dependency order:
      stats before overview before ancestries. Do not duplicate cross-GUR
      identities or treat proposals as registered. Normal Review/Integration
      and independently verified new-ruleset initialization remain required.
post_implementation_requirements:
  - Analyst's GUR and subsequent GUPs, Reviews and Integrations are ordinary downstream artifacts, never IMP acceptance prerequisites.
  - No further Architect activation is required for this identity amendment after implementation approval.
  - DEC-2026-0084 remains independent and still requires its own Reviewer approval and final Architect source-contract activation.
coordination_constraints:
  - Only one role runs at a time; defer one handoff until the sender is idle.
  - Respect DEC-2026-0086; no RC processing or cleanup, including existing claims.
  - Finish this implementation and its Review before another code-edit job can stale its unapproved evidence.
  - Then retain DEC-2026-0084 and its Review/Architect activation as the next tooling chain before new packet compilation.
follow_up_owners:
  builder: [Implement scoped validation and compatibility, then compile ordinary packets after the stated gates.]
  reviewer: [Independently approve implementation evidence and later packet assertions.]
  analyst: [Complete the existing ancestry claim using the approved identities and source-defined benefits.]
  integrator: [Apply only ordinary approved bundles after independently verified new-ruleset initialization support.]
changelog:
  - Added the Shadowdark-only ancestry_ kind and six exact source-supported IDs.
  - Confirmed separate named abil_ benefits without new edges, membership registries or inheritance.
  - Aligned endpoint schemas and historical artifact readability with Constitution 1.1.
  - Assigned the narrow compiler alignment and preserved immutable 1.0 GUR inputs.
