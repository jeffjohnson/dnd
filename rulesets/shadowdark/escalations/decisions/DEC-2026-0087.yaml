escalation_id: ESC-2026-09-21T02.32.54.741Z
question: >-
  How are Shadowdark's six source-defined playable ancestries and their named
  benefits identified without conflating ancestry, class, subsystem or creature?
ruling: >-
  Approve OPT-A: ancestry_ is a Shadowdark-only approved prefix whose kind is
  character ancestry (machine kind ancestry). Use the six identities below,
  including ancestry_half_orc. Keep sys_ancestry as the subsystem and monster_
  for independently source-defined creatures. Model each independently named
  mechanical benefit under the existing abil_ prefix, not as copied rule prose
  or numeric ancestry properties. Amend Shadowdark Constitution to 1.1 and align
  its edge and artifact schemas now. Builder must align ruleset-scoped prefix
  checks and preserve revalidation of immutable 1.0 GURs under the current
  constitution; do not require no-op Analyst reissues. No other ruleset gains
  ancestry_, and this Decision does not register nodes or approve packet edges.
rationale:
  - The defining packet names six ancestry choices with distinct languages and named benefits.
  - Individual character options are not the ancestry subsystem, classes, procedures or creature entries.
  - A dedicated prefix solves the recurring six-member identity need without a new edge type.
  - Named benefits are abilities under the existing kind; separating them preserves their mechanical dependencies.
  - >-
    Unlike the escalation's anticipated schema impact, edge.schema.json has a
    closed prefix pattern, and GUR/GUP schemas pin version 1.0. Both need alignment.
  - >-
    RulesetVocabulary loads the local prefix table, but compiler node-proposal
    checks and governance identity discovery still use the global AD&D list.
    Adding ancestry_ to that global list would incorrectly authorize it elsewhere.
handoff:
  next_role: builder
  readiness: ready
  reason: >-
    Step 2 aligns compiler identity checks and historical GUR compatibility with
    the Architect-published governance/schema amendment. Analyst may author the
    ancestry GUR under 1.1, but its production compilation awaits independent
    approval of this implementation. No RC work is authorized.
  blocking_ids: []
