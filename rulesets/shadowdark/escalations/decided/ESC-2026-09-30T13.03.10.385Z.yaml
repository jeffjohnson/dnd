question: >-
  May schemas/shadowdark/graph/edge.schema.json be amended to admit the
  DEC-2026-0105-authorized mstat_ prefix in both source_id and target_id, so
  M001 can enter production under the ordinary packet lifecycle?

smallest_relevant_source_excerpt: >-
  Page 189: "Calculate a monster's hit points (HP) by rolling a number of d8s
  per monster level (LV) and adding its CON modifier (minimum 1)."

why_this_is_architectural: >-
  DEC-2026-0105 made mstat_ an approved prefix and explicitly required the
  ordinary successor to use mstat_monster_level for this page-189 dependency.
  Its exact_diff admitted Constitution, ruleset, GUR-schema, and GUP-schema
  changes, but did not include the Architect-owned production edge schema.
  The resulting constitution/schema disagreement cannot be corrected by
  Reviewer, Builder, or Integrator and directly blocks a source-supported row.

