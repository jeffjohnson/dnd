    because mstat_monster_level does not match the source_id pattern.
  decision_boundary: >-
    DEC-2026-0105 explicitly authorizes the exact M001 identity and dependency,
    while its exact_diff omits schemas/shadowdark/graph/edge.schema.json.

options_considered:
  - id: OPT-A
    summary: Admit mstat in both production edge endpoint patterns.
    consequences: >-
      Aligns the production schema with Constitution 1.8 and DEC-2026-0105,
      unblocks M001, and permits future separately governed mstat_ uses. The
      amendment should preserve every other pattern and validate synthetic
      source- and target-position fixtures.
  - id: OPT-B
    summary: Revoke or narrow DEC-2026-0105 so mstat_ cannot be an edge endpoint.
    consequences: >-
      Keeps the current edge schema unchanged but contradicts the Decision's
      required page-189 dependency and requires a replacement representation
      or omission ruling for M001.

recommended_resolution: >-
  Recommend OPT-A as a narrow corrective Decision: add mstat to both endpoint
  patterns in schemas/shadowdark/graph/edge.schema.json, preserve all existing
  admissions and rejections, and test mstat_ in both directions. After that
  prerequisite is implemented and independently verified, return this packet
  to Reviewer for a successor approval Review of the same immutable GUP.

expected_migration_impact: >-
  No canonical row or registry row is rewritten. The schema amendment enables
  the already authorized first mstat_ registration and M001 through the normal
  Approved-bundle transaction. M002 and M003 remain unchanged.

constitution_registry_or_profile_change: >-
  OPT-A changes only the Shadowdark production edge schema and its focused
  tests; Constitution 1.8, the registry format, extraction profile, GUR, GUP,
  and canonical data require no change.
