what_cannot_currently_be_expressed:
  - >-
    Which languages any ancestry or class actually supplies. Eight published rows say that an
    ancestry or class feeds the language axis; not one can say that a dwarf knows Dwarvish. This is
    the largest concrete loss.
  - >-
    That a language is common or rare. The distinction is mechanical, not descriptive: the wizard
    entry grants a stated number of each, and the priest's three options are all rare ones. It could
    be carried by two table identities without individual languages, which is the narrow OPT-B below.
  - >-
    Which creature types speak a language. The Who Speaks It column links languages to dwarves,
    elves, goblins and orcs, which are already approved ancestry_ identities under DEC-2026-0087, and
    to dragons, demons, angels and others that will become monster_ identities when the Monsters
    chapter is claimed. This is a genuine cross-domain link the graph cannot currently hold.

options_considered:
  - id: OPT-A
    summary: Add one prefix for an individual language, with its kind and the fourteen identities enumerated.
    detail: >-
      For example lang_ with kind language, covering the ten common and four rare languages, with the
      Architect fixing exact spellings as section 2.1 does for the six ancestries. The common and rare
      split would be carried either by two table identities or by a property of the kind.
    consequences: >-
      Admits every relationship above and lets the eight published axis-level rows be refined by
      later successor revisions. Grows the prefix list. Commits the ruleset to languages as
      first-class identities, which is a real ontological choice.
  - id: OPT-B
    summary: Represent only the two tables and the common and rare distinction, with no individual language identities.
    detail: >-
      Propose tbl_common_languages and tbl_rare_languages under the approved tbl_ prefix, assert that
      the language axis is resolved by each, and leave the fourteen names in the immutable packet.
      This requires no constitution amendment and the Analyst could publish a GUR for this packet
      immediately.
    consequences: >-
      Cheap and needs no ruling, but it captures the least. It cannot say which languages an ancestry
      grants, which is the dependency four other packets actually need, and a reader querying what a
      dwarf knows would get nothing. The Analyst would rather do this than nothing, but records that
      it leaves the page's substance unrepresented.
  - id: OPT-C
    summary: Rule that individual languages are not graph-constitutable.
    detail: >-
      Treat the fourteen as setting content, keep sys_language, and let the eight published rows
      stand permanently at the axis level. The page would yield only the OPT-B content or nothing.
    consequences: >-
      Coherent and defensible if languages are judged to carry no mechanical weight. It should be
      recorded in the constitution as a deliberate boundary so that later packets do not re-raise it,
      and so the eight axis-level rows are understood as complete rather than provisional.

recommended_resolution: >-
  OPT-A, and ideally as part of one ruling that also answers ESC-2026-09-22T18.39.08.936Z and states
  the general principle for named members of a subsystem. The Analyst's reason for preferring it here
  over OPT-B is specific rather than general: unlike the twenty backgrounds and sixty titles this
  Analyst declined to propose, individual languages are already needed by eight published rows in
  three other packets, and the source states those links precisely enough to assert them.
  If the Architect prefers OPT-B or OPT-C the Analyst can extract this packet under either. What the
  Analyst cannot do is choose, because each is a different ontology for the ruleset rather than a
  different reading of the source.

expected_migration_impact: >-
  None to canonical data, which does not exist. No published artifact requires retraction under any
  option. Under OPT-A, later successor revisions of the ancestries, priest and wizard GURs could
  refine their language rows to name the specific languages; those GURs are immutable and would gain
  ordinary new revisions, not edits. Under OPT-B or OPT-C the eight existing rows are already correct
  and final. The only work this ruling creates is the extraction of this packet, which is held.

constitution_registry_or_profile_change: >-
  OPT-A requires a Shadowdark constitution amendment adding to the section 2 prefix table and, on the
  section 2.1 pattern, enumerating the source-defined identities. OPT-B and OPT-C require no
  amendment, though the Analyst would ask that OPT-C be recorded as a deliberate boundary. No
  registry change is requested and no domain promotion is sought.

analyst_constraints_observed: >-
  The Analyst has not minted a prefix, has not proposed an individual language identity in any
  published artifact, and has not extracted this packet. The packet is claimed, immutable and read in
  full; its manifest records the block and names this escalation. The eight rows in other GURs that
  depend on the language axis were published without waiting, because they attach to the approved
  sys_language identity and are correct under every option above. No other work is blocked: the
  Analyst is continuing through the remaining intake.
