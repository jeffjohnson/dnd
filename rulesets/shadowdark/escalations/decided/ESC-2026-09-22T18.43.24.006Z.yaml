relationship_to_prior_escalation: >-
  This is the same architectural question as ESC-2026-09-22T18.39.08.936Z, raised four minutes
  earlier from printed pages 27 to 29, applied to a third concept. That escalation asked whether an
  individual alignment or an individual deity may have a node identity when no section 2 prefix
  admits one, and it has since been decided as DEC-2026-0093, which approved adding the
  Shadowdark-only alignment_ and deity_ prefixes with their machine kinds and enumerated the ten
  source-defined identities, while keeping sys_alignment and sys_deity as the unmerged axes.
  That ruling is the closest available precedent and the Analyst offers it as such rather than
  assuming it extends. It deliberately does not mention languages, and it was answered on evidence
  from a packet that says nothing about them, so it settles nothing here. Two features of it are
  worth the Architect's attention when answering this one. It draws an explicit boundary against
  identities that carry no independently load-bearing mechanic, refusing nodes for The Four Lords,
  The Dark Trio and The Nine; the Analyst's argument below is that individual languages fall on the
  other side of that line, because eight already-published rows in three packets need them. And it
  refuses an anonymous or unknown-valued node, which is relevant because no language here has that
  problem: all fourteen are named plainly.
  The same shape has now arisen three times, counting DEC-2026-0087 for ancestries, and will recur:
  the intake still contains monsters, spells, gear and magic items whose individual entries this
  Analyst has not yet reached. A ruling that states the general principle, rather than a fourth
  narrow one, would be more useful, though that is the Architect's call and not a condition of this
  escalation.

question: >-
  Shadowdark Constitution 1.2 section 2 lists thirteen approved prefixes. None admits an individual
  language such as Dwarvish or Draconic as a node identity. Printed page 32 is the defining locus for
  every language named in the book, and essentially all of its content is individual languages and
  the creature types that speak them. May the Analyst propose individual language identities, and if
  so under what prefix and kind? If not, is the common and rare distinction representable, and should
  the page be recorded as yielding nothing beyond it?

why_this_is_architectural: >-
  ESCALATION_CONTRACT lists as its first trigger that no existing node ID represents the concept and
  a new kind or prefix may be needed, which is exactly this. It separately says not to escalate when
  a node uses an approved prefix and kind and can be isolated as a normal registry addition, which
  does not apply because no prefix applies. The Analyst is prohibited from minting a prefix.
  This packet differs from the background and titles packets, where the Analyst declined to propose
  twenty backgrounds and sixty title names without escalating. Those names produce no edges: a
  background description states no dependency and a title is the output of a lookup. Individual
  languages do produce edges, because four already-published GURs assert that an ancestry or a class
  supplies starting languages, and printed page 32 says exactly which ones. The difference is that
  here the identities are needed, not merely available.

exact_source_excerpt:
  structure: >-
    Printed page 32 carries the heading LANGUAGES followed immediately by two tables and no framing
    prose. COMMON LANGUAGES TABLE has two columns, Language and Who Speaks It, and ten rows: Common
    spoken by most humanoids; Dwarvish by dwarves; Elvish by elves; Giant by giants, ogres and
    trolls; Goblin by bugbears, goblins and hobgoblins; Merran by merfolk, sahuagin and sirens;
    Orcish by orcs; Reptilian by lizardfolk and viperians; Sylvan by centaurs, dryads and faeries;
    and Thanian by minotaurs, beastmen and manticores. RARE LANGUAGES TABLE has the same two columns
    and four rows: Celestial spoken by angels; Diabolic by demons and devils; Draconic by dragons;
    and Primordial by elder things and elementals. A closing attributed epigraph follows.
  cross_packet_dependencies: >-
    Four published GURs already assert that something supplies starting languages, each at the axis
    level because the individuals could not be named. GUR-PKT-SD-016-017-ancestries-r03 asserts it
    for all six ancestries, from printed pages 16 and 17, where the source names the exact languages:
    the dwarf knows Common and Dwarvish, the elf Common, Elvish and Sylvan, the goblin Common and
    Goblin, the half-orc Common and Orcish, and the halfling and human Common.
    GUR-PKT-SD-020-021-priest-class-r01 asserts it for the priest, whose entry says the character
    knows either Celestial, Diabolic or Primordial. GUR-PKT-SD-024-025-wizard-class-r01 asserts it
    for the wizard, whose entry grants additional common and rare languages and points at this very
    page. Each of those GURs records the deferral in its own observations.

page_attribution_note: >-
  Resolved through the Pandoc AST rather than positionally. The page-32 marker ends the LANGUAGES
  heading and applies to that whole heading under SOURCE_MARKDOWN placement rule 1; the persistence
  rule carries page 32 through both tables and the epigraph. The parser resolves one other page, 15,
  entirely inside the out-of-scope Supporting Source Context.

