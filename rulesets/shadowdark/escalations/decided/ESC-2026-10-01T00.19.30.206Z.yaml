question: >-
  What scanner-owned lineage repair should allow the immutable active Review
  REV-GUP-PKT-SD-195-195-monster-family-angels-r03-r02 to be selected as the
  valid Review leaf for GUP r03 when its explicit supersedes target
  REV-GUP-PKT-SD-195-195-monster-family-angels-r01-r01 belongs to an earlier
  GUP-scoped Review set, without rewriting either Review or the Approved
  bundle? Specifically, should Review lineage resolution follow explicit
  supersedes links across GUP-scoped partitions, with packet/ruleset checks
  and fork protection, or is a different immutable-history/queue interpretation
  required?

smallest_relevant_source_excerpt: >-
  Current Review r03-r02: revision: 2; supersedes:
  REV-GUP-PKT-SD-195-195-monster-family-angels-r01-r01; reviewed_gup.id:
  GUP-PKT-SD-195-195-monster-family-angels-r03; handoff.next_role: integrator.
  Its named predecessor is a published Review for GUP r01, not a Review in the
  GUP-r03-scoped group.

why_this_is_architectural: >-
  WORK_QUEUES requires active-leaf selection by explicit supersedes lineage and
  says only an active Review leaf can create work, but the current scanner
  scopes Reviews by reviewed GUP before resolving that explicit link. For this
  packet the Review revision crosses GUP revisions: the r03 Review consumes
  GUP r03 while directly superseding the earlier packet Review. The immutable
  Review and Approved manifest already exist, so ordinary Reviewer edits or a
  later Review cannot remove the scanner's missing-target error. Only a
  governance ruling can define the safe lineage model and authorized owner for
  changing shared scanner behavior; no packet-content or ontology judgment is
  requested.

