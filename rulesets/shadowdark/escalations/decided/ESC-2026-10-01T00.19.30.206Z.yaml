options_considered:
  - id: OPT-A
    summary: >-
      Make scanner Review-leaf resolution follow explicit supersedes links
      across GUP-scoped groups, while validating ruleset, book, packet, unique
      IDs, revision sequence, direct predecessor, and fork constraints.
    consequences: >-
      Preserves all published bytes and treats explicit lineage as the source
      of leafhood across a packet's changing GUP revisions. Requires focused
      regression coverage for this crossing shape and safeguards against
      accidentally merging independent Review streams.
  - id: OPT-B
    summary: >-
      Retain GUP-scoped Review lineages and define an Architect-authorized
      immutable repair/bridge record for an intentionally cross-GUP Review
      successor.
    consequences: >-
      Preserves current scanner grouping but introduces a new explicit repair
      record shape and validation contract; requires tests for exact pinned
      IDs/checksums, scope, and non-suppression of unrelated errors.
  - id: OPT-C
    summary: >-
      Keep current diagnostics and treat the r03 Review/bundle as invalid until
      a replacement workflow is defined, without manufacturing a Review
      successor or notifying Integrator.
    consequences: >-
      Safest fail-closed behavior but leaves the packet unable to advance and
      does not repair the false predecessor-link inconsistency already
      published in the Review.

recommended_resolution: >-
  Recommend OPT-A as the narrowest repair: scanner ownership belongs to the
  shared queue implementation in tooling/common/scan_agent_queues.py. Resolve
  a Review's explicit predecessor by exact ID in the same ruleset/book/packet
  Review namespace rather than requiring the predecessor to review the same
  GUP revision. Retain strict identity, revision, supersession, and no-fork
  validation; do not infer links from filenames or timestamps. Add a focused
  regression fixture reproducing r02-on-GUP-r03 superseding r01-on-GUP-r01,
  proving the r02 leaf remains the only Review state for the current GUP and
  the approved bundle remains the only scoped Integrator item. Add negative
  fixtures for cross-packet target, absent target, duplicate/forked target,
  and independent Review roots, then run the complete scanner test module.
  Preserve both Reviews, the GUP, Approved manifest, and edge component byte
  for byte. Until that Decision and implementation review complete, keep this
  packet paused and send no Integrator notification.

desired_post_repair_queue_result: >-
  For this exact packet only, the bounded queue projection has zero lineage
  errors attributable to its Review/GUP/Approved lineage; it selects the
  checksummed current Review r03-r02 as the active Review lineage leaf and
  recognizes the exact already-approved bundle as the sole eligible
  INTEGRATOR-APPROVED item. It emits no Reviewer job for GUP r03, no duplicate
  or fork diagnostic, and no second packet job. This desired state does not
  authorize Integrator notification before Architect's ruling and required
  scanner implementation/review are complete. Unrelated repository findings
  are out of scope.

scanner_ownership_and_tests:
  owner: Builder
  implementation_scope:
    - tooling/common/scan_agent_queues.py
    - tooling/common/tests/test_scan_agent_queues.py
  required_tests:
    - >-
      Reproduce the exact valid cross-GUP predecessor shape with synthetic
      fixtures: Review on GUP r03 (revision 2) explicitly supersedes Review on
      GUP r01; assert no missing_supersedes_target error and correct leaf.
    - >-
      Preserve fail-closed behavior for absent targets, cross-packet or
      cross-book targets, duplicate IDs, revision collisions, and forks.
    - >-
      Prove independent Review roots for different GUP streams are not merged
      absent an explicit valid supersedes link.
    - >-
      Assert this packet's scoped projection has no Reviewer job and exactly
      one Integrator-eligible bundle after repair; verify the bundle continues
      to pin the exact Review and GUP checksums.
    - >-
      Run python -m unittest tooling.common.tests.test_scan_agent_queues -v
      and require all tests to pass.
  decision_boundary: >-
    Architect should authorize exact scanner behavior and acceptance criteria.
    Builder owns the shared scanner code and tests. Reviewer independently
    verifies implementation and the scoped queue projection. This escalation
    does not authorize any artifact rewrite, bundle replacement, canonical
    mutation, or Integrator handoff.

expected_migration_impact: >-
  No canonical data, node registry, source packet, GUR, GUP, Review, Approved
  manifest, or edge component should be rewritten. The change is confined to
  shared scanner implementation and its tests, unless Architect explicitly
  selects OPT-B and authorizes a separately specified repair-record contract.

constitution_registry_or_profile_change: >-
