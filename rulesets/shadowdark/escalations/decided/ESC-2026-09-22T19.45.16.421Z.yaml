  summary: _collect_approved_ids treats any APPROVED- substring found anywhere in an Integration manifest
    as an integrated bundle ID, including a component path.
  observed_code:
  - path: tooling/common/scan_agent_queues.py
    line: 3785
    reads: _collect_approved_ids walks the document and regex-matches APPROVED_ID_PATTERN in every
      string value
  - path: tooling/common/scan_agent_queues.py
    line: 4080
    reads: the integrated directory is scanned only for filenames beginning with 'APPROVED-'
