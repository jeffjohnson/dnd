  the_guess_is_unstable_not_merely_lossy: r05-r03 declares REV-...-r05-r01. Two hours ago its stem
    guess REV-...-r05-r03 did not exist, so the bundle was dropped. The Reviewer then published REV-...-r05-r03
    for an unrelated purpose, the packaging repair, and that same unchanged bundle silently started
    validating against a Review its manifest does not name and is now offered as ready. A byte-identical
    artifact changed queue state because a different artifact was published. That is the strongest
    argument that the stem guess must not apply to a manifest that declares its Review.
  why_it_never_surfaced_before: Every adnd1e Approved manifest writes review_id at the top level as
    well as inside approves, so the stem fallback was never the only path. These five Shadowdark manifests
    follow the schema exactly and carry approves.review_id alone.
