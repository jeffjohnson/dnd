defect_1_manifest_linked_review:
  summary: The scanner never reads the schema-required approves.review_id and falls back to guessing
    a Review ID from the APPROVED- filename stem.
  schema_authority:
    path: schemas/common/approved-bundle.schema.json
    checksum: sha256:aadf53d64f98bad0db556fb189be3aa9ae1f15d6967a6e7ef264b1a1271c4455
    finding: '`approves` is required at the top level and `approves.review_id` is required within
      it, with pattern ^REV-GUP-.+$. The schema declares no top-level review_id property, and approves.additionalProperties
      is false, so the location is exact and closed.'
  observed_code:
  - path: tooling/common/scan_agent_queues.py
    line: 4841
    reads: manifest['review_id'], then manifest['provenance']['review_id']
  - path: tooling/common/scan_agent_queues.py
    line: 4846
    reads: fallback 'REV-' + approved_id[len('APPROVED-'):], a filename-stem guess
  - path: tooling/common/scan_agent_queues.py
    line: 4861
    reads: continue when no Review resolves, before the rejection lookup at 4919
