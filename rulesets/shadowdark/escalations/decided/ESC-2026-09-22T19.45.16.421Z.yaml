    is not the cause of defect 1. Component discovery is correct under WORK_QUEUES 1.25: every manifest
    declares that CSV by repository-relative path and the scanner resolves it from the manifest. The
    filename stem matters only because the scanner guesses a Review ID from it. The shared CSV does
    matter to defect 3 below, for a different reason.'
defect_2_active_leaf_selection:
  summary: Approved-bundle readiness never consults manifest-level supersedes. It suppresses only
    when the packaged GUP is superseded.
  observed_code:
    path: tooling/common/scan_agent_queues.py
    line: 4895
    reads: packaged_gup = _packaged_gup_id(manifest, review); suppressed only if packaged_gup in superseded_gup_ids
  measured: All five manifests package GUP-PKT-SD-015-015-stats-and-stat-modifiers-r05, which is the
    current GUP leaf, so no bundle is suppressed by that test and superseded manifests remain on offer.
    No manifest-level supersedes handling exists anywhere in Approved-bundle discovery.
  contract: WORK_QUEUES 1.32 rule 3, only the active leaf revision creates work; rule 4, a revision
    is a leaf when no later artifact of the same kind names its ID in supersedes; rule 6, superseded
    artifacts are not ready work.
  independent_of_defect_1: The Integrator suggested both symptoms might be one issue. They are not.
    Fixing defect 1 alone would resolve the leaf's Review but leave r05-r02 and r05-r03 offered, because
    nothing in this path consults manifest supersedes.
