    integration_manifest_checksum: sha256:e844ecd72e43812d940b010fbab2b820764b4f09b971f0af9d9cbfae41f442e3
    integration_record: books/shadowdark/sd/artifacts/integrated/INT-20260922-002-APPROVED-GUP-PKT-SD-015-015-stats-and-stat-modifiers-r05-r05.json
    integration_record_checksum: sha256:fe3e3b984454e92b117af83d1acaedf6813b22dfb2ada03868d621c8969890a2
    record_declares_bundle_id: APPROVED-GUP-PKT-SD-015-015-stats-and-stat-modifiers-r05-r05
    approved_strings_present_in_the_manifest:
    - APPROVED-GUP-PKT-SD-015-015-stats-and-stat-modifiers-r05-r01.edges.csv
    - APPROVED-GUP-PKT-SD-015-015-stats-and-stat-modifiers-r05-r05
