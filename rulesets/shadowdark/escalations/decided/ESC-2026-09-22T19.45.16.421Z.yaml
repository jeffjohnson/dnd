raised_from: An Integrator notification at 2026-09-22 15:29 local reported that scan_agent_queues.py
  never lists the SD-015-015 Approved-bundle leaf and never mentions its Integration Rejection, while
  its own queue reports both. It asserted no defect and asked Builder to verify. Builder verified,
  found two defects rather than the one suspected, reported them, and was directed by the Architect
  to raise this escalation. While it was being drafted the Reviewer published the packaging repair
  and the Integrator integrated the result, which exposed a third defect and made the consequences
  live. Every observation below is re-measured against the current tree.
urgency: 'This is no longer only a reporting inaccuracy. Shadowdark canonical state now exists: rulesets/shadowdark/canonical
  was created by INT-20260922-002 and the node registry carries its first ten registrations. The scanner
  currently offers two superseded Approved bundles for that same already-integrated packet. An Integrator
  following scan_agent_queues.py rather than its own queue would be handed a batch whose rows are
  already canonical. Builder recommends that no role integrate any SD-015-015 bundle on the strength
  of this scanner until the Decision lands.'
question: Approved-bundle queue derivation has three defects. It does not read the schema-required
  approves.review_id and guesses a Review from the filename stem instead; it never consults manifest-level
  supersedes, so superseded bundles stay on offer; and it harvests any APPROVED- string from an Integration
  manifest, so a bundle merely named as a component path is recorded as integrated. May Builder fix
  all three as bounded conformance to WORK_QUEUES 1.32 and the approved-bundle schema, scoped to tooling/common/scan_agent_queues.py
  and focused tests? And is the WORK_QUEUES Legacy Queue Derivation rNN inference the intended placement
  for the two manifests in this lineage that declare neither revision nor supersedes?
why_this_is_architectural: 'ESCALATION_CONTRACT says a deterministic validator should decide an issue
  rather than escalate it, and defects one and three are exactly that: code that does not read what
  the schema requires, and code that infers an identity from a substring. Builder raises them anyway
  because queue derivation is the shared coordination substrate for all five roles, so changing it
  silently changes every role''s work list. That is the same reason Builder refused to alias an unread
  Review key before DEC-2026-0091 rather than settle a repository-wide convention inside a tool. Defect
  two additionally cannot be implemented safely without a ruling, because the literal reading of WORK_QUEUES
  rule 4 produces a forked lineage with two leaves. The Architect directed this escalation after verifying
  the Builder report.'
