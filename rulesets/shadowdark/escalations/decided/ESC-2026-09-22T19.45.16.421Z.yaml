options_considered:
- id: OPT-A
  summary: Fix all three defects in scan_agent_queues.py with focused tests, applying the existing
    WORK_QUEUES legacy rNN inference to place Approved-bundle revisions.
  detail: Read the approving Review from approves.review_id first, keeping the top-level and provenance
    spellings for compatibility and retaining the stem guess only for a manifestless legacy bundle,
    which Legacy Queue Derivation clause 6 still allows. Select the Approved-bundle leaf per lineage
    from explicit supersedes, falling back to the rNN inference for a manifest that declares none
    and reporting legacy_revision_inference. Derive integrated bundle IDs from the declared bundle_id
    of an Integration record or manifest rather than from any APPROVED- substring or filename. No
    other queue behaviour changes.
  consequences: Produces the required result above and restores the rejection path. All three are
    conformance to an existing schema or an existing contract clause; none invents a rule. Risk concentrates
    in leaf selection, which is why the legacy ruling is requested alongside it.
- id: OPT-B
  summary: Fix defects 1 and 3 now, defer leaf selection to a later ruling.
  detail: Read approves.review_id and stop inferring integration from substrings, leaving supersedes
    handling untouched.
  consequences: Removes the two spurious warnings and the false consumed record, and makes the rejection
    path reachable, but r05-r01 through r05-r04 would then all resolve their Reviews and be offered
    as ready for an already-integrated packet. That is worse than today, so Builder does not recommend
    shipping it alone.
- id: OPT-C
  summary: Change no code and require manifests to carry a top-level review_id.
  detail: Treat the adnd1e habit of writing review_id twice as the convention and ask the Reviewer
    to add the duplicate field.
  consequences: Builder does not recommend it. It makes a redundant field load-bearing while the schema's
    own required field stays unread, the schema as written cannot enforce it, every existing Shadowdark
    manifest is immutable and would need a successor, and it addresses neither leaf selection nor
    the false integrated ID.
recommended_resolution: OPT-A, with the legacy_lineage_question answered by confirming the existing
  Legacy Queue Derivation rNN inference rather than writing a new placement rule. The three defects
  produce one incoherent queue between them and no role can trust this scanner for an Approved-bundle
  lineage until all three are fixed.
proposed_implementation_bounds:
- Change only tooling/common/scan_agent_queues.py and its focused tests.
- Do not alter compiler, review-parser, integrator or Herdr code, any schema, any contract, or any
  published artifact.
- Do not rewrite, move or supersede any Approved manifest, Review, GUP, rejection record, Integration
  manifest or Integration record.
- Do not re-apply, revalidate or reverse INT-20260922-002 or touch rulesets/shadowdark/canonical.
  The fix changes reporting, not graph state.
- Preserve current behaviour for adnd1e bundles, manifestless legacy bundles that still rely on filename-stem
  discovery, decision-migration manifests, and every other queue.
- NO RC processing, cleanup, compilation or testing is authorized.
proposed_acceptance_tests:
- A manifest declaring only approves.review_id resolves its Review, is judged on its own terms and
  emits no approved_review_inferred_or_missing warning.
- A manifest whose stem-implied Review ID differs from its declared approves.review_id is validated
  against the declared one, exercised on APPROVED-GUP-PKT-SD-015-015-stats-and-stat-modifiers-r05-r03,
  which declares REV-GUP-PKT-SD-015-015-stats-and-stat-modifiers-r05-r01 while its stem implies REV-GUP-PKT-SD-015-015-stats-and-stat-modifiers-r05-r03.
- Publishing an unrelated Review whose ID matches a bundle's filename stem does not change that bundle's
  queue state.
- A manifestless legacy bundle still resolves by filename stem and a manifest carrying a top-level
  review_id still resolves, so no adnd1e bundle changes state.
- 'Within one Approved-bundle lineage only the active leaf is eligible: explicit supersedes places
  r05-r02 through r05-r05, the rNN inference places r05-r01, the result is reported as legacy_revision_inference,
  and every superseded manifest is informational rather than ready.'
- An Integration manifest that names another bundle's file only as a component path does not mark
  that bundle integrated; the integrated set comes from the declared bundle_id.
- An Integration record whose filename begins with INT- is recognised, so an integration is visible
  without a separate manifests directory entry.
- A valid Integration Rejection naming the active leaf suppresses that bundle's Integrator item and
  creates exactly one REVIEWER-INTEGRATION-REJECTION item, per acceptance test 41; a Review successor
  recording the exact record consumes it, per acceptance test 43. Exercised on APPROVED-GUP-PKT-SD-015-015-stats-and-stat-modifiers-r05-r04,
  INT-20260922-001 and REV-GUP-PKT-SD-015-015-stats-and-stat-modifiers-r05-r03.
- A rejection that is missing, stale, checksum-mismatched, wrong-ruleset or ambiguous still suppresses
  nothing, per acceptance test 42.
- The focused module and the complete Builder and common suites pass, with exact commands and outcomes
  recorded in the implementation report.
expected_migration_impact: None. No canonical row, registry entry, packet, source file, GUR, GUP,
  Review, Approved manifest, rejection record, Integration manifest or Integration record is created,
  edited or superseded, and INT-20260922-002 is neither re-applied nor reversed. The only observable
  change is which items a queue scan reports, which WORK_QUEUES defines as derived rather than stored
  state. No artifact needs republishing for the fix to take effect.
constitution_registry_or_profile_change: None requested. The approved-bundle schema already declares
  approves.review_id as required and needs no amendment; the defect is that the scanner does not read
  it. WORK_QUEUES needs no new clause if the Architect confirms that its existing Legacy Queue Derivation
  rNN inference places a manifest declaring no revision.
builder_constraints_observed: 'Builder changed no code, no test and no artifact while raising this
  and will not implement until a Decision authorizes it. The Integrator was told which of its two
