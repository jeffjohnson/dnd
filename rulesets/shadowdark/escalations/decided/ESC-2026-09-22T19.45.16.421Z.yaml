    ids_the_scanner_derives:
    - APPROVED-GUP-PKT-SD-015-015-stats-and-stat-modifiers-r05-r01
    - APPROVED-GUP-PKT-SD-015-015-stats-and-stat-modifiers-r05-r05
    - APPROVED-GUP-PKT-SD-016-017-ancestries-r02-r01
    - APPROVED-GUP-PKT-SD-016-017-ancestries-r02-r02
    consequence: APPROVED-GUP-PKT-SD-015-015-stats-and-stat-modifiers-r05-r01 is recorded as integrated
      although it never was. The manifest names it only because every manifest in this lineage declares
      the same shared edges component, which happens to be stem-named after r05-r01.
  second_half_of_the_same_defect: The integrated directory is scanned only for filenames starting
    with APPROVED-, but the Integrator writes its record as INT-20260922-002-APPROVED-...-r05-r05.json.
    That file contributes nothing, so the integration is visible to the scanner only through the separate
    manifests directory. A correct implementation should read the declared bundle_id from the record
    rather than infer an identity from a filename or a substring.
