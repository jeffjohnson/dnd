  problem: r05-r01 and r05-r02 declare neither revision nor supersedes, while r05-r03 supersedes r05-r02,
    r05-r04 supersedes r05-r03 and r05-r05 supersedes r05-r04. By the letter of rule 4 nothing names
    r05-r01, so it is also a leaf and the chain forks in two.
  existing_answer_builder_proposes_to_apply: WORK_QUEUES 1.32 Legacy Queue Derivation already answers
    this and no new rule is needed. Clause 1 prefers explicit supersedes, provenance, Review and Integration
    links; clause 2 says that when supersedes is absent, infer the latest rNN within one artifact
    kind and packet and mark the result legacy_revision_inference. Applied here the explicit chain
    places r05-r02 through r05-r05 and the inference places r05-r01 as an earlier revision of the
    same kind and packet rather than a second leaf, leaving r05-r05 as the single active leaf. Builder
    asks the Architect to confirm this reading rather than assume it, because the alternative offers
    two bundles for one GUP and the two readings differ in what an Integrator is handed.
  not_a_builder_repair: The manifests are immutable and belong to the Reviewer. Builder is not asking
    for any of them to be rewritten and would not rewrite them. The question is only how queue derivation
    places them.
required_queue_result_after_the_fix:
  integrator:
  - No ready INTEGRATOR-APPROVED item anywhere in this lineage. APPROVED-GUP-PKT-SD-015-015-stats-and-stat-modifiers-r05-r05
    is integrated by INT-20260922-002 and is informational INTEGRATOR-CONSUMED; r05-r01 through r05-r04
    are superseded within the lineage and are informational history.
  - APPROVED-GUP-PKT-SD-015-015-stats-and-stat-modifiers-r05-r01 is no longer reported as consumed.
    It was never integrated, and a component path must not establish integration.
  - 'The three unrelated Shadowdark bundles keep their current state: APPROVED-GUP-PKT-SD-011-014-character-overview-and-starting-level-r03-r01,
    APPROVED-GUP-PKT-SD-016-017-ancestries-r02-r01 and APPROVED-GUP-PKT-SD-322-325-community-credits-and-licensing-r01-r01
    are single-manifest bundles unaffected by all three defects.'
  reviewer:
  - No ready REVIEWER-INTEGRATION-REJECTION item. INT-20260922-001 named APPROVED-GUP-PKT-SD-015-015-stats-and-stat-modifiers-r05-r04,
    and REV-...-r05-r03 records that exact record by ID, path and checksum, which consumes the remediation
    under WORK_QUEUES acceptance test 43. The record is therefore informational history.
  - Had that successor Review not existed, the same fix must produce exactly one ready remediation
    item for the rejected bundle under acceptance test 41. Both directions need a regression, because
    the rejection path is currently unreachable rather than merely wrong.
  diagnostics:
  - 'No approved_review_inferred_or_missing warning for any of the five manifests: each declares approves.review_id
    and each resolves.'
  - Each bundle is validated against the Review its own manifest names, so APPROVED-GUP-PKT-SD-015-015-stats-and-stat-modifiers-r05-r03
    is checked against REV-GUP-PKT-SD-015-015-stats-and-stat-modifiers-r05-r01 rather than REV-GUP-PKT-SD-015-015-stats-and-stat-modifiers-r05-r03.
