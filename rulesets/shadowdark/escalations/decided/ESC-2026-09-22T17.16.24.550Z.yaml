measured_capability_state:
  summary: >-
    The gate is not merely unattested. The Integrator transaction entry point raises before it
    reads any bundle, and three further ruleset-specific assumptions sit behind that first
    failure. These are reported so the Architect can size the implementation, not as a request
    for the Integrator to fix them unauthorized.

  reproduction:
    command: >-
      cd tooling/integrator && PYTHONPATH=src python -m adnd1e_integrator --repo-root=../..
      --ruleset-id=shadowdark --books=sd integrate --dry-run
      APPROVED-GUP-PKT-SD-015-015-stats-and-stat-modifiers-r05-r02
    result: nonzero exit, uncaught IndexError, no file written, canonical untouched
    note: >-
      Run with --dry-run. The failure occurs before the dry-run boundary is reached, so no
      canonical or registry path was opened for writing at any point.
    traceback: |-
      Traceback (most recent call last):
        File "<frozen runpy>", line 203, in _run_module_as_main
        File "<frozen runpy>", line 88, in _run_code
        File "D:\analysis\dnd\tooling\integrator\src\adnd1e_integrator\__main__.py", line 3, in <module>
          raise SystemExit(main())
                           ~~~~^^
        File "D:\analysis\dnd\tooling\integrator\src\adnd1e_integrator\cli.py", line 199, in main
          return args.func(args)
                 ~~~~~~~~~^^^^^^
        File "D:\analysis\dnd\tooling\integrator\src\adnd1e_integrator\cli.py", line 143, in cmd_integrate
          batch = integrate(root, args.ruleset_id, selected,
                            integration_id=args.integration_id, dry_run=args.dry_run)
        File "D:\analysis\dnd\tooling\integrator\src\adnd1e_integrator\integrate.py", line 813, in integrate
          prefixes = approved_prefixes(constitution)
        File "D:\analysis\dnd\tooling\integrator\src\adnd1e_integrator\invariants.py", line 65, in approved_prefixes
          section = text.split("### 3.1 Format", 1)[1].split("### 3.2", 1)[0]
      IndexError: list index out of range

  blockers:
    - id: B1
      severity: blocking, first failure
      title: the prefix parser is keyed to an adnd1e-only constitution heading
      file: tooling/integrator/src/adnd1e_integrator/invariants.py
      checksum: sha256:fb3b7401845a9c45d43cdfc95693cf737679cb6630f05cbcab25b40a2df09768
      detail: >-
        approved_prefixes() reads the active ruleset's constitution, which is correct in
        intent, but locates the prefix table by splitting on the literal heading
        "### 3.1 Format". That heading exists in the adnd1e constitution and does not exist in
        Shadowdark Constitution 1.2, which carries its prefix table under "## 2. Node
        Identity". The split returns a one-element list and index 1 raises.
      measured: >-
        A count of the literal heading returns 1 for rulesets/adnd1e/governance/constitution.md
        and 0 for rulesets/shadowdark/governance/constitution.md.
    - id: B2
      severity: blocking, would fail immediately after B1 is fixed
      title: the prefix-count guard is calibrated to the adnd1e table size
      file: tooling/integrator/src/adnd1e_integrator/invariants.py
      detail: >-
        The same function raises ValueError when it parses fewer than 20 prefixes, on the
        stated assumption that a smaller result means the table format changed. Shadowdark
        Constitution 1.2 section 2 defines exactly 13 prefixes, namely abil_, ancestry_,
        class_, rule_, tbl_, spell_, item_, monster_, cbt_, sys_, exp_, ex_, and weapon_. A
        correct parse of a correct constitution would therefore still be rejected as a
        malformed table.
    - id: B3
      severity: blocking, and the reason this needs governance rather than only code
      title: there is no canonical baseline to snapshot, diff, or roll back to
      detail: >-
        CanonicalPaths resolves the directory rulesets/<ruleset-id>/canonical/ with
        edges_master.csv, nodes_master.csv, and graph.json. For Shadowdark that directory does
        not exist. The file rulesets/shadowdark/registries/nodes.csv exists but is
        header-only, containing exactly one header line and no rows. The Integrator
        transaction model is built on snapshot, apply, verify, and byte-for-byte restore on
        failure. A genesis transaction has no prior state, so the Architect must rule on what
        a rollback restores when a first integration fails: absence of the files, or a defined
        empty baseline created as part of the transaction rather than fabricated beforehand.
      constraint: >-
        CON-1 forbids fabricating a header-only canonical baseline to bypass the gate. The
        Integrator reads that as prohibiting the creation of canonical files outside an
        authorized transaction, and has created none.
    - id: B4
      severity: blocking for derived outputs
      title: the Shadowdark role-derivation profile is an empty bootstrap
      file: rulesets/shadowdark/profiles/roles.yaml
      detail: >-
        integrate.py reads the profile thresholds mapping to derive node roles. The Shadowdark
        profile declares status bootstrap with an empty thresholds mapping and an empty tier2
        mapping, and states that thresholds await an integrated Shadowdark corpus. The adnd1e
        profile by contrast carries fourteen populated threshold groups calibrated against
        3851 edges. A first Shadowdark integration of 14 edges has no meaningful derived
        roles, and the Architect should say whether genesis derivation emits empty roles by
        design or whether a populated profile is a prerequisite deliverable.
    - id: B5
      severity: latent, not currently failing
      title: the derived-polarity table is transcribed from the adnd1e constitution
      file: tooling/integrator/src/adnd1e_integrator/derive.py
      detail: >-
        DERIVED_POLARITY is a hardcoded mapping introduced by a comment citing Constitution
        section 6.1, which is an adnd1e locus. Shadowdark Constitution 1.2 section 5 happens to
        declare the same ten derived types with the same polarities and the same three
        authored types, so the transcription agrees today. Nothing detects divergence if a
        future ruleset or amendment differs, and the same class of defect as B1 is what
        produced the first failure. Recorded so the implementation can decide whether to read
        this from the active constitution as approved_prefixes already intends to.

  affected_tests:
    file: tooling/integrator/tests/_bootstrap.py
    detail: >-
      The Integrator suite pins its shared ruleset identifier to adnd1e in the test bootstrap,
      and the migration suites additionally pin adnd1e Decision paths such as
      rulesets/adnd1e/escalations/decisions/DEC-2026-0038.yaml and DEC-2026-0050.yaml. There is
      no genesis or second-ruleset coverage anywhere in tooling/integrator/tests. Any
      implementation of this support therefore requires new tests rather than adaptation of
      existing ones, and the suite as it stands cannot fail if new-ruleset support is broken.
    current_suite_state: >-
      The existing adnd1e suite must continue to pass unchanged; this work adds a capability
      and must not alter adnd1e behaviour.

