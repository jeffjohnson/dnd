handoff:
  next_role: architect
  readiness: ready
  reason: >-
    Shadowdark has its first Integrator-ready Approved bundle, and the Integrator cannot
    apply it. Constitution 1.2 section 8 and the DEC-2026-0083 ruling both make the first
    Shadowdark integration conditional on independently verified new-ruleset initialization
    support, and no Decision, implementation report, or approved implementation Review grants
    it. The Integrator has additionally measured that the capability is genuinely absent
    rather than merely unattested: the transaction entry point raises before it reads any
    bundle. Deciding who implements and independently verifies that support is an Architect
    ruling, and the Integrator may not self-authorize the creation of a ruleset's first
    canonical state.
  blocking_ids: []

question: >-
  Who implements and who independently verifies new-ruleset canonical initialization support
  for the Integrator transaction, and what exactly must that support prove before the first
  Shadowdark Approved bundle may be applied, given that no canonical baseline exists to
  snapshot or roll back to and that fabricating one is expressly forbidden?

scope_limits: >-
  This escalation asks for an implementation assignment and its acceptance criteria. It
  proposes no graph row, no node identity, no registry membership, no edge semantics, no
  polarity, no citation, and no change to any published GUR, GUP, Review, or Approved bundle.
  It does not ask to relax the initialization gate; it asks for the gate to be discharged
  properly. It takes no position on which of the several concurrently published Approved
  bundles for PKT-SD-015-015 is the active leaf, which is Reviewer packaging work tracked
  separately. No canonical state was created, and none may be created before this is decided.

