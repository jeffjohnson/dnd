options_considered:
  - id: OPT-A
    summary: assign Integrator to implement ruleset-neutral initialization support, Reviewer to verify
    detail: >-
      Architect publishes a non-migration Decision with a ready Integrator handoff and
      migration_required false, naming acceptance tests. The Integrator implements a
      constitution prefix-table reader that locates the table by structure rather than by an
      adnd1e heading and validates against the active ruleset's declared prefix set; derives
      the minimum prefix count from the parsed constitution instead of the literal 20; and
      adds an explicit authorized genesis path that creates the canonical files inside the
      transaction with full rollback to absence. The Integrator then publishes a Decision
      Implementation Report and Reviewer publishes an independent implementation Review.
      Approval of that Review discharges CON-1 and CON-2.
    cost: >-
      Integrator implementation plus new genesis tests, and one Reviewer implementation
      Review. No contract or constitution change. No graph change.
    benefit: >-
      Discharges the gate exactly as both CON-1 and CON-2 word it, through the lineage the
      repository already uses for non-migration Decisions. The capability is owned by the role
      that owns the transaction, the verification is independent, and nothing is fabricated.
    risk: >-
      The Integrator both implements and later uses the capability. This is the ordinary
      arrangement for Integrator-owned tooling under ARTIFACT_LIFECYCLE section 6, and the
      independent Review is the control.
  - id: OPT-B
    summary: assign the implementation to Builder
    detail: >-
      Builder implements the same changes in tooling/integrator and Reviewer verifies them.
    cost: Same implementation, plus a cross-role ownership question.
    assessment: >-
      The Integrator does not recommend this. REPOSITORY_STRUCTURE places tooling under the
      roles that own it, and agents/integrator/INSTRUCTIONS.md assigns the Integrator
      ownership of the migration runner, transactional patch applier, rollback and snapshot
      tools, registry updater, graph exporter, and global invariant suite. Every blocker above
      is inside that owned surface. Builder ownership would split one transaction across two
      roles without removing the need for independent Review.
  - id: OPT-C
    summary: define the genesis baseline as an Architect-published empty canonical set
    detail: >-
      Architect authorizes the creation of empty canonical files as a separate governance act,
      after which the ordinary transaction applies with a normal snapshot and rollback target.
    assessment: >-
      The Integrator records this to be weighed carefully and does not recommend it as stated.
      CON-1 specifically names a fabricated header-only canonical baseline as the thing not to
      do. If the Architect judges that an authorized empty baseline is categorically different
      from a fabricated one, the Decision must say so explicitly and name who creates it,
      because the sentence that only Integrator creates or edits canonical graph files appears
      in the same section. B1, B2, and B4 remain unfixed under this option, so it does not by
      itself make the transaction runnable.
  - id: OPT-D
    summary: integrate Shadowdark into a shared canonical store
    assessment: >-
      Rejected, and recorded only to close the option. DEC-2026-0083 and ruleset.yaml
      establish Shadowdark as an independent graph inheriting no canonical baseline or
      identities, and the constitution states that matching IDs in other rulesets are
      unrelated identities. This option contradicts the bootstrap and is named here solely so
      the Architect need not wonder whether it was overlooked.

recommended_resolution: >-
  OPT-A. The Integrator recommends itself as implementation owner because every measured
  blocker lies inside the tooling its own instructions assign it, and recommends Reviewer as
  the independent verifier because CON-1 and CON-2 both require the support to be
  independently verified rather than self-attested. The Integrator asks the Architect to rule
  on B3 explicitly in the Decision text, because what a failed genesis transaction restores is
  a governance question the Integrator must not answer for itself, and to state whether B4's
  empty role-derivation profile is acceptable for a genesis corpus or is a prerequisite
  deliverable. The Integrator has changed no code, created no canonical file, and integrated
  nothing while raising this.

non_fabrication_acceptance_criteria:
  intent: >-
    Criteria the Architect may adopt into the Decision's acceptance tests. Each is written so
    that it fails if the implementation fabricates state rather than earning it.
  criteria:
    - id: AC-1
      statement: >-
        The prefix set the transaction enforces for a ruleset is parsed from that ruleset's own
        constitution at rulesets/<ruleset-id>/governance/constitution.md. A test proves that
        Shadowdark yields exactly its 13 declared prefixes and adnd1e continues to yield its
        existing set, with no prefix list transcribed into code.
    - id: AC-2
      statement: >-
        No minimum prefix count is hardcoded. A constitution declaring fewer prefixes than
        adnd1e is accepted when its table is well formed, and a genuinely malformed table is
        still rejected. A test proves both directions.
    - id: AC-3
      statement: >-
        Canonical files for a ruleset with no canonical directory are created only inside an
        authorized integration transaction that is applying a specific Approved bundle. A test
        proves that no code path creates, touches, or writes any file under
        rulesets/<ruleset-id>/canonical/ outside such a transaction, including the queue,
        validate, and dry-run paths.
    - id: AC-4
      statement: >-
        A genesis transaction that fails at any step, including a late invariant failure,
        leaves the repository byte-for-byte as it was, which for a genesis means the canonical
        directory and every file in it are absent afterwards. A test forces a late failure and
        asserts absence, not an empty file.
    - id: AC-5
      statement: >-
        A genesis integration writes exactly the rows the Approved bundle declares and no
        others. A test asserts that the post-state edge count equals the manifest's declared
        row count, that the registry contains exactly the node IDs those rows reference, and
        that no placeholder, seed, sample, or inferred row exists.
    - id: AC-6
      statement: >-
        The existing adnd1e Integrator suite passes unchanged, proving the capability was added
        rather than the invariants loosened. The report records the exact command and count.
    - id: AC-7
      statement: >-
        The implementation report records the exact reproduction command above failing before
        the change and succeeding after it, so the Reviewer can re-derive the same result
        rather than accept a summary.

expected_migration_impact:
  graph_data_change: false
  registry_change: false
  canonical_data_change: false
  artifact_invalidation: >-
    None. No GUR, GUP, Review, Approved bundle, or Integration record is altered or
    invalidated. The blocked Approved bundle remains immutable at its published path and
    remains Integrator-ready once the gate is discharged.
  tooling_change_required: true
  tooling_change_detail: >-
    tooling/integrator/src/adnd1e_integrator/invariants.py and integrate.py, plus new
    genesis-path tests under tooling/integrator/tests/. Possibly derive.py for B5 if the
    Architect includes it. All within the Integrator-owned surface.

governance_change_surface:
  contract_change: >-
    None expected. WORK_QUEUES, ARTIFACT_LIFECYCLE, and the Integrator role instructions
    already describe the non-migration Decision implementation lineage this would use.
  constitution_change: >-
    None expected. CON-1 already anticipates this exact moment and states the gate; this
    escalation asks for the gate to be discharged, not amended or removed.
  registry_change: >-
    None by this Decision. The registry gains rows only later, through the ordinary approved
    transaction once it can run.
  profile_change: >-
    Possibly, for B4. rulesets/shadowdark/profiles/roles.yaml is an empty bootstrap and the
    Architect may rule that genesis derivation legitimately emits no roles, or may require a
    populated profile first. The Integrator does not propose thresholds, which would be an
    ontology judgment outside its authority.
  schema_change: None.

integrator_position: >-
  The Integrator did not integrate, did not create canonical state, did not edit any published
  artifact, and did not modify tooling while raising this. It ran the transaction once with
  --dry-run to obtain a reproducible failure and confirmed no file was written. It is willing
  to own the implementation if the Architect assigns it, and will accept the Decision's
  acceptance tests as written rather than proposing its own scope afterwards.

concurrent_state_note: >-
  While this escalation was being prepared, the Reviewer published further Approved bundles in
  this book, including APPROVED-GUP-PKT-SD-015-015-stats-and-stat-modifiers-r05-r02 and
  -r05-r03, APPROVED-GUP-PKT-SD-011-014-character-overview-and-starting-level-r03-r01, and
  APPROVED-GUP-PKT-SD-016-017-ancestries-r02-r01. Concurrent independent work is permitted
