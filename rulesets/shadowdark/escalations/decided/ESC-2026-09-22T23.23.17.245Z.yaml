handoff:
  next_role: architect
  readiness: ready
  reason: >-
    DEC-2026-0095 settled how a manifested Approved leaf is resolved and bounded its
    implementation to tooling/common/scan_agent_queues.py, stating explicitly that Builder
    must not touch integrator files. The Integrator's own queue derivation has the same gap
    the ruling closes for the scanner, so after that Decision is implemented the two views
    will still disagree about this lineage. The Integrator will not change its queue
    semantics without authorization, because queue derivation is governed by
    contracts/WORK_QUEUES.md rather than owned outright by the role that runs it.
  blocking_ids: []

question: >-
  Should the Integrator's own bundle discovery apply the same active-leaf resolution
  DEC-2026-0095 requires of the queue scanner, so that a manifested Approved bundle which no
  successor names in `supersedes` is still resolved by the bounded legacy rNN rule, and if
  so, who implements and independently verifies it?

scope_limits: >-
  This asks only for authorization and an owner. It proposes no change to canonical data, to
  any published Stats artifact, to the Approved-bundle schema, to WORK_QUEUES, or to
  DEC-2026-0095 itself. It does not ask to reintegrate, reverse, or revalidate any
  integration. It does not ask to widen the legacy rNN rule beyond the bounded form
  DEC-2026-0095 already defines.

observed_state:
  integrator_queue_today: >-
    `adnd1e_integrator queue --ruleset-id=shadowdark --books=sd` reports
    APPROVED-GUP-PKT-SD-015-015-stats-and-stat-modifiers-r05-r01 as ready Integrator work. It
    reports r05-r02 and r05-r03 as superseded, r05-r04 as rejected under INT-20260922-001, and
    r05-r05 as integrated under INT-20260922-002.
  what_the_decision_says: >-
    DEC-2026-0095 rules that for this historical same-kind, same-packet lineage the bounded
    legacy rNN rule places r05-r01 through r05-r05 in sequence and selects r05-r05 as the sole
    active leaf, and that r05-r01 through r05-r04 are immutable informational history, not
    repair or integration work.
  therefore: >-
    The Integrator queue currently offers as ready an artifact the governing Decision
    classifies as history.

cause:
  file: tooling/integrator/src/adnd1e_integrator/bundles.py
  checksum: sha256:c04cf9b9e14e9ceb65650a69ec4de9af61c62fde824f1b8d0cd00f339d901820
  detail: >-
    `superseded_bundle_ids` retires a bundle only when some later manifest names it in
    `supersedes`. That is correct for an unforked chain and is why r05-r02 and r05-r03 are
    correctly retired here. It has no fallback for a forked lineage: r05-r02 declared no
    `supersedes` and began a separate chain reaching r05-r05, so no manifest ever named
    r05-r01 and nothing retires it. This is the same condition DEC-2026-0095 resolves for the
    scanner by applying the bounded legacy rNN rule before downstream queue effects. The
    Integrator has no equivalent step.
  not_the_cause: >-
    This is not the `approves.review_id` defect or the `APPROVED-` substring defect. The
    Integrator reads `approves.review_id` correctly and derives consumption from declared
    bundle identities, which is why it reports r05-r05 integrated and does not report r05-r01
    as consumed. Only leaf resolution is missing.

risk_assessment:
  severity: low for canonical integrity, persistent for queue correctness
  canonical_is_protected: >-
    Re-applying r05-r01 would present fourteen rows whose assertion keys are already in
    canonical. `integrate()` checks for a post-operation duplicate assertion key before any
    derived output is rebuilt and raises IntegrationError, and the transaction restores every
    file. The Integrator therefore fails closed rather than duplicating rows.
  what_is_actually_at_risk: >-
    A recurring phantom work item. An Integrator reading its own queue sees ready work that
    governance has classified as history, and only out-of-band knowledge of DEC-2026-0095
    prevents an attempt. A stateless successor agent, which this repository's model assumes,
    would not have that knowledge. The failure would be safe but it would consume a
    transaction attempt and could produce a rejection record against an artifact that should
    never have been offered.
  not_observed: >-
    No canonical row, registry row, or published artifact is wrong today. INT-20260922-002 and
    INT-20260922-003 stand as written and this escalation does not question either.

