options_considered:
  - id: OPT-A
    summary: authorize the Integrator to apply the same bounded leaf resolution
    detail: >-
      A Decision with a ready Integrator handoff and `migration_required: false` authorizing a
      change to bundle discovery only: resolve explicit `supersedes` first, then apply the
      bounded legacy rNN rule within one ruleset, book, and packet for manifested Approved
      bundles, reporting the inference exactly as the scanner does. Completion through the
      ordinary implementation report and independent Review.
    cost: Integrator implementation plus tests, and one Reviewer implementation Review.
    benefit: >-
      The two queue views agree, the phantom item disappears for every future agent rather
      than for whoever happens to have read this Decision, and the rule applied is the one
      already reasoned through and approved in DEC-2026-0095 rather than a second convention.
  - id: OPT-B
    summary: leave the Integrator queue as it is and rely on the Decision as standing guidance
    assessment: >-
      The Integrator does not recommend this. It is defensible only while an agent that has
      read DEC-2026-0095 is the one running the queue, which contradicts the stateless-agent
      rule in contracts/GRAPH_INVARIANTS.md invariant 31 and
      contracts/ROLE_CONTEXT_LOADING.md. It also leaves an artifact that fails its own schema
      sitting in a ready bucket indefinitely.
  - id: OPT-C
    summary: have Reviewer publish a successor manifest that names r05-r01 in `supersedes`
    assessment: >-
      Recorded and not recommended. It would retire the fork through ordinary lineage without
      any tooling change, but DEC-2026-0095 states that no Stats workflow artifact repair is
      permitted or needed and that r05-r01 through r05-r04 are immutable history. Publishing a
      further Stats manifest to satisfy a tooling gap would contradict that ruling and add a
      sixth manifest to a lineage the Architect has just closed.
  - id: OPT-D
    summary: widen DEC-2026-0095's implementation bounds to include integrator files
    assessment: >-
      Possible but recorded as the Architect's call rather than a recommendation. DEC-2026-0095
      is immutable and its bounds are deliberate; a reissue or a separate Decision are both
      available, and the Integrator has no view on which is tidier governance.

recommended_resolution: >-
  OPT-A, as a separate Decision rather than a reissue of DEC-2026-0095, so that Decision's
  Builder scope stays exactly as approved. The Integrator recommends itself as implementation
  owner because bundle discovery is its own surface, and Reviewer as independent verifier. The
  Integrator asks that any acceptance test require the inference to be reported rather than
  silent, so a legacy-resolved leaf is always visible as an inference in queue output, and
  that it require the existing AD&D bundle discovery to be unchanged.

expected_migration_impact:
  graph_data_change: false
  registry_change: false
  canonical_data_change: false
  artifact_invalidation: >-
    None. No GUR, GUP, Review, Approved bundle, Integration record, or rejection record is
    altered. r05-r01 through r05-r04 remain immutable at their published paths.
  tooling_change_required: true
  tooling_change_detail: >-
    tooling/integrator/src/adnd1e_integrator/bundles.py and tests under
    tooling/integrator/tests/, both Integrator-owned.

governance_change_surface:
  contract_change: >-
    None expected. WORK_QUEUES Legacy Queue Derivation clause 2 already defines the bounded
    rNN rule; this asks for it to be applied in a second implementation, not rewritten.
  constitution_change: No.
  registry_change: No.
  schema_change: No.

integrator_position: >-
  The Integrator has not integrated and will not integrate any Stats bundle, consistent with
  the Architect's direction. It has changed no code while raising this. It notes that its own
  applier would refuse r05-r01 on a duplicate assertion key, so this is a correctness-of-queue
  question rather than a threat to canonical state, and it is raised now because the gap
  becomes permanent the moment DEC-2026-0095 is implemented on the scanner side alone.
