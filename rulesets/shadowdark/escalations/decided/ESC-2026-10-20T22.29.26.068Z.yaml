options_considered:
  - id: OPT-A
    summary: widen the closed vocabulary to include front-cover and back-cover
    detail: >-
      Amend contracts/SOURCE_MARKDOWN.md to admit front-cover and back-cover alongside
      full-page-artwork, page-intentionally-ignored, and blank-page, keeping the vocabulary
      closed. Define front-cover as declaring the front cover of the publication (supplying
      no graph content unless mechanics are present). Define back-cover as declaring the
      back cover of the publication while retaining ordinary graph extraction eligibility
      for printed game content/tables appearing on the cover. Update pagemarkers.py and
      test_pagemarkers.py accordingly.
  - id: OPT-B
    summary: reject new classes and require steward removal or relabeling
    detail: >-
      Require the source steward to strip cover markers or substitute them with existing
      classes. This loses accurate publication structure metadata and records false
      statements about cover pages.

recommended_resolution: >-
  OPT-A. The steward has explicitly supplied these markers for publication covers.
  Widening the closed vocabulary to five classes preserves typo detection, provides clear
  definitions, and allows extraction of back-cover game tables like the Dead Bandit
  Treasure Table on page 68.

expected_migration_impact: >-
  None. No existing canonical graph nodes, edges, or published artifacts in any ruleset
  are changed.
