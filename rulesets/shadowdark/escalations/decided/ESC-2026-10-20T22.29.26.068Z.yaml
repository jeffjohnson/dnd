question: >-
  Should the closed page-class vocabulary in contracts/SOURCE_MARKDOWN.md be widened from
  three classes to five by admitting front-cover and back-cover as steward-declared
  page-local intake metadata, and if so with what exact definitions and extraction semantics
  (specifically ensuring printed game content on back covers remains extractable)?

