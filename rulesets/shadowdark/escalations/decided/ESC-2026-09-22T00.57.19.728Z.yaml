handoff:
  next_role: architect
  readiness: ready
  reason: >-
    The approved direct-handoff relay has now produced three failed or misreported deliveries in one
    working day, two of them requiring the repository owner to hand-edit relay state before any
    further handoff could be sent. The defects are in Builder-owned code implementing a universal
    contract, so neither the Analyst nor the Builder may decide the remedy unilaterally. The Analyst
    has measured three distinct causes and cites exact lines; the Architect is asked to rule on which
    to fix and to route implementation to Builder.
  blocking_ids: []

question: >-
  How should tooling/common/send-agent-handoff.ps1 report and recover from a delivery whose recipient
  outlasts the relay budget, and from a refusal caused by a busy peer, given that the current
  behaviour halts the whole five-role chain and requires a human to edit shared state to restart it?

scope_limits: >-
  This escalation concerns relay reporting and recovery only. It proposes no change to the
  single-agent rule, to the one-outstanding-delivery rule, to who selects work, or to any graph,
  packet, registry or artifact. It asks for no relaxation of a safety property; two of the three
  findings are that a safety mechanism misreports, not that it is too strict.

