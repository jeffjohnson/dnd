question: >-
  Shadowdark Constitution 1.2 section 2 lists thirteen approved prefixes. None of them admits an
  individual alignment such as Lawful, or an individual deity such as Saint Terragnis, as a node
  identity. Both concepts have their defining locus in this packet, both are source-named with their
  own headings, and the mechanically load-bearing statements on these pages are expressed in terms of
  the individuals rather than the axes. May the Analyst propose individual alignment and individual
  deity identities, and if so under what prefix and kind?

why_this_is_architectural: >-
  This is not ordinary uncertainty and is not a case ESCALATION_CONTRACT tells the Analyst to resolve
  itself. That contract says not to escalate when a proposed node uses an approved prefix and kind
  and can be isolated as a normal registry addition; here no approved prefix applies, which is the
  first listed trigger for escalation: no existing node ID represents the concept and a new kind or
  prefix may be needed. The Analyst is separately prohibited from minting a prefix.
  The precedent is exact. DEC-2026-0087 resolved the identical shape for ancestries: the ancestries
  packet was claimed, read in full, and held without a GUR because section 2 offered no prefix for an
  individual ancestry, and the Architect added ancestry_ together with the six source-defined
  identities. That packet is now extracted and published. This escalation follows the same course
  deliberately rather than improvising, and it is raised from the defining locus, not from a
  secondary mention.

exact_source_excerpt:
  alignment_page_27: >-
    The ALIGNMENT section states: Alignment defines your role in the clash between good and evil. All
    creatures are connected to the eternal conflict waged by Law, Chaos, and Neutrality, whether they
    know it or not. Law is benevolence, Chaos is malevolence, and Neutrality is impartial, favoring
    neither. Choose one of the following three alignments. Three entries follow, each with its own
    heading: CHAOTIC, LAWFUL and NEUTRAL, each describing what characters of that alignment align
    themselves with.
  deities_page_28: >-
    The DEITIES section states: The many gods of the universe are the personifications of Law, Chaos,
    and Neutrality. The most well-known gods are listed here. A character may worship any deity, or
    none. Priests must choose one god to serve faithfully. A priest's deity can revoke the gift of
    spellcasting if the priest commits blasphemous acts. It then names three groupings: The Four
    Lords, the lawful and neutral gods; The Dark Trio, chaotic deities; and The Lost, two of the
    original nine whose names are expunged.
  deity_entries_pages_28_and_29: >-
    Eight entries follow, each with its own heading carrying a parenthesised alignment tag: SAINT
    TERRAGNIS (LAWFUL), GEDE (NEUTRAL), MADEERA THE COVENANT (LAWFUL), ORD (NEUTRAL), MEMNON
    (CHAOTIC), RAMLAAT (CHAOTIC), SHUNE THE VILE (CHAOTIC) and THE LOST (?).
  cross_packet_priest_requirement: >-
    The priest class entry on printed page 20, already extracted as
    GUR-PKT-SD-020-021-priest-class-r01, states: Choose a god to serve who matches your alignment
    (see Deities, pg. 28). That GUR asserts alignment constrains deity at the axis level, as M007,
    precisely because it could not name the individuals.

page_attribution_note: >-
  Resolved through the Pandoc AST rather than positionally. {#p27} and {#p28} end the ALIGNMENT and
  DEITIES headings and apply to those whole headings under SOURCE_MARKDOWN placement rule 1. {#p29}
  ends the MEMNON (CHAOTIC) heading, so that entry begins page 29 and the three entries after it
  inherit page 29 under the persistence rule.

