changes_in_this_revision:
- 'tooling/builder/src/adnd1e_builder/vocab.py: the shadowdark entry of HISTORICAL_ACCEPTED_GUR_CONSTITUTION_VERSIONS
  is now frozenset({''1.0'', ''1.1''}). Its comment records why 1.1 joined 1.0 and that the current
  manifest version is added by `load`, not listed here. One line of data and its comment; no function,
  signature or control flow changed.'
- 'tooling/builder/tests/test_shadowdark_ancestry.py: added TestHistoricalVersionCompatibility, 9
  tests covering the accepted set, the governing constitution sentence, a synthetic 1.1 compile''s
  three required properties, the current version raising neither finding, three rejected unknown versions,
  the untouched adnd1e and basicdnd entries, and the two immutable 1.0 GURs still compiling as before.'
origin_note: 'This Decision began as a divergence reported, not fixed, in IMP-DEC-2026-0087-r02''s
  defects_for_the_architect: the constitution admitted historical 1.1 while the Builder constant admitted
  only 1.0. Admitting an input version is governance transcription rather than a Builder judgment,
  so the gap was reported and left in place until DEC-2026-0090 authorized it. No 1.1 Shadowdark GUR
  exists, so no previously published artifact''s compilation outcome changes.'
concurrent_work_note: Published in the same turn as four packet GUPs (GUP-PKT-SD-015-015-stats-and-stat-modifiers-r02,
  GUP-PKT-SD-011-014-character-overview-and-starting-level-r02, GUP-PKT-SD-016-017-ancestries-r01
  and GUP-PKT-SD-322-325-community-credits-and-licensing-r01). Each was compiled before this change
  and every one of their source GURs declares the current version, so none depends on historical 1.1
  admission. The suite figures above supersede the 841-test run those GUPs record; the difference
  is exactly this Decision's 9 new tests. Under DEC-2026-0089 independent roles work concurrently,
  so the Reviewer should re-measure rather than assume the tree stood still.
canonical_state: No constitution, ruleset manifest, schema, packet, source Markdown, GUR, graph artifact,
  registry, queue tooling or Herdr file was edited. rulesets/shadowdark/canonical still does not exist.
  The two immutable 1.0 GURs are pinned by checksum in verified_inputs and were read only.
attribution_note: vocab.py also carries uncommitted changes from the DEC-2026-0080 and DEC-2026-0087
  lineages, reported in IMP-DEC-2026-0080-r04 and IMP-DEC-2026-0087-r02 and not re-claimed here. test_shadowdark_ancestry.py
