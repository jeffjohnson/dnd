acceptance_results:
- acceptance_test_index: 1
  result: passed
  evidence: 'RulesetVocabulary.load(REPO_ROOT, ''shadowdark'') now reports accepted_gur_constitution_versions
    [''1.0'', ''1.1'', ''1.2''] -- the two governed historical versions plus the current manifest
    version, which `load` adds from rulesets/shadowdark/ruleset.yaml rather than from the constant.
    The constant itself holds only {''1.0'', ''1.1''}. No other ruleset is widened: the adnd1e entry
    is still the shared ACCEPTED_GUR_CONSTITUTION_VERSIONS object, unchanged and asserted identical,
    and basicdnd has no entry at all, so it still accepts only its own current version. The accepted
    set is checked against the sentence that governs it -- constitution section 9''s ''Historical
    Shadowdark GURs declaring 1.0 or 1.1 remain admissible only with full revalidation under the current
    constitution'' -- rather than against a second transcription of itself. Executable checks: TestHistoricalVersionCompatibility,
    9 tests, all passing.'
- acceptance_test_index: 2
  result: passed
  evidence: 'A synthetic Shadowdark GUR declaring constitution_version ''1.1'', written to a temporary
    file and never published, compiles with no constitution_version_mismatch, still raises constitution_version_older_than_compiler,
    and produces an envelope recording constitution_version ''1.2'' with gur_constitution_version
    ''1.1'' -- admitted, not trusted, and stamped with the current version on output. A GUR declaring
    the current version raises neither finding. Unknown versions still fail with constitution_version_mismatch,
    checked at ''0.9'' below the historical range, at the next minor version above current, and at
    ''9.9''; the two admitted historical values are admitted because governance names them, not because
    anything below current is waved through. The change was independently confirmed non-vacuous: with
    the constant reverted to {''1.0''} in memory, the same 1.1 fixture reports constitution_version_mismatch.'
- acceptance_test_index: 3
  result: passed
  evidence: 'The immutable 1.0 compatibility tests are unchanged and green: both published 1.0 GURs
    still compile with no version mismatch and still record gur_constitution_version ''1.0'', asserted
    both by the existing TestHistoricalGursRevalidate (9 tests) and again by this Decision''s own
    regression. Their bytes are unchanged -- they are pinned by checksum in verified_inputs and were
    read, never written. The focused module ran 55 tests and the complete Builder suite 850, both
    exit code 0 with no failures or errors; exact commands and outcomes are in the validation block
    and in build/reports/IMP-DEC-2026-0090-r01.validation.json. The suite grew from 841 to 850 by
    exactly the 9 tests added here.'
