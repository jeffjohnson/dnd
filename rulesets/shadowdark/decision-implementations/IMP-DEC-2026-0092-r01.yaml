scope_note: >-
  Two changed paths fall outside the Decision's exact_diff and are declared here rather
  than folded in.

  First, tooling/integrator/src/adnd1e_integrator/cli.py. Acceptance test 4 names the
  validate path explicitly, and validate is implemented there. It now loads the active
  vocabulary, reads a genesis graph permissively, honours an empty bootstrap profile,
  and reports "genesis": true instead of failing on a ruleset that has no canonical
  files. It still writes nothing.

  Second, and more substantive: invariants.py carried BOOKS = ("PHB", "DMG", "UA", "MM"),
  so invariant 9 rejected every Shadowdark row citing SD. This was not named in the
  escalation or the Decision, and a Shadowdark genesis cannot pass its own invariant
  suite while it stands, which makes acceptance test 6 unreachable. check() now takes
  the citation codes from the ruleset's book registry, read by
  vocabulary.read_citation_books. Omitting the vocabulary preserves the AD&D tuple
  exactly, and both directions are pinned by
  test_invariants.TestTheSuiteUsesTheActiveRulesetVocabulary, including the falsifying
  case that the same Shadowdark row is rejected under the AD&D vocabulary.

  No other file was changed. No Shadowdark Constitution, role profile, schema, source
  packet, GUR, GUP, Review, Approved bundle, registry, or canonical file was touched,
  and no basicdnd/rc work was performed.
observations:
- id: OBS-1
  severity: blocking for the first ordinary Shadowdark integration, and not this Decision's work
  subject: every currently ready Shadowdark Approved bundle
  detail: >-
    With the tooling fixed, all four ready bundles now reach ordinary verification and
    are rejected on invariant 1, each naming an endpoint that is neither a canonical
    node nor registered by its batch: APPROVED-GUP-PKT-SD-015-015-stats-and-stat-modifiers-r05-r03
    (abil_charisma), -r05-r01 (abil_charisma),
    APPROVED-GUP-PKT-SD-011-014-character-overview-and-starting-level-r03-r01
    (abil_constitution), and APPROVED-GUP-PKT-SD-016-017-ancestries-r02-r01
    (abil_ambitious). The cause is the same in each case: the approving Review carries
    no node_registry_decisions block. REV-GUP-PKT-SD-015-015-stats-and-stat-modifiers-r05-r01
    states in prose that "ten node registrations are source-supported, mechanically
    complete, and approval-ready" and its handoff reads "Apply the exact Approved bundle
    after node registration", but the executable registrations an Integrator reads are
    absent, so nothing registers and every endpoint dangles.
  owner: reviewer
  integrator_position: >-
    The Integrator cannot supply these. Inventing a node label or kind would be
    authoring graph identity, which its prohibited actions forbid. This is recorded as
    an observation rather than an Integration Rejection because no transaction was
    authorized to run yet: DEC-2026-0092 post-implementation requirements place the
    first ordinary integration after an approved implementation Review, and a rejection
    record is owed only when an Approved bundle was actually rejected in an authorized
    transaction.
- id: OBS-2
  severity: informational
  subject: the escalation this Decision resolves
  detail: >-
    ESC-2026-09-22T17.16.24.550Z moved from escalations/pending to escalations/decided
    with its bytes unchanged; its checksum is still
    sha256:59c787fda853aec232de07224293fd7b3dc6b43f7f60b1219e85330e19908055, matching
    the value recorded at publication and in DEC-2026-0092's own evidence block.
- id: OBS-3
  severity: informational
  subject: genesis operation indexes
  detail: >-
    In a genesis every edge depends on an identity the same batch registers, because
    nothing was registered before it. Every row is therefore a pending_addition and a
    genesis manifest legitimately carries an empty additions list. This is not a new
    rule; it is the existing dependency check behaving correctly against an empty
    registry, and it is recorded so a Reviewer reading the fixture manifest does not
    read the empty additions list as a defect.
