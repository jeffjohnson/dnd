acceptance_results:
- acceptance_test_index: 1
  result: passed
  evidence: >-
    tooling/integrator/src/adnd1e_integrator/vocabulary.py reads the node-prefix table
    by its header cells ('Prefix | Kind'), with no section heading and no minimum
    count anywhere in the module. Measured from the current files: shadowdark yields
    exactly 13 prefixes (abil_, ancestry_, cbt_, class_, ex_, exp_, item_, monster_,
    rule_, spell_, sys_, tbl_, weapon_) and adnd1e yields 26 including race_ and
    excluding ancestry_. invariants.approved_prefixes now delegates to the same
    reader, so its existing callers get the identical set. A missing prefix table, and
    a table whose rows carry no usable prefix, each raise VocabularyError. Covered by
    test_vocabulary.TestTheActiveConstitutionSuppliesTheVocabulary (prefix cases,
    including test_a_count_below_twenty_is_no_longer_rejected) and
    TestAMalformedConstitutionFailsClosed.
- acceptance_test_index: 2
  result: passed
  evidence: >-
    vocabulary.read_edge_types and vocabulary.read_derived_polarity locate the edge
    vocabulary by 'Type | Meaning | Direction' and the derivation table by an
    'Edge type' header naming a polarity column. Both rulesets are read from disk:
    each yields 13 edge types, 10 derived polarities, and the authored set
    {MODIFIES, TRIGGERS, CONSTRAINS}, with derived and authored partitioning the
    vocabulary exactly. AD&D states its authored types in a second table of the same
    shape whose polarity cell reads 'Analyst-authored'; because a row counts as
    derived only when its polarity is a legal value and it declares no other basis,
    that table contributes nothing without being skipped by position. A polarity table
    that is missing, states no derived row, names an edge type the vocabulary does not
    declare, or derives two polarities for one type each raise VocabularyError.
    'Before a transaction starts' is structural: integrate.py calls load_vocabulary at
    line 816, the blocking-precondition raise is at line 879, the Transaction opens at
    line 905, and the first canonical write is at line 1181. Covered by
    test_vocabulary.
- acceptance_test_index: 3
  result: passed
  evidence: >-
    derive.Degrees.roles returns early on an empty thresholds mapping, and
    Degrees/rebuild_nodes/check_derived_state take tier2_enabled, which integrate.py
    derives as bool(profile.get('tier2')). Against Shadowdark's real profile
    (thresholds {} and tier2 {}, checksum a7ba1d4b...), the genesis fixture derives a
    blank roles field for every canonical node row and every registry row:
    test_genesis.test_every_node_and_registry_row_has_blank_roles. Degrees themselves
    are still derived, because those are topology rather than policy:
    test_derive.test_degrees_are_still_derived_when_roles_are_not. The AD&D tier-2
    rules name AD&D identities directly, so a ruleset declaring no tier-2 mapping does
    not receive them even when an ID is spelled the same:
    test_derive.test_tier2_rules_are_not_applied_to_a_ruleset_that_declares_none. The
    populated AD&D profile is unchanged: rebuild_nodes still reproduces the entire
    canonical node table byte-for-byte
    (test_derive.TestAPopulatedProfileIsUnchanged, which also asserts some canonical
    node actually carries a role so the empty-profile cases cannot pass vacuously).
- acceptance_test_index: 4
  result: passed
  evidence: >-
    CanonicalGraph.load(allow_genesis=True) returns an empty in-memory graph and
    cannot create a file even when asked to; the only mkdir of canonical_dir is inside
    CanonicalGraph.save, which integrate.py calls at line 1181 under 'if not dry_run',
    inside the Transaction opened at line 905, after the blocking-precondition raise
    at line 879. Proven for discovery, verification, genesis load and dry run by
    test_genesis.TestReadOnlyPathsCreateNoCanonicalState, which asserts the canonical
    directory and all three files are absent after each, and that a dry run leaves the
    node registry byte-identical. Omitting the flag still raises FileNotFoundError, so
    no existing caller silently starts from empty. Confirmed against the live
    repository: four dry runs over the four ready Shadowdark bundles, after which
    'ls rulesets/shadowdark/canonical' still reports No such file or directory.
- acceptance_test_index: 5
  result: passed
  evidence: >-
    Snapshot.take now records absent paths explicitly and restore() unlinks any that
    exist, then removes a directory it created only while that directory is empty;
    Transaction discards its snapshot directory on a rolled-back genesis.
    test_genesis.TestALateGenesisFailureRestoresAbsence injects the failure at the
    post-write reread, after the canonical files have actually been written, and
    asserts the canonical directory and files are absent again, the registry is
    byte-identical, no manifest, report or integrated record remains, and no
    transaction snapshot remains. Falsifiability was measured, not assumed: restoring
    the pre-change Snapshot.take behaviour, which skipped a non-existent path, makes
    test_the_canonical_directory_and_files_are_absent_again fail with 'a canonical
    directory exists that nothing authorized'. The mechanism is additionally pinned at
    unit level by test_transaction.TestASnapshotRestoresAbsenceNotJustContent, which
    also proves a non-empty directory is left alone and an ordinary non-genesis
    rollback still restores bytes and keeps its snapshot.
- acceptance_test_index: 6
  result: passed
  evidence: >-
    test_genesis.TestASuccessfulGenesisWritesOnlyWhatWasApproved integrates a genesis
    fixture and asserts the post-state edge count equals the manifest's declared rows,
    that the exact five-field identity set of the written rows equals the approved set
    (so no seed, placeholder, sample, inferred or unapproved row exists), that the
    registry holds exactly the approved registrations, and that graph.json is
    reproducible by reloading the written tabular data. Reaching a passing genesis also
    required invariant 9 to stop rejecting the SD citation code; see scope_note.
- acceptance_test_index: 7
  result: passed
  evidence: >-
    Complete Integrator suite: 277 tests, OK, 1699.795s, exit 0 (225 before this
    change, so 52 added). Focused genesis and vocabulary regressions: 75 tests, OK.
    Pre-change failure, as recorded in the escalation this Decision resolves: the same
    dry-run command raised IndexError at invariants.py line 65 against
    invariants.py sha256:fb3b7401845a9c45d43cdfc95693cf737679cb6630f05cbcab25b40a2df09768,
    before any bundle was read. Post-change, that file is
    sha256:c4a1ebde1ae8f769a384f0d87cb3370e19f08bf4a64e1734eaa5a7da1315276c and no
    traceback occurs. A post-change dry run that creates no state and succeeds is the
    genesis fixture's test_a_dry_run_creates_no_canonical_state. Against the live
    repository the same command instead completes ordinary verification and rejects on
    invariant 1, which is a bundle defect rather than a tooling failure; see
    observations. Exact commands and outcomes are recorded in the validation report.
