changes_in_this_revision:
- 'vocab.py: retired the hardcoded ''shadowdark'' entry from HISTORICAL_ACCEPTED_GUR_CONSTITUTION_VERSIONS
  entirely (the dict now holds only ''adnd1e''). Added MalformedHistoricalVersionList and _historical_versions(ruleset_id,
  manifest), which reads historical_gur_constitution_versions from a ruleset''s own manifest when
  present, validating each entry as a unique dotted-numeric string and raising on an empty, non-list,
  malformed, or duplicate-containing value; falls back to the transcribed dict entry (or nothing)
  when the field is absent, preserving every other ruleset''s existing behaviour. RulesetVocabulary.load
  now calls it in place of the direct dict lookup.'
- 'test_shadowdark_ancestry.py: rewrote TestHistoricalVersionCompatibility''s two version-transcribing
  tests to derive their expectations from ruleset.yaml''s governed list instead of hardcoding ''1.0''/''1.1''
  and the retired constitution sentence, and added three tests covering every governed version, 1.2
  and 1.3 specifically, and the governed-list-pointer shape of the current constitution text. Added
  TestMalformedGovernedHistoricalVersions, 8 tests covering a valid list, a non-dotted-numeric entry,
  a duplicate, an empty list, a non-list value, absence of the field entirely, and that adnd1e''s
  transcribed constant is unaffected.'
