- acceptance_test_index: 3
  result: passed
  evidence: 'REV-IMP-DEC-2026-0107-r02-r01 disposed this test `failed` on
    documentation grounds only: the Reviewer independently verified the
    behavioral duplicate-ID fix itself (29 focused tests reproducing the
    corrected collection path, plus the live isolated projection) and found
    it correct, but r02''s handoff.reason and this test''s own evidence text
    said "both internal dicts now key on object identity," which the
    detailed sentence immediately following it already contradicted.


    The precise, non-contradictory description, read directly from the
    unchanged code: `pool` is `dict[str, list[Artifact]]`. It is keyed by the
    artifact''s own `artifact_id` string, exactly as r01''s broken version
    was, but each key now maps to a list, and every Review document sharing
    that id is appended via `pool.setdefault(review.artifact_id,
    []).append(review)` rather than overwritten. `combined` is
    `dict[int, Artifact]`, keyed by `id(review)` -- Python object identity,
    not the artifact''s own id field -- so two distinct `Artifact` objects
    that happen to declare the same `id` each occupy their own slot instead
    of colliding. The two dicts are keyed on two different things: `pool` on
    the (now list-valued) `artifact_id`, `combined` on object identity. r02''s
    summary sentence calling both "keyed on object identity" was wrong;
    r02''s own more detailed sentences two lines later, and its unchanged
    `changes_in_this_revision` section, already stated the accurate version.
    This revision aligns the summary with the detail rather than changing
    either.


    No scanner code or test changed to produce this correction;
    `tooling/common/scan_agent_queues.py` and
    `tooling/common/tests/test_scan_agent_queues.py` are byte-identical to
    r02 (same checksums), confirmed by git status showing no further edit and
    by recomputing both hashes in this same turn.'
