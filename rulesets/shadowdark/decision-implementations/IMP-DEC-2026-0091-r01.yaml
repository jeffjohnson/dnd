acceptance_results:
- acceptance_test_index: 1
  result: passed
  evidence: 'Verified as an Architect-owned input, not authored here. schemas/common/gur.schema.json
    now defines $defs.candidateNode and points candidate_nodes at it. Its required set is exactly
    kind, proposed_id, proposed_label and why_needed, each typed string with minLength 1, so a present-but-empty
    value is rejected as well as an omitted one. Its `not` clause rejects any candidate node carrying
    `label` or `evidence`, which is how the schema states that the legacy spellings are not aliases:
    a node supplying the value under the old name fails rather than validating. Executable checks:
    TestCandidateNodeSchemaContract in test_shadowdark_ancestry.py, 7 tests, covering the required
    set, a complete node, each field omitted, each field blank, each legacy spelling, and agreement
    between the schema and the compiler.'
- acceptance_test_index: 2
  result: passed
  evidence: 'compiler.py fails closed in _compile_node_additions before any proposal is built: a candidate
    node missing a nonempty proposed_label or why_needed produces one blocking candidate_node_fields_missing
    error naming the exact fields, and `continue` means no registry proposal is emitted for it at
    all -- not a blank one. When the candidate carries a legacy `label` or `evidence` value, the diagnostic
    names that spelling and says it is not an alias, so the Analyst is told why a populated field
    read as absent. The dependent edge still cannot reach the CSV, because its endpoint was never
    registered, which is invariant 1 unchanged. Existing AD&D candidate nodes remain accepted: the
    published adnd1e DMG GURs are compiled in the test and raise no candidate_node_fields_missing,
    because that corpus already uses the canonical spellings. Executable checks: TestCandidateNodeRegistrationFields
    in test_compiler.py, 8 tests.'
- acceptance_test_index: 3
  result: passed
  evidence: 'review.py expands a ref-keyed mapping in _ref_keyed_entries: each key becomes the ref
    of its own per-row directive, carrying that entry''s disposition and its row-local exact_corrections
    unchanged. An embedded ref is optional and must equal its key. Every invalid shape fails closed
    rather than being guessed at -- a value that is not a mapping, a mismatched embedded ref, and
    an entry with no disposition each record an unread decision key and leave every row in the block
    undecided. One bad entry discards the whole block, because applying the readable two thirds of
    a Review is the silent partial application the refusal exists to prevent. The existing list and
    bulk approved_refs/refs forms are asserted unchanged, including that they record no unread key.
    The live Review that produced this Decision, REV-GUP-PKT-SD-015-015-stats-and-stat-modifiers-r02-r01,
    is loaded by name and now yields all 14 rows as approved where it previously yielded none. Executable
    checks: TestRefKeyedDecisionMappings in test_review.py, 11 tests.'
- acceptance_test_index: 4
  result: passed
  evidence: Verified as Architect-owned inputs. contracts/WORK_QUEUES.md declares Version 1.32, at
    or above the required 1.32, and its version history records DEC-2026-0091; it documents the ref-keyed
    mapping with its optional embedded ref alongside the list and approved_refs/refs forms, and the
    four executable candidate-node fields with what proposed_label and why_needed mean. agents/analyst/INSTRUCTIONS.md
    states the same candidate-node requirement and agents/reviewer/INSTRUCTIONS.md the same decision
    forms. All five role instructions and WORK_QUEUES now spell the staged check as `validate_artifact.py
    <staged-yaml> --schema <applicable-schema>`; a repository-wide search for the documented `--path`
    spelling returns nothing under contracts/ or agents/. tooling/common/validate_artifact.py is byte-unchanged
    at the checksum DEC-2026-0091 pins, so the interface was corrected in the documentation and not
    in the tool.
- acceptance_test_index: 5
  result: passed
  evidence: 'The three focused modules ran 205, 128 and 62 tests and the complete Builder suite 876,
    all exit code 0 with no failures or errors; exact commands and outcomes are in the validation
    block and in build/reports/IMP-DEC-2026-0091-r01.validation.json. The suite grew from 850 to 876
    by exactly the 26 tests added here. The three legacy GUR leaves DEC-2026-0091 pins as evidence
    re-hash to their pinned checksums and were read only, as do the ref-keyed Review and the blocked
    GUP-PKT-SD-015-015-stats-and-stat-modifiers-r03; that GUP was not edited, reclassified or superseded
