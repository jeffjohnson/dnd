changes_in_this_revision:
- 'compiler.py: _compile_node_additions rejects a candidate node missing a nonempty proposed_label
  or why_needed with a blocking candidate_node_fields_missing finding and emits no proposal for it.
  The diagnostic names any legacy label/evidence value it found and says it is not an alias.'
- 'review.py: added _ref_keyed_entries and routed the dict branch of _ruling_entries through it, so
  a mapping keyed by ref expands into per-row directives. A non-mapping value, a mismatched embedded
  ref, or an entry with no disposition records an unread decision key and discards the block. The
  approved_refs/refs branch is unchanged and still takes precedence.'
- 'test_compiler.py: added TestCandidateNodeRegistrationFields, 8 tests. Seven existing candidate-node
  fixtures gained why_needed.'
- 'test_review.py: added TestRefKeyedDecisionMappings, 11 tests.'
- 'test_shadowdark_ancestry.py: added TestCandidateNodeSchemaContract, 7 tests.'
- 'test_governance.py and test_handoff.py: nine existing candidate-node fixtures gained why_needed.
  No assertion, behaviour or test was changed; see scope_note.'
scope_note: Two changes fall outside the Decision's exact_diff and are declared rather than folded
  in. First, test_governance.py and test_handoff.py are not listed in exact_diff_ownership, but nine
  of their candidate-node fixtures omit why_needed and the new fail-closed check rejects them, which
  failed 24 tests across those two files. The edit is one key added per fixture, no assertion touched;
  without it acceptance test 5 could not be met, since it requires the complete suite to pass. Second,
  compiler.py now applies every field of a node's row-local exact_corrections rather than proposed_label
  alone. REV-GUP-PKT-SD-015-015-stats-and-stat-modifiers-r02-r02 corrected both proposed_label and
  why_needed on ten nodes; the compiler applied the labels and silently dropped the rationales, which
  is the partial application WORK_QUEUES forbids when it says a correction is never guessed at or
  silently dropped. A correction key the compiler cannot execute now raises a blocking reviewer_node_correction_not_applied
  error instead of disappearing. This is an executor defect against an existing contract requirement
  rather than a new input convention, so it was fixed rather than reported; the Reviewer should rule
  on that judgment.
bugs_found_by_the_new_tests:
- A node's exact_corrections applied only proposed_label. Every other corrected field, including the
  why_needed that a Review supplied for ten nodes, was parsed and then dropped with no finding. See
  scope_note.
