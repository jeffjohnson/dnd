- acceptance_test_index: 3
  result: passed
  evidence: 'RulesetVocabulary now carries a derived_polarity field, read from a ruleset''s own constitution
    (section 5''s two-column table for Shadowdark) rather than one shared constant. Measured live:
    Shadowdark derives CLASSIFIED_AS as neutral and every prior type it always derived; adnd1e''s
    derived_polarity is byte-identical to the retained DERIVED_POLARITY constant; basicdnd -- whose
    own constitution states no derived-polarity table at all -- correctly falls back to that same
    shared constant rather than deriving nothing, which is the exact regression a first implementation
    pass introduced and this report''s own test suite catches (test_basicdnd_still_derives_its_ordinary_types).
    polarity.resolve gained an optional vocabulary parameter; every pre-existing caller, including
