changes_in_this_revision:
- 'vocab.py: added RulesetVocabulary.derived_polarity, populated by _derived_polarity_table (a two-column
  `| Edge type | Derived polarity |` table reader, the same discipline as the existing one-column
  prefix/edge-vocabulary readers) when a ruleset''s own constitution has that shape, falling back
  to the shared DERIVED_POLARITY constant otherwise -- which is what preserves AD&D 1e''s and Basic
  D&D''s exact prior behaviour, since neither constitution uses this table shape.'
- 'polarity.py: resolve() gained an optional vocabulary parameter. Supplied, it derives from vocabulary.derived_polarity;
  omitted, it derives from the same shared constant as before, so no existing caller changes behaviour.'
- 'compiler.py: the one call to polarity.resolve now passes self.vocabulary. Added SHADOWDARK_CLASSIFIED_AS_SHAPES
  (three enumerated triples), _shadowdark_classification_shape, _validate_shadowdark_classification
  (per-edge shape/aspect/direction check, called from _compile_edge for CLASSIFIED_AS edges) and _validate_classification_cardinality
  (per-GUR, called once after all edges compile).'
- 'test_polarity.py: added TestRulesetScopedDerivation, 8 tests.'
- 'test_shadowdark_ancestry.py: added TestBoundedClassifications (15 tests) and TestClassifiedAsRulesetScoping
  (2 tests).'
bugs_found_by_the_new_tests:
- The first implementation pass fell back to an empty derived-polarity mapping for any ruleset without
  its own parseable table. Basic D&D's constitution has never had one and its existing GURs rely entirely
  on the shared AD&D 1e-transcribed table; the empty fallback would have turned every one of its GATES/RESOLVED_BY/etc.
  edges into 'cannot derive polarity', failing two pre-existing test_compiler.py tests immediately.
  Fixed by falling back to the shared constant, not to nothing, and test_basicdnd_still_derives_its_ordinary_types
  now pins that behaviour directly.
- The polarity table's edge-type column is plain uppercase (`| GATES | enables |`), not backtick-quoted
  like the separate edge-vocabulary table; the first parser reused the backtick pattern and silently
  matched nothing, so Shadowdark's own derived_polarity came back empty. Caught by manually inspecting
  the loaded table before writing any test, not by a failing assertion -- worth noting because a test
  asserting the wrong empty expectation would not have caught it either.
