- acceptance_test_index: 4
  result: passed
  evidence: 'compiler.py enforces exactly the three bounded shapes via a small enumerated table, not
    a general taxonomy mechanism: a legal (source, target, aspect) triple compiles with derived neutral
    polarity; anything else is rejected with a specific finding rather than merged into one generic
    error. Verified live: a sys_ target and a table (tbl_common_languages) target are both classified_as_target_illegal;
    a reversed pair (class_wizard CLASSIFIED_AS spell_fireball) is classified_as_direction_illegal,
    distinguished from a target that is merely wrong; the wrong aspect on an otherwise-legal pair
    is classified_as_aspect_illegal; an unsupported target kind (item_wand) is classified_as_target_illegal.
    Cardinality is checked once per GUR against every compiled row: two spell-tier classifications
    for one spell is classified_as_duplicate_tier; a spell with a casting-class row but no tier row
    in the same GUR is classified_as_tier_missing; a spell with both, or with neither (no classification
    submitted for it at all), raises neither finding. A spell may carry two casting classes without
    triggering duplicate/missing. None of this is reached for any other ruleset: CLASSIFIED_AS is
    outside their edge vocabulary, so edge_type_illegal rejects it before the classification validator
    runs, verified by a defensive same-ruleset guard inside that validator as well. Executable checks:
    TestBoundedClassifications, 15 tests covering all three accepted shapes, five rejection categories,
    three cardinality cases, and that authored polarity on CLASSIFIED_AS is still rejected the same
    way every other derived type rejects it.'
