changes_in_this_revision:
- 'scan_agent_queues.py: added `_gup_ancestor_ids`, `_packet_review_candidates`,
  and `_packet_review_leaves` immediately after `_active_leaf`. Added a
  packet-scoped precompute, `packet_review_leaves_by_packet`, alongside the
  existing `leaf_gur_by_packet`/`leaf_gup_by_packet` precompute loop, built
  once per packet from that packet''s own GUP map and the book''s
  `reviews_by_gup`. Replaced the ordinary per-packet `review_leaf` computation
  (previously a direct `_active_leaf` call on `reviews_by_gup[leaf_gup.id]`
  alone) with a lookup into that precomputed dict. Changed
  `_pending_revision_reviews`''s signature to accept the same precomputed dict
  in place of `reviews_by_gup`/`bridged_predecessors`, replacing its own direct
  per-GUP `_active_leaf` call with a dict lookup plus a `seen_leaf_ids` guard
  so two GUP revisions resolving into one merged component surface only once.
  `_active_leaf` itself, every other Review/GUP/GUR lineage path, and every
  decision-migration code path are unchanged.'
- 'test_scan_agent_queues.py: added two module-level fixture factories,
  `_lineage_review` and `_lineage_gup`, and three new test classes --
  `TestPacketReviewLineageHelpers` (12 direct unit tests on the three new
  functions), `CrossGupReviewLineageCase` (4 `QueueScannerCase` integration
  tests reproducing the live shape on a synthetic fixture packet), and
  `LiveCrossGupReviewLineageCase` (4 tests asserting the exact pinned Monster
  Family Angels projection against the real repository). No existing test in
  the file was changed.'
