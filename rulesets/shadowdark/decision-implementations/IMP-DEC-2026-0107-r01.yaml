- acceptance_test_index: 2
  result: passed
  evidence: 'Three new scanner functions implement the rule.
    `_gup_ancestor_ids(start_id, gups_by_id)` walks one packet''s own GUP
    `supersedes` chain, relying on the GUP lineage''s own prior `_active_leaf`
    validation for acyclicity. `_packet_review_candidates(gup_id,
    ancestor_ids, reviews_by_gup, absorbed)` seeds a candidate set from
    `gup_id`''s own Review bucket and transitively pulls in only Reviews whose
    exact ID is named by a `supersedes` link already in the set AND which
    review a GUP in `ancestor_ids | {gup_id}` -- an ancestor''s whole bucket is
    never pulled in wholesale, only Reviews actually reached by a real link.
    `_packet_review_leaves(root, gups_by_id, reviews_by_gup, diagnostics, ...)`
    resolves every GUP in one packet newest-revision-first, calling the
    existing, unmodified `_active_leaf` on each GUP''s merged candidate set and
    tracking which Review IDs that leaf''s own component absorbed as non-leaf
    predecessors; a GUP whose entire bucket was absorbed by a later GUP''s
    resolution gets no entry at all, so it is never independently treated as
    its own trivial leaf. Processing newest-first is what fixes the resurrection
    defect: by the time GUP r01 is reached, r03''s resolution has already
    claimed r01''s own Review as a non-leaf predecessor.


    Both call sites that used to call `_active_leaf` directly on one GUP''s raw
    bucket now consume `_packet_review_leaves`''s precomputed, packet-wide
    result instead: the ordinary per-packet `review_leaf` lookup (now a plain
    dict `.get`), and `_pending_revision_reviews` (now reads its leaf per GUP
    from the same precomputed dict and dedupes on `leaf.artifact_id` so two GUP
    revisions resolving into the same merged component surface only once).


    Live reproduction: `GUP-PKT-SD-195-195-monster-family-angels-r03`''s Review
    `REV-...-r03-r02` explicitly supersedes `REV-...-r01-r01`, which reviews
    ancestor GUP r01. Scanning the live repository now resolves `review_leaf`
    for r03 to `REV-...-r03-r02` with zero `missing_supersedes_target`
    diagnostics for this lineage (`LiveCrossGupReviewLineageCase`), and
    `REV-...-r01-r01` creates no `BUILDER-REVISION` item -- verified directly
    against the live scan output and asserted as a standing regression.'
- acceptance_test_index: 3
  result: passed
  evidence: 'Twelve focused unit tests in `TestPacketReviewLineageHelpers`
    exercise the three new functions directly against constructed `Artifact`
    fixtures, independent of any real GUP chain''s validity: an absent
    supersedes target (`missing_supersedes_target`, unchanged diagnostic); a
    link naming an existing Review of a GUP outside the passed-in ancestor set
    (not pulled in; separately, when named directly in a merge, resolves to
    the same `missing_supersedes_target` rather than a silent join); a Review
    bucketed under a GUP ID from a different packet, proven unreachable because
    `ancestor_ids` is derived purely from this packet''s own GUP map; duplicate
    Review IDs in a merged component (`duplicate_artifact_id`, unchanged);
    two Reviews declaring the same revision number across a merged component
    (`duplicate_revision`, unchanged); two Reviews of the same GUP both
    superseding one ancestor Review (`forked_revision_lineage`, unchanged, since
    both land in the same GUP''s own candidate set exactly as before); and two
    independent, unlinked Reviews in different GUP buckets resolving as two
    separate leaves with zero diagnostics (disconnected roots). Four more
    integration tests in `CrossGupReviewLineageCase` reproduce the live shape
    end-to-end through `scan()` on a synthetic adnd1e fixture packet. Four live
    tests in `LiveCrossGupReviewLineageCase` assert the same guarantees against
    the real repository. Decision-migration Review routing is untouched code
    (grouped by `lineage_id`, never by `reviewed_gup.id`, so it never reaches
    `reviews_by_gup` or the new functions at all) and its existing tests in the
    unmodified full suite continue to pass unchanged.'
