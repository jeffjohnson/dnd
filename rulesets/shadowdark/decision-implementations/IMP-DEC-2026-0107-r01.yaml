  reason: >-
    Implements the bounded packet-update Review-lineage rule: an explicit
    Review `supersedes` link may cross GUP revisions within one exact
    ruleset/book/packet when the predecessor's `reviewed_gup` is the same GUP
    or a validated ancestor in the successor's GUP chain. All required
    absent-target, cross-scope, unrelated-lineage, duplicate, revision-
    collision, fork, disconnected-root, and decision-migration behaviors are
    preserved and covered by new focused and live tests. The pinned Monster
    Family Angels projection has zero lineage errors, no Reviewer job for GUP
    r03, and exactly one eligible Integrator item: the pinned Approved bundle.
    No packet, graph, or basicdnd/rc artifact was touched.
