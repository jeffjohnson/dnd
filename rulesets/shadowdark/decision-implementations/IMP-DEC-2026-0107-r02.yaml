changes_in_this_revision:
- 'scan_agent_queues.py: in `_packet_review_candidates` only. `pool` changed
  from `dict[str, Artifact]` to `dict[str, list[Artifact]]` via
  `pool.setdefault(review.artifact_id, []).append(review)`, so every artifact
  sharing one `artifact_id` is retained. `combined` changed from
  `dict[str, Artifact]` keyed by `artifact_id` to `dict[int, Artifact]` keyed
  by `id(review)` (object identity), both at its initial construction from
  `gup_id`''s own bucket and in the merge loop, which now iterates
  `pool.get(target_id, ())` (every matching artifact) instead of a single
  `pool.get(target_id)`. No other function, and no other part of this
  function -- scope restriction, the `absorbed` parameter, loop termination --
  changed. `_packet_review_leaves` and the two real call sites are unchanged;
  they already consumed whatever `_packet_review_candidates` returned.'
- 'test_scan_agent_queues.py: added three tests immediately after the existing
  `test_duplicate_review_ids_in_the_merged_component_is_an_error`, which is
  itself unmodified. No other test in the file was changed.'
