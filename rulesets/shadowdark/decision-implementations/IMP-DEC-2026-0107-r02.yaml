    _packet_review_leaves), reproducing the Reviewer's exact finding and
    confirming disconnected roots stay independent. The positive cross-GUP
    behavior, every other preserved guard, and the scoped Monster Family
    Angels projection are unchanged and reverified. No source, GUR, GUP,
    Review, Approved bundle, registry, canonical, compiler, or basicdnd/rc
    artifact was touched, and Integrator was not notified.
