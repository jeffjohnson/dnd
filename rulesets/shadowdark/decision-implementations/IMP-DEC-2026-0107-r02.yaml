- acceptance_test_index: 3
  result: passed
  evidence: 'REV-IMP-DEC-2026-0107-r01-r01 disposed this test `failed`:
    `_packet_review_candidates` kept its ancestor `pool` and its `combined`
    component in `dict[str, Artifact]` structures keyed on `artifact_id`. Two
    distinct Review documents sharing one `id` collapsed into a single dict
    slot -- the second write silently overwrote the first in `pool`, and the
    same keying in `combined` meant only one object, not two, ever reached
    `_active_leaf`. The Reviewer''s own repro observed `candidate_count: 1`,
    a returned leaf, and `legacy_revision_inference` instead of
    `duplicate_artifact_id`.


    Corrected: both dicts now key on object identity. `pool` is
    `dict[str, list[Artifact]]` -- every artifact sharing one `artifact_id`
    string is appended to that key''s list rather than overwriting it.
    `combined` is `dict[int, Artifact]` keyed by `id(review)`, so two distinct
    `Artifact` objects that happen to declare the same `id` field each get
    their own slot. The merge loop now iterates every artifact in a matched
    `pool` entry rather than assuming one. No other logic changed: scope
    (`ancestor_ids | {gup_id}`), the `absorbed` exclusion, and loop
    termination are identical to r01.


    Reproduced the Reviewer''s exact repro live: two `REV-DUP` Review
    artifacts in the ancestor bucket, the current GUP''s Review explicitly
    superseding `REV-DUP`. Before this fix: candidate_count 1, leaf returned,
    no `duplicate_artifact_id`. After this fix: candidate_count 3, leaf
    `None`, `codes == [''duplicate_artifact_id'']`, confirmed by direct
    interpreter reproduction before any test was written.


    Three new focused regressions, all added per the Reviewer''s required
    correction and running through the actual collection path rather than
    calling `_active_leaf` directly:
    `test_a_duplicate_id_reaching_the_collector_via_an_explicit_link_is_an_error`
    asserts `_packet_review_candidates` returns all 3 artifacts (not 1) and
    that `_active_leaf` on that list reports `duplicate_artifact_id`;
    `test_a_duplicate_id_through_the_full_leaf_resolution_is_an_error` proves
    the same through `_packet_review_leaves` (the function the real call
    sites use), and additionally confirms the duplicate GUP''s own isolated
    resolution independently reports the same defect on its own terms --
    both detections are correct, since the duplicate genuinely exists in that
    GUP''s own bucket as well as being reached by the cross-GUP link;
    `test_a_duplicate_elsewhere_does_not_disturb_a_disconnected_root` proves a
    duplicate inside one linked component does not poison an unrelated,
    unlinked Review root in a different GUP bucket, satisfying the Reviewer''s
    "disconnected roots remain independent" requirement explicitly. The
    original `test_duplicate_review_ids_in_the_merged_component_is_an_error`
    (direct `_active_leaf` call) is kept unmodified as a regression on that
    function''s own contract, which this correction does not touch. All other
    absent-target, cross-scope, unrelated-lineage, revision-collision, fork,
    and disconnected-root tests from r01 pass unmodified.'
