changes_in_this_revision:
- 'tooling/builder/tests/test_shadowdark_ancestry.py: the three version assertions now read Shadowdark''s
  current constitution version from rulesets/shadowdark/ruleset.yaml, and the unknown-version assertion
  derives the next minor version above it, instead of transcribing ''1.1'' and ''1.2''. Seven of the
  file''s 46 tests failed against Constitution 1.2 purely because they had the old version typed into
  them; no assertion was weakened, and each still proves the same property -- historical 1.0 admitted,
  current version authored, a version above current rejected.'
- No source file under tooling/builder/src changed in this revision. vocab.py, registry.py, compiler.py
  and governance.py are byte-identical to the checksums r01 pinned.
concurrent_work_note: Published in the same turn as GUP-PKT-SD-011-014-character-overview-and-starting-level-r01,
  which compiles one of the two GURs this report dry-compiles as evidence. That GUP is a separate
  artifact in its own lineage; it publishes no canonical state, does not alter the GUR, and its own
  status is blocked. Under DEC-2026-0089 independent roles may work concurrently, so the Reviewer
  should re-measure rather than assume the tree stood still.
scope_note: 'Carried forward from r01, unchanged and still outside the Decision''s literal exact_diff.
  compiler.py reads every edge field through a `_field_text` helper that coerces a scalar to text
  before validating it. Both immutable Shadowdark GURs write `pass: 1` as an integer, which the constitution
  permits because `pass` is open-ended, and the compiler assumed a string: without the helper the
  dry compilation acceptance test 5 requires raises AttributeError on an input the same Decision forbids
  editing. It weakens no gate -- coercion happens before validation, never instead of it, and a test
  asserts an integer in the closed `evidence` field is still reported as evidence_illegal. REV-IMP-DEC-2026-0087-r01-r01
  ruled this in scope; that Review is not relied on as approval here, so the Reviewer should rule
  on it again.'
bugs_found_by_the_new_tests:
- The compiler crashed on a schema-valid integer `pass` value, which made the Decision's required
  read-only dry compilation impossible. Fixed by _field_text in r01; see scope_note.
- prefix_of scanned a frozenset first-match-wins, so if two approved prefixes ever nested the same
  ID could resolve differently between runs. Candidates are ordered longest-first then lexically as
  of r01.
- This report's own tests transcribed the constitution version they were written against, so an ordinary
  governance amendment failed seven of them without any behaviour changing. A version assertion that
  cannot survive a version bump tests the transcription, not the rule; they now read the current version
  from the manifest.
defects_for_the_architect:
- 'Both immutable Shadowdark 1.0 GURs name each edge''s evidence class under `evidence_class`, while
  constitution section 4''s production columns, the Shadowdark edge schema and the compiler use `evidence`.
  Every edge therefore reports both edge_fields_missing and evidence_illegal: 14 edges in the stats
  GUR, 21 in the overview GUR. The overview GUR additionally leaves 2 endpoints unresolved, because
  it cites abil_strength and abil_constitution as cross-GUR identities proposed by the stats packet
  rather than proposing them itself. This is Analyst work in those artifacts'' own lifecycle, out
  of scope for DEC-2026-0087, and deliberately left visible rather than repaired.'
- Builder's transcribed HISTORICAL_ACCEPTED_GUR_CONSTITUTION_VERSIONS admits '1.0' for shadowdark,
  but constitution section 9 now reads 'Historical Shadowdark GURs declaring 1.0 or 1.1 remain admissible
  only with full revalidation'. No 1.1 Shadowdark GUR exists, so nothing is blocked today and no acceptance
  test is affected; the divergence is reported rather than silently widened, because admitting an
  input version is governance transcription and the current version is already admitted automatically.
- contracts/WORK_QUEUES.md 1.31 documents the staged YAML preflight as `validate_artifact.py --path
  <staged-yaml> --schema <schema>`, but the installed tool takes the staged path positionally and
  rejects `--path`. The preflight was run positionally for this publication. Builder owns the tool
  and Architect owns the contract, so the spelling is reported, not chosen.
canonical_state: 'No canonical, registry, source or manifest file was written by this work. rulesets/shadowdark/canonical
  does not exist and was not created; a test asserts its absence after compiling both historical GURs.
  rulesets/shadowdark/registries/nodes.csv is unchanged at its pinned checksum in verified_inputs.
  No ancestry GUP was published: that publication awaits the independent implementation approval this
  report requests.'
attribution_note: The four source files pinned in implementation_files also carry uncommitted changes
  from the DEC-2026-0080 lineage, already reported in IMP-DEC-2026-0080-r04 and not re-claimed here;
  the repository working tree holds further unrelated in-flight edits by other roles, all preserved
  untouched. The changes attributable to this Decision are exactly those in r01's changes_in_this_revision
  plus this revision's test-file change, so a whole-file diff against HEAD will show more than this
  report claims authorship of.
