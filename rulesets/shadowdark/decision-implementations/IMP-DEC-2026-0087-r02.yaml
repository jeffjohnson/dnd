acceptance_results:
- acceptance_test_index: 1
  result: passed
  evidence: 'Re-verified against Constitution 1.2, which DEC-2026-0089 published after r01 was written;
    it remains an Architect-owned input and was not authored here. The Decision''s test reads ''Version
    1.1 or later'', so 1.2 satisfies it, and the structured evidence below records the measured checksum
    and version rather than r01''s stale 1.1 reading. Section 2 still lists `ancestry_` in the prefix
    table as character ancestry and keeps ancestry, class and creature identity distinct; section
    2.1 still names all six IDs with separately named `abil_` benefits, states the machine kind `ancestry`,
    rules the Half-Orc hyphen becomes an underscore, distinguishes `sys_ancestry`, and forbids inheritance
    or import of another ruleset''s identities; the character-race registry is still inactive with
    an empty membership set that is explicitly not a gate; section 9 still admits historical GURs
    only with full revalidation, now naming 1.0 and 1.1, and still requires new artifacts to declare
    the current version and fails unknown ones. ruleset.yaml declares constitution_version ''1.2'',
    the same current version. Each of the four anchors was read in place in the current bytes. Executable
    checks: TestGovernanceInputs, 8 tests, all passing; its version assertion now reads the current
    version from the manifest instead of transcribing it.'
  versioned_contract_content:
    authority:
      id: DEC-2026-0087
      path: rulesets/shadowdark/escalations/decisions/DEC-2026-0087.yaml
      checksum: sha256:ac292466989d18e446778145464f7d8bb1dd4fd82a5379606bb1cdf02536595b
      authorized_acceptance_test_index: 1
    authorized_acceptance_test_index: 1
