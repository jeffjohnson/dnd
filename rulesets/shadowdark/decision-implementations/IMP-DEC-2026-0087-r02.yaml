      observed_version: '1.2'
      minimum_version: '1.1'
      anchors_present:
      - ancestry_ identifies a character ancestry, separate from classes, creatures and the ancestry
        subsystem.
      - Six source-defined ancestry IDs include ancestry_half_orc and separately named abil_ benefits.
      - No automatic inheritance or activation of the inactive character-race registry.
      - Historical 1.0 GURs require current validation; new artifacts declare the current version.
- acceptance_test_index: 2
  result: passed
  evidence: 'Re-verified. The Shadowdark edge schema is byte-unchanged from r01 and still admits all
    six ancestry IDs in both source_id and target_id, rejects `ancestry_half-orc`, `race_dwarf`, `ancestor_dwarf`
    and `Ancestry_dwarf`, and retains the open `ancestry_<stem>` grammar, so `ancestry_halforc` is
    admitted by grammar and remains an identity-review error. schemas/adnd1e and schemas/basicdnd
    still contain no occurrence of ''ancestry'', and schema_version remains a separate unenumerated
    property. One clause of this test now reads against a later amendment and is reported rather than
    reinterpreted: the GUR and GUP constitution_version enums are [''1.0'', ''1.1'', ''1.2''], because
    DEC-2026-0089 added the current 1.2 while retaining both historical values. This test''s wording
    is literal and unversioned, so the Builder does not widen it: historical 1.0 and 1.1 are admitted
    as the test requires, a genuinely unknown version is still rejected (neither ''1.3'' nor ''2.0''
    appears), and the third admitted value is the current version published by a later approved Decision,
    not a widening authored here. The Reviewer should confirm that reading. Executable checks: TestSchemaInputs,
    7 tests, all passing; their version assertions now derive the current and next-above versions
    from governance.'
- acceptance_test_index: 3
  result: passed
  evidence: 'Unchanged and re-run. Parameterised over the six identities read from the Decision rather
    than transcribed, on synthetic GUR fixtures written to temporary files. Each identity compiles
    to a node proposal with kind ''ancestry'', prefix_approved true and disposition ''reviewer_may_approve'',
    with no node_identity escalation; each named benefit proposes as kind ''abil'' with prefix_approved
    true. The fresh, carried-forward and both-endpoint paths are each exercised, and source page and
    label spelling survive compilation. No real packet, GUR or registry row was read or written for
    these assertions. Executable checks: TestAncestryNodeProposals, 6 tests, all passing.'
- acceptance_test_index: 4
  result: passed
  evidence: 'Unchanged and re-run. Scoping is demonstrated in both directions. RulesetVocabulary loads
    `ancestry_` for shadowdark and not for adnd1e or basicdnd; the global NODE_PREFIXES constant does
    not contain it; prefix_of with no scope still returns None for ''ancestry_dwarf'' and ''class_''
    for ''class_fighter''. constitution_prefixes resolves per ruleset root and falls back to the AD&D
    constants for a root with no constitution. A synthetic pending ESC naming ''ancestry_dwarf'',
    loaded from a temporary tree, holds that identity under Shadowdark''s table and holds nothing
    under adnd1e''s; compiling a dependent GUR against it yields architect_required true and a node_registration_held_by_package
    escalation, while the unheld benefit beside it stays reviewer-approvable. An ancestry and a creature
    sharing the label ''Dwarf'' compile to two separate proposals with no merge. No real escalation
    was filed, altered or resolved. Executable checks: TestPrefixScopeIsPerRuleset (9), TestAHeldAncestryIdentityStillBlocks
    (3), TestUnsupportedIdentitiesStillFail (2), all passing.'
- acceptance_test_index: 5
  result: passed
  evidence: 'Re-measured under Constitution 1.2. Both named GURs -- exactly the Decision''s unaffected_inputs
    -- declare constitution_version ''1.0'' and dry-compile under the current vocabulary with no constitution_version_mismatch.
    The older input version is reported, not silently accepted: both raise constitution_version_older_than_compiler,
    and the compiled envelope now records constitution_version ''1.2'' with gur_constitution_version
    ''1.0'', which is the behaviour this test asks for -- new output declares whatever the current
    version is. A synthetic GUR declaring ''9.9'' still fails with constitution_version_mismatch.
    Unrelated findings remain visible and were not suppressed: every edge in both GURs names its evidence
    class under `evidence_class` rather than the production column `evidence`, so the stats GUR reports
    28 errors (14 edge_fields_missing and 14 evidence_illegal over 14 edges) and the overview GUR
    44 (21 and 21 over 21 edges, plus 2 endpoint_unresolved). Those counts are identical to r01''s
    under 1.1, so the amendment changed no row-level outcome. The compile is read-only: both GUR files
    hash identically before and after, and rulesets/shadowdark/canonical does not exist after compilation.
    Executable checks: TestHistoricalGursRevalidate (9) and TestOpenScalarFieldsDoNotCrashTheCompiler
    (2), all passing.'
- acceptance_test_index: 6
  result: passed
  evidence: Exact commands, exit codes and measured outcomes are recorded in the validation block
    and in build/reports/IMP-DEC-2026-0087-r02.validation.json. The focused file ran 46 tests and
    the complete Builder suite 841 tests, both exit code 0 with no failures or errors. The suite is
    32 tests larger than r01's 809 because DEC-2026-0084's page-marker tests were added between the
    two reports; that work is independently evidenced by IMP-DEC-2026-0084-r01 and is not re-claimed
    here. No unrelated failure occurred. The Architect-owned governance and schema changes were verified
    as inputs under tests 1 and 2 and are pinned by checksum in verified_inputs; none was edited.
    The node registry, both source GURs and all existing artifacts are unchanged, and no canonical
    state was created -- see canonical_state.
