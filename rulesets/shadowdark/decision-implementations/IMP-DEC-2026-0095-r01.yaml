acceptance_results:
- acceptance_test_index: 1
  result: passed
  evidence: 'Verified as an Architect-owned input. contracts/WORK_QUEUES.md declares Version 1.32,
    at or above the authorized minimum 1.32, and all five authorized anchors are present in the current
    bytes, matched verbatim from the Decision rather than retyped. The implementation honours them
    for manifested Approved bundles: only the active leaf is offered (rules 3 and 4), superseded manifests
    become informational (rule 6), a legacy member without revision metadata is placed by its rNN
    within the one kind and packet and the placement is reported, and no ordering anywhere in the
    new code reads a modification time. A regression asserts the last of those directly by setting
    a manifest''s mtime to the far future and confirming its placement does not move. Structured evidence
    is recorded in versioned_contract_content.'
  versioned_contract_content:
    authority:
      id: DEC-2026-0095
      path: rulesets/shadowdark/escalations/decisions/DEC-2026-0095.yaml
      checksum: sha256:68e302182640762f4f1704e9f40523419052561f03d8ab5d18c9aced42e2f20a
      authorized_acceptance_test_index: 1
    authorized_acceptance_test_index: 1
    contracts:
    - path: contracts/WORK_QUEUES.md
      checksum: sha256:9b3bdf7008913cbb310cf15e9637e077d683718aa9b91cfcb25d50b6e52184c2
      observed_version: '1.32'
      minimum_version: '1.32'
      anchors_present:
      - Only the active leaf revision of an artifact can create work.
      - A revision is a leaf when no later artifact of the same kind names its ID in `supersedes`.
      - Superseded, consumed, reviewed, integrated, failed, and blocked artifacts are not ready work
        for the ordinary downstream role.
      - When `supersedes` is absent, infer the latest `rNN` only within one artifact kind and packet.
      - Never infer order from creation or modification time.
- acceptance_test_index: 2
  result: passed
  evidence: '_approved_review_link reads approves.review_id first and returns the source of what it
    read. A manifest carrying approves is never stem-guessed, and neither a top-level review_id nor
    provenance.review_id can override it; both remain readable only for a manifest that carries no
    approves block at all. A manifest that declares no Review anywhere is not guessed for either:
    it warns and is withheld. An optional approves.review_checksum is enforced, and a mismatch raises
    approved_review_checksum_mismatch and yields no ready work. A manifestless bundle keeps its reported
    filename fallback, which Legacy Queue Derivation clause 6 still allows. The instability that produced
    the Decision is pinned directly: publishing an unrelated Review whose ID matches a bundle''s filename
    stem no longer changes that byte-identical bundle''s queue state. Executable checks: eight tests
    in ApprovedBundleDerivationCase.'
- acceptance_test_index: 3
  result: passed
  evidence: '_superseded_approved_ids resolves each Approved manifest''s own lineage before any Review,
    rejection or integration effect is derived from it. Explicit supersedes decides first; where a
    member declares neither revision nor supersedes, the bounded legacy rNN rule places the complete
    same-kind, same-packet sequence and emits legacy_revision_inference. Measured on the live lineage:
    {"APPROVED-GUP-PKT-SD-015-015-stats-and-stat-modifiers-r05-r01": {"legacy_inference": true, "queue":
    "INTEGRATOR-SUPERSEDED", "state": "informational"}, "APPROVED-GUP-PKT-SD-015-015-stats-and-stat-modifiers-r05-r02":
    {"legacy_inference": false, "queue": "INTEGRATOR-SUPERSEDED", "state": "informational"}, "APPROVED-GUP-PKT-SD-015-015-stats-and-stat-modifiers-r05-r03":
    {"legacy_inference": false, "queue": "INTEGRATOR-SUPERSEDED", "state": "informational"}, "APPROVED-GUP-PKT-SD-015-015-stats-and-stat-modifiers-r05-r04":
    {"legacy_inference": false, "queue": "INTEGRATOR-REJECTED", "state": "informational"}, "APPROVED-GUP-PKT-SD-015-015-stats-and-stat-modifiers-r05-r05":
    {"legacy_inference": false, "queue": "INTEGRATOR-CONSUMED", "state": "informational"}}. r05-r05
    is the sole active manifest, r05-r01 through r05-r04 are informational, r05-r01 carries the legacy_inference
    flag and the diagnostic names r05-r05 as the leaf. A fork whose members all declare their own
    revision metadata is deliberately left exactly as it was, because clause 2 covers a legacy omission
    and inferring a leaf there would retire a bundle on the strength of its filename. Executable checks:
    five tests in ApprovedBundleDerivationCase plus LiveStatsApprovedLineageCase.'
- acceptance_test_index: 4
  result: passed
  evidence: '_declared_integrated_bundle_ids replaces the substring harvest. Consumption is read only
    from declared provenance -- bundle_id, approved_bundle_id, and approved_bundles[].bundle_id entries
    -- and only from a record whose status says the integration happened, so a rejection record cannot
    retire live work. The integrated directory is now parsed by content rather than by an APPROVED-
    filename prefix, so the Integrator''s INT-20260922-002-APPROVED-...json is recognised on its own,
    while a legacy integrated copy of a bundle file still resolves by name. Measured on the live lineage:
    INT-20260922-002 consumes only r05-r05, and r05-r01 is no longer reported as consumed although
    every manifest in the lineage declares its stem-named edges.csv as a component. Executable checks:
    four tests in ApprovedBundleDerivationCase plus two in LiveStatsApprovedLineageCase.'
- acceptance_test_index: 5
  result: passed
  evidence: 'The rejection contract is unchanged and was deliberately not widened. An early version
    of this implementation suppressed a superseded manifest before the rejection branch ran, which
    silently retired the record-driven remediation DEC-2026-0073 established and failed 17 existing
    tests; the manifest-supersession branch was moved after the rejection branch so a rejected predecessor
    keeps its DEC-2026-0043 routing. Live result: INT-20260922-001 rejected r05-r04, REV-GUP-PKT-SD-015-015-stats-and-stat-modifiers-r05-r03
    records that exact record, so r05-r04 is INTEGRATOR-REJECTED informational history and no Reviewer
    remediation item exists anywhere in the scan. The unconsumed direction is covered by the pre-existing
    RejectionRemediationRecordCase, all 17 of whose tests pass unchanged, including that a rejection
    without a recording successor still asks the Reviewer to remediate and that stale, mismatched,
    wrong-ruleset or ambiguous evidence suppresses nothing.'
- acceptance_test_index: 6
  result: failed
  evidence: 'Not met, and not met for a reason outside this Decision''s bounds. The focused regressions
    pass (34 tests), the complete queue-scanner module passes (976 tests, 34 of them new), and the
    complete common suite passes (1316 tests). The complete Builder suite does not: 876 tests with
    24 failures, every one of them in tooling/builder/tests/test_shadowdark_ancestry.py. They are
    not caused by this work and cannot be fixed within implementation_bounds, which permit only scan_agent_queues.py
    and its test module. Cause: that file''s DEC-2026-0087 fixtures assert that the six ancestry identities
    compile as new node proposals, and INT-20260922-002 and the integrations after it registered them,
    so the compiler now correctly reports node_proposal_resolved_to_canonical instead. The registry
    has gone from header-only to 30 canonical nodes. Independence is demonstrable: tooling/builder
    contains no reference to scan_agent_queues at all, so neither changed file is reachable from the
    Builder suite, and that suite passed at 876 tests earlier today before the first integration.
    This report is therefore published approval_ready false and routed to Architect rather than Reviewer.
    The remedy is a separate bounded authorization to update those fixtures to assert reuse of a canonical
    identity rather than a fresh proposal; Builder will not widen this Decision to reach them.'
