changes_in_this_revision:
- 'scan_agent_queues.py: added _approved_review_link, which reads approves.review_id as the sole Review
  identity for a manifested bundle, reports where it read from, and keeps the filename stem only for
  a manifestless bundle. The approved-bundle loop uses it and enforces an optional approves.review_checksum
  with a new approved_review_checksum_mismatch error.'
- 'scan_agent_queues.py: added _approved_lineage and _superseded_approved_ids, which resolve each
  Approved manifest''s own active leaf from explicit supersedes and the bounded legacy rNN rule before
  any downstream effect, and added an INTEGRATOR-SUPERSEDED branch for a manifest a later one in its
  lineage replaces. The branch is placed after the rejection branch so a rejected predecessor keeps
  its existing routing.'
- 'scan_agent_queues.py: replaced _collect_approved_ids with _declared_integrated_bundle_ids, which
  reads declared bundle identities from integrated-status records and manifests instead of regex-harvesting
  APPROVED- substrings, and made the integrated directory parse records by content rather than by
  an APPROVED- filename prefix.'
- 'test_scan_agent_queues.py: added ApprovedBundleDerivationCase (17 tests) and LiveStatsApprovedLineageCase
  (7 tests), 34 test cases in total once subtests are counted. No existing test was edited or removed.'
