acceptance_results:
- acceptance_test_index: 1
  result: passed
  evidence: 'PAGE_CLASSES equals exactly {full-page-artwork, page-intentionally-ignored, blank-page},
    asserted as set equality rather than by membership, so a fourth class would fail the test
    instead of passing unnoticed. The set is derived from PAGE_CLASS_MEANINGS, which documents
    each class, so the vocabulary and its documentation cannot drift apart. There is no wildcard
    and no permissive fallback: membership in that frozenset is the only admission test anywhere
    in the parser or the linter, and six outsider spellings (full-page-diagram, page-ignored,
    blank, blank-pages, full-page-artwork-2, the empty string) are each confirmed absent.
    The three meanings are also asserted distinct, and the exclusion class is asserted not
    to claim the page is blank or artwork. Executable checks: TestClosedPageClassVocabulary,
    6 tests, all passing.'
- acceptance_test_index: 2
  result: passed
  evidence: 'Parameterised over all three classes and both admitted forms, on synthetic input
    written to a temporary file; no live source is read by these assertions. For every class,
    a genuine heading and an empty fenced Div each resolve page 23 with the exact class tuple,
    the correct block (''heading'' or ''div'') and an empty unknown tuple. The classified
    page appears in resolved pages, so it is not a gap downstream; pages_with_class returns
    it for its own class and the empty tuple for the other two. Neither admitted form is reported
    as malformed. No marker token survives into extracted prose: neither the class name nor
    ''{#p'' appears in any span''s text. The class belongs only to its own page and is not
    inherited by the page that follows. Executable checks: TestEveryPageClassIsParsed, 6 tests,
    all passing.'
- acceptance_test_index: 3
  result: passed
  evidence: 'Parameterised over all three classes, driving lint_source over synthetic files.
    Each classified page lints with exit code 0, emits no PROBLEM and no ''no marker for page''
    uncovered-page error, and reports the exact classification as a note naming the page,
    the class and the block. The note now also states what that class declares, asserted against
    PAGE_CLASS_MEANINGS, and still carries the packet.yaml composition obligation verbatim.
    A later plain page is not reported as classified: ''page 1 classified'' appears and ''page
    2 classified'' does not. The heading form lints identically to the Div form. Executable
    checks: TestEveryPageClassLints, 5 tests, all passing.'
- acceptance_test_index: 4
  result: passed
  evidence: 'Three unknown classes (full-page-diagram, page-skipped, blank) and five near-miss
    typos of real classes (blank_page, blank-pages, page-intentionaly-ignored, Page-Intentionally-Ignored,
    full-page-art) each fail lint with exit code 1 and ''unknown page class''. For every one
    of the three recognised classes the bare paragraph form still resolves no page, carries
    no class, produces exactly one malformed marker naming the heading-or-empty-fenced-Div
    correction, and fails lint; and a recognised class on a block with no reserved pN identifier
    is malformed with ''no reserved'' rather than being guessed onto the page in effect. Ordinary
    non-page Div classes (sidebar, note, example) are untouched: their content still resolves
    to the page in effect with no malformed marker and no page class. Executable checks: TestRejectedPageClassForms,
    6 tests, all passing.'
- acceptance_test_index: 5
  result: passed
  evidence: 'A bounded synthetic fixture reproduces the reported shape -- an empty fenced
    Div classifying page 322 as page-intentionally-ignored, followed by plain markers on 323,
    324 and 325 -- without reading the live packet. It resolves exactly four pages (322-325);
    only page 322 is classified, and page_classes has length 1; the following pages keep their
    own content; nothing is reported unknown or malformed; and the span lints clean at exit
    code 0 with ''pages resolved: 322-325 (4 marked)'' and no uncovered-page error. The excluded
    page is also asserted not to be relabelled: neither ''full-page-artwork'' nor ''blank-page''
    appears anywhere in that output. Separately, and as an observation rather than a gate,
    the live packet named in the Decision''s scope was linted read-only: its page 322 now
    classifies correctly with no unknown-class or malformed-marker finding, and the packet
    still fails on an independent wrapper defect -- prose preceding its first marker -- which
    is outside this ruling and was deliberately not suppressed or repaired. Executable checks:
    TestIgnoredPageInASpan, 6 tests, all passing.'
- acceptance_test_index: 6
  result: passed
  evidence: The page-marker file holds 68 tests, of which 36 predate this work and 32 are
    new; all 68 pass, so frontmatter, trailing heading and paragraph markers, last-cell whole-row
    attribution, inline transitions, Pandoc tables, superscript/subscript and the original
    full-page-artwork behaviour are each still green and none was edited, weakened or removed.
    The complete Builder suite ran 841 tests at exit code 0 with no failures or errors, against
    a pre-change baseline of 809 tests also passing -- the difference is exactly the 32 added
    tests. No unrelated blocker appeared, and no other role's artifact was touched to make
    anything pass.
- acceptance_test_index: 7
  result: passed
  evidence: 'The change is confined to three Builder-owned files, each pinned by checksum
    in implementation_files. No graph, registry, canonical or source file is written; no schema
    changed; no identity is reused across rulesets; no class is synthesised into a node, edge,
    domain, general rule or citation; and no packet is automatically excluded. Tests assert
    the last three directly: PageClassMarker still carries only page, classes, block and unknown,
    so a class cannot have become graph content; a classified page remains in resolved pages
    rather than being dropped from the packet; and linting leaves the source file byte-identical
    and creates no new file beside it. Pandoc AST parsing is preserved, with no raw-line parsing
    introduced and no change to page placement. New-class production intake awaits the final
    Architect activation of SOURCE_MARKDOWN 1.8 or later: the contract is unmodified at 1.7
    and contains neither new class, which this report''s generator asserts. Publishing this
    report is not that activation. Executable checks: TestImplementationStaysMetadataOnly,
    3 tests, all passing.'
