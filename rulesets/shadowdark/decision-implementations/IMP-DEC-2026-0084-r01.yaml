changes_in_this_revision:
- 'pagemarkers.py: replaced the single-member PAGE_CLASSES frozenset with PAGE_CLASS_MEANINGS,
  a mapping of each admitted class to what the steward is declaring, and derived PAGE_CLASSES
  from its keys. Extended the module docstring to record the three-class vocabulary and its
  prospective status. No parsing, placement or page-state logic changed, and nothing branches
  on which class was read.'
- 'cli.py: the lint note now states the exact classification''s meaning alongside the class
  name, instead of one generic parenthetical that was true of artwork but wrong for a deliberately
  excluded page. Error behaviour, exit codes and every other diagnostic are unchanged.'
- 'test_pagemarkers.py: added 32 tests in six classes covering the seven acceptance tests.
  The 36 pre-existing tests are unmodified.'
attribution_note: The three pinned files also carry uncommitted changes from the DEC-2026-0080
  lineage, already reported in IMP-DEC-2026-0080-r04 and not re-claimed here. The changes
  attributable to this Decision are exactly those in changes_in_this_revision, so a whole-file
  diff against HEAD will show more than this report claims authorship of.
scope_note: This report declares constitution_version 1.1, the Shadowdark constitution's current
  version, while DEC-2026-0084 was authored under 1.0. The intervening amendment was DEC-2026-0087's
  ancestry vocabulary, which touches node identity and not page intake, so nothing this Decision
  rules on is affected. The alternative -- declaring a superseded version -- is barred by
  the constitution's own rule that new artifacts declare the current version.
