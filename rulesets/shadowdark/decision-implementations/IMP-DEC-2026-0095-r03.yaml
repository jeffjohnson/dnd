  reason: All six DEC-2026-0095 acceptance tests pass against corrected implementation files. A self-discovered
    ordering defect in r02 -- the review-checksum precondition was enforced before manifest-lineage
    resolution, so a stale checksum on an already superseded manifest became a fatal repo-wide lineage
    error -- is fixed and covered by two new regressions.
  blocking_ids: []
revision_reason: 'Builder found this defect itself, before any Reviewer action on r02: immediately
  after publishing r02, the live repository scan reported LineageErrorCount 1 against APPROVED-GUP-PKT-SD-011-014-character-overview-and-starting-level-r03-r02,
  a manifest the Reviewer had already superseded with a corrective r03-r03 carrying the right review_checksum.
  r02''s approved_review_checksum_mismatch check ran at first Review resolution, before _superseded_approved_ids
  had classified the manifest, so a stale-but-retired checksum pin was treated as a fatal lineage
  error rather than the informational history WORK_QUEUES treats a superseded artifact as. The check
  is now the last gate immediately before a bundle would be offered as INTEGRATOR-APPROVED, after
  every retirement path -- integrated, GUP-superseded, rejected-and-remediated, manifest-superseded
  -- has already been checked. Under WORK_QUEUES 1.32 rule 15, before an exact Approved Review exists
  implementation-file evidence is a strict current precondition and drift restores the Decision to
  its implementation owner; that is what this report does. r02 is immutable and is not edited or withdrawn.'
