changes_in_this_revision:
- 'scan_agent_queues.py: moved the approves.review_checksum precondition check from immediately after
  Review-identity resolution to immediately before a bundle is appended as INTEGRATOR-APPROVED, i.e.
  after the integrated, GUP-superseded, rejection, and manifest-supersession checks. No other logic
  changed: identity resolution, leaf selection and integration-consumption derivation are byte-identical
  to r02''s implementation in substance.'
- 'test_scan_agent_queues.py: added test_a_superseded_manifests_stale_checksum_is_not_a_lineage_error,
  which reproduces the exact live shape (a superseded predecessor with a stale checksum pin, corrected
  by its successor) and asserts no error-severity diagnostic results; and test_a_live_leafs_bad_checksum_is_still_an_error,
  which confirms the narrowing did not swallow a genuine defect on live work.'
