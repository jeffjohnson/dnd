- acceptance_test_index: 3
  result: passed
  evidence: 'compiler.py''s enumerated shape table now has four entries instead of three: SHADOWDARK_CLASSIFIED_AS_SHAPES
    gained {source_prefix: item_, targets: {rule_light_source}, aspect: light source, cardinality:
    at_most_one, decision: DEC-2026-0104}, verified live by importing the table and resolving both
    directions. A valid item_torch CLASSIFIED_AS rule_light_source row with aspect light source compiles
    with derived neutral polarity (test_item_to_light_source_is_accepted). Rejections, each with the
    existing shared finding rules rather than new ones: a non-item source (spell_fireball) is classified_as_target_illegal;
    a non-light target (item_torch to class_wizard) is classified_as_target_illegal; the reversed
    pair (rule_light_source CLASSIFIED_AS item_torch) is classified_as_direction_illegal, distinguished
    from a plain wrong target the same way DEC-2026-0103''s reversal check already worked; the wrong
    aspect on an otherwise-legal item pair is classified_as_aspect_illegal. Cardinality: _validate_classification_cardinality
    gained a light_source_refs tracker parallel to the existing tier_refs one; two light-source rows
    for one item is the new classified_as_duplicate_light_source finding; zero rows for an item raises
    nothing, since at-most-one is never a requirement to classify (constitution: ''An item need not
