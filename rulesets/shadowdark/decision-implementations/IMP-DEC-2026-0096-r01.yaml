scope_note: >-
  One file was changed outside this Decision's implementation bounds and is declared
  here rather than folded in: tooling/integrator/tests/test_vocabulary.py.

  DEC-2026-0096 limits the Integrator to bundles.py and test_bundles.py, so this
  repair is not made under its authority. It is made under DEC-2026-0078, which
  grants the Integrator standing authorization to repair a test-only regression guard
  when the changed paths are confined to tooling/integrator/tests/, no production
  applier, schema, contract, registry, canonical data, plan, GUR, GUP, Review,
  Approved bundle, manifest or report changes, the guard derives from current state
  and asserts an invariant that survives successful integration, and the guard is
  shown falsifiable by the defect it prevents. Every condition holds here; details
  and the falsification evidence are in OBS-2.

  That file is named in IMP-DEC-2026-0092-r01's implementation_files and pinned by the
  approved REV-IMP-DEC-2026-0092-r01-r01. Under WORK_QUEUES rule 15 its checksum there
  is historical evidence of the reviewed state and this later change is informational;
  it does not reopen DEC-2026-0092. Its current checksum is recorded in verified_inputs
  above so the Reviewer can see exactly which bytes this report was validated against.

  No other file was changed. The queue scanner, every Stats workflow artifact,
  canonical data, registries, schemas, contracts, Reviewer and Builder tooling and
  Herdr are untouched, and no basicdnd/rc work was performed.
observations:
- id: OBS-1
  severity: wording difference, no effect on the required outcome
  subject: acceptance test 2's description of r05-r02
  detail: >-
    The Decision states that r05-r01 and r05-r02 are placed using a reported legacy
    rNN inference and that r05-r03 and r05-r04 are placed by explicit supersedes.
    Measured from the artifacts, APPROVED-GUP-PKT-SD-015-015-stats-and-stat-modifiers-r05-r03
    names r05-r02 in its supersedes field, so this implementation places r05-r02 by the
    explicit link and reports no inference for it. Only r05-r01 is un-named by any
    manifest and therefore placed by the fallback.
  reading: >-
    The most likely intent is that r05-r02 declares no supersedes of its own, so its
    own position in the lineage is not self-declared. Under either reading the required
    outcome is identical and is what the implementation produces: exactly one active
    leaf, r05-r05, and no historical member in the ready queue.
  why_it_is_reported: >-
    The Integrator will not relabel a link that an immutable artifact actually declares
    in order to match prose. If the Architect intends r05-r02 to be reported as inferred
    as well, that is a change to the rule rather than to this evidence, and the
    Integrator will implement it on instruction.
- id: OBS-2
  severity: informational, separately authorized, already repaired
  subject: tooling/integrator/tests/test_vocabulary.py
  detail: >-
    The full suite run before this report returned 291 tests with one failure:
    test_shadowdark_yields_exactly_its_thirteen_declared_prefixes asserted a hardcoded
    set of thirteen Shadowdark prefixes. DEC-2026-0093 lawfully added alignment_ and
    deity_ at Constitution 1.3, so a correct amendment failed a test about the loader.
    The loader itself was correct throughout and needed no change: it reads the Prefix
    table live and returned all fifteen.
  repair: >-
    The test now compares the loader against a second, deliberately independent reader
    implemented in the fixture, which finds the Prefix header and walks the table by
    hand. Comparing the loader against itself would pass whatever it returned. A
    companion test names the Decision-established identities individually, ancestry_
    from DEC-2026-0087 and alignment_ and deity_ from DEC-2026-0093, so a regression
    stays attributable to the Decision it would break without pinning the table's size.
  falsifiability: >-
    Measured, not asserted: patching the loader to drop one declared prefix, deity_,
    makes three tests fail, including the repaired one. The guard is therefore not
    tautological.
  integrator_position: >-
    This is the third time the Integrator has written a corpus snapshot where an
    invariant belonged, after the DEC-2026-0075 rewind fixture and the genesis registry
    fixture repaired earlier today. The implementation was correct in each case and the
    assertion was not. It is recorded here so the pattern is visible to the Reviewer
    rather than only to the Integrator.
- id: OBS-3
  severity: implementation detail, bound is tighter than the prose
  subject: how a legacy group is formed
  detail: >-
    DEC-2026-0096 bounds the fallback to matching Approved kind, ruleset, book and
    packet. This implementation groups by the full base of the bundle id, which is
    everything before the trailing -rNN and therefore carries the reviewed GUP revision
    as well. That is strictly narrower than the Decision requires.
  why: >-
    Grouping by packet alone would compare bundle revisions across different reviewed
    GUP revisions, ranking APPROVED-...-r04-r02 above APPROVED-...-r05-r01 and inverting
    the real order. test_bundles.TestBoundedLegacyApprovedLeafInference.test_a_different_gup_revision_is_never_ranked_against_this_one
    pins that case: both lineages keep their own leaves and no inference is reported.
- id: OBS-4
  severity: informational
  subject: where the inference is exposed
  detail: >-
    The Decision requires the inference to be visible in the normal Integrator queue
    result and never silent. It is reported in two places: on the affected bundle's
    legacy_inferences list, and in a new legacy_leaf_inferences key on the ready_queue
    result naming both the historical bundle and the selected leaf. It is deliberately
    not added to diagnostics, because diagnostics signal broken lineage and drive a
    nonzero CLI exit, while this is a successful contract-defined derivation. cli.py was
    not modified, so the CLI's printed payload is unchanged; the queue result itself is
    the API the Decision names.
