changes_in_this_revision:
- Added IsolatedShadowdarkCase, a baseline whose NodeRegistry is constructed rather than loaded, plus
  a guard test asserting it is empty and holds none of the six identities.
- Repointed TestAncestryNodeProposals, TestAHeldAncestryIdentityStillBlocks, TestUnsupportedIdentitiesStillFail
  and TestCandidateNodeSchemaContract at that baseline. Their assertions are unchanged.
- Added TestRegisteredAncestriesAreReusedNotProposed, 7 tests asserting canonical reuse against the
  live registry.
- Added TestSameLabelIdentitiesStayDistinctAgainstTheRegistry, 4 tests for the mixed registered/unregistered
  same-label case.
- Replaced test_no_canonical_state_is_created with test_no_canonical_state_is_written, which hashes
  the canonical directory before and after a dry compile instead of asserting the directory is absent.
  The old assertion was true only before the first integration; the property DEC-2026-0087 requires
  is that a read-only compile creates and changes nothing, which holds in both states.
deliberately_not_changed:
- 'No production code. compiler.py, registry.py, vocab.py, governance.py and the scanner are untouched:
  the compiler''s behaviour was correct throughout and only the fixtures were stale.'
- _bootstrap.py and every other Builder test module, so no shared fixture shifts under another module.
- No registry, canonical file, graph artifact, schema, contract or Integration record. INT-20260922-002
  stands exactly as written.
not_done:
- IMP-DEC-2026-0095-r01 was not edited, withdrawn or approved; its successor establishes the restored
  gate.
- No other Builder test module was audited for the same assumption. The risk is real and recorded
  in post_implementation_requirements of DEC-2026-0097, but auditing them is outside this Decision's
  bounds.
- No basicdnd or rc work of any kind was performed. DEC-2026-0086 remains binding.
