acceptance_results:
- acceptance_test_index: 1
  result: passed
  evidence: 'IsolatedShadowdarkCase constructs its registry rather than loading one: NodeRegistry(path=...isolated-fixture-nodes.csv)
    with no file behind it, so no integration can change what the tests mean. Its own test_the_isolated_baseline_really_is_empty
    asserts the registry is empty and that none of the six identities resolves in it, which makes
    the fresh-proposal assertions non-vacuous by construction rather than by assumption. TestAncestryNodeProposals,
    TestAHeldAncestryIdentityStillBlocks, TestUnsupportedIdentitiesStillFail and TestCandidateNodeSchemaContract
    now inherit it, and against that baseline every DEC-2026-0087 ancestry ID still compiles to an
    ordinary proposal with kind ancestry, prefix_approved true, disposition reviewer_may_approve and
    no node_identity escalation, on the fresh, carried-forward and both-endpoint paths. No assertion
    was weakened to reach this: the expectations are exactly the ones r01 of DEC-2026-0087 recorded.'
- acceptance_test_index: 2
  result: passed
  evidence: 'TestRegisteredAncestriesAreReusedNotProposed reads the live registry on purpose. It first
    asserts its own premise -- that all six approved identities are registered -- so that an unregistered
    one would fail here rather than silently assert nothing, and it derives its expectations from
    the registered identities rather than from a transcribed list. For each, compiling a candidate
    that names it produces no entry in node_additions and reports node_proposal_resolved_to_canonical,
    raises no node_identity escalation and no identity_ambiguous finding, and leaves its dependent
    edge free of endpoint_unresolved. The registry''s stored label and kind are checked against the
    Decision''s own authorized values. Measured: all six of ancestry_dwarf, ancestry_elf, ancestry_goblin,
    ancestry_half_orc, ancestry_halfling, ancestry_human are canonical among 30 registered Shadowdark
    nodes.'
- acceptance_test_index: 3
  result: passed
  evidence: TestSameLabelIdentitiesStayDistinctAgainstTheRegistry exercises the harder direction,
    where ancestry_dwarf is canonical and monster_dwarf is not, which is exactly when a label-based
    resolver would collapse them. The registered ancestry is not proposed again, the unregistered
    creature remains an ordinary monster-kind proposal with prefix_approved true and disposition reviewer_may_approve,
    no identity_ambiguous finding or identity_resolution escalation is raised, and the compiled row
    keeps both endpoints exactly as written. The original two-fresh-proposal version of this case
    is retained on the isolated baseline in TestUnsupportedIdentitiesStillFail, so both states are
    covered rather than one standing in for the other.
- acceptance_test_index: 4
  result: passed
  evidence: 'The focused module runs 78 tests, up from the 62 it carried before, and the complete
    Builder suite runs 892 tests, up from 876; both exit 0 with no failures or errors. The 24 failures
    IMP-DEC-2026-0095-r01 recorded are gone, and no test was deleted to achieve that: the count rose
    by the 16 cases added here. Exact commands and outcomes are in the validation block and in build/reports/IMP-DEC-2026-0097-r01.validation.json.'
- acceptance_test_index: 5
  result: passed
  evidence: IMP-DEC-2026-0095-r02 is published alongside this report. It names r01 in supersedes,
    carries r01's scanner evidence by exact ID, path and checksum reference rather than by restatement,
    records the now-passing complete Builder suite, and is approval_ready true because all six DEC-2026-0095
    acceptance tests pass. r01 is untouched immutable history and is not edited, withdrawn or approved.
    The reference is safe to make because both files r01 pinned, scan_agent_queues.py and its test
    module, are byte-identical to the checksums r01 recorded; this report verified that before publishing
    rather than assuming it.
