changes_in_this_revision:
- 'scan_agent_queues.py: in `_route_leaf_gur`''s blocked branch only, replaced
  the single generated `reason` assignment with two parts -- `authored_reason =
  str(handoff.get("reason") or "").strip()` and a `blocking_note` built from the
  existing `_blocking_ids(leaf_gur.data)` call exactly as r01 built it -- joined
  with `" ".join(part for part in (authored_reason, blocking_note) if part)`.
  No other line in the function changed; the malformed, terminal, and absent
  branches and the unconditional `BUILDER-GUR` append are untouched.'
- 'test_scan_agent_queues.py: added one test,
  `test_a_blocked_leaf_preserves_its_authored_reason`, directly after the
  existing `test_a_blocked_leaf_preserves_its_blocking_ids`. It asserts the
  `BLOCKED_HANDOFF` fixture''s authored `reason` string and its blocking ID both
  appear in the routed item''s `Reason`. No other test in the file was changed.'
