- acceptance_test_index: 3
  result: passed
  evidence: 'REV-IMP-DEC-2026-0105-r01-r01 disposed this test `failed`: the
    blocked-GUR branch correctly produced one blocked item, the declared role,
    and preserved blocking_ids, but replaced the handoff''s authored `reason`
    with a generated "waiting on: <ids>" string instead of preserving it
    alongside the IDs, per WORK_QUEUES 1.35 rule 6a''s literal "blocking_ids
    and reason preserved".


    Corrected: `_route_leaf_gur`''s blocked branch now reads
    `handoff.get("reason")` into `authored_reason`, builds a separate `"Blocked
    on: <sorted ids>"` note from the existing `_blocking_ids` call, and joins
    the two with a space (dropping either half only if it is empty, which the
    reason half cannot be on a conforming handoff since the envelope schema
    requires `reason` non-empty). The dynamic role/queue routing and the early
    `return` before the unconditional `BUILDER-GUR` append are byte-for-byte
    unchanged from r01, as the Review required.


    `test_a_blocked_leaf_preserves_its_authored_reason` (new) asserts both
    `self.BLOCKED_HANDOFF["reason"]` -- the exact fixture string, "monster
    level has no identity and no approved prefix covers a creature statistic"
    -- and the blocking ID `ESC-2026-09-30T06.00.29.086Z` appear in the same
    routed item''s `Reason`, verified live by running the test. The other ten
    r01 tests, including `test_a_blocked_leaf_preserves_its_blocking_ids` and
    the ready/terminal/malformed/legacy regression, pass unmodified, so the
    blocking-ID half of the requirement and every other branch are provably
    unaffected by this change.'
