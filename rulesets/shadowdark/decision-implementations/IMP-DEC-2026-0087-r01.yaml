- acceptance_test_index: 2
  result: passed
  evidence: 'Verified as an Architect-owned input. The Shadowdark edge schema''s closed endpoint
    patterns admit all six ancestry IDs in both source_id and target_id, and reject `ancestry_half-orc`,
    `race_dwarf`, `ancestor_dwarf` and `Ancestry_dwarf`. The open `ancestry_<stem>` grammar
    is retained rather than replaced by six constants, so `ancestry_halforc` is admitted by
    grammar and remains an identity-review error rather than a schema rejection, exactly as
    the Decision requires. The GUR and GUP schemas enum constitution_version to [''1.0'',
    ''1.1''] and carry neither 1.2 nor 2.0; schema_version remains a separate unenumerated
    property, so widening one version axis did not widen the other. schemas/adnd1e and schemas/basicdnd
    contain no occurrence of ''ancestry''. Executable checks: TestSchemaInputs, 7 tests, all
    passing.'
- acceptance_test_index: 3
  result: passed
  evidence: 'Parameterised over the six identities read from the Decision rather than transcribed,
    on synthetic GUR fixtures written to temporary files. Each identity compiles to a node
    proposal with kind ''ancestry'', prefix_approved true and disposition ''reviewer_may_approve'',
    with no node_identity escalation; before this change the same proposal reported an unapproved
    prefix. Each named benefit proposes as kind ''abil'' with prefix_approved true. The fresh,
    carried-forward and both-endpoint paths are each exercised, and source page and label
    spelling survive compilation (row page equals the Decision''s page, source_label equals
    its label). No real packet, GUR or registry row was read or written for these assertions,
    and this Decision is not treated as a Review. Executable checks: TestAncestryNodeProposals,
    6 tests, all passing.'
- acceptance_test_index: 4
  result: passed
  evidence: 'Scoping is demonstrated in both directions. RulesetVocabulary loads `ancestry_`
    for shadowdark and not for adnd1e or basicdnd; the global NODE_PREFIXES constant does
    not contain it; prefix_of with no scope still returns None for ''ancestry_dwarf'' and
    ''class_'' for ''class_fighter'', so existing AD&D helper behaviour is unchanged. constitution_prefixes
    resolves per ruleset root and falls back to the AD&D constants for a root with no constitution,
    and a bare Governance() keeps those constants. For holding: a synthetic pending ESC naming
    ''ancestry_dwarf'', loaded from a temporary tree, is recognised as holding that identity
    under Shadowdark''s table and holds nothing under adnd1e''s -- which is the proof the
    recognition comes from the ruleset''s own governance. Compiling a dependent GUR against
    that held identity yields architect_required true, disposition ''requires_architect_decision''
    and a node_registration_held_by_package escalation, while the unheld benefit beside it
    stays reviewer-approvable. An unsupported prefix still fails, and an ancestry and a creature
    sharing the label ''Dwarf'' compile to two separate proposals of kinds ''ancestry'' and
    ''monster'' with no merge. No real escalation was filed, altered or resolved. Executable
    checks: TestPrefixScopeIsPerRuleset (9), TestAHeldAncestryIdentityStillBlocks (3), TestUnsupportedIdentitiesStillFail
    (2), all passing.'
- acceptance_test_index: 5
  result: passed
  evidence: 'Both named GURs -- GUR-PKT-SD-011-014-character-overview-and-starting-level-r01
    and GUR-PKT-SD-015-015-stats-and-stat-modifiers-r01, which are exactly the Decision''s
    unaffected_inputs -- declare constitution_version ''1.0'' and dry-compile under the current
    1.1 vocabulary with no constitution_version_mismatch finding. The older input version
    is reported, not silently accepted: both raise constitution_version_older_than_compiler,
    and the compiled envelope records constitution_version ''1.1'' with gur_constitution_version
    ''1.0''. A synthetic GUR declaring ''9.9'' still fails with constitution_version_mismatch.
    Unrelated findings remain visible and were not suppressed: every edge in both GURs omits
    `evidence`, so the stats GUR reports 28 errors (14 edge_fields_missing and 14 evidence_illegal
    over 14 edges) and the overview GUR 44 (21 and 21 over 21 edges, plus 2 endpoint_unresolved).
    Those are Analyst defects in immutable artifacts and are reported, not repaired, here.
    The compile is read-only: both GUR files hash identically before and after, no source
    or manifest was touched, no GUP was published, and rulesets/shadowdark/canonical does
    not exist after compilation. Executable checks: TestHistoricalGursRevalidate (9) and TestOpenScalarFieldsDoNotCrashTheCompiler
    (2), all passing.'
- acceptance_test_index: 6
  result: passed
  evidence: Exact commands, exit codes and measured outcomes are recorded in the validation
