acceptance_results:
- acceptance_test_index: 1
  result: passed
  evidence: 'Verified as an Architect-owned input, not authored here. The constitution reads
    Version 1.1 at line 3 under authorities DEC-2026-0083 and DEC-2026-0087; ruleset.yaml
    declares constitution_version ''1.1'', the same current version. Section 2 lists `ancestry_`
    in the prefix table as character ancestry and keeps ancestry, class and creature identity
    distinct; section 2.1 names all six IDs with separately named `abil_` benefits (ancestry_dwarf,
    ancestry_elf, ancestry_goblin, ancestry_half_orc, ancestry_halfling, ancestry_human),
    states the machine kind `ancestry`, rules the Half-Orc hyphen becomes an underscore, distinguishes
    `sys_ancestry` as the subsystem, and forbids inheritance or import of another ruleset''s
    identities. The character-race registry is status inactive with an empty membership set
    that is explicitly not a gate. Section 9 admits historical 1.0 GURs only with full revalidation,
    requires new artifacts to declare the current version, fails unknown or future versions,
    and forbids rewriting immutable GURs for the additive bump. The four declared anchors
    were each read in place, not string-matched. Executable checks: TestGovernanceInputs,
    8 tests, all passing. The contract''s measured checksum and version are recorded in versioned_contract_content.'
