changes_in_this_revision:
- 'vocab.py: added a shadowdark entry to HISTORICAL_ACCEPTED_GUR_CONSTITUTION_VERSIONS admitting
  ''1.0'' for revalidation, and a constitution_prefixes(ruleset_root) reader so a caller holding
  only a ruleset root can scope itself.'
- 'registry.py: prefix_of gained an optional prefixes argument and now orders candidates longest-first
  then lexically. Omitting the argument keeps the AD&D 1e constants, so every existing caller
  is unchanged.'
- 'compiler.py: added Compiler._prefix_of and routed all 10 in-class prefix checks through
  it, so they read this compile''s ruleset rather than the global AD&D constants; added the
  _field_text coercion declared in scope_note and applied it to 12 edge field reads.'
- 'governance.py: Governance carries a node_prefixes field defaulting to the AD&D constants,
  Governance.load populates it from the ruleset''s own constitution, and _node_ids_in_values
  takes the scope from its caller.'
- 'tooling/builder/tests/test_shadowdark_ancestry.py: new, 46 tests across the six acceptance
  tests.'
attribution_note: The four source files pinned in implementation_files also carry uncommitted
  changes from the DEC-2026-0080 lineage, already reported in IMP-DEC-2026-0080-r04 and not
  re-claimed here; the repository working tree holds further unrelated in-flight edits by
  other roles, all preserved untouched. The changes attributable to this Decision are exactly
  those in changes_in_this_revision, so a whole-file diff against HEAD will show more than
  this report claims authorship of.
scope_note: 'One change falls outside the Decision''s literal exact_diff and is declared rather
  than folded in. compiler.py now reads every edge field through a `_field_text` helper that
  coerces a scalar to text before validating it. Both immutable Shadowdark GURs write `pass:
  1` as an integer, which the constitution permits because `pass` is open-ended, and the compiler
  assumed a string: the dry compilation acceptance test 5 requires raised AttributeError on
  an input the same Decision forbids editing. The fix was therefore necessary to satisfy the
  Decision, and it is confined to a Builder-owned file. It weakens no gate -- coercion happens
  before validation, never instead of it, and a test asserts that an integer in the closed
  `evidence` field is still reported as evidence_illegal rather than quietly accepted. The
  Reviewer should treat this as a scope question in its own right.'
bugs_found_by_the_new_tests:
- The compiler crashed on a schema-valid integer `pass` value, which made the Decision's required
  read-only dry compilation impossible. Fixed by _field_text; see scope_note.
- prefix_of scanned a frozenset first-match-wins, so if two approved prefixes ever nested
  the same ID could resolve differently between runs. Candidates are now ordered longest-first
  and then lexically, and a test asserts the result is stable across repeated calls.
defects_for_the_architect:
- Both immutable Shadowdark 1.0 GURs omit `evidence` on every edge (14 edges in the stats
  GUR, 21 in the overview GUR), so each edge reports both edge_fields_missing and evidence_illegal.
  The overview GUR additionally leaves 2 endpoints unresolved. This is an Analyst defect in
  the artifacts' own lifecycle, is out of scope for DEC-2026-0087, and was deliberately left
  visible rather than repaired or suppressed. It will block those packets' progression until
  the Analyst reissues or the Architect rules otherwise.
canonical_state: 'No canonical, registry, source or manifest file was written by this work.
  rulesets/shadowdark/canonical does not exist and was not created; a test asserts its absence
  after compiling both historical GURs. rulesets/shadowdark/registries/nodes.csv is unchanged
  at its pinned checksum in verified_inputs. No GUP was published: ancestry GUP publication
  awaits the independent implementation approval this report requests.'
