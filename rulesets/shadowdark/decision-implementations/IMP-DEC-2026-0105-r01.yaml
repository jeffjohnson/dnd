changes_in_this_revision:
- 'scan_agent_queues.py: `_route_leaf_gur` takes a new `blocked` parameter (its
  one call site in `scan_repository` now passes the function''s existing local
  `blocked` list, already declared and already wired into `_build_result`).
  Inside the function, the handoff-shape check for a conforming handoff now
  reads `readiness` once and adds a `readiness == "blocked"` branch before the
  unconditional ready append: it resolves the declared role via `_handoff_role`
  (falling back to `"Analyst"` only if the conforming handoff somehow names
  `next_role: none`, which the docstring notes cannot occur for a role that
  reached this branch under the schema''s blocked-requires-blockers rule in
  ordinary use), builds the reason string from `_blocking_ids` the same way the
  existing blocked-GUP branch does, appends one `state="blocked"` item with
  `Queue: f"{role.upper()}-BLOCKED-GUR"`, and returns -- never reaching the
  `BUILDER-GUR` append below it. The malformed and absent-handoff branches, and
  the unconditional `BUILDER-GUR` append itself, are byte-for-byte unchanged
  except for the added `blocked` parameter threading past them.'
- 'test_scan_agent_queues.py: `GurHandoffRoutingCase` gained a `BLOCKED_HANDOFF`
  class fixture modelled on the real GUR-PKT-SD-189-189-monster-attributes-r01
  blocker, a `blocked_routed` helper mirroring the existing `routed` helper but
  reading `BlockedItems`, and 11 new tests under a new "acceptance test 5" section:
  exactly one item and it is in BlockedItems; never among ready Items; routes to
  the declared Role/Queue; preserves blocking_ids in Reason; never produces
  BUILDER-GUR; no legacy-inference or invalid-handoff diagnostic; ReadyCount 0 /
  BlockedCount 1; role routing is dynamic (builder as well as architect); a
  malformed blocked shape (empty blocking_ids) still repairs through the
  existing ANALYST-GUR-REPAIR path, not this one; and one combined regression
  test running ready/terminal/malformed/legacy/blocked GURs side by side.'
