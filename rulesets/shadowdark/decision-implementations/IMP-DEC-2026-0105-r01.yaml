- acceptance_test_index: 3
  result: passed
  evidence: 'WORK_QUEUES.md rule 6a, added at 1.35, states the uniform rule
    literally: a conforming blocked active-leaf artifact of any handoff-bearing
    kind, GURs included, is one blocked item for its declared next_role,
    contributes nothing to ReadyCount, and never falls through to ordinary or
    legacy routing. Structured contract-content evidence is recorded in
    versioned_contract_content below.


    The runtime half -- the scanner actually doing this -- is implemented and
    proven by the tests: `_route_leaf_gur` in tooling/common/scan_agent_queues.py
    gained a `readiness == "blocked"` branch, checked after the existing
    `terminal` branch and before the unconditional `BUILDER-GUR` append, so a
    conforming blocked handoff returns early into a new `blocked.append(...)`
    call instead of falling through. The blocked item''s `Role`/`Queue` are read
    from the handoff''s own `next_role` via the existing `_handoff_role` helper
    (not a hardcoded role), its `Reason` lists the handoff''s own `blocking_ids`
    via the existing `_blocking_ids` helper, and it is appended to a `blocked`
    list newly threaded through the function''s signature and its one call site
    -- the same list `scan_repository` already sorts, counts into `BlockedCount`,
    and serializes as `BlockedItems`, separate from `ReadyCount`/`Items`.
    `TestGurHandoffRoutingCase` (11 new tests) exercises: exactly one blocked
    item and no ready item for a conforming blocked GUR; the item lands in
    `BlockedItems` with `State: blocked`; `Role`/`Queue` follow the handoff''s
    declared role dynamically (proven with both `architect` and `builder` as
    `next_role`, not just the live monster-attributes shape); the blocking ID
    appears in `Reason`; no `BUILDER-GUR` item is produced; no
    `legacy_handoff_inference` or `gur_invalid_handoff` diagnostic fires;
    `ReadyCount` is 0 and `BlockedCount` is 1; a malformed `blocked` shape with
    empty `blocking_ids` still routes to `ANALYST-GUR-REPAIR` as before, not
    through the new branch; and one combined test publishes a ready, a terminal,
    a malformed, and a legacy-absent GUR side by side with a blocked one,
    asserting each still lands exactly where the pre-existing tests already
    proved it does.


    Live reproduction against the actual GUR-PKT-SD-189-189-monster-attributes-r01
    that raised the escalation is recorded for the record rather than replayed
    live: before this fix, `scan_agent_queues.py --json` emitted a `BUILDER-GUR`
    ready item for that exact blocked r01 leaf (Reason: "Active-leaf GUR has no
    consuming GUP"), reproducing the defect the Decision names. Analyst published
    the r02 successor (step 2) while this report was being written, which
    supersedes r01 and removes it from active-leaf routing before this fix could
    be demonstrated against it live; the synthetic focused fixtures above are
    the durable regression coverage and do not depend on that packet''s state.'
