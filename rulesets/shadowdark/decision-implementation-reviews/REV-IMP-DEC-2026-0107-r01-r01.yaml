      Independently verified DEC-2026-0107's authorized test-1 semantics,
      checksum, current WORK_QUEUES checksum/version 1.36, and all three
      substantive anchors: same-or-ancestor GUP within the validated packet
      lineage; strict ruleset/book/packet/unrelated-GUP bounds with disconnected
      roots preserved; and unchanged decision-migration grouping.
    verified_versioned_contract_content:
      authority:
        id: DEC-2026-0107
        path: rulesets/shadowdark/escalations/decisions/DEC-2026-0107.yaml
        checksum: sha256:f2b46fe0af7ba6f1a59207377fabd718f807c7a0510f5e532b4d84dc80f7c40c
        authorized_acceptance_test_index: 1
