          checksum: sha256:7ab4be508e13270ed16f612826e31be26b48d8c73871275e791bb6f220db6de2
          observed_version: '1.36'
          minimum_version: '1.36'
          anchors_present:
            - Packet-update Review supersession may cross GUP revisions only within one validated packet lineage and only to the same or an ancestor GUP.
            - Review links cannot cross ruleset, book, packet, or unrelated GUP lineage; disconnected roots remain separate.
            - Decision-migration Review lineages retain their existing grouping rules.
  - acceptance_test_index: 2
    disposition: verified
    evidence: >-
      Independently inspected the three new scanner functions and both rewired
      call sites. The validated GUP ancestor walk bounds candidate collection;
      explicit links pull only reached ancestor Reviews into a component; and
      newest-first processing prevents a consumed predecessor handoff from
      reappearing. The 12 helper tests and 14 synthetic full-pipeline tests
      passed. The defect recorded under acceptance test 3 is a separate
      duplicate-ID guard regression in candidate collection.
  - acceptance_test_index: 3
    disposition: failed
    evidence: >-
      Duplicate IDs are silently coalesced before `_active_leaf` can reject
      them. `_packet_review_candidates` stores both its ancestor pool and
      combined component in dictionaries keyed by `artifact_id`; the second
      same-ID Review overwrites or is skipped as already present. I reproduced
      the boundary with two `REV-DUP` Review artifacts in ancestor/current GUP
      buckets, where the current Review explicitly supersedes `REV-DUP`:
      candidate_count was 1, a leaf was returned, and diagnostics contained
      only `legacy_revision_inference`, not `duplicate_artifact_id`. The new
      test named `test_duplicate_review_ids_in_the_merged_component_is_an_error`
      directly passes `[c, a]` to `_active_leaf` and bypasses the new collection
      function, so it does not test the implementation path that loses the
      duplicate. This violates DEC-2026-0107's explicit unique-ID and
      fail-closed acceptance requirement.
  - acceptance_test_index: 4
    disposition: verified
    evidence: >-
      Rebuilt an isolated temporary Shadowdark-only queue root from the exact
      named packet lineage and Decision inputs, with no RC files or paths. The
      projection returned LineageErrorCount 0 and no diagnostics; for this
      packet it emitted exactly REVIEWER-DECISION-IMPLEMENTATION for the
      unreviewed report and INTEGRATOR-APPROVED for the pinned existing bundle,
      no REVIEWER-GUP item for GUP r03, and no Builder handoff for the
      predecessor Review. All four LiveCrossGupReviewLineageCase tests passed
      against that isolated root. This is the pre-implementation-Review state;
      it does not authorize sending the bundle to Integrator.
  - acceptance_test_index: 5
    disposition: verified
    evidence: >-
      Reproduced the bounded focused verification requested for this assignment:
      26 TestPacketReviewLineageHelpers and CrossGupReviewLineageCase tests
      passed, and the four LiveCrossGupReviewLineageCase tests passed against
      the isolated Shadowdark-only projection. The full 1020-test module was
      not run because its live tests scan the repository root, outside the
      explicit no-RC scope; the Builder's recorded full-module result remains
      report evidence and was not represented as independently rerun here.

