acceptance_dispositions:
  - acceptance_test_index: 1
    disposition: verified_versioned_contract_content
    evidence: >-
      Independently read the three current contracts and their declared versions,
      checked every substantive anchor against its governing section, and
      verified the exact Decision authorization and checksums. The direct-handoff
      sections of all five role instructions link HERDR_HANDOFFS and specify
      their distinct routing duties. Both retired definition files are absent;
      the live manifest has exactly the five active roles. Missing report pins
      for other surviving governance files are a test-7 coverage defect, not
      an absent contract anchor.
    verified_versioned_contract_content:
      authority:
        id: DEC-2026-0082
        path: rulesets/adnd1e/escalations/decisions/DEC-2026-0082.yaml
        checksum: sha256:13fd6a71489166a6adb10a44bb0dbfe8a4440f9fa89a75c5305a82bb50421f47
        authorized_acceptance_test_index: 1
      authorized_acceptance_test_index: 1
      contracts:
        - path: contracts/HERDR_HANDOFFS.md
          checksum: sha256:efdaca2e9d52435cb8bdba3ff38e3ef8caa0d7714f9269ee62a7265a0ea73816
          observed_version: '1.0'
          minimum_version: '1.0'
          anchors_present:
            - Five roles communicate directly without Dispatcher.
            - One repository agent processes work at a time, including reloads.
            - Dependencies determine priority and only one next action is handed off.
            - Deferred delivery waits for sender idle and never retries ambiguous submission.
        - path: contracts/ROLE_CONTEXT_LOADING.md
          checksum: sha256:95f4d7a07529a3828d75abe7cab5943db6c6544c870fe2ccbfaa0e9eed254ec9
          observed_version: '1.2'
          minimum_version: '1.2'
          anchors_present:
            - Dispatcher is retired and DEC-2026-0081 activation is cancelled.
            - Five-role scoped receipts and fresh task evidence remain required.
        - path: contracts/WORK_QUEUES.md
          checksum: sha256:f04b5b0c911223365515dd94d28d8d5358ee5ab4c70665810b9ce4188b9d2b11
          observed_version: '1.30'
          minimum_version: '1.30'
          anchors_present:
            - Direct herdr coordination does not change artifact consumption or approval.
  - acceptance_test_index: 2
    disposition: verified
    evidence: >-
      Independently inspected role_context.py and reran its 80 tests, including
      manifest schema validation, scoped cache hits, checksum and session
      invalidation, bounded stable inputs, format-1 receipts, and dispatcher
      refusal without writes. The current five-role manifest validates. Hash-only
      checks of DEC-2026-0081 and IMP-DEC-2026-0081-r01 match the report's
      historical pins; neither retired artifact was reviewed or modified.
  - acceptance_test_index: 3
    disposition: failed
    evidence: >-
      Independent probes accept a request missing endpoint, scope, inputs,
      prerequisites and ordered_next_steps; accept a traversal-shaped nonexistent
      scope; and accept an existing sibling path sharing the repository's string
      prefix. A replaced sender session/role, a wrong recipient role alias, and
      duplicate recipient aliases still result in a fake prompt. Code checks
      recipient native session only if supplied, never checks sender identity
      beyond pane membership, and does not verify inherited endpoint identity.
      ValidateOnly itself makes no endpoint call or state write, but its guard
      coverage is insufficient. See F1 and F2.
  - acceptance_test_index: 4
    disposition: failed
    evidence: >-
      The supplied deterministic working-sender and unexpected-active-peer tests
      pass. An independent test with two concurrently running fake relays
      confirms the lock prevents simultaneous prompts. However, a prompt response
      whose result status is blocked or merely submitted is immediately recorded
      as settled and the lock is released, without verifying recipient settlement.
      Exact sender and role-alias binding failures also permit delivery. Thus the
      lock does not establish the required full-turn serialization. See F2 and F3.
  - acceptance_test_index: 5
    disposition: failed
    evidence: >-
      Calling ExecuteRequest twice with the identical request sends two prompts.
      An unrelated uncertain request does not block ExecuteRequest. Killing a
      fake relay after its prompt begins leaves submitting evidence, but a
      subsequent execution with the same ID overwrites that evidence as refused
      when the surviving lock is encountered. A 1000ms request with a delayed
      fake endpoint took 9.692 seconds and still submitted; Invoke-Herdr has no
      process-level bound. Existing schedule-only duplicate and prompt-error
      tests pass but do not cover these bypasses. See F3, F4 and F5.
  - acceptance_test_index: 6
    disposition: verified
    evidence: >-
      Independently reran the supplied priority, exact-prompt, unchanged-input,
      local-state-only and reload-only fixtures. Their ordered list distinguishes
      the blocked dependent GUR from an independent ready GUR. Code transports
      the worker's prompt without choosing priorities, processing an artifact,
      or issuing an onward assignment. The reload fixture carries an empty
      next-step list and an instruction-only prompt. This transport-only judgment
      does not waive request completeness or identity failures under test 3.
  - acceptance_test_index: 7
    disposition: failed
    evidence: >-
      The supplied focused run passes all 124 tests (80 context plus 44 relay).
      The complete common suite passes all 1221 tests in 460.422s.
      Independent relay acceptance probes run 13 tests with 12 failures and one
      passing two-relay exclusion test. All ten declared implementation-file
      checksums and the validation-report checksum match, but nine surviving
      exact_diff governance paths required by coordination_constraints are not
      pinned in implementation_files. Published evidence is therefore incomplete,
      and passing supplied suites cannot establish the failed safety criteria.
