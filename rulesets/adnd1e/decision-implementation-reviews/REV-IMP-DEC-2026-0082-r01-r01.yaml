findings:
  - id: F1
    owner: builder
    acceptance_test_indexes: [3]
    path: tooling/common/send-agent-handoff.ps1
    locus: 'Test-HandoffRequest, lines 180-276'
    defect: >-
      Required request evidence is optional or unchecked. Inputs can omit paths
      and checksums; scope and endpoint identity are not validated. StartsWith
      without a path-separator boundary admits existing prefix siblings.
    required_correction: >-
      Enforce the Decision's complete typed request, explicit applicable scope,
      exact checksummed inputs and prerequisites, nonempty authority/action,
      inherited endpoint identity and bounded ordered next steps. Resolve paths
      with real repository containment, not a bare string prefix. Reject missing,
      malformed, stale and escaping evidence before scheduling. Preserve offline,
      no-write ValidateOnly behavior; do not invent source IDs for reloads.
  - id: F2
    owner: builder
    acceptance_test_indexes: [3, 4, 5]
    path: tooling/common/send-agent-handoff.ps1
    locus: 'Get-BoundAgents and Invoke-Execute identity checks'
    defect: >-
      Sender selection trusts a pane alone. Recipient selection takes the first
      pane match and only optionally compares name/session. Wrong or ambiguous
      role aliases and a replaced sender can still authorize delivery.
    required_correction: >-
      Require and verify both parties' unique role aliases, expected providers,
      resolved repository roots, panes and native sessions, including inherited
      endpoint identity. Recheck exact identities immediately before submission
      and through settlement. Missing, changed, ambiguous, unknown or blocked
      bindings must fail closed; never select the first ambiguous match.
  - id: F3
    owner: builder
    acceptance_test_indexes: [4, 5]
    path: tooling/common/send-agent-handoff.ps1
    locus: 'Invoke-Execute response handling, lines 569-587'
    defect: >-
      Any parseable zero-exit response without a top-level error becomes
      acknowledged and settled, even when result.status is blocked or submitted.
    required_correction: >-
      Distinguish delivery acknowledgment from verified recipient completion.
      Validate the actual response envelope and re-resolved native recipient
      status. Hold exclusive serialization through confirmed idle/done settlement.
      Blocked, unknown, malformed, changed or ambiguous results must retain
      reconciliation-required uncertainty and must not authorize another send.
  - id: F4
    owner: builder
    acceptance_test_indexes: [4, 5]
    path: tooling/common/send-agent-handoff.ps1
    locus: 'Invoke-Schedule, Invoke-Execute, Write-State'
    defect: >-
      Duplicate and outstanding checks exist only in Schedule and are not
      atomically claimed there. ExecuteRequest bypasses them. The lock-refusal
      path overwrites another execution's possible-delivery evidence as refused.
    required_correction: >-
      Atomically reserve request identity and enforce single outstanding delivery
      under the repository lock at every executable entry point. Require an
      unconsumed scheduled request for execution; bind the queued payload so it
      cannot change after acknowledgment. Persist crash-safe state without
      overwriting submitting, acknowledged or uncertain evidence on retries or
      lock contention. Preserve deduplication for identical/equivalent outstanding
      work and never steal by age. Support the Decision's deferred continuation
      without allowing the next request to submit before prior settlement.
  - id: F5
    owner: builder
    acceptance_test_indexes: [5]
    path: tooling/common/send-agent-handoff.ps1
    locus: 'Invoke-Herdr and Invoke-Execute deadline handling'
    defect: >-
      Native calls run synchronously without a supervisor deadline. Agent-list
      calls have no timeout, and the code can submit after the request deadline.
    required_correction: >-
      Bound every child endpoint call and the whole wait using an enforced
      monotonic deadline, including agent list and prompt. On deadline or process
      interruption, stop safely and retain uncertainty if delivery is possible.
      Never send after the allowed window or trust a child to honor its own flag.
  - id: F6
    owner: builder
    acceptance_test_indexes: [7]
    path: rulesets/adnd1e/decision-implementations/IMP-DEC-2026-0082-r01.yaml
    defect: >-
      implementation_files omits nine surviving governance paths explicitly
      covered by the Decision. The validation report checks only Builder-owned
      path coverage and the smaller declared checksum set.
    required_correction: >-
      In a successor report and fresh validation companion, pin all surviving
      changed or verified exact_diff paths, including the nine paths below.
      Verify deleted files by absence only. Strengthen tests for the reproduced
      safety failures, real concurrent relays, interruption and bounded child
      waits; rerun the focused and complete common suites. Preserve all published
      reports, Reviews and Decisions; do not repair r01 in place.
    missing_paths:
      - AGENTS.md
      - README.md
      - REPOSITORY_STRUCTURE.md
      - agents/architect/INSTRUCTIONS.md
      - agents/analyst/INSTRUCTIONS.md
      - agents/builder/INSTRUCTIONS.md
      - agents/reviewer/INSTRUCTIONS.md
      - agents/integrator/INSTRUCTIONS.md
      - contracts/SOURCE_MARKDOWN.md
