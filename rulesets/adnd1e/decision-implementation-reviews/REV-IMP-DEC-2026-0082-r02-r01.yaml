prior_finding_assessment:
  F1: 'Partially resolved; required fields improved, but R2-R3 remain.'
  F2: 'Alias/provider/pane/session tests pass; endpoint identity remains incomplete under R2.'
  F3: 'Original false-settlement probes pass; native client compatibility still requires R1.'
  F4: 'Replay and protected-state probes pass; scheduler reservation/continuation and unscheduled execution remain under R4.'
  F5: 'Original timeout probe passes; native endpoint supervision is broken under R1.'
  F6: 'Coverage resolved: all 18 surviving exact_diff paths plus the manifest schema are pinned.'
findings:
  - id: R1
    owner: builder
    acceptance_test_indexes: [3, 4]
    path: tooling/common/send-agent-handoff.ps1
    locus: 'Invoke-Herdr, lines 181-224'
    defect: >-
      ProcessStartInfo launches the current PowerShell executable with -File
      followed by HerdrBin for every endpoint. A native .exe is not a PowerShell
      script, so the real installed endpoint cannot execute. Script-only mocks
      conceal this production-path regression.
    required_correction: >-
      Launch native endpoints as native executables with structured argument
      lists, retaining bounded process supervision and inherited environment.
      Support script test doubles explicitly without routing every endpoint
      through -File. Test both native and script endpoints and paths containing
      spaces. Verify the installed client's real response envelope as well as
      terminal status; a mock-invented result.status alone is not vendor evidence.
      Use read-only discovery or isolated mocks, not unapproved live prompts.
  - id: R2
    owner: builder
    acceptance_test_indexes: [3]
    path: tooling/common/send-agent-handoff.ps1
    locus: 'Test-HandoffRequest, lines 337-490'
    defect: >-
      The request is not fully typed: inputs, prerequisites and ordered_next_steps
      may all be null and are silently skipped. The inherited server identity is
      not captured or checked; only the executable pathname is compared.
    required_correction: >-
      Reject null/wrong-type evidence collections and malformed entries; permit
      intentional empty arrays only where appropriate, including reload-only
      requests. Bind and verify the inherited HERDR_SOCKET_PATH endpoint identity
      in the request and durable state before scheduling and delivery. A matching
      executable is not proof that the intended server is being addressed.
  - id: R3
    owner: builder
    acceptance_test_indexes: [3]
    path: tooling/common/send-agent-handoff.ps1
    locus: 'Resolve-InsideRoot, lines 147-170'
    defect: >-
      The trailing-separator fix rejects lexical prefix siblings but still
      accepts a repository-local junction whose target and input file are outside
      the root. The independent fixture validates that external file with its
      correct checksum and receives status valid.
    required_correction: >-
      Resolve physical path targets through reparse points before containment
      comparisons, or fail closed on unsupported linked paths. Apply equivalent
      protection to request, input, prerequisite and operational state paths so
      containment cannot be bypassed through a directory junction or symlink.
  - id: R4
    owner: builder
    acceptance_test_indexes: [4, 5]
    path: tooling/common/send-agent-handoff.ps1
    locus: 'Invoke-Schedule and Invoke-Execute claim, lines 617-708'
    defect: >-
      Schedule still performs duplicate/outstanding checks and queued writes
      without atomic reservation. Execute accepts absent queued state and sends.
      A finishing recipient cannot queue its next action while its parent relay
      holds the lock through settlement; scheduling rejects any outstanding
      parent. This leaves the contract's direct serial continuation unusable.
    required_correction: >-
      Atomically reserve queued identity and bind the payload at scheduling.
      Require that exact unconsumed scheduled record for execution; never create
      authorization merely because no record exists. Distinguish safely staged
      continuation from outstanding delivery, acknowledging one next request
      promptly but holding it until its exact parent settles and releases the
      delivery lock. Preserve refusal of independent competitors, duplicates and
      uncertain predecessors. Cover the entire schedule-to-execute chain in
      deterministic race and continuation tests, not only direct execution.
  - id: R5
    owner: builder
    acceptance_test_indexes: [5]
    path: tooling/common/send-agent-handoff.ps1
    locus: 'Invoke-Execute sender wait, lines 710-735'
    defect: >-
      Every non-settled sender status is treated as working and polled again.
      The blocked-to-idle fake sequence sends a prompt, instead of stopping for
      reconciliation when blocked was observed.
    required_correction: >-
      Continue polling only a verified working sender. Fail closed immediately
      on blocked, unknown or invalid status and preserve the appropriate durable
      stop/reconciliation state. A later idle observation must not implicitly
      authorize resuming a request that encountered an unresolved blocker.
