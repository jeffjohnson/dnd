schema_version: "1.0"
registry_id: adnd1e_character_races
ruleset_id: adnd1e
version: "1.0"
status: active
scope: playable_character_races

membership_policy:
  closure: closed
  amendment_owner: architect
  identity_authority: rulesets/adnd1e/registries/nodes.csv
  mechanical_inheritance: none

broad_classes:
  - human
  - demihuman

members:
  - id: race_dwarf
    label: Dwarf
    broad_class: demihuman
  - id: race_elf
    label: Elf
    broad_class: demihuman
  - id: race_gnome
    label: Gnome
    broad_class: demihuman
  - id: race_half_elf
    label: Half-Elf
    broad_class: demihuman
  - id: race_half_orc
    label: Half-Orc
    broad_class: demihuman
  - id: race_halfling
    label: Halfling
    broad_class: demihuman
  - id: race_human
    label: Human
    broad_class: human

groups:
  - id: race_any
    label: Race
    member_ids:
      - race_dwarf
      - race_elf
      - race_gnome
      - race_half_elf
      - race_half_orc
      - race_halfling
      - race_human
  - id: race_demihuman
    label: Demihuman
    member_ids:
      - race_dwarf
      - race_elf
      - race_gnome
      - race_half_elf
      - race_half_orc
      - race_halfling

non_members:
  - id: race_infravision
    reason: mechanic_not_character_race_identity
  - id: race_subrace
    reason: generic_subrace_concept_not_character_race_identity

notes:
  - Set order has no semantic meaning.
  - IDs use prefixed snake_case; race_half-elf and race_half-orc are invalid spellings.
  - Taxonomy membership does not create graph edges or inherit group mechanics.
  - Source-supported group rules may target race_any or race_demihuman directly.
