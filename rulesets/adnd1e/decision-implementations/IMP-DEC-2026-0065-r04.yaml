acceptance_results:
- acceptance_test_index: 1
  result: passed
  evidence: TestTheAuthorisedException in the 42-test test_admission run above. The Druid r04 parse
    failure is admitted only through DEC-2026-0064's exact record, emits one historical_unreadable_review
    naming DEC-2026-0064 and r04, raises no fatal diagnostic, and leaves every unrelated bundle classified
    by its ordinary Review lineage. Against the live corpus the same notice appears alongside two
    others and the queue still offers ordinary work.
- acceptance_test_index: 2
  result: passed
  evidence: 'TestEveryConditionThatDeniesTheException covers all twelve denials in the 42-test run:
    absent, inactive and re-hashed Decision; missing and altered record; each mismatched pinned artifact;
    a now-parseable r04; a wrong parser fragment; broken r05/r06 links; wrong r06 GUP, disposition
    and handoff; and a changed r01+r06 input set. Each yields review_yaml_unreadable, no ready bundles,
    exit code 2 and no traceback. Field names are fixed per delegation form and a self-delegating
    Decision is refused outright.'
- acceptance_test_index: 3
  result: passed
  evidence: 'TestAnyOtherUnreadableReview in the 42-test run: an approving Review and an unrelated
    packet''s Review are never informational history. Queue and integrate both return exit code 2,
    the transaction runner is not called, no Integration or rejection record is written, and canonical
    and registry bytes are unchanged; restoring valid YAML restores ordinary behaviour.'
- acceptance_test_index: 4
  result: passed
  evidence: Blocked in r03, resolved here. TestOrdinarySemanticsAreUnchanged and the 20-test test_bundles
    run cover valid discovery, manifest checks, Review-withdrawal rules, the rejected and integrated
    buckets, direct decision-migration bundles and dry runs. Against the live corpus queue now exits
    1 on ready work rather than 2, with zero discovery diagnostics, zero queue-integrity entries and
    three informational notices; the dry run completes and reports 57 edges, 11 created identities
    and findings unchanged at 1691. Informational history alone neither forces exit 2 nor prevents
    a transaction.
- acceptance_test_index: 5
  result: passed
  evidence: 'This revision is the active leaf of the IMP-DEC-2026-0065 lineage the test names. It
    pins this Decision at its current checksum, records focused and full-suite evidence with every
    command naming its working directory, reports all five direct acceptance tests as passed, and
    is approval-ready. r01 through r03 remain immutable history: r01 and r02 were refused by Review,
    and r03 was honestly blocked.'
