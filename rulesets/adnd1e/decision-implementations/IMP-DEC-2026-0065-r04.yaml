why_this_revision: Two reasons, both correcting r03 rather than the implementation. First, r03's second
  validation command named neither a working directory nor a suite path, which tooling/common/tests/test_implementation_evidence.py::test_each_command_says_where_it_ran
  rejects on the active leaf of a report lineage; every command here names its cwd. Second, r03's
  acceptance test 4 was blocked on component discovery reading the filename stem, and DEC-2026-0070
  has since ruled on that and been implemented, so the test now passes on its own terms. The DEC-2026-0065
  admission behaviour itself is unchanged; the pinned file checksums moved because the same files
  carry the later direct-predecessor and discovery work.
scope_note: DEC-2026-0065's exact_diff names bundles.py, cli.py, test_bundles.py and test_transaction.py.
  The admission logic was placed in a new admission.py and its focused tests in test_admission.py,
  a deviation first disclosed in r01 and subsequently named by DEC-2026-0069 and DEC-2026-0070 in
  their own exact diffs. This report pins the files that actually carry the behaviour, including test_transaction.py,
  which r03 omitted.
