acceptance_results:
- acceptance_test_index: 1
  result: failed
  evidence: 'Blocked, not failed by this implementation. `queue` exits 2 while `queue_integrity`
    is empty and both informational notices are present, so admission is not the cause. The cause
    is bundle discovery pairing a manifest with an edge CSV by filename stem: the Bards r02 and
    r03 manifests declare the r01 component, which is the exact path DEC-2026-0068 pins, so both
    are dropped with `manifest present with no .edges.csv component` and both raise a discovery
    diagnostic. Reproduced in an isolated clone whose only difference was a stem-named copy of
    the already-declared component, after which the queue offered the r03 bundle with zero fatal
    diagnostics. The repair is in bundles.py, which is outside this Decision''s declared exact_diff,
    and it is not self-contained: the same change would make the historical r02 bundle discoverable
    and, because its approving Review is the admitted-unreadable one, classifiable as ready. ESC-2026-08-28T11.07.16.219Z
    carries the reproduction, both blockers and three options.'
- acceptance_test_index: 2
  result: passed
  evidence: 'Verified in the 38-test run above. TestTheDirectPredecessorException covers the authorised
    path and eleven denials: a re-hashed or inactive DEC-2026-0068, a delegation naming another
    field, a self-delegating Decision, a now-parseable r02, a wrong parser fragment, a broken
    bundle supersession, a changed component row count, a changed operation partition, a changed
    registered node count, and a mismatched rejection pin. Each yields review_yaml_unreadable,
    no ready bundles, exit code 2 and no traceback. Field names are fixed per delegation form
    rather than read from the Decision, and self-delegation is refused outright.'
- acceptance_test_index: 3
  result: passed
  evidence: test_the_druid_form_still_works_alongside_it suspends DEC-2026-0068 and asserts the
    Bards exception is denied while the Druid notice remains, and the Druid denial suite asserts
    conversely. Neither exception absorbs the other, no code accepts a self-delegating record,
    and no delegation may name a field of its own choosing.
