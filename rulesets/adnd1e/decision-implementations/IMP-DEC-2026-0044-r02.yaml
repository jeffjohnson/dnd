acceptance_results:
- acceptance_test_index: 1
  result: passed
  evidence: 'TestDiscoveryAndPreconditions.test_a_v2_bundle_discovers_as_one_job_with_no_edge_csv
    asserts exactly one Bundle with edges_path None and is_direct_migration true. bundles.DIRECT_MIGRATION_MODELS
    names both models, so the rule 31 exemption is read from the declared operation_model
    rather than from a file simply being absent. v1 and packet-update discovery are unchanged:
    the 30 tests in test_migration pass, and both exclusions stay in force via test_a_forbidden_edge_csv_is_refused
    and rule 32 coverage in test_migration.TestDiscovery.'
- acceptance_test_index: 2
  result: passed
  evidence: 'TestPlanShape covers the grammar: fewer than two retired IDs, duplicate retired
    IDs, a retired ID claimed by two merges, a nonempty additions_proposed / relabels / replacements,
    a canonical_removals entry, a wrong registry_action, a non-paired repoint, and a v1 model
    carrying a merge are each refused with MigrationError. TestDiscoveryAndPreconditions covers
    bundle and corpus conditions: a forbidden edge CSV, baseline drift, an existing survivor
    identity, a retired label mismatch and an incomplete incident set are each blocking before
    any snapshot is taken. TestTransactional covers the post-operation duplicate assertion
    key with a byte-for-byte rollback assertion. Every assertion runs against the real reviewed
    r03 plan.'
- acceptance_test_index: 3
  result: passed
  evidence: test_a_moved_advisory_locator_is_informational_only sets a retired node registry_csv_row
    to 99999 with ID and label intact and asserts blocking_failures is empty while an advisory
    precondition records the observation; migration.merge_locator_observations reports the
    moved row and never blocks. The strict conditions are asserted separately by test_a_retired_label_mismatch_is_refused,
    the missing-ID branch of check_merge_registry, and test_baseline_drift_is_refused for
    the pinned registry checksum.
- acceptance_test_index: 4
  result: passed
  evidence: 'The Integrator-owned half is complete and is what this revision changed. This
    report records complete current Integrator test evidence: every validation command below
    was run at the checksums pinned in implementation_files, and all of them pass, including
    the full 121-test Integrator suite that r01 recorded as failing. The report is routed
    for independent approval under the DEC-2026-0043 direct-implementation lifecycle with
    implemented_by integrator, status proposed, approval_ready true and handoff.next_role
    reviewer. The independent approval itself is the Approved implementation Review record
    the Reviewer writes, and is deliberately not claimed here: the implementing role cannot
    certify its own review. This follows the recording convention already used for the Reviewer-consumption
    clause of DEC-2026-0043 acceptance test 4 in IMP-DEC-2026-0043-r04.'
- acceptance_test_index: 5
  result: passed
  evidence: 'All applicable suites pass at the pinned checksums: Integrator 121 of 121, common
    560 of 560, Builder 577 with 30 skipped, and the targeted suites test_migration_v2 25,
    test_migration 30 and test_registration_agreement 4. r01 recorded five errors here. They
    were not in the applier and were not introduced by v2; all five were defects in the shared
    clone fixture, and each is now fixed at its cause rather than suppressed. _rewind stripped
    a registry registration even when a surviving edge from a bundle it did not rewind still
    referenced that node, which left canonical pointing at an unregistered ID and failed the
    re-apply on invariant 1; it now retires only registrations no surviving edge anchors.
    Four tests integrated everything discover returned, which mixes superseded, already-integrated
    and rejected bundles and would apply a GUP alongside the revision superseding it; they
    now rewind and re-apply the same pinned set via reapplied_batch. test_every_csv_row_is_classified_exactly_once
    read every discovered bundle, including direct migrations that are forbidden an edge CSV,
    and once that was fixed it surfaced two rejected bundles whose operation_index classifies
    none of their 98 and 48 rows; it is now scoped to the live queue, because those bundles
    are refused precisely for that defect and asserting the property over them would assert
    that the rejection lifecycle does not exist.'
