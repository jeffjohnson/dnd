  evidence: contracts/WORK_QUEUES.md declares Version 1.20, above the authorized minimum of 1.19. Rule
    19 defines an active revision_required Review as owning a Review-handoff lineage separate from current
    GUP leaf selection, consumed only when a later GUP is in the reviewed GUP's lineage and its provenance.review_id
    exactly names the active Review ID, and states that exact Integration consumption of an Approved bundle
    remains terminal. Tooling-proof rule 49 restates all three as obligations on queue derivation. Queue
    derivation now implements rule 19 with no exception of any kind.
