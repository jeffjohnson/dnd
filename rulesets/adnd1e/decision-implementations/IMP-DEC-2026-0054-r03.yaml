handoff:
  next_role: reviewer
  readiness: ready
  reason: 'Supersedes r02 and applies the exact correction REV-IMP-DEC-2026-0054-r02-r01 required. The
    missing-review_id legacy-consumption branch is removed from queue derivation, along with the review_consumption_inferred
    diagnostic that reported it. A revision-required Review is now consumed by exactly one thing: a same-lineage
    GUP whose provenance.review_id equals the active Review ID. The two tests that pinned the removed
    behavior are replaced by test_a_successor_without_the_field_consumes_nothing and test_only_exact_provenance_consumes,
    which assert the rule as written. The Reviewer''s objection was correct on the governance point: the
    exception was reasoning about the corpus, not an authorized rule, and a tool that invents a second
    consumer because the first is inconvenient is the failure mode this Decision exists to correct. The
    consequence is now visible rather than suppressed: eight pre-field Reviews across six packets surface
    as ready Analyst work -- 064-079-r04-r01, 079-094-r04-r01, 100-109-r04-r01, 119-119-r01-r01, 120-120-r02-r01,
    120-120-r03-r01, 122-122-r02-r01 and 122-122-r03-r01. Their successor GUPs record no review_id at
    all, and six of the eight sit in lineages that are approved and integrated. Whether that history is
    retired, and on what evidence, is an Architect question this report does not answer and this implementation
    no longer prejudges.'
  blocking_ids: []
