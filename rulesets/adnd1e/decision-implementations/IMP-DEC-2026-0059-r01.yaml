handoff:
  next_role: reviewer
  readiness: ready
  reason: 'DEC-2026-0059 is the active leaf of the DEC-2026-0057 lineage, so this one report carries the
    whole lineage: the post-approval versioned contract-content snapshot, the UA exemption findings, and
    the repair sequence. The snapshot closes a loop this Builder reported twice -- implementation-file
    checksums had a post-approval snapshot under DEC-2026-0046 and contract-content evidence did not,
    so each governance bump reopened every completed Decision that pinned the contract. It is visible
    working in this scan: WORK_QUEUES moved 1.21 to 1.22 and ARTIFACT_LIFECYCLE 1.17 to 1.18 in the same
    change, and the 0045, 0052 and 0055 lineages stayed complete instead of returning to Builder as they
    did on the previous bump. One implementation note the Reviewer should look at directly. The first
    attempt routed every contract-content finding into the snapshot, which made two existing tests fail
    -- a Reviewer who dropped an anchor, and one who recorded a version the file never carried, both became
    invisible once approved. The rule now turns on whether the file actually moved: if the contract still
    hashes to what the evidence pinned, any disagreement with it was false when written and stays an error
    permanently, and only a changed checksum can turn a once-correct finding into history. That discriminator
    is mine, not stated in WORK_QUEUES 1.22, and it is what keeps the snapshot from laundering a bad record.
    Separately, IMP-DEC-2026-0053-r02 still carries a stale-checksum diagnostic and was deliberately left
    alone: this Decision names three reports for reissue and 0053 is not one of them.'
  blocking_ids: []
