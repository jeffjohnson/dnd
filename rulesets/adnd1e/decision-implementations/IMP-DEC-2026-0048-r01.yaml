acceptance_results:
- acceptance_test_index: 1
  result: passed
  evidence: VERIFIED AGAINST THE PUBLISHED FILES, WHICH THE ARCHITECT WROTE. contracts/WORK_QUEUES.md
    is Version 1.15; core rule 16 (lines 58-64) makes a contract version a minimum-version predicate only
    under declared versioned_contract_content semantics or a later legacy authorization, and states that
    an unstructured exact-version statement stays literal. The 'Versioned Contract-Content Acceptance'
    section (line 66) requires 'Version N or later' plus enumerated paths, minimums and anchors, fixes
    the outcome as passed in the report and verified_versioned_contract_content in the Review, and says
    in terms that it is not retired_by_lineage. Contract acceptance test 48 records the queue criteria.
    contracts/ARTIFACT_LIFECYCLE.md is Version 1.11 and its section 6 (lines 197-203) gives the same rule
    as current-state verification rather than a retirement outcome.
- acceptance_test_index: 2
  result: passed
  evidence: 'IMPLEMENTED AND TESTED. schemas/common/architect-decision.schema.json extends acceptance_test_semantics.kind
    with versioned_contract_content, requires its `contracts` when that kind is declared, adds contract_version_acceptance_authorizations
    pinning decision_input, acceptance_test_index and contracts, and adds $defs.contractAnchorSet requiring
    path, minimum_version and a nonempty substantive_anchors set. decision-implementation.schema.json
    adds the versioned_contract_content evidence block (authority, authorized index, and per-contract
    path, checksum, observed and minimum version, anchors_present) and forbids carrying it on a retired_by_lineage
    result. decision-implementation-review.schema.json adds the verified_versioned_contract_content disposition,
    requires its matching evidence and forbids that evidence on any other disposition, and admits the
    disposition to the approved branch. All 49 published Decisions, and every published report and implementation
    Review, validate no worse than before: measured against the pre-change schemas the same legacy artifacts
    fail for the same pre-existing reasons, and this change introduces none.'
- acceptance_test_index: 3
  result: passed
  evidence: 'IMPLEMENTED AND TESTED, ONE NAMED REJECTION PER TEST. tooling/common/scan_agent_queues.py
    adds _versioned_content_errors, folded into _implementation_report_errors so an invalid report is
    diagnostic and cannot be approval-ready, plus _declared_contract_version and _version_tuple, which
    read the version from the contract file rather than from the report. VersionedContractContentCase
    covers absent authority, stale authority checksum, an authorization pinned to a different Decision
    checksum, a mismatched authorized index, no authorization for the claimed index, below-minimum version,
    incomplete anchors, stale contract checksum, an observed version disagreeing with the file, a declared
    minimum below the authorized one, evidence for an unauthorized contract, missing evidence for an authorized
    one, and this outcome on a failed result. test_an_invalid_report_is_not_approval_ready fixes the queue
    consequence: the report does not reach Reviewer and the Decision returns to its owner. test_the_floor_compares_numerically_not_as_text
    pins that 1.9 is below 1.12. Valid evidence stays reviewable: test_valid_evidence_reaches_the_reviewer.
    35 targeted tests pass.'
- acceptance_test_index: 4
  result: passed
  evidence: 'DONE IN THIS SAME BATCH. IMP-DEC-2026-0045-r05 and IMP-DEC-2026-0046-r04 carry versioned_contract_content
    evidence built directly from this Decision''s contract_version_acceptance_authorizations, so the minimums
    and anchors are the Architect''s rather than retyped: DEC-2026-0045 acceptance test 1 against WORK_QUEUES
    1.12 or later and ARTIFACT_LIFECYCLE 1.10 or later, and DEC-2026-0046 acceptance test 4 against WORK_QUEUES
    1.13 or later. Each uses only its own authorized index. Current state recorded and independently checked
    against the files: WORK_QUEUES is 1.15 and ARTIFACT_LIFECYCLE is 1.11, both at or above every floor,
    and all eight authorized anchors were located in the current text before being claimed present. The
    authorization checksums for both target Decisions match the live files.'
