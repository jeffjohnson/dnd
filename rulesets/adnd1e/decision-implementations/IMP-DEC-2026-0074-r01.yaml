acceptance_results:
- acceptance_test_index: 1
  result: passed
  evidence: 'DEC-2026-0068 no longer appears in any queue. Its report IMP-DEC-2026-0068-r03 is approved
    by REV-IMP-DEC-2026-0068-r03-r01, which is terminal, and LiveReplacementConsumptionGateCase asserts
    both facts rather than only the absence -- a test that checked absence alone would pass if the Decision
    merely went missing. The completed history is retained: the originating artifact is still reported
    superseded by handoff_replaced_by_decision, and the Decision, report and Review are unchanged on disk.
    The same case generalises the claim, deriving every Decision whose implementation an approved Review
    consumed and asserting none of them is queued. These unit tests ran: Ran 36 tests in 20.499s OK.'
- acceptance_test_index: 2
  result: passed
  evidence: 'An unconsumed Decision still suppresses the exact originating artifact and still raises its
    own item: the fixture asserts the Builder item is present and the origin Review is both reported replaced
    and absent from the queue. A blocked Decision handoff still produces a blocked item rather than a
    ready one. A migration-required Builder Decision produces exactly one item through its ordinary migration
    route, with no duplicate from replacement -- the guard for that predates this change and is unaffected.
    These unit tests ran: Ran 36 tests in 20.499s OK.'
- acceptance_test_index: 3
  result: passed
  evidence: 'Both pre-terminal states are driven separately. An active approval-ready report yields exactly
    the Reviewer job on the report and no Decision item; an active revision-required implementation Review
    yields exactly the owner revision job on the Review and no Decision item. The gate is fed from the
    ordinary lifecycle''s own settling points rather than recomputed, so the two rules cannot disagree
    about whether a Decision still owes work. These unit tests ran: Ran 36 tests in 20.499s OK.'
- acceptance_test_index: 4
  result: passed
  evidence: 'Suppression is untouched. The gate sits with the other emission guards, after the suppression
    loop, so an artifact whose handoff a Decision superseded stays superseded whether or not that Decision
    is consumed. The pre-existing guards for superseded Decision leaves and integrated decision migrations
    are unchanged and still evaluated first. A Review with no escalation link is neither suppressed nor
    replaced, which the fixture asserts directly. The same-Decision lineage-repair exemptions added under
    DEC-2026-0064 and extended under DEC-2026-0073 are untouched: they address the opposite direction
    of this defect, where replacement deleted work a Decision existed to preserve, and their live cases
    still pass in the full suite. These unit tests ran: Ran 36 tests in 20.499s OK.'
- acceptance_test_index: 5
  result: passed
