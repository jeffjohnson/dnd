handoff:
  next_role: reviewer
  readiness: ready
  reason: 'This is the Decision that came from my own escalation, and the fix is the one the ruling adopted:
    the replacement now consults the ordinary Decision lifecycle instead of contradicting it. DEC-2026-0068
    has left the Builder queue, which is the correct state -- it was completed days ago.


    The implementation is deliberately not a fourth rule. The lifecycle loop already stops emitting a
    Decision item at exactly three points: an approved Review consumed it, a revision-required Review
    handed the owner its job, or an approval-ready report handed the Reviewer theirs. There is a fourth,
    where an invalid Review routes a repair job. Each is recorded as it happens and the replacement reads
    the same set, so the two rules cannot drift into disagreeing about whether a Decision still owes work.
    Recomputing the answer in the replacement pass would have been the obvious shape and would have reintroduced
    the same class of divergence a revision later.


    Suppression is untouched, which matters for the opposite defect. This same rule has twice deleted
    work a Decision existed to preserve -- the Builder item under DEC-2026-0064 and the Integrator bundle
    under DEC-2026-0073 -- and the narrow same-Decision exemptions for those remain in place and still
    pass. Both directions came from one cause: the replacement could not tell outstanding work from finished
    work. This closes the asserting half; the exemptions close the deleting half.


    One scope note. Implementing this alongside the Druid revision meant the same session touched tooling/builder/src/adnd1e_builder/compiler.py,
    which is outside this Decision''s exact_diff and is reported in its own right below. It is unrelated
    to the gate and is listed here only because the two landed together; the queue evidence above rests
    on the scanner change alone.'
  blocking_ids: []
