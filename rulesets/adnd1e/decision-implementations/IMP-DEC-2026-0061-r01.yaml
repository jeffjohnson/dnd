handoff:
  next_role: reviewer
  readiness: ready
  reason: 'Both halves of DEC-2026-0061 are implemented and both applicable suites are green. Three things
    the Reviewer should look at directly.


    First, the fixtures. The scanner reads the schemas it enforces from the tree it is scanning, and the
    queue fixtures had no schemas directory at all, so every fixture Review would have been reported unvalidatable.
    Copying the real schemas into the fixture root fixed that, and then held the fixtures to the standard
    the Decision requires -- which two of them failed. The retired-lineage fixture and the DEC-2026-0043
    owner fixture had been building Reviews with no schema_version and no constitution_version. They were
    never legal Reviews; nothing had ever looked. I completed the fixtures rather than relaxing the guard,
    because those tests had been proving scanner behaviour on an artifact that could not be published.


    Second, a behaviour change wider than the Decision''s headline. Several provenance fixtures corrupt
    a Review in ways the schema itself forbids: an approved Review with a non-terminal handoff, one recording
    a failed independent validation, one carrying an unverified disposition, one naming a reviewed-report
    path that does not match the required pattern. All four are schema failures, so those lineages now
    produce the repair job naming the Review instead of the job naming the report. Same owner, same count,
    and the Builder is still not involved -- but the anchor moved, and I updated those expectations rather
    than special-casing the guard. Reviews that satisfy the schema and fail a provenance predicate --
    a stale checksum, a mismatched Decision path -- are untouched and still leave the report waiting.


    Third, one implementation choice that is mine rather than stated in the ruling. Validating first and
    returning early would have replaced the scanner''s specific provenance findings with a bare schema
    message wherever the two overlap, so both readings go into the single error instead. And the repair
    job ends the lineage exactly where the report''s Review job would have, not unconditionally: a first
    attempt returned early in all cases, and a report with genuine pre-approval file drift stopped returning
    work to its Builder. The DEC-2026-0057 drift snapshot deliberately does not run for an invalid Review,
    since a Review that fails its own schema has established no reviewed state that could become historical
    evidence.


    One expected error stands in the scan and it is not repairable by me. IMP-DEC-2026-0060-r01 pins tooling/common/scan_agent_queues.py
    and tooling/common/tests/test_scan_agent_queues.py, both of which this Decision required me to edit,
    and its Review is still revision_required, so under DEC-2026-0046 the drift is strict. Step 5 of this
    Decision resolves it: once REV-IMP-DEC-2026-0060-r01-r02 is published as an approved successor, the
    drift becomes informational and the error clears with no Builder reissue, which is what the ruling
    requires. The same will apply to IMP-DEC-2026-0053-r03 if anything it pins moves before its own successor
    Review lands.'
  blocking_ids: []
