acceptance_results:
- acceptance_test_index: 1
  result: passed
  evidence: 'The guard now parses the runner''s terminal grammar rather than matching an end-anchored
    bare token. `Ran 655 tests in 103.582s OK (skipped=38)` is accepted, and only while exit_code is 0
    and result is passed -- TestVerdictGrammar and TestPassingVerdictRejectsFailureCounters drive the
    boundary from both sides. Accepted: a bare OK, FAILED with counters, several counters at once, and
    both two-word counter names. Rejected: any prose after the verdict or its counters, an empty parenthesis,
    a counter with no integer, an unrecognized counter name, a repeated counter, and an OK record carrying
    failures, errors, or unexpected successes. Parsing and judging are kept separate on purpose: `OK (failures=1)`
    parses, so the guard can say the summary contradicts itself instead of reporting no verdict at all.
    These unit tests ran: Ran 25 tests in 6.091s OK.'
- acceptance_test_index: 2
  result: passed
  evidence: 'IMP-DEC-2026-0053-r03 and IMP-DEC-2026-0060-r01 are unchanged on disk and pass the corrected
    guard, which is what makes the Decision''s no-reissue instruction satisfiable. TestTheRetainedReportsPass
    pins this by name rather than leaving it to the corpus sweep: it holds that each is still the active
    leaf, that every validation summary in it parses and agrees with its recorded result, and that no
    r04 or r02 successor exists in the store for either lineage. No implementation report was published
    for either Decision in this change. These unit tests ran: Ran 25 tests in 6.091s OK.'
- acceptance_test_index: 3
  result: passed
  evidence: 'An active Review that fails the exact schema now produces one decision_implementation_review_invalid
    error naming the Review and the schema path and the failing property, and one Reviewer job on the
    REVIEWER-DECISION-IMPLEMENTATION-REPAIR queue whose input is that Review. InvalidImplementationReviewCase
    drives it: a claimed approval does not complete the Decision, a claimed revision request creates no
    Builder work, the sound report underneath is not blamed and produces no Builder item of its own, and
    the real defect shape -- comma-split evidence keys inside an acceptance disposition, the exact YAML
    that closed DEC-2026-0046 on an invalid Review -- is reconstructed and rejected. The scanner validates
    with the common schema suite''s own validator and reference registry against schemas/common/decision-implementation-review.schema.json;
    it holds no field list of its own. These unit tests ran: Ran 43 tests in 18.839s OK.'
- acceptance_test_index: 4
  result: passed
  evidence: 'A schema-valid r02 that directly supersedes the broken r01 clears the error and the repair
    item, and the lineage resumes ordinary handling: an approved successor consumes the Decision and assigns
    nothing, a revision_required successor returns one Builder revision job naming the successor. The
    superseded broken r01 is not repair work once a valid leaf exists. Unchanged behaviour is asserted
    directly rather than assumed: a valid approved Review still consumes, a valid revision_required Review
    still routes to Builder, and a report with no Review at all still reaches the Reviewer on the ordinary
    queue. The full queue suite passes: Ran 860 tests in 185.002s OK.'
- acceptance_test_index: 5
  result: passed
  evidence: 'REV-IMP-DEC-2026-0046-r11-r02 is published, schema-valid, and directly supersedes REV-IMP-DEC-2026-0046-r11-r01.
    Its comma-containing evidence is written as block scalars. It carries the same reviewed_implementation
    and decision_input ids and checksums as r01, so the provenance is the same and only the YAML shape
    changed. LiveInvalidImplementationReviewCase verifies each of those against the files, and also verifies
    the premise -- that r01 really does fail the schema and r02 really passes it -- so the case cannot
    pass by having nothing to check. The repository now reports no invalid active Review and no outstanding
    repair item. These unit tests ran: Ran 43 tests in 18.839s OK.'
- acceptance_test_index: 6
  result: passed
  evidence: 'This report pins DEC-2026-0061 by checksum, reports acceptance tests 1 through 5 as passed
    against current evidence, and records passing focused runs of test_implementation_evidence (25 tests)
    and the new queue cases (43 tests) alongside both full applicable suites: tooling/common Ran 860 tests
