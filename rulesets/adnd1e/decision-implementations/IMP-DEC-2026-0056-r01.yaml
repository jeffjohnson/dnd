handoff:
  next_role: reviewer
  readiness: ready
  reason: 'The scanner validates review_handoff_retirements on active approved Decisions and classifies
    only an exact, checksum-matching historical Review as informational. Both predicates are verified
    rather than trusted from the record: the resolution GUP must be a strictly later revision of the reviewed
    GUP''s own lineage, and the resolution Review must be approved and cover that lineage at or after
    the resolution GUP. That verification is the point. An unverified version of this same reasoning --
    treating a missing provenance.review_id as consumption -- is what this Builder implemented under DEC-2026-0054
    and what REV-IMP-DEC-2026-0054-r02-r01 rejected; the difference between that and this is a checksummed
    Architect record naming eight exact Reviews, and evidence the tool checks. Strict consumption is untouched:
    a current lineage whose successor records a null review_id is still ready work, asserted by a test
    that puts both cases in one repository. One structural observation for the Reviewer, not a request.
    DEC-2026-0046 makes implementation-file checksums a historical snapshot once an approved Review consumes
    a report, so ordinary code drift no longer invalidates completed work. Versioned contract-content
    evidence under DEC-2026-0048 has no equivalent snapshot, so every contract version bump re-invalidates
    every approved report pinning that contract. This Decision''s own contract edits staled six already-approved
    reports -- 0045, 0046, 0052, 0053, 0054 and 0055 -- which are reissued alongside this one at the same
    final checksums. The same will recur on the next bump.'
