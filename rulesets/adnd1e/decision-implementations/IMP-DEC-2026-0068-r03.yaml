    is the contiguous 1-29 / 30-57 span with zero updates and eleven nodes. The scan reports exactly one
    informational review_unreadable_direct_predecessor_repaired for r02 and no parse error for it. These
    unit tests ran: Ran 38 tests in 23.009s OK. Re-verified against current files for this revision; the
    claim above is unchanged.'
- acceptance_test_index: 2
  result: passed
  evidence: 'Twenty denial cases, unchanged from r01 and re-run: no record; an unapproved Decision; a
    stale checksum on any one of the eight pinned artifacts, driven field-by-field; a predecessor that
    parses; a parse fragment or diagnostic code the parser does not produce; either link pointing elsewhere;
    a non-approved successor; a wrong-role or blocked handoff; a successor reviewing a different GUP;
    a bundle approving a different Review; a non-contiguous partition; a wrong row count; a nonzero update
    count; a different node count; a wrong disposition; and an empty reason. In every case r02 keeps its
    ordinary yaml_unreadable error, and an unrelated unreadable Review in another packet is untouched.
    These unit tests ran: Ran 38 tests in 23.009s OK. Re-verified against current files for this revision;
    the claim above is unchanged.'
- acceptance_test_index: 3
  result: passed
  evidence: 'The schema suite admits exactly the Decision-pinned files and no others, and the pins are
    read from the approved Decisions rather than restated in the suite. Three records now exist across
    two shapes and all three are read by the same loader, which is what stopped the third from being forgotten.
    The exemption is re-earned on every run: each pinned file must still hash to its recorded checksum
    and still fail to parse, and the exempt set is compared with the pinned set rather than against a
    count. These unit tests ran: Ran 9 tests in 0.458s OK. Re-verified against current files for this
    revision; the claim above is unchanged.'
