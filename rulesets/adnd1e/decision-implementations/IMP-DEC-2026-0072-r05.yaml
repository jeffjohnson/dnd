- acceptance_test_index: 3
  result: passed
  evidence: 'tooling/common/validate_artifact.py accepts a valid staged mapping against its supplied schema,
    including the quoted and block-scalar forms of the value that keeps breaking, and refuses an unquoted
    colon-space, continuation prose, a list or string or empty root, a schema failure, a missing staged
    file, a missing schema, and an unresolved schema reference. It reports every schema failure rather
    than the first. It writes nothing: the destination listing is unchanged after a refusal. And it is
    target-only -- a test wraps Path.read_text and asserts every path it opens is the staged file or its
    named schema, so no corpus, packet, or canonical read can creep in. Driven against the real artifacts
    too: both files that forced DEC-2026-0068 and DEC-2026-0072 would have been refused by this command
    before publication. These unit tests ran: Ran 22 tests in 0.215s OK. Re-verified against current files
    for this revision; the claim above is unchanged. Re-verified against current files for this revision;
    the claim above is unchanged. Re-verified against current files for this revision; the claim above
    is unchanged.'
- acceptance_test_index: 4
  result: passed
  evidence: 'The command takes --schema as a required argument and exits non-zero when it is omitted,
    so authority is never inferred from a filename: a name is a claim about what an artifact is, and the
    caller knows what it is publishing. Role instructions are Architect-owned under this Decision''s exact_diff_ownership
