  readiness: ready
  reason: 'Supersedes IMP-DEC-2026-0072-r04 to correct one inconsistency I introduced and should not have
    shipped. r04''s structured versioned_contract_content block correctly names DEC-2026-0072 as its own
    authority, but the prose evidence beside it still said DEC-2026-0048 authorizes the form -- a leftover
    from r03, which named the wrong authority outright. The scanner reads the block and passed it; the
    contradiction was between the two halves of one acceptance result, which is exactly the defect class
    these reports exist to make visible, so it gets a revision rather than a footnote.


    Nothing else changed. The implementation is as first published: the unreadable implementation-Review
    record with its fourteen denial cases, and the target-only staged preflight with its twenty-two. Acceptance
    test 5''s anchors and floors are read from the Decision''s own declaration, and the emitter refuses
    publication if any declared anchor is missing from the file it names.


    The lineage from r01 is worth reading in order, because two of the four revisions were my errors and
    both were caught by something other than me. r01 claimed the emitter ran the staged preflight when
    the wiring patch had silently failed. r03 cited the wrong authority and the scanner rejected it within
    seconds. r04 fixed the block and left the prose. This is r05.'
