- acceptance_test_index: 3
  result: passed
  evidence: 'emit.preflight_create_only checks the whole output set before the first write; write_all
    passes all five same-ID paths including the pending and blocked companions it may not itself write,
    and no longer accepts an allow_overwrite argument. cli.py routes plan-migration and plan-decision-migration
    through the same helper, the latter over both its report and its GUP together because the report is
    written first and a per-file check would already have destroyed it. The --allow-overwrite flag is
    removed from the parser. Evidence: test_compiler.TestPublicationPreflightCoversEveryOutput plants
    each of the five outputs in turn and asserts the planted bytes are unchanged and no sibling was created,
    that a multi-collision refusal names every pre-existing path, and that a clean directory still publishes;
    test_decision_migration.MigrationPublicationPreflightCase drives both migration entrypoints through
    cli.main twice, asserting exit 2 and byte-identical outputs, including the case where only the validation
    report survives; and a subtest over all three commands asserts no publication entrypoint offers --allow-overwrite
    or --force. 17 tests, all passing.'
