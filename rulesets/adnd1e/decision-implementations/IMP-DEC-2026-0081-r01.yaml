    problems. _expand also refuses to substitute a null scope into a
    "{ruleset}" pattern rather than filling it with an empty string. These unit
    tests ran: Ran 123 tests in 2.432s OK.
- acceptance_test_index: 9
  result: passed
  evidence: >-
    Receipts remain operational cache records.
    TestDispatcherReceiptIsNotProvenance asserts the receipt lives only under
