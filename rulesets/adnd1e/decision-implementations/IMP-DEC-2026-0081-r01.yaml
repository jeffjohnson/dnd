implementation_notes:
  - subject: the opt-out is validated for every declared role, not only the requested one
    detail: >-
      load_manifest checks inheritance and the Dispatcher's literal-pattern rule
      across every role the manifest declares, so a malformed Dispatcher entry
      fails a Builder verification too. The manifest is governance: if it is
      malformed anywhere, no role's set should be trusted, and a worker
      verifying today should not depend on nobody having asked for the
      Dispatcher yet. The manifest hash is part of every receipt regardless, so
      this makes the failure legible rather than merely eventual.
  - subject: strict boolean reading
    detail: >-
      isinstance(value, bool) is what rejects 1 and 0, since Python treats them
      as ints and not bools here, while "false" and None are rejected as
      non-booleans. A YAML author writing `inherit_common_patterns: 1` gets an
      error rather than an inherited common set.
  - subject: argparse change directed by the Decision
    detail: >-
      --ruleset is now syntactically optional and enforced per role before any
      path resolution or receipt read/write, as DEC-2026-0081's cli ruling
      requires; argparse cannot express "required for five roles, forbidden for
      the sixth". The CLI exit code for a worker invoked without --ruleset is
      still 2. The observable difference is for a programmatic caller: argparse
      previously raised SystemExit(2) for that case and main() now returns 2.
      Recorded because it is a real interface change, and it is the change the
      Decision directs rather than one this report chose.
  - subject: an empty --ruleset for a worker
    detail: >-
      Refused explicitly with "requires a non-empty ruleset". Previously it
      resolved a pattern like rulesets//ruleset.yaml, failed on the missing
      literal and exited 2; the exit code and the absence of a receipt are
      unchanged, only the message is now about the invocation rather than about
      a file nobody named.
