acceptance_results:
- acceptance_test_index: 1
  result: passed
  evidence: >-
    Manifest languages. TestTheLiveManifest.test_the_manifest_validates_against_its_schema
    validates the live contracts/ROLE_CONTEXT_MANIFEST.yaml against
    schemas/common/role-context-manifest.schema.json with jsonschema and
    asserts no errors; TestTheLiveDispatcherSet.test_the_live_manifest_declares_all_six_roles_at_version_1_1
    asserts schema_version 1.1, cache_format_version 1, and exactly the six
    role keys; test_every_role_is_declared_exactly_once (the Architect's
    expected transition failure) now passes because ROLES contains the sixth
    role. TestManifestVersionsAndInheritance holds the fail-closed cases on
    fixtures: a legacy five-role 1.0 manifest still verifies and still caches
    (test_a_legacy_five_role_manifest_is_still_accepted); 1.0 refuses a
    Dispatcher entry (test_a_legacy_manifest_may_not_declare_the_dispatcher)
    and a Dispatcher request against it fails closed on the absent entry
    rather than being filled in from contract prose
    (test_a_dispatcher_request_against_a_legacy_manifest_fails_closed); an
    unsupported schema_version (1.2, 2.0, the float 1.0, None, empty) and an
    unsupported cache_format_version (2, 0, "1", None) each raise; 1.1 without
    a Dispatcher, a missing worker role, and an unknown role name each raise;
    a worker declaring inherit_common_patterns false is refused with "only
    'dispatcher' may opt out"; a worker declaring it true is accepted and
    still inherits; a malformed value raises for each of None, "false",
    "true", 0, 1, [] and {} -- the integers matter, because `1` is truthy and
    a truthy near-miss silently granting the common set is the failure the
    opt-out exists to prevent; and a Dispatcher entry that omits the opt-out
    or declares it true is refused. These unit tests ran: Ran 123 tests in
    2.432s OK.
- acceptance_test_index: 2
  result: passed
  evidence: >-
    The bounded set, proved twice. On a fixture whose Dispatcher patterns are
    deliberately disjoint from the common ones -- so an inheritance leak
    surfaces as the extra files it is, rather than as a duplicate-path error
    that would pass for the wrong reason -- TestDispatcherStableSet asserts the
    resolved set equals exactly the declared patterns, that no common pattern
    and no worker instructions reach it, that effective_patterns reports the
    opt-out, and that a worker under the same manifest still inherits, so the
    opt-out is per role and not a manifest-wide mode. Against the repository,
    TestTheLiveDispatcherSet.test_it_is_exactly_the_paths_the_decision_names
    reads manifest_contract.dispatcher_stable_authority_paths out of
    DEC-2026-0081 itself and asserts equality with the resolved set and a
    count of 11; the list is not transcribed into the test, so governance
    changing it becomes a failure rather than silent drift. The same class
    asserts the set is sorted, duplicate-free and all real files inside the
    root; that five concrete files inheritance would have added
    (contracts/GRAPH_INVARIANTS.md, contracts/SOURCE_MARKDOWN.md,
    contracts/ROLE_CONTEXT_MANIFEST.yaml, schemas/common/gur.schema.json,
    schemas/common/decision-implementation.schema.json) exist on disk and are
    absent from it; that no worker instructions appear and no path starts with
    rulesets/, books/, schemas/ or build/; and that the manifest and schema are
    separately checksummed verification inputs present as manifest_checksum and
    manifest_schema_checksum while absent from stable_authority. These unit
    tests ran: Ran 123 tests in 2.432s OK.
- acceptance_test_index: 3
  result: passed
  evidence: >-
    Scope. TestDispatcherScope asserts verify and record work with no scope
    arguments; that the receipt's scope is exactly {"ruleset_id": null,
    "book_id": null} with both keys present; that the receipt's top-level keys
    are exactly the ten format-1 fields and the serialised receipt contains
    neither "source_id" nor "packet_id"; that every public entry point --
    resolve_paths, build_receipt, receipt_path, verify and record -- raises
    "takes no scope arguments" when handed a ruleset or a book, rather than
    discarding it, because a caller that passed one believes the receipt it
    gets back is scoped to it; that the filename matches
    ^dispatcher-repository-no-book-[0-9a-f]{32}\.json$; that "repository" is a
    filename label while scope.ruleset_id stays null; that the scope key
    differs from every worker role's for the rulesets "repository", "" and
    "adnd1e", so the label cannot collide with a worker that named a ruleset
    spelled like it; and that the key is SHA-256 of the NUL-joined resolved
    root, "dispatcher", empty ruleset, empty book and session, truncated to 32
    hex, recomputed independently in the test. TestDispatcherCli covers the
    command line: a scope-free verify/record/verify returns 1, 0, 0; supplying
    --ruleset, --book, an empty --ruleset, an empty --book, or both exits 2 and
    leaves the receipt directory empty; and an invalid invocation after a good
    one leaves the existing receipt byte-identical. These unit tests ran: Ran
    123 tests in 2.432s OK.
- acceptance_test_index: 4
  result: passed
  evidence: >-
    The five roles. All 50 pre-existing tests are retained unmodified in
    substance and still pass; the only edits to existing tests are the four
    live-manifest loops that iterate every role, which now ask live_scope(role)
    for the arguments each role takes instead of passing "adnd1e"/"phb" to a
    role that has no ruleset. TestWorkerBehaviourIsUnchanged adds explicit
    regression assertions: each of the five still exits 2 without --ruleset; an
    empty --ruleset is refused; --book remains optional; the scope-key material
    and receipt filename for every worker role with and without a book are
    recomputed by hand in the test and match the implementation exactly; and a
    worker receipt still records scope {"ruleset_id": "adnd1e", "book_id":
    "phb"} with cache_format_version 1. TestBothRegisteredRulesetsResolve
    exercises AD&D 1e and Basic D&D live: every worker resolves a sorted
    non-empty set containing AGENTS.md, its own instructions and at least one
    rulesets/<id>/ path in each, and the builder's adnd1e and basicdnd sets
    differ. Live counts are unchanged by this work at 43 (architect), 35
    (analyst) and 44 (builder, reviewer, integrator) for both registered
    rulesets. These unit tests ran: Ran 123 tests in 2.432s OK.
- acceptance_test_index: 5
  result: passed
  evidence: >-
    Cold to warm. TestDispatcherColdAndWarm asserts a cold verify returns
    reload_required and emits exactly its reading paths; that record followed
    by verify is a cache_hit and repeats; that a hit emits no authority
    contents, checked by planting a marker string in the fixture's dispatcher
    instructions and asserting it appears in no value of the result; and that
    record is an attestation which reports the set it wrote rather than
    observing a read. Against the repository, `python
    tooling/common/role_context.py verify --root . --role dispatcher
    --session-id <id>` prints reload_required with scope=repository and lists
    the eleven paths, exiting 1. No live actor receipt was created by this
    work: the fixtures write into temporary directories, and the live
    invocation above was a verify, which writes nothing. These unit tests ran:
    Ran 123 tests in 2.432s OK.
- acceptance_test_index: 6
  result: passed
  evidence: >-
    Fifteen ways not to hit, in TestDispatcherInvalidation: a missing receipt;
    an unreadable one; a non-mapping one; one with each of the nine identity
    fields deleted in turn; a wrong cache_format_version; a different session;
    a receipt copied to another actor session's path; one carrying another
    repository root; and a worker receipt relabelled as the Dispatcher, which
    misses on its worker scope. The scope check is explicit rather than
    incidental: test_a_receipt_missing_a_scope_key_is_malformed_not_null feeds
    {}, {"ruleset_id": null} and {"book_id": null} and asserts the difference
    reads "malformed, not a null scope", because a receipt written by a tool
    with no concept of a scope-free role must not compare equal to a
    Dispatcher's. These unit tests ran: Ran 123 tests in 2.432s OK.
- acceptance_test_index: 7
  result: passed
  evidence: >-
    Changed inputs. TestDispatcherInvalidation asserts a changed authority file
    misses and names the file, a changed manifest misses, a changed schema
    misses with manifest_schema_checksum in the differences, and a pattern
    leaving the set misses with "is no longer in the stable set". The upgrade
    case is TestManifestUpgradeInvalidatesExistingReceipts: a worker receipt is
    recorded under a 1.0 manifest, the manifest is then upgraded to 1.1 with a
    Dispatcher entry and the schema file's bytes change, and the same worker
    verification misses on manifest_checksum while cache_format_version stays 1
    on both sides -- ordinary hash invalidation, not a format migration. The
    same test asserts the stale receipt is left byte-identical, and
    test_no_receipt_is_rehashed_or_deleted_on_a_miss asserts the same for the
    Dispatcher: nothing is rehashed, upgraded in place or purged. These unit
    tests ran: Ran 123 tests in 2.432s OK.
- acceptance_test_index: 8
  result: passed
  evidence: >-
    Guards. The nine pre-existing TestFailsClosed cases are unmodified and
    pass. TestDispatcherFailsClosed proves the same guards reach the new role
    and adds its literal-pattern rule: a glob ("contracts/*.md",
    "agents/?/INSTRUCTIONS.md", "contracts/[a-z].md") is refused with "is a
    glob"; a scope placeholder is refused because the Dispatcher has no ruleset
    to fill it with; a literal naming a missing file is refused; two different
    literal spellings of one path ("README.md" and "./README.md") are refused
