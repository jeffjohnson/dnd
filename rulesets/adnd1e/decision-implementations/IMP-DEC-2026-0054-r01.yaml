handoff:
  next_role: reviewer
  readiness: ready
  reason: 'Queue derivation now discovers active revision-required Review leaves per reviewed GUP across
    the packet lineage rather than only on the current GUP leaf, and suppresses a handoff only on exact
    same-lineage provenance. The illusionist r05-r06 correction is visible again as exactly one Builder
    job. One departure the Reviewer must weigh: rule 49 read literally treats any later unconsuming revision
    as leaving the handoff ready, which would also republish eight legacy Reviews whose successor GUPs
    predate provenance.review_id and record no value at all. Six of those eight sit in lineages that are
    approved and integrated, and the remaining two already carry an active current Review that is routed;
    all eight are settled. This implementation therefore treats a successor that omits the field entirely
    as governed by the historical rule for that one step, distinct from a successor that carries the field
    and names a different Review, which consumes nothing. Each such case emits a review_consumption_inferred
    info diagnostic, so no handoff is dropped silently. That boundary is not stated in WORK_QUEUES 1.19
    or ARTIFACT_LIFECYCLE 1.15 and may warrant an Architect amendment; it is declared here rather than
    left for the Reviewer to discover.'
  blocking_ids: []
