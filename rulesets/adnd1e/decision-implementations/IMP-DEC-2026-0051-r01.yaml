- acceptance_test_index: 3
  result: passed
  evidence: 'IMPLEMENTED AND TESTED, BOTH DIRECTIONS AND BOTH SHAPES. schemas/common/review.schema.json
    gains an opt-in branch: when review_contract_version is ''1.1'', every per-row decision in edge_decisions
    and row_decisions must carry one of the four legal dispositions. TestReviewDispositionVocabulary proves
    each of the four is accepted (test_every_legal_disposition_is_accepted), that approved_but_excluded_from_bundle
    is rejected in edge_decisions and in row_decisions, that any other unknown term is rejected rather
    than only the named one, and that one bad row among good ones still fails. test_both_published_shapes_are_checked
    pins the mapping form as well as the list form, because the corpus uses both and checking one while
    silently passing the other is how an invalid value survives a validator. Legacy compatibility: test_a_legacy_review_without_the_field_is_untouched
    and its mapping-shape twin show a Review omitting the field still validates carrying the illegal term,
    and test_another_declared_version_does_not_opt_in shows the check is keyed to ''1.1'' exactly. Two
    false-positive guards: a grouped summary such as `edge_decisions: {approved_refs: [...]}` states no
    per-row judgment and is left alone, and a row carrying no disposition is untouched. Live corpus: all
    111 published Reviews validate, verified by TestPublishedReviewsStillValidate.'
