acceptance_results:
- acceptance_test_index: 1
  result: passed
  evidence: 'Unchanged from r01 and re-verified against current files. Every pinned field is re-derived:
    r02 still hashes to the recorded value and still fails with the recorded fragment; r03 and its bundle
    parse; both direct supersedes links are read from the files rather than from the record; r03 is approved
    with an architect/ready handoff and reviews GUP-PKT-PHB-117-119-bards-r04; r03 validates against review.schema.json
    and its bundle against approved-bundle.schema.json; the bundle approves r03; and the operation partition
    is the contiguous 1-29 / 30-57 span with zero updates and eleven nodes. The scan reports exactly one
    informational review_unreadable_direct_predecessor_repaired for r02 and no parse error for it. These
    unit tests ran: Ran 38 tests in 23.009s OK.'
- acceptance_test_index: 2
  result: passed
  evidence: 'Twenty denial cases, unchanged from r01 and re-run: no record; an unapproved Decision; a
    stale checksum on any one of the eight pinned artifacts, driven field-by-field; a predecessor that
    parses; a parse fragment or diagnostic code the parser does not produce; either link pointing elsewhere;
    a non-approved successor; a wrong-role or blocked handoff; a successor reviewing a different GUP;
    a bundle approving a different Review; a non-contiguous partition; a wrong row count; a nonzero update
    count; a different node count; a wrong disposition; and an empty reason. In every case r02 keeps its
    ordinary yaml_unreadable error, and an unrelated unreadable Review in another packet is untouched.
    These unit tests ran: Ran 38 tests in 23.009s OK.'
- acceptance_test_index: 3
  result: passed
  evidence: 'The schema suite admits exactly the Decision-pinned files and no others, and the pins are
    read from the approved Decisions rather than restated in the suite. Three records now exist across
    two shapes and all three are read by the same loader, which is what stopped the third from being forgotten.
    The exemption is re-earned on every run: each pinned file must still hash to its recorded checksum
    and still fail to parse, and the exempt set is compared with the pinned set rather than against a
    count. These unit tests ran: Ran 9 tests in 0.458s OK.'
- acceptance_test_index: 4
  result: passed
  evidence: 'This report pins DEC-2026-0068 by checksum, reports acceptance tests 1 through 3 as passed,
    and records passing focused evidence (38 direct-predecessor tests, 9 exemption tests) alongside both
    full suites: tooling/common Ran 1078 tests in 316.594s OK, and tooling/builder Ran 684 tests in 168.301s
    OK (skipped=38). r01 reported this test failed because the applicable suite was red on three artifacts
    owned by other roles; DEC-2026-0072 admitted the unreadable implementation Review and the Integrator''s
    command records were repaired, so the suite is green and the claim r01 could not make is now true.'
handoff:
  next_role: reviewer
  readiness: ready
  reason: 'Supersedes IMP-DEC-2026-0068-r01, which reported acceptance test 4 failed because the applicable
    suite was red on three artifacts I could not touch: an unreadable implementation Review and two Integrator
    command records that named no working directory. DEC-2026-0072 admitted the first and the Integrator
    repaired the others, so tooling/common is green at 1078 tests and the claim r01 could not honestly
    make is now true. The implementation itself is unchanged; only the evidence moved.


    One thing in it remains my judgment rather than the ruling''s, and it is the part worth checking.
    Skipping the unreadable file removes it from the lineage as well as from the parser, so r03''s supersedes
    pointed at an ID the walk could not find and r01 was left looking like a second active leaf. Neither
    is true, and neither could be learned from r02 -- the file will not open. The record states and checksums
    that the chain runs r01 to r02 to r03, so the record supplies exactly those two facts and nothing
    else is inferred. Any other absent predecessor is still an ordinary lineage error.'
