- acceptance_test_index: 3
  result: passed
  evidence: 'IMPLEMENTED AND TESTED, BOTH DIRECTIONS AND BOTH SHAPES; unchanged from the implementation
    published under DEC-2026-0051 and re-verified here at its current checksum. schemas/common/review.schema.json
    carries an opt-in branch: when review_contract_version is ''1.1'', every per-row decision in edge_decisions
    and row_decisions must carry one of the four legal dispositions. TestReviewDispositionVocabulary proves
    each of the four is accepted, that approved_but_excluded_from_bundle is rejected in edge_decisions
    and in row_decisions, that any other unknown term is rejected rather than only the named one, and
    that one bad row among good ones still fails. test_both_published_shapes_are_checked pins the mapping
    form as well as the list form, because the corpus uses both -- 28 Reviews carry the list shape and
    15 the mapping -- and checking one while silently passing the other is how an invalid value survives
    a validator. Legacy compatibility is pinned three ways: a Review omitting the field validates even
    carrying the illegal term, the same holds in the mapping shape, and declaring any other version does
    not opt in. Two false-positive guards: a grouped summary such as `edge_decisions: {approved_refs:
    [...]}` states no per-row judgment and is left alone, and a row carrying no disposition is untouched.
    Live corpus: all 111 published Reviews validate, verified by TestPublishedReviewsStillValidate. Re-verified
    at current checksums for this revision, which exists only because later approved Decisions advanced
    the contracts and tooling this report pins; the claim above is unchanged. Re-verified at current checksums
    for this revision, which exists only because DEC-2026-0056 advanced the contracts this report pins;
    the claim above is unchanged.'
