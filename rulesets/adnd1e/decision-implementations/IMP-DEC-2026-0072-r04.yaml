acceptance_results:
- acceptance_test_index: 1
  result: passed
  evidence: 'REV-IMP-DEC-2026-0065-r01-r01 still hashes to the pinned value and still fails at the recorded
    fragment; r02 parses, validates against decision-implementation-review.schema.json, directly supersedes
    r01, and pins the same reviewed implementation IMP-DEC-2026-0065-r01 under the same DEC-2026-0065.
    Every one of those is re-derived from the files rather than taken from the record. The scanner reports
    one informational implementation_review_unreadable_predecessor_repaired for r01 and no parse error
    for it, and the common schema sweep no longer names it. These unit tests ran: Ran 31 tests in 20.750s
    OK. Re-verified against current files for this revision; the claim above is unchanged. Re-verified
    against current files for this revision; the claim above is unchanged. Re-verified against current
    files for this revision; the claim above is unchanged.'
- acceptance_test_index: 2
  result: passed
  evidence: 'Fourteen denial cases: no record; an unapproved Decision; a stale checksum on any one of
    the four pinned artifacts, driven field-by-field; a predecessor that parses; a parse fragment the
    parser does not produce; a broken supersedes link; a successor whose disposition is not revision_required;
    a successor reviewing a different report; a successor under a different Decision; a schema-invalid
    successor; a wrong record disposition; and an empty reason. In every case r01 keeps its ordinary yaml_unreadable
    error. The last two are the ones an unreadable predecessor cannot itself contradict, which is why
    they are checked against the record rather than against the file. Another unreadable implementation
    Review elsewhere is untouched. These unit tests ran: Ran 31 tests in 20.750s OK. Re-verified against
    current files for this revision; the claim above is unchanged. Re-verified against current files for
    this revision; the claim above is unchanged. Re-verified against current files for this revision;
    the claim above is unchanged.'
- acceptance_test_index: 3
  result: passed
  evidence: 'tooling/common/validate_artifact.py accepts a valid staged mapping against its supplied schema,
    including the quoted and block-scalar forms of the value that keeps breaking, and refuses an unquoted
    colon-space, continuation prose, a list or string or empty root, a schema failure, a missing staged
    file, a missing schema, and an unresolved schema reference. It reports every schema failure rather
    than the first. It writes nothing: the destination listing is unchanged after a refusal. And it is
    target-only -- a test wraps Path.read_text and asserts every path it opens is the staged file or its
    named schema, so no corpus, packet, or canonical read can creep in. Driven against the real artifacts
    too: both files that forced DEC-2026-0068 and DEC-2026-0072 would have been refused by this command
    before publication. These unit tests ran: Ran 22 tests in 0.215s OK. Re-verified against current files
    for this revision; the claim above is unchanged. Re-verified against current files for this revision;
    the claim above is unchanged. Re-verified against current files for this revision; the claim above
    is unchanged.'
- acceptance_test_index: 4
  result: passed
  evidence: 'The command takes --schema as a required argument and exits non-zero when it is omitted,
    so authority is never inferred from a filename: a name is a claim about what an artifact is, and the
    caller knows what it is publishing. Role instructions are Architect-owned under this Decision''s exact_diff_ownership
    at sequence step 1 and were updated there; Builder''s own emitter now runs this preflight against
    the staged bytes before the create-only destination check, which is the order the ruling requires.
    These unit tests ran: Ran 22 tests in 0.215s OK. Re-verified against current files for this revision;
    the claim above is unchanged. Re-verified against current files for this revision; the claim above
    is unchanged. Re-verified against current files for this revision; the claim above is unchanged.'
