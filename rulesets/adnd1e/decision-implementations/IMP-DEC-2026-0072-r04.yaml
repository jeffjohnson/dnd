handoff:
  next_role: reviewer
  readiness: ready
  reason: 'Supersedes IMP-DEC-2026-0072-r03, which carried the structured block but named the wrong authority:
    it cited DEC-2026-0048, whose authorizations cover other Decisions, when DEC-2026-0072 declares these
    semantics for its own acceptance test 5. The scanner caught it immediately. Both contracts, both floors
    and every anchor are now read from that declaration rather than chosen by the report. Originally raised
    by REV-IMP-DEC-2026-0072-r01-r02, which found acceptance test 5 unreviewable: the report asserted
    both contract versions in prose while DEC-2026-0072 requires structured versioned_contract_content
    evidence, and current contracts cannot stand in for a report''s own record of what it checked. The
    finding is correct. Acceptance test 5 now carries the DEC-2026-0048 block with both contracts pinned
    by checksum, their observed versions read from the files, their minimum versions stated, and the anchor
    sentences quoted rather than paraphrased -- and the emitter fails before publication if any anchor
    is absent from the file it names, so the evidence cannot drift from the contracts it describes.


    Two corrections carried forward from r02, both mine and both worth keeping visible. r01 claimed the
    Builder emitter ran the staged preflight before its create-only check; that was true of the design
    and not of the code when r01 published, because the patch wiring it in had failed silently. It is
    wired and verified now, and this report was published through it. And the implementation is otherwise
    unchanged from r01: the unreadable implementation-Review record, its fourteen denial cases, and the
    target-only preflight with its twenty-two cases are all as first published.'
