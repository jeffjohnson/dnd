implementation_scope:
  queue_admission: 'adnd1e_integrator.admission resolves admission before any Review directory
    is walked. It reads active approved Architect Decisions, follows the delegating governing_repair_record
    block to the governing Decision by pinned checksum, and re-derives every field of the named
    repair record from the files: each pinned artifact is re-hashed, the four readable references
    must parse and declare their recorded IDs, and the unreadable reference must still fail to
    parse with the recorded message fragment. The two supersession links, the successor''s disposition,
    handoff and reviewed GUP, and the exact two-entry Builder input set are each checked against
    the file rather than against the record''s restatement of itself.'
  fail_closed: An empty permit set is the default, so with no governing Decision every parse failure
    is fatal. ready_queue returns an empty ready list whenever any fatal diagnostic exists, cmd_integrate
    refuses before the transaction runner is called including under --dry-run and including when
    a bundle is named explicitly, and main catches YAMLError as a backstop so no path can produce
    a traceback.
  separate_channels: queue_integrity carries fatal records and informational carries the historical
    notice. They are distinct keys in both the ready_queue result and the CLI payload, so a trusted
    notice can never read as a queue failure and a queue failure can never be filed as history.
    Only queue_integrity and pre-existing diagnostics set exit code 2.
  not_changed: No canonical, registry, graph, GUP, Review, Approved bundle, Integration record
    or rejection record was created or modified. The unreadable Review was not edited, reserialized,
    superseded or read for content. The Bards bundle was not integrated.
post_implementation_note: 'With admission repaired, APPROVED-GUP-PKT-PHB-117-119-bards-r04-r01
  reaches ordinary verification and is refused there with 29 of 48 preconditions failing. The
  cause is packaging, not admission: the bundle carries no operation_index, so every CSV row is
  read as an addition, and 28 rows reference nodes the same batch registers and therefore belong
  in pending_additions. Under DEC-2026-0047 that is a Reviewer packaging correction. It is reported
  here as the outcome of the normal lifecycle this Decision directs, and is not implemented by
  this report.'
