acceptance_results:
- acceptance_test_index: 1
  result: passed
  evidence: 'IntegrationRejectionCase.test_a_valid_rejection_suppresses_only_that_bundle asserts a conforming
    record removes that bundle''s INTEGRATOR-APPROVED item and creates one REVIEWER-INTEGRATION-REJECTION
    item; test_a_second_unrejected_bundle_is_untouched asserts an unrelated bundle in the same book still
    routes to the Integrator, so suppression is per bundle and never per book or queue; test_exactly_one_remediation_item_is_created
    asserts exactly one; test_the_remediation_item_names_the_failing_check asserts the item is Reviewer-owned
    and names both the rejection record and the failing check. Live repository: APPROVED-GUP-PKT-PHB-094-100-illusionist-spells-r04-r01
    left the Integrator queue and became a Reviewer remediation item pointing at rulesets/adnd1e/reports/INT-20260815-002.rejected.json,
    after four consecutive rejections of identical bytes. Re-verified for r03 at the current file checksums
    after the DEC-2026-0045 governance publication: IntegrationRejectionCase and DirectImplementationOwnerCase
    run 44 tests OK and the claim above is unchanged. Re-verified for r04 at the current checksums after
    the DEC-2026-0046 scanner change drifted the two shared tooling files this report pins; 44 targeted
    tests still pass and the claim above is unchanged.'
- acceptance_test_index: 2
  result: passed
  evidence: 'Nine denial tests, each asserting the bundle stays in INTEGRATOR-APPROVED, no remediation
    item is created, and a diagnostic is emitted: a missing checksum, a stale checksum, no blocking_failures,
    a wrong ruleset, a status other than rejected, unreadable JSON, a superseded record, two disagreeing
    live records (integration_rejection_ambiguous), and an unchecksummed record reusing the legacy-authorized
    ID for a different bundle. test_the_legacy_allowance_is_pinned_to_one_record_and_bundle asserts LEGACY_AUTHORIZED_REJECTIONS
    is exactly the one (record, bundle) pair DEC-2026-0043 names, so the allowance cannot spread. A rejection
    naming a superseded or integrated bundle is silent rather than diagnostic (test_a_rejection_of_a_superseded_bundle_is_silent):
    it can suppress nothing either way, and reporting every pre-contract record produced 56 errors that
    buried the 5 live ones. Live repository: INT-20260812-002, INT-20260814-003 and INT-20260817-002 are
    reported as invalid for want of the now-required checksums and suppress nothing. Re-verified for r03
    at the current file checksums after the DEC-2026-0045 governance publication: IntegrationRejectionCase
    and DirectImplementationOwnerCase run 44 tests OK and the claim above is unchanged. Re-verified for
    r04 at the current checksums after the DEC-2026-0046 scanner change drifted the two shared tooling
    files this report pins; 44 targeted tests still pass and the claim above is unchanged.'
- acceptance_test_index: 3
