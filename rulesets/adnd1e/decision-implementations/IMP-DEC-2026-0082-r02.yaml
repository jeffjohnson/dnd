- acceptance_test_index: 2
  result: passed
  evidence: >-
    Five-role operation, dispositioned verified by the Reviewer against r01 and
    unchanged by this revision: role_context.py and its 80 tests are
    byte-identical to the reviewed bytes, so nothing in this index was disturbed
    while the relay was corrected. The live manifest validates and declares
    exactly the five active roles at schema_version 1.0 with cache_format_version
    1; scoped verification, bounded inputs, checksum and session invalidation,
    cache hits and format-1 receipts all hold; the retired role is refused at
    every entry point without writes. DEC-2026-0081 and IMP-DEC-2026-0081-r01
    remain untouched, now pinned as history in the validation companion. Those
    unit tests ran: Ran 80 tests in 1.442s OK.
- acceptance_test_index: 3
  result: passed
  evidence: >-
    Previously failed on F1 and F2; both are fixed and the Reviewer's own probes
    for them now pass unmodified.

    Complete typed request (F1). Test-HandoffRequest requires request_id,
    repository_root, endpoint, authority, scope, sender, recipient, inputs,
    prerequisites, action, ordered_next_steps and prompt. Every input and
    prerequisite must carry id, path and checksum, must resolve inside the
    root, and must hash to the declared digest. Scope identifiers are either
    explicitly null -- the contract's "unassigned", never invented -- or match a
    case-sensitive identifier pattern. The endpoint must exist and must be the
    inherited HERDR_BIN_PATH when one is set. Ordered steps must be complete,
    name an active role, and carry a readiness of ready or blocked.
    TestCompleteTypedRequest covers each of these in 10 cases, including the
    Reviewer's five-section deletion as individual subtests.

    Real containment (F1). Resolve-InsideRoot compares resolved full paths with
    a trailing separator appended to the root, because a bare StartsWith admits
    a sibling directory whose name merely begins with the root's.
    test_a_sibling_sharing_the_root_prefix_is_outside_the_root creates exactly
    that sibling and asserts the refusal.

    Verified identity (F2). Resolve-Party finds the party by unique role alias,
    refuses when the alias is absent or answered by more than one agent, and
    then cross-checks provider, pane and native session; the request must name
    the alias matching its role. TestPartyIdentityIsVerified covers a replaced
    sender, a moved pane, a changed session, a reassigned recipient alias, an
    ambiguous alias, a wrong provider and a mismatched alias -- 7 cases, each
    asserting the prompt log stayed empty. ValidateOnly still makes no endpoint
    call, writes no state and takes no lock. Those unit tests ran: Ran 73 tests
    in 86.971s OK.
- acceptance_test_index: 4
  result: passed
  evidence: >-
    Previously failed on F2 and F3. The Reviewer's finding was exact: a
    parseable zero-exit response became settled even when the recipient had not
    finished, so the lock was released at submission rather than at settlement.

    Acknowledgment is now distinguished from settlement (F3). A response must
    carry a result envelope whose status is in an explicit settled set; the
    Decision's own examples of what is *not* settlement -- submitted and blocked
    -- are deliberately excluded, since the first says the message left and the
    second says a human is needed. The relay then re-resolves the recipient and
    requires it to be idle or done before recording settled, and the lock is
    held across that confirmation. TestAcknowledgmentIsNotSettlement covers
    submitted, blocked, a response with no result envelope, a recipient that is
    still working after delivery, and the confirmed-settled path that does
    release the lock.

    Identity binding failures no longer permit delivery (F2), as described under
    acceptance test 3. The deterministic working-sender and unexpected-peer
    tests the Reviewer accepted are retained unchanged, and their independent
    two-concurrent-relay exclusion test still passes. Those unit tests ran: Ran
    73 tests in 86.971s OK.
- acceptance_test_index: 5
  result: passed
  evidence: >-
    Previously failed on F3, F4 and F5. Each bypass the Reviewer found is closed
    and pinned.

    Atomic claim (F4). Invoke-Execute takes the repository lock first, then
    claims identity under it: a request whose state is anything but queued is
    refused as consumed, so ExecuteRequest can no longer be replayed. The
    outstanding-delivery check runs in the execute path too, and uncertain is
    deliberately not a terminal state, so an unrelated uncertainty blocks
    execution until a human clears it. The queued payload is bound by checksum,
    so a request edited after queueing is refused rather than delivered.

    Evidence is never erased (F4). Write-State refuses to overwrite submitting,
    acknowledged or uncertain except by the owning relay's own forward progress,
    and the lock-refusal path writes no state at all. A killed relay therefore
    leaves submitting behind and a later attempt cannot record refused over it.

    Bounded child calls (F5). Invoke-Herdr starts each endpoint call as a
    supervised process against one monotonic Stopwatch budget and kills it when
    the remainder expires, because a hung client cannot be trusted to honour its
    own --timeout. Agent listing is bounded exactly like the prompt, and the
    deadline is rechecked immediately before submission so nothing is sent after
    the window closes. TestIdentityIsClaimedAtomically and
    TestEveryChildCallIsBounded add 8 cases covering replay, unrelated
    uncertainty, terminal states not blocking, all three protected states, a
    changed payload, a hung agent-list call killed inside its bound, no send
    past the deadline, and the lock released when a child is killed. Those unit
    tests ran: Ran 73 tests in 86.971s OK.
- acceptance_test_index: 6
  result: passed
  evidence: >-
    Transport without deciding, dispositioned verified by the Reviewer and
    preserved here. TestTheRelayTransportsWithoutDeciding still asserts the
    ordered list survives verbatim with the blocking escalation ahead of its
    dependent and the independent item still ready, the prompt delivered exactly
    as written, no input byte modified, every relay file under .local/, and a
    reload-only request carrying an empty next-step list. The relay has no code
    path that reads priority at all. The stricter validation added for F1 does
    not weaken this: ordered_next_steps is now required and type-checked, which
    makes the transported list more explicit rather than less faithful. Those
    unit tests ran: Ran 73 tests in 86.971s OK.
- acceptance_test_index: 7
  result: passed
  evidence: >-
    Previously failed on F6 for incomplete pins and for resting on suites that
    could not establish the failed safety criteria. Both are addressed.

    Complete pins. implementation_files now carries all nineteen surviving
    exact_diff paths: the four Builder-owned files plus the nine the Reviewer
    enumerated -- AGENTS.md, README.md, REPOSITORY_STRUCTURE.md, the five role
    instruction files and contracts/SOURCE_MARKDOWN.md -- and the six already
    present. The two deleted definition files are verified by absence only and
    appear in no pin.

    Strengthened tests. The relay suite grows from 44 tests to 73, adding
    regression classes for each of F1 through F5 so a defect that was once real
    fails this suite and not only the Reviewer's. The decisive evidence is
    independent: the Reviewer's own 13 probes at
    tooling/reviewer/tests/test_dec0082_relay_acceptance.py, unmodified and
    still hashing to sha256:8a331a11cfe9a31393bdfc3c680474ca1c23817d305e265dd203158b61039416,
    went from 12 failures against r01 to 13 passes against this revision.

    Reruns. All four commands below are recorded with a working directory, exit
    code, result and verdict: the focused role-context suite, the focused relay
    suite, the Reviewer's probe suite, and the complete common suite
    (Ran 1250 tests in 467.522s OK). Approval is not claimed: DEC-2026-0082 step 3 requires
    independent verification, and routine relay use stays unauthorized until it
    exists.
