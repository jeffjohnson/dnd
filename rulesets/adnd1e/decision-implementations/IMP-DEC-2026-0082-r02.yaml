finding_resolutions:
- id: F1
  status: fixed
  change: >-
    Test-HandoffRequest requires the complete typed request and checksums every
    input and prerequisite; Resolve-InsideRoot replaces the bare string prefix
    with a separator-bounded comparison on resolved paths; scope identifiers are
    null or case-sensitively well-formed; the endpoint must match the inherited
    one. ValidateOnly still launches nothing and writes nothing.
  proof: >-
    TestCompleteTypedRequest (10 cases) plus the Reviewer's
    test_incomplete_request_cannot_validate,
    test_unassigned_invalid_scope_cannot_validate and
    test_existing_prefix_sibling_is_outside_root.
- id: F2
  status: fixed
  change: >-
    Resolve-Party resolves each party by unique role alias and fails closed on
    an absent or ambiguous alias before any pane is trusted, then cross-checks
    provider, pane and native session for both sender and recipient. Sessions
    and aliases are now required request fields rather than optional hints.
  proof: >-
    TestPartyIdentityIsVerified (7 cases) plus the Reviewer's
    test_changed_sender_identity_cannot_send,
    test_wrong_recipient_role_alias_cannot_send and
    test_duplicate_recipient_alias_cannot_send.
- id: F3
  status: fixed
  change: >-
    A settled response status set excludes submitted and blocked; the recipient
    is re-resolved after delivery and must be idle or done; the lock is held
    through that confirmation. Anything else records uncertain and refuses to
    authorize another send.
  proof: >-
    TestAcknowledgmentIsNotSettlement (5 cases) plus the Reviewer's
    test_blocked_response_is_not_settlement and
    test_submitted_response_is_not_settlement.
- id: F4
  status: fixed
  change: >-
    The lock is acquired before the claim, and the claim, payload-checksum bind
    and outstanding check all run under it at every executable entry point. A
    consumed request cannot be replayed. Write-State protects submitting,
    acknowledged and uncertain from being overwritten, and the lock-refusal path
    writes no state at all.
  proof: >-
    TestIdentityIsClaimedAtomically (5 cases) plus the Reviewer's
    test_execute_phase_cannot_replay_same_request,
    test_execute_phase_honors_outstanding_uncertainty and
    test_process_interruption_cannot_erase_possible_send.
- id: F5
  status: fixed
  change: >-
    Invoke-Herdr runs every endpoint call as a supervised child against one
    monotonic Stopwatch budget and kills it on expiry; agent listing is bounded
    exactly like the prompt; the deadline is rechecked immediately before
    submission. A budget that expires while waiting for the sender is an
    ordinary refusal rather than an unhandled error.
  proof: >-
    TestEveryChildCallIsBounded (3 cases) plus the Reviewer's
    test_child_endpoint_call_obeys_finite_wait.
- id: F6
  status: fixed
  change: >-
    This successor pins all nineteen surviving exact_diff paths, adds the F1-F5
    regression classes, and reruns the focused, independent and complete suites.
    r01 is preserved unmodified; nothing was repaired in place.
  proof: >-
    implementation_files above, the validation companion's path-coverage check
    derived from the Decision's own exact_diff_ownership, and the four validation
    commands.
bugs_found_by_the_new_tests:
- subject: PowerShell comparison operators are case-insensitive by default
  detail: >-
    The scope-identifier guard used -notmatch against a lowercase-only pattern,
    so 'Adnd1e' passed. It needed -cnotmatch. Found by
    test_a_scope_identifier_may_be_null_but_not_malformed, not by reading; the
    same hazard would have quietly accepted any mixed-case identifier.
- subject: a supervised child can be killed just outside a budget check
  detail: >-
    The sender-wait loop checked the remaining budget, then started a call that
    could be killed after it expired, and the resulting error escaped as an
    unhandled PowerShell failure with no JSON result. It is now caught and
    reported as an ordinary "had not settled" refusal, which is what it is:
    nothing was sent.
scope_note: >-
  Only the four Builder-owned paths in DEC-2026-0082's exact_diff_ownership were
  written. The fifteen governance and Decision paths pinned above were read and
  verified, not modified. The Reviewer's probe suite at
  tooling/reviewer/tests/test_dec0082_relay_acceptance.py was run unmodified and
  still hashes to the value its Review recorded; it is Reviewer-owned and this
  report neither edits it nor depends on editing it. IMP-DEC-2026-0082-r01 and
  its validation artifact are preserved unchanged, as are DEC-2026-0081 and
  IMP-DEC-2026-0081-r01. No canonical data, registry, schema, worker artifact,
  scanner or source file was changed. The relay was not used to send anything:
  routine use remains unauthorized until this report is independently approved,
  and the only herdr calls this session made were read-only inspections.
defects_for_the_architect:
- id: empty-retired-role-directory-remains
  detail: >-
    agents/dispatcher/ still exists as an empty directory after its
    INSTRUCTIONS.md was deleted. Git does not track empty directories, so it
    appears in no diff, and the acceptance criterion is met because the
    definition file is absent. Reported rather than removed: the path is
    Architect-owned. Purely cosmetic. Unchanged since r01.
- id: source-markdown-drift-keeps-invalidating-dec-2026-0080
  detail: >-
    contracts/SOURCE_MARKDOWN.md is now 1.7, and IMP-DEC-2026-0080-r03 still
    pins 1.6, so that lineage is red for the third consecutive revision through
    no fault of its implementation. DEC-2026-0082's coordination_constraints
    direct a separate Builder refresh, which is queued as the next Builder job.
    Worth an Architect ruling rather than a fourth round: minimum_version
    already bounds what that report depends on, so the exact-checksum pin on a
    contract the report does not own is the part that keeps breaking.
