acceptance_results:
- acceptance_test_index: 1
  result: passed
  evidence: VERIFIED AGAINST THE PUBLISHED FILES, WHICH THE ARCHITECT WROTE. contracts/WORK_QUEUES.md
    is Version 1.15; core rule 16 (lines 58-64) makes a contract version a minimum-version predicate only
    under declared versioned_contract_content semantics or a later legacy authorization, and states that
    an unstructured exact-version statement stays literal. The 'Versioned Contract-Content Acceptance'
    section (line 66) requires 'Version N or later' plus enumerated paths, minimums and anchors, fixes
    the outcome as passed in the report and verified_versioned_contract_content in the Review, and says
    in terms that it is not retired_by_lineage. Contract acceptance test 48 records the queue criteria.
    contracts/ARTIFACT_LIFECYCLE.md is Version 1.11 and its section 6 (lines 197-203) gives the same rule
    as current-state verification rather than a retirement outcome. Re-verified at the current checksums
    for this revision, which carries the DEC-2026-0048 Review-branch correction; the claim above is unchanged.
    Re-verified at the current checksums for this revision, which exists only because later approved Decisions
    advanced the contracts this report pins; the claim above is unchanged. Re-verified at current checksums
    for this revision, which exists only because later approved Decisions advanced the contracts and tooling
    this report pins; the claim above is unchanged.
- acceptance_test_index: 2
  result: passed
  evidence: 'IMPLEMENTED AND TESTED, AND THE GAP r01 LEFT IS CLOSED. r01 added the schema shapes but left
    the queue''s approved-review validator falling through to ''rather than verified'', so a Review using
    the disposition this Decision requires was rejected. REV-IMP-DEC-2026-0048-r01-r02 named it exactly
    and the two authorized reports demonstrated it. scan_agent_queues.py now carries a verified_versioned_contract_content
    branch that requires the report to record the result as passed, requires the report to actually claim
    versioned contract-content evidence for that index, requires the Review to record its own re-derivation,
    and validates that re-derivation through _versioned_block_errors -- the same function the report is
    checked with, extracted for the purpose so the two cannot drift apart. The converse guard is in place
    too: plain `verified` on an index the report backs with this evidence is refused, mirroring the retired-by-lineage
    rule. Schema side unchanged from r01: acceptance_test_semantics gains the kind and requires its contracts;
    contract_version_acceptance_authorizations pins decision_input, index and contracts; the report evidence
    block is forbidden on a retired_by_lineage result; the Review disposition requires its evidence and
    forbids it elsewhere. Re-verified at the current checksums for this revision, which exists only because
    later approved Decisions advanced the contracts this report pins; the claim above is unchanged. Re-verified
    at current checksums for this revision, which exists only because later approved Decisions advanced
    the contracts and tooling this report pins; the claim above is unchanged.'
- acceptance_test_index: 3
  result: passed
  evidence: 'IMPLEMENTED AND TESTED, BOTH DIRECTIONS. Rejection: VersionedContractContentCase covers absent
    authority, stale authority checksum, an authorization pinned to a different Decision checksum, a mismatched
    authorized index, no authorization for the claimed index, below-minimum version, incomplete anchors,
    stale contract checksum, an observed version disagreeing with the file, a declared minimum below the
    authorized one, evidence for an unauthorized contract, missing evidence for an authorized one, and
    this outcome on a failed result; test_an_invalid_report_is_not_approval_ready fixes that such a report
    does not reach Reviewer. Acceptance: VersionedContractReviewCase adds the half r01 lacked -- test_a_valid_versioned_review_is_accepted
    and test_a_valid_versioned_review_consumes_the_decision prove valid evidence now reaches an effective
    approved Review and completes the Decision, while test_the_reviewer_evidence_is_re_derived_not_trusted,
    test_a_reviewer_dropping_an_anchor_is_rejected, test_the_disposition_requires_its_own_verification,
    test_the_disposition_needs_the_report_to_claim_the_evidence and test_plain_verified_cannot_approve_this_evidence
    hold the line. 73 targeted tests pass. Re-verified at the current checksums for this revision, which
    exists only because later approved Decisions advanced the contracts this report pins; the claim above
    is unchanged. Re-verified at current checksums for this revision, which exists only because later
    approved Decisions advanced the contracts and tooling this report pins; the claim above is unchanged.'
- acceptance_test_index: 4
