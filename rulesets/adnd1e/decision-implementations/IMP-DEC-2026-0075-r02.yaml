canonical_state: 5160 edges, 1452 nodes, 1473 registry rows and 1691 findings, the state INT-20260830-003
  left, with edges_master.csv at sha256:76b03fc12746ce9ac825bb5e91c59780429b3894ec74971addfcc465e282fb2e.
  This work wrote none of it. The guard reads live canonical but never writes it, and its dry-run assertion
