guard_falsification_check:
  why: A regression guard that has never been seen to fail proves only that it runs. This records that
    the guard was falsified deliberately against the defect it exists to catch, and that the file was
    restored byte-for-byte afterwards.
  method: The dependency-closure clause in _rewind was temporarily replaced by the unconditional `continue`
    it had before the repair, the focused class was run, and the file was then restored from a byte-exact
    copy taken before the edit.
  command: '[cwd tooling/integrator/tests] PYTHONPATH=../src python -m unittest test_transaction.TestAPartialRewindClosesOverRetiredIdentities'
  exit_code: 1
  result: failed
  summary: Ran 5 tests in 8.620s FAILED (failures=2)
  reading: test_the_clone_has_no_endpoint_without_a_registry_identity failed with ['item_pipes_of_sewers']
    != [], which is exactly the stranded node the nine original errors reported, and the closure test
    failed alongside it. The guard therefore fails on the defect and passes on the repair.
  file_restored: tooling/integrator/tests/test_transaction.py hashes to sha256:79b239c0737f1371ec4ba9edeb3ae7edbdbc26e7e350ed454b35a7511aad5615
    both before the temporary edit and after the restore, so the published implementation file is the
    one the passing runs measured.
scope_note: DEC-2026-0075's exact_diff_ownership assigns the Integrator exactly one file, tooling/integrator/tests/test_transaction.py,
  and that is the only file this work changed. tooling/integrator/tests/test_bundles.py is pinned in
  implementation_files because acceptance test 3's subject lives there and a Reviewer needs its exact
  bytes to re-derive that result; it was not modified by this report. Its current content is the fixture
