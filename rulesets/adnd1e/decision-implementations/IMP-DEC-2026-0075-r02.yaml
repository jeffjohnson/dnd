acceptance_results:
- acceptance_test_index: 1
  result: passed
  evidence: 'TestAPartialRewindClosesOverRetiredIdentities in tooling/integrator/tests/test_transaction.py,
    five unit tests in the focused run below (Ran 12 tests in 62.576s OK). It builds the migration fixture''s
    own clone from the current integrated corpus by calling test_migration.clone, which is the partial
    rewind under test. Against that clone: test_the_rewind_actually_retired_a_registered_identity proves
    the reversal took a registered identity out, so nothing below passes vacuously; test_every_integrated_row_anchored_on_a_retired_identity_came_out
    proves every row the live repository integrated that anchors on a retired identity is absent from
    the clone; test_the_dependent_belongs_to_the_packet_that_reused_the_identity proves the dependent
    found this way belongs to PKT-PHB-117-119-bards, the packet that reuses item_pipes_of_sewers; test_the_clone_has_no_endpoint_without_a_registry_identity
    proves no edge endpoint lacks a registry row; and test_the_migration_fixture_still_verifies_and_applies
    proves the clone is usable, not merely self-consistent, by running verify_bundle with no blocking
    failure and then a dry-run integrate that leaves every writable file byte-identical.'
- acceptance_test_index: 2
  result: passed
  evidence: 'Everything the guard asserts is derived at run time. The retired identity set is the difference
    between the live registry and the clone''s registry, not a named ID. The dependent bundles are found
    by reading each discovered bundle''s own rows and testing their endpoints against that derived set,
    filtered by whether live canonical actually contains the row, so an unintegrated bundle cannot satisfy
    the assertion vacuously. The packet check names PKT-PHB-117-119-bards and reads the revision from
    the manifest, so no Bards leaf revision is pinned. No edge total, node total or registry total appears
    anywhere in the class. There is no skipTest and no conditional early return: an invalid clone fails
    the guard rather than stepping around it, which test_the_migration_fixture_still_verifies_and_applies
    states in its own docstring.'
- acceptance_test_index: 3
  result: passed
  evidence: test_the_current_leaf_reaches_a_live_bucket in tooling/integrator/tests/test_bundles.py,
    run in both commands below. It derives the leaf through _bards_leaf, which reads every APPROVED-GUP-PKT-PHB-117-119-bards-*.yaml
    manifest and returns the single ID no other manifest names in supersedes, asserting there is exactly
    one. It then asserts the leaf is not APPROVED-GUP-PKT-PHB-117-119-bards-r04-r02, the bundle DEC-2026-0068's
    record withholds, and that the leaf appears in the union of the ready and integrated buckets. It
    asserts nothing about which of those two buckets holds it, so a completed bundle satisfies it exactly
    as a queued one does. That test currently passes with the leaf in the integrated bucket, which is
    the state that falsified its predecessor.
- acceptance_test_index: 4
  result: passed
  evidence: 'Both commands are recorded below with their working directory, exit code, result and unittest
    verdict: the focused test_transaction run (Ran 12 tests in 62.576s OK) and the full Integrator suite
    (Ran 222 tests in 1662.498s OK). The exact checksums of both implementation files are pinned in
    implementation_files and re-listed in the companion validation report. No canonical data was modified:
    rulesets/adnd1e/canonical/edges_master.csv still hashes to sha256:76b03fc12746ce9ac825bb5e91c59780429b3894ec74971addfcc465e282fb2e,
    which is the value INT-20260830-001 left, and the only writes this work performed were the new test
    class, this report and its validation artifact. The guard changes no canonical byte: it reads live
    canonical to derive what the clone should contain, and its dry-run assertion compares every writable
    file for byte-identity before and after.'
- acceptance_test_index: 5
  result: passed
  evidence: This report pins DEC-2026-0075 at its current checksum sha256:17794eeb6d7e19fd37b3eb52930ce53d9801ee64a50d7f068b637ac46dc917f1,
    reports all five acceptance tests as passed, records focused and full-suite evidence with a working
