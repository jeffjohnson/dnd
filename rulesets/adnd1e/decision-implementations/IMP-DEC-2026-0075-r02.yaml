why_this_revision: 'The predecessor''s evidence was measured before INT-20260830-003, the ordinary integration
  of APPROVED-GUP-PKT-PHB-054-064-druid-spells-r03-r02, which the Integrator then applied under its
  own lifecycle. That transaction moved canonical from 5103 edges to 5160, so the predecessor''s canonical
  pin and the canonical_untouched checksum in its validation artifact no longer describe the repository,
  and a Reviewer re-deriving them would find a stale value through no fault of the guard. Nothing in
  the implementation changed: both pinned files still hash to exactly what the predecessor recorded.
  Every command is re-run and re-recorded here against the current corpus. The reissue is worth more
  than the round trip it avoids, because it demonstrates the property DEC-2026-0075 actually asks for
  -- the guard passed on the corpus before that integration and on the corpus after it, which is what
  it means for a fixture to assert an invariant that survives a successful authorized integration rather
  than a state that happened to hold when it was written.'
