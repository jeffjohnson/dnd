  result: passed
  evidence: 'VERIFIED AGAINST THE PUBLISHED FILES, WHICH THE ARCHITECT WROTE. agents/integrator/INSTRUCTIONS.md
    gained ''### Rejection records'' at line 167: an immutable JSON record under rulesets/<ruleset-id>/reports/
    conforming to the rejection schema, declaring status: rejected and recording, for every rejected bundle,
    the exact Approved-bundle, approving Review and reviewed GUP IDs and SHA-256 checksums plus one or
    more machine-readable blocking failures, with an explicit prohibition on inferring or omitting provenance.
    agents/reviewer/INSTRUCTIONS.md gained ''### Integration-rejection remediation'' at line 135, requiring
    an immutable successor Review recording integration_rejection.id, .path and .checksum, which is what
    consumes the REVIEWER-INTEGRATION-REJECTION item. Before this Decision neither file contained the
    word ''rejection'' at all. Re-verified for r02 at the current checksums after the DEC-2026-0046 scanner
    change drifted the two shared tooling files this report pins; 31 targeted tests still pass and the
    claim above is unchanged. Re-verified at the current checksums for this revision: the Integrator published
    IMP-DEC-2026-0044-r03, so the common suite is 560 OK, the Integrator suite 125 OK and the builder
    suite 580 OK. The claim above is unchanged; only the blocking suite state changed. Re-verified at
    the current checksums for this revision, which exists only because DEC-2026-0047 advanced contracts/WORK_QUEUES.md
    to 1.14 and this report pins it. No content this Decision required was changed; the claim above is
    unchanged. Re-verified at the current checksums for this revision, which exists to carry the structured
    authority DEC-2026-0048 grants; the claim above is unchanged.'
