- acceptance_test_index: 2
  result: passed
  evidence: >-
    Dispositioned verified by the Reviewer twice and untouched again:
    role_context.py and test_role_context.py are byte-identical to the bytes
    verified against r01 and r02, so the five-role verifier was not disturbed
    while the relay was corrected. The live manifest validates and declares
    exactly the five active roles; the retired role is refused at every entry
    point without writes. Those unit tests ran: Ran 80 tests in 1.547s OK.
- acceptance_test_index: 3
  result: passed
  evidence: >-
    Previously failed on R1, R2 and R3. All three are fixed and the Reviewer's
    probes for them pass unmodified.

    Native endpoints (R1). Invoke-Herdr now launches a native client directly
    and routes only a .ps1 double through a PowerShell host, passing arguments
    through ArgumentList so spaces survive. The decisive evidence is not a mock:
    driving the shipped helper against the installed
    HERDR_BIN_PATH -- herdr.exe -- with a read-only `agent list` returns the
    real envelope, top-level keys `id, result`, five agents, with genuine
    agent_status values. No prompt was sent. TestNativeAndScriptEndpoints covers
    the native shape, the script shape, an endpoint path containing spaces and
    an argument containing spaces.

    Fully typed evidence (R2). inputs, prerequisites and ordered_next_steps must
    be arrays; an explicit null is refused rather than silently treated as
    empty, which is what `@($null)` had been doing. A genuinely empty array is
    still accepted, since a reload-only handoff has no inputs and no onward
    work. The endpoint's socket identity is bound into the reservation and a
    request naming a different socket than the inherited HERDR_SOCKET_PATH is
    refused: a matching executable identifies the client, not the server.
    TestFullyTypedEvidence covers all of this in 5 cases.

    Containment through links (R3). Resolve-Path normalises lexically and does
    not follow a junction, so a repository-local junction could point outside
    the root while the path still looked contained. Resolve-InsideRoot now fails
    closed on any reparse point between the root and the target. The root's own
    ancestry is deliberately not inspected -- a repository living under a
    junction is not the attack, and rejecting it would make the relay unusable.
    TestContainmentSurvivesLinks proves both the refusal and that an ordinary
    nested path still resolves. Those unit tests ran: Ran 95 tests in 120.700s
    OK.
- acceptance_test_index: 4
  result: passed
  evidence: >-
    Previously failed on R1 and R4.

    R1 is covered under acceptance test 3: the production path works against the
    real client, verified read-only.

    Scheduling reservation and continuation (R4). r02 claimed atomicity at every
    entry point; the Reviewer correctly found that was true of Invoke-Execute
    and not of Invoke-Schedule, which still checked then wrote. Scheduling now
    claims the request ID with an exclusive CreateNew on its state file, so the
    claim is its own test and exactly one of two racing schedulers wins. The
    payload and the inherited endpoint identity are bound into that reservation.
    Separately, Get-DeliveryBlockers distinguishes a staged continuation from an
    outstanding delivery: a recipient finishing its turn may queue the next
    assignment while its own parent relay still holds the lock through
    settlement, which is what makes the contract's serial chain usable, while an
    independent competitor and an unresolved uncertainty both still refuse.
    TestScheduleToExecuteChain covers the whole chain in 8 cases, including a
    scheduled request delivered end to end by its own detached relay, two
    genuinely concurrent relays prompting exactly once, an interrupted relay,
    the continuation, an independent competitor, an uncertain predecessor, an
    unreserved execution and a concurrent duplicate reservation. Those unit
    tests ran: Ran 95 tests in 120.700s OK.
- acceptance_test_index: 5
  result: passed
  evidence: >-
    Previously failed on R4 and R5.

    Unscheduled execution (R4). Invoke-Execute now requires an unconsumed
    `queued` reservation and refuses when none exists; authorization is never
    created merely because no record is present.

    Sender status (R5). Only a verified `working` sender is polled. Blocked,
    unknown or empty status stops immediately with a durable `failed` record, so
    a later idle observation cannot implicitly resume a request that met an
    unresolved blocker. TestSenderStatusIsVerified covers blocked, three unknown
    statuses, and that the ordinary working-then-idle case still delivers, so
    the narrowing did not break the normal path. Those unit tests ran: Ran 95
    tests in 120.700s OK.
- acceptance_test_index: 6
  result: passed
  evidence: >-
    Dispositioned verified by the Reviewer against r02 and preserved.
    TestTheRelayTransportsWithoutDeciding still asserts the ordered list
    survives verbatim with the blocking escalation ahead of its dependent and
    the independent item still ready, the prompt delivered exactly as written,
    no input byte modified, every relay file under .local/, and a reload-only
    request carrying an empty next-step list. R2's stricter typing makes the
    transported list more explicit, not less faithful: an empty array is still
    a valid reload-only payload, while a null is now refused. Those unit tests
    ran: Ran 95 tests in 120.700s OK.
- acceptance_test_index: 7
  result: passed
  evidence: >-
    Dispositioned verified by the Reviewer against r02 for pins and evidence
    completeness; the same nineteen paths are pinned here with current
    checksums, and the two deleted definition files remain verified by absence.

    Suites. The focused role-context suite passes 80; the relay suite grows from
    73 to 95 with regression classes for each of R1 through R5; the Reviewer's
    seven new probes pass 7/7 unmodified; the complete common suite passes
    (Ran 1272 tests in 495.176s OK). Eleven of the thirteen original probes pass
    unmodified. The remaining two fail on fixture setup that predates R4 rather
    than on behaviour, which is recorded in reviewer_fixture_request with the
    exact one-line change and with proof that both pass once the reservation
    exists. Approval is not claimed: DEC-2026-0082 step 3 requires independent
    verification, and routine relay use stays unauthorized until it exists.
