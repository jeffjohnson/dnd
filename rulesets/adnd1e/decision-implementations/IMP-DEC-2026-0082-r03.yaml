finding_resolutions:
- id: R1
  status: fixed
  change: >-
    Invoke-Herdr launches a native client directly and only routes a .ps1 double
    through a PowerShell host; arguments travel as an ArgumentList so spaces are
    preserved in both the endpoint path and the arguments.
  proof: >-
    A read-only `agent list` against the installed herdr.exe returns the real
    envelope (id, result; five agents; genuine agent_status values), plus
    TestNativeAndScriptEndpoints (4 cases) and the Reviewer's
    test_native_executable_endpoint_is_supported.
- id: R2
  status: fixed
  change: >-
    Evidence collections are type-checked, so an explicit null is refused rather
    than silently skipped, while a genuinely empty array stays valid for a
    reload-only handoff. The inherited HERDR_SOCKET_PATH is bound into the
    reservation and a mismatched declared socket is refused.
  proof: >-
    TestFullyTypedEvidence (5 cases) plus the Reviewer's
    test_null_evidence_collections_are_rejected and
    test_endpoint_socket_identity_mismatch_is_rejected.
- id: R3
  status: fixed
  change: >-
    Resolve-InsideRoot fails closed on any reparse point between the root and
    the target, closing the junction bypass that a lexical boundary cannot see.
  proof: >-
    TestContainmentSurvivesLinks (2 cases, including that an ordinary nested
    path still resolves) plus the Reviewer's
    test_link_to_external_file_is_outside_repository.
- id: R4
  status: fixed
  change: >-
    Scheduling reserves the request ID with an exclusive CreateNew and binds the
    payload and endpoint identity; execution requires that unconsumed queued
    record; and a staged continuation from the parent's own recipient is
    distinguished from an outstanding delivery, so the serial chain is usable
    while competitors and uncertain predecessors still refuse.
  proof: >-
    TestScheduleToExecuteChain (8 cases) plus the Reviewer's
    test_unscheduled_execution_is_rejected and
    test_finishing_recipient_can_stage_deferred_continuation.
- id: R5
  status: fixed
  change: >-
    Only a verified working sender is polled; blocked, unknown or empty status
    stops immediately with a durable failed record so a later idle observation
    cannot resume a request that met an unresolved blocker.
  proof: >-
    TestSenderStatusIsVerified (3 cases) plus the Reviewer's
    test_blocked_sender_fails_closed_instead_of_waiting_it_out.
reviewer_fixture_request:
  why: >-
    This is the one item this revision cannot resolve on its own. The Review
    states: "Do not modify Reviewer-owned probes or governance to make tests
    pass; if a valid fixture needs changed setup, report that exact need to
    Reviewer." This is that report. Neither Reviewer-owned probe file was
    modified; both still hash to the values their Reviews recorded.
  affected:
    path: tooling/reviewer/tests/test_dec0082_relay_acceptance.py
    checksum: sha256:8a331a11cfe9a31393bdfc3c680474ca1c23817d305e265dd203158b61039416
    tests:
    - test_two_competing_relays_do_not_prompt_concurrently
    - test_process_interruption_cannot_erase_possible_send
  cause: >-
    Both call start_slow_prompt, which Popens the relay with -ExecuteRequest and
    no queued reservation. R4 requires delivery to have an unconsumed scheduled
    record and forbids creating authorization merely because none exists, so the
    first prompt never begins and each test fails at its own
    "first fake prompt did not begin" assertion.
  why_it_cannot_be_resolved_in_the_relay: >-
    The new probe test_unscheduled_execution_is_rejected asserts the opposite
    outcome for the same situation: a request built by the same self.request()
    helper, executed directly with no reservation, must be refused with no
    prompt. From the relay's side the two scenarios are identical in every
    observable respect, so no implementation can satisfy both. One of the two
    fixtures has to change, and both belong to the Reviewer.
  proposed_change: >-
    Add one line at the top of start_slow_prompt:
    `self.ensure_reserved(request)`. RelayCase.ensure_reserved is a new Builder
    fixture helper that writes the queued reservation the scheduler would
    normally create. It is only created when absent, so a test that sets its own
    state keeps it.
  evidence_that_behaviour_is_intact: >-
    Both probes were re-run with start_slow_prompt wrapped at runtime to add
    that single call, without editing the Reviewer's file: both pass, 2 run, 0
    failures, 0 errors. The same two properties are additionally covered
    independently in the Builder suite by
    TestScheduleToExecuteChain.test_two_concurrent_relays_prompt_exactly_once
    and test_an_interrupted_relay_leaves_possible_send_evidence, which use real
    concurrent processes and a slow-prompt endpoint.
bugs_found_by_the_new_tests:
- subject: a PowerShell function patched in isolation can leave its body unclosed
  detail: >-
    Inserting two helper functions by replacing the tail of another left both
    unclosed, and the relay stopped emitting JSON at all. Caught immediately by
    the suite and by an explicit Parser::ParseFile check, which is now the first
    thing run after any edit to the script.
- subject: a [string[]] parameter binds only its first element from a command line
  detail: >-
    The endpoint harness passed `-CallArgs agent list` and the callee received
    only `agent`, so the first version of the native-endpoint test failed for a
    reason that had nothing to do with the relay. Arguments now travel as JSON
    and are converted inside the harness.
- subject: embedded double quotes do not survive a JSON round trip into a process argument
  detail: >-
    A Python one-liner containing escaped quotes arrived with the backslashes
    stripped and failed to parse. The fixture now uses a one-liner with no
    embedded double quotes; the point of the test is the process launch, not
    fixture quoting.
scope_note: >-
  Only two Builder-owned paths were written by this revision:
  tooling/common/send-agent-handoff.ps1 and
  tooling/common/tests/test_herdr_handoff.py. role_context.py and
  test_role_context.py are unchanged from the bytes the Reviewer verified twice.
  The fifteen governance and Decision paths pinned above were read and verified,
  not modified. Neither Reviewer-owned probe file was modified: both still hash
  to the values recorded in their Reviews, and the two failing probes were
  demonstrated to pass only by wrapping a method at runtime in a scratch script,
  never by editing the file. IMP-DEC-2026-0082-r01 and r02, their validation
  companions, and both Reviews are preserved unchanged, as are DEC-2026-0081 and
  IMP-DEC-2026-0081-r01. No canonical data, registry, schema, worker artifact,
  scanner or source file was changed. The relay was not used to deliver
  anything; the only live endpoint call was a read-only `agent list`.
defects_for_the_architect:
- id: empty-retired-role-directory-remains
  detail: >-
    agents/dispatcher/ still exists as an empty directory after its
    INSTRUCTIONS.md was deleted. Git does not track empty directories, so it
    appears in no diff, and the acceptance criterion is met because the
    definition file is absent. Architect-owned path; purely cosmetic. Unchanged
    since r01.
- id: source-markdown-drift-keeps-invalidating-dec-2026-0080
  detail: >-
    contracts/SOURCE_MARKDOWN.md is at 1.7 while IMP-DEC-2026-0080-r03 pins 1.6,
    so that lineage has now been red for three consecutive revisions through no
    fault of its implementation. The separate refresh remains queued as the next
    Builder job. Worth an Architect ruling rather than a fourth round:
    minimum_version already bounds what that report depends on, so the
    exact-checksum pin on a contract the report does not own is the part that
    keeps breaking.
