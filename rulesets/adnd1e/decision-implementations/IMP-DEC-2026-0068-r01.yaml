- acceptance_test_index: 1
  result: passed
  evidence: 'Every pinned field is re-derived before the classification exists. REV-GUP-PKT-PHB-117-119-bards-r04-r02
    still hashes to the recorded value and still fails with the recorded fragment; r03 and its bundle
    parse; both direct supersedes links are read from the files rather than taken from the record; r03
    is approved with an architect/ready handoff and reviews GUP-PKT-PHB-117-119-bards-r04; r03 validates
    against review.schema.json and its bundle against approved-bundle.schema.json; the bundle approves
    r03 specifically; and the operation partition is the contiguous 1-29 / 30-57 span with zero updates
    and eleven registered nodes. The scan reports exactly one informational review_unreadable_direct_predecessor_repaired
    for r02 and no parse error for it. These unit tests ran: Ran 38 tests in 24.838s OK.'
- acceptance_test_index: 2
  result: passed
  evidence: 'Twenty denial cases, each leaving the classification unapplied and the record''s failure
    loud: no record; an unapproved Decision; a stale checksum on any one of the eight pinned artifacts,
    driven field-by-field; a predecessor that parses; a parse fragment or diagnostic code the parser does
    not produce; a bridge or successor link pointing elsewhere; a non-approved successor; a successor
    whose handoff names another role or is blocked; a successor reviewing a different GUP; a bundle approving
    a different Review; a non-contiguous partition; a wrong row count; a nonzero update count; a different
    node count; a wrong disposition; and an empty reason. In every case r02 keeps its ordinary yaml_unreadable
    error. An unrelated unreadable Review in another packet is untouched. These unit tests ran: Ran 38
    tests in 24.838s OK.'
- acceptance_test_index: 3
  result: passed
  evidence: 'The schema suite admits exactly the two Decision-pinned files -- the Druid r04 under DEC-2026-0064
    and this Bards r02 -- and the pins are read from the approved Decisions rather than restated in the
    suite, so a second record cannot be forgotten the way the first nearly was. The exemption is re-earned
    on every run: each pinned file must still hash to its recorded checksum and still fail to parse, and
    the exempt set is compared with the pinned set rather than against a count. Any other unreadable published
    artifact is reported by name, which is how the one remaining offender below is identified. These unit
    tests ran: Ran 9 tests in 0.451s OK.'
- acceptance_test_index: 4
  result: failed
  evidence: Reported failed because it is. This report pins DEC-2026-0068 by checksum and records passing
    focused evidence (38 queue tests, 9 exemption tests) and a passing full tooling/builder suite (684
    tests, OK), but the full applicable tooling/common suite is red at 1025 tests with 3 failures, so
    the report is not approval-ready. None of the three failures is in this implementation or reachable
    by Builder action. One is rulesets/adnd1e/decision-implementation-reviews/REV-IMP-DEC-2026-0065-r01-r01.yaml,
    published as unparseable YAML and pinned by no Decision, so it fails closed exactly as acceptance
    test 3 requires. Two are command records in IMP-DEC-2026-0065-r03 and IMP-DEC-2026-0069-r01 that name
    no working directory; adnd1e_integrator.cli defaults --repo-root to '.', so those commands are not
    reproducible as written. A successor report with a green suite is required once those three are repaired,
    and no further Builder implementation work is involved.
handoff:
  next_role: reviewer
  readiness: ready
  reason: 'Published on the overseer''s explicit instruction while acceptance test 4 cannot yet be met,
    and reported as failed rather than dressed up. The implementation is complete and independently verifiable;
    what is missing is a green applicable suite, and the three failures keeping it red are other roles''
    published artifacts.


    What this Decision asked for is done. The direct-predecessor record is a separate mechanism from DEC-2026-0064''s
    bridge because it has to be: a two-hop bridge needs a middle artifact, and r03 directly supersedes
    r02, so forcing the Bards lineage into the bridge shape would require r03 to occupy both the bridge
    and successor positions -- a claim that it supersedes itself. The two records validate through different
    predicates and neither admits the other''s file.


    One thing in it is my judgment rather than the ruling''s. Skipping the unreadable file removes it
    from the lineage as well as from the parser, so r03''s supersedes pointed at an ID the walk could
    not find and r01 was left looking like a second active leaf. Neither is true, and neither could be
    learned from r02 -- the file will not open. The record states and checksums that the chain runs r01
    to r02 to r03, so the record supplies exactly those two facts and nothing else is inferred. Any other
    absent predecessor is still an ordinary lineage error.


    Separately, and outside this Decision''s exact_diff: a bulk ruling whose `applies_to` is prose used
    to be iterated character by character, so the Druid r02-r01 Review produced 32 review_ref_not_in_gur
    errors naming '' '', '','' and ''-''. All true, none of them the problem. That is now one error naming
    the cause. The prose is deliberately not expanded into the refs it describes -- reading a range like
    L20-L22 out of a sentence is inferring the Reviewer''s intent, which is what a machine-readable directive
    exists to make unnecessary. The Druid revision still needs a successor Review stating those refs as
    a list.


    Six malformed YAML artifacts have now been published across three roles in three days, and each has
    been handled as an individual checksummed exception. The mechanism works and the exceptions are narrow,
    but they are accumulating faster than whatever produces them is being addressed. That is an observation
    for the Architect, not a Builder request.'
