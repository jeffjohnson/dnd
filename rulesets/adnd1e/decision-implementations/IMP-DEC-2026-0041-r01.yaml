acceptance_results:
- acceptance_test_index: 1
  result: passed
  evidence: 'The implementation this Decision authorizes was already published under IMP-DEC-2026-0039-r01
    and is unchanged. Verified against the ruling clause by clause in _repaired_by_successor: (a) every
    envelope error must be rooted in handoff -- the guard returns False if any error path''s first element
    is not ''handoff''; (b) a published direct successor must name the exact ID in supersedes -- it compares
    str(successor[''supersedes'']) to the predecessor''s id; (c) that successor must have zero envelope
    errors -- it requires errors(ENVELOPE, successor) to be empty. All three are required and each is
    denied by a test in TestSupersededExemptionIsNarrow: no successor, a successor naming a different
    predecessor, an invalid successor, and an error outside handoff (checked twice, via revision 0 and
    a non-string schema_version).'
- acceptance_test_index: 2
  result: passed
  evidence: 'The exemption is reported and pinned. test_the_exemption_is_reported_rather_than_silent asserts
    the exempt set equals exactly [''GUR-PKT-UA-015-015-cavaliers-r02.yaml''], so a second artifact cannot
    join it without that test failing and requiring a later Architect Decision. Live repository check:
    the computed exempt set is that one artifact. test_the_exempt_artifact_is_invalid_only_in_its_handoff
    asserts both of r02''s envelope errors sit under handoff, and test_the_exempt_artifact_has_a_valid_successor
    asserts r03 validates with zero errors and declares supersedes GUR-PKT-UA-015-015-cavaliers-r02.'
- acceptance_test_index: 3
  result: passed
  evidence: 'The exemption is diagnostic history only and never a queue fallback. It lives entirely in
    tooling/common/tests/test_common_schemas.py; scan_agent_queues.py has no reference to it, and r02
    still produces its gur_invalid_handoff error diagnostic in every scan. Identity, provenance and proposal
    fields are never excused: an error anywhere outside the handoff block fails the guard. No published
    GUR was edited, moved or deleted; r01, r02 and r03 are all on disk at their stable paths.'
