why_this_revision: 'REV-IMP-DEC-2026-0065-r04-r01 returned revision_required on acceptance test 5 alone:
  no validation report existed at build/reports/IMP-DEC-2026-0065-r04.validation.json, so the Reviewer
  could not independently verify the validation evidence that test requires. The defect is the Integrator''s
  and it is wider than one revision. Of the 142 published implementation reports, 123 carry a companion
  checksummed validation report; the nineteen that do not are early 2026-08 reports plus this entire
  lineage and its two Integrator siblings. The previous revision declared no validation_report field
  at all, so what was absent was the declaration as well as the artifact, and this revision publishes
  both. The implementation itself is unchanged: every file the previous revision pinned still hashes
  to the checksum it recorded, and all five acceptance tests were re-run against those bytes rather
  than restated (Ran 42 tests in 1147.029s OK; Ran 20 tests in 158.323s OK; Ran 217 tests in 1586.350s
  OK).'
scope_note: DEC-2026-0065's exact_diff names bundles.py, cli.py, test_bundles.py and test_transaction.py.
  The admission logic was placed in a new admission.py and its focused tests in test_admission.py, a
  deviation first disclosed in r01 and subsequently named by DEC-2026-0069 and DEC-2026-0070 in their
  own exact diffs. This report pins the files that actually carry the behaviour, including test_transaction.py.
