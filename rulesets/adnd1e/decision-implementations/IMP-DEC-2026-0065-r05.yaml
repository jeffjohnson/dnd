acceptance_results:
- acceptance_test_index: 1
  result: passed
  evidence: TestTheAuthorisedException in the test_admission run below (Ran 42 tests in 1147.029s OK).
    The Druid r04 parse failure is admitted only through DEC-2026-0064's exact record, emits one historical_unreadable_review
    naming DEC-2026-0064 and r04, raises no fatal diagnostic, and leaves every unrelated bundle classified
    by its ordinary Review lineage. Against the live corpus the same notice appears alongside two others
    and the queue still offers ordinary work.
- acceptance_test_index: 2
  result: passed
  evidence: 'TestEveryConditionThatDeniesTheException in the same run (Ran 42 tests in 1147.029s OK)
    covers all twelve denials: absent, inactive and re-hashed Decision; missing and altered record;
    each mismatched pinned artifact; a now-parseable r04; a wrong parser fragment; broken r05/r06 links;
    wrong r06 GUP, disposition and handoff; and a changed r01+r06 input set. Each yields review_yaml_unreadable,
    no ready bundles, exit code 2 and no traceback. Field names are fixed per delegation form and a
    self-delegating Decision is refused outright.'
- acceptance_test_index: 3
  result: passed
  evidence: 'TestAnyOtherUnreadableReview in the same run (Ran 42 tests in 1147.029s OK): an approving
    Review and an unrelated packet''s Review are never informational evidence. Queue and integrate both
    return exit code 2, the transaction runner is not called, no Integration or rejection record is
    written, and canonical and registry bytes are unchanged; restoring valid YAML restores ordinary
    behaviour.'
- acceptance_test_index: 4
  result: passed
  evidence: TestOrdinarySemanticsAreUnchanged and the test_bundles run (Ran 20 tests in 158.323s OK)
    cover valid discovery, manifest checks, Review-withdrawal rules, the rejected and integrated buckets,
    direct decision-migration bundles and dry runs. Against the live corpus queue exits 1 on ready work
    rather than 2, with zero discovery diagnostics, zero queue-integrity entries and three informational
    notices. Informational evidence alone neither forces exit 2 nor prevents a transaction.
- acceptance_test_index: 5
  result: passed
  evidence: This revision is the active leaf of the IMP-DEC-2026-0065 lineage the test names. It pins
    this Decision at its current checksum, records focused and full-suite evidence with every command
    naming its working directory (Ran 42 tests in 1147.029s OK; Ran 20 tests in 158.323s OK; Ran 217
    tests in 1586.350s OK), reports all five direct acceptance tests as passed, and is approval-ready.
    It also publishes the companion validation report at build/reports/IMP-DEC-2026-0065-r05.validation.json
    and declares its checksum, so the validation evidence this test requires can be re-derived from
    a durable artifact rather than from the report's own prose.
