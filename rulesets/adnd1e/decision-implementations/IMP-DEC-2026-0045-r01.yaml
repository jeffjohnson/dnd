    `implemented_by` exactly equal the Decision's ready Builder or Integrator handoff. Both version histories
    date the change 2026-08-18.
- acceptance_test_index: 2
  result: passed
  evidence: 'VERIFIED AGAINST THE PUBLISHED FILES, WHICH THE ARCHITECT WROTE. agents/integrator/INSTRUCTIONS.md
    gained ''### Rejection records'' at line 167: an immutable JSON record under rulesets/<ruleset-id>/reports/
    conforming to the rejection schema, declaring status: rejected and recording, for every rejected bundle,
    the exact Approved-bundle, approving Review and reviewed GUP IDs and SHA-256 checksums plus one or
    more machine-readable blocking failures, with an explicit prohibition on inferring or omitting provenance.
    agents/reviewer/INSTRUCTIONS.md gained ''### Integration-rejection remediation'' at line 135, requiring
    an immutable successor Review recording integration_rejection.id, .path and .checksum, which is what
    consumes the REVIEWER-INTEGRATION-REJECTION item. Before this Decision neither file contained the
    word ''rejection'' at all.'
- acceptance_test_index: 3
  result: passed
  evidence: 'IMPLEMENTED AND TESTED. schemas/common/architect-decision.schema.json adds $defs.exactDiffOwner
    (additionalProperties false; path and owner required; owner restricted to the five roles; optional
    integer sequence_step and note) and an allOf branch requiring exact_diff_ownership when decision_authoring_contract_version
    is ''1.1'' and exact_diff is a non-empty object. tooling/common/scan_agent_queues.py adds _exact_diff_ownership_errors,
    _decision_assigned_roles and _sequence_owner_by_step, reading the Decision alone. Positive coverage:
    ExactDiffOwnershipCase.test_a_complete_plan_produces_no_ownership_diagnostic and test_a_complete_plan_is_ordinary_implementation_work.
    Live corpus: test_every_published_decision_satisfies_the_guard walks all 45 published Decisions and
    finds no offender, and all 45 validate against the amended schema. DEC-2026-0045 itself is the worked
    example: it declares version 1.1, lists nine exact_diff paths, and owns all nine.'
- acceptance_test_index: 4
  result: passed
  evidence: 'IMPLEMENTED AND TESTED, ONE NAMED DEFECT PER TEST. ExactDiffOwnershipCase covers missing
    (test_an_unassigned_path_is_diagnostic, the exact DEC-2026-0043 shape), duplicate (test_a_duplicate_entry_is_diagnostic),
    unowned (test_an_entry_without_an_owner_is_diagnostic), unknown-owner (test_an_unknown_owner_is_diagnostic),
    and sequence-mismatched (test_a_sequence_step_owned_by_another_role_is_diagnostic plus test_a_sequence_step_the_sequence_does_not_define_is_diagnostic).
    test_an_owner_the_decision_never_schedules_is_diagnostic covers the ruling''s central case: an owner
    named in the ownership list that no sequence step or follow_up_owners entry schedules. Each emits
    one error diagnostic ''decision_exact_diff_unowned''. Not-approval-ready is proven by test_an_unowned_plan_is_not_ready_implementation_work
    (no Builder item) and test_an_integrator_owned_decision_is_guarded_the_same_way (no Integrator item);
    test_an_unowned_plan_is_reported_blocked_rather_than_dropped fixes that the work surfaces as a blocked
