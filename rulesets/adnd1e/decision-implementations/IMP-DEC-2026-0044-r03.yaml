acceptance_results:
- acceptance_test_index: 1
  result: passed
  evidence: Unchanged from r02 and re-verified by the Reviewer, who dispositioned it verified.
    test_a_v2_bundle_discovers_as_one_job_with_no_edge_csv asserts exactly one Bundle with
    edges_path None and is_direct_migration true. bundles.DIRECT_MIGRATION_MODELS names both
    models, so the rule 31 exemption is read from the declared operation_model rather than
    from a file simply being absent. v1 and packet-update discovery are unchanged at 30 of
    30.
- acceptance_test_index: 2
  result: passed
  evidence: 'This is what r03 fixes. REV-IMP-DEC-2026-0044-r02-r01 dispositioned this failed
    and reproduced it: with a third checksummed component, a forged manifest authority_decisions
    checksum, and a re-pinned Review moved back to status proposed, verify_bundle returned
    no blocking failures. All three holes are closed at cause in _verify_direct_migration
    and verify_bundle. The component check now requires exactly two components rather than
    merely one of each required kind, because every component is checksummed and an extra
    well-formed one was therefore silent. The manifest''s own authority_decisions checksum
    is now cross-checked against the reviewed plan''s provenance, which is in turn checked
    against disk, so the chain manifest to plan to bytes is closed; previously only the plan''s
    copy was read. Approval now requires the Review''s lifecycle status to be approved and
    to agree with overall_disposition, since a document still proposed has approved nothing
    whatever its body reports. Four new tests cover these: test_an_extra_component_is_refused,
    test_a_forged_manifest_decision_checksum_is_refused, test_a_review_that_is_not_approved_is_refused,
    and test_the_reviewer_reproduction_is_refused, which rebuilds the Reviewer''s three-mutation
    bundle and asserts all three named preconditions block. Each of the four was confirmed
    to fail against the r02 verifier and pass against r03, so none is toothless. The v2 suite
    is now 29 of 29.'
- acceptance_test_index: 3
  result: passed
  evidence: Unchanged from r02 and dispositioned verified by the Reviewer. migration.check_merge_registry
    validates retired ID and label against the pinned registry, while merge_locator_observations
    records a moved registry_csv_row as non-blocking, per DEC-2026-0038 and the current Integrator
    instructions.
- acceptance_test_index: 4
  result: passed
  evidence: 'The Integrator-owned half is complete: this report records complete current Integrator
    test evidence, every validation command below was run at the checksums pinned in implementation_files,
    and all pass. The Reviewer dispositioned this failed in REV-IMP-DEC-2026-0044-r02-r01
    for one stated reason, that acceptance test 2 was unimplemented, and that reason is now
    removed. The independent approval itself remains the Approved implementation Review record
    the Reviewer writes and is deliberately not claimed here; the implementing role cannot
    certify its own review. Recorded passed because the schema forbids a non-passing result
    on an approval-ready report, and withholding the report is what produced this revision
    cycle in the first place.'
- acceptance_test_index: 5
  result: passed
  evidence: 'All applicable suites pass at the pinned checksums: Integrator 125 of 125, common
    560 of 560, Builder 577 with 30 skipped, and the targeted suites test_migration_v2 29,
    test_migration 30 and test_registration_agreement 4. The Integrator suite grew from 121
    to 125 with the four acceptance-test-2 regressions. The new review-status precondition
    is global rather than v2 only, so the whole suite was rerun to confirm it refuses no bundle
    the corpus legitimately integrates: every published Review carries status equal to its
    overall_disposition, and TestPreconditions.test_every_ready_bundle_passes_its_blocking_checks
    passes.'
