notes:
- 'No GUP, Review, Approved bundle, canonical file or registry was altered, as DEC-2026-0044
  sequence step 1 requires. r03 changed only tooling/integrator/src/adnd1e_integrator/integrate.py
  and tooling/integrator/tests/test_migration_v2.py; canonical remains at 4224 edges and 1165
  nodes. books/adnd1e/dmg/artifacts/approved remains empty: materializing the v2 bundle is
  step 3 and belongs to the Reviewer.'
- The review-status precondition was added to verify_bundle rather than to the direct-migration
  path, because accepting a Review that is not approved is not a v2-specific defect. It applies
  to every bundle shape and was regression tested across the full suite.
- REV-IMP-DEC-2026-0044-r02-r01 declares handoff.next_role builder while its reason names
  the Decision's Integrator implementation owner, and the queue derives INTEGRATOR-DECISION-IMPLEMENTATION-REVISION.
  DEC-2026-0044 assigns implementation to the Integrator, so this report treats the Integrator
  as owner and flags the field disagreement for the Reviewer rather than repairing an immutable
  artifact.
- 'Exercised on a clone against the current corpus, the v2 merge reduces invariant 3 findings
  by three: dex_reaction_adj, dex_defensive_adj and str_exceptional use prefixes constitution
  3.1 does not approve, and consolidating them into abil_ identities clears them. The applier
  still refuses any batch that raises a finding.'
