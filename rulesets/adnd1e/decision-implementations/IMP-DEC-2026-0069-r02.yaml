why_this_revision: r01's second validation command, PYTHONPATH=tooling/integrator/src python -m adnd1e_integrator.cli
  queue, named neither a working directory nor a suite path, which tooling/common/tests/test_implementation_evidence.py::test_each_command_says_where_it_ran
  rejects on the active leaf. The correct repair is a successor rather than an edit, because r01 is
  immutable once published. Since DEC-2026-0069 is superseded, that successor cannot also restate
  an implementation, so it records only the repository state of the code r01 pinned and terminates
  the lineage. validation here evidences that state; it is not a claim that the superseded Decision
  is implemented, which every not_run acceptance result and the blocked status make explicit.
