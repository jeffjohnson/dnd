acceptance_results:
- acceptance_test_index: 1
  result: passed
  evidence: 'TestTheLiveManifest checks the shipped contracts/ROLE_CONTEXT_MANIFEST.yaml against schemas/common/role-context-manifest.schema.json
    with zero errors; asserts sorted(roles) equals exactly the five role names, so each is declared once;
    and for every role resolves the path set twice, asserting the two runs are equal, the list is already
    sorted, len == len(set) so it is duplicate-free, and non-empty. test_every_resolved_path_is_a_file_inside_the_repository
    asserts each entry is an existing file and no entry escapes the root. Live builder/phb scope resolves
    42 files -> Ran 50 tests in 1.114s OK Re-verified for r2 at the current file checksums: both suites
    pass (common 474, builder 569) and the claim above is unchanged.'
- acceptance_test_index: 2
  result: passed
  evidence: 'test_a_cold_verify_requires_a_reload_and_names_the_paths asserts status reload_required with
    the role''s exact paths emitted; test_recording_then_verifying_is_a_hit asserts the same role, scope,
    root and session then yields cache_hit; test_a_hit_is_repeatable asserts the hit is stable. test_a_hit_does_not_re_emit_stable_context_content
    asserts the hit result carries no stable_authority map and no authority-file content. CLI exit codes
    are covered by test_a_cold_verify_exits_one_and_a_hit_exits_zero: verify 1, record 0, verify 0 ->
    Ran 50 tests OK Re-verified for r2 at the current file checksums: both suites pass (common 474, builder
    569) and the claim above is unchanged.'
- acceptance_test_index: 3
  result: passed
  evidence: 'TestInvalidation covers one case per invalidating change: a changed authority file, a changed
    role instruction, a changed manifest, a changed manifest schema, a newly added authority file, a removed
    authority file, a different session, role, ruleset, book, and repository root. test_every_identity_field_is_actually_compared
    tampers with each of the nine RECEIPT_IDENTITY_FIELDS in turn and asserts each is detected, so a field
    added to a receipt cannot silently stop being checked. TestFailsClosed covers the error cases: a missing
    literal path, an outside-root expansion, an unrecognized role, an unreadable/unparseable manifest,
    a manifest omitting a role, a missing schema, an unresolved placeholder, and a role resolving nothing.
    test_two_patterns_resolving_one_file_is_an_error covers the duplicate resolved path, and test_the_live_manifest_has_no_overlapping_patterns
    confirms governance already conforms across all five roles and phb/dmg/ua/no-book scopes. An unreadable,
    non-mapping, or file-set-less receipt fails closed to a miss and never a hit -> Ran 50 tests OK Re-verified
    for r2 at the current file checksums: both suites pass (common 474, builder 569) and the claim above
    is unchanged.'
- acceptance_test_index: 4
  result: passed
  evidence: 'test_a_receipt_holds_no_authority_file_content asserts none of the fixture files'' contents
    appear in the written receipt; test_a_receipt_holds_exactly_the_declared_fields pins the receipt''s
    key set to the nine identity fields plus stable_authority, so no content field can be added unnoticed;
    test_receipts_are_written_only_under_the_local_cache_directory finds receipts by content rather than
    filename and asserts every one lives under .local/role-context/; test_the_local_cache_directory_is_git_ignored
    asserts ''.local/'' is in .gitignore, so no receipt is committed. test_a_different_session_is_always_a_miss
    covers the cross-session prohibition. The receipt is named in no artifact as provenance: it is written
    only by role_context.py record and read only by role_context.py verify -> Ran 50 tests OK Re-verified
    for r2 at the current file checksums: both suites pass (common 474, builder 569) and the claim above
    is unchanged.'
- acceptance_test_index: 5
  result: passed
  evidence: 'TestTheCacheExcludesLiveState.test_no_excluded_area_may_be_cached adds a file in each of
    ten live areas -- canonical edges_master.csv, registries/nodes.csv, a GUR artifact, a claimed packet,
    a pending escalation, a Decision, an implementation report, an integration manifest, a validation
    report, and a build snapshot -- points a manifest pattern at it, and asserts the verifier refuses
    with ''would cache'' rather than caching it. The guard (EXCLUDED_PREFIXES/SEGMENTS/SUFFIXES) is deliberately
    independent of the manifest so widening one cannot widen the other. test_the_live_manifest_caches_nothing_excluded
    runs the real manifest for all five roles against the real tree and asserts every resolved path is
