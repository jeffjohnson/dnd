acceptance_results:
- acceptance_test_index: 1
  result: passed
  evidence: 'IntegrationRejectionCase.test_a_valid_rejection_suppresses_only_that_bundle asserts a conforming
    record removes that bundle''s INTEGRATOR-APPROVED item and creates one REVIEWER-INTEGRATION-REJECTION
    item; test_a_second_unrejected_bundle_is_untouched asserts an unrelated bundle in the same book still
    routes to the Integrator, so suppression is per bundle and never per book or queue; test_exactly_one_remediation_item_is_created
    asserts exactly one; test_the_remediation_item_names_the_failing_check asserts the item is Reviewer-owned
    and names both the rejection record and the failing check. Live repository: APPROVED-GUP-PKT-PHB-094-100-illusionist-spells-r04-r01
    left the Integrator queue and became a Reviewer remediation item pointing at rulesets/adnd1e/reports/INT-20260815-002.rejected.json,
    after four consecutive rejections of identical bytes. Re-verified for r02 at the current file checksums:
    IntegrationRejectionCase and DirectImplementationOwnerCase run 44 tests OK and the claim above is
    unchanged.'
- acceptance_test_index: 2
  result: passed
  evidence: 'Nine denial tests, each asserting the bundle stays in INTEGRATOR-APPROVED, no remediation
    item is created, and a diagnostic is emitted: a missing checksum, a stale checksum, no blocking_failures,
    a wrong ruleset, a status other than rejected, unreadable JSON, a superseded record, two disagreeing
    live records (integration_rejection_ambiguous), and an unchecksummed record reusing the legacy-authorized
    ID for a different bundle. test_the_legacy_allowance_is_pinned_to_one_record_and_bundle asserts LEGACY_AUTHORIZED_REJECTIONS
    is exactly the one (record, bundle) pair DEC-2026-0043 names, so the allowance cannot spread. A rejection
    naming a superseded or integrated bundle is silent rather than diagnostic (test_a_rejection_of_a_superseded_bundle_is_silent):
    it can suppress nothing either way, and reporting every pre-contract record produced 56 errors that
    buried the 5 live ones. Live repository: INT-20260812-002, INT-20260814-003 and INT-20260817-002 are
    reported as invalid for want of the now-required checksums and suppress nothing. Re-verified for r02
    at the current file checksums: IntegrationRejectionCase and DirectImplementationOwnerCase run 44 tests
    OK and the claim above is unchanged.'
- acceptance_test_index: 3
  result: passed
  evidence: 'test_a_review_successor_recording_the_rejection_consumes_the_item asserts that a Review successor
    carrying integration_rejection.id equal to the record ID removes the remediation item, leaving its
    ordinary handoff to supply downstream work; test_a_successor_naming_another_rejection_does_not_consume_it
    asserts matching is on the exact record ID, so a Review that merely postdates the rejection does not
    discharge it. The bundle then appears as INTEGRATOR-REJECTED informational history rather than ready
    work. Re-verified for r02 at the current file checksums: IntegrationRejectionCase and DirectImplementationOwnerCase
    run 44 tests OK and the claim above is unchanged.'
- acceptance_test_index: 4
  result: passed
  evidence: 'DirectImplementationOwnerCase covers both halves. test_an_integrator_decision_creates_an_integrator_item
    asserts a ready non-migration Decision handing off to Integrator produces exactly one INTEGRATOR-DECISION
    item and no Builder item; test_a_builder_decision_still_creates_a_builder_item asserts the existing
    Builder path is unchanged; test_a_builder_report_for_an_integrator_decision_is_diagnostic and test_an_integrator_report_for_a_builder_decision_is_diagnostic
    assert an owner mismatch emits decision_implementation_invalid naming implemented_by and does NOT
    consume the Decision; test_a_valid_integrator_report_routes_to_reviewer asserts a matching report
    routes to REVIEWER-DECISION-IMPLEMENTATION; test_an_approved_review_consumes_the_decision_and_makes_no_batch
    asserts an Approved implementation Review consumes the Decision and creates no INTEGRATOR-APPROVED
    batch. test_the_owner_set_is_exactly_builder_and_integrator pins the owner set. schemas/common/decision-implementation.schema.json
    now declares implemented_by as enum [builder, integrator]. Live repository: DEC-2026-0044 routes to
    INTEGRATOR-DECISION. Re-verified for r02 at the current file checksums: IntegrationRejectionCase and
    DirectImplementationOwnerCase run 44 tests OK and the claim above is unchanged.'
- acceptance_test_index: 5
  result: failed
  evidence: 'FAILS, AND NOT FOR WANT OF BUILDER WORK. REV-IMP-DEC-2026-0043-r01-r03 verified acceptance
    tests 1 through 4 and failed this one: DEC-2026-0043.exact_diff requires Architect-owned updates to
    contracts/WORK_QUEUES.md, contracts/ARTIFACT_LIFECYCLE.md, agents/integrator/INSTRUCTIONS.md and agents/reviewer/INSTRUCTIONS.md.
    Live check: WORK_QUEUES.md is still Version 1.11 against the 1.12 this Decision names, ARTIFACT_LIFECYCLE.md
    still 1.9 against 1.10, and none of the four files contains any mention of the rejection lifecycle.
    The Builder cannot supply them: REPOSITORY_STRUCTURE places contracts/ under universal inter-agent
    governance and agents/architect/INSTRUCTIONS.md makes versioning a changed contract an Architect duty.
    Nor is anyone else assigned -- this Decision''s sequence names owners builder, reviewer, reviewer
    and its follow_up_owners lists builder, reviewer and integrator, so no step and no follow-up entry
    assigns those four files to any role, and the Architect queue is empty. Raised as a governance gap
    in the escalation filed alongside this report. Code-side validation is unaffected: 44 targeted tests
    pass and the builder suite is green. approval_ready is false rather than misreporting coverage.'
