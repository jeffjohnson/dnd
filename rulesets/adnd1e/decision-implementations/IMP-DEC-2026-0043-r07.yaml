    that manifest during this session, the four packaging-corrected bundles are now Integrator-ready,
    and the precondition failure r06 named has cleared. What remains is narrower: the Integrator suite
    runs 126 tests with 0 failures and 2 errors, both in test_transaction.TestIntegrationIsAtomic, both
    raising IntegrationError "APPROVED-GUP-PKT-PHB-064-079-magic-user-spells-1-4-r08-r03: target_id=spell_continual_light
    is not a canonical node and is not registered by this batch (invariant 1)". That is a fixture artifact
    rather than a defect in the bundle. Checked from the Builder side: the row naming spell_continual_light
    sits in the GUP''s edges.csv, not its pending.csv or blocked.csv, so it is an ordinary approved row
    and not something the packaging concatenation introduced; and spell_continual_light is canonical in
    the live registry, registered by INT-20260803-001 under the cleric-spells batch. The tests run against
    clone_repo, which rewinds canonical past the ready bundles, and that rewind is stripping a registration
    a historical integrated batch legitimately landed -- the exact failure the clone''s own comment says
    copying rulesets/adnd1e/manifests was added to prevent. Every file this Decision requires is listed
    above at its current checksum, the common suite is 560 OK, the builder suite is 602 OK with 38 skipped,
    and 44 targeted tests pass. The Builder-owned half remains independently verified by REV-IMP-DEC-2026-0043-r01-r03.
