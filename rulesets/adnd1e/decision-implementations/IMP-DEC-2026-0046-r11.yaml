  evidence: 'IMPLEMENTED AND TESTED, AND CONFIRMED ON THE LIVE CORPUS. _implementation_report_errors now
    takes a keyword-only drift_sink; implementation-file staleness and absence are collected there while
    every other report defect stays in the returned error list. The scanner resolves and validates the
    candidate implementation Review before classifying that drift, and emits the informational diagnostic
    ''implementation_files_drifted_after_approval'' when an exact valid Approved Review already consumed
    the report. Live effect: the five lineages DEC-2026-0046 names -- IMP-DEC-2026-0018-r15, -0022-r13,
    -0023-r15, -0028-r09 and -0039-r04 -- previously produced five ''decision_implementation_invalid''
    errors and five ready BUILDER-DECISION items; they now produce five info diagnostics and no Builder
    work, and their reports and Reviews are byte-unchanged. Covered by PostApprovalFileDriftCase.test_post_approval_drift_does_not_reopen_the_decision,
    test_post_approval_drift_is_informational_not_an_error, test_the_observation_names_the_file_the_report_and_the_review,
    test_a_deleted_implementation_file_is_also_only_informational and test_the_report_and_review_remain_untouched.
