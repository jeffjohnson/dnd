live_queue_observation:
  command: '[cwd tooling/integrator] PYTHONPATH=src python -m adnd1e_integrator.cli --repo-root=../..
    --books=phb queue'
  exit_code: 1
  meaning_of_exit_1: Ready work exists. It is not a failure code and this is not a unittest command,
    so it is recorded here as an observation rather than in validation.commands, where exit code,
    result and unittest verdict must agree.
  reading: 'ready_count 1 (APPROVED-GUP-PKT-PHB-117-119-bards-r04-r04), queue_integrity [], diagnostics
    [], three informational notices: two historical_unreadable_review (Druid r01-r04, Bards r04-r02)
    and one historical_unadmitted_bundle (Bards r04-r02). Exit 1 means ready work, not failure. OK'
additional_repair_disclosed: While verifying acceptance test 4 the Integrator found that ready_queue
  computed leaf-ness for GUPs and for Review lineages but never for Approved bundles themselves, so
  both APPROVED-GUP-PKT-PHB-117-119-bards-r04-r03 and its declared successor r04 were offered as ready
  at once. A repackaging successor keeps its predecessor's GUP and leaves its Review lineage approved,
  so neither existing check retires it; every earlier case was masked because a rejection record happened
  to cover the predecessor. WORK_QUEUES core rules 3, 4 and 6 make leaf-ness a property of the artifact
  kind, and the common queue scanner already read it that way and offered only r04. bundles.py gains
  superseded_bundle_ids, which reads each approved manifest's own supersedes declaration. This is
  tooling conformance with a standing contract rule rather than a new rule, it is disclosed here rather
  than folded silently into the Decision's diff, and it is what makes DEC-2026-0071 acceptance test
  4 -- r04 evaluated as the ordinary current bundle leaf -- true of this tooling.
sequencing_note: 'DEC-2026-0070 permits ordinary bundle verification and transaction handling only
  after an approved implementation Review consumes this report, and the Bards r04 bundle is discoverable
  only because of the discovery change reported here. No canonical or registry byte has therefore
  been written: canonical remains at 5046 edges, 1392 nodes, 1407 registry rows and 1691 findings.
  One read-only dry run was executed against r04 to obtain the verification evidence cited in acceptance
  test 1; it wrote nothing and took no snapshot, and it is disclosed here rather than left implicit.
  The transaction DEC-2026-0071 assigns the Integrator will be run after this report is reviewed.'
