acceptance_results:
- acceptance_test_index: 1
  result: passed
  evidence: 'TestTheDirectPredecessorException in the 42-test test_admission run and TestTheHistoricalBundleIsWithheld
    in the 20-test test_bundles run. With DEC-2026-0068 active at its pinned checksum the r02 Review
    is validated as historical unreadable evidence with no content read, exactly one historical_unreadable_review
    notice names it, there is no fatal admission diagnostic, and the Bards bundle is offered through
    ordinary verification. One deviation from this test''s wording, disclosed rather than glossed:
    the bundle offered is APPROVED-GUP-PKT-PHB-117-119-bards-r04-r04, not r03. After this Decision
    was written the Integrator escalated two blocking verification failures against r03, and DEC-2026-0071
    authorised the Reviewer to publish exactly one r04 Review and bundle superseding r03. r03 is still
    discovered through its declared component and is now classified superseded; r04 passes ordinary
    verification, and a dry run reports 57 edges, 11 created identities and findings unchanged at
    1691. The mechanism this test specifies is what was verified; only the revision of its subject
    moved.'
- acceptance_test_index: 2
  result: passed
  evidence: TestManifestComponentAuthority in the 20-test test_bundles run. The r03 manifest resolves
    its sole edges component from the declared r01 path and checksum despite the differing filename
    stem; adding, removing and renaming a colocated r03-stem CSV leaves the result identical; and
    a missing, outside-root, wrong-kind or checksum-invalid declared component is diagnostic and yields
    no ready Bards bundle. Manifestless legacy bundles still infer by stem and direct decision-migration
    manifests still carry no edge CSV, with a colocated CSV reported as a diagnostic.
- acceptance_test_index: 3
  result: passed
  evidence: TestTheExclusionIsBoundedByItsRecord in the 42-test run, plus the live corpus. The exact
    r02 bundle is reported only as historical_unadmitted_bundle authorised by DEC-2026-0068 and appears
    in no ready, rejected, integrated or superseded bucket. Altering its ID or checksum in the record,
    giving it a readable approving Review, or making the unreadable Review parse again each removes
    the exclusion and restores the fail-closed review_yaml_unreadable diagnostic with exit code 2
    and no traceback -- never admitting r02. The denial assertions check the ready, integrated and
    rejected buckets and the informational notice; superseded is deliberately excluded there, because
    r03's own manifest names r02 in supersedes and that is a readable fact about a readable file which
    holds whether or not the record validates. Under a valid record r02 is withheld before any bucketing,
    so this test's no-superseded requirement holds and is asserted directly.
- acceptance_test_index: 4
  result: passed
  evidence: The full 217-test Integrator suite passes. The Druid two-hop admission, every other unreadable
    Review, legacy manifestless inference, decision-migration no-edge-CSV discovery, ordinary rejection
    handling, named-bundle dry runs and rollback behaviour are unchanged. test_the_druid_form_still_works_alongside_it
    suspends DEC-2026-0068 and asserts the Druid notice survives while the Bards exception is denied,
    and the Druid denial suite asserts the converse, so neither exception absorbs the other. No delegation
    may name a field of its own choosing and a self-delegating Decision is refused.
- acceptance_test_index: 5
  result: passed
  evidence: 'contracts/WORK_QUEUES.md is Version 1.26, above the required 1.25, and retains all three
    rules, each re-read in the file at its current checksum. The anchor list below reproduces this
    Decision''s three authorized anchors, and one of them differs from the contract by one detail
    worth recording rather than smoothing over: the third anchor is written without backticks, while
    the contract writes the same sentence as "may name one `historical_bundle` whose approving Review
    is the record''s exact unreadable Review". The difference is markdown code formatting on a single
    token; the rule itself is present, complete and unchanged in substance, and a Reviewer can confirm
    that by searching the contract for the sentence as quoted here.'
