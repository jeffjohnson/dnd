handoff:
  next_role: reviewer
  readiness: ready
  reason: 'The scanner validates migration_lineage_retirements on active approved Decisions and classifies
    only an exact, checksum-matching current leaf as informational history. Both reported stale migrations
    are now history rather than false Builder reissue work, each recorded with the retiring Decision,
    disposition, and reason so the repository can show why the signal stopped. Validation is deliberately
    strict: every named artifact must exist and still hash to the recorded checksum, an unapproved or
    superseded Decision retires nothing, and any failure emits migration_retirement_record_invalid while
    leaving the ordinary reissue error standing. Retirement is the one classification that makes work
    disappear, so a record that no longer describes the corpus must never be the thing that cancels it.
    This implementation touches tooling/common only; the tooling/builder suite is red on 5 pre-existing
    DEC-2026-0014 legacy-endpoint debt failures, unrelated to and untouched by this Decision.'
  blocking_ids: []
