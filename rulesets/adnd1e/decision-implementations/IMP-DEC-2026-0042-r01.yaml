- acceptance_test_index: 1
  result: passed
  evidence: 'rulesets/adnd1e/governance/constitution.md declares ''**Version 1.8.**'' and its section
    3.1 prefix table carries three distinct rows: `weapon_` for a mundane weapon, weapon category or source-named
    weapon family (weapon_lance); `wpn_` for a weapon property or statistic (wpn_speed_factor); `item_`
    for a magic item or item class (item_ring). rulesets/adnd1e/ruleset.yaml declares constitution_version:
    "1.8". test_version_matches_ruleset_yaml pins the manifest to the compiler constant and test_1_8_separates_the_mundane_weapon_from_its_statistics
    asserts the three namespaces stay distinct.'
- acceptance_test_index: 2
  result: passed
  evidence: adnd1e_builder.vocab declares CONSTITUTION_VERSION '1.8' and accepts '1.8' in ACCEPTED_GUR_CONSTITUTION_VERSIONS.
    registry.prefix_of resolves weapon_lance to 'weapon_' and abil_dex_reaction_adjustment and abil_str_exceptional
    to 'abil_', all accepted, while the bare legacy forms dex_reaction_adj and str_exceptional resolve
    to None and are refused. ABILITY_ABBREVIATIONS is exactly {cha, con, dex, int, str, wis}. test_the_prefix_set_is_exactly_the_constitution_table
    derives the expected prefixes by parsing the constitution's own 3.1 table rather than pinning a count,
    so the vocabulary cannot drift from governance.
