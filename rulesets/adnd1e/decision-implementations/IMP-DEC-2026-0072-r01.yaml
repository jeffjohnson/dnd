handoff:
  next_role: reviewer
  readiness: ready
  reason: 'Both halves are implemented and the applicable suite is green at 1078 tests, the first time
    it has been since the malformed artifacts began appearing.


    The record is the third exception across two shapes, and it is kept separate from DEC-2026-0068''s
    rather than generalised because the predicates differ in substance. What makes a packet Review''s
    successor trustworthy is its bundle and row partition; what makes an implementation Review''s successor
    trustworthy is that it pins the same report and the same Decision its predecessor was published to
    review. A rule loose enough to cover both would check neither, and the two things an unreadable predecessor
    cannot contradict -- which report, which Decision -- are exactly the two the record has to assert.


    The preflight is the part that matters beyond this Decision. Six malformed artifacts reached durable
    publication in three days and each needed its own checksummed exception, because a published artifact
    cannot be edited or withdrawn. All six failed the same way: hand-assembled text where a `: ` inside
    a value or a line of continuation prose silently changes the document''s shape. Checking the staged
    bytes costs milliseconds; publishing them has cost three Architect Decisions. Both files that forced
    DEC-2026-0068 and DEC-2026-0072 are used as fixtures here and both would have been refused.


    Two scope notes. The command is target-only by construction and by test: a case wraps Path.read_text
    and asserts nothing outside the staged file and its named schema is opened, because a preflight that
    reads the repository would make every publication depend on the repository being healthy -- the coupling
    that turned one bad Review into five broken suites last week. And it refuses to guess a schema from
    a filename; the caller names it. Role instructions and both contracts are Architect-owned at step
    1 and I did not touch them; acceptance test 5 verifies their versions rather than setting them.'
  blocking_ids: []
