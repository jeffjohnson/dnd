defects_for_the_architect:
- id: empty-retired-role-directory-remains
  detail: >-
    agents/dispatcher/ still exists as an empty directory after
    agents/dispatcher/INSTRUCTIONS.md was deleted. Git does not track empty
    directories, so it appears in neither git status nor any diff, and the
    acceptance criterion is satisfied because the definition *file* is absent --
    the test asserts exactly that. Reported rather than removed: the path is
    Architect-owned under the Decision's exact_diff_ownership, and a Builder
    tidying another role's tree is how ownership boundaries erode. Purely
    cosmetic.
- id: source-markdown-1-7-has-again-stale-the-dec-2026-0080-report
  detail: >-
    contracts/SOURCE_MARKDOWN.md moved to 1.7 and now hashes to
    sha256:761a8142c0f887171397db205384585ddbaba80c137d93ff1aa9dd505eab6732, so
    IMP-DEC-2026-0080-r03 records a stale checksum and the scanner has returned
    DEC-2026-0080 to the Builder queue. DEC-2026-0082's coordination_constraints
    anticipate exactly this and direct Builder to refresh that report's evidence
    after all relevant governance edits, explicitly not as an acceptance gate
    for this work. It is therefore listed as the next Builder job rather than
    folded into this report. This is the third time that lineage has been
    overtaken by an edit to a contract it pins but does not own; if the
    governance edits are now settled a single refresh should hold, and if more
    are expected it may be worth the Architect deciding whether the report
    should pin the contract at all given minimum_version already bounds it.
