test_coverage_note:
  why: >-
    The focused role-context suite goes from 123 tests to 80, which looks like
    lost coverage and is not. DEC-2026-0081 had added 73 tests asserting an
    active sixth role; those assertions tested a role governance has since
    withdrawn, so they are deleted rather than adjusted -- keeping them would
    mean maintaining proof of something that must not work.
  five_role_coverage_retained: >-
    All 50 pre-existing five-role tests remain, with their classes and counts
    unchanged: TestCli 4, TestColdAndWarm 4, TestFailsClosed 9, TestInvalidation
    15, TestPathSetIsDeterministic 6, TestReceiptContent 4,
    TestTheCacheExcludesLiveState 3, TestTheLiveManifest 5. The one edit inside
    them is TestCli.test_an_unknown_role_is_rejected, which still asserts exit 2
    but now as a return value rather than an argparse SystemExit, because the
    role check moved off argparse `choices` so a retired role can name the
    Decision that retired it.
  added: >-
    30 new tests replace the 73 removed: manifest-language parsing at both 1.0
    and 1.1, the retirement refusals, five-role behaviour pinned explicitly
    against regression, both registered rulesets resolving, and receipt
    invalidation across the manifest upgrade. The relay adds 44 more in a new
    file, so the common suite gains net coverage of the behaviour that is
    actually in force.
  legacy_parsing_retained_as_history: >-
    Manifest language 1.1 still parses. TestManifestVersionsAndInheritance
    asserts a 1.1 manifest loads, that a trimmed 1.1 manifest without the
    retired entry also loads, and that a malformed historical entry is still an
    error -- a manifest is well formed or it is not, and exempting one key would
    weaken the check for every other. Parsing grants nothing: resolving the
    retired role from a 1.1 manifest still raises with the Decision named.
implementation_notes:
- subject: why the relay runs outside the sender's turn
  detail: >-
    Herdr will prompt an agent that is still working and does not correlate a
    wait to a turn, so sending the prompt as the sender's last tool call is not
    serialization -- the sender is by definition still running when it sends.
    Scheduling therefore returns immediately with a queued record, the sender
    ends its turn, and a detached process waits for the sender to settle before
    submitting. This is the single design constraint the whole script is shaped
    around.
- subject: refusal codes are distinguishable
  detail: >-
    Exit 1 means an expected not-yet (a peer is working); exit 2 means the
    request is invalid or a binding failed closed and nothing was sent; exit 3
    means the outcome is unknown and a human must reconcile before any resend.
    Collapsing 3 into 2 would invite an automatic retry of a message that may
    already have been delivered.
- subject: two PowerShell hazards the tests caught
  detail: >-
    PowerShell unrolls a single-element collection on return, so a validation
    result of exactly one problem arrived as a bare string and `.Count` threw
    under StrictMode; the function now returns an explicit array. And `$Args` is
    an automatic variable that cannot be used as a parameter name, which broke
    the fake endpoint until it was renamed. Both were found by the suite rather
    than by reading.
- subject: the fake endpoint
  detail: >-
    Real herdr is never called by the tests. A stub driven by a JSON scenario
    serves a sequence of `agent list` frames and a configurable `agent prompt`
    outcome, and logs every invocation. That makes the races deterministic and
    means a passing run has provably sent nothing to any real agent.
