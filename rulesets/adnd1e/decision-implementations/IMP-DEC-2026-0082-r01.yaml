- acceptance_test_index: 2
  result: passed
  evidence: >-
    Five-role operation. TestTheLiveManifest.test_the_manifest_validates_against_its_schema
    validates the live manifest against its schema with jsonschema and asserts
    no errors; TestTheRetiredRoleIsGone.test_the_live_manifest_declares_exactly_the_five_active_roles
    asserts schema_version 1.0, cache_format_version 1, exactly the five role
    keys, and no dispatcher key. Every pre-existing five-role guarantee is
    retained and still tested: scoped verification, bounded current inputs,
    exact checksum invalidation (fifteen TestInvalidation cases), session
    isolation, cache-hit behaviour, and format-1 receipts.
    TestWorkerBehaviourIsUnchanged recomputes the scope-key material and receipt
    filename by hand for every worker role with and without a book and asserts
    they match, and TestBothRegisteredRulesetsResolve exercises adnd1e and
    basicdnd live. Requests for the retired role fail without writes:
    TestTheRetiredRoleIsGone.test_every_entry_point_refuses_it_and_writes_nothing
    covers validate_scope, resolve_paths, receipt_path, build_receipt, verify
    and record, and TestTheRetiredRoleCliIsRefused asserts exit 2 with an empty
    receipt directory for both CLI commands and that the refusal says "retired
    by DEC-2026-0082" rather than "unrecognized role" -- the distinction matters
    because the second reads like a typo and sends an operator looking for a
    spelling mistake instead of the ruling. The obsolete live six-role tests no
    longer gate work because they are deleted, not skipped or weakened. No
    published Decision or report was rewritten: DEC-2026-0081 and
    IMP-DEC-2026-0081-r01 are untouched on disk. Those unit tests ran: Ran 80
    tests in 1.417s OK.
- acceptance_test_index: 3
  result: passed
  evidence: >-
    Request validation, in TestRequestValidation (15 cases). A complete request
    validates; each of the six required top-level fields is refused when absent,
    by name; an empty prompt is refused because there is nothing to deliver; a
    request_id that could escape its store ("../escape", "a/b", "with space",
    "") is refused, since the ID becomes a filename under .local/herdr/.
    Addressing the retired role is refused by its own message and explicitly not
    as an unknown name; an invalid role, a missing recipient pane, and a handoff
    addressed to the sender's own role are each refused. Paths are bounded to
    the repository root: an input outside it and a missing prerequisite are
    refused, and a stale input checksum is refused with the declared and actual
    digests, because a stale checksum means the worker measured a different file
    than the recipient would open. A correct checksum passes. An unreadable or
    absent request file is refused at load. -ValidateOnly launches nothing:
    test_validate_only_launches_nothing_and_writes_nothing asserts the fake
    endpoint recorded zero calls, no state record exists, and no lock file was
    created. Nothing in the relay touches a credential, answers a dialog, or
    creates an agent -- it calls exactly two herdr subcommands, `agent list` and
    `agent prompt`, which the fake records for inspection. Those unit tests ran:
    Ran 44 tests in 48.321s OK.
- acceptance_test_index: 4
  result: passed
  evidence: >-
    Serialization, in TestSenderSerialization, TestRecipientIdentity and
    TestTheGlobalLock. With a working sender no recipient is prompted:
    test_a_working_sender_prompts_nobody asserts exit 1, an empty prompt log and
    a refused state. The fake endpoint serves a sequence of frames, so "the
    world changed between polls" is a fact the test states rather than a timing
    accident: test_delivery_happens_once_the_sender_settles walks working ->
    working -> idle and asserts exactly one prompt. Every bound repository agent
    must be settled, not just the sender --
    test_an_unexpected_third_agent_blocks_delivery introduces a manually
    launched analyst and asserts nothing is sent, while
    test_an_agent_in_another_repository_does_not_block confirms the scope is per
    repository rather than per herdr server. The recipient is re-resolved
    immediately before delivery and compared with what the worker addressed: a
    wrong provider, a changed native session, and a vanished pane each fail
    closed with no prompt. The lock is one exclusive repository-wide file:
    a held lock refuses a second relay, and it is released after both a
    successful delivery and a refusal so a refusal cannot strand it. Scheduling
    returns promptly with a request ID and queued state and prompts nobody
    itself, which is the whole point -- the sender is still running when it
    schedules. Those unit tests ran: Ran 44 tests in 48.321s OK.
- acceptance_test_index: 5
  result: passed
  evidence: >-
    Nothing resubmits work, in TestDuplicateAndUncertainDelivery. A duplicate
    request ID cannot schedule from any prior state -- queued, submitting,
    acknowledged, settled or uncertain -- each asserted as its own subtest, so a
    settled request cannot be re-run into a second delivery. A second
    outstanding request cannot schedule while one is in flight, and a settled
    earlier request correctly does not block a new one. A failing prompt and a
    herdr error response both produce `uncertain`, not `failed`: the submission
    may have landed, and only a human may decide it did not. An uncertain
    request cannot be re-run. `submitting` is written before the prompt is sent,
    so a process that dies mid-send leaves evidence that a send may have
    occurred; losing that ordering is exactly what turns a crash into a
    duplicate assignment. An old timestamp never authorizes takeover:
    test_a_held_lock_is_never_stolen_by_age backdates a lock by a day and
    asserts it survives and the relay refuses, because a stale-looking lock may
    belong to a live process whose recipient is mid-turn. Waits are finite by
    construction: -TimeoutMs is a mandatory parameter with
    [ValidateRange(1000, 3600000)], and
    test_a_timeout_outside_the_bounded_range_is_rejected asserts 0, 500 and
    3600001 are all refused, so there is no unbounded relay holding the global
    lock. Those unit tests ran: Ran 44 tests in 48.321s OK.
- acceptance_test_index: 6
  result: passed
  evidence: >-
    The relay transports without deciding, in
    TestTheRelayTransportsWithoutDeciding. Its priority fixture is the contract's
    own example shape: a blocking escalation at priority 1, a GUR that waits on
    that ruling at priority 2 marked blocked, and an independently ready GUR at
    priority 3 marked ready.
    test_the_ordered_list_is_carried_verbatim asserts the list survives the
    relay unchanged, that the blocking ESC precedes its dependent, and that the
    independent item is still ready -- the mere existence of an ESC does not
    block unrelated work. The relay reorders nothing and invents no urgency; it
    has no code path that reads priority at all. The prompt is delivered exactly
    as written. No artifact is consumed or modified:
    test_no_artifact_is_written_or_consumed compares every input byte before and
    after a delivery, and
    test_relay_records_live_only_under_the_ignored_local_directory asserts every
    file the relay wrote is under .local/. A reload-only request carries an
    empty ordered_next_steps and a prompt that authorizes no processing, and
    validates as such. Those unit tests ran: Ran 44 tests in 48.321s OK.
