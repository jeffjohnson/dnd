What exact immutable-lineage treatment permits a valid Bards packaging-only
Review successor and Approved manifest to replace the rejected r01 bundle when
the direct r02 Review successor is YAML-unreadable, while leaving the reviewed
GUP, source judgments, node decisions, rejected bundle, and its component
