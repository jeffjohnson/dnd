recommended_resolution: >-
Issue a bounded Decision preserving r02 byte-for-byte as unreadable history,
authorizing only an exact r03 successor that carries the existing 57-row
component and declared 29/28 operation index, and permitting queue traversal
to ignore r02 content only after checksum and parser-failure verification. Do
not alter the GUP, source interpretations, node identities, rejected bundle,
or canonical/registry state; do not create a general malformed-Review exemption.
