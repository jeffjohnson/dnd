systemic_finding: The repository has treated each unreadable artifact as a novel governance event
  requiring its own record, and has produced high-quality rulings each time. What none of those
  rulings addresses is that the defect has a single mechanical cause that occurs before publication.
  Three instances now share it, in three different lineages, authored by the same role. The admission
  machinery is correct and should stay, because a published artifact is immutable and history
  has to remain readable as history; but it is a way of living with the defect rather than a way
  of stopping it.
blocking: true
