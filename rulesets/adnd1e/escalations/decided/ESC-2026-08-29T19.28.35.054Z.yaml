  reason: A third permanently unreadable published Review has appeared, this time in the decision-implementation-review
    lineage where no admission machinery exists. It is named by no Decision, so the common queue
    scanner exits 2 for every role. All three unreadable artifacts share one preventable authoring
    cause, which no role has yet been asked to fix at the point where it happens.
  blocking_ids: []
question: Who repairs REV-IMP-DEC-2026-0065-r01-r01, which is unreadable, superseded, and named
  by no Decision? And should artifact authoring be required to serialise free text through a quoting-safe
  emitter, so that this class of defect stops reaching publication rather than being ruled on
  one file at a time?
the_immediate_blocker:
  finding: 'REV-IMP-DEC-2026-0065-r01-r01 is not parseable YAML. It is the first Review of the
    Integrator''s own DEC-2026-0065 implementation report, was superseded by REV-IMP-DEC-2026-0065-r01-r02,
    and is named by no active Decision. Supersession does not excuse it: tooling/common/tests/test_common_schemas.py
    asserts that an unreadable published artifact needs a ruling rather than a skip, and it is
    the sole remaining failure in that suite.'
  observed: 'yaml_unreadable: mapping values are not allowed here, line 80 column 25. The scanner
    reports it at error severity and exits 2, so every role''s queue currently carries a fatal
    lineage diagnostic.'
  why_the_integrator_does_not_repair_it: 'It is a Reviewer-authored artifact. Repairing it would
    mean rewriting a published upstream artifact, which the Integrator is prohibited from doing,
    and inferring what the Reviewer meant to record, which is interpretation the Integrator may
    not perform. The existing admission machinery does not reach it either: DEC-2026-0064 and
    DEC-2026-0068 pin specific packet Reviews, and neither names this file or this lineage.'
  evidence:
    id: REV-IMP-DEC-2026-0065-r01-r01
    path: rulesets/adnd1e/decision-implementation-reviews/REV-IMP-DEC-2026-0065-r01-r01.yaml
    checksum: sha256:ad2503d214f53963af42845b5914be2157e015f275d6005e36d56bee66806cda
the_common_cause:
  finding: 'All three permanently unreadable Reviews fail for the same reason: free-text prose
    was emitted as an unquoted YAML scalar. Two contain a colon-space inside the text, which YAML
    reads as a nested mapping key. The third continues prose onto later lines without a block
    scalar indicator, so a prose line is scanned as a key. None is a corrupted byte, a truncated
    write, or an encoding fault. Each would have been prevented by serialising through an emitter
    that quotes automatically, or by parsing the file once before publishing it.'
  instances:
