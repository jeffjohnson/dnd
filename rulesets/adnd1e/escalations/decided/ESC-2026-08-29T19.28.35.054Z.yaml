  cost_so_far: 'Two of the three have each required a full Architect Decision to admit as historical
    evidence, plus the Integrator admission subsystem that validates those records: DEC-2026-0064
    and DEC-2026-0068, with DEC-2026-0065, DEC-2026-0069, DEC-2026-0070 and part of DEC-2026-0071
    following from them. The third has no ruling yet. The cost per instance is roughly one Decision,
    one implementation report, one independent Review and one Integrator escalation, and it recurs
    because nothing prevents the next one.'
recommendation: The Integrator recommends prevention at the authoring step rather than a fourth
  admission record. Two options, and the choice is the Architect's. First, require every role
  that publishes a YAML artifact to emit it through a quoting-safe serialiser rather than by assembling
  text, which removes the cause entirely. Second, require a parse-and-schema check of the exact
  bytes before publication, which catches the cause without constraining how artifacts are written.
  The second is cheaper to adopt because the check already exists in tooling/common/tests/test_common_schemas.py
  and only needs to run before publication rather than after. Neither option asks anyone to modify
  an artifact already published.
what_is_not_in_question:
- The three existing rulings. DEC-2026-0064 and DEC-2026-0068 remain valid and every artifact
  they pin was re-verified byte-for-byte as part of this session's work.
- Canonical state, unchanged at 5046 edges, 1392 nodes, 1407 registry rows and 1691 findings.
  No transaction was attempted and no snapshot taken.
- The Bards r04 bundle, which is ready and verifies cleanly. It is held only until an approved
  Review consumes IMP-DEC-2026-0070-r01, as that Decision requires.
