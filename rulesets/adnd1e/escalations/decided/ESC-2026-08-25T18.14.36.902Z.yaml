resolution:
  decision_id: DEC-2026-0062
  decision_path: rulesets/adnd1e/escalations/decisions/DEC-2026-0062.yaml
  outcome: >-
    Review-contract 1.2 makes row-local exact_corrections the sole executable
    correction form and requires fail-fast alias detection. The illusionist
    repair proceeds through a normal r07-r03 Review successor and r08 GUP;
    possible legacy canonical discrepancies require scoped Reviewer evidence
    and later Decisions, never automatic replay.
