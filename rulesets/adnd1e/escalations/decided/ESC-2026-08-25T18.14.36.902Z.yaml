options_considered:
  - >-
    Hand-edit the three fields into a compiled r08. Rejected: the GUP is
    compiler output, and writing values straight into it bypasses every
    validator the compile exists to run. It is also how the 38 dropped
    corrections appear to have been partly papered over already -- the two
    canonical aspects above changed without matching what any Review asked for.
  - >-
    Teach the compiler to read `corrected_fields` so this one revision proceeds.
    Rejected as a Builder action: three unread spellings exist, adding a
    diagnostic for them would turn 44 published rows red at once, and some of
    those rows are already in integrated canonical data. The blast radius makes
    this a governance decision rather than a tooling tidy-up.
  - >-
    Ask the Reviewer for a successor Review that states the corrections under
    `exact_corrections` and names r05-r05 as the inherited source. This unblocks
    the illusionist packet but leaves the silent-drop defect and the 38 dropped
    corrections in place.
  - >-
    Fix the format question and the guard together, and assess the historical
    rows separately.

recommended_resolution: >-
  Adopt the fourth option. Name `exact_corrections` normative and have the
  Builder reject, not absorb, an `approved_with_revision` row whose correction
  block is absent or written under any other key -- the loader already refuses
  unread `*_decisions` keys for exactly this reason, and a row-level correction
  deserves the same treatment. The error should name the key it found, so a
  Reviewer sees `exact_correction` against `exact_corrections` immediately; that
  near-miss accounts for 37 of the 44 rows.

  Sequence it so the guard does not strand the repository: the Reviewer restates
  the outstanding corrections in the readable key first, and the guard lands
  with or after that, since 44 rows would otherwise fail at once.

  The illusionist blocker needs only a successor Review -- corrections under
  `exact_corrections`, and `inherited_edge_decisions.from_review` pointing at
  REV-GUP-PKT-PHB-094-100-illusionist-spells-r05-r05. Builder compiles r08 the
  moment it lands, and the chain and bucket counts are already confirmed.

  The already-integrated rows are the part Builder cannot judge. Whether
  `source of their power` versus `undead power source` is a material difference
  is a Reviewer question about what the source supports, and any canonical
  change is the Integrator's.

