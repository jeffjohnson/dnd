constraint_2_a_decision_cannot_delegate_to_itself:
  finding: The implementation reaches a repair record only through a delegating Decision that
    pins the governing Decision by path and checksum, which is the DEC-2026-0065 to DEC-2026-0064
    relationship. A single Decision cannot both carry the record and delegate to itself, because
    its governing_repair_record.decision_input.checksum would have to be the hash of the file
    containing it.
  consequence: 'An honourable ruling needs either a Decision pair, one carrying the record and
    one delegating to it, or an Architect-authorised direct form in which a Decision''s own repair
    records are validated without a delegation hop. The Integrator will not choose between those:
    it is the admission contract, and DEC-2026-0065 assigned the contract to the Architect.'
  implementation:
    path: tooling/integrator/src/adnd1e_integrator/admission.py
    checksum: sha256:6b8ea4953251e208fd993d1da6c088a4b26c57a6eeaef59929fd3b1688bc74c7
    decision: DEC-2026-0065
    report: IMP-DEC-2026-0065-r01
what_is_working_as_ruled:
- Admission failed closed on an unreadable Review that no Decision admits, exactly as DEC-2026-0065
  requires, on the first live artifact to test it. queue and integrate both return exit code 2
  with no traceback, including when the bundle is named explicitly, and no dry run or transaction
  began.
- 'The one authorised exception is unaffected: the Druid r01-r04 bridge still produces its single
  historical_unreadable_review notice and no fatal diagnostic.'
- INT-20260827-001 stands. The Reviewer consumed it and its packaging finding is not in dispute;
  only the serialization of the successor is.
why_it_matters: The Bards packet cannot reach canonical while the queue fails closed, and the
  queue is correct to fail closed. The Reviewer's question is the right one; these two constraints
  determine whether the answer can be implemented as stated.
affected_canonical_ids: []
migration_impact:
  canonical_data_change: false
  registry_change: false
  note: Canonical stands at 5046 edges, 1392 nodes and 1407 registry rows with 1691 findings.
    Nothing was written, and no snapshot was taken.
systemic_finding: 'This is the second unreadable published Review in eight days, both serialization-only
  and both mid-lineage. The first cost two Decisions and an Integrator implementation to absorb.
  Neither would have been published had Reviews been parsed at publication, and a per-artifact
  parse gate at authoring time would remove the whole class rather than adjudicating each instance.
  The Integrator raises this as a pattern, not as a proposal: which role owns such a gate is a
  governance question.'
governance_impact: DEC-2026-0064 and DEC-2026-0065 together resolved one instance by pinning its
  exact bytes. If each recurrence needs its own Decision pair, the cost grows with the defect
  rate. A durable answer would either prevent unreadable Reviews at publication or define a general,
  checkable repair shape rather than an instance-specific one.
blocking: true
