  defect: 'Serialization only. Line 52 opens a folded block scalar, `completeness_statement: >-`,
    at column 0 and lines 53 onward continue at column 0 as well. A block scalar''s content must
    be indented relative to its key, so the parser reads line 53 as a new mapping key and fails
    with `while scanning a simple key ... could not find expected '':''`. The same construct at
    lines 15 and 64 is nested inside a mapping and is correctly indented, so the defect is one
    unindented block and not a systemic authoring error.'
  parser_error_fragment: could not find expected ':'
  position: line 53, column 1
constraint_1_the_record_shape_assumes_a_two_step_bridge:
  finding: 'DEC-2026-0064''s review_malformed_lineage_repairs record cannot express this lineage
    as written. It pins two distinct links: bridge_review.required_supersedes must be the unreadable_review,
    and active_successor_review.required_supersedes must be the bridge_review. The Druid case
    had three artifacts in that chain, r04 unreadable, r05 bridging, r06 active. The Bards lineage
    has two: r04-r02 is unreadable and r04-r03 supersedes it directly and is itself active and
    approved.'
  consequence: Naming r04-r03 as both bridge_review and active_successor_review would require
    its supersedes field to equal both r04-r02 and itself, which no file can satisfy. A ruling
    that simply directs a second record of the existing shape would therefore be unimplementable
    without either an Architect-authorised change to the record shape, for example an optional
    bridge for single-step lineages, or a Builder change to the common scanner's matching validator.
