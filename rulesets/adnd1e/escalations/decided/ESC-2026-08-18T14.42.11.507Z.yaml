handoff:
  next_role: architect
  readiness: ready
  reason: >-
    Five non-migration Decisions that were implemented, independently Reviewed and
    Approved were re-opened as ready Builder work by a single edit to one shared
    tooling file -- an edit DEC-2026-0045 itself ordered. Nothing about those five
    implementations changed. Their reports pin `tooling/common/scan_agent_queues.py`
    by checksum, so every later edit to that file invalidates every completed report
    that names it. The cycle has no fixed point: each re-issue must pin the newest
    bytes, and the next Decision touching the file voids it again.
  blocking_ids: []

trigger: >-
  ESCALATION_CONTRACT 1.2. The constitution and production data disagree in a way
  that cannot be fixed mechanically: WORK_QUEUES acceptance test 27 requires
  implementation-file checksum drift to restore a Decision as Builder work, and
  that rule cannot distinguish an implementation that has become wrong from one
  whose file a later, unrelated Decision edited.

question: >-
  When a shared implementation file changes after an Approved Decision
  Implementation Review consumed the report that pins it, is the earlier Decision
  genuinely incomplete again, or is that drift informational once an Approved
  Review exists?

what_is_not_in_question:
  - >-
    The checksum requirement itself. Pinning implementation files is what makes a
    report auditable, and drift on an unreviewed or revision-required report is a
    real defect that should restore the Decision as work.
  - >-
    The DEC-2026-0045 ruling or its implementation. The ownership guard is
    published and evidenced in IMP-DEC-2026-0045-r01; this escalation is about a
    side effect of editing the file that Decision required the Builder to edit.
  - >-
    Any of the five affected implementations. Each was independently verified and
    Approved. No new defect has been found in any of them.

