  what_the_scanner_now_reports: >-
    Six `decision_implementation_invalid` error diagnostics and six ready
    BUILDER-DECISION items, for DEC-2026-0018, 0022, 0023, 0028, 0039 and 0043.
    Five of those six were complete before this session began.

  the_revision_numbers_are_the_symptom: >-
    Report revision 15, 13, 15, 9 and 4. Those counts are not fifteen distinct
    defects in one implementation. A large share of them are re-issues whose only
    substantive change was a checksum, because some later Decision edited a file
    the report happened to name.

  why_it_cannot_converge: >-
    A re-issued report must pin the file's current bytes. The next Decision that
    edits that file invalidates the new report exactly as it invalidated the old
    one. Every Decision implemented in shared tooling permanently depends on every
    future Decision implemented in the same file. The work is unbounded and the
    Approved Reviews it consumes are spent on re-verifying evidence nobody
    disputes.

  the_precedent_already_in_the_contract: >-
    WORK_QUEUES 1.10 met the same shape and solved it. An integrated migration's
    canonical baseline necessarily changes, because changing it is the migration's
    purpose, so baseline drift after integration is suppressed rather than
    reported as work. A completed tooling Decision is the same case: changing the
    file was the point, and the change proving the Decision was implemented is
    now the reason it looks unimplemented.

options_considered:
  - option: >-
      Treat implementation-file drift as informational once an Approved
      implementation Review has consumed that exact report leaf
    impact: >-
      Closes the loop with a rule the contract already contains in another form.
      Drift before approval keeps its current strict meaning, so an unreviewed or
      revision-required report still returns to its owner. The Approved Review
      remains the thing that completes a Decision, which WORK_QUEUES rule 13
      already states.
    builder_preference: recommended
  - option: >-
      Record a resolved-commit or content identifier for the state a report was
      approved against, and compare against that rather than current bytes
    impact: >-
      Also correct, and more precise, but it adds provenance the repository does
      not currently carry and would need a migration for existing reports.
    builder_preference: viable_but_heavier
  - option: Keep re-issuing the affected reports each time
    impact: >-
      This is the present behaviour. It has already produced report revisions in
      the double digits, consumes a full independent Review per re-issue, and
      cannot terminate.
    builder_preference: not_recommended
  - option: Stop listing shared tooling files in implementation_files
    impact: >-
      Not offered. It would remove the checksummed coverage that makes a report
      auditable, which is the opposite of what the lifecycle is for.
    builder_preference: refused

