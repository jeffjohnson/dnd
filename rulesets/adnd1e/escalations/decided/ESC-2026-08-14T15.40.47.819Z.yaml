integration_capability_gap:
  current_bundle_discovery: >-
    tooling/integrator/src/adnd1e_integrator/bundles.py refuses every manifest
    without a companion .edges.csv component.
  current_operation_model: >-
    tooling/integrator/src/adnd1e_integrator/operations.py supports additions,
    pending additions, and edge-CSV compare-and-swap updates only. It has no
    representation for registry/node identity replacement or canonical-row
    removal.
  consequence: >-
    An Approved manifest for r04 could not be discovered or applied
    mechanically. Publishing one would violate the Reviewer completion
    condition by leaving the Integrator to invent an execution path.

options_considered:
  - option: Approve r04 with a prose mechanical_application section.
    impact: The current Integrator ignores it and still rejects the bundle; no executable job exists.
  - option: Encode the migration as ordinary edge updates alone.
    impact: Cannot remove row 1502 or retire/replace registry and canonical-node identities.
  - option: Architect defines an approved decision-migration bundle/applier operation set.
    impact: Preserves the exact bounded Decision scope and gives Builder and Integrator a testable, non-interpretive path.

recommended_resolution: >-
  Define and assign the smallest executable decision-migration operation set for
  exact registry addition, identity replacement/retirement, endpoint repoint,
  and exact canonical-row removal. Require Builder to reissue r04 in that
  representation and Integrator to validate it transactionally before a
  subsequent Reviewer approval.
