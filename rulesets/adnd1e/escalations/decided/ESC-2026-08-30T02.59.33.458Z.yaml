question: >-
  Does the exact `integration_rejection_input` record in immutable Bards r03
  consume INT-20260827-001 for queue purposes, or must a new Decision authorize
  a further immutable successor that repeats the same record under the scanner's
  recognized `integration_rejection` key?
evidence:
  review_lineage_observation: >-
    r03 pins INT-20260827-001 by ID, path, and checksum under
    integration_rejection_input and independently verifies the 29 additions /
    28 pending additions partition. r04 directly supersedes r03, preserves the
    exact GUP and 57-row component, restores the eleven proposed-node decisions
    and the Pipes existing-identity reuse, and hands its matching bundle to
    Integrator ready.
  queue_observation: >-
    scan_agent_queues.py's rejection-remediation predicate recognizes only the
    keys integration_rejection, rejection_input, and rejected_by. It therefore
    emits REVIEWER-INTEGRATION-REJECTION for APPROVED-GUP-PKT-PHB-117-119-bards-r04-r01
    despite the checksummed r03 record and DEC-2026-0071's ordinary r04 leaf.
  governing_authority_observation: >-
    DEC-2026-0071 authorizes exactly one r04 Review and matching Approved bundle
    and directs Reviewer to publish only those artifacts. It does not authorize
    an r05 successor or a scanner-contract reinterpretation.
  source_and_graph_scope:
    source_assertion_dispute: none
    registry_or_canonical_change: none
    gup_change: none
options_considered:
  - >-
    Treat integration_rejection_input as an unstated scanner alias. Rejected
    because queue behavior is contract and tool authority, not Reviewer
    interpretation of immutable free-form fields.
  - >-
    Publish r05 with a recognized rejection key. Rejected because DEC-2026-0071
    authorizes exactly one r04 Review and matching bundle, and published r04
    artifacts cannot be altered.
  - >-
    Leave the stale remediation item unresolved. Rejected because it continues
    to misassign completed Bards packaging work to Reviewer.
  - >-
    Issue a narrow Decision that either recognizes the exact r03 record as the
    historical remediation evidence or authorizes one named successor with the
    required key and handoff. Recommended.
recommended_resolution: >-
  Preserve every cited artifact byte-for-byte. Decide the exact checked lineage
  treatment for INT-20260827-001 and, only if a new successor is necessary,
  authorize its precise ID, predecessor, required rejection reference, bundle
  treatment, and handoff. Do not reopen PHB source assertions, node identity,
  GUP content, registry state, or canonical data.
