systemic_finding: 'Separately and mechanically: tooling/common/scan_agent_queues.py emits every
  revision_required Review as state ready routed by handoff.next_role, without consulting handoff.readiness.
  It computes review_blockers and review_unresolved immediately above and uses them only in the
  following architect_escalation branch. Both Reviews here declare readiness blocked with an unresolved
  blocking_id, and the scanner still reports Integrator Ready 2, Blocked 0. WORK_QUEUES states
  that readiness blocked produces blocked state, never ready state, and that ReadyCount counts
  ready jobs only. This misroutes work for any role, not only the Integrator. Queue-scanner implementation
  is Builder-owned per DEC-2026-0012 as recorded in DEC-2026-0018, so the Integrator has not touched
  it.'
governance_impact: 'Same family as DEC-2026-0043 and DEC-2026-0051: an artifact state no role
  can discharge. There the gaps were an Integrator rejection paired with an approved Review, and
  a Review disposition outside every vocabulary. Here it is a completed Integrator obligation
  with no output artifact. A durable fix would require that any handoff assigning a role a non-integration
  check also name the artifact kind that records its outcome.'
blocking: true

