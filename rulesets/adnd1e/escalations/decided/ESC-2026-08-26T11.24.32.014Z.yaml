why_it_cannot_be_recorded:
- schemas/common/ defines exactly two Integrator record kinds. integration-record.schema.json
  describes an integration that happened; none did, because neither Review emits an Approved bundle.
- integration-rejection.schema.json fixes status to the constant rejected and requires a nonempty
  rejected_bundles array. A passing preflight rejects nothing, so using it would enter a false
  statement into immutable history. The Integrator is required to write immutable records, which
  makes publishing a knowingly inaccurate one the worse of the two failures.
- 'Superseding INT-20260819-002 to withdraw its surviving finding was considered and rejected
  for the same reason: the superseding record would itself have to declare status rejected while
  asserting that nothing is rejected. The mechanism exists, since rejected_bundle_ids honours
  supersedes, but the schema can express correction of a rejection, not resolution of one.'
- Withdrawing the rejection would not release the bundles in any case. Both Review lineage leaves
  are revision_required, so withdrawn_review_ids keeps APPROVED-GUP-PKT-PHB-064-079-magic-user-spells-1-4-r08-r03
  and APPROVED-GUP-PKT-PHB-079-094-magic-user-spells-5-9-r07-r02 out of the ready queue on a second,
  independent ground.
why_it_matters: 231 and 203 approved rows stay out of canonical. The mechanical blocker these
  two Reviews named is gone and provably gone, but the proof has nowhere to live, so the Reviewer
  has no repository-visible basis on which to publish the approving successors that would release
  them. Chat history is not provenance.
options_considered:
- Define a third Integrator record kind, a preflight or batch-check report, declaring a status
  other than rejected and naming the inputs, method, key and per-component results. This is the
  option the Integrator would choose, but creating an artifact kind is governance authorship rather
  than integration.
- Rule that a passing Integrator check needs no artifact and is discharged by the Reviewer re-running
  it. Coherent, but it duplicates the work in the role the current handoff routes away from.
- Rule that a Review must not hand the Integrator a check without a bundle, and that this class
  of precondition belongs in the Reviewer's own independent validation. That retires the INTEGRATOR-REVISION
  shape for this case entirely.
what_is_not_in_question:
- The preflight result itself. It is reproducible from the checksummed components and canonical
  named above using the repository's own assertion_key().
- INT-20260825-001. It validated clean, introduced no findings, and the full Integrator suite
  passes 163 of 163 with the common suites at 295 of 295.
- The Reviewer's ownership decision. Which packet owns the eight shared assertions was settled
  in the Reviews and is not reopened here.
