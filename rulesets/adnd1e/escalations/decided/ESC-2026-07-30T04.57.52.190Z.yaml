# 8. -- assertion identity and provenance analysis -----------------------------
identity_analysis:
  implemented_assertion_key:
    fields: [source_id, edge_type, target_id, aspect, condition]
    implementation: tooling/builder/src/adnd1e_builder/vocab.py
    duplicate_detector: tooling/builder/src/adnd1e_builder/duplicates.py
  normalized_key_comparison:
    phb_f33:
      - race_subrace
      - modifies
      - race_infravision
      - vision range
      - halfling subraces
    ua_csv_line_2781:
      - race_subrace
      - modifies
      - race_infravision
      - ranges vary by subrace
      - ""
    exact_duplicate: false
    endpoint_and_type_near_match: true
  reviewer_near_duplicate_finding: >-
    The two rows are distinct assertions under the implemented key, not one
    assertion repeated with different citations. PHB F33 is expressly limited
    to halfling subraces. The UA row is optional, carries a Dwarves-section
    citation, and has no condition as encoded. Status and book are not part of
    the assertion key, so the distinctness rests on the reviewed scope-bearing
    aspect and condition; provenance then controls source identity and
    activation.
  overbreadth_risk: >-
    The UA row's blank condition can be read more broadly than its Dwarves
    section provenance warrants. That legacy ambiguity is not evidence that PHB
    made a universal subrace assertion. It is a reason to source-review UA, not
    a reason to widen or suppress F33.
  supersession_finding: >-
    No supplied evidence says the UA Dwarves assertion replaces the PHB
    Halflings assertion. The mechanics concern different racial scopes, and the
    UA row is optional. OVERRIDES and provenance merge are therefore unsupported.

# 9. -- options and exact impact ----------------------------------------------
options_considered:
  - option: A. Integrate PHB F33 as a distinct core assertion and preserve UA unchanged
    mechanism: >-
      After an Architect decision, Builder emits corrected F33 exactly as
      reviewed. Reviewer explicitly accepts the one semantic-near match as a
      distinct scoped assertion. Integrator later appends the approved PHB row
      and leaves UA CSV line 2781 unchanged and optional.
    for:
      - Preserves both assertions, citations, source identities, and activation statuses.
      - Applies the existing five-field assertion key without creating an exact duplicate.
      - Gives the directly verified, narrower PHB core assertion an independent graph row.
      - Requires no speculative rewrite of UA without a current source packet.
    against:
      - Leaves the legacy UA row's blank-condition overbreadth unresolved.
      - Consumers must continue respecting status filtering and the fixed interim interpretation.
    duplicate_impact:
      exact_duplicates_added: 0
      semantic_near_pairs_added: 1
      reviewer_disposition_required: distinct_assertions
    migration_impact:
      existing_canonical_rows_changed: 0
      existing_canonical_rows_deleted: 0
      new_canonical_edges_after_approval: 1
      canonical_edge_count_before: 3809
      canonical_edge_count_after: 3810
      registry_identity_additions: 0
      derived_degree_changes:
        race_subrace: "12 -> 13"
        race_infravision: "18 -> 19"
      canonical_graph_json_regeneration_required: true
      node_registry_degree_refresh_required: true

  - option: B. Integrate PHB now and separately source-review a later UA scope correction
    mechanism: >-
      Take Option A for F33. Independently create a current source packet for UA
      page 10, then run Analyst, Builder, and Reviewer stages. If the source
      confirms a dwarven-subrace scope, a later approved migration may revise
      the UA aspect and condition while preserving UA p10, Dwarves:, optional,
      and ua-legacy-unspecified provenance.
    for:
      - Resolves PHB without waiting for optional UA repacketization.
      - Provides the strongest eventual scope accuracy for the legacy row.
      - Preserves UA rather than erasing or relabeling it.
    against:
      - Requires a separate UA packet and lifecycle pass.
      - Exact UA replacement fields cannot be approved until its page is supplied and reviewed.
    duplicate_impact:
      immediate: identical to Option A
      possible_after_ua_review: >-
        PHB and UA would remain distinct if their conditions are respectively
        halfling subraces and dwarven subraces.
    migration_impact:
      immediate: identical to Option A
      possible_later_existing_rows_changed: 1
      possible_later_target_csv_line: 2781
      possible_later_row_count_change: 0
      possible_later_degree_change: 0
      later_migration_requires_new_source_evidence: true

  - option: C. Repoint both assertions to race-specific source nodes
    mechanism: >-
      Represent the PHB assertion as race_halfling MODIFIES race_infravision
      with a by-subrace condition, and after UA source review represent its
      assertion as race_dwarf MODIFIES race_infravision.
    for:
      - Makes racial context structural rather than dependent only on condition and section.
