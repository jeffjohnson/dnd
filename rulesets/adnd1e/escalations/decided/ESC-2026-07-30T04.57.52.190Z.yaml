trigger: >-
  Review corrected F33 from a GATES assertion to a MODIFIES assertion about
  halfling-subrace infravision range. The corrected PHB core assertion shares
  endpoints and type with an optional UA legacy assertion at canonical CSV line
  2781. The assertions have different scope and different assertion keys, but
  silently deduplicating, merging, or replacing either row would broaden the PHB
  claim or lose UA provenance. DEC-2026-0005 therefore assigned the complete
  standalone package to Reviewer.

# 2. -- fixed interim policy ---------------------------------------------------
interim_assertion_policy:
  applies_until: ESC-2026-07-30T04.57.52.190Z is decided and implemented through the normal lifecycle
  active_baseline:
    book: PHB
    status: core
    scope: halfling subraces
    assertion: >-
      Halfling subrace modifies infravision range; the source distinguishes
      mixed-blood and pure Stoutish halflings.
    treatment: >-
      This narrower PHB assertion is the active baseline. The pending
      architecture decision does not make the broader optional assertion the
      active rule.
  optional_provenance:
    book: UA
    status: optional
    canonical_csv_line: 2781
    treatment: >-
      Preserve the UA assertion and its UA provenance as optional. It must not
      replace, broaden, or block the PHB core assertion.
  prohibited_actions:
    - Do not overwrite or relabel canonical CSV line 2781 as PHB.
    - Do not broaden the PHB claim from halfling subraces to every subrace.
    - Do not merge PHB and UA into one row that cannot preserve separate activation status.
    - Do not treat the optional UA row as an exact duplicate that suppresses F33.
    - Do not mutate canonical data from this pending escalation package.
  assignment_text_clarification: >-
    DEC-2026-0005's ruling paragraph says "Until ESC-2026-07-30T04.45.31.286Z is decided"
    immediately after assigning both ESC-2026-07-30T04.45.31.286Z and ESC-2026-07-30T04.57.52.190Z. For this
    subrace-infravision package, the controlling interim period is pending the
    ESC-2026-07-30T04.57.52.190Z decision, consistent with audit item 5 and the explicit filing
    directive.

# 3. -- exact question ---------------------------------------------------------
question: >-
  Under the fixed core-before-optional policy above, should corrected PHB F33 be
  integrated as a distinct core assertion while the UA assertion at canonical
  CSV line 2781 remains separately preserved as optional legacy provenance?
  Should any later narrowing of the UA row to dwarven subraces require a current
  UA page-10 source packet and independent review, or does the Architect direct
  a different representation that still preserves both scopes, statuses, and
  provenance without false deduplication?

why_it_needs_governance: >-
  The PHB source and F33 field corrections are deterministic at Review, and the
  implemented assertion key makes F33 a semantic-near rather than exact
  duplicate of the UA row. Governance is nevertheless required because the
  existing canonical assertion is optional legacy data with a blank condition
  and a Dwarves-section citation, while the new assertion is current,
  independently reviewed, core, and halfling-specific. Choosing replacement,
  merge, or a rewrite of the existing row would change canonical provenance or
  activation semantics.

# 4. -- PHB evidence and corrected F33 -----------------------------------------
phb_evidence:
  locus:
    book: PHB
    page: "17"
    section: Halflings
    source_line: 280
  smallest_relevant_excerpt: >-
    "Certain halfling characters have infravision. Those with mixed blood are
    assumed to have infravision which functions up to 30′ distant, while those
    of pure Stoutish blood are able to see heat radiation variation at up to
    60′(normal infravision)."
  reviewer_interpretation: >-
    The passage does not make subrace gate the existence of the infravision
    mechanic as a whole. It states that qualifying halfling ancestry changes
    the range, so MODIFIES with aspect "vision range" is the supported grain.
    The numeric distances remain source detail and do not enter aspect or
    condition.

