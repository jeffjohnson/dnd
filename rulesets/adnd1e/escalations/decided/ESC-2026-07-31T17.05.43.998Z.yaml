question: The operator has ruled that the claimed input packets are authoritative for page numbers without
  exception. Should that be recorded as a contract, and should the canonical rows that provably disagree
  with their packet source be corrected?
operator_ruling:
  statement: For page numbers, the current input packets should be considered canonical. One hundred percent.
  received: 2026-07-31, in session, from the repository operator
  analyst_reading: This settles OBS-44, which the Analyst had left open as an Integrator question. It
    makes marker-derived paging authoritative and makes a disagreeing canonical citation a defect rather
    than an alternative reading. It touches no field other than page.
method:
  how_pages_were_derived: 'Every claimed packet source was parsed with Pandoc 3.10 to JSON AST and walked
    in document order, resolving all three marker placements from contracts/SOURCE_MARKDOWN.md: end of
    a line or heading means that unit starts on the named page, a marker in a table cell means the whole
    row starts there, and a mid-paragraph marker splits the paragraph.'
  a_wrong_first_attempt_and_why_it_is_recorded: A first pass walked only Header and Para blocks. In the
    table-heavy classes packet the page went stale and it reported 117 disagreements, including THE THIEF
    on page 22, which is impossible. That figure is withdrawn. It is recorded because the corrected walker
    is what the Architect is being asked to trust, and the difference between the two runs is the reason
    to trust it.
  test_used: For a section that is a heading, the canonical page is compared against that section's span,
    from its own page to the page of the next same-or-higher heading. Only a citation outside that span
    is called a defect. Comparing against the section start alone would have flagged 89 rows that are
    legitimately on a later page of a multi-page section.
  spell_sections: Packet 10 spell entries are compared directly against the parsed entry page, because
    each entry sits at a single known location rather than spanning pages.
findings:
  rows_checked: 326
  consistent_with_source: 317
  provably_wrong: 9
  not_checkable: 77
  not_checkable_reason: 77 canonical rows in the claimed range carry a section string that is not a heading
    in the source, for example a table name or a descriptive phrase. They are neither asserted right nor
    wrong here.
  explicitly_not_a_finding: 89 rows differ from their section's start page. They are NOT claimed as defects.
    They sit in multi-page sections such as THE THIEF and THE ASSASSIN and are consistent with the source.
