a_confirming_detail: Seventeen canonical rows cite THE PALADIN to page 23. The operator has previously
  stated that page 23 is a full-page drawing containing no text, which is why the source carries no p23
  marker. Those rows are not in the corrections below, because THE PALADIN legitimately spans pages 22
  and 24 and the section name alone does not say which of the two each assertion belongs to. They are
  raised because a citation to a page with no text cannot be right, and a Builder with the source open
  could resolve all seventeen quickly.
options_considered:
- option: Record the ruling as a contract line and correct the nine rows
  assessment: Recommended. The ruling is already made; what is missing is a durable record and the consequent
    data fix.
- option: Record the ruling only, correct nothing
  assessment: Leaves nine rows disagreeing with the authority the ruling just established, and leaves
    this packet's GUR citing pages that differ from neighbouring rows about the same spells.
- option: Correct the nine rows silently as a typo class
  assessment: Rejected. ESCALATION_CONTRACT treats a change to approved canonical assertions as a migration,
    and only the Integrator may write canonical.
recommended_resolution: Add the ruling to contracts/SOURCE_MARKDOWN.md as an explicit statement that the
  claimed packet source is authoritative for page attribution and that a disagreeing legacy citation is
  a defect. Authorise the nine page corrections as an Integrator migration. Ask the Builder to resolve
  the seventeen THE PALADIN rows against the source, since page 23 has no text.
