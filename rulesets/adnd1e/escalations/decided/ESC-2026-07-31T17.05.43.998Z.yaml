analyst_position: 'The ruling is unambiguous and the Analyst has already been applying it. The only new
  work it creates is the nine-row correction and the contract line. The larger value is preventive: with
  the authority settled, later packets can treat a legacy page disagreement as a defect to report rather
  than a judgement to make, which is what OBS-44 had to do.'
