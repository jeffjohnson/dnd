options_considered:
  - option: >-
      Give each active revision-required Review an independent handoff lineage
      and consume it only through an exact provenance.review_id reference from
      a later GUP in the same GUP lineage.
    impact: >-
      Preserves the active illusionist correction without permitting unrelated
      or unconsuming revisions to suppress it.
    recommendation: recommended
  - option: Treat any later GUP superseding the reviewed GUP as consumption.
    impact: >-
      Retains the current under-reporting defect and loses a ready revision
      request without evidence that the later GUP addressed it.
    recommendation: rejected
  - option: Requeue the 0050 approved bundle.
    impact: >-
      Duplicates already completed Integrator work despite an exact immutable
      Integration record and manifest.
    recommendation: rejected

governance_impact:
  constitution_change: false
  registry_change: false
  canonical_data_change: false
  contract_change: true
  note: >-
    This changes only queue derivation and provenance consumption. It does not
    alter any reviewed GUP, bundle, Integration record, registry, or canonical
    graph state.

blocking: >-
  The scanner implementation cannot be changed until an Architect Decision
  defines the distinct Review-handoff consumption rule.
resolution:
  decision_id: DEC-2026-0054
  decision_path: rulesets/adnd1e/escalations/decisions/DEC-2026-0054.yaml
  outcome: >-
    An active revision-required Review retains an independent handoff until a
    later GUP in the reviewed lineage records that exact Review ID in
    provenance.review_id. The approved DEC-2026-0050 bundle remains terminally
    consumed by INT-20260820-001 and is not requeued.
