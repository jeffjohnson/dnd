handoff:
  next_role: architect
  readiness: ready
  reason: >-
    Queue derivation hides an active ready Builder handoff when the reviewed
    GUP has a later revision that does not consume that Review. The user also
    requested confirmation of whether the approved DEC-2026-0050 bundle must
    be requeued.
  blocking_ids: []

trigger: >-
  Queue semantics are not explicit enough to distinguish Review-handoff
  consumption from ordinary GUP supersession.

question: >-
  When an active revision-required Review has a ready Builder handoff, does a
  later GUP revision consume that handoff merely by superseding the reviewed GUP,
  and should an already integrated approved bundle be rediscovered as Integrator
  work?

