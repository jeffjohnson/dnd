    identities_changed: 0
    assertions_changed: 0
    registry_rows_changed: 0
    nodes_added_or_retired: 0
    general_rule_references_changed: 0
    approved_gups_invalidated: 0
    tooling_changes_required: None functional. The Builder already implements this key. Its README paragraph
      explaining that the constitution defines no key would be updated to cite 5.1, and the existing duplicate-free
      test becomes a check of a stated rule rather than of a chosen convention.
