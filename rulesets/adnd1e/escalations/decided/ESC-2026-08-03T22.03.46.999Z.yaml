options_considered:
- option: Ratify the five-field key in the constitution
  detail: Add an explicit assertion-key clause to constitution section 5 defining edge identity as (source_id,
    edge_type, target_id, aspect, condition), and amend invariant 12 to name it instead of deferring to
    a clause that does not exist.
  assessment: Recommended. It changes no data, contradicts no approved row, matches what the Builder already
    enforces and what the Reviewer already assumes, and closes a governance gap that is currently filled
    by a tooling comment. Both candidates then proceed as ordinary near matches for the Reviewer to judge.
  cost: One constitution edit and one invariant edit. No migration.
- option: Adopt a three-field identity instead
  detail: Read edge identity as source, type and target alone.
  assessment: Rejected. It puts 61 approved canonical rows in 55 groups into breach and would require
    a migration that merges or deletes them, losing facets that different books state differently. It
    would also make the Builder's current behaviour a defect rather than a gap-filler.
  cost: A migration touching at least 61 rows, plus the loss of every second facet.
- option: Leave the key to tooling and close IDQ-15 as answered by the Builder README
  detail: Record that the Builder's key is authoritative in practice and change nothing.
  assessment: Workable today and it is effectively the status quo, so nothing breaks if the Architect
    prefers it. What it leaves behind is an invariant that points at a clause that does not exist, which
    will be re-raised by the next Analyst who reads invariant 12 literally, and a governance rule that
    a future tooling change could alter without a Decision.
  cost: None now. The same question recurs.
- option: Widen the key further, for example by adding book or page
  detail: Make the citation part of edge identity.
  assessment: Rejected, and worth stating because it is the obvious next step from the recommended option.
    It would permit one assertion to be inserted once per book that states it, which is exactly what constitution
    section 5 forbids when it says not to create duplicate edges solely to carry additional citations.
  cost: Silent proliferation of restatements.
recommended_resolution:
  summary: Ratify the five-field assertion key in the constitution and amend invariant 12 to name it.
  proposed_constitution_text:
    location: rulesets/adnd1e/governance/constitution.md, new subsection under section 5
    heading: 5.1 Edge identity
    text: 'Two edges are the same assertion when they agree on source_id, edge_type, target_id, aspect
      and condition. That tuple is the assertion key. Invariant 12 forbids a second edge with the same
      assertion key. Two edges that share a source, type and target but state different facets are distinct
      assertions and both are kept, each with its own citation. Citation fields are never part of the
      assertion key: an assertion restated in a second book is one edge, and the additional locus belongs
      in the provenance ledger.'
  proposed_invariant_text:
    location: contracts/GRAPH_INVARIANTS.md, invariant 12
    from: Duplicate edge identity is forbidden unless the constitution explicitly defines a distinct assertion
      key.
    to: 'Duplicate edge identity is forbidden. Identity is the assertion key defined in constitution section
      5.1: source_id, edge_type, target_id, aspect, condition.'
  consequence_for_this_packet: B20 and B24 stop being blocked on governance and become ordinary near matches.
    The Reviewer decides on the merits whether each states something its baseline row does not, exactly
    as it already does for the fifty-five groups in the corpus.
