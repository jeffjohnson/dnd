question: Invariant 12 forbids duplicate edge identity 'unless the constitution explicitly defines a distinct
  assertion key'. The constitution defines no assertion key. The Builder therefore chose one and documented
  the choice in its own README. Should the constitution adopt that key, adopt a different one, or leave
  the matter to tooling?
why_this_is_architectural_and_not_a_reviewer_call: 'Two of the escalation triggers apply. The constitution
  and the production data disagree in a way that cannot be fixed mechanically: read narrowly, invariant
  12 is violated by 61 approved canonical rows today. And the answer changes edge semantics globally rather
  than for one packet, because every future packet that restates a dependency from a second book meets
  the same question. No Reviewer can settle it without legislating for the corpus.'
the_gap:
  invariant_text:
    source: contracts/GRAPH_INVARIANTS.md, invariant 12
    text: Duplicate edge identity is forbidden unless the constitution explicitly defines a distinct assertion
      key.
  what_the_constitution_says:
    source: rulesets/adnd1e/governance/constitution.md section 5
    text: If the same assertion is stated at several loci, keep one edge and preserve the additional source
      assertions in the provenance manifest or ledger. Do not place multiple loci in one edge field, and
      do not create duplicate edges solely to carry additional citations.
    analyst_reading: This governs restatement of the same assertion. It does not define edge identity
      and it does not say which fields make two assertions the same. Section 5's field table is likewise
      silent. Nothing else in the constitution defines an assertion key. The clause invariant 12 defers
      to has never been written.
  what_the_tooling_does:
    source: tooling/builder/src/adnd1e_builder/vocab.py, ASSERTION_KEY
    key:
    - source_id
    - edge_type
    - target_id
    - aspect
    - condition
    builder_readme: 'tooling/builder/README.md states it plainly: ''Invariant 12 forbids duplicate edge
      identity but the constitution defines no explicit assertion key. The key used is (source_id, edge_type,
      target_id, aspect, condition), chosen because it is the narrowest tuple under which the canonical
      corpus is duplicate-free.'''
    enforcement: duplicates.py grades a match exact when the five-tuple matches, near when only the endpoints
      and type match, and neighbour when only the endpoints match. Only exact raises the duplicate_assertion
      error. Near is routed to the Reviewer.
    analyst_reading: 'The Builder did the reasonable thing and said so in writing. But the justification
      is empirical, not constitutional: the key was picked to fit the corpus. That is a governance decision
      made by tooling, and it is the thing this escalation asks the Architect to ratify or replace.'
