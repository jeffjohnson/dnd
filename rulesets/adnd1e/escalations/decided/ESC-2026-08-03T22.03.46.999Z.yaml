analyst_position: 'The recommended option asks the Architect to write down what the pipeline already does.
  That is deliberately unambitious. The value is not in changing behaviour but in moving a rule out of
  a tooling comment and into governance, where a future change to it needs a Decision. The 61 existing
  rows are the argument: the corpus has been answering this question one packet at a time for a long while,
  and it has been answering it the same way.'
a_correction_to_the_originating_idq: IDQ-15 as written in GUR-PKT-PHB-035-038-money-equipment-r06 says
  invariant 12 'leaves no way to record' a second facet. That overstates it. The Builder's five-field
  key already leaves a way, and the two candidates would be graded near rather than exact, which is a
  Reviewer call rather than a hard error. The Analyst discovered this while assembling this package, by
  reading duplicates.py and vocab.py rather than inferring the rule from the invariant text. The real
  question is narrower than the one IDQ-15 asks and is the one stated above. The GUR is published and
  is not being rewritten to hide the overstatement; this paragraph is the correction of record and the
  Architect should treat this package, not IDQ-15, as the question.
