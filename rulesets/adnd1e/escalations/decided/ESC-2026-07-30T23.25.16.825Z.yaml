options_considered:
  - id: correct_edge_schema_to_18_columns
    description: >-
      Make edge.schema.json describe the existing constitutional and canonical
      18-column production row, including book and excluding per-row ruleset_id
      and book_id.
    advantages:
      - Preserves Constitution v1.4, canonical data, Builder output, and Integrator input.
      - Requires no canonical migration.
      - Makes schemas enforce the format already used by all production rows.
    risks:
      - Requires a schema edit and regression tests.
  - id: migrate_production_to_schema_fields
    description: >-
      Add ruleset_id and book_id to every edge row and remove or rename book.
    advantages:
      - Preserves the present schema text.
    risks:
      - Conflicts with Constitution v1.4 citation semantics and the approved book vocabulary.
      - Requires migration of 3,809 canonical rows, Builder, Integrator, invariants,
        examples, GUP CSVs, and all downstream consumers.
      - Removing book loses the PHB/DMG/UA/MM per-assertion provenance field; book_id
        in the artifact envelope is not an equivalent cross-book row field.
  - id: declare_schema_non_applicable_to_csv
    description: >-
      Treat edge.schema.json as applying only to an undocumented envelope form,
      not production CSV rows.
    advantages:
      - Avoids immediate data changes.
    risks:
      - Contradicts the schema title "AD&D 1e Production Edge".
      - Leaves no schema for the actual 18-column production row and makes validation ambiguous.

recommended_resolution:
  option: correct_edge_schema_to_18_columns
  rationale: >-
    This is the least expressive and lowest-migration resolution. The canonical
    graph, Constitution v1.4, Builder, and Integrator agree on one 18-column
    format. The schema alone diverges and also duplicates source_id in its
    required list, which supports classifying the mismatch as a schema defect
    rather than an intended new production format.

expected_migration_impact:
  constitution: no semantic change
  schema:
    - schemas/adnd1e/graph/edge.schema.json
  registry: none
  profile: none
  canonical_edges: no row migration under the recommendation
  canonical_nodes: none
  tooling:
    - Add schema tests covering the exact 18-column header and a representative production row.
    - Validate all 3,809 canonical rows against the corrected schema.
    - Validate GUP and Approved edge CSV rows through the same adapter.
  artifacts_after_decision:
    - Reviewer emits new Review revisions for the four otherwise-clean GUPs.
    - Races and classes retain their independent Builder/Analyst revision requirements.

acceptance_tests_requested:
  - A canonical 18-column row validates against edge.schema.json.
  - book accepts only PHB, DMG, MM, or UA.
  - ruleset_id and book_id are not required inside each production edge row.
  - An unexpected nineteenth column is rejected.
  - All 3,809 current canonical rows validate without rewriting them.
  - All six reviewed GUP CSV headers match the corrected schema adapter.
  - No canonical graph or registry file is changed by the decision itself.

