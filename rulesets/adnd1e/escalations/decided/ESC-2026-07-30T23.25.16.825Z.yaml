question: >-
  Which production edge field set governs: the 18 columns required by
  Constitution v1.4 and canonical edges_master.csv, or the incompatible
  schemas/adnd1e/graph/edge.schema.json object requiring per-row ruleset_id and
  book_id while rejecting the production book field? If the 18-column contract
  remains authoritative, may the Architect direct the schema correction and
  its regression tests without migrating canonical edge data?

smallest_relevant_excerpts:
  - path: schemas/adnd1e/graph/edge.schema.json
    excerpt: >-
      additionalProperties is false; required includes ruleset_id and book_id;
      properties defines book_id but does not define book.
  - path: rulesets/adnd1e/governance/constitution.md
    section: "5. Required fields"
    excerpt: >-
      source_id, source_label, edge_type, target_id, target_label, aspect,
      condition, polarity, polarity_basis, book, page, section, evidence, pass,
      status, supersession_basis, general_rule_id, review_flag
  - path: rulesets/adnd1e/governance/constitution.md
    section: "12. Worked examples"
    excerpt: >-
      18 columns. edges_master.csv is authoritative for column order; any
      example that disagrees is a defect in the constitution.
  - path: REPOSITORY_STRUCTURE.md
    section: "Authority hierarchy"
    excerpt: >-
      schemas/adnd1e is authority level 4; rulesets/adnd1e is level 5.

