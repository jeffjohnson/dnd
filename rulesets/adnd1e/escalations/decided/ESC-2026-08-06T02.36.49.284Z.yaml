  - 'GUP-MIG-DEC-2026-0015-0016 r01 through r03 are frozen: DEC-2026-0021 forbids editing, renaming, moving,
    deleting or approving them.'
  - REV-GUP-MIG-DEC-2026-0015-0016-r03-r01 stays permanently ready in the Analyst queue.
what_the_analyst_will_not_do: 'The Builder has stated that the Analyst must create claimed DMG and UA
  Markdown packets for the sixteen. The Analyst declines, and the reason is evidentiary rather than procedural.
  No DMG or UA text exists in this repository, so producing those packets would mean writing the rulebook
  prose from recall, committing it as immutable claimed source, then reading it back as evidence and stamping
  sixteen rows polarity_basis: read. That would place invented rules into canonical under a provenance
  label asserting they were read from a printed page. DEC-2026-0021 already ruled that no unread polarity
  may be described as read, and the Analyst instructions forbid using anything but the packet as evidence.
  WORK_QUEUES defines Analyst ready work as entries already present under packets/incoming/; FILE_NAMING
  calls that directory ''available''. The Analyst consumes source, it does not author source.'
the_unassigned_responsibility: No role instruction, contract, or Decision assigns the acquisition and
  packetization of a new book. Packets have so far appeared under packets/incoming/ from outside the five
  roles. That worked while PHB was the only book in play. Now a Decision lineage is blocked on source
  for two books nobody owns, and the Builder has begun assigning that work to the Analyst by elimination.
  The pipeline needs this named explicitly rather than inferred.
options_considered:
- option: Reviewer publishes REV-GUP-MIG-DEC-2026-0015-0016-r03-r02 superseding r01
  effect: The active Review records DEC-2026-0021, narrows required_follow_up.analyst to the four completed
    rows, and hands off to no one pending source. The queue item clears through the ordinary revision
    mechanism.
  cost: Requires the Reviewer to revise a Review about a GUP that DEC-2026-0021 froze. Needs an explicit
    ruling that revising the Review is not 'editing the migration'.
  assessment: Cleanest within existing artifact kinds.
- option: Extend handoff replacement to cover supersession without a raised escalation
  effect: A Decision could name artifacts whose handoffs it supersedes, independent of which escalation
    produced it. Generalizes beyond this case.
  cost: A scanner and contract change owned by Builder under WORK_QUEUES; touches DEC-2026-0022 territory,
    whose implementation is still in review.
  assessment: Correct long-term fix; heavier and slower than this deadlock needs.
- option: Leave the item ready and treat it as known noise
  effect: No artifact changes.
  cost: The Analyst queue permanently misreports one ready job, and each role that reads the scanner re-derives
    this analysis. It already caused the Builder to assign the Analyst packet creation.
  assessment: Not recommended; the misreport is actively producing wrong work assignments.
- option: Analyst fabricates DMG and UA packets from recall
  effect: Unblocks everything immediately.
  cost: Invented rules enter canonical labelled as source-read.
  assessment: Prohibited. Listed only to record that it was considered and refused.
recommended_resolution: Adopt option 1 and rule on option 4's underlying gap. Direct the Reviewer to publish
  REV-GUP-MIG-DEC-2026-0015-0016-r03-r02, superseding r01, recording DEC-2026-0021, narrowing the Analyst
  follow-up to the four integrated rows, and handing off to no role while source is absent. Confirm that
  revising this Review does not violate DEC-2026-0021's freeze on the migration itself. Separately, name
  the owner of source acquisition for DMG and UA, or state that it is outside all five roles and that
  the sixteen rows remain an accepted standing debt until source is supplied from outside the pipeline.
  Either answer is workable; the absence of one is what leaves the queue lying.
