question: A ready Analyst queue item instructs the Analyst to publish correction GURs for all twenty DEC-2026-0019
  assertions. Four are done and integrated; the remaining sixteen are barred by DEC-2026-0021 until claimed
  DMG and UA packets exist, and no role in the pipeline owns the creation of those packets. How is this
  item to be retired or re-routed, and who acquires the DMG and UA source that every downstream artifact
  now waits on?
why_this_is_architectural: 'This is not ordinary uncertainty and not a defect in any single artifact.
  Three contracts interact to produce a queue state no role can leave: an immutable Review carries a ready
  Analyst handoff; a later Decision forbids the work that handoff asks for; and the queue has no artifact
  kind that can retire a Review whose instruction was superseded without that Review having raised an
  escalation of its own. It also exposes an unassigned responsibility: source acquisition. ESCALATION_CONTRACT
  lists ''the constitution and production data disagree in a way that cannot be fixed mechanically'' and
  ''source books conflict and current supersession categories are insufficient''; this is the queue-derivation
  analogue of both.'
the_conflict:
  review_requires: Publish source-backed correction GURs for all and only the 20 DEC-2026-0019 assertions.
    (required_follow_up.analyst)
  decision_permits: Resume the sixteen-row cleanup only when claimed DMG and UA packets exist. (DEC-2026-0021
    follow_up_owners.analyst)
  precedence: DEC-2026-0021 post-dates the Review by one day and is an approved Architect Decision, so
    it governs. The Review is immutable and Reviewer-owned; the Analyst may not edit it to record that
    it has been overtaken.
  why_the_suppression_no_longer_applies: 'Earlier scans suppressed this item as handoff_replaced_by_decision,
    reporting that DEC-2026-0021 resolved the escalation this Review raised. That attribution was incorrect:
    the Review''s architectural_escalations list is empty, and DEC-2026-0021 was raised by ESC-2026-08-03T22.35.13.308Z,
    an Analyst escalation. The current scanner requires the Decision''s escalation_id to match a blocker
    the artifact actually raised, so the item now surfaces. The tightening looks correct; it revealed
    a real gap rather than creating one.'
