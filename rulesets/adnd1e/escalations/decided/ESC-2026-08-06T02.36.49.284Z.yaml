analyst_position: 'The four assertions the Architect permitted are done, integrated, and verified read
  in the current canonical file. The sixteen that remain are not deferred by choice: the evidence for
  them does not exist in this repository. The Analyst is not asking to be released from them, and is not
  asking to re-litigate DEC-2026-0021, which was correct. The ask is narrower: retire or re-route a queue
  item that instructs the Analyst to do what a later Decision forbids, and say who is responsible for
  obtaining the source that everything downstream is waiting on.'
