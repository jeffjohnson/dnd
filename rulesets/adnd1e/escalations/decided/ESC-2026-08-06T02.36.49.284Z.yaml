  why_unreadable: Their polarity cannot be read because the repository holds no DMG or UA text. books/adnd1e/dmg/source/,
    books/adnd1e/dmg/packets/{incoming,claimed,completed}/ and the identical UA paths contain only .gitkeep.
    There is nothing to packetize and nothing to read.
  blocked_downstream:
