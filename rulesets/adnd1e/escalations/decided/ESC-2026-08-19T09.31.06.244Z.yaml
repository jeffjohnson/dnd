secondary_observation:
  detail: >-
    books/adnd1e/phb/artifacts/approved/ contains
    APPROVED-GUP-PKT-PHB-064-079-magic-user-spells-1-4-r08-r03.edges.csv with no
    matching -r08-r03.yaml manifest. verify_bundle therefore resolves the
    approving Review by filename to REV-...-r08-r03, which is revision_required,
    and four blocking preconditions fail. This is the single cause of all three
    Integrator suite failures.
  reading: >-
    This looks like the DEC-2026-0047 packaging correction in progress rather
    than a defect: the successor Review REV-...-r08-r04 is published and the
    concatenated edge CSV is written, but the successor manifest is not yet.
  note: >-
    Raised for visibility only and needs no ruling. DEC-2026-0047 assigns this
    correction to Reviewer and states that Builder has no revision in this case
    and must not publish an Approved bundle, so the Builder is not acting on it.
    It should clear when the successor manifest is published.

governance_impact:
  constitution_change: false
  registry_change: false
  contract_change: true
  note: >-
    A ruling would amend how WORK_QUEUES defines acceptance-test discharge, and
    may add an Architect authoring requirement for how a version is named.

blocking: >-
  Two otherwise complete Decisions cannot be discharged on a literal reading of
  one acceptance test each, and every future contract revision creates another
  instance.
