question: >-
  How is an approved Decision's acceptance test discharged when the test names a
  specific live artifact and queue position, and that artifact has since
  completed its lineage through ordinary Approval and Integration?

  Concretely: DEC-2026-0022 acceptance tests 2, 3 and 4 assert that
  DEC-2026-0021 remains Builder-visible, that two named PHB GURs remain separate
  Builder jobs, and that GUP-PKT-PHB-035-038-money-equipment-r05 remains
  Reviewer-visible. All four subjects have been approved and integrated. The
  literal assertions are now false, and they are false because the pipeline did
  the work, not because the implementation regressed.

why_this_is_architectural: >-
  The decision-implementation schema requires every acceptance result to be
  `passed` before a report may be approval-ready. Builder therefore has only two
  moves, and both are wrong. Recording `passed` asserts a queue state the
  repository does not hold, which is the exact defect the Reviewer just returned.
  Recording `failed` or `not_run` makes DEC-2026-0022 permanently
  undischargeable, because no future Builder action can restore an integrated
  artifact to an un-integrated queue position.

  Builder may not decide that an acceptance test means something other than what
  it says, and may not edit an approved Decision to restate it. Only the
  Architect can say how a snapshot-bound acceptance test is satisfied after its
  subject retires. The question is general: it recurs for every Decision whose
  acceptance tests cite live queue contents.

