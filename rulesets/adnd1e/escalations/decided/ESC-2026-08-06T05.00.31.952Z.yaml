related_defect_already_fixed:
  finding: DEC-0022-LIVE-ACCEPTANCE-STATE-STALE, acceptance test 1
  note: >-
    Acceptance test 1 was genuinely false and is not part of this question.
    The scanner skipped Decision handoff replacement entirely for a
    migration-required Decision carrying a ready Builder handoff, so
    DEC-2026-0021 could not retire the stale Analyst handoff on
    REV-GUP-MIG-DEC-2026-0015-0016-r03-r01. The guard that prevents
    double-counting the Builder item was running before the suppression loop
    instead of after it. Fixed in tooling/common/scan_agent_queues.py with a
    regression test that fails when the guard is moved back; acceptance test 1
    now holds live. This escalation asks only about tests 2, 3 and 4.

options_considered:
  - option: A
    summary: Read a snapshot acceptance test as satisfied by the property it protected.
    detail: >-
      Tests 2 to 4 exist to prove the handoff-replacement change does not
      over-suppress unrelated work. Discharge them by verifying that property
      against the current corpus: no active artifact's ready item is suppressed
      except by an exact Decision ID-and-path link.
    cost: >-
      Requires an explicit rule that Builder may generalize a named subject to
      the property under test. Without one this is Builder reinterpreting an
      approved Decision.
  - option: B
    summary: Record the tests as failed or not_run and leave the Decision undischarged.
    detail: Literal, truthful, and permanent.
    cost: >-
      DEC-2026-0022 can never be completed, and it stays in the Builder queue
      forever as an approved Decision with no approval-ready report.
  - option: C
    summary: Architect re-issues DEC-2026-0022 with acceptance tests restated corpus-independently.
    detail: >-
      A revision whose tests name behaviors and fixtures rather than live queue
      contents, superseding only the acceptance list.
    cost: One Decision revision; the implementation itself does not change.
  - option: D
    summary: Add a schema disposition for a retired subject.
    detail: >-
      Extend the report schema with a result such as `superseded_by_lineage`,
      admissible in an approval-ready report when evidence names the integration
      record that retired the subject.
    cost: >-
      Schema and contract change affecting every future implementation report;
      broader than the immediate problem but fixes the whole class.

recommended_resolution: >-
  Option C for DEC-2026-0022 now, and Option D as the general rule.

  C is the narrowest thing that unblocks the present item without Builder
  reinterpreting an approved Decision: the acceptance list is restated so it
  tests scanner behavior rather than a queue snapshot, and the implementation
  under review is unchanged and already passing.

  D is worth deciding at the same time because the exposure is structural. Any
  Decision whose acceptance tests cite live artifacts becomes undischargeable the
  moment the pipeline advances, and a report that pins file checksums already
  goes stale whenever a shared tooling file is edited later. Naming an explicit
  disposition for a subject retired by integration, with the integration record
  as required evidence, keeps a report honest without freezing the corpus.

  Builder does not recommend Option A. It requires exactly the judgment the
  Builder role is barred from making.

