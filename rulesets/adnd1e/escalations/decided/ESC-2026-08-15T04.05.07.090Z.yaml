decision_id: DEC-2026-0037
decided_on: '2026-08-15'
resolution: >-
  DEC-2026-0037 supersedes DEC-2026-0031. The PHB Bards list is a secondary
  mention rather than the DMG item's defining locus. The current singular
  identity is replaced by item_pipes_of_sewers / Pipes of the Sewers through an
  identity-only direct-v1 migration. The `of` token is deliberate; `the` remains
  omitted; no general item-ID normalization follows from this decision.
