  affected_ref: E7
  gup_status: blocked
  builder_tool: adnd1e-builder 1.0.0

trigger: >-
  ESCALATION_CONTRACT 1.1, "the constitution and production data disagree in a way
  that cannot be fixed mechanically". The Reviewer directed a citation correction that
  the field definition and the entire canonical corpus do not admit. Builder applied the
  correction as directed, revalidated it, and cannot resolve the disagreement without
  changing what the `page` field means.

# 2. -- the question -----------------------------------------------------------
question: >-
  May one edge carry several printed-page and section loci in the `page` and `section`
  fields? Or must an assertion whose support is distributed across several pages be
  represented as several edges, each citing one locus?

why_it_needs_governance: >-
  The answer changes a production field's meaning, not one row's content. `page` is
  defined in the singular and every canonical row honours that. Admitting a list would
  change the constitution's field definition, the CSV contract, the edge schema, both the
  Builder and Reviewer citation validators, and any consumer that reads `page` as a
  number. Builder may not widen a field's meaning to make a correction fit, and Reviewer
  may not either.

# 3. -- the exact proposed edge and all its loci -------------------------------
proposed_edge:
  ref: E7
  source_id: rule_sex
  source_label: Character Sex
  edge_type: EXCLUDED_FROM
  target_id: sys_ability_scores
  target_label: Ability Scores
  aspect: ability determination
  condition: "except maximum score, set jointly with race"
  polarity: negates
  polarity_basis: derived
  book: PHB
  evidence: explicit_rule
  pass: page-sweep
  status: core
  supersession_basis: ""
  general_rule_id: ""
  review_flag: ""

  as_submitted_in_r02:
    page: "7"
    section: THE GAME
  as_corrected_by_reviewer:
    page: "7, 9, 15"
    section: "THE GAME; STRENGTH TABLE I; CHARACTER RACE TABLE III"
  reviewer_disposition: approved_with_revision
  reviewer_integration_action: apply_exact_corrections

# 4. -- smallest relevant source excerpts --------------------------------------
source_excerpts:
  - locus: "PHB p7, THE GAME"
    in_this_packet: true
    text: "In all but a few cases sex makes no difference to ability!"
    role: >-
      States the exclusion and announces an unnamed exception. This is the only locus
      inside PKT-PHB-007-008-intro.
  - locus: "PHB p9, STRENGTH TABLE I"
    in_this_packet: false
    belongs_to_packet: PKT-PHB-009-013-ability-scores
    text: >-
      STRENGTH TABLE I sets a maximum strength per row by sex jointly with race across
      seven racial rows.
    role: Identifies the exception as maximum Strength.
  - locus: "PHB p15, CHARACTER RACE TABLE III: ABILITY SCORE MINIMUMS & MAXIMUMS"
    in_this_packet: false
    belongs_to_packet: PKT-PHB-013-018-races
    text: >-
      "the non- and part-human races must meet certain minimum ability scores, and some
      races have lower maximum possible scores as well ... the ability score is simply
      lowered to conform to the maximum."
    role: Bounds the exception with the complete racial minima and maxima table.

reviewer_rationale_quoted: >-
  "Page 7 states the exclusion only with an unnamed exception. Pages 9 and 15 identify
  that exception as the sex-and-race maximum for Strength, so all three loci are required
  to reproduce the submitted condition."

builder_position_on_the_reading: >-
  Builder does not dispute it. The reading is correct and page 7 alone does not reproduce
  the condition. The disagreement is not about the source; it is about whether one row
  may hold three citations.

# 5. -- current constraints ----------------------------------------------------
current_constraints:
  constitution:
    version: "1.3"
    section: 5
    page_definition: "printed page number from the source's own footer"
    section_definition: "section heading — preferred over page, survives repagination"
    citation_rule: "Every edge must carry a citation. An uncited edge is rejected."
    note: >-
      Both definitions are singular nouns. Section 5 was not changed by the 1.2 to 1.3
      bump; the wording is identical.
  csv_contract:
    file: rulesets/adnd1e/canonical/edges_master.csv
    columns: 18
    page_column_position: 11
    note: >-
      The file is comma-delimited, so a multi-page value must be quoted. Builder's writer
      quotes it correctly, but every consumer that parses `page` as an integer breaks on
      it.
  edge_schema:
    file: schemas/adnd1e/graph/edge.schema.json
    page_type: ["string", "integer"]
    note: >-
      The schema is permissive enough to accept "7, 9, 15" as a string. Schema validity is
      therefore not evidence that the value is legal; the constraint lives in the
      constitution, not the schema. If multi-locus citation is rejected, the schema should
      be tightened to a pattern so the check is mechanical.
  reviewer_constraint:
    contract: contracts/SOURCE_MARKDOWN.md
    rule: >-
      "Reviewer independently verifies citation pages against the original Markdown and
      these placement rules."
    consequence: >-
      Pages 9 and 15 carry no marker in this packet's source.md, which contains only {#p7}
      and {#p8}. A Reviewer verifying E7 against this packet cannot check two of its three
      loci. The correction asks this packet to cite pages it does not contain.
  builder_validators_fired:
    - rule: citation_multi_locus
      severity: error
    - rule: page_outside_packet
      severity: error
      detail: "pages 9 and 15 lie outside the declared packet range 7-8"

# -- evidence from the corpus --------------------------------------------------
corpus_census:
  method: >-
    Every row of rulesets/adnd1e/canonical/edges_master.csv was read directly.
  total_rows: 3809
  page_pure_digits: 3804
  page_empty: 5
  page_containing_comma: 0
  section_containing_semicolon: 0
  finding: >-
