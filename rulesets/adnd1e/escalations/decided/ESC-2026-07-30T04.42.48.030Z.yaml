# 7. -- local graph neighborhood -----------------------------------------------
local_graph_neighborhood:
  supplied: true
  method: computed from canonical edges_master.csv by Builder tooling
  decisive_finding: >-
    Each of the three loci is already represented as its own edge, each with a single-page
    citation. The graph already composes what the correction tries to put in one row.
  rule_sex_incident_edges:
    - "row 1129: rule_sex MODIFIES tbl_height_weight | DMG p12"
    - "row 2009: rule_sex MODIFIES rule_hit_points | DMG p88"
    - "row 2016: rule_sex GATES campaign_social_class | DMG p89"
    - "row 2542: tbl_minor_malevolent TRIGGERS rule_sex | DMG p163"
    - "row 2695: rule_tricks TRIGGERS rule_sex | DMG p217"
    - "row 3405: item_girdle_femininity TRIGGERS rule_sex | UA p87"
  the_three_loci_as_existing_assertions:
    - locus: PHB p7 THE GAME
      carried_by: E7 in GUP-PKT-PHB-007-008-intro-r03
      assertion: rule_sex EXCLUDED_FROM sys_ability_scores
      state: proposed, this packet
    - locus: PHB p9 STRENGTH TABLE I
      carried_by: S15 in GUR-PKT-PHB-009-013-ability-scores-r01
