    score may go. A reader needs both." The cross-packet relationship was recorded at
    extraction time.

# 8. -- options considered -----------------------------------------------------
options_considered:
  - option: A. Reject multi-locus citation; keep one citation per edge
    mechanism: >-
      E7 retains page 7 and section THE GAME. The exception it announces is carried by
      S15 and by canonical row 164, each cited to its own page. The condition field already
      names the exception qualitatively without citing it.
    for:
      - Preserves the field definition, the corpus, and every validator unchanged.
      - Keeps each citation independently verifiable inside the packet that contains it,
        which is what SOURCE_MARKDOWN requires of the Reviewer.
      - >-
        The composed assertion is already reachable. Impact analysis over rule_sex finds
        both the exclusion and the bound.
      - No migration of any kind.
    against:
      - E7 read in isolation announces an exception it does not cite.
      - Depends on a reader traversing to S15 and row 164 rather than reading one row.
  - option: B. Admit a multi-locus citation vocabulary
    mechanism: >-
      Amend constitution section 5 to define `page` and `section` as ordered lists with a
      stated delimiter, tighten the edge schema to that pattern, and update the Builder and
      Reviewer citation validators.
    for:
      - One row states the full support for one assertion.
      - Honest about assertions genuinely distributed across pages.
    against:
      - Changes a production field's meaning for all 3,809 existing rows, none of which
        uses it.
      - The delimiter must not collide with CSV quoting or with section headings that
        already contain punctuation; at least one PHB section heading contains an em dash
        and a colon.
      - Breaks any consumer parsing `page` as an integer.
      - >-
        Cross-packet citation defeats the packet boundary. A Reviewer cannot verify a locus
        whose page is absent from the packet source, so verification would have to move
        outside the packet or be weakened.
      - Recurrence does not currently justify it. Across all five PHB reviews, 335 rows
        reviewed, this is the only multi-locus correction requested.
  - option: C. Split E7 into one edge per locus
    mechanism: >-
      Emit three edges from the three loci, each singly cited.
    for: uses only existing field semantics
    against:
      - Two of the three already exist as S15 and canonical row 164, so this manufactures
        duplicates of assertions that are already correct.
      - The p9 and p15 edges would be created from a packet that does not contain those
        pages, which is a packet-boundary violation regardless of citation shape.
  - option: D. Add a distinct supporting-citation field
    mechanism: >-
      Keep `page` and `section` singular as the primary locus and add a separate optional
      field for corroborating loci.
    for:
      - Primary citation stays machine-clean and singular; corroboration is not lost.
      - No existing row changes meaning.
    against:
      - Adds a 19th production column, which is a larger constitutional change than the
        problem warrants on one row.
      - Constitution section 9 states there is no free-text note field; a corroboration
        field risks becoming one.
      - Still does not solve cross-packet verification.

# 9. -- recommendation ---------------------------------------------------------
recommended_resolution: >-
  Option A. Reject multi-locus citation, and rule that an assertion's citation names the
  single locus that states it. Direct that E7 revert to page 7 and section THE GAME.
  The exception is not lost: it is already carried by S15 at p9 and by canonical row 164 at
  p15, and E7's condition field names it qualitatively without citing it. The Reviewer's
  reading is correct and its remedy is the only part Builder is contesting.
recommendation_confidence: >-
  High. The corpus is unanimous at 3,809 rows, section 5 is unambiguous, and the
  distributed support the Reviewer identified is already represented as separate edges
  with clean single-page citations.
secondary_recommendation: >-
  If Option A is adopted, tighten schemas/adnd1e/graph/edge.schema.json so `page` matches
  a single-integer pattern rather than accepting any string. The schema currently accepts
  "7, 9, 15" and so provides no protection; the only reason this was caught is a Builder
  validator, and a defence that exists in one role's tooling is not a contract.

# 10. -- migration and validator impact ---------------------------------------
expected_migration_impact:
  if_option_a:
    canonical_rows_changed: 0
    gup_rows_changed: 1
    detail: >-
      E7 reverts to its r02 citation. Builder emits GUP-PKT-PHB-007-008-intro-r04 with the
      Reviewer correction withdrawn per Architect ruling. No canonical row is touched. No
      validator changes. The intro GUP then has no remaining blocker.
  if_option_b:
    canonical_rows_changed: 0
    but: >-
      No existing row uses a list, so no data migration is needed. The cost is entirely in
      contracts and code: constitution section 5, the CSV contract, the edge schema, the
      Builder citation validator, the Reviewer verification step, and the page-marker
      cross-check in adnd1e_builder verify-pages, which currently asserts that every cited
      page is marked in the packet source. Cross-packet citation would have to be defined
      or forbidden separately.
  if_option_c:
    canonical_rows_changed: 0
    gup_rows_changed: 3
    risk: >-
      Creates near-duplicates of S15 and canonical row 164, which Builder's duplicate
      detector would then report against the packets that legitimately own them.
  if_option_d:
    canonical_rows_changed: 3809
    detail: >-
      A new column means every canonical row gains an empty field, and the 18-column
      contract, the constitution's column list, graph.json regeneration, and the Integrator
      exporter all change. This is the most expensive option.

# -- what would change ---------------------------------------------------------
would_change:
  constitution: >-
    No on Option A. Yes on Options B and D, section 5 and section 12 respectively.
  registry: false
  profile: false
  canonical_graph: >-
    No on every option. This escalation changes no canonical row.
  schemas: >-
    Recommended on Option A, tightening `page`. Required on Options B and D.
  contracts: >-
    No on Option A. On Option B, SOURCE_MARKDOWN's Reviewer verification obligation and the
    packet-boundary rule both need amendment.
  tooling: >-
    Builder citation validator and verify-pages on Option B; nothing on Option A.

