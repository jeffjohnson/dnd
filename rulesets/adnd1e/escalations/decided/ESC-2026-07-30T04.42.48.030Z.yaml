# 1. -- originating artifacts --------------------------------------------------
originating:
  packet_id: PKT-PHB-007-008-intro
  gur_id: GUR-PKT-PHB-007-008-intro-r02
  gup_id: GUP-PKT-PHB-007-008-intro-r03
