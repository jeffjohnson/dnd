affected_canonical_ids: [sys_equipment, money_gp, exp_level, rule_hit_points]

options_considered:
  - option: A
    summary: Grandfather the legacy rows and state the rule's scope explicitly.
    detail: >-
      Record that the four-word cap binds work authored under Review from constitution 1.7 forward,
      and that migrated rows predating it are accepted history. Builder keeps rejecting new
      breaches. Nothing in canonical changes.
    cost: One contract note. No canonical rewrite.
    risk: >-
      The graph permanently contains rows that would be rejected if proposed today, and a reader
      cannot tell conformant rows from grandfathered ones without checking the extraction pass.
  - option: B
    summary: Re-derive all 1,919 aspects, packet by packet, through the normal pipeline.
    detail: >-
      Each affected packet returns to the Analyst to name the facet each row touches in four words
      or fewer, then recompiles, is reviewed, and is integrated.
    cost: >-
      1,919 rows of Analyst source-reading plus a full Review and Integration cycle per packet. This
      is the largest single item of work anyone has proposed in this repository.
    risk: >-
      Rewrites 1,919 approved assertions. Every re-derivation is a fresh interpretation of source
      and can change what a row asserts, so it is not a formatting pass.
  - option: C
    summary: Shorten the aspects mechanically in tooling.
    detail: Builder truncates or compresses each aspect to four words by rule.
    cost: Low.
    risk: >-
      Rejected on its face. Choosing which four words carry the facet is deciding what the row
      asserts, which is reinterpreting source and is prohibited to Builder. It would also silently
      change assertion keys on 1,919 approved rows.
  - option: D
    summary: Fix only the rows where prose demonstrably splits one assertion.
    detail: >-
      Return the two groups above to the Analyst to determine whether each pair is one assertion or
      two, and correct only those four rows.
    cost: Four rows, one Analyst pass.
    risk: Leaves the conformance gap untouched; addresses only the measured correctness harm.

recommended_resolution: >-
  A together with D, and explicitly not B.

  D first, because it is the only part with a demonstrated correctness consequence and it costs one
  Analyst pass on four rows. A second, because the 46 percent is a conformance gap in rows that no
  Reviewer ever passed, and buying conformance through B means re-interpreting 1,919 approved
  assertions - a far larger risk to the graph's meaning than the untidiness it removes.

  Builder's request of the Architect under A is narrow: state the rule's scope so that the
  disagreement is recorded rather than latent. Without that, every future audit rediscovers 1,919
  apparent invariant violations and has to re-derive that they are grandfathered.

  If the Architect prefers B, Builder recommends it be sequenced per packet behind the packets
  already returning to the Analyst for grain, so the same source reading serves both.

