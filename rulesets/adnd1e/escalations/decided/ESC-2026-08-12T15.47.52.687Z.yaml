builder_position: >-
  Builder has already raised `aspect_word_count` to an error and will not lower it again without a
  Decision saying to: it matches invariant 11, and it matches what the Reviewer blocks. Six packets
  are correctly blocked to the Analyst as a result, which is the intended effect - the alternative
  was handing the Reviewer patches that a mechanical check had already condemned.

  Builder has touched no canonical row and proposes none under any option. Under D the correction
  is an Analyst reading followed by an ordinary migration; under B the same, at scale.

  Builder also records that it overstated this problem when it first surfaced. The row count
  suggested graph-wide duplicate corruption; measurement found four rows. The escalation is raised
  on the conformance disagreement, which is real and is an explicit escalation trigger, and not on
  a correctness emergency that does not exist.

decision:
  id: DEC-2026-0029
  path: rulesets/adnd1e/escalations/decisions/DEC-2026-0029.yaml
  decided_on: "2026-08-12"
  summary: >-
    Preserved the pre-Review migration corpus as provenance-bound conformance
    debt for aspect word count and copied prose only; current validation remains
    mandatory for new and revised work. No bulk migration is authorized. The
    two candidate identity pairs require DMG and UA source packets and a later
    source-backed ordinary lifecycle before any canonical row may change.
