measured_impact_on_the_assertion_key:
  claim_being_tested: >-
    Because `aspect` is part of the assertion key, two edges stating one facet in different prose
    read as two assertions and both enter production.
  method: >-
    Group every canonical row by (source_id, edge_type, target_id, normalized condition) and count
    the groups whose members differ only in `aspect` where at least one aspect is over four words.
  groups_in_canonical: 4115
  groups_at_risk: 2
  rows_at_risk: 4
  detail:
    - endpoints: sys_equipment -CONSUMES-> money_gp
      aspects: ["acquisition cost at DM adjudication", "purchase cost"]
    - endpoints: exp_level -MODIFIES-> rule_hit_points
      aspects: ["different dice if entering via the ranks", "hit dice gained"]
  honest_reading: >-
    The mechanism is real but the measured damage is four rows. 4,115 groups for 4,118 rows means
    the tuple is already almost perfectly unique, so prose aspects are not, today, splitting
    assertions at scale. Builder raised this expecting graph-wide corruption and did not find it.
    The debt is conformance, not correctness, and the recommendation below reflects that rather
    than the alarm the row count first suggested.

