question: >-
  Constitution section 5 caps `aspect` at one to four words, and invariant 11 forbids copied rule
  prose in `aspect` or `condition`. 1,919 of 4,118 canonical rows (46 percent) breach the cap.
  Every one of them arrived through the legacy 13-field migration; work authored under Review
  conforms almost perfectly. Builder has begun rejecting new patches that breach it. What is the
  disposition of the 1,919 legacy rows: are they debt to be re-derived, or accepted history the
  rule does not reach retroactively?

why_this_is_architectural: >-
  This is the constitution and production data disagreeing in a way that cannot be fixed
  mechanically, which the escalation contract names explicitly. Builder cannot resolve it in either
  direction. Shortening 1,919 aspects means deciding what each row asserts, which is reading source
  and belongs to the Analyst; writing them into edges_master.csv belongs to the Integrator; and
  relaxing the rule to match the data would be Builder rewriting the constitution to make its own
  corpus valid. The choice also determines whether a future migration rewrites approved assertions.

