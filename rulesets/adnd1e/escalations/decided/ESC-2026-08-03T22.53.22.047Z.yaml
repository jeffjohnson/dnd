question: >-
  When an approved Architect Decision resolves an escalation and changes the
  responsible role or readiness, may the scanner continue reporting the
  immutable originating artifact's older handoff as ready work?
smallest_relevant_source_excerpt:
  observed_output: >-
    The 2026-08-03 rerun reported
    REV-GUP-MIG-DEC-2026-0015-0016-r03-r01 as ready Analyst work after
    DEC-2026-0021 blocked the unread DMG/UA portion and handed the current work
    to Builder.
  governing_gap: >-
    WORK_QUEUES 1.2 defines immutable artifacts and Decision-migration routing
    but does not say that the Decision resolving an escalation replaces the
    originating artifact's earlier queue handoff.
local_graph_neighborhood: not_applicable_queue_governance_only
affected_canonical_ids: []
options_considered:
  - option: Keep both handoffs visible
    assessment: rejected_double_counts_obsolete_work
  - option: Rewrite the originating Review
    assessment: rejected_violates_immutable_artifact_provenance
  - option: Let the exact decided-escalation lineage replace the old handoff
    assessment: approved_deterministic_and_auditable
recommended_resolution: >-
  Use the approved Decision's handoff only when its decided escalation exactly
  names the active originating artifact ID and path. Preserve the original file
  as immutable history.
