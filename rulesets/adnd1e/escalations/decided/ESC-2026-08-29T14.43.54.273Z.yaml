  registry_change: false
  note: No canonical or registry write is proposed or has occurred.
systemic_finding: A Decision that pins a Review's required_handoff can pin a value the ordinary
  verification rules reject, and nothing checks the two against each other at authoring time.
  The same shape appeared in DEC-2026-0069, whose acceptance tests could not be met inside its
  own declared scope. Both are cases where a Decision is internally consistent but inconsistent
  with a standing rule, and the cost surfaces only when an implementing role reaches the contradiction.
governance_impact: The Bards packet has now consumed five Decisions and four escalations. Each
  was correct in isolation. The recurring cost is that a correction pins the exact bytes of the
  state it corrects, so any later change to those bytes invalidates the correction. A durable
  answer would either pin less, by naming properties rather than checksums where the property
  is what matters, or state explicitly which standing rules a pinned record may not contradict.
blocking: true
