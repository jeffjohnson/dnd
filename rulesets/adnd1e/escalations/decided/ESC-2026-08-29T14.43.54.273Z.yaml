why_not_a_rejection_record: 'Blocker 2 alone would be an ordinary Integration rejection attributed
  to the Reviewer. Blocker 1 is not: the handoff the Reviewer would have to change is pinned by
  an Architect Decision, and changing it withdraws the r02 historical-bundle exclusion that the
  same record authorises. Refusing the bundle without resolving that would send the Reviewer a
  remediation it cannot lawfully perform, so the Integrator is asking rather than filing.'
what_is_not_in_question:
- The DEC-2026-0070 implementation. Discovery, the exclusion, fail-closed handling and the Druid
  form are all covered and green.
- DEC-2026-0068's record. Every pinned artifact, both supersession links, the parse failure, the
  component and the operation partition were re-derived from the files and agree.
- Canonical state, unchanged at 5046 edges, 1392 nodes and 1407 registry rows with 1691 findings.
  No transaction was attempted and no snapshot taken.
