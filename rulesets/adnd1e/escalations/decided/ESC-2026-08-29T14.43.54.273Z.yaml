blocker_2_the_successor_review_dropped_its_registration_decisions:
  finding: The Integrator reads node registrations from the approving Review's node_registry_decisions,
    because a registry row needs an approved label and kind and the Integrator may not author
    either. REV-...-r04-r01 carries twelve such entries, each with proposed_id, submitted_label,
    kind, basis and edges_depending_on_it. REV-...-r04-r03 carries none. In their place it records
    node_registration_prerequisite, which lists eleven bare node IDs and a count and supplies
    no label, kind, basis or dependency for any of them.
  observed: operation index classifies every CSV row exactly once -> manifest declares 11 node
    operation(s) but the Review approves 0
  consequence: The successor meant to correct the packaging of the rejected bundle regressed the
    data the correction depends on. Eleven identities would have to be registered with labels
    and kinds no approved artifact states, and authoring them is outside the Integrator's role.
  a_second_discrepancy_not_resolved_here: r04-r01 approved twelve registrations and the r03 prerequisite
    block names eleven. Which is correct is a Reviewer determination; the Integrator reports the
    difference without proposing a resolution.
