  reason: DEC-2026-0070 is implemented and the Bards r03 bundle now reaches ordinary verification
    exactly as ruled. It fails there on two blocking checks. One is a Reviewer regression the
    Reviewer can fix; the other is a direct conflict between DEC-2026-0068's pinned handoff and
    the ordinary verification rule, which no role below the Architect can resolve.
  blocking_ids: []
what_is_implemented: DEC-2026-0070 step 2 is complete. Manifested bundles resolve components from
  the manifest's declared path and checksum, manifestless legacy bundles keep filename inference,
  direct migrations keep the no-edge-CSV rule, and the exact validated historical bundle is withheld
  from every bucket and reported as historical_unadmitted_bundle. Against the live corpus the
  queue offers exactly APPROVED-GUP-PKT-PHB-117-119-bards-r04-r03 with zero fatal diagnostics,
  zero discovery diagnostics, and three informational notices. test_admission passes 42 of 42
  and test_bundles 19 of 19.
question: DEC-2026-0068 pins the r03 Review's required handoff as next_role architect, and DEC-2026-0070
  says the r03 bundle remains eligible for ordinary bundle verification, which requires next_role
  integrator. Which governs? And must the r03 successor Review be reissued to restore the node
  registration decisions it dropped?
blocker_1_the_pinned_handoff_cannot_pass_verification:
  finding: Ordinary bundle verification requires the approving Review to hand off to the Integrator
    and be ready. The r03 Review declares next_role architect, readiness ready, and DEC-2026-0068
    pins exactly that as required_handoff, so the file and the record agree with each other and
    both disagree with verification.
  observed: handoff routes to integrator and is ready -> next_role='architect' readiness='ready'
  consequence: The bundle can be discovered and offered, which DEC-2026-0070 requires, but can
    never be integrated while both rules stand. Changing the Review's handoff would invalidate
    DEC-2026-0068's pinned record and withdraw the r02 exclusion with it, so the Reviewer cannot
    fix this without the record being reissued too.
