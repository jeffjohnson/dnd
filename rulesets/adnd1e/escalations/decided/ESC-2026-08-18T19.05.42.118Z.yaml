handoff:
  next_role: architect
  readiness: ready
  reason: >-
    Four Reviews route a `revision_required` to Builder and instruct it to publish
    "a successor GUP and Approved bundle". An Approved bundle is Reviewer output.
    The Integration rejection that caused these Reviews states the opposite
    division of labour: that the GUP content is correct, that the only change
    needed is emitting the bundle's edge component as the concatenation of the
    GUP's `edges.csv` and `pending.csv` and re-pinning its checksum, and that the
    Integrator will not do that itself because it is "the packaging decision the
    Review exists to make". Builder cannot publish an Approved bundle, and the
    only role that has stated what must change says the GUP needs no change.
  blocking_ids: []

# Exact pairs are Decision-routing metadata derived from the package's named
# active Review artifacts. They allow DEC-2026-0047 to replace only these four
# Builder revision handoffs, without moving or changing any published Review.
