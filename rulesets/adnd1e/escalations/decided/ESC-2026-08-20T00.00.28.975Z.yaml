resolution:
  decision_id: DEC-2026-0051
  decision_path: rulesets/adnd1e/escalations/decisions/DEC-2026-0051.yaml
  disposition: >-
    The fifth disposition is invalid. DEC-2026-0051 requires an opt-in Review
    schema gate and a Reviewer r06 successor that uses `approved` for the six
    source-supported rows while recording their blocked-component exclusion as
    packaging evidence.
