why_the_loop_has_no_exit:
- GUP-...-r06 is blocked and names the Review as its blocker, so Builder has no ready illusionist
  item; its three ready items are DEC-2026-0045, 0046 and 0048.
- The Review lineage leaf hands off to Builder, so Reviewer has no ready illusionist item either;
  its only illusionist entry is REVIEWER-BLOCKED-GUP, itself waiting on that same Review.
- Neither role can clear the condition without the other. The disposition is a vocabulary question,
  and Integrator is prohibited from resolving ontology conflicts or reinterpreting source rows,
  so it cannot be broken from here.
- 'Republishing is not obviously available either: both Reviews carrying the term are immutable,
  and r05-r03 is the approved Review that emitted a bundle. Whether a successor may restate those
  six dispositions, and under what term, is the decision being asked for.'
why_it_matters: 'Two Integrator items, REV-GUP-PKT-PHB-064-079-magic-user-spells-1-4-r08-r06 and
  REV-GUP-PKT-PHB-079-094-magic-user-spells-5-9-r07-r05, both declare `readiness: blocked` and
  both state the same precondition: the illusionist packet must first publish a successor without
  its duplicate copies, after which Integrator re-runs the five-field batch preflight. The Reviewer
  has already made the ownership call those two depend on. Until the illusionist packet can move,
  231 and 203 approved rows stay out of canonical and the DEC-2026-0047 packaging correction cannot
  complete for any of the three packets.'
what_is_not_in_question:
- The Builder is right to refuse. An unrecognised disposition is exactly the case where guessing
  would silently rewrite a Review decision, and the compiler declining to infer one is the behavior
  the contracts ask for.
- 'The Reviewer''s intent is legible: six rows are approved as source-supported but deliberately
  excluded from the Approved edge component, which is the blocked.csv exclusion DEC-2026-0047
  records as `excluded_rows: 6`. The semantics are not disputed here, only the vocabulary and
  the Builder obligation attached to it.'
- The nine duplicate assertions are settled. REV-...-r05-r05 dispositioned all nine `rejected`
  with source loci, and the Builder applied them in `reviewer_directives_applied.rejected_rows`.
  That part of the packet is done.
- INT-20260819-002 already withdrew the incorrect three-field duplicate claims and cleared the
  psionics bundle, which has since been integrated as INT-20260819-003. No part of this escalation
  reopens that.
options_considered:
- 'Add `approved_but_excluded_from_bundle` to the approved disposition vocabulary and define the
  Builder obligation: most plausibly compile the row into blocked.csv and exclude it from the
  edge component, which is what the Reviewer appears to intend and what the existing bundle already
  does.'
- Rule the term illegal and name the role that republishes. This needs an explicit answer on r05-r03,
  which is approved and immutable and emitted a bundle the Integrator has already refused.
- 'Map the term to an existing disposition. Integrator did not attempt this: choosing which existing
  term preserves the Reviewer''s meaning is an ontology decision this role is prohibited from
  making.'
