  registry_change: false
  note: Nothing in canonical is wrong. Canonical stands at 4501 edges, 1226 nodes and 1243 registry
    rows after INT-20260819-003 and INT-20260819-004, with 1697 findings and none introduced by
    either batch. This escalation is about reachability of pending work, not about state already
    integrated.
governance_impact: 'Narrower than DEC-2026-0043 but the same shape: an artifact state that produces
  no ready item for any role. There the gap was an Integrator rejection with an approved Review;
  here it is a Review vocabulary term the Builder cannot honour. A durable fix would validate
  edge-decision dispositions against a declared vocabulary at Review publication, so an unrecognised
  term is caught before it can strand a packet.'
systemic_finding: Edge-decision dispositions are not validated against any schema vocabulary.
  The Reviewer published `approved_but_excluded_from_bundle` twice, including in an approved Review
  that emitted an Approved bundle, and nothing rejected it until the Builder compiler met it two
  revisions later. Any Review can introduce a term no downstream role can act on, and the cost
  surfaces only after the artifacts carrying it are immutable.
