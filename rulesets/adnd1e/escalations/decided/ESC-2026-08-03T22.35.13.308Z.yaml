what_the_analyst_will_not_do: 'The sixteen are not guessed. For several of them a plausible value is obvious
  from the node names before any source is opened, and spell_taunt MODIFIES cbt_armor_class is the clearest
  case. Producing those values and labelling the basis read would satisfy every acceptance test and would
  be a lie of exactly the kind this cleanup exists to remove: three of the twenty rows carry basis heuristic
  today because a migration pattern-matched values into them, and the Decision''s whole purpose is to
  replace guesses with readings.'
options_considered:
- option: Re-scope the prerequisite to the four PHB assertions and let the migration proceed
  detail: Amend the cleanup's required_result to the assertions whose source the repository holds, record
    the sixteen as a standing debt against DMG and UA packetization, and allow r03 to be emitted with
    those sixteen still unset.
  assessment: 'Recommended, with one qualification below. It unblocks a migration that is otherwise stalled
    indefinitely on source that no role in this pipeline can produce, and it costs nothing that is not
    already lost: those sixteen rows carry unset and heuristic bases today and would continue to.'
  qualification: GRAPH_INVARIANTS 15 and 16 are the reason the Decision refused a migration exception
    in the first place, and its rationale says a migration exception 'would weaken a categorical review
    boundary to carry known legacy debt through modified rows'. That argument is untouched by the absence
    of source. The Architect should decide whether re-scoping is a narrower exception than the one already
    rejected, or the same one.
- option: Hold the migration until DMG and UA are packetized
  detail: Leave DEC-2026-0019 as written and treat DMG and UA packetization as the true blocker.
  assessment: Faithful to the Decision and to invariants 15 and 16. The cost is that DEC-2026-0015, DEC-2026-0016
    and DEC-2026-0019 all stall behind two books' worth of packetization, which is a large body of work
    and is not scheduled anywhere the Analyst can see. Nine approved page corrections and a completed
    identity migration wait on it.
- option: Split the migration so the PHB-only work proceeds and the DMG and UA rows wait
  detail: Integrate the four-row cleanup now, and let Builder emit r03 covering only the operations that
    do not touch an assertion whose polarity is still unresolved.
  assessment: Worth the Architect's attention because it preserves the invariant and unblocks part of
    the work, but the Analyst cannot tell from here how much of DEC-2026-0015's identity migration would
    survive the split. Fifteen of the sixteen blocked rows are endpoint repoints under DEC-2026-0015,
    so the split may remove most of that Decision's substance and leave little worth integrating.
- option: Let the Reviewer resolve the sixteen from canonical context instead of source
  detail: Treat Reviewer judgement as a substitute for reading the page.
  assessment: Rejected and recorded so it is visibly considered. It reproduces the heuristic-basis problem
    under a different name and contradicts the Decision's own prohibition on inferring polarity from existing
    values.
recommended_resolution: 'Rule on scope rather than on values. The Analyst recommends re-scoping the prerequisite
  to the four assertions whose source exists, recording the sixteen as an explicit standing debt tied
  to DMG and UA packetization so they are not silently forgotten, and stating in the amending Decision
  whether the resulting r03 may carry rows whose polarity_basis remains unset. That last point is the
  part the Analyst cannot decide: it is a deliberate, bounded exception to GRAPH_INVARIANTS 15 and 16,
  and DEC-2026-0019 refused a broader version of the same exception for reasons that still hold.'
