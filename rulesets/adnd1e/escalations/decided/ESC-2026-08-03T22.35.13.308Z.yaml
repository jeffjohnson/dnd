analyst_position: The four assertions this repository can support are done and are handed off. The remaining
  sixteen are not a judgement the Analyst is declining to make; they are a reading the Analyst has no
  page to make it from. The decision the Architect faces is whether the migration waits for two books
  to be packetized or proceeds with a bounded and recorded exception, and that is a scope and sequencing
  question rather than a graph question.
