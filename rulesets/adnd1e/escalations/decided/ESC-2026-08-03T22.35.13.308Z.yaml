question: DEC-2026-0019 step 1 requires the Analyst to read authored polarity from bounded claimed Markdown
  packets for twenty canonical assertions. Sixteen of them are DMG and UA rows, and this repository contains
  no packet and no Markdown source for either book. Should the DEC-2026-0015/0016 migration wait until
  DMG and UA are packetized, or should the prerequisite cleanup be re-scoped to the assertions whose source
  the repository holds?
why_this_is_architectural: An approved Decision sequences four roles across seven steps on a prerequisite
  that cannot be produced. The Analyst cannot re-scope a Decision and cannot satisfy it, and no downstream
  role can start until step 1 completes. Only the Architect can change what the Decision requires or how
  it is sequenced.
