why_the_integrator_did_not_simply_widen_the_diff:
- DEC-2026-0069's exact_diff names admission.py alone. Honouring declared component paths changes
  which bundles every packet in the ruleset offers as ready, which is queue semantics rather than
  implementation drift, and DEC-2026-0046's informational drift allowance does not reach it.
- The change is not self-contained. Blocker 2 shows it would admit a bundle the current rules
  cannot evaluate, so a correct implementation needs a companion exclusion that only the Architect
  can specify.
options_considered:
- 'Authorise discovery to read components from the manifest, with an explicit exclusion for a
  bundle whose approving Review is admitted-unreadable. This is the option the Integrator would
  choose: the manifest is already the authority for its components, and verify_bundle already
  checksums them.'
- Require every Approved bundle to carry a stem-named component of its own, making the r03 bundle
  a Reviewer packaging correction. This preserves discovery unchanged but duplicates an immutable
  57-row component and contradicts DEC-2026-0068, which pins the shared component by path.
- Narrow the acceptance tests so DEC-2026-0069 is satisfied by admission behaviour alone and treat
  discovery as separate work. This lets the implemented step close honestly, but leaves the Bards
  bundle unintegrable until that work is decided.
what_is_not_in_question:
- The admission implementation. Both delegation forms validate independently, the Druid exception
  is unaffected by the Bards one, and every denial case is fatal with exit code 2 and no traceback.
- DEC-2026-0068's record. Every pinned artifact, the parse failure, both supersession links, the
  rejection, the component and the 29 plus 28 operation partition were re-derived from the files
  and all agree.
- Canonical state, unchanged at 5046 edges, 1392 nodes and 1407 registry rows with 1691 findings.
  No transaction was attempted.
