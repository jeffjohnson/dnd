systemic_finding: 'Discovery infers a bundle''s components from its filename while verification
  reads them from the manifest. The two agreed as long as every bundle shipped its own CSV, and
  this is the first bundle to re-package an existing component. An inference that silently disagrees
  with the declared truth is the same class of defect as the queue scanner reading readiness from
  lineage rather than from the handoff: correct until an artifact exercises the difference, then
  wrong without saying so.'
governance_impact: A Decision's exact_diff is the scope the implementing role works to. When a
  Decision's own acceptance tests cannot be met inside it, the role can either exceed the scope
  silently or stop and ask. Stopping is right, but it costs a round trip per instance. It may
  be worth stating that an implementing role reports a scope insufficiency rather than widening
  the diff, so this is handled by rule rather than by judgement each time.
blocking: true
