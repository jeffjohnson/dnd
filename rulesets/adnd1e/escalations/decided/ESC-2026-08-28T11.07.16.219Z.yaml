what_is_already_done: Direct-predecessor admission is implemented in admission.py exactly as ruled.
  Against the live corpus the queue now reports zero fatal admission diagnostics and two informational
  historical_unreadable_review notices, the Druid file authorised by DEC-2026-0064 and the Bards
  file by DEC-2026-0068. Field names are fixed per delegation form rather than read from the Decision,
  and self-delegation is refused outright, both as DEC-2026-0069 requires.
question: May Integrator bundle discovery locate an Approved bundle's edge component by the path
  the manifest declares rather than by filename stem, and if so, what excludes the historical
  r02 bundle that the same change would make discoverable even though its approving Review is
  the admitted-unreadable one?
blocker_1_discovery_matches_by_stem:
  finding: 'bundles.discover pairs a manifest with an edge CSV whose filename stem matches the
    manifest''s. The r03 manifest declares the r01 component, which is the exact path and checksum
    DEC-2026-0068 pins as edge_component, so nothing is missing: the file is simply not where
    the stem rule looks. Discovery therefore emits `manifest present with no .edges.csv component`
    and drops the bundle.'
  proof: Reproduced in an isolated clone whose only difference from the live repository was a
    stem-named copy of the component the r03 manifest already declares. With that copy present
    ready_queue offered exactly APPROVED-GUP-PKT-PHB-117-119-bards-r04-r03, with zero fatal diagnostics
    and both informational notices. Nothing else changed, so the stem lookup is the sole cause.
  consequence_for_the_decision: Acceptance test 1 requires ready_queue to offer the normal r03
    Approved bundle; it currently offers none. Acceptance test 4 requires that informational history
    alone does not make queue exit 2; queue exits 2 today on the two discovery diagnostics, not
    on any admission failure. Neither can be satisfied by a change confined to admission.py, which
    is the whole of the declared exact_diff.
  declared_component:
    path: books/adnd1e/phb/artifacts/approved/APPROVED-GUP-PKT-PHB-117-119-bards-r04-r01.edges.csv
    checksum: sha256:b8342ceb08970d1fc65cfe2bc1af2c40255e4717d08a765a221ba50c9af54f33
    rows: 57
