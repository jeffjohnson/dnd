blocker_2_the_same_change_surfaces_the_historical_bundle:
  finding: APPROVED-GUP-PKT-PHB-117-119-bards-r04-r02 declares the same r01 component, so a manifest-path
    rule would make it discoverable too. It carries status approved and supersedes the r01 bundle,
    and its approving Review is REV-GUP-PKT-PHB-117-119-bards-r04-r02, the unreadable file DEC-2026-0068
    admits as history.
  consequence: Because that Review is omitted from lineage state, withdrawn_review_ids cannot
    evaluate it, and the bundle is not integrated, not rejected and not superseded at GUP level.
    On the present rules it would be classified ready. The Integrator would then offer a bundle
    whose approving Review no role can read, which is the outcome DEC-2026-0065's fail-closed
    rule exists to prevent, reached through discovery rather than through admission.
  the_natural_hook: DEC-2026-0068 already pins this bundle as historical_bundle. A rule excluding
    any bundle whose approving Review is an admitted-unreadable one, or specifically the pinned
    historical_bundle, would close it. Choosing between those is a queue- semantics decision,
    so the Integrator has not made it.
