  reason: DEC-2026-0069 step 2 is implemented and its admission behaviour is correct, but two
    of its acceptance tests cannot pass within its declared exact_diff. The remaining blocker
    is in bundle discovery, which the Decision scopes out, and widening it has a second-order
    effect the Integrator will not decide alone.
