question: >-
  When an approved Architect Decision assigns Builder work that produces no
  decision-migration GUP, what artifact or signal consumes that Decision for
  queue derivation, so the scanner can distinguish implemented Builder work from
  outstanding Builder work?

smallest_relevant_source_excerpt:
  governing_rule: >-
    WORK_QUEUES 1.3, Builder rule 3: "an approved Architect Decision has a ready
    Builder handoff and migration_required: true, and no structurally valid
    decision-migration GUP consumes it through matching authority and checksummed
    provenance.decision_inputs."
  governing_gap: >-
    Rule 3 is the only rule that routes a Decision to Builder, and it is
    conditioned on migration_required: true. A Decision with
    migration_required: false and a ready Builder handoff matches no rule, so it
    is never surfaced and never consumed. WORK_QUEUES defines no completion
    signal for it in either direction.
  prior_acknowledgement: >-
    DEC-2026-0020 coordination_constraints already records the observed
    behaviour: "The current queue scanner does not surface non-migration Decision
    handoffs to Builder. DEC-2026-0020 remains the authoritative assignment even
    while the scanner continues to display the already-published GUP as Reviewer
    work." The gap was noted there but no consumption rule was defined.

