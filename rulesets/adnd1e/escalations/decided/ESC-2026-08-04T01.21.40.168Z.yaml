  consequence: >-
    Reading the Decision files directly shows six ready Builder handoffs while
    the scanner shows one job. Neither view is wrong under the current contract,
    and the two cannot be reconciled without a consumption rule. The scanner
    cannot report the three implemented Decisions as complete, and it also
    cannot report them as outstanding, so a reader must audit each Decision by
    hand to learn the state of Builder work.

local_graph_neighborhood: not_applicable_queue_governance_only
affected_canonical_ids: []

options_considered:
  - option: Leave the gap open and audit Decisions by hand
    assessment: >-
      rejected_not_derivable; queue state must come from artifact lineage, and
      hand auditing is the failure this contract exists to prevent
  - option: Surface every non-migration Builder Decision as ready with no consumption rule
    assessment: >-
      rejected_permanently_ready; an item that can never be retired is worse
      than an absent one because it trains readers to ignore the queue
  - option: Let the Builder infer completion from its own test suite or version constants
    assessment: >-
      rejected_not_uniform_and_self_certifying; each Decision states different
      acceptance tests, and a role must not certify its own work complete
  - option: >-
      Require a Decision that assigns non-migration Builder work to name an
      explicit completion artifact, and consume it when that artifact exists
    assessment: >-
      preferred_exact_and_auditable; matches the WORK_QUEUES 1.3 precedent of
      exact, provenance-backed linkage rather than inference
  - option: Have Builder publish a completion record artifact per Decision, reviewed like any other output
    assessment: >-
      viable_but_heavier; adds an artifact kind and a Reviewer obligation, and
      the Architect may prefer that stronger evidence for tooling changes

recommended_resolution: >-
  Extend WORK_QUEUES with a consumption rule for a Decision that has a ready
  Builder handoff and migration_required: false. Following the WORK_QUEUES 1.3
  precedent, keep the link exact rather than inferred: have the Decision name the
  artifact whose existence discharges it, and have queue tooling consume the
  Decision only when that named artifact exists and matches. If the Architect
  prefers independent evidence for tooling and documentation work, require a
  Builder-published completion record that the Reviewer confirms, and consume the
  Decision on the Approved record rather than on Builder assertion alone. Either
  route restores a single derivable answer to "is this Decision's Builder work
  outstanding?" Builder does not consider it appropriate to choose between these
  routes or to encode either into shared tooling before this ruling, because the
  choice defines when work counts as done.

