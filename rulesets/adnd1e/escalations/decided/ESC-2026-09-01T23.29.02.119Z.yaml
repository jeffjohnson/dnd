systemic_finding: This is the second time in three days that a correct, authorized integration has
  turned the Integrator's own suite red without anything being wrong in canonical state, and both
  times the cause was a rewind fixture that could not represent the corpus the transaction produced.
  The first was a partial rewind that did not close over a retired identity; this one is a rewind
  that could not reverse a whole class of plan. The pattern worth naming is that these fixtures encode
  assumptions about which shapes of migration exist, and each new operation model or plan shape silently
  invalidates one.
blocking: false
