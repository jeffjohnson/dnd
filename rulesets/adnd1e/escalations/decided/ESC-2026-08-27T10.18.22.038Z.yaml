  next_role: architect
  readiness: ready
  reason: A published Review is not parseable YAML. It halts every Integrator entry point before
    any bundle is examined, and the ordinary repair is unavailable because a successor to this
    revision would fork a chain that already continues past it.
  blocking_ids: []
trigger: Integrator queue check with one ready item. Both the queue command and a dry-run integration
  abort with yaml.scanner.ScannerError before reaching the ready bundle.
question: 'How is a malformed published artifact repaired when it sits mid-lineage, so the successor
  mechanism that ARTIFACT_LIFECYCLE prescribes would fork a revision chain that WORK_QUEUES forbids
  from forking? Specifically: may the Reviewer correct this file in place as a non-semantic serialization
  fix, must the whole r01 Review chain be reissued, or does some other instrument apply?'
the_malformed_artifact:
  id: REV-GUP-PKT-PHB-054-064-druid-spells-r01-r04
  path: books/adnd1e/phb/artifacts/reviews/REV-GUP-PKT-PHB-054-064-druid-spells-r01-r04.yaml
  checksum: sha256:f28b9d2b15dcebf4053e3931b9190e54d70b27ca6da9ceadf3a2aebbefc1fd29
  status: revision_required
  revision: 4
  supersedes: REV-GUP-PKT-PHB-054-064-druid-spells-r01-r03
  defect: Five plain YAML scalars carry a colon-space inside an unquoted value, which the parser
    reads as a nested mapping key. The values are prose rationales, so the content is fine and
    only the serialization is invalid.
  offending_lines:
  - 115
  - 119
  - 123
  - 127
  - 131
  offending_key: row_decisions[].rationale
  example_line: 'rationale: Source-supported but omitted: its exact assertion key is already canonical
    row 4619.'
  parser_error: 'yaml.scanner.ScannerError: mapping values are not allowed here, line 115 column
    44.'
  verified_remediation: Quoting exactly those five values, and nothing else, makes the document
    parse with its structure intact. This was confirmed on a scratch copy outside the repository;
    the published artifact was not modified, read-repaired, or staged.
  why_the_ordinary_repair_does_not_apply: 'The r01 Review chain already continues past this revision:
    r01-r05 supersedes r01-r04 and r01-r06 supersedes r01-r05, and a further Review r02-r01 exists
    on the r02 GUP. Publishing a successor to r01-r04 would create a second child of r01-r03 and
    fork the chain, which WORK_QUEUES prohibits: revision chains must not fork.'
what_it_blocks:
  ready_item:
    bundle_id: APPROVED-GUP-PKT-PHB-117-119-bards-r04-r01
    path: books/adnd1e/phb/artifacts/approved/APPROVED-GUP-PKT-PHB-117-119-bards-r04-r01.yaml
