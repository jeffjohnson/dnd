  Filed originally as ESC-2026-0006, which collided with an existing decided escalation of
  the same number raised by architect_intake. Re-identified under a timestamped scheme at
  operator direction. The operator's proposed form used colons; those are illegal in
  Windows filenames and git-bash silently strips them, which would have made the ID inside
  the artifact disagree with the name on disk. The colon-free form used here is sortable,
  collision-proof to the second, valid on every filesystem, and consistent with the
  INT-YYYYMMDD-NNN shape already in contracts/FILE_NAMING.md.
