question: >-
  Should the PHB concept be registered as rule_mistletoe and canonical row
  1502 be migrated from the class_druid endpoint labelled "Druid Mistletoe" to
  that node, or does the ruleset require a different identity or representation
  for druidic mistletoe?

smallest_relevant_source_excerpt:
  phb_page_54: >-
    The source identifies mistletoe as the druid religious symbol and says
    druid spells with material components assume its use; lesser substitutes
    reduce spell effectiveness.
  canonical_row_1502: >-
    class_druid, labelled "Druid Mistletoe", DERIVED_FROM
    spell_component_material, with aspect "consumed very slowly" (DMG 40).
  canonical_row_2648: >-
    rule_holy_symbol EXCLUDED_FROM spell_components, with aspect stating that
    symbols and mistletoe are not consumed (DMG 41).

local_graph_neighborhood:
  proposed_node:
    id: rule_mistletoe
    label: Mistletoe
    kind: rule
    registry_state: absent
    dependent_refs: [M1, M2, M3, M4, M5, M6]
  canonical_rows:
    - row: 183
      assertion: rule_holy_symbol FEEDS_INTO rule_cleric_spells
      relevance: Existing analogue for a religious symbol supplying a spell system.
    - row: 446
      assertion: rule_druid_spells CONSUMES spell_component_material
      relevance: Existing aggregate material-component relationship for druid spells.
    - row: 1502
      assertion: class_druid DERIVED_FROM spell_component_material
      source_label: Druid Mistletoe
      relevance: >-
        The endpoint ID resolves to the Druid class while the serialized label
        and aspect describe mistletoe; the proposed node would expose two
        identities for the same concept unless this row is governed.
    - row: 2648
      assertion: rule_holy_symbol EXCLUDED_FROM spell_components
      relevance: Its aspect explicitly distinguishes symbols and mistletoe from consumed components.
  proposed_packet_relationships:
    - M1 attempts to classify Mistletoe as a Holy Symbol with DERIVED_FROM.
    - M2 attempts to model mistletoe as a consumed resource.
    - M3 through M6 model the effects of component quality.

affected_canonical_ids:
  - class_druid
  - rule_mistletoe
  - rule_druid_spells
  - rule_holy_symbol
  - spell_component_material
  - spell_components

options_considered:
  - option: Approve rule_mistletoe as an isolated node and leave row 1502 unchanged
    assessment: >-
      rejected_identity_drift; the graph would retain a class_druid assertion
      whose label names the newly registered concept.
  - option: Reuse class_druid for the PHB mistletoe mechanic
    assessment: >-
      rejected_wrong_identity; a character class is not the graded material
      component described on PHB 54.
  - option: Register rule_mistletoe and migrate canonical row 1502 to that endpoint
    assessment: >-
      preferred_identity_repair; it gives the source concept one explicit node
      and repairs the existing endpoint/label mismatch through an authorized
      compare-and-swap migration.
  - option: Defer all mistletoe identity work until a current DMG page-40 packet is claimed
    assessment: >-
      viable_but_blocking; the legacy canonical citation cannot be independently
      reread today, but its endpoint/label mismatch is visible without
      reinterpreting the legacy extraction.

recommended_resolution: >-
  Approve rule_mistletoe as the canonical identity for the graded druidic
  component, authorize a compare-and-swap migration of canonical row 1502 from
  class_druid/Druid Mistletoe to rule_mistletoe/Mistletoe while preserving its
  other fields pending a claimed DMG source audit, and require the packet GUP to
  record that Decision. Reject M1 because DERIVED_FROM does not express
  classification. Independently revise M2 away from CONSUMES because canonical
  row 2648 explicitly says mistletoe is not consumed; the existing
  rule_holy_symbol FEEDS_INTO rule_cleric_spells neighborhood supports the
  analogous rule_mistletoe FEEDS_INTO rule_druid_spells form.

expected_migration_impact:
  canonical_edges: 1
