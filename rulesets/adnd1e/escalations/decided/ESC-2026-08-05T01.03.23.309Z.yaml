question: >-
  Does the canonical/default component identity directed by DEC-2026-0024
  remain rule_mistletoe / Mistletoe, or must it be a greater-mistletoe identity
  given the PHB distinctions and the current task instruction that canonical
  default mistletoe is "greater mistletoe"? Also, may the DEC-2026-0025
  replacement preserve polarity_basis unset on rows 2665 and 2666 when Reviewer
  instructions prohibit approval of touched unset-polarity rows?
smallest_relevant_source_excerpt:
  phb_page_54: >-
    The religious symbol of druids is mistletoe. All druidic spells with a
    material component assume its use. Greater mistletoe is mistletoe properly
    harvested by the druid; lesser and borrowed mistletoe are separately named
    alternatives with reduced effects.
  phb_page_59: >-
    The packet heading directly reads "Call Woodland Beings", supporting the
    plural replacement already directed by DEC-2026-0025.
  canonical_rows_2665_2666: >-
    Both rows are legacy DMG assertions with polarity neutral and
    polarity_basis unset. DEC-2026-0025 directs only an identity replacement
    and preservation of non-identity fields.
