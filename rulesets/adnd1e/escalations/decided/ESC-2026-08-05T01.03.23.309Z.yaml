  - gen_random_encounter
options_considered:
  - option: Retain rule_mistletoe / Mistletoe as the default identity
    assessment: >-
      conflicts with the current task instruction that canonical/default
      mistletoe is greater mistletoe and leaves the source's graded component
      terms unresolved.
  - option: Use rule_greater_mistletoe / Greater Mistletoe as the default identity
    assessment: >-
      matches the stated canonical default and the PHB's explicit definition of
      properly harvested greater mistletoe; the Builder would revise only the
      pending node addition and ensuing packet references.
  - option: Register generic, greater, lesser, and borrowed identities now
    assessment: >-
      overbroad for this migration because only the default identity is at
      issue; separate identities require a new, fully bounded packet proposal.
  - option: Preserve unset polarity bases during the spelling migration
    assessment: >-
      conflicts with Reviewer approval prohibition; reading the unclaimed DMG
      text is not available as a substitute.
  - option: Authorize a deterministic non-source polarity-basis normalization
    assessment: >-
      could permit the identity migration while preserving polarity values, but
      changes a field DEC-2026-0025 currently requires preserved.
recommended_resolution: >-
  Direct the pending migration to use rule_greater_mistletoe / Greater
  Mistletoe as its canonical/default addition, preserve the approved plural
  spell replacement, and state whether the two touched neutral/ unset legacy
  rows must be held for source audit or may be normalized to a deterministic
  basis without changing their polarity values.
