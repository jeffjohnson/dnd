options_considered:
  - option: Approve r02 exactly as emitted.
    disposition: rejected
    reason: >-
      It corrupts row 3283's source label and violates the categorical polarity
      approval rules on 20 touched rows.
  - option: Return only a mechanical Builder correction.
    disposition: insufficient
    reason: >-
      Builder can mechanically put Taunt on target_label, but doing so contradicts
      the literal approved Decision. Builder also lacks authority and source
      analysis to resolve 20 authored polarities.
  - option: Create a decision-migration exception for preserved polarity fields.
    disposition: not_recommended
    reason: >-
      This would weaken GRAPH_INVARIANTS 15-16 and the Reviewer's field-by-field
      approval boundary merely to pass legacy debt through a touched-row patch.
  - option: Architect erratum plus prerequisite polarity cleanup, then rebuild r02.
    disposition: recommended
    reason: >-
      This preserves the exact DEC-2026-0015/0016 migration promises and the
      existing no-heuristic/no-unset approval rule.

recommended_resolution:
  - >-
    Issue an Architect erratum or superseding Decision for DEC-2026-0015 that
    changes only row 3283's label-normalization field from source_label to
    target_label.
  - >-
    Authorize and route a prerequisite source-backed polarity cleanup for the 20
    listed rows. Analyst determines every authored polarity from source; Reviewer
    independently resolves the three current heuristic values and verifies all
    resulting read bases.
  - >-
    Integrate the approved polarity cleanup first, then have Builder emit the next
    revision of GUP-MIG-DEC-2026-0015-0016 against the new canonical checksum and
    corrected Decision authority. This lets DEC-2026-0016 remain an exactly
    nine-page-only migration.

