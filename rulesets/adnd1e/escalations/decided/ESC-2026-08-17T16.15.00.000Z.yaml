recommended_resolution: Direct the Integrator to implement the already mandated v2 direct-migration bundle path, including
  no-edge-CSV discovery, exact GUP/validation component verification, strict baseline and incident-set preconditions, and
  transactional application. After that implementation is available, Reviewer republishes the exact approved manifest against
  the then-current reviewed baseline; if the baseline moved, Builder reissues the plan first.
