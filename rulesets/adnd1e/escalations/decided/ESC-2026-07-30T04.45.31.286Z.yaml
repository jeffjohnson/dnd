# 7. -- identity and grain analysis -------------------------------------------
identity_analysis:
  evidence_for_mapping_to_rule_detection:
    - >-
      The canonical node's label is the unqualified Detection, and its current
      neighborhood already aggregates enemy detection, sword detection of traps,
      doors, metals and magic, rod detection powers, hostile intent, prior
      detection, and detectability of scrying.
    - >-
      Canonical row 2575 is especially close in grain: one source gates a bundle
      of trap, door, metal, and magic detection abilities through rule_detection.
      The PHB race descriptions similarly gate bundles of underground facts.
    - >-
      The PHB presents three parallel racial abilities but never names one shared
      rule called Racial Underground Detection. Mapping avoids establishing an
      Analyst-authored aggregate identity when an existing broad identity can
      carry the aspect and condition distinctions.
    - >-
      F6, F20, and F31 would remain distinct assertions because edge identity
      retains the race source and each row retains its reviewed condition and
      citation.
  evidence_for_a_distinct_rule_racial_detection:
    - >-
      All three source passages concern innate racial awareness of underground
      construction, orientation, or depth and require active seeking or
      concentration. That is a coherent subsystem boundary not represented in
      rule_detection's current neighborhood.
    - >-
      The registry already has specialized detection nodes where a procedure is
      separately named or resolved, so specialization is not forbidden by the
      ontology.
    - >-
      Keeping the PHB core mechanic separate would prevent optional UA rod powers
      and unrelated DMG detection devices from sharing one impact-analysis target.
  evidence_for_a_split:
    - >-
      The three races do not detect identical facts. Dwarves detect construction,
      shifting stonework, traps, slope and depth; gnomes detect unsafe surfaces,
      slope, depth and direction; qualifying halflings detect only slope and
      direction.
    - >-
      A single shared target therefore treats different bundles as one mechanic.
      If changes to individual detectable phenomena must produce distinct impact
      paths, the shared node is too coarse.
  reviewer_grain_judgment: >-
    Under the graph's current practice, the differing fact lists and probabilities
    can remain source-level detail while each race gates a detection procedure.
    The current rule_detection neighborhood already uses one target for heterogeneous
    detection bundles. The ambiguity is therefore identity policy, not a failure of
    source support or edge type.

# 8. -- options, duplicate impact, and migration impact ------------------------
options_considered:
  - option: A. Map F6, F20, and F31 to canonical rule_detection
    mechanism: >-
      Remove the proposed rule_racial_detection registry addition. Revise each
      affected row's target_id to rule_detection and target_label to Detection,
      preserving its aspect, condition, status, and reviewed citation.
    for:
      - Reuses the existing unqualified Detection identity as Constitution 3.2 prefers.
      - Matches canonical row 2575's use of rule_detection for a bundled detection power.
      - Adds no registry identity and requires no migration of existing rows.
      - Creates no exact edge duplicate; all three source/type/target triples are new.
    against:
      - Increases the semantic breadth of a node that already spans unrelated procedures.
      - Makes a change to generic detection reach innate racial senses, devices, swords, scrying, surprise, and optional rod powers.
    duplicate_impact:
      exact_collapses: 0
      near_duplicate_risk: >-
        No canonical race-to-rule_detection edge exists. The risk is coarse
        semantic aggregation, not duplicate row identity.
    migration_impact:
      existing_canonical_rows_repointed: 0
      proposed_registry_additions_removed: 1
      proposed_edges_retargeted: 3
      future_canonical_edges_added_after_approval: 3
      node_degree_after_integration: 10
      role_impact: gated_privilege remains derived

  - option: B. Register one distinct shared rule_racial_detection node
    mechanism: >-
      Approve the isolated rule_ node addition and retain F6, F20, and F31 at
      their proposed target with the Reviewer's citation corrections.
    for:
      - Keeps innate underground racial awareness separate from devices, spells, scrying, surprise, and optional rod powers.
      - Gives all three parallel PHB abilities one queryable subsystem target.
      - Uses an approved prefix and kind and creates no canonical row collision.
    against:
      - The shared name is analytic; the PHB states three race-specific abilities rather than one named common rule.
      - Queries for generic detection will not reach the new node unless a later taxonomy or relationship connects them.
      - The differing detected facts may make the shared node too coarse.
    duplicate_impact:
      exact_collapses: 0
      semantic_duplicate_risk: >-
        The new identity may duplicate the intended umbrella meaning of canonical
        rule_detection even though its label and incident triples are distinct.
    migration_impact:
      existing_canonical_rows_repointed: 0
      registry_additions: 1
      future_canonical_edges_added_after_approval: 3
      initial_registry_degree: 0
      derived_degree_after_integration: 3
      role_impact: gated_privilege would derive after integration

  - option: C. Split into one procedure node per race
    mechanism: >-
      Replace rule_racial_detection with three identities such as
      rule_dwarven_detection, rule_gnome_detection, and rule_halfling_detection,
      and map one reviewed row to each.
    for:
      - Mirrors the fact that each procedure is stated separately and detects a different bundle.
      - Avoids both the broad canonical umbrella and an unsupported shared racial rule.
    against:
      - Fragments one recurring procedure into race-prefixed copies and weakens cross-race impact analysis.
      - Creates three node identities where the present proposal needs one.
      - The exact IDs and labels would require Architect approval and a Builder revision.
    duplicate_impact:
      exact_collapses: 0
      semantic_duplicate_risk: >-
        The three nodes may encode race qualification in both the source endpoint
        and target identity.
    migration_impact:
      existing_canonical_rows_repointed: 0
      registry_additions: 3
      proposed_edges_retargeted: 3
      future_canonical_edges_added_after_approval: 3

  - option: D. Split by detectable phenomenon
    mechanism: >-
      Create separately reviewed identities for grade or slope, new construction,
      shifting walls or rooms, stonework traps, unsafe surfaces, underground
      depth, and underground direction, then replace the three aggregate rows with
      the applicable race-to-phenomenon edges.
    for:
      - Gives the most precise impact paths when one detectable fact changes.
      - Preserves the genuine differences among the dwarf, gnome, and halfling lists.
    against:
      - Expands three reviewed rows into eleven candidate edges and as many as
        seven new identities.
      - Existing rule_depth and rule_direction have unrelated meanings, so they
        cannot be silently reused.
      - Requires a new Analyst GUR because it is an interpretive expansion, then
        a new Builder GUP and independent Review.
    duplicate_impact:
      exact_collapses: 0
      semantic_duplicate_risk: >-
        Each proposed phenomenon identity must be checked independently against
        rule_detection, rule_traps, thief_find_remove_traps, campaign_construction,
        rule_depth, rule_direction, and other local candidates.
    migration_impact:
      existing_canonical_rows_repointed: 0
      possible_registry_additions: 7
      replacement_candidate_edges: 11
      upstream_gur_revision_required: true

  - option: E. Split or redefine canonical rule_detection before mapping
    mechanism: >-
      Audit all seven canonical incident rows, assign distinct detection identities
      where warranted, then decide where the three PHB race rows belong.
    for:
      - Repairs the generic node's existing label and grain drift rather than
        extending it or creating an unconnected specialization.
    against:
      - Broadens this packet decision into a canonical migration across DMG and UA
        source material not supplied to this Reviewer.
      - Requires source review for seven existing rows and a separate duplicate
        collapse audit after destination identities are known.
      - The PHB rows can be represented without first repairing the entire detection neighborhood.
    duplicate_impact:
      current_incident_triples_are_unique: true
      post_split_collapses: unknown_until_destinations_are_decided
    migration_impact:
      existing_canonical_rows_requiring_source_review: 7
      existing_books_touched: [DMG, UA]
      proposed_phb_rows_held: 3
      separate_migration_decision_required: true

# 9. -- Reviewer recommendation ------------------------------------------------
recommended_resolution: >-
  Option A. Map F6, F20, and F31 to canonical rule_detection and do not register
  rule_racial_detection. The complete canonical neighborhood shows that
  rule_detection already functions as the umbrella for heterogeneous bundled
  detection powers, including a sword's detection of traps, doors, metals, and
  magic. The PHB never names one shared racial-detection rule; the race source,
  aspect "underground detection", activation condition, and citation preserve the
  distinctions needed by these three assertions without minting another aggregate.

recommendation_confidence: >-
  Moderate. Mapping is the least expressive change and creates no duplicate or
  migration, but rule_detection is already semantically broad. If the Architect
  determines that the generic node's breadth is legacy drift rather than intended
  umbrella grain, Option B is the preferred fallback: one distinct shared PHB node,
  not three race-qualified copies.

recommended_exact_follow_up:
  builder:
    - Remove rule_racial_detection from node_changes.additions_proposed.
    - Retarget F6, F20, and F31 to rule_detection with target_label Detection.
    - Preserve the Reviewer's page corrections for F6 and F20.
    - Emit a new GUP revision and validation report; do not overwrite r03.
  reviewer:
    - Review the new GUP revision against this decision and the original packet.
    - Preserve the existing r03-r01 Review as the immutable origin of this escalation.
  integrator:
    - Apply only a later Approved CSV; do not mutate the registry or canonical graph from this pending package.

