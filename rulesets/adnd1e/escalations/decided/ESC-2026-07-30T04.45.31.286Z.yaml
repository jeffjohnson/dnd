trigger: >-
  ESCALATION_CONTRACT 1.1 and DEC-2026-0003 retain an irreducible identity
  ambiguity as Architect-blocking when a proposed node may duplicate or split a
  canonical identity. The proposed rule_racial_detection uses an approved prefix
  and kind, but its intended mechanic overlaps canonical rule_detection. Choosing
  either identity without a ruling could create duplicate identity, worsen the
  existing node's grain, or require later migration.

# 2. -- exact question ---------------------------------------------------------
question: >-
  Should PHB race rows F6, F20, and F31 map to canonical rule_detection; should
  rule_racial_detection be registered as a distinct shared node for innate racial
  underground detection; or should the source mechanics be split more narrowly?
  If a split is required, what identities should be created and what existing
  canonical rows, if any, must migrate?

why_it_needs_governance: >-
  The source support and edge semantics are reviewable under the current
  constitution, but target identity is not deterministic. Canonical rule_detection
  is intentionally or accidentally broad across several detection powers, while
  the proposed node would create a narrower analytic grouping not named as one
  shared rule by the PHB. Deciding whether that is reuse, a valid specialization,
  or a canonical split changes graph identity and future impact-analysis paths.

