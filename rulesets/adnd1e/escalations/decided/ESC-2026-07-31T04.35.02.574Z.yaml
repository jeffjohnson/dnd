  profile_references_changed: 0
  affected_artifacts:
    gurs:
    - GUR-PKT-PHB-018-033-classes-r02 and r03, refs M1 and M5
    - GUR-PKT-PHB-035-038-money-equipment-r02 through r04, spell_hold_person
    - GUR-PKT-PHB-009-013-ability-scores-r01, spell_petrification, excluded above
    gups:
