neighborhood_reconciliation:
  method: Incident edges were counted directly from rulesets/adnd1e/canonical/edges_master.csv by scanning
    source_id and target_id, with the row locator being the 1-based line number including the header,
    so it can be checked with any text editor.
  total_incident_edges_across_the_ten: 40
  registry_degree_vs_counted: agrees for every one of the ten
  note: DEC-2026-0013 asks that supplied counts reconcile against a deterministic report. The Builder
    is named as owner of that report; these counts are offered as the Analyst's reproducible figure, not
    as a substitute for it.
options_considered:
- option: ID governs
  description: Retain every specific-spell ID and correct labels, plus every row label that followed them.
  works_for:
  - spell_charm_person
  - spell_melfs_acid_arrow
  fails_for: Every node where a row is genuinely about a category or a condition. Applying it to spell_cure_light_wounds
    would turn a statement about curative magic in general into a statement about one first-level spell,
    which the source does not support. Applied to spell_taunt it would relabel eight rows about two other
    spells.
- option: Label governs
  description: Rename or migrate IDs so the current aggregate meanings stay authoritative.
  works_for: []
  fails_for: It would rename spell_cure_light_wounds to an aggregate and leave the ruleset with no node
    for the spell this packet describes, which is the opposite of what packet 10 needs. It cannot be applied
    to spell_taunt at all, because there are three competing labels and no basis for choosing one.
- option: Split
  description: Preserve the specific spell and mint the distinct aggregate or condition where both identities
    are demonstrated.
  works_for:
  - spell_esp
  - spell_cure_light_wounds
  - spell_fireball
  - spell_hold_person
  - spell_legend_lore
  - spell_confusion
  - spell_taunt
  cost: Seven new nodes and fifteen repointed edges, quantified below.
recommended_resolution:
  shape: per-node disposition, not one global rule
  why_one_global_rule_is_not_sufficient: spell_taunt settles it on its own. Its fourteen edges carry three
    different UA spells because two extraction batches with overlapping page ranges both minted onto one
    ID. No rule that chooses between an ID and a label can express a three-way split. Two nodes, spell_charm_person
    and spell_melfs_acid_arrow, are genuine ID-governs cases where nothing is repointed. Seven need a
    split. One, spell_imprisonment, has evidence too thin to decide and the Analyst recommends holding
    it rather than guessing.
  per_node:
    spell_charm_person: retain and relabel, per-row label correction
    spell_confusion: repoint one edge
    spell_cure_light_wounds: repoint the single edge, then relabel
    spell_esp: split
    spell_fireball: repoint both edges, then relabel
    spell_hold_person: split and repoint
    spell_imprisonment: insufficient evidence, hold
    spell_legend_lore: split
    spell_melfs_acid_arrow: retain and relabel
    spell_taunt: split into three
  sequencing: spell_cure_light_wounds and spell_hold_person are the only two that block extraction. They
    are also among the cheapest, one repointed edge and two respectively. If the Architect wishes to rule
    narrowly, ruling on those two alone unblocks packet 10 completely and the other eight can follow with
    the DMG and UA re-analysis.
