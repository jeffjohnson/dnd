question: For each spell_ node whose registry label contradicts its own ID, does the ID govern, does the
  label govern, or must the node be split? Constitution 3.1 says IDs determine identity, but the incident
  edges were written against the labels, so applying 3.1 mechanically would silently rescope existing
  assertions.
corrections_to_the_returned_package:
- item: the count
  prior_claim: 27 of 183 spell_ nodes diverge
  corrected: 32 diverge under an exact comparison of the ID stem against a slugified label. The prior
    figure of 27 was not reproducible and is withdrawn. The method is stated below so the Architect can
    recompute it.
  method: lowercase the label, map non-alphanumeric runs to underscores, trim, and compare with the ID
    minus its spell_ prefix.
- item: what actually needs a ruling
  prior_claim: 27 nodes need an identity ruling
  corrected: 21 of the 32 differ only by a possessive, a dropped stop word, a plural or a word form, for
    example spell_deaths_door labelled Death's Door. Those are cosmetic and need no governance. One more,
    spell_petrification, is excluded below. Ten nodes need a ruling.
- item: how much of packet 10 is blocked
  prior_claim: the packet is blocked on spell node identity
  corrected: 'Of the 29 packet-10 spells that match a canonical node, 27 match a node whose label agrees
    with its ID. Only two, Cure Light Wounds and Hold Person, rest on a divergent node. The packet was
    over-blocked and the Analyst says so plainly: 74 of its 76 spells can be extracted without this ruling.'
scope_exclusions:
- what: the 47 cleric spells with no canonical node
  why: Ordinary node additions under DEC-2026-0003, restated by DEC-2026-0013. They are Builder and Reviewer
    work and are deliberately not part of this question.
- what: spell_petrification
  why: Its label is the literal string spell_petrification and its single edge, canonical row 90, has
    blank source and target labels. That puts it in the 53-row defect set DEC-2026-0014 hands to the migration-pending
    ruleset. Excluded so one row does not acquire two owners.
- what: the 21 spelling-only divergences
  why: Listed in full below for completeness, but they carry no governance question.
