    note: No published artifact is rewritten by this escalation. These are the artifacts whose assertions
      would need rereading if a ruling changed the meaning of a node they cite.
  constitution_changes: false
  registry_schema_changes: false
  controlled_profile_changes: false
  why_no_contract_change: Constitution 3.1 already says IDs determine identity. The defect is that legacy
    data does not obey it, not that the rule is wrong or unclear. Nothing here asks for the rule to change.
why_it_blocks_extraction: Only for two spells, which is the correction this package makes to its predecessor.
  Publishing edges for Cure Light Wounds and Hold Person against nodes labelled Curative Spells and Held
  or Paralyzed would attach spell-specific assertions to identities the graph currently uses for a category
  and a condition. The remaining 74 spells of packet 10 do not depend on the answer.
analyst_position: 'Split for seven, ID governs for two, hold one. The evidence for that shape is in the
  per-node dossiers rather than in the recommendation, which is the thing the returned package was missing.
  Two further points the Architect should weigh. First, this is legacy-data damage rather than an ontology
  gap: every one of the ten is a node that was minted correctly and then had a second meaning written
  onto it by a later extraction batch. Second, the same overlap that produced spell_taunt may have produced
  others outside the spell_ prefix, and nothing in this package rules that out; a sweep of all prefixes
  for nodes whose incident rows disagree about their own label would be the cheap way to find out, and
  it is Builder work.'
blocking:
  blocks:
  - extraction of two of the seventy-six spells in PKT-PHB-043-054-cleric-spells
  does_not_block:
  - the other 74 spells of that packet
  - the 47 ordinary node additions
  - any other packet
