migration_required: false
migration_scope:
  canonical_edges_changed: 0
  canonical_nodes_changed: 0
  registry_rows_changed: 0
  existing_decisions_rewritten: 0
  retrospective_implementation_reports: 4
  retrospective_implementation_reviews: 4
  integrator_work: none

acceptance_tests:
  - ARTIFACT_LIFECYCLE declares version 1.3 and defines both implementation artifacts.
  - FILE_NAMING declares version 1.4 and defines both names and stores.
  - WORK_QUEUES declares version 1.4 and defines the complete non-migration lineage.
  - REPOSITORY_STRUCTURE names both ruleset-scoped append-only stores.
  - Both new common schemas are valid Draft 2020-12 schemas.
  - >-
    An unconsumed approved non-migration Decision with a ready Builder handoff
    produces exactly one Builder job.
  - >-
    A valid approval-ready active implementation report produces exactly one
    Reviewer job and suppresses the Decision's separate Builder job.
  - >-
    A partial report, including a six-of-thirteen spot-check, is not
    Reviewer-ready.
  - >-
    Missing or mismatched Decision IDs, paths, checksums, approval status,
    ruleset, handoff, migration flag, acceptance indices, file checksums, or
    validation results prevent Reviewer routing and leave the Decision as
    Builder work.
  - >-
    A revision-required implementation Review produces exactly one Builder
    revision job and no duplicate Decision job.
  - >-
    An Approved implementation Review with exact active-report and Decision
    provenance consumes the Decision and creates no Integrator job.
  - >-
    IMP reports for Decisions 0018, 0020, 0022, and 0023 each account for every
    acceptance test in their respective Decision exactly once.
  - >-
    Reviewer independently verifies every acceptance test in each of the four
    implementation lineages; Builder test summaries alone are insufficient.
  - The PowerShell and Python scanners remain equivalent.
  - The complete common schema and scanner suites pass.
  - No canonical graph, registry, GUR, GUP, Review, Approved, or prior Decision file changes.

constitution_version_impact:
  changed: false
  version: "1.7"
  reason: >-
    This changes universal workflow provenance and queue completion, not graph
    ontology, edge semantics, or ruleset data.

follow_up_owner: builder
follow_up_owners:
  builder:
    - Implement WORK_QUEUES 1.4 in the shared Python scanner.
    - Add common schema and queue acceptance tests.
    - Publish IMP reports for Decisions 0018, 0020, 0022, and 0023.
    - Account for all acceptance tests; do not submit partial spot-checks as ready.
  reviewer:
    - Independently review all four IMP reports against their immutable Decisions.
    - Publish one implementation Review per active IMP report.
  analyst: []
  integrator: []

prohibited_actions:
  - Do not edit Decisions 0018, 0020, or 0022 to record completion.
  - Do not infer completion from file content, version constants, or tests alone.
  - Do not let Builder self-approve an implementation report.
  - Do not combine several Decisions in one implementation report.
  - Do not create an Approved GUP or Integrator job for this lineage.
  - Do not alter canonical graph or registry files for this Decision.
  - Architect does not edit shared tooling implementation or tests.
