question: >-
  Which key is normative for a Reviewer row correction, what must the compiler
  do when an `approved_with_revision` row carries a correction it cannot read,
  and how are already-integrated rows whose corrections never applied
  reconciled?

ruling: >-
  `exact_corrections` is the sole normative executable correction key for an
  `approved_with_revision` entry in `edge_decisions` or `row_decisions`. It is
  a nonempty mapping directly on that row. `exact_correction`,
  `corrected_fields`, and `corrected_row` are not aliases and are never
  executable. A top-level `required_builder_revision.exact_corrections` list is
  likewise not a row correction and is prohibited in a new Review declaring
  Review-contract 1.2. Narrative and preservation requirements may remain at
  that top level, but every field value the compiler must apply belongs in the
  row-local mapping.

  Review-contract 1.2 makes that structure a publication requirement. The
  compiler must reject, with the ref and offending key, any 1.2
  `approved_with_revision` row that lacks a usable row-local
  `exact_corrections` mapping or carries one of the three non-normative keys.
  It must never guess, alias, or silently drop such a correction. The guard is
  version-scoped: published Reviews declaring 1.1 or omitting the field remain
  immutable historical evidence and are not retroactively reclassified solely
  by this grammar change.

  REV-GUP-PKT-PHB-094-100-illusionist-spells-r07-r02 is repaired by the direct
  Reviewer successor r03 under Review-contract 1.2. That successor restates
  M035, M036, and M070 under their row-local `exact_corrections` mappings and
  points `inherited_edge_decisions.from_review` to the direct rejecting Review,
  REV-GUP-PKT-PHB-094-100-illusionist-spells-r05-r05, not to its inheriting r06
  successor. Builder then compiles ordinary GUP r08 from r03; it must preserve
  the remaining r07 rows, six blocked rows, and nine direct inherited
  rejections.

  No historical correction is automatically applied to canonical data. Reviewer
  assesses the eight named historical Review artifacts against current packet
  evidence and current canonical state. A material, source-supported canonical
  discrepancy requires a new, scoped Architect escalation containing the exact
  source reading, current canonical rows, intended before/after state, and
  affected Integration provenance. A nonintegrated or still-active packet
  correction follows the ordinary 1.2 Review successor, GUP, Review, Approved,
  and Integration lifecycle. Neither Builder nor Integrator may infer a
  canonical migration from an unread legacy key.

rationale:
  - >-
    One exact machine-readable spelling prevents near-miss keys from producing
    a superficially successful but semantically incomplete GUP. Reading all
    variants would turn historic authoring mistakes into unreviewed canonical
    mutations and gives no principled answer when their structures conflict.
  - >-
    The Review schema previously constrained dispositions but not the required
    executable payload. Versioned opt-in validation protects every new Review
    without rewriting immutable pre-1.2 artifacts.
  - >-
    The two identified canonical rows differ from both the submitted and
    requested values. Materiality and source support are Reviewer judgments;
    a broad Builder replay would conflate an audit finding with authority to
    alter canonical data.

