acceptance_tests:
  - >-
    Review-contract 1.2 validates legal dispositions as before and additionally
    rejects an `approved_with_revision` edge or row decision with an absent,
    empty, or non-mapping `exact_corrections`; it rejects the direct aliases
    `exact_correction`, `corrected_fields`, and `corrected_row`, and rejects a
    top-level `required_builder_revision.exact_corrections` payload. A 1.1 or
    omitted-version historical Review remains schema-valid under its original
    contract treatment.
  - >-
    The compiler accepts a 1.2 row-local correction and applies it through the
    normal column and ownership validators. It rejects every missing or alias
    form with a deterministic diagnostic that names the row ref, observed key,
    and required `exact_corrections` key; it neither produces a GUP nor alters
    a component on failure.
  - >-
    REV-GUP-PKT-PHB-094-100-illusionist-spells-r07-r03 validates under Review
    contract 1.2, directly supersedes r02, applies only the stated M035, M036,
    and M070 corrections, and names r05-r05's exact ID and checksum for the
    inherited nine rejections. It does not name r05-r06 as their source.
  - >-
    Compiling r08 from r07-r03 applies the three required aspect and condition
    values, preserves every other r07 row and node proposal, preserves the six
    blocked rows, and preserves the nine rejected duplicate refs. The correction
    is emitted only through an ordinary checksummed GUP and Review lineage.
  - >-
    No current canonical row changes merely because an audit locates an unread
    legacy key. A material source-supported canonical discrepancy is actionable
    only through a new escalation and later exact correction lineage; all other
    historical artifacts remain immutable provenance.
  - >-
    IMP-DEC-2026-0062-r01 pins this Decision's checksum, reports every direct
    acceptance test passed with passing focused and full applicable validation,
    and is approval-ready for independent Reviewer verification. Historical
    audit and ordinary r08 lifecycle work do not block that Review.

post_implementation_requirements:
  - >-
    Reviewer performs the specified historical correction assessment without
    bulk rewriting old Reviews or current canonical data. Every material result
    is a new, independently complete escalation; it must not reuse this
    escalation ID.
  - >-
    Builder and Integrator do not infer a migration from the legacy aliases or
    use the audit count as an operation list.
  - >-
    Analyst has no work under this Decision.

