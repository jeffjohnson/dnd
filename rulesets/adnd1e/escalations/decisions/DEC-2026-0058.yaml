decision_date: '2026-08-23'
escalation_id: ESC-2026-08-23T22.56.50.647Z
decision_authoring_contract_version: '1.1'
reissue_reason: >-
  DEC-2026-0057's follow_up_owners incorrectly ordered a second Analyst repair
  of GUR-PKT-UA-015-015-cavaliers-r02. It overlooked DEC-2026-0039's existing
  r03 successor and the test-guarded historical exemption. This reissue changes
  no queue-policy ruling and no governance file; it corrects the executable
  worker instruction before implementation.

question: >-
  Does the intentionally invalid, superseded r02 GUR require another Analyst
  repair after DEC-2026-0039's valid r03 successor exists?

ruling: >-
  No. GUR-PKT-UA-015-015-cavaliers-r02 is immutable historical evidence of a
  handoff-only defect. DEC-2026-0039 required exactly one successor,
  GUR-PKT-UA-015-015-cavaliers-r03; that successor exists, supersedes r02, and
  has the conforming terminal handoff. The common-schema exemption deliberately
  retains r02 as invalid and verifies r03 as its valid successor. No role may
  publish r04 or otherwise attempt to repair r02 again.

  DEC-2026-0057's substantive ruling remains unchanged: after an exact valid
  Approved Decision Implementation Review consumes a report,
  versioned-contract-content evidence is historical snapshot evidence. Builder
  implements that rule under this active reissue. The three current malformed
  implementation Reviews are not valid Approved Reviews and therefore receive
  no snapshot exception until their ordinary replacement report and Review
  lineages validate.

rationale:
  - >-
    A successor can repair an immutable predecessor's workflow state only once.
    r03 already does so. A second r02 successor forks immutable lineage and a
    successor to r03 would add a semantically empty artifact without changing
    the historical exemption.
  - >-
    The exemption is explicit and narrow: it names only r02, permits only
    handoff invalidity, and requires r03 to validate. Treating it as current
    work contradicts both DEC-2026-0039 and its regression guards.
  - >-
    The three malformed Reviewer artifacts are current schema defects. They
    require Reviewer-owned successor Reviews, preceded by Builder reissues of
    their now-unapproved reports, not Analyst source or GUR work.

