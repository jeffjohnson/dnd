acceptance_tests:
  - >-
    The published-artifact exemption set remains exactly
    GUR-PKT-UA-015-015-cavaliers-r02.yaml; r02 remains invalid only in its
    handoff and r03 is its exact valid successor. No r04 is published.
  - >-
    The active DEC-2026-0058 contains no Analyst work and states that the UA
    lineage is resolved historical evidence; its only direct implementation
    owner is Builder and its only Review owner is Reviewer.
  - >-
    The DEC-2026-0057 approved versioned-contract-content snapshot rule remains
    implemented only after exact valid approval. Before that, the three named
    report lineages remain strict and require ordinary Builder and Reviewer
    successors.
  - >-
    IMP-DEC-2026-0058-r01 pins this Decision checksum, records passing focused
    exemption and queue tests, and is approval-ready for independent Reviewer
    verification without claiming any Analyst repair.

