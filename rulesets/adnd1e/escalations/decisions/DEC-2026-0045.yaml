migration_scope:
  canonical_data_change: false
  registry_change: false
  artifact_lineage_change: >-
    No canonical or registry migration occurs. DEC-2026-0043's implementation
    report is reissued in its ordinary immutable report lineage after the direct
    governance files exist.

sequence:
  - step: 1
    owner: architect
    action: >-
      Publish the four DEC-2026-0043 governance and role-instruction updates and
      the Architect authoring requirement, all with this Decision's exact path
      ownership recorded below.
  - step: 2
    owner: builder
    action: >-
      Add the versioned exact_diff_ownership structural rule to the Architect
      Decision schema and scanner, with tests for complete, missing, duplicate,
      unknown-owner, and sequence-mismatched plans. Publish the DEC-2026-0045
      implementation report and reissue DEC-2026-0043's report with the current
      checksums of every required code and governance file.
  - step: 3
    owner: reviewer
    action: >-
      Independently verify the ownership guard and the published governance text,
      then review each active implementation-report lineage under its normal
      Decision Implementation Review procedure.

acceptance_tests:
  - >-
    contracts/WORK_QUEUES.md is Version 1.12 and
    contracts/ARTIFACT_LIFECYCLE.md is Version 1.10; each records checksummed
    Integration rejection remediation and Builder-or-Integrator direct
    non-migration implementation ownership.
  - >-
    agents/integrator/INSTRUCTIONS.md requires a new rejection record to pin the
    rejected bundle, approving Review, reviewed GUP, checksums, and
    machine-readable failures; agents/reviewer/INSTRUCTIONS.md requires a
    checksummed rejection-consuming successor Review.
  - >-
    An Architect Decision declaring authoring contract version 1.1 validates only
    when its exact_diff_ownership entries have the required path and owner shape,
    and a fully owned plan with owners named in its sequence or follow_up_owners
    produces no ownership diagnostic.
  - >-
    A version-1.1 Decision with a missing, duplicate, unowned, unknown-owner, or
    sequence-mismatched exact_diff ownership entry is diagnostic and cannot be
    treated as approval-ready implementation work; an earlier Decision without
    the version declaration remains valid history.

post_implementation_requirements:
  - >-
    Builder must publish IMP-DEC-2026-0043-r03, superseding r02, after verifying
    the four Architect-published files alongside the already completed code-side
    files. Its implementation_files list is complete coverage evidence and does
    not claim Builder authorship of the governance files.
  - >-
    Reviewer must review the DEC-2026-0045 implementation report and the active
    DEC-2026-0043 report successor independently. Their ordinary approval
    records, not this Decision, complete the respective non-migration Decisions.

constitution_version_impact:
  changed: false
  retained: '1.8'
  rationale: >-
    This corrects workflow accountability and implementation provenance, not
    graph semantics.

