  - >-
    ARTIFACT_LIFECYCLE 1.10 records immutable rejection evidence and direct
    implementation ownership.
  - >-
    Integrator and Reviewer instructions state the corresponding rejection record
    and successor-Review duties.
  - >-
    Architect instructions require an explicit owner for every exact_diff path.

