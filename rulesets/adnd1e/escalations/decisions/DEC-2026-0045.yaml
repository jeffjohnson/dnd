escalation_id: ESC-2026-08-18T01.14.43.815Z
decision_authoring_contract_version: '1.1'

question: >-
  Who owns a file named by an Architect Decision's exact_diff when the Decision
  assigned it to no role, and how is that omission prevented before approval?

ruling: >-
  The Architect owns an unassigned exact_diff file that is a contract, role
  instruction, or other governance artifact. The omission in DEC-2026-0043 is
  corrected by publishing its four missing Architect-owned files with this
  Decision; DEC-2026-0043 itself remains immutable and is not reissued.

  Every future Decision declaring `decision_authoring_contract_version: '1.1'`
  and an `exact_diff` must list every exact_diff path exactly once in
  `exact_diff_ownership`. The recorded owner must be named by a sequence step or
  follow_up_owners entry. A direct Architect change is an explicit Architect
  sequence step. The schema validates the ownership entry shape and queue tooling
  diagnoses missing, duplicate, unknown-owner, and sequence-mismatched entries;
  an invalid plan cannot be reported approval-ready. Historical Decisions that do
  not declare the new authoring-contract version remain valid immutable history.

  An implementation report may list a file an earlier Architect step published
  when it verifies complete, checksummed Decision coverage. That listing does not
  transfer ownership or authority to the report's Builder or Integrator author.

rationale:
  - >-
    Contracts and role instructions establish inter-agent authority, so their
    author must be explicit. Builder cannot repair a missing Architect assignment
    by writing rules for Integrator or Reviewer.
  - >-
    DEC-2026-0043's rejection lifecycle and direct implementation-owner behavior
    are already independently verified in code. The absent governance text is a
    planning defect, not a reason to discard that work or rewrite its immutable
    Decision.
  - >-
    A path-by-path ownership list makes the previous ambiguity mechanically
    detectable without using timestamps, inferred competence, or chat history.

