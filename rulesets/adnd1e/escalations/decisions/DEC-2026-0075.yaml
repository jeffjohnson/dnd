question: >-
  Is the disclosed Bards fixture repair a sufficient durable record for an
  Integrator-owned test-only correction, and what standing guard must prevent a
  fixture from passing only because it assumes a transient corpus state?

ruling: >-
  The disclosed repair is accepted as an Integrator-owned test-fixture correction
  under the existing integration authority. It changes no production applier,
  source assertion, Approved bundle, registry, or canonical data. This Decision
  and its decided escalation are the durable record for that completed repair;
  no retrospective Decision Implementation Report is required for the already
  executed exact changes.

  A new explicit regression guard is required. Integrator must prove that a
  partial fixture rewind closes over every integrated packet bundle whose rows
  reference an identity retired by a rewound migration. It must prove the
  resulting clone has no endpoint lacking a registry identity and can execute
  the migration fixture's normal verification path. The existing Bards-leaf
  test is retained as the complementary guard: it derives the current leaf and
  accepts a live `ready` or `integrated` bucket, never a fixed transient bucket.
  This new guard is prospective work and therefore requires an ordinary Decision
  Implementation Report and independent Review.

rationale:
  - >-
    The transaction manifest and validation report show a clean authorized Bards
    integration. The failure occurred only in clones after their own partial
    rewind removed a registry identity still referenced by an integrated bundle.
  - >-
    Integrator owns test fixtures and must be able to repair them while executing
    an authorized transaction. Requiring a retroactive Decision for that repair
    would misstate its authorization and delay confirmation of canonical state.
  - >-
    A named dependency-closure test detects the causal condition directly,
    instead of depending on a collection of unrelated tests to fail together.

