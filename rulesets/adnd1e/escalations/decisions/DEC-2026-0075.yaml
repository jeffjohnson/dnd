sequence:
  - step: 1
    owner: architect
    action: >-
      Publish this Decision and move the escalation to decided state. Preserve
      the Bards integration and disclosed current fixture-repair bytes.
  - step: 2
    owner: integrator
    action: >-
      Add the named dependency-closure regression guard using a clone of current
      repository state. Publish IMP-DEC-2026-0075-r01 with focused and full
      Integrator-suite evidence.
  - step: 3
    owner: reviewer
    action: >-
      Independently review the report and verify the new test proves closure
      rather than a fixed canonical count, queue bucket, or fixture-specific
      hardcoded leaf revision.

acceptance_tests:
  - >-
    A focused test constructs the current partial migration-fixture rewind from
    the integrated corpus, rewinds a migration that retires
    item_pipes_of_sewers, and proves the Bards r04 dependent bundle is rewound
    as required for closure. The clone has no edge endpoint without a registry
    identity and the normal migration-fixture verification succeeds.
  - >-
    The test derives dependency from the clone's actual bundle rows and retired
    registry identities. It does not pass by pinning a pre-integration edge or
    registry count, by naming a fixed Bards leaf revision, or by allowing an
    invalid clone to skip verification.
  - >-
    test_the_current_leaf_reaches_a_live_bucket derives the Bards leaf from
    manifest lineage, rejects the withheld historical bundle, and accepts only
    `ready` or `integrated` as live outcomes. It does not assert that a completed
    bundle remains in `ready`.
  - >-
    The focused fixture tests and the full Integrator suite pass. The report
    records their commands, exit codes, results, and the exact implementation
    file checksums without modifying canonical data.
  - >-
    IMP-DEC-2026-0075-r01 pins this Decision checksum, reports every acceptance
    test as passed, and is approval-ready for independent Reviewer verification.

post_implementation_requirements:
  - >-
    An Integrator fixture that reads live corpus state asserts an invariant that
    survives a successful authorized integration, not a pre-integration count,
    fixed queue bucket, or fixed active revision unless that state is itself the
    invariant under test.
  - >-
    This Decision does not retroactively convert the disclosed fixture repair
    into a canonical defect or invalidate INT-20260830-001.

