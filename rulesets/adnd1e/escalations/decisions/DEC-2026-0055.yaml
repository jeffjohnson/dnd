question: >-
  How should queue derivation classify a stale decision-migration leaf when
  its Decision work was integrated through another lineage, or when a later
  Decision explicitly retires the leaf pending a separately governed source
  prerequisite?

ruling: >-
  Do not reissue either reported stale migration. DEC-2026-0016 was completed
  by the exact integrated page-only lineage: GUP-MIG-DEC-2026-0016-PAGE-r01
  was approved and INT-20260804-002 applied its nine page revisions. The
  current canonical pages are therefore evidence of a completed migration, not
  an unplanned result needing a fresh GUP.

  DEC-2026-0024 was completed by the later integrated combined lineage
  GUP-MIG-DEC-2026-0024-0025-r05. That GUP checksums DEC-2026-0024 as
  authority, and INT-20260814-001 records its approved bundle, removal, and
  registry outcome. Its `rule_greater_mistletoe` identity is the later
  DEC-2026-0026 refinement of the original mistletoe work. The obsolete
  single-Decision GUP-MIG-DEC-2026-0024-r01 is historical and must not be
  replanned.

  GUP-MIG-DEC-2026-0015-0016-r03 is explicitly retired as historical. It is
  neither integrated nor satisfied. DEC-2026-0021 already prohibited a reduced
  r04 and established the separate `MIG-DEC-2026-0015-IDENTITY` lineage,
  blocked until the required DMG and UA source-read polarity cleanups exist and
  integrate. Current canonical row positions, legacy before-images, and an
  apparent offset are not a substitute for that source prerequisite. No actor
  may re-enumerate or publish the 0015 identity migration now.

  Queue tooling must distinguish these exact, checksummed retirement records
  from an ordinary stale migration. A malformed, checksum-mismatched, inactive,
  or incomplete retirement record remains diagnostic and leaves the normal
  Builder reissue signal visible. The rule changes queue classification only;
  it does not alter the retired GUPs, Decisions, source evidence, registry, or
  canonical graph.

rationale:
  - >-
    A canonical end state alone cannot prove which approved work produced it.
    The exact Integration manifests do prove the completed 0016 and 0024
    outcomes, so regenerating those migrations would duplicate completed work.
  - >-
    DEC-2026-0021 deliberately separated page corrections from the unresolved
    identity migration and made the latter source-gated. Replacing that gate
    with a positional row inference would reintroduce the source-provenance
    exception it expressly rejected.
  - >-
    Explicit, checksummed cross-lineage retirement lets the scanner report
    historical artifacts accurately without treating arbitrary later GUPs or
    changed canonical bytes as implied consumption.

