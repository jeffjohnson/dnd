sequence:
  - step: 1
    owner: architect
    action: >-
      Publish this Decision; version the queue and lifecycle contracts; add the
      structured retirement-record schema; and close the escalation. Do not
      rewrite GUP-MIG-DEC-2026-0015-0016-r03, GUP-MIG-DEC-2026-0024-r01, any
      Decision, or any integrated artifact.
  - step: 2
    owner: builder
    action: >-
      Update the scanner to validate active approved Decisions'
      migration_lineage_retirements. It must classify the two exact leaves
      above as informational history, retain a real unretired stale migration
      as a Builder reissue diagnostic, and publish IMP-DEC-2026-0055-r01 with
      focused schema and queue-test evidence.
  - step: 3
    owner: reviewer
    action: >-
      Independently review IMP-DEC-2026-0055-r01. Verify both exact retirement
      outcomes, all checksum and active-Decision negative cases, and that no
      current source-gated DEC-2026-0015 work is silently marked complete.

acceptance_tests:
  - >-
    WORK_QUEUES Version 1.20 or later permits an active approved Decision to
    retire only an exact current decision-migration leaf through a checksummed
    retirement record; a malformed record leaves ordinary stale-work handling
    unchanged.
  - >-
    ARTIFACT_LIFECYCLE Version 1.16 or later preserves a retired
    decision-migration leaf as immutable historical evidence and distinguishes
    retirement from completed canonical work.
  - >-
    schemas/common/architect-decision.schema.json accepts both legal
    retirement dispositions only with their required exact artifacts, and
    rejects a missing current leaf, malformed checksum, or a
    consumed-by-integrated-successor record without its successor and manifest.
  - >-
    The scanner classifies GUP-MIG-DEC-2026-0015-0016-r03 as informational
    retired history, not a Builder reissue; it classifies
    GUP-MIG-DEC-2026-0024-r01 as informational consumed-by-successor history;
    and an otherwise equivalent unretired stale GUP remains an error that
    requests a Builder reissue.
  - >-
    IMP-DEC-2026-0055-r01 pins this Decision's exact checksum, reports every
    direct acceptance test as passed with current evidence, records passing
    focused scanner and schema tests, and is approval-ready for independent
    Reviewer verification.

acceptance_test_semantics:
  - acceptance_test_index: 1
    kind: versioned_contract_content
    contracts:
      - path: contracts/WORK_QUEUES.md
        minimum_version: '1.20'
        substantive_anchors:
          - decision-migration retirement record
          - exact current leaf
          - malformed retirement leaves ordinary stale-work handling unchanged
  - acceptance_test_index: 2
    kind: versioned_contract_content
    contracts:
      - path: contracts/ARTIFACT_LIFECYCLE.md
        minimum_version: '1.16'
        substantive_anchors:
          - immutable historical evidence
          - retirement is not completed canonical work
          - checksummed successor and integration evidence

post_implementation_requirements:
  - >-
    DEC-2026-0015 remains source-gated exactly as DEC-2026-0021 requires. The
    future MIG-DEC-2026-0015-IDENTITY migration starts only after its named
    DMG and UA source-read polarity work is Approved and integrated.
  - >-
    DEC-2026-0016 and DEC-2026-0024 require no successor GUP, Review, or
    Integration. Their exact existing Integration evidence remains terminal.
  - >-
    INT-20260820-001 has already consumed the 0050 bundle. The stale suite
    assertion described in the escalation is historical and must not block new
    Builder publication.

