decision_date: "2026-07-31"
escalation_id: null
decision_basis:
  type: direct_architect_interpretation
  source_artifact: GUR-PKT-PHB-043-054-cleric-spells-r02
  source_item: IDQ-14

question: >-
  When individual spell descriptions explicitly scale effects with caster
  experience level, are those dependencies represented per spell or only
  through a spell aggregate?

ruling: >-
  Record one exp_level MODIFIES spell_<id> candidate for each spell whose own
  description explicitly makes an effect scale with caster experience level.
  Preserve the dependency but omit all numeric values and formulas. Do not infer
  the edge for other spells and do not collapse the selective set to a
  spell-aggregate edge.

rationale:
  - >-
    Constitution section 2 excludes magnitudes, not mechanical dependencies.
    exp_level changing a spell effect is the same representational class as an
    ability changing a combat mechanic: omit the formula while MODIFIES preserves
    the impact relationship.
  - >-
    Only fourteen of seventy-six spells in this packet state the dependency. An
    aggregate edge would imply broader scope and prevent impact analysis from
    identifying which spells actually depend on experience level.
  - >-
    The Analyst determines which descriptions qualify and authors MODIFIES
    polarity. The Reviewer verifies each resulting assertion against source.

affected_contracts_and_registries:
  contracts:
