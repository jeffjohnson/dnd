question: >-
  Where is a confirmed no-graph-content printed page recorded when it falls
  outside every immutable claimed packet span?

ruling: >-
  Record this singleton exception in this Decision and its decided escalation,
  not in an immutable packet, GUR successor, registry, or new coverage ledger.
  The exact tuple adnd1e / phb / phb-legacy-unspecified / printed page 121 is
  closed: the repository source steward confirmed that the page is a two-image
  Planes of Existence diagram with no graph-constitutable content. No edge,
  node, domain, general rule, citation, or source packet is owed for that page.

  Until a later Decision creates a reusable coverage-record contract, a worker
  or coverage check finding an uncovered printed page must first consult
  approved Decisions for an exact coverage_exceptions entry. An exact tuple
  match is closed and must not be re-raised; no near match, inferred section,
  or page-range match is an exception. Every other uncovered page remains a
  source-intake or coverage issue. A second confirmed no-content page outside
  its claimed packet span must be escalated before anyone creates a shared
  ledger or registry structure.

coverage_exceptions:
  - ruleset_id: adnd1e
    book_id: phb
    source_id: phb-legacy-unspecified
    printed_page: 121
    disposition: no_graph_constitutable_content
    confirmed_by: repository_source_steward
    confirmed_on: '2026-09-05'
    subject: two-image Planes of Existence diagram
    evidence_escalation_id: ESC-2026-09-05T23.03.11.000Z

rationale:
  - >-
    PHB 121 is the sole uncovered page in the current claimed coverage of
    printed pages 1 through 122. The immediate neighboring packets cover 120
    and 122, while the immutable PHB 120 packet explicitly ends at its p120
    marker.
  - >-
    The PHB 108 precedent belongs inside its covering packet: that page was
    already within the 100-109 packet span and its intake manifest could carry
    the steward's note. Reopening the integrated PHB 120 lineage merely to add
    a documentary note would create a no-op pipeline cycle and make the
    integrated GUP rest on a superseded GUR.
  - >-
    One exact exception does not justify a new mutable registry or coverage
    artifact class. The Decision is an append-only, checksummed governance
    record and is sufficient without expanding the schema surface.

