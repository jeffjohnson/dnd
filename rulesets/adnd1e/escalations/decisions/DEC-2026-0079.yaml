    coverage exception without treating any other uncovered page as closed.
  - >-
    PKT-PHB-120-120-planes-of-existence and
    GUR-PKT-PHB-120-120-planes-of-existence-r03 retain the checksums recorded
    in this Decision. No successor GUR is created for the documentary fact.

