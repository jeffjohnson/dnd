  - step: 2
    owner: integrator
    action: >-
      Implement support for only the fixed
      `governing_direct_predecessor_repair_record` form. Pin and re-derive
      DEC-2026-0068's record before traversal; preserve the existing Druid
      delegation form; emit informational versus fatal state without a
      traceback; and publish IMP-DEC-2026-0069-r01.
  - step: 3
