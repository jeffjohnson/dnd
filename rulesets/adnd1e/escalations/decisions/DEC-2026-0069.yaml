      Independently review IMP-DEC-2026-0069-r01. Verify both exact admission
      forms, all Bards denial cases, no recovered r02 content, and no canonical
      transaction during fatal admission.

acceptance_tests:
  - >-
    With active DEC-2026-0068 at its pinned checksum and its complete live
    record, `ready_queue` returns without raising, reports exactly one
    historical_unreadable_review notice naming Bards r02 and DEC-2026-0068,
    has no fatal admission diagnostic, and offers only the normal r03 Approved
    bundle for the Bards lineage.
  - >-
    An absent, inactive, checksum-mismatched, missing, malformed, or wrong-
    field DEC-2026-0068 record; a changed pin; parseable r02; wrong parser
    fragment; broken r03 or bundle supersession; changed r01, r03, bundle, GUP,
    rejection, component, node count, or operation partition; or schema-invalid
    r03 Review or bundle yields review_yaml_unreadable, no ready bundles, exit
    code 2 for queue and every integrate form, and no transaction invocation.
  - >-
    DEC-2026-0065's Druid two-hop delegation remains independently admitted
    under its existing fixed governing_repair_record, while every other
    unreadable Review remains fatal. No code accepts a self-delegating record
    or an arbitrary field selected from a Decision.
  - >-
    Existing ordinary bundle discovery, rejection handling, integrated and
    superseded buckets, named-bundle dry runs, and rollback semantics remain
    unchanged when there is no fatal admission diagnostic.
  - >-
    IMP-DEC-2026-0069-r01 pins this Decision checksum, records passing focused
    and full applicable Integrator-suite evidence, reports every direct test as
    passed, and is approval-ready for independent Reviewer verification.

post_implementation_requirements:
  - >-
    Integrator processes only APPROVED-GUP-PKT-PHB-117-119-bards-r04-r03 through
    normal bundle verification and the ordinary transaction lifecycle after the
    direct implementation Reviews are approved. This Decision authorizes no
    canonical or registry write by itself.
  - >-
    A later unreadable Review requires its own checksummed Architect record and
    may not reuse this Decision by analogy.

