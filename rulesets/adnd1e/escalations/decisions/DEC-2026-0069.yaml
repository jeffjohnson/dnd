question: >-
  How must Integrator admit only the checksummed Bards r03 bundle when its r02
  Review is immutable unreadable direct-predecessor history?

ruling: >-
  Integrator may omit REV-GUP-PKT-PHB-117-119-bards-r04-r02 from Review parsing
  only after it independently validates DEC-2026-0068's active
  `review_direct_predecessor_repairs[0]` record in full. The delegation pins
  DEC-2026-0068 by its final checksum, so this Decision does not delegate to
  itself. The admission implementation must accept precisely the r02 parse
  failure, r03 Review, r03 Approved manifest, r01 parent, r04 GUP,
  INT-20260827-001 rejection, 57-row component, eleven node registrations, and
  29 additions plus 28 pending additions pinned in that record.

  A valid direct-predecessor record produces one informational
  `historical_unreadable_review` notice and otherwise permits normal processing
  of APPROVED-GUP-PKT-PHB-117-119-bards-r04-r03. The unreadable r02 bytes are
  checked only for their hash and expected parser failure; their content is
  never recovered or interpreted. Any unrecognized unreadable Review or any
  failed Bards prerequisite is fatal: queue and every integrate form return
  exit code 2 without a traceback, ready bundles are empty, and neither a dry
  run nor a canonical transaction starts.

rationale:
  - >-
    DEC-2026-0068 establishes the exact evidence shape for the one Bards
    direct-predecessor lineage. Integrator must validate it independently rather
    than trust the common scanner's result.
  - >-
    A delegation Decision can pin a predecessor Decision checksum. A single
    self-delegating Decision could not: it would require its own final hash
    before its content was complete.
  - >-
    The exception is data-specific and fail-closed. It does not convert a
    serialization defect into an approval or broaden admission for another
    packet.

