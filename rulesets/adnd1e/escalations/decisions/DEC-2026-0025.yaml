prohibited_actions:
  - Do not reuse spell_call_woodland_being for Call Woodland Beings.
  - Do not retain spell_call_woodland_being as an alias, duplicate, or zero-degree registry node.
  - Do not apply the old Review's singular L11 correction.
  - Do not let legacy canonical data overrule a direct name in the current packet.
  - Do not infer a cross-packet name conflict without a direct packet source.
  - Do not alter GUR, GUP, Review, registry, canonical, or tooling files outside role ownership.
