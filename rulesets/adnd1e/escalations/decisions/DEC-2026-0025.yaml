builder_implementation_requirements:
  planner_extension: >-
    Extend the decision-migration planner to consume canonical_migration.
    node_id_replacements. It must validate the retiring registry row, add the
    replacement node, retire the legacy node, require every incident canonical
    endpoint to be explicitly enumerated, and reject a plan that leaves the
    retired ID in a canonical endpoint or produces an assertion-key duplicate.
  gup_shape: >-
    The combined decision-migration GUP records both Decisions as exact,
    checksummed authority inputs; one spell-node addition; one spell-node
    retirement; DEC-2026-0024's one row removal; and these three endpoint/label
    repoints with complete before-state. The Integrator alone applies registry
    and canonical mutations.
  compatibility: >-
    Existing Decisions without node_id_replacements remain unchanged. The new
    planner behavior is additive and does not reinterpret their migrations.
  source_contract_test: >-
    Update the existing SOURCE_MARKDOWN authority test for version 1.2 and make
    it assert the new direct source-identity authority section rather than
    preserving an obsolete 1.1 version literal.

