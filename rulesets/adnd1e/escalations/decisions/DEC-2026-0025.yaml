  retired_label: Call Woodland Being
  canonical_id: spell_call_woodland_beings
  canonical_label: Call Woodland Beings
  kind: spell
  registry_action: replace_one_row
  alias_action: prohibited
  source_authority: PHB 59, Call Woodland Beings

