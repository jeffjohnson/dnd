question: >-
  When the current PHB druid-spells packet directly names the spell "Call
  Woodland Beings," does its plural source identity control over the legacy
  canonical singular spell_call_woodland_being and the Review instruction to
  reuse that singular ID?

ruling: >-
  Yes. spell_call_woodland_beings, label Call Woodland Beings, is the one
  canonical identity. spell_call_woodland_being and label Call Woodland Being
  are incorrect legacy forms and must be replaced, not retained as an alias or
  reused as a duplicate identity. The current incoming packet and its immutable
  claimed copy are authoritative for direct source naming. This ruling supersedes
  only DEC-2026-0024's reference to the singular spell_call_woodland_being
  correction; every mistletoe ruling in DEC-2026-0024 remains unchanged.

rationale:
  - >-
    The claimed PHB packet directly heads the spell "Call Woodland Beings" at
    PHB 59. Its GUR and GUP use the corresponding plural ID and label.
  - >-
    The singular node exists only in legacy canonical data citing unpacketized
    DMG material. It cannot override direct, current packet source naming.
  - >-
    Retaining both spell IDs would create duplicate identities for one named
    spell. Retaining the singular as an alias would preserve an explicitly
    incorrect canonical spelling and let later work regress to it.
  - >-
    This applies the existing spell_ prefix and node kind. No new ontology,
    prefix, kind, edge type, or evidence class is needed.

source_identity_policy:
  contract: contracts/SOURCE_MARKDOWN.md
  version: "1.2"
  rule: >-
    The current incoming packet, and then its immutable claimed copy, is
    canonical for directly stated source identity: spelling, grammatical number,
    source label, and canonical ID stem. Legacy canonical data cannot overrule
    it. Cross-packet direct-name conflicts remain Architect work.

