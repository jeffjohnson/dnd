    owner: builder
    action: >-
      Extend the decision-migration planner and tests for exact node-ID
      replacements without changing existing Decision behavior.
  - step: 2
    owner: builder
    action: >-
      Emit GUP-MIG-DEC-2026-0024-0025-r01 in lineage
      MIG-DEC-2026-0024-0025 with both checked Decision inputs, the then-current
      canonical baseline, the mistletoe operations from DEC-2026-0024, and this
      exact spell-ID replacement.
  - step: 3
    owner: reviewer
    action: >-
      Independently verify both Decision operations, the PHB 59 plural heading,
      all three enumerated endpoint repoints, node retirement, no retained alias,
      and no unrelated canonical or registry change.
  - step: 4
    owner: integrator
    action: >-
      Integrate only the Approved combined migration, then rebuild canonical
      nodes, edges, graph JSON, and derived roles.
  - step: 5
    owner: reviewer
    action: >-
      Publish Review r01-r02 after integration. It supersedes the prior Review,
      records both Decisions and Integration provenance, retains L11 as plural,
      and returns the remaining exact GUP corrections to Builder.
  - step: 6
    owner: builder
    action: >-
      Publish GUP-PKT-PHB-054-064-druid-spells-r02 against the integrated
      registry. It references spell_call_woodland_beings and proposes no duplicate
      node addition.

acceptance_tests:
  - SOURCE_MARKDOWN declares version 1.2 and the direct packet identity rule.
  - Every role instruction explicitly states current incoming/claimed packet authority.
  - >-
    The Builder planner accepts an exact node_id_replacements entry, enumerates
    its node add/retirement and endpoint changes, and rejects unenumerated
    incident endpoints, a missing retiring node, a retained endpoint, or a
    duplicate assertion key.
  - Existing migration-planner tests and Decisions without node_id_replacements remain valid.
  - >-
    One GUP with lineage_id MIG-DEC-2026-0024-0025 has exact checked authority
    inputs for DEC-2026-0024 and DEC-2026-0025.
  - >-
    The combined migration adds rule_mistletoe, removes exact canonical row 1502,
    replaces exactly one spell registry identity, and repoints exactly rows 2664,
    2665, and 2666.
  - No canonical registry or edge endpoint retains spell_call_woodland_being.
  - No canonical node or registry entry uses Call Woodland Being as the spell label.
  - Every changed endpoint label is Call Woodland Beings and every non-identity field is preserved.
  - The migration produces no duplicate five-field assertion key.
  - >-
    The r01-r02 Review and packet r02 preserve L11 as
    spell_call_woodland_beings / Call Woodland Beings.
  - All applicable schema, graph, registry, lineage, and repository tests pass.

