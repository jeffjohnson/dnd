follow_up_owner: repository_source_steward
follow_up_owners:
  repository_source_steward:
    - Acquire and provide lawful DMG and UA source material as bounded incoming packets.
    - Do not create source text from recall or inference.
  analyst:
    - Do not act on the superseded Review handoff.
    - Resume the sixteen source-read GURs only after claimed packets cover the listed loci.
  builder:
    - Do not assign source acquisition or source authoring to Analyst.
    - Resume only after the sixteen Analyst GURs are published.
  reviewer:
    - Do not publish a routing-only r02 for the frozen r03 Review.
    - Review the later source-backed cleanup under DEC-2026-0021.
  integrator:
    - Do not alter the sixteen assertions until their cleanup bundles are Approved.

prohibited_actions:
  - Do not edit, rename, move, delete, or approve GUP-MIG-DEC-2026-0015-0016-r01 through r03.
  - Do not edit or supersede REV-GUP-MIG-DEC-2026-0015-0016-r03-r01 merely to change its stale handoff.
  - Do not route source acquisition or source-text creation to Analyst, Builder, Reviewer, or Integrator.
  - Do not fabricate DMG or UA packet text or mark an unread assertion as polarity_basis read.
  - Do not alter the sixteen deferred canonical assertions before claimed source supports them.
  - Architect does not edit canonical graph, registry, GUR, GUP, Review, Approved, or Integration artifacts.
