    - builder: compile polarity-only packet-update GUPs
    - reviewer: independently verify read-based polarity
    - integrator: integrate Approved cleanup bundles
    - builder: emit MIG-DEC-2026-0015-IDENTITY-r01 under DEC-2026-0021

