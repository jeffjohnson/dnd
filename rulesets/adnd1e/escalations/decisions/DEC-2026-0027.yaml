    originating Review ID and repository path match stale_handoff_disposition.
  - >-
    The queue scanner suppresses the Analyst item derived from
    REV-GUP-MIG-DEC-2026-0015-0016-r03-r01 and creates no replacement work item
    for DEC-2026-0027.
  - >-
    REV-GUP-MIG-DEC-2026-0015-0016-r03-r01 remains byte-identical and no
    routing-only r02 is published.
  - >-
    SOURCE_MARKDOWN names the external repository source steward, states that
    no pipeline role acquires or invents source text, and keeps source intake
