  reviewer_r02: not_required_and_not_authorized_for_routing_only_supersession
  queue_result: >-
    Suppress only the ready Analyst item derived from this exact Review ID and
    path. Do not suppress independently ready source packets, GURs, GUPs,
    Reviews, Decisions, or external source-intake work.

external_source_intake:
  owner: repository_source_steward
  owner_definition: >-
    The repository owner or explicitly delegated external operator. This is an
    external repository responsibility, not a pipeline role, semantic role, or
    queue item.
  required_books: [DMG, UA]
  required_loci:
    dmg_pages: ["57", "78", "104", "127", "133", "137", "173"]
    ua_pages: ["53", "54", "82"]
  intake_requirement: >-
    Supply bounded incoming source packets whose source text and packet metadata
    conform to SOURCE_MARKDOWN. A packet becomes Analyst input only after it is
    available under the normal incoming-packet process and is then claimed.
  prohibited_substitutes:
    - reconstructed prose from memory or inference
    - legacy canonical rows or migration before-images
    - endpoint names or existing polarity values
    - Reviewer or Builder conjecture
  resumption_condition: >-
    Claimed bounded DMG and UA Markdown packets cover every listed locus. Analyst
    then publishes source-read polarity GURs for all sixteen stable assertion
    keys under DEC-2026-0021.

deferred_assertions:
  count: 16
  books: {DMG: 8, UA: 8}
  canonical_rows: [1702, 1984, 2065, 2066, 2122, 2215, 2273, 2612, 2902, 2903, 2904, 2905, 2906, 3147, 3283, 3498]
  current_state: standing_evidence_debt
  permitted_changes_before_source: none
  later_pipeline_sequence:
