supplements: [DEC-2026-0019, DEC-2026-0021]

question: >-
  How is the ready Analyst handoff in
  REV-GUP-MIG-DEC-2026-0015-0016-r03-r01 retired after DEC-2026-0021 barred
  its remaining sixteen source readings, and who owns the absent DMG and UA
  source required to resume that work?

ruling: >-
  DEC-2026-0021 governs the sixteen outstanding assertions. The ready Analyst
  handoff in REV-GUP-MIG-DEC-2026-0015-0016-r03-r01 is stale only for queue
  derivation and is replaced by this terminal handoff under WORK_QUEUES 1.5
  Decision Handoff Replacement. The Review remains byte-immutable historical
  evidence. Reviewer must not publish a routing-only r02 and no pipeline role
  receives a replacement job from this Decision.

  The repository source steward, meaning the repository owner or an explicitly
  delegated external operator, owns lawful acquisition and intake of the absent
  DMG and UA source text. The source steward is outside the five pipeline roles
  and is never a handoff or scanner queue target. It must supply bounded incoming
  packets conforming to SOURCE_MARKDOWN before Analyst may read the sixteen
  loci. No role may reconstruct those texts from memory, legacy canonical data,
  endpoint names, or inference and present the result as source-read evidence.

  The sixteen assertions remain accepted standing evidence debt, not Analyst
  work, until conforming claimed packets exist. When source becomes available,
  the ordinary packet lifecycle resumes: Analyst publishes the sixteen
  source-read polarity GURs, then Builder, Reviewer, and Integrator perform the
  sequence already fixed by DEC-2026-0021.

rationale:
  - >-
    WORK_QUEUES already provides an exact, auditable remedy for an immutable
    artifact whose handoff is overtaken by a later Architect Decision. This
    escalation names the active Review by both ID and repository path, so no
    scanner inference or Review rewrite is needed.
  - >-
    A Review revision that changes only an obsolete handoff would duplicate the
    Decision replacement mechanism while the reviewed GUP remains frozen and
    non-approvable. The Review must remain available as evidence of its original
    review, not be edited to simulate a different source state.
  - >-
    A missing book is an external input dependency. Analyst's authority begins
    with a supplied source packet; fabricating packet prose would falsely claim
    source-read provenance and violate DEC-2026-0021 and GRAPH_INVARIANTS 15-16.
  - >-
    Naming the source steward as an external repository responsibility resolves
    ownership without inventing a sixth pipeline agent or a new semantic role.

