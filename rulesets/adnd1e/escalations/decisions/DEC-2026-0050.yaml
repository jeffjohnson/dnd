decision_authoring_contract_version: '1.1'

question: >-
  May source-supported ordinary work enlarge the DEC-2026-0014 legacy endpoint
  debt, and how must the already decided comeliness, fatigue, and training
  replacements plus the remaining blank endpoint labels be completed?

ruling: >-
  No. `comeliness`, `fatigue`, and `training` are due legacy identities, not a
  debt set that new ordinary packet work may enlarge. Their mappings in
  DEC-2026-0004 and DEC-2026-0014 remain controlling: `comeliness` becomes
  `abil_comeliness`, `fatigue` becomes `rule_exhaustion`, and `training` becomes
  `rule_training`. The four already integrated UA Cavalier assertions remain
  source-supported and are migrated with the other twelve `training` endpoints;
  they are not deleted or reinterpreted. `rule_training_status` is a distinct
  identity and is out of scope.

  Publish one current-baseline `decision_migration_v3` GUP,
  `GUP-MIG-DEC-2026-0050-r01`. Version 3 is a new, bounded direct model, not a
  widening of v1 or v2: it permits one-or-more one-to-one registry replacements,
  every closed paired endpoint repoint incident to those retired IDs, and exact
  blank endpoint-label normalization on explicitly enumerated rows. A label
  normalization changes only `source_label`, `target_label`, or both on one
  row; each changed label must be blank in the pinned before-image and become
  the exact current registry label for its unchanged endpoint ID. It never
  changes assertion identity. Additions, node relabels, aliases, merges,
  removals, nonblank-label edits, non-endpoint fields, and inferred rows remain
  prohibited. Versions 1 and 2 remain unchanged.

  Builder must also reject, rather than merely warn on, a newly compiled
  ordinary packet/GUR endpoint using any of these three exact due IDs. The guard
  names this Decision and the mandated successor but does not auto-map or repair
  a source assertion. It does not retroactively invalidate current integrated
  rows and does not change warning behavior for other candidate migrations.

rationale:
  - >-
    DEC-2026-0014 records the three replacements and says Builder prepares the
    migration, Reviewer confirms it, and Integrator changes canonical data only
    after approval. Its `migration_required: false` described the prior schema
    correction, not permission to retain or grow the known data debt.
  - >-
    The current incoming UA packet is authoritative for its four source
    assertions. Its use of the legacy `training` endpoint exposed a missing
    lifecycle guard; deleting correct source work would solve neither the
    identity drift nor the recurring admission failure.
  - >-
    Existing direct v1 correctly refuses label-only changes and v2 is reserved
    for many-to-one merges. A separate v3 confines the new capability to blank
    label completion backed by the registry, full before-images, and named rows.

operation_model:
  name: decision_migration_v3
  authority_source: >-
    The checksummed GUP YAML is the sole executable operation source. The
    Approved manifest names that reviewed GUP and its validation report by
    checksum and never restates or extends the plan.
  permitted_operations:
    - >-
      One or more `node_changes.replacements`, each replacing exactly one
      present retired registry identity with one absent canonical identity.
    - >-
      The complete, enumerated paired endpoint-ID/label repoints for every
      retired endpoint, each with an 18-field before-image.
    - >-
      `endpoint_label_normalization` on an explicitly enumerated canonical row,
      changing one or both blank endpoint-label fields to the matching current
      registry label without changing either endpoint ID or any assertion-key
      field.
  prohibited_operations:
    - Registry additions, aliases, node relabels, merges, canonical removals, or non-endpoint changes.
    - A nonblank label edit, a label that differs from the unchanged endpoint's registry label, or label-only mutation of assertion identity.
    - A replacement, endpoint, label field, row, or current-registry label inferred from a prefix, similar label, or unenumerated canonical row.

