operation_contract:
  planner_requirements:
    - >-
      Treat every `node_id_replacements[].incident_canonical_rows` list in this
      Decision as the closed, authoritative enumeration. Resolve each listed
      one-based row against the pinned canonical baseline; require it to contain
      exactly the declared retired endpoint; independently discover every
      baseline endpoint using that retired ID; and require exact equality before
      rendering one paired ID/label repoint for each listed row. Do not infer an
      additional row or silently omit a listed row.
    - >-
      Render each `endpoint_label_normalizations_without_repoint` item as one
      v3 `endpoint_label_normalization` operation. Its `changes` map may contain
      only source_label and/or target_label; every declared from value is empty;
      its exact to value equals the registry label for the unchanged endpoint;
      and the rendered operation retains the complete baseline before-image and
      `touches_assertion_identity: false`.
  integrator_requirements:
    - >-
      Apply replacements first, paired repoints second, and label-normalization
      operations third in one transaction. Compare every operation to its full
      before-image, record label normalization separately from endpoint repoints,
      and roll back every mutable file on any failure.
  prohibited_inference:
    - Do not infer a canonical row, replacement target, endpoint label, or label-only change from a retired ID, prefix, similar label, or any unenumerated row.

