sequence:
  - step: 1
    owner: architect
    action: >-
      Publish this Decision and the v3 contract and role-instruction boundaries;
      close the escalation without changing canonical data.
  - step: 2
    owner: builder
    action: >-
      Implement the v3 GUP schema and decision-migration planner, the exact
      `migration_due_ids` ordinary-packet guard, and focused regression tests.
      Re-plan the three replacement incident sets and seven label-normalization
      rows against the stated baseline, then publish
      GUP-MIG-DEC-2026-0050-r01 and its validation report. Refuse, rather than
      rebase, if either pinned baseline drifts.
  - step: 3
    owner: reviewer
    action: >-
      Independently verify both baseline checksums, every retired ID and label,
      all fifty closed endpoint repoints, all seven full before-images and their
      fourteen blank-to-registry label changes, the guard evidence, and the
      absence of a change to rule_training_status. Publish the v3 Approved
      manifest without an edge CSV only when all checks pass.
  - step: 4
    owner: integrator
    action: >-
      Implement v3 discovery, parsing, transaction execution, provenance, and
      tests. Apply only the approved migration bundle in one transaction, reject
      any drift or out-of-model change, and rebuild the derived canonical files.

acceptance_tests:
  - >-
    WORK_QUEUES version 1.16 or later retains the direct-v3 operation boundary:
    one-to-one replacements, closed paired endpoint repoints, and explicit
    blank endpoint-label normalization only; versions 1 and 2 remain unchanged.
  - >-
    ARTIFACT_LIFECYCLE version 1.12 or later records that a v3 Approved bundle
    is its manifest, GUP YAML, and validation report only, with no synthetic
    edge CSV and both canonical and registry baselines pinned.
  - >-
    The common GUP and Approved-bundle schemas accept v3 only when it contains
    the declared replacement and exact label-normalization shapes, and reject a
    label normalization with a nonblank `from`, a changed endpoint ID, a
    non-label field, a v1/v2 declaration carrying v3 work, or an edge CSV.
  - >-
    Planning this Decision against its baseline creates exactly three registry
    replacements, fifty paired endpoint repoints, seven canonical row label
    operations containing fourteen blank-to-registry fields, no additions,
    relabels, merges, removals, aliases, or duplicate five-field assertion key;
    it leaves no comeliness, fatigue, or training registry or endpoint ID.
  - >-
    An ordinary packet/GUR endpoint using precisely comeliness, fatigue, or
    training produces the blocking `endpoint_migration_due` diagnostic naming
    DEC-2026-0050 and its mapped successor. It is not auto-rewritten. Other
    candidate migration IDs retain their existing warning behavior.
  - >-
    Reviewer and Integrator independently reject a stale baseline, incomplete
    incident set, stale before-image, registry-label mismatch, nonblank source
    label, changed assertion identity, unmapped endpoint, or surviving retired
    ID. A valid approved v3 bundle discovers as one Integrator job with no edge
    CSV and records the seven label operations separately from endpoint repoints.
  - All applicable schema, builder, integrator, graph, registry, queue, and repository tests pass.

acceptance_test_semantics:
  - acceptance_test_index: 1
    kind: versioned_contract_content
    contracts:
      - path: contracts/WORK_QUEUES.md
        minimum_version: '1.16'
        substantive_anchors:
          - decision_migration_v3
          - blank endpoint-label normalization
          - Version 1 and Version 2 remain unchanged
  - acceptance_test_index: 2
    kind: versioned_contract_content
    contracts:
      - path: contracts/ARTIFACT_LIFECYCLE.md
        minimum_version: '1.12'
        substantive_anchors:
          - decision_migration_v3
          - no synthetic edge CSV
          - canonical edge and node-registry baselines

