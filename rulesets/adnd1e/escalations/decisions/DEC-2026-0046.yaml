sequence:
  - step: 1
    owner: architect
    action: >-
      Publish WORK_QUEUES 1.13, defining post-approval implementation-file
      snapshots and preserving strict pre-approval checksum drift handling.
  - step: 2
    owner: builder
    action: >-
      Update queue derivation so it validates an exact candidate implementation
      Review before treating file drift as an invalid report; emit an
      informational post-approval-drift diagnostic and add targeted tests.
  - step: 3
    owner: reviewer
    action: >-
      Independently verify that only an exact Approved Review receives the
      exception and that every unreviewed, revision-required, or invalid-review
      case remains strict before approving the implementation report.

acceptance_tests:
  - >-
    A completed implementation lineage whose exact active Approved Review pins
    the active report and Decision suppresses no longer-current implementation
    files only informationally, creates no implementation-owner job, and retains
    its immutable report and Review as provenance.
  - >-
    A report with implementation-file drift and no Review, a revision-required
    Review, or a malformed or report/Decision-checksum-stale Approved Review is
    diagnostic and produces the normal ready work for its implementation owner.
  - >-
    Post-approval drift affects only the completed Decision's queue state; a
    later Decision changing the shared file remains independently discoverable
    and subject to its own report and Review lifecycle.
  - >-
    WORK_QUEUES is Version 1.13 and records both the post-approval historical
    snapshot rule and the unchanged strict pre-approval rule, including their
    distinct acceptance criteria.

post_implementation_requirements:
  - >-
    Do not reissue the five named completed reports solely to update shared-file
    checksums. Their Approved implementation Reviews remain their completion
    evidence.
  - >-
    DEC-2026-0043 and DEC-2026-0045 remain ordinary unconsumed Builder work until
    their reports can satisfy all approval-ready requirements and receive exact
    Approved implementation Reviews.
  - >-
    Integrator must complete its existing DEC-2026-0044 work so the unrelated
    validation-suite failures no longer prevent approval-ready Builder reports.

constitution_version_impact:
  changed: false
  retained: '1.8'
  rationale: This is workflow provenance and queue derivation, not graph semantics.

governance_changelog:
