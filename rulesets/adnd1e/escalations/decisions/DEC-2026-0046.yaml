question: >-
  Does later drift in a shared implementation file reopen a Decision after an
  exact Approved Decision Implementation Review has already consumed its report?

ruling: >-
  No. An exact Approved Decision Implementation Review completes the Decision and
  fixes the report's implementation-file checksums as historical evidence of the
  reviewed state. Later changes to, or absence of, those current paths are
  informational only and create no revision job for that completed Decision.
  The later Decision or ordinary workflow that changed the shared file carries
  responsibility for validating its own result.

  This exception is deliberately narrow. Until an exact active Approved Review
  exists, every implementation-file path and checksum remains a current strict
  precondition. A missing, revision-required, malformed, or provenance-stale
  Review does not consume the Decision; its report's file drift remains an error
  and returns work to the ready implementation owner. The scanner must validate
  the candidate Review's exact report and Decision provenance before applying the
  post-approval exception.

  The completed lineages for DEC-2026-0018, DEC-2026-0022, DEC-2026-0023,
  DEC-2026-0028, and DEC-2026-0039 require no successor report or Review solely
  because shared tooling changed. DEC-2026-0043 and DEC-2026-0045 remain
  unconsumed because their active reports are not approval-ready; this Decision
  does not weaken their current validation or their normal Review requirements.

rationale:
  - >-
    `implementation_files` proves the specific repository state independently
    reviewed at completion. It cannot also be a permanent dependency on every
    future edit to a shared scanner, schema, or test file without making tooling
    Decisions non-convergent.
  - >-
    The completion authority is the Approved implementation Review, which already
    pins the exact report and Decision. Later file drift cannot alter either
    immutable artifact or retrospectively invalidate that completed review.
  - >-
    Keeping pre-approval drift strict preserves the current audit and repair
    guarantee where it matters: before independent approval has established the
    completed state.

