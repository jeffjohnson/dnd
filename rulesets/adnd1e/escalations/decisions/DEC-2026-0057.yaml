question: >-
  Once an exact Approved Decision Implementation Review has independently
  verified checksummed versioned-contract-content evidence, should a later
  contract version or content change reopen that completed Decision?

ruling: >-
  No. Extend DEC-2026-0046's approved-review snapshot rule to the report's
  checksummed versioned-contract-content evidence and the corresponding
  independent Review evidence. Once an exact active Approved implementation
  Review consumes the exact report and Decision, those recorded contract
  checksums, versions, and substantive-anchor findings are the immutable record
  of what the Reviewer verified. A later contract edit is informational for the
  completed Decision and must not create a Builder reissue or invalidate its
  approved Review.

  This rule is deliberately temporal. Before exact approval, versioned contract
  evidence remains live: the report and candidate Review must prove the current
  contract checksum, minimum version, and anchors. A missing, revision-required,
  malformed, report-checksum-stale, or Decision-checksum-stale Review preserves
  current strict validation. The snapshot neither claims nor checks that the
  current contract still meets an old Decision's evidence; every later Decision
  that relies on that contract proves its own current version and anchors.

rationale:
  - >-
    The approved Review already pins both the exact implementation report and
    the independent contract-content verification. Treating either artifact as
    a permanent dependency on future governance edits makes completed Decisions
    non-convergent.
  - >-
    DEC-2026-0056 demonstrated the failure directly: contract edits alone
    reopened six independently approved reports without changing any reviewed
    implementation, source interpretation, or canonical data.
  - >-
    Keeping pre-approval evidence strict preserves the audit guarantee where it
    matters, while making the completed state durable in the same way as
    implementation-file snapshots.

