      pre-approval negative cases, and no loss of current validation for a
      later Decision.

acceptance_tests:
  - >-
    WORK_QUEUES Version 1.22 or later states that versioned-contract-content
    evidence becomes a historical snapshot only after an exact approved
    implementation Review, and preserves strict current verification before
    approval.
  - >-
    ARTIFACT_LIFECYCLE Version 1.18 or later distinguishes current strict
    versioned-contract-content verification from its exact approved-review
    historical snapshot without asserting old evidence about current contracts.
  - >-
    Queue tests show that later version, checksum, or anchor drift in an exact
    approved report/Review lineage is informational and creates no Builder job;
    an otherwise identical unapproved, revision-required, malformed,
    report-checksum-stale, or Decision-checksum-stale candidate Review remains
    a current error and returns work to the implementation owner.
  - >-
    The live completed 0045, 0046, 0052, 0054, 0055, and 0056 lineages remain
    completed after this contract version bump, while DEC-2026-0053 remains
    strict and no named current Integrator or Analyst job is removed.
  - >-
    IMP-DEC-2026-0057-r01 pins this Decision's exact checksum, reports every
    direct acceptance test as passed with current evidence, records passing
    focused queue tests, and is approval-ready for independent Reviewer
    verification.

