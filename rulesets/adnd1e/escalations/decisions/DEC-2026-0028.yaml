supplements: [DEC-2026-0022]

question: >-
  How can an approved Decision's implementation report truthfully discharge an
  acceptance test that names a live queue artifact after that artifact has
  completed ordinary Approval and Integration, making the literal snapshot
  false solely because the pipeline succeeded?

ruling: >-
  The repository adopts `retired_by_lineage` as a narrowly scoped successful
  Decision Implementation Report outcome. It applies only to an acceptance test
  explicitly classified as a live queue snapshot. It records that the named
  subject is no longer visible because its ordinary Approval-and-Integration
  lineage completed; it never records that the historical queue assertion still
  passes. The outcome requires exact, checksummed Architect authorization and
  exact, checksummed Integration evidence for every named subject. A Reviewer
  independently verifies it with `verified_retired_by_lineage`.

  This Decision gives the required legacy authorization for DEC-2026-0022
  acceptance tests 2, 3, and 4. Its test 1 remains an ordinary `passed` result.
  Builder must publish a new DEC-2026-0022 implementation-report revision after
  the shared schemas, validators, scanner, and tests implement this ruling;
  Reviewer then independently reviews that active leaf. The immutable r04
  report remains historical evidence and is neither edited nor treated as an
  approval-ready implementation.

rationale:
  - >-
    The literal queue snapshots in DEC-2026-0022 tests 2 through 4 are false
    because their subjects completed their downstream lineages, not because the
    scanner suppressed live work. Calling them `passed` would falsify repository
    state; leaving them `not_run` permanently would make the approved Decision
    impossible to complete.
  - >-
    A specific, checksummed authority prevents Builder or Reviewer from
    reinterpreting an approved Decision. Exact Integration records distinguish
    ordinary success from handoff replacement, deletion, unapproved work, or a
    supersession with no integrated successor.
  - >-
    The rule is general for future explicitly structured queue-snapshot tests,
    while the legacy authorization is intentionally limited to the precise
    DEC-2026-0022 indices and subjects below.

