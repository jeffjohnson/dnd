      DEC-2026-0022. Preserve its exact input Decision ID/path/checksum and
      record this Decision as retirement authority for indices 2 through 4.
    - >-
      Record index 1 as `passed` with fresh current evidence. Record index 2
      with the DEC-2026-0021 integration record; index 3 with both authorized
