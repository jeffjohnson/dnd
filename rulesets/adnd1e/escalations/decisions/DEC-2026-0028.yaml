implementation_requirements:
  contract_alignment:
    - >-
      Preserve WORK_QUEUES 1.6's narrow meaning: `retired_by_lineage` is valid
      only for a `live_queue_snapshot` test and never means that the historical
      queue assertion is presently true.
    - >-
      Preserve the complete checksummed evidence trail: authorizing Decision,
      original Decision input, each subject, successor when applicable, and
      the ordinary Integration record. Handoff replacement cannot retire a
      subject.
  report_schema:
    path: schemas/common/decision-implementation.schema.json
    requirements:
      - Add `retired_by_lineage` to acceptance-result outcomes.
      - >-
        Require `retirement_authority` with exact Decision ID, path, and
        checksum, and `retired_subjects` with all subject IDs, paths,
        retirement states, Integration-record paths, and checksums.
      - >-
        Permit `approval_ready: true` only when every result is `passed` or a
        semantically valid `retired_by_lineage` result, validation passes, and
        the Reviewer handoff is ready without blockers.
  review_schema:
    path: schemas/common/decision-implementation-review.schema.json
    requirements:
      - Add `verified_retired_by_lineage` to acceptance dispositions.
      - >-
        Require the Reviewer to record and independently validate the same
        retirement authority and subject/Integration evidence for that
        disposition.
      - >-
        Permit an Approved Review to use `verified_retired_by_lineage` only for
        a report result that is validly `retired_by_lineage`; ordinary `verified`
        cannot approve it.
  decision_schema:
    path: schemas/common/architect-decision.schema.json
    requirements:
      - >-
        Define structured `acceptance_test_semantics` for future Decisions:
        one-based index, `kind: live_queue_snapshot`,
        `retirement_allowed: true`, and the complete expected subject ID/path
        list.
      - >-
        Define `retired_acceptance_authorizations` for an approved later
        Decision: exact input Decision ID/path/checksum, acceptance-test index,
        and complete subject list. A report cannot use an authority outside
        this structure.
  validator_and_tooling:
    files:
      - tooling/common/scan_agent_queues.py
      - tooling/common/tests/test_scan_agent_queues.py
    requirements:
      - >-
        Add semantic validation for every authority, exact Decision checksum,
        authorized index, complete subject coverage, permitted state, successor,
        Integration record, and Integration-record checksum.
      - >-
        Reject incomplete multi-subject evidence; wrong or missing checksums;
        an unapproved, missing, self-issued, or non-authorizing Decision;
        an unintegrated successor; handoff replacement; and use on a
        non-snapshot acceptance test.
      - >-
        Preserve the ordinary queue behavior for artifacts not covered by this
        precise rule. A valid retired result may allow the affected Decision
        report to become Reviewer-ready, but it must not create or suppress
        unrelated work.

