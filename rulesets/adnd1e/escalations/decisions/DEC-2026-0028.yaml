follow_up_owner: builder
follow_up_owners:
  builder:
    - Implement the three schemas, semantic validation, scanner behavior, and regression tests.
    - Publish the next DEC-2026-0022 implementation report only after all required validation passes.
  reviewer:
    - Independently verify the active reissued DEC-2026-0022 report and every retirement lineage.
    - Do not treat IMP-DEC-2026-0022-r04 as approval-ready or revise it.
  integrator:
    - No action. Decision Implementation Reports do not enter the Integrator queue.
  analyst:
    - No action. No source packet, GUR, or canonical graph interpretation is affected.

prohibited_actions:
  - Do not edit, rename, move, delete, or mark IMP-DEC-2026-0022-r04 as approved.
  - Do not report a historical queue snapshot as `passed` after its subject has completed.
  - Do not use retired-by-lineage for a non-snapshot acceptance test.
  - Do not treat handoff replacement, deletion, an unapproved revision, or a merely superseded artifact as ordinary successful retirement.
  - Do not authorize a subject or Decision by inference, broad class, or a checksum-free reference.
  - Architect does not edit canonical graph, registry, GUR, GUP, Review, Approved, or Integration artifacts.
