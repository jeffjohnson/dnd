acceptance_tests:
  - >-
    ESC-2026-08-06T05.00.31.952Z is decided and names this Decision; its exact
    raised review remains byte-immutable and this Decision supplements, rather
    than edits, DEC-2026-0022.
  - >-
    The shared report and review schemas represent `retired_by_lineage` and
    `verified_retired_by_lineage` only with required authority and complete
    checksummed subject and Integration evidence.
  - >-
    Validator tests reject a missing, stale, self-issued, unapproved, or
    non-authorizing authority; wrong or incomplete subject coverage; missing or
    incorrect Integration-record checksums; unintegrated successors; handoff
    replacement; and use for a non-snapshot acceptance test.
  - >-
    A valid retirement authorization accepts exactly the DEC-2026-0022 input
    checksum, indices 2, 3, and 4, and the full subject lists recorded in this
    Decision; it cannot authorize another index or Decision.
  - >-
    The next DEC-2026-0022 implementation-report revision records index 1 as
    passed and indices 2 through 4 as retired-by-lineage, is approval-ready
    only after complete validation, and leaves IMP-DEC-2026-0022-r04
    byte-identical.
  - >-
    The independent Reviewer can approve the active report only after
    independently verifying all retirement authority and Integration evidence;
    a normal verified disposition cannot stand in for a retired result.
  - >-
    Future Architect Decisions can declare only explicitly indexed,
    subject-complete live-queue-snapshot semantics for this outcome. All
    applicable contract, schema, queue, and repository validations pass.

