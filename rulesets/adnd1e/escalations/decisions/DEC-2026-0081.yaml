governance_changelog:
  - Manifest 1.1 adds Dispatcher-only common-pattern opt-out and literal routing paths.
  - Dispatcher receipts use null/null repository scope while receipt format remains 1.
  - Manual startup retirement is explicitly deferred to Architect after independent Review.

exact_diff:
