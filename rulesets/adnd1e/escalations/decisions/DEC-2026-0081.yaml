    - Declare schema_version 1.1 and Dispatcher with inherit_common_patterns false and eleven literal paths; retain existing worker entries and cache_format_version 1.
  schemas/common/role-context-manifest.schema.json:
    - Validate manifest 1.1 and Dispatcher-only opt-out while accepting legacy five-role 1.0 manifests and preserving format 1.
  contracts/ROLE_CONTEXT_LOADING.md:
