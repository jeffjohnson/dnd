schema_version: "1.0"
id: DEC-2026-0003
status: approved
ruleset_id: adnd1e
book_id: phb
source_id: phb-legacy-unspecified
constitution_version: "1.2"

decision_date: "2026-07-29"
escalation_id: ESC-2026-0005

question: >-
  Does every absent canonical node ID require Architect approval, or may the
  normal Builder and Reviewer workflow approve a registry addition under an
  already-approved prefix and kind?

ruling: >-
  Absence from the node registry is not, by itself, an architectural issue.
  Builder must isolate an unambiguous proposed node addition in GUP node_changes.
  Reviewer may approve that node change when source identity is supported, the
  prefix and kind are already approved, the ID format is valid, and canonical
  duplicate and neighborhood checks are clear. Integrator alone applies the
  approved registry change. Architect escalation remains mandatory for a new
  prefix or kind, a canonical merge or split, a graph-wide migration, or an
  identity ambiguity the current ontology cannot resolve.

rationale:
  - >-
    The artifact lifecycle explicitly gives GUPs an isolated proposed-registry-
    addition channel and gives Review an independent approval stage.
  - >-
    Architect authority governs ontology shape and migration consequences, not
    routine instances of an already-approved node kind.
  - >-
    Requiring Architect approval for every new rule_ ID turns ordinary packet
    processing into ontology governance and creates a serial bottleneck.
  - >-
    Builder may propose but cannot establish source correctness. Reviewer
    approval and Integrator ownership preserve the required separation of duties.
  - >-
    Ambiguous identity still belongs to Architect because an incorrect choice
    may create duplicate canonical identity or require migration.

contract_change:
  path: contracts/ESCALATION_CONTRACT.md
  previous_version: unversioned
  new_version: "1.1"
  change: >-
    Add an explicit do-not-escalate case for valid, unambiguous node additions
    under an existing approved prefix and kind.

affected_contracts:
  - contracts/ESCALATION_CONTRACT.md
affected_registries: []
affected_artifacts:
