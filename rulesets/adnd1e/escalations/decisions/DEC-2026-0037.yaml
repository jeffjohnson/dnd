acceptance_tests:
  - >-
    SOURCE_MARKDOWN 1.4 distinguishes a defining locus from a secondary mention
    and allows an Architect-recorded owner direction only while the defining
    packet is unavailable.
  - >-
    Planning this Decision against the stated baseline yields one replacement
    and exactly canonical rows 2478 and 2479, with a complete two-row incident
    set and no finding.
  - >-
    The direct-v1 GUP and Approved bundle validate with no edge CSV, exact
    Decision and baseline provenance, full before-images, and only the permitted
    replacement and paired endpoint-repoint operations.
  - >-
    Integration replaces item_pipes_sewer with item_pipes_of_sewers in the
    registry, canonical endpoints, nodes_master, and graph; no singular ID,
    label, alias, or duplicate assertion key remains.
  - >-
    The successor Bards Review and GUP use item_pipes_of_sewers / Pipes of the
    Sewers for M048 while retaining PHB 119 as that assertion's citation.
  - All applicable schema, graph, registry, direct-migration, lineage, and repository tests pass.

