      paired endpoint repoints. The canonical ID must be absent and the retired
      ID present in the pinned registry baseline.
    - >-
      Verify that the two listed rows are the complete incident set for
      item_pipes_sewer, retain a complete 18-field before-image for each, and
      preserve every field other than the affected endpoint ID and label.
    - >-
      Pin the current canonical and registry checksums and row counts in the
      direct-v1 GUP provenance. Do not create an edge CSV.
  integrator_requirements:
    - >-
      Execute only the reviewed direct-v1 GUP in one transaction: replace the
      registry identity, apply both compare-and-swap endpoint repoints, rebuild
      nodes_master and graph, and reject any surviving retired ID or duplicate
      assertion key.
  prohibited_actions:
