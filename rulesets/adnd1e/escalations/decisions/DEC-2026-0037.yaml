    SOURCE_MARKDOWN 1.4 separates an identity's defining locus from a secondary
    mention and records the limited owner-directed naming path when the defining
    source packet is unavailable.
  - >-
    DEC-2026-0037 is the active leaf of the DEC-2026-0030/0031 Pipes identity
    lineage. It reverses only the prior singular migration through a new,
    checked, identity-only transaction.

