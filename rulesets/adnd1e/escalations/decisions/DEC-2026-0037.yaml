question: >-
  Does the PHB Bards packet's secondary mention of Pipes of the Sewer control
  the identity of the DMG item's defining entry, and what canonical identity
  should replace the already integrated singular form?

ruling: >-
  Supersede DEC-2026-0031. The PHB Bards mention is a secondary use in a list
  of items a bard may employ; it is not the Pipes item's defining locus and
  does not control the existing DMG item's canonical identity. Adopt
  `item_pipes_of_sewers`, label `Pipes of the Sewers`, kind `item`. The
  semantically meaningful preposition `of` is retained in this ID; the article
  `the` is omitted. Replace `item_pipes_sewer` / `Pipes of the Sewer` without
  an alias and repoint exactly its two current canonical endpoints. This is a
  name-specific ruling, not a project-wide instruction to add or remove
  prepositions from other item IDs.

rationale:
  - >-
    The active PHB packet cites Pipes only inside the Bards section. The bounded
    source unit is about Bards, while both canonical mechanics for this item are
    cited to the DMG 152 miscellaneous-magic entry that defines the item.
  - >-
    SOURCE_MARKDOWN 1.4 distinguishes a defining source locus from a secondary
    mention. The earlier Decision applied direct-packet authority too broadly.
  - >-
    The repository owner's stated source reading and ID preference select the
    plural display name and `item_pipes_of_sewers` stem. This direction is
    recorded as Architect-governed naming while the DMG defining packet is not
    available; it is not a claim that legacy extraction is source-read evidence.
  - >-
    Constitution 3.1 requires a prefixed snake_case ID but does not prohibit
    prepositions. Retaining `of` is therefore a precise lexical choice, while
    omitting `the` keeps the stem concise without losing identity.

