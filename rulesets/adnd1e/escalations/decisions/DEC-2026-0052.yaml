decision_authoring_contract_version: '1.1'

question: >-
  How may the Review 1.1 direct implementation be independently approved when
  DEC-2026-0051 makes the later Reviewer r06 successor both an acceptance test
  and conditional on that prior approval?

ruling: >-
  Supersede DEC-2026-0051 with this lifecycle-only correction. Its acceptance
  test 5 was misclassified: r06 is a downstream ordinary Review artifact, not
  a direct implementation acceptance test. It must therefore not appear in,
  block, or be used to approve a Decision Implementation Report. The existing
  order is retained: Builder first reissues the implementation report against
  this Decision; Reviewer independently approves that report; Reviewer then
  publishes r06 under the now-reviewed Review 1.1 schema gate.

  No Reviewer is authorized to publish r06 before the independent
  implementation Review, and no party may amend IMP-DEC-2026-0051-r01 to
  manufacture a passed result. That blocked report and DEC-2026-0051 remain
  immutable history. The reissued report is the sole direct-implementation
  handoff for this active Decision leaf.

rationale:
  - >-
    A Decision Implementation Report can only evidence work the assigned
    implementation role has performed. r06 is owned by Reviewer and its source
    package can exist only after the Reviewer has verified the opt-in schema
    gate that validates it.
  - >-
    Reversing the order would publish the new Review 1.1 artifact before an
    independent check of the exact schema behavior that governs it. Moving r06
    to explicit post-implementation requirements preserves both the safety
    boundary and the established ordinary Review/GUP lifecycle.
  - >-
    A fresh Decision and report retain immutable artifact history and give the
    queue scanner a current, evidenceable completion chain. No contract,
    schema, source interpretation, registry identity, or canonical assertion
    changes are needed for this correction.

