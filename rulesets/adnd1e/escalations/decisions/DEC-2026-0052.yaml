sequence:
  - step: 1
    owner: architect
    action: >-
      Publish this correction Decision and close the escalation. Do not modify
      DEC-2026-0051, IMP-DEC-2026-0051-r01, any Review, GUP, bundle, schema,
      contract, registry, or canonical data.
  - step: 2
    owner: builder
    action: >-
      Revalidate the implementation recorded by IMP-DEC-2026-0051-r01 and
      publish IMP-DEC-2026-0052-r01 against this Decision's exact current
      checksum. Carry only acceptance tests 1 through 4, each as passed with
      current evidence; set approval_ready true, status proposed, and hand off
      ready to Reviewer. Do not alter the implementation files merely to
      reissue evidence, and do not publish r06 or any ordinary GUP.
  - step: 3
    owner: reviewer
    action: >-
      Independently review IMP-DEC-2026-0052-r01. Re-derive the two versioned
      contract checks, verify the Review 1.1 legal-vocabulary and legacy
      compatibility tests, and approve the implementation review only when all
      four direct acceptance results are evidenced and valid.
  - step: 4
    owner: reviewer
    action: >-
      Only after the approved implementation Review, publish
      REV-GUP-PKT-PHB-094-100-illusionist-spells-r05-r06, superseding r05-r05.
      Declare review_contract_version 1.1; restate M025, M026, M058, M072,
      M073, and M074 as approved; and record their checksummed blocked
      component as packaging evidence, never as a row disposition.
  - step: 5
    owner: builder
    action: >-
      Consume r06 through the normal compiler and publish
      GUP-PKT-PHB-094-100-illusionist-spells-r07 without creating an unknown
      disposition or a no-op artifact.
  - step: 6
    owner: reviewer
    action: >-
      Review r07 and publish the normal Approved bundle only when its approved,
      pending, and blocked components are complete and checksummed.
  - step: 7
    owner: integrator
    action: >-
      Integrate only the ordinary approved r07 bundle and run the normal
      five-field batch preflight for dependent Magic-User bundles.

acceptance_tests:
  - >-
    WORK_QUEUES version 1.17 or later retains the four legal Review row
    dispositions, the separation of Review outcome from Approved-bundle
    membership, and the review_contract_version 1.1 publication check.
  - >-
    ARTIFACT_LIFECYCLE version 1.13 or later retains the same four-term Review
    disposition vocabulary and requires a successor Review to record packaging
    exclusions outside the per-row disposition field.
  - >-
    Under review_contract_version 1.1, schemas/common/review.schema.json
    accepts the four legal values in edge_decisions and row_decisions and
    rejects approved_but_excluded_from_bundle. A legacy Review omitting that
    field still validates as immutable history.
  - >-
    IMP-DEC-2026-0052-r01 has this Decision's exact checksum, reports each of
    acceptance tests 1 through 3 as passed with current evidence, records a
    passing focused Review-vocabulary and legacy-corpus validation run, and is
    approval-ready for independent Reviewer verification.

acceptance_test_semantics:
  - acceptance_test_index: 1
    kind: versioned_contract_content
    contracts:
      - path: contracts/WORK_QUEUES.md
        minimum_version: '1.17'
        substantive_anchors:
          - review_contract_version
          - approved_but_excluded_from_bundle is invalid
          - Approved-bundle membership
  - acceptance_test_index: 2
    kind: versioned_contract_content
    contracts:
      - path: contracts/ARTIFACT_LIFECYCLE.md
        minimum_version: '1.13'
        substantive_anchors:
          - approved_with_revision
          - packaging exclusions
          - per-row disposition

post_implementation_requirements:
  - >-
    The approved implementation Review is required before r06, but r06 itself
    is not an acceptance result of the implementation report and must not be
    used as its approval evidence.
  - >-
    r06 supersedes r05-r05 without changing r03 or r04; declares Review 1.1;
    uses approved for exactly M025, M026, M058, M072, M073, and M074; records
    their checksummed blocked component as packaging evidence; and introduces
    no novel disposition.
  - >-
    The subsequent Builder r07, Reviewer r07, Approved bundle, and Integrator
    preflight are ordinary downstream artifacts. They do not block the direct
    schema implementation review and must follow the sequence above.

constitution_version_impact:
  changed: false
  retained: '1.8'
  rationale: >-
    This corrects only the lifecycle classification of an existing acceptance
    test. It does not alter ontology, source meaning, assertion identity, or
    graph semantics.

governance_changelog:
  - >-
    DEC-2026-0052 corrects DEC-2026-0051's direct-implementation boundary:
    the r06 ordinary Review successor is a downstream requirement rather than
    a fifth implementation-report acceptance test.

