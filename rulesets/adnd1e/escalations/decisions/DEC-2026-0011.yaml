decision_date: "2026-07-30"
escalation_id: ESC-2026-07-30T05.01.15.336Z

question: >-
  When an ability score, class, or other input determines a mechanic through a
  table, should the graph use input MODIFIES mechanic or mechanic DERIVED_FROM
  input?

ruling: >-
  Ratify the canonical operational direction: an ability, class, or other input
  that changes a mechanic uses input MODIFIES mechanic, including direct table
  lookups. DERIVED_FROM is reserved for computation or lookup lineage between
  separately represented concepts, such as a rule and its separately
  addressable table. Do not record both types for the same dependency merely
  because both descriptions are linguistically possible. The eight direct
  inverse proposals and seven related direction disagreements return to Builder
  for normalization and canonical deduplication; this decision authorizes no
  canonical retyping.

rationale:
  - >-
    Constitution section 2 already models Strength changing hit probability as
    abil_strength MODIFIES cbt_tohit. The canonical graph consistently follows
    that impact-oriented direction for ability and class inputs.
  - >-
    Impact analysis asks what mechanics move when an input changes. The
    operational input-to-mechanic direction makes that dependency explicit.
  - >-
    DERIVED_FROM remains useful for separately addressable lineage, especially
    the rule/table distinction in Constitution section 3.2. It need not be a
    second edge for every operational modifier.
  - >-
    Keeping both edges for one fact adds a second maintenance path without
    changing the impact answer.
  - >-
    Ratifying current canonical practice avoids an uncounted graph-wide
    migration. The held proposals can be normalized within ordinary workflow.

type_selection_rule:
  use_modifies_when:
    - An ability, class, race, item, or rule changes a target mechanic.
    - A target mechanic is read directly from a table using that input.
  use_derived_from_when:
    - Both concepts are separately represented and the assertion is calculation or lookup lineage.
    - The relationship is not already the same operational dependency represented by MODIFIES.
  do_not:
    - Emit MODIFIES and DERIVED_FROM for the same dependency.
    - Reverse a canonical operational edge merely because the source uses lookup language.
    - Retype FEEDS_INTO rows under this decision; apply its separate semantic test.

proposal_disposition:
  direct_inverse_rows: 8
  related_direction_rows: 7
  action: >-
    Builder compares each proposal with canonical under the approved type and
    direction, rejects exact restatements, and carries only source-supported
    assertions not already represented.
  canonical_rows_retyped: 0

