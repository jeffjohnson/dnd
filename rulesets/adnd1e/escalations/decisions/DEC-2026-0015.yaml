supplements: DEC-2026-0013

question: >-
  When a legacy spell_ node's ID names one spell but its registry label and
  incident assertions name a broader spell category, a condition, or another
  spell, which identity survives and what exact split or migration is required?

ruling: >-
  Approve the per-node dispositions below for nine of the ten disputed IDs.
  The specific-spell ID survives wherever it is valid. Distinct source-backed
  spell categories and conditions receive separate IDs, and assertions move
  to the identity they actually describe. Defer spell_imprisonment without
  changing it because the supplied UA provenance does not establish whether
  the legacy assertion describes Imprisonment, Maze, Forcecage, or another
  spell. This decision completely unblocks Cure Light Wounds and Hold Person
  in PKT-PHB-043-054-cleric-spells; it does not block the other 74 spells.

rationale:
  - >-
    The replacement package satisfies DEC-2026-0013: it corrects the
    non-reproducible count, isolates ten substantive identity conflicts,
    supplies all 40 incident rows, gives source or recoverable provenance,
    compares ID-governs, label-governs, and split options, and quantifies the
    migration.
  - >-
    Constitution section 3.1 makes the ID determinative. A row about curative
    spells cannot silently become an assertion about Cure Light Wounds, and a
    row about being confused cannot silently become an assertion about the
    Confusion spell.
  - >-
    Four supplied assertions explicitly operate on source-named spell
    categories. Reusing specific-spell IDs would destroy assertion scope. The
    recurring category need is represented under spell_ with plural,
    category-specific stems; Constitution 1.5 makes that existing ontology
    meaning explicit without adding a prefix.
  - >-
    rule_immobile already represents the held or paralyzed condition. Reusing
    it for the Rod of Lordly Might and Remove Paralysis assertions avoids a
    duplicate condition node and preserves spell_hold_person as one spell.
  - >-
    Repointing canonical row 1765 to rule_immobile would restate the existing
    GR_HELPLESS_TARGET_AUTOHIT assertion at canonical row 2258. Constitution
    section 5 requires one production edge with additional loci in provenance,
    so row 1765 is merged into row 2258 rather than retained as a near
    duplicate.
  - >-
    Canonical rows 3349 and 3350 remain distinct after row 3350 is repointed to
    rule_immobile. They preserve separate source assertions for paralysis and
    held creatures and have distinct aspects under the five-field production
    assertion key.
  - >-
    The Itching, Rash, and Taunt rows are three source-backed UA spells created
    by overlapping legacy extraction batches. A three-way split preserves
    their existing meanings and provenance without inventing relationships.
  - >-
    The Imprisonment evidence is internally inconsistent in spell level and
    label. Deferral is narrower and safer than selecting one identity from an
    unclaimed UA source.

node_dispositions:
  spell_charm_person:
    disposition: retain_and_relabel
    canonical_label: Charm Person
  spell_confusion:
    disposition: retain_and_split_condition
    canonical_label: Confusion
    split_id: rule_confused_condition
  spell_cure_light_wounds:
    disposition: retain_and_split_category
    canonical_label: Cure Light Wounds
    split_id: spell_curative_spells
  spell_esp:
    disposition: retain_and_split_category
    canonical_label: ESP
    split_id: spell_psionic_related_spells
  spell_fireball:
    disposition: retain_and_split_category
    canonical_label: Fireball
    split_id: spell_fire_spells
  spell_hold_person:
    disposition: retain_and_reuse_existing_condition
    canonical_label: Hold Person
    condition_id: rule_immobile
  spell_imprisonment:
    disposition: deferred
    current_label_retained: Maze or Cage Spell
    required_evidence: >-
      A claimed UA packet excerpt for page 62, its surrounding spell heading
      and level, and the local neighborhoods for Imprisonment, Maze, and
      Forcecage or any other named cage spell established by that excerpt.
  spell_legend_lore:
    disposition: retain_and_split_category
    canonical_label: Legend Lore
    split_id: spell_informational_spells
  spell_melfs_acid_arrow:
    disposition: retain_and_relabel
    canonical_label: Melf's Acid Arrow
  spell_taunt:
    disposition: retain_and_split_spells
    canonical_label: Taunt
    split_ids:
      - spell_itching
      - spell_rash

