general_rule_disposition:
  id: GR_HELPLESS_TARGET_AUTOHIT
  applies_to_change: none
  reason: >-
    spell_hold_person remains a valid producing spell and rule_immobile remains
    the shared condition. Canonical row 2260 continues to connect them and to
    carry the general_rule_id.

coordination_constraints:
  - >-
    The spell_taunt migration rows that also use the invalid endpoint
    comeliness remain subject to DEC-2026-0004. This decision changes only the
    spell endpoint and does not supersede that separate ID migration.
  - >-
    Builder must emit one reviewed migration package covering all authorized
    node additions, registry relabels, repoints, label normalizations, and the
    row-1765 provenance merge. Do not implement only the two packet blockers
    and leave the other approved identity conflicts partially migrated.
  - >-
    Reviewer must compare the post-migration local neighborhood and five-field
    assertion keys, including the two Remove Paralysis assertions at current
    rows 3349 and 3350.
  - >-
    Integrator alone updates nodes.csv, canonical graph files, manifests, and
    derived graph artifacts after the migration package is approved.

