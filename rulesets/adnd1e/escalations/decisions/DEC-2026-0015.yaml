acceptance_tests:
  - Constitution and ruleset.yaml both declare version 1.5.
  - Constitution section 3.1 distinguishes a spell family/category from one spell.
  - Builder vocabulary declares Constitution 1.5 without adding a new prefix.
  - The seven authorized IDs are unique and absent before the migration.
  - The nine retained IDs have exactly the canonical labels listed in node_dispositions.
  - spell_imprisonment and canonical row 3027 remain unchanged.
  - Exactly 16 current canonical rows are repointed according to canonical_migration.
  - Exactly 10 retained endpoints receive the listed label normalizations.
  - Current canonical row 1765 is absent after its DMG page 67 locus is preserved for row 2258.
  - GR_HELPLESS_TARGET_AUTOHIT still applies to spell_hold_person and rule_immobile.
  - Current canonical row 2260 still connects spell_hold_person to rule_immobile.
  - The migrated graph has no endpoint using the wrong one of the nine decided identities.
  - The five-field assertion key reports no exact duplicate created by the migration.
  - Reviewer explicitly resolves all near-duplicate findings produced by the migration dry run.
  - The packet may extract Cure Light Wounds and Hold Person against their specific IDs.
  - The other 74 packet spells and the 47 ordinary node additions remain outside this migration.
  - No canonical graph or registry file is changed by this Architect decision.

