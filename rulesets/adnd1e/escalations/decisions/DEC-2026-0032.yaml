escalation_id: ESC-2026-08-14T04.18.34.249Z

question: >-
  Which identity survives for each duplicated ability-adjustment mechanic, and
  how can two retired node IDs be merged into that identity without permitting
  the Builder to infer an unbounded canonical rewrite?

ruling: >-
  Adopt the repository owner's derived-ability naming convention:
  `abil_<three-letter ability abbreviation>_<snake_case rule name>`. The three
  canonical identities are `abil_dex_reaction_adjustment`,
  `abil_dex_defensive_adjustment`, and `abil_str_exceptional`. Each merges the
  two exact retired identities enumerated below. The six retired IDs have no
  aliases. This is an identity-only migration: every affected edge retains its
  type, aspect, condition, polarity, citation, evidence, pass, status, and
  review fields.

rationale:
  - >-
    The duplicate pairs have identical labels and the same mechanical meaning;
    retaining any existing member would preserve an unapproved `dex_` or `str_`
    namespace and conflict with the owner's stated convention.
  - >-
    `abil_strength` and the other full-name base-score IDs retain their current
    identities. The abbreviation convention applies only to a derived mechanic,
    so it does not introduce a competing spelling for a base score.
  - >-
    Two-to-one consolidation is not a sequence of ordinary replacements. The
    current planner supports only one retired node to one successor; accepting
    a second retirement silently would invite duplicated registry or canonical
    state. The Builder must implement and validate the bounded operation below.

constitution_amendment:
  release: '1.8'
  changed_sections:
    - '3.1 Format: abil_ includes derived ability mechanics.'
    - '3.1 Format: derived mechanics use abil_<three-letter abbreviation>_<rule name>.'
  retained_identities:
    - abil_strength
    - abil_dexterity
    - abil_constitution
    - abil_intelligence
    - abil_wisdom
    - abil_charisma

