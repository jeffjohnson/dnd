    canonical_registry_rows_added: 3
    canonical_rows_repointed: 33
    canonical_rows_label_normalized_without_repoint: 0
    new_registry_rows: 0

operation_contract:
  applies_only_to: DEC-2026-0032
  planner_requirements:
    - >-
      Read `canonical_migration.node_id_merges`; reject the Decision rather than
      ignore the key until this operation is implemented.
    - >-
      Require at least two distinct retired nodes per merge; require that the
      canonical ID is absent from the baseline registry and that every retired
      node matches its declared registry row, label, and kind.
    - >-
      Resolve every listed one-based canonical CSV row, including the header;
      require that it references exactly one of the merge's retired IDs in its
      source_id or target_id field. Discover all baseline rows incident on either
      retired ID and require an exact set match with `incident_canonical_rows`.
    - >-
      Change only the retired endpoint ID and its corresponding endpoint label.
      Preserve all other columns byte-for-value. Rebuild nodes_master and graph
      from the planned result, then reject duplicate five-field assertion keys.
    - >-
      Replace the two retired registry rows with one canonical row. Reject a
      plan if a retired ID survives in the planned registry, canonical endpoints,
      nodes_master, or graph output.
  prohibited_inference:
    - Do not discover additional identities by matching labels or prefixes.
    - Do not add aliases, change a non-endpoint field, or widen the operation to another ability mechanic.
    - Do not compile a packet GUR containing any retired ID after this migration is integrated.

