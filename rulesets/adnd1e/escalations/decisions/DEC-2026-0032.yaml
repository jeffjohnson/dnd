acceptance_tests:
  - >-
    Builder recognizes `node_id_merges` and rejects a missing, unknown, partial,
    or malformed merge operation rather than planning it as a no-op.
  - >-
    Focused tests reject a duplicate retired ID, an existing canonical ID, a
    registry row/label/kind mismatch, a missing or extra incident row, and an
    incident row that does not contain a listed retired endpoint.
  - >-
    Planning this Decision produces exactly three registry merges and 33 endpoint
    repoints, changes no other field, has no duplicate assertion key, and leaves
    none of the six retired IDs in planned canonical or derived output.
  - >-
    The compiler accepts constitution v1.8 and the approved `abil_` convention,
    while bare `dex_` and `str_` remain rejected prefixes for new identities.
  - >-
    The subsequent DMG GUR revision is source-derived, supersedes r02, and uses
    only the three surviving ability IDs.
  - All applicable schema, graph, registry, migration, and repository tests pass.

