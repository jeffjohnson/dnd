acceptance_tests:
  - >-
    GUP-MIG-DEC-2026-0024-0025-r04 supersedes r03 in the same lineage, uses
    artifact_kind decision_migration, records exact checked authority for
    Decisions 0024, 0025, 0026, and 0030, and plans against the then-current
    canonical baseline.
  - >-
    The migration replaces exactly registry row 228 and canonical-node row 732
    from item_pipes_sewers / Pipes of the Sewers to item_pipes_sewer / Pipes of
    the Sewer, with kind item preserved.
  - >-
    The migration repoints and relabels exactly canonical edge rows 2479 and
    2480, preserving every non-identity field in their complete before-images.
  - >-
    No canonical registry, node, endpoint, edge label, or generated graph data
    retains item_pipes_sewers or Pipes of the Sewers, and no alias is created.
  - >-
    The migration creates no duplicate five-field assertion key and no unrelated
    registry, canonical node, or edge change.
  - >-
    REV-GUP-PKT-PHB-117-119-bards-r03-r02 supersedes r01 only after migration
    Integration, records Decision and Integration provenance, resolves M048 with
    the exact singular identity, and preserves M028's supplied correction.
  - >-
    GUP-PKT-PHB-117-119-bards-r04 supersedes r03, references item_pipes_sewer
    as an existing identity, applies M048 exactly, and proposes no duplicate
    pipes node.
  - All applicable schema, graph, registry, lineage, and repository tests pass.

