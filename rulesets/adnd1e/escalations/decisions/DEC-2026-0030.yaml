sequence:
  - step: 1
    owner: builder
    action: >-
      Publish GUP-MIG-DEC-2026-0024-0025-r04 in lineage MIG-DEC-2026-0024-0025.
      It supersedes r03, uses artifact_kind decision_migration, records exact
      checksummed authority for Decisions 0024, 0025, 0026, and 0030, plans
      against the then-current canonical baseline, preserves all prior approved
      Decision operations, and adds only the node/label operations enumerated
      here.
  - step: 2
    owner: reviewer
    action: >-
      Independently verify the direct PHB name, the exact registry/node rows,
      both endpoint before-images, no non-identity deltas, no retained old ID or
      alias, and no unrelated migration operation.
  - step: 3
    owner: integrator
    action: >-
      Integrate only an Approved migration bundle; replace the registry and
      canonical node identity, repoint/relabel both endpoints, and rebuild the
      required derived canonical artifacts.
  - step: 4
    owner: reviewer
    action: >-
      After Integration, publish REV-GUP-PKT-PHB-117-119-bards-r03-r02,
      superseding r01. Record this Decision and Integration provenance, replace
      the resolved M048 escalation with its exact post-migration assertion,
      preserve M028's supplied correction, and hand the packet revision to
      Builder.
  - step: 5
    owner: builder
    action: >-
      Publish GUP-PKT-PHB-117-119-bards-r04 against the integrated canonical
      and registry state. It supersedes r03, applies M048 and M028 exactly as
      supplied, and proposes neither pipes identity as a registry addition.
  - step: 6
    owner: reviewer
    action: >-
      Review r04 against the claimed PHB packet, the integrated singular
      identity, the r03-r02 Review, and all retained exact dispositions.
  - step: 7
    owner: integrator
    action: Integrate only the subsequent Approved Bards packet bundle.

