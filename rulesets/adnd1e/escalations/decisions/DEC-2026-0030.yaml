question: >-
  When the current claimed PHB packet directly names the item "Pipes of the
  Sewer," does that source identity govern over legacy item_pipes_sewers /
  "Pipes of the Sewers," and what exact migration is required?

ruling: >-
  item_pipes_sewer, label Pipes of the Sewer, kind item, is the one canonical
  identity. item_pipes_sewers / Pipes of the Sewers is an incorrect legacy form
  and must be replaced, not retained as an alias, duplicate, or alternate
  spelling. The word "Pipes" remains plural; only the directly named terminal
  noun and the corresponding ID stem are singular.

  The current incoming packet and immutable claimed copy are canonical for
  direct spelling, grammatical number, source label, and canonical ID stem.
  Legacy registry and canonical data cannot overrule that reading. This is an
  identity-only migration: every affected edge retains its exact type, aspect,
  condition, polarity, citation, evidence, pass, and status. No mechanical
  relationship is added, removed, or reinterpreted.

rationale:
  - >-
    The packet directly names the item at PHB 119 under BARDS as "Pipes of the
    Sewer." The plural legacy terminal word is not supported by the active
    source packet.
  - >-
    `agents/architect/INSTRUCTIONS.md` and `contracts/SOURCE_MARKDOWN.md`
    require current incoming and claimed packet authority for direct identity.
    A label-only change would leave an ID stem that contradicts that authority.
  - >-
    Keeping both IDs would create duplicate identity for one named item, and an
    alias would preserve an explicitly incorrect canonical form for later work.
  - >-
    Existing `item_` vocabulary and kind are sufficient. This corrects data and
    applies established source-precedence policy; it does not add ontology.

