prohibited_actions:
  - Do not retain item_pipes_sewers or Pipes of the Sewers as an alias, duplicate, or zero-degree node.
  - Do not apply a label-only migration while retaining the incorrect plural ID stem.
  - Do not alter any non-identity field of rows 2479 or 2480 in this migration.
  - Do not issue a competing DEC-2026-0030-only migration lineage.
  - Do not publish the Bards r04 GUP against pre-migration registry or canonical state.
  - Do not reopen or change M028 except to carry its existing Reviewer-supplied correction forward.
  - Architect does not edit canonical graph, registry, GUP, Review, Approved, Integration, or role-tooling files.
