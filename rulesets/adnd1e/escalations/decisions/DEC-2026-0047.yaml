question: >-
  When an Approved bundle's only defect is an incomplete edge component, what is
  Builder's revision and which role publishes the corrected bundle?

ruling: >-
  Builder has no revision in this bounded packaging-only case. It must not publish
  an Approved bundle and must not manufacture a no-op GUP successor. Reviewer
  owns the correction: it publishes a successor Review for the same immutable
  GUP, verifies the current complete approved row set, and emits the successor
  Approved bundle.

  For the three current rejections recorded by INT-20260817-002, the successor
  Approved edge component is the deterministic concatenation of that GUP's
  `edges.csv` and `pending.csv` rows in the existing `csv_row` order. The
  successor Review records the source-component paths and checksums, output path
  and checksum, exact row count, and the excluded `blocked.csv` path and checksum.
  It must independently confirm every appended pending row is listed by the GUP's
  operation index and supported by its declared node-registration plan. No row is
  added, dropped, or reinterpreted.

  `blocked.csv` remains outside the Approved bundle. No `pending` or `blocked`
  Approved-bundle component kind is created by this Decision; a future proposal
  must define its eligibility and Integrator behavior before expanding the shape.

  REV-GUP-PKT-PHB-094-100-illusionist-spells-r05-r02 does not consume
  INT-20260817-002, because that report expressly did not reject its predecessor
  bundle. Reviewer must not add a false rejection reference. It may apply the
  same packaging correction only as an ordinary successor Review after directly
  verifying the current r05 GUP's row set and recording that its correction does
  not consume INT-20260817-002.

rationale:
  - >-
    An Approved bundle is Reviewer output. Asking Builder to publish it would
    remove independent approval and contradict the repository's ownership model.
  - >-
    The exact rejection evidence says the current GUP assertions, operation
    classifications, node registrations, and blocked-row exclusion are correct.
    Reissuing identical GUP content would add immutable noise and another review
    cycle without repairing the missing bundle component.
  - >-
    The deterministic derived edge component preserves the reviewed distinction
    between immediately listed and registration-dependent rows in GUP provenance
    while giving Integrator one complete, checksummed component to apply.

