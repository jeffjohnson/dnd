acceptance_tests:
  - >-
    Each successor Review for the three INT-20260817-002 packages records the
    exact rejection input, immutable reviewed GUP checksum, input `edges.csv` and
    `pending.csv` paths and checksums, output Approved edge-component path and
    checksum, the exact 231, 203, or 208 row count, and excluded blocked input.
  - >-
    Each matching Approved manifest contains one complete `edges` component whose
    rows equal the verified GUP additions plus pending additions exactly once in
    declared order; it contains no blocked row and has checksums matching the
    successor Review evidence.
  - >-
    The illusionist r05 successor Review names no INT-20260817-002 rejection
    input, directly verifies its 14-plus-106 complete row set and six excluded
    rows, and emits an Approved bundle only when the same checks hold.
  - >-
    The four named prior revision-required Reviews produce no Builder revision
    item after this Decision's handoff replacement; exactly one Reviewer Decision
    item represents the bounded packaging correction.
  - >-
    WORK_QUEUES is Version 1.14 and Reviewer instructions explicitly reserve this
    derived Approved-edge packaging action to Reviewer while retaining the
    prohibition on Builder-authored Approved bundles.

post_implementation_requirements:
  - >-
    Builder does not publish a GUP revision, an edge CSV, or an Approved bundle
    for these four packaging-only corrections.
  - >-
    Integrator applies only the successor Approved bundles after their normal
    Review provenance, component checksums, and complete row counts validate.
  - >-
    A later request to carry pending or blocked data as independently typed
    Approved-bundle components requires a new Architect escalation.

