  legacy_reports:
    - decision: DEC-2026-0045
      active_report: rulesets/adnd1e/decision-implementations/IMP-DEC-2026-0045-r04.yaml
      active_review: rulesets/adnd1e/decision-implementation-reviews/REV-IMP-DEC-2026-0045-r04-r01.yaml
      acceptance_test_index: 1
    - decision: DEC-2026-0046
