decision_authoring_contract_version: '1.1'

question: >-
  How can an acceptance test prove a mutable contract's required content without
  becoming permanently false merely because a later approved Decision advances
  that contract's version?

ruling: >-
  For a mutable contract, an acceptance test may test a minimum version and explicit
  substantive anchors. It is satisfied only when the current contract version is at
  or above that floor and every named anchor remains present and unweakened. This is
  current-state evidence, reported as `passed` and independently reviewed as
  `verified_versioned_contract_content`; it is not `retired_by_lineage`.

  New Decisions must express this as `Version N or later` and declare structured
  `versioned_contract_content` semantics. An exact-version statement remains
  literal unless the Decision explains why the literal version is the behavior being
  tested. No role may infer a broader reading from version history alone.

  The two legacy tests listed below are exceptionally authorized under the same
  minimum-version and anchor rule. Their current reports must be reissued with the
  structured authority and current checksums. DEC-2026-0045 acceptance test 1 is
  authorized for WORK_QUEUES 1.12 or later and ARTIFACT_LIFECYCLE 1.10 or later;
  DEC-2026-0046 acceptance test 4 is authorized for WORK_QUEUES 1.13 or later.
  The authorization applies only to the checksummed Decision revisions named here.

contract_version_acceptance_authorizations:
  - decision_input:
      id: DEC-2026-0045
      path: rulesets/adnd1e/escalations/decisions/DEC-2026-0045.yaml
      checksum: sha256:25dedbb5ca47f8b3084a9b1546610fa66c8f8da33923c9cdd1b9f2f059aee341
    acceptance_test_index: 1
    contracts:
      - path: contracts/WORK_QUEUES.md
        minimum_version: '1.12'
        substantive_anchors:
          - checksummed Integration rejection remediation
          - Builder-or-Integrator direct non-migration implementation ownership
          - exact_diff ownership planning for version-1.1 Decisions
      - path: contracts/ARTIFACT_LIFECYCLE.md
        minimum_version: '1.10'
        substantive_anchors:
          - immutable checksummed Integration rejection records
          - Builder-or-Integrator direct non-migration implementation ownership
  - decision_input:
      id: DEC-2026-0046
      path: rulesets/adnd1e/escalations/decisions/DEC-2026-0046.yaml
      checksum: sha256:2ebc1d44dfb1fb51583415f535896f41dac2bc64a6bfef4157c99e89486bbe0b
    acceptance_test_index: 4
    contracts:
      - path: contracts/WORK_QUEUES.md
        minimum_version: '1.13'
        substantive_anchors:
          - approved implementation-review checksum snapshots are historical evidence
          - pre-approval implementation-file drift remains strict
          - post-approval implementation-file drift is informational only

rationale:
  - >-
    Contract versions must advance when approved governance changes. Treating a
    later version as failure makes every well-maintained contract create permanent
    false negatives in earlier Decisions.
  - >-
    A version floor alone is insufficient: a later version could remove or weaken
    the rule the earlier Decision actually required. The anchors preserve that
    substantive obligation for independent Review.
  - >-
    Legacy wording needs a narrow checksummed authorization. Automatic widening
    would convert an intentional exact-version test into a different test without
    Architect authority.

