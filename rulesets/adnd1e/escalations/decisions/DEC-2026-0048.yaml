      acceptance_test_index: 4

migration_required: false
migration_scope:
  canonical_data_change: false
  registry_change: false
  artifact_lineage_change: >-
    The two Decision Implementation Reports receive ordinary immutable Builder
    successors, followed by ordinary independent Reviewer successors. No GUP,
    Approved bundle, canonical edge, or registry entry changes.

sequence:
  - step: 1
    owner: architect
    action: >-
      Publish the minimum-version and substantive-anchor contract rule, the
      lifecycle explanation, and Architect and Reviewer authoring/review duties.
  - step: 2
    owner: builder
    action: >-
      Add the structured semantics and legacy-authorization schema shapes; make
      queue derivation validate exact authority, current minimum versions,
      checksums, and complete anchor evidence; add positive and negative tests;
      then publish successors to IMP-DEC-2026-0045-r04 and IMP-DEC-2026-0046-r03.
  - step: 3
    owner: reviewer
    action: >-
      Independently verify the structured authority, the current contract state,
      and every anchor before reviewing each Builder report successor.

acceptance_tests:
  - >-
    WORK_QUEUES and ARTIFACT_LIFECYCLE define versioned contract-content tests as
    current minimum-version plus substantive-anchor verification, never as
    retired-by-lineage, and preserve literal semantics for unstructured legacy
    exact-version wording.
  - >-
    New Decision semantics and legacy authorizations are schema-valid only when
    they pin the exact target Decision, test index, contract paths, minimum
    versions, and nonempty anchor sets; an implementation report and Review carry
    matching checksummed current-state evidence.
  - >-
    Queue validation rejects an absent, stale, mismatched, incomplete, or
    below-minimum authorization and never exposes it as approval-ready work;
    valid evidence remains reviewable through the ordinary independent Review.
  - >-
    Successors to IMP-DEC-2026-0045-r04 and IMP-DEC-2026-0046-r03 use only this
    Decision's exact authorizations for acceptance-test indices 1 and 4,
    respectively, and retain current checksum and anchor evidence.

post_implementation_requirements:
  - >-
    Reviewer must publish ordinary successor implementation Reviews for the two
    reissued reports. The implementation Reviews, not this Decision, complete
    DEC-2026-0045 and DEC-2026-0046.
  - >-
    Future Architect Decisions use `Version N or later` with declared semantics;
    no role may add a broad legacy authorization outside an approved Decision.

constitution_version_impact:
  changed: false
  retained: '1.8'
  rationale: This governs artifact evidence and workflow validation, not graph semantics.

governance_changelog:
