question: >-
  May the checksummed Bards r03 Review and r03 Approved bundle be routed after
  their direct r02 predecessor remains permanently YAML-unreadable?

ruling: >-
  Yes, by one new exact `review_direct_predecessor_repairs` record. This record
  is distinct from DEC-2026-0064's two-hop bridge: it admits only the named
  unreadable r02 predecessor and the named r03 successor, which directly
  supersedes r02. Builder must implement the record's full validation in the
  common scanner. It may classify r02 as historical unreadable evidence only
  after every pinned current checksum, parser failure, direct supersedes link,
  Review and Approved-bundle schema result, trusted r01 parent, reviewed r04
  GUP, rejection record, component, node-registration count, and 29/28
  operation partition validates.

  The record does not make r02 valid and does not recover or use r02 Review
  content. It authorizes no other unreadable artifact, no alternative successor,
  and no source, GUP, node, registry, edge, or canonical change. Every missing,
  parseable, checksum-mismatched, malformed, wrong-link, wrong-GUP, wrong
  rejection, wrong-component, wrong-operation, or schema-invalid field is a
  lineage error and routes no Bards r03 Integrator item.

rationale:
  - >-
    The Bards lineage is a direct predecessor-successor pair. Forcing r03 into
    both bridge positions of DEC-2026-0064 would require one Review to supersede
    both r02 and itself, which is impossible and would fork or falsify history.
  - >-
    r03 independently reconstructs a narrow packaging correction from r01, the
    immutable r04 GUP, and INT-20260827-001. The exact 57-row component and all
    asserted graph content remain unchanged.
  - >-
    Record-level validation preserves the fail-closed rule: a future unreadable
    Review is never admissible merely because it has a successor.

