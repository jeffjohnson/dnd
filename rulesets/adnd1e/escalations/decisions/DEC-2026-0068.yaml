sequence:
  - step: 1
    owner: architect
    action: >-
      Publish this Decision and move the Reviewer escalation to decided state.
      Preserve every Bards source, GUP, Review, Approved bundle, registry, and
      canonical artifact unchanged.
  - step: 2
    owner: builder
    action: >-
      Add only the `review_direct_predecessor_repairs` validator and routing to
      the common scanner and common-schema suite. It must re-derive every
      record field and retain errors for all denied cases. Publish
      IMP-DEC-2026-0068-r01.
  - step: 3
    owner: reviewer
    action: >-
      Independently review IMP-DEC-2026-0068-r01. Verify the exact Bards route,
      all denial cases, ordinary bridge preservation, and unchanged artifacts.

acceptance_tests:
  - >-
    With this active record and the named live files, r02 remains an unreadable
    checksum-verified historical predecessor, r03 and its bundle parse and
    validate, all direct links and r03 provenance match, and the scanner emits
    one `review_unreadable_direct_predecessor_repaired` informational finding
    rather than r02's ordinary yaml_unreadable error.
  - >-
    A missing, inactive, malformed, or checksum-mismatched record; parseable
    r02; wrong parser fragment; altered r01, r03, r03 bundle, GUP, rejection,
    or component; wrong direct supersedes; non-approved or schema-invalid r03;
    wrong r03 handoff; mismatched bundle approval; non-contiguous 29/28 rows;
    nonzero updates; or a node count other than eleven is a lineage error and
    yields no Bards r03 Integrator item.
  - >-
    The common schema suite treats only this checksummed r02 and the already
    governed Druid r04 as expected unreadable packet artifacts. Every other
    unreadable published packet artifact remains a failure; ordinary Review
    lineage, handoff, retirement, and bundle checks remain green.
  - >-
    IMP-DEC-2026-0068-r01 pins this Decision checksum, records passing focused
    and full applicable common-tooling evidence, reports every direct test as
    passed, and is approval-ready for independent Reviewer verification.

post_implementation_requirements:
  - >-
    DEC-2026-0069 independently extends Integrator admission to this exact
    record. Until that implementation is independently approved, Integrator
    retains its existing fail-closed behavior for Bards r02.
  - >-
    Integrator applies only the existing r03 Approved bundle through normal
    bundle verification and transaction processing after both exact admission
    implementations are complete. This Decision authorizes no canonical write.

