      Publish this Decision, update the two contracts and all role publication
      instructions, and move the escalation to decided state. Do not modify any
      published Review or graph artifact.
  - step: 2
    owner: builder
    action: >-
      Implement the exact r01/r02 Decision Implementation Review record in the
      common scanner and schema sweep. Implement the target-only staged YAML and
      schema preflight command and focused tests. Publish IMP-DEC-2026-0072-r01.
  - step: 3
    owner: reviewer
    action: >-
      Independently review IMP-DEC-2026-0072-r01, including every denial case,
      the r01 informational classification, and target-only preflight behavior.

acceptance_tests:
  - >-
    With this active record and the pinned live files, r01 remains unreadable at
    its recorded parser fragment, r02 parses and validates against the Decision
    Implementation Review schema, directly supersedes r01, and has matching
    reviewed-implementation and Decision provenance. The scanner and common
    schema suite report exactly one informational historical finding for r01
    rather than a fatal parse error.
  - >-
    A missing, inactive, malformed, parseable, checksum-mismatched, wrong-parser
    fragment, wrong direct supersedes, schema-invalid successor, wrong
    disposition, wrong reviewed implementation, or wrong Decision provenance
    record is fatal and does not suppress r01's ordinary YAML error. No other
    unreadable implementation Review receives an exemption.
  - >-
    validate_artifact.py accepts a valid staged YAML mapping against its supplied
    schema; rejects invalid YAML including colon-space and continuation prose;
    rejects a non-mapping root, schema failure, missing schema, and unresolved
    schema reference; makes no final artifact write; and reads no corpus,
    packets, or canonical data.
  - >-
    Every role instruction requires the target-only staged preflight before its
    existing create-only final-path preflight for its YAML outputs. The command
    accepts an explicit applicable schema rather than inferring authority from
    an artifact filename.
  - >-
    contracts/WORK_QUEUES.md is Version 1.27 or later and
    contracts/ARTIFACT_LIFECYCLE.md is Version 1.21 or later, retaining the
    exact unreadable implementation-Review record and target-only staged
    YAML/schema preflight rules.
  - >-
    IMP-DEC-2026-0072-r01 pins this Decision checksum, records passing focused
    and full applicable common-tooling evidence, reports every direct test as
    passed, and is approval-ready for independent Reviewer verification.

