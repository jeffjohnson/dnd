question: >-
  How is the immutable, unreadable DEC-2026-0065 r01 implementation Review
  handled, and how must the repository prevent free-text YAML serialization
  defects from reaching durable publication?

ruling: >-
  The existing r02 is the one valid direct successor of the unreadable r01
  Decision Implementation Review. Builder must implement the exact record below
  so r01 is reported as historical unreadable evidence rather than a fatal
  scanner and schema-sweep error. The record is valid only while r01 retains its
  pinned bytes and parser failure, r02 retains its pinned bytes, schema validity,
  direct supersedes link, reviewed implementation, Decision provenance, and
  revision-required disposition. It does not deserialize r01, infer its fields,
  complete DEC-2026-0065, or exempt any other artifact.

  The prevention rule is a required target-only staged preflight, not a mandated
  YAML serialization library. Before any role creates a durable YAML artifact,
  it must validate the exact staged UTF-8 bytes through the shared parser and
  applicable JSON Schema, then perform the existing create-only destination
  preflight. Parsing or schema validation failure prohibits publication. The
  validator must not scan the corpus, reload packets, or inspect canonical data.
  Existing durable artifacts remain immutable; this rule applies prospectively.

rationale:
  - >-
    r02 already provides the only lawful correction to r01. Publishing another
    Reviewer artifact would duplicate a completed successor rather than repair
    the historical parse failure.
  - >-
    All three known unreadable Reviews arose while rendering free-text YAML.
    Exact-byte parsing and schema validation catches both colon-space and
    continuation failures regardless of how a role constructs YAML.
  - >-
    A per-artifact preflight gives each role the needed guarantee without the
    cost and unrelated failure surface of re-reading the repository on every
    publication.

