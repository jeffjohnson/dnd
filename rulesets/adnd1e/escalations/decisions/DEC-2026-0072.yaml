post_implementation_requirements:
  - >-
    Future roles use the staged preflight as part of ordinary publication. A
    preflight pass does not approve semantic content or replace each role's
    normal source, graph, provenance, component, and create-only checks.
  - >-
    Any future unreadable artifact remains fatal unless a separate active
    Architect Decision validates an exact record. This Decision creates no
    generic historical bypass.

