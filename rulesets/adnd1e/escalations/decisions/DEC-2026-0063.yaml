question: >-
  Which artifact records the outcome of an Integrator-assigned check that is
  neither an integration nor a rejection, and does a passing result discharge
  the Integrator handoff on its own, or must the Reviewer publish approving
  successors first?

ruling: >-
  No third Integrator record kind is created. A standalone passing preflight is
  approval evidence, not an Integration or Integration Rejection: its durable
  home is the Reviewer successor that independently verifies the exact inputs,
  method, and result, then approves the reviewed GUP and emits its ordinary
  Approved bundle. A passing Integrator run alone does not complete a
  `revision_required` Review, does not consume its handoff, and does not release
  canonical integration.

  Review-contract 1.3 prohibits a `revision_required` Review from handing
  Integrator a standalone check. Integrator handoff is reserved for an approved
  Review with an exact Approved bundle to integrate. A check that only decides
  whether the reviewed GUP is approvable belongs in the Reviewer's independent
  validation. An Integrator may provide a reproducible working measurement, but
  must not manufacture an Integration manifest or rejected record for a pass;
  the Reviewer independently re-derives or verifies it in the successor Review.

  The two current Magic-User Reviews are immutable legacy evidence. Their ready
  handoffs are replaced by this Decision. Reviewer immediately publishes
  schema-valid 1.3 approving successors for the same GUPs, recording the
  exact five-field preflight, exact component checksums, current canonical
  comparison, and INT-20260825-001 provenance. The successors emit ordinary
  Approved bundles, which then create normal Integrator work. No Builder GUP
  revision and no synthetic Integrator artifact is authorized.

  The scanner must honor a Review handoff's `readiness`: a revision-required
  Review with `readiness: blocked` appears only as blocked work, never as ready.
  This fixes the reported general queue defect without inferring that a blocked
  prerequisite has been resolved.

rationale:
  - >-
    Integration records assert a canonical transaction and rejection records
    assert a nonempty failed bundle set. Writing either for a passing check
    would place a false immutable statement in repository provenance.
  - >-
    Review already owns the judgment whether its GUP is approvable and can
    record exact independent validation. A new record type would add a second
    approval path while leaving the Review as the required consumer.
  - >-
    Readiness is a contract state, not descriptive prose. Treating blocked
    Review handoffs as ready misreports real work for any role and inflates the
    queue count the user uses for coordination.

