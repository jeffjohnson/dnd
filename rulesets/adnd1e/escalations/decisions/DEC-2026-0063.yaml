sequence:
  - step: 1
    owner: architect
    action: >-
      Publish this Decision, decide the escalation, version Review-contract 1.3
      and the named instructions, and preserve all existing Reviews, GUPs,
      Approved bundles, rejection records, Integration manifests, registries,
      and canonical data unchanged.
  - step: 2
    owner: reviewer
    action: >-
      Immediately publish the two exact 1.3 Review successors named above. Each
      reviews the same immutable GUP, independently records the exact five-field
      assertion-key check and current checksums, cites the decided escalation
      and INT-20260825-001, is approved, terminal as a Review, and emits its
      normal Approved bundle. Do not request a Builder GUP revision and do not
      create an Integrator report for the passing check.
  - step: 3
    owner: integrator
    action: >-
      Integrate only the ordinary Approved bundles emitted by the two successor
      Reviews. Run the full transaction normally; no special record exists for
      the earlier standalone preflight.
  - step: 4
    owner: builder
    action: >-
      Implement the 1.3 scanner behavior and tests. Respect every active
      revision-required Review handoff's readiness: report `blocked` as blocked
      and preserve its role, reason, and unresolved blockers; do not emit a
      ready item. Publish IMP-DEC-2026-0063-r01.
  - step: 5
    owner: reviewer
    action: >-
      Independently review IMP-DEC-2026-0063-r01. Confirm that approved Review
      bundle handoffs still reach Integrator, standalone-check legacy work is
      replaced only by the exact Decision record, and blocked Review handoffs
      never inflate ReadyCount.

acceptance_tests:
  - >-
    Review-contract 1.3 rejects a Review whose effective disposition is
    `revision_required` and whose handoff names Integrator. It continues to
    accept an approved Review that hands off its exact Approved bundle to
    Integrator, and 1.2 and older immutable Reviews retain their historical
    schema treatment.
  - >-
    The scanner reports a revision-required Review with a blocked handoff as
    one blocked item for its named role, with its unresolved blockers and no
    ready duplicate. Changing that handoff to ready produces its ordinary ready
    item; existing approved-Review-to-Integrator bundle routing remains
    unchanged.
  - >-
    The decided escalation records both exact originating Review IDs and paths,
    so their legacy Integrator handoffs are suppressed and only DEC-2026-0063's
    Builder implementation job is derived until the named successor Reviews
    create normal Approved bundles.
  - >-
    The two required Reviewer successors preserve their exact reviewed GUP and
    source judgments, record passing independently verified five-field results
    against the checksummed components and current canonical state, and emit
    Approved bundles without a Builder GUP revision or a fabricated Integrator
    record.
  - >-
    IMP-DEC-2026-0063-r01 pins this Decision checksum, reports every direct
    acceptance test passed with passing focused and full applicable validation,
    and is approval-ready for independent Reviewer verification. The two
    ordinary successor Review and Integration lineages do not block that Review.

post_implementation_requirements:
  - >-
    The Reviewer successors and their Approved bundles are the only durable
    record of the passing preflight. Integrator's working measurement and this
    decided escalation are inputs to that independent evidence, not a substitute
    for it.
  - >-
    No role supersedes, withdraws, or fabricates a passing replacement for
    INT-20260819-002. The old rejection remains immutable historical evidence.
  - >-
    Analyst has no work under this Decision.

