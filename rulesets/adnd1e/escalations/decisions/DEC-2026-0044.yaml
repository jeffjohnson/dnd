implementation_scope:
  operation_model: decision_migration_v2
  required_behavior:
    - >-
      Discover an Approved v2 manifest with no edge CSV and exactly one
      checksummed decision-migration GUP component plus one validation component
      as one Integrator job.
    - >-
      Reject a missing, extra, mismatched, or edge-CSV component; non-approved
      Review; mismatched GUP/Decision checksum; baseline drift; incomplete
      before-image or incident set; label mismatch; existing survivor identity;
      non-paired endpoint change; surviving retired identity; or post-operation
      duplicate assertion key before committing any canonical or registry write.
    - >-
      Treat a v2 `registry_csv_row` only as the advisory locator defined by
      DEC-2026-0038. Retired ID and label plus the pinned registry checksum are
      the transaction preconditions.
    - >-
      Apply each approved v2 merge and its paired endpoint repoints in one
      transaction, rebuild derived artifacts only after all invariants pass,
      record the applied Approved bundle and authority Decision in provenance,
      and restore all files byte-for-byte after a late failure.

migration_required: false
migration_scope:
  canonical_data_change: false
  registry_change: false
  artifact_lineage_change: false
  note: >-
    This Decision authorizes integration capability only. The later approved
    v2 bundle, if its baseline remains current, is the separate canonical
    migration authorized by DEC-2026-0038.

sequence:
  - step: 1
    owner: integrator
    action: >-
      Implement the bounded v2 discovery and transaction path, add regression
      coverage, and publish IMP-DEC-2026-0044-r01 with `implemented_by:
      integrator`. Do not alter the GUP, Review, Approved bundle, canonical
      graph, or registry while implementing this capability.
  - step: 2
    owner: reviewer
    action: >-
      Independently review the Integrator implementation report, including
      no-edge-CSV discovery, all stated rejection conditions, transaction
      rollback, provenance, and v1 non-regression.
  - step: 3
    owner: reviewer
    action: >-
      After the capability Review is Approved, supersede the current
      architect-escalation Review with a current-baseline Review of r03. Approve
      and materialize its direct-migration Approved bundle only if every pinned
      input still matches; otherwise issue `revision_required` to Builder.
  - step: 4
    owner: integrator
    action: >-
      Integrate only the newly approved exact v2 bundle, then produce the normal
      transaction manifest, validation report, diff, and derived outputs.
  - step: 5
    owner: analyst
    action: >-
      Publish the DEC-2026-0038-required DMG GUR successor only after the
      Integration record exists.

acceptance_tests:
  - >-
    A valid v2 Approved manifest with no edge CSV discovers as exactly one
    Integrator job, while v1 direct migrations and packet-update bundles retain
    their existing discovery behavior.
  - >-
    Every malformed v2 manifest, component, approval, provenance, baseline,
    identity, before-image, incident-set, paired-repoint, duplicate-key, and
    retired-identity condition listed in `implementation_scope` is rejected
    before a write or restores all affected files byte-for-byte.
  - >-
    A moved advisory `registry_csv_row` with matching retired ID and label is
    recorded as informational and does not reject the transaction; a missing ID,
    label mismatch, or registry checksum drift still rejects it.
  - >-
    The Integrator implementation report is independently Approved under the
    DEC-2026-0043 direct-implementation lifecycle and records complete current
    Integrator test evidence.
  - All applicable Integrator, queue, schema, migration, and repository tests pass.

post_implementation_requirements:
  - >-
    The Reviewer independently revalidates GUP-MIG-DEC-2026-0032-r03 against
    then-current canonical and registry baselines. A baseline change requires a
    Builder successor plan; unchanged baseline permits a normal approved v2
    bundle with no edge CSV.
  - >-
    The subsequent Integration and Analyst GUR successor follow DEC-2026-0038;
    neither is evidence for this capability Decision's implementation report.

constitution_version_impact:
  changed: false
  retained: '1.8'
  rationale: The operation model is already defined by DEC-2026-0038 and does not change ontology.

governance_changelog:
  - >-
    DEC-2026-0044 makes the existing v2 Integrator requirement a checked,
    queue-visible direct capability implementation before its reviewed plan is released.

