decision_date: '2026-08-17'
escalation_id: ESC-2026-08-17T16.15.00.000Z
implementation_owner: integrator

question: >-
  What release path applies when DEC-2026-0038 requires a no-edge-CSV
  `decision_migration_v2` bundle but the installed Integrator recognizes only
  v1 bundles?

ruling: >-
  The v2 capability is required implementation, not a GUP, Review, source, or
  canonical-data defect. The Integrator must implement and evidence v2 manifest
  discovery, component verification, strict preconditions, transactional merge
  execution, and provenance exactly as DEC-2026-0038 and WORK_QUEUES require.
  It must publish an Integrator-owned Decision Implementation Report under the
  direct-implementation lifecycle established by DEC-2026-0043. Once its
  independent implementation Review is Approved, the Reviewer reissues the
  existing v2 migration Review against the current pinned baseline: approve and
  materialize the no-edge-CSV Approved bundle if the baseline remains exact, or
  route Builder to re-plan a successor GUP if it moved. No role may rewrite the
  reviewed r03 plan as v1, add an edge CSV, mutate canonical data before
  approval, or repair its 33 rows merely to address this tooling gap.

rationale:
  - >-
    The current r03 plan and Review independently establish the three merges,
    all six retired identities, every 33-row before-image, and the v2-only
    operation shape. The refusal occurs before any canonical snapshot because
    discovery incorrectly rejects the required no-edge-CSV v2 manifest.
  - >-
    Adding an edge CSV or flattening the plan to v1 would discard the explicit
    decision-migration representation necessary for a bounded many-to-one
    registry merge.
  - >-
    Tool capability must be reviewed before the Reviewer approves an input that
    depends on it. Rechecking the mutable baseline after capability work keeps
    the existing transaction preconditions strict.

authority_inputs:
  governing_decision:
