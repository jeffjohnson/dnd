decision_date: "2026-08-12"
escalation_id: ESC-2026-08-12T15.47.52.687Z
supplements: [DEC-2026-0027]

question: >-
  Does the one-to-four-word aspect cap and the prohibition on copied rule prose
  retroactively invalidate the legacy 13-field migrated canonical rows that
  predate Reviewer-governed source work, and how should the two candidate
  assertion-key collisions be handled?

ruling: >-
  The current grain requirements bind every proposed GUP row and every revised
  row. They do not retroactively invalidate a canonical row solely because its
  aspect exceeds four words or repeats rule prose when its production lineage
  is rooted in the pre-Review 13-field migration at
  migrations/adnd1e/legacy-import/original/edges_master.csv. That exception is
  historical conformance debt, not a license to carry a nonconforming aspect
  into new or revised work. It applies only to the word-count and copied-prose
  requirements; numeric and magnitude prohibitions remain universal.

  No corpus-wide aspect rewrite is authorized. Mechanical truncation is
  prohibited because it changes an assertion key while deciding, without source
  reading, what facet the row asserts.

  The two reported pairs are candidate identity collisions, not established
  duplicate assertions. Their source texts must be read before any row is
  changed. Existing PHB packets provide two loci; the repository source steward
  must first supply conforming bounded DMG page 64 and UA page 15 packets. Once
  those packets are claimed, Analyst determines separately whether each pair
  states one facet or two. Only a source-backed ordinary lifecycle may revise,
  retain, merge, or retire the affected assertions.

rationale:
  - >-
    The escalation's count establishes substantial historical conformance debt,
    but its measurement finds only two candidate groups among 4,115 normalized
    endpoint-and-condition groups. The cost and semantic risk of re-deriving
    1,919 aspects are disproportionate to the unproven present correctness
    impact.
  - >-
    An aspect is part of the assertion key. Selecting a shorter phrase is an
    interpretation of the cited rule and may merge or split assertions. Builder
    cannot make that source judgment, and Architect does not extract source.
  - >-
    The two candidates span PHB with DMG and UA. The PHB source packets exist,
    but DMG and UA source remains an external input dependency under DEC-2026-0027.
    Legacy canonical text and extraction batches are not source-read evidence.
  - >-
    A provenance-bound exception keeps the requirement enforceable for new work
    without pretending that unreviewed historical rows were authored under a
    rule that did not govern their migration.

legacy_conformance_scope:
  governed_requirements:
    - Constitution section 5: aspect is one to four words.
    - GRAPH_INVARIANTS 11: copied rule prose is prohibited in aspect or condition.
  root_provenance_path: migrations/adnd1e/legacy-import/original/edges_master.csv
  eligible_rows: >-
    Only rows whose first production lineage antecedent is the pre-Review,
    13-field legacy import rooted at root_provenance_path. Eligibility is
    provenance-based; it is not inferred from pass, row number, text length,
    or visual similarity to historical data.
  exception_limited_to:
    - aspect word-count breaches
    - copied rule prose in aspect or condition
  never_exempt:
    - magnitudes
    - die expressions
    - numeric bonuses
    - threshold values
    - any newly proposed or revised row
  required_behavior_on_touch: >-
    A source-backed revision must comply with the current grain requirements,
    preserve immutable prior artifacts, and follow the normal Analyst, Builder,
    Reviewer, and Integrator lifecycle. No worker may mechanically truncate or
    silently normalize an excepted row.

implementation_requirements:
  builder_owned_files:
    - tooling/builder/tests/test_registry_and_vocab.py
  requirements:
    - >-
      Replace the hard-coded GRAPH_INVARIANTS 1.0 expectation with the current
      1.1 version, and assert that the legacy migration conformance scope
      preserves the current assertion-key delegation.
    - >-
      Add focused coverage that new or revised rows remain subject to the
      one-to-four-word and copied-prose requirements, while the historical
      exception is provenance-bound and cannot be inferred from pass, row
      location, or aspect text.
    - >-
      Do not relax tooling validation for a nonconforming proposed GUP. The
      existing grain validator remains the enforcement mechanism for new and
      revised work.

candidate_identity_investigation:
  disposition: deferred_pending_conforming_source_packets
  statement: >-
    These pairs are candidates because their current assertion keys differ by
    aspect with the same source ID, edge type, target ID, and empty condition.
    They are not approved merges, and no row is changed by this Decision.
  pair_1:
    subject: equipment cost relationship
    rows:
      - source_id: sys_equipment
        edge_type: CONSUMES
        target_id: money_gp
        aspect: acquisition cost at DM adjudication
        condition: ""
        book: DMG
        page: "64"
        section: MISSILE DISCHARGE
      - source_id: sys_equipment
        edge_type: CONSUMES
        target_id: money_gp
        aspect: purchase cost
        condition: ""
        book: PHB
        page: "35"
        section: EQUIPPING THE CHARACTER
        packet_id: PKT-PHB-035-038-money-equipment
    required_sources:
      - existing claimed PHB packet PKT-PHB-035-038-money-equipment
      - bounded incoming DMG packet covering printed page 64
  pair_2:
    subject: experience-level hit-point relationship
    rows:
      - source_id: exp_level
        edge_type: MODIFIES
        target_id: rule_hit_points
        aspect: different dice if entering via the ranks
        condition: ""
        book: UA
        page: "15"
        section: CAVALIERS TABLE I
      - source_id: exp_level
        edge_type: MODIFIES
        target_id: rule_hit_points
        aspect: hit dice gained
        condition: ""
        book: PHB
        page: "34"
        section: CHARACTER HIT POINTS
        packet_id: PKT-PHB-033-035-alignment-hp-languages
    required_sources:
      - existing claimed PHB packet PKT-PHB-033-035-alignment-hp-languages
      - bounded incoming UA packet covering printed page 15
  analyst_question: >-
    For each pair, identify from the two supplied loci whether the rules assert
    the same affected facet under the same condition, or separate facets. Do
    not infer identity from endpoints, labels, or legacy aspect wording. State
    a conforming one-to-four-word aspect only where source supports it.
  permitted_outcomes_after_source_reading:
    - retain both assertions with distinct conforming facets or conditions
    - revise one or both assertions to conforming source-backed facets
    - merge duplicate assertions through approved normal lifecycle
    - retire an unsupported or duplicate assertion through approved normal lifecycle
  prohibited_before_source_reading:
    - changing, merging, retiring, or de-duplicating any listed canonical row
    - using legacy canonical rows or archive extraction batches as source-read evidence
    - mechanically truncating either aspect

