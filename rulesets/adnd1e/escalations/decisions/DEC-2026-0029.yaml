    corpus-wide conformance rewrite.

acceptance_tests:
  - >-
    GRAPH_INVARIANTS is version 1.1 and scopes the aspect-word-count and copied
    prose requirements by legacy-import provenance while preserving the numeric
    prohibitions for every row.
  - >-
    Builder validation rejects a five-word or copied-prose aspect in every new
    or revised GUP row, including a revision of a provenance-excepted legacy row.
  - >-
    No canonical row changes solely because it is counted among the 1,919
    historical word-count breaches, and no GUP uses mechanical truncation to
    produce a conforming aspect.
  - >-
    The candidate investigation uses the exact two pairs and four loci named in
    this Decision. It makes no endpoint-only identity inference and changes no
    row before conforming DMG page 64 and UA page 15 packets are claimed.
  - >-
    After those packets are available, any correction is source-backed,
    individually reviewed, checksummed, and integrated through the ordinary
    lifecycle; it does not use a bulk decision migration.
  - >-
    Builder updates the governed GRAPH_INVARIANTS assertion and focused
    legacy-scope coverage in tooling/builder/tests/test_registry_and_vocab.py;
    the complete Builder and common test suites pass.
  - All applicable contract, schema, queue, and repository validations pass.

constitution_version_impact:
  changed: false
  version: "1.7"
  reason: >-
    The Constitution's grain requirements remain unchanged. GRAPH_INVARIANTS
    now records their non-retroactive, provenance-bound application to the
    earlier unreviewed migration corpus.

follow_up_owner: builder
follow_up_owners:
  builder:
    - Update the governed GRAPH_INVARIANTS test and add the required focused legacy-scope coverage.
    - Run the complete Builder and common test suites and publish the Decision Implementation Report.
    - Keep enforcing current grain validation for all new and revised GUP rows.
    - Do not mechanically truncate or rewrite a legacy aspect.
  repository_source_steward:
    - Supply lawful bounded incoming Pandoc Markdown packets for DMG printed page 64 and UA printed page 15.
    - Do not use legacy extraction batches, reconstructed prose, or canonical rows as packet source text.
  analyst:
    - After the two packets are claimed, perform the two source comparisons specified above.
    - Publish source-backed GUR revisions only for the rows that the reading proves require action.
  reviewer:
    - Verify any later correction against both cited source loci and the current grain requirements.
  integrator:
    - Apply only later Approved packet-update bundles; this Decision changes no canonical row directly.

prohibited_actions:
  - Do not treat a legacy pass value, line number, or long aspect by itself as proof of exception eligibility.
  - Do not weaken the four-word cap or copied-prose prohibition for new or revised work.
  - Do not launch a corpus-wide cleanup or decision migration for the 1,919 historical rows.
  - Do not change the four candidate rows until claimed DMG and UA packets support a fresh reading.
  - Do not use archive extraction batches, legacy canonical data, endpoint names, or inference as source-read evidence.
  - Architect does not edit canonical graph, registry, GUR, GUP, Review, Approved, or Integration artifacts.
