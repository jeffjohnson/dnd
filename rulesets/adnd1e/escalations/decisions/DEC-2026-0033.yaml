question: >-
  How are ordinary weapons represented without widening the magic-item namespace,
  and can a class identity distinguish a class-specific flat hit-point progression
  without carrying a prohibited magnitude?

ruling: >-
  Add `weapon_` as the dedicated identity prefix for a mundane weapon, weapon
  category, or source-named weapon family. `wpn_` remains only for a weapon
  property or statistic, and `item_` remains only for a magic item or item class.
  A qualitative class identity is a permitted `condition` discriminator when it
  identifies a class-specific facet; it is not a magnitude. The UA Cavalier
  progression is therefore representable as an `exp_level MODIFIES
  rule_hit_points` assertion with aspect `flat gain past level` and condition
  `cavalier`, omitting both the amount and threshold.

rationale:
  - >-
    A mundane weapon is a recurring, source-named identity across the corpus.
    Widening `item_` would erase the existing magic-item namespace boundary,
    while `wpn_` correctly continues to name properties such as range and speed
    factor rather than the weapon being described.
  - >-
    Existing canonical conditions already use qualitative class membership,
    including `fighter classes only` and `monks`. A class name distinguishes the
    applicable rule without smuggling a number into identity.
  - >-
    The five-field assertion key remains unchanged. Status does not distinguish
    the UA assertion from PHB; the class condition does.

constitution_amendment:
  release: '1.8'
  changed_sections:
    - '3.1 Format: weapon_ is a mundane-weapon namespace.'
    - '3.1 Format: wpn_ remains a weapon-property/statistic namespace.'
  rejected_alternatives:
    - Widen item_ to ordinary weapons.
    - Use wpn_ for a named mundane weapon.
    - Treat weapon-specific rules as outside graph scope.

