decision_date: '2026-08-25'
escalation_id: ESC-2026-08-25T14.02.11.480Z
decision_authoring_contract_version: '1.1'

question: >-
  How must immutable Decision Implementation Report evidence recognize standard
  unittest success output, and may a schema-invalid Decision Implementation
  Review consume a Decision in queue derivation?

ruling: >-
  A validation summary ending in the standard unittest form `OK (skipped=N)`
  is passing evidence when its exit code and recorded result also say passed.
  It is not a report defect and must not cause a create-only report successor
  or an exception for a pre-publication failing suite. The evidence guard must
  recognize only the standard unittest terminal verdict grammar: `OK` or
  `FAILED`, optionally followed by parenthesized, comma-separated recognized
  integer counters. A passing `OK` record may contain only non-failing counters
  (`skipped` and `expected failures`); arbitrary trailing prose, malformed
  counters, and an `OK` record with failure, error, or unexpected-success
  counters remain invalid.

  The existing reports IMP-DEC-2026-0053-r03 and IMP-DEC-2026-0060-r01 record
  authentic `OK (skipped=38)` Builder-suite output. They remain immutable
  current leaves and require no Builder reissue. Their active
  `revision_required` Reviews are repaired in the ordinary Review lineage by
  schema-valid, independently approved successor Reviews after this Decision's
  implementation is itself reviewed.

  A Decision Implementation Review is capable of consuming a Decision only if
  it validates against `schemas/common/decision-implementation-review.schema.json`
  as well as satisfying its existing provenance and approval predicates. An
  invalid Review's `status`, `overall_disposition`, reviewed-artifact reference,
  and handoff are untrusted: it completes no Decision and creates no Builder
  revision request. The scanner emits one error and one Reviewer repair item for
  the active invalid Review. This applies existing lifecycle language requiring
  exact schemas; it changes no contract, schema, or ontology.

rationale:
  - >-
    The former end-of-string matcher rejects literal successful unittest output
    whenever tests are skipped. Rewording the historical summary or recording
    a fictitious post-publication run would weaken immutable provenance; parsing
    the runner's actual bounded grammar preserves it.
  - >-
    A checksummed implementation Review is the consuming artifact. Treating
    fields from a schema-invalid file as approval makes malformed YAML complete
    a Decision while the repository validation suite rejects the same file.
  - >-
    A general predecessor-failure exemption would let a report self-assert that
    a red pre-publication suite is acceptable. The reported issue is instead a
    parser defect with an objective, standard runner syntax and has no need for
    an evidence exception.

