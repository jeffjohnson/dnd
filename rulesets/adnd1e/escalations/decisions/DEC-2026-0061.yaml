  - step: 2
    owner: reviewer
    action: >-
      Publish REV-IMP-DEC-2026-0046-r11-r02 as the schema-valid direct successor
      to r01 before Builder's full-suite evidence is collected. Quote or use a
      block scalar for every comma-containing evidence value. Reuse the exact
      reviewed report and Decision checksums, independently verify the 0046
      acceptance tests, and make the successor approved and terminal only if
      that verification passes. Do not request a Builder reissue merely to
      repair r01's YAML shape.
  - step: 3
    owner: builder
    action: >-
      Implement this Decision after the r11-r02 Review validates. Use the common
      schema suite's supported JSON Schema validator and reference registry to
      validate each active Decision Implementation Review against the exact
      Review schema; do not duplicate a partial field list. Add bounded parser
      tests for standard unittest terminal summaries and queue tests for invalid
      Review non-consumption and Reviewer repair routing. Publish
      IMP-DEC-2026-0061-r01 with passing focused and full applicable suite
      evidence.
  - step: 4
    owner: reviewer
    action: >-
      Independently review IMP-DEC-2026-0061-r01. Verify the grammar does not
      accept arbitrary suffixes, invalid Reviews cannot complete or route a
      Decision to Builder, a valid successor restores ordinary approved
      completion, and existing valid implementation-Review behavior is intact.
  - step: 5
    owner: reviewer
    action: >-
      After step 4 is approved, independently re-review the retained reports
      and publish REV-IMP-DEC-2026-0053-r03-r02 and
      REV-IMP-DEC-2026-0060-r01-r02 as schema-valid approved successors to their
      respective r01 revision-required Reviews if their existing report evidence
      and acceptance tests pass. These successors, not new Builder reports,
      consume the two report lineages.

acceptance_tests:
  - >-
    The evidence guard accepts `Ran 655 tests in 103.582s OK (skipped=38)` only
    when `exit_code: 0` and `result: passed` agree. It accepts the standard
    terminal `OK` and `FAILED` forms with recognized integer counters, rejects
    arbitrary trailing text and malformed counters, and rejects a passing `OK`
    record containing `failures`, `errors`, or `unexpected successes` counters.
  - >-
    IMP-DEC-2026-0053-r03 and IMP-DEC-2026-0060-r01 pass the corrected
    self-consistency guard unchanged. No successor implementation report is
    published for either solely to restate its existing Builder-suite summary.
  - >-
    An active Review that fails the exact Decision Implementation Review schema
    emits one `decision_implementation_review_invalid` error and one Reviewer
    repair item; its claimed approval does not complete the Decision and its
    claimed revision request does not create Builder work. Schema failure text
    identifies the Review and cause.
  - >-
    A schema-valid direct Review successor for the same report and Decision
    clears the repair condition and permits normal approved or revision-required
    handling. Existing valid approved Review consumption and valid
    revision-required routing remain unchanged.
  - >-
    REV-IMP-DEC-2026-0046-r11-r02 is a schema-valid direct successor of r01
    with quoted or block-scalar comma-containing evidence. It preserves the
    exact report and Decision provenance and, if approved, is the only Review
    that completes DEC-2026-0046.
  - >-
    IMP-DEC-2026-0061-r01 pins this Decision's checksum, reports every direct
    acceptance test passed with passing focused and full applicable validation,
    and is approval-ready for independent Reviewer verification. The downstream
    0053 and 0060 Review successors do not block that Review.

post_implementation_requirements:
  - >-
    Reviewer publishes the two named approved successors for IMP-DEC-2026-0053-r03
    and IMP-DEC-2026-0060-r01 only after approving IMP-DEC-2026-0061-r01. The
    reports remain byte-immutable and no Builder report reissue is authorized by
    this Decision.
  - >-
    Builder must not author or edit decision-implementation Review artifacts.
    Reviewer must validate every successor Review against its schema before
    publication.
  - >-
    Analyst and Integrator have no work under this Decision.

