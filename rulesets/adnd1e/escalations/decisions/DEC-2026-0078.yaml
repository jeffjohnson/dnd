question: >-
  Does DEC-2026-0075's live-corpus invariant requirement authorize the
  disclosed test-only rewind guard, or must each such guard have a separate
  Decision Implementation Report and independent Review?

ruling: >-
  The disclosed repair is accepted as ordinary Integrator-owned test-fixture
  maintenance. DEC-2026-0075's prospective Report and Review requirement was
  limited to the exact dependency-closure guard that Decision ordered; it does
  not make every later test-only guard a direct Decision implementation.

  Going forward, the Integrator may repair or add a test-only regression guard
  without a new Decision, Decision Implementation Report, or Review when all
  of these conditions hold: the changed paths are confined to
  tooling/integrator/tests/; no production applier, schema, contract,
  registry, canonical data, migration plan, GUR, GUP, Review, Approved bundle,
  manifest, or report changes; the guard derives its result from current
  corpus state or an authorized transaction and asserts an invariant that
  survives successful integration; and the guard is shown falsifiable by the
  defect it prevents. Any change outside that boundary, or a corpus-specific
  special case rather than an invariant, remains subject to an Architect
  Decision and the normal implementation lifecycle before it is published.

  The existing escalation is the durable disclosure for this repair. Future
  repairs that satisfy the standing boundary need no escalation solely to
  obtain authorization; their test source, commit history, and normal suite
  evidence are the record. The Integrator must escalate before publication
  whenever its scope is uncertain.

rationale:
  - >-
    The authorized DEC-2026-0077 integration changed canonical state exactly
    as planned. The defect occurred only while the Integrator rebuilt a test
    clone and therefore did not alter graph semantics, provenance, or any
    published integration artifact.
  - >-
    The repair changes only tooling/integrator/tests/test_transaction.py. Its
    fixed-point guard is expressed over registered identities rather than a
    transient row locator, fixed queue bucket, or named active revision, and
    the escalation records that reverting the repair makes the guard fail.
  - >-
    Requiring a Decision, implementation report, and independent Review for
    every confined test maintenance change would duplicate the ordinary
    ownership already assigned to the Integrator while adding no protection to
    canonical data. The stated boundary preserves that lifecycle for changes
    with repository-wide or production effects.

