  - {path: rulesets/adnd1e/escalations/decided/ESC-2026-08-23T22.59.17.296Z.yaml, owner: architect, sequence_step: 1}

follow_up_owner: reviewer
follow_up_owners:
  architect:
    - Preserve all named Decisions, GURs, reports, Reviews, and graph artifacts unchanged.
  reviewer:
    - Act first on the three named r02 revision requests, then review the four current Builder reports.
  builder:
