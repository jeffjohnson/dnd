acceptance_tests:
  - >-
    The direct-v1 GUP validates against the pinned baseline, adds exactly
    monster_giant / Giants, and carries exactly the source-endpoint repoint at
    canonical row 1747. It has no edge CSV or packet GUR provenance.
  - >-
    The migration changes only the named canonical row from monster_special /
    Giant-Hurled Boulders to monster_giant / Giants and preserves all its other
    assertion fields. No giant-vermin identity changes.
  - >-
    GUR r05 and GUP r03 use monster_giant / Giants for M014, remove IDQ-01 as
    unresolved, preserve all other DMG 64 assertions and provenance, and do not
    treat Giant-Hurled Boulders as a node label.
  - >-
    The r03 Review and Approved bundle approve the exact twenty-row packet
    partition of twelve additions, seven pending additions, and zero blocked rows.
  - >-
    Both transactions pass applicable schema, direct-migration, graph, registry,
    lineage, and repository validation. Ordinary packet integration occurs only
    after the direct identity migration is recorded as integrated.

post_implementation_requirements:
  - >-
    A future packet may distinguish a specific giant species only with evidence
    requiring a more specific identity; it must not repurpose monster_giant or a
    giant-vermin identity by inference.
  - >-
    Historical artifacts remain immutable provenance. The normal successor chains,
    not in-place label edits, record the correction.

