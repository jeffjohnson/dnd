question: >-
  Does DMG 64's giant-humanoid subject warrant the broad monster_giant identity,
  or must the packet reuse generic monster_special and encode the distinction
  only in a row-level field?

ruling: >-
  Register monster_giant with label Giants and kind monster. It denotes giant
  humanoids as a broad monster class. It does not merge, rename, or classify any
  existing giant-vermin identity.

  Execute the direct-v1 migration below before revising the missile-discharge
  packet: add monster_giant and repoint the one existing DMG 64 giant-humanoid
  assertion from monster_special / Giant-Hurled Boulders to monster_giant /
  Giants. Preserve every other assertion field. After integration, Analyst
  publishes GUR r05 and Builder publishes packet GUP r03, changing M014 only to
  monster_giant / Giants. Giant-Hurled Boulders is an assertion description, not
  a reusable subject identity or endpoint label.

rationale:
  - >-
    DMG 64 describes several mechanics about giant humanoids, while
    monster_special is a catch-all that cannot answer what giants specifically do.
  - >-
    The established monster taxonomy reserves monster_giant for this broad
    class. Existing monster_*_giant identities are giant vermin and remain distinct.
  - >-
    Moving the one existing same-page assertion avoids competing subjects for
    the same DMG 64 concept and keeps the packet and canonical graph aligned.

