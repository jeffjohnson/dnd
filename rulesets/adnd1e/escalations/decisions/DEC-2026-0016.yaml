question: >-
  When page attribution derived from a current claimed packet conflicts with a
  legacy canonical citation, which value governs and should the nine supplied
  canonical disagreements be corrected?

ruling: >-
  The current input packet is authoritative for printed page attribution.
  Page markers interpreted under contracts/SOURCE_MARKDOWN.md govern new
  artifacts and supersede conflicting legacy or canonical page values. Approve
  the nine supplied page-only corrections. The corrections do not change node
  identity, assertion identity, edge semantics, or evidence class. Defer the
  seventeen THE PALADIN citations because the supplied section span proves only
  that page 23 is wrong, not whether each assertion belongs to page 22 or 24.

rationale:
  - >-
    A single authoritative packet source makes citation generation
    deterministic. Treating unrecoverable legacy page values as co-equal would
    allow identical assertions to retain contradictory provenance.
  - >-
    The escalation documents a corrected Pandoc AST walk, distinguishes section
    spans from section starts, checks 326 rows, and limits its correction claim
    to nine values outside the authoritative source locus.
  - >-
    All nine changes are confined to page. The five-field assertion keys and all
    semantic fields remain unchanged, so this is a reviewed citation migration
    rather than an assertion rewrite.
  - >-
    The Paladin rows require source interpretation at assertion level. That is
    Analyst and Reviewer work, not Builder normalization and not a basis for the
    Architect to guess between two possible pages.

