supplements: [DEC-2026-0024, DEC-2026-0025]

question: >-
 Does the canonical/default component identity directed by DEC-2026-0024 remain
 rule_mistletoe / Mistletoe, or must it be rule_greater_mistletoe / Greater
 Mistletoe given the PHB distinctions and the stated default? May the exact
 DEC-2026-0025 identity migration preserve neutral/unset polarity bases on
 legacy rows 2665 and 2666?

ruling: >-
  rule_greater_mistletoe, label Greater Mistletoe, kind rule, is the one
  canonical default identity. Every unqualified packet reference to "mistletoe"
  resolves to rule_greater_mistletoe unless the text expressly identifies lesser
  mistletoe, borrowed mistletoe, holly, or oak leaves. rule_mistletoe / Mistletoe
  is not registered and is not an alias. This
  Decision supersedes every rule_mistletoe identity and packet-edge instruction
  in DEC-2026-0024 while leaving its row-1502 removal intact.

  The migration may preserve exactly rows 2665 and 2666 with polarity neutral
  and polarity_basis unset. Their identity and labels change, but no semantic or
  polarity field changes. Reviewer approval of that narrow compare-and-swap
  migration does not approve or validate either legacy polarity reading. No
  ordinary packet update or unrelated migration receives this exception.

rationale:
  - >-
    PHB 54 distinguishes greater mistletoe, properly harvested by the druid,
    from the named lesser and borrowed alternatives. The packet establishes the
    properly harvested form as the normal component and labels all other forms
    as reduced-effect alternatives.
  - >-
    A generic rule_mistletoe node would make the default and the alternatives
    ambiguous. A single Greater Mistletoe node expresses the stated default and
    lets an explicit alternative remain explicit in the edge condition.
  - >-
    The three-field source reading on PHB 54 supports the replacement-component
    comparisons below. Separate node identities for lesser mistletoe, borrowed
    mistletoe, holly, and oak leaves are unnecessary until a packet needs one as
    an endpoint rather than as an explicit condition.
  - >-
    Rows 2665 and 2666 cite unavailable legacy DMG text. Their polarity cannot
    honestly become read or derived. Refusing an endpoint-only migration would
    force an unrelated identity correction to wait on an unread source audit.

default_and_exception_mapping:
  default:
    source_terms: [mistletoe, greater mistletoe]
    canonical_id: rule_greater_mistletoe
    canonical_label: Greater Mistletoe
  explicit_exceptions:
    - lesser mistletoe
    - borrowed mistletoe
    - holly
    - oak leaves
  handling: >-
    Preserve an explicitly named exception verbatim in the condition of its
    source-supported relationship. Do not silently normalize it to greater
    mistletoe and do not register a separate exception node unless a later
    packet requires that exception as an edge endpoint.
  prohibited_generic_identity: rule_mistletoe

