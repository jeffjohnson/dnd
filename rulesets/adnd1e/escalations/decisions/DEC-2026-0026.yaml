sequence:
  - step: 1
    owner: builder
    action: >-
      Publish r03 as the active leaf of MIG-DEC-2026-0024-0025. It supersedes
      r02, checksums all three Decisions, changes the proposed node to
      rule_greater_mistletoe, preserves the exact legacy polarity fields, and
      contains no rule_mistletoe proposal or reference.
  - step: 2
    owner: reviewer
    action: >-
      Review r03 using this Decision's exact default mapping and two-row
      identity-only polarity exception. Do not create another mistletoe
      escalation unless a new claimed packet directly conflicts with PHB 54.
  - step: 3
    owner: integrator
    action: >-
      Integrate only the Approved r03 migration, including the Greater
      Mistletoe registry node, the row-1502 removal, and the plural spell-ID
      replacement; rebuild all derived canonical artifacts.
  - step: 4
    owner: reviewer
    action: >-
      Publish the required r01-r02 packet Review after integration. It replaces
      every obsolete rule_mistletoe instruction with the exact M1-M6 dispositions
      in this Decision and hands the remaining packet corrections to Builder.
  - step: 5
    owner: builder
    action: >-
      Publish the packet r02 against the integrated registry, using only
      rule_greater_mistletoe and the exact M2-M6 fields above.

acceptance_tests:
  - >-
    GUP-MIG-DEC-2026-0024-0025-r03 supersedes r02, is the active leaf of the
    same lineage, and records exact checksummed authority for Decisions 0024,
    0025, and 0026.
  - The migration proposes rule_greater_mistletoe / Greater Mistletoe and no rule_mistletoe node or alias.
  - The migration retains all DEC-2026-0024 and DEC-2026-0025 operations exactly.
  - >-
    Rows 2665 and 2666 change only their spell endpoint ID/label; their complete
    non-identity fields, including polarity neutral and polarity_basis unset,
    equal the exact before-image.
  - Reviewer applies the two-row exception only to the migration and records its identity-only scope.
  - >-
    The post-migration packet Review omits M1 and contains the exact M2-M6
    identity, type, aspect, condition, polarity, and basis values in this Decision.
  - No GUP, Review, Approved bundle, registry row, or canonical endpoint retains rule_mistletoe.
  - >-
    Future unqualified packet references to mistletoe resolve to
    rule_greater_mistletoe; explicitly named alternatives remain explicit.
  - No new mistletoe escalation is raised from this packet absent a direct conflict in a newly claimed source packet.
  - All applicable schema, lineage, registry, graph, and repository validations pass.

constitution_version_impact:
  changed: false
  version: "1.7"
  reason: >-
    Existing node, condition, polarity, and Decision-migration rules are
    sufficient. This establishes an AD&D 1e source identity default and one
    bounded migration-review exception; it does not alter the ontology contract.

follow_up_owner: builder
follow_up_owners:
  builder:
    - Publish the combined migration r03 and do not issue another r02 revision.
    - Use rule_greater_mistletoe in the later packet r02 and omit rule_mistletoe.
  reviewer:
    - Review r03 under the exact two-row exception.
    - Publish r01-r02 after integration with the exact M1-M6 disposition.
    - Do not escalate the default mapping or preserved legacy polarity again.
  integrator:
    - Integrate only the Approved r03 migration.
  analyst:
    - Treat unqualified mistletoe as Greater Mistletoe in future packets.
    - Preserve an explicitly named alternative instead of defaulting it.

prohibited_actions:
  - Do not register, reuse, or alias rule_mistletoe.
  - Do not map lesser mistletoe, borrowed mistletoe, holly, or oak leaves to Greater Mistletoe.
  - Do not change the polarity or polarity_basis of rows 2665 or 2666 in this migration.
  - Do not treat the two-row exception as approval of unset polarity in ordinary work.
  - Do not create another mistletoe escalation from this packet without a direct conflict in a newly claimed source packet.
  - Architect does not edit GUP, Review, registry, canonical, or role-tooling files.
