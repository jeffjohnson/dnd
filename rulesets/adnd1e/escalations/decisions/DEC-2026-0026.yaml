legacy_polarity_exception:
  applies_only_to:
    - canonical_row: 2665
      assertion: exp_level MODIFIES spell_call_woodland_beings
      preserve:
        polarity: neutral
        polarity_basis: unset
    - canonical_row: 2666
      assertion: spell_call_woodland_beings TRIGGERS gen_random_encounter
      preserve:
        polarity: neutral
        polarity_basis: unset
  permitted_change_fields:
    - source_id
    - source_label
    - target_id
    - target_label
  prohibited_change_fields:
    - edge_type
    - aspect
    - condition
    - polarity
    - polarity_basis
    - book
    - page
    - section
    - evidence
    - pass
    - status
    - supersession_basis
    - general_rule_id
    - review_flag
  review_meaning: >-
    Reviewer verifies the exact before-image and allowed ID/label delta. The
    resulting approval is an identity-migration approval only and does not
    waive the normal prohibition on approving unset polarity for new or
    semantically revised assertions.
  later_source_audit: >-
    A claimed DMG packet containing page 44 must source-read these two polarity
    fields in an ordinary packet lineage. This Decision never supplies a
    substitute polarity interpretation.

