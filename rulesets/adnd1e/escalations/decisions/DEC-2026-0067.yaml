question: >-
  What immutable lineage permits the Bards packaging correction to continue
  when its direct r02 Review is YAML-unreadable, while preserving all reviewed
  assertions and source decisions?

ruling: >-
  Preserve REV-GUP-PKT-PHB-117-119-bards-r04-r02 and
  APPROVED-GUP-PKT-PHB-117-119-bards-r04-r02 byte-for-byte as invalid historical
  artifacts. Neither is evidence of Review approval or an admissible Integrator
  input. Reviewer alone may publish exactly
  REV-GUP-PKT-PHB-117-119-bards-r04-r03, directly superseding r02, and exactly
  APPROVED-GUP-PKT-PHB-117-119-bards-r04-r03, directly superseding the r02
  manifest. The new Review is a packaging-only successor under DEC-2026-0047:
  it must independently reconstruct its authority from the approved r01 Review,
  immutable r04 GUP, and INT-20260827-001 rejection, never from unreadable r02
  Review content or the r02 manifest.

  The r03 Review must record the exact rejection input and preserve the r04
  GUP's checksum. It must approve the existing 57-row edge component unchanged,
  declare rows 1 through 29 as additions and rows 30 through 57 as pending
  additions, confirm registration of the eleven approved nodes before dependent
  rows, and exclude every blocked row. Its r03 manifest must name the r03
  Review checksum and contain the same declared operation index. No GUP,
  source, node decision, registry entry, edge assertion, or canonical data is
  reopened.

  This Decision does not yet permit a queue reader to omit r02. A direct
  unreadable-predecessor exception must be checksummed against the actual r03
  Review after it exists and must be authorized by a later Architect Decision.
  Until then, Integrator retains its ordinary fail-closed behavior for r02.

rationale:
  - >-
    Published artifact history is create-only. A direct r03 successor preserves
    r02's record without pretending its unparseable YAML conveys approval.
  - >-
    The exact rejection confines the correction to component packaging:
    twenty-nine rows are immediate additions and twenty-eight depend on the
    same bundle's eleven approved registrations. It disputes no source claim,
    node identity, or edge value.
  - >-
    The existing malformed-lineage bridge record requires checksums for a
    parseable bridge and active successor. Bards instead has an unreadable
    direct predecessor. Authorizing an unchecked future r03 as queue evidence
    would weaken the exact-evidence rule; that admission decision must wait for
    the published r03 bytes.

