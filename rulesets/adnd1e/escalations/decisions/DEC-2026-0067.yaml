sequence:
  - step: 1
    owner: architect
    action: >-
      Publish this Decision, mark its current escalation decided, and retain the
      earlier superseded escalation as decided history without a second ruling.
  - step: 2
    owner: reviewer
    action: >-
      Publish only the named r03 Review and r03 Approved manifest. Reconstruct
      the packaging determination from r01, r04 GUP, and INT-20260827-001;
      validate both new artifacts before publication; do not deserialize r02
      for content or alter any existing artifact.
  - step: 3
    owner: reviewer
    action: >-
      After r03 is published, submit a new complete Architect escalation that
      pins r01, r02's parser failure, r03, the r03 Approved manifest, and the
      rejection record by fresh SHA-256 checksum. Request a narrow direct-
      predecessor admission record; do not ask Integrator to infer it.

acceptance_tests:
  - >-
    The r03 Review directly supersedes r02, validates against the Review schema,
    reviews only GUP-PKT-PHB-117-119-bards-r04 at its pinned checksum, records
    INT-20260827-001 at its pinned checksum, and contains no recovered r02
    Review content.
  - >-
    The r03 Review independently records the unchanged 57-row component, the
    exact row-1-through-29 additions and row-30-through-57 pending-additions
    partition, the eleven-node registration prerequisite, and blocked-row
    exclusion.
  - >-
    The r03 Approved manifest directly supersedes r02, names the r03 Review and
    GUP checksums, references the unchanged 57-row component, and carries the
    complete 29/28 operation index without a new GUP or CSV authored by Builder.
  - >-
    Before the follow-up checksummed admission Decision is approved, an
    Integrator queue encountering r02 continues to report a fatal unreadable
    Review rather than treating any future r03 as an inferred exception.

post_implementation_requirements:
  - >-
    The Reviewer submits the required follow-up escalation after r03 exists.
    Architect will then decide whether an exact direct-unreadable-predecessor
    record and corresponding admission support are warranted from those actual
    checksummed artifacts.
  - >-
    Integrator evaluates only the r03 Approved bundle through normal admission,
    bundle verification, and transaction lifecycle after that later Decision;
    this Decision authorizes no integration.
  - >-
    Builder has no GUP, CSV, Approved-bundle, or canonical work for this
    packaging-only correction.

