integration_rejection_contract:
  applies_to: active_unintegrated_approved_bundle
  record_requirements_for_new_reports:
    - '`status: rejected`, ruleset and book scope, exact rejection record ID and path.'
    - Rejected bundle ID and SHA-256 checksum.
    - Approving Review ID and SHA-256 checksum.
    - Reviewed GUP ID and SHA-256 checksum.
    - At least one machine-readable blocking failure with the failed check and detail.
  queue_behavior:
    - >-
      A valid current rejection suppresses ordinary `INTEGRATOR-APPROVED` work
      for that exact bundle and emits one `REVIEWER-INTEGRATION-REJECTION` item.
    - >-
      The scanner reports malformed, stale, mismatched, or ambiguous rejection
      evidence diagnostically and never suppresses integration from it.
    - >-
      A Review successor that records the exact rejection record consumes the
      remediation item; its ordinary handoff then supplies all downstream work.
  current_remediation:
    owner: reviewer
    required_review_successor: REV-GUP-PKT-PHB-094-100-illusionist-spells-r04-r02
    required_disposition: revision_required
    required_handoff_role: builder
    required_finding: >-
      Reconcile `operation_index` with the 14 data rows and include `csv_row`
      for every declared operation before re-approval.

direct_implementation_contract:
  applies_to: non_migration_architect_decision
  allowed_owners:
    - builder
    - integrator
  requirements:
    - >-
      A ready Decision handoff to Builder or Integrator selects the sole
      implementation owner for its Decision Implementation Report.
    - >-
      `implemented_by` must exactly equal that selected owner; a mismatch is a
      diagnostic and does not consume the Decision.
    - >-
      The scanner emits `<ROLE>-DECISION` until a valid approval-ready report,
      then `REVIEWER-DECISION-IMPLEMENTATION`; only an Approved implementation
      Review consumes the Decision.
    - >-
      This lifecycle is for tooling, contract, schema, or operational work. It
      never authorizes canonical or registry mutation without an Approved GUP.

migration_required: false
migration_scope:
  canonical_data_change: false
  registry_change: false
  artifact_lineage_change: >-
    Review successors and GUP revisions remain ordinary immutable workflow
    artifacts; the rejected Approved bundle remains published history.

sequence:
  - step: 1
    owner: builder
    action: >-
      Implement the rejection-record schema and queue derivation, extend the
      direct implementation schema and scanner for Builder/Integrator ownership,
      add targeted tests, and publish IMP-DEC-2026-0043-r01.
  - step: 2
    owner: reviewer
    action: >-
      Independently verify both queue rules, rejection provenance validation,
      owner-mismatch rejection, and every denial case before approving the
      implementation report.
  - step: 3
    owner: reviewer
    action: >-
      Publish the named illusionist-spells Review successor using
      INT-20260815-002 as the exact legacy-authorized rejection input and route
      its operation-index repair to Builder.

acceptance_tests:
  - >-
    A valid rejected-bundle record suppresses only that active unintegrated
    bundle's Integrator item and creates one Reviewer remediation item.
  - >-
    Missing, stale, checksum-mismatched, wrong-ruleset, ambiguous, or already
    superseded rejection evidence is diagnostic and suppresses no bundle.
  - >-
    A successor Review recording the exact rejection consumes the remediation
    item and its ordinary `revision_required` handoff creates the next job.
  - >-
    A ready non-migration Decision assigned to Integrator produces one
    Integrator Decision item; a Builder-authored report for it is diagnostic.
    A valid Integrator report routes to Reviewer, and an Approved implementation
    Review consumes the Decision without creating an Integrator batch.
  - All applicable schema, scanner, Integrator, and repository tests pass.

