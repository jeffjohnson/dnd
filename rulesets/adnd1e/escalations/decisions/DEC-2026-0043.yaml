decision_date: '2026-08-17'
escalation_id: ESC-2026-08-17T16.01.23.870Z

question: >-
  How does an Integrator rejection of an otherwise approved bundle return exact,
  repairable work to the workflow instead of re-queuing the same rejected bundle
  indefinitely?

ruling: >-
  An Integration rejection is a first-class queue signal. A valid rejection
  record naming an active Approved bundle, its approving Review, its GUP, and
  their exact checksums suppresses that bundle's Integrator-ready item and
  creates exactly one Reviewer remediation item. The Reviewer publishes an
  immutable successor Review that records the rejection input and either routes
  a revision to its responsible role or escalates a new architectural question.
  For the named illusionist-spells bundle, the reviewer must publish a
  `revision_required` Review successor to Builder because the operation index
  failed a mechanical approval-readiness check. The original Approved bundle and
  Review remain immutable history.

  In the same contract release, a non-migration Decision may name Builder or
  Integrator as its implementation owner. Its ready handoff determines that
  owner; an implementation report must declare the same `implemented_by` role,
  and its independent Reviewer implementation Review remains the only completion
  record. This permits queue-visible, checked Integrator capability work without
  treating it as a canonical migration.

rationale:
  - >-
    An approved Review is not evidence that the Integrator can apply a bundle.
    The rejection proves a specific mechanical defect, but leaving its signal in
    an unread report makes the Integrator reject the same immutable bundle on
    every pass.
  - >-
    Returning the rejection to Reviewer preserves approval accountability. The
    Reviewer, not the Integrator, decides whether the evidence requires Builder,
    Analyst, or Architect action and records that decision in a successor Review.
  - >-
    The report/review completion lineage already provides checksummed,
    independently reviewed proof for non-migration tooling. Its owner must match
    the Decision rather than being hard-coded to Builder.

