migration_required: false
migration_scope:
  canonical_data_change: false
  registry_change: false
  source_interpretation_change: false
  artifact_lineage_change: >-
    No artifact lineage changes. r01 remains rejected immutable history, r03
    remains the recorded historical rejection evidence, and r04 remains the
    single authorized active successor pair.
  direct_implementation: >-
    Builder changes only the queue scanner and its focused tests, then publishes
    IMP-DEC-2026-0073-r01. No GUR, GUP, Review, Approved bundle, registry, or
    canonical transaction is an implementation output.

sequence:
  - step: 1
    owner: architect
    action: >-
      Publish this Decision and move the escalation to decided state. Do not
      modify any Bards artifact, source assertion, registry, or canonical data.
  - step: 2
    owner: builder
    action: >-
      Implement only the exact historical-remediation record validator and
      scanner classification. Add focused live and denial tests, then publish
      IMP-DEC-2026-0073-r01.
  - step: 3
    owner: reviewer
    action: >-
      Independently review IMP-DEC-2026-0073-r01. Verify that the exact record
      resolves the historical Reviewer item, keeps the r04 bundle in
      Integrator's queue, and fails closed for every altered record.

acceptance_tests:
  - >-
    With every pinned live artifact unchanged, the scanner verifies r03's
    integration_rejection_input mapping equals the exact INT-20260827-001
    reference, verifies the rejected record names the exact rejected r01 bundle
    and reviewed r04 GUP, and verifies the r04 Review and bundle have every
    required direct successor, provenance, and ready Integrator handoff. It
    emits no REVIEWER-INTEGRATION-REJECTION job for r01 and retains exactly the
    normal Integrator-ready r04 bundle job.
  - >-
    A missing, inactive, malformed, unreadable, checksum-mismatched, wrong-ID,
    wrong-path, or wrong-field record; a non-mapping field; an INT record that
    does not name r01 and r04 by the pinned values; a wrong r04 direct
    successor, approval link, reviewed GUP, or handoff; or a changed governing
    Decision suppresses nothing and retains ordinary rejection remediation.
  - >-
    integration_rejection_input has no effect for any Review not named by this
    Decision, including one with a matching-looking rejection ID. The existing
    recognized keys integration_rejection, rejection_input, and rejected_by
    retain their ordinary behavior.
  - >-
    IMP-DEC-2026-0073-r01 pins this Decision checksum, records focused and full
    applicable scanner evidence, and is approval-ready for independent Reviewer
    verification.

post_implementation_requirements:
  - >-
    Integrator proceeds only through its normal verification and transaction
    lifecycle for the r04 bundle. This Decision does not pre-approve a
    transaction or change Bards source, node, edge, registry, or canonical data.
  - >-
    A future nonstandard rejection-reference field requires its own escalation
    and exact Architect Decision. Neither Builder nor Reviewer may add aliases
    by inference.

