question: >-
  Can the immutable Bards r03 Review's checksummed integration_rejection_input
  record consume INT-20260827-001 for queue derivation after the single r04
  successor authorized by DEC-2026-0071, or must Reviewer publish a further
  successor solely to use a scanner-recognized field name?

ruling: >-
  The exact record below is sufficient historical remediation evidence for
  INT-20260827-001. Builder must make the scanner recognize only this active,
  checksummed record: the named r03 Review's integration_rejection_input mapping
  is equivalent to a recognized rejection reference only after every pinned
  input, rejection record, rejected bundle, and r04 Review and bundle successor
  constraint validates. Then the scanner classifies the r01 rejection handoff
  as resolved historical evidence and emits the normal r04 Integrator work.

  This is not a generic alias for integration_rejection_input, an inferred
  convention for another Review, or authority to alter published Bards
  artifacts. No r05 is authorized. A missing, changed, malformed, or
  nonconforming named record must fail closed and retain ordinary rejection
  remediation behavior.

rationale:
  - >-
    r03 named the rejection by exact ID, path, and checksum and independently
    verified the defect was packaging-only. r04 is the one ordinary successor
    DEC-2026-0071 authorized, and it has already restored the normal Integrator
    handoff.
  - >-
    Requiring r05 would create a lineage revision with no source, graph,
    identity, or packaging change solely to rename an immutable historical field.
  - >-
    A decision-pinned, checksum-verified exception preserves the scanner's
    default strict recognized-key rule for every other artifact.

