sequence:
  - step: 1
    owner: architect
    action: >-
      Publish this Decision and decide the escalation. Preserve every Druid
      Review, GUP, registry, canonical artifact, and source packet unchanged.
  - step: 2
    owner: builder
    action: >-
      Implement only the validated `review_malformed_lineage_repairs` behavior.
      A valid active Decision record must classify r04 as one informational
      historical parse failure, suppress only r05's missing-supersedes error,
      and expose exactly one ready Builder revision item for r06 with r01 and
      r06 as its complete input components. Validate r06 against
      schemas/common/review.schema.json. An absent, inactive, malformed,
      checksum-mismatched, parseable-r04, wrong-GUP, non-direct, non-ready,
      non-Builder, invalid-r06, or wrong-input record is an error and suppresses
      the repair route. Publish IMP-DEC-2026-0064-r01.
  - step: 3
    owner: reviewer
    action: >-
      Independently review IMP-DEC-2026-0064-r01. Confirm the exception is exact
      and informational, all denial cases remain errors with no r06 Builder job,
      r04 through r06 bytes are unchanged, and ordinary Review lineages remain
      strict.

acceptance_tests:
  - >-
    With only this active Decision record, r04's checksum and YAML parse failure,
    r05's direct supersedes reference, r06's direct supersedes reference and
    Review-schema validity, reviewed-GUP identity, and r01+r06 input set all
    validate. The scanner reports exactly one informational
    `review_malformed_lineage_repaired` diagnostic, no r04 `yaml_unreadable` or
    r05 `missing_supersedes_target` error, and exactly one ready Builder item for
    r06 whose components are the named r01 and r06 files only.
  - >-
    Removing the record; making it inactive; changing any pinned checksum;
    making r04 parseable; changing the parse-failure fragment; changing either
    direct supersedes reference; changing r06's reviewed GUP, disposition, or
    ready Builder handoff; making r06 fail Review-schema validation; or adding,
    removing, or changing either exact Builder input produces a lineage error
    and no Builder item based on r06. No case authorizes general treatment of a
    different unreadable Review.
  - >-
    The common schema suite handles only this Decision-pinned raw r04 file as
    historical unreadable evidence: it verifies the exact checksum and expected
    parser failure, verifies r05 and r06 parse and r06 validates, and continues
    to fail for every other unreadable published packet artifact. Existing
    ordinary Review lineage, handoff, retirement, and queue tests remain green.
  - >-
    IMP-DEC-2026-0064-r01 pins this Decision checksum, records passing focused
    and full applicable validation evidence, reports every direct acceptance
    test as passed, and is approval-ready for independent Reviewer verification.

post_implementation_requirements:
  - >-
    Once the repaired scanner exposes the ordinary Builder item, Builder may
    publish GUP-PKT-PHB-054-064-druid-spells-r02 using only the exact r01 and r06
    Review directives. It follows the normal GUP, Review, Approved-bundle, and
    Integration lifecycle and is not acceptance evidence for this Decision.
  - >-
    Reviewer reviews the resulting GUP normally. Integrator changes canonical
    data only after the normal Approved bundle is present.
  - >-
    Analyst has no action. No role may edit, delete, parse-repair, or create a
    further successor to r04, r05, or r06 under this Decision.

