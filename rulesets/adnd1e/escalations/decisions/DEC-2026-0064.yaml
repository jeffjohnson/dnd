question: >-
  How may queue derivation reach a schema-valid active Druid Review when its
  immutable immediate ancestry crosses one YAML-unreadable historical Review?

ruling: >-
  Approve one exact, checksummed historical-unreadable bridge and no general
  malformed-Review exemption. r04 remains byte-immutable unreadable history;
  r05 remains byte-immutable bridge history; r06 is the sole permitted active
  Review successor. Queue derivation may treat r05's reference to r04 as
  connected only while every field of the `review_malformed_lineage_repairs`
  record below validates. The repair does not make r04 valid, does not recover
  or interpret r04's content, and does not authorize a successor to r06.

  The Builder's packet revision input is exactly r01 plus r06. r02 through r05
  are historical and must not be passed to the compiler as Review directives.
  No source meaning, edge, canonical row, registry entry, identity, profile,
  or ontology is decided or changed by this ruling.

rationale:
  - >-
    Published artifacts are create-only. Editing or deleting r04 would erase
    the evidence of the original defect, while ordinary successors cannot make
    the scanner parse an unreadable predecessor.
  - >-
    r06 is valid YAML, validates against the current Review schema, directly
    supersedes r05, and carries the complete independently compilable execution
    set. Its stated r01+r06 inputs avoid treating r04 or r05 prose as authority.
  - >-
    A filename, revision number, or later prose is insufficient to exempt an
    unreadable artifact. Full path, ID, checksum, parse-failure shape, direct
    bridge, direct successor, reviewed-GUP identity, and exact input set make
    this exception auditable and non-transferable.

