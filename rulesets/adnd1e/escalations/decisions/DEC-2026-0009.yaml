schema_version: "1.0"
id: DEC-2026-0009
status: approved
ruleset_id: adnd1e
book_id: phb
source_id: phb-legacy-unspecified
packet_id: PKT-PHB-013-018-races
constitution_version: "1.4"

decision_date: "2026-07-30"
escalation_id: ESC-2026-07-30T04.45.31.286Z

question: >-
  Should the dwarf, gnome, and halfling underground-detection assertions reuse
  rule_detection, create rule_racial_detection, or be split further?

ruling: >-
  Map F6, F20, and F31 to canonical rule_detection with target label Detection.
  Do not register rule_racial_detection. Preserve one row per race with its
  source-specific aspect, activation condition, status, and section citation.
  Under the singular-locus rule, F6 and F20 cite their section with page blank;
  F31 may cite page 17 and section Halflings.

rationale:
  - >-
    rule_detection is the existing unqualified umbrella and already carries
    heterogeneous bundled detection powers from devices, swords, scrying, and
    prior detection.
  - >-
    The PHB never names a shared Racial Underground Detection procedure.
    Creating that identity would turn a useful analytic grouping into a source
    identity and duplicate the intended breadth of rule_detection.
  - >-
    The three race sources, aspects, conditions, and section citations keep the
    assertions distinct without encoding race qualification in a second target
    identity.
  - >-
    No canonical race-to-rule_detection row exists, so the mapping creates no
    exact duplicate and requires no migration.
  - >-
    A future split of the generic detection node would require a separate
    complete package covering all seven existing incident rows and source books.

row_dispositions:
  - ref: F6
    source_id: race_dwarf
    target_id: rule_detection
    target_label: Detection
    page: ""
    section: Dwarves
    condition: when actively seeking
  - ref: F20
    source_id: race_gnome
    target_id: rule_detection
    target_label: Detection
    page: ""
    section: Gnomes
    condition: when actively seeking
  - ref: F31
    source_id: race_halfling
    target_id: rule_detection
    target_label: Detection
    page: "17"
    section: Halflings
    condition: when concentrating

registry_disposition:
  proposed_id: rule_racial_detection
  disposition: rejected_as_duplicate_analytic_aggregate
  replacement_id: rule_detection

rejected_identity_map:
