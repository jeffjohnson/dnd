  - Builder loads rejected_identity_map from approved Architect decisions.
  - A rule_racial_detection node proposal is rejected with rule_detection named as its replacement.
  - A dependent edge cannot enter a GUP until it targets rule_detection.
  - F6, F20, and F31 target rule_detection with label Detection.
  - F6 and F20 use section-only citations and contain no page range.
  - F31 retains page 17 and section Halflings.
  - All three rows preserve their race source and activation condition.
  - A fresh duplicate check finds no exact canonical assertion match.
