decision_date: '2026-08-17'
escalation_id: ESC-2026-08-17T13.29.36.700Z

question: >-
  How can repository-wide envelope validation remain strict when a published,
  immutable predecessor has only invalid queue-handoff metadata and a fully
  valid successor has already repaired that metadata?

ruling: >-
  Do not scope envelope validation to active leaves generally. A published
  predecessor is exempt from the repository-wide envelope assertion only when
  every envelope error is rooted in its `handoff` block, a published direct
  successor names its exact ID in `supersedes`, and that successor has zero
  envelope errors. The exemption is diagnostic history, never a claim that the
  predecessor is valid, never a queue fallback, and never an exemption for
  identity, provenance, proposals, or other semantic fields. The exemption set
  must be reported and pinned: a second artifact cannot join it without a later
  Architect Decision. This authorizes the existing
  `test_common_schemas.py` implementation as the missing DEC-2026-0039 scope
  extension; no published GUR may be edited, moved, or deleted.

rationale:
  - >-
    An active-leaf-only sweep would stop checking all superseded semantic
    artifacts. The three conjunctive conditions retain that coverage while
    handling only metadata that a valid successor has replaced.
  - >-
    The current exception is auditable: r02 has two handoff errors, r03 names
    r02 directly and has zero envelope errors, and the suite reports exactly
    that one exempt artifact.
  - >-
    The original DEC-2026-0039 acceptance test required the common suite to
    pass but omitted the test file that necessarily implements that outcome.
    This Decision supplies that authorization without changing DEC-2026-0039's
    immutable text or widening its GUR queue rule.

