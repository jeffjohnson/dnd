      Independently verify all three exemption conditions, the exact reported
      exception set, and that DEC-2026-0039's implementation report may treat
      this Decision as its authorized exact-diff extension.

acceptance_tests:
  - >-
    A valid active artifact and a predecessor with no successor, a successor
    naming another artifact, an invalid successor, or any error outside
    `handoff` each fail the published-artifact envelope assertion.
  - >-
    The current UA r02/r03 pair is reported as exactly one historical exception;
    r02 remains schema-invalid on disk and r03 validates with zero envelope
    errors.
  - >-
    The common schema suite passes without suppressing validation of any other
    published GUR, GUP, or Review.
  - All applicable common-schema and repository tests pass.

constitution_version_impact:
  changed: false
  retained: '1.8'
  rationale: This is validation-lifecycle policy, not graph semantics or ontology.

governance_changelog:
  - >-
    Historical handoff-only envelope invalidity may be reported as a narrowly
    checked repaired predecessor; it is not a blanket non-leaf exemption.

