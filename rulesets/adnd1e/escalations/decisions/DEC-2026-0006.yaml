schema_version: "1.0"
id: DEC-2026-0006
status: approved
ruleset_id: adnd1e
constitution_version: "1.3"

decision_date: "2026-07-30"
escalation_id: ESC-2026-07-30T05.03.21.873Z

question: >-
  What Windows-safe escalation ID format should replace ESC-YYYY-NNNN, how
  should same-instant collisions be handled, and must existing IDs be migrated?

ruling: >-
  All new escalation IDs must use
  ESC-YYYY-MM-DDTHH.mm.ss.fffZ. The timestamp is the UTC allocation instant,
  dots replace time colons, and milliseconds are mandatory. The filename must
  be <id>.yaml. Allocation must use exclusive creation; a same-millisecond
  collision appends -02, then -03, and so on. Existing IDs remain stable legacy
  identifiers and are not mass-renamed.

rationale:
  - >-
    UTC timestamps remove the shared sequential counter that allowed concurrent
    workers to allocate the same ESC-YYYY-NNNN identity.
  - >-
    The format remains readable and lexically chronological, unlike epoch
    values, while dots make the time portion legal in Windows filenames.
  - >-
    Millisecond precision makes ordinary collisions unlikely; exclusive
    creation plus an occurrence suffix handles them deterministically rather
    than relying on probability.
  - >-
    Renaming historical IDs would invalidate decisions, GUR references, review
    artifacts, and audit records. Backward compatibility is therefore required.

identifier_contract:
  primary_form: ESC-YYYY-MM-DDTHH.mm.ss.fffZ
  example: ESC-2026-07-30T00.57.31.482Z
  collision_example: ESC-2026-07-30T00.57.31.482Z-02
  validation_pattern: '^ESC-[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}\.[0-9]{2}\.[0-9]{2}\.[0-9]{3}Z(?:-(?:0[2-9]|[1-9][0-9]+))?$'
  timezone: UTC
  precision: milliseconds
  filename_rule: filename equals the ID plus .yaml
  allocation_rule: exclusive create across the complete ruleset escalation namespace

legacy_policy:
  migration_required: false
  accepted_legacy_ids:
    - Existing ESC-YYYY-NNNN identifiers.
    - Existing timestamp identifiers allocated before this decision.
  rule: >-
    Legacy identifiers remain valid references. They may move between state
    folders without renaming, but may never be reused for another escalation.

contract_changes:
  - path: contracts/FILE_NAMING.md
    previous_version: unversioned
    new_version: "1.1"
    change: >-
      Replace sequential escalation IDs with Windows-safe UTC timestamps and
      define collision, immutability, filename, and legacy behavior.
  - path: contracts/ESCALATION_CONTRACT.md
    previous_version: "1.1"
    new_version: "1.2"
    change: >-
      Require FILE_NAMING compliance, filename-stem equality, and ruleset-wide
      escalation-ID uniqueness.

affected_contracts:
  - contracts/FILE_NAMING.md
  - contracts/ESCALATION_CONTRACT.md
affected_registries: []
affected_artifacts:
  - rulesets/adnd1e/escalations/decided/ESC-2026-07-30T05.03.21.873Z.yaml
  - rulesets/adnd1e/escalations/decisions/DEC-2026-0006.yaml
  - future escalation packages from every filing role
  - future repository escalation-ID validators

migration_required: false
migration_scope:
  existing_ids: none
  reason: >-
    Existing IDs are durable provenance keys. Only IDs allocated after this
    decision use the new form.

acceptance_tests:
  - New escalation IDs match identifier_contract.validation_pattern.
  - Every escalation filename equals its YAML id plus .yaml.
  - Duplicate IDs are rejected across pending, decided, and archived state folders.
  - Same-millisecond allocation uses -02, -03, and later occurrence suffixes.
  - UTC Z and three millisecond digits are mandatory on new IDs.
  - No new escalation ID contains a colon.
  - Legacy escalation IDs remain resolvable without renaming.
  - No canonical graph file is changed by this decision.

constitution_version_impact:
  changed: false
  reason: >-
    Artifact naming changes workflow identity only; graph ontology and
    semantics remain at Constitution 1.3.

follow_up_owner:
  contract_change: architect_complete
  filing_compliance: analyst_builder_reviewer
  validator_implementation: builder
  state_transition_and_archive_checks: integrator
