question: >-
  How must the approved Pipes of the Sewer identity migration be expressed when
  DEC-2026-0030 uses operation keys the Builder's migration planner does not
  read, while published Decisions must remain immutable?

ruling: >-
  Reissue DEC-2026-0030 as this immutable Decision, using only the established
  executable `canonical_migration` vocabulary: `node_id_replacements` and
  `endpoint_repoints` with `canonical_row`, `field`, `from`, `to`, `label`, and
  `before_assertion`. The canonical identity remains item_pipes_sewer / Pipes of
  the Sewer. item_pipes_sewers / Pipes of the Sewers is retired with no alias.
  This Decision supersedes DEC-2026-0030 solely because its migration operations
  were mechanically unreadable; its source-identity ruling and downstream Bards
  sequence remain otherwise unchanged.

rationale:
  - >-
    The claimed PHB Bards packet directly names Pipes of the Sewer on PHB 119.
    Incoming Packet Authority therefore controls its spelling, grammatical
    number, source label, and canonical ID stem over unpacketized legacy data.
  - >-
    The Builder's planner already validates and executes the exact operation
    shape used below. Treating DEC-2026-0030's different keys as synonyms would
    make the Builder interpret Architect intent without a governing contract.
  - >-
    `node_id_replacements` intentionally derives the registry and
    nodes-master replacement. Those are consequences of the identity migration,
    not separate Builder-selected operations.
  - >-
    Rewriting DEC-2026-0030 would invalidate its recorded provenance. The
    Decision-reissue lineage added to the contracts preserves history while
    selecting this corrected operational record.

