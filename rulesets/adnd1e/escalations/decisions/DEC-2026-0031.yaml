sequence:
  - step: 1
    owner: builder
    action: >-
      Implement WORK_QUEUES 1.7 Decision-reissue leaf derivation in the shared
      queue scanner and tests. A valid DEC-2026-0031 superseding DEC-2026-0030
      leaves only DEC-2026-0031 as the ready Builder decision-migration job;
      malformed, cross-ruleset, migration-flag-changing, missing-predecessor, or
      forked reissues report a lineage error and suppress neither ready job.
  - step: 2
    owner: builder
    action: >-
      Publish GUP-MIG-DEC-2026-0024-0025-r04. It supersedes r03, uses
      artifact_kind decision_migration, records exact checksummed authority for
      Decisions 0024, 0025, 0026, and 0031, and plans against the then-current
      canonical baseline.
  - step: 3
    owner: reviewer
    action: >-
      Independently review the combined migration. Confirm that only the two
      named Pipes endpoints and the one registry identity replacement are added
      to the pre-existing r04 correction scope.
  - step: 4
    owner: integrator
    action: >-
      Integrate the approved r04 migration, rebuild derived canonical artifacts,
      and publish Integration provenance.
  - step: 5
    owner: reviewer
    action: >-
      After Integration, publish REV-GUP-PKT-PHB-117-119-bards-r03-r02,
      superseding r01. Resolve M048 with the exact singular identity and retain
      M028's supplied correction.
  - step: 6
    owner: builder
    action: >-
      Publish GUP-PKT-PHB-117-119-bards-r04 against the integrated registry and
      canonical state. It uses item_pipes_sewer as an existing identity and does
      not propose another Pipes node.

acceptance_tests:
  - >-
    WORK_QUEUES 1.7 recognizes a new-ID Architect Decision reissue through its
    revision and supersedes lineage without rewriting the predecessor file.
  - >-
    Queue scanner tests prove that a valid same-ruleset, same-migration-flag
    Decision reissue produces only the leaf Builder job, while missing,
    non-approved, cross-ruleset, changed-flag, and forked reissues are lineage
    errors that leave prior work visible.
  - >-
    Planning Decisions 0024, 0025, 0026, and 0031 produces one node identity
    replacement and exactly two Pipes endpoint repoints at canonical rows 2479
    and 2480, with no migration_instruction_not_understood or
    migration_repoint_key_not_understood diagnostic.
  - >-
    GUP-MIG-DEC-2026-0024-0025-r04 supersedes r03 in the same lineage and names
    Decisions 0024, 0025, 0026, and 0031 as exact checked authority inputs.
  - >-
    The migration replaces item_pipes_sewers / Pipes of the Sewers with
    item_pipes_sewer / Pipes of the Sewer in the registry, canonical nodes, and
    exactly the two enumerated canonical endpoints; no alias or retired endpoint
    remains.
  - >-
    The migration preserves every unlisted field in both endpoint rows, produces
    no duplicate five-field assertion key, and changes no unrelated identity.
  - >-
    The Bards Review and GUP revisions occur only after the migration Integration
    and apply M048 and M028 exactly as specified.
  - All applicable schema, graph, registry, lineage, and repository tests pass.

