operation_contract:
  applies_only_to: DEC-2026-0038
  planner_requirements:
    - >-
      Read `canonical_migration.node_id_merges`; reject an absent, malformed,
      partial, or otherwise unsupported merge rather than plan it as a no-op.
    - >-
      Require at least two distinct retired nodes per merge; require the
      canonical ID to be absent from the baseline registry; require every
      retired ID and label to match; and treat only a moved present advisory row
      as informational. Preserve both declared and observed row values in the
      validation report.
    - >-
      Resolve every listed one-based canonical CSV row, including the header;
      require exactly one retired endpoint in every row; discover all baseline
      rows incident on either retired ID; and require exact equality with the
      declared set.
    - >-
      Change only that retired endpoint ID and its corresponding endpoint label.
      Preserve every other canonical field byte-for-value and retain the full
      before-image in the GUP.
    - >-
      Replace the named retired registry identities with exactly one canonical
      row, create no alias, rebuild nodes_master and graph, and reject duplicate
      assertion keys or any surviving retired ID in planned or derived output.
  integrator_requirements:
    - >-
      Validate the reviewed GUP, Approved manifest, authority Decision,
      canonical baseline, registry baseline, every before-image, and every
      closed incident set before snapshotting state. The registry checksum is a
      strict precondition; an optional v2 row locator is not.
    - >-
      Apply every registry merge and paired endpoint repoint in one transaction;
      restore canonical and registry files byte-for-byte on any failure.
  prohibited_inference:
    - Do not recover a missing identity or a label mismatch from a row, label, or prefix.
    - Do not adjust a canonical locator or incident set from a former Decision baseline.
    - Do not add an alias, change a non-endpoint field, or widen the operation to another ability mechanic.
    - Do not compile a packet GUR containing any retired ID after Integration.

