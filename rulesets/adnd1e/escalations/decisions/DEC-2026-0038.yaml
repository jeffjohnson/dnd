escalation_id: ESC-2026-08-15T03.59.20.402Z

question: >-
  How must the DEC-2026-0032 ability-merge lineage proceed after an unrelated
  registry insertion moved str_exceptional from its declared physical row while
  every identity and every closed canonical incident set remained exact?

ruling: >-
  Supersede DEC-2026-0036 with this current-baseline reissue. The three survivor
  identities and the `abil_<three-letter ability abbreviation>_<snake_case rule
  name>` convention are retained without semantic change. For
  `decision_migration_v2` only, a retired node's optional `registry_csv_row` is
  an advisory, auditable planning locator. Retired node ID and label, an absent
  canonical ID, the complete closed incident set, every before-image, and the
  checksummed canonical and registry baselines remain strict. A declared row
  that has moved is informational only when the declared ID and label still
  resolve in the current registry. The resulting direct GUP records the observed
  row when it emits the optional field and records the declared and observed rows
  in validation output. This Decision authorizes only the three bounded v2
  merges below, their exact paired endpoint repoints, and GUP revision r02.

rationale:
  - >-
    INT-20260814-002 appended six rule_ registry nodes before str_exceptional
    and therefore shifted that physical row from 1071 to 1077. It did not alter
    the retired node's identity or label, the five other retired locators, or any
    of the 33 canonical assertion locators.
  - >-
    A registry row is not the retired identity. It is useful for audit and for
    exposing an unexpected plan, but it cannot safely outlive unrelated sorted
    registry insertions. The pinned registry checksum protects the actual
    transaction from drift.
  - >-
    This limited policy applies only to v2 merge retirement nodes. It does not
    relax canonical before-images, canonical row locators, v1 operations,
    labels, incident-set closure, registry baseline checksums, or any source
    interpretation rule.

operation_model:
  name: decision_migration_v2
  authority_source: >-
    The checksummed GUP YAML is the sole executable operation source. The
    Approved manifest names that reviewed GUP and its validation report by
    checksum and never restates or extends the plan.
  registry_locator_policy:
    applies_to: node_changes.merges.retired_nodes.registry_csv_row
    authority: retired_node_id_and_label
    locator_status: optional_advisory
    decision_declared_row_for_str_exceptional: 1071
    current_observed_row_for_str_exceptional: 1077
    required_behavior: >-
      Report a declared-versus-observed moved row as informational when the
      retired ID and label match. Reject an absent ID, a label mismatch, or a
      baseline checksum mismatch. An emitted GUP locator is the observed row in
      its pinned baseline and is not an Integrator transaction precondition.
  permitted_operations:
    - >-
      One or more `node_changes.merges`, each with at least two distinct retired
      IDs, one previously absent canonical ID, exact retired identities and
      labels, `merge_retired_rows_into_one`, and a closed incident set.
    - >-
      Only the paired endpoint-ID/label repoint for every enumerated incident
      row, each against a complete 18-field before-image.
  prohibited_operations:
    - A one-to-one replacement, addition, relabel, canonical removal, alias, or non-endpoint mutation.
    - An inferred retired identity, endpoint, canonical locator, or incident row.
    - A row selection by label, prefix, or any unenumerated semantic similarity.

