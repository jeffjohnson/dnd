sequence:
  - step: 1
    owner: builder
    action: >-
      Update v2 planner validation and serialization for the advisory locator;
      add regression coverage; plan this Decision against the stated baseline;
      and publish GUP-MIG-DEC-2026-0032-r02 and its validation report. The GUP
      cites DEC-2026-0038 alone, supersedes r01, uses the observed row 1077 for
      str_exceptional if it emits a row, and creates no edge CSV.
  - step: 2
    owner: reviewer
    action: >-
      Verify all three merge identities, the 33-row closed incident set, current
      registry ID/label matches, full before-images, v2-only operation arrays,
      the informational declared-versus-observed str_exceptional locator record,
      and absence of every retired identity before publishing the exact Approved
      component pair.
  - step: 3
    owner: integrator
    action: >-
      Implement or confirm direct-migration discovery, validation, transaction
      execution, and provenance for v2 merges. Key v2 registry retirement on
      verified IDs and labels plus the pinned registry checksum, not a row
      locator. Integrate only the approved r02 bundle and rebuild derived
      artifacts.
  - step: 4
    owner: analyst
    action: >-
      Publish GUR-PKT-DMG-064-064-missile-discharge-r03 only after Integration.
      Do not revise r02 in place or use a retired ability identity.

acceptance_tests:
  - >-
    The v2 GUP schema accepts a retired node with ID and label but no
    registry_csv_row, and rejects a non-integer row when the optional field is
    present.
  - >-
    When a Decision-declared retired ID and label resolve but its registry row
    moved, the Builder emits exactly one informational declared-versus-observed
    locator finding, continues planning, and serializes the observed row if it
    emits that field. An absent ID, label mismatch, existing canonical ID,
    duplicate retired ID, or incomplete incident set still fails.
  - >-
    Planning this Decision produces exactly three registry merges and 33 paired
    endpoint repoints, preserves every other edge field, creates no duplicate
    assertion key, and leaves none of the six retired IDs in planned or derived
    output.
  - >-
    The Reviewer independently verifies the advisory finding, current ID/label
    matches, pinned baseline checksums, all 33 before-images, and the closed
    incident set. A moved advisory row alone does not prevent approval.
  - >-
    Integrator discovery treats a valid v2 Approved bundle as one job with no
    edge CSV; transaction preconditions still reject a baseline drift, stale
    before-image, incomplete incident set, label mismatch, or surviving retired
    identity, but do not reject a moved advisory row.
  - >-
    The subsequent DMG GUR revision is source-derived, supersedes r02, and uses
    only the three surviving ability IDs.
  - All applicable schema, graph, registry, migration, queue, and repository tests pass.

