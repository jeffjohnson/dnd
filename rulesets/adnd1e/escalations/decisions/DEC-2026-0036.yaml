question: >-
  How must DEC-2026-0032 be reissued after the integrated r05 migration shifted
  its physical canonical and registry locators, and which direct operation model
  may execute its already decided two-retired-IDs-to-one-new-ID merges?

ruling: >-
  Supersede DEC-2026-0032 with this current-baseline reissue. Its three survivor
  identities and the `abil_<three-letter ability abbreviation>_<snake_case rule
  name>` convention are retained without semantic change. Correct every listed
  canonical and registry locator below and require
  `operation_model: decision_migration_v2`. Version 2 is the bounded direct-YAML
  merge model in WORK_QUEUES 1.9: it authorizes only these three closed
  two-retired-IDs-to-one-previously-absent-ID registry merges and their complete,
  paired endpoint repoints. It does not authorize aliases, non-endpoint edits,
  arbitrary row changes, removals, or a general locator-policy change.

rationale:
  - >-
    The r05 migration removed canonical line 1502 and changed the registry, so
    DEC-2026-0032's former physical locators no longer identify the assertions
    or registry row it approved. The exact-before-image planner correctly
    refuses to infer a shift.
  - >-
    Recomputing the locators against the current baseline preserves the complete
    7, 17, and 9-row incident sets. The underlying identities, labels, kinds,
    and mechanics have not changed.
  - >-
    A two-to-one merge is not a one-to-one replacement. The existing v1 direct
    model intentionally rejects it, so executing this Decision requires the
    separately constrained v2 model rather than treating a merge as a sequence
    of replacements.
  - >-
    Assertion-key locators are preferable for a future general policy, but the
    current merge planner consumes exact physical locations and this reissue
    makes no unreviewed tooling or policy change beyond the bounded operation
    required here.

operation_model:
  name: decision_migration_v2
  authority_source: >-
    The checksummed GUP YAML is the sole executable operation source. The
    Approved manifest names that reviewed GUP and its validation report by
    checksum and never restates or extends the plan.
  permitted_operations:
    - >-
      One or more `node_changes.merges`, each with at least two distinct retired
      IDs, one previously absent canonical ID, exact retired registry rows and
      labels, `merge_retired_rows_into_one`, and a closed incident set.
    - >-
      Only the paired endpoint-ID/label repoint for every enumerated incident
      row, each against a complete 18-field before-image.
  prohibited_operations:
    - A one-to-one replacement, addition, relabel, canonical removal, alias, or non-endpoint mutation.
    - An inferred retired identity, registry row, endpoint, or locator adjustment.
    - A row selection by label, prefix, or any unenumerated semantic similarity.

