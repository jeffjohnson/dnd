sequence:
  - step: 1
    owner: builder
    action: >-
      Extend the decision-migration serializer and direct-model guard to select
      `decision_migration_v2` only for this bounded merge shape. Re-plan this
      Decision against the stated baseline and publish the exact r01 GUP and
      validation report; no edge CSV is created.
  - step: 2
    owner: reviewer
    action: >-
      Verify all three merge identities, the 33-row closed incident set, current
      registry rows, full before-images, v2-only operation arrays, and absence
      of every retired identity before publishing the exact Approved component
      pair.
  - step: 3
    owner: integrator
    action: >-
      Extend direct-migration discovery, validation, transaction execution, and
      integration provenance for v2 merges. Integrate only the approved r01
      bundle and rebuild the required derived artifacts.
  - step: 4
    owner: analyst
    action: >-
      Publish GUR-PKT-DMG-064-064-missile-discharge-r03 only after Integration.
      Do not revise r02 in place or use a retired ability identity.

acceptance_tests:
  - >-
    The Builder emits `decision_migration_v2` only for the bounded merge shape
    and rejects a duplicate retired ID, existing canonical ID, registry
    row/label mismatch, missing or extra incident row, or non-merge operation.
  - >-
    The common GUP and Approved-bundle schemas accept a fully populated v2 plan
    and component pair, and reject incomplete merge members, a nonempty v1-only
    operation array, an edge CSV, or missing registry provenance.
  - >-
    Planning this Decision produces exactly three registry merges and 33 paired
    endpoint repoints, preserves every other edge field, creates no duplicate
    assertion key, and leaves none of the six retired IDs in planned or derived
    output.
  - >-
    Integrator discovery treats a valid v2 Approved bundle as one job with no
    edge CSV; preconditions and transaction rollback reject a baseline drift,
    stale before-image, incomplete incident set, or surviving retired identity.
  - >-
    The subsequent DMG GUR revision is source-derived, supersedes r02, and uses
    only the three surviving ability IDs.
  - All applicable schema, graph, registry, migration, queue, and repository tests pass.

