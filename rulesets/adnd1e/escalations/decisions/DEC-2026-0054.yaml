sequence:
  - step: 1
    owner: architect
    action: >-
      Publish this Decision, amend the queue and lifecycle contracts, update
      Builder instructions, and close the escalation. Do not modify the active
      Review, r06 GUP, 0050 bundle, Integration record, registry, or canonical
      data.
  - step: 2
    owner: builder
    action: >-
      Update queue derivation to discover active revision-required Review leaves
      independently of the current GUP leaf. Suppress a Review handoff only when
      a later same-lineage GUP has provenance.review_id exactly equal to the
      active Review ID. Preserve exact Integration consumption and publish
      IMP-DEC-2026-0054-r01 with focused test evidence.
  - step: 3
    owner: reviewer
    action: >-
      Independently review IMP-DEC-2026-0054-r01. Verify the active illusionist
      Review is ready for Builder despite r06, exact r07 provenance consumes it,
      no duplicate Review job occurs, and the exact 0050 Integration remains
      terminal.
  - step: 4
    owner: builder
    action: >-
      After the implementation Review is approved, publish the normal
      GUP-PKT-PHB-094-100-illusionist-spells-r07 correction. It must remain in
      r05's GUP lineage and set provenance.review_id exactly to
      REV-GUP-PKT-PHB-094-100-illusionist-spells-r05-r06.

acceptance_tests:
  - >-
    WORK_QUEUES Version 1.19 or later defines an active revision-required
    Review as an independent handoff lineage, requires exact same-lineage
    provenance.review_id consumption, and retains exact Integration consumption
    for Approved bundles.
  - >-
    ARTIFACT_LIFECYCLE Version 1.15 or later retains an active
    revision-required Review handoff until an exact same-lineage GUP successor
    records it in provenance.review_id.
  - >-
    With r05-r06 active and r06 superseding r05 while naming r05-r05 in
    provenance.review_id, the scanner produces exactly one ready Builder job
    for r05-r06. A same-lineage r07 that names r05-r06 consumes that job.
  - >-
    APPROVED-GUP-MIG-DEC-2026-0050-r04-r01 remains consumed and produces no
    Integrator job when INT-20260820-001 exactly names it.
  - >-
    IMP-DEC-2026-0054-r01 pins this Decision's exact checksum, reports every
    direct acceptance test as passed with current evidence, records passing
    focused scanner tests, and is approval-ready for independent Reviewer
    verification.

acceptance_test_semantics:
  - acceptance_test_index: 1
    kind: versioned_contract_content
    contracts:
      - path: contracts/WORK_QUEUES.md
        minimum_version: '1.19'
        substantive_anchors:
          - revision-required Review handoff lineage
          - exact provenance.review_id consumption
          - exact Integration consumption
  - acceptance_test_index: 2
    kind: versioned_contract_content
    contracts:
      - path: contracts/ARTIFACT_LIFECYCLE.md
        minimum_version: '1.15'
        substantive_anchors:
          - active revision-required Review handoff
          - same-lineage GUP successor
          - provenance.review_id

post_implementation_requirements:
  - >-
    The independent approved implementation Review is required before Builder
    publishes the ordinary r07 correction. r07 is not direct implementation
    acceptance evidence.
  - >-
    r07 must address only the active r05-r06 correction request through the
    normal GUP and Review lifecycle. Its exact provenance.review_id consumes
    the ready Review handoff; supersession alone never does.
  - >-
    The integrated 0050 bundle remains immutable terminal history. No role may
    reissue, rescan as ready work, or reintegrate it under this Decision.

