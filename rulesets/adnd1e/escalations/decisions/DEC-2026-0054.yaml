question: >-
  When an active revision-required Review has a ready Builder handoff, does a
  later GUP revision consume that handoff merely by superseding the reviewed GUP,
  and should an already integrated approved bundle be rediscovered as Integrator
  work?

ruling: >-
  No. An active revision-required Review owns an independent Review-handoff
  lineage. A later GUP in the same lineage as the reviewed GUP consumes that
  handoff only when its provenance.review_id exactly names the active Review ID.
  Superseding the reviewed GUP alone is not consumption, and a successor that
  names an earlier Review does not consume a later Review. Queue derivation must
  therefore route the active Review handoff even when its reviewed GUP is no
  longer the current GUP leaf, unless this exact consumption evidence exists.

  The existing approved DEC-2026-0050 bundle remains consumed. Its exact
  Integration record, INT-20260820-001, names the approved bundle and reviewed
  GUP, and its ruleset manifest records the resulting canonical transaction.
  Neither the Review-lineage rule nor this Decision reopens it or creates an
  Integrator job.

  Accordingly, REV-GUP-PKT-PHB-094-100-illusionist-spells-r05-r06 is active
  Builder work after the scanner correction. Builder then publishes the ordinary
  GUP-PKT-PHB-094-100-illusionist-spells-r07 correction in the same GUP lineage,
  with provenance.review_id set exactly to that Review ID. That r07 is the only
  ordinary artifact authorized to consume this ready Review handoff.

rationale:
  - >-
    A Review's revision request is evidence about the reviewed GUP, but it is
    not proof that every later GUP revision satisfies its findings. Exact
    provenance distinguishes a responding revision from an unrelated one.
  - >-
    Keeping Review and GUP leaves distinct preserves append-only history while
    ensuring a later current GUP cannot make ready correction work disappear.
  - >-
    An Integration record is the terminal exact consumer for an Approved
    bundle. Requeueing 0050 would duplicate a canonical transaction rather
    than recover omitted work.

