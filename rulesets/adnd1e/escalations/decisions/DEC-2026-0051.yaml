question: >-
  Is `approved_but_excluded_from_bundle` a legal per-edge Review disposition, and
  how must the active Illusionist Review lineage recover without rewriting immutable
  Reviews or causing Builder to infer a disposition?

ruling: >-
  No. The only legal per-edge dispositions are `approved`,
  `approved_with_revision`, `rejected`, and `architect_escalation`.
  `approved_but_excluded_from_bundle` is invalid and is not added to the
  vocabulary. It conflates two independent facts: `approved` is the Reviewer's
  judgment that an assertion is correct, while Approved-bundle membership is a
  packaging fact derived from the GUP's approved/pending/blocked components and
  governed by DEC-2026-0047. A correct row may be `approved` and remain outside
  an Approved edge component because it is in the GUP's checksummed
  `blocked.csv`; that exclusion must be recorded as packaging evidence, not as a
  fifth row disposition.

  `REV-GUP-PKT-PHB-094-100-illusionist-spells-r05-r03` and `-r04` remain
  immutable history. Reviewer publishes
  `REV-GUP-PKT-PHB-094-100-illusionist-spells-r05-r06`, superseding the active
  `-r05` leaf for the same immutable r05 GUP. It must restate M025, M026, M058,
  M072, M073, and M074 as `approved`, preserve the nine r05 rejections through
  the normal Review chain, and record the six-row `blocked.csv` exclusion as
  packaging evidence only. Builder then publishes the normal r07 GUP successor;
  it neither maps an unknown term nor creates a no-op artifact. The ordinary
  Review/Approved/Integrator lifecycle follows from that successor.

  New Reviews declaring `review_contract_version: '1.1'` must validate every
  per-row `edge_decisions` or `row_decisions` disposition against the four-term
  vocabulary at publication. The opt-in field preserves immutable legacy history
  while making an unrecognized disposition a schema failure before it can become
  an otherwise valid downstream handoff.

rationale:
  - >-
    `tooling/builder/src/adnd1e_builder/review.py` already has exactly the four
    executable dispositions and correctly rejects an unrecognized fifth term.
    Adding a synonym would let Review invent operational states that no contract
    or compiler behavior defines.
  - >-
    DEC-2026-0047 explicitly keeps `blocked.csv` outside the Approved bundle.
    Its six records remain source-supported but are blocked on the named
    cross-packet work, so their bundle exclusion is neither a source rejection
    nor an architectural escalation.
  - >-
    A successor Review is the established append-only correction mechanism.
    Restating the six active row rulings as `approved` makes the later Review
    override the inherited invalid term without altering r03 or r04.

