sequence:
  - step: 1
    owner: architect
    action: >-
      Publish this Decision, update the Review-vocabulary contract and Reviewer
      instructions, and close the escalation. Do not change Review, GUP, bundle,
      or canonical data.
  - step: 2
    owner: builder
    action: >-
      Add the opt-in `review_contract_version: '1.1'` common schema validation
      and focused tests, then publish IMP-DEC-2026-0051-r01. The schema must
      accept each of the four legal dispositions and reject
      approved_but_excluded_from_bundle on `edge_decisions` and `row_decisions`.
      It must not invalidate a Review that omits the opt-in version field.
  - step: 3
    owner: reviewer
    action: >-
      Independently review IMP-DEC-2026-0051-r01. Verify the opt-in boundary,
      legal-vocabulary enforcement, and legacy-history compatibility before
      approving the implementation review.
  - step: 4
    owner: reviewer
    action: >-
      Publish REV-GUP-PKT-PHB-094-100-illusionist-spells-r05-r06, superseding
      r05-r05. Declare review_contract_version 1.1; restate the six named refs
      as `approved`; carry the blocked-component path, checksum, refs, and
      exclusion reason in packaging evidence; and hand off normally to Builder.
      Do not rewrite r03/r04, emit an Approved bundle, or call the six rows
      rejected or architect_escalation.
  - step: 5
    owner: builder
    action: >-
      Consume the r06 Review through the normal compiler and publish
      GUP-PKT-PHB-094-100-illusionist-spells-r07. It applies the inherited nine
      legal rejections, retains the six source-supported blocked rows in the
      blocked component when their cross-packet endpoints remain unresolved, and
      emits no unknown-disposition error.
  - step: 6
    owner: reviewer
    action: >-
      Review r07 and, only when its approved/pending component and blocked
      exclusion are complete and checksummed, publish the normal Approved bundle.
  - step: 7
    owner: integrator
    action: >-
      Integrate only the ordinary approved r07 bundle and then re-run the
      normal five-field batch preflight for the dependent Magic-User bundles.

acceptance_tests:
  - >-
    WORK_QUEUES version 1.17 or later retains the four legal Review row
    dispositions, the separation of Review outcome from Approved-bundle
    membership, and the `review_contract_version: '1.1'` publication check.
  - >-
    ARTIFACT_LIFECYCLE version 1.13 or later retains the same four-term Review
    disposition vocabulary and requires a successor Review to record packaging
    exclusions outside the per-row disposition field.
  - >-
    Under review_contract_version 1.1, `schemas/common/review.schema.json`
    accepts the four legal values in edge_decisions and row_decisions and rejects
    approved_but_excluded_from_bundle. A legacy Review omitting that field still
    validates as immutable history.
  - >-
    The Builder implementation report proves the schema and focused tests pass;
    its independent Review verifies every direct implementation acceptance test.
  - >-
    r06 supersedes r05-r05 without modifying r03/r04, declares Review 1.1,
    uses `approved` for exactly M025, M026, M058, M072, M073, and M074, records
    their checksummed blocked component as packaging evidence, and introduces no
    novel disposition.

acceptance_test_semantics:
  - acceptance_test_index: 1
    kind: versioned_contract_content
    contracts:
      - path: contracts/WORK_QUEUES.md
        minimum_version: '1.17'
        substantive_anchors:
          - review_contract_version
          - approved_but_excluded_from_bundle is invalid
          - Approved-bundle membership
  - acceptance_test_index: 2
    kind: versioned_contract_content
    contracts:
      - path: contracts/ARTIFACT_LIFECYCLE.md
        minimum_version: '1.13'
        substantive_anchors:
          - approved_with_revision
          - packaging exclusions
          - per-row disposition

post_implementation_requirements:
  - >-
    The Builder r07, Reviewer r07, Approved bundle, and Integrator preflight are
    ordinary downstream artifacts. They do not block the direct schema
    implementation review, but they must follow the exact successor sequence.
  - >-
    The six blocked rows remain source-supported history. A future request to
    package them independently needs its own governed eligibility and Integrator
    behavior; this Decision does not create such a component kind.

