question: >-
  Must Decision handoff replacement stop emitting a Decision job once an
  Approved Decision Implementation Review has consumed that Decision, just as
  the ordinary direct-Decision queue rule already does?

ruling: >-
  Yes. Handoff replacement continues to suppress the originating artifact's
  stale ready handoff, but may emit the Decision's own handoff only while the
  Decision has outstanding work under its ordinary applicable Decision queue
  lifecycle. It must not emit a ready or blocked Decision item after an Approved
  Decision Implementation Review has consumed the exact active implementation
  report leaf.

  The same gate applies before terminal consumption: an active approval-ready
  implementation report produces the ordinary Reviewer job, and an active
  revision-required implementation Review produces the ordinary owner revision
  job, without a second replacement Decision job. This does not remove handoff
  replacement, rewrite immutable artifacts, or change the existing
  same-Decision lineage-repair exemptions.

rationale:
  - >-
    DEC-2026-0068 is complete through IMP-DEC-2026-0068-r03 and its approved
    terminal Review, yet replacement emits Builder work solely by rereading the
    immutable Decision handoff.
  - >-
    The ordinary Decision rule already has the required lifecycle distinction.
    Reusing that distinction makes both routes agree rather than accumulating
    a checksummed exception for every completed Decision.
  - >-
    The replacement still has a distinct and necessary purpose: it retires the
    superseded originating artifact's handoff while the Decision is outstanding.

