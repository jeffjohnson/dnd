    Queue reports use the terminal implementation Review to classify completed
    Decisions. Passing tests or a report without an approved Review never alone
    establish completion.
  - >-
    Future immutable one-off lineage records remain valid only when a separate
    Decision expressly authorizes them; this general lifecycle fix does not
    broaden any exception record.

