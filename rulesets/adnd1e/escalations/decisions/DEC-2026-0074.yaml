acceptance_tests:
  - >-
    With DEC-2026-0068, IMP-DEC-2026-0068-r03, and its approved terminal Review
    at their pinned values, scan-agent-queues emits no DEC-2026-0068 Builder
    item while retaining the completed history as informational evidence.
  - >-
    A Decision that remains unconsumed still suppresses the exact originating
    artifact handoff and emits its specified ready or blocked Decision handoff;
    a migration-required Builder Decision retains its ordinary migration route
    without duplication.
  - >-
    An active approval-ready implementation report produces only its ordinary
    Reviewer job, and an active revision-required implementation Review produces
    only its ordinary implementation-owner revision job. Neither state permits
    replacement to add a Decision job.
  - >-
    Superseded Decisions, integrated decision migrations, and the existing
    same-Decision lineage-repair exemptions retain their prior behavior. The
    change never suppresses the origin artifact unless the established exact
    replacement conditions hold.
  - >-
    IMP-DEC-2026-0074-r01 pins this Decision checksum, records passing focused
    and full applicable scanner evidence, and is approval-ready for independent
    Reviewer verification.
  - >-
    contracts/WORK_QUEUES.md is Version 1.28 or later and retains the Decision
    handoff-replacement consumption gate.

