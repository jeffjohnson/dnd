decision_authoring_contract_version: '1.1'

question: >-
  How must current-state validation distinguish immutable historical artifacts
  from current canonical state, and how must queue derivation represent the
  one already-ratified r02 handoff-only GUR exemption?

ruling: >-
  A published GUR, GUP, Review, Approved bundle, or Integration record is
  immutable provenance. A later current-state migration may update a registry or
  canonical endpoint but must not cause a test to declare an older immutable
  artifact defective solely because it retains its historically correct ID.
  Current-state identity tests must instead inspect the current registry,
  canonical baseline, or freshly compiled output. Accordingly,
  LiveCavalierRepointCase must not scan a published Cavalier GUP CSV against
  current retirements; retain only live compiler/registry fixtures for repoint
  behavior.

  Queue derivation implements the common-schema suite's narrow historical
  treatment as an exact checksummed record in this active Decision. The record
  below is the sole authorized instance: r02 is immutable history because its
  envelope errors are confined to `handoff` and r03 is its direct fully valid
  successor. The scanner emits one informational historical-exemption diagnostic
  for r02, no `gur_invalid_handoff` error, and no repair work. This does not
  relax the ordinary rule for any active leaf, any non-handoff defect, or any
  unrecorded malformed predecessor.

rationale:
  - >-
    INT-20260820-001 correctly repointed the current canonical Cavalier rows
    from `training` to `rule_training`. The older GUP is evidence of the input
    and output available when it was published; retroactively applying a later
    registry migration to it contradicts append-only provenance.
  - >-
    The schema suite already permits r02 only when a successor has repaired all
    non-handoff validity concerns, and reports the singleton exemption. Queue
    derivation must use the same lifecycle truth to avoid a permanent false
    repository error.
  - >-
    A checksummed Decision record prevents the generic successor rule from
    silently becoming permission for future malformed GURs. Future cases need
    their own Architect Decision.

