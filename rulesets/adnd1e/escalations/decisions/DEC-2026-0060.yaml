sequence:
  - step: 1
    owner: architect
    action: >-
      Publish this Decision and its decided escalation; version the queue and
      lifecycle contracts and the Decision schema. Preserve all GURs, GUPs,
      Reviews, Approved bundles, Integrations, registry rows, and canonical
      data unchanged.
  - step: 2
    owner: builder
    action: >-
      Implement the exact contract. Replace the published-artifact scan in
      LiveCavalierRepointCase with current compiler or registry fixture coverage;
      do not modify any Cavalier GUP CSV. Add scanner support for only validated
      active-Decision `gur_handoff_historical_exemptions` record below, using
      full envelope validation to prove handoff-only invalidity and successor
      validity. Publish IMP-DEC-2026-0060-r01.
  - step: 3
    owner: reviewer
    action: >-
      Independently review IMP-DEC-2026-0060-r01. Confirm the historical GUP
      remains untouched, r02's exemption is exact and informational, all
      malformed-GUR negative cases stay errors, and the full applicable suites
      pass.

acceptance_tests:
  - >-
    LiveCavalierRepointCase no longer reads an immutable published GUP CSV or
    compares it with current `NodeRegistry.retirements`. Focused current
    compiler/registry tests still prove endpoint repointing, and no GUR, GUP,
    Review, Approved bundle, Integration, registry, or canonical artifact is
    mutated to make the test pass.
  - >-
    The sole DEC-2026-0060 record for r02 and r03 produces exactly one
    informational `gur_handoff_historical_exemption` diagnostic, no
    `gur_invalid_handoff` diagnostic or Analyst repair item for r02, and no
    scanner error. Removing the record, changing either checksum, naming a
    non-direct successor, giving the predecessor an error outside `handoff`, or
    making the successor invalid preserves the ordinary malformed-GUR error and
    its normal repair routing where applicable.
  - >-
    Existing terminal, ready, missing-handoff, malformed leaf, and malformed
    non-leaf GUR scanner cases remain unchanged except for the expressly
    checksummed r02/r03 historical classification. The common schema singleton
    guards continue to report only r02 and r03 remains its sole valid successor.
  - >-
    IMP-DEC-2026-0060-r01 pins this Decision's exact checksum, records passing
    focused and full applicable suite evidence, reports every direct acceptance
    test as passed, and is approval-ready for independent Reviewer verification.

post_implementation_requirements:
  - >-
    Builder reissues IMP-DEC-2026-0053-r03 under DEC-2026-0053 with truthful
    passing current evidence once the corrected suite permits it; Reviewer
    reviews that report through the normal implementation-review lifecycle.
  - >-
    Builder publishes GUP-PKT-PHB-094-100-illusionist-spells-r07 under its
    existing Review/Decision lineage. Reviewer then performs its ordinary GUP
    review. Neither artifact is acceptance evidence for DEC-2026-0060 and
    neither blocks its implementation Review.
  - >-
    No Analyst action is authorized. Do not publish a further successor to
    GUR-PKT-UA-015-015-cavaliers-r03, and do not edit r02 or r03.

