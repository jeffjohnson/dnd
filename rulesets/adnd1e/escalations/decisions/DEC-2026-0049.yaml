acceptance_tests:
  - >-
    INT-20260819-002 supersedes INT-20260819-001, withdraws the five within-
    bundle and seven canonical three-field findings, and does not suppress the
    psionics bundle on those withdrawn claims.
  - >-
    Its retained duplicate findings identify all five identity fields and are
    limited to the nine exact cross-bundle collisions; no finding based only on
    source_id, edge_type, and target_id remains blocking.
  - >-
    The existing Reviewer successors retain the Magic-User assertions, request
    removal only of the nine exact duplicate Illusionist assertions, and leave
    the psionics current Review approved without an unnecessary GUP revision.

post_implementation_requirements:
  - >-
    Reviewer and Builder complete the already routed Illusionist GUP successor,
    then Reviewer and Integrator follow their ordinary lifecycle. This Decision
    does not authorize a source reinterpretation or a replacement of the current
    incoming packet authority.
  - >-
    Future duplicate-class rejection records must name the Constitution assertion
    key they evaluated. A near-match diagnostic remains nonblocking unless a
    separate governed invariant fails.

