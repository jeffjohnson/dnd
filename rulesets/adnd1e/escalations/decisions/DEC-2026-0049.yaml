  superseded_rejection:
    id: INT-20260819-001
    path: rulesets/adnd1e/reports/INT-20260819-001.rejected.json
    disposition: immutable_history_no_queue_effect
  corrective_rejection:
    id: INT-20260819-002
    path: rulesets/adnd1e/reports/INT-20260819-002.rejected.json
