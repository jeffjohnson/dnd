question: >-
  Which identity key governs duplicate rejection for AD&D 1e production assertions:
  the five-field Constitution 5.1 key or a three-field source/type/target shortcut?

ruling: >-
  The Constitution 5.1 normalized five-field assertion key governs every duplicate
  decision: source_id, edge_type, target_id, aspect, and condition, with the
  existing ALTERNATIVE_TO endpoint normalization. A three-field source/type/target
  comparison is a near-match probe only. It must never be called an assertion-key
  duplicate, block integration, or direct a row's deletion.

  INT-20260819-001 is immutable history but is superseded by INT-20260819-002. The
  successor correctly withdraws all five within-bundle and all seven canonical
  three-field claims, releases the psionics bundle, and retains the nine exact
  five-field cross-bundle collisions. Those nine collisions remain ordinary
  Reviewer/Builder remediation: retain exactly one source-supported copy of each
  assertion, without deleting any row merely because it differs in aspect or
  condition. No contract or constitution change is required.

rationale:
  - >-
    Aspect identifies the mechanical facet and condition identifies the activation
    boundary. Omitting either would erase independently sourced mechanics and
    violate GRAPH_INVARIANTS 12.
  - >-
    The current Integrator invariant implementation already applies the five-field
    key. INT-20260819-002 proves the correction against the current Approved
    components and preserves the real exact collisions for normal review.
  - >-
    Immutable superseding rejection records preserve audit history while ensuring
    a withdrawn error no longer suppresses an otherwise valid Integrator item.

