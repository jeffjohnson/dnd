new_nodes_authorized:
  - id: monster_giant
    label: Giants
    kind: monster
    basis: >-
      DMG 64 expressly distinguishes giant-hurled boulders, giant-thrown
      missiles, and the giant attack that negates a target's dexterity armour
      class bonus. The subject is giant humanoids, not giant vermin.

