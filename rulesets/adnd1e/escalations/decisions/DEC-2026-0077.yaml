sequence:
  - step: 1
    owner: architect
    action: >-
      Publish this reissue and move the escalation to decided state. Preserve
      DEC-2026-0076 and all active artifacts as immutable history.
  - step: 2
    owner: builder
    action: >-
      Publish GUP-MIG-DEC-2026-0077-r01 using only this Decision. It carries
      the one top-level authorized node addition, one endpoint repoint, current
      baseline provenance, and validation evidence, with no edge CSV.
  - step: 3
    owner: reviewer
    action: >-
      Verify the exact one-node, one-row migration and publish the matching
      Approved direct-migration bundle.
  - step: 4
    owner: integrator
    action: >-
      Integrate only the approved identity migration and rebuild canonical outputs.
  - step: 5
    owner: analyst
    action: >-
      After the migration Integration record exists, publish DMG 64 GUR r05:
      replace M014 with monster_giant / Giants, remove IDQ-01 as unresolved, and
      preserve every other analytical decision.
  - step: 6
    owner: builder
    action: >-
      Publish DMG 64 GUP r03 after r05. It changes M014 only to monster_giant /
      Giants and preserves the other eighteen rows, 12 additions, 7 pending
      additions, and three node proposals.
  - step: 7
    owner: reviewer
    action: >-
      Publish the ordinary r03 Review and Approved bundle without a
      Giant-Hurled-Boulders endpoint-label correction.
  - step: 8
    owner: integrator
    action: Verify and integrate the ordinary approved DMG 64 r03 packet bundle.

acceptance_tests:
  - >-
    The direct-v1 planner reads monster_giant only from new_nodes_authorized and
    emits exactly one node addition plus the one named source-endpoint repoint.
    It does not report a dropped or ambiguous operation.
  - >-
    The migration changes the named canonical row only from monster_special /
    Giant-Hurled Boulders to monster_giant / Giants and preserves every other
    assertion field. No giant-vermin identity changes.
  - >-
    GUR r05 and GUP r03 use monster_giant / Giants for M014, remove IDQ-01 as
    unresolved, preserve all other DMG 64 assertions and provenance, and do not
    treat Giant-Hurled Boulders as a node label.
  - >-
    The r03 Review and Approved bundle approve the 12/7/0 packet partition with
    no semantic change beyond M014's resolved identity.
  - >-
    Both transactions pass applicable schema, direct-migration, graph, registry,
    lineage, and repository validation in the stated order.

post_implementation_requirements:
  - >-
    A future Decision must use the planner's documented executable operation
    keys. An unfamiliar location is invalid until a separately approved tooling
    change makes it executable.
  - >-
    DEC-2026-0076 is superseded only as a migration authority; its diagnosis and
    all cited artifact bytes remain immutable history.

