question: >-
  Must the authorized monster_giant registry addition be stated under the
  direct-v1 planner's top-level new_nodes_authorized field, or may Builder infer
  an alternate node-addition location?

ruling: >-
  This Decision reissues DEC-2026-0076 without changing its identity, source,
  registry, or canonical scope. The one authorized node addition is stated only
  under top-level new_nodes_authorized, which is the sole location the direct-v1
  planner executes. canonical_migration.node_addition is deliberately absent.
  Builder must not infer an alias or widen the planner.

  Register monster_giant with label Giants and kind monster, then repoint the
  one existing DMG 64 giant-humanoid assertion from monster_special /
  Giant-Hurled Boulders to monster_giant / Giants. Existing giant-vermin
  identities remain distinct. After this migration is integrated, follow the
  ordinary DMG 64 r05 GUR, r03 GUP, Review, Approved bundle, and Integration
  sequence specified below.

rationale:
  - >-
    The failed plan correctly refused an operation stored where its consumer
    cannot read it. Moving the one key preserves fail-closed semantics and the
    planner's single authoritative operation location.
  - >-
    The direct-v1 model already supports exactly this registry addition and
    endpoint repoint. No code or contract change is needed.
  - >-
    DEC-2026-0076 remains immutable historical evidence of the authoring error;
    this reissue is the lawful correction.

affected_contracts: []
affected_registries:
  - path: rulesets/adnd1e/registries/nodes.csv
    change: Add monster_giant / Giants through the approved direct migration.
