    The later DMG GUR, GUP, Review, and Approved bundle remain ordinary successors.
  direct_implementation: >-
    Builder creates GUP-MIG-DEC-2026-0077-r01 in direct-migration lineage
    MIG-DEC-2026-0077. It has no edge CSV and is not an implementation report.

