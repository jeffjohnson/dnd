    - tooling/common/scan-agent-queues.ps1
    - tooling/common/tests/test_scan_agent_queues.py
    - tooling/builder/src/adnd1e_builder/decision_migration.py
    - tooling/builder/src/adnd1e_builder/emit.py
    - tooling/builder/src/adnd1e_builder/migration.py
    - tooling/builder/tests/test_decision_migration.py
    - tooling/builder/src/adnd1e_builder/vocab.py
    - tooling/builder/tests/test_registry_and_vocab.py

migration_required: false
migration_scope:
  canonical_data: none
  published_artifacts: no_move_no_rewrite
  workflow_rework:
    - Supersede GUP-MIG-DEC-2026-0015-0016-r01 with conforming r02.
    - Route r02 to Reviewer only after all decision-migration lineage checks pass.
    - Add artifact_kind packet_update to newly emitted packet GUPs.
    - >-
      Treat identity_merge_migration as an immutable legacy spelling; any future
      revision uses decision_migration and the complete current envelope.
  scanner_behavior:
    - Discover Builder-ready, unconsumed migration Decisions.
    - Group decision-migration GUP revisions by lineage_id, not packet_id.
    - Validate authority and baseline provenance before Reviewer routing.
    - Reserve stale_gup_input for packet-update GUR lineage.
    - Discover decision migrations in book GUP stores and ruleset cross-book stores.
  governance_reference_corrections:
    - >-
      Attribute Constitution 1.6 section 2.1 and its historical-version
      revalidation requirement to DEC-2026-0017, not DEC-2026-0016.
    - >-
      Keep SOURCE_MARKDOWN 1.1 packet-page authority attributed to
      DEC-2026-0016; do not describe it as Constitution section 5.

contract_version_impact:
  contracts/ARTIFACT_LIFECYCLE.md:
    previous_version: "1.1"
    new_version: "1.2"
  contracts/WORK_QUEUES.md:
    previous_version: "1.1"
    new_version: "1.2"

constitution_version_impact:
  changed: false
  version: "1.6"
  reason: This changes universal artifact lineage and queue discovery, not graph semantics.

acceptance_tests:
  - >-
    A conforming decision_migration with no GUR appears exactly once as
    REVIEWER-DECISION-MIGRATION and emits no stale_gup_input diagnostic.
  - >-
    Missing or mismatched Decision paths, IDs, checksums, approval status,
    migration requirement, or ruleset prevent Reviewer routing and return a
    lineage-error exit code.
  - >-
    Missing revision, supersedes, lineage_id, canonical checksum, validation
    report, or validation-report checksum prevents Reviewer routing.
  - >-
    A decision_migration containing gur_id or gur_checksum is diagnostic and not
    Reviewer-ready.
  - >-
    An invalid decision migration does not consume its authority Decisions; the
    Decisions remain visible as Builder jobs.
  - >-
    Two migrations with packet_id cross-packet and distinct lineage_id values
    remain independent.
  - >-
    A superseding revision leaves only the active leaf Reviewer-ready, and a
    Review consuming that leaf removes it from Reviewer readiness.
  - >-
    The Python and PowerShell scanners return equivalent decision-migration jobs,
    diagnostics, components, and exit codes.
  - >-
    GUP-MIG-DEC-2026-0015-0016-r02 validates against the updated common GUP
    schema and names an existing checksummed validation report.
  - >-
    Builder vocabulary and tests attribute Constitution 1.6 scaling to
    DEC-2026-0017 and SOURCE_MARKDOWN 1.1 page authority to DEC-2026-0016.
  - >-
    Newly emitted packet GUPs declare artifact_kind packet_update, and legacy
    identity_merge_migration artifacts are never silently made Reviewer-ready.
  - >-
    Equivalent decision migrations are discovered in book-scoped and
    ruleset-scoped cross-book stores.
  - No canonical, registry, Decision, or r01 artifact changes during implementation.

governance_changelog:
  - >-
    ARTIFACT_LIFECYCLE 1.2 defines packet updates and decision migrations as the
    two GUP lineage roots and makes their bundle components kind-specific.
  - >-
    WORK_QUEUES 1.2 defines Builder discovery, Reviewer eligibility, revision
    grouping, provenance validation, diagnostics, and tests for decision
    migrations.

exact_diff:
  contracts/ARTIFACT_LIFECYCLE.md:
    - Change Version 1.1 to 1.2.
    - Define packet_update and decision_migration lineage roots.
    - Define decision-migration provenance and bundle components.
    - Preserve identity_merge_migration only as an immutable legacy spelling.
  contracts/WORK_QUEUES.md:
    - Change Version 1.1 to 1.2.
    - Add GUP Lineage Roots and the decision-migration minimum envelope.
    - Extend Builder and Reviewer queue rules.
    - Add decision-migration acceptance tests 12 through 20.

follow_up_owner: builder
follow_up_owners:
  builder:
    - Publish the r02 decision-migration GUP and validation report.
    - Update the common GUP schema and both queue scanners with tests.
    - Add packet_update to future packet GUP envelopes and normalize future identity-migration revisions.
    - Correct the stale DEC-2026-0016/0017 governance references in Builder tooling.
  reviewer:
    - Independently validate scanner parity and review r02 when it becomes ready.
  integrator:
    - Accept only an Approved decision-migration bundle with verified baseline provenance.

prohibited_actions:
  - Do not mutate or relocate GUP-MIG-DEC-2026-0015-0016-r01.
  - Do not make r01 Reviewer-ready by suppressing diagnostics alone.
  - Do not treat decision IDs without checksums as consumed authority.
  - Do not edit canonical graph or registry files while implementing queue support.
