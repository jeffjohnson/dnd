schema_version: "1.0"
id: DEC-2026-0018
status: approved
ruleset_id: adnd1e
constitution_version: "1.6"
revision: 1
supersedes: null
handoff:
  next_role: builder
  readiness: ready
  reason: >-
    Publish a conforming decision-migration GUP revision, update the common GUP
    schema, and implement decision-migration lineage in both queue scanners with
    the required acceptance tests.
  blocking_ids: []

decision_date: "2026-07-31"
escalation_id: null
supplements: DEC-2026-0012
decision_basis:
  type: direct_architect_assignment
  reported_by: builder
  affected_artifact: GUP-MIG-DEC-2026-0015-0016-r01
  observed_diagnostic: stale_gup_input

question: >-
  How does a GUP produced directly from approved Architect Decisions enter the
  Builder and Reviewer queues when it intentionally has no GUR lineage?

ruling: >-
  Adopt decision_migration as a first-class GUP lineage root alongside
  packet_update. A conforming decision migration is Reviewer-ready without a GUR
  when its Decision authority, checksums, canonical baseline, revision lineage,
  validation component, status, approval flag, and Reviewer handoff all validate.
  Missing GUR provenance is expected for this artifact kind and must never emit
  stale_gup_input. Invalid decision-migration lineage remains Builder work and
  must not be routed to Reviewer.

current_artifact_disposition:
  artifact_id: GUP-MIG-DEC-2026-0015-0016-r01
  disposition: builder_revision_required
  reviewer_ready: false
  reasons:
    - It omits revision and supersedes metadata required for every new GUP.
    - It has no stable lineage_id.
    - It lists Decision IDs but no checksummed decision_inputs.
    - It records the canonical source and row count but no canonical checksum.
    - It has no external validation-report path and checksum bundle component.
  required_revision:
    id: GUP-MIG-DEC-2026-0015-0016-r02
    revision: 2
    supersedes: GUP-MIG-DEC-2026-0015-0016-r01
    lineage_id: MIG-DEC-2026-0015-0016
    authority: [DEC-2026-0015, DEC-2026-0016]
  immutability: Do not edit, rename, move, or delete r01.

rationale:
  - >-
    A migration directed by approved Decisions has legitimate provenance even
    though no Analyst GUR exists. Applying packet-only lineage to it creates a
    false stale-input warning and hides valid work from Reviewer.
  - >-
    Suppressing that warning based only on artifact_kind would allow arbitrary
    GUPs to bypass source lineage. Decision IDs, paths, and checksums provide the
    alternate auditable root required by the workflow invariants.
  - >-
    A canonical migration is planned against mutable repository state. Recording
    the canonical checksum prevents a reviewed plan from being applied after its
    before-state has drifted.
  - >-
    packet_id cannot group decision migrations because several independent
    migrations may all use cross-packet scope. A stable lineage_id provides
    deterministic revision leaves without filename or timestamp inference.
  - >-
    DEC-2026-0012 already assigns common-schema and queue-scanner implementation
    to Builder. tooling/common is shared in location, but the Builder is the
    designated implementation owner for this contract change.

affected_contracts_and_registries:
  contracts:
