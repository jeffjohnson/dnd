acceptance_tests:
  - >-
    The two PHB packet-update GUPs collectively change exactly the stable
    assertions at baseline rows 413, 531, 532, and 535.
  - Every PHB cleanup result has polarity_basis read.
  - The PHB cleanup changes no field except polarity and polarity_basis.
  - Reviewer independently verifies all four PHB readings from claimed packets.
  - The PHB cleanup is integrated before the page-only migration is built.
  - >-
    GUP-MIG-DEC-2026-0016-PAGE-r01 uses lineage_id
    MIG-DEC-2026-0016-PAGE and checksums Decisions 0016, 0019, and 0021.
  - The page-only migration changes exactly nine page fields and no other field.
  - No combined-lineage r04 is emitted.
  - >-
    No DEC-2026-0015 identity operation is emitted until all sixteen DMG and UA
    polarity cleanups are read-based, Approved, and integrated.
  - >-
    The later identity migration is complete and atomic, applies the row-3283
    target-label correction, and uses the then-current canonical checksum.
  - No unread assertion is assigned polarity_basis read.
  - No canonical graph or registry file is changed by this Architect decision.

constitution_version_impact:
  changed: false
  version: "1.7"
  reason: >-
    This preserves the existing authored-polarity and source-provenance
    requirements while changing migration sequencing only.

follow_up_owner: builder
follow_up_owners:
  builder:
    - Compile the two completed PHB cleanup GURs now.
    - Build the independent page-only migration after their integration.
    - Keep the atomic identity migration blocked until all sixteen readings integrate.
  reviewer:
    - Review the two PHB cleanup GUPs from source.
    - Review the later page-only migration as a fresh lineage.
  integrator:
    - Integrate the PHB cleanup before the page-only migration.
    - Apply no DEC-2026-0015 identity operation before its complete approval.
  analyst:
    - Resume the sixteen-row cleanup only when claimed DMG and UA packets exist.

prohibited_actions:
  - Do not edit Decisions 0015, 0016, or 0019.
  - Do not edit, rename, move, delete, or approve combined migration r01-r03.
  - Do not emit a combined-lineage r04 with reduced authority or reduced scope.
  - Do not infer the sixteen DMG and UA polarities from canonical context.
  - Do not mark an unread assertion polarity_basis read.
  - Do not partially implement DEC-2026-0015.
  - Architect does not edit canonical graph, registry, or role tooling files.
