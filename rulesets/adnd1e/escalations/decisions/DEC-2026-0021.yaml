decision_date: "2026-08-03"
escalation_id: ESC-2026-08-03T22.35.13.308Z
supplements: DEC-2026-0019

question: >-
  How does the DEC-2026-0015/0016 migration proceed when four required PHB
  polarity readings are complete but the repository contains no claimed
  Markdown packet or Markdown source for the sixteen required DMG and UA
  readings?

ruling: >-
  Do not create an exception to GRAPH_INVARIANTS 15-16 and do not describe any
  unread DMG or UA polarity as read. The four completed PHB assertions proceed
  now through ordinary packet-update GUP, Review, and Integration. After those
  four assertions are integrated, DEC-2026-0016's nine page-only corrections
  may proceed in a new independent decision-migration lineage. The atomic
  DEC-2026-0015 identity migration remains blocked in full until claimed DMG
  and UA Markdown packets support all sixteen outstanding readings. The
  existing combined migration revisions r01 through r03 and their Reviews
  remain immutable, non-approvable history and are not a baseline for either
  replacement lineage.

rationale:
  - >-
    A missing source is a real dependency, not evidence for an assertion.
    Marking a plausible value as read without a packet would make the cleanup
    formally pass by recording false provenance.
  - >-
    The four PHB readings are complete, independently scoped, and already
    published as active-leaf GURs. Holding them would not improve the sixteen
    unavailable DMG and UA readings.
  - >-
    DEC-2026-0016 changes only page. Its nine assertion keys and semantic fields
    remain fixed, and the only four page-scope assertions affected by
    DEC-2026-0019's authored-polarity prerequisite are the completed PHB rows.
    It can therefore proceed after those four are integrated without carrying
    unread authored-polarity debt through a touched row.
  - >-
    DEC-2026-0015 expressly requires its node additions, registry relabels,
    endpoint repoints, label normalizations, and provenance merge to ship as
    one reviewed package. Splitting individual identity operations could leave
    registry labels and incident edge labels inconsistent, so that migration
    remains atomic.
  - >-
    The existing combined lineage cannot be narrowed by dropping prior input
    authority: WORK_QUEUES requires a replacement revision to preserve original
    input provenance. New independent lineages preserve both history and scope.

source_availability_disposition:
  completed_phb_cleanup:
    gur_ids:
      - GUR-PKT-PHB-033-035-alignment-hp-languages-r04
      - GUR-PKT-PHB-043-054-cleric-spells-r06
    baseline_rows: [413, 531, 532, 535]
    assertion_count: 4
    allowed_fields: [polarity, polarity_basis]
    required_basis: read
    next_sequence: [builder, reviewer, integrator]
  blocked_source_cleanup:
    books: [dmg, ua]
    assertion_count: 16
    baseline_rows:
      - 1702
      - 1984
      - 2065
      - 2066
      - 2122
      - 2215
      - 2273
      - 2612
      - 2902
      - 2903
      - 2904
      - 2905
      - 2906
      - 3147
      - 3283
      - 3498
    readiness: blocked
    unblock_condition: >-
      Claimed bounded Markdown packets conforming to SOURCE_MARKDOWN exist for
      every cited DMG and UA locus, and Analyst publishes source-read polarity
      GURs for all sixteen stable five-field assertion keys.
    prohibited_substitute: >-
      Canonical values, endpoint names, legacy before-images, and Reviewer
      inference do not substitute for reading the claimed source.

lineage_disposition:
  historical_combined_lineage:
    lineage_id: MIG-DEC-2026-0015-0016
    latest_artifact: GUP-MIG-DEC-2026-0015-0016-r03
    disposition: immutable_non_approvable_history
    action: >-
      Do not issue r04. Do not reuse this lineage for a reduced scope because a
      revision must preserve its original Decision inputs.
  page_only_lineage:
    lineage_id: MIG-DEC-2026-0016-PAGE
    first_gup_id: GUP-MIG-DEC-2026-0016-PAGE-r01
    authority:
      - DEC-2026-0016
      - DEC-2026-0019
      - DEC-2026-0021
    readiness: blocked_until_completed_phb_cleanup_is_integrated
    scope: >-
      Exactly the nine DEC-2026-0016 page replacements and no other edge,
      node, registry, label, polarity, or provenance mutation.
  identity_lineage:
    lineage_id: MIG-DEC-2026-0015-IDENTITY
    first_gup_id: GUP-MIG-DEC-2026-0015-IDENTITY-r01
    authority:
      - DEC-2026-0015
      - DEC-2026-0019
      - DEC-2026-0021
    readiness: blocked_until_all_sixteen_dmg_ua_readings_are_integrated
    scope: >-
      The complete atomic DEC-2026-0015 identity migration, including the
      DEC-2026-0019 row-3283 target-label correction, against the then-current
      canonical checksum.

sequence:
  - step: 1
    owner: builder
    action: >-
      Compile each active-leaf PHB GUR into its own polarity-only packet-update
      GUP. Preserve every field except polarity and polarity_basis.
  - step: 2
    owner: reviewer
    action: >-
      Independently verify the four PHB source readings and approve only
      read-based polarity with no other changed field.
  - step: 3
    owner: integrator
    action: >-
      Integrate the separately Approved PHB cleanup bundles and publish the new
      canonical checksum.
  - step: 4
    owner: builder
    action: >-
      Emit GUP-MIG-DEC-2026-0016-PAGE-r01 against that checksum with exactly
      the nine page-only changes authorized by DEC-2026-0016.
  - step: 5
    owner: reviewer
    action: Review the page-only migration as a fresh independent lineage.
  - step: 6
    owner: integrator
    action: Integrate only the Approved page-only bundle.
  - step: 7
    owner: analyst
    readiness: blocked
    action: >-
      When bounded DMG and UA packets exist, publish source-read GURs for the
      sixteen outstanding assertions.
  - step: 8
    owner: builder
    readiness: blocked
    action: >-
      After all sixteen cleanups are Approved and integrated, emit the complete
      DEC-2026-0015 identity migration in lineage MIG-DEC-2026-0015-IDENTITY.

