question: >-
  Should the eight historical Analyst handoffs that predate usable
  provenance.review_id remain ready work after their same-lineage corrections
  received a later independently approved Review?

ruling: >-
  Retire the eight exact historical Review handoffs recorded below. Each is a
  revision-required Review whose later same-lineage correction chain contains a
  GUP with null provenance.review_id and a separately published approved Review
  of a later correcting GUP. The approved Reviews establish that the correction
  work received independent Review despite the historical absent association.
  Six chains also integrated; the other two have current Integrator handoffs.
  They are therefore not Analyst work.

  This is an administrative classification of eight immutable historical
  handoffs, not a relaxation of DEC-2026-0054. For current and future work, the
  only implicit consumer remains a same-lineage GUP whose
  provenance.review_id exactly names the active Review. An absent, null, or
  different value remains non-consumption. No actor may infer retirement from a
  date, a GUP supersession, a later Review, an Approved bundle, or Integration.
  Only an active approved Architect Decision bearing a valid, checksummed
  record can retire its expressly named historical Review handoff.

rationale:
  - >-
    The eight now-visible handoffs were authored before the association was
    usable in the corpus. Re-performing their Analyst revisions would duplicate
    source interpretation that a later independent Review already approved.
  - >-
    Retiring only checksummed records preserves DEC-2026-0054's strict rule and
    keeps a current missing-field error visible rather than turning it into an
    automatic exception.
  - >-
    The two magic-user chains are not integrated yet, but their active work is
    already assigned to the Integrator. Reopening their old Analyst handoffs
    would create a contradictory duplicate assignment without increasing review
    rigor.

