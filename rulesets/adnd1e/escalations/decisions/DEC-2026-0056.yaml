migration_required: false
migration_scope:
  canonical_data_change: false
  registry_change: false
  profile_change: false
  source_interpretation_change: false
  artifact_lineage_change: >-
    The eight exact Review handoffs gain an administrative historical
    classification only. Their GUPs, later Reviews, Approved bundles,
    Integration evidence, and all existing provenance remain immutable.
  direct_implementation: >-
    Builder changes schema-aware queue derivation and tests only. No source
    packet, GUR, GUP, Review, Approved bundle, Integration manifest, registry,
    or canonical artifact is republished under this Decision.

sequence:
  - step: 1
    owner: architect
    action: >-
      Publish this Decision; version the queue and lifecycle contracts; add the
      structured retirement-record schema; and close the escalation. Do not
      rewrite any named Review, GUP, Approved bundle, Integration record, or
      canonical artifact.
  - step: 2
    owner: builder
    action: >-
      Update the scanner to validate active approved Decisions'
      review_handoff_retirements. It must classify only the eight exact Reviews
      above as informational retired history, preserve the two current
      magic-user Integrator jobs, leave any unretired missing-review_id Review
      as ready work, and publish IMP-DEC-2026-0056-r01 with focused schema and
      queue-test evidence.
  - step: 3
    owner: reviewer
    action: >-
      Independently review IMP-DEC-2026-0056-r01. Verify every exact retirement,
      the same-lineage and approved-resolution predicates, checksum and inactive
      Decision negative cases, and that current missing-review_id work is never
      inferred consumed.

acceptance_tests:
  - >-
    WORK_QUEUES Version 1.21 or later permits an active approved Decision to
    retire only an exact historical revision-required Review handoff through
    checksummed Review, later same-lineage GUP, and approved-resolution Review
    evidence; absent, null, or different provenance.review_id remains
    non-consumption.
  - >-
    ARTIFACT_LIFECYCLE Version 1.17 or later preserves a retired historical
    Review handoff as immutable evidence and distinguishes it from ordinary
    exact provenance-based consumption.
  - >-
    schemas/common/architect-decision.schema.json accepts a complete historical
    Review-handoff retirement record and rejects missing required artifacts,
    malformed checksums, a non-Review reference, or a non-historical
    disposition.
  - >-
    Queue derivation reports exactly the eight named Review handoffs as
    informational retired history and no longer assigns them to Analyst;
    GUP-PKT-PHB-064-079-magic-user-spells-1-4-r08-r06 and
    GUP-PKT-PHB-079-094-magic-user-spells-5-9-r07-r05 remain current Integrator
    work; a current same-lineage GUP with a null or different review_id leaves
    an otherwise equivalent revision-required Review ready.
  - >-
    IMP-DEC-2026-0056-r01 pins this Decision's exact checksum, reports every
    direct acceptance test as passed with current evidence, records passing
    focused scanner and schema tests, and is approval-ready for independent
    Reviewer verification.

acceptance_test_semantics:
  - acceptance_test_index: 1
    kind: versioned_contract_content
    contracts:
      - path: contracts/WORK_QUEUES.md
        minimum_version: '1.21'
        substantive_anchors:
          - exact historical revision-required Review handoff
          - later same-lineage resolution GUP
          - approved resolution Review
          - absent null or different provenance.review_id remains non-consumption
  - acceptance_test_index: 2
    kind: versioned_contract_content
    contracts:
      - path: contracts/ARTIFACT_LIFECYCLE.md
        minimum_version: '1.17'
        substantive_anchors:
          - immutable historical Review handoff
          - explicit historical classification
          - not an inferred missing-provenance exception

