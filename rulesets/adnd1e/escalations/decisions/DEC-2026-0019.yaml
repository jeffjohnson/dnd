migration_sequence:
  - step: 1
    owner: analyst
    action: >-
      Read source and publish correction GURs for all and only the 20 assertions,
      including a stable assertion key and authored polarity for each.
  - step: 2
    owner: builder
    action: >-
      Compile the active-leaf GURs into polarity-only packet-update GUPs without
      changing labels, IDs, citations, or assertion identity.
  - step: 3
    owner: reviewer
    action: >-
      Independently read all 20 assertions, expressly resolve baseline rows 535,
      1984, and 2273, and approve only read-based authored polarity.
  - step: 4
    owner: integrator
    action: >-
      Apply the Approved polarity cleanup and publish the resulting canonical
      checksum before any replacement decision migration is built.
  - step: 5
    owner: builder
    action: >-
      Emit GUP-MIG-DEC-2026-0015-0016-r03 against the post-cleanup canonical
      checksum and implement the corrected row-3283 target-label directive.
  - step: 6
    owner: reviewer
    action: >-
      Review r03 as a fresh active leaf. The r02 review is evidence, not approval.
  - step: 7
    owner: integrator
    action: Apply only the separately Approved r03 bundle.

