question: >-
  How must the DEC-2026-0015/0016 migration proceed when one label directive
  names the wrong endpoint field and 20 touched authored-polarity assertions
  retain bases that an Approved patch may not contain?

ruling: >-
  Correct only DEC-2026-0015's canonical-row-3283 label directive: preserve
  source_label Caster Level and normalize target_label to Taunt. Do not edit the
  immutable Decision. GUP-MIG-DEC-2026-0015-0016-r02 is not approvable and must
  remain immutable. Before Builder creates r03, Analyst must resolve the exact
  20 listed authored polarities from bounded source packets, Reviewer must
  independently verify them and resolve the three currently heuristic values,
  and Integrator must apply that separately Approved polarity cleanup. Builder
  then emits r03 against the post-cleanup canonical checksum under
  DEC-2026-0015, DEC-2026-0016, and this corrective Decision.

decision_precedence:
  corrected_decision: DEC-2026-0015
  corrected_clause: canonical_migration.endpoint_label_normalizations_without_repoint
  corrected_locator: canonical row 3283 against the recorded DEC-2026-0015 baseline
  prior_directive: {field: source_label, value: Taunt}
  governing_directive: {field: target_label, value: Taunt}
  preserved_endpoint_label: {field: source_label, value: Caster Level}
  scope: >-
    This Decision overrides only the row-3283 field selection. Every other
    DEC-2026-0015 ruling, guard, count, and migration directive remains in force.

rationale:
  - >-
    The supplied legacy row is exp_level MODIFIES spell_taunt. Taunt names the
    target node, while Caster Level names exp_level. Applying the literal prior
    directive would corrupt the source endpoint label.
  - >-
    MODIFIES, TRIGGERS, and CONSTRAINS use authored polarity. Constitution 1.6
    section 6.1 and GRAPH_INVARIANTS 15-16 prohibit an Approved GUP from
    retaining polarity_basis heuristic or unset on these touched assertions.
  - >-
    A migration exception would weaken a categorical review boundary to carry
    known legacy debt through modified rows. Source-backed cleanup is narrower
    and leaves the invariant intact.
  - >-
    DEC-2026-0016 authorizes exactly nine page-only corrections. Keeping the
    polarity work in a separately reviewed and integrated package preserves
    that Decision's semantic and field scope.
  - >-
    Exact polarity values require source interpretation. They are Analyst work,
    with independent Reviewer resolution, and are not inferred by Architect or
    Builder from the existing neutral, inflicts, or worsens values.

