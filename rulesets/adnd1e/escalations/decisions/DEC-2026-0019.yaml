acceptance_tests:
  - DEC-2026-0015, DEC-2026-0016, r02, and its Review remain byte-immutable.
  - >-
    The source-backed cleanup identifies exactly 20 baseline assertions by
    stable five-field keys and accounts for baseline rows 413, 531, 532, 535,
    1702, 1984, 2065, 2066, 2122, 2215, 2273, 2612, 2902, 2903, 2904, 2905,
    2906, 3147, 3283, and 3498.
  - >-
    Every cleanup row uses polarity_basis read; none retains heuristic or unset.
  - >-
    Reviewer independently verifies all 20 source readings and explicitly
    resolves the three baseline heuristic rows 535, 1984, and 2273.
  - The cleanup changes no field except polarity and polarity_basis.
  - The Approved polarity cleanup is integrated before r03 is emitted.
  - >-
    r03 records revision 3, supersedes r02, preserves lineage_id
    MIG-DEC-2026-0015-0016, and checksums all three authority Decisions.
  - r03 uses the post-cleanup canonical checksum and matching before-images.
  - >-
    The r03 result for the affected assertion is exp_level/Caster Level
    MODIFIES spell_taunt/Taunt; it never assigns Taunt to source_label.
  - >-
    The DEC-2026-0016 component still changes exactly nine page values and no
    other field as part of that decision scope.
  - The simulated r03 graph has no exact five-field assertion duplicates.
  - Canonical rows corresponding to baseline rows 3349 and 3350 remain distinct.
  - GR_HELPLESS_TARGET_AUTOHIT and the assertion at baseline row 2260 remain unchanged.
  - The deferred spell_imprisonment assertion at baseline row 3027 remains unchanged.
  - No THE PALADIN page changes are included.
  - The DMG page 67 locus from baseline row 1765 remains on survivor row 2258.
  - Architect changes no canonical graph or registry file.

