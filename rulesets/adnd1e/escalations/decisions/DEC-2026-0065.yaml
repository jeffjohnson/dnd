question: >-
  How must Integrator queue traversal handle the exact immutable unreadable
  Druid Review bridge already authorized by DEC-2026-0064, while remaining
  fail-closed for every unrecognized malformed artifact?

ruling: >-
  Do not edit, delete, reserialize, or supersede r04. DEC-2026-0064 remains the
  sole authority for treating r04 as historical unreadable evidence. Before
  Integrator traverses any Review directory, it must load active approved
  Architect Decisions and independently validate the exact DEC-2026-0064
  `review_malformed_lineage_repairs` record: Decision checksum, every pinned
  artifact checksum, r04's required YAML failure, r05-to-r04 and r06-to-r05
  direct links, r06's reviewed GUP, disposition, handoff, and exact r01+r06
  input set. Only then may the traversal omit r04's unreadable bytes from
  Review-lineage state. It must record one informational historical notice; it
  must not recover or use any r04 content.

  Every other unreadable Review, an absent or inactive governing Decision, a
  changed DEC-2026-0064 checksum, or any invalid field of that repair record is
  a fatal queue-integrity diagnostic. The Integrator queue returns no ready
  bundles, `queue` and `integrate` return exit code 2 without a traceback, and
  no dry run or canonical transaction begins. This applies equally to an
  unreadable approving Review, a mid-lineage Review, and a Review unrelated to
  the selected bundle.

rationale:
  - >-
    A malformed Review can change whether a published bundle is withdrawn, so
    silently skipping an unknown parse failure makes every reported ready bundle
    untrustworthy. Failure must be explicit and fail closed.
  - >-
    r04 is exceptional only because DEC-2026-0064 pins its bytes, expected
    parser failure, direct bridge, active successor, and Builder input boundary.
    The same record proves that no current Integration decision depends on r04
    content.
  - >-
    Integrator is an independent transactional consumer. It cannot trust an
    earlier scanner result in place of its own admission checks, but it may
    apply the same checksummed Decision record without inventing a second
    semantic exception.

