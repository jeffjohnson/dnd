sequence:
  - step: 1
    owner: architect
    action: >-
      Publish this Decision and decide the escalation. Preserve DEC-2026-0064,
      every named Review, the Bards bundle, registry, and canonical artifacts
      unchanged.
  - step: 2
    owner: integrator
    action: >-
      Implement Decision-governed Review admission in the Integrator queue. It
      must independently validate the exact active DEC-2026-0064 repair record
      before omitting r04, emit the named informational notice separately from
      fatal diagnostics, and fail closed without tracebacks for every denied or
      unrecognized parse failure. `cmd_integrate`, including `--dry-run`, must
      refuse whenever fatal queue diagnostics exist. Publish IMP-DEC-2026-0065-r01.
  - step: 3
    owner: reviewer
    action: >-
      Independently review IMP-DEC-2026-0065-r01. Verify exact DEC-2026-0064
      validation, the separate informational channel, fatal no-transaction
      behavior, and preservation of ordinary bundle queue semantics.

acceptance_tests:
  - >-
    A fixture containing DEC-2026-0064's exact repair record and pinned r04,
    r05, and r06 bytes returns from `ready_queue` without an exception. It emits
    one `historical_unreadable_review` informational record naming DEC-2026-0064
    and r04, produces no fatal diagnostic, and continues to classify unrelated
    valid Approved bundles by their ordinary Review lineages.
  - >-
    Each condition that invalidates DEC-2026-0064's repair route in the common
    scanner also invalidates Integrator admission: an absent, inactive, or
    checksum-mismatched Decision; a missing or altered record; any mismatched
    pinned artifact; parseable r04; wrong parser-failure fragment; broken direct
    r05/r06 links; wrong r06 GUP, disposition, or handoff; or a changed r01+r06
    input set. Each yields `review_yaml_unreadable`, no ready bundles, and exit
    code 2 without a Python traceback.
  - >-
    A different unreadable Review, including an approving Review or a Review in
    another packet lineage, is never informational history. Queue and integrate
    return exit code 2, do not call the transaction runner, do not write an
    Integration or rejection record, and do not mutate canonical or registry
    state. Restoring valid YAML restores ordinary queue behavior.
  - >-
    Existing valid bundle discovery, manifest checks, Review-withdrawal rules,
    rejected and integrated buckets, direct decision-migration bundles, and
    normal dry-run behavior remain unchanged. Informational history alone does
    not make `queue` exit 2 or prevent a normal transaction.
  - >-
    IMP-DEC-2026-0065-r01 pins this Decision checksum, records passing focused
    and full applicable Integrator-suite evidence, reports every direct
    acceptance test as passed, and is approval-ready for independent Reviewer
    verification.

post_implementation_requirements:
  - >-
    The existing Bards bundle is not approved or integrated by this Decision.
    After the repaired admission checks publish, Integrator evaluates it through
    the normal bundle-verification and transaction lifecycle.
  - >-
    DEC-2026-0064's Builder implementation and the ordinary Druid GUP lifecycle
    remain independent work. This Decision neither completes nor replaces them.
  - >-
    No role may edit r04 in place or create an r04 successor. The exact current
    r05-to-r06 bridge remains the only authorized lineage treatment.

