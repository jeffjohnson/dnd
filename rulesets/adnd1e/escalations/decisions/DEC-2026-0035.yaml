    - DEC-2026-0035
  direct_operations:
    registry_additions: 1
    registry_replacements: 2
    canonical_endpoint_repoints: 5
    canonical_row_removals: 1
    aliases_created: 0
    semantic_reinterpretations: 0
  exact_identity_scope:
    - action: add
      id: rule_greater_mistletoe
      label: Greater Mistletoe
      kind: rule
      authority: DEC-2026-0026
    - action: replace
      retired_id: spell_call_woodland_being
      canonical_id: spell_call_woodland_beings
      canonical_label: Call Woodland Beings
      canonical_rows: [2664, 2665, 2666]
      authority: DEC-2026-0025
    - action: replace
      retired_id: item_pipes_sewers
      canonical_id: item_pipes_sewer
      canonical_label: Pipes of the Sewer
      canonical_rows: [2479, 2480]
      authority: DEC-2026-0031
    - action: remove_exact_before_image
      canonical_row: 1502
      replacement_edge: null
      authority: DEC-2026-0024
  required_derived_rebuilds:
    - rulesets/adnd1e/canonical/nodes_master.csv
    - rulesets/adnd1e/canonical/graph.json

sequence:
  - step: 1
    owner: builder
    action: >-
      Extend the decision-migration planner, serializer, validation report, and
      tests to emit and validate decision_migration_v1, including node-registry
      provenance and no operation annotations that the direct schema forbids.
  - step: 2
    owner: builder
    action: >-
      Publish r05, superseding r04 in the same lineage. Replan from the current
      canonical and registry baselines; retain the exact r04 semantic operation
      set and add this Decision only as operation-model authority. Do not publish
      an edge CSV for r05.
  - step: 3
    owner: reviewer
    action: >-
      Independently review r05's source-identity scope, both baselines, every
      before-image, every retired endpoint set, and the direct model. On approval
      publish the no-edge-CSV Approved manifest with exactly the two required
      components and checksums.
  - step: 4
    owner: integrator
    action: >-
      Extend Approved-bundle discovery, direct-operation validation, transaction
      reporting, and rollback tests for decision_migration_v1 before applying
      the Approved r05 bundle. Update the Integrator-owned README to remove the
      stale claim that node retirement is unexercised.
  - step: 5
    owner: integrator
    action: >-
      Integrate only the approved r05 operation plan and publish normal
      integration provenance. Do not alter r04, its Review, the Decisions, or a
      packet artifact to represent completion.

