  reviewer_outputs:
    - books/adnd1e/phb/artifacts/reviews/REV-GUP-MIG-DEC-2026-0024-0025-r05-r01.yaml
    - books/adnd1e/phb/artifacts/approved/APPROVED-GUP-MIG-DEC-2026-0024-0025-r05-r01.yaml

acceptance_tests:
  - >-
    The common GUP schema accepts a fully populated decision_migration_v1 plan
    and the common Approved-bundle schema accepts only its exact GUP and
    validation components, while r04 and existing packet bundles remain valid
    historical artifacts.
  - >-
    The schemas reject a direct operation lacking registry provenance, an
    18-field before-image, a paired endpoint ID/label delta, an approved-plan
    checksum, or the required direct GUP/validation component pair.
  - >-
    GUP-MIG-DEC-2026-0024-0025-r05 supersedes r04 in the same lineage, has the
    five required Decision inputs with exact checksums, uses
    operation_model decision_migration_v1, and has no edge CSV.
  - >-
    r05's direct operation counts are exactly one registry addition, two
    registry replacements, five endpoint repoints, and one no-replacement row
    removal; it changes no other semantic field and creates no alias.
  - >-
    The Reviewer can independently prove that every r05 before-image and
    incident endpoint set matches both current baselines, including the two-row
    DEC-2026-0026 identity-only polarity exception.
  - >-
    The r05 Approved manifest is one discoverable Integrator bundle despite no
    edge CSV; a packet-update manifest without an edge CSV remains rejected.
  - >-
    Integrator preconditions reject mismatched GUP, Review, validation report,
    authority Decision, canonical baseline, registry baseline, duplicate key,
    incomplete incident set, unlisted field delta, and any retained retired ID
    before canonical files are written.
  - >-
    A valid dry run reports exactly the declared one addition, two replacements,
    five repoints, and one removal. A committed integration leaves
    rule_greater_mistletoe registered; removes spell_call_woodland_being and
    item_pipes_sewers from registry, nodes, and endpoints; and leaves row 1502
    absent with no replacement edge.
  - >-
    Each direct-operation failure, including one introduced after earlier
    in-memory mutations, restores the canonical edge file, nodes master, graph
    JSON, and node registry byte-for-byte.
  - >-
    All Builder, Reviewer, Integrator, common-schema, graph, registry, queue,
    and repository validations applicable to the changed components pass.
  - >-
    r04, REV-GUP-MIG-DEC-2026-0024-0025-r04-r01, and Decisions 0024, 0025,
    0026, and 0031 remain byte-immutable history; r05 is the only active
    migration leaf authorized to proceed.

constitution_version_impact:
