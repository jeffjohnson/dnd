constitution_version: "1.8"
revision: 1
supersedes: null
handoff:
  next_role: builder
  readiness: ready
  reason: >-
    Reissue the combined migration as r05 using the checked
    decision_migration_v1 direct-operation model. The r04 semantic plan is
    complete but cannot be approved or integrated under the former edge-CSV-only
    bundle contract.
  blocking_ids: []

decision_date: "2026-08-14"
escalation_id: ESC-2026-08-14T15.40.47.819Z

question: >-
  What Approved-bundle operation model may authorize the Integrator to apply
  the already reviewed combined migration of one registry addition, two node
  identity replacements, five endpoint repoints, and one canonical-row removal
  when no edge CSV can represent the complete operation set?

ruling: >-
  Adopt the narrow `decision_migration_v1` model defined by WORK_QUEUES 1.8 and
  the common GUP and Approved-bundle schemas. The executable plan is the exact,
  checksummed reviewed decision-migration GUP YAML; an Approved manifest names
  that plan and its validation report as components and never repeats, infers,
  or translates its operations. No edge CSV is present for this model. The
  Integrator may execute only: an approved registry addition, a one-row registry
  identity replacement with retirement, a paired endpoint-ID/label compare-and-
  swap against an enumerated full before-image, and an exact no-replacement row
  removal. This authorizes the existing combined semantic scope only; it does
  not create aliases, reinterpret any relationship, or authorize a general
  node-retirement mechanism.

rationale:
  - >-
    The r04 Review independently approved all nine semantic operations and
    verified every before-image against the current 4,133-row canonical
    baseline. Its only blocker is mechanical execution, not source authority or
    graph meaning.
  - >-
    An edge CSV can represent additions and ordinary compare-and-swap updates,
    but cannot truthfully encode registry identity replacement, retirement, and
    an exact deletion. Treating a prose note as an executable instruction would
    make the Integrator invent operations after Review.
  - >-
    The GUP already provides the right audit boundary: exact authority Decisions,
    full before-images, operation deltas, and validation provenance. Referencing
    that immutable file by checksum prevents a separately authored Approved
    manifest from widening or changing the plan.
  - >-
    Both source identities remain governed by claimed PHB packets: Greater
    Mistletoe, Call Woodland Beings, and Pipes of the Sewer. This Decision only
    supplies the missing mechanical path to apply their previously decided
    migrations.

operation_model:
  name: decision_migration_v1
  authority_source: >-
    The checksummed GUP YAML component is the sole operation source. The
    manifest is provenance and routing metadata, not a second operation plan.
  approved_manifest:
    artifact_kind: decision_migration
    operation_model: decision_migration_v1
    required_components:
      - kind: decision_migration
        path: books/adnd1e/phb/artifacts/gup/GUP-MIG-DEC-2026-0024-0025-r05.yaml
        meaning: Exact reviewed direct-operation GUP YAML.
      - kind: validation
        path: build/reports/GUP-MIG-DEC-2026-0024-0025-r05.validation.json
        meaning: Exact Builder validation report named by the reviewed GUP.
    prohibited_components: [edges]
    required_approval_checksums: [approves.gup_checksum, approves.review_checksum]
  preconditions:
    - >-
      The manifest, Review, GUP component, validation report, and every Decision
      input checksum match their declared immutable repository files.
    - >-
      The GUP's canonical edge baseline path, checksum, and row count match the
      current canonical file, and its node-registry path, checksum, and row
      count match the current registry before a snapshot is taken.
    - >-
      Every direct operation is within this model's schema, carries authority
      listed by the GUP, and has a complete 18-field canonical before-image.
    - >-
      Each node replacement's incident rows equal the complete current set of
      endpoints using its retired ID; every such row is an enumerated paired
      endpoint repoint.
  execution_order:
    - >-
      Validate all component, baseline, before-image, authority, incident-set,
      and post-plan collision conditions in memory before any canonical or
      registry write.
    - >-
      Inside one transaction, register each approved addition and replace each
      named registry row only after confirming the new ID is absent, the retired
      ID is present, and no alias is retained.
    - >-
      Apply enumerated endpoint repoints against their baseline line numbers and
      full before-images. Change only the one endpoint ID and its paired label.
    - >-
      Remove exact no-replacement rows after repoints, in descending baseline
      line order, so earlier physical row locators cannot shift.
    - >-
      Verify that retired IDs remain nowhere in registry, canonical endpoints,
      nodes master, or generated graph; rebuild all derived canonical outputs;
      then run the full invariant and regression suite before committing.
  prohibited_actions:
    - Infer an unlisted endpoint repoint from a retired ID.
    - Retain a retired ID as an alias, duplicate registry row, or generated node.
    - Apply any label, polarity, citation, evidence, or other non-enumerated
      field change.
    - Treat a replacement, merge, or removal shape outside this schema as
      decision_migration_v1.

governance_changes:
  contracts:
    - path: contracts/WORK_QUEUES.md
      version: "1.8"
      change: Defines the direct operation model, the no-edge-CSV Approved bundle, and required integration tests.
    - path: contracts/ARTIFACT_LIFECYCLE.md
      version: "1.6"
      change: Defines the direct-YAML lifecycle and component provenance.
  schemas:
    - path: schemas/common/gup.schema.json
      change: Validates decision_migration_v1 operations, full before-images, registry provenance, and paired endpoint fields.
    - path: schemas/common/approved-bundle.schema.json
      change: Validates the direct migration component pair and forbids an edge CSV for this artifact kind.
  instructions:
    - agents/builder/INSTRUCTIONS.md
    - agents/reviewer/INSTRUCTIONS.md
    - agents/integrator/INSTRUCTIONS.md
  constitution_changed: false
  registry_changed_by_architect: false

migration_required: true
migration_scope:
  lineage_id: MIG-DEC-2026-0024-0025
  superseded_gup: GUP-MIG-DEC-2026-0024-0025-r04
  required_gup: GUP-MIG-DEC-2026-0024-0025-r05
  prior_authority_decisions:
    - DEC-2026-0024
    - DEC-2026-0025
    - DEC-2026-0026
    - DEC-2026-0031
  required_authority_decisions:
