follow_up_owner: builder
follow_up_owners:
  builder:
    - Publish r05 only after the planner and schema validations implement this exact model.
    - Preserve r04's approved semantic operation set exactly; do not issue a separate migration lineage.
  reviewer:
    - Do not approve r05 without both baseline checksums and the two required manifest components.
    - Do not recreate an edge CSV merely to satisfy the former packet bundle convention.
  integrator:
    - Do not apply r05 until the direct-operation applier and rollback tests pass.
    - Do not infer an operation, preserve an alias, or repair source semantics during integration.

prohibited_actions:
  - Do not modify any canonical, registry, GUP, Review, or Approved artifact in this Decision publication step.
  - Do not reissue DEC-2026-0031; its semantic decision and planner vocabulary remain correct.
  - Do not treat the former r04 Review's architectural execution blocker as a source or identity defect.
  - Do not extend decision_migration_v1 to arbitrary row edits, merges, aliases, or removals with replacement without a new Architect Decision.
