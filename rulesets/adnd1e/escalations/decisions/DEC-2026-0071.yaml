acceptance_tests:
  - >-
    REV-GUP-PKT-PHB-117-119-bards-r04-r04 directly supersedes r03, preserves
    the exact reviewed-GUP and source provenance, has overall disposition
    approved, and hands off to Integrator with readiness ready. Its matching
    APPROVED-GUP-PKT-PHB-117-119-bards-r04-r04 directly supersedes r03,
    approves r04 by exact checksum, and has the same ready Integrator handoff.
  - >-
    The r04 Review contains exactly eleven approved proposed-node decisions for
    rule_bard_college, rule_bard_charm, rule_bard_legend_lore,
    rule_bard_poetics, rule_bard_song, item_drums_panic, item_horn_blasting,
    item_lyre_building, monster_harpy, monster_shrieker, and
    item_stringed_instrument; each carries label, kind, basis, and dependent
    edges. It separately records item_pipes_of_sewers as reuse_existing_identity.
  - >-
    The r04 bundle retains the declared r01 57-row edge component and 29/28/0
    operation partition, declares exactly eleven node operations sourced from
    r04's complete node decisions, and changes no GUP, registry, or canonical
    file.
  - >-
    With DEC-2026-0068 and its pinned r03 direct-successor record unchanged,
    queue derivation reports r02 only as historical unreadable evidence and
    evaluates r04 as the ordinary current Review and bundle leaf. Any altered
    r03 bytes, record, r02 parser state, or broken r04 lineage remains
    fail-closed and does not admit a bundle.
  - >-
    contracts/WORK_QUEUES.md is Version 1.26 or later and retains the
    unreadable-review continuation and Integrator-ready handoff rules.

