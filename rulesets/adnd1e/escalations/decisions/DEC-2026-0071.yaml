question: >-
  May Bards r03 receive one ordinary Review and Approved-bundle successor that
  restores its omitted node-registration decisions and Integrator handoff
  without invalidating the exact r02 unreadable-predecessor repair?

ruling: >-
  Yes. DEC-2026-0068's record remains the sole authority for treating r02 as
  unreadable historical evidence. It pins r03 as r02's immutable direct
  successor; it does not require r03 to remain the final Review leaf. The
  record therefore remains valid when, and only when, r03 itself remains
  byte-identical at its pinned path and checksum while a new r04 directly
  supersedes r03. r04 must not name r02 as its predecessor and must not alter,
  deserialize, or recover r02.

  Reviewer is authorized to publish exactly one Review successor
  `REV-GUP-PKT-PHB-117-119-bards-r04-r04` and exactly one matching Approved
  bundle successor `APPROVED-GUP-PKT-PHB-117-119-bards-r04-r04`. Both directly
  supersede their r03 counterparts, approve the unchanged Bards r04 GUP and
  unchanged 57-row declared component, and use a ready Integrator handoff.
  The r04 Review must reinstate r01's complete node decision set: eleven
  `approved` proposed-node decisions for the exact IDs in r03's prerequisite
  list, plus the separate `reuse_existing_identity` decision for
  `item_pipes_of_sewers` / `Pipes of the Sewers`. The latter is already a
  registered item under DEC-2026-0037 and is not a twelfth registration. The
  r04 bundle consequently declares eleven node operations and derives their
  approved labels, kinds, bases, and dependent edges from the r04 Review.

  This is one packaging-and-provenance repair, not a reconsideration of source
  assertions, node identity, operation partition, or canonical data. A Review
  that cannot reproduce those twelve exact decisions from the cited immutable
  r01 evidence must escalate its specific discrepancy rather than inventing a
  registration.

rationale:
  - >-
    The r03 direct link is the historical proof required for the r02 exception;
    ordinary same-lineage succession from r03 does not change that proof.
  - >-
    r01 contains eleven proposed registrations and one existing-identity reuse.
    Treating those twelve decisions as twelve registrations creates the false
    discrepancy reported by the escalation.
  - >-
    An ordinary approved bundle requires a Reviewer and bundle handoff that
    actually reaches Integrator. The prior Architect-ready handoffs served a
    now-completed admission-decision prerequisite and cannot govern r04.

