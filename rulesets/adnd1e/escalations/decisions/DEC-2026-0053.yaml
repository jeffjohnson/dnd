affected_contracts:
  - path: contracts/WORK_QUEUES.md
    change: add create-only publication preflight and integrity-breach handling
  - path: contracts/ARTIFACT_LIFECYCLE.md
    change: record treatment of an unrecoverable published checksum
affected_registries: []

migration_required: false
migration_scope:
  canonical_data_change: false
  registry_change: false
  profile_change: false
  source_interpretation_change: false
  artifact_lineage_change: >-
    The r01 integrity breach is recorded by this Decision only. The active
    successor migration lineage receives no new authority or state change.
  direct_implementation: >-
    Builder makes publication atomic with respect to pre-existing outputs and
    removes overwrite permission for durable artifact revisions. No GUP,
    Review, Approved bundle, Integration record, registry, or canonical data is
    rewritten as part of this implementation.

sequence:
  - step: 1
    owner: architect
    action: >-
      Publish this Decision, amend the create-only publication and integrity
      breach contracts, update Builder instructions, and close the escalation.
      Do not rewrite r01, its Review, r02, or any canonical artifact.
  - step: 2
    owner: builder
    action: >-
      Implement one shared preflight used by packet compilation, plan-migration,
      and plan-decision-migration before any output write. It must reject an
      existing requested artifact, validation report, or same-ID companion with
      no modified output, and it must remove the repository artifact
      allow-overwrite path. Add focused regression tests and publish
      IMP-DEC-2026-0053-r01.
  - step: 3
    owner: reviewer
    action: >-
      Independently review IMP-DEC-2026-0053-r01. Verify every publication
      entrypoint performs the all-output preflight before mutation, no durable
      overwrite override remains, and the regression tests demonstrate byte
      preservation on each refusal.

acceptance_tests:
  - >-
    WORK_QUEUES version 1.18 or later requires an all-output create-only
    preflight before durable artifact publication and treats a published
    checksum that no longer resolves as an Architect-recorded integrity breach,
    never as permission to substitute current bytes.
  - >-
    ARTIFACT_LIFECYCLE version 1.14 or later requires a published-checksum
    breach to retain the altered artifact and every consumer unchanged, record
    both checksums in an Architect Decision, and use a successor revision for
    all corrective work.
  - >-
    Packet compilation, plan-migration, and plan-decision-migration preflight
    all intended durable outputs before writing. An existing YAML, validation
    report, or same-ID component causes a refusal with every pre-existing and
    would-be output byte unchanged; no repository publication option permits an
    overwrite.
  - >-
    IMP-DEC-2026-0053-r01 pins this Decision's exact checksum, reports all
    direct acceptance tests as passed with current evidence, records passing
    focused publication-preflight tests, and is approval-ready for independent
    Reviewer verification.

acceptance_test_semantics:
  - acceptance_test_index: 1
    kind: versioned_contract_content
    contracts:
      - path: contracts/WORK_QUEUES.md
        minimum_version: '1.18'
        substantive_anchors:
          - create-only publication preflight
          - no repository artifact overwrite override
          - checksum no longer resolves
  - acceptance_test_index: 2
    kind: versioned_contract_content
    contracts:
      - path: contracts/ARTIFACT_LIFECYCLE.md
        minimum_version: '1.14'
        substantive_anchors:
          - published-checksum integrity breach
          - retain altered artifact and consumer unchanged
          - successor revision

post_implementation_requirements:
  - >-
    Reviewer independently approves the Decision Implementation Report through
    the normal implementation-review lifecycle. It must not alter r01 or its
    Review to make their checksums agree.
  - >-
    The DEC-2026-0050 migration successor lineage remains subject to its own
    active Review and Integration requirements. This integrity record neither
    expedites nor blocks it.

constitution_version_impact:
  changed: false
  retained: '1.8'
  rationale: >-
    This is publication provenance and workflow integrity governance, not a
    change to ontology, source meaning, assertion identity, or graph semantics.

governance_changelog:
  - >-
    WORK_QUEUES 1.18 and ARTIFACT_LIFECYCLE 1.14 make durable artifact
    publication create-only, require all outputs to be preflighted before a
    write, and define the immutable treatment of an unrecoverable checksum.
  - >-
    DEC-2026-0053 records the r01 checksum mismatch without claiming the
    current file is the Reviewer-hashed artifact or changing the successor
    migration lineage.

