supersedes: null
handoff:
  next_role: builder
  readiness: ready
  reason: >-
    Record the unrecoverable r01 checksum breach as immutable history and make
    every Builder artifact publisher create-only before it writes any output.
  blocking_ids: []

decision_date: '2026-08-20'
escalation_id: ESC-2026-08-20T07.18.44.612Z
decision_authoring_contract_version: '1.1'

question: >-
  How must the repository record a consumed GUP that was overwritten in place,
  leaving its Review's published checksum unrecoverable, and how must Builder
  publication paths prevent recurrence?

ruling: >-
  GUP-MIG-DEC-2026-0050-r01 is an integrity-breached historical artifact. Its
  Review pinned sha256:dd1f5994572b82f7c9f0a88c1e222d66e42767801a9d9fa7b5c3175c0ea2891f,
  but the current file resolves to
  sha256:71b4ca57de7f251e16e0632649b9fe0f0dfab05680e4d59dbe764659b6bc9df4.
  The original bytes are unrecoverable and must not be reconstructed, replaced,
  or presented as the reviewed artifact. The current r01 file and its r01
  Review remain immutable evidence of the breach, but neither may be cited as
  resolving the review's pinned GUP checksum.

  The later successor lineage remains separate. This Decision neither approves
  nor changes GUP-MIG-DEC-2026-0050-r02 or any later revision; each continues
  through its own normal Review and integration lifecycle.

  Every Builder publication entrypoint is create-only for durable artifact and
  report paths. Before it writes anything, it must preflight every output and
  existing same-ID companion path. If any such path exists, it must fail without
  modifying any output. There is no overwrite override for a repository artifact
  revision, consumed or otherwise; a correction always uses a new revision and
  an explicit supersedes link.

rationale:
  - >-
    A checksum is evidence of exact bytes, not a claim that later equivalent
    content is interchangeable. Substituting the current r01 bytes would hide
    the failed audit guarantee that its Reviewer depended on.
  - >-
    The original Review's substantive finding was a revision request, and a
    successor migration GUP already carries the correction. Recording the
    failed provenance does not authorize a no-op replay, canonical mutation, or
    revision of a historical Review.
  - >-
    The ordinary compiler's write_all path already detects an existing YAML by
    default, but its allow-overwrite escape hatch and both migration planners
    permit direct durable writes. A shared, all-output preflight closes the
    actual class of failure and prevents partial publication when a report or
    companion already exists.

