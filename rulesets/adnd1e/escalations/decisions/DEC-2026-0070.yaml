acceptance_tests:
  - >-
    With active DEC-2026-0068 at its pinned checksum, ready_queue validates r02
    as historical unreadable evidence without reading its content, emits exactly
    one historical_unreadable_review notice for it, has no fatal admission
    diagnostic, and offers APPROVED-GUP-PKT-PHB-117-119-bards-r04-r03 through
    ordinary verification.
  - >-
    The r03 manifest resolves its sole edges component from the declared r01
    component path and checksum even though its filename stem differs. Adding,
    removing, or renaming a colocated r03-stem CSV does not alter that result;
    a missing, outside-root, wrong-kind, or checksum-invalid declared component
    remains diagnostic and produces no ready Bards r03 bundle.
  - >-
    The exact r02 historical bundle is reported only as
    historical_unadmitted_bundle and never appears ready, rejected, integrated,
    or superseded. Altering its ID, path, checksum, or approving Review identity
    in the record or manifest; making the record absent or invalid; or changing
    the unreadable Review's parser state removes the exclusion and restores the
    ordinary fail-closed unreadable-Review diagnostic rather than admitting r02.
  - >-
    The existing Druid two-hop admission, every other unreadable Review, legacy
    manifestless bundle inference, decision-migration no-edge-CSV discovery,
    ordinary rejection handling, named-bundle dry runs, and rollback behavior
    remain unchanged. No arbitrary record field or self-delegating Decision is
    accepted.
  - >-
    `contracts/WORK_QUEUES.md` is Version 1.25 or later and retains the
    manifest-component-authority rule, manifestless-only filename inference,
    and exact validated historical-bundle exclusion rule.
  - >-
    IMP-DEC-2026-0070-r01 pins this Decision checksum, records passing focused
    and full applicable Integrator-suite evidence, reports every direct test as
    passed, and is approval-ready for independent Reviewer verification.

acceptance_test_semantics:
  - acceptance_test_index: 5
    kind: versioned_contract_content
    contracts:
      - path: contracts/WORK_QUEUES.md
        minimum_version: '1.25'
        substantive_anchors:
          - 'manifest''s `components` entries are the only authority for component discovery'
          - 'Filename-stem component discovery remains a legacy-only fallback'
          - 'historical_bundle whose approving Review is the record''s exact unreadable Review'

post_implementation_requirements:
  - >-
    After an Approved implementation Review consumes IMP-DEC-2026-0070-r01,
    Integrator may evaluate only the existing Bards r03 manifest through normal
    bundle verification and transaction handling. This Decision alone writes no
    canonical or registry data.
  - >-
    Any later historical-bundle exclusion requires an active, fully checksummed
    Architect repair record. Similarity of a filename, component, GUP, or Review
    does not authorize reuse.

