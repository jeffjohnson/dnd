question: >-
  How must Integrator discover the Bards r03 bundle's declared shared edge
  component while preventing the same discovery rule from offering the
  unreadable r02 predecessor bundle?

ruling: >-
  This reissues DEC-2026-0069 because its acceptance tests require normal r03
  bundle discovery but its ruling did not state the component-discovery and
  historical-bundle semantics needed to accomplish that result. The former
  Decision already named `bundles.py` in its exact diff; this correction changes
  its executable rule, not the prior Decision's immutable history.

  For every manifested Approved bundle, Integrator must obtain components only
  from the manifest's declared, checksummed `components` entries. A packet-update
  manifest's sole `edges` component is resolved from its declared
  repository-relative path, not the manifest filename stem. Manifestless legacy
  bundles alone retain stem-based inference. The Bards r03 manifest therefore
  uses the exact r01 edge component it declares; it does not need a copied
  r03-stem CSV.

  Integrator must independently validate DEC-2026-0068's active
  `review_direct_predecessor_repairs[0]` record through the pinned delegation
  below. That record permits the r02 Review to be omitted only as unreadable
  history. It also names exactly one historical bundle: after the record,
  historical-bundle manifest, manifest checksum, and manifest approving Review
  identity validate, exclude only APPROVED-GUP-PKT-PHB-117-119-bards-r04-r02
  from ready discovery and report it as historical unadmitted evidence. The
  r03 bundle remains eligible for ordinary bundle verification. No missing,
  stale, malformed, or merely similar record suppresses any bundle.

  Any other unreadable Review, a failed direct-predecessor prerequisite, an
  invalid declared component, or a malformed manifest remains fail-closed. The
  queue and every integrate form return exit code 2 without a traceback, offer
  no ready bundles, and begin neither dry run nor canonical transaction.

rationale:
  - >-
    The Approved manifest already declares the component path and checksum that
    verification trusts. Discovering a different component by filename makes a
    derived convention override the artifact's explicit provenance.
  - >-
    r02 and r03 intentionally name the same component. A generic path-based
    discovery change without exact historical-bundle exclusion would expose an
    unreviewable r02 bundle as ready, defeating the unreadable-Review boundary.
  - >-
    The record-based exclusion is bounded by its Decision-pinned IDs, paths,
    checksums, and approving Review identity. It does not establish a general
    category of silently ignored approved bundles.

