decision_authoring_contract_version: '1.1'

question: >-
  May Architect decide an escalation package that cannot itself be parsed as
  YAML?

ruling: >-
  No. ESC-2026-08-28T00.41.24.104Z is returned without a substantive ruling.
  Its unindented continuation following the folded `question` scalar prevents a
  YAML parser from establishing the package's question, evidence, or claimed
  checksums. Architect must not infer fields from raw text or repair the
  published package in place. Preserve its bytes as returned history and submit
  a new, parseable package with a newly allocated timestamped ID and
  `prior_escalation_id: ESC-2026-08-28T00.41.24.104Z`. The replacement must
  recollect every current artifact checksum rather than copy the malformed
  package's stale claims.

rationale:
  - >-
    An escalation package is the bounded evidence an Architect Decision relies
    on. A parser failure means neither its structure nor any selected field is
    trustworthy evidence.
  - >-
    The live Bards r02 Review hashes to a value different from the value printed
    in the unreadable package. That mismatch confirms that partial recovery
    would risk deciding against stale input.
  - >-
    Returned state preserves the original, invalid submission without allowing
    an unreadable package to stay in the Architect queue or resolve a blocker.

resubmission_requirements:
  - >-
    Publish a parseable YAML escalation under a new
    ESC-YYYY-MM-DDTHH.mm.ss.fffZ identifier and record
    `prior_escalation_id: ESC-2026-08-28T00.41.24.104Z`.
  - >-
    Recompute and provide exact SHA-256 checksums for every cited current
    Review, Approved bundle, GUP, rejection record, and any proposed successor.
  - >-
    State the parser observation as valid YAML and retain the complete options,
    local-impact statement, and recommended immutable-lineage treatment.

