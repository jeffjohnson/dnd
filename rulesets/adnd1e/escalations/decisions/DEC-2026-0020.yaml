question: >-
  Which fields define one production-edge assertion, and may tooling choose that
  identity when the constitution is silent?

ruling: >-
  Adopt the normalized five-field assertion key already used by the AD&D 1e
  Builder: source_id, edge_type, target_id, aspect, and condition. An exact key
  match is one assertion and may appear only once in production. A shared
  source, type, and target with a genuinely different mechanical facet or
  condition is a near match, not automatically a duplicate, and remains subject
  to independent Reviewer judgment. Citation and review fields do not create
  identity. ALTERNATIVE_TO is symmetric, so its endpoints are unordered for key
  comparison. Tooling implements the ruleset constitution's key; it does not
  choose or widen the key independently.

assertion_identity_contract:
  fields:
    - source_id
    - edge_type
    - target_id
    - aspect
    - condition
  normalization:
    ids: canonical IDs compared directly
    edge_type: controlled value compared directly
    aspect_and_condition: >-
      Compare case-insensitively after replacing non-alphanumeric separator runs
      with one space and trimming surrounding whitespace.
    symmetric_type:
      edge_type: ALTERNATIVE_TO
      rule: Sort the two normalized endpoint IDs before comparison.
    directed_types: Endpoint order remains significant.
  duplicate_rule: >-
    Two rows equal under the normalized key are one assertion. Do not insert a
    second production row; preserve additional source loci in provenance.
  near_match_rule: >-
    Rows sharing source_id, edge_type, and target_id but differing in aspect or
    condition may coexist only when Reviewer confirms genuinely distinct,
    source-supported mechanical facets or activation conditions. Paraphrase
    alone does not establish distinct identity.
  fields_excluded_from_identity:
    - source_label
    - target_label
    - polarity
    - polarity_basis
    - book
    - page
    - section
    - evidence
    - pass
    - status
    - supersession_basis
    - general_rule_id
    - review_flag
  excluded_field_conflicts: >-
    Resolve a conflict in an excluded field on the existing assertion. Do not
    retain conflicting copies as separate edges.

rationale:
  - >-
    Aspect and condition identify the mechanical facet and activation boundary.
    Collapsing identity to source, type, and target would merge independent
    dependencies and discard information required for impact analysis.
  - >-
    The supplied corpus measurement finds zero collisions under the normalized
    five-field key, while a three-field key would place 61 approved rows in 55
    collision groups and require a destructive migration.
  - >-
    Citation cannot be identity because the same assertion may be restated by
    several books. Constitution section 5 already requires one edge plus an
    additional provenance locus in that case.
  - >-
    Polarity, labels, and evidence describe or review an assertion; allowing them
    into identity would preserve field disagreements as duplicate rows instead
    of resolving them.
  - >-
    Case, punctuation, and separator differences carry no mechanical meaning.
    Canonical normalization prevents cosmetic text changes from evading
    duplicate detection.
  - >-
    ALTERNATIVE_TO is the only symmetric edge type. Reversing its endpoints does
    not create a second assertion, matching the current Builder implementation.
  - >-
    This ruling makes existing behavior governed and stable. It does not use the
    two packet candidates as precedent to pre-approve their source readings.

