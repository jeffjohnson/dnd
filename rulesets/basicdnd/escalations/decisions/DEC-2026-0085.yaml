  - path: books/basicdnd/rc/packets/incoming/RC_pages_1-5.md
    original_decision_checksum: sha256:1ad0585149003975de0d11b695e0fc9db4121e48bf02b5a150cfcf88322cba12
    observed_present: false
    disposition: withdrawn_before_claim
  - path: books/basicdnd/rc/packets/incoming/RC_pages_6-12.md
    original_decision_checksum: sha256:456dde9bd30df37f7311fc9f28a114f1f7351760e4579d313050ec847732d82e
    observed_present: false
    disposition: withdrawn_before_claim
absence_observation:
  observed_on: '2026-09-20'
  scope: books/basicdnd/rc
  findings:
    - Both exact incoming paths are absent; incoming contains only .gitkeep.
    - Claimed and completed stores contain only .gitkeep.
    - GUR, GUP, Review, Approved and Integrated stores contain only .gitkeep.
  checksum_limit: >-
    The input checksums identify DEC-2026-0080's original historical evidence.
    They are not a fresh checksum of absent bytes or a claim that those original
    bytes were the final unclaimed revision before withdrawal.
retired_obligations:
  - decision_id: DEC-2026-0080
    locator: post_implementation_requirements item 1 (one-based)
    disposition: retired_for_the_named_withdrawn_input
    scope: The steward reissue of RC_pages_1-5.md before its former planned claim.
  - decision_id: DEC-2026-0080
    locator: sequence step 4; post_implementation_requirements item 2 (one-based); related Analyst follow-up
    disposition: retired_for_both_named_withdrawn_inputs
    scope: The assignment to claim both old RC inputs and produce their GURs.
preserved_requirements:
  - DEC-2026-0080 acceptance tests 1 through 5 are neither waived nor reinterpreted.
  - The independent basicdnd constitution, schemas, registries and rc source identity remain registered.
  - Builder implementation evidence and Reviewer approval remain necessary before ordinary Basic D&D compilation.
  - First-integration readiness remains required; no canonical baseline is created.
  - Current versioned-contract-content and exact checksum rules remain in force.
  - SOURCE_MARKDOWN intake requirements still govern any new or reintroduced material.
test_disposition:
  path: tooling/builder/tests/test_pagemarkers.py
  subject: TestStewardFrontmatter.test_the_live_incoming_packets_carry_frontmatter_and_no_orphan_prose
  permitted: >-
    The visible skip already reported in IMP-DEC-2026-0080-r04 is allowed for
    this supplementary live-input probe when no matching incoming RC source is
    present. Report it as skipped/not exercised, never as a passed source read.
    The unchanged assertions must execute when matching inputs are present.
  limits:
    - Do not catch parser or assertion failures and turn them into missing-input skips.
    - Synthetic frontmatter, malformed-marker, class-marker and ruleset-admission tests remain mandatory.
    - This is not a blanket waiver of missing claimed source, implementation evidence or checksum failures.
    - No further code change or report reissue is required solely to record this governance ruling.
future_intake:
  owner: repository_source_steward
  rule: >-
    Basic D&D is awaiting future source, not decommissioned. If the steward
    supplies replacement RC packets, treat them as fresh intake with current
    bytes, metadata, scope and checksums. Old filenames, old checksum pins and
    the old two-packet split impose no replacement requirement. Analyst may
    claim conforming new input under ordinary authority without a second
    withdrawal ruling; a new edition/source identity still needs registration.
  prohibitions:
    - No worker recreates withdrawn rulebook prose from summaries, test fixtures or memory.
    - No fake GUR, GUP, completed packet, Review or Integration records retirement.
    - No published source or artifact is deleted or rewritten under this Decision.
rationale:
  - Unclaimed source availability belongs to the steward, not to a deterministic compiler's correctness.
  - DEC-2026-0080 deliberately separated implementation acceptance from downstream source intake.
  - Historical checksummed evidence can remain historical without requiring withdrawn inputs to return.
  - Preserving the tooling Review prevents a withdrawal ruling from becoming an unearned approval.
migration_required: false
migration_scope: >-
  No graph, registry, source, schema, shared contract, code, test or published
  artifact changes. No queue semantics change and no historical lineage retirement
  record are required: these inputs never entered artifact lineage.
affected_contracts: []
affected_registries: []
constitution_version_impact: None; Basic D&D remains at 1.0.
acceptance_tests:
  - This Decision schema-validates and pins the unchanged original Decision and named current evidence.
  - The two exact source paths are absent and the named RC packet/artifact stores have no claimed descendants at ruling time.
  - Only the named source-reissue and extraction obligations are retired; all five original implementation acceptance tests and ordinary Review remain required.
  - The optional live probe reports a visible skip when no inputs exist; deterministic frontmatter and page-class tests still run and pass.
  - No existing file is changed, no replacement source/artifact is fabricated, and no additional Builder implementation job is created by this ruling.
sequence:
  - step: 1
    owner: architect
    action: Publish and validate this bounded supplemental ruling; preserve all original Decision and implementation bytes.
  - step: 2
    owner: reviewer
    action: >-
      Continue the existing IMP-DEC-2026-0080-r04 review, or its actual active
      successor if one is published. Read this ruling as withdrawal disposition,
      not implementation approval. Independently check all five original
      acceptance tests, exact current evidence and the permitted test skip.
      Publish the ordinary implementation Review; name genuine remaining
      corrections rather than requesting restoration of withdrawn source.
follow_up_owners:
  reviewer:
    - Existing DEC-2026-0080 implementation Review only; no new IMP or Review for DEC-2026-0085 is required.
  analyst:
    - No work remains on the two withdrawn inputs; await fresh conforming steward intake.
coordination_constraints:
  - >-
    Prioritize the existing 0080 Review before DEC-2026-0084 Builder edits to
    the same page-marker files. Finishing the ready review first avoids
    needlessly staling the current unapproved implementation evidence.
  - >-
    DEC-2026-0084's prospective page-class extension and later Architect contract
    activation remain separate work. This ruling does not activate that amendment
    or relax any checksum/contract anchor to accommodate it.
  - >-
    The source withdrawal, contract checksum policy question, and empty retired
    role-directory observation in r04 are distinct. Only withdrawal is ruled on
    here; no shared checksum-policy change or unrelated cleanup is authorized.
changelog:
  - Retired the exact withdrawn RC reissue and extraction obligations without retiring the ruleset.
  - Kept implementation acceptance and independent Review intact; permitted the visible optional live-input skip.
  - Assigned no new implementation and preserved all existing artifacts and checksum rules.
exact_diff:
  rulesets/basicdnd/escalations/decisions/DEC-2026-0085.yaml:
    - Publish the bounded supplemental withdrawal ruling; no other durable file changes.
exact_diff_ownership:
  - {path: rulesets/basicdnd/escalations/decisions/DEC-2026-0085.yaml, owner: architect, sequence_step: 1}
