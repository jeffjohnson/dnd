decision_date: '2026-09-20'
escalation_id: null
request_origin:
  type: repository_owner_directive
  summary: Rule on the withdrawn DEC-2026-0080 inputs.
question: >-
  What remains of DEC-2026-0080 when its two unclaimed Rules Cyclopedia
  source inputs have been withdrawn, and may the tooling implementation be
  reviewed without recreating those inputs?
ruling: >-
  Retire the named-input steward reissue obligation and Analyst extraction
  assignment for the two withdrawn, never-claimed inputs. They are withdrawn,
  not completed, consumed, approved, integrated, or relocated. No worker must
  recreate them, seek their restoration to satisfy a tooling test, or publish
  placeholder artifacts. DEC-2026-0080's independent ruleset bootstrap,
  implementation authorization, all five acceptance tests, and independent
  implementation Review remain active and unchanged. Current implementation
  evidence can be reviewed without the withdrawn live-input readings. The
  optional live-input test may visibly skip when its input set is absent;
  deterministic behavior tests and ordinary checksum/schema checks remain
  mandatory. This ruling is not approval of IMP-DEC-2026-0080-r04.
supplements_decision:
  id: DEC-2026-0080
  path: rulesets/basicdnd/escalations/decisions/DEC-2026-0080.yaml
  checksum: sha256:b4eb6d27766119ccceefee17a651e8923b813dbe2b8366232d74d3919f3d7108
  relationship: bounded_downstream_input_disposition_not_lineage_supersession
  reason: >-
    Superseding the complete Decision would disturb a still-valid implementation
    lineage. This additive ruling disposes only of the exact withdrawn-input
    obligations listed below, leaving the original bytes and authority intact.
handoff:
  next_role: none
  readiness: terminal
  reason: >-
    The direct Architect ruling is complete on publication. It creates no
    implementation task or IMP for DEC-2026-0085. Reviewer already owns the
    existing IMP-DEC-2026-0080-r04 review; that separate job is not consumed here.
  blocking_ids: []
evidence:
  - id: IMP-DEC-2026-0080-r04
    path: rulesets/basicdnd/decision-implementations/IMP-DEC-2026-0080-r04.yaml
    checksum: sha256:6da1e62f79df7381b66325aea315f357ccac15817a4c23c6d8f1db38a4a75edd
    relevance: decision_pinned_inputs_absent and defects_for_the_architect identify this question.
  - path: build/reports/IMP-DEC-2026-0080-r04.validation.json
    checksum: sha256:867f777a1c5675bf70b493d68b8e5325cfb0dfb921f88a02902174e246943732
    relevance: Companion records absent source and the visible live-test skip.
  - id: REV-IMP-DEC-2026-0080-r01-r01
    path: rulesets/basicdnd/decision-implementation-reviews/REV-IMP-DEC-2026-0080-r01-r01.yaml
    checksum: sha256:73e36f10e7e931c5af844b42c9854b17118020d8ad2a62874283271ef22032a1
    relevance: Explicitly permits omitting supplementary live-input outcomes that are not acceptance requirements.
