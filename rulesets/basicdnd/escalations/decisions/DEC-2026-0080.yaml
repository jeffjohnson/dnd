question: >-
  What minimum independent governance and tooling must exist before Basic D&D
  Rules Cyclopedia packets are claimed, and how does the repository admit the
  steward's Pandoc frontmatter and full-page-artwork page classification?

ruling: >-
  basicdnd is a separate ruleset and graph. It does not inherit, share, or
  merge the adnd1e ontology, registries, canonical data, or artifact lineages.
  Similar prefixes and edge vocabulary are deliberately parallel vocabulary,
  not cross-ruleset identity. The Rules Cyclopedia is the initial book rc in
  the basicdnd system, with source_id rc-steward-intake and citation code RC.

  Basic D&D character entries named Dwarf, Elf, and Halfling in the Rules
  Cyclopedia are character classes: use class_dwarf, class_elf, and
  class_halfling when source-supported. Do not mint race_ identities for those
  classes or establish a playable-race registry from this packet. Keep the
  race_ prefix reserved for a future source that actually defines a race axis.

  A source ability score directly modifies or gates each mechanic the source
  states it affects. The fact that the source prints a unified adjustment table
  does not itself create a table node or a new aggregate adjustment mechanic.
  A separately addressable table node remains available only when later source
  text makes the table itself a rule input. Prime requisite uses two ordinary
  relations when both are stated: an ability GATES the class under the class's
  requirement, and that ability MODIFIES the experience mechanic under the
  source's class-specific condition. Compound requirements remain explicit
  conditions rather than synthetic aggregate identities.

  Attack-roll tables and THAC0 are two presentations of the same attack-roll
  mechanic. Represent one canonical mechanic, normally cbt_attack_roll; record
  the alternative presentation as a non-edge observation unless later source
  gives one presentation independent mechanical consequences. basicdnd may use
  sys_alignment despite a differently shaped adnd1e alignment system because
  identities are ruleset-local. Alignment-language and retainer mechanics use
  ordinary rule_ and hench_ identities only when the source supports an
  impact-bearing relationship. Dice notation is a reading convention, not a
  graph node or general rule, unless later source supplies a target-specific
  dependency.

  SOURCE_MARKDOWN 1.5 admits Pandoc YAML frontmatter as informational steward
  intake metadata only. It is not graph content, source-read evidence, a packet
  identity, or authority over packet.yaml; the claimed packet manifest wins any
  conflict. The only initial page class is full-page-artwork. It denotes a page
  inside the packet span that the steward declares contains no graph-
  constitutable content. It creates no graph data and must be carried as intake
  composition information at claim. A class-bearing marker must live on an
  attribute-bearing Pandoc block: a native heading or a fenced Div. Do not
  manufacture a heading for artwork. The Rules Cyclopedia page-1 input must be
  reissued using the fenced-Div form before claim; the standalone bare token
  cannot carry a Pandoc class.

  The repository retains books/<ruleset-id>/<book-id>/ as the durable workspace
  namespace. It is not renamed to systems/: published artifacts name those
  paths in checksummed provenance and a physical rename would invalidate that
  history. In repository terminology, the first path component is the system
  or ruleset and each child workspace is a book. A future namespace migration
  requires a separate Decision that provides an immutable-path compatibility
  strategy; this Decision authorizes none.

rationale:
  - >-
    The Rules Cyclopedia itself distinguishes Basic D&D from AD&D through an
    explicit conversion appendix, while its class, alignment, and ability
    structures differ materially. A parallel ruleset prevents incompatible
    identities from coexisting in one graph.
  - >-
    An empty basicdnd registry and canonical future avoid treating legacy AD&D
    rows as a baseline for the first Basic D&D packet. The standard GUR, GUP,
    Review, Approved-bundle, and Integration lifecycle remains unchanged.
  - >-
    Pandoc consumes YAML frontmatter before blocks and preserves attributes on
    headings and Divs. The fenced Div is the source-faithful representation for
    a page that has artwork but no heading. The bare supplied token is not an
    AST attribute and cannot be made authoritative by raw-text parsing.
  - >-
    `books/` is present in immutable packet, GUR, GUP, Review, bundle,
    integration, and Decision provenance. Renaming it now has greater blast
    radius than its terminology benefit and is not required to initialize a new
    system.

