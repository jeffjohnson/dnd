migration_required: false
migration_scope:
  canonical_data_change: false
  registry_change: true
  source_interpretation_change: false
  artifact_lineage_change: none
  direct_implementation: >-
    Architect initializes only empty basicdnd governance, registries, schemas,
    and book identity. Builder generalizes its compiler and page-marker tooling
    through a Decision Implementation Report and independent Review. No
    existing canonical graph or published artifact is migrated.

acceptance_tests:
  - >-
    The basicdnd context verifier succeeds for Architect and Analyst scope
    basicdnd / rc after the governance bootstrap, and books/basicdnd/rc/book.yaml
    declares basicdnd, rc, and rc-steward-intake.
  - >-
    The basicdnd constitution has its own version 1.0 prefix and edge tables,
    lists class_dwarf, class_elf, and class_halfling as class-only source
    identities, and declares no inherited adnd1e registry or canonical input.
  - >-
    SOURCE_MARKDOWN 1.5 accepts Pandoc YAML frontmatter as informational only,
    gives packet.yaml precedence, accepts full-page-artwork only on a heading
    or fenced Div marker, and rejects the bare standalone marker form.
  - >-
    Builder proves a basicdnd / rc synthetic GUR is accepted by its registered
    ruleset configuration while an unknown ruleset is rejected. The source
    linter proves YAML frontmatter is not unattributed content, a fenced Div
    full-page-artwork marker resolves its page and class, and malformed bare
    marker text fails without raw-text false positives for a valid attributed
    marker.
  - >-
    The generic Builder change passes its focused tests and complete Builder
    suite, and its Decision Implementation Report records this Decision's
    checksum plus current SOURCE_MARKDOWN versioned-contract evidence.

acceptance_test_semantics:
  - acceptance_test_index: 3
    kind: versioned_contract_content
    contracts:
      - path: contracts/SOURCE_MARKDOWN.md
        minimum_version: '1.5'
        substantive_anchors:
          - Pandoc YAML frontmatter is informational steward intake metadata only.
          - packet.yaml governs identity and page metadata when frontmatter conflicts.
          - full-page-artwork is the only initial page class.
          - class-bearing page markers require a heading or fenced Div attribute block.
  - acceptance_test_index: 4
    kind: versioned_contract_content
    contracts:
      - path: contracts/SOURCE_MARKDOWN.md
        minimum_version: '1.5'
        substantive_anchors:
          - Pandoc YAML frontmatter is informational steward intake metadata only.
          - full-page-artwork is the only initial page class.
          - class-bearing page markers require a heading or fenced Div attribute block.

post_implementation_requirements:
  - >-
    The source steward reissues RC_pages_1-5.md before claim, replacing the
    bare `{#p1 .full-page-artwork}` paragraph with an empty fenced Div carrying
    `{#p1 .full-page-artwork}`. This unclaimed input is not a published artifact
    and no pipeline role authors its source text.
  - >-
    After Architect bootstrap and steward reissue, Analyst may claim both RC
    packets and publish ordinary basicdnd GURs. Builder may compile them only
    after the approved direct implementation required by this Decision.
  - >-
    The first basicdnd Approved bundle will require a separate Integrator
    readiness assessment before integration; this Decision creates no
    canonical baseline and assigns no Integrator write.

constitution_version_impact:
  changed: true
  new_ruleset_version: '1.0'
  adnd1e_retained: '1.8'
  rationale: >-
    basicdnd begins with an independent constitution. No AD&D constitution or
    graph data is changed.

governance_changelog:
  - >-
    DEC-2026-0080 initializes basicdnd as an independent Basic D&D graph,
    admits informational Pandoc frontmatter and full-page-artwork metadata, and
    preserves books/ as the immutable workspace namespace.

sequence:
  - step: 1
    owner: architect
    action: >-
      Publish this Decision, move its escalation to decided state, create the
      listed basicdnd governance and schema bootstrap, correct the RC book
      manifest, and amend SOURCE_MARKDOWN to 1.5.
  - step: 2
    owner: builder
    action: >-
      Generalize registered-ruleset compiler admission and implement Pandoc-AST
      class-bearing marker/linter support. Publish IMP-DEC-2026-0080-r01 with
      focused and full-suite evidence.
  - step: 3
    owner: reviewer
    action: >-
      Independently review the Builder report, including the SOURCE_MARKDOWN
      1.5 content anchors and every Decision acceptance test.
  - step: 4
    owner: analyst
    action: >-
      After the source steward reissues the unclaimed page-1-to-5 input and
      Architect bootstrap is present, claim the two RC packets and publish
      ordinary GURs under basicdnd Constitution 1.0.

