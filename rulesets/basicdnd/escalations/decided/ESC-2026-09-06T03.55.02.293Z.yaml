handoff:
  next_role: architect
  readiness: ready
  reason: >-
    The queue scanner reports two ready Analyst jobs in books/basicdnd/rc/packets/incoming/, but the
    ruleset basicdnd does not exist. There is no constitution, no ruleset.yaml, no registries and no
    schemas, so the Analyst context verifier refuses to start, no source identity can be named, no
    node prefix can be claimed, and no GUR schema exists to validate against. Separately, the
    repository source steward has declared a standing intake format for all future packet markdown
    that contracts/SOURCE_MARKDOWN.md 1.4 does not currently admit. Both are Architect-owned.
  blocking_ids: []

envelope_note: >-
  constitution_version is recorded as the literal string none because rulesets/basicdnd/governance/
  constitution.md does not exist and the artifact envelope requires a non-empty string. The Analyst
  will not invent a version number for a constitution that has not been authored. Establishing the
  real value is part of what this escalation requests. source_id is omitted for the same reason:
  rulesets/basicdnd/registries/sources.yaml does not exist, so no source identity is registered and
  the Analyst may not mint one.

question: >-
  Two questions. First, what governance must exist before an Analyst may claim a basicdnd packet,
  and how is the basicdnd ontology related to the adnd1e ontology it resembles but is not compatible
  with? Second, does contracts/SOURCE_MARKDOWN.md admit the repository source steward's standing
  intake format, specifically a YAML metadata block and a page marker carrying a semantic class
  attribute, and if so with what exact spelling and what class vocabulary?

originating_work:
  incoming_files:
    - books/basicdnd/rc/packets/incoming/RC_pages_1-5.md
    - books/basicdnd/rc/packets/incoming/RC_pages_6-12.md
  packet_ids: none allocated; claiming is blocked by this escalation
  gur_ids: none
  gup_ids: none
  review_ids: none

blocking_findings:
  - id: BLK-01
    subject: the ruleset basicdnd is not initialized
    severity: blocks all Analyst work in this namespace
    detail: >-
      contracts/ROLE_CONTEXT_MANIFEST.yaml lists the Analyst stable authority set as
      rulesets/{ruleset}/governance/constitution.md, rulesets/{ruleset}/ruleset.yaml,
      rulesets/{ruleset}/registries/*.yaml, rulesets/{ruleset}/registries/*.json,
      schemas/{ruleset}/graph/gur.schema.json and schemas/{ruleset}/books/{book}/*.json. For
      ruleset basicdnd and book rc, every one of those paths is absent. rulesets/basicdnd/ does not
      exist at all and schemas/basicdnd/ does not exist at all.
    observed_command: >-
      python tooling/common/role_context.py verify --role analyst --ruleset basicdnd --book rc
      --session-id <id>
    observed_output: >-
      role context verification failed: pattern 'rulesets/{ruleset}/governance/constitution.md'
      names rulesets/basicdnd/governance/constitution.md, which does not exist
    consequence: >-
      Without the constitution there is no section 3.1 prefix table, so no candidate node ID can be
      formed; no section 4 edge vocabulary, so no candidate edge type can be chosen; and no
      constitution_version for a packet manifest or GUR to declare. Without the registries there is
      no registered source_id and no citation_code. Without schemas/basicdnd/graph/gur.schema.json
      there is no schema to validate a GUR against. The Analyst is prohibited from minting a prefix
      or adding a registry entry, so none of this is self-serviceable.

  - id: BLK-02
    subject: books/basicdnd/rc/book.yaml declares the wrong ruleset and book
    severity: blocks identity resolution independently of BLK-01
    detail: >-
      The file reads ruleset_id adnd1e, book_id dmg, title Dungeon Masters Guide, default_source_id
      dmg-legacy-unspecified. It is byte-for-byte the shape of an adnd1e book manifest and appears
      to be an uncorrected copy. The only manifest that exists for this workspace therefore asserts
      that books/basicdnd/rc/ is the AD&D 1e Dungeon Masters Guide.
    contract_basis: >-
      agents/analyst/INSTRUCTIONS.md Runtime scope requires the Analyst to resolve ruleset_id,
      book_id, source_id and packet_id from repository manifests and states never infer these from
      conversation history. The Prohibited actions list repeats do not use conversation history as
      evidence. The repository manifest and the directory path disagree, and the Analyst may not
      break the tie from chat.
    consequence: >-
      Even if BLK-01 were resolved, a packet manifest written now would have to declare an identity
      the book manifest contradicts. This escalation declares ruleset_id basicdnd and book_id rc
      from the directory path only, because that is the sole self-consistent reading available, and
      records the conflict rather than silently preferring it.
    note: >-
      REPOSITORY_STRUCTURE.md describes book.yaml as stable work identity and places the book
      workspace below ruleset governance in the authority hierarchy. The Analyst has not edited it.

  - id: BLK-03
    subject: the Builder compiler hard-rejects any ruleset other than adnd1e
    severity: blocks the downstream pipeline even after governance exists
    detail: >-
      tooling/builder/src/adnd1e_builder/compiler.py line 357 tests whether the GUR ruleset_id is in
      the tuple containing only None and the literal adnd1e, and otherwise appends an error-severity
      finding named gur_wrong_ruleset with the message that the ruleset_id is not adnd1e and that
      SCOPE_AND_IDENTITY forbids silently moving artifacts between rulesets.
    consequence: >-
      A schema-valid basicdnd GUR would fail Builder compilation on ruleset identity alone. Creating
      the governance files is therefore necessary but not sufficient; a second ruleset requires a
      Builder tooling change, which is a Decision with migration_required rather than a governance
      file addition. Raising it now avoids the Analyst producing a GUR that cannot be compiled.
    related_observation: >-
      The Builder and Integrator packages are themselves named adnd1e_builder and adnd1e_integrator,
      and their CLI ruleset arguments default to adnd1e. Those defaults are overridable and are not
      by themselves blocking; the line 357 gate is not overridable.

steward_format_declaration:
  declared_by: repository source steward
  declared_on: '2026-09-06'
  statement: >-
    The steward states that all markdown supplied to this repository will follow the structure of
    the two RC incoming files: a metadata block at the top, and the attribute .full-page-artwork
    used to indicate a page that is full-page artwork. The steward further directed that new formats
    be escalated to the Architect.
  authority_basis: >-
    contracts/SOURCE_MARKDOWN.md External Source Intake makes the repository source steward
    responsible for lawful source acquisition and intake and for supplying conforming incoming
    packets. Recording a steward declaration as steward authority follows the established pattern in
    which the PHB 108 marker_note and the DEC-2026-0079 coverage exception both record a dated
    steward confirmation.
  evidence_status: >-
    This is a declaration about intake format, not source-read evidence about any rulebook page. It
    is recorded here so the format question rests on a durable artifact rather than on chat, in
    keeping with the Analyst prohibition on using conversation history as evidence.

source_format_questions:
  preamble: >-
    Because the steward has declared this a standing format rather than a one-off, the two elements
    below are no longer packet defects to be returned for re-packetization. They are a conflict
    between a durable intake convention and contracts/SOURCE_MARKDOWN.md 1.4, which only the
    Architect can resolve. Each finding below was tested against the real Pandoc AST and the real
    linter rather than reasoned about, and the exact spelling probed is quoted with each result
    below, so the Architect can repeat every test from this artifact alone.
  items:
    - id: FMT-01
      subject: YAML metadata block at the top of every packet source
      observed: >-
        Both RC files open with a YAML block delimited by three hyphens. RC_pages_1-5.md declares
        source, series, product_line and pages. RC_pages_6-12.md additionally declares chapter and
        chapter_title.
      test_performed: >-
        pandoc -f markdown -t json on RC_pages_6-12.md. The meta object carries keys chapter,
        chapter_title, pages, product_line, series and source, and the first entry in blocks is the
        Chapter 1 Header, not the metadata.
      finding: >-
        Fully Pandoc-compatible. The block is consumed as document metadata and never reaches the
        block stream, so it cannot become unattributed leading content and cannot disturb page
        marker resolution. RC_pages_6-12.md passes the marker linter cleanly with the block present.
      contract_status: >-
        contracts/SOURCE_MARKDOWN.md 1.4 neither permits nor forbids it. The Scope section requires
        Pandoc Markdown and page markers; a metadata block is legal Pandoc Markdown, so nothing is
        violated. The gap is that the contract does not say the block exists, and says nothing about
        its authority.
      question: >-
        Should the contract acknowledge the metadata block, and what is its authority relative to
        packet.yaml? Packet manifests already carry page_start, page_end and source identity, and
        the frontmatter now carries pages and source independently. If the two ever disagree, which
        governs? The Analyst recommends the manifest govern and the frontmatter be treated as steward
        intake provenance, matching the existing rule that the claimed packet is authoritative, but
        the precedence must be stated rather than assumed.
      recommended_disposition: >-
        Admit it explicitly, define the key set, and state manifest precedence. This costs no parser
        change and no linter change.

    - id: FMT-02
      subject: a page marker carrying a semantic class attribute
      observed: >-
        RC_pages_1-5.md line 7 is the standalone token {#p1 .full-page-artwork}, marking printed
        page 1 as full-page artwork.
      contract_conflict: >-
        contracts/SOURCE_MARKDOWN.md 1.4 Page Marker defines the marker as the exact form {#pN} and
        reserves identifiers matching pN for page markers. A class suffix is outside that form.
      tests_performed:
        - spelling: standalone paragraph, as supplied
          result: >-
            Fails. The Pandoc AST shows a Para of two Str nodes, the first {#p1 and the second
            .full-page-artwork}. Pandoc does not attach attributes to a bare paragraph, so no
            attribute exists and no marker is recognised. Page 1 receives no assignment and the
            linter reports pages resolved 2-5 with page 1 lost.
        - spelling: attached to a heading, for example # Full-Page Artwork {#p1 .full-page-artwork}
          result: >-
            The marker RESOLVES CORRECTLY. Pandoc produces a Header whose attribute is the
            identifier p1 with the class full-page-artwork, and pagemarkers._marker_from_attr already
            reads a pN heading identifier as a page marker, which the contract itself blesses by
            saying Pandoc may represent a marker at the end of a heading as the heading identifier.
            A probe file resolved pages 1-2. The class survives intact in the AST, where tooling
            could read it as structured data.
        - spelling: fenced div, for example three colons then {#p1 .full-page-artwork}
          result: >-
            Fails. pagemarkers._walk recurses into a Div's children but never inspects the Div's own
            attribute, so the marker is lost. A probe file resolved only page 2. This spelling would
            require a parser change to support.
        - spelling: plain {#p1} with the artwork fact moved to the packet manifest
          result: Passes cleanly. Probe file resolved pages 1-2 with no findings.
      linter_defect_discovered: >-
        For the heading spelling the linter reports FAIL even though page attribution succeeded. The
        cause is that cli.lint_source scans the raw file text with the MALFORMED regex independently
        of the AST, so it matches the literal string {#p1 .full-page-artwork} and reports a malformed
        marker although the parser resolved it. This is a false positive against the AST result and
        is worth correcting whatever is decided about the format, because today a conforming heading
        marker with any attribute is reported as malformed.
      significance: >-
        This is not only a spelling question. DEC-2026-0079 closed PHB 121 as an exact singleton
        coverage exception and explicitly deferred a reusable coverage-record class until a second
        qualifying case was escalated, requiring that the second case be escalated before anyone
        builds a shared ledger. The steward has now proposed a general, machine-readable convention
        for exactly that problem, expressed in the source itself rather than in a separate ledger. If
        the Architect admits it, .full-page-artwork becomes the reusable no-graph-content mechanism
        DEC-2026-0079 anticipated, and it is readable directly from the Pandoc AST.
      question: >-
        Does the contract admit a class-bearing page marker; if so must it attach to a block that can
        carry attributes, which today means a heading; what is the permitted class vocabulary, since
        an open vocabulary would let source files invent semantics no contract defines; and does a
        class-marked page still require a corresponding packet manifest entry or does the marker
        alone suffice?

  options_for_fmt_02:
    - id: FMTOPT-1
      summary: keep {#pN} exact and record artwork in the packet manifest
      detail: >-
        The steward writes plain {#p1}; the artwork fact goes in packet.yaml page_composition and
        marker_note at claim, which is the PHB 108 precedent that DEC-2026-0079 reaffirmed as the
        correct home for an in-span no-content page.
      cost: >-
        The steward must change a declared standing format, and the fact stays human-readable prose
        in a manifest rather than machine-readable data.
      benefit: No contract change, no parser change, no linter change; precedent already exists.

    - id: FMTOPT-2
      summary: admit a class-bearing marker on an attribute-carrying block, and fix the linter
      detail: >-
        Amend SOURCE_MARKDOWN to permit {#pN .class} where the marker attaches to a heading, define
        the class vocabulary starting with full-page-artwork, and change cli.lint_source so the
        malformed-marker check consults the AST rather than scanning raw text.
      cost: >-
        A contract revision and a small Builder linter change. RC page 1 currently has no heading to
        carry the attribute, so the steward would need to supply one or the bare-paragraph form would
        remain unsupported.
      benefit: >-
        Page attribution already works today for this spelling with no parser change. The class
        becomes structured, queryable data, and it answers the reusable-mechanism question
        DEC-2026-0079 left open.

    - id: FMTOPT-3
      summary: admit the standalone form as supplied
      detail: >-
        Support {#pN .class} as a bare paragraph, which requires a parser change, most plausibly by
        reading Div attributes in pagemarkers._walk and asking the steward to use a fenced div.
      cost: >-
        The largest change. A bare paragraph cannot carry a Pandoc attribute at all, so the exact
        supplied spelling can never be made to work as an attribute; only a div or heading can. This
        option is really a request that the steward move to a fenced div plus a parser change.
      benefit: Closest to the steward's supplied spelling without requiring a visible heading.

  analyst_recommendation_on_format: >-
    FMT-01 admit as described. FMT-02 FMTOPT-2, with the linter correction made regardless of the
    format ruling. FMTOPT-2 is recommended because the heading spelling already produces correct
    page attribution with the parser exactly as it stands today, so the change is a contract and
    linter matter rather than a parser rewrite, and because it converts the steward's convention into
    the reusable no-content mechanism DEC-2026-0079 deferred. The Analyst has no stake in the
    spelling and defers entirely on the class vocabulary.

page_1_disposition:
  finding: >-
    RC printed page 1 is full-page artwork with no rules text, which the steward encoded inline as
    the attribute .full-page-artwork on the page-1 marker.
  ruling_consulted: DEC-2026-0079
  analysis: >-
    DEC-2026-0079 requires a worker who finds an uncovered printed page to consult approved Decisions
    for an exact coverage_exceptions tuple, and requires that a second confirmed no-content page
    OUTSIDE its claimed packet span be escalated before anyone builds a shared ledger. RC page 1 is
    not that case. It falls INSIDE the declared span of RC_pages_1-5.md, which makes it the PHB 108
    shape rather than the PHB 121 shape, and DEC-2026-0079 reaffirms that the PHB 108 precedent
    belongs inside its covering packet, recorded in the intake manifest.
  conclusion: >-
    No coverage escalation is owed for RC page 1 as a coverage question, and this escalation does not
    request one. It is raised here only under FMT-02, as a format question about how the steward's
    standing convention expresses the fact, not as a question about whether page 1 yields content. It
    does not. Whichever format option is chosen, the page-1 fact is recorded at claim in the packet
    manifest page_composition field, and under FMTOPT-2 it would additionally be machine-readable in
    the source.

