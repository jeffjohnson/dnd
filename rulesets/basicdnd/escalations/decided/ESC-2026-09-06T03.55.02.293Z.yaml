ontology_questions:
  preamble: >-
    These are raised because agents/analyst/INSTRUCTIONS.md requires raising architectural questions
    explicitly rather than improvising ontology, and because each one changes the shape of the first
    GUR rather than one row inside it. None can be answered by the Analyst. Each cites the packet.
  items:
    - id: ONT-01
      subject: whether basicdnd forks, inherits, or shares the adnd1e ontology
      source_evidence: >-
        The volume's own table of contents on p2 lists Appendix 2, AD&D Game Conversions, with
        subsections Why Convert, Game Differences, Converting Between the Games, Characters,
        Monsters, Magical Items, Immortals and Deities, and Measurements. The book states that
        conversion is required to move between the two games.
      question: >-
        README.md defines a ruleset as the graph and ontology shared by a compatible body of
        literature. The source itself documents that Basic D&D and AD&D are not interchangeable,
        which supports a genuinely separate ruleset. Does basicdnd receive its own constitution with
        its own section 3.1 prefix table and section 4 edge vocabulary, or does it adopt the adnd1e
        constitution by reference with a recorded delta? No inheritance or by-reference mechanism
        exists in the contracts today, so option B below would itself need one.

    - id: ONT-02
      subject: demihumans are character classes, not races
      source_evidence: >-
        p6 states that the names of the demihuman character classes sound more like race or species
        names than professions, and that because demihumans are more limited in their options than
        humans, the entire race can be represented by a single character class. The Character Classes
        and Ability Requirements table lists Dwarf, Elf and Halfling as rows in a column headed
        Character Class, alongside Cleric, Fighter, Magic-User and Thief.
      question: >-
        adnd1e section 3.1 carries both class_ and race_ prefixes on separate axes, and adnd1e has a
        character_races registry. Basic D&D collapses those axes for demihumans. Is the basicdnd
        identity class_dwarf with no race_dwarf, are both minted, and does basicdnd get a character
        race registry at all? This decides whether the first GUR proposes three class nodes or three
        class nodes plus three race nodes, and it cannot be deferred to Builder normalization.

    - id: ONT-03
      subject: one unified ability adjustment table feeding six different mechanics
      source_evidence: >-
        p10 Bonuses and Penalties for Ability Scores gives a single adjustment ladder used by every
        ability. The Abilities and Adjustments Table on the same page routes it to Attack Rolls for
        melee and unarmed, Damage Rolls for melee and thrown, Opening Doors, Languages, General
        Skills, Saving Throws vs Spells, Attack Rolls for thrown and missile, Armor Class, Hit Points
        per Experience Level, and Reactions from NPCs.
      question: >-
        adnd1e decomposes these into per-ability derived mechanics under the
        abil_<three-letter>_<rule> convention, for example abil_dex_reaction_adjustment, which
        DEC-2026-0032 established. Basic D&D has one table and many consumers. Does basicdnd mint a
        single table identity that MODIFIES each consumer, or per-ability derived identities
        mirroring adnd1e, or both? The two shapes produce materially different edge counts and
        different answers to what breaks if the table changes.
      complication: >-
        Charisma does not use the unified ladder. The separate Charisma Adjustment Table on p10
        carries three distinct outputs, Reaction Adjustment, Maximum Number of Retainers and Retainer
        Morale. Whichever shape is chosen must accommodate that asymmetry rather than assume all six
        abilities are uniform.

    - id: ONT-04
      subject: THAC0 and the attack table are two encodings of one mechanic
      source_evidence: >-
        p9 presents them under the heading Attack Rolls Tables vs THAC0 and states there are two ways
        to record the same information, one for beginning players and one for experienced players.
        THAC0 is defined as the number needed to hit armor class zero, read off the same table.
      question: >-
        This is an explicit ESCALATION_CONTRACT trigger, an edge does not fit the closed vocabulary.
        Two identities encode the same underlying relation, and neither MODIFIES, TRIGGERS nor
        CONSTRAINS the other. Are they one node with two labels, two nodes joined by an edge type
        that must be named, or one node with the alternative encoding recorded as a non-edge
        observation? The Analyst will not improvise an edge type.

    - id: ONT-05
      subject: prime requisite is a class-to-ability relation that also drives experience
      source_evidence: >-
        p6 states each character class requires prowess in one of the abilities and names these prime
        requisites. p12 Experience Bonuses and Penalties Table converts the prime requisite score
        into an experience percentage adjustment per class, and gives the elf two prime requisites
        and the halfling an either-or and an and case.
      question: >-
        Which edge type carries prime requisite, given that it is simultaneously a class requirement
        and an experience modifier, and that two classes have compound prime requisites? This cannot
        be selected before the basicdnd section 4 vocabulary is fixed by ONT-01.

    - id: ONT-06
      subject: alignment is three-point and carries a language mechanic
      source_evidence: >-
        p10 and p11 give exactly three alignments, Law, Chaos and Neutrality, and state that each
        alignment has a secret language which characters always know, which has no written form, and
        which a character forgets and replaces on changing alignment.
      question: >-
        adnd1e carries sys_alignment as a subsystem under a nine-point scheme. Separate rulesets
        cannot collide, but if basicdnd reuses adnd1e prefixes the identical stem sys_alignment would
        name a structurally different mechanic in each graph. Is that acceptable, or does the
        Architect want distinguishable stems? The alignment language is a further mechanic that may
        need its own identity.

    - id: ONT-07
      subject: retainers
      source_evidence: >-
        p10 Charisma Adjustment Table sets a maximum number of retainers and a retainer morale score,
        and the surrounding text describes hiring bodyguards and assistants.
      question: >-
        adnd1e reserves hench_ for hireling and henchman mechanics. Does basicdnd carry the same
        prefix for retainers, a differently named one, or fold them under campaign_? Prefix parity
        across rulesets is an Architect choice.

    - id: ONT-08
      subject: whether dice notation is a graph mechanic
      source_evidence: >-
        p5 Using the Dice defines the d notation, percentile reading from two ten-sided rolls, the
        coin as a d2, and the d3 as a d6 halved and rounded up.
      question: >-
        This is a reading convention that many later mechanics presuppose. Applying the core test,
        changing it would not require review of any specific target mechanic so much as of the
        notation everywhere. Is it a node, a general rule candidate, or explicitly out of scope?
        Answering it decides whether the pages 1-5 packet yields any edge at all.

local_graph_neighborhood: >-
  Empty and not merely unread. rulesets/basicdnd/canonical/ does not exist, there is no nodes.csv and
  no graph.json, so no node registry slice, local neighborhood or general rule slice can be supplied
  with a basicdnd packet. The first packet in this ruleset will have no neighborhood to compare
  candidates against, which is a normal consequence of a new ruleset but should be acknowledged in
  whatever initializes it, because agents/analyst/INSTRUCTIONS.md lists all three slices as packet
  inputs and prior adnd1e packets recorded their absence as a material gap.

affected_canonical_ids: >-
  None. No basicdnd canonical data exists and this escalation proposes no change to any adnd1e
  canonical row, registry entry, artifact or lineage. The adnd1e graph is untouched by anything
  requested here. FMT-01 and FMT-02 would change contracts/SOURCE_MARKDOWN.md, which is universal
  rather than ruleset-scoped, so a ruling there reaches adnd1e packets as well; no existing adnd1e
  packet uses either construct, so no existing packet becomes nonconforming under any option above.

options_considered:
  - id: OPT-A
    summary: initialize basicdnd as a full parallel ruleset with its own governance and schemas
    detail: >-
      Author rulesets/basicdnd/ruleset.yaml, rulesets/basicdnd/governance/constitution.md with its
      own section 3.1 prefix table and section 4 edge vocabulary, the registries books.yaml and
      sources.yaml at minimum, the canonical and escalation directory structure, and schemas/basicdnd
      with graph and registry schemas plus schemas/basicdnd/books/rc. Answer ONT-01 through ONT-08
      inside that constitution.
    cost: >-
      The largest amount of Architect authoring, and it duplicates whatever the two rulesets
      genuinely share.
    benefit: >-
      It matches the existing contracts exactly, needs no new inheritance mechanism, and lets the
      Basic D&D divergences in ONT-02, ONT-03, ONT-04 and ONT-06 be stated directly rather than as
      exceptions to a foreign document.

  - id: OPT-B
    summary: basicdnd adopts the adnd1e constitution by reference with a recorded delta
    detail: >-
      A short basicdnd constitution incorporates the adnd1e section 3.1 prefix table and section 4
      edge vocabulary by reference and records only the divergences.
    cost: >-
      No contract today defines constitution inheritance, and the Integrator reads the section 3.1
      table by parsing the pipe-table rows of a single constitution file at
      tooling/integrator/src/adnd1e_integrator/invariants.py line 57, which raises if it parses fewer
      than twenty prefixes. A by-reference constitution would fail that parser unless the mechanism
      and the parser are designed together.
    benefit: >-
      Less duplication, and prefix drift between the two rulesets becomes visible in one place.

  - id: OPT-C
    summary: do not create a ruleset; process the Rules Cyclopedia as a book under adnd1e
    detail: >-
      Move the workspace to books/adnd1e/rc/ and register rc in the adnd1e book registry.
    assessment: >-
      The Analyst does not recommend this. README.md defines a ruleset as the ontology shared by a
      COMPATIBLE body of literature, and the source volume itself devotes Appendix 2 to converting
      between the two games. Merging them would put two incompatible class ontologies, two alignment
      schemes and two ability-adjustment structures into one graph, and ONT-02 alone would make
      class_dwarf and race_dwarf contradict each other inside a single namespace. It is recorded
      because it is the only option that needs no new governance, and it should be rejected on the
      record rather than left unstated.

recommended_resolution: >-
  OPT-A, with the eight ontology questions answered in the basicdnd constitution rather than deferred
  to the first packet, and with BLK-02 and BLK-03 handled as part of the same initialization. For the
  format questions, FMT-01 admitted with manifest precedence stated, and FMT-02 resolved as FMTOPT-2
  with the linter false positive corrected regardless of the format ruling. The Analyst further
  recommends that initialization settle the source identity for this book, since claiming cannot
  proceed without a registered source_id; the adnd1e convention is <book>-legacy-unspecified for
  imported data and <book>-steward-intake for steward-supplied packets, and both of these packets are
  steward-supplied with no legacy dump behind them. The Analyst names that convention as an
  observation and does not propose an identity, because minting a source identity is a registry
  addition and is prohibited to this role.

expected_migration_impact:
  adnd1e_canonical_data_change: false
  adnd1e_registry_change: false
  adnd1e_artifact_lineage_change: none
  basicdnd_canonical_data_change: >-
    None yet. Initialization creates empty canonical structures; the first rows arrive only through
    an ordinary GUR, GUP, Review, Approved bundle and Integration cycle after this is decided.
  tooling_change_required: true
  tooling_change_detail: >-
    Two independent changes. BLK-03, the compiler ruleset gate at
    tooling/builder/src/adnd1e_builder/compiler.py line 357, admits only adnd1e and must admit the
    registered ruleset set instead; it should be sequenced before the first basicdnd GUR is published
    so the Analyst does not hand Builder an artifact the compiler must reject on identity alone.
    Separately, under FMT-02, cli.lint_source reports a malformed marker for any attribute-bearing
    heading marker even when the AST resolved the page correctly; that check should consult the
    parsed result rather than scanning raw text. Both are Builder-owned code under a Decision with
    migration_required rather than governance file edits.

governance_change_surface:
  constitution_change: >-
    Yes. A basicdnd constitution must be created; none exists. Whether it is authored in full or by
    reference is ONT-01.
  registry_change: >-
    Yes. rulesets/basicdnd/registries/ must be created, with books.yaml and sources.yaml at minimum.
    Whether a character race registry is needed is ONT-02.
  profile_change: >-
    Undetermined. adnd1e carries profiles and activation_profiles; whether basicdnd needs an
    equivalent at initialization is an Architect judgement.
  schema_change: >-
    Yes. schemas/basicdnd/ must be created, including graph/gur.schema.json, which the Analyst stable
    authority set requires and against which any basicdnd GUR must validate.
  contract_change: >-
    Yes, if FMT-01 or FMT-02 is admitted. contracts/SOURCE_MARKDOWN.md is a universal contract at
    authority level 1, above every ruleset, so amending it is a repository-wide act and its version
    would move from 1.4.

analyst_position: >-
  Both incoming files were read in full before this escalation was written, and RC_pages_6-12.md is a
  clean, dense and immediately workable first packet. Nothing in either file is the reason work has
  not started. The Analyst has not claimed either packet, has not written a packet manifest, has not
  edited books/basicdnd/rc/book.yaml, has not altered the source markdown, and has not created any
  file under rulesets/basicdnd/ or schemas/basicdnd/ other than this escalation and the pending
  directory that holds it. Each of those would require minting an identity, authoring source text, or
  writing governance, and all three are prohibited to this role. Once the ruleset is initialized,
  BLK-02 is corrected and the format questions are ruled on, claiming both packets and publishing the
  first GUR is ordinary Analyst work that needs no further escalation, with the ONT items answered.

placement_note: >-
  contracts/ESCALATION_CONTRACT.md and agents/architect/INSTRUCTIONS.md place a pending escalation at
  rulesets/<ruleset-id>/escalations/pending/. That directory did not exist for basicdnd and was
  created to hold this artifact. No other file was added under rulesets/basicdnd/. If the Architect
  considers even that directory to be governance state the Analyst should not have created, the
  escalation can be relocated; its ID is immutable across states under contracts/FILE_NAMING.md, so
  moving it costs nothing. Raising the question inside the correct namespace was judged better than
  filing it under adnd1e, which agents/analyst/INSTRUCTIONS.md forbids by requiring outputs to remain
  inside the resolved ruleset namespace. The FMT items concern a universal contract rather than
  basicdnd governance, but they arose from these packets and are kept with them rather than split
  across two escalations.
