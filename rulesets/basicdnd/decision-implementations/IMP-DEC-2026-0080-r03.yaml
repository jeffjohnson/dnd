why_this_revision: >-
  contracts/SOURCE_MARKDOWN.md was amended to version 1.6 on 2026-09-07, after
  IMP-DEC-2026-0080-r02 was published. r02 pinned that contract at
  sha256:f9455e37cd36c8c0cc08c43edfd6f32ce794e687afb65a18aa6236a638610eab and
  recorded observed_version 1.5 in both of its versioned_contract_content
  blocks, so the queue scanner reported
  `decision_implementation_invalid: IMP-DEC-2026-0080-r02 records a stale
  checksum for contracts/SOURCE_MARKDOWN.md, which now hashes to
  sha256:20eaa590b781a00298fe27e5d932784287442446067c90801175457babd830f8` and
  returned DEC-2026-0080 to the Builder queue as unimplemented.

  DEC-2026-0081's coordination_constraints classify this as ordinary strict
  mutable implementation-file and contract-evidence drift before approval, not
  a consumed-artifact integrity breach, and direct a successor report with
  current checksums, versions, anchor evidence and validation. That is what
  this revision is. It needs no new reading of DEC-2026-0080's minimum-version
  semantics: the floor stays 1.5 and the observed version is 1.6, which is what
  a minimum is for.

  Nothing about the implementation changed. All six Builder files are
  byte-identical to the values r02 recorded, the two live incoming files are
  byte-identical to the versions r02 measured, and both suites were re-run
  rather than carried forward. What changed is the contract this report was
  measured against, and every anchor the Decision requires was re-checked
  against the new bytes rather than assumed to have survived.

  This is the second time this lineage has been overtaken by an edit to a file
  it pinned but does not own. r02 already replaced an unpinned live-input claim
  with a checksummed one; the remaining exposure was a mutable Architect
  contract, which no Builder pin can hold still. That exposure is inherent to
  pinning a mutable contract by checksum and is what the versioned-contract
  minimum_version mechanism exists to bound: the floor and the anchors survive
  an amendment, and only the observed checksum has to be refreshed.
