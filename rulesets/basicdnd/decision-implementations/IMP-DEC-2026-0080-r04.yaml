    Sequence step 4 has the Analyst claim both RC packets, and a
    post-implementation requirement has the steward reissue the page-1-to-5
    input before claim. Neither is achievable while the inputs are absent. That
    is an Architect and source-steward matter; Builder neither authors nor
    restores packet source text, and this report does not attempt to.
scope_note: >-
  One Builder-owned file changed in this revision:
  tooling/builder/tests/test_pagemarkers.py, described under test_changes. The
  five other Builder implementation files are byte-identical to the values r03
  recorded, so the compiler, vocabulary, page-marker parser and CLI are
  untouched. contracts/SOURCE_MARKDOWN.md is pinned as a verified input and was
  not modified; its amendment to 1.7 is Architect work. No canonical data,
  registry, schema, worker artifact, scanner, governance file or source packet
  was changed. IMP-DEC-2026-0080-r01, r02 and r03, their validation companions
  and REV-IMP-DEC-2026-0080-r01-r01 are preserved unchanged.
adnd1e_regression_note:
  why: >-
    The compiler this Decision generalized also serves adnd1e, so a change here
    could silently alter what that ruleset accepts.
  guard: >-
    RulesetVocabularyCase.test_the_loaded_adnd1e_vocabulary_matches_the_transcription
    asserts field-by-field that the vocabulary loaded from adnd1e governance
    equals the transcribed constants on constitution_version, accepted GUR
    versions, books, node prefixes and edge types, and
    test_a_compiler_given_no_vocabulary_is_still_adnd1e asserts the default
    compiler is the AD&D 1e one.
  observed: >-
    Both pass in the focused run, and the complete Builder suite passes at 763
    tests. No compiler file changed in this revision at all.
defects_for_the_architect:
- id: dec-2026-0080-inputs-have-been-withdrawn
  detail: >-
    Both incoming packets the Decision pins are gone, so its sequence step 4 and
    its steward-reissue post-implementation requirement cannot proceed as
    written. The Builder tooling the Decision authorises is unaffected and is
    reported complete here. Whether the Decision's downstream steps are retired,
    reissued against new inputs, or left pending is an Architect ruling.
- id: exact-checksum-pins-on-unowned-contracts-keep-staling-this-lineage
  detail: >-
    This report has now been reissued three times solely because
    contracts/SOURCE_MARKDOWN.md changed (1.5, 1.6, 1.7), each time with every
    declared anchor intact and the implementation byte-identical. The
    versioned_contract_content mechanism already bounds the dependency with
    minimum_version and substantive anchors; the exact-checksum pin on a
    contract the report does not own is the part that keeps breaking. Worth a
    ruling on whether the observed checksum should be advisory when the floor
    and anchors still hold, rather than a fourth round.
- id: empty-retired-role-directory-remains
  detail: >-
    agents/dispatcher/ still exists as an empty directory after its
    INSTRUCTIONS.md was deleted under DEC-2026-0082. Git does not track empty
    directories, so it appears in no diff. Architect-owned path; purely
    cosmetic. Carried forward from the 0082 lineage for visibility.
