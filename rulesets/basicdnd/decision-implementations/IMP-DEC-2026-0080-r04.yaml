- acceptance_test_index: 4
  result: passed
  evidence: >-
    Four proofs, all in the focused command below, which contains every test
    named here. This acceptance test has always rested on these tests; the live
    readings that earlier revisions carried alongside them were supplementary,
    and they are omitted here for the reason given at the end.

    Registered admission. RegisteredRulesetCase builds a Compiler from the
    basicdnd vocabulary, the empty basicdnd registry and an empty canonical
    store and compiles a synthetic basicdnd / rc GUR:
    test_a_basicdnd_gur_is_admitted_by_its_registered_configuration asserts no
    ruleset finding, no constitution mismatch and no error;
    test_its_row_is_pending_because_the_registry_is_empty asserts the row
    travels as a pending addition with both endpoints proposed, which is what an
    empty registry must produce rather than a refusal; and
    test_the_gup_is_stamped_with_the_basicdnd_constitution asserts the emitted
    envelope carries 1.0 and basicdnd.

    Unknown-ruleset rejection, in the two forms the change separates.
    RegisteredRulesetCase.test_an_unregistered_ruleset_is_rejected asserts
    `gur_unknown_ruleset` and that the detail names what is registered;
    TestEnvelope.test_an_unregistered_ruleset_is_rejected asserts the same for
    the pre-existing `adnd2e` fixture and that it blocks the patch;
    RulesetVocabularyCase.test_loading_an_unregistered_ruleset_raises asserts
    the loader raises UnknownRuleset; and
    UnknownRulesetCliCase.test_an_unregistered_ruleset_fails_before_anything_is_read
    asserts the CLI returns 2 before the suite runs or a GUR is opened.
    test_a_registered_ruleset_this_run_did_not_load_is_rejected asserts the
    other refusal, with a detail naming `--ruleset adnd1e`.

    Frontmatter is not unattributed content. TestStewardFrontmatter asserts a
    file opening with a Pandoc YAML block has empty unattributed_text and no
    warnings, that its values are carried as informational metadata, that a
    `pages:` value attributes no prose, and that real leading content is still
    reported alongside frontmatter so admitting the block did not suppress the
    check it sits in front of.

    Marker forms. TestPageClasses asserts a fenced Div resolves its page and
    class, that the artwork page counts as a marked page so a classified page is
    not a gap, that a heading form resolves the same, that neither admitted form
    is reported malformed -- the regression the contract names by hand -- and
    that the bare paragraph form resolves no page, carries no class, is recorded
    malformed with a reason naming the fix, and is not carried into prose. An
    unknown class is recorded as unknown, a class with no `pN` identifier
    resolves to no page, and an ordinary Div still passes its content through.
    TestPageClassLint asserts the same distinction through `lint-source`.

    Live inputs, omitted. Both incoming packets DEC-2026-0080 pins in
    affected_artifacts, RC_pages_1-5.md and RC_pages_6-12.md, have been removed
    from the repository: books/basicdnd/rc/packets/incoming/ contains only
    .gitkeep, nothing is in claimed/ or completed/, and no RC GUR or GUP exists.
    There is therefore no current reading to state, and
    REV-IMP-DEC-2026-0080-r01-r01 expressly permitted the alternative -- "omit
    live-input outcome evidence that is not an acceptance requirement". Their
    absence is recorded under decision_pinned_inputs_absent and in the
    validation companion; it is not repaired here, because an incoming packet
    belongs to the source steward.
