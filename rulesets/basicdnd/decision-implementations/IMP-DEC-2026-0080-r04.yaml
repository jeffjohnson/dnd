why_this_revision: >-
  contracts/SOURCE_MARKDOWN.md moved to 1.7 after r03 was published, so r03's
  pinned checksum and observed version 1.6 went stale and the queue scanner
  reported DEC-2026-0080 as unimplemented for the third consecutive revision.
  The floor stays 1.5 and the observed version becomes 1.7, which is what a
  minimum is for; all four declared anchors were re-read from the new bytes
  rather than assumed to have survived.

  Two things are different from an ordinary re-pin. Both incoming packets the
  Decision pins have been removed from the repository since r03, so the
  supplementary live-input readings are omitted rather than restated -- there
  is nothing to read. And one Builder test had to change, described under
  test_changes.

  This lineage has now been overtaken three times by edits to a contract it
  pins but does not own, and once by the disappearance of inputs it cited.
  Omitting the live readings removes the second class of exposure entirely: the
  report no longer asserts anything about files outside Builder ownership. The
  first class remains and is an Architect question, recorded under
  defects_for_the_architect.
test_changes:
  path: tooling/builder/tests/test_pagemarkers.py
  test: TestStewardFrontmatter.test_the_live_incoming_packets_carry_frontmatter_and_no_orphan_prose
  was: >-
    The test asserted that at least one RC_pages_*.md existed in the incoming
    directory, then checked that each carried frontmatter which was not read as
    prose. Written during this Decision's original work, it was deliberately
    tolerant of the packets being reissued with different marker content -- but
    not of their being withdrawn.
  now: >-
    It skips when no incoming packet is present. Its subject is what the parser
    does with a real steward file; if there is no such file there is nothing to
    assert, and the absence is an intake state rather than a parser defect. The
    assertion that ran when the files existed is unchanged, so the coverage
    returns automatically if the steward supplies packets again.
  why_this_is_in_scope: >-
    tooling/builder/tests/test_pagemarkers.py is Builder-owned under
    DEC-2026-0080's exact_diff_ownership at sequence step 2. Without this change
    the focused suite fails at 233 tests and the complete Builder suite at 763,
    through no defect in the implementation either is testing.
