- acceptance_test_index: 4
  result: passed
  evidence: >-
    Four separate proofs, all in the focused command below (Ran 233 tests in
    45.880s OK), which contains every test named here.

    Registered admission. RegisteredRulesetCase builds a Compiler from the
    basicdnd vocabulary, the empty basicdnd registry and an empty canonical
    store, and compiles a synthetic basicdnd / rc GUR:
    test_a_basicdnd_gur_is_admitted_by_its_registered_configuration asserts no
    ruleset finding, no constitution mismatch and no error at all;
    test_its_row_is_pending_because_the_registry_is_empty asserts the row
    travels as a pending addition with both endpoints proposed, which is what an
    empty registry must produce rather than a refusal; and
    test_the_gup_is_stamped_with_the_basicdnd_constitution asserts the emitted
    envelope carries 1.0 and basicdnd.

    Unknown-ruleset rejection, in two forms the change deliberately separates.
    test_an_unregistered_ruleset_is_rejected (RegisteredRulesetCase) asserts
    `gur_unknown_ruleset` for a name no ruleset.yaml claims, and that the
    detail names what is registered; TestEnvelope.test_an_unregistered_ruleset_is_rejected
    asserts the same for the pre-existing `adnd2e` fixture and that it blocks the
    patch; RulesetVocabularyCase.test_loading_an_unregistered_ruleset_raises
    asserts RulesetVocabulary.load raises UnknownRuleset; and
    UnknownRulesetCliCase.test_an_unregistered_ruleset_fails_before_anything_is_read
    asserts `main(["compile", ..., "--ruleset", "notaruleset"])` returns 2 with
    "not a registered ruleset" on stderr, before the suite runs or a GUR is
    opened. test_a_registered_ruleset_this_run_did_not_load_is_rejected asserts
    the other refusal: an adnd1e GUR handed to a basicdnd compiler gets
    `gur_wrong_ruleset` and a detail naming `--ruleset adnd1e`.

    Frontmatter is not unattributed content. TestStewardFrontmatter asserts a
    file opening with a Pandoc YAML block has empty unattributed_text and no
    warnings; that its values are carried as informational metadata; that
    declaring `pages: 6-12` attributes no prose; that real leading content is
    still reported alongside frontmatter, so admitting the block did not
    suppress the check it sits in front of; and, against the two live
    Rules Cyclopedia incoming files, that each carries frontmatter none of which
    is read as prose.

    Marker forms. TestPageClasses asserts a fenced Div resolves page 23 and
    class full-page-artwork, that the artwork page counts as a marked page so a
    classified page is not a gap, that a heading form resolves the same,
    that neither admitted form is reported malformed -- the regression the
    contract names by hand -- and that the bare paragraph form resolves no page,
    carries no class, is recorded malformed with a reason naming the heading and
    fenced-Div fix, and is not carried into prose. An unknown class is recorded
    as unknown rather than admitted, a class with no `pN` identifier resolves to
    no page, and an ordinary Div still passes its content through.
    TestPageClassLint asserts the same distinction through `lint-source`: the Div
    form exits 0 with no PROBLEM and a note naming the page for packet.yaml
    composition metadata, the bare form exits 1 naming the fenced-Div
    correction, an unknown class exits 1, frontmatter is reported as
    informational only, and a plain-marker packet produces the pre-1.5 output
    unchanged.

    Against the real inputs rather than fixtures: `lint-source
    books/basicdnd/rc/packets/incoming/RC_pages_6-12.md` exits 0, resolving
    pages 6-12 with a frontmatter note and no problem, and RC_pages_1-5.md exits
    1 with exactly one problem naming the bare `{#p1 .full-page-artwork}`
    paragraph and the fenced-Div correction. Before this change the same file
    produced three problems, two of which were consequences of the first. The
    reissue that clears it is the source steward's, under the Decision's
    post-implementation requirements; no pipeline role authors that text and
    this report did not.
