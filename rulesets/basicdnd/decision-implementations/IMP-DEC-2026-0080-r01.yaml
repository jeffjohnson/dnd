adnd1e_regression_note:
  why: >-
    Generalizing a compiler that already compiles a live ruleset can change what
    that ruleset accepts without anyone noticing. The module constants in
    vocab.py stay the AD&D 1e transcription and keep their Decision history; the
    new RulesetVocabulary reads a ruleset's governing tables instead. If the two
    ever disagreed, adnd1e would silently start accepting or refusing different
    rows.
  guard: >-
    RulesetVocabularyCase.test_the_loaded_adnd1e_vocabulary_matches_the_transcription
    asserts field-by-field that RulesetVocabulary.load(REPO_ROOT, "adnd1e")
    equals RulesetVocabulary.for_adnd1e() on constitution_version, accepted GUR
    versions, books, node prefixes and edge types. It passes, so reading
    governance reproduces the transcription exactly.
    test_a_compiler_given_no_vocabulary_is_still_adnd1e asserts a Compiler built
    without a vocabulary is the AD&D 1e one, which is why every pre-existing
    caller and fixture is unaffected.
  observed: >-
    The whole Builder suite passes with one changed assertion, described in
    scope_note. Every other adnd1e test passes unmodified.
scope_note: >-
  Two changes fall outside a literal reading of DEC-2026-0080's exact_diff and
  are named here rather than left for a Reviewer to find.

  First, cli.py treats an absent canonical file as an empty baseline instead of
  raising FileNotFoundError. The Decision's exact_diff line for cli.py is about
  marker validation, so this is outside it. It is here because the Decision
  gives the first Basic D&D canonical state to the Integrator after the first
  approved bundle, and then has the Analyst publish GURs and the Builder compile
  them before that exists -- so without it the Decision's own step 4 could not
  run, and the failure would read as a broken repository rather than as a
  ruleset with no baseline yet. BasicdndCliCompileCase compiles a basicdnd
  packet end to end against a temporary copy and asserts no canonical file is
  created. The alternative fix would have been in duplicates.py, which the
  Decision assigns to nobody; this stays inside a Builder file.

  Second, TestEnvelope.test_wrong_ruleset_is_rejected is renamed to
  test_an_unregistered_ruleset_is_rejected and now asserts
  `gur_unknown_ruleset`. Its fixture ruleset `adnd2e` was always unregistered,
  so the refusal is unchanged; only the rule name is more specific now that
  "wrong ruleset" and "no such ruleset" are distinguishable. The test also gains
  an assertion that the finding blocks the patch, which the original did not
  check. This is inside test_compiler.py's exact_diff line but changes an
  existing test, so it is called out.

  Two message texts changed as a consequence of the vocabulary being supplied
  rather than imported. `book_illegal` no longer names PHB, DMG, UA, MM
  literally; it names the offending ruleset's own registered citation codes.
  And the revalidation warning for an older GUR constitution now states the
  general claim for any ruleset, appending the DEC-2026-0008 and DEC-2026-0011
  specifics only when the ruleset is adnd1e -- those are AD&D 1e Decisions and
  would have been a false statement about any other ruleset's version history.
  No finding changed severity and no rule name changed except the one above.
defects_for_the_architect:
  - id: impl-evidence-guard-is-adnd1e-only
    detail: >-
      tooling/common/tests/test_implementation_evidence.py resolves its store as
      REPO_ROOT / "rulesets" / "adnd1e" / "decision-implementations". This report
      is published under rulesets/basicdnd/decision-implementations/, which the
      queue scanner reads correctly (it derives the path per ruleset), so the
      report is routed -- but the guard that checks a report's evidence is
      self-consistent does not see it. This report complies with every rule that
      guard enforces regardless. Widening it is common tooling and outside this
      Decision's exact_diff, so it is reported rather than done.
  - id: basicdnd-has-no-artifact-schemas-for-reports
    detail: >-
      schemas/basicdnd/ carries graph and registry schemas but no implementation
      report schema; this artifact validates against
      schemas/common/decision-implementation.schema.json, which is the shared
      envelope every ruleset's reports use. Recorded only so the Reviewer knows
      the choice was deliberate and not a fallback after a missing file.
canonical_state: >-
  No canonical or registry file was written by this work. basicdnd has no
  canonical directory at all and this work created none: BasicdndCliCompileCase
  compiles against a temporary copy and asserts the absence afterwards. The
  adnd1e canonical files carry uncommitted working-tree changes from earlier
  integration work that predate this task and are untouched by it;
  rulesets/adnd1e/canonical/edges_master.csv is at
  sha256:e321666ea303ab65c1303bb1c120ccc8fb80a176c6dc2f45147532495dce549b. The
  only files this work changed are the six Builder files pinned above, plus this
  report and its validation artifact.
