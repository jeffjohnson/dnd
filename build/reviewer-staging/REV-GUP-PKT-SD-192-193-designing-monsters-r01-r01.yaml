reviewer_findings:
  - id: RF-01
    subject: monster_design_procedure
    disposition: approved
    refs: [M001]
    detail: >-
      The source names the Designing Monsters procedure and directs the reader
      to the named 1:1 Monsters Table for level selection. RESOLVED_BY correctly
      relates the procedure to that table.
  - id: RF-02
    subject: party_level_input
    disposition: approved
    refs: [M002]
    detail: >-
      The table's first column is average party level. Reusing character
      exp_level and directing FEEDS_INTO the table preserves the distinction
      from creature mstat_monster_level; average is an aggregation, not a new
      identity.
  - id: RF-03
    subject: table_monster_level_output
    disposition: approved
    refs: [M003]
    detail: >-
      The table maps party level to the monster level used for one monster per
      character. FEEDS_INTO from the table to mstat_monster_level correctly
      captures that output without the table's numeric values.
  - id: RF-04
    subject: attack_bonus_derivation
    disposition: approved
    refs: [M004]
    detail: >-
      The source states a monster bases its attack bonus on its relevant stat
      modifier. DERIVED_FROM runs from cbt_attack_roll to the canonical shared
      abil_stat_modifier mechanic in the correct direction.
  - id: RF-05
    subject: attack_bonus_level_ceiling
    disposition: approved
    refs: [M005]
    detail: >-
      The source says total attack bonus should rarely exceed monster level.
      This is a bounded constraint, not an absolute exclusion. The authored
      governs/read polarity correctly describes the level's role as a ceiling.
      M004 and M005 touch Attack Roll from different node pairs and assert
      derivation versus constraint, so they are distinct relationships.
  - id: RF-06
    subject: level_bands
    disposition: approved
    refs: [M006, M007]
    detail: >-
      The level bands organize treasure quality and damage by monster level.
      The dependency directions are source-supported while all treasure labels,
      damage dice, attack counts, and other numeric magnitudes stay out of the
      graph fields.
  - id: RF-07
    subject: table_identity_transliteration
    disposition: approved
    refs: [M001, M002, M003]
    detail: >-
      tbl_one_to_one_monsters is a valid readable transliteration of the source
      colon and has no ID or label collision. The exact printed label remains
      1:1 Monsters Table. The digit-based tbl_1_1_monsters alternative would
      also be syntactically possible, but there is no need to reopen extraction.
  - id: RF-08
    subject: declined_taxonomy_and_guidance
    disposition: approved_omission
    detail: >-
      Relative combat roles, stat-modifier and description advice, movement
      defaults, challenge adjectives, talent counts, party-size guidance, and
      the appended page-189 context do not add a supported in-scope dependency.
      Numeric bands are omitted except for the shared-mechanic dependency
      directions represented by M006 and M007.
