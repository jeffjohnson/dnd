reviewer_findings:
  - id: RF-01
    subject: node_routing_authority
    disposition: approved_with_revision
    refs: [monster_cyclops, monster_darkmantle, monster_deep_one]
    detail: >-
      The three identities use the approved monster_ kind and pass live duplicate
      checks, but their submitted routing_basis fields cite nonexistent
      Shadowdark DEC-2026-0003. The exact row-local corrections replace only
      that unsupported authority text with Constitution 1.8 section 2, which
      governs ordinary source-backed node proposals.
  - id: RF-02
    subject: source_named_creature_identities
    disposition: approved
    detail: >-
      The claimed page contains three distinct creature headings with complete
      stat blocks: Cyclops, Darkmantle and Deep One. Their proposed labels match
      the source headings, and their snake_case IDs are valid under the
      approved monster_ prefix. All three IDs and labels are absent from the
      473-row live node registry, which contains 42 monster-kind identities.
  - id: RF-03
    subject: stat_block_locus_and_zero_edges
    disposition: approved
    detail: >-
      Each creature identity is proposed at its own stat-block defining locus.
      Constitution 1.8 sections 2 and 2.5 exclude individual stat-block
      descriptions and values from graph content. No shared creature-family
      identity or reusable rule dependency is asserted here; the zero-edge
      result and header-only edge component are complete.
  - id: RF-04
    subject: darkness_light_source_reference_and_locus
    disposition: approved
    detail: >-
      Darkmantle's Darkness says “Extinguish all light sources in near” and
      directly names the existing canonical rule_light_source identity in the
      plural. I independently recognized this reference despite the reported
      stemmer miss. It remains correctly declined as a graph edge because its
      only occurrence is in this creature's own stat-block description, which
      Constitution 1.8 section 2.5 excludes regardless of the named target.
      The near distance is a magnitude, not an assertion.
  - id: RF-05
    subject: sunblind_and_deep_one_precedent
    disposition: approved
    detail: >-
      Sunblind's “Blinded in bright light” remains a creature-local description;
      no corresponding blinded or bright-light identity exists to attach it to.
      Deep One is correctly registered at its defining stat block. This does
      not reopen PKT-SD-194-194's Aboleth's Curse decline: that description was
      excluded on stat-block-locus grounds under section 2.5, independently of
      whether its named target had an identity then or now.
  - id: RF-06
    subject: page_attribution_and_shared_page_seam
    disposition: approved
    detail: >-
      The p203 marker is explicitly on the CYCLOPS heading, and applies to the
      three in-scope stat blocks through the end of the page. PKT-SD-200-203
      also cites page 203 for Crocodile and Cultist, but those are disjoint
      source content; shared page citation does not create duplicate coverage.
  - id: RF-07
    subject: residual_validator_authority_wording
    disposition: non_blocking_observation
    detail: >-
      The validation report contains three informational node_addition_normal_workflow
      details with stock “per DEC-2026-0003” wording. These are report prose,
      not executable GUP routing_basis values. The requested correction is
      limited to the three node-local GUP fields; the report wording is not an
      additional blocker, though the systemic compiler wording remains for its
      owner.
