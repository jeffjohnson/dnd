blocking_findings:
  - id: unsupported_routing_basis
    detail: >-
      Each proposed node currently cites DEC-2026-0003 as authority. That is not a
      Shadowdark Decision. Constitution 1.8 section 2 explicitly approves the
      monster_ prefix and kind and routes source-backed proposals through normal
      GUR/GUP/Review workflow. Apply the exact row-local routing_basis
      correction on all five proposals; retain every identity, comma-preserving
      label, locus, omission and the zero-edge plan unchanged.
    current_authority:
      path: rulesets/shadowdark/governance/constitution.md
      checksum: sha256:629e72cde3206228e1d1e569957dfff6aa275728c18ff4890c81cfcdc6e0c93d
reviewer_findings:
  - id: RF-01
    subject: node_routing_authority
    disposition: approved_with_revision
    refs:
      - monster_demon_balor
      - monster_demon_dretch
      - monster_demon_glabrezu
      - monster_demon_marilith
      - monster_demon_vrock
    detail: >-
      The five identities use the approved monster_ kind and pass live duplicate
      checks, but each submitted routing_basis cites nonexistent Shadowdark
      DEC-2026-0003. The exact row-local corrections replace only that
      unsupported authority wording with Constitution 1.8 section 2, which
      governs ordinary source-backed node proposals.
  - id: RF-02
    subject: source_named_demon_identities
    disposition: approved
    detail: >-
      The page contains five distinct creature headings and complete stat
      blocks: DEMON, BALOR; DEMON, DRETCH; DEMON, GLABREZU; DEMON, MARILITH; and
      DEMON, VROCK. The submitted labels preserve the source comma and names,
      while the IDs use the established comma-dropped snake_case transliteration.
      All five IDs and exact labels are absent from the 476-row live registry,
      which contains 45 monster-kind identities.
  - id: RF-03
    subject: family_introduction_and_taxonomy_boundary
    disposition: approved
    detail: >-
      The family introduction describes most demons as unique and says some
      lesser demons share an appearance and abilities, but it establishes no
      direct mechanical input or operative classification for a Shadowdark
      mechanic. Constitution 1.8 section 2.4 keeps taxonomy-only creature-family
      membership outside the graph absent an evidence-bearing Architect
      Decision. No family-level node or membership edge is proposed; the five
      individual identities are registered at their stat-block loci.
  - id: RF-04
    subject: stat_block_locus_and_zero_edges
    disposition: approved
    detail: >-
      Constitution 1.8 sections 2 and 2.5 exclude each individual stat-block
      description and value from graph content. All eight named ability
      occurrences, including real mechanic references and recurring shapes,
      remain local to their respective creature blocks. Recurrence does not
      change those loci or create a shared node or edge. The zero-edge result
      and header-only edge component are complete.
  - id: RF-05
    subject: crush_recurrence_shapes
    disposition: approved
    detail: >-
      Glabrezu's Crush (“DC 15 STR or target takes 1d8 damage” in the prior
      Crab, Giant block; here DC 15 STR or 2d8 damage) has the save-against-STR
      then damage shape. That differs from Bear, Brown and Bear, Polar's Crush,
      which grants an extra die when both claws hit the same target. The shared
      name is not a shared mechanic identity, and all occurrences remain
      excluded individually at their stat-block loci.
  - id: RF-06
    subject: vrock_screech_recurrence
    disposition: approved
    detail: >-
      Vrock's Screech closely paraphrases Cloaker's page-202 Screech: enemies
      in double near save against WIS or suffer disadvantage on attacks and
      checks for 1d4 rounds. The DC differs (12 here, 15 for Cloaker); range,
      effect and duration align. This recurrence does not create a shared
      general-rule identity or edge: each instance is printed under its own
      creature's stat block and remains excluded under section 2.5.
  - id: RF-07
    subject: other_named_ability_omissions
    disposition: approved
    detail: >-
      Independently checked Impervious, Grab, Hellfire, Gas, Parry and Carrion
      Mist alongside the two recurrences. Impervious does not name Magic Item;
      Grab's bound condition, Gas's blinded condition, and Carrion Mist's
      vomiting effect have no corresponding identities; Hellfire's damage and
      Parry's traded attacks are local descriptions/magnitudes. Parry does
      directly mention melee attacks and longswords, but remains excluded at
      its own stat-block locus. No edge is warranted from these occurrences.
  - id: RF-08
    subject: page_attribution
    disposition: approved
    detail: >-
      The p204 marker is on the DEMONS heading and applies to its introduction
      and the Balor, Dretch and Glabrezu blocks. The p205 marker is on the
      DEMON, MARILITH heading and persists through the Vrock block. The claimed
      two-page span and all five defining loci are consistent with these
      explicit markers.
  - id: RF-09
    subject: residual_validator_authority_wording
    disposition: non_blocking_observation
    detail: >-
      The validation report has five informational node_addition_normal_workflow
      details with stock “per DEC-2026-0003” wording. These are report prose,
      not executable GUP routing_basis values. The correction is limited to the
      five node-local GUP fields; the report wording is not an additional
      blocker, though the systemic compiler wording remains for its owner.
